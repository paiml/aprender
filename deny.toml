# cargo-deny configuration
# Deployed from paiml/infra — do not edit manually.
# Spec: docs/specifications/unified-ci-pipeline.md

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # Unmaintained transitive deps with no available fix.
    # Reviewed 2026-03-26 — all are deep transitive, no direct usage.
    { id = "RUSTSEC-2024-0384", reason = "instant: transitive via web-time, no replacement available" },
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive via simba/nalgebra/parquet, use pastey when upstream migrates" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix: transitive via indicatif, no replacement available" },
    { id = "RUSTSEC-2025-0141", reason = "bincode: transitive, widely used, no drop-in replacement" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: transitive via tabled_derive, no safe upgrade available" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: unmaintained, transitive via validator_derive; awaiting validator upstream migration" },
    # rustls-pemfile 1.x exemption removed: the reqwest 0.11 -> 0.12 bump in
    # aprender-serve dropped its last consumer, so the advisory is no longer
    # reachable and the entry was dead. Deliberately not naming the id here --
    # CI greps every RUSTSEC token out of this file, comments included, so
    # prose mentioning one silently re-exempts it.
    # atty 0.2.14 — unsound read (different from 2024-0375 unmaintained)
    # rand 0.8.6 — unmaintained, transitive only. #1980 removed the workspace's own
    # tower 0.4 pin (aprender-serve/-orchestrate now on tower 0.5, matching axum 0.7's
    # own tower 0.5 dep). The remaining rand 0.8.6 enters via the published
    # whisper-apr 0.2.8 -> realizar 0.8.6 (stale crates.io realizar; whisper feature),
    # and is potentially also reachable via axum 0.7 `ws` -> tungstenite 0.24 (axum
    # 0.7->0.8 is a large API migration), tonic 0.12 `channel` -> tower 0.4.13, and the
    # published trueno-ublk/pacha/renacer stack (block-device/registry features). Each
    # needs an upstream major bump; no safe drop-in exists yet.
    # quick-xml 0.37.5 quadratic parse of duplicate-attribute start tags (DoS, not
    # RCE). Advisory: affected ONLY via `NsReader`; aprender-orchestrate's sole use
    # (oracle/arxiv.rs) is `quick_xml::Reader`, never `NsReader`, so we do not hit
    # the vulnerable path. Patched >=0.41.0 is a 0.37->0.41 API break deferred past
    # v0.57.0; provably not-affected in the interim.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.37.5: DoS via NsReader only; orchestrate uses Reader (arxiv.rs), not the affected path. Bump to 0.41 deferred." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.37.5: NsReader namespace-alloc DoS; orchestrate uses Reader (arxiv.rs), not NsReader. Same not-affected + deferred-bump rationale as -0194." },
    # rustls-webpki 0.101.7 — transitive via aws-smithy-http-client (rustls 0.21).
    # Direct 0.103.x path already patched to >=0.103.12; 0.101.7 is pinned inside
    # the AWS SDK graph and can only move via a major SDK bump.
    # core2 0.4.0 — unmaintained, all versions yanked. Transitive via bitstream-io
    # (image/media decoding stack). Surfaced 2026-05-22 blocking ALL in-flight PRs.
    # ttf-parser 0.25.1 + rustybuzz 0.20.1 — both UNMAINTAINED-only (no CVE, no
    # patched release exists). Reviewed 2026-07-26. Both enter through the SVG
    # rendering stack only: resvg -> usvg -> {fontdb, rustybuzz} -> ttf-parser.
    # No direct usage anywhere in the workspace; nothing to bump to. Re-review if
    # a maintained fork appears or resvg migrates off them.
    # rkyv 0.7.46 — 0 paths in `cargo tree --workspace --all-features`. Enters via
    # aprender-db -> duckdb -> rust_decimal, but duckdb is optional (competitive-benchmarks)
    # and rust_decimal's own rkyv dep is optional and never enabled; Cargo.lock records it
    # anyway. Fix is rkyv >=0.8.17, unavailable: rust_decimal 1.42.1 (newest) still needs 0.7.
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
]
confidence-threshold = 0.8

# NCSA, scoped to the ONE crate that carries it rather than added to `allow`
# above. Provenance:
#
#     libfuzzer-sys (MIT OR Apache-2.0) AND NCSA
#       <- rav1e  <- ravif  <- image  <- aprender-test-lib
#
# i.e. it arrives through an AV1 encoder pulled in by `image`, not through
# anything this project chose directly. NCSA is OSI-approved and FSF Free/Libre
# and is permissive, so it is acceptable here -- but as an EXCEPTION, so that a
# future NCSA dependency arriving by some other path is still flagged for a
# decision instead of being silently admitted.
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Sibling dev-dependencies in this monorepo are DELIBERATELY path-only, with no
# `version` field:
#
#     aprender-core     -> aprender-train, aprender-profile      (dev)
#     aprender-compute  -> aprender-core, aprender-simulate, ... (dev)
#     aprender-serve    -> aprender-cuda-edge                    (dev)
#
# That is how the crates.io publish cycle is broken: `cargo publish` strips
# dev-dependencies, so a path-only dev-dep cannot create a circular version
# requirement. Giving them a `version` would reintroduce the cycle.
#
# cargo-deny reports a path dep with no version as a WILDCARD, so without this
# it flags all 10 as banned -- every one of them a deliberate, load-bearing
# choice. `wildcards = "deny"` still applies to real (non-path) dependencies,
# which is the case worth banning.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["paiml"]
