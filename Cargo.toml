[workspace]
members = [
    ".",
    "crates/aprender-core",
    # --- APR-2231: sovereign `.apr` container leaf crate ---
    "crates/apr-format",
    # --- Pre-existing aprender crates ---
    "crates/aprender-shell",
    "crates/aprender-tsp",
    "crates/aprender-monte-carlo",
    "crates/apr-cli",
    "crates/aprender-bench-tokenizer",
    "crates/aprender-bench-compute",
    # --- APR-MONO Phase 2a: was trueno (compute primitives) ---
    "crates/aprender-compute",
    "crates/aprender-gpu",
    "crates/aprender-explain",
    "crates/aprender-cuda-edge",
    "crates/aprender-ptx-debug",
    "crates/aprender-cupti",
    "crates/aprender-cbtop",
    "crates/aprender-cgp",
    "crates/aprender-quant",
    "crates/aprender-sparse",
    "crates/aprender-fft",
    "crates/aprender-solve",
    "crates/aprender-rand",
    "crates/aprender-image",
    "crates/aprender-tensor",
    "crates/aprender-gemm-codegen",
    "crates/aprender-compute-xtask",
    # --- APR-MONO Phase 2b: was provable-contracts ---
    "crates/aprender-contracts",
    "crates/aprender-contracts-macros",
    "crates/aprender-contracts-cli",
    # --- APR-MONO Phase 2c: was realizar (inference server) ---
    "crates/aprender-serve",
    # --- APR-MONO Phase 2d: was entrenar (training) ---
    "crates/aprender-train",
    "crates/aprender-train-common",
    "crates/aprender-train-lora",
    "crates/aprender-train-distill",
    "crates/aprender-train-inspect",
    "crates/aprender-train-shell",
    "crates/aprender-train-bench",
    "crates/aprender-train-wasm",
    # "crates/aprender-train-canary",  # Excluded: sqlite3/burn link conflict AND
    #   non-portable absolute `path = "/home/noah/src/trueno"` patch (breaks any
    #   checkout without that sibling — intel, clean-room, CI). Dev-only, publish=false.
    # --- APR-MONO Phase 2e: was batuta (orchestration) ---
    "crates/aprender-orchestrate",
    # --- MCP server (Model Context Protocol) ---
    "crates/aprender-mcp",
    # --- APR-MONO Phase 2f: satellite repos (main crates) ---
    "crates/aprender-profile",
    "crates/aprender-profile-core",
    "crates/aprender-verify",
    "crates/aprender-verify-ml",
    "crates/aprender-data",
    "crates/aprender-simulate",
    "crates/aprender-distribute",
    "crates/aprender-registry",
    "crates/aprender-db",
    "crates/aprender-graph",
    "crates/aprender-rag",
    "crates/aprender-rag-cli",
    "crates/aprender-viz",
    # --- APR-MONO Phase 3a: zram sub-crates (enabled) ---
    "crates/aprender-zram",
    "crates/aprender-zram-core",
    "crates/aprender-zram-adaptive",
    "crates/aprender-zram-cli",
    "crates/aprender-zram-generator",
    # --- APR-MONO Phase 3b: presentar sub-crates (enabled) ---
    "crates/aprender-present-core",
    "crates/aprender-present-terminal",
    "crates/aprender-present-widgets",
    "crates/aprender-present-layout",
    "crates/aprender-present-yaml",
    "crates/aprender-present-cli",
    "crates/aprender-present-lib",
    "crates/aprender-present-test",
    "crates/aprender-present-test-macros",
    "crates/aprender-common",
    # --- APR-MONO Phase 3c: test/probar sub-crates (enabled) ---
    "crates/aprender-test-lib",
    "crates/aprender-test-cli",
    "crates/aprender-test-derive",
    "crates/aprender-test-js-gen",
    "crates/aprender-test-showcase",
    # --- APR-MONO Phase 2g: QA playbook crates ---
    "crates/aprender-qa-gen",
    "crates/aprender-qa-runner",
    "crates/aprender-qa-report",
    "crates/aprender-qa-certify",
    "crates/aprender-qa-cli",
    # Remaining excluded (workspace root shells with no src):
    # "crates/aprender-viz-ttop",
    # "crates/aprender-present",
    # "crates/aprender-test",
]
exclude = [
    # Pulls burn 0.21 -> rusqlite 0.37 -> libsqlite3-sys 0.35, while aprender-rag
    # pins rusqlite 0.32 -> libsqlite3-sys 0.30. A `-sys` crate that links the
    # native `sqlite3` may appear only ONCE in a dependency graph, so this crate
    # cannot be a workspace member until one side moves. That is why the comment
    # below says to build it manually — the reason was never written down.
    'crates/aprender-train-canary',
    # 29,541 lines that NO cargo command has ever built. Bringing it in as a
    # member surfaced `error[E0433]: could not find visualize in renacer` — it
    # does not compile, and has not for as long as it has been invisible.
    # Excluded EXPLICITLY (it was previously neither member nor excluded, so
    # `cargo metadata` simply failed) and tracked in #2470. Its stale path dep on
    # `../../crates/trueno-zram-core` is fixed in this commit so whoever revives
    # it is not chasing a phantom.
    'crates/aprender-zram/bins/trueno-ublk',
    "tools/ccpa-sft-export",
    "fuzz",
    # Old workspace root shells (no package, just held sub-crates):
    "crates/aprender-viz-ttop",
    "crates/aprender-present",
    "crates/aprender-test",
    # aprender-train-canary is intentionally NOT a member — see the exclusion
    # note above. It is a publish=false, dev-only GPU/burn benchmark whose
    # Cargo.toml pins `[patch.crates-io] trueno = { path = "/home/noah/src/trueno" }`
    # (an absolute dev path). Including it breaks every checkout without that
    # sibling (intel, clean-room, CI). Build it manually when benchmarking.
]
resolver = "2"

[workspace.package]
version = "0.63.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/paiml/aprender"
authors = ["Noah Gift <noah@paiml.com>"]
rust-version = "1.91"
keywords = ["machine-learning", "inference", "training", "gpu", "simd"]
categories = ["science", "algorithms"]
homepage = "https://github.com/paiml/aprender"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.3"
toml = "0.8"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"

# HTTP
reqwest = { version = "0.12", default-features = false }
ureq = { version = "2.12", features = ["json"] }

# Random / testing
rand = { version = "0.9", features = ["small_rng"] }
rand_chacha = "0.9"
proptest = "1.6"
criterion = { version = "0.7", features = ["html_reports"] }
tempfile = "3.14"

# Data formats
half = { version = "2.4", default-features = false, features = ["std"] }
bytemuck = { version = "1.24", features = ["derive"] }
safetensors = "0.4"

# Parallelism
rayon = "1.10"

# System
chrono = "0.4"
dirs = "6.0"
uuid = { version = "1", features = ["v4"] }
regex = "1.11"
clap = { version = "4.5", features = ["derive"] }

# Compression
lz4_flex = "0.11"
zstd = "0.13"

# Crypto
sha2 = "0.10"

# Chat templates
minijinja = { version = "2.14", features = ["loader", "serde"] }

# Contracts
# APR-MONO self-containment: `provable-contracts` was merged in-tree as
# `crates/aprender-contracts` (lib name `provable_contracts`). Declaring it from
# crates.io compiled a SECOND copy of the contract engine alongside the in-tree
# one — exactly the duplicate-crate + publish-cycle the consolidation removed.
provable-contracts = { path = "crates/aprender-contracts", version = "0.63.0", package = "aprender-contracts" }
provable-contracts-macros = { path = "crates/aprender-contracts-macros", version = "0.63.0", package = "aprender-contracts-macros" }
aprender-contracts-macros = { path = "crates/aprender-contracts-macros", version = "0.63.0" }

# YAML
serde_yaml = "0.9"

# HF Hub
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
# HF Xet protocol: content-addressable LFS for files > 5 GiB
# (F-PUB-LFS-001, contracts/apr-publish-hf-large-file-v1.yaml)
hf-xet = "1.5.1"

# Workspace-internal crates (paths within the monorepo)
aprender-compute = { path = "crates/aprender-compute", version = "0.63.0" }
aprender-gpu = { path = "crates/aprender-gpu", version = "0.63.0" }
aprender-quant = { path = "crates/aprender-quant", version = "0.63.0" }
aprender-serve = { path = "crates/aprender-serve", version = "0.63.0" }
realizar = { path = "crates/aprender-serve", version = "0.63.0", package = "aprender-serve" }
alimentar = { path = "crates/aprender-data", version = "0.63.0", package = "aprender-data" }
pacha = { path = "crates/aprender-registry", version = "0.63.0", package = "aprender-registry" }
# APR-MONO self-containment: legacy sibling lib-name aliases -> in-monorepo crates (2026-06-12)
trueno-quant = { path = "crates/aprender-quant", version = "0.63.0", package = "aprender-quant" }
trueno-db = { path = "crates/aprender-db", version = "0.63.0", package = "aprender-db" }
trueno-viz = { path = "crates/aprender-viz", version = "0.63.0", package = "aprender-viz" }
trueno-rag = { path = "crates/aprender-rag", version = "0.63.0", package = "aprender-rag" }
trueno-cuda-edge = { path = "crates/aprender-cuda-edge", version = "0.63.0", package = "aprender-cuda-edge" }
renacer-core = { path = "crates/aprender-profile-core", version = "0.63.0", package = "aprender-profile-core" }
repartir = { path = "crates/aprender-distribute", version = "0.63.0", package = "aprender-distribute" }
simular = { path = "crates/aprender-simulate", version = "0.63.0", package = "aprender-simulate" }
probar = { path = "crates/aprender-test-lib", version = "0.63.0", package = "aprender-test-lib" }
# `jugar-probar` is the crates.io/lib name of the same in-tree crate as `probar`
# above. Both aliases resolve to ONE package; consumers that spelled it
# `jugar-probar = "0.4"|"0.5"|"1.0"` were building three extra copies.
jugar-probar = { path = "crates/aprender-test-lib", version = "0.63.0", package = "aprender-test-lib" }
# NOTE: the matching `jugar-probar-derive` alias already exists further down this
# same table (it points at crates/aprender-test-derive). crates/aprender-test-lib
# was pinning `jugar-probar-derive = "=1.0.3"` from crates.io regardless — the
# alias was sitting there unused.
aprender-train = { path = "crates/aprender-train", version = "0.63.0" }
entrenar = { path = "crates/aprender-train", version = "0.63.0", package = "aprender-train" }
aprender-train-common = { path = "crates/aprender-train-common", version = "0.63.0" }
aprender-train-distill = { path = "crates/aprender-train-distill", version = "0.63.0" }
aprender-orchestrate = { path = "crates/aprender-orchestrate", version = "0.63.0" }
aprender-contracts = { path = "crates/aprender-contracts", version = "0.63.0" }
aprender-profile = { path = "crates/aprender-profile", version = "0.63.0" }
aprender-profile-core = { path = "crates/aprender-profile-core", version = "0.63.0" }
aprender-zram-core = { path = "crates/aprender-zram-core", version = "0.63.0" }
aprender-zram-adaptive = { path = "crates/aprender-zram-adaptive", version = "0.63.0" }
aprender-zram-cli = { path = "crates/aprender-zram-cli", version = "0.63.0" }
aprender-present-core = { path = "crates/aprender-present-core", version = "0.63.0" }
aprender-present-terminal = { path = "crates/aprender-present-terminal", version = "0.63.0" }
aprender-present-widgets = { path = "crates/aprender-present-widgets", version = "0.63.0" }
aprender-present-layout = { path = "crates/aprender-present-layout", version = "0.63.0" }
aprender-present-yaml = { path = "crates/aprender-present-yaml", version = "0.63.0" }
aprender-present-test = { path = "crates/aprender-present-test", version = "0.63.0" }
aprender-db = { path = "crates/aprender-db", version = "0.63.0" }
aprender-graph = { path = "crates/aprender-graph", version = "0.63.0" }
aprender-rag = { path = "crates/aprender-rag", version = "0.63.0" }
aprender-rag-cli = { path = "crates/aprender-rag-cli", version = "0.63.0" }
aprender-qa-cli = { path = "crates/aprender-qa-cli", version = "0.63.0" }
aprender-cgp = { path = "crates/aprender-cgp", version = "0.63.0" }
aprender-contracts-cli = { path = "crates/aprender-contracts-cli", version = "0.63.0" }
aprender-data = { path = "crates/aprender-data", version = "0.63.0" }

# Additional external deps needed by sub-crates
serde_yaml_ng = "0.10"
crossterm = "0.28"
sysinfo = "0.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
image = "0.25"
base64 = "0.22"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
async-trait = "0.1"
notify = "7"
futures = "0.3"
tokio-tungstenite = "0.24"
indicatif = "0.17"
console = "0.15"

# GPU / WASM
wgpu = "27.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"
getrandom = "0.2"
wasm-bindgen-test = "0.3"

# Media / image
gif = "0.13"
png = "0.17"
mp4 = "0.14"

# HTTP middleware
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "set-header"] }
mime_guess = "2"

# Browser / WASM runtime (heavy optional deps for test framework)
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }
wasmtime = "43"
bollard = "0.17"

# Old crate name aliases (workspace = true refs in migrated sub-crates)
trueno-zram-core = { path = "crates/aprender-zram-core", version = "0.63.0", package = "aprender-zram-core" }
trueno-zram-adaptive = { path = "crates/aprender-zram-adaptive", version = "0.63.0", package = "aprender-zram-adaptive" }
trueno = { path = "crates/aprender-compute", version = "0.63.0", package = "aprender-compute" }
presentar-core = { path = "crates/aprender-present-core", version = "0.63.0", package = "aprender-present-core" }
presentar-terminal = { path = "crates/aprender-present-terminal", version = "0.63.0", package = "aprender-present-terminal" }
presentar-widgets = { path = "crates/aprender-present-widgets", version = "0.63.0", package = "aprender-present-widgets" }
presentar-layout = { path = "crates/aprender-present-layout", version = "0.63.0", package = "aprender-present-layout" }
presentar-yaml = { path = "crates/aprender-present-yaml", version = "0.63.0", package = "aprender-present-yaml" }
presentar-test = { path = "crates/aprender-present-test", version = "0.63.0", package = "aprender-present-test" }
presentar-test-macros = { path = "crates/aprender-present-test-macros", version = "0.63.0", package = "aprender-present-test-macros" }
jugar-probar-derive = { path = "crates/aprender-test-derive", version = "0.63.0", package = "aprender-test-derive" }
batuta-common = { path = "crates/aprender-common", version = "0.63.0", package = "aprender-common" }
# APR-MONO sibling aliases — MUST use workspace refs, NEVER crates.io versions.
# Hard-pinning these to crates.io creates a diamond: sub-crates pull older
# aprender versions → multiple `aprender` crates in Cargo.lock = MUDA.
renacer = { path = "crates/aprender-profile", version = "0.63.0", package = "aprender-profile" }
entrenar-lora = { path = "crates/aprender-train-lora", version = "0.63.0", package = "aprender-train-lora" }
batuta = { path = "crates/aprender-orchestrate", version = "0.63.0", package = "aprender-orchestrate" }
trueno-graph = { path = "crates/aprender-graph", version = "0.63.0", package = "aprender-graph" }

[workspace.lints.rust]
# Safety
# Note: Using "deny" (not "forbid") to allow documented unsafe in mmap module.
# See bundle-mmap-spec.md Section 4 for safety justification.
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(coverage_nightly)', 'cfg(feature, values("explainable-monitor-integration"))'] }
unsafe_op_in_unsafe_fn = "warn"

# Code Quality
unreachable_pub = "allow"  # 129+ violations in aprender-train — bulk fix planned
missing_debug_implementations = "allow"  # 128+ violations across workspace — bulk fix planned
missing_docs = "allow"  # We have doc coverage checks separately

# Best Practices
rust_2018_idioms = { level = "warn", priority = -1 }  # Lower priority to avoid conflicts
trivial_casts = "allow"  # aprender#1638 / M150 — see PMAT-ORCHESTRATE-CLIPPY-CLEANUP-001
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "allow"  # Explicit paths sometimes preferred for clarity
elided_lifetimes_in_paths = "allow"  # aprender#1638 / M150 — see PMAT-ORCHESTRATE-CLIPPY-CLEANUP-001

[workspace.lints.clippy]
# Base level
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Safety documentation: every `unsafe { ... }` block MUST carry a `// SAFETY:`
# comment stating the invariant that makes it sound (SIMD #[target_feature]
# detection + bounds/len/alignment; CUDA/FFI device & pointer contracts;
# transmute layout/lifetime). See PMAT-124/132/134/139/142/143.
#
# Enforcement model:
#   * "warn" here is the workspace-wide baseline inherited by every member crate
#     that uses `[lints] workspace = true`. Combined with the CI lint gate
#     (`cargo clippy --all-targets -- -D warnings`) this already fails the build
#     on ANY undocumented unsafe block fleet-wide.
#   * The crates fully cleared by this cluster promote it to a hard "deny" that
#     does not depend on the `-D warnings` flag:
#       - aprender (facade)   src/lib.rs + src/bin/apr.rs   #![deny(...)]  (PMAT-124)
#       - aprender-core       crates/aprender-core/src/lib.rs #![deny(...)] (PMAT-124)
#       - aprender-train      crates/aprender-train/src/{lib,main}.rs       (PMAT-132)
#       - aprender-serve      crates/aprender-serve/Cargo.toml [lints.clippy] (PMAT-134)
#       - aprender-profile    crates/aprender-profile/src/lib.rs            (PMAT-139)
#       - aprender-data       crates/aprender-data/Cargo.toml [lints.clippy] (PMAT-142)
#       - aprender-orchestrate crates/aprender-orchestrate/src/lib.rs       (PMAT-143)
#   * "warn" remains the tracked fallback for not-yet-cleared crates (e.g. the
#     aprender-compute/aprender-gpu root-src SIMD/CUDA kernels, which carry their
#     own `[lints.rust]` and are out of scope for this cluster).
undocumented_unsafe_blocks = "warn"

# Correctness (high priority)
checked_conversions = "warn"
missing_errors_doc = "allow"  # We have comprehensive error docs
missing_panics_doc = "allow"  # We document via expect() messages

# Performance
inefficient_to_string = "allow"  # Style preference - to_string() often clearer
explicit_iter_loop = "allow"  # aprender#1638 / M150 — was warn
manual_ok_or = "warn"

# Style & Clarity
explicit_deref_methods = "warn"
implicit_clone = "allow"  # aprender#1638 / M150 — was warn
inconsistent_struct_constructor = "warn"
redundant_closure_for_method_calls = "allow"  # Common pattern in iterators
unnested_or_patterns = "warn"
used_underscore_binding = "allow"  # aprender#1638 / M150 — was warn

# Allow pedantic lints that conflict with mathematical notation or ML patterns
many_single_char_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"  # Common in ML with dimension conversions
cast_possible_wrap = "allow"  # Common in ML algorithms
cast_sign_loss = "allow"  # Common in ML with usize/isize conversions
similar_names = "allow"
doc_markdown = "allow"
missing_const_for_fn = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
float_cmp = "allow"  # ML algorithms often compare floats
unreadable_literal = "allow"  # Test data often has long numeric literals
items_after_statements = "allow"  # ML algorithms often need mid-function declarations
large_stack_arrays = "allow"  # ML tests often need large data arrays
too_many_arguments = "allow"  # ML training functions often need many parameters
too_many_lines = "allow"  # ML algorithms can be long
needless_range_loop = "allow"  # Explicit indexing often clearer in ML code
assigning_clones = "allow"  # Common pattern in state reset
missing_fields_in_debug = "allow"  # Some fields intentionally omitted
derivable_impls = "allow"  # Sometimes explicit impls are clearer
uninlined_format_args = "allow"  # Format string style preference
type_complexity = "allow"  # Complex types common in ML
cloned_instead_of_copied = "allow"  # Style preference
unused_self = "allow"  # Method stubs common during development
useless_vec = "allow"  # Test data often uses vec![] for clarity
manual_div_ceil = "allow"  # (x + n - 1) / n pattern is well-understood
manual_midpoint = "allow"  # (a + b) / 2.0 is standard mathematical notation in ML
map_unwrap_or = "allow"  # .map().unwrap_or() pattern common in tests
manual_range_contains = "allow"  # Explicit comparisons often clearer
empty_line_after_doc_comments = "allow"  # provable-contracts-macros proc macro generates these

# aprender#1638 (M150 feature-flag removal in apr-cli exposed pre-existing
# lint warnings previously hidden behind `#[cfg(feature = "code")]` in
# aprender-orchestrate). Address in PMAT-ORCHESTRATE-CLIPPY-CLEANUP-001
# followup. Bulk-allow at workspace level for consistency with the existing
# pattern (see lines 320-349 for similarly-scoped pedantic allows).
case_sensitive_file_extension_comparisons = "allow"
cast_ptr_alignment = "allow"
comparison_chain = "allow"
doc_link_with_quotes = "allow"
doc_overindented_list_items = "allow"
duplicated_attributes = "allow"
fn_params_excessive_bools = "allow"
for_kv_map = "allow"
format_collect = "allow"
implicit_hasher = "allow"
manual_string_new = "allow"
map_flatten = "allow"
needless_continue = "allow"
ref_option = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
unused_async = "allow"
useless_conversion = "allow"
option_option = "allow"
wildcard_imports = "allow"
empty_line_after_outer_attr = "allow"  # provable-contracts-macros proc macro generates these
approx_constant = "allow"  # Test data uses explicit values
match_wildcard_for_single_variants = "allow"  # Future-proofs against enum changes
single_char_pattern = "allow"  # Explicit string patterns preferred
field_reassign_with_default = "allow"  # Common in test configuration
assertions_on_constants = "allow"  # Used for compile-time checks
identity_op = "allow"  # 1 * 1 * 4 shows tensor dimensions (batch * seq * features)
unnecessary_literal_unwrap = "allow"  # Test code with known Ok values
default_trait_access = "allow"  # Default::default() vs Type::default() style preference
len_zero = "allow"  # Explicit .len() > 0 sometimes clearer in ML contexts
cast_lossless = "allow"  # Explicit casts preferred in ML code
cloned_ref_to_slice_refs = "allow"  # Style preference
clone_on_copy = "allow"  # Explicit clones for clarity
default_constructed_unit_structs = "allow"  # Style preference
erasing_op = "allow"  # x * 0 patterns in test data
excessive_precision = "allow"  # ML test data needs precise values
format_push_string = "allow"  # String building style preference
if_not_else = "allow"  # Style preference
manual_contains = "allow"  # Explicit iteration sometimes clearer
manual_is_multiple_of = "allow"  # Rust 1.93 new lint — pre-existing `% N == 0` patterns in aprender-test-lib and others; bulk cleanup deferred to a focused PR
format_in_format_args = "allow"  # Rust 1.93 new lint — `format!()` inside `eprintln!()` etc. is idiomatic in debug logging
match_same_arms = "allow"  # Explicit matching for future-proofing
needless_borrows_for_generic_args = "allow"  # Style preference
needless_raw_string_hashes = "allow"  # Style preference
no_effect_underscore_binding = "allow"  # Used for documentation
overly_complex_bool_expr = "allow"  # Explicit logic sometimes clearer
stable_sort_primitive = "allow"  # Explicit sort stability
unnecessary_literal_bound = "allow"  # Style preference
unnecessary_map_or = "allow"  # Style preference
vec_init_then_push = "allow"  # Explicit initialization for clarity
nonminimal_bool = "allow"  # Complex booleans in mutation testing tests
trivially_copy_pass_by_ref = "allow"  # API consistency with &T for traits
bool_to_int_with_if = "allow"  # Explicit conversion often clearer
manual_let_else = "allow"  # Early returns common pattern
needless_pass_by_value = "allow"  # API consistency
ptr_arg = "allow"  # &PathBuf/&String in APIs for consistency
single_match_else = "allow"  # Explicit match often clearer than if let
const_is_empty = "allow"  # Compile-time empty checks for arrays
unnecessary_wraps = "allow"  # Result/Option wrappers for API consistency
ignore_without_reason = "allow"  # #[ignore] tests don't always need reasons
index_refutable_slice = "allow"  # Explicit indexing preferred in ML code
redundant_guards = "allow"  # Explicit guards for clarity in pattern matching
print_literal = "allow"  # Explicit format strings for documentation
unnecessary_debug_formatting = "allow"  # Debug formatting in tests
iter_cloned_collect = "allow"  # .iter().cloned().collect() pattern
semicolon_if_nothing_returned = "allow"  # Style preference

# ── Root package: `cargo install aprender` → `apr` binary ──
# The ML library lives in crates/aprender-core (lib name = "aprender").
# This root crate is the facade that provides `cargo install aprender`.

[package]
name = "aprender"
version = "0.63.0"
edition = "2021"
rust-version = "1.91"
authors = ["Noah Gift <noah@paiml.com>"]
license = "MIT"
description = "Next-generation ML framework in pure Rust — `cargo install aprender` for the `apr` CLI"
repository = "https://github.com/paiml/aprender"
homepage = "https://github.com/paiml/aprender"
documentation = "https://docs.rs/aprender"
keywords = ["machine-learning", "inference", "cli", "gpu", "simd"]
categories = ["command-line-utilities", "science"]
include = [
    "src/", "Cargo.toml", "README.md", "LICENSE",
    "crates/apr-cli/src/", "crates/apr-cli/Cargo.toml",
    "crates/aprender-core/src/", "crates/aprender-core/Cargo.toml",
    "crates/aprender-core/build.rs", "crates/aprender-core/build_*.rs",
    "crates/aprender-core/contracts/",
    "crates/aprender-core/README.md",
]

[[bin]]
name = "apr"
path = "src/bin/apr.rs"
required-features = ["cli"]

[dependencies]
# CLI is gated behind the `cli` feature so library consumers of `aprender`
# (e.g. apr-cookbook, downstream apps) don't pull apr-cli's heavy transitive
# dep graph (renacer/profile/inference/zram/visualization). `cargo install
# aprender` still works because `cli` is in default features. See GH-1599.
apr-cli = { path = "crates/apr-cli", version = "0.63.0", default-features = true, optional = true }
# Core ML library (lib name = "aprender")
aprender_ml = { path = "crates/aprender-core", version = "0.63.0", package = "aprender-core" }

[features]
default = ["cli"]
# Pulls in apr-cli (binary CLI implementation). Required to build the `apr`
# binary. Library-only consumers should set `default-features = false`.
cli = ["dep:apr-cli"]

# Feature passthroughs — let end users do
#   cargo install aprender --features cuda
# without knowing about the apr-cli intermediate crate.
cuda = ["cli", "apr-cli/cuda"]
cuda-batch = ["cli", "apr-cli/cuda-batch"]
wgpu = ["cli", "apr-cli/wgpu"]
inference = ["cli", "apr-cli/inference"]
training = ["cli", "apr-cli/training"]
training-gpu = ["cli", "apr-cli/training-gpu"]
visualization = ["cli", "apr-cli/visualization"]
zram = ["cli", "apr-cli/zram"]
xet = ["cli", "apr-cli/xet"]
whisper = ["cli", "apr-cli/whisper"]
# `apr ptx` (PTX analysis). Advertised in --help on every build, so the remedy
# for a default install has to exist and has to be cheap: this pulls only the
# analyzer + PTX emitter, not the CUDA/training stack that `full` implies (#2399).
ptx = ["cli", "apr-cli/trueno-explain"]
full = ["cli", "apr-cli/full"]

[lib]
name = "aprender"
path = "src/lib.rs"

# [patch.crates-io] — REMOVED
# RC4 fix: cc patch removed. The upstream fix shipped in cc 1.2.x.
# Contract: ci-infra-v1.yaml F-INFRA-004 — every patch must have tracking issue.

# ----------------------------------------------------------------------------
# proptest debug-assertion workaround (Toyota Way: root-cause flaky-test fix)
# ----------------------------------------------------------------------------
# proptest 1.11.0 (latest published) has an OVER-STRICT, buggy `debug_assert!`
# in its uniform float sampler — num/float_samplers.rs:128/131:
#     debug_assert!(self.low - result < self.intervals.step);
# The production clamp path right above it is CORRECT (its own comment: "These
# results could happen because the first split might overshoot one of the
# bounds ... but for testing data this is not a problem"). The assertion wrongly
# bounds the overshoot by the TOP-LEVEL interval step, but recursive
# `split_interval` subdivision can overshoot by more, so on rare RNG seeds the
# assert panics — surfacing as flaky failures in ANY proptest with a float-range
# strategy (`a..b` for f32/f64). There is no upstream fix (1.11.0 is newest) and
# it only fires in debug builds (which `cargo test` uses).
#
# Fix: disable debug-assertions for the proptest crate ONLY. This removes the
# false panic from 3rd-party code while keeping OUR debug_asserts fully active
# (overflow-checks left on). Verified: `PROPTEST_CASES=2000000` no longer panics.
# Profiles must live in the workspace-root manifest, so they live here.
[profile.test.package.proptest]
debug-assertions = false

[profile.dev.package.proptest]
debug-assertions = false


