[package]
name = "laya-mcp-cloud"
version = "0.1.0"
edition = "2021"
publish = false

# Spike 026: Laya behind ONE stateless pmcp `decide` tool that takes a real /v1/systemone-shaped request
# (state + typed questions), on default Lambda (`bootstrap`) or a container (`server`). Model = spike 025.
[workspace]

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
laya = { path = "../025-laya-rust-forward-parity", package = "laya-rust-forward-parity" }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
pmcp = { version = "2.19", features = ["streamable-http", "schema-generation"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }   # criteria / questions keep the caller's order
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
once_cell = "1.19"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
lambda_http = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = false
