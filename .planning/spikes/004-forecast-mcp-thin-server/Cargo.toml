[package]
name = "spike-004-forecast-mcp-thin-server"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "forecast_mcp"
path = "src/lib.rs"

[[bin]]
name = "forecast-mcp"
path = "src/main.rs"

[dependencies]
aprender = { path = "../../../crates/aprender-core", package = "aprender-core", default-features = false }
pmcp = { version = "2.19", features = ["streamable-http", "schema-generation"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
