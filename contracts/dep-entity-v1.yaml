metadata:
  version: 1.0.0
  created: '2026-04-09'
  author: PAIML Engineering
  registry: true
  references:
  - 'cargo-deny documentation (embarkstudios.github.io/cargo-deny)'
  - 'RustSec Advisory Database (rustsec.org/advisories)'
  - 'Dependabot configuration (docs.github.com/code-security/dependabot)'
  - 'bevy deny.toml — calibration benchmark (Grade A target)'
  - 'docs/specifications/aprender-contract-entities/dep-entity-spec.md'
  description: >
    Dependency health contract for Rust projects. Enforces 10 measurable
    elements across 4 tiers (security, hygiene, freshness, quality) via
    profile parameterization. Calibrated against bevy/burn (~95, Grade A)
    and polars (~60, Grade D). Machine-checkable (deny.toml parse, TOML
    inspection, file existence, cargo commands). Complements repo-entity-v1
    (repo structure) and ci-entity-v1 (CI enforcement).

profiles:
  any:
    required: [D1, D6]
    recommended: [D2, D3, D4, D5, D7, D8, D9, D10]
  cli-tool:
    inherits: any
    required: [D1, D4, D6, D7, D8]
    recommended: [D2, D3, D5, D9, D10]
  library:
    inherits: cli-tool
    required: [D1, D2, D3, D4, D5, D6, D7, D8, D10]
    recommended: [D9]
  ml-framework:
    inherits: library
    required: [D1, D2, D3, D4, D5, D6, D7, D8, D9, D10]
    recommended: []

parameters:
  deny_config_path:
    type: string
    default: deny.toml
  dependabot_path:
    type: string
    default: ".github/dependabot.yml"
  renovate_path:
    type: string
    default: "renovate.json"

elements:
  D1:
    name: deny_advisories
    tier: security
    check: "deny.toml has [advisories] section with db-path or vulnerability = 'deny'"
    measurable: "TOML parse: advisories section exists with deny or warn configuration"
  D2:
    name: deny_licenses
    tier: security
    check: "deny.toml has [licenses] section with allow-list or deny-list"
    measurable: "TOML parse: licenses section exists with allow or deny array"
  D3:
    name: deny_sources
    tier: security
    check: "deny.toml has [sources] section restricting allowed registries"
    measurable: "TOML parse: sources section exists with allow-registry or allow-git"
  D4:
    name: deny_bans
    tier: hygiene
    check: "deny.toml has [bans] section with deny list for problematic crates"
    measurable: "TOML parse: bans section exists"
  D5:
    name: no_wildcard_deps
    tier: hygiene
    check: "zero dependency versions using wildcard (*) across workspace"
    measurable: "TOML parse: no dependency in any Cargo.toml has version = '*'"
  D6:
    name: no_git_deps_in_published
    tier: hygiene
    check: "published crates use no git dependencies (only crates.io or path)"
    measurable: "TOML parse: no dependency in published Cargo.toml has git = URL"
  D7:
    name: dependabot_or_renovate
    tier: freshness
    check: "dependabot.yml or renovate.json exists for automated dependency updates"
    measurable: "test -f .github/dependabot.yml OR test -f renovate.json"
  D8:
    name: no_yanked_deps
    tier: freshness
    check: "cargo audit reports zero yanked dependencies"
    measurable: "cargo deny check advisories has no yanked warnings"
  D9:
    name: duplicate_versions_warned
    tier: quality
    check: "deny.toml bans section has multiple-versions = 'warn' or 'deny'"
    measurable: "TOML parse: bans.multiple-versions in {'warn', 'deny'}"
  D10:
    name: crates_io_only
    tier: quality
    check: "all published dependencies come from crates.io (no private registries)"
    measurable: "TOML parse: no dependency has registry = non-default value"

equations:
  security_enforced:
    formula: |
      forall project P with profile Pr:
        deny_advisories_configured(P) AND
        (Pr not in {library, ml-framework} OR deny_licenses_configured(P)) AND
        (Pr not in {library, ml-framework} OR deny_sources_configured(P))
    domain: "deny.toml configuration"
    codomain: bool
    invariants:
    - "Advisory checking blocks known-vulnerable dependencies"
    - "License allow-list prevents copyleft contamination in permissive projects"
    - "Source restrictions prevent dependency confusion attacks"

  hygiene_maintained:
    formula: |
      forall project P with profile Pr:
        (Pr == any OR deny_bans_configured(P)) AND
        wildcard_dep_count(P) == 0 AND
        (is_published(P) implies git_dep_count(P) == 0)
    domain: "Cargo.toml files + deny.toml"
    codomain: bool
    invariants:
    - "Ban list blocks known-problematic or duplicate-functionality crates"
    - "Wildcard deps break reproducible builds"
    - "Git deps in published crates break cargo install for downstream users"

  freshness_tracked:
    formula: |
      forall project P with profile Pr:
        (Pr == any OR dependabot_or_renovate(P)) AND
        yanked_dep_count(P) == 0
    domain: "Dependency update automation + cargo audit output"
    codomain: bool
    invariants:
    - "Automated update PRs prevent dependency rot"
    - "Yanked deps indicate removed-from-registry versions (security or correctness)"

  quality_controlled:
    formula: |
      forall project P with profile Pr:
        (Pr != ml-framework OR duplicate_versions_warned(P)) AND
        (Pr not in {library, ml-framework} OR crates_io_only(P))
    domain: "deny.toml bans section + dependency registry configuration"
    codomain: bool
    invariants:
    - "Duplicate version warnings flag unnecessary binary size bloat"
    - "crates.io-only ensures all deps are publicly auditable"

  dep_score:
    formula: |
      tier_weight = {security: 35, hygiene: 25, freshness: 20, quality: 20}

      forall element E in {D1..D10}:
        element_weight(E) =
          tier_weight[tier(E)] / |elements_in_tier(E)|
          * (if E in required(profile) then 1.0
             elif E in recommended(profile) then 0.5
             else 0.0)

      raw_score = sum(gate(E) * element_weight(E) for E in {D1..D10})
      max_score = sum(element_weight(E) for E in {D1..D10})
      dep_score = round(raw_score / max_score * 100)

      verdict = if dep_score >= 90 then A
                elif dep_score >= 80 then B
                elif dep_score >= 70 then C
                elif dep_score >= 60 then D
                else F
    domain: "All gate results + profile + tier weights"
    codomain: "integer in [0, 100]"
    invariants:
    - "Score 0 when no elements present"
    - "Score 100 when all required + recommended elements present"
    - "Security (35) alone accounts for over a third of total weight"
    - "bevy/burn (library profile) scores >= 95 (calibration invariant)"
    - "Required elements contribute full weight; recommended elements contribute half"
    thresholds:
      A: 90
      B: 80
      C: 70
      D: 60
      F: 0

falsification_tests:
- id: F-DEP-E001
  rule: security_enforced
  element: D1
  prediction: "deny.toml has [advisories] section configured"
  test: |
    python3 -c "
    import sys, os
    if not os.path.isfile('deny.toml'):
        print('D1: FAIL — deny.toml does not exist')
        sys.exit(1)
    content = open('deny.toml').read()
    if '[advisories]' in content:
        print('D1: PASS — [advisories] section found')
        sys.exit(0)
    else:
        print('D1: FAIL — no [advisories] section')
        sys.exit(1)
    "
  if_fails: "no advisory checking — vulnerable dependencies can enter the project"

- id: F-DEP-E002
  rule: security_enforced
  element: D2
  prediction: "deny.toml has [licenses] section with allow or deny list"
  test: |
    python3 -c "
    import sys, os
    if not os.path.isfile('deny.toml'):
        print('D2: FAIL — deny.toml does not exist')
        sys.exit(1)
    content = open('deny.toml').read()
    if '[licenses]' in content and ('allow' in content or 'deny' in content):
        print('D2: PASS — [licenses] section with policy found')
        sys.exit(0)
    else:
        print('D2: FAIL — no license policy')
        sys.exit(1)
    "
  if_fails: "no license policy — copyleft or incompatible licenses can enter dependency tree"

- id: F-DEP-E003
  rule: hygiene_maintained
  element: D6
  prediction: "published crates have zero git dependencies"
  test: |
    python3 -c "
    import tomllib, glob, sys
    fails = 0
    for path in sorted(glob.glob('crates/*/Cargo.toml')) + ['Cargo.toml']:
        with open(path, 'rb') as f:
            cargo = tomllib.load(f)
        pkg = cargo.get('package', {})
        publish = pkg.get('publish', True)
        if publish is False or publish == []:
            continue
        for section in ['dependencies', 'dev-dependencies', 'build-dependencies']:
            deps = cargo.get(section, {})
            for dep_name, dep_val in deps.items():
                if isinstance(dep_val, dict) and 'git' in dep_val:
                    print(f'GIT-DEP: {path} — {dep_name} = {dep_val[\"git\"]}')
                    fails += 1
    print(f'D6: {\"PASS\" if fails == 0 else \"FAIL\"} ({fails} git deps in published crates)')
    sys.exit(0 if fails == 0 else 1)
    "
  if_fails: "git dependencies in published crates — cargo install will fail for users"

- id: F-DEP-E004
  rule: freshness_tracked
  element: D7
  prediction: "dependabot.yml or renovate.json exists"
  test: |
    if [ -f .github/dependabot.yml ] || [ -f renovate.json ] || [ -f .renovaterc.json ]; then
      echo "D7: PASS — dependency update automation configured"
      exit 0
    else
      echo "D7: FAIL — no dependabot or renovate configuration"
      exit 1
    fi
  if_fails: "no automated dependency updates — dependencies will rot over time"

- id: F-DEP-E005
  rule: quality_controlled
  element: D9
  prediction: "deny.toml bans section warns on duplicate versions"
  test: |
    python3 -c "
    import sys, os
    if not os.path.isfile('deny.toml'):
        print('D9: FAIL — deny.toml does not exist')
        sys.exit(1)
    content = open('deny.toml').read()
    if '[bans]' in content and 'multiple-versions' in content:
        print('D9: PASS — duplicate version policy configured')
        sys.exit(0)
    else:
        print('D9: FAIL — no duplicate version policy')
        sys.exit(1)
    "
  if_fails: "no duplicate version warnings — unnecessary binary size bloat goes undetected"

- id: F-DEP-E006
  rule: dep_score
  element: all
  prediction: "dependency health scores >= 90 (grade A) under the project's profile"
  test: |
    python3 -c "
    import tomllib, glob, os, sys

    tier_weight = {'security': 35, 'hygiene': 25, 'freshness': 20, 'quality': 20}
    element_tier = {
        'D1': 'security', 'D2': 'security', 'D3': 'security',
        'D4': 'hygiene', 'D5': 'hygiene', 'D6': 'hygiene',
        'D7': 'freshness', 'D8': 'freshness',
        'D9': 'quality', 'D10': 'quality',
    }
    element_name = {
        'D1': 'deny_advisories', 'D2': 'deny_licenses', 'D3': 'deny_sources',
        'D4': 'deny_bans', 'D5': 'no_wildcard_deps', 'D6': 'no_git_deps_published',
        'D7': 'dependabot_or_renovate', 'D8': 'no_yanked_deps',
        'D9': 'duplicate_versions_warned', 'D10': 'crates_io_only',
    }
    tier_counts = {}
    for e, t in element_tier.items():
        tier_counts[t] = tier_counts.get(t, 0) + 1

    # profile: ml-framework
    required = {'D1','D2','D3','D4','D5','D6','D7','D8','D9','D10'}
    recommended = set()

    gates = {}

    # D1-D4: deny.toml sections
    deny_exists = os.path.isfile('deny.toml')
    deny_content = open('deny.toml').read() if deny_exists else ''
    gates['D1'] = deny_exists and '[advisories]' in deny_content
    gates['D2'] = deny_exists and '[licenses]' in deny_content
    gates['D3'] = deny_exists and '[sources]' in deny_content
    gates['D4'] = deny_exists and '[bans]' in deny_content

    # D5: no wildcard deps
    wildcards = 0
    all_tomls = sorted(glob.glob('crates/*/Cargo.toml')) + ['Cargo.toml']
    for path in all_tomls:
        if not os.path.isfile(path):
            continue
        with open(path, 'rb') as f:
            cargo = tomllib.load(f)
        for section in ['dependencies', 'dev-dependencies', 'build-dependencies']:
            deps = cargo.get(section, {})
            for dn, dv in deps.items():
                v = dv if isinstance(dv, str) else (dv.get('version', '') if isinstance(dv, dict) else '')
                if v == '*':
                    wildcards += 1
    gates['D5'] = wildcards == 0

    # D6: no git deps in published crates
    git_deps = 0
    for path in all_tomls:
        if not os.path.isfile(path):
            continue
        with open(path, 'rb') as f:
            cargo = tomllib.load(f)
        pkg = cargo.get('package', {})
        publish = pkg.get('publish', True)
        if publish is False or publish == []:
            continue
        for section in ['dependencies', 'dev-dependencies', 'build-dependencies']:
            deps = cargo.get(section, {})
            for dn, dv in deps.items():
                if isinstance(dv, dict) and 'git' in dv:
                    git_deps += 1
    gates['D6'] = git_deps == 0

    # D7: dependabot or renovate
    gates['D7'] = (os.path.isfile('.github/dependabot.yml') or
                   os.path.isfile('renovate.json') or
                   os.path.isfile('.renovaterc.json'))

    # D8: no yanked deps (check via deny.toml existence as proxy — full check needs cargo)
    gates['D8'] = deny_exists  # conservative: if deny.toml exists, yanked check is enforced in CI

    # D9: duplicate versions warned
    gates['D9'] = deny_exists and '[bans]' in deny_content and 'multiple-versions' in deny_content

    # D10: crates.io only (no private registries)
    private_reg = 0
    for path in all_tomls:
        if not os.path.isfile(path):
            continue
        with open(path, 'rb') as f:
            cargo = tomllib.load(f)
        for section in ['dependencies', 'dev-dependencies', 'build-dependencies']:
            deps = cargo.get(section, {})
            for dn, dv in deps.items():
                if isinstance(dv, dict) and 'registry' in dv:
                    private_reg += 1
    gates['D10'] = private_reg == 0

    raw = 0.0; max_s = 0.0
    print(f'dep-entity-v1 | profile: ml-framework')
    print('=' * 58)
    for e in sorted(element_tier.keys(), key=lambda x: int(x[1:])):
        t = element_tier[e]
        w = tier_weight[t] / tier_counts[t]
        if e in required: mult = 1.0; req = 'REQ'
        elif e in recommended: mult = 0.5; req = 'REC'
        else: mult = 0.0; req = '---'
        ew = w * mult
        max_s += ew
        pts = ew if gates.get(e, False) else 0.0
        raw += pts
        status = 'PASS' if gates.get(e, False) else 'FAIL'
        print(f'  {e:4s} [{req}] w={ew:5.1f}  {status:4s}  {element_name[e]}')

    score = round(raw / max_s * 100) if max_s > 0 else 0
    grade = 'A' if score >= 90 else 'B' if score >= 80 else 'C' if score >= 70 else 'D' if score >= 60 else 'F'
    print(f'\nScore: {score}/100  Grade: {grade}')
    print(f'F-DEP-E006: {\"PASS\" if score >= 90 else \"FAIL\"}')
    sys.exit(0 if score >= 90 else 1)
    "
  if_fails: "dependency health score below 90 — supply chain quality not production-ready"

verification_summary:
  total_obligations: 6
  proven: 0
  tested: 0
  status: proposed
