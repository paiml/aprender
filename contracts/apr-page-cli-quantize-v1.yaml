metadata:
  version: 1.0.0
  kind: schema
  description: |
    PCU (Page Content Unit) contract for book/src/cli/quantize.md (apr quantize CLI reference).
    Enforces: page exists, references the command, has a runnable example.
  references:
    - "docs/specifications/book-completeness-spec.md"

equations:
  pcu_header_present:
    formula: "file_contains(book/src/cli/quantize.md, 'PCU: cli-quantize')"
  command_mentioned:
    formula: "file_contains(book/src/cli/quantize.md, 'apr quantize')"
  example_block_present:
    formula: "file_contains_fenced(book/src/cli/quantize.md, language='bash')"

falsification_tests:
  - id: FALSIFY-PAGE-CLI-QUANTIZE-001
    name: stub_exists
    prediction: "book/src/cli/quantize.md exists on disk"
    test_harness: "test -f book/src/cli/quantize.md"
    expected_output: "exit 0"
    if_fails: "Run scripts/gen-cli-chapter-stubs.sh to regenerate."

  - id: FALSIFY-PAGE-CLI-QUANTIZE-002
    name: command_mentioned
    prediction: "page references the command at least once"
    test_harness: "grep -q 'apr quantize' book/src/cli/quantize.md"
    expected_output: "exit 0"
    if_fails: "Add a mention of `apr quantize` to the chapter."

  - id: FALSIFY-PAGE-CLI-QUANTIZE-003
    name: runnable_example
    prediction: "page has at least one ```bash code block"
    test_harness: "grep -c '^```bash' book/src/cli/quantize.md"
    expected_output: "stdout >= 1"
    if_fails: "Add a ```bash code block with a runnable example."

proof_obligations:
- type: completeness
  property: "The reference page book/src/cli/quantize.md exists on disk (FALSIFY-PAGE-CLI-QUANTIZE-001)"
  formal: "exists(book/src/cli/quantize.md)"
- type: invariant
  property: "The page references the `apr quantize` command at least once (FALSIFY-PAGE-CLI-QUANTIZE-002)"
  formal: "file_contains(book/src/cli/quantize.md, 'apr quantize')"
- type: completeness
  property: "The page contains at least one runnable bash code block (FALSIFY-PAGE-CLI-QUANTIZE-003)"
  formal: "count_fenced(book/src/cli/quantize.md, lang=bash) >= 1"
