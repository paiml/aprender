# ─────────────────────────────────────────────────────────────────────────────
# apr-model-capability-v1 — the model-capability facts, as DATA
#
# Operator, verbatim (2026-09-22): "capability.rs need deep pv SHACL support and
# exposure on all surfaces verb + transport (http/mcp/cli)".
#
# WHY THIS EXISTS. These facts live in `crates/aprender-serve/src/capability.rs`
# as Rust — and, for every NEGATIVE fact, as a COMMENT. `gpu_supported_ops()`
# inserts the eight supported ops as code; the five unsupported ones exist only
# in a comment trailing the `QkNorm` insert line. So the positive facts are data
# and the negative facts are prose attached to the wrong statement. Every
# consumer then re-derives its own copy:
#
#   #3418/#3421  quant-type dispatch duplicated across ~30 files, no single source
#   #3850        the whitelist is not on `apr qa`'s path — an unknown quant is
#                silently decoded as Q4_K
#   #3852        a refusal message enumerates `IQ*` in PROSE while the code
#                enumerates in a `match`, and the two can disagree
#   #3077        a generated doc derives these facts a second way — two
#                representations that can disagree
#   #3075        LayerNorm declared unsupported in a comment, implementation
#                wired to nothing
#
# This file is the single declaration. `capability.rs` becomes its CONSUMER.
#
# ON `kind: registry`. Measured, not assumed: `ContractKind::Registry` exists
# (`aprender-contracts/src/schema/kind.rs:57` — "a data registry (lookup tables,
# enum definitions, config"), five contracts already use it, and
# `pv validate contracts/apr-mcp-tool-inventory-v1.yaml` returns
# "0 error(s), 0 warning(s) / Contract is valid." So a fact table fits the
# existing schema and no new `kind` was minted.
#
# A NOTE ON A PRECEDENT THAT DOES NOT APPLY. `contracts/apr-verb-classification-v1.yaml`
# (#3642) is a derived fact table under `contracts/` with a bare `schema:` string
# and NO `metadata:` block. `pv validate` refuses it — "missing field `metadata`
# at line 2 column 1" — and because that is a PARSE error rather than a lint
# finding, `pv lint` over a directory containing it returns
# "1 errors ... Result: FAIL". Its derivation discipline is worth copying; its
# file shape is not.
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  version: 1.0.0
  created: '2026-09-22'
  author: apr-cli team
  kind: registry
  description: >
    The model-capability registry: the architecture → required-op mapping, the
    op → GPU-support facts with their reasons and citations, the op →
    implementing-symbol mapping with its wiring status, and the ggml quant type
    → GPU-support table with one row per type and its numeric id. Declared as
    data so that no consumer re-derives it and no negative fact lives in a
    comment.
  references:
    - crates/aprender-serve/src/capability.rs (the facts this file replaces as origin)
    - crates/aprender-serve/src/capability.rs:611 (QUANTS_GPU — the grouped prose rows, #3852's shape)
    - 'crates/aprender-serve/src/cuda/executor/layer_norm_gpu.rs (#3075: the unwired LayerNorm symbol)'
    - crates/aprender-serve/src/cuda/executor/kernel.rs:105 (gelu_host, one of two definitions)
    - crates/aprender-serve/src/cuda/executor/rope_indirect.rs:112 (gelu_host, the other)
    - 'contracts/apr-mcp-tool-inventory-v1.yaml (kind: registry, the shape this follows)'
    - 'https://github.com/ggerganov/ggml (ggml_type numeric ids)'
    - 'aprender#3075, #3077, #3418, #3421, #3850, #3852, #3853 (the symptoms this registry removes)'

name: apr-model-capability
version: 1.0.0
status: ACTIVE
scope: >
  GPU/CPU capability facts for GGUF model execution — what an architecture
  requires, what the GPU path supports, which symbol implements each op and
  whether anything calls it, and which quantisation types have a verified GPU
  kernel.
binary: apr
crate: aprender-serve

spec: >
  capability.rs is the CONSUMER of this file, not its origin. Drift between the
  two is a lint failure rather than a silent disagreement. Every fact below is
  either transcribed from the current source or marked `unestablished`; nothing
  here is inferred.

# ── the ops an architecture can require ──────────────────────────────────────
# Transcribed from `RequiredOp` (capability.rs). `gpu_supported` is transcribed
# from `gpu_supported_ops()`: the eight `ops.insert(...)` lines are `true`, and
# the five named in the trailing comment are `false` WITH the comment's own
# reason and citation, which is the point — a negative fact stops being prose.
ops:
  - op: RoPE
    gpu_supported: true
  - op: GQA
    gpu_supported: true
  - op: MHA
    gpu_supported: true
  - op: SwiGLU
    gpu_supported: true
  - op: RMSNorm
    gpu_supported: true
  - op: BiasAdd
    gpu_supported: true
  - op: CausalMask
    gpu_supported: true
  - op: QkNorm
    gpu_supported: true
    note: 'GH-280: trueno PerHeadRmsNormKernel'
  - op: GeluMlp
    gpu_supported: false
    reason: GPU uses the SwiGLU path; GELU-MLP models fall back to CPU
  - op: LayerNorm
    gpu_supported: false
    reason: GPU uses the RMSNorm path; LayerNorm models fall back to CPU
  - op: AbsolutePos
    gpu_supported: false
    reason: GPU uses RoPE; absolute-position models fall back to CPU
  - op: AttnFinalSoftcap
    gpu_supported: false
    reason: >
      CUDA forward_gpu_resident applies NO tanh attention/final-logit
      softcapping, so Gemma2/Gemma3 fall back to CPU
    citation: PMAT-824
  - op: PostAttnFfnNorm
    gpu_supported: false
    reason: >
      CUDA forward applies only the two LLaMA-style norms, not the
      four-per-block Gemma2/Gemma3 norms, so those fall back to CPU
    citation: PMAT-824

# ── op → implementing symbol, and whether anything calls it ──────────────────
# Three states, because they are three different facts and only the first can be
# believed to work:
#
#   wired         a symbol exists AND a non-test caller reaches it
#   unwired       a symbol exists and NOTHING outside tests calls it (#3075)
#   unimplemented no symbol exists
#   unestablished NOT YET MEASURED — a TODO, never a claim
#
# `unestablished` is deliberate. The first pass classified these by counting
# `grep` hits, which called `layer_norm_gpu` "wired" on a single reference that
# turned out to be a test. A count of a symbol name is not a call graph, so only
# rows verified by READING their references are stated here.
op_implementation:
  - op: LayerNorm
    symbol: Executor::layer_norm_gpu
    path: crates/aprender-serve/src/cuda/executor/layer_norm_gpu.rs
    status: unwired
    evidence: >
      Every reference is a test or a comment. Two of those comments say why:
      "layer_norm_gpu tests removed — kernel function naming issue
      (FunctionNotFound)" (tests_cov005_incremental.rs:360) and "layer_norm_gpu
      requires \"layernorm\" kernel which isn't available"
      (tests_cov017_residual.rs:323). The symbol exists; the kernel it needs does
      not. This is #3075's instance, and it is why `unwired` must be
      distinguishable from `unimplemented`.
    refs: ['#3075']
  # RETRACTED BEFORE IT SHIPPED. This row first read
  #   `symbol: Executor::gelu_host, status: unwired`
  # which was WRONG, and wrong in the specific way aprender-5e warned about an
  # hour after it was written: an op name matched to a symbol by SUBSTRING.
  # `RequiredOp::GeluMlp` is the GELU-MLP BLOCK PATH; `gelu_host`
  # (cuda/executor/kernel.rs:105) is a host-side wrapper around the GELU
  # ACTIVATION kernel — `&[f32] -> gelu_async -> &mut [f32]` — and `gelu_gpu`
  # (q4k_q8_gemv.rs:317) is the activation on-device and IS wired
  # (gpu/adapters/using.rs:409, cuda/executor/batched_q4k_gemv.rs:148). They
  # share four letters and are different things.
  #
  # 5e hit the same trap, marked the claim unverified, checked it and refuted it;
  # I hit it and did not notice until they said so. That is why `unestablished`
  # exists in this file: a contract states an implementation only when someone
  # has READ the call graph, because a wrong symbol here carries more authority
  # than a wrong comment ever did.
  - op: GeluMlp
    status: unestablished
    note: >
      Do not match this op to a symbol by name. The block path is not the
      activation kernel; see the retraction above.
  - op: SwiGLU
    symbol: Executor::batched_swiglu_into
    path: crates/aprender-serve/src/cuda/executor/residual.rs
    status: wired
  - op: RoPE
    status: unestablished
  - op: GQA
    status: unestablished
  - op: MHA
    status: unestablished
  - op: RMSNorm
    status: unestablished
  - op: BiasAdd
    status: unestablished
  - op: CausalMask
    status: unestablished
  - op: QkNorm
    status: unestablished
  - op: AbsolutePos
    status: unestablished
  - op: AttnFinalSoftcap
    status: unestablished
  - op: PostAttnFfnNorm
    status: unestablished

# ── ggml quantisation type → GPU support ─────────────────────────────────────
# ONE ROW PER TYPE, each with its numeric ggml id. `capability.rs:611`'s
# `QUANTS_GPU` groups the unsupported ones into PROSE STRINGS —
# "Q5_1 / Q8_1 / Q2_K / Q3_K / Q8_K" and "IQ2_XXS / IQ3_* / IQ4_NL / IQ4_XS" —
# carrying no type numbers at all, while `F16` beside them carries "ggml type 1".
# That is #3852's shape exactly: the message enumerates in prose while the code
# enumerates in a `match`. One row per type makes the divergence unrepresentable
# and the set machine-checkable against the `match`.
#
# `IQ3_*` in the source is a WILDCARD standing for several distinct ggml types.
# It is expanded here to the ids it covers; a wildcard is not a fact.
quant_types:
  - name: F32
    ggml_type: 0
    gpu_supported: true
  - name: F16
    ggml_type: 1
    gpu_supported: false
    reason: no GPU GEMV kernel
    refs: ['#3846', '#3850']
  - name: Q4_0
    ggml_type: 2
    gpu_supported: true
  - name: Q4_1
    ggml_type: 3
    gpu_supported: true
  - name: Q5_0
    ggml_type: 6
    gpu_supported: true
  - name: Q5_1
    ggml_type: 7
    gpu_supported: false
    reason: no GPU GEMV kernel
  - name: Q8_0
    ggml_type: 8
    gpu_supported: true
  - name: Q8_1
    ggml_type: 9
    gpu_supported: false
    reason: no GPU GEMV kernel
  - name: Q2_K
    ggml_type: 10
    gpu_supported: false
    reason: no GPU GEMV kernel
  - name: Q3_K
    ggml_type: 11
    gpu_supported: false
    reason: no GPU GEMV kernel
  - name: Q4_K
    ggml_type: 12
    gpu_supported: true
    note: the release matrix's quant
  - name: Q5_K
    ggml_type: 13
    gpu_supported: true
  - name: Q6_K
    ggml_type: 14
    gpu_supported: true
  - name: Q8_K
    ggml_type: 15
    gpu_supported: false
    reason: no GPU GEMV kernel
  - name: IQ2_XXS
    ggml_type: 16
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  - name: IQ2_XS
    ggml_type: 17
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  - name: IQ3_XXS
    ggml_type: 18
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  - name: IQ1_S
    ggml_type: 19
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  - name: IQ4_NL
    ggml_type: 20
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  - name: IQ3_S
    ggml_type: 21
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  - name: IQ2_S
    ggml_type: 22
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  - name: IQ4_XS
    ggml_type: 23
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  - name: BF16
    ggml_type: 30
    gpu_supported: false
    reason: no GPU GEMV kernel
  # IQ1_M is covered by the source's `IQ*` WILDCARD and is therefore one of the
  # types that wildcard silently stood for. Naming it is the point of the table.
  - name: IQ1_M
    ggml_type: 29
    gpu_supported: false
    reason: no GPU GEMV kernel; IQ also fails the CPU dequant path
  # The remainder are in the ggml enum but are NOT named by `QUANTS_GPU` at all.
  # They are listed because the whitelist is an ALLOWLIST: a type it does not
  # name is not supported, and #3850 is what happens when such a type is neither
  # allowed nor refused but silently decoded as Q4_K. A type absent from this
  # table is the hole; there is now no absent type.
  - name: I8
    ggml_type: 24
    gpu_supported: false
    reason: integer storage type, not a weight quantisation for inference
  - name: I16
    ggml_type: 25
    gpu_supported: false
    reason: integer storage type, not a weight quantisation for inference
  - name: I32
    ggml_type: 26
    gpu_supported: false
    reason: integer storage type, not a weight quantisation for inference
  - name: I64
    ggml_type: 27
    gpu_supported: false
    reason: integer storage type, not a weight quantisation for inference
  - name: F64
    ggml_type: 28
    gpu_supported: false
    reason: not named by the GPU whitelist
  - name: TQ1_0
    ggml_type: 34
    gpu_supported: false
    reason: not named by the GPU whitelist
  - name: TQ2_0
    ggml_type: 35
    gpu_supported: false
    reason: not named by the GPU whitelist
  - name: MXFP4
    ggml_type: 39
    gpu_supported: false
    reason: not named by the GPU whitelist
  - name: NVFP4
    ggml_type: 40
    gpu_supported: false
    reason: not named by the GPU whitelist
  - name: Q1_0
    ggml_type: 41
    gpu_supported: false
    reason: not named by the GPU whitelist
  - name: Q2_0
    ggml_type: 42
    gpu_supported: false
    reason: not named by the GPU whitelist

# ── how an architecture's required ops are derived ───────────────────────────
# Transcribed from `required_ops()` / `required_ops_for_model()`. Declared so a
# consumer can compute the same set without re-reading Rust.
op_derivation:
  positional_encoding:
    Rope: [RoPE]
    Absolute: [AbsolutePos]
    Alibi: [AbsolutePos]          # ALiBi adds bias to attention scores
    Relative: []                  # T5: handled by the attention layer
    None: []
  norm_type:
    RmsNorm: [RMSNorm]
    LayerNorm: [LayerNorm]
  mlp_type:
    SwiGlu: [SwiGLU]
    GatedMlp: [SwiGLU]
    GeluMlp: [GeluMlp]
  conditional:
    has_bias: [BiasAdd]
    has_qk_norm: [QkNorm]
  always: [CausalMask]
  per_architecture:
    softcap_postnorm: [AttnFinalSoftcap, PostAttnFfnNorm]

falsification_conditions:
  - id: FALSIFY-CAP-001
    description: >
      `gpu_supported_ops()` returns exactly the set of ops this file marks
      `gpu_supported: true`. A test reads this contract and compares the two
      sets by equality. Falsifiable: adding an op to the Rust set without adding
      it here, or vice versa, fails.
  - id: FALSIFY-CAP-002
    description: >
      Every quant type the GPU dispatch accepts appears here with
      `gpu_supported: true`, and every type it refuses appears with
      `gpu_supported: false`. Falsifiable: the #3852 divergence — a refusal
      message naming a type the `match` does not, or the reverse — fails,
      because both sides are compared against one list keyed by ggml id rather
      than against each other's prose.
  - id: FALSIFY-CAP-004
    description: >
      EXHAUSTIVE over the ggml type enum. Every variant of
      `aprender-quant::ggml_type` appears in `quant_types` with the same numeric
      id. Falsifiable: a type added upstream and pulled into the enum, but not
      declared here, fails — which is #3850's hole ("an unknown quant is
      silently decoded as Q4_K") turned into a build failure. All 35 ids were
      checked against that enum when this file was written; 0 mismatched.
  - id: FALSIFY-CAP-003
    description: >
      No `op_implementation` row may claim `wired` while every reference to its
      symbol is a test. Falsifiable by construction against #3075's LayerNorm:
      marking it `wired` fails. `unestablished` is not a claim and is exempt.

qa_gate:
  id: F-CAP-GATE
  name: model capability registry contract
  pass_criteria: >
    `pv validate contracts/apr-model-capability-v1.yaml` reports 0 errors, and
    the FALSIFY-CAP-* tests pass.
  run: pv validate contracts/apr-model-capability-v1.yaml

toyota_way_principles:
  - genchi_genbutsu: >
      Every row is transcribed from the source or marked `unestablished`. The
      `unwired` rows carry the comment that proves them — the LayerNorm tests
      were removed because the kernel is missing, which is the difference
      between "not supported" and "supported by something nothing calls".
  - jidoka: >
      A negative fact in a comment cannot stop a build. A negative fact in this
      file can.
