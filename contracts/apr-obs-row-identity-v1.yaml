metadata:
  version: 1.0.0
  kind: schema
  created: '2026-09-26'
  author: PAIML Engineering
  references:
  - 'docs/specifications/APR-OBS-001-dogfood-observability.md §2.1 — the row identity block'
  - 'docs/specifications/APR-OBS-001-dogfood-observability.md §2.2 — append discipline'
  - 'docs/specifications/APR-OBS-001-dogfood-observability.md §2.5 — GPU proof'
  - 'aprender#4487 — OBS-00: this contract and the four ledger schemas'
  - 'contracts/apr-bench-receipt-v1.yaml — same doctrine: a number is evidence only if it says which path produced it'
  description: >
    The identity block that EVERY row of every APR-OBS-001 ledger carries
    (apr-lane-row-v1, apr-serve-timing-v1, apr-perf-ledger-v1, apr-trace-v1).
    A row missing any identity field is inadmissible and counts as a MISSING row,
    never as a partial one.

    It exists because the three failures on record all read as measurements:
    a bare `apr` resolving to a 26-day-old build (§1 G11), a host label taken from
    $(hostname) that does not match the fleet name, and a GPU claim backed only by
    CUDA_VISIBLE_DEVICES. Each one yields a plausible row that describes a run
    which did not happen the way the row says.

    The ledgers are written by forjar-declared units and CI, never by apr or
    arbiter (spec §0.3, R-10). This contract states the row shape; the writers
    and the RED rules that enforce it live outside the thing they evaluate.

equations:
  identity_is_complete:
    formula: |
      REQUIRE: forall f in IDENTITY: f in row AND row[f] != null AND row[f] != "unknown"
        IDENTITY = { schema, ts, host, apr_version, apr_tag, crate_tarball_sha256,
                     binary_sha256, build_identity, model_id, model_sha256,
                     backend, request_id }
      REQUIRE: gpu_proof in row                     (key present; value per gpu_claim_is_proven)
      admissible(row) <=> all REQUIRE hold
    domain: 'one JSONL line of any APR-OBS-001 ledger'
    codomain: bool
    invariants:
    - 'Missing is RED (R-2). An inadmissible row is counted as absent, so a ledger of
       inadmissible rows is an empty ledger.'
    - '"unknown" is worse than absent, because it reads as measured.'
    - 'host is the forjar machine name, never $(hostname): lambda reports
       noah-Lambda-Vector.'
    - 'binary_sha256 is the sha256 of the binary that RAN (resolved via
       scripts/apr_bin.sh or the fleet pin), not of any binary on PATH (R-1).'
    - 'build_identity records the features READ FROM THE BINARY, not the features
       requested at build time.'
    - 'request_id is a UUIDv7 generated by the client and sent as a header, so lane
       rows and serve rows join on it (OBS-04).'

  gpu_claim_is_proven:
    formula: |
      backend = cpu                      =>  gpu_proof = null
      backend in { cuda, wgpu, metal }   =>  gpu_proof != null
      backend in { cuda, wgpu, metal } AND gpu_proof = null
                                         =>  recorded as backend_unproven, excluded from GPU series
    domain: 'the backend and gpu_proof fields of a row'
    codomain: bool
    invariants:
    - 'gpu_proof is a trace line naming the device kernel path, or a used-GPU probe
       sampled DURING the run. CUDA_VISIBLE_DEVICES, a CLI flag or a feature list
       says what was visible or requested, never what was used.'

  identity_matches_before_any_ratio:
    formula: |
      cross_host_ratio(a, b) defined  <=>  a.crate_tarball_sha256 = b.crate_tarball_sha256
                                           AND a.model_sha256 = b.model_sha256
                                           AND a.backend = b.backend
      otherwise FATAL (refused); within-host history across a mismatch is annotated
    domain: 'any comparison of two rows'
    codomain: bool
    invariants:
    - 'A ratio across mismatched identity is refused, not flagged (spec §8 S-4).'

  append_only_atomic_lines:
    formula: |
      REQUIRE: each row is one JSON object on one line
      REQUIRE: |line| <= 4096 bytes          (atomic O_APPEND)
      REQUIRE: payload > 4096 bytes  =>  side file, referenced by {path, sha256}
      REQUIRE: ledger(t2) has ledger(t1) as a byte prefix, for t1 < t2
    domain: 'a ledger file under the per-host fleet_perf_dir'
    codomain: bool
    invariants:
    - 'No ledger is ever rewritten in place; raw rows are kept forever (R-8).'

falsification_tests:
- id: FALSIFY-OBS-ID-001
  rule: a row missing any identity field is inadmissible
  prediction: 'For each field in IDENTITY, a row with that one field deleted, set to null,
    or set to "unknown" is REJECTED; the complete row is ACCEPTED.'
  test: 'NOT YET WRITTEN — lands with OBS-01 as the shared receipt lint (Rust, R-5), one case per field'
  if_fails: 'a stale or substituted binary produces a row that reads as a measurement of the release'
  mutation: 'drop model_sha256 from the IDENTITY list in the lint; the model_sha256 case must turn RED'
- id: FALSIFY-OBS-ID-002
  rule: a GPU claim needs gpu_proof
  prediction: 'A row with backend=cuda and gpu_proof=null is excluded from the GPU series as
    backend_unproven; a row with backend=cpu and a non-null gpu_proof is REJECTED.'
  test: 'NOT YET WRITTEN — lands with OBS-05 (apr-perf-ledger-v1 falsifier "GPU row without gpu_proof")'
  if_fails: 'a CPU run on a CUDA host is filed as a GPU number (the #2644 device:GPU mislabel)'
  mutation: 'accept any non-cpu backend without reading gpu_proof; the backend=cuda/null case must turn RED'
- id: FALSIFY-OBS-ID-003
  rule: no ratio across mismatched identity
  prediction: 'Two rows differing in crate_tarball_sha256, model_sha256 or backend produce
    FATAL, never a ratio.'
  test: 'NOT YET WRITTEN — lands with OBS-05/OBS-06'
  if_fails: 'a model or build change reads as a speed regression or a speed win'
  mutation: 'compare on host only; the mismatched-model case must turn RED'
- id: FALSIFY-OBS-ID-004
  rule: lines are atomic and append-only
  prediction: 'A line over 4096 bytes is REJECTED; a ledger whose earlier bytes changed
    between two reads is RED.'
  test: 'NOT YET WRITTEN — lands with OBS-01 (first writer)'
  if_fails: 'interleaved concurrent appends corrupt rows, or history is silently rewritten'
  mutation: 'raise the line bound to unbounded; the 4097-byte case must turn RED'

proof_obligations:
- type: invariant
  property: 'Every admissible row carries every identity field, non-null and not "unknown" (FALSIFY-OBS-ID-001)'
  formal: '∀ r ∈ ledger: admissible(r) <=> ∀ f ∈ IDENTITY: r[f] ∉ {absent, null, "unknown"}'
- type: invariant
  property: 'A non-cpu backend is admitted to a GPU series only with gpu_proof (FALSIFY-OBS-ID-002)'
  formal: '∀ r: r.backend ≠ cpu ∧ r ∈ gpu_series ⇒ r.gpu_proof ≠ null'
- type: soundness
  property: 'No ratio is computed across mismatched identity (FALSIFY-OBS-ID-003)'
  formal: '∀ a, b: ratio(a, b) defined ⇒ ident(a) = ident(b)'
- type: invariant
  property: 'Ledgers are append-only with atomic lines (FALSIFY-OBS-ID-004)'
  formal: '∀ t1 < t2: prefix(ledger(t1), ledger(t2)) ∧ ∀ l: |l| ≤ 4096'

verification_summary:
  total_obligations: 4
  proven: 0
  tested: 0
  status: proposed
  notes: >
    OBS-00 commits the shape only. Every falsifier above names the row that
    lands its test, and none is written yet, so tested is 0 and the count says
    so rather than leaving a reader to discover it. The ledgers' writers are
    forjar-declared (spec §0.7): the per-host fleet_perf_dir is filed as a
    paiml/infra issue, and the rows that depend on it are NotRun until it lands.

qa_gate:
  id: F-OBS-ID-GATE-001
  name: 'a ledger row is evidence only if it says what ran, where, on what'
  description: >
    The shared admission gate for every APR-OBS-001 ledger. It runs in the
    forjar/CI reader, never inside apr (R-10).
  checks:
  - identity_fields_present
  - identity_fields_not_unknown
  - gpu_claim_has_proof
  - no_ratio_across_identity
  - line_at_most_4096_bytes
  - ledger_append_only
  pass_criteria: >
    Every row read is admissible, or is counted as missing. An empty ledger is
    RED (R-2). Report-only through 0.70 (spec §4 blocking policy).
