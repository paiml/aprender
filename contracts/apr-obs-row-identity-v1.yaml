metadata:
  version: 1.0.0
  kind: schema
  created: '2026-09-27'
  author: PAIML Engineering
  references:
  - 'docs/specifications/APR-OBS-001-dogfood-observability.md §2.1 (this block), §2.2 (append discipline), §2.5 (GPU proof), §6 R-2/R-9/R-10'
  - 'aprender#4487 — OBS-00: the identity block and the ledger schemas as pv contracts'
  - 'aprender#4551 — PERF-HIST-001: apr-perf-ledger-v1 (OBS-05) references this block rather than copying it'
  - 'contracts/apr-lane-row-v1.yaml, contracts/apr-serve-timing-v1.yaml, contracts/apr-trace-v1.yaml — ledgers that embed it'
  - 'contracts/apr-bench-receipt-v1.yaml — compute_class is the path TAKEN, not the hardware present; §2.5 is the same rule'
  description: >
    The row identity block shared by every APR-OBS-001 ledger (lane, serve,
    nightly, trace). A ledger row is only evidence about apr if it says which
    binary, built how, ran which weights, on which host and backend. This
    contract owns those fields ONCE; each ledger contract names it in its
    references and adds only its own fields.

    A row missing any field is INADMISSIBLE and counts as a missing row (R-2,
    empty is RED). There is no partial credit and no defaulting: a writer that
    cannot measure a field emits an inadmissible row, it never guesses.

    Fields (every one REQUIRED; an absent key is never admissible):
      schema               ledger schema id + version, ^apr-(lane-row|serve-timing|perf-ledger|trace)-v[0-9]+$
      ts                   RFC 3339, UTC
      host                 forjar machine name (fact FLEET_HOST), never $(hostname): lambda is noah-Lambda-Vector
      apr_version, apr_tag release tag, from scripts/apr_bin.sh or the fleet pin (R-1)
      crate_tarball_sha256 ^[0-9a-f]{64}$, cross-host identity (APR-PERF-GATE-001 §4.2.2)
      binary_sha256        ^[0-9a-f]{64}$, sha256 of the resolved binary, host-local anti-substitution
      build_identity       object: rustc_vv, target_triple, features (READ FROM THE BINARY), uname_a, accelerator, driver
      model_id             weights name
      model_sha256         ^[0-9a-f]{64}$, sha256 of the GGUF
      backend              cpu | cuda | wgpu | metal | backend_unproven
      gpu_proof            trace line or used-GPU probe; null iff backend = cpu (§2.5)
      request_id           UUIDv7, client-generated, sent as a header; joins OBS-01 ↔ OBS-03 rows

    Status is proposed: OBS-00 lands the schema only. No writer exists yet, so
    every obligation is untested until the first writer row (OBS-01 lane,
    OBS-03 serve, OBS-05 nightly, OBS-09 trace) plants its falsifiers RED→GREEN
    in its own PR (spec §3).

equations:
  admissible:
    formula: |
      FIELDS = {schema, ts, host, apr_version, apr_tag, crate_tarball_sha256, binary_sha256,
                build_identity, model_id, model_sha256, backend, gpu_proof, request_id}
      admissible(r) ⇔ FIELDS ⊆ keys(r) ∧ schema_ok(r) ∧ gpu_rule(r)
      REQUIRE: ¬admissible(r) ⇒ r counts as a MISSING row
    domain: 'one JSONL line of any APR-OBS-001 ledger'
    codomain: bool
    invariants:
    - 'An absent key is never a pass (R-2). A writer that could not measure a field emits an inadmissible row, never a guessed value.'
    - 'host is the forjar name. $(hostname) differs from it on lambda, so a row using it would silently split one host into two series.'
    - 'build_identity.features is read from the binary, never from the build command line or Cargo.toml.'

  gpu_rule:
    formula: |
      backend = cpu                  ⇒ gpu_proof = null
      backend ∈ {cuda, wgpu, metal}  ⇒ gpu_proof ≠ null
      claimed GPU ∧ no proof         ⇒ backend := backend_unproven
    domain: 'the backend/gpu_proof pair of one row'
    codomain: bool
    invariants:
    - 'CUDA_VISIBLE_DEVICES, a flag, or a feature list is NOT proof. Proof is a trace line naming the device kernel path or a used-GPU probe sampled during the run (§2.5).'
    - 'backend_unproven rows are kept (R-8) and excluded from every GPU series.'

  identity_join:
    formula: |
      same_identity(a, b) ⇔ a.crate_tarball_sha256 = b.crate_tarball_sha256
                          ∧ a.model_sha256 = b.model_sha256
                          ∧ a.backend = b.backend
                          ∧ a.build_identity.features = b.build_identity.features
      cross-host ratio(a, b) ∧ ¬same_identity(a, b) ⇒ FATAL (refused)
      within-host history  ∧ ¬same_identity(a, b) ⇒ annotated, not refused
    domain: 'two rows compared by a consumer'
    codomain: 'a ratio, an annotation, or a refusal'
    invariants:
    - 'binary_sha256 is host-local and deliberately NOT in the cross-host join: one crate tarball builds different bytes per host.'

  append_discipline:
    formula: |
      one JSON object per line ∧ O_APPEND ∧ |line| ≤ 4096 bytes
      payload > 4096 bytes ⇒ side file, referenced by (path, sha256)
      REQUIRE: no ledger is ever rewritten in place
    domain: 'every write to a ledger file under the forjar-declared fleet_perf_dir'
    codomain: bool
    invariants:
    - '4096 bytes is PIPE_BUF on Linux, the size the spec (§2.2) fixes for an atomic append under concurrent writers.'

falsification_tests:
  - id: FALSIFY-OBS-ID-001
    rule: admissible
    prediction: 'a row with model_sha256 removed is inadmissible and counted as a missing row, never as a pass'
    test: 'lands with the first writer row (OBS-01: contracts/apr-lane-row-v1.yaml FALSIFY-OBS-LANE-002); NotRun{NoDeclaredExecutor} until then'
    if_fails: 'a row that cannot say which weights it measured reads as evidence'
  - id: FALSIFY-OBS-ID-002
    rule: gpu_rule
    prediction: 'a row with backend=cuda and gpu_proof=null is recorded as backend_unproven and excluded from the GPU series'
    test: 'lands with OBS-05 (aprender#4551) and OBS-03; NotRun{NoDeclaredExecutor} until then'
    if_fails: 'a CPU run reported as CUDA — the dispatch.rs:165 fabricated-regression shape'
  - id: FALSIFY-OBS-ID-003
    rule: identity_join
    prediction: 'a cross-host ratio over two rows with different crate_tarball_sha256 is refused, not computed'
    test: 'lands with OBS-05 (aprender#4551); NotRun{NoDeclaredExecutor} until then'
    if_fails: 'a ratio between two different programs is reported as a regression'
  - id: FALSIFY-OBS-ID-004
    rule: admissible
    prediction: 'a row whose host is $(hostname) (noah-Lambda-Vector) instead of the forjar name (lambda) is refused'
    test: 'lands with the first writer row; NotRun{NoDeclaredExecutor} until then'
    if_fails: 'one host appears as two series and its history halves'

proof_obligations:
  - type: invariant
    property: 'every identity field is present on every admissible row'
    formal: '∀ r ∈ ledger: admissible(r) ⇒ FIELDS ⊆ keys(r)'
    applies_to: all
  - type: invariant
    property: 'a GPU backend carries proof or is demoted'
    formal: 'r.backend ∈ {cuda, wgpu, metal} ⇒ r.gpu_proof ≠ null'
    applies_to: all
  - type: invariant
    property: 'no cross-host ratio across mismatched identity'
    formal: 'ratio(a, b) ∧ a.host ≠ b.host ⇒ same_identity(a, b)'
    applies_to: all

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: proposed
  notes: >
    OBS-00 commits the schema. No writer exists, so nothing is tested and the
    count says so. Each falsifier names the row whose PR must plant it RED→GREEN;
    none is claimed here.
