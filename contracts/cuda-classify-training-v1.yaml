metadata:
  version: "1.0.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  description: "CUDA classifier training kernels"
  references:
    - "Provable contract for cuda-classify-training-v1"

name: cuda-classify-training
version: "1.0.0"
scope: "crates/aprender-train/src/finetune/classify_pipeline/"

description: |
  CUDA kernels for SSC classifier training: forward (linear+softmax), backward (cross-entropy), optimizer (AdamW).

equations:
  forward_parity:
    description: "CUDA forward matches CPU within ε"
    formula: "CUDA forward matches CPU within ε"

  backward_parity:
    description: "CUDA gradients match CPU within ε"
    formula: "CUDA gradients match CPU within ε"

falsification:
  - id: FALSIFY-CUDA_CLASSIFY_TRAINING_V1_001
    description: "CUDA forward matches CPU within ε"
    test: "Related tests in crates/aprender-train/src/finetune/classify_pipeline/"
    evidence: "cargo test --lib"

  - id: FALSIFY-CUDA_CLASSIFY_TRAINING_V1_002
    description: "CUDA gradients match CPU within ε"
    test: "Related tests in crates/aprender-train/src/finetune/classify_pipeline/"
    evidence: "cargo test --lib"

# #7235: falsification tests bound to CI-run tests. The CUDA kernels need a GPU and are not
# CI evidence; these bind the CPU reference path of the same math (forward softmax, gradients).
falsification_tests:
  - id: FALSIFY-CUDA_CLASSIFY_TRAINING_V1_001
    rule: "classifier forward (linear + softmax) is a valid distribution: probabilities in [0,1] summing to 1 within 1e-5, finite loss; CPU reference only, the CUDA-vs-CPU epsilon parity claim is GPU-only and not covered here"
    prediction: "test_cov4_forward_only_with_probs_classes fails if the forward softmax is not normalised"
    test: "cargo test -p aprender-train --lib test_cov4_forward_only_with_probs_classes"
  - id: FALSIFY-CUDA_CLASSIFY_TRAINING_V1_002
    rule: "classifier gradients (cross-entropy backward + AdamW step) drive the loss down over 20 accumulation epochs; CPU reference only, the CUDA gradient parity claim is GPU-only and not covered here"
    prediction: "test_ssc025_accumulate_gradients_convergence fails if gradients are wrong in sign or scale"
    test: "cargo test -p aprender-train --lib test_ssc025_accumulate_gradients_convergence"
