equations:
  rope_frequency_scaling:
    formula: |
      llama.cpp canonical flags:
        --rope-freq-scale S      # linear scaling: theta_i *= S (S < 1 extends context)
        --rope-freq-base B       # base theta (default 10000.0)
        --ctx-size N             # target context length (tokens)
        Reference: https://github.com/ggerganov/llama.cpp/blob/master/examples/main/README.md#context-size-and-rope-settings
      apr parity target:
        apr run <model> --rope-freq-scale S --rope-freq-base B --ctx-size N
        HTTP: {"options":{"rope_freq_scale":S,"rope_freq_base":B,"num_ctx":N}}
      RoPE rotation angle at position p, dimension 2i:
        theta_i = B^(-2i/d_head)
        angle(p, i) = p * theta_i * S        # with freq_scale S
      To extend context from C_train to C_target:
        S <= C_train / C_target              # linear scaling heuristic
    domain: "(rope_freq_scale: f32, rope_freq_base: f32, num_ctx: u32)"
    codomain: "rotary_embedding_angles: Tensor"
    invariants:
    - "S == 1.0 and B == model_default reproduces baseline RoPE (bit-exact)"
    - "S < 1.0 extends effective context window (positions scale by S)"
    - "num_ctx > model_trained_ctx REQUIRES S < 1.0 or NTK-aware variant; else output degenerates"
    - "At num_ctx <= model_trained_ctx with S=1, perplexity is within 1% of baseline"
    - "Reference: https://github.com/ggerganov/llama.cpp/pull/2054 (RoPE scaling implementation)"

  rope_scale_coherence_long_context:
    formula: |
      With S = C_train / C_target (linear), a prompt of ~C_train tokens + retrieval
      question MUST yield a coherent answer. Concretely:
        let prompt be a recitation of 3000 tokens ending with "The magic word is FOOBAR."
        followed by "What is the magic word?"
        With proper S, response contains "FOOBAR" (case-insensitive).
        With S=1.0 and ctx > train_ctx, response is garbage (does not contain FOOBAR).
    domain: "(long_prompt, rope_freq_scale)"
    codomain: bool
    invariants:
    - "Correctly-scaled RoPE recovers the needle from a haystack at 2x train context"
    - "Misconfigured RoPE (S=1 when ctx>train_ctx) produces degenerate output"

falsification_tests:
- id: FALSIFY-CRUX-C-26-001
  rule: rope_freq_scale=1.0 is a no-op on in-context prompts
  prediction: "Output with --rope-freq-scale 1.0 equals output with flag omitted at temperature=0"
  test: |
    # Reference: https://github.com/ggerganov/llama.cpp/blob/master/examples/main/README.md
    A=$(apr run hf://Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF \
      --rope-freq-scale 1.0 --prompt "2+2=" --max-tokens 4 --temperature 0 2>/dev/null)
    B=$(apr run hf://Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF \
      --prompt "2+2=" --max-tokens 4 --temperature 0 2>/dev/null)
    [ "$A" = "$B" ] \
      || { echo "FAIL: rope_freq_scale=1.0 changed output A=$A B=$B" >&2; exit 1; }
  if_fails: "rope_freq_scale=1.0 not a no-op — RoPE transform is applied when S=1"

- id: FALSIFY-CRUX-C-26-002
  rule: extended context with proper RoPE scale answers needle question
  prediction: "With S <= train_ctx/target_ctx, model answers needle at 2x train context"
  test: |
    # Synthesize ~3000-token needle prompt (Qwen2.5 trained at 32k, so use 2x=64k would exceed;
    # instead target model with smaller train ctx like 1.5B at 4096 train → 8192 test S=0.5).
    # For a 1.5B Qwen model trained at 32k, this test asserts the CLI plumbing, not a stress test.
    python3 -c "print('The needle is FOOBAR42. ' + 'filler. '*400 + 'What is the needle?')" > /tmp/crux-c-26-needle.txt
    OUT=$(apr run hf://Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF \
      --rope-freq-scale 0.5 --ctx-size 8192 \
      --prompt-file /tmp/crux-c-26-needle.txt \
      --max-tokens 24 --temperature 0 2>/dev/null) \
      || { echo "FAIL: apr run exited non-zero with rope-freq-scale" >&2; exit 1; }
    echo "$OUT" | grep -qi 'FOOBAR42' \
      || { echo "FAIL: needle not recovered from extended context: $OUT" >&2; exit 1; }
  if_fails: "apr does not correctly apply RoPE scaling for context extension (needle not retrieved)"

- id: FALSIFY-CRUX-C-26-003
  rule: invalid rope_freq_scale rejected
  prediction: "rope_freq_scale <= 0 or non-finite produces non-zero exit"
  test: |
    if apr run hf://Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF \
        --rope-freq-scale 0 --prompt hi --max-tokens 4 2>/tmp/crux-c-26-err.log; then
      echo "FAIL: accepted rope_freq_scale=0" >&2; exit 1
    fi
    if apr run hf://Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF \
        --rope-freq-scale -1.0 --prompt hi --max-tokens 4 2>>/tmp/crux-c-26-err.log; then
      echo "FAIL: accepted rope_freq_scale=-1" >&2; exit 1
    fi
  if_fails: "apr accepted non-positive rope_freq_scale"

