metadata:
  version: "1.0.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  description: "RAG context generation"
  references:
    - "Provable contract for context-generation-v1"

name: context-generation
version: "1.0.0"
scope: "crates/aprender-rag/src/"

description: |
  Retrieval-augmented generation: query → retrieve → rank → generate context window.

equations:
  relevance_ordering:
    description: "retrieved docs sorted by descending relevance score"
    formula: "retrieved docs sorted by descending relevance score"

  context_budget:
    description: "total tokens ≤ max_context_length"
    formula: "total tokens ≤ max_context_length"

falsification:
  - id: FALSIFY-CONTEXT_GENERATION_V1_001
    description: "retrieved docs sorted by descending relevance score"
    test: "Related tests in crates/aprender-rag/src/"
    evidence: "cargo test --lib"

  - id: FALSIFY-CONTEXT_GENERATION_V1_002
    description: "total tokens ≤ max_context_length"
    test: "Related tests in crates/aprender-rag/src/"
    evidence: "cargo test --lib"

falsification_tests:
  - id: FALSIFY-CTXGEN-001
    rule: "selected docs are ordered by descending relevance score"
    prediction: "lambda_one_yields_relevance_descending fails when the order is not descending"
    test: "cargo test -p aprender-rag --lib lambda_one_yields_relevance_descending"
  - id: FALSIFY-CTXGEN-002
    rule: "assembled context respects the token budget"
    prediction: "test_context_assembler_max_tokens fails when chunks exceed the budget"
    test: "cargo test -p aprender-rag --lib test_context_assembler_max_tokens"
  - id: FALSIFY-CTXGEN-003
    rule: "assembly keeps results in rank order under a budget that fits"
    prediction: "test_context_assembler_sequential fails when chunks are dropped or reordered"
    test: "cargo test -p aprender-rag --lib test_context_assembler_sequential"
