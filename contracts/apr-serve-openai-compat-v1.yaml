contract: apr-serve-openai-compat
metadata:
  kind: pattern
  version: "1.17.0"
  description: >
    OpenAI-compatible serve layer (/v1/chat/completions, /v1/completions,
    /v1/embeddings) fidelity invariants. Established by an adversarial audit
    (2026-06-14) that found 12 confirmed real bugs — see
    evidence/serve-api-openai-fidelity-audit-2026-06-14/findings.md. This contract
    is the home for those obligations; they discharge as the follow-up fixes land.
    PMAT-753 discharges the SSE-framing obligation: the streaming handler must pass
    a BARE JSON payload (or "[DONE]") to axum's Event::data(), NOT a string already
    prefixed with "data: " — axum's Sse adds the `data: ` field + `\n\n` terminator
    itself, so a manual prefix produced a DOUBLE `data: data: {json}` on the wire and
    broke JSON.parse for every spec-compliant SSE client. The correct form is used by
    openai_handlers.rs. PMAT-803 (this revision, 1.8.0) discharges the
    EMBEDDINGS-MODEL-BACKED obligation: /v1/embeddings must return REAL model-backed
    embeddings (mean-pooled final-layer hidden state, dim == model hidden_size, then
    L2-normalize), NOT a silent positional token-ID hash that has no semantic
    structure. PMAT-802 × PMAT-803 (this revision, 1.9.0) adds the
    EMBEDDINGS-BATCH-INPUT obligation: /v1/embeddings accepts `input` as a single
    string OR an array of strings (OpenAI contract) and returns one embedding per
    input in request order (data[i].index == i) — AND each batch element is embedded
    via the SAME real model-backed path as the single-input form (forward_hidden →
    mean-pool → hidden_size dim → L2-norm), never the old token-ID hash. So a batch of
    N inputs yields N real model-backed embeddings.
  references:
  - "crates/aprender-serve/src/api/chat_completions_stream.rs (fixed)"
  - "crates/aprender-serve/src/api/openai_handlers.rs (correct SSE-framing reference)"
  - "crates/aprender-serve/src/api/realize_handlers_embed_completion.rs (PMAT-803: real embeddings)"
  - "crates/aprender-serve/src/layers/model_model.rs (PMAT-803: Model::forward_hidden — pre-lm_head hidden state)"
  - "evidence/serve-api-openai-fidelity-audit-2026-06-14/findings.md (full 12-bug audit)"
version: 1
status: enforced
date: 2026-06-14

proof_obligations:
  - type: invariant
    property: >
      SSE-FRAMING (PMAT-753, DISCHARGED): the streaming chat handler passes a bare JSON
      chunk (or the literal "[DONE]") to Event::default().data(); it never manually
      prepends "data: " or appends a newline (axum's Sse adds the field framing). So each
      streamed event's data is parseable JSON, never the literal "data: {...}".
  - type: invariant
    property: >
      STOP-APPLIED (DISCHARGED for NON-STREAMING — PMAT-754/755/756): every NON-STREAMING
      completion AND chat backend applies the request's stop sequences (post-decode
      truncation at the EARLIEST stop position) via the shared truncate_at_stop() helper, so
      the returned (non-streamed) text never contains a stop string. /v1/completions:
      try_cached_completions, try_quantized_completions (PMAT-754), try_gpu_completions,
      try_apr_q4k_completions (PMAT-755). /v1/chat/completions: build_chat_response runs
      finalize_chat_text() across ALL 7 build_chat_response call sites
      (gpu/quantized/cached/q4k/qwen3_moe/registry), AND the inline try_safetensors_cuda_backend
      builder (which bypasses build_chat_response) also calls finalize_chat_text — together
      with finish_reason="stop" when a stop string truncated (precedence over "length")
      (PMAT-756).
      STREAMING (PRE-GENERATED paths DISCHARGED — PMAT-758/759): chat_completions_stream.rs
      (PMAT-758) AND pregenerated_sse_response (PMAT-759, the cuda/gpu/cached chat streaming
      backends + registry fallback) now apply stop via streaming_text_deltas(). STILL OPEN:
      true_streaming_sse_response (the live mpsc-channel path) — needs incremental cross-token
      stop detection; tracked follow-up.
      Residual nicety (DISCHARGED — PMAT-761): try_cuda_gguf_completions previously truncated
      at the first-LISTED stop via an inline loop, not the earliest-POSITION one; it now uses
      the shared truncate_at_stop() helper like every other completion backend. So EVERY
      completion backend (cached/quantized/gpu/apr_q4k/cuda_gguf) is earliest-position-correct.
  - type: invariant
    property: >
      STREAM-UTF8 (PRE-GENERATED paths DISCHARGED — PMAT-758/759): streamed SSE deltas must be
      valid UTF-8 — never a U+FFFD replacement char from decoding a single token that is one
      byte of a multi-byte char. chat_completions_stream.rs (PMAT-758) and
      pregenerated_sse_response (PMAT-759) decode CUMULATIVE token prefixes via
      streaming_text_deltas() and hold back a delta until the trailing multi-byte char
      completes (the HF TextStreamer technique). STILL OPEN: true_streaming_sse_response uses
      the per-token decode_token() and needs an incremental cross-token byte buffer (the
      live-channel path can't precompute the full token list).
  - type: invariant
    property: >
      PARAMS-PLUMBED (PARTIAL — audit items 7-10): request params are honored or explicitly
      rejected, never silently dropped. top_k DISCHARGED for /v1/chat/completions (PMAT-760):
      all 4 chat backends (try_gpu/try_cached in openai_handlers, try_cuda/try_quantized in
      cuda_chat_backend) now resolve top_k via resolve_chat_top_k(temperature, request.top_k)
      — honor the request's top_k, default 40, temperature==0 (or top_k==1) forces greedy —
      instead of the hardcoded `if temperature == 0.0 { 1 } else { 40 }` that dropped it
      (drift from batch.rs which honors it). top_p / repeat_penalty / repeat_last_n / seed
      DISCHARGED for the DENSE /v1/chat/completions backends (PMAT-821): the dense config
      builders (try_cuda_backend, try_quantized_backend in cuda_chat_backend.rs) previously
      read ONLY max_tokens/temperature/top_k then `..Default::default()`, silently DROPPING
      request.top_p/repeat_penalty/repeat_last_n/seed at the HANDLER→CONFIG boundary — so even
      with the sampler honoring them, the dense chat endpoint passed the neutral defaults
      (top_p=1.0, repeat_penalty=1.0). They now build via the shared chat_quantized_config()
      helper, which threads every request sampling param (defaulting field-by-field to
      QuantizedGenerateConfig::default for the no-param case). The MoE path
      (try_qwen3_moe_backend) already threaded these. STILL OPEN: n accepted-but-ignored
      (should reject n>1); temperature default 0.7 vs OpenAI 1.0 (default_temperature()); the
      APR-Q4K chat scheduler (AprQ4kRequest) carries only max_tokens/temperature/eos — extending
      its request struct is a separate sampler-layer change; and /v1/completions has no top_k
      field at all (CompletionRequest would need it added — non-standard for completions,
      deferred).
  - type: invariant
    property: >
      CHAT-HANDLER-THREADS-PARAMS (DISCHARGED — PMAT-821, F-CHAT-HANDLER-THREADS-PARAMS-001):
      the dense /v1/chat/completions config builder threads EVERY request sampling parameter
      into the QuantizedGenerateConfig before generation. Specifically chat_quantized_config()
      sets config.top_p = request.top_p (default 1.0), config.repeat_penalty =
      request.repeat_penalty (default 1.0), config.repeat_last_n = request.repeat_last_n
      (default 64), config.seed = request.seed (default 42) — never leaving them on the neutral
      default when the request set them. A request that omits a param yields a config whose
      field equals QuantizedGenerateConfig::default for that field (the no-regression
      invariant). This is the HANDLER→CONFIG layer; it composes with the sampler-layer fixes
      (#2081 top_p, #2099 repeat_penalty) that APPLY the params during sampling.
  - type: invariant
    property: >
      TOOL-CALLING (PMAT-801, DISCHARGED for NON-STREAMING): a /v1/chat/completions
      request MAY carry OpenAI `tools` (a list of {type:"function", function:{name,
      description, parameters}}) and `tool_choice` ("auto" | "none" | "required" |
      {type:"function", function:{name}}). When `tools.is_some()`, the non-streaming
      handler runs the generated text through grammar::ToolCallParser (the in-tree
      tool-calling library) and, if at least one call is found, populates the response
      message's `tool_calls` (each {id, type:"function", function:{name, arguments}})
      and sets finish_reason:"tool_calls". The `arguments` field is a JSON STRING (not a
      nested object), per the OpenAI wire format. `tool_choice:"none"` skips parsing.
      build_chat_response threads tools+tool_choice through all 7 non-streaming chat
      backends (gpu/cached/cuda/apr_q4k/quantized/qwen3_moe/registry).
      NO-REGRESSION: the entire path is gated on `tools.is_some()` — a request WITHOUT
      `tools` produces a byte-identical response (a plain assistant text turn + the
      original stop/length finish_reason), and the new ChatMessage tool fields are
      omitted from JSON (skip_serializing_if=None).
      STILL OPEN (follow-ups): streaming tool-call deltas; schema-constrained decoding
      via generate_tool_grammar; optional/null assistant `content` for tool-call history
      on the REQUEST side (request `content` stays REQUIRED to preserve the 422-on-missing
      contract); `tool_choice:"required"` is mapped but not yet enforced to FORCE a call.
  - type: invariant
    property: >
      STREAM-TEMPERATURE-ZERO (DISCHARGED — PMAT-790): the STREAMING /v1/chat/completions
      handler must honor `temperature == 0` as a deterministic (greedy) request, exactly like
      every NON-STREAMING backend (which forces top_k == 1 via resolve_chat_top_k). Previously
      openai_chat_completions_stream_handler built a GenerationConfig with the raw 0.0 and ran
      model.generate -> sample_token -> apply_temperature(0.0), which rejects a non-positive
      temperature ("Temperature must be a positive finite number") — the handler mapped that
      Err to HTTP 500, so EVERY streaming chat completion with `temperature: 0` was broken. The
      config is now built by resolve_stream_generation_config(temperature, top_p, max_tokens),
      which maps temperature 0 to SamplingStrategy::Greedy with a no-op temperature of 1.0
      (and ignores top_p when greedy); positive temperatures are unchanged (greedy default, or
      top-p when set).
  - type: invariant
    property: >
      EMBEDDINGS-MODEL-BACKED (PMAT-803, DISCHARGED): /v1/embeddings (and the native
      /realize/embed) returns REAL model-backed embeddings, NOT a silent positional
      token-ID hash. The handler (realize_embed_handler) tokenizes, runs
      Model::forward_hidden() to get the final-layer hidden state (the residual-stream
      output that lm_head consumes — pre-projection), MEAN-POOLS over the non-special
      tokens, returns a vector whose dimension == the model's hidden_size (NOT a
      hardcoded 384), and L2-normalizes it. Consequence: two inputs whose tokens are in
      the same semantic cluster but have DISJOINT token IDs have higher cosine
      similarity than two inputs from different clusters — a property the prior hash
      (embedding[token_id % 384] += 1/(1+pos)) provably could not satisfy (disjoint IDs
      land in disjoint buckets → cosine 0.0 for both pairs, so it cannot rank them). The
      endpoint must never silently return a non-model-backed vector.
  - type: invariant
    property: >
      EMBEDDINGS-BATCH-INPUT (PMAT-802 × PMAT-803, DISCHARGED): /v1/embeddings accepts
      `input` as a single JSON string OR a JSON array of strings (OpenAI contract,
      EmbeddingInput::{Single,Batch}, untagged) — a batch request is no longer rejected
      at deserialization. The handler (realize_embed_handler) loops over every input,
      emitting one EmbeddingData per input with index == i in request order, and
      accumulates prompt/total token usage across the batch. CRUCIALLY each input is
      embedded via the SAME real model-backed path as the single-input form
      (forward_hidden → mean-pool over non-special tokens → vector of dim ==
      model.hidden_dim → L2-normalize) — NOT the prior positional token-ID hash. So a
      batch of N inputs returns N REAL model-backed embeddings (each per-input vector
      equals the single-input embedding for that text), composing EMBEDDINGS-MODEL-BACKED
      with batch input.
  - type: invariant
    property: >
      OLLAMA-API-ROUTED-ON-APR-SERVE (PMAT-923, DISCHARGED, non-streaming only):
      `apr serve <model>` does NOT mount realizar's create_router — it builds its
      OWN bespoke axum routers in crates/apr-cli/src/commands/serve/ (the APR-CPU
      router build_apr_cpu_router, the CUDA-fallback build_gpu_router, the WGPU
      router, and the single-file + sharded SafeTensors routers). Ollama's native
      HTTP endpoints `POST /api/chat` and `POST /api/generate` (plus `GET /api/tags`)
      are therefore wired at EACH of those routers, alongside their existing
      `/v1/chat/completions` route — verified by `grep '"/api/'
      crates/apr-cli/src/commands/serve/` returning > 0 (and by the apr-cli e2e
      falsifier below, which drives the REAL build_apr_cpu_router). Each Ollama route
      delegates generation to the SAME chat backend that router uses for
      `/v1/chat/completions` (apr-cli adapters in serve/ollama.rs translate the Ollama
      request into the OpenAI-chat JSON the existing chat handler consumes, then
      re-shape the OpenAI response): `/api/chat` returns
      `{model, created_at, message:{role:"assistant", content}, done:true,
      prompt_eval_count, eval_count}`; `/api/generate` returns the flat
      `{model, created_at, response, done:true, prompt_eval_count, eval_count}` (no
      nested message). A wired route is observably distinct from the axum `not_found`
      fallback (which carries no `done` field) even when no model is loaded, because
      the Ollama handler always emits a terminal (`done:true`) Ollama-shaped body.
      SCOPE: this obligation covers the NON-STREAMING (`stream:false`) Ollama wire
      shape on the apr serve routers. The `stream:true` NDJSON path is now covered
      by OLLAMA-NDJSON-STREAMING (PMAT-928) below. The reusable realizar-side
      handlers (aprender-serve/src/api/ollama_handlers.rs) and their wiring into
      create_router_with_config remain for any caller that DOES mount realizar's
      router (e.g. `realizar serve`), but are NOT the path `apr serve` exercises.
  - type: invariant
    property: >
      OLLAMA-NDJSON-STREAMING (PMAT-928, DISCHARGED): an Ollama `/api/chat` or
      `/api/generate` request with `stream != false` (Ollama's WIRE DEFAULT is
      stream:true, so an ABSENT `stream` field MUST stream — the apr-cli adapter
      uses serde default_stream()==true, not bool::default()==false) responds with
      a CHUNKED newline-delimited-JSON body (Content-Type: application/x-ndjson),
      NOT a single coalesced JSON object: one INTERMEDIATE `{...,done:false}`
      object per generated token followed by a single TERMINAL `{...,done:true,
      done_reason:"stop", prompt_eval_count, eval_count, total_duration,
      eval_duration}` object. For `/api/chat` each token chunk nests
      `message:{role:"assistant", content:<token>}`; for `/api/generate` each
      chunk carries the flat `response:<token>` field. The terminal object's
      eval_count equals the number of token chunks emitted, and concatenating the
      token chunks' content/response reproduces the full generation.
      The streaming path on the APR-CPU router REUSES the SAME incremental token
      stream the OpenAI `/v1/chat/completions` SSE path uses
      (spawn_cpu_streaming_task / generate_with_cache_streaming → mpsc channel);
      only the wire framing differs (NDJSON lines vs SSE `data:` events) — it is
      NOT a re-decode of a coalesced batch result. Backends that have only a batch
      generation API (GPU-fallback, SafeTensors generate_with_cache) still honor
      `stream:true` with correct NDJSON framing (one content chunk + terminal
      done:true) over their coalesced result. `stream:false` is UNCHANGED: a single
      coalesced (`done:true`) JSON object (application/json), preserving the
      OLLAMA-API-ROUTED-ON-APR-SERVE non-streaming shape (no-regression). On a
      backend error the stream still terminates with a well-formed `done:true`
      object, never a bare error object lacking `done`.
  - type: invariant
    property: >
      OLLAMA-CREATED-AT-IS-RFC3339: every Ollama-wire timestamp apr emits —
      `created_at` on the coalesced `/api/chat` and `/api/generate` bodies, on
      EVERY NDJSON stream chunk (intermediate and terminal), and `modified_at`
      in the `/api/tags` model list — is a real RFC 3339 UTC instant with
      nanosecond precision (`2026-08-09T16:55:33.983535246Z`), NOT a bare Unix
      epoch with a `Z` appended (`1786293998.000000000Z`). This is a HARD
      requirement, not cosmetic: ollama's own Go client declares these fields
      as `time.Time` (api.ChatResponse.CreatedAt, api.GenerateResponse.CreatedAt,
      api.ListModelResponse.ModifiedAt), so the value is decoded by
      `time.Time.UnmarshalJSON`, which accepts RFC 3339 and nothing else. A
      value it cannot parse makes `encoding/json` abandon the WHOLE object, so
      the client observes an empty message, `done:false` and zeroed counts —
      the response is dropped in its entirety, not merely mis-timestamped, and
      a streaming client loop watching `done` never terminates. The timestamp
      must also denote the current instant (UTC offset zero), so a decoding
      client gets a usable time rather than the zero value. Holds for BOTH
      implementations of the helper: the apr-cli adapter that `apr serve`
      mounts (crates/apr-cli/src/commands/serve/ollama.rs::created_at_now) and
      the realizar-side handlers any caller mounting create_router gets
      (crates/aprender-serve/src/api/ollama_handlers.rs::created_at_now).

  - type: invariant
    property: >
      OLLAMA-COMPAT-ON-THE-REALIZAR-ROUTER (dogfood 0.63.0, #2396): the Ollama
      surface obligations above are stated for the apr-cli APR-CPU router.
      `apr serve run <GGUF>` mounts a DIFFERENT router — realizar
      create_router, via apr-cli run_cpu_server — and 0.63.0 shipped that one
      unfixed: `stream:true` was parsed and discarded (one buffered
      application/json object with content-length 181), and /api/tags,
      /api/show and /api/version answered 404 while the startup banner
      advertised "Ollama-Parity Endpoints". On the realizar router,
      `stream:true` now responds application/x-ndjson with NO content-length:
      a sequence of `{...,done:false}` objects whose content/response
      fragments CONCATENATE to the full generation, terminated by exactly one
      `{...,done:true,done_reason:"stop",prompt_eval_count,eval_count}`.
      Non-terminal objects omit the counts rather than sending zeros.
      `stream:false` is unchanged (one application/json object). NOTE ON
      SCOPE: this router's chat backend has no token callback, so the
      fragments are produced from the finished generation — the WIRE PROTOCOL
      is correct and clients no longer freeze, but time-to-first-object is
      unchanged. /api/tags, /api/show and /api/version are routed.
  - type: invariant
    property: >
      MODEL-METADATA-MEASURED-OR-ABSENT (dogfood 0.63.0, #2402): every field
      the metadata endpoints (/realize/model, /api/tags, /api/show) report is
      either MEASURED or ABSENT from the JSON. There is no defaulted value.
      0.63.0 returned `size_bytes: 0`, `quantization: "Q4_K_M"`,
      `context_length: 4096`, `format: "gguf"` and
      `content_hash: "blake3:0".repeat(16)` as constants for every model — on a
      1.04 GiB Q4_K GGUF served with `--context-length 128` against a
      32768-context model, all five were wrong. The content_hash is the worst
      of them: a 128-character string shaped exactly like a BLAKE3 digest,
      which a consumer cannot distinguish from a real one and will store and
      compare as provenance. `lineage` is therefore emitted ONLY when a hash
      was actually computed over the model bytes. Measured values come from
      api/model_source.rs::ModelSourceInfo: size and container format from the
      FILE (magic bytes, not the extension), quantization from the qtype of
      the loaded projection tensors (not GGUF's advisory general.file_type),
      architecture from the loader. The context the server was CONFIGURED with
      (`--context-length`) and the model's own advertised maximum are reported
      as two SEPARATE fields; conflating them is what produced the 4096.
  - type: invariant
    property: >
      ERROR-MESSAGES-NAME-A-REAL-REMEDY (dogfood 0.63.0, #2402): an error body
      that tells the caller how to fix the problem must name a remedy that
      exists. POST /realize/reload without registry mode answers 501; 0.63.0's
      body said "Start server with --registry flag", and `apr serve run
      --registry <FILE>` is rejected by clap with exit 2 (no such flag on
      `apr serve run` or on `apr serve`), so the endpoint was unreachable by
      any documented invocation. The message now states that the CLI does not
      expose registry mode, names the embedder API that does
      (AppState::with_registry), and gives the working alternative (restart
      with `apr serve run <MODEL>`).
  - type: invariant
    property: >
      COMPLETIONS-STREAM-FLAG-HONOURED (dogfood 0.63.0, #2375 findings 3 and 5,
      DISCHARGED): POST /v1/completions with "stream":true responds
      Content-Type text/event-stream with NO content-length — a sequence of
      `data: {json}` frames whose `choices[0].text` fragments CONCATENATE to
      exactly the text the same request returns without the flag, terminated by
      a frame carrying `finish_reason` and then `data: [DONE]`. 0.63.0 could not
      do this in two independent ways: CompletionRequest had no `stream` field
      at all (serde dropped the key), and openai_completions_handler returned
      Result<Json<CompletionResponse>, RErr>, a type that cannot carry an SSE
      body. Both are fixed, and the streaming decision is made in exactly ONE
      place — the handler wraps a single `completions_inner` that returns a
      CompletionResponse — so no backend return path can forget it.
      NO-REGRESSION: an absent or false `stream` still returns one
      application/json object carrying `usage`.
  - type: invariant
    property: >
      STREAM-FINISH-REASON-MEASURED (dogfood 0.63.0, #2375 finding 6,
      DISCHARGED): the terminal chunk of a STREAMED chat completion reports the
      reason generation actually ended, and it equals the `finish_reason` the
      NON-streaming response gives for the identical request — "length" when the
      max_tokens budget was consumed with no stop match, "stop" otherwise.
      0.63.0 emitted the literal "stop" unconditionally (ChatCompletionChunk::done
      took no reason), so a truncated stream was indistinguishable from a
      finished one. The constructor now takes a FinishReason, which is obtained
      from FinishReason::from_generation(stopped, completion_tokens, max_tokens);
      there is no &str parameter left to hardcode, and both SSE builders
      (pregenerated_sse_response, true_streaming_sse_response) take max_tokens,
      so a terminal chunk cannot be built without the budget it was generated
      under.
  - type: invariant
    property: >
      N-PARAM-HONOURED-OR-REFUSED (dogfood 0.63.0, #2375 finding 9, DISCHARGED):
      this server returns exactly one choice per request, so a request asking for
      more is REFUSED rather than answered 200 with one choice. `n` is typed
      ChoiceCount on both ChatCompletionRequest and CompletionRequest, and its
      Deserialize rejects any value but 1 — an unhonoured `n` is not
      representable in a deserialized request, so no handler can ignore it. The
      refusal reaches the client with its reason: a validator marks a message as
      client-visible (CLIENT_VISIBLE_MARKER) and the GH-649 422 sanitizer
      forwards marked text while still hiding raw serde internals.
      NO-REGRESSION: `n:1` and an absent `n` are served normally.
  - type: invariant
    property: >
      PREDICT-ERROR-STATES-WHAT-IS-LOADED (dogfood 0.63.0, #2375 finding 8,
      DISCHARGED): /v1/predict's 503 must not contradict /health and must not
      name a Rust API the client cannot call. 0.63.0 answered "No APR model
      loaded. Use AppState::demo() or load a .apr model." on a server whose log
      read "APR loaded: 291 tensors" — `apr_model` holds a classical estimator
      while a generative .apr loads into the quantized/transformer slots. The
      body now distinguishes "a generative model is loaded, this endpoint serves
      APR classifier/regressor models" from "nothing is loaded", and points at
      /v1/completions and /v1/chat/completions. A source-scanning falsifier
      keeps any shipped string literal in the crate from naming
      AppState::demo() / AppState::new() again. (AppState::with_registry stays
      permitted: ERROR-MESSAGES-NAME-A-REAL-REMEDY names it deliberately as the
      embedder API that enables registry mode.)

falsification_tests:
  - id: FALSIFY-STOP-TRUNCATE-754
    name: pmat754_stop_truncation_tests
    prediction: 'truncate_at_stop(text, stops) truncates at the EARLIEST stop position (not the first-listed): truncate_at_stop("hello world", ["world","hello"]) == ""; keeps text when no stop matches; ignores empty stop strings; unchanged when stops is None. try_cached_completions / try_quantized_completions apply it so their output never contains a stop string.'
    test_harness: 'cargo test -p aprender-serve --lib pmat754_stop_truncation_tests'
    expected_output: "test result: ok"
    if_fails: 'A completion backend returns text containing the stop string (or runs to max_tokens past it), violating OpenAI stop semantics — the pre-PMAT-754 behavior in the cached/quantized backends.'
  - id: FALSIFY-CHAT-STOP-756
    name: pmat756_chat_stop_tests
    prediction: 'finalize_chat_text(text, stops, completion_tokens, max_tokens) truncates the chat message at the earliest stop position via the shared truncate_at_stop helper and sets finish_reason: a matched stop string => "stop" (even when completion_tokens >= max_tokens — stop precedence over length); no stop match + max_tokens hit => "length"; no stop match under max_tokens => "stop"; stops=None leaves text untouched. build_chat_response runs it for all 7 /v1/chat/completions backends so the returned message never contains a stop string.'
    test_harness: 'cargo test -p aprender-serve --lib pmat756_chat_stop_tests'
    expected_output: "test result: ok"
    if_fails: 'The /v1/chat/completions response contains the stop string / runs to max_tokens past it (the pre-PMAT-756 behavior — the chat path ignored request.stop entirely), or finish_reason mislabels a stop-truncated message as "length".'
  - id: FALSIFY-STREAM-DELTA-758
    name: pmat758_streaming_delta_tests
