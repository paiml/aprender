contract: apr-serve-openai-compat
metadata:
  kind: pattern
  version: "1.8.0"
  description: >
    OpenAI-compatible serve layer (/v1/chat/completions, /v1/completions) fidelity
    invariants. Established by an adversarial audit (2026-06-14) that found 12 confirmed
    real bugs — see evidence/serve-api-openai-fidelity-audit-2026-06-14/findings.md.
    This contract is the home for those obligations; they discharge as the follow-up
    fixes land. PMAT-753 (this revision) discharges the SSE-framing obligation: the
    streaming handler must pass a BARE JSON payload (or "[DONE]") to axum's
    Event::data(), NOT a string already prefixed with "data: " — axum's Sse adds the
    `data: ` field + `\n\n` terminator itself, so a manual prefix produced a DOUBLE
    `data: data: {json}` on the wire and broke JSON.parse for every spec-compliant SSE
    client. The correct form is used by openai_handlers.rs.
  references:
  - "crates/aprender-serve/src/api/chat_completions_stream.rs (fixed)"
  - "crates/aprender-serve/src/api/openai_handlers.rs (correct SSE-framing reference)"
  - "evidence/serve-api-openai-fidelity-audit-2026-06-14/findings.md (full 12-bug audit)"
version: 1
status: enforced
date: 2026-06-14

proof_obligations:
  - type: invariant
    property: >
      SSE-FRAMING (PMAT-753, DISCHARGED): the streaming chat handler passes a bare JSON
      chunk (or the literal "[DONE]") to Event::default().data(); it never manually
      prepends "data: " or appends a newline (axum's Sse adds the field framing). So each
      streamed event's data is parseable JSON, never the literal "data: {...}".
  - type: invariant
    property: >
      STOP-APPLIED (DISCHARGED for NON-STREAMING — PMAT-754/755/756): every NON-STREAMING
      completion AND chat backend applies the request's stop sequences (post-decode
      truncation at the EARLIEST stop position) via the shared truncate_at_stop() helper, so
      the returned (non-streamed) text never contains a stop string. /v1/completions:
      try_cached_completions, try_quantized_completions (PMAT-754), try_gpu_completions,
      try_apr_q4k_completions (PMAT-755). /v1/chat/completions: build_chat_response runs
      finalize_chat_text() across ALL 7 build_chat_response call sites
      (gpu/quantized/cached/q4k/qwen3_moe/registry), AND the inline try_safetensors_cuda_backend
      builder (which bypasses build_chat_response) also calls finalize_chat_text — together
      with finish_reason="stop" when a stop string truncated (precedence over "length")
      (PMAT-756).
      STREAMING (PRE-GENERATED paths DISCHARGED — PMAT-758/759): chat_completions_stream.rs
      (PMAT-758) AND pregenerated_sse_response (PMAT-759, the cuda/gpu/cached chat streaming
      backends + registry fallback) now apply stop via streaming_text_deltas(). STILL OPEN:
      true_streaming_sse_response (the live mpsc-channel path) — needs incremental cross-token
      stop detection; tracked follow-up.
      Residual nicety (DISCHARGED — PMAT-761): try_cuda_gguf_completions previously truncated
      at the first-LISTED stop via an inline loop, not the earliest-POSITION one; it now uses
      the shared truncate_at_stop() helper like every other completion backend. So EVERY
      completion backend (cached/quantized/gpu/apr_q4k/cuda_gguf) is earliest-position-correct.
  - type: invariant
    property: >
      STREAM-UTF8 (PRE-GENERATED paths DISCHARGED — PMAT-758/759): streamed SSE deltas must be
      valid UTF-8 — never a U+FFFD replacement char from decoding a single token that is one
      byte of a multi-byte char. chat_completions_stream.rs (PMAT-758) and
      pregenerated_sse_response (PMAT-759) decode CUMULATIVE token prefixes via
      streaming_text_deltas() and hold back a delta until the trailing multi-byte char
      completes (the HF TextStreamer technique). STILL OPEN: true_streaming_sse_response uses
      the per-token decode_token() and needs an incremental cross-token byte buffer (the
      live-channel path can't precompute the full token list).
  - type: invariant
    property: >
      PARAMS-PLUMBED (PARTIAL — audit items 7-10): request params are honored or explicitly
      rejected, never silently dropped. top_k DISCHARGED for /v1/chat/completions (PMAT-760):
      all 4 chat backends (try_gpu/try_cached in openai_handlers, try_cuda/try_quantized in
      cuda_chat_backend) now resolve top_k via resolve_chat_top_k(temperature, request.top_k)
      — honor the request's top_k, default 40, temperature==0 (or top_k==1) forces greedy —
      instead of the hardcoded `if temperature == 0.0 { 1 } else { 40 }` that dropped it
      (drift from batch.rs which honors it). STILL OPEN: n accepted-but-ignored (should
      reject n>1), seed not plumbed to dense backends, temperature default 0.7 vs OpenAI 1.0
      (default_temperature()); and /v1/completions has no top_k field at all (CompletionRequest
      would need it added — non-standard for completions, deferred).
  - type: invariant
    property: >
      TOOL-CALLING (PMAT-801, DISCHARGED for NON-STREAMING): a /v1/chat/completions
      request MAY carry OpenAI `tools` (a list of {type:"function", function:{name,
      description, parameters}}) and `tool_choice` ("auto" | "none" | "required" |
      {type:"function", function:{name}}). When `tools.is_some()`, the non-streaming
      handler runs the generated text through grammar::ToolCallParser (the in-tree
      tool-calling library) and, if at least one call is found, populates the response
      message's `tool_calls` (each {id, type:"function", function:{name, arguments}})
      and sets finish_reason:"tool_calls". The `arguments` field is a JSON STRING (not a
      nested object), per the OpenAI wire format. `tool_choice:"none"` skips parsing.
      build_chat_response threads tools+tool_choice through all 7 non-streaming chat
      backends (gpu/cached/cuda/apr_q4k/quantized/qwen3_moe/registry).
      NO-REGRESSION: the entire path is gated on `tools.is_some()` — a request WITHOUT
      `tools` produces a byte-identical response (a plain assistant text turn + the
      original stop/length finish_reason), and the new ChatMessage tool fields are
      omitted from JSON (skip_serializing_if=None).
      STILL OPEN (follow-ups): streaming tool-call deltas; schema-constrained decoding
      via generate_tool_grammar; optional/null assistant `content` for tool-call history
      on the REQUEST side (request `content` stays REQUIRED to preserve the 422-on-missing
      contract); `tool_choice:"required"` is mapped but not yet enforced to FORCE a call.

falsification_tests:
  - id: FALSIFY-STOP-TRUNCATE-754
    name: pmat754_stop_truncation_tests
    prediction: 'truncate_at_stop(text, stops) truncates at the EARLIEST stop position (not the first-listed): truncate_at_stop("hello world", ["world","hello"]) == ""; keeps text when no stop matches; ignores empty stop strings; unchanged when stops is None. try_cached_completions / try_quantized_completions apply it so their output never contains a stop string.'
    test_harness: 'cargo test -p aprender-serve --lib pmat754_stop_truncation_tests'
    expected_output: "test result: ok"
    if_fails: 'A completion backend returns text containing the stop string (or runs to max_tokens past it), violating OpenAI stop semantics — the pre-PMAT-754 behavior in the cached/quantized backends.'
  - id: FALSIFY-CHAT-STOP-756
    name: pmat756_chat_stop_tests
    prediction: 'finalize_chat_text(text, stops, completion_tokens, max_tokens) truncates the chat message at the earliest stop position via the shared truncate_at_stop helper and sets finish_reason: a matched stop string => "stop" (even when completion_tokens >= max_tokens — stop precedence over length); no stop match + max_tokens hit => "length"; no stop match under max_tokens => "stop"; stops=None leaves text untouched. build_chat_response runs it for all 7 /v1/chat/completions backends so the returned message never contains a stop string.'
    test_harness: 'cargo test -p aprender-serve --lib pmat756_chat_stop_tests'
    expected_output: "test result: ok"
    if_fails: 'The /v1/chat/completions response contains the stop string / runs to max_tokens past it (the pre-PMAT-756 behavior — the chat path ignored request.stop entirely), or finish_reason mislabels a stop-truncated message as "length".'
  - id: FALSIFY-STREAM-DELTA-758
    name: pmat758_streaming_delta_tests
    prediction: 'streaming_text_deltas(tokenizer, token_ids, stops) decodes cumulative token prefixes and (a) holds back a delta until a multi-byte UTF-8 char completes — a 4-token 😀 (F0 9F 98 80) yields a single "😀", never U+FFFD; (b) truncates at the earliest stop and halts emission — "abXc" with stop ["X"] streams "ab", never containing "X"; (c) stops=None streams the full text. BOTH pre-generated streaming paths — chat_completions_stream.rs (PMAT-758) and pregenerated_sse_response (PMAT-759) — stream these precomputed deltas.'
    test_harness: 'cargo test -p aprender-serve --lib pmat758_streaming_delta_tests'
    expected_output: "test result: ok"
    if_fails: 'The streaming chat handler emits U+FFFD replacement chars for emoji/CJK that span tokens (per-token decode), or leaks the stop string into the stream — the pre-PMAT-758 behavior of openai_chat_completions_stream_handler.'
  - id: FALSIFY-TOPK-760
    name: pmat760_top_k_tests
    prediction: 'resolve_chat_top_k(temperature, requested) honors the request top_k: resolve_chat_top_k(0.7, Some(10)) == 10; None => 40; temperature 0.0 => 1 (greedy) regardless of requested; explicit Some(1) => 1 at any temperature. All 4 /v1/chat/completions backends use it so a client-set top_k is no longer dropped for the hardcoded 40.'
    test_harness: 'cargo test -p aprender-serve --lib pmat760_top_k_tests'
    expected_output: "test result: ok"
    if_fails: 'A chat backend ignores request.top_k and samples with the hardcoded 40 (the pre-PMAT-760 behavior), so a client-specified top_k has no effect on the output distribution.'
  - id: FALSIFY-CUDA-GGUF-STOP-761
    name: gpu_completions_handler_no_first_listed_stop_loop
    prediction: 'gpu_completions_handler.rs (try_cuda_gguf_completions) applies stop via the shared truncate_at_stop() helper (earliest-position), NOT an inline `for stop in stops { text.truncate(pos); break }` loop (which cuts at the first-LISTED stop). Shape gate: catches re-introduction of the first-listed inline form. The earliest-position behavior itself is covered by FALSIFY-STOP-TRUNCATE-754.'
    test_harness: '! grep -nE "for stop in stops" crates/aprender-serve/src/api/gpu_completions_handler.rs'
    expected_output: "no match (exit 1 from grep = invariant holds)"
    if_fails: 'A completion backend re-added first-LISTED stop truncation, so stop=["world","hello"] on "hello world" keeps "hello " instead of truncating at the earliest position ("") — inconsistent with the other completion backends.'
  - id: FALSIFY-SSE-FRAMING-753
    name: chat_completions_stream_no_double_data_prefix
    prediction: 'chat_completions_stream.rs yields Event::default().data(<bare json>) / .data("[DONE]") — no occurrence of Event::default().data(format!("data: ...")) (which double-prefixes the SSE wire format). Shape gate: catches re-introduction of the manual prefix.'
    test_harness: '! grep -nE "data\(format!\\(\"data: " crates/aprender-serve/src/api/chat_completions_stream.rs'
    expected_output: "no match (exit 1 from grep = invariant holds)"
    if_fails: 'The streaming handler re-added a manual "data: " prefix → axum double-prefixes the SSE wire (data: data: {json}) and every spec-compliant streaming client fails to parse chunks. NOTE: shape gate (greps source); the behavioral wire-format is verified by matching openai_handlers.rs (axum Event is opaque + the test app loads no model, so no in-CI wire assertion).'
  - id: FALSIFY-TOOL-CALL-801
    name: pmat801_tool_calling_tests
    prediction: 'With a request carrying OpenAI `tools`, build_tool_calling_message runs the generated text through grammar::ToolCallParser: text containing {"name":"get_weather","arguments":{"city":"NYC"}} yields a message with tool_calls populated (id, type:"function", function:{name:"get_weather", arguments:<JSON STRING>}) and finish_reason:"tool_calls"; the arguments field serializes as a JSON string, NOT a nested object; text with no tool call leaves the message a plain assistant turn with tool_calls=None and finish_reason unchanged (regression guard); tool_choice:"none" skips parsing; OpenAI tools+tool_choice deserialize from the request JSON and map to grammar ToolDefinition/ToolChoice; a tool-result message (role "tool" + tool_call_id) round-trips; a plain assistant message omits the tool fields from JSON.'
    test_harness: 'cargo test -p aprender-serve --lib pmat801_tool_calling_tests'
    expected_output: "test result: ok"
    if_fails: 'The /v1/chat/completions handler ignores request.tools (the pre-PMAT-801 behavior — the in-tree tool-calling library had ZERO call sites outside grammar/), so a tool call in the model output is never surfaced as response tool_calls / finish_reason:"tool_calls"; OR a no-tools request is no longer byte-identical; OR arguments serializes as a nested object instead of a JSON string.'
