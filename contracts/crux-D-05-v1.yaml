metadata:
  id: CRUX-D-05
  version: "1.0.0-draft"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "D — Inference & Generation"
  competitor: huggingface
  demand_score: 5  # 1..5, critical priority in pmat work
  intake_status: partial
  description: >
    SFT chat-template conversations. Root-cause workflow extracted from huggingface UX — see master
    subspec §5.D and §2 Five Whys methodology for rationale. This
    draft contract exists to satisfy the Iron Rule "no contract → no user
    story"; the falsification body below is a placeholder and MUST be
    replaced with the competitor's canonical CLI transcript before promotion.

equations:
  chat_template_render:
    formula: |
      Given a conversation C = [(role_i, content_i)]_{i=0..n-1} and template T:
        prompt_str = T(C) = apply_chat_template(tokenizer, C, add_generation_prompt=false)
        token_ids  = tokenizer.encode(prompt_str)
      For canonical templates T ∈ {chatml, llama3, mistral, qwen2}:
        token_ids_apr(C) == token_ids_hf(C)   (element-wise equal)
    domain: "(C, T) where C is list of {role ∈ {system,user,assistant}, content: str}"
    codomain: list[int] token ids
    invariants:
    - "Template selection matches model family (detected from tokenizer config)"
    - "Token IDs byte-for-byte equal to transformers tokenizer.apply_chat_template"
    - "add_special_tokens handling matches HF convention"

  assistant_loss_masking:
    formula: |
      For rendered sequence s = [t_0, t_1, ..., t_{L-1}]:
        mask_i = 1  if t_i ∈ assistant_turn_span
                 0  otherwise (system, user, BOS/EOS outside assistant)
      Per-sample loss:
        L = (Σ_i mask_i · CE(logits_i, t_{i+1})) / max(Σ_i mask_i, 1)
    domain: tokenized conversation + per-token role mask
    codomain: scalar loss
    invariants:
    - "Only assistant-turn tokens contribute to loss gradient"
    - "User/system prompt tokens have zero gradient (masked)"
    - "TRL SFTTrainer parity when DataCollatorForCompletionOnlyLM-equivalent is used"

  dry_run_visibility:
    formula: |
      apr finetune --dry-run --print-first-example emits, to stdout:
        { "raw": C_0, "templated": T(C_0), "token_ids": ids, "loss_mask": m }
      without modifying any training state.
    domain: first record of --data JSONL
    codomain: JSON diagnostic object
    invariants:
    - "Exit code 0, no checkpoint or metric files created"
    - "User can visually verify template rendering before committing to train run"

falsification_tests:
- id: FALSIFY-CRUX-D-05-001
  rule: "chat template tokenization byte-equal to HF reference"
  prediction: "apr --chat-template chatml produces identical token_ids to transformers.apply_chat_template"
  test: |
    # TODO: golden ids at evidence/crux/huggingface/d-05-chatml-ids.json
    # captured via: tokenizer.apply_chat_template(conv, tokenize=True, add_generation_prompt=False)
    GOLDEN=evidence/crux/huggingface/d-05-chatml-ids.json
    apr finetune fixtures/crux-d-05/qwen-base.apr --chat-template chatml \
      --data fixtures/crux-d-05/conversations.jsonl \
      --dry-run --print-first-example --json > /tmp/d05-first.json
    python3 -c "
    import json
    apr = json.load(open('/tmp/d05-first.json'))['token_ids']
    ref = json.load(open('$GOLDEN'))['token_ids']
    assert apr == ref, f'token_ids differ: apr[:10]={apr[:10]} ref[:10]={ref[:10]}'
    "
  if_fails: "Chat template tokenization diverges from HF reference — special-token handling or role marker bug"

- id: FALSIFY-CRUX-D-05-002
  rule: "loss masked on non-assistant tokens"
  prediction: "user/system tokens have loss_mask=0; assistant tokens have loss_mask=1"
  test: |
    apr finetune fixtures/crux-d-05/qwen-base.apr --chat-template chatml \
      --data fixtures/crux-d-05/conversations.jsonl \
      --dry-run --print-first-example --json > /tmp/d05-first.json
    python3 -c "
    import json
    d = json.load(open('/tmp/d05-first.json'))
    ids, mask, roles = d['token_ids'], d['loss_mask'], d['role_per_token']
    assert len(ids) == len(mask) == len(roles)
    for i,(r,m) in enumerate(zip(roles,mask)):
        if r == 'assistant':
            assert m == 1, f'assistant token {i} unmasked'
        else:
            assert m == 0, f'non-assistant token {i} contributes to loss (role={r})'
    "
  if_fails: "Loss mask does not restrict to assistant turns — will train on user prompts (data leakage)"

- id: FALSIFY-CRUX-D-05-003
  rule: "template auto-detection matches model family"
  prediction: "--chat-template auto picks chatml for Qwen2, llama3 for Llama-3, mistral for Mistral-v0.3"
  test: |
    for FAM in qwen2 llama3 mistral; do
      # TODO: fixtures/crux-d-05/$FAM-base.apr for each family
      DETECTED=$(apr finetune "fixtures/crux-d-05/$FAM-base.apr" --chat-template auto \
        --data fixtures/crux-d-05/conversations.jsonl --dry-run --print-first-example --json \
        | jq -r '.template_name')
      case "$FAM" in
        qwen2)   [ "$DETECTED" = "chatml" ]   || exit 1 ;;
        llama3)  [ "$DETECTED" = "llama3" ]   || exit 1 ;;
        mistral) [ "$DETECTED" = "mistral" ]  || exit 1 ;;
      esac
    done
  if_fails: "Auto template detection picked wrong template for known model family"

- id: FALSIFY-CRUX-D-05-004
  rule: "--dry-run is side-effect free"
  prediction: "--dry-run exits 0, writes no checkpoint, writes no metrics file"
  test: |
    OUT=/tmp/crux-d-05-out.apr
    CKPT=/tmp/crux-d-05-ckpt
    rm -rf "$OUT" "$CKPT"
    apr finetune fixtures/crux-d-05/qwen-base.apr --chat-template chatml \
      --data fixtures/crux-d-05/conversations.jsonl \
      --dry-run --print-first-example --output "$OUT" --checkpoint-dir "$CKPT"
    [ ! -e "$OUT" ] && [ ! -e "$CKPT" ]
  if_fails: "--dry-run created artifacts — violates side-effect-free contract"

proof_obligations:
- type: invariant
  property: "token_ids from apr --chat-template equal HF tokenizer.apply_chat_template"
- type: invariant
  property: "loss mask = 1 iff token ∈ assistant turn; 0 otherwise"
- type: invariant
  property: "--chat-template auto selects correct family template from tokenizer config"
- type: invariant
  property: "--dry-run --print-first-example emits diagnostic JSON with no side effects"
- type: parity
  property: "apr finetune + --chat-template ≡ TRL SFTTrainer with apply_chat_template formatting"

