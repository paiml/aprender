contract: apr-run-sampling-plumbing
metadata:
  kind: pattern
  version: "1.0.0"
  description: >
    `apr run` parses six sampling flags into RunOptions
    (--temperature, --top-k, --top-p, --seed, --repeat-penalty, --repeat-last-n)
    but, before PMAT-823, execute_with_realizar forwarded ONLY max_tokens (plus
    prompt/verbose/no_gpu/trace) into realizar::InferenceConfig, and the GGUF/GPU
    generation path copied only temperature+top_k into the QuantizedGenerateConfig
    that drives the decode loop — the rest fell to ..Default::default() (greedy:
    temperature 0.0 / top_k 1 / top_p 1.0 / seed 42 / repeat_penalty 1.0 /
    repeat_last_n 64). Net effect: EVERY `apr run`, regardless of sampling flags,
    ran greedy argmax, making the whole sampler-fix cluster (top_p / repeat_penalty
    / seed / temperature / top_k) DEAD for the CLI. PMAT-823 adds the missing
    InferenceConfig fields + builders, forwards every flag in execute_with_realizar,
    and threads them into the generation config via InferenceConfig::apply_sampling_to
    at every production build site (GGUF→GPU/wgpu/CPU, APR CUDA, APR wgpu, APR
    quantized CPU). A default RunOptions (no sampling flags) still forwards to the
    byte-identical greedy config, so default behavior is unchanged.
  references:
  - "crates/apr-cli/src/commands/run.rs (RunOptions sampling fields)"
  - "crates/apr-cli/src/commands/inference_output.rs (execute_with_realizar forwards all sampling flags)"
  - "crates/aprender-serve/src/infer/mod.rs (InferenceConfig fields/builders + apply_sampling_to)"
  - "crates/aprender-serve/src/infer/inference_result.rs (GGUF gen_config build)"
  - "crates/aprender-serve/src/infer/gguf_gpu_generate.rs (APR CUDA / APR wgpu / APR CPU gen_config builds)"
  - "crates/aprender-serve/src/infer/tests_inference_config.rs (PMAT-823 falsifiers)"
version: 1
status: enforced
date: 2026-06-16

proof_obligations:
  - type: invariant
    property: >
      CLI-RUN-FORWARDS-ALL-SAMPLING: realizar::InferenceConfig exposes a field +
      builder for every sampling parameter (temperature, top_k, top_p, seed,
      repeat_penalty, repeat_last_n), and InferenceConfig::apply_sampling_to copies
      EACH of them into the QuantizedGenerateConfig that drives the decode loop. A
      config built from non-default sampling values yields a generation config
      carrying those exact values, not the greedy defaults. (top_p None maps to the
      disabled threshold 1.0, matching QuantizedGenerateConfig::default().top_p.)
  - type: invariant
    property: >
      DEFAULT-RUN-STAYS-GREEDY: applying a DEFAULT InferenceConfig (a user who
      passes no sampling flags) to QuantizedGenerateConfig::default() leaves every
      sampling field equal to the greedy default (temperature 0.0, top_k 1, top_p
      1.0, seed 42, repeat_penalty 1.0, repeat_last_n 64). The fix only changes
      generation behavior when a user actually passes a flag — no regression for the
      greedy-by-default contract.

falsification_tests:
  - id: FALSIFY-RUN-SAMPLING-001
    name: test_pmat823_apply_sampling_forwards_every_param
    prediction: "An InferenceConfig with temperature=0.7, top_k=40, top_p=Some(0.9), seed=42, repeat_penalty=1.3, repeat_last_n=128 forwards each value into the QuantizedGenerateConfig (0.7 / 40 / 0.9 / 42 / 1.3 / 128), not the greedy defaults."
    test_harness: "cargo test -p aprender-serve --lib test_pmat823_apply_sampling_forwards_every_param"
    expected_output: "test result: ok"
    if_fails: "a sampling flag is dropped between RunOptions and the decode loop → `apr run --temperature/--top-k/--top-p/--seed/--repeat-penalty/--repeat-last-n` silently runs greedy argmax."
  - id: FALSIFY-RUN-SAMPLING-002
    name: test_pmat823_seed_forwarded_distinct_from_default
    prediction: "seed defaults to 42 on both sides; setting seed=123_456_789 forwards 123_456_789 (proves the seed is actually threaded, not coinciding with the default)."
    test_harness: "cargo test -p aprender-serve --lib test_pmat823_seed_forwarded_distinct_from_default"
    expected_output: "test result: ok"
    if_fails: "--seed is dropped → stochastic sampling is non-reproducible from the CLI seed."
  - id: FALSIFY-RUN-SAMPLING-003
    name: test_pmat823_default_config_is_greedy_no_regression
    prediction: "A default InferenceConfig applied to a default QuantizedGenerateConfig leaves every sampling field at the greedy default (temperature 0.0, top_k 1, top_p 1.0, seed 42, repeat_penalty 1.0, repeat_last_n 64)."
    test_harness: "cargo test -p aprender-serve --lib test_pmat823_default_config_is_greedy_no_regression"
    expected_output: "test result: ok"
    if_fails: "the plumbing changed default (no-flag) behavior → users who pass no sampling flags no longer get greedy-by-default generation."
