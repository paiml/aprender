contract: aprender-train-bench-cli-surface
metadata:
  kind: pattern
  version: "1.0.0"
  description: >
    ONT-10 binary slice S17: the CLI surface of the `aprender-train-bench` binary (package aprender-train-bench).
    It pins the invariants that `crates/aprender-train-bench/tests/cli_surface_gate.rs`
    enforces against the binary built from HEAD (CARGO_BIN_EXE_aprender-train-bench, never PATH).
    Shape follows contracts/pv-cli-surface-v1.yaml. Defects found by the
    2026-09-26 surface probe: none.
  references:
    - "contracts/pv-cli-surface-v1.yaml"
    - "contracts/apr-mono-binary-rule-v1.yaml"
    - "crates/aprender-train-bench/tests/cli_surface_gate.rs"
equations:
  version_pinned:
    formula: "contains(stdout(aprender-train-bench --version), CARGO_PKG_VERSION(aprender-train-bench))"
    domain: "the binary built from this tree"
    codomain: "{true, false}"
    invariants:
      - "resolved via CARGO_BIN_EXE_aprender-train-bench, which cannot fall back to a stale PATH copy"
  surface_pinned:
    formula: "subcommands(aprender-train-bench --help) \\ {help} = [temperature, alpha, compare, ablation, cost-performance, recommend]"
    domain: "the Commands: section of --help"
    codomain: "{equal, differs}"
    invariants:
      - "adding or removing a subcommand edits the gate's SUBCOMMANDS list and this formula together"
  advertised_implies_reachable:
    formula: "forall s in subcommands(aprender-train-bench --help) . exit_code(aprender-train-bench s --help) = 0"
    domain: "every subcommand the binary advertises"
    codomain: "{0, non-zero}"
    invariants:
      - "the universe is enumerated from the binary, not hardcoded"
  unknown_subcommand_is_usage_error:
    formula: "exit_code(aprender-train-bench no-such-subcommand) = 2"
    domain: "an argv whose first word is not a subcommand"
    codomain: "{0, 1, 2, other}"
  unusable_input_is_rejected:
    formula: >
      forall (s, i) in rejection_rows . exit_code(aprender-train-bench s i) not in {0, 101}
      and not contains(stderr, "panicked")
    domain: "`ablation -c`, `cost-performance --results`, `recommend --results` on each of the three unusable inputs; unusable inputs = {missing path, empty file, garbage bytes}"
    codomain: "{rejected, accepted, panicked}"
    invariants:
      - "a panic (101) is not a rejection: it is the crash this row exists to catch"
proof_obligations:
  - id: TBEN-INV-001
    type: invariant
    property: "aprender-train-bench --version reports the version of the crate it was built from"
    formal: "TBEN-VERSION-PINNED"
    applies_to: all
  - id: TBEN-INV-002
    type: invariant
    property: "The advertised subcommand set is the pinned surface"
    formal: "TBEN-SURFACE-PINNED"
    applies_to: all
  - id: TBEN-INV-003
    type: invariant
    property: "Every advertised subcommand is reachable"
    formal: "TBEN-ADVERTISED-REACHABLE"
    applies_to: all
  - id: TBEN-INV-004
    type: invariant
    property: "An unknown subcommand is a usage error (exit 2)"
    formal: "TBEN-UNKNOWN-IS-USAGE"
    applies_to: all
  - id: TBEN-INV-005
    type: invariant
    property: "Input the binary cannot process is rejected with a clean non-zero exit"
    formal: "TBEN-REJECTS-UNUSABLE"
    applies_to: all
falsification_tests:
  - id: FALSIFY-TBEN-001
    rule: "TBEN-VERSION-PINNED"
    prediction: "`aprender-train-bench --version` exits 0 and contains CARGO_PKG_VERSION."
    test_harness: "cargo test -p aprender-train-bench --test cli_surface_gate version_reports_the_crate_version"
    expected_output: "exit 0"
    if_fails: "The binary under test is not the one this tree builds, or --version lost the crate version."
  - id: FALSIFY-TBEN-002
    rule: "TBEN-SURFACE-PINNED"
    prediction: "`aprender-train-bench --help` advertises exactly: temperature, alpha, compare, ablation, cost-performance, recommend."
    test_harness: "cargo test -p aprender-train-bench --test cli_surface_gate advertised_subcommands_are_the_pinned_surface"
    expected_output: "exit 0"
    if_fails: "A subcommand was added or removed without updating the surface contract."
  - id: FALSIFY-TBEN-003
    rule: "TBEN-ADVERTISED-REACHABLE"
    prediction: "Every advertised subcommand exits 0 for `<cmd> --help`."
    test_harness: "cargo test -p aprender-train-bench --test cli_surface_gate every_advertised_subcommand_is_reachable"
    expected_output: "exit 0"
    if_fails: "A command is advertised but unreachable (the #2527 defect class)."
  - id: FALSIFY-TBEN-004
    rule: "TBEN-UNKNOWN-IS-USAGE"
    prediction: "`aprender-train-bench no-such-subcommand` exits 2."
    test_harness: "cargo test -p aprender-train-bench --test cli_surface_gate unknown_subcommand_is_a_usage_error"
    expected_output: "exit 0"
    if_fails: "The parser accepted an unknown subcommand or mapped a usage error to another code."
  - id: FALSIFY-TBEN-005
    rule: "TBEN-REJECTS-UNUSABLE"
    prediction: "Each rejection row exits non-zero, not 101, with no panic on stderr."
    test_harness: "cargo test -p aprender-train-bench --test cli_surface_gate unusable_input_is_rejected"
    expected_output: "exit 0 on an unmutated tree"
    if_fails: >
      MEASURED 2026-09-26 (aprender-01): 5/5 GREEN on an unmutated tree; no source mutation was run for this binary.
qa_gate:
  id: F-TBEN-001
  name: "aprender-train-bench CLI surface gate (ONT-10 S17)"
  checks:
    - "version_pinned"
    - "surface_pinned"
    - "advertised_implies_reachable"
    - "unknown_subcommand_is_usage_error"
    - "unusable_input_is_rejected"
  pass_criteria: >
    All 5 falsification tests pass via `cargo test -p aprender-train-bench --test cli_surface_gate`.
