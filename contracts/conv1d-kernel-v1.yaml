metadata:
  version: 1.0.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: Conv1d kernel — 1-dimensional convolution
  references:
  - LeCun et al. (1998) Gradient-Based Learning Applied to Document Recognition
  - Radford et al. (2023) Robust Speech Recognition via Large-Scale Weak Supervision (Whisper)
equations:
  conv1d:
    formula: y[n] = sum_{k=0}^{K-1} w[k] * x[n*stride + k - pad] + bias
    domain: x in R^{C_in x L}, w in R^{C_out x C_in x K}, bias in R^{C_out}
    codomain: y in R^{C_out x L_out} where L_out = floor((L + 2*pad - K) / stride) + 1
    invariants:
    - Output length follows standard convolution formula
    - 'Convolution is linear: conv(a*x + b*z) = a*conv(x) + b*conv(z)'
    - Identity kernel [0,...,0,1,0,...,0] preserves input (when pad matches)
    preconditions:
    - a.len() > 0
    - b.len() > 0
    lean_theorem: Theorems.Conv1D
proof_obligations:
- type: invariant
  property: Output shape correctness
  formal: L_out = floor((L + 2*pad - K) / stride) + 1
  applies_to: all
  lean:
    theorem: Conv1D.conv1d_valid_length_eq_outLen
    module: ProvableContracts.Conv1D
    status: proved
    depends_on:
    - Conv1D.conv1d_valid_length
    - Conv1D.outLen_valid
    mathlib_imports:
    - Mathlib.Data.List.Basic
    notes: The concrete List-valued valid convolution produces exactly
      x.length - w.length + 1 outputs, which equals the contract's L_out formula
      at pad=0, stride=1 (List.length_map / List.length_range).
- type: linearity
  property: Convolution linearity
  formal: '|conv(a*x + b*z) - (a*conv(x) + b*conv(z))| < eps'
  tolerance: 1.0e-05
  applies_to: all
  lean:
    theorem: Conv1D.conv_linear
    module: ProvableContracts.Conv1D
    status: proved
    depends_on:
    - Finset.mul_sum
    - Finset.sum_add_distrib
    mathlib_imports:
    - Mathlib.Algebra.BigOperators.Ring.Finset
    notes: Exact (eps=0) real identity conv w (a·x+b·z) = a·conv w x + b·conv w z,
      strictly stronger than the FP-tolerance form. Corollaries conv_add, conv_smul.
- type: equivalence
  property: Direct conv matches im2col+GEMM
  formal: '|conv_direct(x) - conv_im2col(x)| < eps'
  tolerance: 1.0e-06
  applies_to: all
  l4_status: not_applicable
  l4_reason: Equivalence of a specific im2col buffer-reshape + BLAS/GEMM
    implementation against the direct loop is an implementation/byte-layout
    equivalence verified empirically at 1e-6 FP tolerance (FALSIFY-CV-003),
    not an abstract analytic identity. The abstract linearity that GEMM realises
    IS proved (conv_linear).
- type: bound
  property: Output bounded by input and kernel
  formal: '|y[n]| <= C_in * K * max(|w|) * max(|x|) + |bias|'
  applies_to: all
  lean:
    theorem: Conv1D.conv_abs_le
    module: ProvableContracts.Conv1D
    status: proved
    depends_on:
    - Finset.abs_sum_le_sum_abs
    - Finset.sum_le_sum
    - mul_le_mul
    mathlib_imports:
    - Mathlib.Algebra.Order.BigOperators.Group.Finset
    notes: Single-channel (C_in=1), zero-bias case |conv w x n| <= w.length·Wmax·Xmax
      given |w[k]|<=Wmax, |x[m]|<=Xmax. Multi-channel adds C_in factor; bias adds
      |bias| by triangle inequality.
- type: equivalence
  property: SIMD matches scalar within ULP
  tolerance: 8.0
  applies_to: simd
  l4_status: not_applicable
  l4_reason: Runtime SIMD-vs-scalar floating-point accumulation-order equivalence
    within 8 ULP (FALSIFY-CV-004) is an IEEE-754/hardware property, not an
    analytic identity over the reals.
verification_summary:
  total_obligations: 5
  l2_property_tested: 5
  l3_kani_proved: 7
  l4_lean_proved: 3
  l4_sorry_count: 0
  l4_not_applicable: 2
  mathlib_imports: true
  lean_proved_obligations:
  - obligation: Output shape correctness
    theorem: Conv1D.conv1d_valid_length_eq_outLen
    file: ProvableContracts/Theorems/Conv1D/OutputLength.lean
  - obligation: Convolution linearity
    theorem: Conv1D.conv_linear
    file: ProvableContracts/Theorems/Conv1D/Linearity.lean
  - obligation: Output bounded by input and kernel
    theorem: Conv1D.conv_abs_le
    file: ProvableContracts/Theorems/Conv1D/Bound.lean
  lean_additional_theorems:
  - obligation: Shift equivariance (equations.invariants)
    theorem: Conv1D.conv_shift_eq
    file: ProvableContracts/Theorems/Conv1D/ShiftEquivariance.lean
  - obligation: Zero input yields zero output (homogeneity corner)
    theorem: Conv1D.conv_zero_eq
    file: ProvableContracts/Theorems/Conv1D/ZeroInput.lean
  notes: 3 of 5 obligations proved sorry-free in Lean 4 (Mathlib-backed) over the
    List/Signal model in ProvableContracts.Defs.Conv1D — output-shape, linearity,
    and output-bound. 2 are genuinely N/A at L4 (im2col-GEMM implementation
    equivalence at 1e-6 FP, and SIMD-vs-scalar 8-ULP), both runtime/IEEE
    properties covered by falsification tests + Kani. 3 proved + 2 N/A = 5 total
    ⇒ strict L4. Bonus theorems shift-equivariance and zero-input further
    corroborate the shift-invariant-linear-system structure.
kernel_structure:
  phases:
  - name: im2col
    description: Reshape input patches into column matrix
    invariant: Column matrix has K*C_in rows and L_out columns
  - name: gemm
    description: 'Matrix multiply: weight @ im2col columns'
    invariant: Output has C_out rows and L_out columns
  - name: add_bias
    description: Add bias per output channel
    invariant: Bias broadcast across spatial dimension
simd_dispatch:
  conv1d:
    scalar: conv1d_scalar
    avx2: conv1d_avx2
    ptx: conv1d_ptx
enforcement:
  output_shape:
    description: Output dimensions must follow convolution formula
    check: contract_tests::FALSIFY-CV-001
    severity: ERROR
  linearity:
    description: Convolution must be a linear operation
    check: contract_tests::FALSIFY-CV-002
    severity: ERROR
falsification_tests:
- id: FALSIFY-CV-001
  rule: Output shape
  prediction: Output length = floor((L + 2*pad - K) / stride) + 1
  test: proptest with random L, K, stride, pad combinations
  if_fails: Padding or stride calculation off by one
- id: FALSIFY-CV-002
  rule: Linearity
  prediction: '|conv(a*x+b*z) - a*conv(x) - b*conv(z)| < 1e-5'
  test: proptest with random inputs, scalars, kernel
  if_fails: Non-linear operation in convolution path
- id: FALSIFY-CV-003
  rule: im2col-GEMM equivalence
  prediction: '|conv_direct(x) - conv_im2col(x)| < 1e-6'
  test: proptest comparing direct loop vs im2col implementations
  if_fails: im2col indexing or GEMM accumulation differs
- id: FALSIFY-CV-004
  rule: SIMD equivalence
  prediction: '|conv1d_avx2(x) - conv1d_scalar(x)| < 8 ULP'
  test: proptest comparing scalar vs SIMD output
  if_fails: SIMD accumulation order differs
- id: FALSIFY-CV-005
  rule: Boundary - kernel size 1
  prediction: conv1d with K=1 is equivalent to pointwise linear transform
  test: proptest comparing conv1d(K=1) vs linear projection
  if_fails: Special case for K=1 not handled
- id: FALSIFY-CV-006
  rule: Identity kernel
  prediction: Conv with delta kernel and appropriate padding preserves input
  test: proptest with identity kernel centered
  if_fails: Padding or kernel indexing incorrect
kani_harnesses:
- id: KANI-CV-001
  obligation: CV-INV-001
  property: Output shape matches formula for small inputs
  bound: 8
  strategy: exhaustive
  solver: cadical
  harness: verify_conv1d_output_shape
- id: KANI-CV-002
  obligation: CV-LIN-001
  property: Convolution is linear for small inputs
  bound: 4
  strategy: stub_float
  solver: cadical
  harness: verify_conv1d_linearity
- id: KANI-CONV1D-003
  obligation: Output shape correctness
  property: Output shape correctness
  bound: 8
  strategy: exhaustive
- id: KANI-CONV1D-004
  obligation: Convolution linearity
  property: Convolution linearity
  bound: 8
  strategy: exhaustive
- id: KANI-CONV1D-005
  obligation: Direct conv matches im2col+GEMM
  property: Direct conv matches im2col+GEMM
  bound: 8
  strategy: exhaustive
- id: KANI-CONV1D-006
  obligation: Output bounded by input and kernel
  property: Output bounded by input and kernel
  bound: 8
  strategy: stub_float
- id: KANI-CONV1D-007
  obligation: SIMD matches scalar within ULP
  property: SIMD matches scalar within ULP
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-CV-001
  name: Conv1d Contract
  description: 1-dimensional convolution quality gate
  checks:
  - output_shape
  - linearity
  - im2col_equivalence
  - simd_equivalence
  pass_criteria: All 6 falsification tests pass + Kani harnesses verify
  falsification: Off-by-one in output length calculation
