# CRUX-J-18 — OpenCLAW encrypted credentials (system keychain)
# Resolved 2026-04-18: category J competitor = openclaw.ai.

metadata:
  id: CRUX-J-18
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "J — OpenCLAW Agent Orchestration"
  competitor: openclaw
  demand_score: 3
  intake_status: missing
  description: >
    OpenCLAW stores transport credentials (WhatsApp session, Telegram bot
    token, API keys) in the OS keychain (Keychain.app / libsecret / Windows
    Credential Manager), NOT plaintext on disk. Aprender parity: any apr
    credential store MUST prefer OS keychain; plaintext fallback only
    opt-in with an explicit flag. Overlaps with `apr profile` secret
    handling.
  openclaw_interpretation: openclaw-agent-resolved

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5.J'
  - https://openclaw.ai/
  - contracts/crux-J-02-v1.yaml
  - evidence/crux/openclaw/gaps.md

equations:
  keychain_default:
    formula: |
      store_credential(k, v) :=
        if keychain.available : keychain.set(k, v)
        elif user_opt_in_plaintext : file.write($HOME/.aprender/secrets, k, v)
        else : refuse_to_store
      load_credential(k) : first match from (keychain, plaintext_if_opted_in)
      invariant: default is never plaintext-on-disk
    domain: (credential key, value)
    codomain: persisted credential store
    invariants:
    - "OS keychain is default backend when available"
    - "plaintext-on-disk requires explicit user opt-in"
    - "`apr profile` or equivalent never prints the secret back to stdout"

falsification_tests:
- id: FALSIFY-CRUX-J-18-001
  rule: apr credential storage prefers OS keychain
  prediction: "apr docs reference Keychain / libsecret / Credential Manager integration"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "keychain OR libsecret OR credential manager aprender" --limit 1 --format json | grep -q '"matches"' || {
        echo "FAIL: no OS-keychain integration story documented" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-18 parity broken — apr MUST prefer OS keychain for credential storage
- id: FALSIFY-CRUX-J-18-002
  rule: plaintext fallback is opt-in, not default
  prediction: "documentation or code path for plaintext credentials is explicit opt-in"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "plaintext credentials opt-in OR --allow-plaintext-secret" --limit 1 --format json | grep -q '"matches"' || {
        echo "SKIP: plaintext-opt-in evidence not yet indexed" >&2
        exit 77
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-18 default invariant — plaintext-on-disk must NOT be default

proof_obligations:
- type: invariant
  property: "OS keychain is default"
- type: invariant
  property: "plaintext is opt-in"

verification_summary:
  total_obligations: 2
  proven: 0
  tested: 0
  status: draft

pmat_work_tracking:
  ticket_tag: crux-crux-j-18
  priority: medium
  auto_created: true
