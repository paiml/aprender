metadata:
  version: 1.0.0
  created: '2026-02-19'
  author: PAIML Engineering
  description: GELU kernel — Gaussian Error Linear Unit activation function
  references:
  - Hendrycks & Gimpel (2016) Gaussian Error Linear Units
equations:
  gelu:
    formula: GELU(x) = x * Phi(x) where Phi is the standard normal CDF
    domain: x in R
    codomain: GELU(x) in (-0.171, +inf)
    invariants:
    - GELU(0) = 0 (zero preservation)
    - GELU(x) >= 0 for x > 0 (non-negativity for positive inputs)
    - GELU(x) ~ x for large positive x (asymptotic linearity)
    - GELU is monotonically increasing for x > 0
    - GELU(-x) + GELU(x) ~ 0 near origin (odd-function symmetry)
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Gelu
  gelu_tanh_approx:
    formula: GELU_approx(x) = 0.5 * x * (1 + tanh(sqrt(2/pi) * (x + 0.044715 * x^3)))
    domain: x in R
    codomain: GELU_approx(x) in (-0.171, +inf)
    invariants:
    - '|GELU(x) - GELU_approx(x)| < 0.005 for all x'
    - GELU_approx(0) = 0 (zero preservation)
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Gelu_Tanh_Approx
proof_obligations:
- type: bound
  property: Non-negativity for positive inputs
  formal: x > 0 implies GELU(x) >= 0
  applies_to: all
  lean:
    theorem: Gelu.gelu_nonneg_of_pos
    module: ProvableContracts.Gelu
    status: proved
    depends_on:
    - Real.neg_one_lt_tanh
    - mul_nonneg
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.Trigonometric.Basic
    - Mathlib.Analysis.SpecialFunctions.Pow.Real
    notes: 'GELU(x) = (0.5·x)·(1 + tanh g(x)); for x>0 the left factor 0.5·x ≥ 0 and
      the right factor 1 + tanh g(x) > 0 since tanh > -1 (Real.neg_one_lt_tanh), so
      the product is ≥ 0 by mul_nonneg. Proved in Theorems/Gelu/GeluSign.lean.'
- type: monotonicity
  property: Monotonically increasing for positive inputs
  formal: x > y > 0 implies GELU(x) > GELU(y)
  applies_to: all
  lean:
    theorem: Gelu.gelu_strictMono_of_pos
    module: ProvableContracts.Gelu
    status: proved
    depends_on:
    - Real.sinh_pos_iff
    - Real.sinh_sub
    - Odd.pow_lt_pow
    - mul_lt_mul_of_pos_left
    - mul_lt_mul_of_pos_right
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.Trigonometric.Basic
    - Mathlib.Analysis.SpecialFunctions.Trigonometric.DerivHyp
    - Mathlib.Analysis.SpecialFunctions.Pow.Real
    notes: 'For 0<y<x both factors of GELU strictly increase and are positive. Inner
      g(t)=√(2/π)(t+0.044715·t³) increases (cube strictMono via Odd.pow_lt_pow, √>0);
      tanh strictMono (proved as tanh_strictMono from sinh(β−α)>0 via Real.sinh_pos_iff
      + Real.sinh_sub); left factor 0.5·t increases and is >0. Product of two positive
      increasing factors increases: (0.5·y)Rᵧ<(0.5·x)Rᵧ<(0.5·x)Rₓ. Theorems/Gelu/GeluMono.lean.'
- type: symmetry
  property: Odd-function symmetry around origin
  formal: GELU(-x) = -GELU(x) in the limit as the CDF approaches the step function
  applies_to: all
- type: equivalence
  property: SIMD matches scalar within ULP
  tolerance: 8.0
  applies_to: simd
- type: bound
  property: Tanh approximation accuracy
  formal: '|GELU(x) - GELU_approx(x)| < 0.005 for all x'
  applies_to: all
kernel_structure:
  phases:
  - name: compute_cdf
    description: Compute Phi(x) via standard normal CDF or tanh approximation
    invariant: output in (0, 1)
  - name: multiply
    description: Compute x * Phi(x)
    invariant: result >= 0 for x > 0
simd_dispatch:
  gelu:
    scalar: gelu_scalar
    avx2: gelu_avx2
    ptx: gelu_ptx
  gelu_tanh_approx:
    scalar: gelu_tanh_approx_scalar
    avx2: gelu_tanh_approx_avx2
    ptx: gelu_tanh_approx_ptx
enforcement:
  non_negativity:
    description: GELU(x) >= 0 for positive x
    check: contract_tests::FALSIFY-GE-001
    severity: ERROR
  monotonicity:
    description: GELU monotonically increasing for positive inputs
    check: contract_tests::FALSIFY-GE-002
    severity: ERROR
  approximation_accuracy:
    description: Tanh approximation within 0.005 of exact
    check: contract_tests::FALSIFY-GE-005
    severity: ERROR
falsification_tests:
- id: FALSIFY-GE-001
  rule: Non-negativity for positive inputs
  prediction: GELU(x) >= 0 for all x > 0
  test: proptest with random positive x
  if_fails: CDF computation underflow causing negative output
- id: FALSIFY-GE-002
  rule: Positive monotonicity
  prediction: GELU(x) > GELU(y) when x > y > 0
  test: proptest with sorted positive pairs
  if_fails: CDF saturation causing non-monotonicity
- id: FALSIFY-GE-003
  rule: Odd-function symmetry
  prediction: '|GELU(-x) + GELU(x)| < epsilon near origin'
  test: proptest with x in [-5, 5], check GELU(-x) + GELU(x) ~ 0
  if_fails: Asymmetric CDF approximation breaks odd-function property
- id: FALSIFY-GE-004
  rule: SIMD equivalence
  prediction: '|gelu_avx2(x) - gelu_scalar(x)| < 8 ULP'
  test: proptest comparing scalar vs SIMD output
  if_fails: SIMD exp/tanh approximation differs from scalar
- id: FALSIFY-GE-005
  rule: Tanh approximation accuracy
  prediction: '|GELU(x) - GELU_approx(x)| < 0.005 for all x'
  test: proptest with random x in [-10, 10]
  if_fails: Tanh approximation diverges from exact CDF-based GELU
- id: FALSIFY-GE-006
  rule: Boundary - large input stability
  prediction: '|GELU(x) - x| < 0.01 for x > 10 and |GELU(x)| < 0.01 for x < -10'
  test: proptest with large magnitude x
  if_fails: Numerical overflow in exp or tanh for extreme inputs
kani_harnesses:
- id: KANI-GE-001
  obligation: GE-BND-001
  property: GELU non-negative for positive inputs
  bound: 8
  strategy: stub_float
  solver: cadical
  harness: verify_gelu_non_negativity
- id: KANI-GE-002
  obligation: GE-APX-001
  property: Tanh approximation within 0.005 of exact GELU
  bound: 8
  strategy: stub_float
  solver: cadical
  harness: verify_gelu_approx_accuracy
- id: KANI-GELU_K-003
  obligation: Non-negativity for positive inputs
  property: Non-negativity for positive inputs
  bound: 8
  strategy: exhaustive
- id: KANI-GELU_K-004
  obligation: Monotonically increasing for positive inputs
  property: Monotonically increasing for positive inputs
  bound: 8
  strategy: exhaustive
- id: KANI-GELU_K-005
  obligation: Odd-function symmetry around origin
  property: Odd-function symmetry around origin
  bound: 8
  strategy: exhaustive
- id: KANI-GELU_K-006
  obligation: SIMD matches scalar within ULP
  property: SIMD matches scalar within ULP
  bound: 8
  strategy: exhaustive
- id: KANI-GELU_K-007
  obligation: Tanh approximation accuracy
  property: Tanh approximation accuracy
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-GE-001
  name: GELU Contract
  description: Gaussian Error Linear Unit activation quality gate
  checks:
  - non_negativity
  - monotonicity
  - odd_symmetry
  - simd_equivalence
  - approximation_accuracy
  pass_criteria: All 6 falsification tests pass + Kani harnesses verify
  falsification: Replace CDF with constant 0.5 to reduce GELU to 0.5*x
verification_summary:
  total_obligations: 5
  l2_property_tested: 5
  l3_kani_proved: 2
  l4_lean_proved: 2
  l4_sorry_count: 0
  l4_not_applicable: 1
  notes: |
    Analytic obligations proved in verified Lean (0 sorry), reusing the prior-wave
    tanh-approximation GELU definition ProvableContracts.Gelu.gelu:
      - Non-negativity for positive inputs -> Gelu.gelu_nonneg_of_pos
          x>0 ⟹ (0.5·x)≥0 and (1+tanh g(x))>0 (Real.neg_one_lt_tanh) ⟹ product ≥0.
      - Monotonically increasing for positive inputs -> Gelu.gelu_strictMono_of_pos
          0<y<x ⟹ both GELU factors positive and strictly increasing (cube strictMono,
          tanh strictMono via sinh(β−α)>0) ⟹ GELU(y)<GELU(x).
    Files: Theorems/Gelu/GeluSign.lean, Theorems/Gelu/GeluMono.lean
    (Defs/Gelu.lean + Theorems/Gelu/GeluZero.lean reused verbatim from the prior wave;
    gelu_zero — GELU(0)=0 — remains proved and underpins the sign argument.)
    Not applicable (runtime/hardware, no algebraic statement):
      - SIMD matches scalar within ULP (gelu_avx2 vs gelu_scalar within 8 ULP) is a
        fast-math rounding/hardware equivalence property, not an algebraic identity.
    Uncovered (analytic but NOT yet proven — contract stays below strict L4; honestly
    left UNPROVEN rather than marked N/A):
      - Odd-function symmetry "GELU(-x) = -GELU(x) in the limit as the CDF approaches
        the step function": a limit statement about the EXACT erf/Φ-based GELU. The
        tanh-approx GELU is not odd (GELU(x)+GELU(-x)=x·tanh g(x)≠0); discharging the
        step-function limit needs Φ→Heaviside reasoning we have not formalized.
      - Tanh approximation accuracy |GELU(x) − GELU_approx(x)| < 0.005: a numerical
        error bound between the tanh approximation and the exact erf-based GELU. The
        exact erf-GELU is not formalized and the bound needs interval/erf estimates we
        have not discharged (verified empirically by FALSIFY-GE-005).
    Strict leveling: l4_lean_proved(2) + l4_not_applicable(1) = 3 != 5, so this
    contract is HONESTLY L3 (not L4) — two of five obligations (odd-symmetry limit,
    tanh-approx accuracy) are analytic-but-unproven and left uncovered.
