      LIVE UNIVERSE does not satisfy the floor, because the floor is an
      absolute integer and never mentions the universe.
    if_fails: >-
      Coverage was bounded at neither joint. `covered_min` bounds rows against
      scope; nothing bounded scope against the surface, so 5 rows over 41 scope
      entries over 111 live subcommands satisfied every rule here forever, and
      a release adding twenty subcommands diluted the real ratio with the gate
      green. The ratio `in_scope / live_universe` is NOT used for exactly the
      reason FALSIFY-PARITY-027 exists: its denominator is written by the
      branch under test.
    limitation: >-
