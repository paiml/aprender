# The COMPETITIVE-PARITY LEDGER.
#
# WHY THIS FILE IS NOT A LIST OF WINS
# -----------------------------------
# The mandate as literally worded -- "every entry point proven equal or better"
# -- is a fabrication engine. A rule that admits only wins makes DELETING a
# losing comparison the cheapest compliant action. This repository has already
# done that, twice:
#
#   * StandardScaler measured wall-clock ratio 1.443 (apr 0.69x, a LOSS) on the
#     canonical Intel CI runner on 2026-06-15. The same day, commit d7e08043b
#     (squashed as edfa106d0, PR #2040, PMAT-733) deleted the test, the
#     contract and both nightly workflow steps -- 395 deletions -- and replaced
#     them with a YAML comment. `git log --all --diff-filter=D` over
#     crates/*/tests/beat_* and contracts/beat-* returns that ONE commit. It is
#     the only beat deletion in the history and it removed the only two losing
#     rows.
#
#   * "apr beats ollama 1.371x on decode" was withdrawn on 2026-07-31 (commit
#     6e569e16e, PR #2348) down to a measured 1.015-1.109x. docs/BEATS.md went
#     on publishing "1.371x WON, gate >=1.10x" for another THIRTEEN days,
#     because nothing compared the scoreboard to the contract.
#
# So the gate is INVERTED. It checks that a FRESH, DATED verdict EXISTS, from a
# closed vocabulary. It never checks that the verdict says BETTER.
#
#   BETTER / PARITY / WORSE / NOT_COMPARABLE / UNMEASURED
#
# WORSE and UNMEASURED are first-class and recordable. Four of the five seeded
# rows are non-wins and NONE is a BETTER, on purpose: a mechanism whose first
# rows are all wins is untested in the direction that matters.
#
# EVERY ROW EXPIRES, INCLUDING THE GOOD ONES
# ------------------------------------------
# `valid_until` is evaluated at CHECK TIME for every verdict class. An expired
# row degrades to UNMEASURED, which lowers __MEASURED__, which fails
# scripts/check_competitive_parity.sh. The first design bounded only UNMEASURED
# rows, which is backwards -- MEASURED is where both withdrawn claims lived, and
# beat-ollama-decode-throughput-speed-v1.yaml still carries
# `baseline_sourced_date: "2026-06-15"` against a baseline re-derived from a
# 2026-07-31 run. The one contract in the repo whose baseline WAS refreshed has
# a freshness field that lies about it.
#
# WHAT THE SEEDED ROWS ARE AND ARE NOT
# ------------------------------------
# All five are HISTORICAL NOTES promoted into the ledger, not fresh
# measurements. Every one of them fails a strict measurement protocol on at
# least one count -- named per row in `note:` -- and every one carries a
# short `valid_until` and an owner so the ledger degrades loudly instead of
# ageing quietly. Recording them as they are, gaps and all, is the point:
# before this file there was no machine-readable way to record a non-win, so
# every loss in this repo degraded into prose and then drifted.
#
# NOTHING HERE WAS RE-BENCHED FOR THIS COMMIT. The host is power-capped and
# runs a merge queue; an honest UNMEASURED beats an invented number.

metadata:
  version: "1.0.0"
  created: "2026-08-21"
  author: "aprender"
  kind: competitive-parity
  description: >-
    Competitive-parity ledger: one dated, verdict-bearing row per in-scope entry
    point. The gate checks that a fresh verdict EXISTS, never that it says
    BETTER, so recording a loss is compliant and deleting one is not.
  references:
    - "docs/BEATS.md - the public beat scoreboard"
    - "PR #2040 / commit d7e08043b (PMAT-733) - the StandardScaler beat deletion"
    - "PR #2348 / commit 6e569e16e - the 1.371x ollama withdrawal"
    - "Popper, Logic of Scientific Discovery (1959) - only falsifiable claims count"

proof_obligations:
  - type: invariant
    property: "every row names a competitor at an EXACT pinned version"
    formal: "forall r in rows. pinned(r.competitor_version)"
  - type: invariant
    property: "every row carries a verdict from the closed five-value vocabulary"
    formal: "forall r in rows. r.verdict in {BETTER,PARITY,WORSE,NOT_COMPARABLE,UNMEASURED}"
  - type: invariant
    property: "every row carries measured_on and valid_until, whatever its verdict"
    formal: "forall r in rows. iso_date(r.measured_on) and iso_date(r.valid_until)"
  - type: invariant
    property: "an expired row counts as UNMEASURED regardless of what it claims"
    formal: "forall r in rows. today > r.valid_until -> effective(r) = UNMEASURED"
  - type: invariant
    property: "deleting a row can only lower __MEASURED__, never raise it"
    formal: "measured(rows \\ {r}) <= measured(rows)"
  - type: invariant
    property: "the ledger records at least one non-win"
    formal: "exists r in rows. r.verdict != BETTER"

  - type: invariant
    property: "a row's validity window is BOUNDED, so freshness cannot be dated away"
    formal: "forall r in rows. days(r.valid_until - r.measured_on) <= 180"
  - type: invariant
    property: "MEASURED may fall only against a downgrade naming a row that STILL EXISTS"
    formal: "forall d in downgrades. exists r in rows. r.entry_point = d.entry_point and r.verdict = UNMEASURED"
  - type: invariant
    property: "the ratchet is keyed by entry point, so losing a SPECIFIC row is detectable at constant totals"
    formal: "forall e in rows@origin/main. exists r in rows. r.entry_point = e.entry_point"
  - type: invariant
    property: "every falsification test NAMES a command a reader can RUN (structural only - nothing here executes it)"
    formal: "forall t in falsification_tests. runner(t.test) or runner(t.test_harness)"

  # THE CLASS INVARIANT. Read the four above it as instances of what this one
  # forbids: each bounded one author-supplied date against ANOTHER
  # author-supplied date, and a difference bounds nothing when the same author
  # writes both ends.
  - type: invariant
    property: "NO date anywhere in this document is more than 180 days after TODAY"
    formal: "forall d in dates(document). days(d - today) <= 180"
  - type: invariant
    property: "a date recording a PAST event is not in the future"
    formal: "forall r in rows. r.measured_on <= today and forall g in downgrades. g.recorded_on <= today"
  - type: invariant
    property: "the escape valve COMES DUE: an overdue downgrade stops excusing its row"
    formal: "forall g in downgrades. today > g.recheck_by -> g not in emitted_downgrades"
  - type: invariant
    property: "a ratchet key cannot perturb the channel that carries it"
    formal: "forall r in rows. printable_ascii(r.entry_point) and trim(r.entry_point) = r.entry_point"

  # THE SECOND CLASS INVARIANT. Read the row/measured set rules as instances of
  # what this one forbids: every dimension except `rows` was a COUNT, and a
  # count is payable in the wrong currency. Relabelling both WORSE rows
  # NOT_COMPARABLE conserved __ROWS__, __MEASURED__ and __NON_WINS__ exactly
  # while the direction of two recorded losses left the tree.
  #
  # Note what is deliberately NOT asserted anywhere here: that a verdict is, or
  # stays, BETTER. A rule admitting only wins makes deleting a losing comparison
  # the cheapest compliant action, which is PMAT-733 itself. The VALUE is free;
  # the CHANGE is owned.
  - type: invariant
    property: "a row's DECLARED verdict may take any value, and may not CHANGE without a record naming the move"
    formal: "forall r in rows. r.verdict = verdict@origin/main(r.entry_point) or exists g in downgrades. g.entry_point = r.entry_point and g.from_verdict = verdict@origin/main(r.entry_point) and g.to_verdict = r.verdict and today <= g.recheck_by"
  - type: invariant
    property: "a transition record names BOTH ends of a real move"
    formal: "forall g in downgrades. (g.from_verdict = none) = (g.to_verdict = none) and g.from_verdict != g.to_verdict"
  - type: invariant
    property: "a record describes the state the row is ACTUALLY in"
    formal: "forall g in downgrades. exists r in rows. r.entry_point = g.entry_point and r.verdict = (g.to_verdict ?? UNMEASURED)"
  - type: invariant
    property: "the ledger may not owe more re-measurements than it holds measurements"
    formal: "|{g in downgrades : today <= g.recheck_by}| <= measured(rows, today)"
  # THE THIRD CLASS INVARIANT, and the one the four preceding rounds are all
  # instances of. Each of them bounded ONE author-writable quantity -- dates,
  # then row sets, then the baseline file, then the permission set -- and the
  # next round found the lever one level up, because:
  #
  #   ANY STATE THE AUTHOR WRITES AND THE GATE READS CAN BE MOVED IN THE SAME
  #   COMMIT.
  #
  # A sibling baseline file cannot audit the PR that edits it. `main` is
  # protected -- changing it takes a PR, a review and a passing gate -- so the
  # ledger as it exists at origin/main is the ONE prior state an author cannot
  # rewrite from inside their own commit. Every expected value below is DERIVED
  # from it rather than read from a file beside the thing under test.
  - type: invariant
    property: "the COMPARAND is the ledger on PROTECTED main, never a sibling file the same commit can edit"
    formal: "prior = eval(ledger@origin/main) and (exists ledger@origin/main or BOOTSTRAP) and BOOTSTRAP -> not exists any competitive-parity contract@origin/main"
  - type: invariant
    property: "the non-win floor has GIVE: an honest win costs a recorded transition and nothing more"
    formal: "non_wins(rows) >= non_wins(rows@main) - |{g in downgrades : today <= g.recheck_by and g.to_verdict = BETTER}|"
  - type: invariant
    property: "the coverage schedule is dated, strictly increasing, and always owes a FUTURE step"
    formal: "forall i. steps[i].by < steps[i+1].by and steps[i].covered_min < steps[i+1].covered_min and exists s in steps. s.by > today"
  - type: invariant
    property: "the coverage floor that has come due is MET, and a step may not be deleted, lowered or deferred against main"
    formal: "covered(rows) >= max{s.covered_min : s in steps and s.by <= today} and forall s in steps@main. exists t in steps. t.covered_min >= s.covered_min and t.by <= s.by"
  - type: invariant
    property: "the ratchet's COMPARAND is a commit, and its absence is an error rather than an empty set"
    formal: "comparand = origin/main (or its first parent when HEAD IS origin/main) and (readable(comparand) or RED)"

falsification_tests:
  - id: FALSIFY-PARITY-001
    rule: "competitor_version is pinned"
    prediction: >-
      Rewriting any row's competitor_version to "latest", "unpinned",
      "llama.cpp@main" or any prose without a digit makes `pv validate` emit
      PARITY-004 and exit non-zero.
    if_fails: >-
      The pin rule is not reachable from the contract, so the ledger's oracles
      drift under the claims exactly as `uv run --with scikit-learn` does today.
    test: "cargo test -p aprender-contracts --lib parity_004_"
  - id: FALSIFY-PARITY-002
    rule: "the verdict vocabulary is closed"
    prediction: >-
      A row with `verdict: MOSTLY_BETTER` fails to PARSE, and a row with no
      verdict at all emits PARITY-006.
    if_fails: >-
      The vocabulary is advisory, so a ledger can invent a verdict that no
      consumer knows how to weigh.
    test: "cargo test -p aprender-contracts --lib parity_006_ unknown_verdict_is_a_parse_error"
  - id: FALSIFY-PARITY-003
    rule: "freshness is required on EVERY verdict class"
    prediction: >-
      Deleting `valid_until` from a BETTER row -- not just from an UNMEASURED
      one -- emits PARITY-007. So does a valid_until on or before measured_on.
    if_fails: >-
      A win can be recorded with no expiry, which is precisely how the 1.371x
      ollama claim stayed published for eight weeks after it stopped
      reproducing.
    test: "cargo test -p aprender-contracts --lib parity_007_"
  - id: FALSIFY-PARITY-004
    rule: "freshness is evaluated at CHECK TIME"
    prediction: >-
      With today past a row's valid_until, `pv parity` reports that row's
      effective verdict as UNMEASURED and exits non-zero, whatever the file
      says.
    if_fails: >-
      Freshness is a schema decoration evaluated once at authoring time, so the
      ledger ages silently -- the failure mode of all 24 dated beat contracts,
      which are 48-71 days old with no expiry.
    test: "cargo test -p aprender-contracts --lib expiry_ an_expired_better_row_degrades_to_unmeasured"
  - id: FALSIFY-PARITY-005
    rule: "deletion is more expensive than recording a loss"
    prediction: >-
      Deleting the standard-scaler WORSE row lowers __MEASURED__ by one, and
      scripts/check_competitive_parity.sh exits non-zero against the ledger on
      protected `main`.
    if_fails: >-
      PMAT-733 repeats: the cheapest way to raise the ratio is to remove the
      comparison that lowers it.
    test: "bash scripts/check_competitive_parity.sh --self-test"
  - id: FALSIFY-PARITY-006
    rule: "registry: true buys no exemption on this kind"
    prediction: >-
      Adding `registry: true` to this contract's metadata emits PARITY-000, and
      `Contract::requires_proofs()` still returns true -- unlike a kernel
      contract, where the same flag silently rewrites the kind to `registry` and
      skips the provability invariant entirely.
    if_fails: >-
      The new kind inherits the escape hatch that leaves 481 in-tree contracts
      with `proven: 0`, and the ledger proves nothing.
    test: "cargo test -p aprender-contracts --lib registry_true_cannot_exempt_a_parity_contract"

  - id: FALSIFY-PARITY-007
    rule: "a row's validity WINDOW is bounded"
    prediction: >-
      A row whose valid_until is more than 180 days after its measured_on emits
      PARITY-011. The ceiling is exact on both sides: measured_on + 180d is
      accepted, +181d is refused.
    if_fails: >-
      Check-time freshness is only as strong as the dates it reads, so an
      unbounded expiry window is an exemption with a date on it and every row
      can be made permanently MEASURED for free.
    test: "cargo test -p aprender-contracts --lib parity_011_"
  - id: FALSIFY-PARITY-008
    rule: "a downgrade is machine-checkable and cannot launder a deletion"
    prediction: >-
      Filing a row UNMEASURED with a `downgrades:` entry naming it, a reason
      from the closed vocabulary, an owner and a bounded recheck_by VALIDATES.
      Removing the reason emits PARITY-013; writing prose in it fails to PARSE;
      naming an entry_point with no matching row emits PARITY-012; recording one
      beside a row that still claims a measurement emits PARITY-014.
    if_fails: >-
      Either the honest correction is mechanically forbidden (a ratchet that
      punishes increasing honesty produces dishonest ledgers -- the `apr code`
      row's own note says it should be UNMEASURED) or "record a reason" is
      dischargeable by writing a sentence, which makes deleting a row and
      filing paperwork cheaper than measuring.
    test: "cargo test -p aprender-contracts --lib downgrade_ parity_012_ parity_013_ parity_014_"
  - id: FALSIFY-PARITY-009
    rule: "the ratchet is a SET, not a count"
    prediction: >-
      Deleting one ledger row and adding a DIFFERENT one -- so __ROWS__,
      __MEASURED__ and __NON_WINS__ are all unchanged -- still fails
      scripts/check_competitive_parity.sh, which names the missing entry_point.
    if_fails: >-
      PMAT-733 is payable in the wrong currency: the StandardScaler 0.69x row
      can be deleted and paid for with a cheaper fabricated one while every
      total stays green.
    test: "bash scripts/check_competitive_parity.sh --self-test"
  - id: FALSIFY-PARITY-010
    rule: "a falsification entry NAMES a runnable command (STRUCTURAL CHECK ONLY)"
    prediction: >-
      Deleting the `test:` line from any falsification entry in this file emits
      PARITY-015, and so does replacing it with prose ("see the case table"):
      the first token must be a runner from a closed vocabulary (cargo / bash /
      sh / make / pv / apr, or a `./` path). `test_harness:` counts as a
      binding; whitespace does not.
    if_fails: >-
      `falsification_tests.len() >= proof_obligations.len()` is satisfiable by
      writing more YAML, so the obligation this kind cannot be exempted from is
      discharged with sentences.
    limitation: >-
      STATED PLAINLY, BECAUSE THE RULE'S NAME OVERSELLS IT. PARITY-015 checks
      that a binding EXISTS and has the SHAPE of a command. It does not run it,
      does not check that the named test exists, and does not check that it
      passes. A binding naming a test deleted last week satisfies this rule, so
      the provability invariant on this kind remains satisfiable by writing
      YAML -- what changed is only the price, from a sentence to something a
      reader can copy and run to discover the lie. Making it real means
      EXECUTING the bindings (`pv probar`-style) and failing on one whose
      command is absent or red. That is separate, larger work; it is recorded
      here as absent rather than implied by this rule's existence. Do not read
      "the provability invariant holds on this contract" as proof of anything
      beyond the obligation COUNT.
    test: "cargo test -p aprender-contracts --lib parity_015_"

  # ------------------------------------------------------------- THE CLASS
  # Three fixes preceded these, and every one introduced a NEW author-supplied
  # date bounded only against another author-supplied date. FALSIFY-PARITY-011
  # is the one that makes the whole family impossible; the rest are its
  # instances and its refinements.
  - id: FALSIFY-PARITY-011
    rule: "no date, in ANY field, may be far in the future OF TODAY"
    prediction: >-
      Writing "2099-12-31" into measured_on, valid_until, recorded_on or
      recheck_by makes the document fail to PARSE (LedgerDate refuses it at
      deserialization, naming the horizon) -- it is no longer a lint that a
      companion date can be moved to satisfy. Writing it into a field the
      schema has NEVER HEARD OF (`certified_on: "2099-12-31"`) parses and emits
      PARITY-016, naming the path. The horizon boundary is exact on both sides:
      today+180 is accepted, today+181 is refused. A date inside PROSE is not
      swept.
    if_fails: >-
      The family reopens. PARITY-011 bounds `valid_until - measured_on` and
      PARITY-013 bounds `recheck_by - recorded_on`, and BOTH anchors are
      author-supplied: measured_on 2099-01-01 with valid_until 2099-06-01 sits
      inside the 180-day window, so 2099 is still the exemption. Worse, the
      NEXT date field added is the next exemption, which is exactly how each of
      the previous three fixes created the next hole.
    test: "cargo test -p aprender-contracts --lib the_2099_exemption_is_now_a_parse_error_on_every_date_field parity_016_ the_future_horizon_boundary_is_exact_on_both_sides"
  - id: FALSIFY-PARITY-012
    rule: "a measurement cannot have been taken tomorrow"
    prediction: >-
      measured_on or recorded_on set to today+1 emits PARITY-017; today itself
      is accepted, so the boundary is `> today` and not `>= today`.
    if_fails: >-
      A row dated forward buys itself a full horizon of freshness on a
      measurement nobody has taken -- the uniform horizon alone permits
      measured_on today+179 with valid_until today+180.
    test: "cargo test -p aprender-contracts --lib parity_017_"
  - id: FALSIFY-PARITY-013
    rule: "the escape valve COMES DUE"
    prediction: >-
      A downgrade whose recheck_by has passed is reported OVERDUE, is no longer
      emitted as `__DOWNGRADE__=`, and makes `pv parity-ledger` exit non-zero.
      An unparseable recheck_by counts as overdue (fail closed). On the due
      date itself it is still in date.
    if_fails: >-
      recheck_by was validated only against recorded_on and NEVER against
      today, so the one move that lets __MEASURED__ fall was permanent the
      moment it was written -- and with the old MEASURED_MIN floor deleted
      outright, a series of downgrades could drain the ledger to zero measured
      rows while every gate stayed green. Both adversarial reviewers found this
      independently.
    test: "cargo test -p aprender-contracts --lib an_overdue_downgrade a_downgrade_with_an_unparseable_recheck_by"
  - id: FALSIFY-PARITY-014
    rule: "a ratchet key cannot perturb the channel that carries it"
    prediction: >-
      An entry_point containing a newline emits PARITY-002; so does one with
      surrounding whitespace. Independently, `pv parity-ledger` LENGTH-PREFIXES
      every key (`__ROW__=<bytes>:<key>`) and the ratchet drops any line whose
      declared length does not match, then cross-checks the NUMBER of key lines
      against the emitter's own __ROWS__ / __MEASURED__.
    if_fails: >-
      One fabricated row prints several well-formed key lines and satisfies a
      DELETED row's baseline key at constant totals -- the set ratchet defeated
      by precisely the move it exists to block. The previous emitter also
      `.trim()`ed on the way out, so the authored key and the compared key
      could differ.
    test: "cargo test -p aprender-contracts --lib parity_002_refuses"
  - id: FALSIFY-PARITY-015
    rule: "the RATCHET's prior state is not a file this commit can edit"
    prediction: >-
      There is no baseline file. `scripts/competitive_parity_baseline.txt` was
      deleted with `--update-baseline`, and `grep -rn competitive_parity_baseline
      scripts/` returns only prose explaining why. Every prior value -- the row
      set, the declared-measured set, each row's declared verdict, the non-win
      count, the scope set, the coverage schedule -- is produced by running the
      same `pv parity-ledger` over `git show <upstream>:<ledger>`.
    if_fails: >-
      Every refusal in the ratchet reads a value the same commit can rewrite.
      Round 4 tried to bind that file to git and the binding read {merge-base}
      UNION {every commit on the branch}, which INCLUDES HEAD -- so a single
      commit renaming the baseline, deleting the StandardScaler 0.69x row,
      dropping its keys and lowering NON_WINS_MIN 5 -> 4 exits 0.
    test: "bash scripts/check_competitive_parity.sh --self-test"
  - id: FALSIFY-PARITY-016
    rule: "the COMPARAND exists, or the run is RED"
    prediction: >-
      In a checkout with no upstream default-branch ref -- `actions/checkout` at
      `fetch-depth: 1`, which leaves no origin/main, no local main and a
      detached HEAD -- `cp_comparand_unreachable` returns true and the check
      exits 1 naming the absence. Restoring the ref returns it to rc=0. A
      shallow checkout that still HAS the ref and the commit behind it is NOT
      refused, because a gate that reds for a reason unrelated to its property
      trains people to re-run it.
    if_fails: >-
      A collapsed comparand is indistinguishable from "there is no prior
      ledger", which is the BOOTSTRAP branch -- the strongest possible pass --
      produced by a `fetch-depth:` line in a different file. This is FATAL A
      arriving through the checkout configuration instead of through the file.
    test: "bash scripts/check_competitive_parity.sh --self-test"
  - id: FALSIFY-PARITY-017
    rule: "the comparand survives the OWN-COMMIT evasion, by construction"
    prediction: >-
      Committing the change no longer normalises it, whatever the branch looks
      like: the comparand is a ref on the protected branch, and nothing an
      author does inside their own PR moves it. Deliberately NOT unioned with
      the branch's own commits -- doing so ADDS prior verdicts, and an added
      prior verdict is a PERMISSION, so a two-commit branch could grant itself a
      relabel in commit 1 and take it in commit 2.
    if_fails: >-
      Judging against HEAD, or against anything HEAD contributes to, is defeated
      by putting the change in its own commit -- which is exactly how FATAL A
      was demonstrated end to end.
    test: "bash scripts/check_competitive_parity.sh --self-test"
  - id: FALSIFY-PARITY-018
    rule: "a VERDICT CHANGE is not free"
    prediction: >-
      Re-declaring `lib:aprender-core::StandardScaler::fit_transform` from
      WORSE to NOT_COMPARABLE -- which leaves __ROWS__, __MEASURED__ and
      __NON_WINS__ all unchanged -- fails scripts/check_competitive_parity.sh
      with UNRECORDED VERDICT CHANGE. There is no way to absorb it: the `from`
      end is read from the ledger on protected `main`, and the only
      re-baselining verb this guard ever had (`--update-baseline`) was deleted
      with the baseline file. Adding a `downgrades:` entry with from_verdict: WORSE,
      to_verdict: NOT_COMPARABLE, a reason, an owner and a bounded recheck_by
      clears both. Nothing anywhere requires the verdict to be BETTER.
    if_fails: >-
      The second-cheapest PMAT-733: relabel both recorded losses
      NOT_COMPARABLE, every total conserved, both losses gone. Only the
      DIRECTION of the result leaves the tree, and the direction is what
      PMAT-733 was about.
    test: "cargo test -p aprender-contracts --lib parity_019_"
  - id: FALSIFY-PARITY-019
    rule: "a transition record must DESCRIBE the move it excuses"
    prediction: >-
      A record naming only `to_verdict`, or only `from_verdict`, or with
      from_verdict == to_verdict, emits PARITY-019 and `pv parity-ledger`
      exits non-zero. A record whose `to_verdict` differs from the row's
      declared verdict emits PARITY-014.
    if_fails: >-
      One open-ended record launders every future relabelling of that row: a
      record that names no direction is a standing permission to change rather
      than a record of a change.
    test: "cargo test -p aprender-contracts --lib parity_019_"
  - id: FALSIFY-PARITY-020
    rule: "the excuse budget is bounded, not just each excuse's LIFETIME"
    prediction: >-
      A ledger holding a fresh, owned, in-date, closed-vocabulary downgrade for
      MORE rows than it has measured rows fails `pv parity-ledger` with the
      excuse-budget error, even though every individual record validates and
      no row has expired.
    if_fails: >-
      `is_overdue` bounds how LONG one excuse lasts and nothing bounds how MANY
      are outstanding. A record per row drives __MEASURED__ to zero with every
      rule satisfied and every gate green: each record impeccable, the ledger
      as a whole no longer measuring anything.
    test: "cargo test -p aprender-contracts --lib excuse_budget"

  # -------------------------------------------------- THE COMPARAND, ROUND 5
  - id: FALSIFY-PARITY-021
    rule: "the comparand is the ledger on PROTECTED main, not a sibling file"
    prediction: >-
      In a sandbox repo whose origin/main carries a ledger, deleting a row from
