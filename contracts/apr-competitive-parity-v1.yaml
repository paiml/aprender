    test: "cargo test -p aprender-contracts --lib parity_022_"

parity:
  scope: >-
    In-scope entry points are enumerated at RUNTIME from a SHA-pinned `apr`
    binary plus the workspace's bin targets; the frozen list is
    scripts/competitive_parity_scope.txt. The list may only shrink when the
    entry point has actually left the live enumeration AND a `removals:` record
    names it -- absence alone was an excuse the branch wrote for itself, since
    the branch builds the binary the enumeration comes from. It must also MEET
    the `scope_min` step that has come due, so the surface widens rather than
    merely refusing to narrow. Rows may also name a library surface (`lib:`
    prefix) that no subcommand exposes -- two of the five seeds are exactly
    that, and pretending otherwise would have meant dropping them.

  # THE COVERAGE RATCHET.
  #
  # THE QUESTION NOBODY WAS ANSWERING. Five rows, over 41 scope entries, over
  # 111 live subcommands. Every rule above makes the rows that EXIST honest --
  # pinned versions, closed vocabularies, bounded dates, owned transitions --
  # and not one of them makes a row EXIST. So "competitive parity" was being
  # asserted over ~4.5% of the CLI surface, permanently, with every gate green.
  # That is the same failure as a fabricated row, reached by omission instead of
  # by invention, and it is cheaper: it requires no edit at all.
  #
  # THE DECISION, and it is a decision rather than a measurement.
  #
  #   COVERED = the number of DISTINCT in-scope entry points carrying at least
  #   one row. A dated, strictly increasing schedule of floors lives HERE, in
  #   the contract, where a reviewer meets it beside the rows it governs. A step
  #   comes due on its date (PARITY-024). The schedule must always contain a
  #   step still in the future (PARITY-023), so it can never be set once at the
  #   achievable value and left -- which is how a coverage floor normally dies.
  #
  # Landable TODAY at what the ledger already has: the first step is dated the
  # day this landed at covered_min 4, which the five rows meet (two of them
  # share the `apr run` scope key). A gate nobody can pass gets disabled, and a
  # disabled gate is worse than none because it is counted.
  #
  # NOT AUTHOR-WRITABLE IN THE SAME COMMIT, which is the whole point of round 5:
  # the schedule is read back from the ledger on protected `main` and a step may
  # not be deleted, lowered, or dated further out than `main` has it. Raising it
  # is free; that asymmetry is the ratchet.
  coverage:
    rationale: >-
      An ABSOLUTE COUNT of distinct covered entry points, on a dated schedule,
      rather than a ratio. A ratio (covered / in_scope) tracks scope growth by
      itself, which is its appeal -- but its denominator is a quantity the same
      author controls, so a ratio floor has TWO levers on it and the second one
      is the exact move (shrinking the denominator) that PMAT-733 is about. An
      integer has one lever, is readable without arithmetic, and cannot drift by
      a hundredth of a point a release. The schedule is dated rather than
      constant because a constant floor set at what the ledger already holds is
      inert on the day it lands and inert forever after; PARITY-023 makes the
      ledger permanently owe a future increase, and the 180-day horizon on every
      date in this document caps how far that debt can be pushed out. The floor
      lives in the contract rather than in a sibling file because a sibling file
      the author edits in the same commit cannot audit that commit -- the root
      cause this whole round exists to remove.
    dissent: >-
      FOUR OBJECTIONS, RECORDED RATHER THAN ANSWERED AWAY. (1) ANSWERED IN ROUND
      5, and the original objection is kept below so the answer can be read
      against it. As written, an absolute `covered_min` does NOT track scope
      growth: 8 covered against 41 in-scope is 19.5%, and if the CLI grows to 60
      in-scope entry points the same 8 is 13% with the gate still green. The
      mitigation offered at the time was partial -- the scope set is shrink-never
      against `main`, and every run prints `entry points in scope`, so the
      dilution is visible without blocking. That was not enough, because it left
      the SECOND JOINT (scope against the live surface) unbounded, and 5 rows
      over 41 scope entries over 111 live subcommands is bounded at neither end.
      `scope_min` on the same steps closes it: the audited surface itself has a
      dated, ratcheting floor. It is an absolute count for a REASON SHARPER than
      the one at the first joint -- the obvious ratio here is
      `in_scope / live_universe`, and the live universe is enumerated from a
      binary built FROM THE BRANCH, so a ratio against it would be payable by
      DELETING subcommands. What remains genuinely open is the RATE: nothing
      mechanical says 41 -> 55 is the right slope, and a renewal that rises
      trivially is refused by nothing here. (2) The numbers 4 -> 8 are a JUDGEMENT,
      not a capacity measurement. Nobody has measured what an honest row costs
      to produce, so "double it in six months" is an assertion. It was chosen
      because it is landable today and because a step that does not at least
      double is indistinguishable from no step. If it proves unreachable, the
      honest response is UNMEASURED rows with owners and bounds -- which this
      ledger explicitly permits and which costs no benchmark -- and NOT lowering
      the step, which the guard refuses against `main`. (3) The schedule is
      renewable every 180 days, and renewal is exactly where the ratchet can be
      argued down: the guard refuses a step that is deleted, lowered, or dated
      later than `main` has it, but it cannot refuse a NEW step that rises only
      trivially. The RATE of increase is therefore a review question, not a
      mechanical one. Stated plainly rather than implied by the rule's
      existence. (4) The deepest objection: coverage is not measurement. Forty-
      one rows all reading UNMEASURED would be 100% covered and would measure
      nothing. That is bounded only indirectly -- the declared-measured set is
      shrink-never against `main`, and the excuse budget refuses a ledger owing
      more re-measurements than it holds measurements -- so a ledger CAN grow
      wide and shallow. A measured-coverage floor is the obvious next control
      and is recorded here as ABSENT work rather than pretended into existence.
    # BOTH JOINTS, ON ONE SCHEDULE.
    #
    #   covered_min : distinct in-scope entry points that must carry a ROW.
    #                 Bounds rows against scope.
    #   scope_min   : entry points that must BE in scope. Bounds scope against
    #                 the live surface -- the joint that was open until round 5.
    #
    # Both are landable on the day they land: 5 rows collapse to 4 distinct
    # scope keys (two share `apr run`) and the scope file holds 41 entries, so
    # the step dated today is met exactly as it stands. A gate nobody can pass
    # on the day it lands gets disabled, and a disabled gate is worse than an
    # absent one because it is counted.
    #
    # Both are ABSOLUTE COUNTS, never ratios: `covered / in_scope` and
    # `in_scope / live_universe` both have denominators the same author writes,
    # and the second one is written by the CLI source itself, so a ratio floor
    # there is satisfiable by deleting a subcommand. That is the whole of round
    # 5's fatal 2 arriving by another route, and an integer has no denominator
    # to shrink.
    steps:
      - by: "2026-08-21"
        covered_min: 4
        scope_min: 41
      - by: "2027-02-14"
        covered_min: 8
        scope_min: 55

  # RECORDED DOWNGRADES.
  #
  # This block is the escape valve that keeps honesty affordable, and it is the
  # narrow one. `MEASURED_MIN=4` with no give mechanically FORBADE the honest
  # correction below: the `apr code` row's own note said it should be
  # UNMEASURED and filing it that way would have breached the floor. A ratchet
  # that punishes increasing honesty produces dishonest ledgers, which is
  # PMAT-733 approached from the opposite side.
  #
  # What keeps it narrow: `entry_point` must match a row that is STILL PRESENT
  # (PARITY-012), so deleting a row can never be dressed up as a downgrade;
  # `reason` is a serde enum, so an invented reason fails to PARSE rather than
  # lint; `owner` and a bounded `recheck_by` mean a downgrade is a debt with a
  # due date rather than a quiet retirement. The SET of rows may never shrink.
  # Only the set of MEASURED rows may, and only against this record.
  #
  # IT IS ALSO THE VERDICT-TRANSITION RECORD, and that generalisation closed the
  # last free lever. Every dimension except `rows` was still a COUNT, so
  # re-declaring BOTH WORSE rows as NOT_COMPARABLE left __ROWS__=5,
  # __MEASURED__=3 and __NON_WINS__=5 bit-for-bit identical while the
  # StandardScaler 0.69x and the Lasso ~19x losses became "the competitor has no
  # counterpart" -- every total conserved, the DIRECTION of the result gone, at
  # rc=0. That is PMAT-733 paid for in a currency nothing counted.
  #
  # The fix is NOT to gate on the verdict's VALUE. This gate never checks that a
  # verdict says BETTER, because a rule that admits only wins makes deleting a
  # losing comparison the cheapest compliant action -- that inversion is the
  # whole design. What is gated is the TRANSITION: the value stays completely
  # unconstrained, and CHANGING it stops being free. A declared verdict outside
  # the set the committed baseline records for that row needs a record here with
  # `from_verdict` / `to_verdict` naming the exact move (PARITY-019), plus the
  # same reason / owner / bounded recheck_by every downgrade already carries.
  #
  # One record type, not two beside each other: two mechanisms would mean two
  # vocabularies, two expiry rules and two sets of paperwork, of which exactly
  # one would be kept current.
  #
  # AND THERE IS A BUDGET (PARITY-020). `recheck_by` bounds how LONG one excuse
  # lasts; nothing bounded how MANY may be outstanding, and the two are
  # independent -- a fresh, owned, in-date, closed-vocabulary record for EVERY
  # row drives __MEASURED__ to zero with every rule satisfied and every gate
  # green. So: a ledger may not owe more re-measurements than it holds
  # measurements. It scales with the ledger and has give in it (paying a debt
  # buys the capacity to take another), which a constant floor does not -- and a
  # constant floor is exactly what made the honest `apr code` correction below
  # mechanically impossible in the first place.
  downgrades:
    - entry_point: "apr code"
      reason: RECEIPT_MISSING
      from_verdict: WORSE
      to_verdict: UNMEASURED
      owner: "pillar-5-code"
      recorded_on: "2026-08-21"
      recheck_by: "2026-11-30"
      detail: >-
        The receipt cited by BOTH contracts/beat-claude-code-parity-v1.yaml and
        docs/BEATS.md -- evidence/phase-5/arena-scores.json -- does not exist in
        this repository (`find . -name arena-scores.json` returns nothing), and
        no date is attached to the Arena run in either file. The number
        (teacher 1/5, student 0/5) is remembered, not receipted, and it lives in
        a companion repo that nothing here can re-run. Clearing this means
        vendoring the receipt with a date attached, or re-running the Arena in
        this tree. Until then the row stays, its direction stays on the record
        in `note:`, and it counts as what it is: UNMEASURED.

  rows:
    # ---------------------------------------------------------------- PARITY
    - entry_point: "apr run --gpu"
      competitor: "ollama"
      competitor_version: "0.12.4"
      invocation_apr: >-
        APR_BIN=$(. scripts/apr_bin.sh) cargo test -p aprender-serve --test
        beat_ollama_decode_throughput_speed -- --ignored --nocapture
        (slope tok/s = (384-128)/(ms@384 - ms@128)*1000, median of 7)
      invocation_competitor: >-
        ollama run qwen2.5-coder:1.5b-instruct-q4_K_M "<prompt>" --verbose,
        parse `eval rate`, median of 5, same session and same GPU
      dimension: "decode_tok_s_ratio_apr_over_ollama"
      verdict: PARITY
      measured_on: "2026-07-31"
      valid_until: "2026-10-31"
      owner: "pillar-4-serve"
      evidence: "contracts/beat-ollama-decode-throughput-speed-v1.yaml + commit 6e569e16e (PR #2348)"
      note: >-
        1.015-1.109x on lambda RTX 4090 sm_89, inside noise, so PARITY not
        BETTER. Four dated medians on one host with the SAME GGUF both sides:
        2026-06-15 412.3/300.7 = 1.371x; 2026-07-29 332.7/299.9 = 1.109x;
        2026-07-31 342.4/328.6 = 1.042x; 2026-07-31 318.2/313.5 = 1.015x. The
        ollama column reproduces across six weeks (300.7/299.9/328.6/313.5),
        which is what makes the apr-side drift attributable. The 1.371x is
        formally WITHDRAWN as unreproducible, not reattributed. GAPS, stated:
        (a) no receipt artifact exists -- all four numbers live as prose in the
        contract, the harness header and the commit message; `git show --stat
        6e569e16e` touches 2 files and no evidence/ dir; (b) the ollama VERSION
        was never captured -- 0.12.4 above is the build pinned going forward,
        NOT proven to be the one that produced these numbers, which is why this
        row expires in ten weeks; (c) ci_gating.mode is `manual` (no NVIDIA CI
        runner), so nothing re-measures it on a schedule.

    # ----------------------------------------------------------------- WORSE
    # The canonical seed. Recording it re-instates precisely what PMAT-733
    # deleted, which is the entire point of the inversion.
    - entry_point: "lib:aprender-core::StandardScaler::fit_transform"
      competitor: "scikit-learn"
      competitor_version: "1.9.0"
      invocation_apr: >-
        git show d7e08043b^:crates/aprender-core/tests/beat_sklearn_scaler_speed.rs
        (the harness no longer exists on main; it must be recovered from the
        deleting commit) -- make_regression(n=200000, d=50, noise=0.1, seed=42),
        median of 5 after warmup, same host / same run / same data
      invocation_competitor: >-
        uv run --with 'scikit-learn==1.9.0' --with numpy python3 -c
        "StandardScaler().fit_transform(X)" on the identical array
      dimension: "wall_clock_ratio_apr_over_sklearn"
      verdict: WORSE
      measured_on: "2026-06-15"
      valid_until: "2026-09-30"
      owner: "pillar-1-sklearn"
      evidence: "commit d7e08043b (squashed edfa106d0, PR #2040) - the deletion commit's own message"
      note: >-
        apr 175.4 ms vs sklearn 121.5 ms, ratio 1.443 => apr 0.69x, on the
        canonical Intel CI runner. The SAME task on a 16-core dev box measured
        0.515 (apr 1.94x, a WIN) -- a ~2.8x relative swing between two x86
        hosts, which is why a single scalar verdict must carry its host. GAPS,
        stated: the number survives only in a commit message (no receipt); the
        deleted harness shelled `uv run --with scikit-learn` with NO version
        constraint, so 1.9.0 above is the pin going FORWARD and the build that
        produced 121.5 ms is unrecoverable; n=5. This row is a HISTORICAL NOTE
        with a re-measurement obligation, not a fresh measurement -- it expires
        2026-09-30 and re-measuring it means restoring the harness from
        d7e08043b^ and running it on the Intel runner.

    - entry_point: "apr code"
      competitor: "Claude Code"
      competitor_version: "CCPA arena run @ paiml/claude-code-parity-apr M234"
      invocation_apr: >-
        apr code <fixture> -- CCPA live Arena, 5 real GitHub-issue fixtures,
        scored by oracle-pass rate
      invocation_competitor: >-
        claude (teacher) on the identical 5 fixtures, same Arena harness, same
        oracle
      dimension: "oracle_pass_rate"
      verdict: UNMEASURED
      measured_on: "2026-06-25"
      valid_until: "2026-09-30"
      owner: "pillar-5-code"
      evidence: "contracts/beat-claude-code-parity-v1.yaml (kind: pattern, status TRACKING)"
      note: >-
        claude teacher 0.20 (1/5); `apr code` student 0.00 (0/5). The only
        recorded loss in the repo that is NOT a speed comparison, and the only
        one on a live P0 entry point. Leading hypothesis on record (V1_004,
        M286-M294): the Qwen-Coder finetune family emits 0 tool_calls while
        non-Coder Qwen3-30B-A3B-Instruct does, so the gap is
        agentic-emission/model-family, not code quality. GAPS, stated, and they
        are severe: the receipt cited by BOTH the contract and docs/BEATS.md --
        evidence/phase-5/arena-scores.json -- DOES NOT EXIST in this repo
        (`find . -name arena-scores.json` returns nothing); the measurement and
        its enforcement live in the companion repo, so nothing here can re-run
        or re-verify it; and no date is attached to the Arena run in either file
        (2026-06-25 above is the contract's created date, used as a
        conservative lower bound). Under a strict protocol this is
        UNMEASURED-with-a-remembered-number, and that is now what it is
        filed as. It was filed WORSE until the ratchet stopped forbidding the
