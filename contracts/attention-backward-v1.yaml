name: attention-backward
version: "1.0.0"
scope: "crates/aprender-train/src/"

description: |
  Backward pass for scaled dot-product attention: dQ, dK, dV from dO. Tiled for memory efficiency.

equations:
  gradient_correctness:
    description: "∀ head: |tiled_dQ - naive_dQ| < ε"
    formula: "∀ head: |tiled_dQ - naive_dQ| < ε"

  causal_mask:
    description: "∀ i<j: attention_weight[i,j] == 0 (causal masking preserved in backward)"
    formula: "∀ i<j: attention_weight[i,j] == 0 (causal masking preserved in backward)"

