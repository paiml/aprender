metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 14: Provable Contracts
  contract: apr-book-ch14
  status: enforced
  title: "Provable Contracts"
  part: IV
  example: ch14_contracts
  arxiv_citations: ["1907.09356"]

preconditions:
  - "cargo build -p aprender-core --example ch14_contracts succeeds"
  - "All arXiv IDs in citation table are valid"
  - "Zero legacy names in chapter text"
postconditions:
  - "Example produces correct output"
  - "All assert!() in example pass"
falsification:
  - condition: "cargo run -p aprender-core --example ch14_contracts exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Section without arXiv citation"
    severity: P0
    action: reject_chapter
  - condition: "Legacy name appears in chapter text"
    severity: P0
    action: reject_chapter
  - condition: "Oracle --explain output contradicts chapter claim"
    severity: P0
    action: reject_chapter
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH14-001
    description: "Chapter 14's example ch14_contracts builds and runs to exit 0, with its 4 assertion(s) holding"
    test: "cargo run -p aprender-core --example ch14_contracts"
    prediction: "Exit 0. book-contracts 'Chapter Examples Run' runs the same command for all 27 chapters"
    if_fails: "An API the chapter teaches changed or regressed, so the example panics on an assertion or no longer compiles"
