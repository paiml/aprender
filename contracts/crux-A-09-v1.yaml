metadata:
  id: CRUX-A-09
  version: "1.0.0-draft"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Intake & Discovery"
  competitor: ollama
  demand_score: 5  # 1..5, critical priority in pmat work
  intake_status: partial
  description: >
    Local registry list/show/rm. Competitor triad `ollama list` / `ollama show`
    / `ollama rm` enumerates, inspects, and removes models in Ollama's local
    blob store. Aprender parity: `apr ls`, `apr show NAME`, `apr rm NAME` MUST
    operate on the aprender local registry (~/.aprender/models/ by default)
    with atomic index updates, JSON output for automation, and a --dry-run
    mode for destructive ops. Refs:
    https://github.com/ollama/ollama/blob/main/docs/api.md#list-local-models ;
    https://github.com/ollama/ollama/blob/main/docs/api.md#show-model-information ;
    https://github.com/ollama/ollama/blob/main/docs/api.md#delete-a-model

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/huggingface/transformers — Trainer
  - docs.python.org — packaging, signatures, supply chain
equations:
  list_json_schema:
    formula: |
      apr ls --json:
        stdout is JSON array [M_1, ..., M_n] where each M_i has keys:
          name: string (short name or canonical path)
          size_bytes: u64 >= 0
          sha256: string (64 hex chars)
          last_used: string (RFC3339 timestamp) OR null
          quant: string ∈ {"f32","f16","q8_0","q4_k_m","q6_k",...}
        exit_code == 0
    domain: local model registry state
    codomain: JSON array
    invariants:
    - "Every registered model appears exactly once"
    - "size_bytes sums to total disk usage under the registry root"
    - "sha256 matches on-disk file digest"

  show_json_schema:
    formula: |
      apr show NAME --json:
        stdout is JSON object with at minimum:
          arch: string (e.g. "qwen2", "llama", "mistral")
          params: u64 > 0 (parameter count)
          chat_template: string (Jinja2 template) OR null
          tensor_histogram: object {<qtype>: u64} (count per quant type)
          size_bytes: u64 > 0
        exit_code == 0 iff NAME exists in registry
    domain: registry entry NAME
    codomain: JSON object
    invariants:
    - "sum(tensor_histogram.values()) == total_tensor_count"
    - "arch is populated from GGUF/APR metadata, never inferred"
    - "Unknown NAME exits non-zero with 'model not found' message"

  rm_atomic_and_complete:
    formula: |
      apr rm NAME:
        step 1: acquire registry write lock
        step 2: remove ALL files under registry_root/NAME/**
        step 3: update index.json removing NAME entry
        step 4: release lock
        all-or-nothing: on any failure, registry state is unchanged
      apr ls --json after apr rm NAME:
        NAME ∉ [m.name for m in output]
    domain: (registry_state, NAME)
    codomain: registry_state' with NAME removed
    invariants:
    - "apr rm NAME is atomic: success means both files AND index are updated"
    - "apr rm NAME --dry-run prints what WOULD be removed and leaves state untouched"

falsification_tests:
- id: FALSIFY-CRUX-A-09-001
  rule: apr ls --json returns well-typed array
  prediction: "apr ls --json output validates against the schema"
  test: |
    OUT=$(apr ls --json 2>&1)
    echo "$OUT" | jq -e 'type == "array"' >/dev/null || { echo "FAIL: not an array" >&2; exit 1; }
    # Every entry has required keys with correct types
    echo "$OUT" | jq -e 'all(.[];
      (.name | type == "string") and
      (.size_bytes | type == "number") and
      (.sha256 | test("^[0-9a-f]{64}$")) and
      (.quant | type == "string")
    )' >/dev/null || { echo "FAIL: schema violation" >&2; exit 1; }

  if_fails: rule 'apr ls --json returns well-typed array' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-A-09-002
  rule: apr show NAME --json returns tensor histogram + chat_template + arch
  prediction: "apr show on a pulled model returns schema-valid JSON"
  test: |
    # TODO: ensure at least one model is in registry before this test
    NAME=$(apr ls --json | jq -r '.[0].name // empty')
    [ -n "$NAME" ] || { echo "SKIP: no model in registry" >&2; exit 77; }
    OUT=$(apr show "$NAME" --json 2>&1)
    echo "$OUT" | jq -e '
      (.arch | type == "string") and
      (.params | type == "number" and . > 0) and
      (.tensor_histogram | type == "object") and
      (.size_bytes | type == "number" and . > 0)
    ' >/dev/null || { echo "FAIL: show --json schema violation" >&2; exit 1; }

  if_fails: rule 'apr show NAME --json returns tensor histogram + chat_template + arch' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-A-09-003
  rule: apr rm NAME removes files and updates index atomically
  prediction: "after apr rm NAME, files are gone AND index does not list NAME"
  test: |
    # TODO: set up a disposable test model in the registry
    NAME="${APR_TEST_MODEL:-apr-rm-test-model}"
    apr pull "hf://paiml/qwen2.5-coder-7b-apache-q4k-v1" --as "$NAME" 2>/dev/null || true
    apr ls --json | jq -e --arg n "$NAME" 'any(.name == $n)' >/dev/null || { echo "SKIP: test model not present" >&2; exit 77; }
    apr rm "$NAME"
    # Index check
    apr ls --json | jq -e --arg n "$NAME" 'all(.name != $n)' >/dev/null || { echo "FAIL: index still lists NAME" >&2; exit 1; }
    # Filesystem check
    REG_ROOT="${APR_REGISTRY_ROOT:-$HOME/.aprender/models}"
    [ ! -e "$REG_ROOT/$NAME" ] || { echo "FAIL: files still present on disk" >&2; exit 1; }

  if_fails: rule 'apr rm NAME removes files and updates index atomically' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-A-09-004
  rule: apr rm NAME --dry-run prints plan without acting
  prediction: "--dry-run prints what would be removed and leaves registry unchanged"
  test: |
    NAME=$(apr ls --json | jq -r '.[0].name // empty')
    [ -n "$NAME" ] || { echo "SKIP: no model in registry" >&2; exit 77; }
    BEFORE=$(apr ls --json | jq 'length')
    OUT=$(apr rm "$NAME" --dry-run 2>&1)
    AFTER=$(apr ls --json | jq 'length')
    [ "$BEFORE" = "$AFTER" ] || { echo "FAIL: --dry-run modified state ($BEFORE → $AFTER)" >&2; exit 1; }
    echo "$OUT" | grep -iE 'would (remove|delete)|dry.?run' || {
      echo "FAIL: --dry-run did not print plan" >&2
      exit 1
    }

  if_fails: rule 'apr rm NAME --dry-run prints plan without acting' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-A-09-005
  rule: apr show on unknown name exits non-zero
  prediction: "apr show does-not-exist exits non-zero with explanatory message"
  test: |
    OUT=$(apr show __definitely_not_a_real_model__ 2>&1 || true)
    RC=$?
    [ "$RC" -ne 0 ] || { echo "FAIL: unknown model exit 0" >&2; exit 1; }
    echo "$OUT" | grep -iE 'not found|unknown|no such' || {
      echo "FAIL: no explanatory error message" >&2
      exit 1
    }

  if_fails: rule 'apr show on unknown name exits non-zero' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: invariant
  property: "apr ls --json emits a JSON array where every element has {name, size_bytes, sha256, quant} with correct types"
- type: invariant
  property: "apr show NAME --json emits {arch, params, tensor_histogram, size_bytes} and exits non-zero for unknown NAME"
- type: invariant
  property: "apr rm NAME is atomic: registry index and filesystem are updated together or not at all"
- type: invariant
  property: "apr rm NAME --dry-run prints the removal plan without mutating registry state"
- type: invariant
  property: "sha256 values reported by apr ls match on-disk file digests"

