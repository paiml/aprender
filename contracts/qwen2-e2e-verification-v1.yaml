metadata:
  version: 1.12.0
  created: '2026-02-20'
  author: PAIML Engineering
  description: |
    Qwen2/2.5-7B end-to-end verification — composing all kernel contracts
    into a complete model proof.

    v1.12.0 (2026-05-10): FALSIFY-QW2E-SHIP-002 promoted PARTIAL_ALGORITHM_LEVEL
    → DISCHARGED via live `apr run` on canonical 7B teacher
    (`/mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.apr`,
    sha256 a394dd286732a5f32dfb983fd2ea0eeba4d6239ac4c47e44bcfe62f590ddeb28,
    8.0 GB) on noah-Lambda-Vector RTX 4090. Prompt "def fib(n):" + max-tokens
    128 emitted a coherent fib() Python function; Python `ast.parse` returns
    OK with 0 syntax errors, 68 AST nodes, 1 FunctionDef named "fib". CUDA
    path hit transient ILLEGAL_ADDRESS, wgpu rejected (lm_head size + cosine
    parity), CPU path selected via apr-cpu-vs-gpu-output-parity-v1 fallback
    gate. Wall time 76.11s (cached load). Upstream blocker SHIP-007 §22
    RESOLVED 2026-05-07 (PR #1550 e856eb91f); binding-criterion contract
    apr-vs-gguf-forward-parity-v1 promoted to ACTIVE_FUNCTIONAL via PR #1608
    (chore/apr-vs-gguf-parity-v2-promote). Evidence:
    `evidence/ship-002-discharge-2026-05-10/discharge-evidence-v1.json` +
    `apr-run-output.txt` + `fib-completion.py` + `ast-parse-result.json`.
    MODEL-1 ship %: 91% → 92% (1 of 5 PARTIAL discharges from §17.5 chain
    closed; SHIP-005/006/007/008 remain).

    v1.10.0 (2026-04-25): FALSIFY-QW2E-SHIP-003 promoted PARTIAL_ALGORITHM_LEVEL
    → DISCHARGED via live `apr diff` 339-tensor cosine sweep on
    noah-Lambda-Vector RTX 4090. Min cosine across all 339 weight tensors
    = 0.9999999403953552 (6 orders of magnitude above the
    AC_SHIP1_003_MIN_COSINE_SIMILARITY = 0.999 floor); 0 of 339 below
    threshold. Worst 5 are all layer-0 MLP matrices (down_proj, gate_proj,
    up_proj, o_proj) at cos=0.9999999403953552, max_diff < 5e-4 (Q4K
    quantization noise). Aggregate `verdict_from_per_layer_cosines(&sims,
    0.999) = Pass`. Run-time 192s (was infeasible before PR #1058 mmap
    fix to `RosettaStone::load_tensor_f32_apr`). Drift-prevention test
    `falsify_ship_003_yaml_binding_pins_discharged_status` added to
    `crates/aprender-core/src/format/ship_003.rs::ship_003_tests`.
    Evidence file: `evidence/ship-003-full-discharge/discharge-evidence-v1.json`.

    v1.9.0 (2026-04-25): FALSIFY-QW2E-SHIP-004 promoted PARTIAL_ALGORITHM_LEVEL
    → DISCHARGED via live `apr export → llama-cli` round-trip on
    noah-Lambda-Vector RTX 4090. `apr export
    /mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.apr
    --format gguf -o /tmp/ship-004/qwen2.5-coder-7b-q4k-via-apr-export.gguf`
    exits 0 producing an 8.04 GB GGUF in Q4K passthrough mode (zero
    loss, 339 tensors, 20 metadata keys). `xxd` reports the first 8
    bytes as `47 47 55 46 03 00 00 00` = magic `b"GGUF"` + version
    u32 LE = 3 ∈ {2, 3}. Live `llama-cli -m <gguf> --prompt "hello"
    --n-predict 4` exits 0 — discharges all three independent format-
    boundary verdicts in one round-trip: `verdict_from_gguf_magic_bytes`
    Pass, `verdict_from_gguf_version` Pass, `verdict_from_llama_cli_exit`
    Pass. Spec v2.53.0 → v2.54.0; coverage 38+7 → 37+8 post-merge.
    Fourth MODEL-1 PARTIAL → DISCHARGED of the cycle (after SHIP-009
    PR #1054 + SHIP-010 PR #1055 + SHIP-001 PR #1056). Drift-prevention
    test `falsify_ship_004_yaml_binding_pins_discharged_status` added
    to `crates/aprender-core/src/format/ship_004.rs::ship_004_tests`.
    Evidence file: `evidence/ship-004-full-discharge/discharge-evidence-v1.json`.

    v1.8.0 (2026-04-25): Backfilled the missing FALSIFY-QW2E-SHIP-001
    falsification_tests entry (PR #1030 added the Rust verdict fns at
    `crates/aprender-core/src/format/ship_001.rs` + the v1.6.0 changelog
    narrative claim, but never wired the actual YAML block — that gap is
    closed here). Added directly at `discharge_status: DISCHARGED` because
    both algorithm proof (the three triple-verdict fns + 2 byte-literal
    constants from v1.6.0) AND live evidence (apr inspect on the canonical
    teacher safetensors at /mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.safetensors)
    exist concurrently. Live evidence: `apr inspect ... --json` exit 0
    with format=SafeTensors AND tensor_count=339 AND
    total_params=7,615,616,512 (Qwen2.5-Coder-7B canonical counts) on
    noah-Lambda-Vector RTX 4090. The 15.23 GB safetensors file loads
    end-to-end via the same `realizar::Model::load_safetensors` path
    that AC-SHIP1-001 specifies — Err(_) would be visible as a non-zero
    exit + error JSON. Third MODEL-1 PARTIAL → DISCHARGED of the cycle
    (after SHIP-009 PR #1054 + SHIP-010 PR #1055). Drift-prevention test
    `falsify_ship_001_yaml_binding_pins_discharged_status` added to
    `crates/aprender-core/src/format/ship_001.rs::ship_001_tests` mirrors
    the SHIP-010 pattern: parses the contract YAML, locates the
    FALSIFY-QW2E-SHIP-001 entry, asserts DISCHARGED + host pin + live
    evidence array. Evidence file:
    `evidence/ship-001-full-discharge/discharge-evidence-v1.json`.: FALSIFY-SHIP-004 DISCHARGED via apr export → llama-cli round-trip on real teacher)

    v1.7.0 (2026-04-23): Added FALSIFY-QW2E-SHIP-023 + FALSIFY-QW2E-SHIP-024
    as a bundled PARTIAL_ALGORITHM_LEVEL discharge of the last two MODEL-1
    §7.1 falsification tests that were not yet algorithmically bound.
    FALSIFY-QW2E-SHIP-023 binds the AC-005 two-day score-drift stability
    rule (`drift > 1.2 pp` fails) to one pure verdict fn
    `verdict_from_score_drift(day1_pct, day2_pct, tolerance_pp) ->
    Ship023Verdict` in `crates/aprender-core/src/format/ship_023.rs` +
    const `AC_SHIP1_023_MAX_HUMANEVAL_DRIFT_PP = 1.2` (pairs numerically
    with SHIP-005's noise allowance but carries different semantics: noise
    vs nominal vs drift between two measured runs). FALSIFY-QW2E-SHIP-024
    binds the adversarial-suite torture gate ("any panic or NaN in logits"
    fails across ≥ 50 prompts) to one pure `const fn
    verdict_from_adversarial_suite(inputs_run, panic_count, nan_count) ->
    Ship024Verdict` in `crates/aprender-core/src/format/ship_024.rs` + 3
    zero-tolerance constants (`AC_SHIP1_024_MIN_ADVERSARIAL_SUITE_SIZE = 50`
    + `AC_SHIP1_024_MAX_TOLERATED_PANIC_COUNT = 0` +
    `AC_SHIP1_024_MAX_TOLERATED_NAN_COUNT = 0`). Both new gates carry
    `ship_blocking: false` because §7.1 stability tests are not in §4.2
    AC table — first non-ship-blocking PARTIAL levers on the SHIP-TWO-001
    surface. Twin 7-section mutation surveys: SHIP-023 covers exact
    boundary Pass/just-above Fail / clear Pass band {0, 0.5, 1.0, 1.199}
    / clear Fail band {1.3, 2.0, 10.0, 86.0} / symmetric `.abs()` order
    invariance / non-finite conservative Fail / out-of-range + negative-
    tolerance rejection / 1.2 provenance pin. SHIP-024 covers zero-
    tolerance boundaries / insufficient suite size {0, 49} / over-size
    Pass band {100, 1000, 10_000, usize::MAX} / single-failure-class
    counts / compound failures / u32::MAX overflow guard / all-three-
    constants provenance pin. Algorithm-level PARTIAL discharge — full
    discharge of SHIP-023 blocks on live 2-day `apr eval --benchmark
    humaneval` re-run on RTX 4090 with `--features cuda`; full discharge
    of SHIP-024 blocks on real 50-prompt adversarial torture suite
    against `paiml/qwen2.5-coder-7b-apache-q4k-v1` on RTX 4090.
    **Completes MODEL-1 §7.1 at 12/12 falsification tests algorithmically
    bound** — SHIP-001 through SHIP-010 were covered in v1.1.0–v1.6.0,
    SHIP-023 + SHIP-024 close the stability-test gap here. Aggregate
    count across both models: 25 PARTIAL + 3 DISCHARGED. Task #120.

    v1.6.0 (2026-04-23): Added FALSIFY-QW2E-SHIP-001 — binds MODEL-1
    ship-blocking safetensors-load criterion (AC-SHIP1-001:
    `realizar::Model::load_safetensors(path)` returns `Ok(_)`) to
    three pure verdict fns in `crates/aprender-core/src/format/ship_001.rs`:
    `verdict_from_load_result(bool) -> Ship001Verdict` (Result-boundary
    collapse to Pass-on-Ok), `verdict_from_safetensors_header_size(u64,
    u64) -> Ship001Verdict` (header-size invariant 0 < N <= file_len - 8
    bound at `AC_SHIP1_001_SAFETENSORS_HEADER_PREFIX_LEN = 8`), and
    `verdict_from_safetensors_json_open_byte(u8) -> Ship001Verdict`
    (byte-literal check that the JSON header starts with
    `AC_SHIP1_001_SAFETENSORS_JSON_OPEN_BYTE = b'{' = 0x7B`).
    Algorithm-level PARTIAL discharge: the three format-boundary
    decision rules, the 8-byte prefix constant, and the 0x7B open-brace
    byte are proven today; the compute-heavy discharge (actually
    calling `realizar::Model::load_safetensors` on the real 7B teacher
    file) remains blocked on hardware evidence collection. MODEL-1
    coverage 9/10 → 10/10 touched — SHIP-001 is the last in-scope
    MODEL-1 PARTIAL lever (SHIP-013/014 do not exist in the AC table).
    Tenth compute-free MODEL-1 PARTIAL lever; second triple-verdict
    decomposition after SHIP-004, reinforcing the pattern where a
    tool-accepted-the-artifact rule is split into independent
    format-boundary gates. Aggregate count across both models is now
    16 PARTIAL + 3 DISCHARGED.

    v1.5.0 (2026-04-23): Added FALSIFY-QW2E-SHIP-004 — binds MODEL-1
    ship-blocking GGUF export criterion (AC-SHIP1-004:
    `apr export --format gguf` loads in llama.cpp) to three pure
    verdict fns in `crates/aprender-core/src/format/ship_004.rs`:
    `verdict_from_llama_cli_exit(code) -> Ship004Verdict` (POSIX
    zero-tolerance exit-code boundary), `verdict_from_gguf_magic_bytes(&[u8])
    -> Ship004Verdict` (canonical 4-byte `b"GGUF"` magic with
    single-byte-flip and short-slice rejection), and
    `verdict_from_gguf_version(u32) -> Ship004Verdict` (set-membership
    over `{2, 3}` with Fail-closed above-band rejection).
    Algorithm-level PARTIAL discharge: the three format-boundary
    decision rules, the 0-exit POSIX sentinel, the `b"GGUF"` byte
    literal, and the supported-versions set are proven today; the
    compute-heavy discharge (live `apr export --format gguf` + shell
    out to `llama-cli` on the exported file) remains blocked on
    hardware evidence collection. MODEL-1 coverage 8/10 → 9/10
    touched. Ninth compute-free MODEL-1 PARTIAL lever; first MODEL-1
    discharge to bind three independent verdict fns in one AC (mirrors
    MODEL-2 SHIP-016 aggregate decomposition but without the aggregate
    combinator — each of the three fns is an independent gate on a
    different format boundary).

    v1.4.0 (2026-04-23): Added FALSIFY-QW2E-SHIP-003 — binds MODEL-1
    ship-blocking quantization-round-trip criterion (AC-SHIP1-003:
    `apr convert --quantize q4_k_m` preserves every per-layer weight
    tensor's cosine similarity ≥ 0.999 between original f32/f16 and
    dequantized q4_k_m) to two pure verdict fns in
    `crates/aprender-core/src/format/ship_003.rs`:
    `verdict_from_cosine_similarity(sim, threshold) -> Ship003Verdict`
    (single-layer threshold + cosine-range guard + non-finite guard)
    and `verdict_from_per_layer_cosines(sims, threshold) -> Ship003Verdict`
    (aggregate-AND combinator, conservative Fail on empty input).
    Algorithm-level PARTIAL discharge: the threshold rule, the range
    guard `[-1.0, 1.0]`, the aggregate-AND shape, and the 0.999 const
    are proven today; the compute-heavy discharge (live
    `apr convert --quantize q4_k_m` + per-layer cosine harness across
    28 × 7 = 196 projection matrices on the 7B teacher) remains
    blocked on hardware evidence collection. MODEL-1 coverage 7/10 →
    8/10 touched. Eighth compute-free MODEL-1 PARTIAL lever; first
    to combine a single-number threshold (mirrors SHIP-007/SHIP-020
    decode-tps shape) with an aggregate-AND combinator (mirrors
    SHIP-016 `verdict_from_qa_gates`) in one discharge.

    v1.3.0 (2026-04-23) — Adds FALSIFY-QW2E-SHIP-007 binding AC-SHIP1-007
    (MODEL-1 `apr bench` decode ≥ 30 tok/s on RTX 4090 for 7B Q4_K teacher)
    to pure `verdict_from_decode_tps(f32) -> Ship007Verdict` in
    `crates/aprender-core/src/bench/ship_007.rs`. Non-finite values (NaN,
    ±∞) Fail conservatively. discharge_status PARTIAL_ALGORITHM_LEVEL —
    full discharge blocks on live `apr bench --iterations 5 --max-tokens
    128` on RTX 4090 + median ≥ 30.0. MODEL-1 twin of MODEL-2 SHIP-020
    (same f32-threshold shape, floor 30 vs 100 — 7B Q4_K is bandwidth-
    bound at ~3.5× the size of the 370M target).

    v1.2.0 (2026-04-22): Added FALSIFY-QW2E-SHIP-005 — binds MODEL-1
    ship-blocking HumanEval pass@1 criterion (AC-SHIP1-005:
    `apr eval --benchmark humaneval` reproduces ≥ 86.00% pass@1 on the
    7B Q4_K teacher, with a 1.2 pp noise allowance → effective floor
    84.80%) to a pure two-number threshold verdict fn
    `verdict_from_pass_at_1(correct, total, threshold_pct)` in
    `crates/aprender-core/src/metrics/ship_005.rs`. Algorithm-level
    PARTIAL discharge: the decision rule (and the nominal / noise /
    effective constants) is proven today; the compute-heavy discharge
    (live `apr eval --benchmark humaneval paiml/qwen2.5-coder-7b-apache-q4k-v1`
    on RTX 4090 across 3 seed=0 runs with median ≥ 86.00) remains blocked
    on hardware evidence collection. Mirrors MODEL-2 SHIP-018 pattern
    (50% floor for 370M sovereign) but adds a unique 1.2 pp noise
    allowance carved by AC-SHIP1-005 that MODEL-2 does not have.
    Authored self-contained because SHIP-018 branch is not yet on main.

    v1.1.0 (2026-04-22) — Adds FALSIFY-QW2E-SHIP-002 binding AC-SHIP1-002
    (MODEL-1 emits syntactically valid Python on canonical `def fib(n):`
    prompt) to pure `const fn verdict_from_syntax_error_count(usize) ->
