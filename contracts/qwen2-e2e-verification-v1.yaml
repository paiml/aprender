metadata:
  version: 1.3.0
  created: '2026-02-20'
  author: PAIML Engineering
  description: |
    Qwen2/2.5-7B end-to-end verification — composing all kernel contracts
    into a complete model proof.

    v1.3.0 (2026-04-23) — Adds FALSIFY-QW2E-SHIP-007 binding AC-SHIP1-007
    (MODEL-1 `apr bench` decode ≥ 30 tok/s on RTX 4090 for 7B Q4_K teacher)
    to pure `verdict_from_decode_tps(f32) -> Ship007Verdict` in
    `crates/aprender-core/src/bench/ship_007.rs`. Non-finite values (NaN,
    ±∞) Fail conservatively. discharge_status PARTIAL_ALGORITHM_LEVEL —
    full discharge blocks on live `apr bench --iterations 5 --max-tokens
    128` on RTX 4090 + median ≥ 30.0. MODEL-1 twin of MODEL-2 SHIP-020
    (same f32-threshold shape, floor 30 vs 100 — 7B Q4_K is bandwidth-
    bound at ~3.5× the size of the 370M target).

    v1.2.0 (2026-04-22): Added FALSIFY-QW2E-SHIP-005 — binds MODEL-1
    ship-blocking HumanEval pass@1 criterion (AC-SHIP1-005:
    `apr eval --benchmark humaneval` reproduces ≥ 86.00% pass@1 on the
    7B Q4_K teacher, with a 1.2 pp noise allowance → effective floor
    84.80%) to a pure two-number threshold verdict fn
    `verdict_from_pass_at_1(correct, total, threshold_pct)` in
    `crates/aprender-core/src/metrics/ship_005.rs`. Algorithm-level
    PARTIAL discharge: the decision rule (and the nominal / noise /
    effective constants) is proven today; the compute-heavy discharge
    (live `apr eval --benchmark humaneval paiml/qwen2.5-coder-7b-apache-q4k-v1`
    on RTX 4090 across 3 seed=0 runs with median ≥ 86.00) remains blocked
    on hardware evidence collection. Mirrors MODEL-2 SHIP-018 pattern
    (50% floor for 370M sovereign) but adds a unique 1.2 pp noise
    allowance carved by AC-SHIP1-005 that MODEL-2 does not have.
    Authored self-contained because SHIP-018 branch is not yet on main.

    v1.1.0 (2026-04-22) — Adds FALSIFY-QW2E-SHIP-002 binding AC-SHIP1-002
    (MODEL-1 emits syntactically valid Python on canonical `def fib(n):`
    prompt) to pure `const fn verdict_from_syntax_error_count(usize) ->
    Ship002Verdict` in `crates/aprender-core/src/qa/ship_002.rs`. Zero-
    tolerance threshold on the single canonical prompt (spec §4.2 has no
    noise allowance); discharge_status PARTIAL_ALGORITHM_LEVEL — full
    discharge blocks on live `apr run` + `rustpython`/`ruff` AST parse.
  references:
  - Qwen2.5 Technical Report — full model architecture
  - Vaswani et al. (2017) Attention Is All You Need
  - 'Su et al. (2021) RoFormer: Enhanced Transformer with Rotary Position Embedding'
  depends_on:
  - qwen2-shapes-v1
  - inference-pipeline-v1
  - embedding-algebra-v1
  - attention-scaling-v1
  - kv-cache-sizing-v1
equations:
  model_parameter_count:
    formula: P = V*d + L*(d_attn + d_ffn + d_norm) + d_final
    domain: V=152064, d=3584, L=28, d_attn/d_ffn/d_norm=per-layer params
    invariants:
    - Total ≈ 7.62B for Qwen2.5-7B
    - 'Embedding: 152064 * 3584 ≈ 545.0M'
    - 'Per-layer attention: 2*(3584^2) + 2*(512*3584) ≈ 29.4M'
    - 'Per-layer FFN: 3 * 3584 * 18944 ≈ 203.7M'
    - Per-layer cost linear in d^2
    preconditions:
    - 'input.len() > 0'
    - num_layers > 0
    lean_theorem: Theorems.Model_Parameter_Count
  flops_per_token:
    formula: F ≈ 2*P (forward pass) for dense compute
    domain: Approximate FLOPs per token for autoregressive generation
    invariants:
    - Linear in P
    - Attention FLOP component is O(seq_len * d)
    - GQA reduces KV computation by factor n_h/n_kv = 7
    preconditions:
    - 'input.len() > 0'
    - vocab_size > 0
    lean_theorem: Theorems.Flops_Per_Token
  memory_breakdown:
    formula: M = M_weights + M_kv + M_activations
    domain: Total GPU memory during inference
    invariants:
    - M_weights depends on quantization (Q4K < Q6K < F16 < F32)
    - M_kv grows linearly with sequence length
    - M_kv per layer = 2 * n_kv * d_k * seq_len * dtype_bytes
    - M_activations bounded by batch_size * seq_len * d
    preconditions:
    - 'input.len() > 0'
    - num_layers > 0
    lean_theorem: Theorems.Memory_Breakdown
  throughput_model:
    formula: tok/s = min(bandwidth / bytes_per_token, compute / flops_per_token)
    domain: Roofline-limited throughput
    invariants:
    - Memory-bound for small batch (typical inference)
    - Compute-bound for large batch or long prefill
    preconditions:
    - 'input.len() > 0'
    - batch_size > 0
    lean_theorem: Theorems.Throughput_Model
  verification_ladder:
    formula: coverage(contract_set) = verified_obligations / total_obligations
    domain: Fraction of proof obligations with passing tests or Kani proofs
    invariants:
    - coverage in [0, 1]
    - coverage = 1 means all obligations verified
    - 'Each layer adds: attention + FFN + 2*RMSNorm obligations'
    preconditions:
    - 'input.len() > 0'
    - num_layers > 0
    lean_theorem: Theorems.Verification_Ladder
  contract_composition:
    formula: model_contract = compose(embedding, L * block, final_norm, unembed)
    domain: Full model as composition of verified components
    invariants:
    - Each component independently verified
    - Composition preserves shape invariants
    - Residual stream provides compositional proof structure
    - 28 identical decoder blocks (no hybrid layers)
    preconditions:
    - indices.iter().all(|&i| i < vocab_size)
    - indices.len() > 0
    lean_theorem: Theorems.Contract_Composition
proof_obligations:
- type: invariant
  property: Parameter count matches architecture
  formal: P(Qwen2.5-7B) in [7.5B, 7.8B]
  applies_to: all
- type: bound
  property: FLOPs bounded by 2P
  formal: F <= 2 * P + O(seq_len * d * L)
  applies_to: all
- type: ordering
  property: Quantization memory ordering
  formal: M(Q4K) < M(Q6K) < M(F16) < M(F32)
  applies_to: all
- type: monotonicity
  property: Throughput increases with bandwidth
  formal: bw1 < bw2 -> tok_s(bw1) <= tok_s(bw2)
  applies_to: all
- type: bound
  property: Verification coverage at 100%
  formal: coverage(qwen2_contracts) = 1.0
  applies_to: all
- type: invariant
  property: Compositional proof structure
  formal: 'for all l: shape(block_l(x)) = shape(x)'
  applies_to: all
- type: conservation
  property: 'End-to-end shape: tokens in -> logits out'
  formal: shape(model(tokens)) = [seq_len, V]
  tolerance: 0.0
  applies_to: all
falsification_tests:
- id: FALSIFY-QW2E-001
  rule: Parameter count
  prediction: Total params ≈ 7.62B
  test: 'Deterministic: sum all parameter shapes'
  if_fails: Architecture config mismatch
- id: FALSIFY-QW2E-002
  rule: FLOPs estimate
  prediction: 2P FLOPs per forward token
  test: Deterministic with Qwen2.5-7B constants
  if_fails: Missing layer in FLOP count
- id: FALSIFY-QW2E-003
  rule: Memory ordering
  prediction: Q4K < Q6K < F16 < F32 memory
  test: proptest with random tensor dimensions
  if_fails: Quantization byte formula wrong
- id: FALSIFY-QW2E-004
  rule: Throughput roofline
  prediction: tok/s bounded by bandwidth and compute
  test: proptest with random hardware specs
  if_fails: Roofline formula error
- id: FALSIFY-QW2E-005
  rule: Coverage completeness
  prediction: All obligations have test or proof
  test: pv coverage --binding check
  if_fails: Missing obligation coverage
- id: FALSIFY-QW2E-006
  rule: Compositional proof structure
  prediction: 'Each block preserves shape: shape(block_l(x)) = shape(x)'
  test: 'proptest: verify shape(block(x)) = shape(x) for random blocks'
  if_fails: Block l breaks shape invariant
- id: FALSIFY-QW2E-007
  rule: End-to-end shape conservation
  prediction: tokens -> [seq_len, 3584] -> ... -> [seq_len, 152064]
  test: 'proptest: trace shapes through mock pipeline'
  if_fails: Shape break in layer composition
- id: FALSIFY-QW2E-SHIP-002
  rule: MODEL-1 teacher emits syntactically valid Python on canonical prompt
  prediction: |
    `apr run paiml/qwen2.5-coder-7b-apache-q4k-v1.safetensors --prompt "def fib(n):"`
    emits a completion that parses as a valid Python AST with ≤ 0 syntax errors
    (spec §4.2 AC-SHIP1-002 has no noise allowance).
  test: |
    Algorithm-level (PARTIAL): `const fn verdict_from_syntax_error_count(usize)
    -> Ship002Verdict` in `crates/aprender-core/src/qa/ship_002.rs` locks the
    zero-tolerance threshold at compile time; 6-section mutation survey
    (zero-errors → Pass, exactly-one-error → Fail, many-errors Fail band
    {2, 10, 100}, monotonicity sweep 0..=256, `usize::MAX` sanity Fail,
    provenance pin tolerance = 0) exercised by
    `falsify_ship_002_python_syntax_error_threshold_logic`.
  if_fails: |
    Silent tolerance widening (0 → 1) or inequality flip would accept a broken
    completion on the canonical prompt; any single syntax error is a
    ship-blocker for MODEL-1.
  ship_blocking: true
  discharge_status: PARTIAL_ALGORITHM_LEVEL
  evidence_discharged_by:
  - crates/aprender-core/src/qa/ship_002.rs::AC_SHIP1_002_MAX_TOLERATED_SYNTAX_ERRORS
  - crates/aprender-core/src/qa/ship_002.rs::verdict_from_syntax_error_count
  - crates/aprender-core/src/qa/ship_002.rs::falsify_ship_002_python_syntax_error_threshold_logic
  full_discharge_blocks_on: |
    Live `apr run paiml/qwen2.5-coder-7b-apache-q4k-v1.safetensors --prompt
    "def fib(n):"` on RTX 4090 + `rustpython`/`ruff` AST parse of the emitted
    completion; any parse error count > 0 is a ship-blocker.
  counter_example_classes:
  - regressed_sampling
  - widened_tolerance
  - relaxed_rule
  - flipped_inequality
  - mask_byte_malformed
- id: FALSIFY-QW2E-SHIP-005
  rule: |
    MODEL-1 ship-blocker — `apr eval --benchmark humaneval
    paiml/qwen2.5-coder-7b-apache-q4k-v1` pass@1 (median of 3 seed=0
    runs) must be at least AC_SHIP1_005_NOMINAL_HUMANEVAL_PASS_AT_1_PCT
    = 86.00%, with a 1.2 pp noise allowance carved by spec §4.2
    AC-SHIP1-005 → effective floor
    AC_SHIP1_005_EFFECTIVE_HUMANEVAL_PASS_AT_1_PCT ≈ 84.80%. Decision
    rule: `Pass` iff `correct / total * 100 ≥ threshold_pct` AND
    inputs well-formed (`total > 0`, `correct ≤ total`, finite
    `threshold_pct`). Non-well-formed inputs Fail conservatively.
  prediction: |
    verdict_from_pass_at_1(correct, total, threshold) ==
    Ship005Verdict::Pass iff total > 0 AND correct ≤ total AND
    threshold.is_finite() AND (correct as f32 / total as f32) * 100
    >= threshold
  test: |
    cargo test -p aprender-core --lib
    falsify_ship_005_humaneval_pass_at_1_threshold_logic
  if_fails: |
    MODEL-1 teacher cannot ship — either the 7B Q4_K checkpoint has
    regressed below the spec's 86.00% (or noise-adjusted 84.80%)
    pass@1 floor, or the contract constants have drifted from spec
    §4.2 AC-SHIP1-005.
  ship_blocking: true
  discharge_status: PARTIAL_ALGORITHM_LEVEL
  evidence_discharged_by:
  - crates/aprender-core/src/metrics/ship_005.rs
    (verdict_from_pass_at_1 + AC_SHIP1_005_NOMINAL_HUMANEVAL_PASS_AT_1_PCT
    + AC_SHIP1_005_NOISE_ALLOWANCE_PP +
    AC_SHIP1_005_EFFECTIVE_HUMANEVAL_PASS_AT_1_PCT)
  - 'test: falsify_ship_005_humaneval_pass_at_1_threshold_logic
    (8 sections — safe-margin Pass above effective, above nominal,
    noise-window Fail at nominal, below-effective Fail including
    HumanEval-canonical 139/164 = 84.756%, monotonicity sweep
    0..=164, div-safety + sanity guards, non-finite threshold Fail,
    provenance pin on all three constants)'
  full_discharge_blocks_on: |
    Live `apr eval --benchmark humaneval
    paiml/qwen2.5-coder-7b-apache-q4k-v1 --json` on RTX 4090 with
    --features cuda; median pass@1 across 3 seed=0 runs must be ≥
    86.00 (or ≥ 84.80 under spec's 1.2 pp noise allowance).
  counter_example_classes:
  - "regressed_teacher: distilled checkpoint lost a quantization
    round-trip and HumanEval pass@1 fell from 87% to 82%"
  - "drifted_nominal: spec AC-SHIP1-005 silently raised to 88% but
    AC_SHIP1_005_NOMINAL_HUMANEVAL_PASS_AT_1_PCT left at 86.00"
  - "widened_noise: noise allowance silently widened from 1.2 pp to
    2.0 pp (effective floor slumps to ~84.00) without spec update"
  - "relaxed_rule: ≥ replaced with > (unreachable floor for the
    canonical 86/100 run)"
  - "div_by_zero_pass: empty-corpus telemetry (total=0) silently
    reported as Pass instead of Fail"
  - "nan_promoted: pass@1 JSON emits `NaN` on parse glitch and is
    silently treated as Pass"
- id: FALSIFY-QW2E-SHIP-007
  rule: |
    MODEL-1 ship-blocker — `apr bench --iterations 5 --max-tokens 128
    paiml/qwen2.5-coder-7b-apache-q4k-v1` median decode throughput must
    be at least AC_SHIP1_007_MIN_DECODE_TPS_RTX4090_7B = 30.0 tok/s on
    an RTX 4090 host. Decision rule: `Pass` iff measured tok/s is finite
    AND ≥ 30.0. Non-finite values (NaN, ±∞) Fail conservatively.
  prediction: |
    verdict_from_decode_tps(measured) == Ship007Verdict::Pass
    iff measured.is_finite() && measured >= 30.0
  test: |
    cargo test -p aprender-core --lib
    falsify_ship_007_decode_tps_threshold_logic
  if_fails: |
    MODEL-1 teacher cannot ship — either the 7B Q4_K decode kernel has
    regressed below the Ollama-parity-class floor, or the contract
    constant has drifted from spec §4.2 AC-SHIP1-007.
  ship_blocking: true
  discharge_status: PARTIAL_ALGORITHM_LEVEL
  evidence_discharged_by:
  - crates/aprender-core/src/bench/ship_007.rs::AC_SHIP1_007_MIN_DECODE_TPS_RTX4090_7B
  - crates/aprender-core/src/bench/ship_007.rs::verdict_from_decode_tps
  - crates/aprender-core/src/bench/ship_007.rs::falsify_ship_007_decode_tps_threshold_logic
  full_discharge_blocks_on: |
    Live `apr bench --iterations 5 --max-tokens 128
    paiml/qwen2.5-coder-7b-apache-q4k-v1` on RTX 4090 with --features
    cuda; median of 5 iterations must be ≥ 30.0 tok/s.
  counter_example_classes:
  - regressed_kernel
  - drifted_constant
  - relaxed_rule
  - nan_promoted
