equations:
  weights_are_a_probability_vector_and_the_ensemble_never_scor:
    formula: |
      sum(w)=1, all w>=0, and validation metric(ensemble) >= max over members within 1e-9, on 3 fixtures
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "weights are a probability vector and the ensemble never scores below its best member"
  selection_is_greedy_with_replacement_and_reproducible:
    formula: |
      with ensemble_size=25 the weight of a member equals its selection count / 25; two runs on the same inputs produce identical weights
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "selection is greedy with replacement and reproducible"

