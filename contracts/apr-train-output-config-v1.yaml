metadata:
  kind: schema
  version: 1.0.0
  created: '2026-10-03'
  author: PAIML Engineering (la-72, APR-LOOKAHEAD-001 L2, train 0.72)
  description: >-
    The config.json that `apr train` writes beside its weights says the output head is tied exactly when the
    model it saved has no head of its own. Read at 316dee2cd4: save_config_and_metadata (aprender-train
    config/train/loader/helpers.rs:856, the field at :876) writes TransformerConfig::ties_embeddings()
    (transformer/config.rs:434). That is the config flag when it is true, and otherwise the guess
    use_bias && vocab_size > 150000; it never looks at the model. The model has its own head only when the
    checkpoint it loaded carried lm_head.weight (Transformer::from_params, model.rs:74), and Transformer::new,
    which every run without weights uses, allocates none (model.rs:43). So the flag can be wrong both ways.
    (1) Tied in config.json, while model.safetensors holds the trained head: an untied checkpoint with
    use_bias true and a vocabulary over 150000. All three apr safetensors loaders read the flag before the
    tensor (aprender-serve safetensors_infer_convert.rs:218, safetensors_cuda_load_safe_tensors.rs:551,
    safetensors_cuda_upload_weights_safe.rs:50), so `apr run` and `apr serve` use the embedding as the head and
    never read the trained one. (2) Untied in config.json, with no head saved: every run without weights whose
    flag is false, and config_from_overrides (config/train/loader/data.rs:452) always writes false. apr falls
    back to the embedding, but an HF-convention loader that trusts the flag initialises a random head.
    Scope not measured. parse_hf_config sets use_bias only from attention_bias (data.rs:567), which Qwen2
    configs do not carry, so (1) needs a spec override use_bias true or a config with attention_bias true; (2)
    covers runs from scratch. The dedicated pretraining path (train/pretrain_real.rs) is not affected:
    save_config_and_metadata is private to helpers.rs, and the two save paths (:801, :846) are its only
    callers. PROPOSED from a desk read; nothing is built or run.
  references:
  - crates/aprender-train/src/config/train/loader/helpers.rs (save_trained_model_cpu :768, save_trained_model_cuda :812, save_config_and_metadata :856)
  - crates/aprender-train/src/transformer/config.rs (ties_embeddings :434, the guess at :439, hf_architecture_name :403)
  - crates/aprender-train/src/transformer/model.rs (Transformer::new :34, from_params :54 and its lm_head.weight check at :74, named_parameters :588)
  - crates/aprender-train/src/config/train/loader/data.rs (load_transformer_model :47, config_from_overrides :452, parse_hf_config :508)
  - crates/aprender-serve/src/safetensors_infer_convert.rs (resolve_lm_head_weight, the flag check at :218)
  - docs/specifications/aprender-train/train-what-you-serve-0.72.md (on la-72/r15-receipt-ext; this contract is not on its critical path)
status: PROPOSED
equations:
  saved_tie_flag:
    formula: 'config.json.tie_word_embeddings = (model.lm_head = None)'
    domain: 'every output directory of apr train, CPU and CUDA, full run or LoRA, fine-tune or from scratch'
    invariants:
    - the flag is read off the model being saved, never guessed from use_bias or vocab_size
    - for a full save, model.lm_head = None exactly when the saved weights have no lm_head.weight
    preconditions:
    - the trainer's model is the model whose weights are written
  served_is_trained:
    formula: 'logits(apr run(output_dir), x) = logits(trainer.model, x) for every token sequence x'
    domain: 'the CPU safetensors path of apr run on a full-save output directory (model.safetensors + config.json)'
    invariants:
    - the served head is the head that was trained, whether that is lm_head.weight or the embedding
proof_obligations:
- type: invariant
  property: config.json's tie flag says whether the saved model has its own head
  formal: 'tie_word_embeddings(config.json) ⇔ model.lm_head = None'
  applies_to: all
- type: equivalence
  property: apr run on an apr train output directory computes the trained model's logits
  formal: 'max|z_served − z_trained| ≤ 1e-4·max(1, max|z_trained|) ∧ argmax z_served = argmax z_trained'
  tolerance: 1.0e-04
  applies_to: all
falsification_tests:
- id: FALSIFY-TOC-001
  rule: An untied checkpoint keeps its own head through apr train and apr run
  prediction: 'tiny untied Qwen2-shaped checkpoint (vocab 150016, hidden 8, 1 layer, 2 heads, 1 KV head, q/k/v biases, lm_head.weight drawn independently of embed_tokens.weight, config.json with attention_bias true and tie_word_embeddings false), loaded by load_transformer_model and saved by save_trained_model_cpu: config.json says tie_word_embeddings false, model.safetensors holds lm_head.weight equal to the trainer''s head, and apr run on the output directory gives the trainer''s logits within 1e-4·max(1, max|z|) with the same argmax on 4 fixed sequences. At 316dee2cd4 ties_embeddings() returns true (use_bias and vocab > 150000), resolve_lm_head_weight then takes the embedding, and the logits differ, so this row is RED until the flag comes from the model. Planted: putting the use_bias && vocab > 150000 guess back turns it RED'
  test: '[U] not written; CPU only, needs cargo after LIVE 0.70.1. The config half fits the aprender-train loader tests; the apr run half needs a crate that links both aprender-train and realizar, such as apr-cli'
  if_fails: 'apr serves an untied model with its embedding as the output head, and the trained head in model.safetensors is never read'
- id: FALSIFY-TOC-002
  rule: A run that saves no head says the head is tied
  prediction: 'run without weights (no config.json; the spec architecture block alone, which config_from_overrides turns into tie_word_embeddings false; vocab 64, hidden 8, 1 layer): Transformer::new allocates no head, model.safetensors has no lm_head.weight, and config.json must say tie_word_embeddings true. At 316dee2cd4 it says false, so this row is RED. apr run on the directory falls back to the embedding and cannot see the defect; an HF-convention loader that trusts the flag gives the model a newly initialised head. Planted: writing the config field (mc.tie_word_embeddings) instead of the model state turns it RED'
  test: '[U] not written; CPU only, needs cargo after LIVE 0.70.1'
  if_fails: 'a model trained from scratch by apr train loads elsewhere with a random output head and generates noise, while apr run on the same directory looks fine'
- id: FALSIFY-TOC-003
  rule: The CUDA save path writes the same flag as the CPU path
  prediction: 'save_trained_model_cuda writes tie_word_embeddings false on the TOC-001 checkpoint and true on the TOC-002 run, the values save_trained_model_cpu must write. The test checks those values, not that the two paths agree: at 316dee2cd4 both paths write false on the TOC-002 run, so a comparison of the two is GREEN there. Both call save_config_and_metadata with trainer.model().config() at 316dee2cd4 (helpers.rs:801 and :846), so the fix must pass the CUDA trainer''s model state as well, not only the CPU one. The CUDA path writes model.apr, not model.safetensors (helpers.rs:823), so this row checks config.json only; whether model.apr carries lm_head.weight, and what apr run reads from it, is not read here. Planted: the fix applied to save_trained_model_cpu only turns it RED on the TOC-002 run'
  test: '[U] not written; needs cargo + CUDA after LIVE 0.70.1, GPU lock around the test binary only'
  if_fails: 'CUDA-trained output directories keep the guessed flag after the CPU path is fixed'
qa_gate:
  certeza:
    min_score: 0.0
    note: Gates are the flag identity and the served-logits bound above; no composite score is claimed.
