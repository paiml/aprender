# ─────────────────────────────────────────────────────────────────────────────
# apr-release-promotion-v1 — a release is promoted from prerelease to stable
# only over four host receipts that each prove the DOWNLOADED asset is the
# TESTED binary (PP-066 row R-5, epic #2873, issue #2908, claim 3)
#
# PROOF LADDER, STATED HONESTLY
#   * L1 — the resolver exists: scripts/check_promotion_receipts.sh <tag>.
#          Argument-wired (guard_tree.sh runs it bare as NOT-RUN/0); the release
#          promotion step invokes it with the tag.
#   * L2 — falsification MEASURED: --self-test 15/15 both polarities, including
#          the three registered mutations (missing -> refuse, tampered -> RED,
#          skipped -> refuse), 2026-09-07.
#   * L3/L4 — NOT APPLICABLE: a JSON-and-manifest rule, not a kernel.
# ─────────────────────────────────────────────────────────────────────────────
name: apr-release-promotion
version: "1.0.0"
scope: >
  scripts/check_promotion_receipts.sh over evidence/dogfood/<version>/<host>.json
  and evidence/release/<tag>/apr-<tag>.sha256 (+ .minisig). Out of scope: how
  the receipts are produced (fleet-verify), and the assets' construction.
status: active

metadata:
  kind: pattern
  version: "1.0.0"
  created: '2026-09-07'
  last_modified: '2026-09-07'
  author: PAIML Engineering
  references:
    - 'scripts/check_promotion_receipts.sh — <tag> · --self-test (15 rows)'
    - 'docs/audits/impl-PMAT-929-receipt.md — 0.65.2 shipped with parity NO-GO and no per-host asset proof'
    - '.github/pr-review.pub — the public-key (minisign) scheme the repo already uses; S0-19: no third scheme'
    - 'PP-066 row R-5, issue #2908'
  description: >
    Promotion requires, for EVERY host in {lambda, intel, gx10, mini}: a receipt
    exists; its binary_sha256 is in the release's minisign-verified sha256
    manifest; its C14 parity status is PASS; and parity was not skipped. Any
    failure refuses with every reason printed. The manifest must verify against
    the repository's public key; an unsigned or unverifiable manifest promotes
    nothing. A missing manifest or receipts directory is exit 2, never a pass.

equations:
  promote_iff_four_receipts_prove_the_asset:
    formula: |
      promote(tag) = verify(manifest, pubkey)
                   ∧ ∀ h ∈ HOSTS: exists(r_h)
                                 ∧ r_h.binary_sha256 ∈ manifest
                                 ∧ r_h.parity.status = PASS
                                 ∧ ¬ skipped(r_h.parity)
    domain: 'the four host receipts and the signed manifest'
    codomain: 'bool'
    invariants:
    - 'ALL FOUR OR NONE (rows 10, 11): three good hosts and one tampered refuses.'
    - 'THE DOWNLOADED BINARY IS THE TESTED BINARY (row 3): a sha not in the manifest is RED, whatever its parity says.'
    - 'A SKIPPED GATE IS THE 0.65.2 DEFECT (rows 4, 5): status skipped, or SKIP_PARITY_GATE in the recorded command, refuses even beside a PASS.'
    - 'ABSENCE IS NEVER A PASS (rows 2, 7, 8, 9, 12, 13, 14): missing receipt, missing parity, missing sha, malformed JSON, unsigned manifest each refuse; missing inputs are exit 2.'
    - 'THE SIGNATURE IS REAL (row 15): with verification on, a fake .minisig does not verify.'
    preconditions: []
    postconditions:
    - 'PROMOTE is printed only when every condition held for every host'

proof_obligations:
  - id: PROMO-OB-001
    statement: "A release is promoted only over four host receipts whose asset sha256 is in the signed manifest, whose C14 parity is PASS, and whose parity was not skipped; every absence refuses."
    discharged_by: falsification_tests[0]

falsification_tests:
  - id: PROMO-F-001
    rule: the four conditions per host, both polarities, plus the signature
    prediction: >-
      --self-test passes 15/15 — one good host promotes; a missing host refuses (MUTATION missing);
      a sha outside the manifest is RED (MUTATION tampered); status skipped refuses and
      SKIP_PARITY_GATE in the command refuses beside a PASS (MUTATION skipped); FAIL, no parity, no
      sha, malformed JSON each refuse; four good hosts promote; three good plus one tampered refuses;
      an unsigned manifest refuses; a missing manifest or receipts dir is exit 2; a fake signature
      does not verify.
    test: 'bash scripts/check_promotion_receipts.sh --self-test'
    if_fails: >-
      a release reaches the stable channel while a platform is untested, the tested binary is not
      the downloaded one, or the parity gate that failed on 0.65.2 was skipped again
    mutation: >-
      drop the manifest membership test -> row 3 RED; drop the skipped test -> rows 4 and 5 RED;
      drop the missing-receipt branch -> row 2 RED. Registered in the DAG; the self-test rows are
      the falsifiers.

non_goals:
  - "Producing the receipts: `make fleet-verify ROW=release` on four hosts is R-5's execution half, fleet-gated."
  - "Building and signing the assets (the five nightly.yml targets + manifest) — the workflow half of R-5."
  - "The crates.io cascade — contracts/apr-publish-cascade-v1.yaml."

binding_registry:
  guard: scripts/check_promotion_receipts.sh
  pubkey: .github/release-assets.pub   # to be created alongside the first signed manifest; absent => refuse
  issue: "https://github.com/paiml/aprender/issues/2908"
