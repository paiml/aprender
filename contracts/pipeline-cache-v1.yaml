name: pipeline-cache
version: "1.0.0"
scope: "crates/aprender-serve/src/"

description: |
  KV cache management for autoregressive decoding. Cache grows monotonically, eviction preserves correctness.

equations:
  monotonic_growth:
    description: "cache.len() increases by 1 per decode step"
    formula: "cache.len() increases by 1 per decode step"

  eviction_correctness:
    description: "output after eviction matches recompute from scratch"
    formula: "output after eviction matches recompute from scratch"

falsification:
  - id: FALSIFY-PIPELINE_CACHE_V1_001
    description: "cache.len() increases by 1 per decode step"
    test: "Related tests in crates/aprender-serve/src/"
    evidence: "cargo test --lib"

  - id: FALSIFY-PIPELINE_CACHE_V1_002
    description: "output after eviction matches recompute from scratch"
    test: "Related tests in crates/aprender-serve/src/"
    evidence: "cargo test --lib"

# PMAT-7235: bound to CI-run tests (--lib).
falsification_tests:
  - id: FALSIFY-PIPELINE_CACHE_V1_001
    rule: "cache.len() increases by 1 per decode step"
    prediction: "test_kv_cache_grows_with_tokens asserts the length after each forward step"
    test: "cargo test -p aprender-serve --lib test_kv_cache_grows_with_tokens"
  - id: FALSIFY-PIPELINE_CACHE_V1_002
    rule: "recomputing from scratch reproduces the cached output"
    prediction: "test_kv_cache_recompute_from_scratch_matches passes; fails when a fresh cache gives different logits"
    test: "cargo test -p aprender-serve --lib test_kv_cache_recompute_from_scratch_matches"
