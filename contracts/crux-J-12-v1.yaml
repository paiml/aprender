# CRUX-J-12 — OpenCLAW multi-transport chat dispatch
# Resolved 2026-04-18: category J competitor = openclaw.ai.

metadata:
  id: CRUX-J-12
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "J — OpenCLAW Agent Orchestration"
  competitor: openclaw
  demand_score: 3
  intake_status: missing
  description: >
    OpenCLAW receives and dispatches messages across WhatsApp, Telegram,
    Discord, Slack, Signal, and iMessage via a transport-agnostic envelope.
    Aprender parity: aprender-serve MUST expose a transport-agnostic
    Message envelope (sender, channel, body, metadata) that chat-app
    adapters can implement; the agent core must not hard-code a single
    transport. Overlaps with Claude Messages-API proxy (PMAT-CLAUDE-PROXY-001).
  openclaw_interpretation: openclaw-agent-resolved

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5.J'
  - https://openclaw.ai/
  - evidence/crux/openclaw/capability-matrix.yaml
  - evidence/crux/openclaw/gaps.md

equations:
  transport_agnostic_envelope:
    formula: |
      Message := { transport: T, channel_id: str, sender_id: str,
                   body: str, ts: timestamp, attachments: [blob] }
      adapter[T].ingest(native_event) → Message
      adapter[T].egress(Message)      → native_event
      agent_core(Message)             → Message                (pure, no T dependency)
    domain: native chat-app event
    codomain: normalized agent Message envelope
    invariants:
    - "agent core depends only on the Message envelope, not on any T"
    - "each transport adapter owns ingest + egress symmetrically"
    - "unsupported transport → observable error, not silent drop"

falsification_tests:
- id: FALSIFY-CRUX-J-12-001
  rule: transport-agnostic message envelope concept exists
  prediction: "aprender-serve / claude-proxy docs reference a normalized message envelope"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "message envelope transport-agnostic OR normalized chat event OR Messages API envelope" --limit 1 --format json | grep -q '"matches"' || {
        echo "FAIL: no normalized envelope documented" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-12 parity broken — aprender MUST expose a transport-agnostic message envelope
- id: FALSIFY-CRUX-J-12-002
  rule: agent core is transport-independent
  prediction: "core inference / agent code does not import any chat-app SDK directly"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "whatsapp SDK OR telegram bot SDK OR discord.py inside aprender crate" --limit 1 --format json | grep -q '"matches"' && {
        echo "FAIL: chat-app SDK leaked into agent core" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-12 isolation invariant — no chat-app SDK may leak into agent core

proof_obligations:
- type: invariant
  property: "agent core depends only on envelope"
- type: invariant
  property: "each transport adapter is ingest+egress symmetric"

verification_summary:
  total_obligations: 2
  proven: 0
  tested: 0
  status: draft

pmat_work_tracking:
  ticket_tag: crux-crux-j-12
  priority: medium
  auto_created: true
