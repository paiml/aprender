# ──────────────────────────────────────────────
# bin-aprender-present-terminal--score-v1 — the `score` bin target of package aprender-present-terminal
# (ONT-10 slice S12, 2/2)
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha256, helpSha256,
# gitSha, …) live in binary-surface-v1 and are not restated.
#
# MEASURED (2026-09-27, batch/ont-10 @ acc3827954, release build, private CARGO_TARGET_DIR, LC_ALL=C). score declares
# `required-features = ["score"]` and the package's default features are empty, so a default build does not produce
# it; it was built with `--features score`, the smallest build that has it (as S13 does for ptop).
#   `score --version` = "score 0.69.3": name right, no sha. LIVE RED on G0.1.
#   `--help` exits 0; `--no-such-flag` exits 2; `--output nosuch` exits 2 (clap possible values, G1.3 GREEN).
#   --help: 0 commands, one optional positional [PATH], 7 long options (--help/--version excluded): --ci, --config,
#   --no-color, --output, --quiet, --threshold, --verbose.
#   surface_audit.csv holds 2 rows: `score [PATH] (TUI-crate quality scoring)` keys on positional PATH, and
#   `score --ci --threshold <N> (…)` keys on --ci. Both resolve: GREEN apart from G0.1.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-present-terminal--score-v1
version: "1.0.0"
scope: >
  The command surface of the `score` binary (package aprender-present-terminal, src
  crates/aprender-present-terminal/src/bin/score.rs): its help, its usage errors, its version string, its options,
  its positional, and its surface-audit rows. Out of scope: how the quality score is computed.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-27'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    score answers --help, rejects an unknown flag or output format as a usage error, names the commit it was built
    from, exposes exactly the options the snapshot records, and has an audited ledger row for each mode. The
    extractor must build it with its required feature `score`, or there is no node.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'contracts/bin-aprender-contracts-cli--pv-v1.yaml — the exemplar'
    - 'crates/aprender-present-terminal/src/bin/score.rs — the clap Args'
    - 'crates/aprender-present-terminal/Cargo.toml — [[bin]] score, required-features = ["score"]'
    - 'docs/audits/surface_audit.csv — the rows whose binary column is score'
    - 'aprender#4502 — ONT-10, slice S12'

entity:
  type: binary
  ref: binary/aprender-present-terminal/score

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-score-surface
    targetClass: bin:target/aprender-present-terminal/score
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["score"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-present-terminal"]}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "^score [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-27 (no sha); a warning until the version string carries it
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: warning}
      - {path: bin:command, maxCount: 0}
      - path: bin:option
        minCount: 7
        maxCount: 7
        in:
          - "--ci"
          - "--config"
          - "--no-color"
          - "--output"
          - "--quiet"
          - "--threshold"
          - "--verbose"
      - {path: bin:positional, minCount: 1, maxCount: 1, in: ["PATH"]}
      - {path: bin:ledgerOrphan, maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(score)) = ∅ ∧ options(snapshot) = {--ci, --config, --no-color, --output, --quiet, --threshold, --verbose} ∧ positionals = {PATH} ∧ key(r) ∈ options ∪ {PATH} for every ledger row r with r.binary = score"
    domain: "the score line of the tracked snapshot (a --features score build) and the 2 ledger rows with binary = score"
    codomain: "set equality on options, or a Fail naming each option or orphan row"
    invariants:
      - "an added, dropped or renamed long option is a violation naming it"
      - "a ledgered option the built binary does not accept is an orphan, never a silent skip"
    preconditions:
      - "the snapshot was written at this commit from a build with feature score"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `score --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-SCORE-INV-001
    property: every score ledger row keys on an option or positional the built binary accepts
    formal: '∀ r ∈ surface_audit, r.binary = score: key(r) ∈ options(score) ∪ positionals(score)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-SCORE-001
    rule: 'G1.2 help answers'
    prediction: '`score --help` exits 0 with non-empty stdout'
    test: 'scripts/dogfood_surfaces.sh --cli score'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-27: exit 0, GREEN)'
    mutation: 'make main exit 1 on DisplayHelp; must turn RED'
  - id: FALSIFY-BIN-SCORE-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`score --no-such-flag` exits 2'
    test: 'scripts/dogfood_surfaces.sh --cli score'
    if_fails: 'a CI wrapper cannot tell a typo from a below-threshold score, which also exits nonzero (observed 2026-09-27: exit 2, GREEN)'
    mutation: 'map every clap error to exit 1; must turn RED'
  - id: FALSIFY-BIN-SCORE-003
    rule: 'G0.1 the version names the commit'
    prediction: '`score --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'LIVE RED 2026-09-27: "score 0.69.3" — no sha; a stale binary reads as HEAD'
    mutation: 'drop the sha from the clap version string; must turn RED'
  - id: FALSIFY-BIN-SCORE-004
    rule: 'G1.3 enumerated values are parsed by clap'
    prediction: '`score --output nosuch` exits 2 naming text, json, yaml'
    test: 'scripts/dogfood_surfaces.sh --cli score'
    if_fails: 'an unknown output format would fail later, or print text anyway (observed 2026-09-27: exit 2, GREEN)'
    mutation: 'turn --output into a String; must turn RED'
  - id: FALSIFY-BIN-SCORE-005
    rule: 'the option set equals the snapshot, and the extractor builds the required feature'
    prediction: 'options = the 7 above; a default-feature snapshot has no score node, which the surface_audit_bins gate names as a ledgered binary with no node'
    test: 'pv lint contracts/ --gate shapes on the snapshot (ONT-4g extract:binary); scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'score could drop out of the ontology silently because its feature is opt-in'
    mutation: 'delete --ci from the snapshot; must turn RED on bin:option (6) and bin:ledgerOrphan naming `score --ci --threshold <N>`'
