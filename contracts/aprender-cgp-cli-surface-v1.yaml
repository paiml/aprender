contract: aprender-cgp-cli-surface
metadata:
  kind: pattern
  version: "1.0.0"
  description: >
    ONT-10 binary slice S5: the CLI surface of the `aprender-cgp` binary (package aprender-cgp).
    It pins the invariants that `crates/aprender-cgp/tests/cli_surface_gate.rs`
    enforces against the binary built from HEAD (CARGO_BIN_EXE_aprender-cgp, never PATH).
    Shape follows contracts/pv-cli-surface-v1.yaml. Defects found by the
    2026-09-26 surface probe: `cgp explain <unknown target>` printed "Unknown target" and exited 0 (the unit test test_run_explain_unknown asserted is_ok, pinning the defect). Fixed: run_explain bails; the unit test now asserts is_err.
  references:
    - "contracts/pv-cli-surface-v1.yaml"
    - "contracts/apr-mono-binary-rule-v1.yaml"
    - "crates/aprender-cgp/tests/cli_surface_gate.rs"
equations:
  version_pinned:
    formula: "contains(stdout(aprender-cgp --version), CARGO_PKG_VERSION(aprender-cgp))"
    domain: "the binary built from this tree"
    codomain: "{true, false}"
    invariants:
      - "resolved via CARGO_BIN_EXE_aprender-cgp, which cannot fall back to a stale PATH copy"
  surface_pinned:
    formula: "subcommands(aprender-cgp --help) \\ {help} = [profile, bench, roofline, diff, contract, trace, explain, tui, baseline, doctor, compete]"
    domain: "the Commands: section of --help"
    codomain: "{equal, differs}"
    invariants:
      - "adding or removing a subcommand edits the gate's SUBCOMMANDS list and this formula together"
  advertised_implies_reachable:
    formula: "forall s in subcommands(aprender-cgp --help) . exit_code(aprender-cgp s --help) = 0"
    domain: "every subcommand the binary advertises"
    codomain: "{0, non-zero}"
    invariants:
      - "the universe is enumerated from the binary, not hardcoded"
  unknown_subcommand_is_usage_error:
    formula: "exit_code(aprender-cgp no-such-subcommand) = 2"
    domain: "an argv whose first word is not a subcommand"
    codomain: "{0, 1, 2, other}"
  unusable_input_is_rejected:
    formula: >
      forall (s, i) in rejection_rows . exit_code(aprender-cgp s i) not in {0, 101}
      and not contains(stderr, "panicked")
    domain: "`diff --baseline/--current` and `baseline --load` on each of the three unusable inputs, and `explain <unknown target>`; unusable inputs = {missing path, empty file, garbage bytes}"
    codomain: "{rejected, accepted, panicked}"
    invariants:
      - "a panic (101) is not a rejection: it is the crash this row exists to catch"
proof_obligations:
  - id: CGPS-INV-001
    type: invariant
    property: "aprender-cgp --version reports the version of the crate it was built from"
    formal: "CGPS-VERSION-PINNED"
    applies_to: all
  - id: CGPS-INV-002
    type: invariant
    property: "The advertised subcommand set is the pinned surface"
    formal: "CGPS-SURFACE-PINNED"
    applies_to: all
  - id: CGPS-INV-003
    type: invariant
    property: "Every advertised subcommand is reachable"
    formal: "CGPS-ADVERTISED-REACHABLE"
    applies_to: all
  - id: CGPS-INV-004
    type: invariant
    property: "An unknown subcommand is a usage error (exit 2)"
    formal: "CGPS-UNKNOWN-IS-USAGE"
    applies_to: all
  - id: CGPS-INV-005
    type: invariant
    property: "Input the binary cannot process is rejected with a clean non-zero exit"
    formal: "CGPS-REJECTS-UNUSABLE"
    applies_to: all
falsification_tests:
  - id: FALSIFY-CGPS-001
    rule: "CGPS-VERSION-PINNED"
    prediction: "`aprender-cgp --version` exits 0 and contains CARGO_PKG_VERSION."
    test_harness: "cargo test -p aprender-cgp --test cli_surface_gate version_reports_the_crate_version"
    expected_output: "exit 0"
    if_fails: "The binary under test is not the one this tree builds, or --version lost the crate version."
  - id: FALSIFY-CGPS-002
    rule: "CGPS-SURFACE-PINNED"
    prediction: "`aprender-cgp --help` advertises exactly: profile, bench, roofline, diff, contract, trace, explain, tui, baseline, doctor, compete."
    test_harness: "cargo test -p aprender-cgp --test cli_surface_gate advertised_subcommands_are_the_pinned_surface"
    expected_output: "exit 0"
    if_fails: "A subcommand was added or removed without updating the surface contract."
  - id: FALSIFY-CGPS-003
    rule: "CGPS-ADVERTISED-REACHABLE"
    prediction: "Every advertised subcommand exits 0 for `<cmd> --help`."
    test_harness: "cargo test -p aprender-cgp --test cli_surface_gate every_advertised_subcommand_is_reachable"
    expected_output: "exit 0"
    if_fails: "A command is advertised but unreachable (the #2527 defect class)."
  - id: FALSIFY-CGPS-004
    rule: "CGPS-UNKNOWN-IS-USAGE"
    prediction: "`aprender-cgp no-such-subcommand` exits 2."
    test_harness: "cargo test -p aprender-cgp --test cli_surface_gate unknown_subcommand_is_a_usage_error"
    expected_output: "exit 0"
    if_fails: "The parser accepted an unknown subcommand or mapped a usage error to another code."
  - id: FALSIFY-CGPS-005
    rule: "CGPS-REJECTS-UNUSABLE"
    prediction: "Each rejection row exits non-zero, not 101, with no panic on stderr."
    test_harness: "cargo test -p aprender-cgp --test cli_surface_gate unusable_input_is_rejected"
    expected_output: "exit 0 on an unmutated tree"
    if_fails: >
      MEASURED 2026-09-26 (aprender-01): with the explain fix reverted the gate is RED on exactly this test (`explain no-such-target` got Some(0)); restored, 5/5 GREEN.
qa_gate:
  id: F-CGPS-001
  name: "aprender-cgp CLI surface gate (ONT-10 S5)"
  checks:
    - "version_pinned"
    - "surface_pinned"
    - "advertised_implies_reachable"
    - "unknown_subcommand_is_usage_error"
    - "unusable_input_is_rejected"
  pass_criteria: >
    All 5 falsification tests pass via `cargo test -p aprender-cgp --test cli_surface_gate`.
