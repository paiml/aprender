metadata:
  version: "2.1.0"
  created: "2026-04-08"
  updated: "2026-08-14"
  author: PAIML Engineering
  registry: true
  references:
  - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    Enforces Rule 1+2 of APR-MONO: apr-cli is THE only user-facing binary.
    All other [[bin]] entries must be classified as build-tool, internal-helper,
    or legacy-to-migrate. PMAT-545 audit completed 2026-04-10.

equations:
  one_binary_rule:
    formula: |
      For all crates C in workspace:
        C.has_user_facing_binary => C == apr-cli
      "User-facing" = installed by `cargo install aprender`, has --help
      "Build-tool" = standalone dev tooling (pv)
      "Internal" = called by apr-cli as subprocess, or dev-only
      "Legacy" = pre-merge binary, functionality subsumed by `apr` subcommand
    domain: all workspace Cargo.toml files
    codomain: bool
    invariants:
    - "apr (from apr-cli) is the ONLY user-facing binary"
    - "pv (from aprender-contracts-cli) is the only build-tool exception"
    - "Internal binaries must document their justification"
    - "Legacy binaries must have a migration plan to apr subcommand"

  binary_audit_2026_04_10:
    formula: |
      22 crates with [[bin]], 24 total binary targets.
      Classification:

      USER-FACING (1 crate, 1 binary):
        apr-cli                -> apr              # THE user-facing binary

      BUILD-TOOL (1 crate, 1 binary):
        aprender-contracts-cli -> pv               # Contract validation (Rule 2 exception)

      INTERNAL-HELPER (6 crates, 7 binaries):
        aprender-cbtop         -> aprender-cbtop   # GPU monitor, called by `apr monitor`
        aprender-present-cli   -> presentar        # TUI server, called by `apr present`
        aprender-present-terminal -> score, ptop   # TUI widgets, used by presentar
        aprender-ptx-debug     -> aprender-ptx-debug  # CUDA PTX debugger (dev-only)
        aprender-test-cli      -> aprender-test-cli    # WASM test runner (dev-only)
        aprender-viz-ttop      -> aprender-viz-ttop    # Standalone ttop (excluded from workspace)

      QA-TOOL (2 crates, 2 binaries — from Phase 2g port):
        aprender-qa-cli        -> apr-qa           # QA playbook runner (to wire into `apr qa`)
        aprender-qa-certify    -> apr-qa-readme-sync  # README badge sync (CI tool)

      MIGRATED (2 crates — [[bin]] → [[example]]):
        aprender-serve         -> [[example]] aprender-serve   # Was: inference server. Use `apr serve`.
        aprender-train         -> [[example]] aprender-train   # Was: training CLI. Use `apr train`.

      MIGRATED (5 crates — [[bin]] DELETED, capability rehomed under `apr train`, 2026-08-14):
        aprender-train-bench   -> `apr train bench`    # entrenar_bench::cli::run_*
        aprender-train-distill -> `apr train distill`  # entrenar_distill::cli::run_*
        aprender-train-inspect -> `apr train inspect`  # entrenar_inspect::cli::run_*
        aprender-train-lora    -> `apr train lora`     # entrenar_lora::cli::run_*
        aprender-train-shell   -> `apr train shell`    # entrenar_shell::cli::run_*

      Why `apr train <tool>` and not the mappings this contract previously
      guessed (`apr distill`, `apr finetune`):
        - `apr distill` and `apr finetune` are flag-driven commands with an
          optional leading positional. Bolting `run|estimate|validate|export`
          onto them makes the first positional ambiguous — a breaking change to
          a shipped surface.
        - `apr bench` measures INFERENCE throughput of a model file;
          `aprender-train-bench` sweeps DISTILLATION hyperparameters. Same word,
          different subject. `apr inspect` reads `.apr` metadata;
          `aprender-train-inspect` reads SafeTensors training checkpoints.
          Neither pair is a duplicate, so neither binary could simply be deleted.
        - `apr train` is already the training namespace (plan/apply/watch/sweep/
          halving/archive/submit/cluster-status) and the crate names are
          `aprender-train-*`, so the rehoming is 1:1 and mechanical.

      LEGACY-TO-MIGRATE (5 crates, 5 binaries):
        aprender-cgp           -> aprender-cgp     # Contract graph processor → `apr contracts graph`
        aprender-data          -> alimentar        # Data loading → `apr data`
        aprender-db            -> aprender-db      # Embedded DB → `apr db`
        aprender-simulate      -> simular          # Simulation → `apr simulate`
        aprender-zram-cli      -> trueno-zram      # ZRAM manager → `apr zram`

    domain: 15 crates (22 → 20 after 2 migrated to [[example]]; → 15 after 5 train tools rehomed)
    codomain: classification
    invariants:
    - "USER-FACING count == 1 (apr only)"
    - "LEGACY-TO-MIGRATE must have `apr` subcommand alternative"
    - "After migration: legacy binaries become [[example]] or deleted"

falsification_tests:
- id: FALSIFY-BINRULE-001
  rule: one user-facing binary
  prediction: "only apr-cli produces a binary named 'apr'"
  test: |
    grep -r '^\[\[bin\]\]' crates/*/Cargo.toml -A1 |
      grep 'name.*=.*"apr"' |
      grep -v 'apr-qa' |
      wc -l  # must be exactly 1
  if_fails: "multiple crates produce a binary named 'apr'"

- id: FALSIFY-BINRULE-002
  rule: binary count monotonically decreasing
  prediction: "total [[bin]] count <= 18 (never increases without justification)"
  # Ratchet history: the bound read `<= 21` while the tree carried 23, so this
  # test was RED and nobody read it. Deleting the five aprender-train-* bins
  # (2026-08-14) brought the real count to 18; the bound is pinned there. It is
  # `-le`, so a later shard that removes more binaries still passes — only an
  # ADDED binary turns it red, which is the whole point.
  test: |
    COUNT=$(grep -r '^\[\[bin\]\]' crates/*/Cargo.toml | wc -l)
    [ "$COUNT" -le 18 ]
  if_fails: "new binary added without updating this contract"

- id: FALSIFY-BINRULE-003
  rule: legacy binaries have apr subcommand equivalent
  prediction: "every LEGACY/MIGRATED binary's functionality is reachable as an apr subcommand"
  # This used to grep `crates/apr-cli/src/commands_enum.rs` for the quoted
  # strings "serve" "train" "distill" "data". None of the four has ever
  # appeared in that file — the enum spells them `Serve {`, and `train` /
  # `distill` live in extended_commands.rs / model_ops_commands.rs — so the
  # test could only ever exit 1. It now reads the command registry that
  # CLAUDE.md names as authoritative, which does list them.
  test: |
    for cmd in serve train distill data; do
      grep -q "^  - name: ${cmd}\$" contracts/apr-cli-commands-v1.yaml || exit 1
    done
  if_fails: "legacy binary has no apr subcommand migration path"

- id: FALSIFY-BINRULE-004
  rule: the rehomed train tools kept their [[bin]] deleted AND stayed reachable
  prediction: >
    No aprender-train-{bench,distill,inspect,lora,shell} crate declares a
    [[bin]], and each still exposes the cli:: entry point `apr train <tool>`
    dispatches to.
  test: |
    for c in bench distill inspect lora shell; do
      grep -q '^\[\[bin\]\]' "crates/aprender-train-${c}/Cargo.toml" && exit 1
      test -f "crates/aprender-train-${c}/src/cli.rs" || exit 1
    done
    exit 0
  if_fails: "a train tool either grew its binary back or lost its library entry point"

proof_obligations:
- type: invariant
  property: "apr-cli is the only user-facing binary"
- type: invariant
  property: "binary count never increases without contract update"

verification_summary:
  total_obligations: 2
  proven: 0
  tested: 4
  status: audited
