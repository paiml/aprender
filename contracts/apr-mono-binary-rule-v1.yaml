metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
  - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    Enforces Rule 1 of APR-MONO: apr-cli is THE only user-facing binary.
    All other [[bin]] entries must be internal helpers, examples, or deleted.
    24 unauthorized binaries found in gap analysis — this contract tracks cleanup.

equations:
  one_binary_rule:
    formula: |
      For all crates C in workspace:
        C != apr-cli AND C != aprender-contracts-cli =>
          C has zero user-facing [[bin]] entries
      "User-facing" = installed by cargo install, has --help, produces CLI output
      "Internal" = called by apr-cli as subprocess, or dev-only tooling
    domain: all workspace Cargo.toml files
    codomain: bool
    invariants:
    - "apr-cli is the ONLY user-facing binary"
    - "aprender-contracts-cli is the only exception (build tooling)"
    - "Internal helper binaries are acceptable if called by apr-cli"
    - "Demo/benchmark binaries must be examples, not [[bin]]"

  unauthorized_binary_classification:
    formula: |
      For each unauthorized [[bin]] B:
        classify(B) in {DELETE, MOVE_TO_EXAMPLE, KEEP_INTERNAL}
        DELETE: dead code, unused, replaced by apr subcommand
        MOVE_TO_EXAMPLE: demo/benchmark → [[example]] section
        KEEP_INTERNAL: called by apr-cli as subprocess
    domain: 13 unauthorized binaries not used by apr-cli
    codomain: classification enum
    invariants:
    - "DELETE removes [[bin]] entry AND source file"
    - "MOVE_TO_EXAMPLE changes [[bin]] to [[example]] in Cargo.toml"
    - "After cleanup: zero unauthorized user-facing binaries"

  classification_registry:
    formula: |
      trueno-monitor       -> DELETE (replaced by apr monitor)
      generate_fixtures    -> MOVE_TO_EXAMPLE (test data gen)
      repartir-worker      -> DELETE (distributed worker, unused)
      aprender-monte-carlo -> MOVE_TO_EXAMPLE (demo)
      ptop                 -> KEEP_INTERNAL (presentar system monitor)
      tui-compare          -> MOVE_TO_EXAMPLE (benchmark)
      cbtop-bench          -> MOVE_TO_EXAMPLE (benchmark)
      aprender_registry    -> DELETE (replaced by apr pull/list)
      wine_lambda          -> MOVE_TO_EXAMPLE (Lambda demo)
      mnist_lambda         -> MOVE_TO_EXAMPLE (Lambda demo)
      realizar-monitor     -> DELETE (replaced by apr monitor)
      aprender-shell       -> DELETE (replaced by apr chat)
      aprender-tsp         -> MOVE_TO_EXAMPLE (demo)
      aprender-viz-ttop    -> KEEP_INTERNAL (standalone ttop)
    domain: 14 unauthorized binaries
    codomain: action

falsification_tests:
- id: FALSIFY-BINRULE-001
  rule: zero unauthorized user-facing binaries
  prediction: "only apr-cli and aprender-contracts-cli have [[bin]]"
  test: |
    UNAUTHORIZED=0
    for toml in crates/*/Cargo.toml; do
      CRATE=$(basename $(dirname "$toml"))
      [ "$CRATE" = "apr-cli" ] && continue
      [ "$CRATE" = "aprender-contracts-cli" ] && continue
      BINS=$(grep -c '^\[\[bin\]\]' "$toml")
      [ "$BINS" -gt 0 ] && UNAUTHORIZED=$((UNAUTHORIZED+BINS))
    done
    [ "$UNAUTHORIZED" -eq 0 ]
  if_fails: "unauthorized binaries still exist"

proof_obligations:
- type: invariant
  property: "apr-cli is the only user-facing binary"

verification_summary:
  total_obligations: 1
  proven: 0
  tested: 0
  status: pending
