# ──────────────────────────────────────────────
# bin-aprender-explain--aprender-explain-v1 — the `aprender-explain` bin target of package aprender-explain
# (ONT-10 slice S18, 2/3)
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha256, helpSha256,
# gitSha, …) live in binary-surface-v1 and are not restated.
#
# MEASURED (2026-09-27, batch/ont-10 @ 8e88b8fc5d, release build, default features, private CARGO_TARGET_DIR):
#   `--version` = "trueno-explain 0.69.3": the pre-monorepo name (#[command(name = "trueno-explain")]) and no sha.
#   LIVE RED on the name pattern and on G0.1.
#   `--help` exits 0; `--no-such-flag` exits 2.
#   Commands: bugs, compare, diff, ptx, simd, tui, wgpu (clap's `help` excluded); no nested subcommands.
#   `-K/--kernel <NAME>` takes one of 7 kernels, but as a free String checked after clap: `ptx -K nosuch` exits 1
#   and --help says "see --help for list" without listing them (G1.3 LIVE RED).
#   FIXED in the same PR: clap name aprender-explain; -K/-a/-b parse through kernel_names() (rc=2 on nosuch).
#   surface_audit.csv: 7 rows, set-equal to the commands.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-explain--aprender-explain-v1
version: "1.0.0"
scope: >
  The command surface of the `aprender-explain` binary (package aprender-explain, src
  crates/aprender-explain/src/main.rs): its help, its usage errors, its version string, its subcommand set, and its
  surface-audit rows. Out of scope: what each analysis computes.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-27'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    aprender-explain answers --help, rejects an unknown flag as a usage error, names itself and the commit it was
    built from, exposes exactly the subcommands the snapshot records, and has an audited ledger row for each.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'contracts/bin-aprender-contracts-cli--pv-v1.yaml — the exemplar'
    - 'crates/aprender-explain/src/main.rs — the clap Commands enum'
    - 'docs/audits/surface_audit.csv — the rows whose binary column is aprender-explain'
    - 'aprender#4502 — ONT-10, slice S18'

entity:
  type: binary
  ref: binary/aprender-explain/aprender-explain

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-aprender-explain-surface
    targetClass: bin:target/aprender-explain/aprender-explain
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["aprender-explain"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-explain"]}
      # was RED at 8e88b8fc5d ("trueno-explain 0.69.3"); FIXED on batch/ont-10 (clap name = aprender-explain)
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "^aprender-explain [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-27 (no sha); a warning until the version string carries it
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: warning}
      - path: bin:command
        minCount: 7
        maxCount: 7
        in:
          - "bugs"
          - "compare"
          - "diff"
          - "ptx"
          - "simd"
          - "tui"
          - "wgpu"
      - {path: bin:unledgeredCommand, maxCount: 0}
      - {path: bin:ledgerOrphan, maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(aprender-explain)) = subcommands(clap(Cli)) = {bugs, compare, diff, ptx, simd, tui, wgpu} ∧ commands ⊆ {f.feature : f ∈ surface_audit, f.binary = aprender-explain}"
    domain: "the aprender-explain line of the tracked snapshot, the clap Commands enum, and the 7 ledger rows"
    codomain: "set equality, or a Fail naming each command in the symmetric difference"
    invariants:
      - "a subcommand clap accepts and the snapshot omits is an unaudited surface"
    preconditions:
      - "the snapshot was written at this commit"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `aprender-explain --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-APRENDER-EXPLAIN-INV-001
    property: every aprender-explain subcommand has an audited ledger row
    formal: '∀ c ∈ commands(aprender-explain): |{r ∈ surface_audit : r.binary = aprender-explain ∧ r.feature = "aprender-explain " ++ c}| ≥ 1'
    prose: false
  - id: BIN-APRENDER-EXPLAIN-INV-002
    property: unusable input is a clean rejection, never a success and never a panic
    formal: '∀ a ∈ rejection_rows(crates/aprender-explain/tests/cli_surface_gate.rs): exit(a) ∉ {0, 101} ∧ "panicked" ∉ stderr(a)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-APRENDER-EXPLAIN-001
    rule: 'G1.2 help answers'
    prediction: '`aprender-explain --help` exits 0 with non-empty stdout'
    test: 'cargo test -p aprender-explain --test cli_surface_gate every_advertised_subcommand_is_reachable'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-27: exit 0, GREEN)'
    mutation: 'make the top-level --help return an error; must turn RED'
  - id: FALSIFY-BIN-APRENDER-EXPLAIN-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`aprender-explain --no-such-flag` exits 2'
    test: 'cargo test -p aprender-explain --test cli_surface_gate unknown_'
    if_fails: 'a typo is silently ignored (observed 2026-09-27: exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-APRENDER-EXPLAIN-003
    rule: 'G0.1 the version names the binary and the commit'
    prediction: '`aprender-explain --version` starts with "aprender-explain " and contains the first 9 hex of the git sha'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'name: FIXED on batch/ont-10 (was "trueno-explain 0.69.3"); sha: LIVE RED on 0.69.3, clears at rc.1 (car/0.70.0 carries #4219)'
    mutation: 'restore #[command(name = "trueno-explain")] after a fix; must turn RED on bin:versionString'
  - id: FALSIFY-BIN-APRENDER-EXPLAIN-004
    rule: 'G1.3/G1.4 enumerated values are parsed by clap and the command set equals the snapshot'
    prediction: '`aprender-explain ptx -K nosuch` exits 2 naming the allowed kernels; subcommands(clap) = the 7 literals above'
    test: 'cargo test -p aprender-explain --test cli_surface_gate -- advertised_subcommands_are_the_pinned_surface malformed_arguments_are_usage_errors'
    if_fails: 'a bad kernel name runs past clap (was RED at 8e88b8fc5d: exit 1, "Unknown kernel: nosuch. Available: vector_add, gemm_naive, gemm_tiled, softmax, q4k_gemm, q5k_gemm, q6k_gemm"); FIXED on batch/ont-10: kernel_names() value_parser on all 6 kernel flags, exit 2, --help lists them'
    mutation: 'after the fix, turn -K back into a String; must turn RED'
  - id: FALSIFY-BIN-APRENDER-EXPLAIN-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 row per command with binary = aprender-explain (7 on 2026-09-27)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'the binary would ship unaudited (observed 2026-09-27: 7/7, GREEN)'
    mutation: 'delete every aprender-explain row; must turn RED naming aprender-explain'
  - id: FALSIFY-BIN-APRENDER-EXPLAIN-006
    rule: 'unusable input is rejected cleanly'
    prediction: '`diff -K vector_add --baseline` on a missing, empty and garbage file: each exits non-zero, not 101, with no "panicked" on stderr'
    test: 'cargo test -p aprender-explain --test cli_surface_gate unusable_input_is_rejected'
    if_fails: 'MEASURED 2026-09-27 (aprender-01): each exits 1 with no panic, GREEN; no source mutation was run for this binary'
    mutation: 'make a rejection path return Ok(()) or unwrap the read; must turn RED on that row'
