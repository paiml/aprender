metadata:
  kind: kaizen
  version: "1.0.0"
  author: "PAIML Engineering"
  description: "blis-profiling-guard-v1 — kaizen KAIZEN-038 improvement record"
  references:
    - "KAIZEN-038"

contract: blis-profiling-guard-v1
version: 1.0.0
status: implemented
kaizen: 038
invariants:
- id: C-BLISPROFILE-001
  description: Instant::now() only called when profiler is active
  preconditions:
  - profiler parameter is Option<&mut BlisProfiler>
  postconditions:
  - 'When profiler.is_none(): zero Instant::now() syscalls per macroblock'
  - 'When profiler.is_some(): timing behavior unchanged'
  - Numerical output identical regardless of profiler state
  invariants:
  - track_time flag computed once per gemm_blis call
  - record_prof accepts Option<Instant> — no-op when None
  verified_by:
  - 240 BLIS tests passed, 0 failures
  - cargo check (clean compilation)
affected_files:
- path: src/blis/compute.rs
  functions:
  - 'compute_macroblock: Instant::now() gated by track_time'
  - 'gemm_blis: start/pack_start gated by track_time'
  - 'record_prof: signature changed to accept Option<Instant>'
  change: '- midi_start/micro_start now Option<Instant>, only Some when profiling

    - record_prof takes Option<Instant> instead of Instant

    - All 6 Instant::now() call sites gated by profiler.is_some()

    '
performance_note: 'For 1024x1024 GEMM (MC=128, KC=256, MR=8, NR=6):

  - Microkernels per macroblock: ~1366 (128/8 × 64/6)

  - Instant::now() cost: ~20-40ns per call

  - Total overhead per macroblock: ~27-55μs

  - With fix: 0μs when profiler is disabled (the common case)

  '
qa_gate:
  id: F-BPGV-001
  name: blis-profiling-guard-v1 Contract
  description: Quality gate for blis-profiling-guard-v1
  checks:
  - validation
  - falsification
falsification_tests:
  - id: FALSIFY-BLIS_PROFILING_GUARD_V1-001
    description: "when profiler.is_some(), gemm_blis still takes Instant timings and records them"
    test: "cargo test -p aprender-compute --lib test_falsification_55_profiler_works"
    prediction: "a 64x64 gemm_blis with BlisProfiler::enabled() leaves macro_stats.flops > 0, macro_stats.total_ns > 0, and a summary containing 'GFLOP/s'"
    if_fails: "the track_time gate is inverted or dropped, so an active profiler records zero time and profiling silently breaks"
  - id: FALSIFY-BLIS_PROFILING_GUARD_V1-002
    description: "when profiler.is_some(), record_prof still records macroblock stats per gemm_blis call"
    test: "cargo test -p aprender-compute --lib blis::tests::profiler_heijunka::test_profiler_records_timing"
    prediction: "a 128x128 gemm_blis with BlisProfiler::enabled() leaves macro_stats.count > 0 and macro_stats.flops > 0"
    if_fails: "record_prof becomes a no-op even when given Some(Instant), so enabled profiling reports no macroblocks"
  - id: FALSIFY-BLIS_PROFILING_GUARD_V1-003
    description: "with profiler = None (no Instant::now calls), gemm_blis output is still numerically correct"
    test: "cargo test -p aprender-compute --lib blis::tests::blis_gemm::test_gemm_blis_medium"
    prediction: "a 64x64 gemm_blis(..., None) matches gemm_reference element-wise within 1e-3"
    if_fails: "gating the timing code on the profiler changed the compute path, so the unprofiled (common) case returns wrong results"
