metadata:
  kind: kaizen
  version: "1.0.0"
  author: "PAIML Engineering"
  description: "blis-safe-alloc-v1 — kaizen KAIZEN-027 improvement record"
  references:
    - "KAIZEN-027"

contract: blis-safe-alloc-v1
version: 1.0.0
status: implemented
kaizen: '027'
invariants:
- id: C-BLIS-ALLOC-001
  description: BLIS alloc functions return fully initialized Vec<f32>
  preconditions:
  - Input slices are valid and have correct lengths per function contract
  postconditions:
  - Output Vec is initialized to zeros before computation
  - All output elements are overwritten by the BLIS operation
  - No undefined behavior from uninitialized reads
  invariants:
  - Vec length matches input length(s)
  - No unsafe blocks in alloc wrapper functions
  verified_by:
  - blis::elementwise::tests (all pass)
  - blis::norms::tests (all pass)
  - blis::softmax::tests (all pass)
  - cargo clippy --lib --all-features -- -D warnings (zero errors)
  - cargo test --lib (3338 passed, 0 failed)
affected_functions:
- path: src/blis/elementwise.rs
  functions:
  - relu_alloc
  - add_alloc
  - mul_scalar_alloc
  change: Vec::with_capacity(n) + unsafe set_len(n) → vec![0.0f32; n]
- path: src/blis/norms.rs
  functions:
  - rms_norm_alloc
  - layer_norm_alloc
  change: Vec::with_capacity(n) + unsafe set_len(n) → vec![0.0f32; n]
- path: src/blis/softmax.rs
  functions:
  - softmax_scalar (pass 2)
  - softmax_avx2 (pass 2)
  change: Vec::with_capacity(n) + unsafe set_len(n) → vec![0.0f32; n]
performance_note: "The zero-fill overhead is negligible because:\n1. memset is a single SSE/AVX store loop (hardware-optimized)\n\
  2. For typical BLIS sizes (n < 16K), data fits in L1 cache\n3. The immediately-following computation will touch every element\
  \ anyway\n4. Zero-fill ensures cache lines are in Modified state, avoiding\n   copy-on-write faults from the allocator\n"
ci_fixes:
- issue: 1503 clippy errors on main (0 passing CI runs)
  fix: Workspace-level allows for pedantic/style lints
- issue: unwrap() disallowed in test code
  fix: Split CI into lib (strict) and tests (relaxed) passes
- issue: Flaky macOS timing test (500us tolerance too tight)
  fix: Increased to 2ms for CI runner scheduling jitter
qa_gate:
  id: F-BSAV-001
  name: blis-safe-alloc-v1 Contract
  description: Quality gate for blis-safe-alloc-v1
  checks:
  - validation
  - falsification
falsification_tests:
  - id: FALSIFY-BLIS_SAFE_ALLOC_V1-001
    description: "add_alloc returns a Vec of the input length with every element written by the BLIS add"
    test: "cargo test -p aprender-compute --lib coverage_contract::falsify_blis_003_elementwise_add"
    prediction: "for lengths 1,7,8,15,16,31,32,100,255,256,1000, add_alloc(0..len, len..0) has length len and every element equals len within 1e-5"
    if_fails: "add_alloc returns a wrong-length Vec or leaves elements unwritten (zero or garbage) on a SIMD remainder"
  - id: FALSIFY-BLIS_SAFE_ALLOC_V1-002
    description: "relu_alloc overwrites every output element with max(x, 0)"
    test: "cargo test -p aprender-compute --lib coverage_contract::falsify_blis_010_relu"
    prediction: "for 100 inputs in [-5.0, 4.9], each output is exactly 0.0 for negative x and exactly x otherwise"
    if_fails: "relu_alloc leaves positive positions at the initial zero or returns uninitialized values"
  - id: FALSIFY-BLIS_SAFE_ALLOC_V1-003
    description: "rms_norm_alloc returns a fully written, finite Vec of the input length"
    test: "cargo test -p aprender-compute --lib coverage_contract::falsify_blis_004_rms_norm"
    prediction: "rms_norm_alloc on [1..8] with unit gamma returns 8 finite values whose absolute sum is > 0"
    if_fails: "rms_norm_alloc returns the zero-filled buffer unwritten, a wrong length, or non-finite values from uninitialized memory"
  - id: FALSIFY-BLIS_SAFE_ALLOC_V1-004
    description: "softmax pass 2 writes every element of its allocated output, including SIMD remainders"
    test: "cargo test -p aprender-compute --lib blis::softmax::tests::test_softmax_remainder_sizes"
    prediction: "for n in [1,2,7,8,15,31,33,63,65,127,255], softmax_1d_alloc returns n elements that sum to 1.0 within 1e-5"
    if_fails: "a remainder element of the softmax output is left at zero or garbage, so the length or the sum to 1 breaks"
