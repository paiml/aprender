contract: batched-matmul-zero-copy-v1
version: 1.0.0
status: implemented
kaizen: 039
invariants:
- id: C-BATCHGEMM-001
  description: Batched matmul calls BLIS directly on sub-slices — no intermediate copies
  preconditions:
  - a_data.len() == batch * m * k
  - b_data.len() == batch * k * n
  postconditions:
  - output[bh] == gemm(a_data[bh], b_data[bh]) for all bh in [0, batch)
  - 'Zero intermediate Vec allocations per batch element (was: 2 per element)'
  - Numerical output identical to Matrix::from_slice + matmul path
  invariants:
  - WASM path falls back to Matrix::from_slice (gemm_blis requires x86)
  - 4D variant handles batch * heads as flat batch dimension
  verified_by:
  - 17 batched matmul tests passed, 0 failures
  - 24 matrix arithmetic tests passed, 0 failures
affected_files:
- path: src/matrix/ops/arithmetic.rs
  functions:
  - 'batched_matmul: gemm_blis on sub-slices instead of Matrix::from_slice'
  - 'batched_matmul_4d: same optimization for 4D attention pattern'
  change: '- Both functions now call crate::blis::gemm_blis directly

    - WASM path preserved via #[cfg] gate

    - Eliminates 2 × batch Vec allocations per call

    '
performance_note: 'For Qwen3-4B attention (batch=1, heads=32, seq=256, head_dim=80):

  - Before: 64 Matrix::from_slice copies per attention layer (2 × 32 heads)

  - Each copy: 256 × 80 × 4 = 80 KB

  - Total per attention: 64 × 80 KB = 5 MB of unnecessary copies

  - With 36 layers: 180 MB allocation churn per forward pass

  - After: 0 MB — gemm_blis operates directly on input slices

  '
qa_gate:
  id: F-BMZC-001
  name: batched-matmul-zero-copy-v1 Contract
  description: Quality gate for batched-matmul-zero-copy-v1
  checks:
  - validation
  - falsification
falsification_tests:
  - id: FALSIFY-BATCHED_MATMUL_ZERO_COPY_V1-001
    description: "output[b] == gemm(a_data[b], b_data[b]) for every batch element b, computed on sub-slices"
    test: "cargo test -p aprender-compute --lib test_batched_matmul_basic"
    prediction: "for batch=2, m=2, k=3, n=2 the 8 outputs are [22,28,49,64] for batch 0 and [220,244,301,334] for batch 1, each within 1e-5"
    if_fails: "a batch element reads the wrong A/B sub-slice or writes into the wrong output stride, so batched results no longer equal per-batch GEMM"
  - id: FALSIFY-BATCHED_MATMUL_ZERO_COPY_V1-002
    description: "batched_matmul_4d treats batch * heads as one flat batch dimension"
    test: "cargo test -p aprender-compute --lib embedding_batched::test_batched_matmul_4d_basic"
    prediction: "with batch=1, heads=2 and identity B per head, head 0 returns [1,2,3,4] and head 1 returns [5,6,7,8] at output offsets 0..4 and 4..8"
    if_fails: "the 4D path mis-strides heads, so one head's attention output lands in or is computed from another head's slice"
  - id: FALSIFY-BATCHED_MATMUL_ZERO_COPY_V1-003
    description: "precondition a_data.len() == batch * m * k is enforced before any sub-slice is taken"
    test: "cargo test -p aprender-compute --lib embedding_batched::test_batched_matmul_a_size_mismatch"
    prediction: "a_data of length 10 for batch=2, m=2, k=3 returns Err whose message contains 'A data size mismatch'"
    if_fails: "a short A buffer is sliced without a length check, panicking out of bounds or reading the wrong data instead of returning InvalidInput"
