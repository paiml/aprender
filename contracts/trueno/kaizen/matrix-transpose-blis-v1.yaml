metadata:
  kind: kaizen
  version: "1.0.0"
  author: "PAIML Engineering"
  description: "matrix-transpose-blis-v1 — kaizen KAIZEN-040 improvement record"
  references:
    - "KAIZEN-040"

contract: matrix-transpose-blis-v1
version: 1.0.0
status: implemented
kaizen: '040'
invariants:
- id: C-TRANSPOSE-001
  description: Matrix::transpose() delegates to crate::blis::transpose for AVX2 acceleration
  preconditions:
  - self.data.len() == self.rows * self.cols
  postconditions:
  - result[j, i] == self[i, j] for all (i, j)
  - Uses AVX2 8×8 in-register micro-kernel on x86_64 with AVX2
  - Falls back to scalar for WASM, non-AVX2, and matrices < 64 elements
  - Backend field preserved in result matrix
  invariants:
  - 'Output dimensions: result.rows == self.cols, result.cols == self.rows'
  - Bitwise identical to scalar transpose (no floating-point reordering)
  - BLIS transpose handles remainder edges (non-8-aligned dims) internally
  verified_by:
  - 20 linear algebra tests passed
  - 8 BLIS transpose tests passed
  - 188 matrix tests passed (including property tests)
affected_files:
- path: src/matrix/ops/linear/mod.rs
  functions:
  - 'Matrix::transpose: delegates to crate::blis::transpose::transpose()'
  change: '- Replaced scalar 32×32 block iteration with crate::blis::transpose() call

    - BLIS transpose uses AVX2 8×8 micro-kernel, 64×64 L1 tiling, prefetch

    - Shape-adaptive loop ordering for tall-skinny matrices

    - Fallback to scalar element-copy on dimension mismatch (unreachable by construction)

    '
performance_note: 'For attention-shaped transpose (2048×128, Qwen3-4B):

  - Before: scalar element copy, 32×32 blocks, no SIMD

  - After: AVX2 8-wide loads/stores, 3-phase shuffle/permute, L1-resident tiling

  - AVX2 processes 8×8 = 64 elements per micro-kernel invocation

  - Shape-adaptive: tall-skinny (rows ≥ 4×cols) uses sequential-write loop order

  '
qa_gate:
  id: F-MTBV-001
  name: matrix-transpose-blis-v1 Contract
  description: Quality gate for matrix-transpose-blis-v1
  checks:
  - validation
  - falsification
falsification_tests:
  - id: FALSIFY-MATRIX_TRANSPOSE_BLIS_V1-001
    description: "Matrix::transpose gives result[j, i] == self[i, j] with result.rows == self.cols and result.cols == self.rows"
    test: "cargo test -p aprender-compute --lib matrix::tests::transpose::"
    prediction: "a 2x3 matrix [1..6] transposes to 3x2 with t[0,1]=4, t[1,0]=2, t[2,1]=6, and square, single-row, single-col, 1x1 and identity cases match element by element"
    if_fails: "Matrix::transpose swaps the wrong indices or reports the wrong output dimensions after delegating to blis::transpose"
  - id: FALSIFY-MATRIX_TRANSPOSE_BLIS_V1-002
    description: "output dimensions are swapped for every shape, including ones large enough for the BLIS path"
    test: "cargo test -p aprender-compute --lib proptest_properties::test_transpose_dimension_swap"
    prediction: "for random m, n in 1..20, Matrix::zeros(m, n).transpose() has rows == n and cols == m"
    if_fails: "Matrix::transpose builds the result with unswapped dimensions for some shapes"
  - id: FALSIFY-MATRIX_TRANSPOSE_BLIS_V1-003
    description: "the dispatched (AVX2) transpose is bitwise identical to the scalar transpose"
    test: "cargo test -p aprender-compute --lib blis::transpose::tests::test_avx2_scalar_parity"
    prediction: "for the 2048x128 attention shape, transpose() output equals transpose_scalar_impl() output under assert_eq (bitwise)"
    if_fails: "the AVX2 8x8 micro-kernel misplaces or alters values, so the SIMD path diverges from the scalar reference"
  - id: FALSIFY-MATRIX_TRANSPOSE_BLIS_V1-004
    description: "BLIS transpose handles non-8-aligned remainder edges internally"
    test: "cargo test -p aprender-compute --lib blis::transpose::tests::test_non_aligned"
    prediction: "for shapes 7x13, 17x3, 1x32, 32x1, 1x1 and 3x3, transpose() equals the naive element-copy transpose exactly"
    if_fails: "edge rows or columns outside the 8x8 tiles are skipped or written to the wrong place"
