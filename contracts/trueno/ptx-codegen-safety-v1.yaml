metadata:
  version: 1.0.0
  created: '2026-04-06'
  author: PAIML Engineering
  description: >
    PTX codegen safety contract — verifies that PTX assembly emitted by
    the kernel generator is well-formed, targets the correct SM version,
    stays within register limits, and uses no undefined instructions.
  references:
  - 'NVIDIA PTX ISA — .target directive, register usage'
  - 'crates/aprender-gpu/src/ptx/ — kernel PTX generation'
  - 'crates/aprender-serve/src/cuda/ — emit_ptx_for_target()'
  - 'paiml/aprender#613 — Jetson PTX CUDA_ERROR_INVALID_VALUE'
  depends_on:
  - ptx-target-parity-v1

equations:
  target_directive_present:
    formula: |
      forall ptx in emit_ptx_for_target(sm):
        ptx.contains(".target sm_{sm}")
        AND ptx.contains(".address_size 64")
    domain: SM target version (70, 75, 80, 86, 87, 89, 90, 100, 120, 121)
    codomain: PTX string with correct .target directive
    invariants:
    - Every emitted PTX contains exactly one .target directive
    - Target matches the device compute capability
    - No hardcoded sm_70 in dynamic codegen paths
    preconditions:
    - sm in supported_targets
    postconditions:
    - ptx starts with .version and .target directives
    lean_theorem: Theorems.TargetDirectivePresent

  register_budget:
    formula: |
      forall kernel K:
        reg_count(K) <= max_regs_per_thread(sm)
        shared_mem(K) <= max_shared_per_block(sm)
    domain: Compiled PTX kernel
    codomain: Register and shared memory usage
    invariants:
    - "Limits are QUERIED from the device (cuDeviceGetAttribute), never tabulated per SM:
       a per-arch table goes stale every GPU generation and this one did, at sm_90."
    - "block_size <= CU_FUNC_ATTRIBUTE_MAX_THREADS_PER_BLOCK of the COMPILED kernel"
    - "static_shared + dynamic_shared <= CU_DEVICE_ATTRIBUTE_MAX_SHARED_MEMORY_PER_BLOCK"
    - "num_regs * block_size <= CU_DEVICE_ATTRIBUTE_MAX_REGISTERS_PER_BLOCK"
    - "Exceeding limits causes CUDA_ERROR_INVALID_VALUE (GH-613)"
    preconditions:
    - kernel compiled for target SM
    postconditions:
    - cuOccupancyMaxActiveBlocksPerMultiprocessor > 0
    enforced_by:
    - crates/aprender-gpu/src/launch_budget.rs::validate_launch (pure policy, runs
      in the required check)
    - crates/aprender-gpu/src/driver/budget_query.rs::enforce_register_budget (device
      query + the postcondition above)
    lean_theorem: Theorems.RegisterBudget

  instruction_validity:
    formula: |
      forall instr in ptx_instructions(K):
        instr.opcode in valid_opcodes(target_sm)
      No sm_80-only instructions emitted for sm_70 target
    domain: PTX instruction stream
    codomain: bool (all instructions valid for target)
    invariants:
    - dp4a requires sm_61+ (not available on sm_50)
    - wmma requires sm_70+
    - cp.async requires sm_80+
    - mma.sp (sparse) requires sm_80+
    preconditions:
    - ptx is syntactically valid
    postconditions:
    - cuModuleLoadDataEx returns CUDA_SUCCESS
    lean_theorem: Theorems.InstructionValidity

kernel_structure:
  phases:
  - name: validate_input
    description: Verify SM target is in supported set
  - name: execute
    description: Emit PTX, parse directives, check instruction set
  - name: verify_output
    description: Verify target matches, register budget, instruction validity

proof_obligations:
- type: invariant
  property: Target directive matches device
  formal: 'ptx.contains(".target sm_{device_sm}")'
  applies_to: target_directive_present
  lean:
    theorem: Theorems.TargetDirectivePresent
    status: sorry
- type: bound
  property: Register budget within SM limits
  formal: 'reg_count <= 255'
  applies_to: register_budget
  lean:
    theorem: Theorems.RegisterBudget
    status: sorry
- type: invariant
  property: No undefined instructions for target
  formal: 'all opcodes valid for target SM'
  applies_to: instruction_validity
  lean:
    theorem: Theorems.InstructionValidity
    status: sorry

falsification_tests:
- id: FALSIFY-PTX-001
  rule: Target directive present
  prediction: PTX for sm_86 contains ".target sm_86"
  test: |
    Generate PTX for sm_86, grep for .target directive.
  if_fails: PTX emitted without .target or with wrong SM
- id: FALSIFY-PTX-002
  rule: No hardcoded sm_70
  prediction: No runtime PTX path uses emit_ptx() (hardcoded sm_70)
  test: |
    grep -r "emit_ptx()" in executor/, assert 0 matches.
  if_fails: Hardcoded sm_70 path bypasses dynamic target
- id: FALSIFY-PTX-003
  rule: Register budget
  prediction: >
    A launch whose block size exceeds the compiled kernel's own
    CU_FUNC_ATTRIBUTE_MAX_THREADS_PER_BLOCK is REFUSED, and a legal launch reports
    cuOccupancyMaxActiveBlocksPerMultiprocessor > 0.
  test: |
    cargo test -p aprender-gpu --lib launch_budget
    cargo test -p aprender-gpu --features cuda --lib launch_budget
  red_witness: |
    Each budget has its OWN mutation; one mutation does not falsify the others.
    Deleting the block-size comparison in launch_budget.rs::validate_launch turns RED:
      launch_budget::tests::rejects_block_above_kernel_max
      launch_budget::tests::kernel_max_is_reported_before_device_max
      launch_budget::tests::violations_name_both_sides_of_the_comparison
      driver::cuda_tests::launch_budget_hw::budget_goes_red_on_an_oversized_block
    The hardware test only witnesses this because it asserts the SPECIFIC violation
    ("kernel's max_threads_per_block"). Asserting merely is_err() would have let the
    mutation survive: the launch falls through to the device-wide check and still
    errors. That was measured, not assumed — the first version of this test DID
    survive the mutation.
  if_fails: Register spilling causes performance cliff or INVALID_VALUE

kani_harnesses:
- id: KANI-PTX-001
  obligation: Target directive matches device
  property: '.target present and correct'
  bound: 8
  strategy: bounded_int
  harness: verify_target_directive
- id: KANI-PTX-002
  obligation: Register budget within SM limits
  property: 'reg_count <= 255'
  bound: 8
  strategy: bounded_int
  harness: verify_register_budget
- id: KANI-PTX-003
  obligation: No undefined instructions for target
  property: 'all opcodes valid'
  bound: 8
  strategy: exhaustive
  harness: verify_instruction_validity

qa_gate:
  id: F-PTX-CODEGEN-GATE
  name: PTX Codegen Safety Contract
  description: Quality gate for PTX assembly generation correctness
  checks:
  - validation
  - falsification
  pass_criteria: All 3 falsification tests pass
