  description: 'Experiment tracking and lineage vs MLflow / DVC. EXT-001 surface C5 `tracking`. Arms:
    MLflow 3 (LoggedModel lineage, aliases); DVC (content-addressed data/model versions); W&B (comparator:
    unrunnable-hermetically — SaaS, no artifact sha). Comparator: behavioural fixtures; MLflow and DVC
    pinned in containers. Metric: (a) one command answers which run, dataset sha and base produced model
    X; (b) dataset identity is content-addressed; (c) promotion is an alias, never a mutation; (d) works
    offline with no server; (e) write overhead per metric row (report-only). Gate: coverage only (R-14);
    gap_effect recorded.'
  surface: tracking
  ext_surface: C5
  verbs:
  - runs
  - registry
  crux_coverage: covered
  gap_effect: closes
  gap_note: 'closes one gap: `apr runs gc` (EXT-03) reaps .tmp and orphaned runs keyed on (host, boot_id,
    pid, start_time); MLflow''s `mlflow gc` reaps only deleted runs. Behaviours (a)-(e) are unmeasured
    until EXT-31'
