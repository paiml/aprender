  demand_score: 4
  intake_status: missing
  github_issue: 4407
  description: 'Model line distribution vs Qwen / unsloth / bartowski / Ollama library. EXT-001 surface
    C6 `distribution`. Arms: Qwen official, unsloth, bartowski (HF model repos); Ollama library. Comparator:
    behavioural fixtures on pinned revisions. Metric: (a) re-download by version tag is sha-stable; (b)
    tags are immutable; (c) every card number is receipt-backed; (d) a build receipt / lineage is published.
    Gate: coverage only; our (a)-(d) already block via M-CR, M6, M7 and I-8.'
  surface: distribution
  ext_surface: C6
  verbs:
  - publish
  - pull
  - model
  crux_coverage: covered
  gap_effect: closes
  gap_note: 'EXT-31 (evidence/ext-001/EXT-31/behaviours.json), measured [V] 2026-09-25T23:35Z on the EXT-24
    pins: the Qwen, unsloth and bartowski repos have no tags (branch main only), so a download by name
    is not sha-stable (a); their cards carry 50-543 decimal lines and 0 receipt/sha256/provenance words
    (c, d). apr holds (a) at the release gate (M0) and (c) (M6). Ollama is unmeasured [U]. Disclosed:
    `apr pull` alone is not sha-stable — its cache hit checks size only (docs/findings/aprender-cb.jsonl)'
  references:
  - 'spec: paiml/infra docs/specifications/EXT-001-dogfood-model-lifecycle.md §10 row C6'
  - 'epic: https://github.com/paiml/aprender/issues/4381'
  - 'row: https://github.com/paiml/aprender/issues/4407 (EXT-25, this contract)'
  - 'measurement row: https://github.com/paiml/aprender/issues/4413 (EXT-31)'
equations:
  tag_redownload_is_sha_stable:
    formula: Pulling the same version tag twice yields the same sha256
    domain: EXT-001 C6 arms on pinned revisions
    codomain: PASS iff the property holds; the planted failure turns it RED
    invariants:
    - Pulling the same version tag twice yields the same sha256
  card_numbers_are_receipted:
    formula: Every number on a published model card resolves to a receipt
    domain: EXT-001 C6 arms on pinned revisions
    codomain: PASS iff the property holds; the planted failure turns it RED
    invariants:
    - Every number on a published model card resolves to a receipt
proof_obligations:
- id: CRUX-P-05-OB-01
  type: invariant
  property: Pulling the same version tag twice yields the same sha256
  applies_to: tag_redownload_is_sha_stable
- id: CRUX-P-05-OB-02
  type: invariant
  property: Every number on a published model card resolves to a receipt
  applies_to: card_numbers_are_receipted
falsification_tests:
- id: FALSIFY-CRUX-P-05-001
  obligation: CRUX-P-05-OB-01
  rule: tag redownload is sha stable
  prediction: a re-pushed tag with changed bytes turns the fixture RED
  test: cargo test -p apr-cli --lib falsify_ext_015_each_gate_turns_red_on_its_plant
  if_fails: 'the C6 claim ''tag redownload is sha stable'' is broken — `apr model gate` M0 no longer refuses
    a release dir whose model bytes differ (same size) from the manifest sha256 (plant "one byte of the
    model flipped"). Scope: the decision surface is the gate on the downloaded release dir; `apr pull`
    itself is NOT sha-stable today — its cache hit compares size only and a re-download rewrites
    .apr-manifest.json (docs/findings/aprender-cb.jsonl, EXT-31)'
- id: FALSIFY-CRUX-P-05-002
  obligation: CRUX-P-05-OB-02
  rule: card numbers are receipted
  prediction: a hand-typed number on the card fails the card lint
  test: cargo test -p apr-cli --lib falsify_ext_015_each_gate_turns_red_on_its_plant
  if_fails: 'the C6 claim ''card numbers are receipted'' is broken — `apr model gate` M6 no longer refuses
    a card figure with no [receipt:<id>] or one citing an unknown receipt'
kani_harnesses:
- id: KH-CRUX-P-05-001
  obligation: tag_redownload_is_sha_stable
  property: tag_redownload_is_sha_stable_holds_on_bounded_input
  bound: 4
- id: KH-CRUX-P-05-002
  obligation: card_numbers_are_receipted
  property: card_numbers_are_receipted_holds_on_bounded_input
  bound: 4
qa_gate:
  id: F-CRUX-P-05-GATE
  name: CRUX C6 distribution
  description: Gate for EXT-001 surface C6 `distribution`
  checks:
  - validation
  - falsification
  pass_criteria: 'Both falsification tests are bound (EXT-31) to the M0 and M6 plants of
    falsify_ext_015_each_gate_turns_red_on_its_plant and pass. C6 (b) immutable tags and (d) published
    build receipt are blocking via M-CR, M7 and I-8 (spec §10 row C6), not fixtures here'
  falsification: FALSIFY-CRUX-P-05-001 through FALSIFY-CRUX-P-05-002
