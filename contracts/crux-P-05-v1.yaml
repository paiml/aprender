  id: CRUX-P-05
  version: 1.1.0
  created: '2026-09-25'
  updated: '2026-09-26'
  author: PAIML Engineering
  registry: false
  status: draft
  valid_under:
    world: committed
  parent_contracts:
  - crux-competitive-research-ux-v1
  - dogfood-model-lifecycle-v1
  category: P — Dogfood Model Lifecycle
