  rule: >-
    apr serve ctl stats reads GET /v1/stats and apr serve ctl requests reads a ring of recent requests from the running server
  prediction: >-
    after N requests to a running server, apr serve ctl requests --limit N --json lists exactly those N with their token counts, and ctl stats --json reports a request total of at least N
  test: >-
    LIVE-PENDING - no test surface exists because apr does not implement this (FX-22, intake_status partial). PROMOTE by authoring a test named ctl_requests_lists_the_last_n; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED, NOT satisfied.
  if_fails: >-
    the freetoken parity claim for CRUX-P-05 is FALSE; re-measure against FreeToken at the pinned sha before changing the status

