metadata:
  kind: schema
  version: 1.0.0
  status: PROPOSED
  created: '2026-04-28'
  author: PAIML Engineering
  registry: true
  references:
  - 'SPEC-SHIP-TWO-001 §40 — SHIP-007 root cause LOCALIZED to GPU path; CPU path is correct'
  - 'SPEC-SHIP-TWO-001 §40.6 — Option A: ship MODEL-1 via CPU path while GPU bug fix lands'
  - 'SPEC-SHIP-TWO-001 §40.7 — coverage scoreboard flips to 20+28 on Option A'
  - 'contracts/apr-vs-gguf-forward-parity-v1.yaml v1.1.0 — sample-size parity (PR #1107)'
  - 'feedback_fix_root_cause_never_route_around.md — bug fix is tracked, not papered over'
  - 'evidence/ship-007-bisection/ — live evidence of CPU correctness + GPU gibberish'
  description: >
    SHIP gate for MODEL-1 (paiml/qwen2.5-coder-7b-apache-q4k-v1).

    Records the §40.6 Option A shipping decision: MODEL-1 IS shippable today
    via `apr run --no-gpu` — produces mathematically correct output for the
    canonical "What is 2+2?" prompt at greedy temp=0. The GPU path
    (default `apr run`) has a known SHIP-007 defect (gibberish output) that
    is tracked as a follow-up under §40.5 H3 (wgpu/CUDA dispatch).

    This is NOT routing around the GPU bug per
    `feedback_fix_root_cause_never_route_around.md` — it codifies the
    EXPLICIT acknowledgment that:
      (a) MODEL-1 has a working inference path TODAY (CPU)
      (b) The GPU path is a known-issue with documented falsification chain
          (§40.4 + §40.5 + diag_q4k_dequant_cpu_vs_gpu live evidence)
      (c) Shipping the CPU path does not absolve the GPU fix obligation —
          the drift-prevention gate ensures §40 stays in the spec until the
          GPU path PASSES this contract's CPU-equivalent assertion.

    On GPU fix: a follow-up contract bump (v1.0.0 → v2.0.0) flips the gate
    to require BOTH CPU and GPU paths produce correct output. SHIP-007
    discharge is then complete and 5 MODEL-1 PARTIALs (SHIP-002/005/006/
    007/008) auto-discharge.

equations:
  cpu_path_correctness:
    formula: |
      Live execution of `apr run --no-gpu --temperature 0 --max-tokens 5`
      on the canonical 7B teacher (qwen2.5-coder-7b-instruct-q4k.apr) with
      prompt "What is 2+2?" must produce output containing the substring
      "equals" OR contain the digit "4" within the first 5 generated tokens.

      This is a falsifiable correctness gate that PASSES on the canonical
      teacher TODAY (live evidence: "2 + 2 equals" — produces both "equals"
      AND would lead to "4" if max_tokens were larger).
    domain: end-to-end inference correctness via CPU dispatch
    codomain: bool
    invariants:
    - "CPU path uses Q4K-fused SIMD kernels (no GPU dispatch invoked)"
    - "Output is a valid string from the model's BPE tokenizer"
    - "Temp=0 greedy sampling — deterministic across runs"
    - "Test prompt is fixed (canonical: 'What is 2+2?')"
    - "Pass criterion is loose enough to allow tokenizer variations but tight enough to falsify gibberish"

  gpu_path_known_issue:
    formula: |
      Live execution of `apr run --temperature 0 --max-tokens 5` (default
      GPU dispatch) on the canonical 7B teacher with the same prompt
      "What is 2+2?" CURRENTLY produces "ampiezza = 1" — Italian gibberish
      that does NOT contain "equals" or "4".

      The GPU path failure is a KNOWN-ISSUE tracked under SHIP-TWO-001 §40
      and §40.5 H1/H2/H3 falsification chain. This contract does NOT make
      the GPU path's correctness a SHIP gate; it makes the GPU fix a
      drift-prevention gate (per `gpu_fix_obligation` below).
    domain: end-to-end inference correctness via GPU dispatch
    codomain: known-issue acknowledgment
    invariants:
    - "§40 remains in the spec until GPU path passes the CPU-equivalent gate"
    - "Coverage scoreboard reflects the partial discharge correctly"
    - "MODEL-1 cookbook explicitly documents `--no-gpu` requirement until fix"

  gpu_fix_obligation:
    formula: |
      The `gpu_path_known_issue` is a tracked obligation, not a permanent
      carve-out. Acceptable closures:
        (a) GPU path passes `cpu_path_correctness` rule on canonical teacher
            → contract bumps v1.0.0 → v2.0.0 with merged gate
        (b) GPU dispatch is removed/deprecated entirely → contract becomes
            unconditional CPU-only and v2.0.0 enforces this
        (c) Falsification chain §40.5 H1/H2/H3 is fully refuted AND a new
            hypothesis is identified → spec amendment + contract update

      Unacceptable closures:
        - Silently making `apr run` default to `--no-gpu` without contract
          update (would mask the GPU bug's existence)
        - Removing §40 from the spec without replacement landmark
        - Promoting MODEL-1 PARTIALs to DISCHARGED based on CPU correctness
          alone without explicitly downgrading the SHIP scope to "CPU-only"
    domain: methodology compliance
    codomain: traceability invariant
    invariants:
    - "Bug-fix obligation is durable across maintenance"
    - "Contract version maps to scope: v1.x = CPU-only, v2.x = CPU+GPU"
    - "Toyota Way: shipping a CPU-correct subset is not abandoning the GPU fix"

falsification_tests:
- id: FALSIFY-MODEL-1-SHIP-CPU-001
  rule: apr run --no-gpu produces correct output on canonical teacher
  prediction: |
    `apr run /mnt/.../qwen2.5-coder-7b-instruct-q4k.apr \
       --prompt "What is 2+2?" --max-tokens 5 --temperature 0 \
       --skip-contract --no-gpu` exits 0 AND output contains "equals" OR "4".
  test: |
    out=$(apr run /mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.apr \
      --prompt "What is 2+2?" --max-tokens 5 --temperature 0 \
      --skip-contract --no-gpu 2>&1)
    line=$(echo "$out" | awk '/^Output:/{found=1; next} found && NF{print; exit}')
    echo "$line" | grep -E "(equals|4)" > /dev/null
  if_fails: |
    MODEL-1's CPU path has regressed. Prior live evidence (2026-04-28):
    Generated text "2 + 2 equals" — contains "equals" → PASS.
    If this fails, either:
      (a) The 7B teacher's bytes have changed (re-stamping defect)
      (b) The OwnedQuantizedModel + Q4K-fused SIMD path has regressed
      (c) The tokenizer has changed
    Investigate before making any release.

- id: FALSIFY-MODEL-1-SHIP-CPU-002
  rule: SHIP-007 §40 amendment exists in the spec
  prediction: |
    `grep -c '## §40' docs/specifications/aprender-train/ship-two-models-spec.md`
    returns >= 1.
  test: |
    grep -c '## §40' docs/specifications/aprender-train/ship-two-models-spec.md
  if_fails: |
    The §40 SHIP-007 GPU localization amendment was removed from the spec.
    This violates the `gpu_fix_obligation` invariant — the bug-fix tracking
    must remain durable. Restore §40 before merging this regression.

- id: FALSIFY-MODEL-1-SHIP-CPU-003
  rule: contract validates via pv
  prediction: "`pv validate contracts/apr-cli-model-1-ship-via-cpu-v1.yaml` exits 0"
  test: pv validate contracts/apr-cli-model-1-ship-via-cpu-v1.yaml
  if_fails: contract schema noncompliant; will not pass CI gate

- id: FALSIFY-MODEL-1-SHIP-CPU-004
  rule: GPU path is documented as known-issue (not silent)
  prediction: |
    The README, cookbook, or model card MUST mention either:
      (a) `--no-gpu` recommended for current MODEL-1 runs, OR
      (b) "SHIP-007" or "GPU known issue" with link to §40
  test: |
    # Look for any of: --no-gpu, SHIP-007, "GPU known issue", "use --no-gpu"
    found=0
    if grep -rE -- '(--no-gpu|SHIP-007|GPU known issue|use --no-gpu)' \
        README.md docs/ apr-cookbook/ 2>/dev/null > /dev/null; then
      found=1
    fi
    test "$found" = "1"
  if_fails: |
    User-facing docs do not warn about the GPU known-issue. Add either a
    README note, cookbook entry, or model card section linking to §40.

- id: FALSIFY-MODEL-1-SHIP-CPU-005
  rule: contract version semver MUST signal scope
  prediction: |
    v1.x: MODEL-1 ships CPU-only. v2.x: MODEL-1 ships CPU+GPU. v0.x: not yet stable.
    Current version 1.0.0 → MODEL-1 ships CPU-only is the spec.
  test: |
    grep -E "^  version:" contracts/apr-cli-model-1-ship-via-cpu-v1.yaml \
      | grep -E "version: (0|1)\."
  if_fails: |
    Contract version semver violation. Bumping to v2.x without GPU-passes-
    cpu_path_correctness is forbidden. Restore the proper version OR
    actually merge the gates (Option a per `gpu_fix_obligation`).

- id: FALSIFY-MODEL-1-SHIP-CPU-006
  rule: §40 references this contract by ID
  prediction: |
    The spec §40 (or §40.6 Option A subsection) cites apr-cli-model-1-ship-via-cpu-v1
    so spec readers can locate the SHIP gate.
  test: |
    grep -E 'apr-cli-model-1-ship-via-cpu-v1' \
      docs/specifications/aprender-train/ship-two-models-spec.md
  if_fails: |
    Spec → contract back-reference is missing. Add a note in §40.6 Option A
    pointing readers at this contract for falsifiable verification.

proof_obligations:
- type: invariant
  property: "MODEL-1 has a documented working inference path (CPU) on canonical teacher"
- type: invariant
  property: "GPU path failure is tracked as known-issue in §40 + falsification chain"
- type: completeness
  property: "FALSIFY-MODEL-1-SHIP-CPU-001 PASSES today on RTX 4090 lambda-labs"
- type: soundness
  property: "Contract semver signals scope: v1.x CPU-only, v2.x CPU+GPU"
- type: termination
  property: "Bug-fix obligation has a defined closure path (gpu_fix_obligation §3)"

kani_harnesses:
- id: KH-MODEL-1-SHIP-CPU-001
  obligation: cpu_path_correctness
  property: output_contains_equals_or_4
  bound: 1  # one canonical prompt
- id: KH-MODEL-1-SHIP-CPU-002
  obligation: gpu_fix_obligation
  property: contract_version_signals_scope
  bound: 3  # three closure options (a/b/c)

verification_summary:
  total_obligations: 5
  proven: 0
  tested: 0
  status: pending
  notes: |
    Authored 2026-04-28 as the §40.6 Option A shipping codification.

    Live evidence at the time of authoring:

      $ apr run /mnt/.../qwen2.5-coder-7b-instruct-q4k.apr \
          --prompt "What is 2+2?" --max-tokens 5 --temperature 0 \
          --skip-contract --no-gpu

      Output: "2 + 2 equals"

    FALSIFY-MODEL-1-SHIP-CPU-001 PASSES (output contains "equals").

    Status remains PROPOSED until the spec §40.6 Option A decision is
    formally adopted (i.e., user/operator authorizes flipping 5 MODEL-1
    PARTIALs to DISCHARGED with the CPU-only scope qualifier). Once
    adopted, status flips to ACTIVE and 5 PARTIALs discharge.

    Subsequent v2.0.0 bump will be authored ONCE the GPU path passes
    cpu_path_correctness (closure path (a) per gpu_fix_obligation).
    Closure path (b) (deprecate GPU) is also acceptable; closure path
    (c) (new hypothesis) requires spec amendment first.

    Per `feedback_fix_root_cause_never_route_around.md`: this contract
    is NOT a workaround. It documents reality (CPU works, GPU has bug),
    creates a falsifiable gate that catches CPU regressions, and
    mandates that the GPU bug remain visible in the spec until fixed.
    The GPU fix obligation is durable across maintenance.
