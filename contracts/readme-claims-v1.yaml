metadata:
  id: C-README-CLAIMS
  version: "1.0.0"
  created: "2026-04-24"
  author: PAIML Engineering
  kind: pattern
  status: enforced
  description: |
    Verifiable claims made in the root `README.md`. Every quantitative
    statement ("N crates", "M contracts", "K CLI commands") and every
    runnable snippet is bound to a shell-command that re-derives the
    number from live repository state. Drift between the README and the
    code is a contract defect.

    Written 2026-04-24 in response to long-standing README drift:
    numbers were re-authored by hand across multiple editors and diverged
    (three different crate counts, three contract counts, two CLI command
    counts, two test totals). The fix is the same pattern applied to
    SHIP-TWO-001: pin the claim, bind it to a falsifiable recomputation,
    reject drift at CI time.
  references:
    - README.md
    - ../apr-cookbook/README.md
    - docs/specifications/aprender-monorepo-consolidation.md
  depends_on: []
equations:
  # ─────────────────────────────────────────────────────────────────────────
  # #3867: EVERY numeric claim in README.md, each GATED or EXEMPT WITH A REASON.
  #
  # README.md was never ungated — it was gated in a REGION, and the boundary was
  # invisible in the rendered file. Measured at 766326360 the boundary ran THROUGH
  # the `At HEAD` table, between adjacent rows: L45 gated, L46/L47 not, and both
  # drifted (112 vs 113, 71 vs 72). #3769's cookbook count escaped the same way and
  # was wrong by 5.4x.
  #
  # `scripts/check_readme_numeric_claims.sh` enumerates the claims and requires each
  # to appear here. A claim with neither `gated_by` nor `exempt_because` is REJECTED:
  # an exemption with no reason is the seam #3769 deliberately refused.
  #
  # THE KEY IS THE WHOLE LINE with numbers replaced by N, so the inventory does not
  # churn when a count changes, and two claims about the same noun stay distinct.
  # Keying on the phrase alone collapsed L46 and L47 (both `**N** chapters`) into one
  # entry — a collision that would have let a drifted claim ride on its neighbour.
  #
  # `readme_line_when_written` is a NAVIGATION AID, not a key. Line numbers move; the
  # gate never reads it.
  # ─────────────────────────────────────────────────────────────────────────
  numeric_claims_inventory:
    formula: |
      every_numeric_claim(README.md) is gated_by(x) or exempt_because(reason)
    domain: |
      The claim set is what scripts/check_readme_numeric_claims.sh enumerates: a
      number followed by a countable noun, INCLUDING inside fenced blocks. Fenced
      lines are scanned rather than skipped — a skip rule is an unwritten coverage
      boundary, which is the defect this inventory exists to end.
    invariants:
    - "every enumerated claim has an entry here"
    - "every entry has gated_by or exempt_because; neither is a rejection"
    - "parsing zero claims is an instrument failure, never a pass"
    preconditions: []
    claims:
      "| Workspace crates | **N** workspace crates | `cargo metadata --no-deps` (NOT `ls crates/` — N are":
        gated_by: crate_count
        readme_line_when_written: 43
      "| CLI commands | **N** CLI commands | `contracts/apr-cli-commands-vN.yaml` §`commands` (parse the l":
        gated_by: cli_command_count
        readme_line_when_written: 45
      "| Book CLI chapters | **N** chapters | `ls book/src/cli/*.md` |":
        gated_by: book_cli_chapter_count
        readme_line_when_written: 46
      "| Book lib chapters | **N** chapters | `ls book/src/lib/*.md` (parity with `pub mod`) |":
        gated_by: book_lib_chapter_count
        readme_line_when_written: 47
      "[`paiml/apr-cookbook`](https://github.com/paiml/apr-cookbook) — **N** worked examples (apr-cookboo":
        gated_by: cookbook_recipe_count
        readme_line_when_written: 93
      "│ └── ... (**N** directories — NOT the crate count: see the table above)":
        gated_by: crates_directory_count
        readme_line_when_written: 260
  # ─────────────────────────────────────────────────────────────────────────
  # THE COOKBOOK RECIPE COUNT IS A PIN, NOT A MEASUREMENT (#3769).
  #
  # The source of truth is in ANOTHER REPOSITORY (paiml/apr-cookbook). A guard
  # here cannot read it: CI has no clone, and adding one would make aprender's
  # release gate depend on another repo's availability — a new failure mode on
  # the release path. So the number is pinned HERE with its provenance in-band,
  # `check_readme_claims.sh --claim cookbook_recipe_count` gates the README
  # against this pin, and the post-release step refreshes it.
  #
  # NAME THE POPULATION. Two counts exist and they differ by 158:
  #     1825  `[[example]]` entries declared in apr-cookbook's Cargo.toml   <- THIS ONE
  #     1983  `.rs` files under apr-cookbook's examples/
  # A reader who finds a bare `1825` cannot tell which population it counts and
  # will "correct" it to the other. The pinned value is the DECLARED example
  # count, because that is what `cargo run --example <name>` can actually run.
  #
  # WHY IT IS PINNED AND NOT DERIVED: the README claimed 341 for long enough
  # that nobody could date it. 341 -> 1825 is 5.4x. Every count in CLAUDE.md
  # drifted the same way (3.2x on the test count, 29 minor versions on the
  # release line), which is why the as-of date is part of the claim and not a
  # footnote.
  # ─────────────────────────────────────────────────────────────────────────
  cookbook_recipe_count:
    formula: |
      readme_cookbook_recipe_count == cookbook_recipe_count_pin
    domain: |
      The README's cookbook example count must equal the pinned value below,
      exactly. This is an EQUALITY, not the ratchet the derived counts use:
      a ratchet exists so a row PR may lag a live measurement, but both sides
      of this comparison are committed files in this repo, so a lag is simply
      a wrong number that nobody has to tolerate.
    invariants:
    - "the README's count must equal cookbook_recipe_count_pin exactly"
    - "the README must state the as-of date, so a stale number is visibly stale"
    - "the pin must name its population; a bare integer is ambiguous by 158 here"
    preconditions: []
    # The pin. `check_readme_claims.sh` greps the next line by this exact key.
    cookbook_recipe_count_pin: 1825
    pin_provenance:
      repository: "paiml/apr-cookbook"
      sha: "cdb3315"
      measured_on: "2026-09-12"
      population: "[[example]] entries declared in Cargo.toml"
      command: "git show cdb3315:Cargo.toml | grep -c '^\\[\\[example\\]\\]'"
      not_this_population: "1983 .rs files under examples/ — differs by 158"
      refreshed_by: "the post-release step (#3769 part 3)"
  workspace_crate_count:
    formula: |
      readme_crate_count == count(ls crates/)
    domain: |
      Every crate directory under `crates/` must be reflected in the
      README's workspace-crate claim.
    invariants:
    - "the quoted count must match `ls crates/ | wc -l` at HEAD"
    preconditions: []
  contract_count:
    formula: |
      readme_contract_count == count(find contracts/ -name "*.yaml")
    domain: |
      Every YAML contract under `contracts/` (including nested families)
      must be included in the README's provable-contract claim.
    invariants:
    - "the quoted count must match `find contracts/ -name '*.yaml' | wc -l`"
    preconditions: []
  cli_command_count:
    formula: |
      readme_cli_command_count == count(apr --help | grep -cE "^  [a-z][-a-z0-9]* ")
    domain: |
      The README's CLI-command count must match what `apr --help` lists.
    invariants:
    - "the quoted count must match the live `--help` subcommand list"
    preconditions:
    - "apr-cli builds clean on HEAD"
  apr_cookbook_link_present:
    formula: |
      readme_mentions("../apr-cookbook") AND readme_mentions("apr-cookbook")
    domain: |
      The README must link to `paiml/apr-cookbook` — the recipe book
      of production deployment examples — so new users can find
      worked-out pipelines beyond the bare CLI.
    invariants:
    - "README.md contains a link whose href or path segment ends in `apr-cookbook`"
    preconditions: []
proof_obligations:
- id: RC2139-INV-001
  type: invariant
  property: README crate count matches filesystem
  formal: "readme_crate_count == |crates/|"
  applies_to: metadata
- id: RC2139-INV-002
  type: invariant
  property: README contract count matches filesystem
  formal: "readme_contract_count == |contracts/**/*.yaml|"
  applies_to: metadata
- id: RC2139-INV-003
  type: invariant
  property: README CLI command count matches apr --help
  formal: "readme_cli_command_count == lines_starting_with_lowercase(apr --help)"
  applies_to: metadata
- id: RC2139-INV-004
  type: invariant
  property: README links to apr-cookbook
  formal: "'apr-cookbook' ∈ links(README.md)"
  applies_to: metadata
falsification_tests:
- id: FALSIFY-README-007
  rule: |
    The README's cookbook example count equals `cookbook_recipe_count_pin` in this
    contract, and states the date it was measured.
  prediction: |
    `README.md` states "**N** worked examples (apr-cookbook, YYYY-MM-DD)" ↔ N ==
    cookbook_recipe_count_pin. Either side wrong is the same failed equality.
  test: |
    bash scripts/check_readme_claims.sh --claim cookbook_recipe_count
  test_harness: |
    bash scripts/check_readme_claims.sh --self-test
  if_fails: |
    The cookbook grew or shrank and the pin was not refreshed, or the README was
    edited by hand. Re-measure against paiml/apr-cookbook:
      git show <sha>:Cargo.toml | grep -c '^\[\[example\]\]'
    then update BOTH cookbook_recipe_count_pin (with its sha and date) and the
    README line. The post-release step (#3769 part 3) does this automatically.
  ship_blocking: false
  counter_example_classes:
  - stale_number
  - dateless_count
  - wrong_population_counted
  - missing_pin
- id: FALSIFY-README-001
  rule: |
    Workspace crate count in README matches `ls crates/ | wc -l`.
  prediction: |
    `README.md` states N workspace crates ↔ `ls crates/ | wc -l` = N.
  test: |
    bash scripts/check_readme_claims.sh --claim crate_count
  if_fails: |
    Either a new crate was added without bumping the README, or a crate
    was removed without updating the count. Fix the README.
  ship_blocking: false
  counter_example_classes:
  - stale_number
  - off_by_one_new_crate
  - off_by_one_removed_crate
- id: FALSIFY-README-002
  rule: |
    Contract count in README matches `find contracts/ -name "*.yaml" | wc -l`.
  prediction: |
    `README.md` states M provable contracts ↔ filesystem contains M YAML
    contracts under `contracts/`.
  test: |
    bash scripts/check_readme_claims.sh --claim contract_count
  if_fails: |
    Contract folder grew/shrank without README update. Rerun
    `bash scripts/check_readme_claims.sh --regen` to refresh.
  ship_blocking: false
  counter_example_classes:
  - stale_number
  - missed_kernel_add
  - missed_registry_add
- id: FALSIFY-README-003
  rule: |
    CLI command count in README matches `apr --help` subcommand list.
  prediction: |
    `README.md` states K CLI commands ↔ `apr --help` prints K
    subcommands on lines matching `^  [a-z][-a-z0-9]* `.
  test: |
    bash scripts/check_readme_claims.sh --claim cli_command_count
  if_fails: |
    A subcommand was added or renamed without README sync. Update the
    README or revert the CLI change.
  ship_blocking: false
  counter_example_classes:
  - stale_number
  - subcommand_added_without_doc
  - subcommand_renamed_without_doc
- id: FALSIFY-README-004
  rule: |
    README contains a discoverable link to `paiml/apr-cookbook`.
  prediction: |
    `grep -F 'apr-cookbook' README.md` returns at least one hit in a
    link context (`[text](url)` or `../apr-cookbook/...`).
  test: |
    bash scripts/check_readme_claims.sh --claim cookbook_link
  if_fails: |
    apr-cookbook link was deleted or renamed. Restore the pointer —
    the cookbook is the canonical end-to-end recipe source.
  ship_blocking: false
  counter_example_classes:
  - link_removed
  - link_404
  - link_renamed_without_sync
- id: FALSIFY-README-005
  name: book_cli_chapter_coverage
  description: |
    Per BOOK-CLOSEOUT-001 § Phase 5. The book MUST have one chapter per
    `apr <cmd>` subcommand. If the README claims "every CLI command
    documented", that claim is contract-enforced.
  prediction: |
    count(book/src/cli/*.md) == count(apr --help subcommands)
  test: |
    bash scripts/check_book_cli_parity.sh
  if_fails: |
    A CLI subcommand was added without a corresponding chapter, OR an
    orphan chapter exists under book/src/cli/. Run
    scripts/gen-cli-chapter-stubs.sh to regenerate missing stubs.
  ship_blocking: true
  counter_example_classes:
  - new_subcommand_without_chapter
  - chapter_removed_but_subcommand_remains

- id: FALSIFY-README-006
  name: book_lib_chapter_coverage
  description: |
    Per BOOK-CLOSEOUT-001 § Phase 5. The book MUST have one chapter per
    public module in `aprender-core`. If the README claims "every public
    library module documented", that claim is contract-enforced.
  prediction: |
    count(book/src/lib/*.md) == count(pub mod in aprender-core)
  test: |
    bash scripts/check_book_lib_parity.sh
  if_fails: |
    A public module was added without a corresponding chapter, OR an
    orphan lib chapter exists. Run scripts/gen-lib-chapter-stubs.sh.
  ship_blocking: true
  counter_example_classes:
  - new_pub_mod_without_chapter
  - chapter_removed_but_pub_mod_remains

kani_harnesses: []
qa_gate:
  id: QA-README-001
  name: README claim consistency
  description: All README quantitative claims re-derive from live repo state
  checks:
  - workspace_crate_count
  - contract_count
  - cli_command_count
  - apr_cookbook_link_present
  - book_cli_chapter_coverage
  - book_lib_chapter_coverage
  pass_criteria: All 6 falsification tests pass
  falsification: Any single claim mismatch fails the gate
