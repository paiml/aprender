metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
  - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    apr-cli test coverage contract. Current: 56.7% line coverage.
    Target: 80% line coverage (realistic given cfg-gated CUDA/training code).
    Strategy: test dispatch paths, command handlers, and utility functions.

equations:
  coverage_target:
    formula: |
      cargo llvm-cov report -p apr-cli --summary-only | grep TOTAL
      line_coverage >= 80%
    domain: apr-cli lib tests
    codomain: percentage
    invariants:
    - "Line coverage >= 80% for code reachable without cuda/training features"
    - "cfg-gated code (cuda, training, wgpu) excluded from target"
    - "Every public fn in dispatch.rs has at least one test path"

  dispatch_coverage:
    formula: |
      For each dispatch function in dispatch.rs, dispatch_analysis.rs:
        at least one test exercises the function
    domain: CLI dispatch layer
    codomain: bool
    invariants:
    - "dispatch_core_command tested via cli_commands integration test"
    - "dispatch_analysis_commands tested"
    - "Error paths tested (invalid input, missing file)"

falsification_tests:
- id: FALSIFY-COV-001
  rule: coverage above 80%
  prediction: "cargo llvm-cov line coverage >= 80%"
  test: |
    COV=$(cargo llvm-cov report -p apr-cli --summary-only 2>&1 | grep TOTAL | awk '{print $10}')
    python3 -c "assert float('$COV'.rstrip('%')) >= 80.0"
  if_fails: "apr-cli coverage below 80%"

verification_summary:
  total_obligations: 1
  proven: 0
  tested: 0
  status: pending
