equations:
  per_tensor_quantization_rmse:
    formula: |
      Competitor (llama.cpp llama-quantize-stats):
        ./llama-quantize-stats -m fp16.gguf -q q4k.gguf -v
      computes per-tensor RMSE between FP16 reference and quantized weights.
      apr parity:
        apr qa-quant BASE.apr QUANTIZED.apr --per-tensor --metric rmse --rank --json
      MUST output per-tensor RMSE sorted descending (worst first):
        rmse(W, W_q) = sqrt(mean((W - dequant(W_q))^2))
      where dequant restores quantized weights to f32 row-major.
    domain: "base fp16/f32 model W, quantized model W_q over same tensor set T"
    codomain: "ranked list [{tensor_name, rmse, max_abs_error, elements}]"
    invariants:
    - "rmse(W, W) == 0.0 for identical inputs (self-check)"
    - "output sorted descending by rmse (worst-quantized first)"
    - "rmse computed in row-major flattened order (LAYOUT-001)"
    - "Competitor parity: matches llama-quantize-stats per-tensor rmse within 1e-5"

  error_budget_threshold:
    formula: |
      Given user-specified threshold tau:
        over_budget = { name : rmse(name) > tau }
      apr MUST list over_budget tensors and fail CLI with exit_code=1
      when --threshold tau and over_budget non-empty.
    domain: "rmse vector r_i, threshold tau in R_{>=0}"
    codomain: "{ over_budget: list[str], exit_code: int }"
    invariants:
    - "exit_code == 1 iff over_budget non-empty AND --threshold supplied"
    - "over_budget list matches {n : rmse[n] > tau} exactly"

  ranking_stability:
    formula: |
      For the same (base, quantized) pair, two invocations produce
      identical rank order (JSON-equal modulo wall times).
    domain: "(base model, quantized model) pair"
    codomain: "ordered list of tensor names"
    invariants:
    - "ranking is deterministic (no RNG in error metric)"
    - "ties broken by tensor_name lexicographic order (stable sort)"

falsification_tests:
- id: FALSIFY-CRUX-F-04-001
  rule: "per-tensor list sorted descending by rmse (worst first)"
  prediction: "rmse[i] >= rmse[i+1] for all i in output ordering"
  test: |
    set -euo pipefail
    BASE=fixtures/crux-f-04/base.apr
    QUANT=fixtures/crux-f-04/base-q4k.apr
    apr qa-quant "$BASE" "$QUANT" --per-tensor --metric rmse --rank --json \
      > /tmp/f04-rank.json
    python3 -c "
    import json,sys
    pt=json.load(open('/tmp/f04-rank.json'))['per_tensor']
    ok=all(pt[i]['rmse'] >= pt[i+1]['rmse'] for i in range(len(pt)-1))
    sys.exit(0 if ok else 1)"
  if_fails: "per_tensor not sorted descending by rmse"

- id: FALSIFY-CRUX-F-04-002
  rule: "error budget threshold fails CLI when exceeded"
  prediction: "apr qa-quant --threshold 0.0 --rank exits nonzero with any nonzero rmse"
  test: |
    set -euo pipefail
    BASE=fixtures/crux-f-04/base.apr
    QUANT=fixtures/crux-f-04/base-q4k.apr
    # threshold 0.0 forces any nonzero rmse to over-budget
    set +e
    apr qa-quant "$BASE" "$QUANT" --per-tensor --metric rmse \
      --threshold 0.0 --rank --json > /tmp/f04-bud.json
    RC=$?
    set -e
    OVER=$(jq -r '.over_budget | length' /tmp/f04-bud.json)
    [ "$RC" -eq 1 ] && [ "$OVER" -gt 0 ]
  if_fails: "--threshold did not trigger exit_code=1 when over_budget non-empty"

- id: FALSIFY-CRUX-F-04-003
  rule: "llama-quantize-stats parity: rmse matches within 1e-5 per tensor"
  prediction: "apr per-tensor rmse agrees with llama-quantize-stats golden"
  test: |
    set -euo pipefail
    GOLDEN=evidence/crux/llama_cpp/f-04-quantize-stats-rmse.json
    BASE=fixtures/crux-f-04/base.apr
    QUANT=fixtures/crux-f-04/base-q4k.apr
    apr qa-quant "$BASE" "$QUANT" --per-tensor --metric rmse --rank --json \
      > /tmp/f04-apr.json
    python3 -c "
    import json,sys
    apr={t['tensor_name']:t['rmse'] for t in json.load(open('/tmp/f04-apr.json'))['per_tensor']}
    hf=json.load(open('$GOLDEN'))['per_tensor']
    bad=[n for n in hf if n in apr and abs(apr[n]-hf[n]['rmse'])>1e-5]
    sys.exit(0 if not bad else 1)"
  if_fails: "apr per-tensor rmse diverges from llama-quantize-stats by >1e-5"

proof_obligations:
- type: invariant
  property: "per_tensor output sorted descending by rmse (worst-quantized first)"
- type: invariant
  property: "--threshold triggers exit_code=1 iff over_budget non-empty"
- type: invariant
  property: "rmse computed in row-major order (LAYOUT-001 compliance)"
- type: parity
  property: "apr qa-quant --per-tensor --metric rmse matches llama.cpp's llama-quantize-stats -v per-tensor rmse within 1e-5 on matching tensor names"

