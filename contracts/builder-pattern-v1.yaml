metadata:
  version: 1.0.0
  description: Generic builder-pattern contract — common Rust API pattern
  references:
  - 'Rust API Guidelines: https://rust-lang.github.io/api-guidelines/'
equations:
  builder_pattern:
    formula: "Builder::new().field(v).build() -> Result<T, BuilderError>"
    domain: "Typestate builder with required and optional fields"
    invariants:
    - "build() returns Err if required fields are unset"
    - "Builder is consumed on build() — no reuse after build"
    - "Partial builder is valid — only build() checks completeness"
    preconditions:
    - "Builder struct has at least one required field"
    - "All field setters return &mut Self or Self (fluent API)"
    postconditions:
    - "Ok(T) implies all required fields are set"
    - "Err(BuilderError) names the missing field(s)"
    lean_theorem: Theorems.Builder_Pattern
proof_obligations:
- type: invariant
  property: builder-pattern correctness
falsification_tests:
- id: FALSIFY-GEN-001
  rule: builder-pattern contract
  prediction: Function follows builder-pattern pattern
  if_fails: Implementation deviates from pattern
kani_harnesses:
- id: KANI-GEN-001
  obligation: builder-pattern correctness
  bound: 8
  strategy: bounded_int
  solver: cadical
qa_gate:
  id: F-BPV-001
  name: builder-pattern-v1 Contract
  description: Quality gate for Generic builder-pattern contract — common Rust API
    pattern
  checks:
  - validation
  - falsification
