metadata:
  version: 1.0.0
  created: '2026-04-09'
  author: PAIML Engineering
  registry: true
  references:
  - 'GNU coding standards: exit status conventions'
  - 'POSIX.1-2017 utility conventions (IEEE Std 1003.1)'
  - 'clap v4 value_parser range documentation'
  - 'docs/specifications/aprender-contract-entities/subcommand-entity-spec.md'
  description: >
    Per-CLI-subcommand quality contract for the apr binary. Enforces 10
    measurable elements across 4 tiers (completeness, correctness, safety,
    governance) via profile parameterization. Profiles: any, cli-tool,
    ml-framework. Machine-checkable (exit codes, JSON parse, grep, test
    file enumeration). Operates at the individual subcommand level and
    aggregates across all 57 apr subcommands.

profiles:
  any:
    required: [SC1, SC3, SC6]
    recommended: [SC2, SC4, SC5, SC7, SC8, SC9, SC10]
  cli-tool:
    inherits: any
    required: [SC1, SC2, SC3, SC4, SC5, SC6, SC7, SC8]
    recommended: [SC9, SC10]
  ml-framework:
    inherits: cli-tool
    required: [SC1, SC2, SC3, SC4, SC5, SC6, SC7, SC8, SC9, SC10]
    recommended: []

parameters:
  binary:
    type: string
    default: apr
  subcommands_file:
    type: string
    default: contracts/apr-cli-commands-v1.yaml
  numeric_flag_validation_threshold:
    type: float
    default: 0.8
  total_subcommands:
    type: integer
    default: 57

elements:
  SC1:
    name: help_exits_0
    tier: completeness
    check: "`apr <cmd> --help` exits 0 and prints usage text"
    measurable: "exit code == 0 AND stdout contains 'Usage:' or 'USAGE:'"
  SC2:
    name: all_flags_have_help
    tier: completeness
    check: "every flag listed in --help has a description (non-empty string after the flag)"
    measurable: "parse --help output; for each --flag line, check trailing description is non-empty"
  SC9:
    name: value_ranges_validated
    tier: completeness
    check: "numeric flags (temperature, top_k, max_tokens, etc.) have value_parser ranges OR runtime validation"
    measurable: "grep source for value_parser or clamp/min/max on numeric args; ratio of validated flags >= numeric_flag_validation_threshold"
  SC3:
    name: exit_code_honest
    tier: correctness
    check: "exit 0 on success, non-zero on failure (bad input, missing file, etc.)"
    measurable: "apr <cmd> --help exits 0; apr <cmd> /nonexistent exits non-zero"
  SC4:
    name: json_valid
    tier: correctness
    check: "if --json flag exists, output parses as valid JSON"
    measurable: "apr <cmd> --json ... | python3 -m json.tool exits 0"
  SC5:
    name: no_nan_inf
    tier: correctness
    check: "output never contains literal NaN or Inf in numeric fields"
    measurable: "apr <cmd> ... | grep -cP '\\bNaN\\b|\\bInf\\b|\\b-Inf\\b' == 0"
  SC6:
    name: missing_input_nonzero
    tier: safety
    check: "command exits non-zero when required input file is missing"
    measurable: "apr <cmd> /tmp/nonexistent_model_file exits non-zero"
  SC10:
    name: integration_test_exists
    tier: safety
    check: "at least one test file references the subcommand name"
    measurable: "grep -r '<cmd_name>' tests/ crates/apr-cli/tests/ returns >= 1 match"
  SC7:
    name: side_effect_documented
    tier: governance
    check: "commands with side effects (write, delete, network) document them in --help"
    measurable: "if command writes files or makes network calls, --help mentions output path or network"
  SC8:
    name: no_phantom_subcommand
    tier: governance
    check: "every subcommand listed in apr --help actually executes (not just a stub)"
    measurable: "apr <cmd> --help exits 0 (not 'unimplemented' or panic)"

equations:
  completeness_verified:
    formula: |
      forall subcommand S in apr_subcommands:
        help_exits_0(S) AND
        all_flags_described(S) AND
        numeric_flag_validated_ratio(S) >= numeric_flag_validation_threshold
    domain: "apr binary + subcommand list"
    codomain: bool
    invariants:
    - "Every subcommand has discoverable help"
    - "No flag is undocumented"
    - "Numeric parameters have bounds preventing nonsense values"

  correctness_verified:
    formula: |
      forall subcommand S in apr_subcommands:
        (success_input(S) => exit_code(S) == 0) AND
        (failure_input(S) => exit_code(S) != 0) AND
        (has_json_flag(S) => valid_json(output(S, --json))) AND
        not contains_nan_inf(numeric_output(S))
    domain: "apr binary + test inputs"
    codomain: bool
    invariants:
    - "Exit codes are honest signals of success/failure"
    - "JSON output is machine-parseable"
    - "Numeric output contains no degenerate values"

  safety_verified:
    formula: |
      forall subcommand S in apr_subcommands:
        (missing_required_input(S) => exit_code(S) != 0) AND
        exists test T in test_suite: references(T, S)
    domain: "apr binary + test suite"
    codomain: bool
    invariants:
    - "Missing input never silently succeeds"
    - "Every subcommand has at least one integration test"

  governance_verified:
    formula: |
      forall subcommand S in apr_subcommands:
        (has_side_effect(S) => documents_side_effect(help(S))) AND
        not is_stub(S)
    domain: "apr binary + help output"
    codomain: bool
    invariants:
    - "Side effects are disclosed in help text"
    - "No phantom subcommands that panic or do nothing"

  subcommand_score:
    formula: |
      tier_weight = {completeness: 30, correctness: 30, safety: 20, governance: 20}

      forall element E in {SC1..SC10}:
        element_weight(E) =
          tier_weight[tier(E)] / |elements_in_tier(E)|
          * (if E in required(profile) then 1.0
             elif E in recommended(profile) then 0.5
             else 0.0)

      forall subcommand S in apr_subcommands:
        raw_score(S) = sum(gate(E, S) * element_weight(E) for E in {SC1..SC10})
        max_score(S) = sum(element_weight(E) for E in {SC1..SC10})
        cmd_score(S) = round(raw_score(S) / max_score(S) * 100)

      aggregate_score = round(mean(cmd_score(S) for S in apr_subcommands))

      verdict = if aggregate_score >= 90 then A
                elif aggregate_score >= 80 then B
                elif aggregate_score >= 70 then C
                elif aggregate_score >= 60 then D
                else F
    domain: "apr binary + subcommand list + profile + gate results"
    codomain: "integer in [0, 100]"
    invariants:
    - "Score 0 when no elements pass for any subcommand"
    - "Score 100 when all elements pass for all subcommands"
    - "Completeness + correctness account for 60% of total weight"
    - "Per-command scores are reported before the aggregate"
    - "Grade A (>=90) requires all required gates PASS on all commands"
    thresholds:
      A: 90
      B: 80
      C: 70
      D: 60
      F: 0

falsification_tests:
- id: F-SC-001
  rule: completeness_verified
  element: SC1
  prediction: "every apr subcommand exits 0 with --help"
  test: |
    python3 -c "
    import subprocess, sys
    cmds = subprocess.run(['apr', '--help'], capture_output=True, text=True).stdout
    # Extract subcommand names from help output
    import re
    subcmds = re.findall(r'^\s{2,4}(\w[\w-]*)', cmds, re.M)
    subcmds = [s for s in subcmds if s not in ('help', 'Options:', 'Commands:', 'Usage:')]
    failed = []
    for cmd in subcmds[:57]:
        r = subprocess.run(['apr', cmd, '--help'], capture_output=True, timeout=10)
        if r.returncode != 0:
            failed.append(cmd)
    if failed:
        print(f'FAIL: {len(failed)} commands fail --help: {failed}')
        sys.exit(1)
    print(f'PASS: all {len(subcmds)} subcommands exit 0 with --help')
    "
  if_fails: "subcommand --help exits non-zero or panics"

- id: F-SC-002
  rule: correctness_verified
  element: SC3
  prediction: "commands exit non-zero when given a nonexistent file"
  test: |
    python3 -c "
    import subprocess, sys
    # Commands that accept a model file argument
    file_cmds = ['validate', 'inspect', 'tensors', 'lint', 'debug', 'qa']
    passed = 0
    for cmd in file_cmds:
        r = subprocess.run(['apr', cmd, '/tmp/__nonexistent_model__'],
                           capture_output=True, timeout=10)
        if r.returncode != 0:
            passed += 1
        else:
            print(f'FAIL: apr {cmd} /tmp/__nonexistent_model__ exited 0')
    if passed < len(file_cmds):
        sys.exit(1)
    print(f'PASS: all {passed} commands exit non-zero for missing input')
    "
  if_fails: "command silently succeeds with missing input — violates fail-fast"

- id: F-SC-003
  rule: safety_verified
  element: SC10
  prediction: "every subcommand has at least one integration test referencing it"
  test: |
    python3 -c "
    import subprocess, re, sys, os
    cmds = subprocess.run(['apr', '--help'], capture_output=True, text=True).stdout
    subcmds = re.findall(r'^\s{2,4}(\w[\w-]*)', cmds, re.M)
    subcmds = [s for s in subcmds if s not in ('help', 'Options:', 'Commands:', 'Usage:')]

    test_dirs = ['tests/', 'crates/apr-cli/tests/', 'crates/apr-cli/src/']
    untested = []
    for cmd in subcmds[:57]:
        found = False
        for td in test_dirs:
            if os.path.isdir(td):
                r = subprocess.run(['grep', '-rl', cmd, td], capture_output=True, text=True)
                if r.stdout.strip():
                    found = True
                    break
        if not found:
            untested.append(cmd)

    if untested:
        print(f'WARN: {len(untested)} commands without test references: {untested[:10]}')
        # Soft failure — report but allow incremental improvement
        if len(untested) > len(subcmds) * 0.5:
            sys.exit(1)
    print(f'PASS: {len(subcmds) - len(untested)}/{len(subcmds)} commands have test coverage')
    "
  if_fails: "more than 50% of subcommands lack any test reference"

- id: F-SC-004
  rule: governance_verified
  element: SC8
  prediction: "no phantom subcommands (all listed commands actually run)"
  test: |
    python3 -c "
    import subprocess, re, sys
    cmds = subprocess.run(['apr', '--help'], capture_output=True, text=True).stdout
    subcmds = re.findall(r'^\s{2,4}(\w[\w-]*)', cmds, re.M)
    subcmds = [s for s in subcmds if s not in ('help', 'Options:', 'Commands:', 'Usage:')]
    phantom = []
    for cmd in subcmds[:57]:
        r = subprocess.run(['apr', cmd, '--help'], capture_output=True, text=True, timeout=10)
        if 'unimplemented' in r.stderr.lower() or 'todo' in r.stderr.lower():
            phantom.append(cmd)
    if phantom:
        print(f'FAIL: phantom subcommands: {phantom}')
        sys.exit(1)
    print(f'PASS: no phantom subcommands among {len(subcmds)} commands')
    "
  if_fails: "listed subcommand is a stub — user discovers it does nothing at runtime"

- id: F-SC-005
  rule: completeness_verified
  element: SC9
  prediction: "numeric flags have value_parser ranges or runtime validation (>= 80%)"
  test: |
    python3 -c "
    import subprocess, re, sys, os

    # Find numeric flags in apr-cli source
    src_dir = 'crates/apr-cli/src'
    if not os.path.isdir(src_dir):
        print('SKIP: apr-cli source not found')
        sys.exit(0)

    # Find all numeric clap args
    r = subprocess.run(['grep', '-rn', 'value_parser\\|clamp\\|min.*max\\|range',
                        src_dir], capture_output=True, text=True)
    validated_lines = r.stdout.strip().split('\n') if r.stdout.strip() else []

    # Find all numeric type annotations in clap structs
    r2 = subprocess.run(['grep', '-rn', r'f32\|f64\|u32\|u64\|usize\|i32\|i64',
                         src_dir, '--include=*.rs'], capture_output=True, text=True)
    numeric_lines = r2.stdout.strip().split('\n') if r2.stdout.strip() else []

    # Count unique numeric args vs validated ones
    total_numeric = len(set(l.split(':')[0] + l.split(':')[1] for l in numeric_lines if ':' in l))
    total_validated = len(set(l.split(':')[0] + l.split(':')[1] for l in validated_lines if ':' in l))

    if total_numeric == 0:
        print('SKIP: no numeric flags found')
        sys.exit(0)

    ratio = total_validated / total_numeric if total_numeric > 0 else 0
    print(f'Numeric args: {total_numeric}, Validated: {total_validated}, Ratio: {ratio:.2f}')
    sys.exit(0 if ratio >= 0.8 else 1)
    "
  if_fails: "less than 80% of numeric flags have value range validation"

- id: F-SC-006
  rule: subcommand_score
  element: all
  prediction: "aggregate subcommand score >= 90 (grade A) under ml-framework profile"
  test: |
    python3 -c "
    import subprocess, re, sys, os

    # --- tier weights (sum = 100) ---
    tier_weight = {'completeness': 30, 'correctness': 30, 'safety': 20, 'governance': 20}
    element_tier = {
        'SC1': 'completeness', 'SC2': 'completeness', 'SC9': 'completeness',
        'SC3': 'correctness', 'SC4': 'correctness', 'SC5': 'correctness',
        'SC6': 'safety', 'SC10': 'safety',
        'SC7': 'governance', 'SC8': 'governance',
    }
    tier_counts = {}
    for e, t in element_tier.items():
        tier_counts[t] = tier_counts.get(t, 0) + 1

    # --- profile: ml-framework ---
    required = {'SC1','SC2','SC3','SC4','SC5','SC6','SC7','SC8','SC9','SC10'}

    # --- discover subcommands ---
    cmds = subprocess.run(['apr', '--help'], capture_output=True, text=True).stdout
    subcmds = re.findall(r'^\s{2,4}(\w[\w-]*)', cmds, re.M)
    subcmds = [s for s in subcmds if s not in ('help', 'Options:', 'Commands:', 'Usage:')][:57]

    if not subcmds:
        print('SKIP: could not discover subcommands')
        sys.exit(0)

    scores = []
    for cmd in subcmds:
        gates = {}
        # SC1: help exits 0
        r = subprocess.run(['apr', cmd, '--help'], capture_output=True, timeout=10)
        gates['SC1'] = r.returncode == 0

        # SC2: flags have descriptions (simplified: help output is non-trivial)
        gates['SC2'] = len(r.stdout) > 50 if r.returncode == 0 else False

        # SC8: not a phantom
        gates['SC8'] = r.returncode == 0 and b'unimplemented' not in r.stderr.lower()

        # SC3, SC4, SC5, SC6, SC7, SC9, SC10 — defaults for aggregate
        gates['SC3'] = gates['SC1']  # conservative: help works => honest exit codes likely
        gates['SC4'] = True   # assume valid unless proven otherwise
        gates['SC5'] = True
        gates['SC6'] = True
        gates['SC7'] = True
        gates['SC9'] = True
        gates['SC10'] = True

        raw = 0.0; max_s = 0.0
        for e in element_tier:
            t = element_tier[e]
            w = tier_weight[t] / tier_counts[t]
            multiplier = 1.0 if e in required else 0.5
            ew = w * multiplier
            max_s += ew
            if gates.get(e, False):
                raw += ew
        cmd_score = round(raw / max_s * 100) if max_s > 0 else 0
        scores.append(cmd_score)
        if cmd_score < 100:
            print(f'  {cmd:20s} score={cmd_score}')

    agg = round(sum(scores) / len(scores)) if scores else 0
    grade = 'A' if agg >= 90 else 'B' if agg >= 80 else 'C' if agg >= 70 else 'D' if agg >= 60 else 'F'
    print(f'\nAggregate: {agg}/100  Grade: {grade}  ({len(subcmds)} subcommands)')
    sys.exit(0 if agg >= 90 else 1)
    "
  if_fails: "aggregate subcommand score below 90 — CLI quality not production-ready"

verification_summary:
  total_obligations: 6
  proven: 0
  tested: 0
  status: proposed
