contract: apr-book-build
version: 1
status: enforced
date: 2026-04-08
metadata:
  title: "Aprender Book Build Contract"
  tool: mdbook
  mdbook_version: "0.4.40"
  source: book/
  config: book/book.toml
  summary: book/src/SUMMARY.md
  output: book/book/
  deploy: GitHub Pages via actions/deploy-pages@v4
  workflow: .github/workflows/book.yml

description: |
  Provable contract for the Aprender mdBook build and GitHub Pages deployment.
  The book covers the entire aprender monorepo: CLI, architecture, ML fundamentals,
  EXTREME TDD methodology, 150+ case studies, and tooling.

  FALSIFY-BOOK-001: mdbook build exits non-zero
  FALSIFY-BOOK-002: SUMMARY.md references a .md file that does not exist on disk
  FALSIFY-BOOK-003: {{#include}} directive references a file that does not exist
  FALSIFY-BOOK-004: book.toml contains fields invalid for pinned mdbook version
  FALSIFY-BOOK-005: .github/workflows/book.yml does not exist
  FALSIFY-BOOK-006: book/book/index.html not produced after build
  FALSIFY-BOOK-007: Unclosed HTML tags in chapter markdown (mdBook warning)

invariants:
  structure:
    - "book/book.toml exists and is valid TOML"
    - "book/src/SUMMARY.md exists and lists all chapters"
    - "Every .md path in SUMMARY.md exists on disk"
    - "No {{#include}} directive references a nonexistent file"
    - ".github/workflows/book.yml exists"

  build:
    - "`mdbook build book` exits 0 with zero ERROR lines"
    - "book/book/index.html exists after build"
    - "book/book/print.html exists after build"
    - "No 'Missing font' errors in build output"
    - "No 'unknown field' errors from book.toml parsing"

  content:
    - "book.toml [book].title reflects repo scope (not TDD-only)"
    - "book.toml [output.html].git-repository-url points to paiml/aprender"
    - "No generic type parameters parsed as HTML tags (escape with backticks)"

  ci:
    - "Workflow triggers on push to main for book/** changes"
    - "Workflow uses actions/upload-pages-artifact + actions/deploy-pages"
    - "mdBook version pinned to specific release (no latest)"

preconditions:
  - "mdbook binary available (installed or downloaded in CI)"
  - "All chapter .md files committed to git"
  - "All {{#include}} target files committed to git"

postconditions:
  - "book/book/ contains valid HTML site"
  - "GitHub Pages deployment succeeds on push to main"

falsification:
  - condition: "`mdbook build book` exits non-zero"
    severity: P0
    action: reject_push
  - condition: "SUMMARY.md references nonexistent .md file"
    severity: P0
    action: reject_push
  - condition: "{{#include}} references nonexistent file"
    severity: P0
    action: reject_push
  - condition: ".github/workflows/book.yml missing"
    severity: P0
    action: reject_push
  - condition: "book.toml has invalid field for pinned mdbook version"
    severity: P1
    action: fix_config
  - condition: "Unclosed HTML tag warning in build output"
    severity: P2
    action: escape_generics

verification:
  local: "mdbook build book 2>&1 | grep -c ERROR | grep -q '^0$'"
  ci: ".github/workflows/book.yml build job succeeds"
  script: "scripts/check_book_build.sh"
