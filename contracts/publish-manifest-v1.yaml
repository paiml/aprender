# ─────────────────────────────────────────────────────────────
# ABSTRACT
# ─────────────────────────────────────────────────────────────
abstract: |
  Defines the schema and verification protocol for `manifest.yaml`, the
  machine-readable provenance document that accompanies every published
  model artifact (MODEL-1 distilled, MODEL-2 sovereign).

  The manifest binds three irreversible facts:
    1. The cryptographic identity of the artifact (SHA-256).
    2. The license under which it ships (and any parent license chain).
    3. The data, teacher, and recipe used to produce it.

  Without a contract on this file, published models are indistinguishable
  from a re-uploaded tarball — no way to prove they came from the claimed
  pipeline, no way to detect tampering, no way to audit license
  compliance. This contract makes each of those properties falsifiable.

# ─────────────────────────────────────────────────────────────
# FIVE-WHYS MOTIVATION
# ─────────────────────────────────────────────────────────────
five_whys:
  - q: "Why do we need a publish-manifest contract?"
    a: "AC-SHIP1-010 requires 'Published artifact URL resolves; SHA-256 matches manifest' — we cannot falsify that without a manifest schema."
  - q: "Why not just use a README?"
    a: "READMEs are prose and drift. Downstream tooling (`apr pull`, leaderboards, compliance audits) needs structured fields with strict types."
  - q: "Why is SHA-256 specifically required?"
    a: "Models ship as ~4GB binary blobs. Content-addressed storage (HF Hub, S3) can serve stale or swapped bytes; SHA-256 detects every single-bit change."
  - q: "Why include the teacher/data license chain?"
    a: "Qwen2.5-Coder is Apache-2.0 but distillation may chain through CC-BY-4.0 data. Downstream users must know the UNION of licenses, not just the top-level."
  - q: "Why make this a separate contract instead of folding it into SHIP-TWO-001?"
    a: "The manifest schema is shared across MODEL-1, MODEL-2, and any future published model. A reusable contract prevents copy-paste drift."

# ─────────────────────────────────────────────────────────────
# EQUATIONS / FORMALISATION
# ─────────────────────────────────────────────────────────────
equations:
  artifact_identity:
    formula: |
      sha256(artifact_bytes) == manifest.sha256
      AND stat(artifact_bytes).size == manifest.size_bytes
    domain: (PublishedArtifact, Manifest)
    codomain: Boolean
    invariants:
      - "SHA-256 is computed over the ENTIRE artifact file, not just header"
      - "size_bytes is the on-disk byte count, not logical content size"
      - "Any single byte flip MUST break the equality (detection property)"

  license_chain_soundness:
    formula: |
      compatible(manifest.license, manifest.teacher_license ∪ manifest.data_license)
      where compatible(L, S) := every license l ∈ S permits redistribution under L
    domain: (Manifest.license, Set[UpstreamLicense])
    codomain: Boolean
    invariants:
      - "GPL in upstream contaminates Apache-2.0 downstream (must flag, not hide)"
      - "CC-BY-* in data requires attribution in README of downstream"
      - "Unknown/missing upstream license is a HARD FAIL — no mystery licenses"

  url_liveness:
    formula: |
      HTTP GET manifest.artifact_url → 200 OK
      AND response.content-length == manifest.size_bytes
    domain: Manifest.artifact_url
    codomain: Boolean
    invariants:
      - "URL must resolve without auth (public artifact) or via documented token"
      - "content-length check catches truncated uploads before SHA-256 mismatch"

# ─────────────────────────────────────────────────────────────
# SCHEMA
# ─────────────────────────────────────────────────────────────
schema:
  format: YAML
  filename: manifest.yaml
  required_fields:
    - model_id                     # string, e.g. "paiml/qwen2.5-coder-7b-distilled-v2-q4k"
    - version                      # semver string, e.g. "1.0.0"
    - architecture                 # string, must match contracts/model-families/*.yaml
    - format                       # enum: apr | gguf | safetensors
    - quantization                 # enum: fp32 | fp16 | bf16 | q8_0 | q4_k | q5_k | q6_k | none
    - artifact_url                 # HTTPS URL resolving to the binary
    - sha256                       # 64-char hex string, lowercase
    - size_bytes                   # positive integer
    - license                      # SPDX identifier (e.g. "Apache-2.0", "CC-BY-4.0")
    - provenance                   # structured sub-document (see below)
    - published_at                 # ISO-8601 UTC timestamp
    - published_by                 # string, person/bot identifier
  provenance_required_fields:
    - pipeline                     # enum: distillation | pretraining | finetune | merge
    - parent                       # for distill/finetune/merge — upstream model_id + sha256
    - parent_license               # SPDX identifier of the parent
    - data_source                  # human-readable data origin (or "teacher-only" for pure KD)
    - data_license                 # SPDX identifier (CC-BY-4.0, MIT, etc.)
    - recipe                       # path to contract/recipe YAML governing this pipeline
    - recipe_sha256                # SHA-256 of that recipe file at publish time
  optional_fields:
    - eval_results                 # map of benchmark_name → {pass_at_1, timestamp, harness_version}
    - training_cost                # {wall_clock_hours, gpu_model, gpu_count, approx_tokens}
    - deprecates                   # model_id of any artifact this replaces

# ─────────────────────────────────────────────────────────────
# ACCEPTANCE & REJECTION
# ─────────────────────────────────────────────────────────────
acceptance_criteria:
  - id: AC-PM-001
    claim: "All required_fields present and non-null in manifest.yaml"
    why: "Missing fields silently reduce provenance to uselessness"
  - id: AC-PM-002
    claim: "sha256 field matches computed SHA-256 of downloaded artifact"
    why: "Content integrity; any tampering detected"
  - id: AC-PM-003
    claim: "size_bytes matches stat() of downloaded file"
    why: "Catches truncated uploads faster than SHA-256"
  - id: AC-PM-004
    claim: "HTTP GET of artifact_url returns 200 with matching content-length"
    why: "URL liveness at publish time"
  - id: AC-PM-005
    claim: "license and all provenance.*_license fields are valid SPDX identifiers"
    why: "Downstream compliance tooling requires SPDX, not prose"
  - id: AC-PM-006
    claim: "provenance.recipe path resolves; its SHA-256 matches recipe_sha256"
    why: "Distillation/training recipe at publish time must be reproducible"
  - id: AC-PM-007
    claim: "Parent chain terminates at a documented public model or dataset"
    why: "No 'mystery weights' in the chain"

rejection_criteria:
  - id: RJ-PM-001
    trigger: "sha256 != computed sha256"
    action: "HARD FAIL. Block publish. Investigate: re-upload, byte corruption, manifest stale."
  - id: RJ-PM-002
    trigger: "Any required field missing OR null OR empty-string"
    action: "HARD FAIL. Manifest is malformed — cannot ship."
  - id: RJ-PM-003
    trigger: "license or parent_license is 'unknown' / 'proprietary' / 'TBD'"
    action: "HARD FAIL. Mystery-license artifacts NEVER ship."
  - id: RJ-PM-004
    trigger: "provenance.pipeline == 'distillation' AND provenance.parent is missing"
    action: "HARD FAIL. Distillation without a teacher record is not reproducible."

# ─────────────────────────────────────────────────────────────
# FALSIFICATION TESTS
# ─────────────────────────────────────────────────────────────
falsification_tests:
  - id: FALSIFY-PM-001
    name: "manifest_schema_conforms"
    description: |
      Parse manifest.yaml and verify every required_field is present,
      non-null, and of the declared type.
    command: |
      apr validate-manifest /path/to/manifest.yaml --strict
    expected: exit 0
    fails_if: "Any missing/null/wrong-type field — schema tool exits non-zero"

  - id: FALSIFY-PM-002
    name: "sha256_matches_artifact"
    description: |
      Download artifact; compute SHA-256; compare with manifest.sha256.
    command: |
      curl -sL "$(yq .artifact_url manifest.yaml)" -o /tmp/artifact.bin
      COMPUTED=$(sha256sum /tmp/artifact.bin | awk '{print $1}')
      DECLARED=$(yq -r .sha256 manifest.yaml)
      [ "$COMPUTED" = "$DECLARED" ] && echo PASS || echo FAIL
    expected: "PASS"
    fails_if: "SHA-256 mismatch. Either artifact corrupted in transit or manifest stale."

  - id: FALSIFY-PM-003
    name: "url_resolves_with_matching_size"
    description: |
      HTTP HEAD the artifact_url; compare content-length to size_bytes.
    command: |
      URL=$(yq -r .artifact_url manifest.yaml)
      SIZE=$(yq .size_bytes manifest.yaml)
      CL=$(curl -sI "$URL" | grep -i '^content-length:' | awk '{print $2}' | tr -d '\r')
      [ "$CL" = "$SIZE" ] && echo PASS || echo FAIL
    expected: "PASS"
    fails_if: "URL missing / content-length mismatch. Points to truncation or bad CDN state."

  - id: FALSIFY-PM-004
    name: "spdx_identifiers_valid"
    description: |
      Validate license and every provenance.*_license against SPDX license list.
    command: |
      apr validate-manifest /path/to/manifest.yaml --check-spdx
    expected: exit 0
    fails_if: "Any license string not in SPDX canonical list (case-sensitive)."

  - id: FALSIFY-PM-005
    name: "recipe_sha256_matches_checked_in_file"
    description: |
      For distilled/finetuned/merged artifacts, recipe_sha256 must match
      the SHA-256 of the referenced YAML at publish time.
    command: |
      RECIPE=$(yq -r .provenance.recipe manifest.yaml)
      COMPUTED=$(sha256sum "$RECIPE" | awk '{print $1}')
      DECLARED=$(yq -r .provenance.recipe_sha256 manifest.yaml)
      [ "$COMPUTED" = "$DECLARED" ] && echo PASS || echo FAIL
    expected: "PASS"
    fails_if: "Recipe modified after publish without manifest update."

  - id: FALSIFY-PM-006
    name: "parent_chain_terminates"
    description: |
      Follow the parent chain until hitting a documented public model/dataset
      (e.g., Qwen/Qwen2.5-Coder-7B-Instruct on HF). Must not cycle or dead-end.
    command: |
      apr validate-manifest /path/to/manifest.yaml --follow-parents --depth 5
    expected: exit 0
    fails_if: "Parent cycle detected OR chain ends at unknown model."

  - id: FALSIFY-PM-007
    name: "safetensors_header_dtype_matches_quantization"
    description: |
      Poka-Yoke gate: when format == "safetensors" AND --artifact is provided,
      parse the safetensors header (first 8 bytes LE u64 = header length, then
      UTF-8 JSON) and verify per-tensor dtype matches manifest.quantization.

      Norm/bias tensors (name contains "norm" OR ends with ".bias") may remain
      F32 regardless of declared quant — that's the canonical fp16 export shape.
      Weight tensors MUST match the declared dtype:
        fp16 → F16
        bf16 → BF16
        fp32 → F32

      Rationale: SHIP-TWO-001 §12.7.2 lists "Uploaded .safetensors header
      declares F32 for weight tensors when manifest says fp16" as a ship-blocker.
      This gate catches that failure at publish time instead of after a 30+ GiB
      upload of mis-quantized weights.
    command: |
      apr validate-manifest /path/to/manifest.yaml --artifact /path/to/model.safetensors
    expected: exit 0 (or the safetensors-dtype check passes with status PASS in JSON)
    fails_if: |
      Any weight tensor's header dtype differs from the dtype implied by
      manifest.quantization. (E.g., fp16 manifest but tensor.dtype == "F32".)

  - id: FALSIFY-PM-008
    name: "gguf_tensor_type_matches_quantization"
    description: |
      Poka-Yoke gate: when format == "gguf" AND --artifact is provided,
      parse both the GGUF metadata_kv block and the tensor_metadata section,
      and verify the **predominant non-float tensor type** matches the
      manifest's `quantization` string per ggml-common.h `enum ggml_type`.

      Authority order:
        1. Predominant GGML tensor type (authoritative — this is what real
           inference engines like llama.cpp consume).
        2. `general.file_type` u32 from metadata_kv (fallback only — the
           llama.cpp quantize tool has shipped artifacts with ftype=0 even
           when all weights are Q4_K, so this field is advisory).

      Canonical GGML tensor-type mapping (source: ggml-common.h):
        q4_0  → 2          q4_k / q4_k_* → 12
        q4_1  → 3          q5_k / q5_k_* → 13
        q5_0  → 6          q6_k   → 14
        q5_1  → 7          q8_k   → 15
        q8_0  → 8          fp16   → 1
        q2_k  → 10         bf16   → 30
        q3_k* → 11         fp32   → 0

      Predominant type = most common type excluding F32/F16/BF16/F64
      (since bias/norm tensors are always kept in F32 even in quantized
      models, the raw majority would be wrong).

      Rationale: mirrors PM-007 for the third shipped format. A manifest
      claiming `q4_k_m` against a GGUF whose predominant tensor type is
      `Q6_K` is lying about the artifact. Catch at publish time, before
      30+ GiB of mis-labelled bytes move across the network.
    command: |
      apr validate-manifest /path/to/manifest.yaml --artifact /path/to/model.gguf
    expected: exit 0 (or the gguf tensor-type check passes with status PASS in JSON)
    fails_if: |
      The predominant non-float tensor type disagrees with the GGML type
      implied by manifest.quantization. If no tensor metadata is readable
      (synthetic / header-only fixtures), falls back to a strict
      `general.file_type` match.

  - id: FALSIFY-PM-009
    name: "apr_magic_matches_format"
    description: |
      Poka-Yoke gate: when format == "apr" AND --artifact is provided,
      verify the first 4 bytes of the staged artifact match one of the
      APR magic variants:
        - `APR\0` — APR v2 (current ship format)
        - `APRN`  — APR v1 (legacy)
        - `APR1`, `APR2` — reserved variants per
          crates/aprender-registry/src/format.rs::parse_apr_header

      Scope (v1.0): magic-bytes check only. This catches the "wrong file
      staged under format=apr" ship-blocker class (e.g. a `.gguf` file
      renamed `.apr`, or a stray `.safetensors` under the APR manifest)
      before any network I/O. Symmetric to PM-007 (safetensors) and
      PM-008 (gguf) so all three shipped formats are covered.

      Expansion path (v1.1): parse the APR v2 tensor index via
      `aprender::format::v2::AprV2Reader`, compute predominant
      non-float dtype over 2D weight tensors, compare to
      manifest.quantization. Defer until a real-world FAIL justifies
      the complexity (same discipline as PM-008's initial ftype-only
      scope).
    command: |
      apr validate-manifest /path/to/manifest.yaml --artifact /path/to/model.apr
    expected: exit 0 (or the apr-magic check passes with status PASS in JSON)
    fails_if: |
      The staged file's first 4 bytes are not one of `APR\0`, `APRN`,
      `APR1`, or `APR2`. Unit tests cover the GGUF-staged-as-APR scenario
      (`pm009_gguf_magic_staged_as_apr_fails`) and the empty-file scenario.

  # ───────────────────────────────────────────────────────────
  # FALSIFY-SHIP-010 — algorithm-level PARTIAL discharge.
  # Binds SHIP-TWO-001 AC-SHIP1-010 ("Published artifact URL resolves;
  # SHA-256 matches manifest") to pure decision rules in Rust, separately
  # from the live-network FALSIFY-PM-002 + FALSIFY-PM-003 gates that
  # shell out to curl + sha256sum.
  # ───────────────────────────────────────────────────────────
  - id: FALSIFY-SHIP-010
    name: "ship_010_partial_sha256_and_url_verdict_rule"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    binds_to: AC-SHIP1-010
    ship_blocking: true
    description: |
      Pure-function decision rules for the publish gate:

        1. `verdict_from_sha256_match(expected_hex, actual_hex) -> Ship010Verdict`
           — Pass iff both strings are exactly
           `AC_SHIP1_010_SHA256_HEX_LEN = 64` lowercase hex chars AND
           byte-identical. Fails for wrong length, non-hex, uppercase /
           mixed-case, whitespace, or any single-byte mismatch.
        2. `verdict_from_manifest_url(url) -> Ship010Verdict`
           — Pass iff url starts with
           `AC_SHIP1_010_REQUIRED_URL_SCHEME = "https://"`, has a non-
           empty host (at least one char before the first `/`), and
           contains no ASCII whitespace or control characters.

      Together these two rules discharge the algorithm half of
      FALSIFY-PM-002 (sha256 matches artifact) + FALSIFY-PM-003 (URL
      resolves) without needing any network I/O. A publish pipeline
      that edits either constant (weakening to a 32-char hash, relaxing
      to plaintext HTTP, accepting uppercase sha256sum output) breaks
      the proof here at compile+test time, not at HF Hub publish time.

      Full discharge of AC-SHIP1-010 still requires the live path:
      `curl -sI $artifact_url` → 200 OK with matching content-length,
      and `sha256sum` of the ~5GiB downloaded teacher artifact matching
      the manifest's declared hash byte-identically. Those belong to
      FALSIFY-PM-002 + FALSIFY-PM-003 at publish time and are not
      duplicated here.
    evidence_required: |
      `cargo test -p aprender-core --lib falsify_ship_010_sha256_match_threshold_logic`
      exits 0 AND
      `cargo test -p aprender-core --lib falsify_ship_010_manifest_url_well_formedness`
      exits 0 AND
      `cargo test -p aprender-core --lib is_canonical_lowercase_hex_rejects_uppercase`
      exits 0.
    evidence_discharged_by:
      - "crates/aprender-core/src/format/ship_010.rs::ship_010_tests::falsify_ship_010_sha256_match_threshold_logic"
      - "crates/aprender-core/src/format/ship_010.rs::ship_010_tests::falsify_ship_010_manifest_url_well_formedness"
      - "crates/aprender-core/src/format/ship_010.rs::ship_010_tests::is_canonical_lowercase_hex_rejects_uppercase"
    expected: "PASS at the pure-function level; live-network discharge deferred to FALSIFY-PM-002/003."
    fails_if: |
      Any edit that (a) makes the sha256 comparison case-insensitive,
      (b) accepts non-64-char hashes, (c) accepts non-hex characters,
      (d) accepts plaintext http://, (e) accepts whitespace in the URL,
      or (f) accepts an empty host.
    falsification_id: FALSIFY-SHIP-010

# ─────────────────────────────────────────────────────────────
# PROOF OBLIGATIONS
# ─────────────────────────────────────────────────────────────
proof_obligations:
  - id: PO-PM-001
    theorem: "Manifest.content_addressable_identity"
    statement: |
      For any published artifact A with manifest M, if computed_sha256(A) ≠ M.sha256,
      then either A or M has been modified since publish. Identity is falsified.
    discharged_by: FALSIFY-PM-002

  - id: PO-PM-002
    theorem: "Manifest.license_chain_disclosure_completeness"
    statement: |
      If artifact was produced by distillation/finetune/merge, its manifest
      MUST cite every upstream license. The contract rejects any chain
      terminating in unknown-licensed weights.
    discharged_by: [FALSIFY-PM-004, FALSIFY-PM-006, RJ-PM-003]

  - id: PO-PM-003
    theorem: "Manifest.recipe_reproducibility"
    statement: |
      For every distilled/trained artifact, the recipe YAML at publish
      time is archived with a SHA-256 checksum. Future reproductions
      can verify they ran the same recipe.
    discharged_by: FALSIFY-PM-005

# ─────────────────────────────────────────────────────────────
# KANI HARNESSES
# ─────────────────────────────────────────────────────────────
kani_harnesses:
  - id: KH-PM-001
    obligation: PO-PM-001
    property: |
      ∀ artifact A with manifest M:
          computed_sha256(A) == M.sha256
          OR publish_is_rejected(A, M)
    bound: 4
    strategy: exhaustive
    harness: verify_manifest_sha256_identity
  - id: KH-PM-002
    obligation: PO-PM-002
    property: |
      ∀ manifest M with non-empty parent chain:
          spdx_compatible(M.license, ⋃ parent_licenses)
          AND no license in chain equals "unknown" / "proprietary" / "TBD"
    bound: 8
    strategy: exhaustive
    harness: verify_license_chain_disclosure
  - id: KH-PM-003
    obligation: PO-PM-003
    property: |
      ∀ distilled or trained artifact with recipe path R:
          sha256(file_at_path(R)) == M.provenance.recipe_sha256
    bound: 4
    strategy: exhaustive
    harness: verify_recipe_sha256_reproducibility
  - id: KH-PM-004
    obligation: "Poka-Yoke format-magic validation (FALSIFY-PM-007/008/009)"
    property: |
      ∀ manifest M with --artifact provided:
          (M.format == "safetensors" → header.dtype matches M.quantization)
          AND (M.format == "gguf"   → predominant_ggml_type matches M.quantization)
          AND (M.format == "apr"    → first_4_bytes ∈ {APR\\0, APRN, APR1, APR2})
    bound: 8
    strategy: exhaustive
    harness: verify_format_magic_and_dtype_parity

# ─────────────────────────────────────────────────────────────
# QA GATE
# ─────────────────────────────────────────────────────────────
qa_gate:
  must_pass:
    - FALSIFY-PM-001   # schema conforms
    - FALSIFY-PM-002   # sha256 matches
    - FALSIFY-PM-003   # URL resolves
    - FALSIFY-PM-004   # SPDX valid
  must_pass_if_distilled_or_trained:
    - FALSIFY-PM-005   # recipe sha256 matches
    - FALSIFY-PM-006   # parent chain terminates
  must_pass_if_format_safetensors_and_artifact_provided:
    - FALSIFY-PM-007   # safetensors header dtype Poka-Yoke (SHIP-TWO-001 §12.7.2)
    - FALSIFY-PM-008   # gguf general.file_type Poka-Yoke (SHIP-TWO-001 §12.7.2)
  regression_protection: |
    This contract must be re-evaluated any time:
      - manifest.yaml schema adds/removes a field
      - apr validate-manifest implementation changes
      - SPDX license list upstream version changes
      - Any new publish workflow (S3 bucket, HF Hub mirror, etc.) is added

# ─────────────────────────────────────────────────────────────
# EXAMPLE (illustrative, not normative)
# ─────────────────────────────────────────────────────────────
example_manifest: |
  model_id: paiml/qwen2.5-coder-7b-distilled-v2-q4k
  version: 2.0.0
  architecture: qwen2
