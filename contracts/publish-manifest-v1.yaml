changelog:
  - v1.4.0 (2026-04-23): Added FALSIFY-SHIP-010 algorithm-level PARTIAL discharge (GATE-PM-010) for MODEL-1 AC-SHIP1-010. Binds the published-artifact ship gate to two pure decision rules in `crates/aprender-core/src/format/ship_010.rs` — (1) `verdict_from_sha256_match(expected, actual)` Pass iff both strings are exactly 64 lowercase-hex chars AND byte-identical (rejects uppercase, mixed case, wrong length, non-hex, whitespace, and all-zero-vs-real); (2) `verdict_from_manifest_url(url)` Pass iff URL starts_with `https://`, host non-empty, no whitespace or control chars (rejects http://, scheme-less, bare slug, empty host, trailing \\n). Covers the decision-rule layer of FALSIFY-PM-002 (sha256 matches artifact) + FALSIFY-PM-003 (URL resolves) that previously lived only in shell-pipeline tests. Full discharge still blocks on live curl + sha256sum on the published ~5GiB teacher artifact. Brings MODEL-1 touched count to 7/10 AC-SHIP1 items (SHIP-002 + 005 + 006 + 007 + 008 + 009 + 010).
