  - {crate: aprender-train-distill, bin: aprender-train-distill, class: MERGE-INTO-apr, reason: "apr distill exists", target: "0.72.0"}
  - {crate: aprender-train-inspect, bin: aprender-train-inspect, class: MERGE-INTO-apr, reason: "apr inspect exists", target: "0.72.0"}
  - {crate: aprender-train-lora, bin: aprender-train-lora, class: MERGE-INTO-apr, reason: "apr finetune exists", target: "0.72.0"}
  - {crate: aprender-data, bin: alimentar, class: MERGE-INTO-apr, reason: "becomes apr data", target: "0.73.0"}
  - {crate: aprender-test-cli, bin: aprender-test-cli, class: MERGE-INTO-apr, reason: "becomes an apr subcommand", target: "0.73.0"}
  - {crate: aprender-cbtop, bin: aprender-cbtop, class: DEPRECATE→DELETE, reason: "superseded by apr cbtop", target: "0.70.0"}
