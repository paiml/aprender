  - {crate: aprender, bin: apr, class: KEEP, reason: "the one entry point", target: null}
  - {crate: aprender-compute-xtask, bin: aprender-compute-xtask, class: KEEP, reason: "build tooling, never installed", target: null}
  - {crate: aprender-contracts-cli, bin: pv, class: KEEP, reason: "contract CLI, dogfooded by every gate", target: null}
  - {crate: aprender-zram-generator, bin: aprender-zram-generator, class: KEEP, reason: "systemd generator, must be a standalone ELF", target: null}
  - {crate: ccpa-sft-export, bin: ccpa-sft-export, class: KEEP, reason: "publish = false dev tool (excluded crate; missed by the #4057 census)", target: null}
  - {crate: aprender-orchestrate, bin: aprender-orchestrate, class: KEEP + RENAME, reason: "rename to batuta", target: "0.73.0"}
  - {crate: aprender-profile, bin: aprender-profile, class: KEEP + RENAME, reason: "rename to renacer", target: "0.73.0"}
  - {crate: apr-cli, bin: apr, class: MERGE, reason: "duplicate of the root facade's apr", target: "0.71.0"}
  - {crate: apr-cli, bin: apr-corpus-ingest, class: MERGE-INTO-apr, reason: "becomes an apr subcommand", target: "0.71.0"}
  - {crate: aprender-explain, bin: aprender-explain, class: MERGE-INTO-apr, reason: "becomes an apr subcommand", target: "0.71.0"}
  - {crate: aprender-ptx-debug, bin: aprender-ptx-debug, class: MERGE-INTO-apr, reason: "becomes an apr subcommand", target: "0.71.0"}
  - {crate: aprender-qa-certify, bin: apr-qa-readme-sync, class: MERGE-INTO-apr, reason: "becomes an apr subcommand", target: "0.71.0"}
  - {crate: aprender-qa-cli, bin: apr-qa, class: MERGE-INTO-apr, reason: "becomes an apr subcommand", target: "0.71.0"}
