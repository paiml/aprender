qa_gate:
  id: F-RP-001
  name: RoPE Contract
  checks:
  - norm_preservation
  - relative_position
  pass_criteria: All 7 falsification tests pass
  falsification: Swap sin and cos in rotation matrix
simd_dispatch:
  rope:
    scalar: rope_scalar
    avx2: rope_avx2
    ptx: rope_ptx
