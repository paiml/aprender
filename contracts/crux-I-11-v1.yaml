equations:
  guided_json_output_validates:
    formula: |
      vLLM structured-outputs: extra_body.guided_json = <JSONSchema>
        → generated text, when parsed, validates against schema with zero errors.
      Equivalent OpenAI API: response_format = { type: "json_schema",
                                                  json_schema: { schema: <JSONSchema> } }
      apr serve --json-schema <file>  OR  /v1/chat/completions response_format:
        MUST parse as JSON AND validate against the schema.
    domain: "(prompt P, JSONSchema S)"
    codomain: "assistant.content string that parses as JSON satisfying S"
    invariants:
    - "json.loads(output) succeeds (no parse error)"
    - "jsonschema.validate(json.loads(output), S) raises no error"
    - "finish_reason in {'stop', 'length'} — never 'tool_calls' for guided_json path"
    - "Reference: https://docs.vllm.ai/en/latest/features/structured_outputs.html"

  schema_subset_enforcement:
    formula: |
      Supported JSONSchema constructs (vLLM outlines backend minimum):
        types: object, array, string, integer, number, boolean, null
        keywords: properties, required, items, enum, minimum, maximum,
                   minLength, maxLength, pattern, oneOf, anyOf
      apr must accept at least this subset; unsupported keywords fall through
      with HTTP 400 error (not silent drop).
    domain: "JSONSchema fragment"
    codomain: "acceptance decision {accepted, HTTP 400 with keyword-name}"
    invariants:
    - "Silent schema-keyword ignoring is FORBIDDEN (explicit rejection)"
    - "enum constraint is ENFORCED — output value must be in enum list"

falsification_tests:
- id: FALSIFY-CRUX-I-11-001
  rule: "guided JSON output parses and validates against supplied schema"
  prediction: "apr serve with response_format=json_schema emits parseable JSON matching schema"
  test: |
    set -euo pipefail
    apr serve --port 7830 --model test-model.apr &
    SRV=$!
    trap "kill $SRV 2>/dev/null || true" EXIT
    sleep 2
    RESP=$(curl -sS http://127.0.0.1:7830/v1/chat/completions \
             -H 'Content-Type: application/json' \
             -d '{"model":"test","messages":[{"role":"user","content":"Emit a user record"}],
                  "response_format":{"type":"json_schema","json_schema":{"schema":{
                    "type":"object",
                    "properties":{"name":{"type":"string"},"age":{"type":"integer","minimum":0}},
                    "required":["name","age"]
                  }}}}')
    CONTENT=$(echo "$RESP" | jq -r '.choices[0].message.content')
    echo "$CONTENT" | jq -e 'type == "object" and (.name | type == "string") and (.age | type == "number") and (.age >= 0)'
  if_fails: "guided JSON output fails to parse or violates the required schema"

- id: FALSIFY-CRUX-I-11-002
  rule: "enum constraint is enforced (only values in enum appear)"
  prediction: "output.color in ['red','green','blue'] across 5 samples"
  test: |
    set -euo pipefail
    apr serve --port 7831 --model test-model.apr &
    SRV=$!
    trap "kill $SRV 2>/dev/null || true" EXIT
    sleep 2
    for i in 1 2 3 4 5; do
      C=$(curl -sS http://127.0.0.1:7831/v1/chat/completions \
             -H 'Content-Type: application/json' \
             -d '{"model":"test","messages":[{"role":"user","content":"Pick a color"}],
                  "response_format":{"type":"json_schema","json_schema":{"schema":{
                    "type":"object","properties":{"color":{"type":"string",
                      "enum":["red","green","blue"]}},"required":["color"]}}}}' \
           | jq -r '.choices[0].message.content' | jq -r '.color')
      case "$C" in red|green|blue) ;; *) echo "violation: $C"; exit 1;; esac
    done
  if_fails: "enum constraint not enforced — output sampled a value outside enum list"

- id: FALSIFY-CRUX-I-11-003
  rule: "unsupported schema keyword yields HTTP 400 (no silent drop)"
  prediction: "schema using unsupported keyword (e.g. deprecated-only keyword) returns 400 error naming keyword"
  test: |
    set -euo pipefail
    apr serve --port 7832 --model test-model.apr &
    SRV=$!
    trap "kill $SRV 2>/dev/null || true" EXIT
    sleep 2
    CODE=$(curl -sS -o /tmp/err.json -w '%{http_code}' http://127.0.0.1:7832/v1/chat/completions \
             -H 'Content-Type: application/json' \
             -d '{"model":"test","messages":[{"role":"user","content":"x"}],
                  "response_format":{"type":"json_schema","json_schema":{"schema":{
                    "type":"object","$unsupportedCustomKeyword":true}}}}')
    test "$CODE" = "400"
    jq -e '.error.message | test("unsupported|not supported|unknown keyword"; "i")' /tmp/err.json
  if_fails: "unsupported schema keyword silently dropped instead of surfacing as HTTP 400"

proof_obligations:
- type: invariant
  property: "Output validates against supplied JSONSchema (parse + validate both succeed)"
- type: invariant
