metadata:
  version: 1.0.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: Activation functions — GELU, SiLU/Swish, ReLU kernels
  references:
  - Hendrycks & Gimpel (2016) Gaussian Error Linear Units (GELUs)
  - Ramachandran et al. (2017) Searching for Activation Functions (SiLU)
  - Nair & Hinton (2010) Rectified Linear Units Improve Restricted Boltzmann Machines
equations:
  gelu:
    formula: GELU(x) = x · Φ(x) ≈ 0.5x(1 + tanh(√(2/π)(x + 0.044715x³)))
    domain: x ∈ ℝ
    codomain: ℝ
    invariants:
    - GELU(x) → x as x → +∞
    - GELU(x) → 0 as x → -∞
    - GELU(0) = 0
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Gelu
    postconditions:
    - result.len() == x.len()
    - result.iter().all(|v| v.is_finite())
    guarantees:
      shapes:
        output: { dims: ["x.len()"] }
      constraints:
      - "output is finite"
      - "output.len() == x.len()"
  silu:
    formula: SiLU(x) = x · σ(x) = x / (1 + exp(-x))
    domain: x ∈ ℝ
    codomain: ℝ
    invariants:
    - SiLU(x) → x as x → +∞
    - SiLU(x) → 0 as x → -∞
    - SiLU(0) = 0
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Silu
  relu:
    formula: ReLU(x) = max(0, x)
    domain: x ∈ ℝ
    codomain: '[0, ∞)'
    invariants:
    - ReLU(x) ≥ 0 (non-negativity)
    - ReLU(x) = x for x > 0
    - ReLU(x) = 0 for x ≤ 0
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Relu
proof_obligations:
- type: invariant
  property: GELU at zero
  formal: GELU(0) = 0
  applies_to: all
  lean:
    theorem: Gelu.gelu_zero
    module: ProvableContracts.Gelu
    status: proved
    depends_on: []
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.Trigonometric.Basic
    - Mathlib.Analysis.SpecialFunctions.Pow.Real
    notes: 'GELU(x) = 0.5·x·(1 + tanh …); at x=0 the leading 0.5·x factor is zero, so
      the product is zero regardless of the tanh argument. Closed by ring.'
- type: bound
  property: GELU approximation error
  formal: '|GELU_approx(x) - GELU_exact(x)| < ε for |x| < 10'
  tolerance: 0.0001
  applies_to: all
- type: invariant
  property: SiLU at zero
  formal: SiLU(0) = 0
  applies_to: all
  lean:
    theorem: Sigmoid.silu_zero
    module: ProvableContracts.Sigmoid
    status: proved
    depends_on: []
    mathlib_imports: []
    notes: SiLU(x) = x·σ(x); SiLU(0) = 0·σ(0) = 0 by ring.
- type: monotonicity
  property: ReLU monotonic
  formal: x ≥ y ⟹ ReLU(x) ≥ ReLU(y)
  applies_to: all
  lean:
    theorem: Elementwise.relu_monotone
    module: ProvableContracts.Elementwise
    status: proved
    depends_on:
    - max_le_max
    mathlib_imports: []
    notes: 'relu(x) = max 0 x; x ≤ y ⟹ max 0 x ≤ max 0 y via max_le_max (le_refl 0) h.'
- type: invariant
  property: ReLU non-negative
  formal: ReLU(x) ≥ 0 for all x
  applies_to: all
  lean:
    theorem: Elementwise.relu_nonneg
    module: ProvableContracts.Elementwise
    status: proved
    depends_on:
    - le_max_left
    mathlib_imports: []
    notes: 'relu(x) = max 0 x ≥ 0 by le_max_left 0 x.'
- type: invariant
  property: ReLU idempotent
  formal: ReLU(ReLU(x)) = ReLU(x)
  applies_to: all
  lean:
    theorem: Elementwise.relu_idempotent
    module: ProvableContracts.Elementwise
    status: proved
    depends_on:
    - relu_nonneg
    - relu_of_nonneg
    mathlib_imports: []
    notes: 'relu output is non-negative (relu_nonneg) and relu is the identity on
      non-negative inputs (relu_of_nonneg), so relu(relu x) = relu x.'
- type: invariant
  property: Leaky-ReLU identity on non-negative inputs
  formal: x ≥ 0 ⟹ LeakyReLU(α, x) = x
  applies_to: all
  lean:
    theorem: Elementwise.leaky_relu_of_nonneg
    module: ProvableContracts.Elementwise
    status: proved
    depends_on: []
    mathlib_imports: []
    notes: 'leaky_relu(α,x) = if x ≥ 0 then x else α·x; the non-negative branch is the
      identity, closed by if_pos. Matches Rust nn::functional::leaky_relu (x>0 ⟹ x).'
- type: invariant
  property: Leaky-ReLU negative-slope branch
  formal: x < 0 ⟹ LeakyReLU(α, x) = α · x
  applies_to: all
  lean:
    theorem: Elementwise.leaky_relu_of_neg
    module: ProvableContracts.Elementwise
    status: proved
    depends_on: []
    mathlib_imports: []
    notes: 'leaky_relu(α,x) = if x ≥ 0 then x else α·x; for x < 0 the else-branch gives
      α·x, closed by if_neg (not_le.mpr hx).'
- type: bound
  property: GELU non-negative on non-negative inputs
  formal: x ≥ 0 ⟹ GELU(x) ≥ 0
  applies_to: all
  lean:
    theorem: Gelu.gelu_nonneg_of_nonneg
    module: ProvableContracts.Gelu
    status: proved
    depends_on:
    - Real.neg_one_lt_tanh
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.Trigonometric.Basic
    notes: 'GELU(x) = 0.5·x·(1 + tanh a); for x ≥ 0 the factor 0.5·x ≥ 0 and 1 + tanh a
      > 0 since tanh a > -1 (Real.neg_one_lt_tanh), so the product is ≥ 0.'
- type: bound
  property: GELU bounded by identity on non-negative inputs
  formal: x ≥ 0 ⟹ GELU(x) ≤ x
  applies_to: all
  lean:
    theorem: Gelu.gelu_le_self_of_nonneg
    module: ProvableContracts.Gelu
    status: proved
    depends_on:
    - Real.tanh_lt_one
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.Trigonometric.Basic
    notes: 'GELU(x) = 0.5·x·(1 + tanh a); since tanh a < 1 (Real.tanh_lt_one) the factor
      1 + tanh a ≤ 2, and 0.5·x·2 = x for x ≥ 0, so GELU(x) ≤ x.'
- type: equivalence
  property: SIMD matches scalar
  tolerance: 4.0
  applies_to: simd
falsification_tests:
- id: FALSIFY-ACT-001
  rule: GELU zero
  prediction: GELU(0) = 0
  test: direct test
  if_fails: Constant term in approximation
- id: FALSIFY-ACT-002
  rule: GELU approximation
  prediction: '|GELU_fast(x) - GELU_ref(x)| < 1e-4 for |x| < 10'
  test: proptest with random x in [-10, 10]
  if_fails: tanh approximation coefficients wrong
- id: FALSIFY-ACT-003
  rule: SiLU zero
  prediction: SiLU(0) = 0
  test: direct test
  if_fails: sigmoid(0) not exactly 0.5
- id: FALSIFY-ACT-004
  rule: ReLU non-negative
  prediction: ReLU(x) ≥ 0 for all x including -0.0
  test: proptest including signed zeros and subnormals
  if_fails: Signed zero handling
- id: FALSIFY-ACT-005
  rule: SIMD equivalence
  prediction: '|act_avx2(x) - act_scalar(x)| < 4 ULP for each activation'
  test: proptest comparing all activations scalar vs SIMD
  if_fails: SIMD fast-math approximation diverges
- id: FALSIFY-ACT-006
  rule: ReLU monotonic
  prediction: x1 <= x2 => ReLU(x1) <= ReLU(x2)
  test: proptest with random x1 <= x2 pairs
  if_fails: ReLU implementation not monotonic
- id: FALSIFY-ACT-007
  rule: ReLU idempotent
  prediction: ReLU(ReLU(x)) == ReLU(x) for all x
  test: proptest with random x
  if_fails: ReLU not idempotent (double application changes output)
- id: FALSIFY-ACT-008
  rule: Leaky-ReLU non-negative branch
  prediction: x >= 0 => LeakyReLU(alpha, x) == x
  test: proptest with random x >= 0 and random alpha
  if_fails: Leaky-ReLU alters non-negative inputs
- id: FALSIFY-ACT-009
  rule: Leaky-ReLU negative branch
  prediction: x < 0 => LeakyReLU(alpha, x) == alpha * x
  test: proptest with random x < 0 and random alpha
  if_fails: Leaky-ReLU negative slope not applied
- id: FALSIFY-ACT-010
  rule: GELU non-negative on non-negative inputs
  prediction: x >= 0 => GELU(x) >= 0
  test: proptest with random x >= 0
  if_fails: GELU dips below zero for a non-negative input
- id: FALSIFY-ACT-011
  rule: GELU bounded by identity on non-negative inputs
  prediction: x >= 0 => GELU(x) <= x
  test: proptest with random x >= 0
  if_fails: GELU exceeds the identity envelope for a non-negative input
