metadata:
  version: 1.0.0
  created: '2026-10-20'
  author: PAIML Engineering
  description: "Advisory gate: a PR fails only on advisories it introduces; an advisory already on main is an andon with a P0 4 h clock and does not block PRs; one scanner of record. Goal: 0 h total stop on a RustSec publication. DRAFT; gate-accept (one-way door), solo + non-author sign-off + operator yes before arming; any .github/workflows edit goes to a quorum first."
  kind: pattern
  references:
    - "paiml/aprender#5792 (PMAT-5792) -- this ticket"
    - "paiml/aprender#5791 -- cargo deny advisories is blind to RUSTSEC-2026-0378/0379 on main's lock; only cargo audit sees them"
    - "paiml/aprender#5789 -- lock-only wasmtime bump that unblocked the queue"
    - "MG run 39413691864 (#5781) -- P0 red on a publication, not a PR change"

five_whys:
  symptom: "Every PR in the merge queue went red when RUSTSEC-2026-0378/0379 were published against wasmtime 48.0.6 already on main."
  why_1: "The security step fails on ANY advisory in the lock, not on advisories the PR adds."
  why_2: "The gate compares the lock to the advisory DB, never to main's lock, so a new DB entry and a new dependency look identical."
  why_3: "Two scanners (cargo deny, cargo audit) read different graphs (deny: all-features=false) and disagree; neither is the scanner of record, so the queue's red came from whichever saw it last."
  why_4: "Nothing routes a main-resident advisory to a fix ticket with a clock; the only response available is to stop merging."
  why_5: "Gate design treated 'the tree is clean' and 'this PR is safe to merge' as one question."
  root_cause: "The merge decision is coupled to the global advisory state of main instead of the delta of the PR."

equations:
  pr_gate_verdict:
    formula: "fail(PR) iff A(lock_PR, db) \\ A(lock_main, db) != {} ; A(lock, db) = findings keyed code|id|crate@version (yanked included) in db that hit a crate@version in lock, minus ignored ids"
    domain: "lock_PR at head, lock_main at the PR merge base (merge_group base_sha), scanned from a base-commit worktree with the BASE deny.toml and scripts; db is ONE pinned snapshot for both sides"
    codomain: "pass | fail"
    invariants:
      - "Both sides use the same advisory-db snapshot (otherwise a DB refresh between the runs reads as a PR-introduced advisory)"
      - "A PR that does not touch Cargo.lock has an empty delta and passes"
      - "A PR that removes an advisory-hit crate passes"
  main_resident_advisory:
    formula: "A(lock_main, db) != {} => andon raised AND P0 ticket with due <= 4h AND PR gate unaffected"
    domain: "scheduled or push-to-main scan only (never the PR path: C324 rule 6, read-only token, GH-1); due is a label plus created_at"
    codomain: "ticket id + due time, or none"
    invariants:
      - "The andon fires within one scan period of the DB publishing the advisory"
      - "The ticket carries advisory ids, affected crate@version, and the clock start"
      - "A main-resident advisory never turns the PR gate or the merge queue red"
  one_scanner_of_record:
    formula: "exactly one scanner decides A(); the other is retired or run as a LAB cross-check that cannot block"
    domain: "cargo deny check advisories, cargo audit"
    codomain: "the scanner name recorded in deny.toml / the gate script header"
    invariants:
      - "The scanner of record sees the whole Cargo.lock (all features), proven on the 48.0.6 lock as the positive control"
      - "Exemptions live in one file"
      - "Findings are keyed code|advisory-id|crate@version over every graph, so a new crate under an id main already carries, and a yanked crate with no id, are both PR-introduced"
      - "Both sides are scanned with the BASE deny.toml; a PR that adds an advisories ignore id fails (ignores-added), so a PR cannot hide its own finding"
      - "deny.toml advisories ignores are id-wide: cargo-deny has no per-crate ignore. They stay bounded, not scoped: ignores-added fails any PR that adds one, and check_deny_exemptions_live.sh (now --all-features, same as the gate) fails a dead one. Per-crate scoping needs an upstream cargo-deny feature and is out of this PR"
      - "The base is pinned: merge_group uses merge_group.base_sha, pull_request uses pull_request.base.sha, anything else (or a non-sha) is COULD-NOT-CHECK rc 75, never a pass"

proof_obligations:
  - id: ADG-INV-001
    type: invariant
    property: "A PR that adds no advisory passes while main holds one"
    formal: "∀ pr: A(lock_PR) = A(lock_main) ∧ A(lock_main) ≠ ∅ ⇒ verdict = pass"
    applies_to: pr_gate_verdict
  - id: ADG-INV-002
    type: invariant
    property: "A PR that introduces an advisory fails"
    formal: "∀ pr: A(lock_PR) \\ A(lock_main) ≠ ∅ ⇒ verdict = fail"
    applies_to: pr_gate_verdict
  - id: ADG-INV-003
    type: invariant
    property: "A main-resident advisory raises an andon and a <=4h P0 ticket"
    formal: "∀ main: A(lock_main) ≠ ∅ ⇒ ticket(P0) ∧ due ≤ 4h"
    applies_to: main_resident_advisory
  - id: ADG-INV-004
    type: invariant
    property: "The scanner of record is blind to nothing the other scanner sees"
    formal: "∀ lock_48_0_6: A_record(lock) ∋ RUSTSEC-2026-0378 ∧ A_record(lock) ∋ RUSTSEC-2026-0379"
    applies_to: one_scanner_of_record

falsification_tests:
  - id: FALSIFY-ADG-001
    rule: "Main-resident advisory does not block a PR"
    prediction: "with lock_PR == lock_main (wasmtime 48.0.6) and a DB holding 0378/0379, the PR verdict is pass and a main-advisory andon row is emitted"
    test: "planted-fixture case table of the diff gate script scripts/ci/advisory_diff.sh --self-test, 12 cases: same lock both sides"
    if_fails: "the gate still compares lock to DB, not PR to main"
    mutation: "compare lock_PR to the empty set; the case must turn RED"
  - id: FALSIFY-ADG-002
    rule: "A PR-introduced advisory blocks"
    prediction: "with lock_main = 48.0.7 and lock_PR = 48.0.6, the verdict is fail naming 0378 and 0379"
    test: "same case table: lock_PR adds the vulnerable version"
    if_fails: "the gate cannot turn RED on a real regression (a gate that cannot fail)"
    mutation: "in scripts/ci/advisory_diff.sh verdict() subtract the PR keys from themselves instead of main keys (comm -23 PR PR); self-test cases (incl. an error finding with graphs:[] must still block; a mutant yielding no key for it turns RED) PR adds a new id, PR adds a crate under an id main has, and PR adds a yanked crate must turn RED (measured 2026-10-20)"
  - id: FALSIFY-ADG-003
    rule: "Scanner of record sees the optional-feature crate"
    prediction: "on the 48.0.6 lock the scanner of record exits non-zero and names 0378 and 0379"
    test: "scripts/ci/advisory_gate_selftest.sh runs advisory_gate.sh against a stub cargo; every advisories scan must carry --all-features (the 48.0.6 lock fixture is covered by ADG-001 verdicts)"
    if_fails: "#5791 is not resolved: the record scanner is as blind as deny with all-features=false"
    mutation: "sed out --all-features from advisory_gate.sh scan(); the 'ADG-003' mutant case in advisory_gate_selftest.sh must turn RED (measured 2026-10-20)"
  - id: FALSIFY-ADG-004
    rule: "Same DB snapshot on both sides"
    prediction: "a DB entry published between the main run and the PR run does not appear in the delta"
    test: "advisory_gate_selftest.sh: exactly one `cargo deny fetch`, both scans --disable-fetch with one --config"
    if_fails: "DB refreshes read as PR-introduced advisories and re-create the stop"
    mutation: "sed out --disable-fetch, or add a second fetch before the base scan; the two 'ADG-004' mutant cases must turn RED (measured 2026-10-20)"
  - id: FALSIFY-ADG-005
    rule: "Andon clock"
    prediction: "the P0 ticket's due time is <= 4 h after the advisory first appears on main"
    test: "case table over the ticket emitter"
    if_fails: "main-resident advisories sit unowned"
    mutation: "set the due time to 8 h; the case must turn RED"
  - id: FALSIFY-ADG-007
    rule: "No second scanner blocks a PR on main's advisories"
    prediction: "sov.lint and sov.security skip plain cargo deny advisories / cargo audit (advisories_diff_only: true in the vendored sovereign-ci)"
    test: "scripts/ci/check_sov_advisories_off.sh --self-test, 4 cases, then the real tree"
    if_fails: "the vendored scans still stop every PR on an advisory already on main (the #5793 REJECT)"
    mutation: "set advisories_diff_only: false in ci/sections.yml, or change the vendored '= true' test; the matching case must turn RED (measured 2026-10-20)"

  - id: FALSIFY-ADG-008
    rule: "The CI step fails closed on the gate's exit status"
    prediction: "the 'Advisories must pass' step of ci.yml exits with the gate's (or any earlier self-test's) non-zero status; a step without the gate line does not"
    test: "scripts/ci/advisory_step_selftest.sh, 4 cases + 1 mutant: the step's run block is extracted from ci.yml and run against stub scripts on a throwaway origin/main; gate rc 75 gives 75, gate rc 1 gives 1, a failing self-test gives its rc, all green gives 0"
    if_fails: "a red or could-not-check gate leaves the step green and a PR merges on an unjudged advisory"
    mutation: "delete the advisory_gate.sh invocation from the step; the mutant case must stay green on a failing gate, which the cases above forbid (measured 2026-10-20)"

qa_gate:
  id: F-ADG-001
  name: Advisory gate diff contract
  description: "PR delta gate, main andon, one scanner of record"
  checks:
    - pr_gate_verdict
    - main_resident_advisory
    - one_scanner_of_record
  pass_criteria: "All 7 falsification tests pass; the scanner script has a must-fail/must-pass case table"
  falsification: "Revert the gate to lock-vs-DB; FALSIFY-ADG-001 must turn RED"
