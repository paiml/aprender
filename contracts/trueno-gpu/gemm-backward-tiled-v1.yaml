metadata:
  version: 1.0.0
  created: '2026-03-02'
  author: PAIML Engineering
  description: Performance obligations for tiled backward GEMM kernels
  references:
  - Volkov & Demmel (2008) Benchmarking GPUs to tune dense linear algebra
  - 'NVIDIA CUDA C Programming Guide: Shared Memory, Matrix Multiply'
  - 'Kerr et al. (2017) CUTLASS: Fast Linear Algebra in CUDA C++'
  - trueno-gpu forward tiled_unrolled WAPR-PERF-009 (measured 70x over naive)
  depends_on:
  - lora-algebra-v1
equations:
  tiled_gemm_arithmetic_intensity:
    formula: AI = (2 * TILE^2 * K) / (2 * TILE * K * sizeof(f32)) = TILE / sizeof(f32)
    domain: TILE in {16, 32}, K in Z+
    codomain: AI in R+, AI >= 4.0 FLOP/byte for TILE=16, AI >= 8.0 for TILE=32
    invariants:
    - Tiled GEMM AI scales linearly with tile size
    - Naive GEMM AI = 2*K / (K + N) * 1/sizeof(f32) ~ 0.5 for large N
    - 'RTX 4090: compute/bandwidth ridge point at ~100 FLOP/byte (fp32)'
    - TILE=32 achieves 8.0 FLOP/byte — 2.5x over naive minimum
    preconditions:
    - a.len() > 0
    - b.len() > 0
    lean_theorem: Theorems.Tiled_Gemm_Arithmetic_Intensity
  shared_memory_per_tile:
    formula: smem = 2 * TILE^2 * sizeof(f32)
    domain: TILE in {16, 32}
    codomain: smem = 2048 bytes for TILE=16, smem = 8192 bytes for TILE=32
    invariants:
    - 'RTX 4090 (sm_89): 100KB shared memory per SM'
    - 'TILE=32: 8KB << 100KB, allows 12 concurrent blocks per SM'
    - 'Two tiles loaded per iteration: A_tile[TILE,TILE] and B_tile[TILE,TILE]'
    preconditions:
    - a.len() > 0
    - b.len() > 0
    lean_theorem: Theorems.Shared_Memory_Per_Tile
  backward_a_gemm:
    formula: grad_A[M,K] = grad_C[M,N] @ B^T[N,K]
    domain: grad_C in R^{M,N}, B in R^{K,N}
    codomain: grad_A in R^{M,K}
    invariants:
    - 'B^T access: B is stored row-major [K,N], transposed read is B[j,i] for column i'
    - 'Tiled: load B_tile as transposed tile from global memory'
    - FLOPs = 2 * M * K * N (same as forward)
    preconditions:
    - a.len() > 0
    - b.len() > 0
    lean_theorem: Theorems.Backward_A_Gemm
  backward_b_gemm:
    formula: grad_B[K,N] = A^T[K,M] @ grad_C[M,N]
    domain: A in R^{M,K}, grad_C in R^{M,N}
    codomain: grad_B in R^{K,N}
    invariants:
    - 'A^T access: A stored row-major [M,K], transposed read is A[i,j] for row j'
    - 'Tiled: load A_tile as transposed tile from global memory'
    - FLOPs = 2 * K * N * M (same as forward)
    preconditions:
    - a.len() > 0
    - b.len() > 0
    lean_theorem: Theorems.Backward_B_Gemm
  unrolled_instruction_ratio:
    formula: IPC_ratio = (FMA_count) / (FMA_count + branch + cmp + inc) = 4 / (4 + 3) = 0.57
    domain: unroll_factor = 4
    codomain: IPC_ratio >= 0.57
    invariants:
    - 'Without unrolling: 1 / (1 + 3) = 0.25 (75% overhead)'
    - 'With 4x unroll: 4 / (4 + 3) = 0.57 (43% overhead)'
    - WAPR-PERF-009 measured 12:1 -> ~3:1 instruction ratio
    preconditions:
    - a.len() > 0
    - b.len() > 0
    lean_theorem: Theorems.Unrolled_Instruction_Ratio
contracts:
  C-TILE-BWD-001:
    name: Backward GEMM A uses shared memory tiling
    precondition: M >= 1, N >= 1, K >= 1, tile_size in {16, 32}
    postcondition: emitted PTX contains .shared allocation >= 2 * tile_size^2 * 4 bytes
    invariant: Shared memory eliminates redundant global loads within each tile
    proof_obligation: 'Static analysis of emitted PTX: grep ''.shared .align'''
    falsification_test: 'let kernel = GemmBackwardAKernel::tiled(128, 2560, 2560, 32);

      let ptx = kernel.emit_ptx();

      assert!(ptx.contains(".shared"), "C-TILE-BWD-001: must use shared memory");

      // 2 tiles * 32*32 * 4 = 8192 bytes minimum

      assert!(!ptx.contains("gemm_backward_a_naive"), "C-TILE-BWD-001: must not be naive");

      '
  C-TILE-BWD-002:
    name: Backward GEMM B uses shared memory tiling
    precondition: M >= 1, N >= 1, K >= 1, tile_size in {16, 32}
    postcondition: emitted PTX contains .shared allocation >= 2 * tile_size^2 * 4 bytes
    invariant: Shared memory eliminates redundant global loads within each tile
    proof_obligation: Static analysis of emitted PTX
    falsification_test: 'let kernel = GemmBackwardBKernel::tiled(128, 2560, 2560, 32);

      let ptx = kernel.emit_ptx();

      assert!(ptx.contains(".shared"), "C-TILE-BWD-002: must use shared memory");

      '
  C-TILE-BWD-003:
    name: Tiled backward GEMM A matches naive within 1e-4
    precondition: Random matrices A[M,N], B[K,N] with elements in [-1, 1]
    postcondition: '|tiled_result[i,j] - naive_result[i,j]| < 1e-4 for all i,j'
    invariant: Tiling is a performance optimization that must not change numerical results
    proof_obligation: 'GPU execution test: run both variants, compare elementwise'
    falsification_test: '// M=128, N=2560, K=2560 (Qwen3-4B Q projection backward)

      let naive = GemmBackwardAKernel::naive(128, 2560, 2560);

      let tiled = GemmBackwardAKernel::tiled(128, 2560, 2560, 32);

      // Launch both on same input, compare outputs

      assert_max_diff(naive_output, tiled_output, 1e-4);

      '
  C-TILE-BWD-004:
    name: Tiled backward GEMM B matches naive within 1e-4
    precondition: Random matrices A[M,K], grad_C[M,N] with elements in [-1, 1]
    postcondition: '|tiled_result[i,j] - naive_result[i,j]| < 1e-4 for all i,j'
    invariant: Tiling is a performance optimization that must not change numerical results
    proof_obligation: 'GPU execution test: run both variants, compare elementwise'
    falsification_test: 'let naive = GemmBackwardBKernel::naive(128, 2560, 2560);

      let tiled = GemmBackwardBKernel::tiled(128, 2560, 2560, 32);

      assert_max_diff(naive_output, tiled_output, 1e-4);

      '
  C-TILE-BWD-005:
    name: Tiled backward uses FMA instructions
    precondition: Kernel built with tiled or tiled_unrolled variant
    postcondition: emitted PTX contains fma.rn.f32 instructions
    invariant: FMA reduces instruction count by fusing multiply+add
    proof_obligation: 'Static PTX analysis: grep ''fma.rn.f32'''
    falsification_test: 'let kernel = GemmBackwardAKernel::tiled_unrolled(128, 2560, 2560, 32);

      let ptx = kernel.emit_ptx();

      assert!(ptx.contains("fma.rn.f32"), "C-TILE-BWD-005: must use FMA");

      '
  C-TILE-BWD-006:
    name: Barrier safety for tiled backward GEMM
    precondition: Kernel uses bar.sync for shared memory synchronization
    postcondition: All threads in a CTA reach every bar.sync unconditionally
    invariant: Divergent barrier = undefined behavior / deadlock
    proof_obligation: trueno-gpu analyze_barrier_safety() returns is_safe=true
    falsification_test: 'let kernel = GemmBackwardAKernel::tiled(128, 2560, 2560, 32);

      let result = kernel.analyze_barrier_safety();

      assert!(result.is_safe, "C-TILE-BWD-006: barrier safety violated");

      '
  C-TILE-BWD-007:
    name: Default backward dispatch uses tiled variant
    precondition: entrenar calls gemm_backward_a() or gemm_backward_b()
    postcondition: Dispatched kernel name does not contain 'naive'
    invariant: Production training must never use naive backward GEMM
    proof_obligation: 'Code review: gemm_backward_a/b construct tiled kernel'
    falsification_test: '// In entrenar/src/autograd/cuda_backward/gemm.rs:

      // Verify GemmBackwardAKernel::tiled() is used, not ::new()

      '
# The four checks below lived under a top-level `qa_gates:` (plural) block that
# the schema has no field for, so serde dropped every one of them and no pv gate
# ever saw them. SCHEMA-019 now rejects that spelling; the checks are folded into
# the real `qa_gate:` below, with the command each one runs kept alongside.
#   ptx_static_analysis  cargo test -p trueno-gpu -- backward_gemm_tiled
#                        expect: all tiled backward GEMM tests pass
#   numerical_parity     cargo test -p trueno-gpu --features cuda-test -- backward_gemm_parity
#                        expect: max elementwise diff < 1e-4
#   barrier_safety       cargo test -p trueno-gpu -- backward_gemm_barrier
#                        expect: analyze_barrier_safety().is_safe == true
#   entrenar_dispatch    cargo test -p entrenar -- backward_gemm_dispatch
#                        expect: kernel names do not contain 'naive'
qa_gate:
  id: F-GBTV-001
  name: gemm-backward-tiled-v1 Contract
  description: Quality gate for Performance obligations for tiled backward GEMM kernels
  checks:
  - validation
  - falsification
  - ptx_static_analysis
  - numerical_parity
  - barrier_safety
  - entrenar_dispatch
