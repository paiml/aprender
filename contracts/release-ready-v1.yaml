# ─────────────────────────────────────────────────────────────────────────────
# release-ready-v1
#
# ONE LIST IN CODE of what is required to merge, to tag and to publish (bar B4;
# BLD-001 row 4; ticket #4688).
#
# WHY. The requirements of a release were stated in five places that nobody
# compared: ci.yml's `gate` job, CLAUDE.md's required checks, autopilot.sh's
# steps, check_publish_preflight.sh's rules and cascade-publish.sh's refusals.
# Two of them disagreed on origin/main 316dee2cd4: the preflight header said
# the R8 wrapper's committed mode "is `report`" while the wrapper has been
# `enforce` since the operator ruling of 2026-09-28 (#3715 B1), and
# autopilot.sh's header listed its steps without `readiness`.
#
# THE LIST is the `requirements:` block below: one flow map per line, with id,
# applies_to (a subset of merge, tag, publish), anchor (what a surface states),
# checker (path[#needle] that implements it), provenance (a ticket, a spec
# section, or "operator ruling YYYY-MM-DD") and, for every publish requirement,
# producer (the nightly_train.sh lane that proves it each night, BLD-001 row
# 10; "-" never satisfies it).
#
# THE CHECKER is scripts/release/release_ready.sh (bash + awk, no Python). It
# extracts every requirement the six surfaces state, and FAILS on:
#   UNLISTED       a surface states a requirement the list lacks
#   ORPHANED       a list entry whose checker is absent or lacks its needle, or
#                  whose anchor no surface states any more
#   CONTRADICTION  one key (a mode, a floor, a step list) with two values
# A read-only probe (--probe) compares the merge set with GitHub's required
# status checks in two reads (the ruleset and the classic branch protection);
# changing the required checks is the operator's.
#
# BEFORE / AFTER (command: `bash scripts/release/release_ready.sh`):
#   origin/main 316dee2cd4, no list: unlisted=45 orphaned=0 contradictions=2
#   HEAD of this change:             unlisted=0  orphaned=0 contradictions=0
#   after merging main c7569afd3d:   unlisted=4  (main added mg-reuse, mg-reuse-self-test,
#     x86-main-advisories, tag_coverage_gate.sh); RR-M13..M15 + RR-T15 -> unlisted=0
#   C129 review: --probe read only the ruleset (github=[gate,workspace-test]) while classic
#     protection requires ci / gate; now it reads both and the list carries gate (RR-M16)
#   C314 round (w4664): the publish path had two executors and the list read one. Now
#     publish_strict.sh (the spec's T-4 executor) is a surface: 15 refusals, RR-P20..P34;
#     cascade-publish's top-level `if [ … ]` refusals are read: RR-P35..P36; and the executor
#     is a claim. HEAD: unlisted=0 orphaned=0 contradictions=1, the one being publish.executor:
#     autopilot's `cascade` step runs cascade-drain.sh, the spec's T-4 row names publish_strict.sh.
#   #4690 (no public release before its gates): the asset build is dispatched in `tag`
#     (RR-T17), the assets are re-verified in `publish` (RR-P37), and the publish dry run
#     moved ahead of the tag (RR-P07 -> RR-T16). HEAD: unlisted=0 orphaned=0 contradictions=1,
#     the same publish.executor claim origin/main 682dab1e22 carries.
#
# REPORT-ONLY TODAY. No gate calls the checker. It becomes blocking only as a
# ratchet after three green nights (L31), and only by an operator sign-off.
# ─────────────────────────────────────────────────────────────────────────────
name: release-ready
version: "1.0.0"
scope: >
  The requirements to merge, tag and publish that the repository states in
  .github/workflows/ci.yml (job `gate`), CLAUDE.md ("Required status checks"),
  scripts/release/autopilot.sh (steps wait..dryrun and the top-level lines
  between them), scripts/check_publish_preflight.sh (RULES R1..R8),
  scripts/cascade-publish.sh (`if !` refusals, and top-level `if [ … ]`
  blocks before its upload loop that exit 1..9) and
  scripts/release/publish_strict.sh (the `die` refusals before its first
  `cargo publish`; the T-4 executor of APR-RELEASE-001); plus the facts two of
  those places can disagree on (R8 mode, autopilot's step list, the coverage
  floor, and the publish executor: autopilot's `cascade` step vs the spec's
  T-4 row). Both executors are read, so a gate either one drops is seen.
  Out of scope: requirements stated outside the repository; the CONTENT of
  each checker (each has its own contract); and a verdict that runs after an
  upload (a final verification, autopilot's `cascade incomplete`), which is an
  outcome of publishing, not a requirement to start it.
status: active

metadata:
  kind: pattern     # a cross-file inventory guard over scripts and workflow
                    # YAML, not a math kernel. Explicit so `pv validate`'s
                    # `kernel` default never silently applies.
  version: "1.0.0"
  created: '2026-10-04'
  last_modified: '2026-10-06'
  author: PAIML Engineering
  references:
    - 'scripts/release/release_ready.sh — the checker (extractors, verdict, probe, case table, mutants)'
    - 'BLD-001 spec, row 4 (E4) — mechanism, falsifiers, first green'
    - 'issue #4688 — R9, bar B4'
  description: >
    One list in code of what merge, tag and publish require. Every requirement a
    surface states is on the list, every list entry has a checker that exists,
    and no fact has two values.

equations:
  rr_listed_equals_stated:
    formula: |
      let S = anchors stated by the six surfaces (release_ready.sh --found)
      let A = { e.anchor : e in requirements }
      UNLISTED = S \ A,  ORPHANED_STALE = A \ S
      |UNLISTED| = 0  and  |ORPHANED_STALE| = 0
    domain: 'the tree the checker runs on (HEAD or origin/main, printed as tree=)'
    codomain: 'bool'
    invariants:
      - 'a surface that cannot be read is not_measured (exit 2), never zero findings'
  rr_every_checker_exists:
    formula: |
      for every e in requirements: file(e.checker) exists and contains needle(e.checker)
    domain: 'requirements'
    codomain: 'bool'
    invariants:
      - 'a publish requirement names a nightly producer, or the list is malformed (exit 3)'
  rr_no_contradiction:
    formula: |
      for every key k over claims ∪ { (e.key, e.value) : e in requirements }:
        |{ v : (k, v) }| = 1
    domain: 'claims extracted from the surfaces plus key/value pairs the list states'
    codomain: 'bool'

proof_obligations:
  - id: RR-OB-001
    statement: "A requirement stated by a surface and absent from the list turns the checker RED (UNLISTED)."
    discharged_by: falsification_tests[0]
  - id: RR-OB-002
    statement: "A list entry whose checker is deleted, or whose anchor no surface states, turns the checker RED (ORPHANED)."
    discharged_by: falsification_tests[1]
  - id: RR-OB-003
    statement: "Two entries or two surfaces giving one key different values turn the checker RED (CONTRADICTION)."
    discharged_by: falsification_tests[2]
  - id: RR-OB-004
    statement: "A missing or unreadable surface is not_measured (exit 2), never a pass; a publish entry without a producer is malformed (exit 3)."
    discharged_by: falsification_tests[3]
  - id: RR-OB-005
    statement: "Each falsifier's check, once dropped from the checker, leaves the case table RED (mutants killed/total = total/total)."
    discharged_by: falsification_tests[4]

falsification_tests:
  - id: RR-F-001
    rule: plant a requirement in a script that the list lacks → red
    prediction: >-
      A fixture tree whose autopilot step gains `bash scripts/new_gate.sh`
      (and one whose preflight gains rule R9, one whose ci.yml gate gains a
      needs: job) exits 1 naming UNLISTED.
    test: 'bash scripts/release/release_ready.sh --selftest'
    if_fails: 'a new gate could ship that no one lists, and the list would read complete'
    mutation: 'drop the UNLISTED loop of the verdict; the case table must turn RED'
  - id: RR-F-002
    rule: delete a listed checker → red
    prediction: >-
      A fixture tree whose listed checker file is deleted exits 1 naming
      ORPHANED; so does one whose needle is gone, and one whose anchor is gone.
    test: 'bash scripts/release/release_ready.sh --selftest'
    if_fails: 'the list could name gates that no longer run'
    mutation: 'drop the checker-exists check of the verdict; the case table must turn RED'
  - id: RR-F-003
    rule: plant two entries with conflicting thresholds → red
    prediction: >-
      Two list entries with key coverage.floor and values 89 and 90 exit 1
      naming CONTRADICTION; so does a preflight header that says the R8 mode
      is `report` while release_readiness.sh says enforce.
    test: 'bash scripts/release/release_ready.sh --selftest'
    if_fails: 'two places could state different bars and both read as the truth'
    mutation: 'drop the CONTRADICTION loop of the verdict; the case table must turn RED'
  - id: RR-F-004
    rule: an unreadable surface or malformed list never passes
    prediction: >-
      A fixture tree without autopilot.sh exits 2; a list whose publish entry
      has no producer exits 3.
    test: 'bash scripts/release/release_ready.sh --selftest'
    if_fails: 'a moved file would read as zero findings'
    mutation: 'make the not_measured path return 0; the case table must turn RED'
  - id: RR-F-005
    rule: every falsifier has a killing mutant
    prediction: 'bash scripts/release/release_ready.sh --mutants prints killed=N total=N and exits 0'
    test: 'bash scripts/release/release_ready.sh --mutants'
    if_fails: 'a check of the checker could be deleted with the case table still green'

non_goals:
  - "Running any checker. The list says what is required and where it is checked; each checker proves itself."
  - "Changing GitHub's required status checks or rulesets. The probe reads them; the operator changes them."
  - "Blocking any merge, tag or publish today. Wiring is a proposal (three green nights first, L31)."
  - "Resolving producer names. Each publish entry must name a producer (checked non-empty); the names are lanes of the nightly release train, which is not on main yet. Resolving them against that lane table is follow-up work, not done here."
  - "Known extractor limits (a requirement written in these forms is not seen, so it cannot be flagged unlisted): a checker invoked across a backslash line continuation; a cascade refusal not written as `if ! <fn|bash script>` nor as a top-level `if [ … ]` block before the upload loop; a publish_strict.sh refusal that is not a `die` (a bare `exit`); a needle that survives only in a comment still counts as present; a function name inside an echo string counts as a call."

binding_registry:
  checker: scripts/release/release_ready.sh
  selftest: 'bash scripts/release/release_ready.sh --selftest'
  issue: "https://github.com/paiml/aprender/issues/4688"

