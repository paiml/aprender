contract: serve-parity-gate
metadata:
  kind: pattern
  version: "1.0.0"
  description: >
    RELEASE GATE (aprender#4218, operator: "make the scoreboard a release gate",
    "use gx10 runner lane"). `apr serve` is measured against the PINNED llama.cpp
    `llama-server` (scripts/llama_pin.toml build_commit, resolved by
    scripts/llama_bin.sh) on the SAME Qwen3.5 GGUF, on the same host, in the same
    run, for every model in `gate.models`. The verdict is the ratio against the
    comparator measured IN THAT RUN, never against a remembered number. The
    comparator absorbs the host and the day, and the ratio isolates apr.

    Three verdicts and no fourth:
      PASS   every model passed its correctness precondition, and its band c=1
             decode ratio point is at or above baseline x (1 - tolerance), and
             the positive control on the same harness went RED.
      RED    blocks the tag. The causes are: any wrong output, a ratio under the
             ratchet, a model with no committed baseline, a GGUF whose sha is not
             the one pinned here, a comparator that is not the pinned build, an
             unrecorded memory field, or a control that did not go RED (a harness
             blind to a slowdown proves nothing).
      NO-GO  the HOST could not be measured: the GPU lock was busy, a foreign
             process was on the device, or free disk was under the floor.
             NO-GO blocks too, and it is never recorded as a PASS. It is kept
             apart from RED because re-running on a quiet host is the remedy,
             not a code change.

    The RATCHET blocks, and PARITY is published. `parity_target` is where apr
    wants to be (ratio 1.0). Reaching it or missing it is reported in the
    receipt and never changes the verdict. The ratchet is what stops a release
    from being slower against llama.cpp than the last one was, on this silicon.

    The baseline is per HOST CLASS (gx10 = GB10, aarch64, sm_121). The sm_89
    no-collapse floor in contracts/beat-ollama-decode-throughput-speed-v1.yaml
    does NOT transfer (aprender#2835). No baseline is invented. The first
    committed baseline is promoted from a real PASS whose own positive control
    went RED on the same harness (`serve_parity_gate.py promote`). Until that
    exists, the gate is RED ("no committed baseline"), which is honest: the
    release has no evidence yet.
  references:
  - "scripts/lib/serve_parity_gate.py (verdict, promote, release receipt check, selftest)"
  - "scripts/check_serve_parity_receipt.sh (the release decision surfaces call this)"
  - "scripts/llama_pin.toml (comparator pin: build_commit, pin_expiry)"
  - "scripts/lib/perf_receipt.py (the v3 band ratios this gate reads: bands[c=1].ratios.dec)"
  - "crates/aprender-serve/examples/qwen35_parity.rs (teacher-forced correctness record, tau)"
  - "contracts/beat-ollama-decode-throughput-speed-v1.yaml (why the sm_89 floor does not transfer)"
version: 1
status: enforced
date: 2026-09-24

# The only numbers serve_parity_gate.py uses. The script reads them from this
# block and has no defaults of its own, so a parameter missing here is a refusal,
# not a silent fallback.
gate:
  host_class: gx10
  band_concurrency: 1
  metric: ratios.dec          # paired-percentile-bootstrap decode ratio, apr / llama-server
  tolerance: 0.10             # RED when point < baseline_point * (1 - 0.10).
  tolerance_basis: >
    PROVISIONAL. It was chosen, not measured, because no gx10 serve-parity series
    exists yet. Re-derive it from the spread of the first five committed gx10 PASS
    runs, and set it to at least twice the largest run-to-run drop of the point.
    Change it only here, in a reviewed diff.
  parity_target: 1.00         # published, never blocking
  disk_floor_gb: 40           # free GB at readlink -f of disk_path; under it = NO-GO
  disk_path: /mnt/nvme-raid0  # a symlink on gx10 (the root disk); resolved, never trusted
  correctness:
    tau: 0.25                 # a teacher-forced disagreement is excused only when the oracle's own gap < tau
    min_teacher_forced_steps: 16
    template: official        # the prompt comes from the model's own chat template, never from apr's output
  baseline_file: evidence/serve-parity/gx10/baseline.json
  receipt_dir: evidence/serve-parity/gx10
  vllm_row_status: [measured, unsupported]   # informational only; never read by the verdict
  models:
    - size: 0.8B
      repo: unsloth/Qwen3.5-0.8B-GGUF
      revision: 6ab461498e2023f6e3c1baea90a8f0fe38ab64d0
      file: Qwen3.5-0.8B-Q4_K_M.gguf
      sha256: bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517
    - size: 2B
      repo: unsloth/Qwen3.5-2B-GGUF
      revision: f6d5376be1edb4d416d56da11e5397a961aca8ae
      file: Qwen3.5-2B-Q4_K_M.gguf
      sha256: aaf42c8b7c3cab2bf3d69c355048d4a0ee9973d48f16c731c0520ee914699223
    - size: 4B
      repo: unsloth/Qwen3.5-4B-GGUF
      revision: e87f176479d0855a907a41277aca2f8ee7a09523
      file: Qwen3.5-4B-Q4_K_M.gguf
      sha256: 00fe7986ff5f6b463e62455821146049db6f9313603938a70800d1fb69ef11a4
