proof_obligations:
  - id: SPG-INV-001
    type: invariant
    property: >
      OBLIG-SPG-RATCHET: for every gated model m, verdict(run) = PASS implies
      point(run, m) >= baseline_point(m) * (1 - tolerance), with tolerance read
      from gate.tolerance. A model with no baseline entry is RED.
  - id: SPG-INV-002
    type: invariant
    property: >
      OBLIG-SPG-CORRECTNESS-PRECONDITION: verdict(run) = PASS implies that, for every
      model and every prompt, the prompt ids equal the oracle's ids on the official
      template, teacher_forced_steps >= min_teacher_forced_steps, and every
      disagreement has gap < tau. The gate recomputes this from the disagreements.
      A record's own `pass` field is never read.
  - id: SPG-INV-003
    type: invariant
    property: >
      OBLIG-SPG-POSITIVE-CONTROL: verdict(run) = PASS implies that the run carries a
      control record, made on the same harness sha, whose verdict under this same
      function is RED on its ratio.
  - id: SPG-INV-004
    type: invariant
    property: >
      OBLIG-SPG-NO-GO-IS-NOT-PASS: a run whose preflight records a busy GPU lock, a
      non-empty foreign compute-app list, or free disk under disk_floor_gb has
      verdict NO-GO. That holds whatever its ratios are.
  - id: SPG-INV-005
    type: invariant
    property: >
      OBLIG-SPG-RELEASE-BINDING: check-release(tag_sha, asset_sha256) exits 0 only
      when all of these hold:
      - a receipt exists for tag_sha;
      - its green_sha equals tag_sha;
      - its verdict is PASS;
      - its bin_sha256 equals the release asset's sha256.
      A missing verdict is a refusal. It is never read as a pass.

falsification_tests:
  - id: FALSIFY-SPG-001
    name: serve_parity_gate_selftest
    prediction: "each obligation has a mutant that flips its row. For example: the ratchet disabled makes a slowed run PASS, the correctness check that reads `pass` accepts a scrambled output, and the release check ignoring the binary sha accepts a foreign binary. The selftest reports every row as caught."
    test_harness: "python3 scripts/lib/serve_parity_gate.py selftest"
    expected_output: "PASS"
    if_fails: "a release gate that cannot tell a slowed or wrong apr serve from a good one; the tag ships on a green that measured nothing."
  - id: FALSIFY-SPG-002
    name: serve_parity_release_receipt_case_table
    prediction: "the release check refuses the missing, sha-not-commit, verdict-FAIL, verdict-absent and binary-sha-mismatch receipts, and accepts only the PASS receipt that is bound to the tag and to the asset"
    test_harness: "bash scripts/check_serve_parity_receipt.sh --selftest"
    expected_output: "PASS"
    if_fails: "a tag can be cut on a receipt for another commit, another binary, or a failed run."
