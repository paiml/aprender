# ─────────────────────────────────────────────────────────────────────────────
# Abstract
# ─────────────────────────────────────────────────────────────────────────────
abstract: |
  The §6 Compound Ship Gates are the publish-time invariants that cross-cut
  every per-AC row in §4.2 (MODEL-1) and §4.4 (MODEL-2). Each compound gate
  is binary; any failure blocks publish. This contract's job is to prove
  that the *decision rule* of each gate cannot be silently weakened without
  a contract bump and a Rust-test-fail signal.

  The 6 gates decompose into 4 distinct shapes:

    1. Aggregate-AND over N per-AC booleans (001 over 10, 002 over 12).
    2. Byte-identity across two slices (003 — Golden Output regression).
    3. Bitwise-identical determinism (004 — two seed=0 HumanEval runs).
    4. Byte-equal string + well-formedness (005 — license metadata).
    5. Symmetric absolute-threshold float gate (006 — first-token delta).

  Shapes (1) + (2) + (4) are `const fn`-representable. Shapes (3) and (5)
  require `is_finite()` checks that are not const-eval-friendly in stable
  Rust today but are still pure. All 6 carry 6–7 section mutation surveys.

  Full discharge (the live compute-heavy aggregate harness) is out of scope
  for this v1.0.0 release and is deferred to the SHIP-TWO-001 post-MODEL-2
  evidence lane.

equations:
  gate_ship_001_aggregate_and:
    formula: |
      verdict_001(ac_passes): [bool; 10] -> {Pass, Fail}
        Pass iff len(ac_passes) == 10 AND for all i: ac_passes[i] == true
        Fail otherwise
  gate_ship_002_aggregate_and:
    formula: |
      verdict_002(ac_passes): [bool; 12] -> {Pass, Fail}
        Pass iff len(ac_passes) == 12 AND for all i: ac_passes[i] == true
        Fail otherwise
  gate_ship_003_byte_identity:
    formula: |
      verdict_003(pre, post): &[u8] x &[u8] -> {Pass, Fail}
        Pass iff non-empty(pre) AND non-empty(post) AND pre == post
        Fail otherwise (conservative on empty)
  gate_ship_004_bitwise_determinism:
    formula: |
      verdict_004(a, b): f32 x f32 -> {Pass, Fail}
        Pass iff is_finite(a) AND is_finite(b)
                 AND a in [0.0, 100.0] AND b in [0.0, 100.0]
                 AND a.to_bits() == b.to_bits()
        Fail otherwise
  gate_ship_005_license_byte_equal:
    formula: |
      verdict_005(model, upstream): &str x &str -> {Pass, Fail}
        Pass iff non-empty(model) AND non-empty(upstream)
                 AND ascii_printable(model) AND ascii_printable(upstream)
                 AND model == upstream
        Fail otherwise
  gate_ship_006_first_token_delta:
    formula: |
      verdict_006(p_apr, p_gguf, tol): f32^3 -> {Pass, Fail}
        Pass iff all finite AND p_apr,p_gguf in [0.0, 1.0] AND tol >= 0.0
                 AND |p_apr - p_gguf| <= tol
        Fail otherwise
  gate_ship_007_unwrap_zero_tolerance:
    formula: |
      verdict_007(count): u32 -> {Pass, Fail}
        Pass iff count == 0
        Fail otherwise (zero-tolerance; u32 precludes negatives)
  gate_ship_008_contract_density_threshold:
    formula: |
      verdict_008(contracted, total, min_density): u32 x u32 x f32 -> {Pass, Fail}
        Pass iff total > 0 AND is_finite(min_density)
                 AND min_density in [0.0, 1.0]
                 AND contracted <= total
                 AND (contracted / total) >= min_density
        Fail otherwise
  gate_ship_009_ci_aggregate_and:
    formula: |
      verdict_009(fmt_pass, clippy_pass, test_pass): bool^3 -> {Pass, Fail}
        Pass iff fmt_pass AND clippy_pass AND test_pass
        Fail otherwise (aggregate-AND over the 3 required CI checks)
  gate_ship_010_advisory_zero_tolerance:
    formula: |
      verdict_010(count): u32 -> {Pass, Fail}
        Pass iff count == 0
        Fail otherwise (zero-tolerance security audit)
  gate_ship_011_pmat_tdg_threshold:
    formula: |
      verdict_011(measured, threshold): f32 x f32 -> {Pass, Fail}
        Pass iff is_finite(measured) AND is_finite(threshold)
                 AND measured >= 0.0
                 AND threshold in (0.0, 100.0]
                 AND measured >= threshold
        Fail otherwise
  gate_ship_012_line_coverage_threshold:
    formula: |
      verdict_012(measured_pct, threshold_pct): f32 x f32 -> {Pass, Fail}
        Pass iff is_finite(measured_pct) AND is_finite(threshold_pct)
                 AND measured_pct in [0.0, 100.0]
                 AND threshold_pct in (0.0, 100.0]
                 AND measured_pct >= threshold_pct
        Fail otherwise

proof_obligations:
  - type: invariant
    property: GATE-SHIP-001 aggregate-AND shape
    formal: 'for all masks m != 0x3FF : verdict_001 yields Fail'
    applies_to: GATE-SHIP-001
  - type: invariant
    property: GATE-SHIP-002 aggregate-AND shape
    formal: 'for all masks m != 0xFFF : verdict_002 yields Fail'
    applies_to: GATE-SHIP-002
  - type: invariant
    property: GATE-SHIP-003 byte-identity + non-empty
    formal: 'verdict_003(pre, post) = Pass <=> pre == post AND pre != [] AND post != []'
    applies_to: GATE-SHIP-003
  - type: invariant
    property: GATE-SHIP-004 determinism strictly stricter than SHIP-023 drift
    formal: 'verdict_004(a, b) = Pass => (a - b).abs() = 0 (SHIP-023 tol allows 1.2 pp)'
    applies_to: GATE-SHIP-004
  - type: invariant
    property: GATE-SHIP-005 case-sensitive byte equality
    formal: 'verdict_005(x, y) = Pass => x.to_lowercase() == y.to_lowercase() BUT NOT converse'
    applies_to: GATE-SHIP-005
  - type: monotonicity
    property: GATE-SHIP-006 delta within tolerance
    formal: 'verdict_006(a, b, t) = Pass AND t1 >= t => verdict_006(a, b, t1) = Pass'
    applies_to: GATE-SHIP-006
  - type: invariant
    property: GATE-SHIP-007 zero-tolerance unwrap count
    formal: 'verdict_007(n) = Pass <=> n == 0'
    applies_to: GATE-SHIP-007
  - type: invariant
    property: GATE-SHIP-008 100% contract density on new code
    formal: 'verdict_008(c, t, 1.0) = Pass => c == t AND t > 0'
    applies_to: GATE-SHIP-008
  - type: invariant
    property: GATE-SHIP-009 CI aggregate-AND shape
    formal: 'for all masks m != 0b111 : verdict_009(m) yields Fail'
    applies_to: GATE-SHIP-009
  - type: invariant
    property: GATE-SHIP-010 zero-tolerance advisory count
    formal: 'verdict_010(n) = Pass <=> n == 0'
    applies_to: GATE-SHIP-010
  - type: monotonicity
    property: GATE-SHIP-011 inclusive-floor TDG threshold
    formal: 'verdict_011(m, t) = Pass AND m1 >= m AND m1 in [0.0, 100.0] => verdict_011(m1, t) = Pass'
    applies_to: GATE-SHIP-011
  - type: monotonicity
    property: GATE-SHIP-012 inclusive-floor line coverage threshold
    formal: 'verdict_012(m, t) = Pass AND m1 >= m AND m1 in [0.0, 100.0] => verdict_012(m1, t) = Pass'
    applies_to: GATE-SHIP-012

# ─────────────────────────────────────────────────────────────────────────────
# Falsification tests — 12 PARTIAL_ALGORITHM_LEVEL bindings
# ─────────────────────────────────────────────────────────────────────────────

falsification_tests:
  - id: FALSIFY-GATE-SHIP-001
    rule: >
      MODEL-1 teacher cannot ship unless all 10 AC-SHIP1-* (§4.2 rows
      AC-SHIP1-001 through AC-SHIP1-010) report Pass. Decision rule:
      aggregate-AND over the 10 per-AC booleans. A 9-long or 11-long
      input (count drift) or any single false AC Fails.
    prediction: >
      verdict_from_model1_ac_aggregate(ac_passes) == GateShip001Verdict::Pass
      iff ac_passes.len() == 10 AND every entry is true. Proves the AC
      count, the aggregate shape, and the absence of "9-of-10 is close
      enough" drift.
    test: |
      cargo test -p aprender-core --lib
        falsify_gate_ship_001_model1_ac_aggregate
    if_fails: >
      MODEL-1 publish gate weakens to allow shipping when an AC regresses
      (contract weakening) or the AC count drifts without spec update
      (schema rot). Either is a publish-blocker.
    spec_reference: ship-two-models-spec.md §6 GATE-SHIP-001
    binds_to: GATE-SHIP-001
    ship_blocking: true
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    evidence_discharged_by:
      - 'crates/aprender-core/src/format/gate_ship_001.rs::AC_GATE_SHIP_001_MODEL_1_AC_COUNT'
      - 'crates/aprender-core/src/format/gate_ship_001.rs::verdict_from_model1_ac_aggregate'
      - 'crates/aprender-core/src/format/gate_ship_001.rs::falsify_gate_ship_001_model1_ac_aggregate (6-section survey incl. 2^10=1024 exhaustive bitmask proof)'
    full_discharge_blocks_on: >
      Live §6 GATE-SHIP-001 harness that actually runs all 10 per-AC
      harnesses against paiml/qwen2.5-coder-7b-apache-q4k-v1 on RTX
      4090 (safetensors load + valid-Python emit + quantize round-trip
      + GGUF export + HumanEval + `apr qa` + decode tps + chat template
      + provenance grep + SHA-256 curl) and asserts all 10 report Pass.
    counter_example_classes:
      - aggregate_weakened
      - ac_count_drift_add
      - ac_count_drift_remove
      - double_count_concat
      - silent_majority_relaxation

  - id: FALSIFY-GATE-SHIP-002
    rule: >
      MODEL-2 sovereign cannot ship unless all 12 AC-SHIP2-* (§4.4 rows
      AC-SHIP2-001 through AC-SHIP2-012) report Pass. Decision rule:
      aggregate-AND over the 12 per-AC booleans. An 11-long or 13-long
      input (count drift) or any single false AC Fails.
    prediction: >
      verdict_from_model2_ac_aggregate(ac_passes) == GateShip002Verdict::Pass
      iff ac_passes.len() == 12 AND every entry is true. Proves the AC
      count and aggregate shape for MODEL-2 in lockstep with MODEL-1
      (FALSIFY-GATE-SHIP-001).
    test: |
      cargo test -p aprender-core --lib
        falsify_gate_ship_002_model2_ac_aggregate
    if_fails: >
      MODEL-2 publish gate weakens to allow shipping when an AC regresses,
      or the AC count drifts without spec update.
    spec_reference: ship-two-models-spec.md §6 GATE-SHIP-002
    binds_to: GATE-SHIP-002
    ship_blocking: true
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    evidence_discharged_by:
      - 'crates/aprender-core/src/format/gate_ship_002.rs::AC_GATE_SHIP_002_MODEL_2_AC_COUNT'
      - 'crates/aprender-core/src/format/gate_ship_002.rs::verdict_from_model2_ac_aggregate'
      - 'crates/aprender-core/src/format/gate_ship_002.rs::falsify_gate_ship_002_model2_ac_aggregate (6-section survey incl. 2^12=4096 exhaustive bitmask proof)'
    full_discharge_blocks_on: >
      Live §6 GATE-SHIP-002 harness that actually runs all 12 per-AC
      harnesses against paiml/llama-370m-sovereign-apache-v1 on RTX
      4090 and asserts all 12 report Pass. Blocks on MODEL-2 370M
      artifact from tasks #126/#131 landing first.
    counter_example_classes:
      - aggregate_weakened
      - ac_count_drift_add
      - ac_count_drift_remove
      - double_count_concat

  - id: FALSIFY-GATE-SHIP-003
    rule: >
      Both MODEL-1 and MODEL-2 must preserve `apr qa` Golden Output byte-
      exactly across a quantization round-trip (`apr convert --quantize
      q4_k_m`). Decision rule: byte-identity between pre-quantize and
      post-quantize Golden Output byte streams; non-empty on both sides.
      Empty input (SKIPPED Golden Output gate) conservatively Fails.
    prediction: >
      verdict_from_golden_output_diff(pre, post) == GateShip003Verdict::Pass
      iff both slices are non-empty, same length, and byte-identical.
      Catches silent whitespace drift, BOM promotion, trailing newline,
      and the Unicode-folded-compare class of mutation.
    test: |
      cargo test -p aprender-core --lib
        falsify_gate_ship_003_golden_output_byte_identity
    if_fails: >
      A quantizer that corrupts the emitted bytes (even by one whitespace
      char) can ship because the Golden Output comparison was relaxed.
    spec_reference: ship-two-models-spec.md §6 GATE-SHIP-003
    binds_to: GATE-SHIP-003
    ship_blocking: true
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    evidence_discharged_by:
      - 'crates/aprender-core/src/format/gate_ship_003.rs::GateShip003Verdict'
      - 'crates/aprender-core/src/format/gate_ship_003.rs::verdict_from_golden_output_diff'
      - 'crates/aprender-core/src/format/gate_ship_003.rs::falsify_gate_ship_003_golden_output_byte_identity (6-section survey)'
    full_discharge_blocks_on: >
      Live `apr qa <model>.apr --golden-output` run on pre-quantize AND
      post-quantize checkpoint for both MODEL-1 and MODEL-2 on RTX 4090;
      byte-for-byte diff of the captured Golden Output bytes.
    counter_example_classes:
      - length_mismatch_drift
      - trailing_whitespace_promotion
      - case_folded_compare
      - unicode_normalized_compare
      - empty_skipped_promoted_to_pass

  - id: FALSIFY-GATE-SHIP-004
    rule: >
      HumanEval eval harness MUST produce BITWISE-IDENTICAL pass@1 scores
      on two consecutive seed=0 runs (same host, same binary, same
      model). Decision rule: f32.to_bits() equality on both scores, with
      range guards `[0.0, 100.0]` and is_finite() on both sides. This is
      STRICTLY STRICTER than FALSIFY-SHIP-023 (1.2 pp day-over-day drift
      tolerance).
    prediction: >
      verdict_from_identical_humaneval_scores(a, b) == GateShip004Verdict::Pass
      iff both finite, both in [0.0, 100.0], AND a.to_bits() == b.to_bits().
      A single-ULP drift (f32::from_bits(a.to_bits() + 1)) Fails.
    test: |
      cargo test -p aprender-core --lib
        falsify_gate_ship_004_humaneval_bitwise_determinism
    if_fails: >
      Hidden non-determinism in the eval/sampling path (entropy source,
      thread-local RNG race, atomic-counter read) can ship because the
      gate tolerated float noise.
    spec_reference: ship-two-models-spec.md §6 GATE-SHIP-004
    binds_to: GATE-SHIP-004
    ship_blocking: true
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    evidence_discharged_by:
      - 'crates/aprender-core/src/format/gate_ship_004.rs::GateShip004Verdict'
      - 'crates/aprender-core/src/format/gate_ship_004.rs::verdict_from_identical_humaneval_scores'
      - 'crates/aprender-core/src/format/gate_ship_004.rs::falsify_gate_ship_004_humaneval_bitwise_determinism (7-section survey incl. contrast against SHIP-023 drift rule)'
    full_discharge_blocks_on: >
      Live two consecutive `apr eval --benchmark humaneval --seed 0
      <model>.apr` runs on the same RTX 4090 host within the same
      session; assert the two JSON pass@1 f32 values have byte-equal
      representation.
    counter_example_classes:
      - tolerance_widened_to_ship_023
      - close_enough_compare
      - non_finite_passed
      - range_guard_skipped
      - bit_representation_compare_skipped

  - id: FALSIFY-GATE-SHIP-005
    rule: >
      Every published artifact MUST carry a non-empty `license` metadata
      field AND that value MUST byte-equally match the upstream
      declaration (parent model card / HF repo YAML front-matter).
      Decision rule: both non-empty, both ASCII-printable, byte-equal
      (case-sensitive; SPDX IDs are canonical).
    prediction: >
      verdict_from_license_metadata(model, upstream) == GateShip005Verdict::Pass
      iff non-empty on both sides, ASCII-printable on both sides, and
      byte-equal. Catches case drift (Apache-2.0 vs apache-2.0), trailing
      whitespace, embedded control chars, BOM, and emoji.
    test: |
      cargo test -p aprender-core --lib
        falsify_gate_ship_005_license_metadata_match
    if_fails: >
      Publish pipeline silently normalizes the license string, breaking
      downstream consumers that compare against the canonical SPDX list.
    spec_reference: ship-two-models-spec.md §6 GATE-SHIP-005
    binds_to: GATE-SHIP-005
    ship_blocking: true
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    evidence_discharged_by:
      - 'crates/aprender-core/src/format/gate_ship_005.rs::AC_GATE_SHIP_005_REQUIRED_LICENSE_FIELD'
      - 'crates/aprender-core/src/format/gate_ship_005.rs::verdict_from_license_metadata'
      - 'crates/aprender-core/src/format/gate_ship_005.rs::falsify_gate_ship_005_license_metadata_match (6-section survey)'
    full_discharge_blocks_on: >
      Live `apr inspect <model>.apr --format json | jq -r .metadata.license`
      compared byte-equally against the upstream source's declared license
      (HF card YAML front-matter for MODEL-1, dataset card for MODEL-2).
    counter_example_classes:
      - case_drift_normalized
      - trailing_whitespace_promoted
      - bom_prefixed
      - emoji_injected
      - empty_silently_passed

  - id: FALSIFY-GATE-SHIP-006
    rule: >
      GGUF round-trip parity — APR inference and `apr export --format gguf`
      + llama.cpp inference MUST produce first-token probabilities within
      `AC_GATE_SHIP_006_MAX_FIRST_TOKEN_DELTA = 1e-3` of each other on
      the same prompt. Decision rule: |p_apr - p_gguf| <= tol, symmetric
      via .abs(), with range guards `[0.0, 1.0]` and is_finite() on all
      three args.
    prediction: >
      verdict_from_first_token_probability_delta(p_apr, p_gguf, tol)
      == GateShip006Verdict::Pass iff all finite, p_apr and p_gguf in
      [0.0, 1.0], tol >= 0.0, AND |p_apr - p_gguf| <= tol. A single-ULP
      excess Fails.
    test: |
      cargo test -p aprender-core --lib
        falsify_gate_ship_006_first_token_probability_delta
    if_fails: >
      A GGUF export path that silently corrupts the first-token
      distribution (wrong dequant, wrong layout, stale metadata) can
      ship because the parity gate was relaxed.
    spec_reference: ship-two-models-spec.md §6 GATE-SHIP-006
    binds_to: GATE-SHIP-006
    ship_blocking: true
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    evidence_discharged_by:
      - 'crates/aprender-core/src/format/gate_ship_006.rs::AC_GATE_SHIP_006_MAX_FIRST_TOKEN_DELTA'
      - 'crates/aprender-core/src/format/gate_ship_006.rs::verdict_from_first_token_probability_delta'
