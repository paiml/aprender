# ─────────────────────────────────────────────────────────────────────────────
# compound-ship-gates-v1
#
# SOURCE OF TRUTH for all 12 §6 Compound Ship Gates from
# docs/specifications/aprender-train/ship-two-models-spec.md. The original
# v1.0.0 release covered only gates 001–006 (ship-blocking aggregates,
# byte-identity, determinism, license, GGUF parity); v1.1.0 extends coverage
# to the 6 merge-gate meta-policy rows (007–012 — unwrap / contract-density /
# CI-green / deny / tdg / coverage) by binding the THRESHOLDS themselves
# (which are algorithmic, integer/ratio/boolean in shape) even though the
# tool outputs (clippy / pmat / cargo deny / cargo llvm-cov) are still
# external and enforced by CI. Full discharge of 007–012 still requires
# running those external tools; what v1.1.0 adds is the decision-rule proof
# that the thresholds cannot be silently weakened without a contract bump
# and a Rust-test-fail signal.
#
# Each of the 12 gates is bound at PARTIAL_ALGORITHM_LEVEL to one or more
# pure verdict fns in `crates/aprender-core/src/format/gate_ship_0XX.rs`
# plus a 5–8 section mutation survey. Full discharge for each gate blocks
# on the compute-heavy aggregate harness (all 10 AC-SHIP1-* checks actually
# running for GATE-SHIP-001, `cargo clippy -- -D warnings` for GATE-SHIP-007,
# `cargo deny check advisories` for GATE-SHIP-010, etc.).
#
# Pairs numerically with the 3 single-AC SHIP-* contracts already wired:
#   - apr-model-qa-v1.yaml (FALSIFY-QA-SHIP-006 — MODEL-1 apr-qa aggregate)
#   - qwen2-e2e-verification-v1.yaml (FALSIFY-QW2E-SHIP-001..010 + 023 + 024)
#   - publish-manifest-v1.yaml (GATE-PM-010 — MODEL-1 published artifact)
#   - apr-provenance-v1.yaml (GATE-APR-PROV-004 — MODEL-1 + MODEL-2 license)
#   - chat-template-v1.yaml (GATE-CHAT-SHIP-008)
#   - llama-370m-sovereign-v1.yaml (GATE-ARCH-370M-003..008 — MODEL-2)
# Those contracts cover per-AC rows; this contract covers the §6 COMPOUND
# shape (aggregates, regressions, cross-run identity, cross-engine parity).
# ─────────────────────────────────────────────────────────────────────────────
