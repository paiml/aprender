# Harness policy (2026-04-23)
# ─────────────────────────────────────────────────────────────────────────────
# Every falsification gate in this contract MUST be enforced via `pv validate`
# (binary from `aprender-contracts-cli`, crate
# `crates/aprender-contracts-cli/`). `provable-contracts` was merged into
