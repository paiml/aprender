# ──────────────────────────────────────────────
# bin-aprender-zram-cli--trueno-zram-v1 — the `trueno-zram` bin target of package aprender-zram-cli (ONT-10 slice S11)
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes live in
# binary-surface-v1; this file restates none of them. Measured 2026-09-26 on a 0.69.3 build of this tree.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-zram-cli--trueno-zram-v1
version: "1.0.0"
scope: >
  The command surface of the `trueno-zram` binary (package aprender-zram-cli, src crates/aprender-zram-cli/src/main.rs): its help, its usage errors, its
  version string, its subcommand set, its rejection of unusable input, and its surface-audit rows. Out of scope:
  what each subcommand computes.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    trueno-zram answers --help, rejects an unknown flag or subcommand as a usage error, exposes exactly the subcommands
    the snapshot records, rejects unusable input without a panic, and has an audited ledger row for each command.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'contracts/bin-aprender-contracts-cli--pv-v1.yaml — the exemplar'
    - 'crates/aprender-zram-cli/tests/cli_surface_gate.rs — the gate every falsifier below runs'
    - 'docs/audits/surface_audit.csv — the rows whose binary column is trueno-zram'
    - 'aprender#4502 — ONT-10, slice S11'

entity:
  type: binary
  ref: binary/aprender-zram-cli/trueno-zram

relations:
  depends_on: [binary-surface-v1]

equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(trueno-zram)) = subcommands(clap(Cli)) = SUBCOMMANDS(crates/aprender-zram-cli/tests/cli_surface_gate.rs) ∧ leaves(trueno-zram) = {f.feature : f ∈ surface_audit, f.binary = trueno-zram}"
    domain: "the trueno-zram line of the tracked snapshot, the clap Command enum, the gate's pinned list, and the ledger rows with binary = trueno-zram"
    codomain: "set equality, or a Fail naming each command in the symmetric difference"
    invariants:
      - "a subcommand clap accepts and the snapshot omits is an unaudited surface"
      - "measured 2026-09-26: top-level = {create, remove, status, benchmark}; 4 leaves, set-equal to the 4 ledger rows"
    preconditions:
      - "the snapshot was written at this commit"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `trueno-zram --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-TRUENO-ZRAM-INV-001
    property: every trueno-zram command leaf has an audited ledger row
    formal: '∀ c ∈ leaves(trueno-zram): |{r ∈ surface_audit : r.binary = trueno-zram ∧ r.feature = "trueno-zram " ++ c}| ≥ 1'
    prose: false
  - id: BIN-TRUENO-ZRAM-INV-002
    property: unusable input is a clean rejection, never a success and never a panic
    formal: '∀ a ∈ rejection_rows(crates/aprender-zram-cli/tests/cli_surface_gate.rs): exit(a) ∉ {0, 101} ∧ "panicked" ∉ stderr(a)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-TRUENO-ZRAM-001
    rule: 'G1.2 help answers'
    prediction: '`trueno-zram --help` exits 0 and advertises ≥1 subcommand; every advertised `<cmd> --help` exits 0'
    test: 'cargo test -p aprender-zram-cli --test cli_surface_gate every_advertised_subcommand_is_reachable'
    if_fails: 'the binary cannot describe its own surface, or advertises a command it cannot reach (observed 2026-09-26: GREEN)'
    mutation: 'make one subcommand''s --help return an error; must turn RED naming it'
  - id: FALSIFY-BIN-TRUENO-ZRAM-002
    rule: 'G1.2 an unknown flag or subcommand is a usage error'
    prediction: '`trueno-zram --no-such-flag` and `trueno-zram no-such-subcommand` each exit 2'
    test: 'cargo test -p aprender-zram-cli --test cli_surface_gate unknown_'
    if_fails: 'a typo is silently ignored (observed 2026-09-26: both exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-TRUENO-ZRAM-003
    rule: 'G0.1 the version names the commit'
    prediction: '`trueno-zram --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands. cargo test -p aprender-zram-cli --test cli_surface_gate version_reports_the_crate_version pins only the crate version today'
    if_fails: 'LIVE RED 2026-09-26: `trueno-zram 0.69.3` — no sha; a stale trueno-zram reads as HEAD'
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-TRUENO-ZRAM-004
    rule: 'G1.3/G1.4 the command set equals the snapshot'
    prediction: 'the advertised top-level subcommands are exactly create, remove, status, benchmark'
    test: 'cargo test -p aprender-zram-cli --test cli_surface_gate advertised_subcommands_are_the_pinned_surface'
    if_fails: 'a subcommand was added or removed without updating the pinned surface (observed 2026-09-26: GREEN)'
    mutation: 'add a subcommand without editing SUBCOMMANDS; must turn RED naming it'
  - id: FALSIFY-BIN-TRUENO-ZRAM-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 row with binary = trueno-zram per leaf (4 rows for 4 leaves on 2026-09-26)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'trueno-zram ships a command with no audited row'
    mutation: 'delete every trueno-zram row; must turn RED naming trueno-zram'
  - id: FALSIFY-BIN-TRUENO-ZRAM-006
    rule: 'unusable input is rejected cleanly'
    prediction: '`create -d 17 -s 1G` and `--format bogus status` (create/remove are never run with valid arguments: they touch /dev/zram*): each exits non-zero, not 101, with no "panicked" on stderr'
    test: 'cargo test -p aprender-zram-cli --test cli_surface_gate unusable_input_is_rejected'
    if_fails: 'MEASURED 2026-09-26 (aprender-01): GREEN; both rows are clap value checks, and no source mutation was run for this binary'
    mutation: 'make a rejection path return Ok(()) or unwrap the read; must turn RED on that row'
