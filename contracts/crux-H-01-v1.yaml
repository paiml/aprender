# CRUX-H-01 — Load HF dataset + split select
# Auto-scaffolded from crux-competitive-research-ux-v1.yaml (DRAFT).
# DO NOT promote to ACTIVE until: (1) evidence collected, (2) falsification
# body reflects competitor's canonical CLI, (3) apr surface mapped or gap
# tracked in pmat work (see master §12).

metadata:
  id: CRUX-H-01
  version: "1.0.0-draft"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "H — Data & Datasets"
  competitor: huggingface
  demand_score: 5  # 1..5, critical priority in pmat work
  intake_status: partial
  description: >
    Load HF dataset + split select. Competitor: `datasets.load_dataset(
    "squad", split="train[:1000]")` parses slice syntax into
    ReadInstruction objects. Aprender surface: `apr data load hf://squad
    --split "train[:1000]" -o subset.apr`. Cache layout mirrors HF's
    ~/.cache/huggingface/datasets/ semantics under ~/.cache/apr/datasets/.
    Source: https://huggingface.co/docs/datasets/loading#slice-splits

equations:
  slice_syntax_grammar:
    formula: |
      split := IDENT slice?
      slice := "[" bound? ":" bound? "]"   // start:end (indices)
             | "[" INT "%" "]"              // percentage
             | "[" INT ":" INT "%" "]"      // ranged percentage
      bound := INT
      IDENT := "train" | "validation" | "test" | "...custom..."
    domain: --split argument string
    codomain: ReadInstruction(split_name, start, stop, unit ∈ {abs, pct})
    invariants:
    - "train[:N]   → records[0..N]"
    - "train[N:]   → records[N..total]"
    - "train[N:M]  → records[N..M]"
    - "train[N%]   → records[0..floor(total * N / 100)]"

  record_count_equation:
    formula: |
      For split "train[:N]" where dataset has total T records:
        output_records = min(N, T)
      For slice [a:b]: output_records = max(0, min(b, T) - max(0, a))
      For [N%]: output_records = floor(T × N / 100)
    domain: slice expression + total record count T
    codomain: ℕ
    invariants:
    - "output_records <= total_records"
    - "output_records >= 0"
    - "Matches HF datasets library record count for identical slice"

  cache_hit_speedup:
    formula: |
      t_cold = wall-clock to load from HF Hub (network + parse + cache write)
      t_warm = wall-clock to load same slice from local cache
      speedup = t_cold / t_warm
      Requirement: t_warm < 0.1 × t_cold (cache gives ≥10×)
    domain: repeated loads of same (dataset, slice)
    codomain: bool
    invariants:
    - "Second load of identical slice is ≥10× faster than first"
    - "Cache keyed by sha256(dataset_id + revision + slice_expr)"
    - "Cache located at ~/.cache/apr/datasets/"

falsification_tests:
- id: FALSIFY-CRUX-H-01-001
  rule: Slice syntax variants parse
  prediction: "train[:N], train[N:], train[N:M], train[N%] all parse and produce correct records"
  test: |
    apr data load hf://squad --split "train[:100]" -o /tmp/a.apr
    apr data load hf://squad --split "train[100:]" -o /tmp/b.apr
    apr data load hf://squad --split "train[100:200]" -o /tmp/c.apr
    apr data load hf://squad --split "train[10%]" -o /tmp/d.apr
    for f in a b c d; do test -s /tmp/$f.apr; done
  if_fails: "One or more slice forms failed to parse or produced empty output"

- id: FALSIFY-CRUX-H-01-002
  rule: Record count matches slice [:N]
  prediction: "train[:1000] produces exactly 1000 records"
  test: |
    apr data load hf://squad --split "train[:1000]" -o /tmp/subset.apr --json > meta.json
    jq -e '.record_count == 1000' meta.json
  if_fails: "Record count mismatch for train[:N] slice"

- id: FALSIFY-CRUX-H-01-003
  rule: Cache location + sha256 manifest
  prediction: "Cache lives at ~/.cache/apr/datasets/ with sha256 manifest"
  test: |
    # TODO: once apr data load is wired, verify cache dir + manifest.
    apr data load hf://squad --split "train[:100]" -o /tmp/s.apr > /dev/null
    CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/apr/datasets"
    test -d "$CACHE_DIR"
    find "$CACHE_DIR" -name 'manifest.json' | head -1 | xargs -r jq -e '.sha256'
  if_fails: "Cache directory missing or manifest lacks sha256"

- id: FALSIFY-CRUX-H-01-004
  rule: Warm cache is ≥10× faster than cold
  prediction: "Second load of same slice has wall-time < 0.1 × first"
  test: |
    rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/apr/datasets/squad"
    COLD=$( { time apr data load hf://squad --split "train[:1000]" -o /tmp/a.apr > /dev/null; } 2>&1 | grep real | awk '{print $2}')
    WARM=$( { time apr data load hf://squad --split "train[:1000]" -o /tmp/b.apr > /dev/null; } 2>&1 | grep real | awk '{print $2}')
    # TODO: parse m##s## into seconds and compare; placeholder compares raw strings
    python3 -c "
    def to_s(x):
        import re
        m = re.match(r'(?:(\d+)m)?([\d.]+)s', '$COLD' if 'c' in 'COLD' else '$WARM')
        return 0.0
    # Actual implementation needed — this is a placeholder check
    print('cold=$COLD warm=$WARM')
    "
  if_fails: "Cache not providing ≥10× speedup on second load"

- id: FALSIFY-CRUX-H-01-005
  rule: Parity with HF datasets library record count
  prediction: "apr record_count matches HF datasets load_dataset() for identical slice"
  test: |
    APR_N=$(apr data load hf://squad --split "train[:500]" --json | jq '.record_count')
    HF_N=$(uv run --with datasets python3 -c "
    from datasets import load_dataset
    ds = load_dataset('squad', split='train[:500]')
    print(len(ds))
    ")
    [ "$APR_N" = "$HF_N" ]
  if_fails: "apr record count diverges from HF datasets reference"

proof_obligations:
- type: invariant
  property: "Slice syntax parses all four forms: [:N], [N:], [N:M], [N%]"
- type: invariant
  property: "output_records == expected count from slice expression"
- type: invariant
  property: "Cache located at ~/.cache/apr/datasets/ with sha256 manifest"
- type: invariant
  property: "Warm cache ≥10× faster than cold load"
- type: invariant
  property: "Record count matches HF datasets library for identical slice"

