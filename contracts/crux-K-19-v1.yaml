# CRUX-K-19 — CoreML export (Apple Silicon)

metadata:
  id: CRUX-K-19
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "K — Deployment & Integration"
  competitor: ecosystem
  demand_score: 3
  intake_status: missing
  description: >
    CoreML export for Apple Silicon: produce a `.mlpackage` consumable
    by `coremltools.models.MLModel` on macOS 13+. Canonical:
    `coremltools.convert(...)` from PyTorch / ONNX. Parity: on CPU
    compute unit, logits cosine ≥0.999 vs apr native fp32. fp16 weight
    storage is acceptable provided the cosine gate holds.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/triton-inference-server/server
  - github.com/ai-dynamo/dynamo
  - github.com/NVIDIA/TensorRT-LLM
equations:
  coreml_export:
    formula: |
      apr export --format coreml --compute-precision fp16 model.apr \
         -o model.mlpackage
      MLModel(model.mlpackage).predict({"input_ids": x}) → logits
      cos_sim(coreml_logits, native_logits) ≥ 0.999 (CPU compute unit)
    domain: "(model: Path, compute_precision ∈ {fp32, fp16}, minimum_deployment_target ≥ iOS 16)"
    codomain: "mlpackage directory conforming to CoreML spec"
    invariants:
    - "output directory is a valid .mlpackage (has Manifest.json + Data/)"
    - "MLModel.load succeeds; logit cosine ≥ 0.999 vs native"
    - "minimum_deployment_target metadata present in Manifest"

falsification_tests:
- id: FALSIFY-CRUX-K-19-001
  rule: mlpackage structure is valid
  prediction: "Manifest.json + Data/com.apple.CoreML/model.mlmodel present"
  test: |
    set -euo pipefail
    apr export tests/fixtures/tiny.apr --format coreml \
      --compute-precision fp16 -o /tmp/t.mlpackage
    test -f /tmp/t.mlpackage/Manifest.json
    test -f /tmp/t.mlpackage/Data/com.apple.CoreML/model.mlmodel
  if_fails: rule 'mlpackage structure is valid' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-K-19-002
  rule: coremltools.MLModel.load succeeds
  prediction: "MLModel('/tmp/t.mlpackage') does not raise"
  test: |
    set -euo pipefail
    uv run --with coremltools python3 -c "
    import coremltools as ct
    m = ct.models.MLModel('/tmp/t.mlpackage', compute_units=ct.ComputeUnit.CPU_ONLY)
    assert m is not None
    "
  if_fails: rule 'coremltools.MLModel.load succeeds' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-K-19-003
  rule: parity vs native ≥0.999 cosine
  prediction: "coreml logits vs native within cosine gate"
  test: |
    set -euo pipefail
    apr trace tests/fixtures/tiny.apr --input hello --dump-logits /tmp/native.npy
    uv run --with coremltools --with numpy python3 -c "
    import coremltools as ct, numpy as np
    m = ct.models.MLModel('/tmp/t.mlpackage', compute_units=ct.ComputeUnit.CPU_ONLY)
    x = np.load('/tmp/input_ids.npy')
    y = m.predict({'input_ids': x})['logits']
    n = np.load('/tmp/native.npy')
    cos = float((y.flatten() @ n.flatten()) / (np.linalg.norm(y)*np.linalg.norm(n) + 1e-12))
    assert cos >= 0.999, cos
    "

  if_fails: rule 'parity vs native ≥0.999 cosine' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr export --format coreml produces CoreML-spec-compliant .mlpackage with ≥0.999 cosine vs native"
- type: invariant
  property: "MLModel.load succeeds on CPU_ONLY compute unit"
- type: invariant
  property: "Manifest.json + model.mlmodel present under Data/com.apple.CoreML/"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

