# ─────────────────────────────────────────────────────────────
# Contract: F-PUB-LFS-001
# apr publish: proper HuggingFace Hub large-file upload via Xet
# ─────────────────────────────────────────────────────────────
# Closes SHIP-TWO-001 EX-04 ship-blocker: `apr publish` cannot upload
# files > 5 GiB because HF Hub's HTTP preupload API returns
# `uploadMode:lfs` with empty URLs for oversized artifacts, triggering
# `reject_oversized_file()` in crates/aprender-core/src/hf_hub/upload.rs.
#
# The real fix is NOT sharding (workaround) and NOT a self-hosted S3
# mirror (not sovereign — still AWS-dependent). The real fix is to
# implement HF Hub's actual current large-file protocol: **Xet**.
#
# Xet is HF's content-addressable storage backend, open-spec'd at
# https://huggingface.co/docs/xet/index (v1.0.0). Reference Rust
# implementation: github.com/huggingface/xet-core (Apache-2.0,
# v1.4.3 as of 2026-03-31), published on crates.io as `hf-xet`,
# `xet-client`, `xet-data`, `xet-core-structures`, `xet-runtime`.
#
# The prior `hf_transfer` crate is deprecated by Hugging Face in
# favor of `hf_xet` / `xet-core`.
#
# Parent: contracts/apr-cli-publish-v1.yaml           (base publish)
# Peer:   contracts/apr-cli-publish-extra-v1.yaml     (manifest + sidecars)
# Peer:   contracts/publish-manifest-v1.yaml          (artifact schema)
# Peer:   contracts/tensor-layout-v1.yaml             (binary layer)
#
# References:
#   - https://huggingface.co/docs/xet/index             (protocol spec v1.0.0)
#   - https://huggingface.co/docs/xet/en/upload-protocol
#   - https://huggingface.co/docs/xet/en/api            (CAS API)
#   - https://huggingface.co/docs/xet/en/auth           (token flow)
#   - https://huggingface.co/docs/xet/en/chunking       (gearhash CDC)
#   - https://huggingface.co/docs/xet/en/xorb           (64 MiB xorb)
#   - https://huggingface.co/docs/xet/en/shard          (shard format)
#   - https://huggingface.co/docs/xet/en/hashing        (MerkleHash, term verify)
#   - https://github.com/huggingface/xet-core           (Rust ref impl)
#   - https://huggingface.co/docs/hub/en/storage-backends
#   - evidence/ship-two-001/ex-04-five-whys-lfs-5gb-blocker.md
#   - MEMORY: feedback_full_problems_pmat_contracts.md
# ─────────────────────────────────────────────────────────────

