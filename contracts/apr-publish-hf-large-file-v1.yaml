deferred:
- topic: LFS batch API fallback
  note: >
    For legacy (pre-2026) HF repos without Xet enabled, the
    fallback is the git-lfs batch API at
    `POST /{repo}/.git/info/lfs/objects/batch`. We will add
    FALSIFY-PUB-LFS-011..015 to cover this path if SHIP-TWO-001
    targets a non-Xet repo; today `paiml/*` is Xet-enabled.
- topic: Download via Xet reconstruction
  note: >
    `apr pull` for Xet-backed artifacts uses
    GET /v1/reconstructions/{file_id}. Covered by a sibling
    contract apr-pull-xet-v1.yaml (future).
- topic: Global deduplication query
  note: >
    OPTIONAL per Xet spec. Useful optimization, not a correctness
    requirement. Will add in v1.1 once v1.0 dogfood proves the
    write path.

# ─────────────────────────────────────────────────────────────
# Implementation plan (non-normative — for cross-reference)
# ─────────────────────────────────────────────────────────────

implementation_plan:
  status: IMPLEMENTED  # v1.1.0 landed 2026-04-18
  crates:
  - crate: hf-xet
    version: 1.5.1
    source: crates.io
    license: Apache-2.0
    note: |
      Actual wiring: the Rust blocking API (XetSessionBuilder,
      with_token_refresh_url, build_blocking, upload_from_path_blocking,
      commit_blocking) is self-contained — it does NOT require us to
      separately touch xet-client / xet-data / xet-core-structures. The
      single `hf-xet` dep transitively pulls them in and hides phases 3-7
      of the protocol behind a single `upload_from_path_blocking` call.
      The v1.0.0 plan (four crates) overestimated the integration surface.
  - crate: xet-client
    status: transitive-only
    note: pulled in by hf-xet; we do not import directly
  - crate: xet-data
    status: transitive-only
  - crate: xet-core-structures
    status: transitive-only
  edit_sites:
  - file: Cargo.toml (workspace root)
    action: ADDED `hf-xet = "1.5.1"` to [workspace.dependencies]
    status: DONE
  - file: crates/aprender-core/Cargo.toml
    action: ADDED `hf-xet = { workspace = true, optional = true }` +
            `xet = ["hf-hub-integration", "hf-xet"]` feature
    status: DONE
  - file: crates/aprender-core/src/hf_hub/xet.rs (NEW, 178 lines)
    exports: should_use_xet, HF_XET_THRESHOLD_BYTES,
             build_token_refresh_url, XetUploader
    tests: 4 unit tests discharge FALSIFY-PUB-LFS-001/002
    status: DONE
  - file: crates/aprender-core/src/hf_hub/mod.rs
    action: ADDED `pub mod xet;`, added `HfHubError::XetUpload(String)`
            and `HfHubError::PartialUpload { cas_success, commit_success,
            detail }` variants + Display impls
    status: DONE
  - file: crates/aprender-core/src/hf_hub/upload.rs
    action: DELETED `reject_oversized_file` (v1.0.0 stub with broken
            `apr export --max-shard-size` recommendation). ADDED
            `upload_via_xet` (tempfile materialize + XetUploader invoke)
            and `reject_needs_xet_feature` (clear error when built without
            --features xet). Dispatch gate in upload_via_lfs now routes
            files > 5 GiB through super::super::xet::should_use_xet.
    status: DONE
  - file: crates/apr-cli/Cargo.toml
    action: ADDED `xet = ["hf-hub", "aprender/xet"]` feature; appended
            `xet` to the `full` feature list.
    status: DONE
  feature_flag: xet  (sub-feature of hf-hub-integration; off-by-default)
  binary_size_impact: |
    hf-xet pulls in tokio + reqwest + async machinery. Current
    apr binary is sync (ureq). Options:
      A) Gate hf-xet behind a new `xet` sub-feature so the
         default cargo install apr footprint is unchanged.
      B) Bridge sync→async via tokio::runtime::Handle::block_on
         (hf-xet's exported API is async).
    Recommendation: A) — ship `xet` as an opt-in sub-feature
    that `apr publish --large-file` implies, default-off for
    `cargo install aprender`. See spec §12.8.3.
