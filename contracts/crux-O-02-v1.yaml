equations:
  two_unique_label_values_infer_binary__3___n_small_cardinalit:
    formula: |
      a table of (label column, expected kind) fixtures including the ambiguous cases {0,1} as int, {0.0,1.0} as float, and 30 unique floats over 1000 rows all classify as documented
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "two unique label values infer binary, 3..=N small-cardinality infer multiclass, many-unique numeric infers regression"
  the_override_wins_and_a_contradictory_override_is_rejected:
    formula: |
      problem_type=regression on a string label column is an Err naming the column, not a silent cast
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "the override wins and a contradictory override is rejected"

