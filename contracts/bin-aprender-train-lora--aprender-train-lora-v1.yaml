# ──────────────────────────────────────────────
# bin-aprender-train-lora--aprender-train-lora-v1 — the `aprender-train-lora` bin target of package aprender-train-lora (ONT-10 slice S16 (2/2))
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha, helpSha,
# gitSha, …) live in binary-surface-v1 and are not restated. Moved from docs/ont-10/binary-contracts/ (aprender-bb).
#
# binary-aprender-train-lora-v1 — ONT-10 slice S16 (2/2): the `aprender-train-lora` binary as an entity
# (ONT-001 v4.17 ONT-4g; #4476, #4079)
#
# MEASURED (2026-09-26, batch/ont-10 @ b1cd8c0b0, release build, default features): the --help walk gives 4 leaf
# commands, set-equal to surface_audit.csv's 4 rows. `aprender-train-lora --version` prints "entrenar-lora 0.69.3":
# the pre-monorepo name, not the binary's. The identity shape below requires the version string to start with
# the target name, so it is RED today — a user who runs `aprender-train-lora --version` is told a different
# program's name. G0.1 (git sha in --version) is a warning and RED today.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-train-lora--aprender-train-lora-v1
version: "1.0.0"
scope: >
  The built `aprender-train-lora` target of package `aprender-train-lora` (default features) as the focus node binary/aprender-train-lora/aprender-train-lora: its identity and its exact CLI command set, and the surface_audit.csv rows that must resolve to it.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice S16 (2/2) (aprender-train-lora). Per-binary shapes over the node extract:binary (ONT-4g, #4476) draws
    for binary/aprender-train-lora/aprender-train-lora, on the binary-surface-v1 vocabulary.
  references:
    - 'crates/aprender-train-lora/tests/cli_surface_gate.rs — the gate falsifiers 001, 002, 004 and 006 run'
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (the ledger; binary column = aprender-train-lora)'
    - 'scripts/dogfood_surfaces.sh (the snapshot extract:binary reads)'
    - 'aprender#4502 — ONT-10'

entity:
  type: binary
  ref: binary/aprender-train-lora/aprender-train-lora

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-aprender-train-lora-surface
    targetClass: bin:target/aprender-train-lora/aprender-train-lora
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["aprender-train-lora"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-train-lora"]}
      # LIVE RED 2026-09-27: --version prints "entrenar-lora 0.69.3", not the target name
      - {path: "bin:versionString", minCount: 1, maxCount: 1, pattern: "^aprender-train-lora [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-27 (no sha); a warning until the version string carries it
      - {path: "bin:versionString", minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: "warning"}
      - path: bin:command
        minCount: 4
        maxCount: 4
        in:
          - "compare"
          - "inspect"
          - "merge"
          - "plan"
      - {path: "bin:ledgerOrphan", maxCount: 0}
      - {path: "bin:unledgeredCommand", maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(binary/aprender-train-lora/aprender-train-lora) = C, |C| = 4, where C = the leaves of the recursive --help walk of the default-feature build ∧ ledgerOrphan = { r ∈ csv : r.binary = aprender-train-lora ∧ r.feature ∉ C }; unledgeredCommand = C ∖ { r.feature : r.binary = aprender-train-lora }"
    domain: "the snapshot record dogfood_surfaces.sh writes for this target; docs/audits/surface_audit.csv rows whose binary column is aprender-train-lora"
    codomain: "set equality, or a Fail naming each member of the symmetric difference; literals on the focus node, one per orphan row or unledgered command"
    invariants:
      - "in + minCount 4 + maxCount 4 over distinct literals is set equality: an added, dropped or renamed command is a violation naming it"
      - "a ledger row for a command the built binary does not expose is a violation, never a silent skip"
    preconditions:
      - "the snapshot was written at this commit, default features"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `aprender-train-lora --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-APRENDER-TRAIN-LORA-INV-001
    property: every aprender-train-lora surface member has an audited ledger row, and every ledger row names one
    formal: '∀ c ∈ surface(aprender-train-lora): ∃ r ∈ surface_audit : r.binary = aprender-train-lora ∧ path(r) = c; ∀ r with r.binary = aprender-train-lora: path(r) ∈ surface(aprender-train-lora)'
    prose: false

  - id: BIN-APRENDER-TRAIN-LORA-INV-002
    property: unusable input is a clean rejection, never a success and never a panic
    formal: '∀ a ∈ rejection_rows(crates/aprender-train-lora/tests/cli_surface_gate.rs): exit(a) ∉ {0, 101} ∧ "panicked" ∉ stderr(a)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-APRENDER-TRAIN-LORA-001
    rule: 'G1.2 help answers'
    prediction: '`aprender-train-lora --help` exits 0 and advertises ≥1 subcommand; every advertised `<cmd> --help` exits 0'
    test: 'cargo test -p aprender-train-lora --test cli_surface_gate every_advertised_subcommand_is_reachable'
    if_fails: 'the binary cannot describe its own surface, or advertises a command it cannot reach (observed 2026-09-26: GREEN)'
    mutation: 'make one subcommand''s --help return an error; must turn RED naming it'
  - id: FALSIFY-BIN-APRENDER-TRAIN-LORA-002
    rule: 'G1.2 an unknown flag or subcommand is a usage error'
    prediction: '`aprender-train-lora --no-such-flag` and `aprender-train-lora no-such-subcommand` each exit 2'
    test: 'cargo test -p aprender-train-lora --test cli_surface_gate unknown_'
    if_fails: 'a typo is silently ignored (observed 2026-09-26: both exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-APRENDER-TRAIN-LORA-003
    rule: 'G0.1 the version names the commit'
    prediction: '`aprender-train-lora --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'LIVE RED 2026-09-27: "entrenar-lora 0.69.3" — no sha; a stale aprender-train-lora reads as HEAD'
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-APRENDER-TRAIN-LORA-004
    rule: 'G1.3/G1.4 the command set equals the snapshot'
    prediction: 'the advertised top-level subcommands are exactly plan, compare, merge, inspect'
    test: 'cargo test -p aprender-train-lora --test cli_surface_gate advertised_subcommands_are_the_pinned_surface'
    if_fails: 'a subcommand was added or removed without updating the pinned surface (observed 2026-09-26: GREEN)'
    mutation: 'add a subcommand without editing SUBCOMMANDS; must turn RED naming it'
  - id: FALSIFY-BIN-APRENDER-TRAIN-LORA-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 row per surface member with binary = aprender-train-lora (4 rows on 2026-09-27)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'the dogfood coverage ratio is computed over a ledger that silently omits a shipped surface member'
    mutation: 'delete every aprender-train-lora row; must turn RED naming aprender-train-lora'
  - id: FALSIFY-BIN-APRENDER-TRAIN-LORA-006
    rule: 'unusable input is rejected cleanly'
    prediction: '`merge --base/--adapter` on a missing, empty and garbage input (and no output file left behind); `inspect` on a missing input only: each exits non-zero, not 101, with no "panicked" on stderr'
    test: 'cargo test -p aprender-train-lora --test cli_surface_gate unusable_input_is_rejected'
    if_fails: 'MEASURED 2026-09-27 (aprender-01): before the fix `merge` on existing garbage printed "Merged adapter into base model", exited 0 and wrote no file (merge_from_file returned a placeholder Ok); with the fix reverted this test is RED; fixed, GREEN. `inspect` on an empty or garbage file prints a header and exits 0 — NOT asserted, recorded as finding a01-ont10-lora-inspect-reads-nothing'
    mutation: 'make a rejection path return Ok(()) or unwrap the read; must turn RED on that row'
