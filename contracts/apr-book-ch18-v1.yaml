metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 18: Graph Algorithms
  contract: apr-book-ch18
  status: enforced
  title: "Graph Algorithms"
  part: V
  example: ch18_graphs
  arxiv_citations: ["0803.0476", "1609.02907"]

api_calls:
  - module: "aprender::graph"
    functions: ["Graph::from_weighted_edges", "Graph::dijkstra", "Graph::label_propagation", "Graph::clustering_coefficient", "Graph::density"]
    min_calls: 5
preconditions:
  - "cargo build -p aprender-core --example ch18_graphs succeeds"
  - "Zero legacy names in chapter text"
postconditions:
  - "Dijkstra finds optimal shortest path"
  - "Label propagation assigns community labels"
  - "Graph metrics (density, clustering coefficient) computed"
falsification:
  - condition: "cargo run -p aprender-core --example ch18_graphs exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Example contains zero aprender::* API calls (hollow)"
    severity: P0
    action: rewrite_with_real_apis
  - condition: "No community detection algorithm called"
    severity: P0
    action: add_community_detection
  - condition: "No graph metric computed (density/clustering/diameter)"
    severity: P0
    action: add_graph_metrics
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH18-001
    description: "Chapter 18's example ch18_graphs builds and runs to exit 0, with its 7 assertion(s) holding"
    test: "cargo run -p aprender-core --example ch18_graphs"
    prediction: "Exit 0. book-contracts 'Chapter Examples Run' runs the same command for all 27 chapters"
    if_fails: "An API the chapter teaches changed or regressed, so the example panics on an assertion or no longer compiles"
