# ─────────────────────────────────────────────────────────────────────────────
# readme-root — the repository README as a graded document (ONT-001 §5 ONT-4c, Appendix B.4; #3847, PMAT-3847)
#
# WHAT IS GRADED. `extract:readme` reads README.md's frontmatter (emitted by `readme_gen` via
# scripts/readme_sync.sh, never hand-written), its headings and its CLAIM fences. A claim fence is a CommonMark
# backtick or tilde fence whose first info token, lower-cased with `{` and `.` stripped, is bash, sh or shell.
# Every command in one must equal a `run:` line of a merge-path workflow step (push, pull_request,
# pull_request_target, merge_group; not `if: false`) — `resolves: ci-step`. One no workflow runs is refused by
# name, `readme:verifiedCommand unresolved: <cmd>`. A fence that is illustration, not a claim, says so with
# `text`/`console`, which is a visible, reviewable edit — and dropping a VERIFIED claim that way is the F-34
# withdrawal ratchet's business (lint-baseline.json `readme.withdrawn[]`, `make ont-ratchet`).
#
# KIND: pattern. One shape over one focus node; the proof is the gate's case table and the fixtures under
# tests/fixtures/ont/readme-*.
# ─────────────────────────────────────────────────────────────────────────────
name: readme-root
version: "1.0.0"
scope: >
  README.md at the repository root: its frontmatter, its sections, and every command it presents as runnable.
  Out of scope: prose accuracy, link targets, anything in a non-claim fence.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-24'
  last_modified: '2026-09-24'
  author: PAIML Engineering
  description: >
    README.md becomes a readme:Readme node; every claim-fence command must be one a merge-path CI step runs,
    every entrypoint must exist, and the contract count it prints must equal census.json n_files.
  references:
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.16 §5 ONT-4c, Appendix B.4'
    - 'crates/aprender-contracts/src/ontology/extract/{readme,claims}.rs, ontology/measured_sets.rs'
    - 'scripts/readme_sync.sh (the frontmatter), scripts/check_ont_ratchet.sh (the measured sets)'

entity:
  type: readme
  ref: README.md

relations:
  depends_on: [ont-sigma-v1, ont-shapes-v1]

shape:
  closed: true
  properties:
    - {path: readme:schemaVersion, minCount: 1, maxCount: 1, pattern: "^[0-9]+\\.[0-9]+$"}
    - {path: readme:kind, in: [library, cli, service, spec]}
    - {path: readme:entrypoint, minCount: 1, resolves: path}
    - {path: readme:verifiedCommand, minCount: 1, resolves: ci-step}
    - {path: readme:section, minCount: 3}
    - {path: readme:contractCount, maxCount: 1, resolves: census}

equations:
  claim_resolves:
    formula: "∀ c ∈ claims(README.md): normalise(c) ∈ run_lines(merge_path_workflows)"
    domain: every command line of every claim fence in README.md
    codomain: readme:verifiedCommand values, or a PV-ONT-012 refusal naming the command
    invariants:
      - a claim is decided by its fence's info token, never by its content
      - an unresolved claim is refused by name, never skipped
    preconditions:
      - .github/workflows/*.yml parse
    postconditions:
      - the committed readme.verified_commands[] equals the live set (F-33)
    lean_theorem: "none — L4 not declared"

invariants:
  - id: RDM-INV-001
    property: every README claim-fence command is one a merge-path workflow runs
    formal: '∀ c ∈ claims(README.md): normalise(c) ∈ run_lines(W_merge)'
    prose: false
  - id: RDM-INV-002
    property: the printed contract count equals the census
    formal: 'frontmatter(README.md).contract_count ≡ census.json.n_files'
    prose: false

falsification_tests:
  - id: FALSIFY-RDM-001
    rule: an unrun claim is refused
    prediction: >
      adding a bash fence to README.md whose command no workflow runs makes `pv lint contracts/ --gate shapes`
      exit 1 naming `readme:verifiedCommand unresolved: <cmd>`; relabelling it `text` makes it pass again
    test: cargo test -p aprender-contracts --lib ontology::extract::readme
    if_fails: the README can advertise a command nothing has ever run
