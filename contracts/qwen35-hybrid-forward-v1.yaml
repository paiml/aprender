metadata:
  version: 1.0.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: Qwen3.5 hybrid forward pass — attention/GDN layer interleaving with
    numerical stability
  references:
  - Qwen3.5 Technical Report — hybrid architecture layer schedule
  - Yang et al. (2024) Gated Delta Networks
  - Zhang & Sennrich (2019) Root Mean Square Layer Normalization
  depends_on:
  - attention-kernel-v1
  - gated-delta-net-v1
  - rmsnorm-kernel-v1
  - swiglu-kernel-v1
  - qk-norm-v1
  - hybrid-layer-dispatch-v1
equations:
  attention_sublayer:
    formula: y = x + attn(qk_norm(q_proj(rmsnorm(x))), kv_proj(rmsnorm(x)))
    domain: x ∈ R^{seq_len × d_model}, attention layer with QK-norm
    invariants:
    - shape(y) = shape(x)
    - QK-norm applied before attention score computation
    - Residual connection preserves gradient flow
    preconditions:
    - q.len() > 0
    - k.len() == v.len()
    lean_theorem: Theorems.Attention_Sublayer
  gdn_sublayer:
    formula: y = x + gdn(conv1d(rmsnorm(x)))
    domain: x ∈ R^{seq_len × d_model}, linear attention layer
    invariants:
    - shape(y) = shape(x)
    - Causal conv1d before GDN recurrence
    - Residual connection preserves gradient flow
    preconditions:
    - 'input.len() > 0'
    - hidden_size > 0
    lean_theorem: Theorems.Gdn_Sublayer
  ffn_sublayer:
    formula: y = x + swiglu(rmsnorm(x))
    domain: x ∈ R^{seq_len × d_model}, shared across both layer types
    invariants:
    - shape(y) = shape(x)
    - SwiGLU uses gate/up projections
    - Down projection restores d_model dimension
    preconditions:
    - 'input.len() > 0'
    - hidden_size > 0
    lean_theorem: Theorems.Ffn_Sublayer
  hybrid_block:
    formula: block_l(x) = ffn_sublayer(attn_or_gdn_sublayer_l(x))
    domain: Complete transformer block at layer l
    invariants:
    - Always attention_sublayer OR gdn_sublayer, never both
    - FFN sublayer is identical regardless of attention type
    - Output shape equals input shape
    preconditions:
    - 'input.len() > 0'
    - num_layers > 0
    lean_theorem: Theorems.Hybrid_Block
  activation_magnitude:
    formula: '∀l, ∀i: is_finite(h_l[i])  (no NaN, no ±Inf in any hidden-state coordinate)'
    domain: Hidden state magnitude through L layers
    invariants:
    - Magnitude bounded (no explosion)
    - Magnitude non-zero (no vanishing)
    - RMSNorm prevents unbounded growth per layer
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Activation_Magnitude
  gradient_flow:
    formula: ∂L/∂h_0 = Σ_l (∂L/∂h_l * ∂h_l/∂h_0) with skip connections
    domain: Gradient through residual stream
    invariants:
    - Direct gradient path through residual (identity Jacobian)
    - Each sublayer adds gradient contribution
    - QK-norm stabilizes attention gradient
    preconditions:
    - grad_output.len() > 0
    - grad_output.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Gradient_Flow
proof_obligations:
- id: QHF-INV-001
  type: invariant
  property: Attention sublayer shape preservation
  formal: '∀x: shape(attention_sublayer(x)) = shape(x)'
  applies_to: all
- id: QHF-INV-002
  type: invariant
  property: GDN sublayer shape preservation
  formal: '∀x: shape(gdn_sublayer(x)) = shape(x)'
  applies_to: all
- id: QHF-INV-003
  type: invariant
  property: FFN sublayer shape preservation
  formal: '∀x: shape(ffn_sublayer(x)) = shape(x)'
  applies_to: all
- id: QHF-INV-004
  type: invariant
  property: Block outputs from exactly one attention type
  formal: '∀l: is_attention(l) XOR is_gdn(l)'
  applies_to: all
- id: QHF-BND-005
  type: bound
  property: Activation magnitude bounded
  formal: '∀l ∈ [0, L], ∀i: is_finite(h_l[i])  (no NaN, no +Inf, no -Inf)'
  applies_to: all
  note: >-
    The previous formal ('∀l: ||h_l||_inf <= M for finite M') was vacuous:
    "some finite M" only asserts finiteness. It is restated as explicit
    per-coordinate finiteness, which is what FALSIFY-QHF-005 ("No NaN/Inf
    after 48 layers") tests. A quantitative growth bound is deferred until
    the growth ratio ||h_l||_inf / ||h_0||_inf is measured on the reference
    model; no bound is stated here.
- id: QHF-INV-006
  type: invariant
  property: RMSNorm precedes each sublayer
  formal: 'pre-norm architecture: norm before attention/GDN and before FFN'
  applies_to: all
- id: QHF-CON-007
  type: conservation
  property: Residual identity component
  formal: h_{l+1} - h_l = sublayer(norm(h_l))
  tolerance: 1.0e-06
  applies_to: all
- id: QHF-GPU-008
  type: invariant
  property: 'Gated DeltaNet on the device equals an EXACT-ARITHMETIC reference per op, per layer and per token — dequantized f32 weights, f32 dots — not the production CPU forward, which quantizes activations to Q8_K before its Q4_K matvec (measured 2.95e-3 per projection from exact on 0.8B, 2026-09-19) and so cannot be a 1e-3 oracle for a correct device path'
  formal: '∀ l ∈ gdn_layers, ∀ t: ‖S_l^{gpu}(t) − S_l^{exact}(t)‖_∞ ≤ 1e-3 · ‖S_l^{exact}(t)‖_∞ ∧ ‖y_l^{gpu}(t) − y_l^{exact}(t)‖_∞ ≤ 1e-3 · ‖y_l^{exact}(t)‖_∞'
  tolerance: 1.0e-03
  applies_to: all
- id: QHF-GPU-009
  type: invariant
  property: 'End to end against the PRODUCTION CPU forward the device decodes the same token at every position and its logits stay on the CPU''s ray: identical argmax and a cosine floor, the same shape as the F2 runtime parity guard (apr-cpu-vs-gpu-output-parity-v1). The floor is a MEASURED number: 0.999 is the expected value at 2026-09-19 and is replaced by the value the 0.68.2 receipt records, never loosened below the F2 catastrophic line 0.90'
  formal: '∀ t ∈ positions(prompt): argmax(logits^{gpu}(t)) = argmax(logits^{cpu}(t)) ∧ cos(logits^{gpu}(t), logits^{cpu}(t)) ≥ 0.999'
  tolerance: 1.0e-03
  applies_to: all
falsification_tests:
- id: FALSIFY-QHF-001
  rule: Attention sublayer shape
  prediction: Output shape equals input shape
  test: proptest with random d_model and seq_len
  if_fails: Projection dimension mismatch in attention
- id: FALSIFY-QHF-002
  rule: GDN sublayer shape
  prediction: Output shape equals input shape
  test: proptest with random d_model and seq_len
  if_fails: GDN state dimension mismatch
- id: FALSIFY-QHF-003
  rule: FFN sublayer shape
  prediction: Output shape equals input shape
  test: 'proptest: SwiGLU intermediate 3x then back to d_model'
  if_fails: Down projection wrong dimension
- id: FALSIFY-QHF-004
  rule: Exclusive layer type
  prediction: Each layer is attention XOR GDN
  test: 'proptest: verify layer_type exhaustive partition'
  if_fails: Layer assigned both types
- id: FALSIFY-QHF-005
  rule: Activation stability
  prediction: No NaN/Inf after 48 layers
  test: 'proptest: random input through mock layer stack'
  if_fails: Numerical instability in deep composition
- id: FALSIFY-QHF-006
  rule: RMSNorm pre-normalization
  prediction: RMSNorm applied before attention/GDN and before FFN
  test: 'proptest: verify norm(h) fed to sublayer, not raw h'
  if_fails: Missing pre-norm before sublayer
- id: FALSIFY-QHF-007
  rule: Residual stream correctness
  prediction: h_{l+1} - h_l = sublayer(norm(h_l))
  test: 'proptest: verify residual arithmetic'
  if_fails: Residual not purely additive
- id: FALSIFY-QHF-008
  rule: The device GDN path is measured where generation runs, on both fleet silicons
  prediction: "`apr qa Qwen3.5-0.8B-Q4_K_M.gguf` golden_output passes on GPU and `apr run --gpu` prints no `[qwen35: Gated DeltaNet runs on the CPU` notice, on lambda (sm_89) and gx10 (sm_121)"
  test: "bash scripts/check_model_ladder.sh — rung qwen35-0.8b-q4km, backend cuda, both required hosts (receipts under evidence/dogfood/models/<version>/)"
  if_fails: "the GDN device kernels (causal conv1d, gated delta-rule recurrence with per-layer state, gated RMSNorm, per-head L2 norm, partial-NEOX rope) diverge from forward_qwen35.rs or never ran — at f4c0daa37 no device path existed and the rung claimed cpu only (#3090, EPIC #3477)"
- id: FALSIFY-QHF-009
  rule: The device path is judged per op against exact arithmetic and end to end against production, not per op against a quantized CPU
  prediction: "qwen35_cuda_the_parity_floor_is_the_cpu_references_own_activation_quantization passes (every GDN and attention op ≤ 1e-3 relative to the dequantized-f32 exact reference; the sigmoid-gate mutant turns it RED), and on Qwen3.5-0.8B-Q4_K_M a 6-token prompt gives identical argmax at every position with per-position cosine ≥ 0.999 between the device and the production CPU logits, on lambda (sm_89) and gx10 (sm_121)"
  test: "cargo test -p aprender-serve --features cuda qwen35_cuda_the_parity_floor -- --nocapture && apr qa Qwen3.5-0.8B-Q4_K_M.gguf --json (gpu-cpu parity gate, per position: argmax match ∧ cos ≥ 0.999)"
  if_fails: "either a device op is wrong (per-op exact check names the op) or the composed forward drifts (argmax flip or cosine below the measured floor names the position); a check that demanded device == quantized-CPU at 1e-3 could only be passed by an implementation reproducing the CPU's Q8_K activation error, which is not correctness (#3090, EPIC #3477)"
kani_harnesses:
- id: KANI-QHF-001
  obligation: QHF-INV-001
  property: Shape preservation through hybrid block
  bound: 4
  strategy: bounded_int
  solver: cadical
  harness: verify_hybrid_block_shapes
- id: KANI-QHF-002
  obligation: QHF-INV-004
  property: Layer type exclusivity
  bound: 48
  strategy: exhaustive
  harness: verify_layer_type_partition
- id: KANI-QWEN35-003
  obligation: QHF-INV-001
  property: Attention sublayer shape preservation
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-004
  obligation: QHF-INV-002
  property: GDN sublayer shape preservation
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-005
  obligation: QHF-INV-003
  property: FFN sublayer shape preservation
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-006
  obligation: QHF-INV-004
  property: Block outputs from exactly one attention type
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-007
  obligation: QHF-BND-005
  property: Activation magnitude bounded
  bound: 8
  strategy: stub_float
- id: KANI-QWEN35-008
  obligation: QHF-INV-006
  property: RMSNorm precedes each sublayer
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-009
  obligation: QHF-CON-007
  property: Residual identity component
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-QHF-001
  name: Qwen3.5 Hybrid Forward Contract
  description: Hybrid attention/GDN forward pass quality gate
  checks:
  - attention_sublayer
  - gdn_sublayer
  - ffn_sublayer
  - hybrid_block
  - activation_magnitude
  - gradient_flow
  pass_criteria: All 8 falsification tests pass; FALSIFY-QHF-008 is read from the per-host ladder receipts
  falsification: Remove RMSNorm before attention to trigger gradient explosion
