# ──────────────────────────────────────────────
# bin-aprender-train-bench--aprender-train-bench-v1 — the `aprender-train-bench` bin target of package aprender-train-bench (ONT-10 slice S17)
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes live in
# binary-surface-v1; this file restates none of them. Measured 2026-09-26 on a 0.69.3 build of this tree.
#   Was RED beyond G0.1: the version named "entrenar-bench", not the bin name. FIXED on batch/ont-10 (2026-09-27):
#   clap name aprender-train-bench (measured after the fix: "aprender-train-bench 0.69.3"); cli_surface_gate pins the prefix.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-train-bench--aprender-train-bench-v1
version: "1.0.0"
scope: >
  The command surface of the `aprender-train-bench` binary (package aprender-train-bench, src crates/aprender-train-bench/src/main.rs): its help, its usage errors, its
  version string, its subcommand set, its rejection of unusable input, and its surface-audit rows. Out of scope:
  what each subcommand computes.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    aprender-train-bench answers --help, rejects an unknown flag or subcommand as a usage error, exposes exactly the subcommands
    the snapshot records, rejects unusable input without a panic, and has an audited ledger row for each command.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'contracts/bin-aprender-contracts-cli--pv-v1.yaml — the exemplar'
    - 'crates/aprender-train-bench/tests/cli_surface_gate.rs — the gate every falsifier below runs'
    - 'docs/audits/surface_audit.csv — the rows whose binary column is aprender-train-bench'
    - 'aprender#4502 — ONT-10, slice S17'

entity:
  type: binary
  ref: binary/aprender-train-bench/aprender-train-bench

relations:
  depends_on: [binary-surface-v1]

equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(aprender-train-bench)) = subcommands(clap(Cli)) = SUBCOMMANDS(crates/aprender-train-bench/tests/cli_surface_gate.rs) ∧ leaves(aprender-train-bench) = {f.feature : f ∈ surface_audit, f.binary = aprender-train-bench}"
    domain: "the aprender-train-bench line of the tracked snapshot, the clap Command enum, the gate's pinned list, and the ledger rows with binary = aprender-train-bench"
    codomain: "set equality, or a Fail naming each command in the symmetric difference"
    invariants:
      - "a subcommand clap accepts and the snapshot omits is an unaudited surface"
      - "measured 2026-09-26: top-level = {temperature, alpha, compare, ablation, cost-performance, recommend}; 6 leaves, set-equal to the 6 ledger rows"
    preconditions:
      - "the snapshot was written at this commit"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `aprender-train-bench --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-APRENDER-TRAIN-BENCH-INV-001
    property: every aprender-train-bench command leaf has an audited ledger row
    formal: '∀ c ∈ leaves(aprender-train-bench): |{r ∈ surface_audit : r.binary = aprender-train-bench ∧ r.feature = "aprender-train-bench " ++ c}| ≥ 1'
    prose: false
  - id: BIN-APRENDER-TRAIN-BENCH-INV-002
    property: unusable input is a clean rejection, never a success and never a panic
    formal: '∀ a ∈ rejection_rows(crates/aprender-train-bench/tests/cli_surface_gate.rs): exit(a) ∉ {0, 101} ∧ "panicked" ∉ stderr(a)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-APRENDER-TRAIN-BENCH-001
    rule: 'G1.2 help answers'
    prediction: '`aprender-train-bench --help` exits 0 and advertises ≥1 subcommand; every advertised `<cmd> --help` exits 0'
    test: 'cargo test -p aprender-train-bench --test cli_surface_gate every_advertised_subcommand_is_reachable'
    if_fails: 'the binary cannot describe its own surface, or advertises a command it cannot reach (observed 2026-09-26: GREEN)'
    mutation: 'make one subcommand''s --help return an error; must turn RED naming it'
  - id: FALSIFY-BIN-APRENDER-TRAIN-BENCH-002
    rule: 'G1.2 an unknown flag or subcommand is a usage error'
    prediction: '`aprender-train-bench --no-such-flag` and `aprender-train-bench no-such-subcommand` each exit 2'
    test: 'cargo test -p aprender-train-bench --test cli_surface_gate unknown_'
    if_fails: 'a typo is silently ignored (observed 2026-09-26: both exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-APRENDER-TRAIN-BENCH-003
    rule: 'G0.1 the version names the commit'
    prediction: '`aprender-train-bench --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands. cargo test -p aprender-train-bench --test cli_surface_gate version_reports_the_crate_version pins the "aprender-train-bench <version>" prefix, not the sha'
    if_fails: 'sha: LIVE RED on 0.69.3 (a stale aprender-train-bench reads as HEAD), clears at rc.1 (car/0.70.0 carries #4219); name: FIXED on batch/ont-10 (was "entrenar-bench 0.69.3")'
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-APRENDER-TRAIN-BENCH-004
    rule: 'G1.3/G1.4 the command set equals the snapshot'
    prediction: 'the advertised top-level subcommands are exactly temperature, alpha, compare, ablation, cost-performance, recommend'
    test: 'cargo test -p aprender-train-bench --test cli_surface_gate advertised_subcommands_are_the_pinned_surface'
    if_fails: 'a subcommand was added or removed without updating the pinned surface (observed 2026-09-26: GREEN)'
    mutation: 'add a subcommand without editing SUBCOMMANDS; must turn RED naming it'
  - id: FALSIFY-BIN-APRENDER-TRAIN-BENCH-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 row with binary = aprender-train-bench per leaf (6 rows for 6 leaves on 2026-09-26)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'aprender-train-bench ships a command with no audited row'
    mutation: 'delete every aprender-train-bench row; must turn RED naming aprender-train-bench'
  - id: FALSIFY-BIN-APRENDER-TRAIN-BENCH-006
    rule: 'unusable input is rejected cleanly'
    prediction: '`ablation -c`, `cost-performance --results` and `recommend --results` on a missing, empty and garbage input: each exits non-zero, not 101, with no "panicked" on stderr'
    test: 'cargo test -p aprender-train-bench --test cli_surface_gate unusable_input_is_rejected'
    if_fails: 'MEASURED 2026-09-26 (aprender-01): GREEN on an unmutated tree; no source mutation was run for this binary'
    mutation: 'make a rejection path return Ok(()) or unwrap the read; must turn RED on that row'
