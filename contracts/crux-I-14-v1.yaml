# CRUX-I-14 — MCP prompt provider

metadata:
  id: CRUX-I-14
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "I — Observability & Metrics"
  competitor: ecosystem
  demand_score: 3
  intake_status: missing
  description: >
    MCP prompt provider: expose parameterized prompt templates over MCP.
    Canonical: MCP spec prompts/list + prompts/get verbs; prompts
    declare {name, description, arguments:[{name, required}]} and
    `prompts/get` renders the template with provided argument values,
    returning a list of messages.

equations:
  mcp_prompt:
    formula: |
      prompts/list → [ { name, description, arguments: [ {name, required} ] } ]
      prompts/get { name, arguments } →
        messages = [ { role, content: {type:"text", text: render(template, arguments)} } ]
      # missing required arg → JSON-RPC error -32602 (invalid params)
    domain: "(templates: [PromptTemplate], args: dict)"
    codomain: "JSON-RPC 2.0 response with messages array"
    invariants:
    - "missing required arg → error code -32602 (JSON-RPC Invalid params)"
    - "rendered text is deterministic for same (template, arguments)"
    - "prompts/list declared arguments match prompts/get rejection set"

falsification_tests:
- id: FALSIFY-CRUX-I-14-001
  rule: missing required argument produces JSON-RPC -32602
  prediction: "get without required arg returns error.code == -32602"
  test: |
    set -euo pipefail
    apr mcp call --method prompts/get \
      --params '{"name":"apr-qa-summary","arguments":{}}' --once > /tmp/err.json
    python3 -c "
    import json; d=json.load(open('/tmp/err.json'))
    assert d['error']['code'] == -32602, d
    "
- id: FALSIFY-CRUX-I-14-002
  rule: deterministic render for fixed arguments
  prediction: "two prompts/get calls with same args yield identical messages"
  test: |
    set -euo pipefail
    for i in 1 2; do
      apr mcp call --method prompts/get \
        --params '{"name":"apr-qa-summary","arguments":{"model":"tiny.apr"}}' \
        --once > /tmp/p$i.json
    done
    diff <(jq -S .result.messages /tmp/p1.json) \
         <(jq -S .result.messages /tmp/p2.json)
- id: FALSIFY-CRUX-I-14-003
  rule: list arguments match get validation
  prediction: "every required arg from prompts/list is rejected when omitted in prompts/get"
  test: |
    set -euo pipefail
    apr mcp call --method prompts/list --once > /tmp/pl.json
    python3 << 'PY'
    import json, subprocess
    lst = json.load(open('/tmp/pl.json'))['result']['prompts']
    for p in lst:
        required = [a['name'] for a in p.get('arguments', []) if a.get('required')]
        if not required: continue
        r = subprocess.run(['apr','mcp','call','--method','prompts/get',
          '--params', json.dumps({'name':p['name'],'arguments':{}}),'--once'],
          capture_output=True, text=True, check=True)
        resp = json.loads(r.stdout)
        assert resp.get('error',{}).get('code') == -32602, (p['name'], resp)
    PY

proof_obligations:
- type: parity
  property: "apr mcp prompts verbs match MCP spec JSON-RPC 2.0 shape"
- type: invariant
  property: "missing required arg → JSON-RPC -32602 (fail closed)"
- type: invariant
  property: "deterministic rendering under fixed arguments"

