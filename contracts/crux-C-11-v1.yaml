equations:
  tool_call_response_schema:
    formula: |
      POST /v1/chat/completions with:
        tools: [{"type":"function","function":{"name":str,"parameters":JSONSchema}}, ...]
        tool_choice: "auto" | {"type":"function","function":{"name":str}}
      Response MUST contain:
        choices[0].message.tool_calls[] : array (len >= 1 when model invokes a tool)
        choices[0].message.tool_calls[i].id   : string
        choices[0].message.tool_calls[i].type : "function"
        choices[0].message.tool_calls[i].function.name      : string (matches a provided tool.function.name)
        choices[0].message.tool_calls[i].function.arguments : string (JSON-parseable)
        choices[0].finish_reason : "tool_calls"
      Ref: https://platform.openai.com/docs/guides/function-calling
    domain: POST /v1/chat/completions with tools[]
    codomain: JSON response with tool_calls[]
    invariants:
    - "tool_calls[i].function.arguments parses as valid JSON"
    - "parsed(arguments) validates against the declared tool.function.parameters JSON schema"
    - "tool_calls[i].function.name ∈ { tool.function.name : tool ∈ request.tools }"
    - "finish_reason == 'tool_calls' when response contains tool_calls"

  no_tools_passthrough:
    formula: |
      When tools is absent or [], response.choices[0].message.tool_calls
      MUST be null/absent and finish_reason MUST be "stop" or "length".
    domain: POST /v1/chat/completions without tools
    codomain: JSON response
    invariants:
    - "tool_calls not synthesized when tools[] not provided"

falsification_tests:
- id: FALSIFY-CRUX-C-11-001
  rule: tool_calls schema parity with OpenAI
  prediction: "Response contains choices[0].message.tool_calls[].function.{name,arguments}"
  test: |
    set -euo pipefail
    cat > /tmp/tool-req.json <<'EOF'
    {
      "model": "tiny",
      "messages": [{"role":"user","content":"what is the weather in Paris?"}],
      "tools": [{
        "type":"function",
        "function":{
          "name":"get_weather",
          "parameters":{
            "type":"object",
            "properties":{"location":{"type":"string"}},
            "required":["location"]
          }
        }
      }],
      "tool_choice":"auto"
    }
    EOF
    R=$(curl -s http://localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d @/tmp/tool-req.json)
    echo "$R" | jq -e '.choices[0].message.tool_calls[0].function.name == "get_weather"' >/dev/null
    echo "$R" | jq -e '.choices[0].message.tool_calls[0].function.arguments | type == "string"' >/dev/null
    echo "$R" | jq -e '.choices[0].finish_reason == "tool_calls"' >/dev/null
  if_fails: "apr /v1/chat/completions does not emit OpenAI-shaped tool_calls[]; client integrations broken"

- id: FALSIFY-CRUX-C-11-002
  rule: arguments are valid JSON matching parameter schema
  prediction: "tool_calls[0].function.arguments parses as JSON and satisfies tool.parameters schema"
  test: |
    set -euo pipefail
    R=$(curl -s http://localhost:8080/v1/chat/completions -H 'Content-Type: application/json' -d @/tmp/tool-req.json)
    ARGS=$(echo "$R" | jq -r '.choices[0].message.tool_calls[0].function.arguments')
    python3 - <<PY
    import json, jsonschema, sys
    args = json.loads('''$ARGS''')
    schema = {
        "type":"object",
        "properties":{"location":{"type":"string"}},
        "required":["location"]
    }
    jsonschema.validate(args, schema)
    PY
  if_fails: "arguments string is not valid JSON or violates declared parameter schema"

- id: FALSIFY-CRUX-C-11-003
  rule: no tools → no tool_calls
  prediction: "Without tools[], response.tool_calls absent and finish_reason in {stop,length}"
  test: |
    set -euo pipefail
    R=$(curl -s http://localhost:8080/v1/chat/completions -H 'Content-Type: application/json' \
      -d '{"model":"tiny","messages":[{"role":"user","content":"hi"}]}')
    echo "$R" | jq -e '(.choices[0].message.tool_calls // []) | length == 0' >/dev/null
    echo "$R" | jq -e '.choices[0].finish_reason | IN("stop","length")' >/dev/null
  if_fails: "apr emits tool_calls when client did not request them; protocol violation"

proof_obligations:
- type: invariant
  property: "tool_calls[].function.name is drawn from the declared tools[].function.name set"
- type: invariant
  property: "tool_calls[].function.arguments parses as JSON and validates against declared parameter schema"
- type: invariant
  property: "finish_reason == 'tool_calls' whenever tool_calls[] is non-empty"
- type: invariant
  property: "When tools absent, tool_calls is absent/empty and finish_reason ∈ {stop, length}"

