  - id: KANI-TSP-001
    obligation: Wall coverage threshold
    property: Wall coverage threshold
    bound: 8
    strategy: stub_float
  - id: KANI-TSP-002
    obligation: Coverage upper bound
    property: Coverage upper bound
    bound: 8
    strategy: stub_float
  - id: KANI-TSP-003
    obligation: Backward >= forward time
    property: Backward >= forward time
    bound: 8
    strategy: stub_float
  - id: KANI-TSP-004
    obligation: Layer count matches model
    property: Layer count matches model
    bound: 8
    strategy: exhaustive
  - id: KANI-TSP-005
    obligation: Memory BW floor
