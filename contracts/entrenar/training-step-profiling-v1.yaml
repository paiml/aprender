implementation_requirements:
  entrenar_changes:
    - description: Wire BrickProfiler into CudaNf4TransformerBlock::forward
      detail: >
        start_brick(BrickId::RmsNorm) / stop_brick() around each RMSNorm.
        start_brick(BrickId::QkvProjection) around Q/K/V GEMMs.
        start_brick(BrickId::GateProjection) around Gate+Up GEMMs.
        Use PerLayer sync mode to balance accuracy vs overhead.
    - description: Wire BrickProfiler into backward pass
      detail: >
        Same brick instrumentation for backward GEMMs.
        Track gradient computation separately from weight update.
    - description: Export per-layer JSON to canary metrics
      detail: >
        Extend training JSON output with per_layer_profile field.
        Array of {layer: i, forward_us: N, backward_us: N, bricks: {...}}.
    - description: Add --training-profile flag to apr finetune CLI
      detail: >
        When enabled, uses BrickProfiler with PerLayer sync.
        Outputs per-layer timing table + JSON to stderr.

  canary_changes:
    - description: Add canary-apr-profile Makefile target
      detail: >
        Runs canary with --training-profile flag.
        Parses per-layer JSON from output.
        Feeds into score.py for regression detection.

  provable_contracts:
    - description: This contract (training-step-profiling-v1.yaml)
    - description: Falsification test implementations in entrenar

qa_gate:
  id: F-TSP-001
  name: training-step-profiling-v1 Contract
  checks:
    - wall_coverage_threshold
    - per_layer_accounting
    - memory_bw_bottleneck_identification
    - fp16_tensor_core_verification
    - fused_kernel_traffic_reduction
    - cuda_graph_launch_elimination
    - backward_forward_ratio
    - optimizer_overhead
    - transfer_overhead
    - reproducibility
    - profiler_overhead
  pass_criteria: All 12 falsification tests pass
