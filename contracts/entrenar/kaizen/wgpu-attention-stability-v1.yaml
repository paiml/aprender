contract: wgpu-attention-stability-v1
version: 1.0.0
status: implemented
kaizen: 203
description: >
  Attention forward output must not amplify hidden state norm excessively.
  QK-norm required for Qwen3-4B to prevent attention score explosion.
  Without QK-norm, output_norm >> hidden_norm → loss explosion in 3 steps.

invariants:
- id: C-WGPU-ATTN-STABLE-001
  description: Attention output norm bounded relative to input
  preconditions:
  - Hidden input is finite with positive norm
  - QK-norm applied to Q and K before attention scores
  postconditions:
  - output_norm <= 10 * hidden_norm (no amplification explosion)
  - All output values finite
  verified_by:
  - test_attention_forward_basic — output_norm=1.48 vs hidden_norm=1.5 (PASS)
  - Live training lr=1e-4 — loss 14.1→10.5 monotonic decrease (PASS)
  severity: critical

- id: C-WGPU-ATTN-STABLE-002
  description: QK-norm + grad clipping prevent training divergence
  preconditions:
  - Q and K projected from NF4-dequanted weights (large magnitude)
  - Gradient clipping max_norm=1.0 applied before AdamW
  postconditions:
  - Per-head Q and K have unit RMS norm after QK-norm
  - Loss monotonically decreases at lr=1e-4 (no spikes)
  verified_by:
  - Live training — 14.1→13.2→12.2→11.3→10.5 (PASS on AMD W5700X)
  severity: critical

root_cause_analysis:
  five_whys:
  - "Loss explodes 11→17→35 in 3 steps with attention enabled"
  - "Hidden states grow unbounded through 36 residual additions"
  - "Attention output has large norm (NF4-dequanted QKV weights × large hidden)"
  - "Missing QK-norm: Qwen3 uses per-head RMS normalization of Q and K"
  - "Test used small random weights — real model has much larger magnitudes"
  fix: "Add QK-norm (per-head RMS normalization) before computing attention scores"

affected_files:
- path: src/train/transformer_trainer/wgpu_attention.rs
  functions:
  - 'attention_forward: added QK-norm + output norm tracing'
