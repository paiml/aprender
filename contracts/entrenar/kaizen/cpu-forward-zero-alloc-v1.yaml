metadata:
  kind: kaizen
  version: "1.0.0"
  author: "PAIML Engineering"
  description: "cpu-forward-zero-alloc-v1 — kaizen KAIZEN-035 improvement record"
  references:
    - "KAIZEN-035"

contract: cpu-forward-zero-alloc-v1
version: 1.0.0
status: implemented
kaizen: '035'
invariants:
- id: C-FWD-CPU-001
  description: CPU forward path passes token_ids by reference, no allocation
  preconditions:
  - has_gpu_training is false (CPU path)
  - token_ids is a valid &[u32] slice
  postconditions:
  - forward_hidden_dispatch called with borrowed token_ids
  - No Vec<u32> allocation on CPU forward path
  - GPU path still allocates padded Vec (necessary for alignment)
  verified_by:
  - 31 classify_pipeline tests pass, 0 failures
affected_files:
- path: src/finetune/classify_pipeline.rs
  functions:
  - forward_backward_single (line ~2685)
  - forward_only_tokenized (line ~2921)
  change: '- Replaced (padded_tokens, seq_len) tuple with if/else forward call

    - CPU path: forward_hidden_dispatch(token_ids) — borrow, no alloc

    - GPU path: forward_hidden_dispatch(&padded) — padded Vec still needed

    '
performance_note: 'For 50-epoch SSC training (17,942 samples):


  Before:

  - 17,942 × 50 = 897,100 Vec<u32> allocations

  - At ~64 tokens × 4 bytes = 256 bytes each: ~230 MB total allocation


  After:

  - Zero Vec<u32> allocations on CPU path

  - GPU path unchanged (padding still required)

  '
qa_gate:
  id: F-CFZA-001
  name: cpu-forward-zero-alloc-v1 Contract
  description: Quality gate for cpu-forward-zero-alloc-v1
  checks:
  - validation
  - falsification
falsification_tests:
  - id: FALSIFY-CPU-FORWARD-ZERO-ALLOC-001
    description: "C-FWD-CPU-001: CPU forward_backward_single on borrowed token_ids yields a finite training loss"
    test: "cargo test -p aprender-train --lib test_ssc025_train_batch_finite_loss"
    prediction: "train_batch on the CPU path (no GPU training state) returns a finite loss and the borrowed-slice forward produces valid hidden states"
    if_fails: "The CPU branch of forward_backward_single no longer forwards token_ids correctly (wrong slice, truncation or padding leaking into the CPU path)"
  - id: FALSIFY-CPU-FORWARD-ZERO-ALLOC-002
    description: "C-FWD-CPU-001: forward_only_tokenized on the CPU path returns a finite loss and an in-range prediction for every label"
    test: "cargo test -p aprender-train --lib test_cov4_forward_only_all_labels_tokenized"
    prediction: "For every label 0..num_classes, forward_only_tokenized returns a finite loss and a predicted class < num_classes"
    if_fails: "The borrowed-token CPU forward in forward_only_tokenized is broken; the zero-alloc change altered forward semantics"
