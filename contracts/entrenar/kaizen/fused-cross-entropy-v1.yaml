kernel:
  name: FusedCrossEntropyKernel
  file: trueno-gpu/src/kernels/backward/cross_entropy.rs
  entry_point: fused_cross_entropy
  block_size: 256
  grid: seq_len
  shared_mem: 72
  algorithm: "Phase 1: max(logits[pos]) via grid-stride + multi-warp reduction\nPhase 2: sum(exp(logits[i] - max)) via grid-stride\
    \ + multi-warp reduction\nPhase 3: grad[i] = (softmax(i) - one_hot(target)) * scale\n         loss[pos] = max + log(sum)\
    \ - logits[target]\n"
  numerical: exp via ex2.approx(x * log2e), log via lg2.approx / log2e
preconditions:
- logits_buf has seq_len * vocab_size f32 elements on GPU
- target_ids in [0, vocab_size) for all positions
- scale = (1/seq_len) * grad_scaler * (1/accum_steps)
- OptimKernelCache initialized (init_optim_kernel_cache called)
postconditions:
- grad[pos][i] = (softmax(logits[pos])[i] - one_hot(target[pos])[i]) * scale
- loss = mean(-log(softmax(logits[pos])[target[pos]])) across positions
- grad_logits GpuBuffer stays GPU-resident (no D2H)
- logits_buf not downloaded to host
invariants:
- No logits D2H transfer in training loop
- No grad_logits H2D transfer in training loop
- cpu_loss_and_grad method removed (dead code eliminated)
- CausalLMLoss field removed from CudaTransformerTrainer
- eval_batch also uses fused kernel (no CPU fallback)
