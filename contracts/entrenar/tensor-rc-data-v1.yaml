metadata:
  version: 1.0.0
  created: '2026-03-03'
  author: PAIML Engineering
  description: Tensor data stored behind Rc for O(1) clone — eliminates 16 GB redundant copies per step
  registry: true
  references:
  - 'KAIZEN-019: Tensor::clone() deep-copies data — 16 GB redundant frozen weight copies per step'
  - 'lora-gradient-flow-v1.yaml (KAIZEN-018: backward ops that clone tensors)'
data_sharing:
- id: C-RC-DATA-001
  name: Clone is O(1) reference count bump
  description: 'Tensor::clone() performs Rc::clone on the data field, which is an

    atomic reference count increment (O(1)), NOT a deep copy of the

    Array1<f32> data.  This is critical because every MatmulBackward,

    AddBackward, etc. clones input tensors to hold references for

    gradient computation.


    For Qwen3-4B with batch_size=8:

    Before KAIZEN-019: ~16 GB of redundant frozen weight deep copies per step

    After KAIZEN-019: ~0 bytes (just Rc pointer bumps)

    '
  severity: P0
  critical: true
  verification: test_tensor_clone (existing), cargo check compilation
- id: C-RC-DATA-002
  name: data() returns &Array1<f32> via Rc deref coercion
  description: 'data() returns &Array1<f32> through Rust''s Deref coercion on

    Rc<Array1<f32>>.  All existing code using tensor.data() and

    tensor.data().as_slice() works unchanged.  No API change.

    '
  severity: P1
  critical: true
  verification: All 258 autograd tests pass
- id: C-RC-DATA-003
  name: data_mut() uses Rc::make_mut for copy-on-write
  description: 'data_mut() uses Rc::make_mut(&mut self.data) which:

    - If refcount == 1: returns &mut to existing data (zero copy)

    - If refcount > 1: clones the Array1, stores the clone, returns &mut


    This provides copy-on-write semantics.  During optimizer step,

    parameter tensors typically have refcount=1 (backward ops dropped

    after backward pass), so no copy occurs.  This means the optimizer

    path has zero overhead from the Rc change.

    '
  severity: P0
  critical: true
  verification: test_tensor_data_mut (existing)
backward_compat:
- id: C-RC-COMPAT-001
  name: All existing APIs preserved
  description: 'The public API surface is unchanged:

    - data() -> &Array1<f32>  (unchanged, deref coercion)

    - data_mut() -> &mut Array1<f32>  (unchanged, Rc::make_mut)

    - new(Array1<f32>, bool) -> Self  (unchanged, wraps in Rc internally)

    - from_vec(Vec<f32>, bool) -> Self  (unchanged)

    - len() -> usize  (unchanged, deref coercion)

    - is_empty() -> bool  (unchanged, deref coercion)

    - Clone trait  (now O(1) instead of O(n))


    No consumer code changes required.

    '
  severity: P0
  critical: true
impact:
- id: C-RC-IMPACT-001
  name: Memory savings for training
  description: 'For Qwen3-4B (hidden=2560, 36 layers) with batch_size=8:


    MatmulBackward clones per step (Q/K/V/O projections):

    - 4 projections x 8 samples x 36 layers = 1,152 backward ops

    - Each backward holds clones of both input tensors


    Frozen weight sizes:

    - Q: 2560x2560 = 6.5M floats (26 MB)

    - K: 160x2560 = 410K floats (1.6 MB)

    - V: 160x2560 = 410K floats (1.6 MB)

    - O: 2560x2560 = 6.5M floats (26 MB)


    Before: ~16 GB deep copies per step

    After: ~0 bytes (Rc bumps)


    Wall-clock savings: ~1-2 seconds per step at ~10 GB/s memcpy rate

    '
  severity: P0
  critical: true
proof_obligations:
- id: PO-RC-DATA-001
  name: Clone is O(1) reference count only
  property: 'For all tensors t: Tensor::clone(&t) performs exactly one
    Rc::clone (reference count increment) and zero heap allocations.
    The cloned tensor shares the same underlying Array1<f32> allocation.'
  type: invariant
  severity: P0
  status: specified
- id: PO-RC-DATA-002
  name: Copy-on-write correctness
  property: 'For all tensors t with refcount > 1: data_mut(&mut t) clones
    the underlying Array1<f32> into a new allocation before returning
    &mut, ensuring no aliased mutation. For refcount == 1, no clone occurs.'
  type: invariant
  severity: P0
  status: specified
- id: PO-RC-DATA-003
  name: API backward compatibility
  property: 'For all tensors t: data(&t) returns &Array1<f32> with identical
    semantics to pre-Rc implementation via Deref coercion. No consumer
    code changes required for read-only access patterns.'
  type: equivalence
  severity: P0
  status: specified
kani_harnesses:
- id: KH-RC-DATA-001
  name: verify_clone_shares_allocation
  description: 'Create a tensor, clone it, and verify both point to the same
    heap allocation (data pointer equality) and that Rc::strong_count == 2.'
  obligation: PO-RC-DATA-001
  bound: 8
  status: specified
- id: KH-RC-DATA-002
  name: verify_copy_on_write_isolation
  description: 'Create a tensor, clone it, call data_mut on the clone, and
    verify the original tensor data is unchanged while the clone has
    a new independent allocation with Rc::strong_count == 1.'
  obligation: PO-RC-DATA-002
  bound: 8
  status: specified
falsification_tests:
- id: FT-RC-DATA-001
  rule: Clone is O(1) reference count only
  prediction: Cloning 10M-element tensor takes < 1us with no new allocation
  test: Clone tensor, measure time, check Rc::strong_count == 2
  if_fails: Clone is doing deep copy instead of Rc increment
- id: FT-RC-DATA-002
  rule: Copy-on-write isolation
  prediction: data_mut on shared tensor clones data, isolating mutation
  test: Clone twice (refcount=3), call data_mut, verify isolation
  if_fails: data_mut not triggering COW when refcount > 1
equations:
  identity:
    formula: f(x) = x
    preconditions:
    - a.len() > 0
    - b.len() > 0
    lean_theorem: Theorems.Identity
qa_gate:
  id: F-TRDV-001
  name: tensor-rc-data-v1 Contract
  description: 'Quality gate for Tensor data stored behind Rc for O(1) clone — eliminates 16 '
  checks:
  - validation
  - falsification
