  demand_score: 4  # 1..5, high priority in pmat work
  intake_status: missing
  description: >
    KV-cache utilization timeline. Root-cause workflow from vllm PagedAttention
    metrics (`gpu_cache_usage_perc`, `num_tokens_per_block`, preemptions) — emits
    a per-step time series of KV-cache block usage, fragmentation, and preemption
    events. Needed to tune `max_num_seqs`, `block_size`, `gpu_memory_utilization`.
    aprender equivalent: `apr profile --kv-timeline --prompt FILE --json`.
  references:
  - "https://github.com/vllm-project/vllm/blob/main/vllm/core/block_manager_v2.py"
  - "https://docs.vllm.ai/en/latest/serving/metrics.html"
  - "https://arxiv.org/abs/2309.06180  # PagedAttention"

equations:
  kv_timeline_schema:
    formula: |
      apr profile --kv-timeline --json emits:
        timeline: list of {step: u64, t_ms: f64, used_blocks: u64, free_blocks: u64,
                           used_pct: f64, active_seqs: u64, preempted_seqs: u64}
        block_size_tokens: u64 > 0
        total_blocks: u64 > 0
        peak_used_pct: f64 ∈ [0.0, 1.0]
        preemption_count: u64 >= 0
    domain: (model, prompt_batch, decode_steps)
    codomain: JSON timeline
    invariants:
    - "used_blocks + free_blocks == total_blocks for every step"
    - "used_pct == used_blocks / total_blocks ± 1e-9"
    - "peak_used_pct == max(timeline[*].used_pct)"
    - "preemption_count == sum(timeline[*].preempted_seqs)"

  block_accounting_conservation:
    formula: |
      No block is both free and used; no block is allocated twice:
        used_blocks(t) <= total_blocks for all t
        allocations(t) − frees(t) == used_blocks(t) − used_blocks(t-1)
    domain: (step t, block pool)
    codomain: bool
    invariants:
    - "No double-count; no leaked blocks"
    - "Allocation delta matches alloc−free flux each step"

  preemption_triggers_on_saturation:
    formula: |
      preempted_seqs(t) > 0 IMPLIES used_pct(t) >= preempt_threshold
      (default 0.95 in vllm).
    domain: step t
    codomain: bool
    invariants:
    - "Preemptions only occur when cache is near-saturated"
    - "Preemption without saturation indicates scheduler bug"

falsification_tests:
- id: FALSIFY-CRUX-F-06-001
  rule: timeline schema complete
  prediction: "apr profile --kv-timeline --json emits block accounting at every step"
  test: |
    # TODO: implement after `apr profile --kv-timeline` lands (crux-crux-f-06)
    apr profile --kv-timeline --prompt test.txt --max-tokens 64 --json > /tmp/kv.json
    jq '.timeline | map(has("used_blocks") and has("free_blocks") and has("used_pct")) | all' /tmp/kv.json \
      | grep -q true
  if_fails: "timeline entries missing block accounting fields"

- id: FALSIFY-CRUX-F-06-002
  rule: block conservation
  prediction: "used + free == total for every step"
  test: |
    apr profile --kv-timeline --prompt test.txt --json > /tmp/kv.json
    python3 -c "
    import json
    d = json.load(open('/tmp/kv.json'))
    T = d['total_blocks']
    for s in d['timeline']:
        assert s['used_blocks'] + s['free_blocks'] == T, f'{s}'
    "
  if_fails: "block conservation broken — used + free != total"

- id: FALSIFY-CRUX-F-06-003
  rule: preemption occurs only near saturation
  prediction: "preempted_seqs > 0 implies used_pct >= 0.95"
  test: |
    # TODO: requires controlled saturation test
    apr profile --kv-timeline --prompt saturating.txt --max-num-seqs 64 --json > /tmp/kv.json
    python3 -c "
    import json
    d = json.load(open('/tmp/kv.json'))
    for s in d['timeline']:
        if s['preempted_seqs'] > 0:
            assert s['used_pct'] >= 0.95, f'preempt without saturation: {s}'
    "
  if_fails: "preemption triggered below 95% cache utilization"

- id: FALSIFY-CRUX-F-06-004
  rule: peak_used_pct == max(timeline.used_pct)
  prediction: "peak matches timeline max"
  test: |
    apr profile --kv-timeline --prompt test.txt --json > /tmp/kv.json
    python3 -c "
    import json
    d = json.load(open('/tmp/kv.json'))
    peak = max(s['used_pct'] for s in d['timeline'])
    assert abs(d['peak_used_pct'] - peak) < 1e-9
    "
  if_fails: "peak_used_pct does not equal timeline max"

proof_obligations:
- type: invariant
  property: "timeline schema includes used/free blocks, used_pct, preemptions per step"
- type: invariant
