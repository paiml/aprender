contract: beat-sklearn-minmax-speed
metadata:
  kind: beat-benchmark
  version: "1.0.0"
  description: >
    Pillar-1 BEAT benchmark: aprender MinMaxScaler fit_transform must be
    comfortably FASTER than scikit-learn's MinMaxScaler on the same data, same
    host, same run. MinMaxScaler is pure O(n·d) per-column min/max + rescale with
    NO LAPACK/BLAS — apr's SIMD turf vs numpy's per-op overhead. The beat is gated
    on the RELATIVE ratio apr_ms/sklearn_ms so it is robust to CI-host speed
    variance (a slow runner slows both sides). Runs nightly (needs uv +
    scikit-learn), not per-PR.
  references:
  - "docs/specifications/campaign-ev-reprioritization-2026-06-12.md"
  - "crates/aprender-core/tests/beat_sklearn_minmax_speed.rs"
  - "crates/aprender-core/src/preprocessing/mod.rs"
version: 1
status: enforced
date: 2026-06-14

beat:
  pillar: 1
  incumbent: scikit-learn
  incumbent_pinned: "2026-06-14 via uv run --with scikit-learn (sklearn.preprocessing.MinMaxScaler)"
  canonical_task: >
    MinMaxScaler fit_transform on make_regression(n_samples=200000,
    n_features=50, noise=0.1, seed=42) features. apr and scikit-learn are timed on
    the SAME generated data, SAME host, SAME run (median of 5 + warmup); the metric
    is the relative ratio apr_ms / sklearn_ms.
  metric: wall_clock_ratio_apr_over_sklearn
  direction: lower_is_better
  baseline_value: 1.0000      # sklearn is the 1.0 reference (apr/sklearn vs itself)
  baseline_floor: 0.6480      # measured apr/sklearn ~0.65 (apr ~1.54x faster)
  beat_threshold: 0.8000      # apr must stay <= 0.80 (>= 1.25x faster) — margin vs 0.65
  baseline_sourced_date: "2026-06-14"
  approved_compute: CPU
  ci_gate_name: "beat_sklearn_minmax_speed"

proof_obligations:
- id: OBLIG-MINMAX-SPEED-RATIO
  statement: >
    On the canonical task, apr_ms / sklearn_ms <= beat_threshold (0.80) measured
    same-host/same-run as the median of 5 timed iterations after a warmup.
  type: bound

falsification_tests:
- id: FALSIFY-BEAT-SKLEARN-MINMAXSCALER-SPEED
  description: >
    The beat is FALSE if apr MinMaxScaler fit_transform is not at least 1.25x
    faster than scikit-learn on the canonical task (ratio > 0.80). The test panics
    with the measured apr_ms / sklearn_ms so a regression is caught.
  command: >
    cargo test -p aprender-core --release --test beat_sklearn_minmax_speed --
    --ignored --nocapture
  expected: "ratio <= 0.80 (apr >= 1.25x faster than scikit-learn MinMaxScaler)"
  if_fails: >
    A regression slowed apr MinMaxScaler fit_transform (preprocessing/mod.rs,
    MinMaxScaler::fit_transform / Transformer impl), or the per-column min/max
    pass lost SIMD vectorization. Compare apr vs sklearn ms in the panic message.
