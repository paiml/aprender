metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    apr-tool-rmedia: Course video renderer with audio cleanup
  contract: apr-tool-rmedia
  status: enforced
  repo: "paiml/rmedia"
  purpose: "Course video renderer with audio cleanup"
  language: "Rust"
  category: active-tool
  topic: paiml-active-tool

inputs:
  - "SVG slides and audio"
outputs:
  - "Rendered video assets"
preconditions:
  - "Repository paiml/rmedia exists and is not archived"
  - "README.md documents purpose and usage"
  - "CI pipeline passes on main branch"
postconditions:
  - "Tool produces documented outputs from documented inputs"
  - "No legacy names in source code imports"
falsification:
  - condition: "gh repo view paiml/rmedia returns archived=true"
    severity: P0
    action: reclassify
  - condition: "README.md missing or empty"
    severity: P0
    action: create_readme
  - condition: "No CI workflow in .github/workflows/"
    severity: P1
    action: add_ci
  - condition: "cargo build fails (Rust) or equivalent build fails"
    severity: P0
    action: fix_build
  - condition: "Zero tests in repository"
    severity: P1
    action: add_tests
