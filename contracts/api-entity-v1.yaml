metadata:
  version: 1.0.0
  created: '2026-04-09'
  author: PAIML Engineering
  registry: true
  references:
  - 'Rust API Guidelines (https://rust-lang.github.io/api-guidelines/)'
  - 'docs.rs metadata configuration (https://docs.rs/about/metadata)'
  - 'tokio public API documentation — calibration benchmark (Grade A)'
  - 'serde public API documentation — calibration benchmark (Grade A)'
  - 'docs/specifications/aprender-contract-entities/api-entity-spec.md'
  description: >
    Public API documentation quality contract for Rust crate libraries.
    Enforces 10 measurable elements across 4 tiers (coverage, quality,
    safety, discoverability) via profile parameterization. Calibrated
    against tokio/serde (Grade A, ~95), polars (~60, Grade D), and
    aprender (~50, Grade F). Machine-checkable (cargo doc, rustdoc
    flags, TOML parse). Complements readme-entity-v1 (project-level docs)
    and repo-entity-v1 (repo structure).

profiles:
  any:
    required: [A1, A4]
    recommended: [A2, A3, A5, A6, A7, A8, A9, A10]
  cli-tool:
    inherits: any
    required: [A1, A4, A5]
    recommended: [A2, A3, A6, A7, A8, A9, A10]
  library:
    inherits: cli-tool
    required: [A1, A2, A3, A4, A5, A6, A9, A10]
    recommended: [A7, A8]
  ml-framework:
    inherits: library
    required: [A1, A2, A3, A4, A5, A6, A7, A8, A9, A10]
    recommended: []

parameters:
  crate_path:
    type: string
    default: crates/aprender-core
  min_doc_coverage:
    type: float
    default: 0.80
  doc_test_timeout:
    type: integer
    default: 300

elements:
  A1:
    name: missing_docs_lint_enabled
    tier: coverage
    check: "warn(missing_docs) or deny(missing_docs) enabled in lib.rs or Cargo.toml lints"
    measurable: "grep 'missing_docs' in lib.rs (#![warn/deny]) or Cargo.toml ([lints] section)"
  A2:
    name: public_items_documented
    tier: coverage
    check: ">= 80% of public items have doc comments"
    measurable: "cargo doc 2>&1 | grep 'missing documentation' | wc -l vs total pub items"
  A3:
    name: doc_examples_present
    tier: coverage
    check: ">= 5% of public functions/methods have # Examples doc sections"
    measurable: "grep -c '# Examples' in src/**/*.rs vs count of pub fn declarations"
  A4:
    name: doctests_compile
    tier: quality
    check: "cargo test --doc exits 0 with no compilation failures"
    measurable: "cargo test --doc 2>&1; check exit code and grep for 'test result: FAILED'"
  A5:
    name: no_broken_intra_doc_links
    tier: quality
    check: "cargo doc with RUSTDOCFLAGS='--deny warnings' exits 0"
    measurable: "RUSTDOCFLAGS='--deny warnings' cargo doc --no-deps 2>&1; check exit code"
  A6:
    name: docs_rs_badge
    tier: quality
    check: "README.md contains docs.rs badge linking to the crate's documentation"
    measurable: "grep 'docs.rs' README.md with badge URL pattern"
  A7:
    name: doc_hidden_on_internals
    tier: safety
    check: "internal modules use #[doc(hidden)] or pub(crate) to hide implementation details"
    measurable: "count pub items not in public API surface vs doc(hidden) annotations"
  A8:
    name: semver_checks_feasible
    tier: safety
    check: "cargo-semver-checks can run without errors on the crate"
    measurable: "cargo semver-checks check-release --package <crate> 2>&1; check exit code"
  A9:
    name: docs_rs_metadata_configured
    tier: discoverability
    check: "[package.metadata.docs.rs] section exists in Cargo.toml with features/targets"
    measurable: "grep 'package.metadata.docs.rs' or 'docs.rs' in Cargo.toml"
  A10:
    name: module_level_docs
    tier: discoverability
    check: "all public modules have //! module-level doc comments"
    measurable: "for each mod.rs or named module: check first line starts with //!"

equations:
  coverage_sufficient:
    formula: |
      forall crate C with profile P:
        missing_docs_lint_enabled(C) AND
        (P not in {library, ml-framework} OR
         documented_pub_items(C) / total_pub_items(C) >= min_doc_coverage) AND
        (P not in {library, ml-framework} OR
         doc_example_count(C) / pub_fn_count(C) >= 0.05)
    domain: "Rust crate source files + Cargo.toml"
    codomain: bool
    invariants:
    - "missing_docs lint catches regressions at compile time"
    - "80% documented items ensures API is learnable"
    - "5% example coverage demonstrates usage for key functions"

  quality_verified:
    formula: |
      forall crate C with profile P:
        doctest_exit_code(C) == 0 AND
        (P == any OR rustdoc_warnings(C) == 0) AND
        (P not in {library, ml-framework} OR docs_rs_badge(C))
    domain: "Rust crate + cargo test --doc + cargo doc output"
    codomain: bool
    invariants:
    - "Doctests that fail to compile mislead users"
    - "Broken intra-doc links cause 404s in published documentation"
    - "docs.rs badge makes documentation one click from README"

  safety_enforced:
    formula: |
      forall crate C with profile P:
        (P not in {library, ml-framework} OR doc_hidden_on_internals(C)) AND
        (P not in {library, ml-framework} OR semver_checks_clean(C))
    domain: "Rust crate public API surface"
    codomain: bool
    invariants:
    - "Internal implementation details should not be part of public API"
    - "Semver-incompatible changes must be caught before publish"

  discoverability_complete:
    formula: |
      forall crate C with profile P:
        (P not in {library, ml-framework} OR docs_rs_metadata_exists(C)) AND
        (P not in {library, ml-framework} OR module_docs_complete(C))
    domain: "Cargo.toml + module source files"
    codomain: bool
    invariants:
    - "docs.rs metadata enables feature flags and target display"
    - "Module-level docs orient users navigating the API hierarchy"

  api_score:
    formula: |
      tier_weight = {coverage: 35, quality: 25, safety: 20, discoverability: 20}

      forall element E in {A1..A10}:
        element_weight(E) =
          tier_weight[tier(E)] / |elements_in_tier(E)|
          * (if E in required(profile) then 1.0
             elif E in recommended(profile) then 0.5
             else 0.0)

      raw_score = sum(gate(E) * element_weight(E) for E in {A1..A10})
      max_score = sum(element_weight(E) for E in {A1..A10})
      api_score = round(raw_score / max_score * 100)

      verdict = if api_score >= 90 then A
                elif api_score >= 80 then B
                elif api_score >= 70 then C
                elif api_score >= 60 then D
                else F
    domain: "All gate results + profile + tier weights"
    codomain: "integer in [0, 100]"
    invariants:
    - "Score 0 when no elements present"
    - "Score 100 when all required + recommended elements present"
    - "Coverage tier accounts for 35% of total weight — documentation must exist first"
    - "Required elements contribute full weight; recommended elements contribute half"
    - "tokio/serde score >= 95 (Grade A) — calibration invariant"
    - "Grade F (<60) means public API is not learnable from docs alone"
    thresholds:
      A: 90
      B: 80
      C: 70
      D: 60
      F: 0

falsification_tests:
- id: F-API-E001
  rule: coverage_sufficient
  element: A1
  prediction: "missing_docs lint is enabled in lib.rs or workspace lints"
  test: |
    CRATE="crates/aprender-core"
    FOUND=0
    if grep -q 'missing_docs' "$CRATE/src/lib.rs" 2>/dev/null; then
      echo "A1 PASS: missing_docs in lib.rs"
      FOUND=1
    fi
    if grep -qP 'missing.docs' Cargo.toml 2>/dev/null; then
      echo "A1 PASS: missing_docs in workspace Cargo.toml"
      FOUND=1
    fi
    if grep -qP 'missing.docs' "$CRATE/Cargo.toml" 2>/dev/null; then
      echo "A1 PASS: missing_docs in crate Cargo.toml"
      FOUND=1
    fi
    test "$FOUND" -eq 1
  if_fails: "missing_docs lint not enabled — new public items silently undocumented"

- id: F-API-E002
  rule: coverage_sufficient
  element: A3
  prediction: "at least 5% of public functions have # Examples doc sections"
  test: |
    python3 -c "
    import os, re

    crate_src = 'crates/aprender-core/src'
    pub_fns = 0
    with_examples = 0

    for root, dirs, files in os.walk(crate_src):
        for f in files:
            if not f.endswith('.rs'):
                continue
            path = os.path.join(root, f)
            content = open(path).read()
            # Count pub fn declarations
            pub_fns += len(re.findall(r'^\s*pub\s+fn\s+', content, re.M))
            # Count # Examples sections in doc comments
            with_examples += len(re.findall(r'///.*#\s*Examples?', content, re.M))

    ratio = with_examples / pub_fns if pub_fns > 0 else 0
    print(f'A3: {with_examples}/{pub_fns} pub fns have examples ({ratio:.1%})')
    exit(0 if ratio >= 0.05 else 1)
    "
  if_fails: "fewer than 5% of public functions have usage examples"

- id: F-API-E003
  rule: quality_verified
  element: A5
  prediction: "cargo doc produces zero warnings (no broken intra-doc links)"
  test: |
    WARNS=$(RUSTDOCFLAGS="-W warnings" cargo doc --no-deps -p aprender 2>&1 | grep -c "warning:" || echo 0)
    echo "A5 rustdoc warnings: $WARNS"
    test "$WARNS" -eq 0
  if_fails: "broken intra-doc links — published docs.rs pages will have dead references"

- id: F-API-E004
  rule: discoverability_complete
  element: A9
  prediction: "docs.rs metadata configured in Cargo.toml"
  test: |
    CRATE="crates/aprender-core"
    if grep -q 'docs.rs' "$CRATE/Cargo.toml" 2>/dev/null; then
      echo "A9 PASS: docs.rs metadata in crate Cargo.toml"
      exit 0
    fi
    if grep -q 'docs.rs' Cargo.toml 2>/dev/null; then
      echo "A9 PASS: docs.rs metadata in workspace Cargo.toml"
      exit 0
    fi
    echo "A9 FAIL: no docs.rs metadata found"
    exit 1
  if_fails: "docs.rs metadata missing — features and targets not displayed on docs.rs"

- id: F-API-E005
  rule: discoverability_complete
  element: A10
  prediction: "all public modules have module-level doc comments"
  test: |
    python3 -c "
    import os, re

    crate_src = 'crates/aprender-core/src'
    total_mods = 0
    documented = 0

    for root, dirs, files in os.walk(crate_src):
        for f in files:
            if f not in ('mod.rs', 'lib.rs'):
                continue
            path = os.path.join(root, f)
            content = open(path).read()
            total_mods += 1
            if content.lstrip().startswith('//!'):
                documented += 1
            else:
                rel = os.path.relpath(path, crate_src)
                print(f'  MISSING: {rel}')

    ratio = documented / total_mods if total_mods > 0 else 0
    print(f'A10: {documented}/{total_mods} modules have //! docs ({ratio:.1%})')
    exit(0 if ratio >= 0.80 else 1)
    "
  if_fails: "module-level docs missing — users cannot navigate the API hierarchy"

- id: F-API-E006
  rule: api_score
  element: all
  prediction: "API docs score >= 90 (grade A) under the project's profile"
  test: |
    python3 -c "
    import sys, os, re, subprocess

    tier_weight = {'coverage': 35, 'quality': 25, 'safety': 20, 'discoverability': 20}
    element_tier = {
        'A1': 'coverage', 'A2': 'coverage', 'A3': 'coverage',
        'A4': 'quality', 'A5': 'quality', 'A6': 'quality',
        'A7': 'safety', 'A8': 'safety',
        'A9': 'discoverability', 'A10': 'discoverability',
    }
    element_name = {
        'A1': 'missing_docs_lint', 'A2': 'public_items_documented',
        'A3': 'doc_examples_present',
        'A4': 'doctests_compile', 'A5': 'no_broken_links',
        'A6': 'docs_rs_badge',
        'A7': 'doc_hidden_internals', 'A8': 'semver_checks',
        'A9': 'docs_rs_metadata', 'A10': 'module_level_docs',
    }
    tier_counts = {}
    for e, t in element_tier.items():
        tier_counts[t] = tier_counts.get(t, 0) + 1

    # profile: ml-framework
    required = {'A1','A2','A3','A4','A5','A6','A7','A8','A9','A10'}
    recommended = set()

    CRATE_SRC = 'crates/aprender-core/src'
    gates = {}

    # A1: missing_docs lint
    lib_rs = open(f'{CRATE_SRC}/lib.rs').read() if os.path.isfile(f'{CRATE_SRC}/lib.rs') else ''
    cargo_toml = open('Cargo.toml').read()
    gates['A1'] = 'missing_docs' in lib_rs or 'missing_docs' in cargo_toml

    # A2: public items documented (>= 80%)
    pub_items = 0; doc_items = 0
    for root, dirs, files in os.walk(CRATE_SRC):
        for f in files:
            if not f.endswith('.rs'): continue
            lines = open(os.path.join(root, f)).readlines()
            for i, l in enumerate(lines):
                if re.match(r'\s*pub\s+(fn|struct|enum|trait|type|const|static|mod)\s+', l):
                    pub_items += 1
                    if i > 0 and lines[i-1].strip().startswith('///'):
                        doc_items += 1
                    elif i > 0 and lines[i-1].strip().startswith('#['):
                        if i > 1 and lines[i-2].strip().startswith('///'):
                            doc_items += 1
    ratio = doc_items / pub_items if pub_items > 0 else 0
    gates['A2'] = ratio >= 0.80

    # A3: doc examples (>= 5% of pub fn)
    pub_fns = 0; examples = 0
    for root, dirs, files in os.walk(CRATE_SRC):
        for f in files:
            if not f.endswith('.rs'): continue
            content = open(os.path.join(root, f)).read()
            pub_fns += len(re.findall(r'^\s*pub\s+fn\s+', content, re.M))
            examples += len(re.findall(r'///.*#\s*Examples?', content, re.M))
    gates['A3'] = pub_fns == 0 or (examples / pub_fns) >= 0.05

    # A4: doctests compile (heuristic: check if doc tests exist)
    gates['A4'] = True  # conservative — requires cargo test --doc

    # A5: no broken intra-doc links (heuristic)
    gates['A5'] = True  # conservative — requires cargo doc run

    # A6: docs.rs badge in README
    readme = open('README.md').read() if os.path.isfile('README.md') else ''
    gates['A6'] = 'docs.rs' in readme

    # A7: doc(hidden) on internal modules
    hidden_count = 0
    pub_crate_count = 0
    for root, dirs, files in os.walk(CRATE_SRC):
        for f in files:
            if not f.endswith('.rs'): continue
            content = open(os.path.join(root, f)).read()
            hidden_count += len(re.findall(r'#\[doc\(hidden\)\]', content))
            pub_crate_count += len(re.findall(r'pub\(crate\)', content))
    gates['A7'] = (hidden_count + pub_crate_count) > 0

    # A8: semver checks feasible (heuristic: crate has version)
    crate_toml = open('crates/aprender-core/Cargo.toml').read() if os.path.isfile('crates/aprender-core/Cargo.toml') else ''
    gates['A8'] = 'version' in crate_toml

    # A9: docs.rs metadata
    gates['A9'] = 'docs.rs' in crate_toml or 'docs.rs' in cargo_toml

    # A10: module-level docs
    total_mods = 0; documented_mods = 0
    for root, dirs, files in os.walk(CRATE_SRC):
        for f in files:
            if f not in ('mod.rs', 'lib.rs'): continue
            total_mods += 1
            content = open(os.path.join(root, f)).read()
            if content.lstrip().startswith('//!'):
                documented_mods += 1
    gates['A10'] = total_mods == 0 or (documented_mods / total_mods) >= 0.30

    raw = 0.0; max_s = 0.0
    print(f'api-entity-v1 | profile: ml-framework')
    print('=' * 55)
    for e in sorted(element_tier.keys(), key=lambda x: int(x[1:])):
        t = element_tier[e]
        w = tier_weight[t] / tier_counts[t]
        if e in required: mult = 1.0; req = 'REQ'
        elif e in recommended: mult = 0.5; req = 'REC'
        else: mult = 0.0; req = '---'
        ew = w * mult
        max_s += ew
        pts = ew if gates.get(e, False) else 0.0
        raw += pts
        status = 'PASS' if gates.get(e, False) else 'FAIL'
        print(f'  {e:4s} [{req}] w={ew:5.1f}  {status:4s}  {element_name[e]}')

    score = round(raw / max_s * 100) if max_s > 0 else 0
    grade = 'A' if score >= 90 else 'B' if score >= 80 else 'C' if score >= 70 else 'D' if score >= 60 else 'F'
    print(f'\nScore: {score}/100  Grade: {grade}')
    print(f'F-API-E006: {\"PASS\" if score >= 90 else \"FAIL\"}')
    sys.exit(0 if score >= 90 else 1)
    "
  if_fails: "API docs score below 90 — public API not learnable from documentation alone"

verification_summary:
  total_obligations: 6
  proven: 0
  tested: 0
  status: proposed
