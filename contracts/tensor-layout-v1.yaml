toyota_way_principles:
  jidoka: '"Automation with a human touch" - The validation stops the line immediately

    when a defect is detected. No garbage data propagates to inference.

    '
  poka_yoke: '"Mistake-proofing" - The type system makes it physically impossible to

    use unvalidated data. This is not a warning or a lint - it''s a compile error.

    '
  genchi_genbutsu: '"Go and see" - The falsification tests require actually running the code

    with known-bad data. We don''t assume validation works - we prove it fails

    on bad input.

    '
  kaizen: '"Continuous improvement" - When PMAT-234 revealed a new failure mode

    (94.5% zeros), we added F-DATA-QUALITY-004 and FALSIFY-004. The contract

    evolves to prevent every observed failure mode.

    '
equations:
  identity:
    formula: f(x) = x
    preconditions:
    - a.len() > 0
    - b.len() > 0
    lean_theorem: Theorems.Identity
  validated_tensor_construction:
    formula: |
      validate: (RawData, Shape, Name) -> Result<ValidatedTensor, ContractError>
        data.len() == shape.product() -> Ok(ValidatedTensor)
        contains_nan(data) -> Err(NaN)
        contains_inf(data) -> Err(Inf)
        zero_pct(data) > threshold -> Err(DensityFailure)
    domain: Raw f32 data with expected dimensions
    codomain: Result<ValidatedTensor, ContractError>
    invariants:
    - Private inner field prevents bypass
    - No NaN or Inf values pass validation
    - Density thresholds enforced (50% for embeddings, 80% for weights)
    preconditions:
    - data.len() > 0
    - shape dimensions are positive
    lean_theorem: Theorems.ValidatedTensorConstruction
  transpose_invariant:
    formula: |
      transpose: (GgufShape, Format) -> AprShape
        For 2D tensors: apr_shape == swap(gguf_shape)
        For 1D tensors: apr_shape == gguf_shape
    domain: GGUF tensor shape with format metadata
    codomain: APR tensor shape
    invariants:
    - 2D transpose swaps dimensions exactly
    - 1D tensors are identity
    - Byte size preserved across transpose
    preconditions:
    - gguf_shape has 1 or 2 dimensions
    lean_theorem: Theorems.TransposeInvariant
  quant_dispatch_exhaustiveness:
    formula: |
      dispatch: WeightQuantType -> Kernel
        For every variant V of WeightQuantType:
          exists exactly one kernel K in dispatch table
        No wildcard/catch-all arm
    domain: WeightQuantType enum
    codomain: Specific kernel function
    invariants:
    - Exhaustive match — every variant handled
    - No catch-all arm (no _ =>)
    - Each variant maps to exactly one kernel
    preconditions:
    - WeightQuantType is non-empty enum
    lean_theorem: Theorems.QuantDispatchExhaustiveness

kernel_structure:
  phases:
  - name: validate_input
    description: Validate tensor data length, check for NaN/Inf, enforce density thresholds
  - name: execute
    description: Transpose shapes, dispatch to correct quantization kernel
  - name: verify_output
    description: Verify output shape, density, and format-specific invariants

proof_obligations:
- type: invariant
  property: Validated tensor rejects NaN and Inf
  formal: for all v in ValidatedTensor, not contains_nan(v.data) and not contains_inf(v.data)
  applies_to: all
- type: invariant
  property: Transpose shape correctness
  formal: for all 2D tensors, apr_shape[0] == gguf_shape[1] and apr_shape[1] == gguf_shape[0]
  applies_to: all
  lean:
    theorem: TensorLayout.transpose_shape_swap
    module: ProvableContracts.Theorems.TensorLayout.IndexAlgebra
    status: proved
    depends_on:
    - TensorLayout.transpose_size_preserved
    - TensorLayout.transpose_shape_1d_identity
    - TensorLayout.idx_lt
    - TensorLayout.unrow_idx
    - TensorLayout.uncol_idx
    - TensorLayout.idx_unrow_uncol
    - TensorLayout.idx_injective
    - TensorLayout.transpose_reindex_bijective
    - TensorLayout.row_stride
    - TensorLayout.col_stride
    notes: >-
      Core-only Lean (no imports), verifies with `lean <file>`. Proves the
      full row-major index algebra: 2-D transpose swaps the shape pair exactly
      (apr_shape[0]=gguf_shape[1], apr_shape[1]=gguf_shape[0]), 1-D is identity,
      element count preserved; and the underlying idx(i,j)=i*ncols+j is a
      bijection on the valid rectangle (range + two-sided inverse unidx =
      (·/ncols, ·%ncols) ⇒ injective/surjective), the transpose reindex
      out[r*cols+c]=in[c*rows+r] is an element-preserving bijection, and strides
      are contiguous (row=ncols, col=1).
- type: postcondition
  property: Density enforcement
  formal: for ValidatedEmbedding, zero_pct(data) < 50%; for ValidatedWeight, zero_pct(data) < 80%
  tolerance: 1e-6
  applies_to: all
- type: invariant
  property: Quant dispatch exhaustiveness — no catch-all
  formal: WeightQuantType match has zero wildcard arms across all dispatch sites
  applies_to: all
verification_summary:
  total_obligations: 4
  l2_property_tested: 4
  l3_kani_proved: 4
  l4_lean_proved: 1
  l4_sorry_count: 0
  l4_not_applicable: 3
  mathlib_imports: false
  lean_proved_obligations:
  - obligation: Transpose shape correctness
    theorem: TensorLayout.transpose_shape_swap
    file: ProvableContracts/Theorems/TensorLayout/IndexAlgebra.lean
  not_applicable_obligations:
  - obligation: Validated tensor rejects NaN and Inf
    reason: >-
      Runtime IEEE-754 property, not an algebraic identity. Lean's ℝ has no
      NaN/Inf inhabitants, so there is nothing to prove over abstract values.
      Enforced at construction by ValidatedTensor::new() (rejects any NaN/Inf
      f32) and bounded-checked by Kani KANI-LAYOUT-001 + FALSIFY-003. Class (b).
  - obligation: Density enforcement
    reason: >-
      Empirical/runtime statistic (zero-fraction of concrete f32 data vs a 50%/
      80% threshold). No value-algebra content to prove in Lean. Enforced at
      construction and bounded-checked by Kani KANI-LAYOUT-003 + FALSIFY-001/004.
      Class (b).
  - obligation: Quant dispatch exhaustiveness — no catch-all
    reason: >-
      Static source-syntax property (zero wildcard `_ =>` arms across dispatch
      sites), verified by the Rust compiler's exhaustiveness checker + a source
      lint, not a mathematical statement over values. Bounded-checked by Kani
      KANI-LAYOUT-004 + FALSIFY-007/008. Class (b) — compile-time-enforced, not
      Lean-analytic.
  notes: >-
    1 of 4 obligations is analytic (Transpose shape correctness) and is proved
    core-only in Lean 4 (no Mathlib, no `sorry`); the other 3 are genuinely
    non-analytic runtime/compile-time obligations marked N/A with reasons above.
    proved(1) + N/A(3) == total(4), proved > 0 ⇒ honest L4.
kani_harnesses:
- id: KANI-LAYOUT-001
  obligation: Validated tensor rejects NaN and Inf
  property: No NaN or Inf passes ValidatedTensor::new()
  bound: 16
  strategy: stub_float
  harness: verify_nan_inf_rejection
- id: KANI-LAYOUT-002
  obligation: Transpose shape correctness
  property: apr_shape == swap(gguf_shape) for 2D tensors
  bound: 8
  strategy: exhaustive
  harness: verify_transpose_shape_swap
- id: KANI-LAYOUT-003
  obligation: Density enforcement
  property: "zero_pct < threshold for ValidatedEmbedding and ValidatedWeight"
  bound: 8
  strategy: exhaustive
  harness: verify_density_enforcement
- id: KANI-LAYOUT-004
  obligation: "Quant dispatch exhaustiveness \u2014 no catch-all"
  property: WeightQuantType match has zero wildcard arms
  bound: 8
  strategy: exhaustive
  harness: verify_quant_dispatch_exhaustive
qa_gate:
  id: F-TLV-001
  name: tensor-layout-v1 Contract
  description: Quality gate for Tensor layout and data quality contract with compile-time en
  checks:
  - validation
  - falsification
