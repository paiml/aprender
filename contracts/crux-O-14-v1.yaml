  description: >
    Deployment artifact: clone_for_deployment / keep_only_best / save_space / persist into one loadable file. Competitor verb: predictor.clone_for_deployment(path); predictor.persist(). Gap measured in aprender at eb262f8eb: Single estimators serialize to .apr (bundle/, serialization/). No artifact holds a fitted feature pipeline (O-05) plus several models plus ensemble weights plus a decision threshold and loads them as one predictor. Nothing prunes non-selected models from disk.
