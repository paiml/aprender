equations:
  a_deployment_clone_is_smaller_and_predicts_identically:
    formula: |
      clone_for_deployment artifact bytes < 0.5 x full artifact bytes AND predict() on the clone is bit-identical to predict() on the original for the test fixture
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "a deployment clone is smaller and predicts identically"
  the_artifact_is_self_describing_and_refuses_a_schema_drift:
    formula: |
      load() on an artifact whose feature schema disagrees with the input columns is an Err naming the first mismatched column, not a wrong prediction
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "the artifact is self-describing and refuses a schema drift"

falsification_tests:
- id: FALSIFY-CRUX-O-14-001
  rule: "a deployment clone is smaller and predicts identically"
  prediction: "clone_for_deployment artifact bytes < 0.5 x full artifact bytes AND predict() on the clone is bit-identical to predict() on the original for the test fixture"
  test: >-
    LIVE-PENDING - a deployment clone is smaller and predicts identically. No test surface exists today because the capability is unimplemented: Deployment artifact: clone_for_deployment / keep_only_best / save_space / persist into one loadable file (aprender#3384, CRUX-O-14). PROMOTE by authoring a test named deployment_clone_smaller_identical in module `automl/artifact/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'a deployment clone is smaller and predicts identically' is violated — the autogluon parity claim for CRUX-O-14 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"
- id: FALSIFY-CRUX-O-14-002
  rule: "the artifact is self-describing and refuses a schema drift"
  prediction: "load() on an artifact whose feature schema disagrees with the input columns is an Err naming the first mismatched column, not a wrong prediction"
  test: >-
    LIVE-PENDING - the artifact is self-describing and refuses a schema drift. No test surface exists today because the capability is unimplemented: Deployment artifact: clone_for_deployment / keep_only_best / save_space / persist into one loadable file (aprender#3384, CRUX-O-14). PROMOTE by authoring a test named artifact_refuses_schema_drift in module `automl/artifact/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'the artifact is self-describing and refuses a schema drift' is violated — the autogluon parity claim for CRUX-O-14 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"

