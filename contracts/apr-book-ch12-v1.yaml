metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 12: Serving and Deployment
  contract: apr-book-ch12
  status: enforced
  title: "Serving and Deployment"
  part: IV
  example: ch12_serving
  arxiv_citations: ["2309.06180", "2211.17192"]

preconditions:
  - "cargo build -p aprender-core --example ch12_serving succeeds"
  - "All arXiv IDs in citation table are valid"
  - "Zero legacy names in chapter text"
postconditions:
  - "Example produces correct output"
  - "All assert!() in example pass"
falsification:
  - condition: "cargo run -p aprender-core --example ch12_serving exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Section without arXiv citation"
    severity: P0
    action: reject_chapter
  - condition: "Legacy name appears in chapter text"
    severity: P0
    action: reject_chapter
  - condition: "Oracle --explain output contradicts chapter claim"
    severity: P0
    action: reject_chapter
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter
