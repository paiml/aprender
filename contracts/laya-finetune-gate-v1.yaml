  # (08-05 / 08-09) all use.
  data_dir:
    - task.json
    - train.jsonl
    - eval.jsonl
    - 'shift.jsonl (OPTIONAL shift probe, 1.4.0)'
  run_dir:
    - 'checkpoint/model.safetensors (F16 weights; the `temperature` buffer F32)'
    - 'checkpoint/rl_agent_config.json (calibrated T written into temperature_by_options[bucket])'
    - checkpoint/encoder/config.json
    - checkpoint/tokenizer/tokenizer.json
    - 'checkpoint/tokenizer/tokenizer_config.json (written ALREADY in the form Laya''s _fix_tokenizer_config produces — tokenizer_class: PreTrainedTokenizerFast — because Laya''s loader otherwise REWRITES it in place, changing a hashed input after the fact)'
    - 'task.json (byte copy of the data dir''s)'
    - recipe.json
    - gate-report.json
    - eval-probs.json
    - zero-shot-probs.json
    - probes.json
    - 'variance-report.json (only when more than one seed ran)'
    # ---- 1.4.0 additions (every entry above is byte-identical to 1.3.0) ----
    - 'rescore-noise.json (the float64 re-score noise record, rescore_noise_schema; laya-parity-v1 A1)'
    - 'seeds/seed-<s>/eval-probs.json (every gate seed, 1.4.0)'
    - 'shift-probs.json (only with shift.jsonl)'
    - 'shift-zero-shot-probs.json (only with shift.jsonl)'
  run_dir_notes:
    variance_report: 'variance-report.json is written always for production (three seeds) under seed_selection (1.4.0); the entry above keeps its 1.x wording for legacy runs'

recipe_json_schema:
  # Written BEFORE any eval score exists (equation recipe_before_scores). recipe_id is the sha256
  # of the exact recipe.json file bytes — one definition; the Rust side never re-serializes.
  variant: 'string: "production" | "synthetic-fixture"'
  optimizer: 'string: "adamw"'
  encoder_lr: 'number: recipe.encoder_lr'
  head_lr: 'number: recipe.head_lr'
  eta_min: 'number: recipe.eta_min'
  weight_decay: 'number: recipe.weight_decay'
  grad_clip: 'number: recipe.grad_clip'
  batch_size: 'integer: recipe.batch_size'
  proper_reward_w_sph: 'number: recipe.proper_reward_w_sph'
  proper_reward_w_rps: 'number: recipe.proper_reward_w_rps'
  schedule: 'string: "cosine"'
  shots_per_class: 'integer >= 0 (production: >= 1)'
  epochs: 'integer >= 0 (production: per recipe.epoch_rule; under early_stopping this is the MAXIMUM)'
  seed: 'integer: the declared seed (split seed and first gate seed); under the legacy rule (no seed_selection) the production shipped checkpoint is this seed; under seed_selection the SHIPPED seed is gate-report seeds.shipped'
  base: 'object {family, repo, revision, checkpoint, sha256} (production: == base block)'
  early_stopping: 'OPTIONAL object {monitor, mode, eval_every_epochs, first_candidate_epoch, patience_epochs, min_delta, restore, tie_break} equal to the early_stopping block; ABSENT = fixed_epochs. Since 1.4.0 the only other optional key is seed_selection.'
  seed_selection: 'OPTIONAL (1.4.0) object {policy, seeds, rank_scale, tie_break} equal to seed_policy (selection, variance_seeds, rank_scale, tie_break), written before training; REQUIRED for production under 1.4.0 (train.py always writes it); ABSENT = the 1.x declared-seed rule (seed_policy.legacy_rule)'

gate_report_schema:
  schema: 'string: "laya-gate-report-v1" — UNCHANGED under 1.4.0: every 1.4.0 addition (seeds.policy / shipped / per_seed, rescore_noise_sha256, shift_probe, inputs_sha256.shift_jsonl) is OPTIONAL, so every 1.x report still parses'
  pass: 'boolean — must equal the Rust recomputation (gate_pass)'
  thresholds: 'object {min_macro_f1_margin, max_ece, ece_bins} — must equal this file''s constants, else the report is refused (D-07 fail-closed)'
  zero_shot: 'object {macro_f1, f_avg, ece, n}'
  fine_tuned: 'object {macro_f1, f_avg, ece_pre, ece_post, nll, n}'
  margin: 'number: fine_tuned.macro_f1 - zero_shot.macro_f1'
  calibration: 'object {bucket, t_fitted, t_applied, clamp_hit, slice_size, slice_ids, slice_ids_sha256} — slice_ids is the SORTED list of 0-based train.jsonl row indices in the calibration slice (indices only, never text), so the Rust verifier re-derives disjointness from it'
  seeds: 'object {declared, n, label} — label is the literal "single seed" when n == 1; else "median-ECE seed of N seeds" when policy is "median_ece" (1.4.0), else (a legacy 1.x multi-seed run) "mean ± sd over N seeds" (seed_policy.rule). 1.4.0 adds OPTIONAL policy ("median_ece"), shipped (integer: the median seed) and per_seed (array in seed order of {seed, macro_f1, f_avg, ece_post, margin, pass, t_applied, rank_key, eval_probs_sha256, model_safetensors_sha256}); present exactly when recipe.json carries seed_selection'
  device_used: 'string: read from the model parameters after the move'
  device_is_cpu: boolean
  torch_version: string
  recipe_id: 'string: sha256 hex of recipe.json bytes'
  inputs_sha256: 'object {task_json, train_jsonl, eval_jsonl, base_model, tokenizer_json}; 1.4.0 adds OPTIONAL shift_jsonl (present exactly when the data dir carries shift.jsonl)'
  eval_probs_sha256: string
  zero_shot_probs_sha256: string
  probes_sha256: string
  rescore_noise_sha256: 'OPTIONAL (1.4.0) string: sha256 of rescore-noise.json; ABSENT = the laya-parity-v1 A1 floor rule (bound 1.0e-5 for both sets)'
  shift_probe: 'OPTIONAL (1.4.0) object {gate_clause: false, n, zero_shot {macro_f1, f_avg, ece}, fine_tuned {macro_f1, f_avg, ece_post}, margin, probs_sha256, zero_shot_probs_sha256} — present exactly when the data dir carries shift.jsonl; REPORTED, never in gate_pass'
  f_avg_rule: 'f_avg may be null for non-stance tasks'

eval_probs_schema:
  # The SAME schema serves eval-probs.json (fine-tuned, calibrated) and zero-shot-probs.json (the
  # declared base on the same rows). No eval TEXT is ever written, so no tweet text reaches an
  # artifact.
  rows: 'array of {row: integer (0-based eval.jsonl index), text_sha256: string, probabilities: array of K numbers in criteria order}'
  labels: 'array of criteria names in task.json order'

rescore_noise_schema:
  # 1.4.0 (laya-parity-v1 A1): rescore-noise.json, written by train.py at scoring time and hash-bound by
  # gate-report rescore_noise_sha256. Rust RECOMPUTES max_abs and bound from `rows` and the scored
  # files; the reported values are cross-checked only (laya-parity-v1 rescore_noise_reference).
  schema: 'string: "laya-rescore-noise-v1"'
  reference: 'string: "float64"'
  # plan 08-29 (WR-09): k is read through contract.number as a FLOAT and written as one (4.0), because the Rust
  # verifier compares it with the contract's f64 bit for bit; a record of 1.4.0..4.0.0 carrying the integer 4
  # is the same f64 and still verifies.
  k: 'number (float64): copy of laya-parity-v1 constants.pack_rescore_noise_k; must equal it bit for bit'
  floor_abs: 'number: copy of laya-parity-v1 equations.pack_rescore_probs_abs.float_tolerance; must equal it'
  control_max_abs: 'number: max |dz| of the manual fp32 forward against the Scorer''s logits on control_rows; must be 0.0'
  control_rows: 'array of integers: the first min(5, n) eval row indices the control forwarded'
  sets: 'array of EXACTLY two objects, `which` "fine_tuned" (the shipped checkpoint) and "zero_shot" (the declared base), each {which, scored: "eval", t_applied, n, argmax_agree, max_abs, bound, rows: [{row: integer, probabilities_f64: array of K numbers in criteria order}] covering every eval row once, in order}'

probes_json_schema:
  # For each decide-apr-v1 probe input, in order, computed by Laya's OWN predict path on the F16
  # reload, through the decide-apr-v1 synthetic probe task.
  probes: 'array of {input_index: integer, tokens: integer (built-row length), label: string, probabilities_f32_hex: array of K strings (f32 bit patterns, 8 hex digits each)}'

# ---------------------------------------------------------------------------------------------
# CLASS A, VERIFY SIDE (plan 08-21): every leaf of a production run dir's recipe.json and
# gate-report.json, as a leaf pattern (array indices as [*], optional fields included), is either
# BOUND — equal to this contract, to a hash of a data-dir / base-dir / probability file, or to a
# Rust recomputation, refused by the named check with a Display containing `names` — or
# REPORT_ONLY, with the reason it cannot decide eligibility. A `bound_by` naming a later plan is
# EXPECTED-OPEN until that plan lands. Enforced by crates/aprender-decide/src/verify/tests.rs
# `every_run_field_is_bound_or_report_only` (each leaf mutated alone — hex digit flipped, integer
# +1, float x2+1, bool flipped, string appended, null -> 0.5 — every recorded hash resealed, then
# verified: a bound row must be refused naming it, a report_only row must still verify) and
# `run_field_bindings_table_matches_fixture_leaves` (this table's patterns == the fullest run
# copy's leaves). `only: shipped_seed_row` binds the shipped seed's row and treats the others per
# `report_only_otherwise`; `membership_report_only` binds a list's structure and states why its
# membership decides nothing.
# ---------------------------------------------------------------------------------------------
# ---- plan 08-27 (class E): ONE f64 computation per gate quantity, met bit for bit by the Python
# trainer and the Rust verifier. Structured, so a top-level key (the constants block stays flat).
numeric_agreement:
  rule: 'every gate quantity is computed in f64 with exactly-rounded summation, in the order stated, by aprender-core (Rust, the ONE implementation per operation, OPS-03) and by scripts/laya_train/metrics.py (Python math.fsum); an exactly-rounded sum does not depend on term order or summation tree, so both languages return bit-identical values and identical verdicts on every input, including an exact 0.05 margin and an ECE on a 1e-4 rank grid line. aprender-core''s f32 f1_score and expected_calibration_error_top_label are NOT these computations and are unchanged (frozen by metrics::f32_bits_tests::f32_metrics_are_bit_identical_to_the_frozen_snapshot)'
  summation: 'exactly-rounded (Python math.fsum / aprender_core metrics::fsum, a safe port of CPython math_fsum: Shewchuk partials plus the half-way correct-rounding step)'
  inputs: 'the probability files'' float32 values widened exactly to f64 (train.py as64); pred = the first argmax; labels the eval (or shift) rows'' true labels'
  case_file: scripts/laya_train/numeric_cases.json
  case_schema: laya-numeric-cases-v1
  case_generator: 'uv run --project scripts/laya_train --frozen python scripts/laya_train/metrics.py --write-numeric-cases (byte-reproducible): the reviewers'' constructed boundary cases (a 9-row and a 30-row exact-1/20 margin, a 459-row rank grid-line ECE, each one HEAD''s f32 path decided differently) and 20 seeded random cases (N 3..600, K 2..6, 15 bins), expected values as f64 bit patterns'
  replayed_by:
    - 'Python: scripts/laya_train/metrics.py --selftest (inside just laya-train-selftest)'
    - 'Rust: cargo test -p aprender-decide --lib verify::tests::gate_numeric_cases_agree_bit_for_bit'
  quantities:
    macro_f1:
      formula: 'L = sorted(labels present in y UNION pred); F1_c = 2 tp_c / (2 tp_c + fp_c + fn_c), 0 when the denominator is 0; macro_f1 = fsum(F1_c for c in L) / |L|'
      precision: f64
      summation: exactly-rounded
      order: 'per-class F1 by one division each, then one fsum over L, then one division by |L|'
      python: 'metrics.py macro_f1'
      rust: 'aprender-core metrics::classification::macro_f1_f64, called by aprender_decide::verify::recompute_metrics'
    f_avg:
      formula: 'f_avg = fsum(F1_c for c in S) / |S|, F1_c as in macro_f1; S = [index(against), index(favor)] exactly when the task''s labels are demo.criteria_order, else f_avg is null'
      precision: f64
      summation: exactly-rounded
      order: 'per-label F1, one fsum over S in the given order, one division'
      python: 'metrics.py f_avg with train.py f_avg_labels'
      rust: 'aprender-core metrics::classification::mean_f1_over_labels_f64, called by aprender_decide::verify::check_f_avg (zero_shot, fine_tuned, every per_seed row, both shift sets; the null rule is verify::f_avg_labels)'
    ece_top_label:
      formula: 'the ece_top_label equation: acc_b = fsum(correct in b) / n_b, conf_b = fsum(conf in b) / n_b, ECE = fsum((n_b / N) * |acc_b - conf_b|) over occupied bins'
      precision: f64
      summation: exactly-rounded
      order: 'bin index floor(conf x ece_bins) in f64 clamped to ece_bins - 1; per bin one fsum of correct and one of conf, each divided by n_b; one term per occupied bin in bin order; one fsum of the terms'
      python: 'metrics.py ece_top_label'
      rust: 'aprender-core calibration::expected_calibration_error_top_label_f64, called by aprender_decide::verify::recompute_metrics'
    margin:
      formula: 'margin = macro_f1(fine_tuned) - macro_f1(zero_shot); PASS clause margin >= gate_min_macro_f1_margin'
      precision: f64
      summation: 'one f64 subtraction of the two exactly-summed macro-F1s'
      order: 'fine-tuned minus zero-shot'
      python: 'gate.py evaluate_gate (and train.py per seed / shift probe)'
      rust: 'aprender_decide::verify::recompute_gate (Recomputed.margin), judged by check_gate; per seed in check_seed_selection'
    rank_key:
      formula: 'rank_key = floor(ece_post x rank_scale) as an integer, rank_scale the integer seed_policy.rank_scale multiplied in'
      precision: f64
      summation: 'one f64 multiplication of the exactly-summed ECE, then floor'
      order: 'multiply, then floor'
      python: 'metrics.py rank_key (gate.rank_key refuses a non-finite ECE, then calls it)'
      rust: 'aprender_decide::verify::rank_key on recompute_metrics'' ECE (check_seed_selection, select_median_seed)'

# ---- plan 08-29 (class E, refusal half): every refusal the Python back office (scripts/laya_train)
# documents, as a table a self-test SWEEPS. Each row: `rule` (the id after REFUSED; `<role>` expands over
# `roles`), `entry` (the module.function that raises it), `hostile_input` (one line), `rust_counterpart`
# (the VerifyError the Rust verifier refuses the same input with, or "none: back-office only"), and
# `sweep`: in_process (a torch-free case in data.py --selftest must raise it) or lifecycle (it needs torch
# or the train.py CLI; `case` names the lifecycle.py function that exercises it).
python_refusals:
  rule: 'every back-office input refusal is ONE `REFUSED <rule>: <detail>` line and exit 2 at the CLI boundary (train.py refuse(), prepare_stance.py main), never a traceback; the table lists every rule id the back-office sources raise, and data.py --selftest fails on a rule id in the sources with no row, a row with no case, or a case whose refusal names another rule'
  swept_by: 'scripts/laya_train/data.py --selftest `python_refusals` sweep (inside just laya-train-selftest); prints PYTHON REFUSALS swept=<n> lifecycle=<m>'
  cli_boundary: 'prepare_stance.py run as a subprocess on a source split with an invalid UTF-8 byte exits 2 with REFUSED source-row-encoding and no Traceback (data.py --selftest); train.py on a train.jsonl with an invalid UTF-8 byte exits 2 with REFUSED train-row-encoding (lifecycle.py check_train_cli_refusals)'
  not_refusals: 'prepare_stance.fail() (PREPARE FAILED, exit 1) is a consistency check of the pinned public TweetEval dataset against the committed selection manifest and the contract counts, not a tenant-input refusal; Laya''s own ValueError on a wrong --base-sha256 and train.py RuntimeError invariants (ordering, reload hashes) are internal assertions, not documented refusals'
  rows:
    - {rule: task-missing, entry: data.load_task, sweep: in_process, hostile_input: 'the data dir holds no task.json', rust_counterpart: 'Read (task.json)'}
    - {rule: task-schema, entry: data.load_task, sweep: in_process, hostile_input: 'task.json is not UTF-8 JSON, repeats a key, misses a key, or has an empty instructions / criterion name', rust_counterpart: 'Pack(PackError::Schema) on task.json'}
    - {rule: task-unknown-key, entry: data.load_task, sweep: in_process, hostile_input: 'task.json carries a key outside {type, instructions, criteria}', rust_counterpart: 'Pack(PackError::Schema) on task.json'}
    - {rule: task-type, entry: data.load_task, sweep: in_process, hostile_input: 'task.json type is not "choice"', rust_counterpart: 'Pack(PackError::Schema) on task.json'}
    - {rule: task-duplicate-criterion, entry: data.load_task, sweep: in_process, hostile_input: 'a criterion name appears twice in task.json', rust_counterpart: 'Pack(PackError::Schema) on task.json'}
    - {rule: task-too-few-criteria, entry: data.load_task, sweep: in_process, hostile_input: 'task.json declares one criterion', rust_counterpart: 'Pack(PackError::Schema) on task.json'}
    - {rule: '<role>-missing', roles: [train, eval], entry: data.load_rows, sweep: in_process, hostile_input: 'the data dir holds no <role>.jsonl', rust_counterpart: 'Read (<role>.jsonl)'}
    - {rule: '<role>-row-encoding', roles: [train, eval, shift], entry: data.load_rows, sweep: in_process, hostile_input: 'an invalid UTF-8 byte in the file, or a text / label holding a lone surrogate escape (\ud800)', rust_counterpart: 'DataInvalid (str::from_utf8 / serde_json refuse the same bytes)'}
    - {rule: '<role>-row-schema', roles: [train, eval, shift], entry: data.load_rows, sweep: in_process, hostile_input: 'a blank line, a line that is not a JSON object, a missing key or an empty text', rust_counterpart: 'DataInvalid'}
    - {rule: '<role>-row-unknown-key', roles: [train, eval, shift], entry: data.load_rows, sweep: in_process, hostile_input: 'a row carrying a key outside {text, label}', rust_counterpart: 'DataInvalid (RowJson deny_unknown_fields)'}
    - {rule: '<role>-row-label', roles: [train, eval, shift], entry: data.load_rows, sweep: in_process, hostile_input: 'a label that is not a criterion NAME (an unknown name, or an index)', rust_counterpart: 'DataInvalid'}
    - {rule: '<role>-empty', roles: [train, eval, shift], entry: data.load_rows, sweep: in_process, hostile_input: 'an empty <role>.jsonl', rust_counterpart: 'DataInvalid (no rows)'}
    - {rule: eval-class-coverage, entry: data.load_rows, sweep: in_process, hostile_input: 'eval.jsonl holds no row of one criterion', rust_counterpart: 'DataInvalid (check_eval_coverage)'}
    - {rule: '<role>-train-overlap', roles: [eval, shift], entry: data.refuse_overlap, sweep: in_process, hostile_input: 'a <role> text equal to a train text after NFC / trim / whitespace collapse', rust_counterpart: 'SplitOverlap for eval; none for shift: Rust recomputes the shift probe but does not re-check its overlap'}
    - {rule: heldout-shot-overlap, entry: data.in_distribution_heldout, sweep: in_process, hostile_input: 'a held-out row whose normalized text equals a shot', rust_counterpart: 'none: back-office only (prepare_stance builds the demo eval set)'}
    - {rule: train-conflicting-labels, entry: data.group_train, sweep: in_process, hostile_input: 'two train rows with the same normalized text under different labels', rust_counterpart: 'ConflictingLabels'}
    - {rule: train-class-too-small, entry: data.calibration_split, sweep: in_process, hostile_input: 'a class with no more rows than the calibration slice needs', rust_counterpart: 'SliceInvalid'}
    - {rule: contract-value, entry: contract.number, sweep: in_process, hostile_input: 'a contract number given as a string ("1e-6"), a bool, or a float where an integer is declared (15.0)', rust_counterpart: 'none: back-office only (the Rust verifier deserializes the contract into typed f64 / integer fields)'}
    - {rule: epochs, entry: contract.resolve_epochs, sweep: in_process, hostile_input: '--epochs at <= 16 shots/class, outside [4, 12] above 16, or missing above 16', rust_counterpart: 'RecipeMismatch'}
    - {rule: variant, entry: contract.resolve_epochs, sweep: in_process, hostile_input: 'a variant that is neither production nor synthetic-fixture', rust_counterpart: 'RecipeMismatch (and SyntheticNotDeployable for synthetic-fixture)'}
    - {rule: stopping, entry: contract.resolve_stopping, sweep: in_process, hostile_input: 'a --stopping value outside recipe.stopping_rules', rust_counterpart: 'RecipeMismatch'}
    - {rule: seeds, entry: contract.resolve_seeds, sweep: in_process, hostile_input: 'production --seeds other than 3, or synthetic --seeds other than 1 or 3', rust_counterpart: 'SeedPolicyViolated / SeedPolicyMissing'}
    - {rule: seeds, entry: gate.select_median_seed, sweep: in_process, hostile_input: 'an even or empty seed list, a repeated seed, or a non-finite ece_post', rust_counterpart: 'SeedPolicyViolated'}
    - {rule: seeds, entry: gate.verify_report, sweep: in_process, hostile_input: 'a median-rule report shipping a seed that is not the median of its per_seed rows', rust_counterpart: 'SeedPolicyMismatch'}
    - {rule: thresholds, entry: gate.verify_report, sweep: in_process, hostile_input: 'a gate report whose thresholds differ from the contract', rust_counterpart: 'ThresholdMismatch'}
    - {rule: pass, entry: gate.verify_report, sweep: in_process, hostile_input: 'a gate report whose pass disagrees with its metrics', rust_counterpart: 'PassDisagrees'}
    - {rule: early-stopping, entry: gate.EarlyStopper.record, sweep: in_process, hostile_input: 'an early-stopping run whose calibration monitor was never finite (nothing to restore)', rust_counterpart: 'none: back-office only (training time; Rust reads the stopping record as provenance)'}
    - {rule: early-stopping, entry: train.stopping_record_or_refuse, sweep: lifecycle, case: check_early_stopping_refusal, hostile_input: 'the same, at the train.py boundary: REFUSED early-stopping, exit 2', rust_counterpart: 'none: back-office only'}
    - {rule: source-row-encoding, entry: prepare_stance.read_jsonl, sweep: in_process, hostile_input: 'a TweetEval source split with an invalid UTF-8 byte or a lone-surrogate input', rust_counterpart: 'none: back-office only (the public source dataset)'}
    - {rule: source-row-schema, entry: prepare_stance.read_jsonl, sweep: in_process, hostile_input: 'a source split line that is not a JSON object with an id', rust_counterpart: 'none: back-office only (the public source dataset)'}
    - {rule: prepare-out-dir, entry: prepare_stance.write_once, sweep: in_process, hostile_input: 'an existing --out holding a differing written file or a foreign non-dot file (a stale shift.jsonl)', rust_counterpart: 'none: back-office only'}
    - {rule: base, entry: train.Base, sweep: lifecycle, case: check_train_cli_refusals, hostile_input: '--base with the production variant, or synthetic-fixture without --base / --base-sha256', rust_counterpart: 'BaseMismatch'}
    - {rule: out-dir, entry: train.main, sweep: lifecycle, case: check_train_cli_refusals, hostile_input: 'a non-empty --out (a run dir is written once)', rust_counterpart: 'none: back-office only'}
    - {rule: noise-control, entry: train.write_noise_record, sweep: lifecycle, case: check_noise_control_refusal, hostile_input: 'the manual fp32 forward differs from the Scorer''s logits on a control row', rust_counterpart: 'RescoreNoiseInvalid (control_max_abs must be 0.0)'}
    - {rule: data-changed, entry: train.refuse_if_data_changed, sweep: lifecycle, case: check_data_changed_refusal, hostile_input: 'task.json / train / eval / shift edited, added or removed during the run', rust_counterpart: 'InputHashMismatch'}

