  name: 'Laya fine-tune gate and recipe contract'
  description: >
    The blocking gate for the training-side claims. The Rust-reverifiable equations (gate_pass,
    split_disjointness, synthetic_not_deployable, ece_top_label) run in CI through aprender-decide
    lib tests once plan 08-09 lands them; the Python-only equations run LOCALLY through
    `just laya-train-selftest` (plan 08-08) and are marked so in their binding rows.
  checks:
    - 'contract schema validity (pv validate, zero errors) and non-zero pv status counts'
    - 'constants flat; seed_policy, eval_set, recipe, recipe_variants, base, demo, demo_s64, run_dir_layout and the five schemas (1.4.0 adds rescore_noise_schema) are top-level keys'
    - 'gate thresholds read from this file; mismatching thresholds refused'
    - 'pass decided on recomputed metrics from verified probabilities; edited reports refused'
    - 'house ECE on the frozen cases'
    - 'calibration clamp recorded and applied'
    - 'text-disjoint split with conflicting duplicates refused'
    - 'declared seed ships under the legacy rule; recipe before scores; device from parameters; F16-reload scoring'
    - 'early stopping decided on the calibration slice before any eval score; best epoch restored'
    - 'synthetic-fixture refused by pack-for-serving, verify and deploy'
    - 'A2 (1.4.0): the gate eval set is in-distribution held-out data defined by eval_set.demo_rule (459 rows, [111, 291, 57]); the claim excludes shift robustness in plain words; the SemEval test split is a reported, recomputed, never-gating shift probe'
    - 'A3 (1.4.0): production trains seeds 13/17/23; the median-ECE seed ships by floor(ece_post x 10000), ties to the smaller seed; pass is the shipped seed''s pass on both clauses; all three reported; Rust re-derives the median; a legacy run is never deploy-eligible'
    - 'A1 (laya-parity-v1 2.0.0): gate_pass''s probabilities verified within the noise-referenced bound(c, s), floor 1.0e-5 without a rescore-noise.json record'
    - 'demo_s64 declared (outcome pending, one run, stop rule) before its data dir or run exists; the s16 demo record and both fail-closed vectors unchanged'
  pass_criteria: 'FALSIFY-LAYA-GATE-001..014 pass, each observed RED under its induced negative; this file is committed before any models/decide/ run directory exists, and its 1.4.0 amendment before any models/decide/laya-stance-64 run directory exists.'
