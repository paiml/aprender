metadata:
  version: "2.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
  - "https://docs.google.com/document/d/1CvAClvFfyA5R-PhYUmn5OOQtYMH4h6I0nSsKchNAySU/preview"
  - "crates/apr-cli/src/commands/run.rs"
  - "contracts/apr-trace-v1.yaml (TR-09, aprender#4564: chrome is a format of it)"
  description: >
    Chrome Trace Event Format (JSON) for apr run --tracing.
    Output loadable in chrome://tracing, Perfetto, and speedscope.
    Candle parity: matching tracing_chrome output format. Refs GH-574.

equations:
  chrome_trace_schema:
    formula: |
      apr run --tracing <model> produces JSON with:
        { "traceEvents": [ ... ] }
      Each event is a Chrome Trace Event Format object:
        { "ph": "X"|"B"|"E"|"i",
          "name": string,
          "cat": string,
          "pid": u64,
          "tid": u64,
          "ts": f64 (microseconds),
          "dur": f64 (for "X" events) }
    domain: apr run --tracing output
    codomain: JSON array of trace events
    invariants:
    - "Output is valid JSON parseable by jq"
    - "traceEvents array contains at least 1 event per inference step"
    - "Timestamps (ts) are monotonically non-decreasing within a thread"
    - "Duration events (ph=X) have integer dur >= 0 — never negative or NaN (CRUX F-07); a zero-time row is still a row"

  trace_event_categories:
    formula: |
      v2.0.0 (TR-09, #4564): the events ARE the run's apr-trace-v1 layer document.
        one "request" span   — cat "request", dur = total_time_us
        one event per row    — cat = the document's level, name/dur = the row's
      The v1 list (tokenize, embed, layer_{i%28}, sample, decode) was a fixed
      split of the run total, the same for every model, labelled "derived". It
      is withdrawn: a category exists only where the document has a row.
    domain: trace event categories
    codomain: string enum
    invariants:
    - "categories = {request} ∪ {level(document)}"
    - "rows(chrome) = breakdown(document), in order, same durations"
    - "metadata.provenance = provenance(document)"

  output_format_flag:
    formula: |
      --tracing flag:
        apr run --tracing <model> → writes trace.json to current dir
        apr run --tracing --trace-output <path> → writes to specified path
      Does NOT interfere with normal inference output (text goes to stdout,
      trace goes to file).
    domain: CLI flags
    codomain: file path
    invariants:
    - "--tracing flag does not change inference output on stdout"
    - "Trace file written atomically (no partial writes on error)"
    - "Default output: trace.json in current directory"

falsification_tests:
- id: FALSIFY-TRACE-001
  rule: valid chrome trace JSON
  prediction: "apr run --tracing output is valid JSON"
  test: |
    apr run --tracing model.gguf "test" --max-tokens 4 2>/dev/null
    jq '.traceEvents | length > 0' trace.json
  if_fails: "trace output not valid JSON or empty"

- id: FALSIFY-TRACE-002
  rule: categories are the apr-trace-v1 document's
  prediction: "chrome rows equal the document's rows; no invented tokenize/sample spans"
  test: |
    cargo test -p apr-cli --lib test_chrome_trace_event_categories
    cargo test -p apr-cli --lib test_chrome_trace_token_count
  if_fails: "chrome carries a row the apr-trace-v1 document does not"

- id: FALSIFY-TRACE-003
  rule: timestamps monotonic
  prediction: "ts values non-decreasing within same tid"
  test: |
    apr run --tracing model.gguf "test" --max-tokens 4 2>/dev/null
    jq '[.traceEvents | sort_by(.ts) | .[0:-1] as $a | .[1:] as $b |
         [$a, $b] | transpose | map(.[1].ts >= .[0].ts) | all]' trace.json
  if_fails: "timestamps not monotonic"

proof_obligations:
- id: ACTE66C-INV-001
  type: invariant
  property: "output is valid Chrome Trace Event Format JSON"
- id: ACTE66C-INV-002
  type: invariant
  property: "chrome rows are exactly the apr-trace-v1 document's rows"
- id: ACTE66C-INV-003
  type: invariant
  property: "timestamps monotonically non-decreasing"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: pending
