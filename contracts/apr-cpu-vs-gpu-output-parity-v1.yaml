metadata:
  kind: schema
  version: 1.3.0
  status: ACTIVE
  created: '2026-05-03'
  author: PAIML Engineering
  registry: false
  references:
  - 'evidence/ship-007-layer-0-oracle-bisection-2026-05-03/findings-v5-gpu-path-confirmed.md'
  - 'evidence/ship-007-layer-0-oracle-bisection-2026-05-03/findings-v6-parity-gate-fires-but-fallback-is-silent.md'
  - 'crates/aprender-serve/src/cli/apr_inference.rs (line 46 comment: "Both ... produce garbage on GPU")'
  - 'crates/aprender-serve/src/gguf/cuda/mod_parity_gate.rs (existing gate for gguf::cuda path)'
  - 'crates/aprender-serve/src/gguf/cuda/mod.rs:268-279 (gate enforcement, with SKIP_PARITY_GATE=1 bypass)'
  - 'crates/aprender-serve/src/infer/gguf_gpu_generate.rs:487-494 (load_apr_cuda_model — visible-fallback log added 2026-05-03)'
  changelog:
  - '1.3.0 — 2026-05-03 — FALSIFY-CPU-GPU-005 part b implementation landed inline at try_apr_wgpu_inference (gguf_gpu_generate.rs ~line 441-510). Probe-token CPU forward via OwnedQuantizedModel::forward_single_with_cache → wgpu single-step replay using the same fwd.forward_layer code path the autoregressive loop uses → cosine compare via cpu_vs_gpu_cosine_similarity (PR #1440 helper). < 0.99 → emit WGPU_FALLBACK_LOG_PREFIX tagged log, return None, fall to CPU. Symmetric to FALSIFY-CPU-GPU-003 CUDA parity_gate. Algorithm-level discharge; live broken-GPU smoke deferred to a verification PR.'
  - '1.2.0 — 2026-05-03 — added FALSIFY-CPU-GPU-005 (wgpu visibility + parity-gate symmetry). Closes the second half of the silent-fallback loophole: even after #1428 made CUDA rejection visible, the wgpu fallback path still ships gibberish silently for the same canonical 7B teacher because (a) its init/abort logs are verbose-gated and (b) it has no parity_gate analog. Visibility-log fix lands in this revision; the cosine-similarity gate is bound at PARTIAL_ALGORITHM_LEVEL pending a follow-up implementation PR (~100-150 LOC).'
  - '1.1.0 — 2026-05-03 — corrected FALSIFY-CPU-GPU-003 algorithm_evidence: parity_gate IS already wired into the .apr → OwnedQuantizedModelCuda path via with_max_seq_len:268-279 (called from load_apr_cuda_model:487). The user-visible gap was that CUDA failure (e.g. ILLEGAL_ADDRESS during gate forward, or cosine < 0.99) was logged only in --verbose mode — fallback then hits wgpu which itself produces gibberish, so the user saw silent gibberish. PR converts the fallback log to unconditional one-line eprintln so the GPU rejection is always visible. Promoted contract from PROPOSED → ACTIVE.'
  description: >
    CPU-vs-GPU output parity contract. Codifies that for any model and prompt,
    `apr run` GPU output MUST match `apr run --no-gpu` CPU output (modulo
    floating-point precision noise) for greedy decode (`--temperature 0.0`).
    Triggered by SHIP-007 v5: the canonical Qwen2.5-Coder-7B teacher produces
    "ampiezza = 0.5\ndiametro = 10" (gibberish) on GPU but "2 + 2 equals 4."
    on CPU for the same prompt "What is 2+2?". Existing parity_gate covers
    only the `gguf::cuda::OwnedQuantizedModelCuda` path used by `apr parity`
    and `apr run --force-gpu`; the default `.apr` load path (trueno manual
    graph, 646 kernels) has NO gate and produces gibberish silently.

cli_signature: |
  # The contract applies at the level of `apr run` user-observable output.
  # Two invocations on the same model+prompt+greedy-decode MUST produce the
  # same first-token output (and ideally identical token sequences) regardless
  # of GPU/CPU backend selection:
  #
  #     apr run <model> --prompt <P> --max-tokens N --temperature 0.0
  #     apr run <model> --prompt <P> --max-tokens N --temperature 0.0 --no-gpu
  #
  # Acceptable divergence: floating-point precision (cosine ≥ 0.99 on
  # last-token logits, argmax must match for greedy decode).
  # Unacceptable divergence: any cosine < 0.99 OR argmax mismatch.

byte_format: |
  N/A — this is an output-parity contract, not a serialization contract.

equations:
  greedy_argmax_parity:
    formula: |
      argmax(softmax(GPU_logits)) == argmax(softmax(CPU_logits))
      for all (model, prompt) pairs at temperature=0 (greedy decode).
    domain: |
      (Model M loaded from .apr or .gguf, prompt P, temperature=0.0)
      → (first-token argmax) on each backend
    codomain: u32 token id
    invariants:
    - "For greedy decode, GPU and CPU MUST produce IDENTICAL first token"
    - "Argmax mismatch immediately indicates a kernel correctness bug"
    - "Magnitude of logit error doesn't matter for argmax — only the ranking"
    - "This is the strictest possible parity test (no tolerance band)"

  cosine_parity:
    formula: |
      cosine_similarity(GPU_last_token_logits, CPU_last_token_logits) >= 0.99
    domain: same as above
    codomain: float in [-1, 1]
    invariants:
    - "Cosine ≥ 0.99 is the existing parity_gate threshold (mod_parity_gate.rs)"
    - "This is a softer test — a borderline-broken kernel may pass cosine but fail argmax"
    - "Run BOTH cosine and argmax parity to catch both numerical and structural bugs"

  no_gpu_flag_honor:
    formula: |
      `apr run --no-gpu` MUST use only CPU code paths,
      no GPU initialization, no CUDA graph construction.
    domain: apr run invocation with --no-gpu set
    codomain: process behavior + output
    invariants:
    - "Flag is honored: no [trueno#243] manual graph log line"
    - "Flag is honored: no [PMAT-082] cuBLAS init log line"
    - "Output is correct: matches HF FP16 reference argmax for canonical 7B teacher"
    - "Performance is competitive: CPU FP16 must complete within 2× GPU latency, ideally faster (current state: CPU is faster on canonical 7B)"

falsification_tests:
- id: FALSIFY-CPU-GPU-001
  rule: greedy first-token argmax matches between GPU default and --no-gpu on canonical 7B teacher
  prediction: |
    `apr run /mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.apr
        --prompt "What is 2+2?" --max-tokens 1 --temperature 0.0`
    AND
    `apr run [...] --max-tokens 1 --temperature 0.0 --no-gpu`
    MUST produce IDENTICAL output. As of 2026-05-03 v5 finding, GPU produces
    "ampie" while CPU produces "2".
  test: "operator-driven smoke documented in evidence/ship-007-layer-0-oracle-bisection-2026-05-03/findings-v5-gpu-path-confirmed.md"
  if_fails: "MODEL-1 cannot ship via GPU — falls back to CPU-only (`--no-gpu` default)"
  binds_to: greedy_argmax_parity
  status: PARTIAL_ALGORITHM_LEVEL
  algorithm_evidence:
  - "Reproducer documented in evidence/ship-007-.../findings-v5-gpu-path-confirmed.md"
  - "v5 falsifier executed 2026-05-03: GPU=ampie, CPU=2 → FALSIFIED, bug exists"
  - "Implementation: extending mod_parity_gate.rs to cover .apr trueno graph init in OwnedQuantizedModel::from_apr → trueno_gpu pipeline; currently the gate only fires for gguf::cuda::OwnedQuantizedModelCuda construction"

- id: FALSIFY-CPU-GPU-002
  rule: cosine similarity of last-token logits ≥ 0.99 between GPU and CPU paths on canonical teacher
  prediction: |
    Existing `apr parity` command implements this for .gguf load path.
    On canonical 7B teacher .gguf, currently reports cosine = -0.005 (FALSIFIED).
    The .apr load path (no parity command exists) almost certainly has the
    same divergence since `OwnedQuantizedModel::from_apr` is shared between
    the gguf::cuda path (which apr parity tests) and the trueno graph path
    (which apr run uses by default for .apr).
  test: "apr parity <model.gguf> --prompt 'What is 2+2?' --assert"
  if_fails: "GPU forward kernel correctness violated; same as FALSIFY-CPU-GPU-001"
  binds_to: cosine_parity
  status: PARTIAL_ALGORITHM_LEVEL
  algorithm_evidence:
  - "Live `apr parity /mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.gguf --prompt 'What is 2+2?' --assert` exit 1 with cos=-0.005, CPU argmax=334 vs GPU argmax=8127"
  - "Implementation: crates/aprender-serve/src/gguf/cuda/mod_parity_gate.rs (cosine_similarity, parity_gate)"
  - "Test exists, but the test EXPECTS to detect divergence — not yet a passing gate"

- id: FALSIFY-CPU-GPU-003
  rule: parity gate is enforced at `apr run` GPU init AND its decision is visible without --verbose
  prediction: |
    `apr run <model.apr> --prompt <P>` (default GPU) MUST run a parity gate
    during model load. If the gate fails (cos < 0.99 or argmax mismatch, or
    the gate's own GPU forward errors), the user MUST see a one-line stderr
    diagnostic identifying that the CUDA path was rejected — without needing
    --verbose. Silent fallback is unacceptable because the next-tier backend
    (wgpu) on canonical 7B teacher today ALSO emits gibberish, leaving the
    user looking at garbage with no signal.
  test: |
    apr run <broken-gpu-model> --prompt 'What is 2+2?' --max-tokens 1
      --temperature 0.0
    SHOULD emit on stderr (without --verbose):
      [apr-cpu-vs-gpu-output-parity-v1] CUDA path rejected, attempting fallback: <error>
    AND ideally also:
      (a) error out cleanly, OR
      (b) fall back to a backend that produces correct output.
    NOT:
      (c) silently emit gibberish with no hint that GPU was rejected (pre-fix behavior).
  if_fails: "Users can run `apr run` and silently get garbage output; no jidoka stop-the-line for GPU correctness in default path"
  binds_to: greedy_argmax_parity
  status: PARTIAL_ALGORITHM_LEVEL
  algorithm_evidence:
  - "Existing `parity_gate` function in crates/aprender-serve/src/gguf/cuda/mod_parity_gate.rs IS wired into `OwnedQuantizedModelCuda::with_max_seq_len` (mod.rs:268-279)"
  - "Empirical 2026-05-03: that gate IS exercised on the .apr GPU path because load_apr_cuda_model:487 calls with_max_seq_len → preload_and_verify → parity_gate. The trueno-graph claim from v1.0.0 was incorrect."
  - "Empirical 2026-05-03 with `apr -v run` on canonical 7B teacher: gate's GPU forward errors with `CUDA_ERROR_ILLEGAL_ADDRESS (code: 700)` during forward_all_layers_gpu_to_logits_graphed, surfaced via verbose-only line `Backend: CPU (GPU unavailable: Inference error: PARITY-GATE: GPU forward failed: ...)` — see findings-v6"
  - "User-visible regression: pre-fix the verbose-only log meant default `apr run` on the broken canonical teacher produced wgpu-gibberish output with NO stderr signal that GPU had been rejected"
  - "Fix wired in this revision: `gguf_gpu_generate.rs:487-494` now emits one unconditional eprintln tagged with this contract ID when CUDA init/parity rejects the path, so users always see the fallback decision"
  - "Drift-prevention: regression test should grep stderr for the `[apr-cpu-vs-gpu-output-parity-v1] CUDA path rejected` tag on a deliberately broken or non-CUDA host"
  - "Remaining work for FUNCTIONAL discharge: extend wgpu path with its own parity gate so that wgpu-gibberish does not slip through after CUDA fallback (tracked under a follow-up FALSIFY-CPU-GPU-005)"

- id: FALSIFY-CPU-GPU-004
  rule: --no-gpu flag is honored — no GPU init when set
  prediction: |
    `apr run --no-gpu <model> ...` MUST NOT load CUDA graph kernels,
    MUST NOT call cuBLASLt JIT, MUST NOT consume VRAM.
    Stderr should contain NEITHER `[trueno#243]` NOR `[PMAT-082]` log lines.
  test: |
    apr run --no-gpu <model> --prompt 'test' 2>&1 | grep -E '\[trueno#243\]|\[PMAT-082\]' | wc -l
    Result MUST be 0.
  if_fails: "Users explicitly opting out of GPU still pay GPU init cost (or error if no GPU available)"
  binds_to: no_gpu_flag_honor
  status: FUNCTIONAL
  algorithm_evidence:
  - "Live `apr run [...] --no-gpu` produces ONLY [PMAT-171] [GH-175] [GH-189] log lines, NO [trueno#243] or [PMAT-082]"
  - "Implementation: crates/apr-cli/src/commands/run.rs (--no-gpu flag clap definition at line 138)"
  - "Implementation: crates/aprender-serve/src/infer/mod.rs (no_gpu boolean propagated to dispatch)"
  - "Verified empirically 2026-05-03: --no-gpu run completed in 9.81s vs GPU 72.95s, no GPU log lines emitted"
  functional_evidence:
  - "Live smoke 2026-05-03 on canonical 7B teacher: --no-gpu produces correct '2 + 2 equals 4.' in 9.81s with no GPU log lines"

- id: FALSIFY-CPU-GPU-005
  rule: wgpu fallback path must (a) log its lifecycle visibly without --verbose AND (b) run a parity gate at init analogous to CUDA's parity_gate
  prediction: |
    When the CUDA path is rejected (FALSIFY-CPU-GPU-003), `apr run`
    transparently falls through to wgpu (`try_apr_wgpu_inference`,
    gguf_gpu_generate.rs:297). The wgpu path ALSO produces gibberish on
    the canonical 7B teacher (v6 evidence). User-visible behaviour MUST
    be:
      (a) wgpu init/error logs are non-verbose-gated — user sees
          "Backend: wgpu (Vulkan)" or "[GH-559] wgpu init failed: ..."
          without --verbose, just like CUDA.
      (b) wgpu init runs a one-token CPU-vs-wgpu cosine check on the
          BOS token. If cosine < 0.99 OR argmax mismatch, return None
          → fall through to CPU. Tagged stderr line:
          `[apr-cpu-vs-gpu-output-parity-v1] wgpu path rejected, attempting fallback: <reason>`
  test: |
    apr run <broken-gpu-model.apr> --prompt 'What is 2+2?' --max-tokens 1
      --temperature 0.0 2>&1 | tee /tmp/run.log
    SHOULD show:
      [apr-cpu-vs-gpu-output-parity-v1] CUDA path rejected, ...   (existing FALSIFY-CPU-GPU-003)
      Backend: wgpu (Vulkan)                                       (NEW: visible without -v)
      [apr-cpu-vs-gpu-output-parity-v1] wgpu path rejected, ...   (NEW: parity gate)
      Backend: CPU (correct output follows)
    AND the final stdout output should be the CPU-produced "2 + 2 equals 4." (or equivalent), NOT wgpu's gibberish.
  if_fails: "Even after the CUDA jidoka log, wgpu can still ship silent gibberish — the loophole is not closed"
  binds_to: greedy_argmax_parity
  status: PARTIAL_ALGORITHM_LEVEL
  algorithm_evidence:
  - "Symptom replicated 2026-05-03: with apr 0.31.2 and PR #1428 landed, default-mode `apr run` on canonical 7B teacher: CUDA logs `[apr-cpu-vs-gpu-output-parity-v1] CUDA path rejected` (good — #1428's contribution), then wgpu silently runs and ships 'ampiezza = 10\\nampie'"
  - "Visibility (a) implementation in this revision: gguf_gpu_generate.rs:305-323 — drop `if config.verbose` from the [GH-559] wgpu init failed and Backend: wgpu (Vulkan) eprintlns"
  - "Parity gate (b) implementation landed 2026-05-03 inline at try_apr_wgpu_inference (gguf_gpu_generate.rs ~line 441-510, between kv_caches init and the autoregressive loop start). Algorithm: (1) take input_tokens.first() as the probe token (typically BOS); (2) run one CPU forward via OwnedQuantizedModel::forward_single_with_cache with a tiny temporary OwnedQuantizedKVCache::from_config(cfg, 2) — gives reference logits without contaminating the real autoregressive kv_caches; (3) run one wgpu single-step replay using the same fwd.forward_layer code path the autoregressive loop uses, with a separate probe_kv_caches vec (max_seq=2, also tiny); (4) replay the loop's output_norm + lm_head argmax math on the wgpu hidden state to get wgpu_logits; (5) compute cosine = cpu_vs_gpu_cosine_similarity(&cpu_logits, &wgpu_logits) (the helper added in PR #1440 — module-scope, no --features cuda dep); (6) if !(cos.is_finite() && cos >= 0.99) emit the WGPU_FALLBACK_LOG_PREFIX tagged stderr line and return None — the caller then falls through to CPU. Both probe error paths (CPU forward failure, wgpu probe layer failure) also emit the contract-tagged log and return None. Net: silent-gibberish loophole closed at the wgpu init boundary, symmetric to FALSIFY-CPU-GPU-003's parity_gate for CUDA."
  - "Drift-prevention: cpu_vs_gpu_cosine_similarity_{parallel_returns_one,orthogonal_returns_zero,fails_closed} unit tests in gguf_gpu_generate.rs::tests lock the math; CUDA_FALLBACK_LOG_PREFIX and WGPU_FALLBACK_LOG_PREFIX const + the 3 prefix tests lock the user-facing eprintln tag shape. Future regression: a refactor that swaps the helper or the constants without bumping this contract version trips a unit-test failure."
  - "Live-evidence still pending for full DISCHARGED: needs a `apr run <broken-gpu-model.apr>` smoke on the canonical 7B teacher to confirm cosine fires, the WGPU tag prints, and CPU output follows — call out as a separate verification PR. Algorithm-level discharge holds today via the unit-tested cosine helper + compile-verified call site."

proof_obligations:
- type: invariant
  property: "apr run greedy first-token argmax is identical between GPU and --no-gpu paths"
- type: invariant
  property: "apr run with .apr file MUST run parity gate (currently only .gguf path has one)"
- type: completeness
  property: "all 5 falsifiers (greedy argmax, cosine, CUDA gate enforced, no-gpu honored, wgpu gate enforced) cover the parity surface"
- type: liveness
  property: "if GPU parity gate fails on ANY backend (CUDA or wgpu), user gets either an explicit error OR a CPU fallback — never silent gibberish"

verification_summary:
  total_obligations: 5
  proven: 0
  tested: 0
  status: pending

obligation_coverage:
  computational_cost: 'O(1) per `apr run` invocation: one extra forward pass at init for the parity smoke (already implemented for gguf::cuda path)'
  reproducible_seed: 'fixed prompt "What is 2+2?", greedy decode at temperature 0.0, max_tokens=1'
  reference_for_oracle: '`apr run --no-gpu` (CPU scalar-loop path; v5 evidence shows it produces correct output on canonical 7B teacher)'
