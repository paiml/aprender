- type: invariant
  property: "the CUDA first-token parity gate accepts a near-tie argmax flip on a peaked real-context probe and rejects only real divergence (no false-positive CPU fallback on a correct GPU path) — PMAT-742"
- type: invariant
  property: "apr run greedy first-token argmax is identical between GPU and --no-gpu paths"
- type: invariant
  property: "apr run with .apr file MUST run parity gate (currently only .gguf path has one)"
- type: completeness
  property: "all 11 falsifiers (greedy argmax, cosine, CUDA gate enforced, no-gpu honored, wgpu gate enforced, multi-step wgpu, no-false-positive, PMAT-806 Blackwell outlier, PMAT-810 Blackwell graph+prefill default, PMAT-885 Blackwell decode-throughput floor, PMAT-886a Blackwell graph-replay GEMV-recording) cover the parity surface"
