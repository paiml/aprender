    - version: 1.3.0
      date: '2026-05-04'
      kind: amendment
      title: 'M-GPU-MOE-1.3 — preload_weights_gpu MoE-awareness fix (CudaExecutor::build_indexed_weights)'
      description: |
        Records the discovery + fix-architecture decision for the
        live-dogfood finding 2026-05-04: the M-GPU-MOE-1.2 heavy
        `qwen3_moe_gpu_parity` test (FALSIFY-QW3-MOE-GPU-PARITY-001)
        cannot run on the cached 17.3 GB Qwen3-Coder-30B-A3B-Instruct
        GGUF because `OwnedQuantizedModelCuda::new` itself fails
        before forward dispatch. See evidence file at:
        `evidence/m-gpu-moe-1-2-blocked-by-preload-bug-2026-05-04/findings.md`.

        ROOT CAUSE (5-whys in evidence file):

          The constructor calls `preload_weights_gpu` which calls
          `executor.build_indexed_weights(num_layers, ..., arch)`.
          That function unconditionally requires
          `blk.{i}.ffn_gate.weight`, `.ffn_up.weight`,
          `.ffn_down.weight` to be in the GPU weight cache for
          every layer. For MoE layers these names DO NOT EXIST —
          MoE has 128 expert gates per layer
          (`blk.{i}.ffn_gate_exps.weight`) loaded into the
          `moe_layers` parameter at forward time, not the indexed
          dense path.

        WHY M-GPU-MOE-1.1.2 (PR #1477) didn't surface this:

          The full forward integration's body sidesteps
          `indexed_layer_weights` for the FFN section (uses
          `moe_layers` directly). But the wrapper construction goes
          through `preload_weights_gpu` BEFORE forward is called.
          Wrapper construction fails first; forward never executes.

        WHY default CI didn't catch this:

          The lib-only `forward_qwen3_moe_cuda_stub_compiles_*` test
          (PR #1464) only checks the function signature at compile
          time. The heavy `qwen3_moe_gpu_parity.rs` test (PR #1484)
          is `#[ignore]`d by default and requires both RTX 4090 +
          17.3 GB cached GGUF — neither in default CI. The bug is
          only discoverable via `--include-ignored` on lambda-vector,
          which 2026-05-04's dogfood was the first to exercise.

        FIX ARCHITECTURE (M-GPU-MOE-1.3):

          Three-step fix:

          (1) Add `is_moe` field to `ArchConstraints` (or expose as
              `arch.is_moe()` method) wired from
              `arch-constraints-v1.yaml` (set to `true` for
              `qwen3_moe`).

          (2) `build_indexed_weights` (`crates/aprender-serve/src/cuda/executor/weights.rs:325-373`)
              gates the 3 FFN-related lookups on `is_moe`:

                let (ffn_gate_ptr, ffn_gate_len) = if is_moe {
                    (0u64, 0usize)  // MoE: weights live in moe_layers param
                } else {
                    get_qweight(&gate_name)?
                };
                // (same pattern for ffn_up, ffn_down + their qtypes)

              The 0/0 sentinel is safe because for MoE layers the
              indexed FFN pointers are never dereferenced —
              `forward_qwen3_moe_cuda` routes FFN through
              `moe_ffn_forward_layer_cuda` which uses the
              `moe_layers` parameter directly.

          (3) Drift-prevention test
              `falsify_qw3_moe_gpu_preload_no_dense_ffn_lookup`
              (lib-only, no hardware dependency) — constructs a
              minimal mock `ArchConstraints` with `is_moe = true`
              and asserts `build_indexed_weights` succeeds without
              the FFN names being cached. This catches future
              regression to the unconditional-lookup behaviour.

        NEW FALSIFICATION TEST (this amendment):

          FALSIFY-QW3-MOE-GPU-PRELOAD-001 — guards against the
          preload bug returning. Test predicate: on any qwen3_moe
          GGUF, `OwnedQuantizedModelCuda::new(model, 0)` must
          succeed. Hardware-dependent; runs as part of the
          M-GPU-MOE-1.2 heavy test cascade.

        WHY NOT JUST FIX IT WITHOUT A CONTRACT BUMP?

          Per CLAUDE.md "NEVER write code before writing a provable
          contract": the bug class (MoE-unaware GPU weight indexing)
          is a load-bearing architectural assumption that needs to
          be pinned in the contract. v1.0.0 → v1.1.0 → v1.2.0
          progressively pinned the integration architecture (option
          D → option I); v1.3.0 pins the MoE-vs-dense weight-cache
          dispatch. Future GPU-MoE backends (v2.0.0+) will inherit
          this constraint.

        IMPLEMENTATION_STAGES UPDATE: M-GPU-MOE-1.3 added between
        M-GPU-MOE-1.2 (cosine parity test scaffold, SHIPPED at
        M52/M54) and M-GPU-MOE-2 (wgpu fallback). M-GPU-MOE-1.2's
        `--include-ignored` heavy run is BLOCKED on M-GPU-MOE-1.3
        landing first.

    - version: 1.2.0
      date: '2026-05-04'
      kind: amendment
      title: 'M-GPU-MOE-2 wgpu-fallback architecture decision: option I (OwnedQuantizedModelWgpu, analog of v1.1.0 option D)'
      description: |
        Records the architectural-seam decision that gates M-GPU-MOE-2
        (wgpu fallback, per CLAUDE.md backend-agnostic mandate). Mirrors
        the v1.1.0 option D amendment which pinned the CUDA substrate
        BEFORE M-GPU-MOE-1.0 implementation; this amendment pins the
        wgpu substrate before any wgpu code lands.

        WHY THIS MATTERS NOW: M-GPU-MOE-1 implementation is in flight
        (M-GPU-MOE-1.0-redo SHIPPED, M-GPU-MOE-1.1.1 SHIPPED,
        M-GPU-MOE-1.1.2 OPEN as aprender PR #1477, M-GPU-MOE-1.2 test
        scaffold OPEN as aprender PR #1484). Choosing the wgpu seam
        early prevents the "wrong-type stub" wasted cycle that hit
        M-GPU-MOE-1.0 (PR #1460 placed forward_qwen3_moe_gpu on
        OwnedQuantizedModel; one cycle later we realized
        OwnedQuantizedModelCuda was the correct seam and had to redo
        the stub in PR #1464).

        FOUR integration options for the wgpu fallback were considered:

          (I) Mirror v1.1.0 option D: a new wrapper type
              OwnedQuantizedModelWgpu with method forward_qwen3_moe_wgpu
              - Wraps OwnedQuantizedModel + holds a wgpu::Device +
                wgpu::Queue + cached wgpu::ComputePipelines for the
                trueno-gpu kernels (QuantizeKernel for Q4_K dequant,
                GemmKernel for matmul, etc.).
              - Per-expert SwiGLU dispatches gate Q4_K matmul + up Q4_K
                matmul + SiLU + down Q6_K matmul through the cached
                pipelines, mirroring expert_swiglu_cuda's three-matmul
                pattern.
              - Pros: Maximum symmetry with v1.1.0 option D; reviewers
                already understand the precedent; new file
                `crates/aprender-serve/src/gguf/wgpu/forward_qwen3_moe_wgpu.rs`
                line-for-line analog of forward_qwen3_moe_cuda;
                helpers `wgpu/expert_swiglu_wgpu.rs` +
                `wgpu/moe_ffn_forward_layer_wgpu.rs` analog of the
                M-GPU-MOE-1.1.1 helpers.
              - Cons: Code duplication between cuda/ and wgpu/ trees;
                future cross-backend bug fixes touch two places.
              CHOSEN.

          (II) Generic GPU trait — define `GpuExecutor` impl'd by
               CudaExecutor + a new WgpuExecutor; parameterize
               forward_qwen3_moe_gpu<E: GpuExecutor> by executor type.
              - Pros: One forward function for both backends; future
                bug fixes auto-apply to both.
              - Cons: Invasive — touches the existing
                `OwnedQuantizedModelCuda::forward_qwen3_moe_cuda`
                signature already shipped in M-GPU-MOE-1.0-redo;
                forces every CUDA call site to migrate to the trait;
                the trait surface area is large (q4k_matvec, q6k_gemv,
                kernel_cache, prefix_cache, embed_buf, ...) and not
                all primitives have wgpu equivalents in trueno-gpu
                yet (e.g. prefix_cache is CUDA-only). Also: refactor
                cost is ~5x option I and the user already ratified
                "MODEL-1 ships GPU only" — abstraction is premature.
              REJECTED.

          (III) Runtime backend enum inside OwnedQuantizedModelCuda —
                rename to OwnedQuantizedModelGpu + add
                `enum Backend { Cuda(CudaExecutor), Wgpu(WgpuExecutor) }`
                + branch on every method.
              - Pros: One type covers both.
              - Cons: Renames the type that's been the public surface
                for `apr run --features cuda` since GH-87 (March
                2026). Touches every existing CudaExecutor call site
                with a runtime branch; CudaExecutor APIs that don't
                map to wgpu (custom PTX kernels, CUDA streams,
                cuBLAS) become Result::Err on the Wgpu arm — runtime
                error class instead of compile-time prevention. Same
                "invasive" failure mode as v1.1.0 option A.
              REJECTED.

          (IV) Defer wgpu indefinitely — mark M-GPU-MOE-2 as out of
               scope for this contract; add a v2 contract when
               needed.
              - Pros: Zero amendment; ships nothing.
              - Cons: Violates CLAUDE.md backend-agnostic mandate
                (paragraph "Backend Agnostic — CPU (SIMD), GPU, WASM
                via Trueno"); leaves the contract permanently DRAFT
                because the v1.0.0 status block requires "wgpu
                fallback + throughput target also discharge" for
                ACTIVE_RUNTIME flip; effectively concedes that GPU
                MoE only works on CUDA hardware (no Apple Silicon, no
                AMD, no Intel ARC).
              REJECTED.

        DECISION: Option I. Implementation lives at
        `crates/aprender-serve/src/gguf/wgpu/` (new directory mirroring
        `crates/aprender-serve/src/gguf/cuda/`). Type:
        `OwnedQuantizedModelWgpu`. Forward method:
        `forward_qwen3_moe_wgpu(...)`. Per-layer helper:
        `moe_ffn_forward_layer_wgpu`. Per-expert SwiGLU helper:
        `expert_swiglu_wgpu`. The existing CUDA tree (M-GPU-MOE-1.0
        through 1.2) is untouched — backend parity by code-path
        symmetry, not by trait abstraction.

        Naming convention note: cuda methods carry `_cuda` suffix
        (forward_cuda, forward_qwen3_moe_cuda, q4k_matvec_cuda — the
        last is implicit in CudaExecutor's API). The wgpu sibling
        methods carry `_wgpu` suffix to preserve symmetry.

        Implementation stages updated to reflect option I (no change
        to M-GPU-MOE-0 / 0.5 / 1.x / 3 — only M-GPU-MOE-2 detail
        expansion):

          M-GPU-MOE-0    Contract scaffold (v1.0.0)              SHIPPED ✓
          M-GPU-MOE-0.5  v1.1.0 option D amendment               SHIPPED ✓
          M-GPU-MOE-0.6  v1.2.0 option I amendment (THIS PR)     SHIPPED ✓
          M-GPU-MOE-1.0  Stub on OwnedQuantizedModelCuda         SHIPPED ✓ (PR #1464)
          M-GPU-MOE-1.1  Per-expert CUDA dispatch                SHIPPED ✓ (PR #1469)
          M-GPU-MOE-1.1.2 Full forward integration               OPEN (PR #1477)
          M-GPU-MOE-1.2  Cosine-vs-CPU parity test scaffold      OPEN (PR #1484)
          M-GPU-MOE-2.0  Stub on new OwnedQuantizedModelWgpu     PENDING
                          (analog of M-GPU-MOE-1.0-redo for wgpu)
          M-GPU-MOE-2.1  Per-expert wgpu dispatch via            PENDING
                          trueno-gpu QuantizeKernel + GemmKernel
                          (analog of M-GPU-MOE-1.1.1)
          M-GPU-MOE-2.2  Full forward integration                PENDING
                          (analog of M-GPU-MOE-1.1.2)
          M-GPU-MOE-2.3  Cosine-vs-CPU parity test (wgpu)        PENDING
                          (analog of M-GPU-MOE-1.2)
          M-GPU-MOE-3    Throughput ≥150 tok/s + VRAM ≤95%       PENDING

        Why this matters: option I has the same load-bearing virtue
        that made v1.1.0 option D the right call — it's the option
        a maintenance-mode reviewer can verify by code reading rather
        than by running CI. Adding a new file tree under wgpu/ that
        mirrors cuda/ line-for-line means a parity bug is caught by
        diff, not by elaborate test infrastructure.

        Recording cadence: companion-spec records this as M52
        (cross-repo bookkeeping, no companion contract bump).

    - version: 1.1.0
      date: '2026-05-04'
      kind: amendment
      title: 'M-GPU-MOE-1.1 integration-architecture decision: option D (OwnedQuantizedModelCuda)'
      description: |
        Records the architectural-seam decision that gates M-GPU-MOE-1.1
        (per-expert CUDA dispatch). Mirrors the qwen3-moe-forward-v1
        v1.2.0 amendment (M32c.2.2.2.1) which picked between three
        integration options for the CPU path before any kernel work
        could land.

        The v1.0.0 contract scaffold (M-GPU-MOE-0) was authored from
        outside the code: it specified WHAT GPU MoE means (cosine
        ≥0.99 vs CPU, ≥150 tok/s, ≤95% VRAM) but left WHERE in the
        type hierarchy unspecified. The first-cut M-GPU-MOE-1.0 stub
        (PR #1460) made an implicit choice — placed the function on
        `OwnedQuantizedModel` — that this amendment now overrides.

        FOUR integration options were considered:

          (A) Add GPU state directly to OwnedQuantizedModel
              - Add HybridScheduler, GPU expert tensor handles, etc.
                as fields on OwnedQuantizedModel.
              - Pros: Uniform forward path; CPU/GPU dispatch picks at
                method call time.
              - Cons: Invasive — touches every CPU-MoE call site;
                forces a runtime branch on whether GPU state is
                populated; couples a CPU-pure type to GPU dependencies.
              REJECTED.

          (B) Thread &HybridScheduler / &mut GpuModel into
              forward_qwen3_moe_gpu's signature
              - Add a parameter that doesn't exist on the CPU sibling.
              - Pros: No type changes.
              - Cons: Breaks signature parity with forward_qwen3_moe;
                forces every caller to plumb scheduler state through.
              REJECTED.

          (C) Spawn a transient GpuModel-like helper inside
              forward_qwen3_moe_gpu for the duration of one forward pass
              - Construct/teardown CUDA buffers per token call.
              - Pros: Stateless to the caller.
              - Cons: Resource thrash on every token; allocates GPU
                buffers in the hot path; unviable performance-wise.
              REJECTED.

          (D) Mirror the existing OwnedQuantizedModelCuda pattern —
              add forward_qwen3_moe_cuda as a method on the existing
              CUDA wrapper type
              - OwnedQuantizedModelCuda already exists at
                crates/aprender-serve/src/gguf/cuda/mod.rs:106.
              - Wraps OwnedQuantizedModel + holds CudaExecutor + GPU
                buffers (embed_buf, prefix_cache).
              - Existing forward_cuda method (cuda.rs:18) already does
                "CPU attention + CUDA FFN matmul" — the established
                pattern this contract should extend, not invent a new
                substrate.
              - Pros: Zero new types; reuses CudaExecutor cache,
                memory-info tracking, prefix-cache; signature parity
                preserved (just on a different self type); follows
                the same precedent that made forward_cuda's
                incremental landing work.
              - Cons: forward_qwen3_moe_cuda needs Qwen3MoeQuantizedLayer
                descriptors to be reachable from OwnedQuantizedModelCuda;
                already trivially reachable via self.model.layers and
                separate moe_layers parameter.
              CHOSEN.

        DECISION: Option D. The implementation lives at
        `OwnedQuantizedModelCuda::forward_qwen3_moe_cuda` (note the
        `_cuda` suffix matching the existing `forward_cuda` precedent,
        not `_gpu`). The first-cut M-GPU-MOE-1.0 stub on
        OwnedQuantizedModel (PR #1460) is RETIRED in favor of the
