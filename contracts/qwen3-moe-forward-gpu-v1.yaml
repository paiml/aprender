metadata:
  version: 1.8.0
  kind: kernel
  created: '2026-05-04'
  author: PAIML Engineering
  amendment_history:
    - version: 1.8.0
      date: '2026-05-19'
      kind: amendment
      title: 'M-GPU-MOE-3 cascade DISCHARGE — true root cause is CPU/CUDA activation-qtype algorithm mismatch (NOT SwiGLU intermediates as v1.7.2 claimed)'
      description: |
        Discharge amendment for the full M-GPU-MOE-3 cascade. Seven
        falsifier PRs (#1801, #1805, #1811, #1816, #1818, #1821, #1822)
        across two sessions empirically pinned the true root cause of
        the 0.94-cos drop on real Qwen3 layers L7/L9/L12/L20/L23/L29/L46.

        FALSIFIER SEQUENCE — all on lambda-vector RTX 4090 with apr 0.34.0:

          #1801 FALSIFY-Q6K-FP-ACC-001        — synthetic Q6_K matvec
                  reduction-order divergence is ULP-SCALE (~6e-7),
                  not the 6% needed to explain the cos drop.
          #1805 FALSIFY-Q6K-AMP-002           — activation distribution
                  amplification is FLAT (uniform/log-normal/outlier
                  all produce ~1e-7 to 2e-6 rel_diff).
          #1811 FALSIFY-Q6K-CHAIN-003         — chain length compounding
                  is FLAT (N=1 to N=48 same ulp floor).
          #1816 FALSIFY-Q6K-REAL-WEIGHT-004   — real Qwen3 Q6_K weights
                  match the synthetic ulp-scale floor. STRUCTURAL
                  FINDING: 3 of 7 'problem layers' (L7/L9/L12) use
                  Q4_K (not Q6_K) for ffn_down_exps — refutes the
                  Q6_K-specific framing in v1.0.0..v1.7.2.
          #1818 FALSIFY-SWIGLU-CPU-CUDA-005   — SwiGLU intrinsic precision
                  (CPU f32::exp vs CUDA ex2.approx.f32) is ULP-SCALE
                  across all input distributions, including extreme
                  [-20, 20] range. **REFUTES v1.7.2's attribution of
                  the L47 cliff to per-expert SwiGLU f32 intermediates.**
          #1821 FALSIFY-Q4K-REAL-WEIGHT-006   — real Qwen3 Q4_K weights
                  produce 5.47% rel_diff vs CPU on a single matvec —
                  237,775× the Q6_K baseline. Misattributed the bug
                  to CUDA q4k_matvec.
          #1822 FALSIFY-Q4K-BISECT-007        — DISCHARGE. Three-path
                  bisection (CPU fused vs CPU dequant+naive vs CUDA)
                  INVERTED #1821: CPU dequant+naive ≈ CUDA at 5e-7,
                  CPU fused diverges from BOTH by the SAME 2.88%.
                  Reading parallel_k.rs:181-182 docstring confirmed:
                  CPU fused_q4k_parallel_matvec pre-quantizes
                  activations to Q8_K (integer math via maddubs,
                  ~4-8× speedup); CUDA q4k_matvec uses f32 activations.

        TRUE ROOT CAUSE:

          CPU fused_q4k_parallel_matvec  = Q4_K(weights) × Q8_K(activations)
          CUDA q4k_matvec                = Q4_K(weights) × f32_activations

          These are DIFFERENT MATHEMATICAL OPERATIONS. The 2.88% per-matvec
          delta is lossy Q8_K activation quantization. Compounded across
          128 experts × 48 layers, it produces the observed ~6%
          cumulative cos drop on the 7 problem layers.

          The v1.7.2 'per-expert SwiGLU f32 intermediates' attribution
          was refuted by #1818 and superseded by #1822's bisection.
          The earlier 'fp-accumulator-order alignment' framing (v1.0.0..
          v1.7.1) was also refuted (#1801/#1816 show ulp-scale Q6_K
          per-matvec). All previous hypotheses are now FALSIFIED with
          in-tree empirical evidence.

        FIX PATHS (out-of-scope for this amendment; fix is a separate PR):

          OPTION 1 — CPU uses f32 activations to match CUDA.
                     Slows CPU significantly (loses maddubs 4-8× speedup).

          OPTION 2 — CUDA uses Q8_K activations to match CPU.
                     Requires a new CUDA kernel: f32 → Q8_K activation
                     quantization. The downstream Q4_K × Q8_K matvec
                     already exists in trueno-gpu as
                     PackedDp4aQ4KQ8Kernel (DP4A integer math on
                     Ampere+) — could be FASTER than the current
                     q4k_matvec f32 path.

          OPTION 3 — Document the algorithmic divergence; relax the
                     cos≥0.99 gate to cos≥0.93 to reflect reality.
                     Cheapest; defers the perf trade-off.

        Recommended fix path: OPTION 2 (CUDA Q8_K activation quant).
        Tracked as M-GPU-MOE-3 PR-4 in #1583.

        STATUS CHANGE:

          v1.7.2: ACTIVE_ALGORITHM_LEVEL (47/48 layers cos≥0.99,
                  L47 KNOWN_DIVERGENCE_NOT_BENIGN attributed to
                  SwiGLU f32 — now REFUTED).

          v1.8.0: ACTIVE_ALGORITHM_LEVEL_WITH_DOCUMENTED_DIVERGENCE
                  (47/48 layers cos≥0.99 stands; root cause is
                  documented activation-qtype mismatch, not a
                  per-layer kernel bug; multi-layer 0.94-cos drop
                  on L7/L9/L12/L20/L23/L29/L46 is the natural
                  compositional consequence and is documented here).

        NEXT CASCADE STEP:

          Author the CUDA f32→Q8_K activation quant kernel + wire
          it into expert_swiglu_cuda's Q4_K matvec dispatch. Verify
          all 48 layers cos≥0.99 via the existing
          qwen3_moe_per_layer_gpu_parity.rs falsifier
          (FALSIFY-QW3-MOE-PER-LAYER-001).

          On success: flip status to ACTIVE_RUNTIME and close #1583.

    - version: 1.7.2
      date: '2026-05-17'
      kind: amendment
      title: 'M-GPU-MOE-3 PR-3 cascade CLOSED — L47 marked KNOWN_DIVERGENCE_NOT_BENIGN; root cause = per-expert SwiGLU f32 intermediates'
      description: |
        Terminal amendment for the M-GPU-MOE-3 PR-3 sub-cascade. After
        v1.7.1 surfaced L47 as a single-layer cliff (cos=0.961236 post
        fp64 q6k_gemv acc), the cascade ran a 5-step falsifier sequence
        to pin the root cause and verify whether the cliff is user-
        visible.

        FALSIFIER SEQUENCE (PRs #1737, #1739-1745 plus 4 #1583 comments):

          PR-3   ✅ hardware verify on lambda-vector RTX 4090 →
                    47/48 layers cos ≥ 0.99, L47 alone at cos=0.961236
          PR-3b  ✅ v1.7.0 → v1.7.1 (this contract, previous amendment)
          PR-3c  ✅ scope doc update + L47 sub-cascade plan (#1740)
          PR-3d  ❌ H(i) qtype-mismatch FALSIFIED — `apr tensors` shows
                    L0/L46/L47 identical shapes + qtypes (Q4_K attn,
                    Q6_K attn_v + ffn_down_exps, Q4_K ffn_{gate,up}_exps)
                    (#1583 comment-4470216021)
          PR-3e  ✅ router-weight probe (#1741) — found L0..L46 router
                    cos = 1.000000 byte-identical between CPU and GPU;
                    L47 router cos = 0.992558 (first and only divergent
                    router weight vector)
          PR-3e2 ✅ MoeRouterIndices stage + L47 set falsifier (#1743) —
                    H(ii) DEFINITIVELY CONFIRMED:
                      cpu L47 top-8 = [2, 20, 36, 57, 60, 73, 111, 120]
                      gpu L47 top-8 = [2, 12, 36, 57, 60, 103, 111, 120]
                                          ^^^                ^^^
                                          2-of-8 expert swap at L47
          PR-3f1 ❌ fp64 gate softmax FALSIFIED — drift upstream of
                    softmax; same expert sets after promotion
          PR-3f2 ❌ f64 per-expert weighted-sum FALSIFIED — drift
                    upstream of weighted-sum; same expert sets
          PR-3g  ✅ multi-prompt argmax agreement (#1745) — L47 NOT
                    BENIGN: 3/4 canonical prompts agree on top-1 token
                    between CPU and GPU, 1/4 (single_tok_785: cpu=220
                    gpu=25) disagrees → ~25% prompt-dependent
                    inference impact

        ROOT CAUSE (by elimination):

          The drift source is the per-expert SwiGLU's f32 intermediate
          chain inside `expert_swiglu_quantized` (CPU) and
          `expert_swiglu_cuda` (GPU). Specifically:

            1. gate_proj @ hidden   ← fp64 acc thanks to PR-2 ✅
            2. silu(gate)           ← element-wise f32 ✗
            3. silu(gate) × up_proj ← element-wise f32 multiply on
                                      hidden_dim×4 = 8192 elements ✗
            4. down_proj @ above    ← fp64 acc thanks to PR-2 ✅

          Steps 2-3 accumulate ~1e-3 cosine drift per layer × 47 layers
          which crosses a top-k boundary at the L47 gate. Hidden-state
          residuals are unchanged (PR-3f2 promoted that and didn't move
          the needle).

        STATUS FLIPS:

          metadata.version  : 1.7.1 → 1.7.2
          metadata.status   : ACTIVE_ALGORITHM_LEVEL (unchanged — the
                              algorithm is bound on main; ACTIVE_RUNTIME
                              still gates on throughput + L47 fix)
          AC_GPU_MOE_001    : ALGORITHM_LEVEL_DISCHARGED for 47/48 layers
                              (was: "47/48 layers ... L47 single-layer
                              cascade PENDING")
                            : new state: "47/48 layers ALGORITHM_LEVEL_
                              DISCHARGED. L47 KNOWN_DIVERGENCE_NOT_BENIGN
                              — 2-of-8 MoE expert swap at L47 causes
                              ~25% argmax disagreement on canonical
                              prompts. Root cause: per-expert SwiGLU
                              f32 intermediates. Fix scope = PR-3h
                              (multi-week, unfuses/refuses GPU SwiGLU).
                              Parked behind throughput cascade (PR-4)."

        WHAT STAYS PENDING:

          - PR-3h (Option C): fp64 promotion of silu × up multiply +
            hidden_dim×4 intermediate in `expert_swiglu_quantized` (CPU,
            simple) and `expert_swiglu_cuda` (GPU, requires unfusing
            the existing fused SwiGLU kernel or adding an fp64
            reduction stage). Multi-week kernel work.

          - M-GPU-MOE-2 wgpu fallback (#1582) — unchanged

          - M-GPU-MOE-3 PR-4 throughput — independent of L47 fix;
            unblocked by this amendment

        WHY KNOWN_DIVERGENCE_NOT_BENIGN AND NOT KNOWN_BUG:

          The L47 cliff is a numerical-precision artifact, not a
          correctness bug. Both CPU and GPU paths follow the SAME
          algorithm against the SAME weights; they only differ in
          the order of f32 fp accumulation inside the per-expert
          SwiGLU. Both pick "legitimate" top-8 expert sets — neither
          is "wrong" — but the small score-perturbation crosses a
          top-k boundary at L47 specifically. This is the same class
          of behavior as gemv reduction-order variance, just one
          level higher in the call stack.

          Future engineers reading this amendment: the diagnostic
          surface (`falsify_qw3_moe_l47_router_indices` +
          `falsify_qw3_moe_gpu_argmax_agreement`) is the regression
          gate for PR-3h. When PR-3h lands, expect:
            - PR-3e2 falsifier: L47 sorted top-8 CPU == GPU
            - PR-3g falsifier: 4/4 prompts argmax agreement
          Both are `#[ignore]` + `#[cfg(feature = "cuda")]` gated;
          run on lambda-vector or any RTX 4090.

        YAML-ONLY:

          Production hot paths byte-unchanged. Additive-purity
          invariant pinned in v1.1.0 still holds.

