  status: DISCHARGED  # step (a) + (b) + (c) all DONE 2026-05-06; see v1.6.0 amendment
  description: |
    GPU NaN/Inf bisection + fix.

    Status promoted PARTIALLY_DISCHARGED → DISCHARGED at v1.6.0
