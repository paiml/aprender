metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    apr-corpus-algorithm-competition-corpus: Algorithm corpus for Depyler
  contract: apr-corpus-algorithm-competition-corpus
  status: enforced
  repo: "paiml/algorithm-competition-corpus"
  purpose: "Algorithm corpus for Depyler"
  language: "Python"
  domain: "Algorithms"
  category: ground-truth
  topic: paiml-ground-truth
  tags: [algorithms,depyler,transpilation]

oracle_integration:
  rag_indexed: true
  freshness_days: 90
  description: "Corpus provides ground-truth patterns for apr oracle --rag queries in the Algorithms domain"
preconditions:
  - "Repository paiml/algorithm-competition-corpus exists and is not archived"
  - "Contains at least 10 ground-truth files"
  - "Files have consistent format (tests, examples, or recipes)"
postconditions:
  - "All ground-truth patterns are falsifiable"
  - "Patterns have Rust equivalents or mappings documented"
  - "Corpus indexed in oracle RAG pipeline"
falsification:
  - condition: "Repository contains zero test files"
    severity: P0
    action: add_tests
  - condition: "No Rust equivalent mapping documented"
    severity: P1
    action: add_mapping
  - condition: "Corpus not indexed in oracle RAG (apr oracle --rag fails to find domain patterns)"
    severity: P1
    action: reindex
  - condition: "Last commit older than 180 days (staleness)"
    severity: P1
    action: refresh_or_archive
  - condition: "Ground-truth pattern contradicts current aprender API"
    severity: P0
    action: update_pattern
