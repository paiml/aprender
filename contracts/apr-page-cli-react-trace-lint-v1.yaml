metadata:
  version: 1.0.0
  kind: schema
  description: |
    PCU (Page Content Unit) contract for book/src/cli/react-trace-lint.md (apr react-trace-lint CLI reference).
    Enforces: page exists, references the command, has a runnable example.
  references:
    - "docs/specifications/book-completeness-spec.md"

equations:
  pcu_header_present:
    formula: "file_contains(book/src/cli/react-trace-lint.md, 'PCU: cli-react-trace-lint')"
  command_mentioned:
    formula: "file_contains(book/src/cli/react-trace-lint.md, 'apr react-trace-lint')"
  example_block_present:
    formula: "file_contains_fenced(book/src/cli/react-trace-lint.md, language='bash')"

falsification_tests:
  - id: FALSIFY-PAGE-CLI-REACT_TRACE_LINT-001
    name: stub_exists
    prediction: "book/src/cli/react-trace-lint.md exists on disk"
    test_harness: "test -f book/src/cli/react-trace-lint.md"
    expected_output: "exit 0"
    if_fails: "Run scripts/gen-cli-chapter-stubs.sh to regenerate."

  - id: FALSIFY-PAGE-CLI-REACT_TRACE_LINT-002
    name: command_mentioned
    prediction: "page references the command at least once"
    test_harness: "grep -q 'apr react-trace-lint' book/src/cli/react-trace-lint.md"
    expected_output: "exit 0"
    if_fails: "Add a mention of `apr react-trace-lint` to the chapter."

  - id: FALSIFY-PAGE-CLI-REACT_TRACE_LINT-003
    name: runnable_example
    prediction: "page has at least one ```bash code block"
    test_harness: "grep -c '^```bash' book/src/cli/react-trace-lint.md"
    expected_output: "stdout >= 1"
    if_fails: "Add a ```bash code block with a runnable example."
