contract: apr-tool-rust-mdipierro-nlib
version: 1
status: enforced
date: 2026-04-08
metadata:
  repo: "paiml/rust-mdipierro-nlib"
  purpose: "Provable-contracts-first numerical algorithms"
  language: "Rust"
  category: active-tool
  topic: paiml-active-tool
inputs:
  - "Numerical inputs"
outputs:
  - "Verified numerical outputs"
preconditions:
  - "Repository paiml/rust-mdipierro-nlib exists and is not archived"
  - "README.md documents purpose and usage"
  - "CI pipeline passes on main branch"
postconditions:
  - "Tool produces documented outputs from documented inputs"
  - "No legacy names in source code imports"
falsification:
  - condition: "gh repo view paiml/rust-mdipierro-nlib returns archived=true"
    severity: P0
    action: reclassify
  - condition: "README.md missing or empty"
    severity: P0
    action: create_readme
  - condition: "No CI workflow in .github/workflows/"
    severity: P1
    action: add_ci
  - condition: "cargo build fails (Rust) or equivalent build fails"
    severity: P0
    action: fix_build
  - condition: "Zero tests in repository"
    severity: P1
    action: add_tests
