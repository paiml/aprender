equations:
  validation_windows_never_contain_a_timestamp_later_than_the_:
    formula: |
      for num_val_windows=3 and val_step_size=h, each window's max training timestamp < min validation timestamp per item, asserted for every item and window
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "validation windows never contain a timestamp later than the training cut for that window"
  backtest_predictions_rows_align_with_backtest_targets:
    formula: |
      the two frames have identical (window, item_id, timestamp) index sets and no NaN targets
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "backtest_predictions rows align with backtest_targets"

falsification_tests:
- id: FALSIFY-CRUX-O-21-001
  rule: "validation windows never contain a timestamp later than the training cut for that window"
  prediction: "for num_val_windows=3 and val_step_size=h, each window's max training timestamp < min validation timestamp per item, asserted for every item and window"
  test: >-
    LIVE-PENDING - validation windows never contain a timestamp later than the training cut for that window. No test surface exists today because the capability is unimplemented: Rolling-window backtesting: num_val_windows, refit_every_n_windows, backtest_predictions (aprender#3391, CRUX-O-21). PROMOTE by authoring a test named windows_never_leak_future in module `forecast/backtest/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'validation windows never contain a timestamp later than the training cut for that window' is violated — the autogluon parity claim for CRUX-O-21 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"
- id: FALSIFY-CRUX-O-21-002
  rule: "backtest_predictions rows align with backtest_targets"
  prediction: "the two frames have identical (window, item_id, timestamp) index sets and no NaN targets"
  test: >-
    LIVE-PENDING - backtest_predictions rows align with backtest_targets. No test surface exists today because the capability is unimplemented: Rolling-window backtesting: num_val_windows, refit_every_n_windows, backtest_predictions (aprender#3391, CRUX-O-21). PROMOTE by authoring a test named backtest_frames_align in module `forecast/backtest/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'backtest_predictions rows align with backtest_targets' is violated — the autogluon parity claim for CRUX-O-21 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"

proof_obligations:
- type: invariant
  property: "validation windows never contain a timestamp later than the training cut for that window"
- type: invariant
  property: "backtest_predictions rows align with backtest_targets"

