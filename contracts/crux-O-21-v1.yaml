  description: >
    Rolling-window backtesting: num_val_windows, refit_every_n_windows, backtest_predictions. Competitor verb: fit(..., num_val_windows="auto", refit_every_n_windows="auto"); predictor.backtest_predictions(). Gap measured in aprender at eb262f8eb: No time-aware validation. KFold shuffles rows; nothing cuts the last k horizons of each item as expanding-window validation sets, and there is no API that returns the validation forecasts for inspection.
