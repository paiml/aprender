# RENAMED 2026-09-27 (untangle, #4430 bin renames): bin `apr-corpus-ingest` -> `aprender-corpus-ingest`. Measurements quoted below
# were taken on the old name and are re-taken by the next snapshot.
# bin-apr-cli--aprender-corpus-ingest-v1 — the `aprender-corpus-ingest` bin target of package apr-cli (ONT-10 slice S20), drafted to the exemplar
# contracts/bin-aprender-contracts-cli--pv-v1.yaml over the binary-surface-v1 vocabulary (#4476, #4079, aprender#4502).
#
#
# MEASURED (2026-09-26, batch/ont-10 @ ff9587b596, release build, default features, LC_ALL=C recursive --help walk):
#   - `aprender-corpus-ingest --version` = "aprender-corpus-ingest 0.69.3"; G0.1 (git sha) is a warning and RED today.
#   - the walk gives 2 leaves (plan, validate-contract), set-equal to surface_audit.csv's 2 rows.
#   - contracts/pretokenize-bin-v1.yaml names an `aprender-corpus-ingest run` subcommand that the binary does not have,
#     and contracts/apr-mono-binary-rule-v1.yaml does not list this [[bin]] (both logged to the cop, 18:54Z).
#
# CONVENTION THIS DRAFT ASKS OF extract:binary (ONT-4g, aprender-98): nodes also typed bin:target/<package>/<target>
# (no targetNode in pv's subset); commands as bin:command literals (full path below the binary name, space-joined);
# the csv join yields bin:ledgerOrphan / bin:unledgeredCommand.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────
name: bin-apr-cli--aprender-corpus-ingest-v1
version: "1.0.0"
scope: >
  The command surface of the `aprender-corpus-ingest` binary (package apr-cli, src crates/apr-cli/src/bin/aprender-corpus-ingest.rs): its help, usage errors, version string, its 2 subcommands, and its surface-audit rows.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    The command surface of the `aprender-corpus-ingest` binary (package apr-cli, src crates/apr-cli/src/bin/aprender-corpus-ingest.rs): its help, usage errors, version string, its 2 subcommands, and its surface-audit rows.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'crates/apr-cli/src/bin/aprender-corpus-ingest.rs — the clap Command enum'
    - 'docs/audits/surface_audit.csv — the ledger'
    - 'aprender#4502 — ONT-10, slice S20'

entity:
  type: binary
  ref: binary/apr-cli/aprender-corpus-ingest

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-aprender-corpus-ingest-surface
    targetClass: bin:target/apr-cli/aprender-corpus-ingest
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["aprender-corpus-ingest"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["apr-cli"]}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "^aprender-corpus-ingest [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-26 (no sha); a warning until the version string carries it
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: warning}
      - path: bin:command
        minCount: 2
        maxCount: 2
        in:
          - "plan"
          - "validate-contract"
      # GREEN 2026-09-26: plan, validate-contract are set-equal to the 2 ledger rows
      - {path: bin:unledgeredCommand, maxCount: 0}
      - {path: bin:ledgerOrphan, maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(aprender-corpus-ingest)) = invocable paths of the recursive --help walk ∧ commands ⊆ {f.feature : f ∈ surface_audit, f.binary = aprender-corpus-ingest}"
    domain: "the aprender-corpus-ingest line of the tracked snapshot, the clap tree of the default-feature build, and the ledger rows with binary = aprender-corpus-ingest"
    codomain: "set equality (2 paths on 2026-09-26), or a Fail naming each path in the symmetric difference"
    invariants:
      - "a leaf is a command; a group whose Usage shows [COMMAND] is also one; clap's auto `help` is not"
    preconditions:
      - "the snapshot was written at this commit"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `aprender-corpus-ingest --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-APR_CORPUS_INGEST-INV-001
    property: every aprender-corpus-ingest subcommand has an audited ledger row
    formal: '∀ c ∈ commands(aprender-corpus-ingest): |{r ∈ surface_audit : r.binary = aprender-corpus-ingest ∧ r.feature = c}| ≥ 1'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-APR_CORPUS_INGEST-001
    rule: 'G1.2 help answers'
    prediction: '`aprender-corpus-ingest --help` exits 0 with non-empty stdout'
    test: 'scripts/dogfood_surfaces.sh --cli aprender-corpus-ingest'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-26: exit 0, GREEN)'
    mutation: 'make the top-level --help return an error; must turn RED'
  - id: FALSIFY-BIN-APR_CORPUS_INGEST-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`aprender-corpus-ingest --no-such-flag` exits 2'
    test: 'scripts/dogfood_surfaces.sh --cli aprender-corpus-ingest'
    if_fails: 'a typo is silently ignored (observed 2026-09-26: exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-APR_CORPUS_INGEST-003
    rule: 'G0.1 the version names the commit'
    prediction: '`aprender-corpus-ingest --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: "LIVE RED 2026-09-26: `aprender-corpus-ingest 0.69.3` — no sha"
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-APR_CORPUS_INGEST-004
    rule: 'G1.3/G1.4 the surface set equals the snapshot'
    prediction: 'the enumerated surface of aprender-corpus-ingest equals the in: list of this shape, no more and no fewer'
    test: 'pv lint contracts/ --gate shapes, once extract:binary writes the node'
    if_fails: "GREEN on the walk 2026-09-26: 2 leaves"
    mutation: 'add a subcommand/route/tool without re-snapshotting; must turn RED naming it'
  - id: FALSIFY-BIN-APR_CORPUS_INGEST-005
    rule: 'ledger rows exist and resolve'
    prediction: "docs/audits/surface_audit.csv has ≥1 row per subcommand with binary = aprender-corpus-ingest (2 on 2026-09-26)"
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: "GREEN 2026-09-26: 2 rows, set-equal to the 2 commands"
    mutation: 'delete every aprender-corpus-ingest row; must turn RED naming aprender-corpus-ingest'

