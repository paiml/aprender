metadata:
  kind: pattern
  version: 1.2.0
  created: '2026-09-28'
  author: PAIML Engineering (la-72, APR-LOOKAHEAD-001 L2, train 0.72)
  description: >-
    The 0.72 R6 cell (distill 27B -> 4B at batch > 1): every row a distill step pays a forward
    pass for is either trained on or refused. Spike S-R6 (2026-09-28, desk read at origin/main
    aca6f2d7f6) found `apr distill --backend cuda` accepts the default --batch-size 16, runs teacher
    and student on all 16 rows, reports a loss averaged over 16, and CudaStudentProvider applies
    the gradient of the LAST row only (input_ids.last(), gradient.last()). Effective batch 1, silently.
  references:
  - 'branch la-72/0.72-shaping: docs/specifications/aprender-train/train-what-you-serve-0.72.md §R6, Spike S-R6 (not on main until the 0.72 shaping PR lands)'
  - crates/aprender-train-distill/src/student_provider.rs (CudaStudentProvider logits_for_batch / apply_kd_gradient)
  - crates/aprender-train-distill/src/pipeline.rs (kd_step then apply_kd_gradient per step)
  - contracts/distill-per-position-kd-v1.yaml
  - contracts/train-arch-honesty-v1.yaml (branch la-72/4552-train-arch-honesty; qwen35 refusal on distill)
  depends_on:
  - distill-per-position-kd-v1
status: PROPOSED
equations:
  batch_update:
    formula: 'Δθ(step, B rows) = Σ_{i<B} ∂L_i/∂θ · w_i with w_i > 0 for every i, OR the step refuses before any forward'
    domain: 'any StudentLogitsProvider (CPU, CUDA) under Pipeline, batch_size B ≥ 1, last-position and per-position KD'
    invariants:
    - 'A row whose logits enter the reported loss contributes to the update (loss rows = update rows)'
    - 'A provider that can only apply one row declares max_batch = 1 and the pipeline refuses B > 1 by name before step 0'
    - 'Per-position KD applies B·P rows or refuses; one row of B·P is a FAIL'
    - 'The student trains at the configured learning rate (DistillConfig.training.learning_rate), not a trainer default'
    - 'Every trainable tensor the backward writes a gradient for is stepped and its gradient reset each optimizer step (the embedding table included)'
    preconditions:
    - the same batch source and seed for the compared runs
proof_obligations:
- type: invariant
  property: No silent row drop
  formal: '∀ step: rows_updated(step) = rows_in_loss(step) ∨ refused_before_step_0'
  applies_to: all
- type: equivalence
  property: Accumulation matches the mean
  formal: 'update(B=2, rows a,b) ≈ update from the mean of the per-row gradients (tol 1e-4 relative, f32)'
  tolerance: 1.0e-04
  applies_to: all
falsification_tests:
- id: FALSIFY-DBH-001
  rule: batch = 2 with two distinct rows updates from both
  prediction: 'after one step at B=2 (rows a != b), the student weights differ from the weights after one step on b alone'
  test: 'CUDA provider: two distinct rows, one step, compare against a B=1 step on the last row; equal weights = RED'
  if_fails: 'the provider trains on the last row only (the S-R6 behaviour at aca6f2d7f6)'
- id: FALSIFY-DBH-002
  rule: A provider that cannot batch refuses batch > 1 by name
  prediction: '`apr distill --backend cuda --batch-size 16` either trains every row (DBH-001 green) or exits non-zero before step 0 naming the batch limit'
  test: 'IN-TREE: crates/aprender-train-distill/src/pipeline.rs::falsify_dbh_002_refuses_batch_over_max_before_step_0 (the check sits before step 0; no GPU needed for the refusal branch)'
  if_fails: 'rc 0 with effective batch 1 while the log says batch 16'
- id: FALSIFY-DBH-003
  rule: Planted falsifier — last-row-only provider
  prediction: 'a CPU mock StudentLogitsProvider that records the gradient rows it applies, run through Pipeline at B=4, records 4 rows; the planted variant that keeps gradient.last() turns the test RED'
  test: 'IN-TREE: crates/aprender-train-distill/src/pipeline.rs::falsify_dbh_003_pipeline_detects_last_row_provider (CPU, mock provider; the planted variant is the current CudaStudentProvider logic)'
  if_fails: 'the pipeline test cannot tell a last-row provider from a full one'
- id: FALSIFY-DBH-004
  rule: Per-position KD applies every position
  prediction: 'apply_kd_gradient_per_position with B=2, P=3 applies 6 rows on every provider that does not refuse'
  test: 'IN-TREE: crates/aprender-train-distill/src/pipeline.rs::falsify_dbh_004_per_position_trains_every_position_or_refuses + crates/aprender-train-distill/src/kd_step.rs::falsify_dbh_004_position_mismatch_is_refused (same mock as DBH-003, per-position path)'
  if_fails: 'the flattened [B·P] slice is reduced to one row (the S-R6 CUDA override behaviour)'
- id: FALSIFY-DBH-005
  rule: Loss telemetry describes the trained rows
  prediction: 'the per-step loss logged by Pipeline is the mean over exactly the rows the update used'
  test: 'IN-TREE: crates/aprender-train-distill/src/pipeline.rs::falsify_dbh_005_logged_loss_is_the_mean_of_applied_rows (mock provider at B=4, distinct per-row losses)'
  if_fails: 'the logged loss averages rows that were never trained on'
- id: FALSIFY-DBH-006
  rule: The configured learning rate reaches the CUDA student
  prediction: 'CudaStudentProvider built from a DistillConfig with learning_rate 2e-4 has a trainer whose current_lr() at step 0 is 2e-4 (no warmup) and whose AdamW update size scales with it'
  test: 'CPU half IN-TREE: crates/aprender-train-distill/src/pipeline.rs::falsify_dbh_006_student_trains_at_the_configured_rate (Pipeline sets the configured rate on the provider before step 0; mutant dropping the call KILLED); GPU half (train-idle): one step at lr a vs 2a, block weight delta ratio ~2'
  if_fails: 'every CUDA distill run trains at TransformerTrainConfig::new lr 0.001 whatever the receipt says (desk 2026-09-28, for_inference builds its own config)'
- id: FALSIFY-DBH-007
  rule: A distill step steps the embedding table and resets its gradient
  prediction: 'after one CUDA distill step at lr > 0 the embedding-table checksum differs from the checkpoint, the trainer step counter is 1, and the CPU embedding grad is zero or absent at the start of step 2'
  test: 'GPU (train-idle): one apply step on a tiny checkpoint, compare embed_tokens checksum and step(); planted variant = forward_backward_with_grad as at 5135ca473c (no optimizer_step) stays RED'
  if_fails: 'embedding frozen for the whole run and its gradient summed unbounded across steps (forward_backward_with_grad never calls optimizer_step)'
- id: FALSIFY-DBH-008
  rule: Accumulated B-row update equals the mean-gradient update
  prediction: 'kd_step_batch on rows a,b yields the same weights (tol 1e-4 rel) as one step with gradient (g_a+g_b)/2 applied through the same accumulator; B micro-steps (one optimizer step per row) differ'
  test: 'GPU (train-idle), same seed and checkpoint; the micro-step variant is the planted RED'
  if_fails: 'rows are summed (B x lr) or stepped per row (B steps logged as one)'
