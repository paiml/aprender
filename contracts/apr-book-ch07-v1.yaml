  - condition: "KFold::split not called"
    severity: P0
    action: add_kfold
  - condition: "No model trained and evaluated within fold loop"
    severity: P0
    action: add_cv_loop
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter
