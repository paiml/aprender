  mutation: >-
    make the verdict function constant-RED, then constant-GREEN. Rows 6/7/14 must fail
    under the first and rows 1..5/8..13 under the second. One arm alone proves nothing.

- id: F-PRREV-004
  rule: a blocking class is demoted by editing this contract, never by disabling the gate
  prediction: >-
    Setting a class's measured precision below 0.90 in the rolling sample makes the
    guard REFUSE to block on it and REQUIRE that this file be edited; the CI step
    remains enabled and continues to report the class as advisory.
  test: >-
    LIVE-PENDING, and the REASON has changed: the guard (PRREV-003) and the CI wiring
    (PRREV-006) both exist now, so what is missing is no longer an artifact but a
    MEASUREMENT — the gate is not enabled, no PR has been reviewed under it, and a
    precision sample of size zero cannot demote anything. Restating the reason rather
