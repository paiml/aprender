proof_obligations:
- type: invariant
  property: >-
    An autonomous merge is armed only when the quorum spans at least two distinct
    vendors, holds both roles, excludes the author and is unanimous; a failure of any
    conjunct REFUSES and never BLOCKS (F-PRREV-012, F-PRREV-015).
  formal: 'ARM(pr) => |vendors(quorum)| >= 2 and {primary, cross_vendor} subset roles(quorum) and forall m: m.actor != author and m.verdict = PASS and m.refusal = null; not ARM(pr) => blocking_classes(pr) unchanged'

- type: invariant
  property: >-
    No receipt that is not PASS, that carries a blocking-class finding, an unmarked
    claim, a vacuous consultation, a surviving mutant or an unsearched surface arms a
    merge (F-PRREV-013).
  formal: 'ARM(pr) => verdict = PASS and blocking_findings = 0 and unmarked_claims = 0 and vacuous_consultations = 0 and survivors = [] and forall s in SURFACE: cov(s) != none'

- type: invariant
  property: >-
    Every refusal path of scripts/pr_review_quorum_arm.sh is exercised by at least one
    committed fixture, and the derived mutation set kills 100% of its drop and flip
    mutants — the same rule S6.4 applies to the receipt guard, applied where the
    consequence is a merge rather than a message (S13.10).
  formal: 'forall q in refusal_sites(arm): exists row in q_table: refuses(row) = q; quorum_arm_mutation_score = 1'


- type: invariant
  property: >-
    Every claim in the receipt carries exactly one of the three grounding marks, and a
    `cited` mark carries a non-empty excerpt whose sha256 matches the recorded digest
    (F-PRREV-001, F-PRREV-002).
  formal: 'forall c in claims: mark(c) in {cited, measured, asserted} and (mark(c) = cited => c.excerpt != "" and c.excerpt_sha256 = sha256(c.excerpt))'

- type: invariant
  property: >-
    A PR is blocked if and only if it satisfies one of the six machine-decidable
    classes B1..B6 of spec S7's table; the guard discriminates, proven by the three
    GREEN rows of S6.3 (F-PRREV-003, F-PRREV-007).
  formal: 'BLOCK(pr) <=> B1(pr) or B2(pr) or B3(pr) or B4(pr) or B5(pr) or B6(pr)'

- type: soundness
  property: >-
    A class blocks only while its measured precision on the rolling sample is at least
    0.90, and a class that falls below is demoted by editing this contract rather than
    by disabling the gate (F-PRREV-004).
  formal: 'blocks(Bi) => precision(Bi) >= 0.90; precision(Bi) < 0.90 => advisory(Bi) and gate_enabled'

- type: invariant
  property: >-
    No numeric threshold exists for actionable_rate, effective_fp_rate,
    audit_divergence or cost_per_actionable until thirty samples of that metric have
    been recorded (F-PRREV-005).
  formal: 'forall m in INSTRUMENT_FIRST: samples(m) < 30 => threshold(m) = UNSET'

- type: invariant
  property: >-
    guard_mutation_score = 1.00, receipt_presence = 1.00, unmarked_claims = 0 and
    vacuous_consultations = 0, none of the four carrying a ratchet (F-PRREV-006,
    F-PRREV-008).
  formal: 'guard_mutation_score = 1 and receipt_presence = 1 and unmarked_claims = 0 and vacuous_consultations = 0 and forall m in JIDOKA: ratchet(m) = NONE'

- type: invariant
  property: >-
    A consulted pmat block records a coverage method for every surface, NAMES all three
    horizon regions whether or not each was reached, and records the refs its horizon
    actually swept; no receipt reads PASS while a surface reads `none` or while the
    horizon sweep was partial (F-PRREV-009, F-PRREV-011).
  formal: 'forall s in SURFACE: cov(s) in {semantic, lexical, none} and REGION subset named(duplication_horizon) and (exists s: cov(s) = none or scanned < total) => verdict != PASS'

kani_harnesses:

# DECLARED AND NOT WRITTEN, said plainly. Two of the five obligations above are
# genuinely finite — the grounding mark is a closed three-valued enum crossed with
# present/absent on each required field, and the blocking tier is a boolean function
# over six predicates, so 2^6 = 64 assignments is exhaustive. Neither is solver-work
# today for a reason that is not a shortage of effort: THERE IS NO RUST SURFACE. The
# guard is bash (S6) and the receipt is JSON. A Kani harness needs a Rust function to
# bind to, and PRREV-003 ships a shell script.
#
# So the cheaper alternative named on each is the honest one, and it is the same
# statement without a solver: an exhaustive table in tests/pr-review.bats. Recorded
# this way because the #2644 audit found declared-but-unwritten harnesses inflating
# contract scores, and the remedy that survived review was to say so in the file, not
# to drop the declaration and lose the record of what SHOULD be proved.

- id: KH-PRREV-001
  obligation: grounding_marks_are_closed
  property: no_claim_outside_the_three_marks_is_ever_accepted
  bound: 3
  actually_verified: false

- id: KH-PRREV-002
  obligation: blocking_tier_is_objective_and_earned
  property: block_iff_one_of_b1_through_b6
  bound: 6
  actually_verified: false

enforcement:

  # Spec S8, encoded in a block the schema reads. The FOUR ROWS ABOVE THE LINE are
  # jidoka line-stops with a fixed value; the FOUR BELOW carry `record-only` and no
  # number, and inventing one for them would violate S1 inside the file that defines
  # S1. That split is the whole point of the table and is why the two halves are
  # marked with different severities rather than merely commented apart.

  guard_mutation_score:
    description: 'killed / attempted on the guard''s own committed mutation set (S6.4, S8)'
    check: '= 1.00 — no ratchet; a guard-touching PR below 1.00 BLOCKS (S7 class B3)'
    severity: line-stop
    reference: 'PR-REVIEW-SKILL-002 v2 S6.4 and S8; the one place S7 narrowness does not apply'

  receipt_presence:
    description: 'PRs merged carrying a schema-valid signed receipt / PRs merged (S8)'
    check: '= 1.00 — no ratchet; a missing receipt is RED, never skipped (S6.3)'
    severity: line-stop
    reference: 'PR-REVIEW-SKILL-002 v2 S8; S7 class B1'

  unmarked_claims:
    description: 'claims carrying no S1 grounding mark (S8)'
    check: '= 0 — no ratchet. Exercised by fixture row 15 and killed in both directions by the PRREV-004 sweep (F-PRREV-001)'
    severity: line-stop
    reference: 'PR-REVIEW-SKILL-002 v2 S1 and S8'

  vacuous_consultations:
    description: 'consultations recording status=consulted while having consulted nothing (S8)'
    check: '= 0 — no ratchet; the pass-over-zero shape, measured in F-PRREV-008. Enforced on ALL FOUR consultations since PRREV-008 (rows 2, 18, and the crux/pmat probes); before it, on mutation alone'
    severity: line-stop
    reference: 'PR-REVIEW-SKILL-002 v2 S3.D, S4.1 and S8; fixture row 2'

  actionable_rate:
    description: 'findings the author acted on / findings posted (S8)'
    check: 'record-only until 30 samples; then floor := measured - 5pp, monotone. NO THRESHOLD MAY BE WRITTEN HERE BEFORE THEN'
    severity: instrument-only
    reference: 'PR-REVIEW-SKILL-002 v2 S8 — instrument, 30 samples, ratchet'

  effective_fp_rate:
    description: 'per blocking class, the measured effective false-positive rate (S8)'
    check: 'record-only until 30 samples. It then feeds S7 admission (<= 0.10 to remain blocking) — the only one of the four that can un-arm a gate. NO THRESHOLD MAY BE WRITTEN HERE BEFORE THEN'
    severity: instrument-only
    reference: 'PR-REVIEW-SKILL-002 v2 S7 admission rule and S8; Tricorder''s 10% bar'

  audit_divergence:
    description: 'disagreement rate between the reviewer and the 10% independent re-review (S5, S8)'
    check: 'record-only until 30 audits; then it SETS the sampling rate. NO THRESHOLD MAY BE WRITTEN HERE BEFORE THEN'
    severity: instrument-only
    reference: 'PR-REVIEW-SKILL-002 v2 S5 and S8'

  cost_per_actionable:
    description: '(input_tokens + output_tokens + wall_seconds) / actionable findings (S8)'
    check: 'record-only until 30 samples; then ratchets DOWN quarterly. NO THRESHOLD MAY BE WRITTEN HERE BEFORE THEN'
    severity: instrument-only
    reference: 'PR-REVIEW-SKILL-002 v2 S8; cost fields live in the in-toto predicate'

  quorum_arm_mutation_score:
    description: 'killed / attempted on the arm script''s derived mutation set (S13.10)'
    check: '= 1.00 — no ratchet, measured 122/122 by the derived set. A surviving mutant is a refusal path the arm script states and nothing tests, which under S13 is a merge nobody authorised'
    severity: line-stop
    reference: 'PR-REVIEW-SKILL-002 v2 S13.10; scripts/mutate_quorum_arm.sh'

  refusal_paths_without_a_fixture:
    description: 'refuse Q<n> sites in the arm script with no row in tests/pr-review-quorum.bats (S13.10)'
    check: '= 0 — no ratchet; it is a zero. Derived, not counted by hand: the mutation set scans for `refuse Q<n>` and a site with no row leaves a SURVIVOR'
    severity: line-stop
    reference: 'PR-REVIEW-SKILL-002 v2 S13.4 and S13.10'

  autonomous_merge_reverts:
    description: 'merges armed by S13 that were later reverted / merges armed by S13 (S13.9)'
    check: '0/0 — UNDEFINED, NOT CLEAN. record-only; no threshold until 30 samples. The coverage pipeline reported 0/0 for months and every reader took it for green; this row exists so that cannot happen twice'
    severity: instrument-only
    reference: 'PR-REVIEW-SKILL-002 v2 S13.9 and S13.11; the COV_FLOOR scar'

  autonomy_refusal_rate:
    description: 'REFUSE / (PERMIT + REFUSE) over the --explain shadow lane (S13.9)'
    check: 'record-only until 30 samples. NO THRESHOLD MAY BE WRITTEN HERE BEFORE THEN'
