metadata:
  version: 2.0.0
  created: '2026-08-30'
  author: PAIML Engineering
  kind: kernel
  description: >-
    A PR review is evidence only if every claim it makes says HOW it knows.
    This contract holds the three rules that make the pr-review skill's receipt
    falsifiable rather than decorative: the closed set of grounding marks (S1),
    the machine-decidable blocking tier (S7), and the split between the four
    metrics that stop the line and the four that are only recorded until they
    have been measured thirty times (S8).

    It is deliberately a `kernel` contract and NOT an exempt registry. The
    operator ruling of 2026-08-21 stands: an exemption is not an honest verdict,
    and a contract governing an enforcement artifact is the last place to claim
    one.

    STATE ON THIS COMMIT: BUILT AND MUTATION-VERIFIED, STILL NOT ARMED. The
    guard (scripts/check_pr_review_receipt.sh), twenty-six fixtures, the
    vendored schemas, the reviewer skill and the CI wiring all exist here;
    the `pr-review-receipt` job is not yet a required check. Twelve of the
    fifteen falsification tests below are green and bound to a command; three
    remain LIVE-PENDING and say so in the field the schema actually reads.

    This paragraph was rewritten by PRREV-008 and the previous text is worth
    recording: it said "DECLARED, NOT ARMED. PRREV-001 ships this file alone.
    The guard ... does not exist here." That was true when written and false
    four commits later, and nothing made it say so. A contract that reads as
    governance while enforcing nothing is the #2504 shape; a contract that
    still describes a state the tree left behind is the same failure with the
    sign flipped, and it is likelier, because nothing ever fails because a
    status paragraph went stale.
  references:
  - 'PR-REVIEW-SKILL-002 v2 — grounded adversarial PR review with a signed receipt.
    THE AUTHORITY FOR THIS FILE AND IT IS NOT IN THIS REPOSITORY at 745fa8588. It was
    supplied out-of-tree. A contract whose source document cannot be opened from a
    checkout is one rename away from unauditable: committing it under
    docs/specifications/ is owed by PRREV-002.'
  - 'Supersedes PR-REVIEW-SKILL-001 (draft, 2026-08-30). Spec S0 records what changed
    (A1-A9) and, as load-bearing, what was REJECTED (R1-R6) — notably the SLSA Build L3
    claim, which a skill invoked by the authoring agent cannot support. The receipt
    declares attestation_level L1-self.'
  - 'Spec S1 (grounding), S7 (blocking policy), S8 (instrumentation) — the three sections
    this contract encodes. S2-S6 and S9-S12 are encoded by the artifacts of PRREV-002..007.'
  - 'Spec S6.3 — the fourteen-row fixture table, of which rows 6, 7 and 14 are the
    discrimination cases. Without them "refuse every receipt" reads green. Rows 15-21 are
    owed by this contract and by PRREV-008 rather than by S6.3, and row 17 is a fourth
    discrimination case: without it B4 would forbid the honest path it exists to require.'
  - 'Spec S9 step 7 — the backtest, and the acceptance test for the whole design: "If the
    skill would not have caught [the three named cases], the design is wrong and changes
    before it is enabled." It caught one of three. PRREV-008 is the change: B4 now
    recomputes comparative claims from the diff rather than from the reviewer''s own
    findings, every consultation carries both a recomputed trigger and an emptiness
    check, S3.A is enforced as unconditional, and the comparative pattern is
    check_no_claim_literals.sh''s measured RATIO_RE rather than a second implementation
    of it.'
  - 'Spec S3.A vs S6.3 row 7 — the spec CONTRADICTS ITSELF. S3.A says pmat''s trigger is
    "unconditional" and S8.4 repeats it; row 7 says a docs-only PR may record all four
    consultations as not-triggered. The two normative statements win over the
    illustrative row: `pmat: not-triggered` is rejected, and row 7 is rebuilt with pmat
    consulted so it keeps discriminating. Recorded here because a divergence from the
    authority is only legitimate while it is written down.'
  - 'Spec S9 note — use `pv validate <file>`, NEVER `pv lint <FILE>`. MEASURED here on
    745fa8588: `pv lint contracts/batch-admission-v1.yaml` prints "Gate 1: validate (0
    contracts, 0 errors, 0 warnings)" and exits 0. See F-PRREV-008.'
  - 'contracts/apr-bench-receipt-v1.yaml — the same problem one tier down. Spec S3.C.1
    (the comparator block) is that contract''s provenance rule applied to a review claim
    instead of a bench receipt.'
  - 'The 2.93x-Ollama scar: the book published a comparative number from a harness that
    never ran Ollama. Spec S3.C.1 + S7 class 4 is the mechanism that makes that
    unwriteable rather than merely discouraged.'
  - 'The 66-commit index-drift scar: an index answering about code that is not in the PR.
    Spec A4 stamps index_commit into the receipt and gates on
    `git merge-base --is-ancestor`.'
  - 'PERF-055: ~7,200 lines across 46 files nearly re-implemented over code that already
    existed. Spec S3.A duplication_hits is the highest-EV field in the receipt.'
  depends_on:
  - apr-bench-receipt-v1

equations:

  grounding_marks_are_closed:
    formula: |
      mark(claim) in { cited, measured, asserted }        -- and nothing else
      cited    => query != "" and source_uri != ""
                  and excerpt != "" and len(excerpt) <= 400
                  and excerpt_sha256 = sha256(excerpt)
      measured => command is argv[] and exit_code recorded and stdout_sha256 recorded
      asserted => rationale != "" and precision_class = advisory
      unmarked => REJECT(receipt)
      asserted(c) contradicts measured(m) in the same receipt
               => DROP(c), log finding.suppressed_by_measurement
    domain: 'every claim the review makes about external reality, in findings.sarif
      properties.grounding and in the in-toto predicate''s consultations block'
    codomain: 'bool — the receipt is accepted or rejected whole; there is no partial
      credit for a claim that is nearly grounded'
    invariants:
    - >-
      THERE IS NO FOURTH CATEGORY. An unmarked claim is not a weaker claim, it is a
      DEFECT IN THE REVIEW, and the guard rejects the receipt that carries it. The
      failure this excludes is the one the repository has shipped most often: a
      confident sentence about external reality with no way to tell whether anything
      was consulted.
    - >-
      CITED IS VERIFIED, NOT MERELY LABELLED (S1.1). A recorded excerpt that does not
      support its claim is the same failure as no excerpt. The guard therefore checks
      excerpt_sha256 = sha256(excerpt) and excerpt != "" — a hash over an empty string
      is a well-formed hash, so the non-empty check is not redundant with the digest
      check and neither substitutes for the other.
    - >-
      ENTAILMENT IS NOT CHECKED AND THIS CONTRACT SAYS SO. Nothing here verifies that
      the excerpt actually SUPPORTS the claim; that is Phase 3. A well-formed but
      unsupportive citation passes. This is a stated residual risk (S1.1), written
      into the contract rather than left for a reader to discover, because an
      unstated residual is how a hash check comes to be read as a truth check.
    - >-
      CONTRADICTION IS FATAL TO THE CLAIM, NOT TO THE RUN (S1.2). An `asserted` claim
      that contradicts a `measured` value in the same receipt is dropped and logged.
      Failing the whole run instead would make the reviewer's incentive to omit the
      measurement, which is the opposite of what this contract is for.
    - >-
      AN `asserted` CLAIM NEVER BLOCKS. That is what keeps judgement admissible
      without letting it stop the line, and it is why precision_class is pinned to
      advisory by the mark itself rather than chosen per finding.
    preconditions:
    - 'the receipt parses as an in-toto Statement v1 against the vendored schema before any mark is read'
    - 'sha256 is computed over the excerpt bytes AS STORED, never over a re-wrapped or re-indented copy'
    postconditions:
    - 'every result in findings.sarif carries a non-empty properties.grounding'
    - 'no result carries a grounding value outside { cited, measured, asserted }'
    - 'every result carries a non-empty failure_scenario (S4.2)'

  blocking_tier_is_objective_and_earned:
    formula: |
      BLOCK(pr) <=> any of the six machine-decidable classes:
        B1  receipt missing, schema-invalid, or unsigned
        B2  reviewer_actor.id = author_actor.id
        B3  guard_mutation_score < 1.00     (guard-touching diff only)
        B4  unverified_comparative_claim present
        B5  breaking API surface with no semver bump
        B6  index_is_ancestor = false AND verdict = PASS
      FINDINGS  => blocks on a release branch only
      DEGRADED  => never blocks; reason printed FIRST on the comment line
      PASS      => proceeds
      admission: blocks(Bi) requires precision(Bi) >= 0.90 on the rolling sample
      demotion:  precision(Bi) < 0.90 => edit THIS FILE to advisory; never disable the gate
    domain: 'a pull request carrying a receipt at evidence/pr-review/<pr>/<head_sha>/'
    codomain: 'bool — and the boolean is a function of the receipt alone, so two
      readers of the same receipt reach the same verdict'
    invariants:
    - >-
      SIX CLASSES, NOT FIVE. The spec's S7 TABLE lists six blocking rows while its
      prose beneath says "five objective, machine-decidable classes". The table is the
      operative artifact and is encoded here in full; the prose is a miscount.
      Dropping a row to reach five would be inventing policy, and silently writing
      "five" over six rows would repeat the defect this contract exists to remove.
      Recorded rather than quietly reconciled — see F-PRREV-003.
    - >-
      NONE OF THE SIX IS A JUDGEMENT CALL. That is the whole design constraint: a
      blocking tier made of opinions freezes an active investigation, which is what
      #2757 and #2766 did. Every class above is decided by reading the receipt, not by
      agreeing with the reviewer.
    - >-
      FIXTURE ROW 10 IS NOT A SEVENTH CLASS. `base_sha` disagreeing with
      `git merge-base origin/main head_sha` is RED under B1 (the receipt is invalid),
      not under a class of its own. Said explicitly because a fixture row with no
      named class is how a guard grows a rule nothing governs.
    - >-
      B5 IS THE ONE CLASS NO CONSULTATION PRODUCES. Nothing in S3's four consultations
      emits `breaking API surface with no semver bump`, and no S8 metric measures its
      precision — so the admission rule cannot be evaluated for it. It is carried here
      because the spec's table carries it, and it is flagged because a blocking class
      whose precision cannot be measured cannot be demoted by the mechanism that is
      supposed to protect it.
    - >-
      DEMOTION IS A TICKET, NOT A CONFIG CHANGE. A class that falls below 0.90 is moved
      to advisory BY EDITING THIS FILE, so the demotion is reviewable and dated. A
      silent flag flip in CI leaves a gate that reads armed and is not.
    - >-
      DEGRADED PROCEEDS ON EVERY BRANCH, AND PUTS ITS REASON FIRST. An unreachable
      source must be loud and non-blocking: making it block teaches reviewers to route
      around the skill, and making it silent is the ConnectionRefused-reads-clean
      failure the three-state SARIF encoding exists to prevent.
    preconditions:
    - 'BASE = git merge-base origin/main HEAD, and base_sha in the receipt equals it (S2)'
    - 'the receipt signature verifies against the committed public key before any class is evaluated'
    postconditions:
    - 'a PR blocked by this contract cites exactly one of B1..B6 by name'
    - 'no PR is blocked by a finding whose grounding is asserted'

  instrument_before_ratchet:
    formula: |
      threshold(m) = UNSET  for m in { actionable_rate, effective_fp_rate,
                                       audit_divergence, cost_per_actionable }
                     while samples(m) < 30
      samples(m) >= 30 =>
        actionable_rate     : floor := measured - 5pp, monotone non-decreasing
        effective_fp_rate   : <= 0.10 required for a class to REMAIN blocking
        audit_divergence    : sets the re-review sampling rate
        cost_per_actionable : ratchets DOWN quarterly
    domain: 'the four continuous parameters of spec S8, over the rolling population of
      reviewed pull requests'
    codomain: 'a threshold or the absence of one; UNSET is a value here, not a gap'
    invariants:
    - >-
      NO NUMBER MAY BE WRITTEN INTO THESE FOUR ROWS BEFORE THIRTY SAMPLES EXIST.
      Inventing one would violate the same S1 grounding rule this contract exists to
      enforce: a threshold with no measurement behind it is an `asserted` claim wearing
      a `measured` mark, and it would be doing so in the file that defines the
      difference. This is the single strongest reason the four rows below carry
      `record-only` and not a plausible-looking default.
    - >-
      RECORD-ONLY IS NOT UNENFORCED. The guard still REJECTS a receipt whose `cost`
      block is missing, and still rejects a blocking class with no precision sample.
      What is absent is a THRESHOLD, not the measurement — the two failure modes look
      identical in a report and are opposite in meaning.
    - >-
      A RATCHET MOVES ONE WAY. actionable_rate's floor may rise and never fall;
      cost_per_actionable's ceiling may fall and never rise. A floor lowered to admit a
      release is the defect APR-PERF-GATE-001 S10.1 already names.
    - >-
      effective_fp_rate IS THE ONLY ONE OF THE FOUR THAT CAN UN-ARM A GATE. It feeds
      the S7 admission rule directly, so it is the one whose thirty samples are on the
      critical path; the other three change reporting, not blocking.
    - >-
      THIRTY IS THE SPEC'S NUMBER AND IT IS NOT DERIVED HERE. It is a convention, not a
      power calculation, and this contract does not dress it up as one. If a power
      calculation is later done, it replaces the thirty and this invariant records that
      it was measured.
    preconditions:
    - 'a sample is one merged PR that carried a schema-valid receipt; a DEGRADED receipt counts as a sample'
    - 'the cost block records input_tokens, output_tokens and wall_seconds for every run, including runs that found nothing'
    postconditions:
    - 'this contract contains no numeric threshold for any of the four instrument-first metrics'
    - 'every one of the four carries the literal severity instrument-only in the enforcement block'

  four_defects_stop_the_line:
    formula: |
      guard_mutation_score  = 1.00   killed / attempted, on the guard itself
      receipt_presence      = 1.00   PRs merged with a valid receipt / PRs merged
      unmarked_claims       = 0      claims carrying no grounding mark
      vacuous_consultations = 0      status = consulted with attempted = 0
      ratchet(m) = NONE for all four
    domain: 'the four jidoka parameters of spec S8'
    codomain: 'exactly {1.00, 1.00, 0, 0} — a defined defect, not a target'
    invariants:
    - >-
      A ZERO IS NOT A RATCHET. There is nothing to raise, so there is no direction in
      which these four can rot. That is the point of separating them from the four
      above: the same table holds two different KINDS of parameter, and conflating them
      is precisely how a guessed threshold gets written next to a measured one.
    - >-
      guard_mutation_score = 1.00 IS THE ONE PLACE S7'S NARROWNESS DOES NOT APPLY
      (S6.4). Every other verdict rests on the guard, so a guard that cannot fail
      makes every green it emits a count of files rather than a verdict.
    - >-
      vacuous_consultations = 0 IS THE SAME SHAPE AS `pv lint <FILE>` PASSING OVER ZERO
      CONTRACTS, and as `cargo test <no-such-filter>` printing `0 passed`: a pass-shaped
      line from a scan that selected nothing. It is why this contract's own DONE-WHEN
      is `pv validate <file>` and why F-PRREV-008 measures the vacuous form rather than
      citing it.
    - >-
      receipt_presence = 1.00 MEANS A MISSING RECEIPT IS RED, NOT SKIPPED (S6.3). A
      skipped check and a passed check are the same pixel in a status list.
    - >-
      unmarked_claims = 0 IS NOW EXERCISED. S6.3's fourteen rows cover empty
      `source`/`excerpt` (row 3), empty `failure_scenario` (row 11) and a digest
      mismatch (row 12), but none covered a result carrying NO properties.grounding at
      all. PRREV-003 shipped the fifteenth row
      (tests/fixtures/pr-review/row-15-finding-with-no-grounding-mark) and PRREV-004's
      sweep kills both mutants on the branch it pins; PRREV-008 discharges the note. It
      is recorded rather than deleted because the interval matters: for one commit the
      metric read as governed while nothing exercised it, and a `check:` still saying
      "not yet exercised" after the fixture lands is the same defect pointing the other
      way.
    - >-
      vacuous_consultations = 0 WAS ENFORCED FOR ONE CONSULTATION IN FOUR until
      PRREV-008. The guard rejected `mutation.attempted: 0` (row 2) and ACCEPTED
      `cuda: consulted, queries: []`; symmetrically, only cuda's trigger was recomputed
      from the diff, so `pmat`, `crux` and `mutation` could each be skipped outright by
      writing `not-triggered`. Every consultation now carries both halves — a trigger
      recomputed from `git diff` and an emptiness check — and rows 18-21 are the
      fixtures. A metric enforced on one member of a set it quantifies over is not a
      partial gate; it is a gate over one member, reported as if it covered the set.
    preconditions:
    - 'the guard has passed its own positive control (S6.1) before any receipt verdict it emits is believed'
    - 'the mutation set for the guard is committed, so `attempted` is a count of a fixed set and not of whatever happened to run'
    postconditions:
    - 'a receipt with status consulted and attempted 0 yields DEGRADED, never PASS'
    - 'a merged PR without a schema-valid signed receipt is impossible while receipt_presence is armed'

  duplication_coverage_is_recorded_per_surface:
    formula: |
      duplication_coverage : SURFACE -> { semantic, lexical, none }
        SURFACE = { rust, shell, python, config, docs, other,
                    sibling_branches, merge_base_to_main }
        REGION  = { head, siblings, merge_base_to_main }
      pmat.status = consulted =>
             duplication_hits is an array
         and dom(duplication_coverage) >= SURFACE
         and ran(duplication_coverage) subset { semantic, lexical, none }
         and duplication_horizon is a non-empty array of refspecs
         and { r : "<r>=..." in duplication_horizon } >= REGION
         and horizon_branches_{total,scanned} in N (WHOLE numbers)
         and 0 <= horizon_branches_scanned <= horizon_branches_total
         and symbols_searched is a number
      exists s: duplication_coverage(s) = none        => verdict != PASS
      duplication_coverage(sibling_branches) != none
         and horizon_branches_scanned = 0
         and horizon_branches_total > 0                => REJECT(receipt)
      horizon_branches_scanned < horizon_branches_total => verdict != PASS
    domain: 'the pmat consultation of a receipt whose status is `consulted`'
    codomain: 'bool — accepted or rejected whole'
    invariants:
    - >-
      A COVERAGE GAP IS RECORDED, NEVER SILENTLY ABSENT. This is S3.0's three-state
      rule applied one level down, to the field S3.A calls the highest-EV in the
      receipt. PRREV-007 measured the gap: pmat's semantic index is Rust-only, so on
      #2742 — 46 files, 7,244 insertions — 3,533 insertions (48.8%) of shell, python
      and yaml were outside semantic reach entirely. `duplication_hits: []` therefore
      meant "the half I can see is clean" and read as "nothing like this exists".
      It must not be possible to read "searched and found nothing" as identical to
      "could not search".
    - >-
      AN UNSEARCHED SURFACE CANNOT SIT UNDER A PASS. Exactly the rule S6.3 rows 5 and 6
      already apply to an unreachable consultation: `none` is honest and permitted, and
      it costs the receipt its PASS, not its validity. Fixture rows 16 and 17 are that
      pair — the same coverage map under PASS (RED) and under DEGRADED (GREEN). Without
      row 17 the rule would punish the honest receipt as hard as the silent one, and a
      field that costs a PASS whatever is written in it is a field that learns to stay
      empty.
    - >-
      THE HORIZON IS PART OF THE COVERAGE. Prior art on an UNMERGED SIBLING BRANCH is
      invisible to any index anchored to this branch's history, which B6 requires it to
      be. #2781 found #2742's prior art only because #2742 had merged 17 hours earlier;
      reverse the order and S3.A returns []. So the refs actually swept are recorded,
      and a sweep that covered fewer branches than existed cannot read PASS.
    - >-
      THE COUNTS ARE WHOLE NUMBERS, AND THAT IS A CORRECTNESS RULE, NOT A STYLE ONE.
      The two verdict rules compare them with the shell's integer operators, which
      ERROR on a fraction rather than compare false — so the enclosing branch reads
      false and BOTH rules are SKIPPED. Measured: with the whole-number clauses removed,
      a receipt recording scanned 2.5 of 40 under `verdict: PASS` is ACCEPTED; with them
      it is REJECTED. A guard that fails OPEN on a value its own type check admitted is
      the class this contract exists to remove.
    - >-
      A HORIZON THAT SWEPT NOTHING IS THE `attempted: 0` SHAPE. Claiming the sibling
      branches were searched with horizon_branches_scanned = 0 over a non-empty horizon
      passes vacuously, which S3.D already calls DEGRADED rather than clean for
      mutation. The same words, one field over.
    - >-
      THE METHOD VOCABULARY IS CLOSED AT THREE, AND `lexical` IS NOT A SYNONYM FOR
      `semantic`. scripts/pr_review_duplication_scan.sh performs an exact,
      word-boundary name match; a re-implementation under a DIFFERENT name is invisible
      to it and no amount of grep fixes that. The backtest's own example — this guard's
      COMPARATIVE_RE being a second implementation of check_no_claim_literals.sh's
      RATIO_RE — is NOT caught, because the names differ. Recording the method is what
      keeps that residual visible instead of letting `lexical` be read as coverage.
    preconditions:
    - 'the receipt parses and verifies before any coverage field is read'
    - 'horizon_branches_total is the CANDIDATE set — unmerged into origin/main, and neither an ancestor nor a descendant of head_sha — so a complete sweep does not read as partial'
    postconditions:
    - 'every surface in SURFACE carries a method in every consulted receipt'
    - 'no receipt reads PASS while any surface reads `none` or while the horizon sweep was partial'
    - 'a receipt recording `none` under DEGRADED is ACCEPTED (row 17), so honesty is never punished harder than silence'

  autonomous_merge_requires_a_cross_vendor_quorum:
    formula: |
      ARM(pr) <=> receipt_guard_accepts(R)
              and R.predicate.autonomy.requested = true
              and R.predicate.verdict = "PASS"
              and |{ m.vendor : m in R.predicate.autonomy.quorum }| >= 2
              and { primary, cross_vendor } subset { m.role : m in quorum }
              and forall m in quorum: m.actor.id != author_actor.id
                                  and m.verdict = "PASS" and m.refusal = null
              and no S.result carries precision_class = blocking
              and no S.result carries autonomy_effect = "refuse"
              and vacuous_consultations(R) = 0 and mutation.survivors = []
              and paths(head_sha..PR.head) subset { evidence/pr-review/<pr>/** }
              and (rev_list(main_sha_at_review..origin/main) = []
                   or (delta_sweep.status = "clean"
                       and delta_sweep.needles_sha256 = sha256(join(duplication_needles))))
              and paths(base_sha..head_sha) intersect MECHANISM_PATHS = {}
              and not exists_on_origin_main(".github/pr-review-autonomy.disabled")
      NOT-ARM(pr) => the pull request stays green and a human merges it
    domain: 'a pull request whose receipt carries a predicate.autonomy block (spec S13.2)'
    codomain: 'PERMIT | REFUSE[Q1..Q10] — never BLOCK; S13 adds zero rows to the S7 tier'
    invariants:
    - >-
      A REFUSAL IS NOT A BLOCK, AND THE LETTERING ENFORCES IT. The blocking tier stays
      at six, B1..B6. Refusals are Q1..Q10 so that a log line cannot be read as a
      blocking class, and a refused pull request is exactly as mergeable by a human as
      it was before the arm script ran. Conflating the two would let S13 quietly widen
      the blocking policy without amending S7 — the change nobody would notice.
    - >-
      VENDOR-DISTINCTNESS IS THE LOAD-BEARING PROPERTY, NOT MEMBER COUNT. The predicate
      reads |distinct vendor| >= 2 and never |members| >= 2. A second Claude instance
      shares the model, the prompt family, the three-mark vocabulary and the diff: it
      raises the count and not the independence. A third vendor extends the quorum with
      no edit to this file; two Claudes never satisfy it.
    - >-
      THE FOUR CONSULTATIONS ARE SOURCES AND DO NOT VOTE. A source has no verdict.
      Counting them as members would count the same evidence twice — once as the
      source's vote and once inside the primary reviewer's verdict, which IS a function
      of that source's output. A five-member quorum built that way carries one
      independent bit and four copies of it, which is the artifact-that-reads-as-N-checks
      shape S6.1 and this contract's own D8 note exist to refuse.
    - >-
      DEGRADED NEVER MERGES, AND THE THROUGHPUT COST IS THE POINT. S3.0 exists so that
      "could not consult" and "consulted, found nothing" are different artifacts.
      Auto-merging on DEGRADED re-collapses that distinction exactly where it acquires
      consequences. MEASURED: pmat MCP is ConnectionRefused in the authoring session and
      6 of 8 recent reviews returned DEGRADED, so this rule would have refused all six.
      That is the mechanism working; the remedy is to fix availability, never the rule.
    - >-
      VALIDITY IS DELEGATED, NEVER RE-IMPLEMENTED. The arm script shells out to
      scripts/check_pr_review_receipt.sh for signature, schema, merge base, index
      ancestry, the marks and B4 — one implementation, the one 185 mutants are run
      against. A second copy inside the arm script would be two implementations of one
      rule, each green against its own copy, which is D8 in the code written to enforce
      D8. Fixture q-40b asserts the delegated refusal still carries the guard's own
      class, because a delegation that swallows the callee's diagnosis is one nobody can
      act on.
    - >-
      A PULL REQUEST THAT EDITS THE MERGE MECHANISM DOES NOT MERGE ITSELF. MECHANISM_PATHS
      is a LITERAL PREFIX LIST and not a regex: matching is `case "$f" in "$m"*)`, which
      cannot be wrong the way a pattern can, and this repository's guard patterns have
      been wrong six times. The falsifiable consequence is that the pull request
      introducing S13 touches every entry and is therefore refused under Q9 by its own
      mechanism.
    - >-
      THE KILL SWITCH IS READ FROM origin/main AND NEVER FROM THE PR TREE. A branch that
      deletes .github/pr-review-autonomy.disabled must not thereby turn autonomy back on.
      It is evaluated FIRST in the repository phase, because an off switch consulted only
      after five other checks have passed costs a minute of compute to use.
    preconditions:
    - 'every artifact-only clause is evaluated before every repository clause, so the positive control can fire in any working directory'
    - 'the narrower clause precedes the general one: asserted-and-blocking before blocking, or the specific diagnosis is unreachable and its mutant is a permanent survivor'
    - 'the PR context is an ARTIFACT produced by gh and consumed by one evaluator, so the live path and the test path are the same code'
    postconditions:
    - 'a refused pull request retains every check result it had; nothing is marked failed'
    - 'the arming call is idempotent — an already-armed pull request reports ALREADY-ARMED and invokes nothing'
    - 'autonomous_merge_reverts is recorded as 0/0 and READ AS UNDEFINED, never as clean'

falsification_tests:

# THREE of the fifteen below are LIVE-PENDING and every one says so IN `test:`, the
# field the schema reads and `pv lint --strict-test-binding` classifies. It was seven at
# PRREV-001, when this file shipped alone and the guard did not exist; PRREV-008
# discharges the four whose recorded reason ("the guard does not exist at 745fa8588",
# "the fixtures are unwritten") is no longer true, and REWRITES the reason on F-PRREV-004,
# which is still pending but no longer for the reason it gives. A ledger that keeps saying
# an artifact is unwritten after it lands is the same defect as one that claims a metric
# is exercised when it is not; it just points the other way, and the next reader believes
# whichever of the two files they happen to open first. The house
# alternative is a `test_harness_status:` sibling key; that key is not a field of
# `FalsificationTest`, serde drops it, and a dropped key that reads as governance is
# #2465 exactly. The `mutation:` keys below are dropped for the same reason and are
# addressed to a human PR author, not to a gate — no pv gate reads them, and none is
# claimed to.

- id: F-PRREV-001
  rule: an unmarked claim is a defect in the review, not a lesser claim
  prediction: >-
    A receipt carrying a SARIF result with no properties.grounding is REJECTED with a
    non-zero exit. The same receipt with grounding=asserted and a non-empty rationale
    is ACCEPTED and the finding is non-blocking.
  test: 'bats tests/pr-review.bats -f "row 15"'
  if_fails: >-
    S8's unmarked_claims = 0 is unenforceable, and the whole S1 mark system degrades to
    a labelling convention that a reviewer may simply omit — which is the pre-contract
    status quo with extra ceremony
  mutation: >-
    delete the grounding-presence branch from the guard; fixture row 15 must turn RED.
    A guard that still passes after the branch is deleted never had one.

- id: F-PRREV-002
  rule: cited is verified, not merely labelled
  prediction: >-
    A result with grounding=cited and excerpt_sha256 != sha256(excerpt) is REJECTED
    (row 12); so is one with an empty source or excerpt (row 3). A cited result whose
    digest matches a non-empty excerpt is ACCEPTED (row 14).
  test: 'bats tests/pr-review.bats -f "row (3|12|14) "'
  if_fails: >-
    a citation becomes a string a reviewer types, which is indistinguishable from
    memory with a URL attached — the exact failure S3.B exists to stop
  mutation: >-
    replace the digest comparison with a presence check for the excerpt_sha256 key;
    row 12 must turn RED while row 14 stays GREEN. Both arms are required: a mutation
    that reds everything proves the guard is broken, not that it discriminates.

- id: F-PRREV-003
  rule: the blocking tier discriminates, and it has six rows
  prediction: >-
    Every RED row of S6.3 (1, 2, 3, 4, 5, 8, 9, 10, 11, 12, 13) exits non-zero and
    names exactly one of B1..B6; every GREEN row (6, 7, 14) exits zero. B5 is expected
    to be named by NO row, because no fixture exercises a semver break — that absence
