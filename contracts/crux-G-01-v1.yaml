- type: invariant
  property: "missing HF_TOKEN exits non-zero with actionable error"
- type: equivalence
  property: "apr publish produces identical /tree/main state to huggingface_hub.HfApi.upload_file on the same inputs"
  competitor: huggingface
  reference: "https://huggingface.co/docs/huggingface_hub/guides/upload (HfApi.upload_file); https://huggingface.co/docs/hub/api"

