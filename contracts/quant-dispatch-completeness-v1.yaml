equations:
  completeness:
    description: "∀ id ∈ types: table[id] is Some — every live ggml type has an entry"
    formula: "∀ t ∈ types: quant_type_traits(t.id) = Some(e) ∧ e.name = t.name"
    invariants:
      - "|{t ∈ types}| = 35 = type_count − |removed_ids| (every id in [0, type_count) is a row or a removed id; none is silently skipped)"
  rejection:
    description: "∀ id ∈ removed_ids ∪ [type_count, ∞): table[id] is None — removed and unknown ids are refused, never defaulted"
    formula: "∀ id ∈ removed_ids: quant_type_traits(id) = None ∧ ∀ id ≥ type_count: quant_type_traits(id) = None"
  byte_size:
    description: "∀ t: table[t.id].bytes_for(n) = ceil(n / t.block) × t.bytes — the only place a tensor is sized"
    formula: "bytes_for(n) = ⌈n / block⌉ · bytes"
    postconditions:
      - "bytes_for(block) = bytes"
      - "bytes_for(0) = 0"
  dequant_presence:
    description: "∀ t: (table[t.id].dequant is Some) ⇔ t.dequant — the table has a dequant fn exactly for the types ggml itself can dequantize"
    formula: "is_some(e.dequant_to_f32) ⇔ t.dequant"
  single_source:
    description: "The set of files matching on a raw qtype outside the table shrinks monotonically to the `keep` set"
    formula: "oracle(tree) ⊆ {s.file : s ∈ dispatch_sites}"

proof_obligations:
  - id: PO-QDC-001
    type: invariant
    property: "quant_type_traits() covers every row of `types` (equation completeness)"
    formal: "rust test: iterate the contract's types, assert Some for each id and name equality"
  - id: PO-QDC-002
    type: invariant
    property: "quant_type_traits() returns None for every removed_ids entry and for id = type_count (equation rejection)"
    formal: "rust test: iterate removed_ids ∪ {type_count}, assert None"
  - id: PO-QDC-003
    type: invariant
    property: "Every QuantBlockFormat / QuantCodebookFormat impl's SUPERBLOCK_BYTES and ELEMENTS_PER_SUPERBLOCK equal the `bytes`/`block` of its row (equation byte_size)"
    formal: "rust test: for each impl, compare associated consts against the contract row"
  - id: PO-QDC-004
    type: invariant
    property: "Every grid in `grids` is present in the Rust port with exactly `entries` elements, and its first and last element equal the reference header's"
    formal: "rust test over the generated grid module; generator script asserts the same at generation time"
  - id: PO-QDC-005
    type: invariant
    property: "Re-running the dispatch_sites oracle yields no file absent from dispatch_sites (equation single_source)"
    formal: "rust test: run the oracle regex over crates/aprender-serve/src, diff against the list"

falsification_tests:
  - id: FALSIFY-QDC-001
    rule: "Removing any single row's table entry turns PO-QDC-001 RED"
    prediction: "Delete the Q3_K entry from QUANT_TYPE_TRAITS: the completeness test fails naming id 11 / Q3_K. OWED (Phase 1, needs the table): test fn qdc_table_covers_every_row in quantize/dispatch_contract_tests.rs"
    if_fails: "The gate is theater: the table can lose a type without CI noticing — #3091's failure mode is still open"
  - id: FALSIFY-QDC-002
    rule: "A table entry for a removed id turns PO-QDC-002 RED"
    prediction: "Add an entry at id 4 (Q4_2): the rejection test fails"
    test: "cargo test -p aprender-serve --lib qdc_removed_ids_rejected"
    if_fails: "Removed/corrupt ids can be defaulted to a real kernel — the ALG-006 vacuous-catch-all class"
  - id: FALSIFY-QDC-003
    rule: "A wrong byte size in any impl turns PO-QDC-003 RED"
    prediction: "Set Q4K::SUPERBLOCK_BYTES = 145: the byte-size test fails naming Q4_K"
    test: "cargo test -p aprender-serve --lib qdc_block_format_consts_match_rows"
    if_fails: "Tensor sizing can drift from the on-disk layout — the #2535 'truncated/corrupt' misdiagnosis class"
  - id: FALSIFY-QDC-004
    rule: "A truncated or edited grid turns PO-QDC-004 RED"
    prediction: "Drop the last element of iq2xs_grid: the grid test fails naming iq2xs_grid, expected 512. OWED (Phase 1, needs iq_grids.rs): test fn qdc_grids_match_reference in quantize/dispatch_contract_tests.rs"
    if_fails: "Codebook dequant can silently index past or into a wrong lattice point"
  - id: FALSIFY-QDC-005
    rule: "A new file that matches on a raw qtype outside dispatch_sites turns PO-QDC-005 RED"
    prediction: "Add `match qtype { GGUF_TYPE_Q4_K => … }` to a new non-test file: the single-source test fails naming that file"
    test: "cargo test -p aprender-serve --lib qdc_dispatch_sites_match_oracle"
    if_fails: "A 31st dispatch site can appear — the exact mechanism behind all five prior tickets"
  - id: FALSIFY-QDC-006
    rule: "The ggml reference and this file agree on every row"
    prediction: "Regenerate `types` from ggml.h + ggml-common.h at the pinned commit: zero diff. OWED (Phase 1): scripts/gen_quant_dispatch_rows.sh --check"
    if_fails: "This contract has drifted from the format it claims to enumerate and is no longer a source of truth"
