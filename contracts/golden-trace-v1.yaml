metadata:
  version: "1.0.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  references:
    - "PMAT-QA golden output methodology."
  description: "Golden trace validation for inference correctness"

name: golden-trace
version: "1.0.0"
scope: "crates/aprender-serve/src/"

description: |
  Golden trace: run inference with known input, compare output logits against reference. Validates model loading, tensor layout, and computation pipeline.

equations:
  logit_parity:
    description: "∀ token_pos: |model_logits - reference_logits| < ε"
    formula: "∀ token_pos: |model_logits - reference_logits| < ε"

  argmax_identity:
    description: "argmax(model_logits) == argmax(reference_logits) for all positions"
    formula: "argmax(model_logits) == argmax(reference_logits) for all positions"

falsification:
  - id: FALSIFY-GOLDEN_TRACE_V1_001
    description: "∀ token_pos: |model_logits - reference_logits| < ε"
    test: "Related tests in crates/aprender-serve/src/"
    evidence: "cargo test --lib"

  - id: FALSIFY-GOLDEN_TRACE_V1_002
    description: "argmax(model_logits) == argmax(reference_logits) for all positions"
    test: "Related tests in crates/aprender-serve/src/"
    evidence: "cargo test --lib"

# PMAT-7235: bound to CI-run tests (--lib).
falsification_tests:
  - id: FALSIFY-GOLDEN_TRACE_V1-BIND-001
    rule: "covers FALSIFY-GOLDEN_TRACE_V1_001: logit verification accepts equal logits and rejects ones outside the tolerance"
    prediction: "test_verify_logits_pass and test_verify_logits_fail pass"
    test: "cargo test -p aprender-core --lib test_verify_logits_pass"
  - id: FALSIFY-GOLDEN_TRACE_V1-BIND-002
    rule: "covers FALSIFY-GOLDEN_TRACE_V1_002: logit stats report the argmax of the logits"
    prediction: "test_logit_stats passes"
    test: "cargo test -p aprender-core --lib test_logit_stats"
