name: lora-target-selection
version: "1.1.0"
scope: "crates/aprender-train/src/finetune/"

description: |
  Selects which modules to apply LoRA adapters: q_proj, v_proj by default. Validates targets exist in model.

equations:
  target_exists:
    description: "∀ target ∈ selected: target exists in base model weights"
    formula: "∀ target ∈ selected: target exists in base model weights"

  default_targets:
    description: "default selection = {q_proj, v_proj} for decoder-only LLMs"
    formula: "default selection = {q_proj, v_proj} for decoder-only LLMs"

falsification:
  # Rows 001 and 002 cite "Related tests in …/finetune/", which no cargo test filter
  # resolves (0.72 risk K24, pv-falsifier-test-resolves-v1). Left as found.
  - id: FALSIFY-LORA_TARGET_SELECTION_V1_001
    description: "∀ target ∈ selected: target exists in base model weights"
    test: "Related tests in crates/aprender-train/src/finetune/"
    evidence: "cargo test --lib"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_002
    description: "default selection = {q_proj, v_proj} for decoder-only LLMs"
    test: "Related tests in crates/aprender-train/src/finetune/"
    evidence: "cargo test --lib"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_003
    description: "PROPOSED (0.72 R15 cell C2, la-0.72): on the CUDA NF4 instruct path, the five sites hard-coded to a_q, b_q, a_v, b_v at 316dee2cd4 (build_lora_layers constructors.rs:358, pushes :383/:397; inject_adapter_weights :428, idx*2 + !is_q; CudaLoraGradWorkspace cuda_block.rs:3853; GpuLoraOptimizerState :3954; gradient clipping :3902-3936) all take one target set from LoRAConfig (lora/config.rs: target_modules, or all_linear = q/k/v/o/gate/up/down). On a tiny dense NF4 model with L layers: q_proj,v_proj gives today's 4·L adapter tensors with the same names and shapes, and one step is bit-identical to the C1 path (reuse the FALSIFY-LORA_GRADIENT_FLOW_V1_004 harness); all_linear gives 14·L, an A and a B for each of the seven modules; the grad workspace, the optimizer state and the clip norm each cover exactly those 14·L tensors. On a hybrid model the count is one A/B pair per matched module, not 7 per layer. Planted: one site left Q/V-only (e.g. GpuLoraOptimizerState with 4 slots per layer) must be RED. An unmatched target name refuses before step 1 (FALSIFY-FT-TASK-003)"
    test: "[U] not written; needs cargo + CUDA after LIVE 0.70.1, GPU lock around the test binary only"
    evidence: "none yet; desk read of 316dee2cd4 (docs/specifications/aprender-train/r15-cuda-lora-cells.md, C2)"
