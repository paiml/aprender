metadata:
  version: "1.14.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  references:
    - "Hu et al. (2022). LoRA: Low-Rank Adaptation of Large Language Models."
    - "0.72 R15a cell C2a (la-0.72): InstructPipeline::from_pretrained routes each tensor of a PEFT adapter by its name into the q_proj or v_proj LoRA layer of its layer, or refuses the load (crates/aprender-train/src/finetune/instruct_pipeline/constructors.rs); 1.1.0 adds adapter_routing and FALSIFY-LORA_TARGET_SELECTION_V1_003"
    - "0.72 R15a cell C2b (la-0.72): InstructConfig.lora_targets selects the LoRA targets of the instruct pipeline, build_lora_layers and inject_adapter_weights share one slot map, and every constructor refuses a target set its forward does not train (crates/aprender-train/src/lora/target.rs, crates/aprender-train/src/finetune/instruct_pipeline/constructors.rs); 1.2.0 adds target_slots and trained_targets, generalizes adapter_routing to the selected targets, and adds FALSIFY-LORA_TARGET_SELECTION_V1_004"
    - "0.72 R15a cell C2c (la-0.72): the CUDA NF4 blocks, CudaLoraGradWorkspace, GpuLoraOptimizerState, the unfused and fused gradient clips and the classify pipeline's gradient accumulation hold one A and one B per selected target instead of four q/v fields (crates/aprender-train/src/transformer/cuda_block.rs, crates/aprender-train/src/finetune/fused_lora_clip.rs, crates/aprender-train/src/finetune/classify_pipeline/gpu.rs); 1.3.0 adds device_targets and FALSIFY-LORA_TARGET_SELECTION_V1_005"
    - "0.72 R15a cell C3b (la-0.72): a backward with a gradient clip set runs under graph capture only with the fused clip, which runs inside the capture; without it the backward runs uncaptured and the syncing clip runs (crates/aprender-train/src/finetune/instruct_pipeline/backward.rs); 1.4.0 adds captured_clip and FALSIFY-LORA_TARGET_SELECTION_V1_006"
    - "0.72 R15a cell C4a (la-0.72): the instruct pipeline uploads every selected adapter of a layer to that layer's CUDA NF4 block, and syncs every adapter a block holds back to its own slot (crates/aprender-train/src/finetune/instruct_pipeline/device_targets.rs, cuda_init.rs, accessors.rs); 1.5.0 adds device_sync and FALSIFY-LORA_TARGET_SELECTION_V1_007"
    - "0.72 R15a cell C4b (la-0.72): the CPU forward of the instruct pipeline adds every selected adapter's delta to its own projection, reading each adapter from its own slot (crates/aprender-train/src/transformer/attention.rs, feedforward.rs, model.rs, and the instruct pipeline's CPU training step and generation); 1.6.0 adds cpu_forward and FALSIFY-LORA_TARGET_SELECTION_V1_008"
    - "0.72 R15a cell C4c (la-0.72): TransformerTrainer builds its LoRA layers by the selected targets and its forward reads each adapter from that same slot (crates/aprender-train/src/train/transformer_trainer/trainer.rs); 1.7.0 adds trainer_forward and FALSIFY-LORA_TARGET_SELECTION_V1_009"
    - "0.72 R15a cell C5a (la-0.72): the CUDA trainer's APR checkpoint, its resume and its PEFT adapter save name and lay out every adapter a block holds by its target (crates/aprender-train/src/train/transformer_trainer/cuda_trainer.rs, lora_checkpoint.rs); 1.8.0 adds checkpoint_names and FALSIFY-LORA_TARGET_SELECTION_V1_010"
    - "0.72 R15a cell C5b (la-0.72): the CUDA trainer's NF4 blocks, its LoRA scratch and its LoRA gradient workspace hold one adapter per selected target, each initialised by target, and q_proj and v_proj keep the init they had (crates/aprender-train/src/train/transformer_trainer/lora_init.rs)"
    - "0.72 R15a cell C6 (la-0.72): the backward GEMM cache key and the dims its kernel is built with come from one function the runtime and the pre-warm both call, and the CUDA trainer pre-warms the LoRA backward GEMMs of every selected target (crates/aprender-train/src/autograd/cuda_backward_keys.rs); 1.10.0 adds lora_backward_prewarm and FALSIFY-LORA_TARGET_SELECTION_V1_012"
    - "0.72 R15a cell C7 (la-0.72): the CUDA trainer pre-warms the AdamW step kernel at every parameter count its NF4 LoRA optimizer step asks for, by the selected targets (crates/aprender-train/src/train/transformer_trainer/lora_init.rs lora_adamw_sizes, autograd/cuda_optim.rs pre_warm_adamw_sizes); 1.11.0 adds lora_adamw_prewarm and FALSIFY-LORA_TARGET_SELECTION_V1_013"
    - "0.72 R15a cell C8 (la-0.72): InstructPipeline::from_pretrained loads a trained adapter only when it fills every LoRA slot, A and B (crates/aprender-train/src/finetune/instruct_pipeline/constructors.rs inject_adapter_weights); 1.12.0 adds adapter_load_complete and FALSIFY-LORA_TARGET_SELECTION_V1_014"
    - "0.72 R15a cell C9 (la-0.72): InstructPipeline::from_pretrained refuses an adapter it cannot read and an adapter whose adapter_config.json declares targets other than lora_targets, instead of warning and serving fresh LoRA weights (crates/aprender-train/src/finetune/instruct_pipeline/constructors.rs load_trained_adapter, check_adapter_targets); 1.13.0 adds adapter_targets_declared and FALSIFY-LORA_TARGET_SELECTION_V1_015"
    - "0.72 R15a cell C10 (la-0.72): apr finetune --lora-targets parses its list with LoraTargets::parse before anything loads and carries the set into InstructConfig.lora_targets on the LoRA training path, and every other finetune mode refuses the flag instead of ignoring it (crates/apr-cli/src/commands/finetune.rs parse_lora_targets_flag, lora_targets_unhonoured_by, build_instruct_config); 1.14.0 adds cli_targets_reach_config and FALSIFY-LORA_TARGET_SELECTION_V1_016"
  description: "LoRA target module selection"

name: lora-target-selection
version: "1.14.0"
scope: "crates/aprender-train/src/finetune/"

description: |
  Selects which modules to apply LoRA adapters: q_proj, v_proj by default. Validates targets exist in model.

equations:
  target_exists:
    description: "∀ target ∈ selected: target exists in base model weights"
    formula: "∀ target ∈ selected: target exists in base model weights"

  default_targets:
    description: "default selection = {q_proj, v_proj} for decoder-only LLMs"
    formula: "default selection = {q_proj, v_proj} for decoder-only LLMs"

  adapter_routing:
    description: "A loaded adapter tensor lands in the LoRA slot its name targets, or the whole load is refused and no slot changes"
    formula: "∀ t ∈ adapter: proj(t) ∈ T ∧ layer(t) < L ∧ kind(t) ∈ {lora_A, lora_B} ∧ |t| = |slot(t)| ∧ slot(t) unique ⇒ slot(t) := t, with slot(t) = |T|·layer(t) + pos_T(proj(t)); otherwise load → Err and ∀ slot: unchanged. For the default T = (q_proj, v_proj), slot(t) = 2·layer(t) + [proj(t) = v_proj]"

  target_slots:
    description: "The LoRA layers are one adapter per layer and selected target, in slot order, each shaped as the projection it adapts"
    formula: "T = the selection sorted and deduplicated in the order (q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj); rank > 0 ⇒ |lora_layers| = |T|·L ∧ lora_layers[|T|·l + pos_T(p)] adapts projection p of layer l with (d_out, d_in) = (q, h), (kv, h), (kv, h), (h, q), (i, h), (i, h), (h, i) for q_proj … down_proj, where h = hidden, q = heads·head_dim, kv = kv_heads·head_dim, i = intermediate"

  trained_targets:
    description: "A pipeline is built only for the targets its forward and backward read"
    formula: "construct(config) ⇒ T(config) = {q_proj, v_proj}; otherwise construction is refused before any weight is loaded, naming every t ∈ T ∖ {q_proj, v_proj} and every t ∈ {q_proj, v_proj} ∖ T"


  device_targets:
    description: "On the CUDA NF4 path every per-layer LoRA store holds one A and one B per target of its block, in slot order, and the clip norm sums exactly those gradients and the two norm gradients"
    formula: "∀ block b with targets T_b (slot order): adapters(b) = [(t, A_t, B_t) : t ∈ T_b] with |A_t| = d_in(t)·r ∧ |B_t| = r·d_out(t), (d_out, d_in) as in target_slots; grads(W) = [(t, dA_t, dB_t) : t ∈ T_W] with the same lengths and T_W in slot order without repeats, else new_for_targets is refused; step(b, W, opt) ∧ T_b ≠ ∅ ⇒ T_W = T_b ∧ T_opt = T_b, else refused before any update; opt(b) holds (m, v) for each A_t, B_t of b and both norms; ‖g‖² = (Σ_{t ∈ T_W} (‖dA_t‖² + ‖dB_t‖²)) + ‖d_input_norm‖² + ‖d_post_attn_norm‖², summed left to right in that order, so T = (q_proj, v_proj) adds the same six terms in the same order as the four-field form"

  captured_clip:
    description: "A backward with a gradient clip set is captured into a graph only when the fused clip can run inside the capture, so no captured or replayed step skips the clip"
    formula: "captured(step) ⇔ graph_enabled ∧ (clip_norm = None ∨ fused_clip ≠ None)"

  device_sync:
    description: "The instruct pipeline uploads every selected adapter of a layer to that layer's NF4 block, and a sync writes every adapter downloaded from a block back to its own slot, or refuses and changes no slot"
    formula: "upload(l) = [(t, Aᵀ_s, Bᵀ_s) : t ∈ T, s = |T|·l + pos_T(t)] in slot order, q_proj and v_proj through new and every other t through add_lora_adapter; for D = [(t, A, σ·B)] downloaded from block l: (∀ (t, A, σB) ∈ D: t ∈ T ∧ s(t) = |T|·l + pos_T(t) < |lora_layers| ∧ |A| = |Aᵀ_s(t)| ∧ |σB| = |Bᵀ_s(t)|) ⇒ ∀ (t, A, σB) ∈ D: slot s(t) := (A, σB / σ); otherwise sync(l, D) → Err and ∀ slot: unchanged. For T = (q_proj, v_proj), s = 2l and 2l + 1, the two slots read before"

  cpu_forward:
    description: "The CPU forward adds every selected adapter's delta to its own projection's output, each adapter read from its own slot, so each adapter acts as a change to its own projection's weight"
    formula: "∀ l < L with |T|·(l + 1) ≤ |lora_layers|, ∀ t ∈ T, s = |T|·l + pos_T(t): y_t = x_t·W_tᵀ + σ_s·(x_t·Aᵀ_s)·Bᵀ_s, where x_t is projection t's input (the normed hidden state for q, k, v, gate and up, the heads' concatenation for o, the SwiGLU product for down) and the delta is added before the bias, QK-norm and RoPE for q and k, before the bias for v, before SwiGLU for gate and up, and before the residual add for o and down; a layer with |T|·(l + 1) > |lora_layers| runs without LoRA. So with only adapter s nonzero the forward equals the plain forward with W_t replaced by W_t + σ_s·B_s·A_s, and for T = (q_proj, v_proj) it equals forward_hidden_with_lora bit for bit"

  trainer_forward:
    description: "TransformerTrainer lays its LoRA layers out by its targets, and its forward reads each adapter from that slot, so the adapter it trains and saves is the one its forward applied"
    formula: "T = the names of lora_target_modules (default q_proj, v_proj; shorthands expanded) that are one of the seven projections, in slot order without repeats; rank set ∧ T ≠ ∅ ⇒ |lora_layers| = |T|·L ∧ lora_layers[|T|·l + pos_T(t)] adapts projection t of layer l with (d_out, d_in) as in target_slots, and forward_single(x) = forward_with_targets(x, lora_layers, T) as in cpu_forward; rank set ∧ T = ∅ ⇒ lora_layers = [] and the forward is the plain one. For T = (q_proj, v_proj) the slots are 2l and 2l + 1 and the forward equals forward_with_lora bit for bit"

  checkpoint_names:
    description: "The CUDA trainer saves, restores and exports every adapter a block holds under its own target's name and shape, so a checkpoint carries each adapter the block trained and gives it back to the same target"
    formula: "∀ block l, ∀ (t, A, σB) ∈ download_lora_adapters(l): the APR checkpoint holds lora.{l}.{module(t)}.lora_a = A and lora.{l}.{module(t)}.lora_b = σB, with module(t) ∈ {q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj}; resume of block l with held targets T_l uploads (t, A, σB) for each t ∈ T_l whose two tensors the file holds, and a layer with none keeps its init; the PEFT adapter holds, for each such (t, A, σB), module model.layers.{l}.self_attn.{module(t)} for t ∈ {q, k, v, o} and model.layers.{l}.mlp.{module(t)} for t ∈ {gate, up, down}, with lora_A = Aᵀ of shape (r, d_in(t)) and lora_B = (σB)ᵀ / σ of shape (d_out(t), r), (d_out, d_in) as in target_slots, and target_modules = the held targets' module names. For T_l = (q_proj, v_proj) every name, shape and value is the one written before"

  nf4_init_targets:
    description: "The CUDA trainer gives each NF4 block one adapter per selected target, sizes its LoRA scratch and LoRA gradient workspace for those targets, and keeps the q_proj and v_proj init it had"
    formula: "T = the trainer's targets as in trainer_forward; ∀ block l: lora_targets(l) = T, and ∀ t ∈ T with (d_out, d_in) as in target_slots: A_t[j] = sin((j + φ(l, t))·0.1)·0.01 for j < d_in·r, and B_t = 0 of length r·d_out, where φ(l, q_proj) = 1000·l, φ(l, v_proj) = 2000·l + 500 and φ(l, t) = 1000·l + 100000·p(t) + 333 for every other t, p(t) its position in q, k, v, o, gate, up, down; q_proj and v_proj go to the block through new and every other t through add_lora_adapter; the shared LoRA scratch and gradient workspace are built for T. For T = (q_proj, v_proj) every A and B is the one built before, bit for bit"
  lora_backward_prewarm:
    description: "A backward GEMM's cache key and its kernel dims come from one function, and the CUDA trainer pre-warms the LoRA backward GEMMs of every selected target"
    formula: "gemm_backward_x(m, k, n) for x ∈ {a, b}, called as the runtime calls it, has key gemm_backward_x_{m}_{k}_{n} and kernel GemmBackwardXKernel::tiled_unrolled(m, n, k); the runtime and the pre-warm both take key and kernel from it. For each t ∈ T with (d_out, d_in) as in target_slots, the LoRA backward of t asks for gemm_backward_b(s, r, d_out), gemm_backward_a(s, d_out, r), gemm_backward_b(s, d_in, r) and gemm_backward_a(s, r, d_in), with s = max_seq_len and r the rank; lora_backward_gemms(T) is the union over T, sorted by key with no repeat, and the CUDA trainer pre-warms it before it uploads a block. For T = (q_proj, v_proj) the keys are the six warmed before"
  lora_adamw_prewarm:
    description: "The CUDA trainer pre-warms the AdamW step kernel at every parameter count the NF4 LoRA optimizer step of its selected targets asks for"
    formula: "adamw_step_cuda(.., n) looks up adamw_step_{n} and compiles AdamWStepKernel::new(n) on a miss. CudaNf4TransformerBlock::lora_optimizer_step steps, per adapter t of the block in slot order, A_t (d_in(t)·r values) and B_t (r·d_out(t) values), then the two RMSNorm weights (hidden values each). lora_adamw_sizes(config, modules, r) = sorted, no repeat, {d_in(t)·r, r·d_out(t) : t ∈ nf4_targets(modules)} ∪ {hidden}, with (d_out, d_in) = LoraTarget::dims. Under NF4 LoRA the trainer pre-warms adamw_step_{n} for each n in it before block upload. For T = (q_proj, v_proj) it is {hidden·r, r·q_dim, r·kv_dim, hidden}, the NF4 LoRA sizes of pre_warm_lora_adamw_kernels."
  adapter_load_complete:
    description: "A trained adapter loads only whole: every LoRA slot of the selected targets gets its A and its B from the adapter, or nothing loads"
    formula: "Let W be the tensors of adapter_model.safetensors and P ⊆ slots × {A, B} the places they fill (adapter_slot, lengths equal, no place twice). inject_adapter_weights writes W iff every tensor of W has a place and P = {0..|lora_layers|} × {A, B}. Otherwise it returns ConfigError naming every unplaced tensor and every unfilled place as layers.{l}.{target}.lora_{A|B}, l = idx / |T| and target = T[idx mod |T|], and no LoRA layer changes."
  adapter_targets_declared:
    description: "A trained adapter loads only into the targets it was trained on, and an adapter that is present but unreadable refuses the load"
    formula: "Let D be target_modules of adapter_config.json, parsed by LoraTargets::parse, and T = InstructConfig.lora_targets. If adapter_model.safetensors is absent, nothing loads and the LoRA layers keep their init. If it is present and load_adapter_peft fails, from_pretrained returns ConfigError naming the path and the cause. If D is non-empty and D ≠ T as sets, it returns ConfigError naming D and T, before any tensor is placed. An empty D declares nothing, and adapter_load_complete decides. No LoRA layer changes on a refusal."
  cli_targets_reach_config:
    description: "apr finetune --lora-targets selects T for the run it starts, or refuses; it is never silently dropped"
    formula: "Let F be the --lora-targets value, split on commas with each name trimmed. With F absent, T = LoraTargets::default() = {q_proj, v_proj}, as before. With F present, T = LoraTargets::parse(F); an unknown name or an empty list returns an error naming it before any model, corpus or GPU is touched. On the LoRA training path (execute_training), build_instruct_config sets InstructConfig.lora_targets = T, and row 004 still bounds T to {q_proj, v_proj} until it is lifted. A mode that does not build that InstructConfig (--merge, --task classify, --task instruct, --adapters, --plan, the wgpu backend (an explicit --gpu-backend wgpu before anything loads, or auto choosing it), a build without training) returns an error naming the mode when F is present."

falsification:
  - id: FALSIFY-LORA_TARGET_SELECTION_V1_001
    description: "∀ target ∈ selected: target exists in base model weights"
    test: "Related tests in crates/aprender-train/src/finetune/"
    evidence: "cargo test --lib"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_002
    description: "default selection = {q_proj, v_proj} for decoder-only LLMs"
    test: "Related tests in crates/aprender-train/src/finetune/"
    evidence: "cargo test --lib"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_003
    description: "InstructPipeline::from_pretrained places each tensor of adapter_model.safetensors by its name (0.72 R15a C2a). At 316dee2cd4 inject_adapter_weights sent every tensor whose name lacks q_proj to the V slot of its layer and treated every name without lora_A as lora_B, so an adapter that also carries k_proj, o_proj or MLP tensors overwrote the v_proj adapter, and which tensor won depended on the HashMap order of load_adapter_peft. Now a tensor goes to slot 2·layer for q_proj and 2·layer+1 for v_proj, as A or B by its lora_A or lora_B component, and only if its length equals that slot's tensor. A tensor that names another projection, a layer the model does not have, neither lora_A nor lora_B, a slot another tensor already took, or the wrong length (a rank mismatch, or bf16 bytes read as f32) refuses the whole load with an error that names it, and no LoRA layer changes. The test loads one adapter in two tensor orders and gets the same layers, with every slot holding its own distinct values; a k_proj tensor with exactly the V slot's length refuses and leaves every slot as it was; a lora_A of the wrong rank refuses. Planted: routing by the 316dee2cd4 rule, dropping the length check, and writing tensors before all are placed must each be RED."
    test: "crates/aprender-train/src/finetune/instruct_pipeline/constructors_adapter_tests.rs::falsify_lora_target_selection_v1_003_routes_by_name_in_any_order (with falsify_lora_target_selection_v1_003_unplaceable_tensor_refuses_and_changes_nothing and falsify_lora_target_selection_v1_003_wrong_rank_refuses in the same file)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_003"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_004
    description: "The instruct pipeline takes its LoRA targets from InstructConfig.lora_targets (0.72 R15a C2b). At 9e54b96c6d InstructConfig had no target list: build_lora_layers made a q_proj and a v_proj adapter for every layer, and inject_adapter_weights placed only q_proj and v_proj tensors, so no other target could be asked for. Now LoraTargets::parse takes module names and the all_linear, attention, qv and mlp shorthands, keeps them in the order q, k, v, o, gate, up, down without repeats, and refuses an empty list or any name that is not one of the seven projections, naming it; the default is q_proj, v_proj. build_lora_layers makes one adapter per layer and target at slot |T|·layer + pos_T(target), with its projection's shape and base weight, and inject_adapter_weights places tensors by the same slot map. The CPU forward, the CUDA NF4 blocks and the sync between them still read only slot 2·layer as q_proj and 2·layer+1 as v_proj, so every constructor refuses any other target set before it builds or loads a weight: from_pretrained and from_apr return an error that names each target that would not train and each one missing, and new and MultiAdapterPipeline::add_adapter panic with it. The tests parse a repeat, each shorthand and out-of-order names to the sorted targets, and refuse an unknown name, a shorthand beside a name, an empty name and an empty list, naming each; check that the default slot map is the one the forward reads and that all_linear puts target p at 7·layer + p; build all_linear, qv, mlp, and k_proj with o_proj on a model with one KV head and check each slot's shape and base weight; load an all_linear adapter, listed in reverse slot order, each tensor into its own slot, while the default refuses its k_proj and down_proj tensors by name; check that from_pretrained and from_apr refuse all_linear, q_proj alone, and k_proj with v_proj by name, while the default gets past the check to the model load; and check that new and add_adapter panic on all_linear, add_adapter after it has added an adapter with the default targets. Planted: build_lora_layers ignoring the targets, an o_proj adapter with d_out and d_in swapped, a k_proj adapter wrapping w_v, routing by the q_proj and v_proj names alone, routing by the all_linear slot map whatever the targets, parse dropping an unknown name or keeping the given order, a slot of layer + position, a check that passes any superset of q_proj and v_proj or leaves the missing targets out of its message, and removing the check from each constructor must each be RED."
    test: "crates/aprender-train/src/finetune/instruct_pipeline/constructors_target_tests.rs::falsify_lora_target_selection_v1_004_builds_one_adapter_per_layer_and_target (with the other falsify_lora_target_selection_v1_004 tests in that file and in crates/aprender-train/src/lora/target.rs)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_004"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_005
    description: "The CUDA NF4 path keeps its LoRA state by target (0.72 R15a C2c). At 02dd7dadd7 CudaNf4TransformerBlock held four adapter fields, lora_a_q, lora_b_q, lora_a_v and lora_b_v, and CudaLoraGradWorkspace, GpuLoraOptimizerState, both gradient clips and the classify pipeline's gradient accumulation named the same four tensors, so no other target could reach the device. Now each holds one A and one B per target, in slot order. A block takes q_proj and v_proj through new and any other target through add_lora_adapter, which refuses a target the block already has and an A or B whose length is not d_in·r or r·d_out for that projection (LoraTarget::dims, the shapes of target_slots). CudaLoraGradWorkspace::new_for_targets allocates a gradient pair per target and refuses targets out of slot order or repeated; new keeps q_proj, v_proj. A block's optimizer state holds m and v for each of its own adapters, and its step updates each adapter from the gradient pair of the same target; a block with adapters refuses, before it updates anything, a workspace or an optimizer state whose targets differ from its own. The clip norm sums every gradient pair in slot order, A before B, then the two norm gradients, so q_proj, v_proj adds the same six terms in the same order as before. init_lora_fused_clip takes at most nine buffers and otherwise returns None, so a workspace with four or more targets uses the unfused clip. Download and upload by target return and take every adapter; an upload checks every pair before it writes any, and refuses a target the block lacks or a length that does not match. The q/v four-tuple forms read and write the q_proj and v_proj pairs as before. Row 004's constructor check stays until cell C3 trains every target the forward reads, so a pipeline still builds only q_proj, v_proj. The CPU test checks LoraTarget::dims for all seven targets on the Qwen3-4B config, where q, kv, h and i all differ, so a swapped or shared shape cannot pass. The CUDA tests are #[ignore] and need a CUDA device; none has run yet. On an all_linear block they check 7 adapter pairs, 7 gradient pairs, and m and v for all 7, at the dims lengths; one optimizer step changing every element of every A and B, and a q_proj, v_proj workspace refused; the unfused clip scaling all 16 gradient buffers (14 LoRA tensors and the 2 norm gradients) by max_norm / (norm + 1e-6); and upload by target in reverse slot order, then download, returning all 7 pairs bit for bit. On a q_proj, v_proj block they check that an upload naming k_proj, or with a short A, is refused and changes nothing; that add_lora_adapter refuses a duplicate and a short A or B, leaves the targets as they were, and then adds k_proj in slot order; that new_for_targets refuses (v_proj, q_proj) and (q_proj, q_proj); and that the four-tuple download equals the by-target one. Planted: a workspace or an optimizer state holding only q_proj and v_proj, a clip that sums only those, an optimizer step that skips a target, dims with o_proj's d_out and d_in swapped, add_lora_adapter without its length check, and an upload that writes a pair before it has checked the rest must each be RED."
    test: "crates/aprender-train/src/lora/target.rs::falsify_lora_target_selection_v1_005_dims_are_the_projection_shapes (CPU) and the six falsify_lora_target_selection_v1_005 tests in crates/aprender-train/src/transformer/cuda_block_target_tests.rs (CUDA, #[ignore])"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_005 runs the CPU test. The CUDA tests have not run: on a CUDA host, build with cargo test -p aprender-train --features cuda --lib --no-run, then run that test binary with falsify_lora_target_selection_v1_005 --include-ignored under the GPU lock"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_006
    description: "A clipped NF4 backward is never captured without the fused clip (0.72 R15a C3b). The fused clip takes at most nine gradient buffers, so init_lora_fused_clip returns None for four or more targets. The syncing clip cannot run under graph capture, so until C3b a captured backward without the fused clip state skipped the clip: with backward graphs on and gradient_clip_norm set, every step from the capture on ran unclipped. Now backward_graph_allowed refuses the capture in that case, and the loop runs uncaptured with the syncing clip. The test checks the decision against a table of all eight combinations of graphs on, clip set and fused clip present. Planted: dropping either the clip term or the fused-clip term must turn it RED."
    test: "crates/aprender-train/src/finetune/instruct_pipeline/backward.rs::tests::falsify_lora_target_selection_v1_006_clipped_backward_needs_fused_clip_to_capture (no device)"
    evidence: "cargo test -p aprender-train --features cuda --lib falsify_lora_target_selection_v1_006"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_007
    description: "The instruct pipeline moves every selected adapter between its LoRA layers and its CUDA NF4 blocks (0.72 R15a C4a). At 5363d3579e upload_cuda_block gave CudaNf4TransformerBlock::new slots 2·layer and 2·layer+1 as the q_proj and v_proj adapters, and sync_lora_to_cpu wrote the q_proj and v_proj pair of download_lora_weights back to those two slots, whatever the targets. Row 004's constructor check keeps the pipeline at q_proj, v_proj, where those are the right slots; under all_linear, layer 0's block would have trained its k_proj adapter as v_proj, layer 1's block would have taken layer 0's v_proj and o_proj adapters, and no other k_proj, o_proj or MLP adapter would have reached a block. Now layer_adapters lists layer l's adapters in slot order as (target, A, B) in the device layout, from slot |T|·l + pos_T(target); upload_cuda_block gives the q_proj and v_proj ones to new and adds every other one with add_lora_adapter; and sync_lora_to_cpu downloads every adapter of each block by target (download_lora_adapters), and place_layer_adapters writes each into its own slot with B un-scaled. place_layer_adapters checks every downloaded adapter before it writes any: a target outside T, a slot past the LoRA layers, or an A or B whose length is not its slot's refuses the whole layer with an error that names it, and no slot changes. The tests build LoRA layers for two layers with distinct values in every slot and check that under all_linear layer 1's adapters are the seven targets in slot order, each the device layout of slot 7 + p; that under q_proj, v_proj layer l's adapters are slots 2l and 2l + 1 as q_proj and v_proj, the pair the old upload passed; that placing every layer's adapters, B scaled by a power of two, into zeroed layers gives back every slot bit for bit; and that a k_proj adapter under q_proj, v_proj, and a v_proj A one element short after a valid q_proj pair, each refuse, name the offender and change no slot. Row 004's check stays until the CPU forward, the checkpoint names and the pre-warmed LoRA shapes follow T. Planted: layer_adapters taking slot 2·l + position, or only q_proj and v_proj, and place_layer_adapters writing to slot 2·l + position, writing before it has checked every adapter, or not un-scaling B must each be RED."
    test: "crates/aprender-train/src/finetune/instruct_pipeline/device_targets.rs::falsify_lora_target_selection_v1_007_layer_adapters_are_every_target_in_slot_order (with the other falsify_lora_target_selection_v1_007 tests in that file; no device)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_007"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_008
    description: "The CPU forward of the instruct pipeline applies every selected adapter (0.72 R15a C4b). At 6da2fa62a6 Transformer::forward_hidden_with_lora read slot 2·layer as the q_proj adapter and slot 2·layer+1 as the v_proj adapter, and MultiHeadAttention::forward_with_lora took only those two, whatever the targets. Row 004's constructor check keeps the pipeline at q_proj, v_proj, where those are the right slots; under all_linear, layer 0 would have trained its k_proj adapter as v_proj, every later layer would have read another layer's adapters, and no k_proj, o_proj or MLP adapter would have changed an output or received a gradient. Now Transformer::forward_hidden_with_targets reads each adapter of layer l from slot |T|·l + pos_T(target), and the attention and the SwiGLU feed-forward add each adapter's delta where its projection's output is formed: q_proj and k_proj before the bias, QK-norm and RoPE, v_proj before the bias, gate_proj and up_proj before SwiGLU, and o_proj and down_proj before the residual add, o_proj on the heads' concatenation. The instruct pipeline's CPU training step, evaluation and generation call it with the pipeline's targets; forward_hidden_with_lora keeps the q_proj, v_proj layout for its other callers. The tests build a two-layer model without QK-norm weights and LoRA layers for all_linear with distinct values. For each of the 14 adapters, the forward with only that adapter's B nonzero differs from the plain forward and equals, within 1e-4, the plain forward of the model with that projection's weight replaced by W + scale·B·A. Under q_proj, v_proj the forward equals forward_hidden_with_lora bit for bit. A backward from a scalar loss of the hidden states, with every A and B nonzero, gives A and B of all 14 adapters a nonzero gradient. Row 004's check stays until the checkpoint names, the pre-warmed LoRA shapes, from_pretrained and apr finetune follow T. Planted: reading slot 2·l + position, skipping a target, adding the k_proj delta after RoPE, adding the o_proj delta to the attention's input instead of the heads' concatenation, and adding the gate_proj delta after SwiGLU must each be RED."
    test: "crates/aprender-train/src/finetune/instruct_pipeline/cpu_targets_tests.rs::falsify_lora_target_selection_v1_008_each_adapter_equals_its_merged_weight (with falsify_lora_target_selection_v1_008_default_targets_are_the_old_forward and falsify_lora_target_selection_v1_008_backward_reaches_every_adapter in that file; no device)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_008"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_009
    description: "TransformerTrainer trains the adapter its forward applies (0.72 R15a C4c). At ead8023ce1 TransformerTrainer::build pushed one adapter per layer for each selected name in the order q, k, v, o, gate, up, down, so layer l's adapters sat at |T|·l + pos_T(t), but forward_single called Transformer::forward_with_lora, which reads slot 2·l as q_proj and 2·l + 1 as v_proj. Only under q_proj, v_proj do the two agree. With q_proj alone, layer 0's V took layer 1's q_proj adapter; under all_linear, layer 0's V took its k_proj adapter, layer 1 read layer 0's v_proj and o_proj adapters as q_proj and v_proj, and no k_proj, o_proj or MLP adapter changed the output or got a gradient, while save_lora_adapter wrote every adapter under its own name. Now build makes T from lora_target_modules (shorthands expanded; names that are not one of the seven projections are skipped, as before), builds one adapter per layer and target at slot |T|·l + pos_T(t) with that projection's shape and base weight, and forward_single calls forward_with_targets with T. The tests build trainers on a two-layer model with one KV head, so q_proj, k_proj, o_proj and down_proj are not square, and set every A and B to distinct values. Under all_linear, q_proj alone, and k_proj with down_proj, the trainer's targets are the parsed names, it has |T|·L slots, and each slot has its target's shape; for each slot, forward_single's logits with only that adapter's B nonzero differ from the plain forward and equal, within 1e-4, the plain forward with that projection's weight replaced by W + scale·B·A, where the test takes the layer and target of slot s as s / |T| and T[s mod |T|]. Under q_proj, v_proj forward_single's logits equal forward_with_lora bit for bit. Under all_linear, a backward from forward_single's loss gives A and B of all 14 adapters a nonzero gradient, and one train_batch with a nonzero learning rate changes every B. Planted: forward_single calling forward_with_lora again, build pushing a layer's targets in reverse order, build skipping down_proj, and the targets ignoring lora_target_modules must each be RED."
    test: "crates/aprender-train/src/train/transformer_trainer/target_tests.rs::falsify_lora_target_selection_v1_009_forward_reads_the_slots_build_made (with the other falsify_lora_target_selection_v1_009 tests in that file; no device)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_009"
  - id: FALSIFY-LORA_TARGET_SELECTION_V1_010
    description: "The CUDA trainer checkpoints every adapter a block holds by its target (0.72 R15a C5a). At 35b92cfc27 its APR save, its resume and its PEFT adapter save went through download_lora_weights / upload_lora_weights and target_qv_projections, so they wrote and read only lora.{l}.q_proj and lora.{l}.v_proj and transposed with the q and v dims. A block holding k, o or MLP adapters lost them on save and resume. Now the snapshot is download_lora_adapters, the APR save writes lora.{l}.{module}.lora_{a,b} for each (target, A, σB), resume reads back the targets the block holds (lora_targets) and calls upload_lora_adapters, and the PEFT save converts each adapter with its target's (d_out, d_in) under model.layers.{l}.self_attn|mlp.{module}, the CPU trainer's paths, with target_modules the held targets. Falsified if a q/v name, shape or value differs from the pre-C5a one, if any target's APR names, PEFT path, PEFT dims or layout is wrong, if an APR write and read loses or misplaces any of the 7 targets, or if a pre-C5a q/v checkpoint no longer restores q and v. Planted mutants that must be RED: a name with the wrong module, the PEFT conversion with the q dims for every target, B left scaled, resume reading only q and v."
    test: "crates/aprender-train/src/train/transformer_trainer/lora_checkpoint_tests.rs::falsify_lora_target_selection_v1_010_apr_round_trip_every_target (with the other falsify_lora_target_selection_v1_010 tests there; no device)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_010"
  - id: FALSIFY-LORA_TARGET_SELECTION_V1_011
    description: "The CUDA trainer builds its NF4 blocks with one adapter per selected target (0.72 R15a C5b). At 7449d608a7 upload_blocks gave every NF4 block a q_proj and a v_proj adapter through CudaNf4TransformerBlock::new and nothing else, and with_model built the shared LoRA scratch and gradient workspace for q_proj, v_proj, whatever lora_target_modules said. The CPU trainer (C4c) and the checkpoint (C5a) already follow the targets, so a CUDA run asked for all_linear trained and saved q and v only. Now T comes from lora_target_modules as in the CPU trainer (trainer_targets), nf4_init_adapters builds each block's adapters in slot order with A_t[j] = sin((j + φ(l, t))·0.1)·0.01 and B_t = 0 at the target's dims, q_proj and v_proj go to new and every other target to add_lora_adapter, and the scratch and the gradient workspace are built by new_for_targets with T. The optimizer state already follows the adapters a block holds. Falsified if a q_proj or v_proj A or B differs by one bit from the pre-C5b init, if a target's A or B has the wrong length or B is not zero, if two adapters of one block or of two layers get the same A, if the adapters are not in T's order, if a target outside T is built, if new is not given exactly the q_proj and v_proj adapters T holds, or if the default, all_linear, a shorthand and unknown names do not give the CPU trainer's T. Planted mutants that must be RED: v_proj with q_proj's phase, every other target with q_proj's phase, A built with d_out for d_in, the adapters always q_proj and v_proj, and add_lora_adapter also given q_proj. The NF4 block calls themselves need a CUDA device and are covered by the #[ignore] tests of row 005."
    test: "crates/aprender-train/src/train/transformer_trainer/lora_init_tests.rs::falsify_lora_target_selection_v1_011_qv_init_is_the_old_init (with the other falsify_lora_target_selection_v1_011 tests there; no device)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_011"
  - id: FALSIFY-LORA_TARGET_SELECTION_V1_012
    description: "The backward GEMM cache key and its kernel dims come from one function, and the CUDA trainer pre-warms the LoRA backward GEMMs of every selected target (0.72 R15a C6). At 96e2f7b2a1 the runtime (cuda_backward/gemm.rs) built GemmBackward{A,B}Kernel::tiled_unrolled(m, n, k) under key gemm_backward_{a,b}_{m}_{k}_{n} and took a cached module first, while pre_warm_lora_backward_kernels compiled tiled_unrolled(m, k, n) under that same key. The kernel bakes its dims into the PTX, so on the PTX path (no cuBLAS handle) every pre-warmed shape with k != n ran with n and k swapped: the LoRA q_proj and v_proj shapes and the fp32 attention and FFN shapes. And the trainer pre-warmed only the q_proj and v_proj LoRA shapes, whatever lora_target_modules said. Now cuda_backward_keys::gemm_backward_a and gemm_backward_b give the key and the (m, n, k) together, the runtime and the pre-warm both build from them, lora_backward_gemms gives the four GEMMs of each target at its dims, and the trainer pre-warms them for T. Falsified if a key and its kernel dims disagree with the runtime's (m, n, k) for that key, if a target's four GEMMs are missing or at the wrong dims, if the set repeats a key or holds a key no target in T asks for, if T = (q_proj, v_proj) does not give the six keys warmed before, or if the dims the trainer passes are not those of its targets. Planted mutants that must be RED: the kernel built with (m, k, n), the d_in GEMMs dropped, d_out used for d_in, and the trainer passing q_proj and v_proj dims whatever T is. Compiling and running a kernel needs a CUDA device; these tests check the keys and dims the device code builds from."
    test: "crates/aprender-train/src/autograd/cuda_backward_keys/tests.rs::falsify_lora_target_selection_v1_012_key_and_kernel_dims_agree (with the other falsify_lora_target_selection_v1_012 tests there and in transformer_trainer/lora_init_tests.rs; no device)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_012"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_013
    description: "The CUDA trainer pre-warms the AdamW step kernel at every parameter count its NF4 LoRA optimizer step asks for (0.72 R15a C7). At 352a3ec700 the trainer never called a pre-warm of the optim kernel cache, so adamw_step_cuda compiled adamw_step_{n} on its first miss, inside the first optimizer step, for every adapter size and the norm size: the on-demand JIT during active GPU work that C-PREWARM-001 forbids (trueno#200). Since C5b the adapter sizes follow lora_target_modules. Now lora_adamw_sizes gives every count lora_optimizer_step asks for, by target, and the trainer pre-warms them through cuda_optim::pre_warm_adamw_sizes. Falsified if a selected target's A or B count is missing or wrong, if the hidden (norm) count is missing, if the list repeats a count or is unsorted, if T = (q_proj, v_proj) does not give {hidden·r, r·q_dim, r·kv_dim, hidden}, or if the sizes ignore the selected targets. Planted mutants that must be RED: A counted as d_out·r, B dropped, the norm count dropped, and the targets always q_proj and v_proj. Compiling the kernel needs a CUDA device; these tests check the counts the device code builds from."
    test: "crates/aprender-train/src/train/transformer_trainer/lora_init_tests.rs::falsify_lora_target_selection_v1_013_adamw_sizes_are_the_optimizer_steps (with the other falsify_lora_target_selection_v1_013 tests there)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_013"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_014
    description: "InstructPipeline::from_pretrained loads a trained adapter only when the adapter fills every LoRA slot, A and B (0.72 R15a C8). At f022ec643b inject_adapter_weights refused a tensor it could not place, but it never checked that every slot was filled: an adapter with no v_proj tensors, with fewer layers than the model, or with only lora_A loaded without error, and every slot it left kept its fresh init (A random, B zero), so the model served and trained on was not the adapter that was trained. Now a place left unfilled refuses the whole load and names it, and no LoRA layer changes. Falsified if an adapter missing a target, a layer, or the B of one slot loads, if the error does not name the unfilled place, if any layer changes on a refusal, or if a full adapter (q/v, or all seven targets) no longer loads."
    test: "crates/aprender-train/src/finetune/instruct_pipeline/constructors_adapter_tests.rs::falsify_lora_target_selection_v1_014_partial_adapter_refuses_and_changes_nothing (with the other falsify_lora_target_selection_v1_014 tests there)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_014"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_015
    description: "InstructPipeline::from_pretrained refuses an adapter that is present but unreadable, and an adapter trained on other targets (0.72 R15a C9). At 4a1fbb1fb0 a failed load_adapter_peft only printed a warning, and from_pretrained went on with fresh LoRA weights (A random, B zero): a corrupt or half-written adapter silently served an untrained model. The PEFT config was discarded, so a target mismatch surfaced only indirectly, as an unplaced tensor (row 003) or an unfilled place (row 014), never naming the targets. Now an unreadable adapter refuses with its path and cause, and a declared set D ≠ lora_targets refuses with both sets before any tensor is placed. Falsified if an unreadable adapter loads or warns and goes on, if a superset, subset or disjoint D loads, if the error does not name both sets, if any layer changes on a refusal, or if a matching or undeclared adapter, or no adapter at all, stops loading as before."
    test: "crates/aprender-train/src/finetune/instruct_pipeline/constructors_adapter_tests.rs::falsify_lora_target_selection_v1_015_declared_targets_must_match (with the other falsify_lora_target_selection_v1_015 tests there)"
    evidence: "cargo test -p aprender-train --lib falsify_lora_target_selection_v1_015"

  - id: FALSIFY-LORA_TARGET_SELECTION_V1_016
    description: "apr finetune --lora-targets reaches InstructConfig.lora_targets or refuses (0.72 R15a C10). At 4384351118 apr finetune had no way to select targets: build_instruct_config took ..InstructConfig::default(), so every run trained q_proj and v_proj, and no flag existed to say otherwise. Now the flag is parsed before anything loads, its set reaches lora_targets on the training path, and every mode that would not train with it refuses it. Falsified if an absent flag changes the default, if a parsed set differs from LoraTargets::parse of the same names, if an unknown or empty name list is accepted, if build_instruct_config drops the set, or if --merge, --task classify, --task instruct, --adapters, --plan, the wgpu backend (an explicit --gpu-backend wgpu before anything loads, or auto choosing it) or a build without training accepts the flag."
    test: "crates/apr-cli/src/commands/finetune_tests.rs::falsify_lora_target_selection_v1_016_flag_reaches_instruct_config (with the other falsify_lora_target_selection_v1_016 tests there)"
    evidence: "cargo test -p apr-cli --lib falsify_lora_target_selection_v1_016"
