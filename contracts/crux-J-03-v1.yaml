# CRUX-J-03 — OpenCLAW per-channel allowFrom sender allowlist
# Resolved 2026-04-18: category J competitor = openclaw.ai.

metadata:
  id: CRUX-J-03
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "J — OpenCLAW Agent Orchestration"
  competitor: openclaw
  demand_score: 4
  intake_status: missing
  description: >
    OpenCLAW treats every inbound channel (WhatsApp / Telegram / Discord /
    Slack / Signal / iMessage) as hostile-by-default and requires an explicit
    `allowFrom: [...]` allowlist per channel before the agent will act on
    sender messages. Aprender parity: any `apr code`-adjacent inbound
    surface MUST ship deny-by-default with a documented allowlist
    mechanism. Overlaps with apr hooks allowlist (PMAT-CODE-HOOKS-001).
  openclaw_interpretation: openclaw-agent-resolved

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5.J'
  - https://openclaw.ai/
  - evidence/crux/openclaw/config-schema.json5
  - evidence/crux/openclaw/gaps.md

equations:
  allowfrom_gate:
    formula: |
      accept(channel, sender, msg) :=
        (sender ∈ channels[channel].allowFrom) AND channel.enabled
      default:  channels[*].allowFrom = ∅   (deny by default)
      reject_emits_audit_line: ∀ rejected msg → audit.log has entry
    domain: (channel_id, sender_id, msg)
    codomain: "{accept, reject} with audit trail"
    invariants:
    - "empty allowFrom rejects every sender"
    - "unlisted channel rejects every sender"
    - "rejection is observable via audit trail (never silent)"

falsification_tests:
- id: FALSIFY-CRUX-J-03-001
  rule: deny-by-default allowlist concept exists in apr
  prediction: "apr docs/code reference an allowlist or deny-by-default gate for inbound messages"
  test: |
    set -euo pipefail
    command -v apr >/dev/null || { echo "SKIP: apr not on PATH" >&2; exit 77; }
    if command -v pmat >/dev/null 2>&1; then
      pmat query "allowlist OR allowFrom OR deny-by-default inbound" --limit 1 --format json | grep -q '"matches"' || {
        echo "FAIL: no deny-by-default inbound gate documented" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-03 parity broken — apr MUST document a deny-by-default inbound allowlist
- id: FALSIFY-CRUX-J-03-002
  rule: hooks allowlist is the apr-side analogue
  prediction: "hooks configuration expresses per-event allowlist semantics"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "hooks allow OR hook command allowlist" --limit 1 --format json | grep -q '"matches"' || {
        echo "FAIL: apr hooks do not express an allowlist" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-03 hooks invariant — apr hooks must express per-event allowlist semantics

proof_obligations:
- type: invariant
  property: "deny-by-default on empty allowFrom"
- type: invariant
  property: "rejection produces audit trail"

verification_summary:
  total_obligations: 2
  proven: 0
  tested: 0
  status: draft

pmat_work_tracking:
  ticket_tag: crux-crux-j-03
  priority: high
  auto_created: true
