    requires_model: false
    side_effects: []

  - name: tool-use-lint
    category: inspection
    description: "Lint a captured OpenAI tool-use response (CRUX-C-11)"
    requires_model: false
    side_effects: []

  - name: gbnf-lint
    category: inspection
    description: "Lint a GBNF grammar-constrained observation (CRUX-C-10)"
    requires_model: false
    side_effects: []

  - name: typical-p-lint
    category: inspection
    description: "Lint a captured typical-p sampling observation (CRUX-C-22)"
    requires_model: false
    side_effects: []

  - name: registry-quota-lint
    category: inspection
    description: "Lint a captured registry byte-quota observation (CRUX-A-22)"
    requires_model: false
    side_effects: []

  - name: imatrix-lint
    category: inspection
    description: "Lint a captured imatrix calibration observation (CRUX-B-07)"
    requires_model: false
    side_effects: []

  - name: gptq-lint
    category: inspection
    description: "Lint a captured GPTQ compression/cosine/flags observation (CRUX-B-09)"
    requires_model: false
    side_effects: []

  - name: embeddings-lint
    category: inspection
    description: "Lint a captured /v1/embeddings observation (CRUX-C-13)"
    requires_model: false
    side_effects: []

  - name: unified-search-lint
    category: inspection
    description: "Lint a captured Hub+local unified-search merge observation (CRUX-A-23)"
    requires_model: false
    side_effects: []

  - name: rm-gc-lint
    category: inspection
    description: "Lint a captured `apr rm` / externally captured gc blob-GC observation (CRUX-A-25)"
    requires_model: false
    side_effects: []

  - name: shared-cache-lint
    category: inspection
    description: "Lint a captured APR_MODELS shared-cache observation (CRUX-A-21)"
    requires_model: false
    side_effects: []

  - name: ppl
    category: inspection
    description: "Perplexity classifier (CRUX-E-02): PPL = exp(-mean(log p))"
    requires_model: false
    side_effects: []

  - name: quant-preservation-lint
    category: inspection
    description: "Validate dequant→requant metadata preservation (CRUX-B-19): general.* + tokenizer.* must be byte-equal modulo {quantization_version, file_type}"
    requires_model: false
    side_effects: []

  - name: prometheus-lint
    category: inspection
    description: "Validate captured Prometheus /metrics body (CRUX-K-07): 0.0.4 text-format parse + optional Content-Type + optional K-07 required-metric set"
    requires_model: false
    side_effects: []

  - name: otlp-lint
    category: inspection
    description: "Validate captured OTLP/JSON ExportTraceServiceRequest (CRUX-K-08): apr.inference span present + gen_ai.*/apr.tokens.* attributes + W3C trace-context propagation"
    requires_model: false
    side_effects: []

  - name: kv-timeline-lint
    category: inspection
    description: "Validate captured KV-cache utilization timeline (CRUX-F-06): schema + block conservation + used_pct arithmetic + peak consistency + preemption-threshold trigger"
    requires_model: false
    side_effects: []

  - name: gpu-memtrace-lint
    category: inspection
    description: "Validate captured GPU memory Chrome Trace JSON (CRUX-F-07): schema + alloc/free pairing by addr + per-(pid,tid) monotonic timestamps"
    requires_model: false
    side_effects: []

  - name: explain-token-lint
    category: inspection
    description: "Validate an externally captured token-selection JSONL sampler-chain trace (CRUX-F-19; no apr producer yet): schema + Σ post_prob ≈ 1 + sampled_id present in candidates + optional greedy=argmax assertion"
    requires_model: false
    side_effects: []

  - name: check-finite-lint
    category: inspection
    description: "Validate externally captured check-finite outputs (CRUX-F-11; no apr producer yet): error JSON shape (6 keys + value ∈ {nan,+inf,-inf}) + layer-coverage list (min_layers + transformer-op prefixes)"
    requires_model: false
    side_effects: []

  - name: attn-viz-lint
    category: inspection
    description: "Validate an externally captured attention dump (CRUX-F-17; no apr producer yet): 4-D attention dump row-softmax normalization + causal-mask zero + HTML heatmap count"
    requires_model: false
    side_effects: []

  - name: embed-viz-lint
    category: inspection
    description: "Validate an externally captured embedding-projection CSV (CRUX-F-18; no apr producer yet): schema (4 columns + finite coords + non-negative token_id) + optional row-count=vocab_size + optional byte-identical determinism check"
    requires_model: false
    side_effects: []

  - name: nccl-diag-lint
    category: inspection
    description: "Validate captured NCCL failure-diagnostics JSON (CRUX-F-15): 6 required keys (host, rank, nccl_version, last_op, code, suggest) + optional exit-code >= 128 + optional nvidia.com doc-link in suggest"
    requires_model: false
    side_effects: []

  - name: react-trace-lint
    category: inspection
    description: "Validate an externally captured ReAct loop trace (CRUX-I-06; no apr producer yet): termination reason matches exit-code (final_answer=0, max_iterations|timeout=2, tool_error=3, parse_fail=4) + iteration bound + scratchpad grammar (Thought/Action/Observation/Final Answer)"
    requires_model: false
    side_effects: []

  - name: hang-trace-lint
    category: inspection
    description: "Validate captured `$APR_TRACE_DIR` after a hang/timeout (CRUX-F-14): per-rank rank{N}.py.txt files (world_size + non-empty) OR empty-on-success + exit-code 124/1/0 distinction"
    requires_model: false
    side_effects: []

  - name: ddp-metrics-lint
    category: inspection
    description: "Validate two externally captured DDP metrics JSONs, N=1 and N=k (CRUX-D-11; no apr producer yet): scaling efficiency T_N/(N*T_1) >= 0.85 + loss parity |L_N - L_1|/L_1 <= 0.01 + per-step allreduce bandwidth > 0"
    requires_model: false
    side_effects: []

  - name: audio-inspect-lint
    category: inspection
    description: "Validate an externally captured audio-inspect JSON body (CRUX-H-13; no apr producer yet): amplitude bounds (finite + [-1,1]) + sample_rate (canonical set or expected) + channel_shape (positive + optional channel-count match)"
    requires_model: false
    side_effects: []

  - name: attn-parity-lint
    category: inspection
    description: "Validate captured flash-attn2 parity + provenance JSON outputs (CRUX-L-02): max_abs_diff <= 5e-3, cosine_sim >= 0.9999, kernel_source matches hf-kernels-community:flash-attn2@<40-hex>, fallback reason present when not flash2, head_dim error names the rejection"
    requires_model: false
    side_effects: []

  - name: rerank
    category: inference
    description: "Score a (query, passage) pair with a BERT cross-encoder loaded from an APR file (GH-326 Phase 3 + 3b). Two input modes: (1) pre-tokenised `--input-ids` + `--token-type-ids` u32 lists; (2) Phase 3b text mode — `--query` + `--passage` + `--vocab <vocab.txt>` invokes in-process WordPiece tokenisation that builds `[CLS] query [SEP] passage [SEP]` with `token_type_ids = 0` for the query side and `1` for the passage side. Emits sigmoid-mapped relevance ∈ [0,1] by default or `--raw-logit` for the raw classifier logit. Supports `--json` output."
    requires_model: true
    side_effects: []

  - name: embed
    category: inference
    description: "Produce sentence embeddings from a BERT bi-encoder loaded from an APR file (GH-326 Phase 6). Loads encoder-only `BertModel` checkpoints (e.g. `sentence-transformers/all-MiniLM-L6-v2`), tokenises text with WordPiece, runs the encoder forward, then pools hidden states with `--pool cls` ([CLS] hidden state) or `--pool mean` (mean of token positions; sentence-transformers default). Optionally L2-normalises (`--normalize`, default true). Repeatable `--text` for batch encoding. Outputs `{ text, embedding: [f32; hidden_dim], dim }` per input."
    requires_model: true
    side_effects: []

  - name: shard
    category: model_ops
    description: "Split safetensors file into shards + weight-map index (CRUX-B-05)"
    requires_model: true
