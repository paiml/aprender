  # ── Consolidated sibling CLIs (APR-MONO) ──
  # Each was reachable ONLY from its own binary; the command enum lived in a
  # main.rs, importable by nothing. apr now calls the SAME dispatch fn.

  - name: rag
    category: pipeline
    description: "RAG pipeline: index, query, transcribe (was the trueno-rag binary)"
    requires_model: false
    side_effects: [filesystem]
    subcommands: [demo, extract-frames, index, info, query, transcribe]

