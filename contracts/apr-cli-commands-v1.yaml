metadata:
  version: 1.1.0
  created: '2026-04-06'
  author: PAIML Engineering
  registry: true
  references:
  - 'POSIX.1-2017 Section 12 — Utility Conventions'
  description: >
    |

# APR CLI Commands Provable Contract
#
# Every `apr` subcommand MUST satisfy this contract.
# Enforcement: tests/apr_cli_commands.rs
#
# FALSIFY-CLI-001: If any command listed here does not respond to --help
# FALSIFY-CLI-002: If any command not listed here appears in `apr --help`
# FALSIFY-CLI-003: If any command exits with code other than 0/1/2
# FALSIFY-CLI-004: If any command panics on --help

name: apr-cli-commands
version: "1.1.0"
scope: |
  All apr CLI subcommands. The authoritative list is this file's own
  `commands:` block; it is mirrored by
  crates/apr-cli/tests/cli_commands.rs::registered_commands and checked
  against `apr --help` by FALSIFY-CLI-005.

  Deliberately no hand-maintained total here. There was one, and it read
  "77 commands" followed by a prose changelog of every addition since --
  while the list below held 111. A count inside the contract that certifies
  counts, drifting 34 behind its own data, with no guard watching it: a
  fourth copy of a number three other places already agree on.

  To get the number, parse the list. Note `grep -c '^  - name:'` is WRONG
  -- it returns 117 because other same-indent `name:` keys exist in this
  file. Parse the YAML.
binary: "apr"
install: "cargo install aprender"

description: |
  Provable contract covering every `apr` subcommand. Each command must:
  1. Respond to `--help` with exit code 0
  2. Have a description (non-empty about text)
  3. Produce exit code 0 (success), 1 (runtime error), or 2 (usage error)
  4. Never panic on --help or missing required args

# ── Command Registry ──
# This is the SINGLE SOURCE OF TRUTH for all apr subcommands.
# If a command exists in `apr --help` but not here, FALSIFY-CLI-002 fires.
# If a command is listed here but not in `apr --help`, FALSIFY-CLI-001 fires.

commands:
  # ── Core Inference ──
  - name: run
    category: inference
    description: "Run model directly (auto-download, cache, execute)"
    requires_model: true
    side_effects: [network, filesystem]

  - name: serve
    category: inference
    description: "Inference server (plan/run)"
    requires_model: true
    side_effects: [network, filesystem]
    subcommands: [plan, run]

  - name: chat
    category: inference
    description: "Interactive chat with language model"
    requires_model: true
    side_effects: [network, filesystem]

  - name: code
    category: inference
    description: "Sovereign AI coding assistant"
    requires_model: true
    side_effects: [network, filesystem]

  # ── Model Inspection (read-only, no side effects) ──
  - name: inspect
    category: inspection
    description: "Inspect model metadata, vocab, and structure"
    requires_model: true
    side_effects: []

  - name: debug
    category: inspection
    description: "Simple debugging output"
    requires_model: true
    side_effects: []
    subcommands: [embed-viz]

  - name: validate
    category: inspection
    description: "Validate model integrity and quality"
    requires_model: true
    side_effects: []

  - name: validate-manifest
    category: inspection
    description: "Verify publish manifest (F-PUBLISH-MANIFEST-001): FALSIFY-PM-001..006"
    requires_model: false
    side_effects: []

  - name: lint
    category: inspection
    description: "Check for best practices and conventions"
    requires_model: true
    side_effects: []

  - name: beat-run
    category: inspection
    description: "Evaluate a BeatBenchmark contract against a measured value (PMAT-741)"
    requires_model: false
    side_effects: []

  - name: manifest
    category: model_ops
    description: "Emit SHA-256 manifest of input files (CRUX-G-05)"
    requires_model: false
    side_effects: [filesystem]

  - name: explain
    category: inspection
    description: "Explain errors, architecture, tensors, and kernel dispatch"
    requires_model: false
    side_effects: []

  - name: tensors
    category: inspection
    description: "List tensor names and shapes"
    requires_model: true
    side_effects: []

  # aprender#2377 finding 3: the producers `*-lint` help documents.
  # See contracts/apr-lint-producers-v1.yaml.
  - name: dataset
    category: inspection
    description: "Dataset inspection tools (audio-inspect)"
    requires_model: false
    side_effects: []
    subcommands: [audio-inspect]

  - name: kernel
    category: analysis
    description: "Kernel-level parity measurements (parity)"
    requires_model: false
    side_effects: []
    subcommands: [parity]

  - name: trace
    category: inspection
    description: "Layer-by-layer trace analysis"
    requires_model: true
    side_effects: []

  - name: diff
    category: inspection
    description: "Compare two models; --quant-roundtrip surfaces per-tensor quant error (CRUX-B-20)"
    requires_model: true
    side_effects: []

  - name: hex
    category: inspection
    description: "Format-aware binary forensics"
    requires_model: true
    side_effects: []

  - name: tree
    category: inspection
    description: "Model architecture tree view"
    requires_model: true
    side_effects: []

  - name: flow
    category: inspection
    description: "Data flow visualization"
    requires_model: true
    side_effects: []

  # ── Model Operations (transforms, creates files) ──
  - name: export
    category: model_ops
    description: "Export model to other formats"
    requires_model: true
    side_effects: [filesystem]

  - name: import
    category: model_ops
    description: "Import from external formats"
    requires_model: false
    side_effects: [network, filesystem]

  - name: convert
    category: model_ops
    description: "Convert/optimize model"
    requires_model: true
    side_effects: [filesystem]

  - name: stamp
    category: model_ops
    description: "Stamp provenance fields (license, data_source, data_license) onto an existing .apr file"
    requires_model: true
    side_effects: [filesystem]

  - name: compile
    category: model_ops
    description: "Compile model into standalone executable"
    requires_model: true
    side_effects: [filesystem]

  - name: merge
    category: model_ops
    description: "Merge multiple models"
    requires_model: true
    side_effects: [filesystem]

  - name: quantize
    category: model_ops
    description: "Quantize model weights"
    requires_model: true
    side_effects: [filesystem]

  - name: rosetta
    category: model_ops
    description: "Rosetta Stone - Universal model format converter"
    requires_model: true
    side_effects: [filesystem]

  # ── Model Registry ──
    subcommands: [chain, compare-inference, convert, diff-tensors, fingerprint, inspect, validate-stats, verify]

  - name: pull
    category: registry
    description: "Download and cache model from HuggingFace"
    requires_model: false
    side_effects: [network, filesystem]

  - name: list
    category: registry
    description: "List cached models"
    requires_model: false
    side_effects: []

  - name: rm
    category: registry
    description: "Remove model from cache"
    requires_model: false
    side_effects: [filesystem]

  - name: registry
    category: registry
    description: "Registry operations (CRUX-A-01): inspect alias map, etc."
    requires_model: false
    side_effects: []
    subcommands: [aliases]

  - name: publish
    category: registry
    description: "Publish model to HuggingFace Hub"
    requires_model: true
    side_effects: [network]

  # ── Training ──
  - name: finetune
    category: training
    description: "Fine-tune model with LoRA/QLoRA"
    requires_model: true
    side_effects: [filesystem, gpu]

  - name: prune
    category: training
    description: "Prune model (structured/unstructured)"
    requires_model: true
    side_effects: [filesystem]

  - name: distill
    category: training
    description: "Knowledge distillation (teacher -> student)"
    requires_model: true
    side_effects: [filesystem, gpu]

  - name: train
    category: training
    description: "Training pipeline (plan/apply)"
    requires_model: false
    side_effects: [filesystem, gpu]
    subcommands: [apply, archive, cluster-status, halving, plan, submit, sweep, watch]

  - name: pretrain
    category: training
    description: "Pretrain small language models from scratch (MODEL-2 loop)"
    requires_model: false
    side_effects: [filesystem, gpu]

  - name: tokenize
    category: training
    description: "Tokenizer training pipeline (plan/apply)"
    requires_model: false
    side_effects: [filesystem]
    subcommands: [apply, encode-corpus, import-hf, plan, repair-manifest, train]

  - name: tune
    category: training
    description: "ML tuning: LoRA/QLoRA configuration, memory planning"
    requires_model: true
    side_effects: [filesystem]

  # ── Evaluation & QA ──
  - name: bench
    category: evaluation
    description: "Benchmark throughput"
    requires_model: true
    side_effects: []

  - name: eval
    category: evaluation
    description: "Evaluate model perplexity or classification metrics"
    requires_model: true
    side_effects: []

  - name: check
    category: evaluation
    description: "Model self-test: 10-stage pipeline integrity check"
    requires_model: true
    side_effects: []

  - name: qa
    category: evaluation
    description: "Falsifiable QA checklist for model releases"
    requires_model: true
    side_effects: []

  - name: qualify
    category: evaluation
    description: "Cross-subcommand smoke test"
    requires_model: true
    side_effects: []

  - name: canary
    category: evaluation
    description: "Manage canary tests for regression"
    requires_model: false
    side_effects: [filesystem]
    subcommands: [check, create]

  - name: compare-hf
    category: evaluation
    description: "Compare APR model against HuggingFace source"
    requires_model: true
    side_effects: [network]

  - name: parity
    category: evaluation
    description: "GPU/CPU parity check"
    requires_model: true
    side_effects: [gpu]

  # ── GPU & Profiling ──
  - name: gpu
    category: hardware
    description: "GPU status and VRAM reservation management"
    requires_model: false
    side_effects: [gpu]

  - name: devices
    category: hardware
    description: "Backend discovery: probe, enumerate, print (PP-066 R-0)"
    requires_model: false
    side_effects: []

  - name: devices
    category: hardware
    description: "Backend discovery: probe, enumerate, print (PP-066 R-0)"
    requires_model: false
    side_effects: []

  - name: profile
    category: hardware
    description: "Deep profiling with Roofline analysis"
    requires_model: true
    side_effects: []

  - name: ptx
    category: hardware
    description: "PTX analysis and bug detection"
    requires_model: false
    side_effects: []

  - name: ptx-map
    category: hardware
    description: "Model-to-PTX source mapping"
    requires_model: true
    side_effects: []

  - name: cbtop
    category: hardware
    description: "ComputeBrick pipeline monitor"
    requires_model: false
    side_effects: []

  # ── Data & Pipeline ──
  - name: data
    category: data
    description: "Data quality pipeline"
    requires_model: false
    side_effects: [filesystem]
    subcommands: [audit, balance, decontaminate, dedup, split, x]

  - name: pipeline
    category: data
    description: "Pipeline orchestration (plan/apply/status)"
    requires_model: false
    side_effects: [filesystem]

  # ── TUI & Monitoring ──
    subcommands: [apply, plan, status, validate]

  - name: tui
    category: ui
    description: "Interactive terminal UI"
    requires_model: false
    side_effects: []

  - name: monitor
    category: ui
    description: "Attach live TUI to a running training session"
    requires_model: false
    side_effects: []

  - name: runs
    category: ui
    description: "List, show, and compare training experiment runs"
    requires_model: false
    side_effects: []
    subcommands: [diff, ls, show]

  - name: experiment
    category: ui
    description: "Interactive experiment browser"
    requires_model: false
    side_effects: []

  # ── Miscellaneous ──
    subcommands: [view]

  - name: showcase
    category: misc
    description: "Qwen2.5-Coder showcase demo"
    requires_model: true
    side_effects: [network, filesystem]

  - name: modelfile
    category: misc
    description: |
      CRUX-K-11: parse Ollama-style Modelfile DSL into apr config JSON.
    requires_model: false
    side_effects: []
    # parse — parse a Modelfile and emit config as JSON or human-readable text
    subcommands: [parse]

  - name: test
    category: misc
    aliases: [probar]
    description: |
      Test harness for web, LLM, media and replay — powered by probador.

      Renamed from `probar` (Spanish "to try"), which named the VERB and so told
      a reader nothing about the subject. Follows the `apr data` precedent: a
      plain noun for the user-facing command, the Spanish name kept for the
      engine and credited in the description. `apr probar` remains as a HIDDEN
      alias so existing scripts keep working.

      Subcommands group by what is UNDER TEST, not by verb:
        web     WASM/browser build and runtime  (serve, build, watch, comply, stress)
        llm     inference correctness/throughput/cost against an endpoint
                (test, load, bench, sweep, score, experiment, data-audit)
        media   rendered output vs ground truth (av-sync, audio, video, animation)
        replay  the runner itself             (record, playbook, coverage, report)

      Routed today: `tensor` (PMAT-481 visual regression) and `llm bench`
      (GH-876 Milestone 2). The rest land as they are delegated to the probador
      library.
    requires_model: false
    side_effects: [filesystem, network]
    # tensor — export tensor activations for visual regression testing (PMAT-481)
    # llm    — benchmark an OpenAI-compatible endpoint (GH-876 Milestone 2);
    #          `network` because it drives an HTTP endpoint, and may spawn the
    #          runtime under test via --start
    subcommands: [tensor, llm]

  - name: diagnose
    category: misc
    description: "Automated Five Whys diagnosis on a training checkpoint"
    requires_model: true
    side_effects: []

