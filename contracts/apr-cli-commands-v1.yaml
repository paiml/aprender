  - name: sim
    category: tools
    description: "Discrete-event simulation (was the simular binary)"
    requires_model: false
    side_effects: [filesystem]
    # `version` comes from #2527's simular clap conversion, which the batch
    # takes over #2493's. FALSIFY-CLI-006 caught the omission.
    subcommands: [emc-check, emc-validate, list-emc, render, run, validate, verify, version]

  - name: cgp
    category: tools
    description: "Compute-graph profiling (was the aprender-cgp binary)"
    requires_model: false
    side_effects: [filesystem]
    subcommands: [baseline, bench, compete, contract, diff, doctor, explain, profile, roofline, trace, tui]

  - name: pv
    category: tools
    description: "Provable-contracts CLI (also ships as the standalone pv binary)"
    requires_model: false
    side_effects: [filesystem]
    subcommands: [audit, book, certify, check-parity, codegen, coq, coverage, diff, equations, explain, extract-pytorch, flux, fuzz, generate, graph, infer, invariants, kaizen, kani, lean, lean-status, lint, migrate, mirai, pipeline, probar, proof-status, query, roofline, scaffold, score, status, tla, unlock, validate, verify-bindings, verify-pipeline, verify-structure]

# ── Falsification Conditions ──

falsification:
  - name: FALSIFY-CLI-001
    description: "Command listed in contract but missing from `apr --help`"
    check: "Every command.name in this YAML must appear in `apr --help` output"
    enforcement: "cargo test -p apr-cli --test cli_commands test_all_contract_commands_exist"

  - name: FALSIFY-CLI-002
    description: "Command in `apr --help` but missing from contract"
    check: "Every command in `apr --help` must have an entry in this YAML"
    enforcement: "cargo test -p apr-cli --test cli_commands test_no_unregistered_commands"

  - name: FALSIFY-CLI-003
    description: "Command --help exits with non-zero code"
    check: "Every command must exit 0 on --help"
    enforcement: "cargo test -p apr-cli --test cli_commands test_all_commands_respond_to_help"

  - name: FALSIFY-CLI-004
    description: "Command panics on --help"
    check: "No command may panic when invoked with --help"
    enforcement: "cargo test -p apr-cli --test cli_commands test_all_commands_respond_to_help"

  - name: FALSIFY-CLI-005
    description: "Command count drifts from contract"
    check: "The number of commands in `apr --help` must equal the count in this YAML"
    enforcement: "cargo test -p apr-cli --test cli_commands test_command_count_matches"

  - name: FALSIFY-CLI-THRESHOLD-NAN-001
    description: >
      A tolerance/threshold flag accepts a value that makes its gate
      unfalsifiable. Every CRUX lint gate compares an observation against a
      threshold (`mad > tol_abs`, `efficiency < floor`, `used_pct < threshold`);
      IEEE-754 makes every comparison against NaN false, so a NaN threshold
      makes the failing branch unreachable — the command exits 0 and the report
      prints `Ok` next to the violating number. A negative value does the same
      to the floor-style gates. Shipped in 0.63.0 on 8 flags across 5 commands
      (see #2391).
    check: >
      Every f64 tolerance/threshold flag must reject NaN, ±inf and
      out-of-domain values at parse time (exit 2), and each lint `run()` must
      re-check its thresholds so a non-clap caller also fails closed. The
      shared validator is crates/apr-cli/src/commands/threshold_arg.rs.
    enforcement: "cargo test -p apr-cli --test cli_commands nan_threshold_never_reports_a_failing_lint_gate_as_ok"
