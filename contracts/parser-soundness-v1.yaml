metadata:
  version: "1.0.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  references:
    - "GGUF Specification v3 (ggerganov/ggml)"
    - "Safetensors specification (huggingface/safetensors)"
    - "APR format specification (docs/specifications/aprender-monorepo-consolidation.md)"
  description: "GGUF, SafeTensors, and APR parser soundness — no panics, typed errors, magic-byte detection"

name: parser-soundness
version: "1.0.0"
scope: "crates/aprender-core/src/format/ — GGUF, SafeTensors, and APR parsers"

description: |
  Format parsers are the trust boundary between untrusted bytes on disk and
  safe in-memory representations. Any input must produce either a valid parse
  result or a typed error — never a panic, never silent corruption.

equations:
  magic_byte_detection:
    description: "Format identified from first 4–8 bytes before any allocation"
    formula: |
      bytes[0..4] == "GGUF" -> Ok(Gguf)
      bytes[0..4] == "APR\0" or "APRN" -> Ok(Apr)
      bytes[0..8] is valid LE u64 followed by '{' -> Ok(SafeTensors)
      _ -> Err(FormatError::UnknownMagic)
    note: "Magic check is O(1); runs before any heap allocation"

  malformed_rejection:
    description: "Invalid files produce SparseError, not panic"
    formula: "∀ bytes ∈ Bytes: parse(bytes) ∈ Ok(T) ∪ Err(SparseError); panic! is FORBIDDEN"
    note: "Enforced by #[no_panic] on parser entry points"

  header_integrity:
    description: "Parsed header field totals are consistent with file size"
    formula: |
      header.n_tensors * min_entry_bytes + metadata_overhead ≤ file_size
      ∀ tensor t: t.offset + t.byte_size ≤ file_size
    note: "Both conditions checked before constructing any TensorInfo"

falsification:
  - id: FALSIFY-PARSE-001
    description: "Truncated GGUF (3 bytes) returns FormatError, does not panic"
    test: "Feed 3-byte buffer to GGUF parser; assert Err, no panic"
    evidence: "cargo test -p aprender-core --lib parser_soundness"

  - id: FALSIFY-PARSE-002
    description: "SafeTensors with header_size > file_size returns bounds error"
    test: "Craft 8-byte file claiming header_size = 0xFFFFFFFF; assert FormatError"
    evidence: "cargo test -p aprender-core --lib parser_soundness"

  - id: FALSIFY-PARSE-003
    description: "APR file with wrong magic bytes ('GGUF') is rejected as UnknownMagic"
    test: "Write APR magic field as GGUF bytes; assert FormatError::UnknownMagic"
    evidence: "cargo test -p aprender-core --lib parser_soundness"

falsification_tests:
  - id: FALSIFY-PARSER_SOUNDNESS-001
    description: "malformed_rejection: a truncated GGUF buffer returns a typed error, not a panic"
    test: "cargo test -p aprender-core --lib test_from_bytes_file_too_small"
    prediction: "GgufReader::from_bytes on a 10-byte buffer returns Err containing 'too small'"
    if_fails: "the GGUF parser accepts or panics on a truncated header"
  - id: FALSIFY-PARSER_SOUNDNESS-002
    description: "header_integrity: a GGUF one byte short of its 24-byte header is rejected"
    test: "cargo test -p aprender-core --lib test_from_bytes_file_exactly_23_bytes"
    prediction: "GgufReader::from_bytes on a 23-byte buffer returns Err"
    if_fails: "the GGUF header-size bound is off by one or unchecked"
  - id: FALSIFY-PARSER_SOUNDNESS-003
    description: "header_integrity: a SafeTensors header_len larger than the file is rejected"
    test: "cargo test -p aprender-core --lib test_safetensors_truncated_header"
    prediction: "a 20-byte file claiming header_len 1000 returns Err containing 'truncated'"
    if_fails: "the SafeTensors parser trusts header_len beyond the file size"
  - id: FALSIFY-PARSER_SOUNDNESS-004
    description: "magic_byte_detection: unrecognised magic bytes are rejected"
    test: "cargo test -p aprender-core --lib test_list_tensors_unknown_magic_4_bytes"
    prediction: "bytes DE AD BE EF return Err containing 'Unknown model format'"
    if_fails: "magic dispatch accepts unknown bytes as a model format"
