# CRUX-J-07 — OpenCLAW per-sender session isolation
# Resolved 2026-04-18: category J competitor = openclaw.ai.

metadata:
  id: CRUX-J-07
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "J — OpenCLAW Agent Orchestration"
  competitor: openclaw
  demand_score: 3
  intake_status: missing
  description: >
    OpenCLAW isolates conversation state per sender: Alice's context never
    leaks into Bob's replies, even in the same daemon process. Aprender
    parity: any multi-user inbound surface MUST keep KV-cache, memory, and
    tool-call context disjoint across sender_id. Overlaps with
    aprender-serve session management and the CRUX-J-10 memory store.
  openclaw_interpretation: openclaw-agent-resolved

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5.J'
  - https://openclaw.ai/
  - contracts/crux-J-10-v1.yaml
  - evidence/crux/openclaw/gaps.md

equations:
  per_sender_isolation:
    formula: |
      session(sender_a) ∩ session(sender_b) = ∅    for a ≠ b
      context(sender) := {kv_cache, memory, tool_history}
      cross_leak := ∃ key ∈ context(a) : key ∈ context(b)
      invariant: cross_leak = false
    domain: (sender_a, sender_b) distinct senders
    codomain: per-sender context snapshots
    invariants:
    - "per-sender KV cache isolation"
    - "per-sender memory store namespace"
    - "per-sender tool-call history isolation"

falsification_tests:
- id: FALSIFY-CRUX-J-07-001
  rule: apr-serve surfaces per-user session isolation
  prediction: "aprender-serve documents per-session or per-user context isolation"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "per-session KV cache OR session isolation aprender-serve OR user-scoped context" --limit 1 --format json | grep -q '"matches"' || {
        echo "FAIL: no per-session isolation story documented" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-07 parity broken — aprender-serve MUST document per-session isolation
- id: FALSIFY-CRUX-J-07-002
  rule: memory store keys are per-sender-scoped
  prediction: "memory store exposes a sender/user scope in its key schema"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "memory namespace sender OR per-user memory scope" --limit 1 --format json | grep -q '"matches"' || {
        echo "FAIL: no per-sender memory scoping documented" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-07 memory invariant — memory keys must be per-sender-scoped

proof_obligations:
- type: invariant
  property: "sessions are disjoint across senders"
- type: invariant
  property: "memory keys carry sender scope"

verification_summary:
  total_obligations: 2
  proven: 0
  tested: 0
  status: draft

pmat_work_tracking:
  ticket_tag: crux-crux-j-07
  priority: medium
  auto_created: true
