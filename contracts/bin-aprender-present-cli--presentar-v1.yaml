# ──────────────────────────────────────────────
# bin-aprender-present-cli--presentar-v1 — the `presentar` bin target of package aprender-present-cli (ONT-10 slice S14 (2/2))
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha, helpSha,
# gitSha, …) live in binary-surface-v1 and are not restated. Moved from docs/ont-10/binary-contracts/ (aprender-bb).
#
# binary-presentar-v1 — ONT-10 slice S14 (2/2): the `presentar` binary (package aprender-present-cli) as an entity (ONT-001 v4.17 ONT-4g; #4476, #4079)
#
# MEASURED (2026-09-26, batch/ont-10 @ ff9587b596, release build, default features, LC_ALL=C recursive --help walk):
#   - `presentar --version` = "presentar 0.69.3"; G0.1 (git sha) is a warning and RED today.
#   - the walk gives 7 leaves, set-equal to surface_audit.csv's 7 rows.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-present-cli--presentar-v1
version: "1.0.0"
scope: >
  The built `presentar` target of package `aprender-present-cli` (default features) as the focus node binary/aprender-present-cli/presentar: its identity and its exact command surface, and the surface_audit.csv rows that must resolve to it.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice S14 (2/2) (presentar). Per-binary shapes over the node extract:binary (ONT-4g, #4476) draws
    for binary/aprender-present-cli/presentar, on the binary-surface-v1 vocabulary.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (the ledger)'
    - 'scripts/dogfood_surfaces.sh (the snapshot extract:binary reads)'
    - 'crates/aprender-present-cli/src/main.rs'
    - 'aprender#4502 — ONT-10'

entity:
  type: binary
  ref: binary/aprender-present-cli/presentar

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-presentar-surface
    targetClass: bin:target/aprender-present-cli/presentar
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["presentar"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-present-cli"]}
      - {path: "bin:versionString", minCount: 1, maxCount: 1, pattern: "^presentar [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-27 (no sha); a warning until the version string carries it
      - {path: "bin:versionString", minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: "warning"}
      - path: bin:command
        minCount: 7
        maxCount: 7
        in:
          - "bundle"
          - "check"
          - "deploy"
          - "gate"
          - "new"
          - "score"
          - "serve"
      - {path: "bin:ledgerOrphan", maxCount: 0}
      - {path: "bin:unledgeredCommand", maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(binary/aprender-present-cli/presentar) = C, |C| = 7, where C = the invocable command paths of the recursive --help walk of the default-feature build ∧ ledgerOrphan = { r ∈ csv : r.binary = presentar ∧ strip(r.feature) ∉ C }; unledgeredCommand = C ∖ { strip(r.feature) : r.binary = presentar }"
    domain: "the snapshot record dogfood_surfaces.sh writes for this target; docs/audits/surface_audit.csv rows whose binary column is presentar; strip removes the leading binary name"
    codomain: "set equality, or a Fail naming each member of the symmetric difference; literals on the focus node, one per orphan row or unledgered command"
    invariants:
      - "in + minCount 7 + maxCount 7 over distinct literals is set equality: an added, dropped or renamed command is a violation naming it"
      - "a ledger row for a command the built binary does not expose is a violation, never a silent skip"
    preconditions:
      - "the snapshot was written at this commit, default features"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `presentar --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-PRESENTAR-INV-001
    property: every presentar surface member has an audited ledger row, and every ledger row names one
    formal: '∀ c ∈ surface(presentar): ∃ r ∈ surface_audit : r.binary = presentar ∧ path(r) = c; ∀ r with r.binary = presentar: path(r) ∈ surface(presentar)'
    prose: false
  - id: BIN-PRESENTAR-INV-002
    property: unusable input is a clean rejection, never a success and never a panic
    formal: '∀ a ∈ rejection_rows(crates/aprender-present-cli/tests/cli_surface_gate.rs): exit(a) ∉ {0, 101} ∧ "panicked" ∉ stderr(a)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-PRESENTAR-001
    rule: 'G1.2 help answers'
    prediction: '`presentar --help` exits 0 with non-empty stdout'
    test: 'cargo test -p aprender-present-cli --test cli_surface_gate every_advertised_subcommand_is_reachable'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-27: exit 0, GREEN)'
    mutation: 'make the top-level --help return an error; must turn RED'
  - id: FALSIFY-BIN-PRESENTAR-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`presentar --no-such-flag` exits 2'
    test: 'cargo test -p aprender-present-cli --test cli_surface_gate unknown_'
    if_fails: 'a typo is silently ignored (observed 2026-09-27: exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-PRESENTAR-003
    rule: 'G0.1 the version names the commit'
    prediction: '`presentar --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'LIVE RED 2026-09-27: "presentar 0.69.3" — no sha; a stale presentar reads as HEAD'
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-PRESENTAR-004
    rule: 'G1.3/G1.4 the surface set equals the snapshot'
    prediction: 'the surface literals in the shape above = the snapshot''s, set-equal'
    test: 'cargo test -p aprender-present-cli --test cli_surface_gate -- advertised_subcommands_are_the_pinned_surface'
    if_fails: 'an added, dropped or renamed surface member ships with the ontology green (enumerated-value parsing not probed for this binary)'
    mutation: 'remove `bundle` from the snapshot; must turn RED on bin:command and bin:ledgerOrphan naming it'
  - id: FALSIFY-BIN-PRESENTAR-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 row per surface member with binary = presentar (7 rows on 2026-09-27)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'the dogfood coverage ratio is computed over a ledger that silently omits a shipped surface member'
    mutation: 'delete every presentar row; must turn RED naming presentar'
  - id: FALSIFY-BIN-PRESENTAR-006
    rule: 'unusable input is rejected cleanly'
    prediction: '`check`, `score` and `gate` on a missing, empty and garbage manifest: each exits non-zero, not 101, with no "panicked" on stderr'
    test: 'cargo test -p aprender-present-cli --test cli_surface_gate unusable_input_is_rejected'
    if_fails: 'MEASURED 2026-09-27 (aprender-01): each exits 1 with no panic, GREEN; no source mutation was run for this binary'
    mutation: 'make a rejection path return Ok(()) or unwrap the read; must turn RED on that row'
