metadata:
  version: 1.0.0
  kind: schema
  description: |
    PCU contract for book/src/lib/metrics.md (aprender::metrics module reference).
    Enforces: page exists, references the module, has a runnable example.
  references:
    - "docs/specifications/book-completeness-spec.md"

equations:
  pcu_header_present:
    formula: "file_contains(book/src/lib/metrics.md, 'PCU: lib-metrics')"
  module_mentioned:
    formula: "file_contains(book/src/lib/metrics.md, 'aprender::metrics')"
  example_block_present:
    formula: "file_contains_fenced(book/src/lib/metrics.md, language='rust')"

falsification_tests:
  - id: FALSIFY-PAGE-LIB-METRICS-001
    name: stub_exists
    prediction: "book/src/lib/metrics.md exists on disk"
    test_harness: "test -f book/src/lib/metrics.md"
    expected_output: "exit 0"
    if_fails: "Run scripts/gen-lib-chapter-stubs.sh to regenerate."

  - id: FALSIFY-PAGE-LIB-METRICS-002
    name: module_mentioned
    prediction: "page references the module at least once"
    test_harness: "grep -q 'aprender::metrics' book/src/lib/metrics.md"
    expected_output: "exit 0"
    if_fails: "Add a mention of aprender::metrics to the chapter."

  - id: FALSIFY-PAGE-LIB-METRICS-003
    name: runnable_example
    prediction: "page has at least one rust code block"
    test_harness: "grep -c '^```rust' book/src/lib/metrics.md"
    expected_output: "stdout >= 1"
    if_fails: "Add a rust code block with a runnable example."

proof_obligations:
- type: completeness
  property: "The reference page book/src/lib/metrics.md exists on disk (FALSIFY-PAGE-LIB-METRICS-001)"
  formal: "exists(book/src/lib/metrics.md)"
- type: invariant
  property: "The page references the aprender::metrics module at least once (FALSIFY-PAGE-LIB-METRICS-002)"
  formal: "file_contains(book/src/lib/metrics.md, 'aprender::metrics')"
- type: completeness
  property: "The page contains at least one runnable rust code block (FALSIFY-PAGE-LIB-METRICS-003)"
  formal: "count_fenced(book/src/lib/metrics.md, lang=rust) >= 1"
