    test: 'cargo test -p aprender-forecast --lib forecast::tests::an_option_belonging AND cargo test -p aprender-mcp-forecast --lib e2e::refuses_cap_'
    if_fails: 'The door is back to accepting a knob it does not use — the class FALSIFY-BOUNDARY-005 already calls the worst failure class in this contract. `make_design` matches only (Growth::Logistic, Some(c)), so the cap is silently dropped and the caller receives a plausible linear forecast in answer to a saturating-growth question they did believe they asked.'

  - id: FALSIFY-BOUNDARY-018
    rule: 'The PRODUCT of the separately-bounded holiday factors is itself bounded, at the door and before make_design'
    prediction: >
      Five assertions falsify this rule, at three layers. The CONSTANTS layer:
      `types::tests::cost_bounds_match_contract` asserts types::MAX_HOLIDAY_DESIGN_COST ==
      constants.fit_max_holiday_design_cost and types::MAX_HOLIDAY_DATES_TOTAL ==
      constants.fit_max_holiday_dates_total, so perturbing either value HERE — touching no Rust —
