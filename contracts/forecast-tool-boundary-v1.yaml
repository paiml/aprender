      `forecast::tests::an_in_bounds_holiday_spec_whose_product_is_not_is_refused` observes a
      Validation refusal for a spec inside every individual bound whose product is not, and
      `forecast::tests::a_holiday_spec_just_under_the_design_cost_bound_is_accepted` observes the
      near-miss still fitting — the positive control that keeps the bound from over-refusing. The
      SERVER, the same two sides through a live streamable-HTTP router:
      `e2e::refuses_holiday_design_cost_over_bound` sends 62 points + horizon 7 with one holiday at
      the widest legal window (731 columns) = 50 439 design cells and observes a validation-class
