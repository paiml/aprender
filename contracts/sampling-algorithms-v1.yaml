metadata:
  version: 1.2.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: Sampling algorithm invariants for autoregressive generation
  references:
  - Holtzman et al. (2019) The Curious Case of Neural Text Degeneration
  - Qwen2.5-Coder Showcase Spec §14.5
  - Keskar et al. (2019) CTRL — repetition penalty
  - PMAT-814 dense quantized decode honors repeat_penalty
  depends_on:
  - softmax-kernel-v1
equations:
  greedy:
    formula: greedy(logits) = argmax(logits)
    domain: logits ∈ ℝ^V (vocabulary logits)
    invariants:
    - Returns index of maximum logit
    - 'Deterministic: same input => same output'
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.Greedy
  top_k:
    formula: top_k(probs, K) = {p_i if rank(p_i) <= K else 0, renormalized}
    domain: probs ∈ Δ^V (probability simplex), K ∈ [1, V]
    invariants:
    - At most K tokens have non-zero probability
    - Retained tokens have highest probabilities
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.Top_K
  top_p:
    formula: top_p(probs, p) = minimal set S where sum(S) >= p
    domain: probs ∈ Δ^V, p ∈ (0, 1]
    invariants:
    - Cumulative probability of retained tokens >= p
    - 'Set is minimal: removing any token drops below p'
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.Top_P
  temperature:
    formula: softmax(logits / T)
    domain: logits ∈ ℝ^V, T > 0
    invariants:
    - 'T=1 is identity: softmax(l/1) = softmax(l)'
    - T→0 converges to argmax (one-hot)
    - T→∞ converges to uniform distribution
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.Temperature
  repeat_penalty:
    formula: 'penalize(l_i, ρ) = l_i / ρ if l_i > 0 else l_i * ρ, for i in last_n(recent)'
    domain: logits ∈ ℝ^V, ρ >= 1 (penalty), recent ∈ ℕ*, last_n >= 0
    invariants:
    - 'ρ=1 is identity: logits unchanged (no-op, no allocation)'
    - 'last_n=0 or recent empty is identity: logits unchanged'
    - 'Applied to last_n most-recent context tokens (prompt + generated)'
    - 'ρ>1 strictly shrinks repeated tokens'' selection chance (sign-correct: positive
      logits divided, non-positive multiplied)'
    - 'Applied in place BEFORE both greedy argmax and top-k/top-p sampling'
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.RepeatPenalty
proof_obligations:
- type: equivalence
  property: Greedy = argmax
  formal: greedy(logits) == argmax(logits)
  tolerance: 0.0
  applies_to: all
- type: bound
  property: Top-K cardinality
  formal: count(nonzero(top_k(p, K))) <= K
  applies_to: all
- type: bound
  property: Top-P cumulative
  formal: sum(top_p(p, threshold)) >= threshold
  applies_to: all
- type: equivalence
  property: Temperature identity
  formal: softmax(l/1) == softmax(l)
  tolerance: 1e-6
  applies_to: all
- type: equivalence
  property: SIMD sampling equivalence
  tolerance: 0.0
  applies_to: simd
- type: equivalence
  property: Repeat penalty identity at rho=1
  formal: apply_repeat_penalty(l, recent, 1.0, last_n) == l
  tolerance: 0.0
  applies_to: all
- type: bound
  property: Repeat penalty demotes repeated token
  formal: 'token T in last_n(recent) AND argmax(l)=T AND l_T>0 AND exists U!=T with
    l_T/rho < l_U => argmax(penalize(l, recent, rho, last_n)) != T'
  applies_to: all
- type: bound
  property: APR-path sampler honors top_k / top_p (PMAT-820)
  formal: apr_sample_from_logits(logits, {temperature, top_k, top_p}) selects only
    from top_k_top_p_survivors(logits/temperature, top_k, top_p); excluded tokens
    are unreachable
  applies_to: all
- type: equivalence
  property: APR-path neutral params are byte-identical to temperature-only (PMAT-820
    no-regression)
  formal: top_k in {0} ∪ [V, ∞) ∧ top_p >= 1.0 ⇒ apr_sample_from_logits == argmax(logits/temperature);
    temperature == 0 ⇒ argmax(logits)
  tolerance: 0.0
  applies_to: all
falsification_tests:
- id: FALSIFY-SA-001
  rule: Greedy = argmax
  prediction: Greedy returns maximum logit index
  test: proptest with random logit vectors
  if_fails: Comparison or indexing error
- id: FALSIFY-SA-002
  rule: Top-K cardinality
  prediction: At most K non-zero probabilities
  test: proptest with random probs and K
  if_fails: Filtering or sorting error
- id: FALSIFY-SA-003
  rule: Top-P cumulative
  prediction: Retained probabilities sum >= p
  test: proptest with random probs and p threshold
  if_fails: Cumulative sum tracking error
- id: FALSIFY-SA-004
  rule: Temperature identity
  prediction: T=1 softmax matches raw softmax
  test: proptest with random logits
  if_fails: Temperature division error
- id: FALSIFY-SA-005
  rule: SIMD sampling equivalence
  prediction: SIMD sampling matches scalar
  test: proptest
  if_fails: ' compare scalar vs SIMD sampling:SIMD sampler selects different tokens'
- id: FALSIFY-SA-006
  rule: APR-path sampler honors top_k / top_p (PMAT-820)
  prediction: With top_k=1 or top_p=0.1 on a peaked distribution, a low-probability
    token reachable under neutral params is EXCLUDED from the survivor set
  test: aprender-serve apr_transformer::generation::top_p_top_k_tests::{topk_one_excludes_low_prob_token,
    topp_tight_nucleus_excludes_tail, sampler_honors_top_k_one}
  if_fails: APR generation.rs sample_from_logits drops config.top_k / config.top_p
    (full-distribution temperature sampling — the original PMAT-820 defect)
- id: FALSIFY-SA-007
  rule: APR-path neutral params no-regression (PMAT-820)
  prediction: top_k in {0} or >= vocab AND top_p >= 1.0 yields byte-identical output
    to the pre-fix temperature-only argmax; greedy (temperature==0) is unaffected
  test: aprender-serve apr_transformer::generation::top_p_top_k_tests::{neutral_params_byte_identical_to_legacy,
    top_k_ge_vocab_is_neutral, greedy_unaffected_by_top_k_top_p}
  if_fails: APR truncation pruned the argmax token or altered greedy selection
- id: FALSIFY-SA-008
  rule: Dense quantized decode honors repeat_penalty
  prediction: With token T the current argmax AND in the recent window, a repeat_penalty
    greater than 1 drops T below a runner-up so the greedy/sampled token changes away
    from T; repeat_penalty == 1.0 is a byte-identical no-op
  test: test_repeat_penalty_changes_greedy_argmax_away_from_repeated_token (+5 no-op
    / sign / window tests) in gguf::inference::generation::tests
  if_fails: Dense decode loops drop repeat_penalty (applied only temperature + top-k);
    repetitive output silently — the PMAT-814 regression
- id: FALSIFY-SA-009
  rule: Repeat penalty identity at rho=1
  prediction: apply_repeat_penalty with penalty == 1.0 (or last_n == 0, or empty recent)
    leaves logits byte-identical — every all-default request is unchanged (no-regression)
  test: test_repeat_penalty_unity_is_byte_identical_no_op, test_repeat_penalty_zero_window_is_no_op,
    test_repeat_penalty_empty_recent_is_no_op in gguf::inference::generation::tests
  if_fails: Default-config decode diverges from the pre-PMAT-814 path — a regression
kani_harnesses:
- id: KANI-SA-001
  obligation: SA-EQ-001
  property: Greedy = argmax for bounded vocabularies
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_greedy_argmax
- id: KANI-SAMPLI-002
  obligation: Greedy = argmax
  property: Greedy = argmax
  bound: 8
  strategy: exhaustive
- id: KANI-SAMPLI-003
  obligation: Top-K cardinality
  property: Top-K cardinality
  bound: 8
  strategy: exhaustive
- id: KANI-SAMPLI-004
  obligation: Top-P cumulative
  property: Top-P cumulative
  bound: 8
  strategy: exhaustive
- id: KANI-SAMPLI-005
  obligation: Temperature identity
  property: Temperature identity
  bound: 8
  strategy: exhaustive
- id: KANI-SAMPLI-006
  obligation: SIMD sampling equivalence
  property: SIMD sampling equivalence
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-SA-001
  name: Sampling Algorithms Contract
  description: Generation sampling quality gate
  checks:
  - greedy_argmax
  - top_k_cardinality
  - top_p_cumulative
  - temperature_identity
  - repeat_penalty_demotes_repeated_token
  pass_criteria: All falsification tests pass (incl. FALSIFY-SA-008 repeat_penalty)
  falsification: Set K=0 to observe empty filtered set
