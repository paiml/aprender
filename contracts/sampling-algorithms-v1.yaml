metadata:
  version: 1.1.0
  created: '2026-02-18'
  updated: '2026-06-16'
  author: PAIML Engineering
  description: Sampling algorithm invariants for autoregressive generation
  references:
  - Holtzman et al. (2019) The Curious Case of Neural Text Degeneration
  - Qwen2.5-Coder Showcase Spec §14.5
  - 'PMAT-816: dense quantized decode silently dropped repeat_penalty/repeat_last_n
    (same class as top_p) — applied on the MoE path + the DEAD twin sample_advanced,
    but the LIVE dense decode loops (generate_quantized.rs / generate_scratch.rs +
    CUDA/cached/batched) only passed temperature+top_k to sample_topk.'
  depends_on:
  - softmax-kernel-v1
equations:
  greedy:
    formula: greedy(logits) = argmax(logits)
    domain: logits ∈ ℝ^V (vocabulary logits)
    invariants:
    - Returns index of maximum logit
    - 'Deterministic: same input => same output'
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.Greedy
  top_k:
    formula: top_k(probs, K) = {p_i if rank(p_i) <= K else 0, renormalized}
    domain: probs ∈ Δ^V (probability simplex), K ∈ [1, V]
    invariants:
    - At most K tokens have non-zero probability
    - Retained tokens have highest probabilities
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.Top_K
  top_p:
    formula: top_p(probs, p) = minimal set S where sum(S) >= p
    domain: probs ∈ Δ^V, p ∈ (0, 1]
    invariants:
    - Cumulative probability of retained tokens >= p
    - 'Set is minimal: removing any token drops below p'
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.Top_P
  temperature:
    formula: softmax(logits / T)
    domain: logits ∈ ℝ^V, T > 0
    invariants:
    - 'T=1 is identity: softmax(l/1) = softmax(l)'
    - T→0 converges to argmax (one-hot)
    - T→∞ converges to uniform distribution
    preconditions:
    - input.len() > 0
    lean_theorem: Theorems.Temperature
  repetition_penalty:
    formula: 'for t in recent[len-N..]: l[t] /= R if l[t] > 0 else l[t] *= R'
    domain: logits ∈ ℝ^V, R (repeat_penalty) >= 1, N (repeat_last_n) >= 0
    invariants:
    - 'Neutral no-op: R == 1.0 OR N == 0 OR recent empty => logits unchanged
      (byte-identical, applies to dense AND MoE decode paths)'
    - 'Applied BEFORE temperature scaling and BEFORE greedy/argmax (PMAT-383/384,
      Candle apply_repeat_penalty convention)'
    - 'PMAT-816: MUST be applied on the LIVE dense decode path (sample_topk chain),
      not only the MoE path / the dead sample_advanced twin'
    - 'Larger N compounds the penalty (per-occurrence application within window)'
    preconditions:
    - input.len() > 0
proof_obligations:
- type: equivalence
  property: Greedy = argmax
  formal: greedy(logits) == argmax(logits)
  tolerance: 0.0
  applies_to: all
- type: bound
  property: Top-K cardinality
  formal: count(nonzero(top_k(p, K))) <= K
  applies_to: all
- type: bound
  property: Top-P cumulative
  formal: sum(top_p(p, threshold)) >= threshold
  applies_to: all
- type: equivalence
  property: Temperature identity
  formal: softmax(l/1) == softmax(l)
  tolerance: 1e-6
  applies_to: all
- type: equivalence
  property: SIMD sampling equivalence
  tolerance: 0.0
  applies_to: simd
- type: equivalence
  property: Repetition penalty neutral no-op
  formal: apply_repeat_penalty(l, 1.0, n, recent) == l
  tolerance: 0.0
  applies_to: all
- type: bound
  property: Repetition penalty dense-path application
  formal: dense_decode_token(repeat_penalty>1) != dense_decode_token(repeat_penalty==1)
    when the repeated token is the argmax
  applies_to: all
falsification_tests:
- id: FALSIFY-SA-001
  rule: Greedy = argmax
  prediction: Greedy returns maximum logit index
  test: proptest with random logit vectors
  if_fails: Comparison or indexing error
- id: FALSIFY-SA-002
  rule: Top-K cardinality
  prediction: At most K non-zero probabilities
  test: proptest with random probs and K
  if_fails: Filtering or sorting error
- id: FALSIFY-SA-003
  rule: Top-P cumulative
  prediction: Retained probabilities sum >= p
  test: proptest with random probs and p threshold
  if_fails: Cumulative sum tracking error
- id: FALSIFY-SA-004
  rule: Temperature identity
  prediction: T=1 softmax matches raw softmax
  test: proptest with random logits
  if_fails: Temperature division error
- id: FALSIFY-SA-005
  rule: SIMD sampling equivalence
  prediction: SIMD sampling matches scalar
  test: proptest
  if_fails: ' compare scalar vs SIMD sampling:SIMD sampler selects different tokens'
- id: FALSIFY-SA-006
  rule: Repetition penalty neutral no-op
  prediction: 'apply_repeat_penalty(l, 1.0, n, recent) and (l, R, 0, recent) and
    (l, R, n, []) all return the input logits BORROWED unchanged (byte-identical,
    no allocation) — no-regression for existing callers (default config R==1.0).'
  test: 'cargo test -p aprender-serve --lib rep_penalty_neutral_is_byte_identical_borrow'
  if_fails: 'Neutral penalty allocated or mutated logits — breaks the byte-identical
    no-regression invariant for the default-config decode path.'
- id: FALSIFY-SA-007
  rule: Dense-path repetition penalty application (PMAT-816)
  prediction: 'repeat_penalty > 1.0 on the LIVE dense decode path (sample_topk chain,
    including the batched select) moves the greedy/sampled token off a recently-repeated
    argmax token; larger repeat_last_n compounds the penalty.'
  test: 'cargo test -p aprender-serve --lib rep_penalty_changes_greedy_token
    rep_penalty_window_is_bounded_by_repeat_last_n batched_repeat_penalty_changes_greedy_token'
  if_fails: 'repeat_penalty / repeat_last_n silently dropped on the dense path —
    apply_repeat_penalty not invoked before argmax/sample_topk in one of the live
    decode loops (the original bug: only temperature+top_k reached sampling).'
kani_harnesses:
- id: KANI-SA-001
  obligation: SA-EQ-001
  property: Greedy = argmax for bounded vocabularies
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_greedy_argmax
- id: KANI-SAMPLI-002
  obligation: Greedy = argmax
  property: Greedy = argmax
  bound: 8
  strategy: exhaustive
- id: KANI-SAMPLI-003
  obligation: Top-K cardinality
  property: Top-K cardinality
  bound: 8
  strategy: exhaustive
- id: KANI-SAMPLI-004
  obligation: Top-P cumulative
  property: Top-P cumulative
  bound: 8
  strategy: exhaustive
- id: KANI-SAMPLI-005
  obligation: Temperature identity
  property: Temperature identity
  bound: 8
  strategy: exhaustive
- id: KANI-SAMPLI-006
  obligation: SIMD sampling equivalence
  property: SIMD sampling equivalence
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-SA-001
  name: Sampling Algorithms Contract
  description: Generation sampling quality gate
  checks:
  - greedy_argmax
  - top_k_cardinality
  - top_p_cumulative
  - temperature_identity
  pass_criteria: All 5 falsification tests pass
  falsification: Set K=0 to observe empty filtered set
