metadata:
  version: 1.0.0
  created: '2026-04-07'
  author: PAIML Engineering
  registry: true
  references:
  - 'apr-cookbook/.claude/skills/qa/SKILL.md — fleet QA skill (12 protocols)'
  - 'POSIX.1-2017 Section 12 — Utility Conventions'
  description: >
    Exhaustive QA contract for the apr CLI. Every subcommand must respond
    to --help, handle missing models gracefully, produce valid JSON with
    --json, and satisfy 12 protocol invariants from fleet testing.

equations:
  help_universality:
    formula: |
      forall cmd in REGISTERED_COMMANDS:
        apr cmd --help exits 0 AND stdout.len() > 0
    domain: "set of 57 registered CLI commands"
    codomain: bool
    invariants:
    - "No command panics on --help"
    - "Every command has non-empty help text"
    preconditions:
    - "apr binary is installed and on PATH"
    postconditions:
    - "exit code 0 for all 58 commands"

  missing_model_graceful:
    formula: |
      forall cmd in MODEL_COMMANDS:
        apr cmd /nonexistent/model.gguf exits non-zero AND
        stderr contains "not found" or "does not exist" AND
        no panic in stderr
    domain: "commands that require a model file"
    codomain: "Result<(), CliError>"
    invariants:
    - "Missing model never panics"
    - "Exit code is non-zero (1 or 2)"
    - "Error message is human-readable"

  format_parity_skips_on_missing_reference:
    formula: |
      apr qa GGUF_MODEL with NO SafeTensors reference on disk
        AND no --safetensors-path given:
          format_parity gate result == SKIP (not FAIL)
      apr qa GGUF_MODEL with a reference present that DIVERGES:
          format_parity gate result == FAIL  (SKIP must not mask divergence)
    domain: "apr qa format_parity gate, GGUF primary"
    codomain: "GateResult { skipped | passed | failed }"
    invariants:
    - "A genuinely ABSENT optional reference SKIPs, mirroring ollama_parity which SKIPs when Ollama is unavailable (PMAT-815)"
    - "A diagnostic must not hard-FAIL on the absence of the input it compares against (PMAT-743 class)"
    - "An EXPLICIT --safetensors-path that does not exist still FAILs (user requested a specific reference)"
    - "A reference that IS present but whose outputs diverge still FAILs — the SKIP never swallows a real bug"

  format_parity_compares_decode_not_one_prefill:
    formula: |
      apr qa GGUF_MODEL with a usable SafeTensors reference:
        steps_compared >= 64
        AND every step is produced by the PRODUCTION cache entry point
            (forward_single_with_cache / forward_with_cache)
        AND both sides are teacher-forced with the SAME token each step
        AND top-1 must agree at every step, except where
            cosine(logits_gguf, logits_st) >= 0.98 (near-tie exemption)
    domain: "apr qa format_parity gate, GGUF primary with a convertible SafeTensors reference"
    codomain: "GateResult { value = steps agreed, threshold = steps compared }"
    invariants:
    - "At least 64 decode steps are compared - the gate this replaced ran ONE prefill forward and compared a single final-position argmax, so a divergence appearing at decode step 32 was structurally invisible to it"
    - "--max-tokens cannot shrink the comparison below the 64-step floor; a smaller request is raised to the floor, a larger one is honored"
    - "Both formats are driven through the SAME cache path production uses, so a KV-cache indexing or write defect is inside the system under test rather than bypassed by re-prefilling"
    - "Teacher forcing keeps both sides on one shared sequence: without it the first disagreement would put the two formats on different sequences and every later step would compare unrelated distributions"
    - "A top-1 disagreement whose logit vectors are cosine >= 0.98 is a floating-point near-tie, not a structural divergence, and is exempted - without this the gate flakes on tied logits while proving nothing about the cache"
    - "A structural divergence FAILs the gate and names the step, so the failure is actionable"

  json_validity:
    formula: |
      forall cmd in JSON_COMMANDS:
        apr cmd --json model | jq . exits 0
    domain: "commands that support --json flag"
    codomain: bool
    invariants:
    - "JSON output is valid (parseable by jq)"
    - "No f32 precision artifacts (0.999999761...)"
    - "No NaN or Inf values in output"

  flag_materiality:
    formula: |
      forall flag in MATERIAL_FLAGS:
        diff(apr cmd model, apr cmd --flag model) is non-empty
    domain: "flags that should change output"
    codomain: bool
    invariants:
    - "No silent flag no-ops"
    - "--json changes output format"
    - "--verbose adds detail"
    - "--quiet reduces output"

  exit_code_honesty:
    formula: |
      forall cmd:
        (stderr contains "error" or "FAIL") implies exit_code != 0
    domain: "all command invocations"
    codomain: bool
    invariants:
    - "No exit-code lies (error message with exit 0)"

  cross_subcommand_consistency:
    formula: |
      forall model M:
        apr inspect --json M .architecture ==
        apr check M .architecture ==
        apr oracle --json M .architecture
    domain: "model metadata across commands"
    codomain: bool
    invariants:
    - "Architecture/family reported consistently across subcommands"

  nan_inf_absence:
    formula: |
      forall cmd, forall model M:
        apr cmd M stdout does NOT contain NaN, nan, Inf, -Inf
    domain: "all command outputs"
    codomain: bool
    invariants:
    - "No numerical garbage in user-facing output"

  version_sanity:
    formula: |
      apr --version matches pattern "apr X.Y.Z (HASH)"
      where HASH == git rev-parse --short HEAD
    domain: "version string"
    codomain: bool

  no_phantom_subcommands:
    formula: |
      forall cmd in (apr --help subcommands):
        apr cmd --help does NOT contain "not yet implemented"
    domain: "advertised subcommands"
    codomain: bool

  cache_integrity:
    formula: |
      apr pull M -> apr list contains M -> apr rm M -> apr list does NOT contain M
    domain: "model cache state machine"
    codomain: bool

falsification_tests:
- id: FALSIFY-QA-001
  rule: all 58 commands respond to --help
  prediction: "every registered command exits 0 on --help"
  test: "cargo test -p apr-cli --test cli_commands"
  if_fails: "phantom subcommand or broken dispatch"

- id: FALSIFY-QA-002
  rule: missing model exits non-zero
  prediction: "apr inspect /nonexistent exits 1"
  test: "apr inspect /nonexistent/model.gguf; test $? -ne 0"
  if_fails: "missing file not detected"

- id: FALSIFY-QA-003
  rule: json output is valid
  prediction: "apr inspect --json model | jq . exits 0"
  test: "apr inspect --json ~/models/*.gguf | jq . > /dev/null"
  if_fails: "invalid JSON emitted"

- id: FALSIFY-QA-004
  rule: no NaN in output
  prediction: "no command emits NaN or Inf"
  test: "apr run model 'test' --max-tokens 8 2>&1 | grep -qE 'NaN|Inf' && exit 1 || exit 0"
  if_fails: "numerical garbage in user output"

- id: FALSIFY-QA-005
  rule: version matches HEAD
  prediction: "apr --version contains current git hash"
  test: "apr --version | grep -q $(git rev-parse --short HEAD)"
  if_fails: "stale binary installed"

- id: FALSIFY-QA-006
  rule: exit code honesty
  prediction: "error output implies non-zero exit"
  test: "apr validate /nonexistent; test $? -ne 0"
  if_fails: "exit-code lie"

- id: FALSIFY-QA-007
  rule: --json flag changes output
  prediction: "json output differs from default"
  test: "diff <(apr inspect model) <(apr inspect --json model) | grep -q ."
  if_fails: "--json flag is a no-op"

- id: FALSIFY-QA-008
  rule: no phantom subcommands
  prediction: "all advertised commands have real implementations"
  test: "apr --help | awk '/^  [a-z]/{print $1}' | while read c; do apr $c --help >/dev/null 2>&1 || echo PHANTOM:$c; done | grep -q PHANTOM && exit 1 || exit 0"
  if_fails: "subcommand listed but not implemented"

- id: FALSIFY-QA-009
  rule: 3-format coverage
  prediction: "inspect works on GGUF, APR, and SafeTensors"
  test: "apr inspect model.gguf && apr inspect model.apr && apr inspect model.safetensors"
  if_fails: "format not supported"

- id: FALSIFY-QA-010
  rule: cross-subcommand architecture consistency
  prediction: "inspect and check report same architecture"
  test: "diff <(apr inspect --json M | jq .architecture) <(apr check M 2>&1 | grep -i arch)"
  if_fails: "architecture disagrees across subcommands"

- id: FALSIFY-QA-011
  rule: format_parity skips on missing reference (PMAT-815)
  prediction: "apr qa on a GGUF with no SafeTensors reference SKIPs format_parity, never FAILs"
  test: "cargo test -p apr-cli --lib resolve_safetensors_absent_reference_skips_not_fails"
  if_fails: "missing optional reference hard-FAILs the gate (a diagnostic must not fail on an absent comparison input — PMAT-743 class)"

- id: FALSIFY-QA-012
  rule: format_parity SKIP must not mask a real divergence (PMAT-815)
  prediction: "an explicit --safetensors-path is honored verbatim so a present-but-diverging reference still reaches FAIL"
  test: "cargo test -p apr-cli --lib resolve_safetensors_explicit_path_is_honored_not_skipped"
  if_fails: "the absent-reference SKIP swallowed a real format divergence"

- id: FALSIFY-QA-013
  rule: "format_parity compares at least 64 DECODE steps, not one prefill argmax (PMAT-QA-FMTPARITY-DECODE-001)"
  prediction: "the decode floor is >= 64 and --max-tokens cannot lower it"
  test: "cargo test -p apr-cli --lib -- format_parity_decode_floor_is_at_least_64_steps max_tokens_cannot_shrink_decode_below_the_floor"
  if_fails: "the gate has reverted to the single-forward shape - a cached-decode divergence at step 32 becomes invisible again while the gate still reports itself as cross-format parity"

- id: FALSIFY-QA-014
  rule: "a divergence appearing only after many decode steps FAILs the gate (PMAT-QA-FMTPARITY-DECODE-001)"
  prediction: "a report whose first divergence is at step 32 yields passed=false, skipped=false, and a message naming the step"
  test: "cargo test -p apr-cli --lib -- decode_parity_late_divergence_fails_the_gate decode_parity_all_steps_agreed_passes decode_parity_near_ties_do_not_fail_the_gate"
  if_fails: "late divergence is swallowed - exactly the class (PMAT-810 batched-prefill decode corruption, GH-1864) the gate exists to catch"

proof_obligations:
- type: invariant
  property: "all 58 commands exit 0 on --help"
- type: invariant
  property: "missing model produces non-zero exit code"
- type: invariant
  property: "JSON output is always valid"
- type: invariant
  property: "format_parity SKIPs on a genuinely absent SafeTensors reference, FAILs on a present-but-diverging one (PMAT-815)"
- type: invariant
  property: "format_parity compares >= 64 greedy decode steps through the production cache path, teacher-forced, with a cosine >= 0.98 near-tie exemption (PMAT-QA-FMTPARITY-DECODE-001)"

kani_harnesses:
- id: KH-QA-001
  obligation: help_universality
  property: all_commands_respond_to_help
  bound: 4

verification_summary:
  total_obligations: 11
  proven: 0
  tested: 11
  status: tested
