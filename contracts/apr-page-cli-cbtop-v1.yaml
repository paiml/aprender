metadata:
  version: 1.0.0
  kind: schema
  description: |
    PCU (Page Content Unit) contract for book/src/cli/cbtop.md (apr cbtop CLI reference).
    Enforces: page exists, references the command, has a runnable example.
  references:
    - "docs/specifications/book-completeness-spec.md"

equations:
  pcu_header_present:
    formula: "file_contains(book/src/cli/cbtop.md, 'PCU: cli-cbtop')"
  command_mentioned:
    formula: "file_contains(book/src/cli/cbtop.md, 'apr cbtop')"
  example_block_present:
    formula: "file_contains_fenced(book/src/cli/cbtop.md, language='bash')"

falsification_tests:
  - id: FALSIFY-PAGE-CLI-CBTOP-001
    name: stub_exists
    prediction: "book/src/cli/cbtop.md exists on disk"
    test_harness: "test -f book/src/cli/cbtop.md"
    expected_output: "exit 0"
    if_fails: "Run scripts/gen-cli-chapter-stubs.sh to regenerate."

  - id: FALSIFY-PAGE-CLI-CBTOP-002
    name: command_mentioned
    prediction: "page references the command at least once"
    test_harness: "grep -q 'apr cbtop' book/src/cli/cbtop.md"
    expected_output: "exit 0"
    if_fails: "Add a mention of `apr cbtop` to the chapter."

  - id: FALSIFY-PAGE-CLI-CBTOP-003
    name: runnable_example
    prediction: "page has at least one ```bash code block"
    test_harness: "grep -c '^```bash' book/src/cli/cbtop.md"
    expected_output: "stdout >= 1"
    if_fails: "Add a ```bash code block with a runnable example."

  - id: FALSIFY-PAGE-CLI-CBTOP-004
    name: brick_score_curve_and_average
    prediction: "score_brick maps gap 1.0->100, 1.1->95, 1.2->90, 1.5->50, >=2.0->0 (budget 0 -> 100) and weighted_brick_score is the truncated equal-weight mean (empty -> 0)"
    test_harness: "cargo test -p apr-cli --lib -- score_brick weighted_brick_score"
    expected_output: "exit 0"
    if_fails: "A scoring slope, clamp or truncation in cbtop_get_cpu_memory.rs changed; fix the code or the pinned table in cbtop_score_brick_tests.rs."

  - id: FALSIFY-PAGE-CLI-CBTOP-005
    name: brick_sample_statistics
    prediction: "cv_percent_from_samples is 0 for empty/single/non-positive-mean input and uses the sample (n-1) stdev; percentiles_from_brick returns (sorted[n/2], sorted[floor(n*0.99)]) on unsorted input, (0,0) when empty, and neither panics on NaN"
    test_harness: "cargo test -p apr-cli --lib -- cv_percent_from_samples percentiles_from_brick"
    expected_output: "exit 0"
    if_fails: "Variance divisor or percentile indexing in cbtop_get_cpu_memory.rs changed; fix the code or the pinned cases in cbtop_stats_helper_tests.rs."
