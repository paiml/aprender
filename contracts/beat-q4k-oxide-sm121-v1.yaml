contract: beat-q4k-oxide-sm121
metadata:
  kind: beat-benchmark
  version: "1.0.0"
  description: >
    Pillar-4 BEAT benchmark: the cuda-oxide pre-generated Q4K dequant-matvec PTX
    backend must run at least 1.25x the throughput of the existing hand-PTX
    TiledQ4KGemv path on Blackwell sm_121 (GB10), at bit-exact-within-Q4K-eps
    parity. The oxide PTX is a standalone .target sm_121 asset embedded in
    aprender-serve and loaded via the existing CudaModule::from_ptx path — no
    cuda-oxide build dependency. It also sidesteps the GH-480 sm_121 JIT
    backward-branch workaround. Gated off by default (env APR_Q4K_OXIDE=1 +
    cc>=120); sm_89 falls back to TiledQ4KGemv unchanged.
  references:
  - "docs/specifications/cuda-oxide-q4k-backend-promotion-DRAFT.md"
  - "crates/aprender-serve/tests/q4k_gemv_oxide_parity.rs"
  - "crates/aprender-serve/src/cuda/ptx/q4k_matvec_oxide.sm121.ptx"
  - "crates/aprender-contracts-staging/contracts/legacy/q4k-cross-backend-parity-v1.yaml"
version: 1
status: enforced
date: 2026-06-15

# Beat-benchmark parameters (machine-pinned baseline; gx10-manual gate).
# Runs only where the cuda-oxide asset is applicable: gx10 GB10 Blackwell sm_121.
#
# MEASURED 2026-06-15 on gx10 (GB10, cc=121, driver 590.48.01, CUDA 13.0),
# median of 7 batches x 200 launches after 50-launch warmup, weights cached on
# GPU + input device-resident (pure launch timing on the production async path):
#   * FFN-class  N=1536 K=8960 : oxide ~2.0x tiled  (159.7us vs 319.2us/launch) -> BEAT
#   * attn-class N=4096 K=2048 : oxide ~0.95x tiled (101.9us vs  97.7us/launch) -> NO BEAT
# The beat is SHAPE-DEPENDENT: oxide's fixed 32-threads/row reduction wins on
# large-K GEMVs (FFN down/up/gate) but LOSES the tiled shared-memory kernel on
# small-K/large-N GEMVs (attention q/k/v/o). The contract is therefore SCOPED to
# the large-K FFN-class shape where >=1.25x holds. See `shape_dependence` below.
beat:
  pillar: 4
  incumbent: ollama
  incumbent_pinned: >
    Pillar-4 (ollama) decode-throughput beat on Blackwell. The concrete CI
    sub-metric pins the in-tree incumbent kernel: aprender hand-PTX
    TiledQ4KGemv at HEAD, sm_121 cubin via CudaModule::from_ptx. Beating the
    tiled Q4K GEMV on the decode hot path is the mechanism that advances the
    apr-vs-ollama Blackwell throughput beat.
  canonical_task: >
    Single-token Q4K GEMV (M=1 decode hot path) at the FFN-class decode shape
    N=1536 K=8960 (qwen2.5-coder-1.5b down/up/gate projection class), measured on
    gx10 (GB10 Blackwell sm_121). Same cached weights + same device-resident
    input fed to both the oxide q4k_matvec kernel and the incumbent TiledQ4KGemv
    hand-PTX kernel via the production async path q4k_gemv_cached_async
    (apples-to-apples, pure launch timing). Speedup ratio is tiled_ms / oxide_ms,
    median of 7 batches x 200 launches after warmup. The FFN GEMVs dominate the
    per-token cost, so a >=1.25x kernel speedup here directly raises apr's decode
    tok/s toward beating ollama on Blackwell. NOTE: the beat does NOT generalize
    to attention-class (small-K/large-N) GEMVs -- see `shape_dependence`.
  metric: speedup_vs_tiled
  direction: higher_is_better
  baseline_value: 1.00        # incumbent tiled Q4K GEMV path (ratio == 1.0)
  baseline_floor: 1.00        # tiled never beats itself
  beat_threshold: 1.25        # oxide must reach >= 1.25x tiled on sm_121
  baseline_sourced_date: "2026-06-15"
  approved_compute: GPU       # one of: CPU | GPU (PMAT-741 supports both)
  ci_gate_name: "beat_q4k_oxide_sm121"   # the gate that enforces this on gx10

# Correctness precondition for the beat: the oxide path is only valid if it
# matches both the tiled hand-PTX and the CPU reference within the Q4K epsilon
# band. A faster-but-wrong kernel does NOT count as a beat.
parity:
  reference: "crates/aprender-serve/tests/q4k_gemv_oxide_parity.rs"
  epsilon_formula: "|dot_oxide - dot_ref| < sqrt(K) * 2^-23 * |dot_ref|"
  three_way: "oxide-PTX ~= TiledQ4KGemv ~= CPU fused_q4k_parallel_matvec"
  rel_err_max: 0.01           # 1% Q4K element-wise tolerance vs CPU/tiled

# Measured per-shape speedup (oxide / tiled), gx10 GB10 sm_121, 2026-06-15.
# This is the EMPIRICAL scope of the beat: it is real and large at FFN shapes,
# absent at attention shapes. Do NOT claim a blanket "oxide beats tiled" -- the
# throughput gate (q4k_gemv_oxide_throughput.rs) falsified that.
shape_dependence:
  measured_host: "gx10 (GB10 Blackwell, cc=121, driver 590.48.01, CUDA 13.0)"
  method: "median of 7 batches x 200 async launches after 50 warmup, weights cached + input device-resident"
  shapes:
  - name: ffn
    out_dim: 1536        # N
    in_dim: 8960         # K
    oxide_us_per_launch: 159.7
    tiled_us_per_launch: 319.2
    speedup: 2.00        # oxide >= 1.25x tiled -> BEAT (this is the enforced gate)
    verdict: beat
  - name: attn
    out_dim: 4096        # N
    in_dim: 2048         # K
    oxide_us_per_launch: 101.9
    tiled_us_per_launch: 97.7
    speedup: 0.95        # oxide SLOWER than tiled -> NO BEAT (kernel must shape-gate)
    verdict: no_beat
  follow_up: >
    The opt-in oxide dispatch (try_q4k_gemv_oxide_async) should additionally
    shape-gate on K so production decode only routes large-K GEMVs to oxide and
    keeps TiledQ4KGemv for small-K attention projections. Until then the
    APR_Q4K_OXIDE=1 path is a net regression on attention-heavy layers.

# CI gating: there is NO sm_121 GitHub Actions runner (the [self-hosted, gpu]
# label maps to the sm_89 RTX 4090, where the .target sm_121 asset cannot load
# and the test SKIPs). This beat is therefore a GX10-MANUAL gate. The throughput
# test is #[ignore]'d + cc>=120-gated so it never false-greens on non-Blackwell
# CI; it is invoked by hand on gx10 via the falsification command below.
ci_gating:
  mode: gx10-manual
  reason: >
    No sm_121 self-hosted Actions runner exists; the oxide PTX asset is
    .target sm_121 and only loads on Blackwell sm_120+. On the sm_89 GPU runner
    the test SKIPs (cc<120). Run manually on gx10 (ssh gx10) until a Blackwell
    runner is registered.
  enabling_env: |
    export PATH="$HOME/.cargo/bin:/usr/lib/llvm-21/bin:/usr/local/cuda/bin:$PATH"
    export LLVM_SYS_211_PREFIX=/usr/lib/llvm-21
    export LD_LIBRARY_PATH=/usr/local/cuda/lib64

falsification_tests:
- id: FALSIFY-BEAT-Q4K-OXIDE-SM121
  description: >
    The beat is FALSE if the cuda-oxide Q4K matvec is not at least 1.25x the
    incumbent TiledQ4KGemv at the canonical FFN-class shape (N=1536, K=8960) on
    Blackwell sm_121. The test (q4k_gemv_oxide_throughput.rs) panics with the
    measured tiled_ms / oxide_ms speedup, so a kernel regression (or a tiled
    speedup that erodes the margin) is caught. cc>=120-gated: SKIPs (passes
    vacuously) on sm_89, so it is CI-safe but only ENFORCED on gx10.
  command: >
    ssh gx10 'set -e;
    export PATH="$HOME/.cargo/bin:/usr/lib/llvm-21/bin:/usr/local/cuda/bin:$PATH";
    export LLVM_SYS_211_PREFIX=/usr/lib/llvm-21;
    export LD_LIBRARY_PATH=/usr/local/cuda/lib64;
    export CARGO_TARGET_DIR="$HOME/src/aprender/target";
    cd "$HOME/src/aprender";
    git fetch -q origin chore/q4k-oxide-throughput-gate-pmat734;
    git worktree add -f /tmp/q4k-oxide-wt origin/chore/q4k-oxide-throughput-gate-pmat734 2>/dev/null || true;
    cd /tmp/q4k-oxide-wt;
    git reset -q --hard origin/chore/q4k-oxide-throughput-gate-pmat734;
    cargo test -p aprender-serve --features cuda --lib
    beat_q4k_oxide_sm121_ffn_1536x8960 -- --ignored --nocapture --test-threads=1'
  expected: "oxide_ms <= tiled_ms / 1.25 (oxide >= 1.25x tiled); measured ~2.0x on gx10 2026-06-15"
  if_fails: >
    The oxide Q4K kernel lost its FFN-shape advantage, or TiledQ4KGemv was sped
    up enough to erode the >=1.25x margin. Inspect q4k_gemv_oxide_async_inner and
    the embedded q4k_matvec_oxide.sm121.ptx asset in crates/aprender-serve.
- id: FALSIFY-BEAT-Q4K-OXIDE-SM121-NO-UNIVERSAL-CLAIM
  description: >
    Documents the KNOWN non-beat at the attention-class shape (N=4096, K=2048):
    oxide measured ~0.95x tiled (SLOWER) on gx10 2026-06-15. This shape is
    intentionally NOT part of the enforced beat; the test
    no_beat_q4k_oxide_sm121_attn_4096x2048_tripwire records it and PASSES
    today as a tripwire against re-asserting a blanket sm_121 win without a
    shape-gated dispatch.
  command: >
    ssh gx10 'set -e;
    export PATH="$HOME/.cargo/bin:/usr/lib/llvm-21/bin:/usr/local/cuda/bin:$PATH";
    export LLVM_SYS_211_PREFIX=/usr/lib/llvm-21;
    export LD_LIBRARY_PATH=/usr/local/cuda/lib64;
    export CARGO_TARGET_DIR="$HOME/src/aprender/target";
    cd /tmp/q4k-oxide-wt 2>/dev/null || (cd "$HOME/src/aprender" &&
    git worktree add -f /tmp/q4k-oxide-wt origin/chore/q4k-oxide-throughput-gate-pmat734 && cd /tmp/q4k-oxide-wt);
    cargo test -p aprender-serve --features cuda --lib
    no_beat_q4k_oxide_sm121_attn_4096x2048_tripwire -- --ignored --nocapture --test-threads=1'
  expected: "KNOWN no_beat: oxide ~0.95x tiled at K=2048 -> shape-gate before claiming a universal beat"
  if_fails: >
    If this shape ever PASSES, the oxide kernel improved at small-K -- promote
    attn-class into the enforced canonical_task and shape_dependence verdict.
