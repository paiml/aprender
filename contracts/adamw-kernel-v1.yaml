qa_gate:
  id: F-AW-001
  name: AdamW Contract
  description: Decoupled weight decay optimizer quality gate
  checks:
  - decoupled_decay
  - moment_positivity
  - update_finiteness
  - simd_equivalence
  pass_criteria: All 11 falsification tests pass + Kani harnesses verify
  falsification: Move weight decay inside gradient (L2 instead of decoupled)
