# ──────────────────────────────────────────────
# bin-aprender-orchestrate--aprender-orchestrate-v1 — the `aprender-orchestrate` bin target of package
# aprender-orchestrate (ONT-10 slices S4 CLI+MCP and S3 HTTP routes, folded into one node)
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha256, helpSha256,
# gitSha, …) live in binary-surface-v1 and are not restated.
#
# ONE SHAPE, THREE KINDS: `in` + minCount + maxCount is set equality over the whole node, and pv's shapes subset
# refuses qualifiedValueShape, so S3's routes cannot sit in a second file. They are properties of the one shape
# below. S3's staged draft (docs/ont-10/binary-contracts/binary-aprender-orchestrate-http-v1.yaml) is superseded.
#
# MEASURED (2026-09-26, batch/ont-10 @ b1cd8c0b0 / ff9587b59, release build, default features):
#   `aprender-orchestrate --version` = "batuta 0.69.3": the pre-monorepo name, no sha. LIVE RED on the name
#   pattern and on G0.1 (warning).
#   Recursive --help walk: 86 leaf commands, set-equal to surface_audit.csv's 86 CLI rows.
#   MCP: `aprender-orchestrate mcp` (stdio) answers tools/list with 4 tools (hf_info, hf_integration, hf_search,
#   hf_tree; server "batuta-hf"). LIVE RED: none has a ledger row, and the ledger's 6 `mcp:*` rows (calculator,
#   code_execution, web_search from banco's POST /api/v1/mcp; compute, memory, rag from the agent registry) are not
#   tools/list tools. Those 6 are reachable only over HTTP or an agent session.
#   HTTP (aprender-1c, S3): crates/aprender-orchestrate/src/serve/banco/router.rs mounts 92 (METHOD, /path) pairs via
#   .route(), with no .nest/.merge/.route_service/.fallback under serve/. That set equals the ledger's 92 HTTP rows.
#   EXTRACT GAP, LIVE RED: scripts/dogfood_surfaces.sh reads only aprender-serve routes, so bin:route is empty on
#   this node until extract:binary reads the banco router. minCount 92 makes that a Fail, never a vacuous pass.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-orchestrate--aprender-orchestrate-v1
version: "1.0.0"
scope: >
  The surface of the `aprender-orchestrate` binary of package aprender-orchestrate (src crates/aprender-orchestrate/src/main.rs):
  its version string, its exact CLI command set, the tools its MCP server lists, the HTTP routes its banco server
  mounts, and the surface-audit rows for each. Out of scope: what each command, tool or route computes.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    aprender-orchestrate names itself and the commit it was built from, exposes exactly the 86 commands, 4 MCP
    tools and 92 HTTP routes the snapshot records, and has an audited ledger row for each.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'contracts/bin-aprender-contracts-cli--pv-v1.yaml — the exemplar'
    - 'crates/aprender-orchestrate/src/serve/banco/router.rs — the route table'
    - 'docs/audits/surface_audit.csv — the rows whose binary column is aprender-orchestrate'
    - 'aprender#4502 — ONT-10, slices S3/S4'

entity:
  type: binary
  ref: binary/aprender-orchestrate/aprender-orchestrate

relations:
  depends_on: [binary-surface-v1]

