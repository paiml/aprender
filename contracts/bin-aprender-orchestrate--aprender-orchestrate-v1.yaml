equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(aprender-orchestrate)) = C, |C| = 86, C = leaves(--help walk) ∧ tools(mcp tools/list) = T, |T| = 4 ∧ routes(banco router) = R, |R| = 92 ∧ C ∪ T ∪ R = {feature(f) : f ∈ surface_audit, f.binary = aprender-orchestrate}"
    domain: "the aprender-orchestrate line of the tracked snapshot and the ledger rows with binary = aprender-orchestrate (86 CLI + 92 HTTP + 6 mcp rows on 2026-09-26)"
    codomain: "set equality per kind, or a Fail naming each member of the symmetric difference"
    invariants:
      - "in + minCount + maxCount over distinct literals is set equality: an added, dropped or renamed command, tool or route is a violation naming it"
      - "one path served under two methods is two bin:route literals, `METHOD /path`, axum :param segments verbatim"
      - "a CLI row joins C, a row whose feature starts with an HTTP method joins R, an mcp row joins T: no row is judged twice"
    preconditions:
      - "the snapshot was written at this commit, default features"
    postconditions:
      - "an empty bin:route is a minCount Fail, never a pass over an empty set"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-APRENDER-ORCHESTRATE-INV-001
    property: every aprender-orchestrate command, MCP tool and route has an audited ledger row, and every ledger row names one
    formal: '∀ s ∈ C ∪ T ∪ R: ∃ r ∈ surface_audit : r.binary = aprender-orchestrate ∧ feature(r) = s; ∀ r with r.binary = aprender-orchestrate: feature(r) ∈ C ∪ T ∪ R'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-APRENDER-ORCHESTRATE-001
    rule: 'G1.2 help answers'
    prediction: '`aprender-orchestrate --help` exits 0 with non-empty stdout'
    test: 'scripts/dogfood_surfaces.sh --cli aprender-orchestrate'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-26: exit 0, GREEN)'
    mutation: 'make the top-level --help return an error; must turn RED'
  - id: FALSIFY-BIN-APRENDER-ORCHESTRATE-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`aprender-orchestrate --no-such-flag` exits 2'
    test: 'scripts/dogfood_surfaces.sh --cli aprender-orchestrate'
    if_fails: 'a typo is silently ignored'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-APRENDER-ORCHESTRATE-003
    rule: 'G0.1 the version names the binary and the commit'
    prediction: '`aprender-orchestrate --version` starts with "aprender-orchestrate x.y.z" and contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'LIVE RED 2026-09-26: "batuta 0.69.3" — the pre-monorepo name and no sha; a stale aprender-orchestrate reads as HEAD'
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-APRENDER-ORCHESTRATE-004
    rule: 'G1.3/G1.4 the command, tool and route sets equal the snapshot'
    prediction: 'commands(snapshot) = the 86 literals above; tools/list = the 4; routes = the 92'
    test: 'NOT YET WRITTEN — pv lint contracts/ --gate shapes on the snapshot, after extract:binary (ONT-4g) reads tools/list and the banco router'
    if_fails: 'LIVE RED 2026-09-26: bin:route is empty (extract gap), so minCount 92 fails; a command could vanish with the ontology green if the walk were not pinned'
    mutation: 'remove `stack gate` from the snapshot, or DELETE /api/delete from the routes; must turn RED naming it on bin:command/bin:route and on the orphan property'
  - id: FALSIFY-BIN-APRENDER-ORCHESTRATE-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has a row per command, tool and route with binary = aprender-orchestrate'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'LIVE RED 2026-09-26: 4 MCP tools unledgered (hf_info, hf_integration, hf_search, hf_tree); 6 mcp:* rows name banco/agent tools that tools/list does not list'
    mutation: 'delete every aprender-orchestrate row; must turn RED naming aprender-orchestrate'
