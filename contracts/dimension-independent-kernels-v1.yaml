name: dimension-independent-kernels
version: "1.0.0"
scope: "crates/aprender-compute/src/backends/gpu/"

description: |
  CUDA kernels parameterized by M,K,N at runtime instead of compile-time specialization. Reduces kernel variants from 50+ to ~15 types.

equations:
