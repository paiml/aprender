    description: "∀ M,K,N: dim_independent_output == specialized_output within ε"
    formula: "∀ M,K,N: dim_independent_output == specialized_output within ε"

  no_recompilation:
    description: "kernel binary loaded once, M/K/N passed as launch params"
    formula: "kernel binary loaded once, M/K/N passed as launch params"

