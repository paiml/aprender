  kind: schema
  version: 1.8.0
  status: FUNCTIONAL
  created: '2026-05-04'
  updated: '2026-05-09'
  author: PAIML Engineering
  registry: true
  changelog:
  - version: 1.8.0
    date: '2026-05-09'
    change: |
      v1.7.0 → v1.8.0 — populate-coverage gap closed.

      §59 spec amendment (forthcoming) records that the 5g.2 LIVE
      smoke (PR #1577) produced val_loss=0.0008, implausibly low.
      Investigation surfaced root cause: `MultiHeadAttention::new`
      hardcoded `b_q/b_k/b_v: None` regardless of `config.use_bias`,
      so `Transformer::new(qwen2_0_5b())` had ZERO Q/K/V biases —
      24 × 3 = 72 missing tensors per canonical Qwen 0.5B HF count
      of 290. `populate_trainer_from_init_tensors` then iterated
      only over `transformer.named_parameters()` (218 entries),
      silently dropping the 72 init biases (per the "extras silently
      ignored" rule that exists for tied weights).

      The forward pass at attention.rs:388-395 ALREADY honored
      `Option<Tensor>` biases — the gap was solely in the
      constructor.

      WHY DID PROVABLE-CONTRACTS NOT CATCH THIS? Existing falsifiers:
        FALSIFY-001 — qwen2_0_5b config FIELD VALUES match HF ✓
        FALSIFY-INIT-007 — populate Errs on missing model params ✓
      Both PASSED. Neither observed the gap (FALSIFY-001 checked
      config fields, not constructor outputs; FALSIFY-INIT-007
      passed because 218 model params ⊆ 290 init keys, but did
      NOT check that ALL 290 init keys were consumed).

      Provable-contracts only enforce invariants you express. A
      hardcoded value is "allowed" iff no falsifier observes it.
      v1.8.0 closes the gap with two new falsifiers (RED-then-GREEN):

        FALSIFY-APR-PRETRAIN-INIT-POPULATE-COVERAGE-001 — counts
          named_parameters() (must equal 290 = 2 + 24×12 for Qwen 0.5B).
        FALSIFY-APR-PRETRAIN-INIT-POPULATE-COVERAGE-002 — names
          q_proj.bias / k_proj.bias / v_proj.bias for each layer
          when config.use_bias is true.

      Fix:
        - MultiHeadAttention::new allocates b_q/b_k/b_v as zero
          tensors when config.use_bias (HF Linear bias=True init
          convention).
        - MultiHeadAttention::set_named_parameter routes the bias
          suffixes to b_q/b_k/b_v fields, returning false when None
          (keeps populate honest for use_bias=false configs).

      LIVE EVIDENCE on RTX 4090 (1-step CUDA smoke):
        Pre-fix:  step-0 train_loss=0.0019, val_loss=0.0008 (degenerate)
        Post-fix: step-0 train_loss=2.24, val_loss=0.628, grad_norm=14.81
                  (PLAUSIBLE for Qwen 0.5B on Python; industry baseline ~2-3)
      1000× train_loss shift confirms H2 was the dominant defect.

      Encoder block test (codebert): parameters() count 12 → 15
      (+3 q/k/v biases per layer). Pre-fix 12 was itself reflecting
      the bug — encoder Q/K/V biases would have silently dropped
      on any HF BERT/RoBERTa init.

      Verified:
        - cargo test -p aprender-train --lib falsify_qwen2_0_5b: 3/3 PASS
        - cargo test -p aprender-train --lib: 7584/7584 PASS
        - LIVE 1-step CUDA smoke train_loss=2.24 (was 0.0019)
        - pv validate: 0 errors

      Out-of-scope follow-ups (own falsifier-discharge cascades):
        - H1: CudaTransformerTrainer::eval_batch CPU-vs-CUDA parity
          (val_loss=0.628 still low; secondary defect tracked
          separately).
        - 500-step LIVE re-dispatch with this fix to flip MODEL-2
          ship % 57% → ≥58% honestly.
  - version: 1.7.0
    date: '2026-05-09'
    change: |
      v1.6.0 → v1.7.0 — §50.4 step 5f.5 SHIPPED. CUDA `--init` wireup
      is now symmetric to the CPU path.

      Wireup landed via PMAT-CODE-PRETRAIN-INIT-CUDA-WIREUP-001:
        - New: `entrenar::train::pretrain_real_cuda::build_shared_cuda_trainer_with_init`
          (~80 LOC, mirrors CPU `build_shared_trainer_with_init`).
        - Composes the SAME §50.4 step-5f machinery through both backends:
            5c:    build_transformer_config(init_arch)
            5f.1:  validate_pretrain_init_arch_compatible(init_arch) — encoder rejection
            5f.2:  load_init_tensors_from_apr(path) — read APR weights
            5f.3:  populate_trainer_from_init_tensors(transformer, &tensors) — populate CPU model
            5f.5:  CudaTransformerTrainer::with_model uploads populated blocks
                   / final_norm / lm_head / embed_tokens to GPU.
        - The §50.4 step 5f.1/5f.2/5f.3 helpers are reused VERBATIM —
          population semantics are identical between backends.
        - apr-cli `drive_real_cuda` now accepts `init_arch: Option<&TransformerConfig>`
          + `init_path: Option<&Path>` and routes through the new builder
          when either is `Some`. Both-`Some` and both-`None` are valid;
          mixed is a caller-bug fail-fast (FALSIFY-APR-PRETRAIN-INIT-CUDA-002).
        - INV-ARCH-370M-001 param-count band check is preserved on the
          from-scratch CUDA path (init=None branch); skipped on the
          polymorphic path (consistent with CPU semantic).

      FALSIFY-APR-PRETRAIN-INIT-CUDA-001 SEMANTIC FLIP:
        v1.4.0..v1.6.0: "CUDA + --init MUST fail-fast with the
                         pre-5f.5 not-yet-wired error"
        v1.7.0:         "CUDA + --init MUST be wired via
                         build_shared_cuda_trainer_with_init"
      The `pub(crate) const FALSIFY_APR_PRETRAIN_INIT_CUDA_001_MSG`
      survives but is repurposed as a drift-prevention sentinel — its
      payload now reads "is wired for --device cuda via
      build_shared_cuda_trainer_with_init (5f.5 SHIPPED)" so a future
      regression that re-introduces a fail-fast on this path fires the
      sentinel test before the contract reference goes stale.

      Two new falsifiers bind the new builder's invariants:
        FALSIFY-APR-PRETRAIN-INIT-CUDA-002 — paired-args invariant
        FALSIFY-APR-PRETRAIN-INIT-CUDA-003 — encoder family rejection

      Both new falsifiers fire WITHOUT a CUDA runtime — the args
      check and encoder rejection both happen before any GPU
      allocation, so they exercise on any host even when CUDA is
      unavailable. This matches the CPU sibling tests
      `build_shared_trainer_with_init_rejects_unpaired_args` and
      `build_shared_trainer_with_init_rejects_encoder_family`.

      Discharge consequence: §50.4 cascade now COMPLETE (5a-5f.5 all
      shipped). The next step in the SHIP-TWO MODEL-2 critical path
      is 5g.2 — LIVE 500-step fine-tune dispatch on Qwen 0.5B init +
      5g.1 corpus + RTX 4090. Per `contracts/apr-pretrain-init-finetune-v1.yaml`
      v1.0.0 (PMAT-CODE-PRETRAIN-INIT-FINETUNE-001 PR #1576), the
      dispatch's val_loss < 9.38 verdict flips MODEL-2 ship %
      57% → ≥58%.

      Verified locally (commit on feat/apr-pretrain-init-cuda-wireup-5f5):
        - cargo test -p aprender-train --features cuda --lib build_shared_cuda_trainer_with_init: 2/2 PASS
        - cargo test -p apr-cli --features training --lib drive_real_cuda_init_path_wireup_sentinel_pinned: 1/1 PASS
        - cargo check -p apr-cli --features training: clean
        - cargo check -p apr-cli --features training,cuda: clean
        - pv validate contracts/apr-pretrain-arch-polymorphic-v1.yaml: 0 errors
