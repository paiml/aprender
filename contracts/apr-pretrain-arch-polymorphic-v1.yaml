  description: >
    Contract pinning the architecture-extraction algorithm for the
    pretrained-init MODEL-2 path. Per §50, the existing pretrain trainer
    HARDCODES every architectural constant from `Llama370MConfig` —
    making it impossible to fine-tune from a Qwen2.5-class checkpoint
    that has different (vocab, hidden, heads, kv_heads, ffn, rope_theta)
    shape. This contract specifies the polymorphic builder that derives
    `TransformerConfig` from the init APR file's metadata when `--init
    <PATH>` is set, and falls back to `Llama370MConfig` (the §24/§25
    from-scratch baseline) when `--init` is absent. It also pins the
    Qwen-tokenizer compatibility surface and the GQA-7:1 forward-pass
    invariants that the existing GQA-4:1 (Llama370M) code did not
    exercise. Together, this contract + sibling apr-pretrain-from-init-v1
    discharge §50.4's step-5 architecture-mismatch class.

equations:
  arch_extraction_signature:
    formula: |
      `pretrain_real::build_transformer_config(init: Option<&InitArch>)
      -> TransformerConfig` MUST satisfy:
        init = None  → return TransformerConfig::from(Llama370MConfig::*)
                       (existing from-scratch baseline; §24/§25 evidence preserved)
        init = Some  → return TransformerConfig derived from the init APR
                       file's header metadata, NOT from Llama370MConfig
      The derivation MUST extract exactly these 7 fields from the APR
      file's metadata block (no defaults, no inference):
        - vocab_size, hidden_size, num_attention_heads, num_kv_heads,
        - intermediate_size, num_hidden_layers, max_position_embeddings.
      Plus 3 architecture-family fields:
        - rope_theta, rms_norm_eps, tie_word_embeddings.
      Architecture family (decoder/encoder) is fixed to decoder for the
      §49 use case (Qwen2.5/Llama-class causal LMs).
    domain: pretrain trainer build boundary
    codomain: TransformerConfig
    invariants:
    - "init=None case unchanged from §24/§25 baseline (regression-free)"
    - "init=Some case extracts ALL 10 fields, no silent defaults"
    - "extracted config is byte-equivalent to apr inspect <PATH> --json metadata"
    - "wrong-arch APR (e.g., encoder model) is FAIL-FAST not silent-truncate"

  qwen2_0_5b_constructor:
    formula: |
      `TransformerConfig::qwen2_0_5b()` MUST return a TransformerConfig
      with the empirically-verified Qwen2.5-Coder-0.5B-Instruct shape
      (per ~/.cache/huggingface/hub/.../config.json, validated 2026-05-04):
        hidden_size:               896
        num_attention_heads:       14
        num_kv_heads:              2  (GQA-7:1 ratio)
        intermediate_size:         4864
        num_hidden_layers:         24
        vocab_size:                151_936
        max_position_embeddings:   32_768
        rope_theta:                1_000_000.0
        rms_norm_eps:              1e-6
        use_bias:                  true   (Qwen2 has bias on q/k/v projections)
        tie_word_embeddings:       true   (Qwen2 default)
        architecture:              ModelArchitecture::Decoder
      The constructor sits next to existing `llama2_7b()` and `llama2_13b()`
      in `crates/aprender-train/src/transformer/config.rs`.
    domain: TransformerConfig family
    codomain: TransformerConfig
    invariants:
    - "shape constants match HF config.json byte-for-byte"
    - "constructor is pure (no I/O, no env reads)"
    - "GQA ratio = num_attention_heads / num_kv_heads = 14/2 = 7 (canonical Qwen2 0.5B)"
    - "use_bias=true differs from Llama (false) — Qwen2 quirk, contract-pinned"
    - "tie_word_embeddings=true differs from Llama (false) — Qwen2 quirk, contract-pinned"

  gqa_7_to_1_invariants:
    formula: |
      The forward-pass attention kernel MUST handle GQA-7:1 (kv_heads=2,
      query_heads=14) without requiring a per-ratio specialization.
      Specifically:
        K, V tensors broadcast across query_heads / kv_heads = 7 groups
        Each group of 7 query heads attends to the SAME (K, V) head
        Output concatenation preserves head order
      This is a strictly more general case than the Llama370M GQA-4:1
      ratio the existing code targets. The contract requires:
        - property test verifying GQA-7:1 numerical equivalence with
          (a) GQA-1:1 (full MHA, repeating each KV pair 7×) on the same input
          (b) Reference Qwen2 forward pass via HF FP16 oracle
        - cosine ≥ 0.9999 vs (a) up to FP rounding
        - cosine ≥ 0.999 vs (b) — same threshold as
          apr-vs-gguf-forward-parity-v1 §sample_size_parity_v1_1
    domain: attention kernel
    codomain: F32[seq, num_heads * head_dim]
    invariants:
    - "GQA ratio is data, not code — same kernel handles 1:1, 4:1, 7:1, 8:1"
    - "K/V broadcast is index arithmetic, not tensor copy"
    - "Output ordering is num_heads-major (matches HF Qwen2 convention)"

  qwen_tokenizer_vocab_compatibility:
    formula: |
      `preflight_tokenizer_vocab_matches_model()` (the GATE-ARCH-370M-011
      pre-flight in `crates/apr-cli/src/commands/pretrain.rs`) MUST gate
      by the EXTRACTED arch's vocab_size, NOT by the hardcoded
      `Llama370MConfig::VOCAB_SIZE` (50_257). The bound semantic is
      polymorphic per §55:
        With --init present:
          target_vocab = extracted_config.vocab_size
          INVARIANT: tokenizer_vocab ≤ target_vocab  (RELAXED bound)
          Rationale: HF-distributed checkpoints (Qwen2.5/Llama2/Mistral)
          materialize fewer string-token entries in tokenizer.json than
          their config.json declares as `vocab_size` — the gap is
          reserved/special slots that lm_head + embedding layers have
          weights for but no tokenizer string maps to. Strict equality
          would fail-fast on every HF model.
          Safety: tokenizer-emitted ids ∈ [0, tokenizer_vocab) ⊆
          [0, model_vocab); reserved high-id slots are never indexed
          at training time; bound preserves N-09 OOB safety.
        With --init absent:
          target_vocab = Llama370MConfig::VOCAB_SIZE  (50_257)
          INVARIANT: tokenizer_vocab == target_vocab  (STRICT bound,
          the §24/§25 from-scratch baseline; preserves
          INV-ARCH-370M-006 regression-free)
      The Qwen tokenizer's effective vocab.json (151_643 BPE-only or
      151_665 BPE+added_tokens) MUST pass pre-flight when --init points
      at a Qwen2.5 APR file (declared vocab 151_936). Same tokenizer
      with --init absent MUST still fail pre-flight (correct regression
      on the from-scratch path).
      OVERSIZE GUARD: tokenizer_vocab > target_vocab MUST FAIL even
      under polymorphic init (FALSIFY-APR-PRETRAIN-ARCH-010); bound is
      ≤, not <. A tokenizer with more strings than the model declares
      could emit ids ≥ model_vocab → silent embedding-lookup garbage.
    domain: tokenizer-model vocab match boundary
    codomain: bool
    invariants:
    - "init present → tokenizer_vocab ≤ extracted_config.vocab_size (RELAXED, admits HF reserved slots)"
    - "init absent → tokenizer_vocab == Llama370MConfig::VOCAB_SIZE (STRICT, regression-free)"
    - "false-pass (e.g., 50_257 tokenizer with Qwen 151_936 init) is FAIL-FAST"
    - "false-fail (e.g., 151_665 HF Qwen tokenizer with Qwen 151_936 init) is FORBIDDEN"
    - "OOB-class (tokenizer > model) is FAIL-FAST under both modes"

falsification_tests:
- id: FALSIFY-APR-PRETRAIN-ARCH-001
  rule: TransformerConfig::qwen2_0_5b constructor exists and matches HF config
  prediction: "`TransformerConfig::qwen2_0_5b()` returns a config whose 10 fields match the empirically-verified Qwen2.5-Coder-0.5B-Instruct shape byte-for-byte"
  test: "cargo test -p aprender-train --lib transformer::config::tests::qwen2_0_5b_matches_hf_config_2026_05_04"
  if_fails: "constructor missing or shape drifts from HF config — §50.4 step 5b unimplemented or regressed"

- id: FALSIFY-APR-PRETRAIN-ARCH-002
  rule: build_transformer_config(None) preserves Llama370M baseline
  prediction: "with init=None, `build_transformer_config()` returns TransformerConfig field-for-field equal to the existing pretrain_real::build_transformer_config() output"
  test: "cargo test -p aprender-train --lib train::pretrain_real::tests::build_transformer_config_no_init_matches_llama370m"
  if_fails: "from-scratch baseline regressed — §24/§25 falsification evidence destroyed"

- id: FALSIFY-APR-PRETRAIN-ARCH-003
  rule: build_transformer_config(Some) extracts all 10 fields from APR header
  prediction: "with init=Some(<Qwen2.5-0.5B.apr>), `build_transformer_config()` returns the same TransformerConfig as `TransformerConfig::qwen2_0_5b()` modulo max_position which inherits from --seq-length CLI"
  test: "cargo test -p aprender-train --lib train::pretrain_real::tests::build_transformer_config_qwen_init_matches_input"
  if_fails: "extractor silently fills defaults instead of reading APR metadata — §50 root cause not addressed"

- id: FALSIFY-APR-PRETRAIN-ARCH-004
  rule: GQA-7:1 forward-pass numerical parity with GQA-1:1
  prediction: "GQA-7:1 (kv_heads=2, query_heads=14) attention output cosine ≥ 0.9999 vs GQA-1:1 reference (kv_heads=14, query_heads=14, with each query group's KV repeated 7×) on the same input tensors"
  test: "cargo test -p aprender-train --lib transformer::model::tests::falsify_apr_pretrain_arch_004_gqa_7_1_forward_pass_smoke"
  if_fails: "attention kernel mishandles GQA-7:1 — Qwen2 forward pass produces silent gibberish"

- id: FALSIFY-APR-PRETRAIN-ARCH-005
  rule: Qwen tokenizer (vocab=151_936) passes pre-flight with --init Qwen
  prediction: "preflight_tokenizer_vocab_matches_model() returns Ok with vocab.json containing 151_936 entries when --init points at a Qwen2.5 APR file"
  test: "cargo test -p apr-cli --lib commands::pretrain::tests::preflight_qwen_vocab_passes_with_qwen_target"
  if_fails: "preflight false-fails on Qwen tokenizer — operator cannot fine-tune Qwen2.5 even with arch-polymorphic builder"

- id: FALSIFY-APR-PRETRAIN-ARCH-006
  rule: Qwen tokenizer with --init absent fails pre-flight
  prediction: "preflight_tokenizer_vocab_matches_model() returns Err with vocab.json containing 151_936 entries when --init is absent (target=Llama370MConfig::VOCAB_SIZE=50_257)"
  test: "cargo test -p apr-cli --lib commands::pretrain::tests::preflight_qwen_vocab_fails_with_llama_target"
  if_fails: "preflight false-passes — from-scratch path silently accepts wrong-vocab tokenizer"

- id: FALSIFY-APR-PRETRAIN-ARCH-007
  rule: Wrong-arch APR (e.g., encoder model) fails fast
  prediction: "build_transformer_config(Some(<encoder.apr>)) returns Err naming the architecture mismatch — decoder builder cannot accept encoder weights"
  test: "cargo test -p aprender-train --lib train::pretrain_real::tests::validate_pretrain_init_arch_rejects_encoder"
  if_fails: "silent decoder/encoder mismatch — would later fail at first forward pass with cryptic shape error"

- id: FALSIFY-APR-PRETRAIN-ARCH-008
  rule: contract validates via pv
  prediction: "`pv validate contracts/apr-pretrain-arch-polymorphic-v1.yaml` exits 0"
  test: "pv validate contracts/apr-pretrain-arch-polymorphic-v1.yaml"
  if_fails: "contract schema noncompliant; will not pass CI gate"

- id: FALSIFY-APR-PRETRAIN-ARCH-009
  rule: relaxed bound accepts HF reserved-slot tokenizer under polymorphic init
  prediction: "`assert_tokenizer_vocab_within_model_bound(151_665, 151_936)` returns Ok; `preflight_tokenizer_vocab_matches_target(<dir with 151_665 entries>, 151_936, init_is_some=true)` returns Ok. The §54 LIVE smoke shape (Qwen2.5-Coder-0.5B materialized 151_665 ≤ declared 151_936) MUST PASS preflight under the polymorphic init path."
  test: "cargo test -p aprender-train --lib -- falsify_apr_pretrain_arch_009_relaxed_bound_accepts_qwen_reserved_slots && cargo test -p apr-cli --lib commands::pretrain::tests::preflight_qwen_reserved_slots_pass_under_polymorphic_init"
  if_fails: "polymorphic preflight is too strict; HF-distributed tokenizers (Qwen/Llama2/Mistral) cannot be fine-tuned without padding their vocab.json with synthetic reserved tokens — defeats the §50.4 cascade's purpose"

- id: FALSIFY-APR-PRETRAIN-ARCH-010
  rule: relaxed bound rejects oversized tokenizer even under polymorphic init
  prediction: "`assert_tokenizer_vocab_within_model_bound(<model_vocab + 1>, model_vocab)` returns Err citing RELAXED + OOB; `preflight_tokenizer_vocab_matches_target(<dir with > target entries>, target, init_is_some=true)` returns Err. Bound is ≤, not <; OOB safety is preserved."
  test: "cargo test -p aprender-train --lib -- falsify_apr_pretrain_arch_010_relaxed_bound_rejects_oversized_tokenizer && cargo test -p apr-cli --lib commands::pretrain::tests::preflight_oversized_tokenizer_rejected_even_under_polymorphic_init"
  if_fails: "relaxed bound is too permissive; a tokenizer with more strings than the model expects emits OOB ids → N-09 escape → silent embedding-lookup garbage during training"

- id: FALSIFY-APR-PRETRAIN-INIT-CUDA-001
  rule: CUDA path with --init is wired via build_shared_cuda_trainer_with_init (§50.4 step 5f.5 SHIPPED)
  prediction: "the `pub(crate) const FALSIFY_APR_PRETRAIN_INIT_CUDA_001_MSG` in `crates/apr-cli/src/commands/pretrain.rs` contains (a) the literal `FALSIFY-APR-PRETRAIN-INIT-CUDA-001`, (b) the phrase `is wired for --device cuda`, (c) the symmetric builder name `build_shared_cuda_trainer_with_init`, and (d) the `5f.5 SHIPPED` status marker. Drift-prevention sentinel: if a future refactor accidentally re-introduces a fail-fast on the CUDA + --init path (or renames the symmetric builder), this test fails fast."
  test: "cargo test -p apr-cli --lib commands::pretrain::tests::drive_real_cuda_init_path_wireup_sentinel_pinned"
  if_fails: "CUDA + --init wireup regressed — operator either gets a fail-fast on a path that should now succeed, or silent random-init at the GPU boundary (§28 SHIP-007 'silent gibberish' defect class). The post-5f.5 wireup must be restored or the sentinel string corrected to match the new symbol."

- id: FALSIFY-APR-PRETRAIN-INIT-CUDA-002
  rule: build_shared_cuda_trainer_with_init enforces paired-args (Some/Some or None/None)
  prediction: "calling `entrenar::train::pretrain_real_cuda::build_shared_cuda_trainer_with_init` with (Some, None) OR (None, Some) returns Err whose ConfigError payload names the function so callers can grep back to the offending invocation. The check fires WITHOUT a CUDA runtime (returns before any GPU allocation), so the test runs on any host even when CUDA is unavailable."
  test: "cargo test -p aprender-train --features cuda --lib train::pretrain_real_cuda::tests::build_shared_cuda_trainer_with_init_rejects_unpaired_args"
  if_fails: "the paired-args invariant regressed — a caller could pass an arch without weights (silent random-init at the GPU upload boundary) or weights without an arch (silently fall back to Llama370M shape). This is the same defect class FALSIFY-APR-PRETRAIN-INIT-001 prevents on the CPU path; the symmetric guard MUST hold on the CUDA path too."

- id: FALSIFY-APR-PRETRAIN-INIT-CUDA-003
  rule: build_shared_cuda_trainer_with_init rejects encoder-family init configs (§50.4 step 5f.1 threading)
  prediction: "calling `build_shared_cuda_trainer_with_init` with `init_arch.architecture == ModelArchitecture::Encoder` returns Err — same semantic as the CPU sibling `build_shared_trainer_with_init_rejects_encoder_family`. The encoder rejection happens before any GPU allocation (via the shared `validate_pretrain_init_arch_compatible` helper from pretrain_real.rs), so the test fires on any host."
  test: "cargo test -p aprender-train --features cuda --lib train::pretrain_real_cuda::tests::build_shared_cuda_trainer_with_init_rejects_encoder_family"
  if_fails: "encoder rejection regressed on the CUDA path — pretrain might attempt to fine-tune a BERT-class encoder as if it were a decoder, producing meaningless gradients. The §50.4 step 5f.1 helper MUST be threaded through both backends identically."

- id: FALSIFY-APR-PRETRAIN-INIT-POPULATE-COVERAGE-001
  rule: Transformer::new(qwen2_0_5b()).named_parameters().len() matches HF canonical 290
  prediction: "`Transformer::new(qwen2_0_5b()).named_parameters().len() == 290` (= 2 model-level + 24 layers × 12 params/layer). The 12 params/layer are: 2 layernorm weights + 4 attention weights (Q,K,V,O) + 3 attention biases (Q,K,V — required when config.use_bias=true) + 3 mlp weights (gate,up,down). Tied lm_head shares with embed_tokens, so it is NOT counted as an extra named parameter. The test fires WITHOUT a CUDA runtime and without loading any APR file — it exercises only the constructor."
  test: "cargo test -p aprender-train --lib transformer::config::tests::falsify_qwen2_0_5b_named_parameters_count_matches_hf"
  if_fails: "the count regressed below 290 — likely MultiHeadAttention::new dropped the bias allocation again, OR the polymorphic Transformer struct lost a field. Each missing param will be silently dropped during populate_trainer_from_init_tensors when the source APR has them, producing a hybrid model that masquerades as Qwen but lacks structural elements (the §59 val_loss=0.0008 anomaly defect class)."

- id: FALSIFY-APR-PRETRAIN-INIT-POPULATE-COVERAGE-002
  rule: every layer in Transformer::new(qwen2_0_5b()) exposes Q/K/V projection biases when use_bias=true
  prediction: "for every layer_idx in 0..24, `Transformer::new(qwen2_0_5b()).named_parameters()` contains the keys `model.layers.{layer_idx}.self_attn.q_proj.bias`, `model.layers.{layer_idx}.self_attn.k_proj.bias`, and `model.layers.{layer_idx}.self_attn.v_proj.bias`. Stricter than -001: not only counts the right number, but names the exact tensors so the populate path's BTreeMap lookup hits real init keys."
  test: "cargo test -p aprender-train --lib transformer::config::tests::falsify_qwen2_0_5b_layers_expose_qkv_biases_when_use_bias_true"
  if_fails: "MultiHeadAttention::new is dropping bias allocation despite config.use_bias=true; each missing bias is a 3 × 24 = 72 silent-drop per Qwen2 0.5B init, restoring the §59 val_loss=0.0008 defect class. Restore the `if config.use_bias { Some(zero_tensor) } else { None }` branch."

proof_obligations:
- type: invariant
  property: "arch_extraction_signature: init=None preserves Llama370M baseline byte-for-byte"
- type: soundness
  property: "arch_extraction_signature: init=Some extracts ALL 10 fields, no silent defaults"
- type: invariant
  property: "qwen2_0_5b_constructor: constructor is pure (no I/O); shape matches HF config.json"
- type: invariant
  property: "gqa_7_to_1_invariants: GQA ratio is data, not code; one kernel handles all ratios"
- type: liveness
  property: "qwen_tokenizer_vocab_compatibility: preflight passes for matching vocab; fails for mismatching"
- type: termination
  property: "build_transformer_config terminates on a finite-size APR header (no recursion)"

kani_harnesses:
- id: KH-APR-PRETRAIN-ARCH-001
  obligation: arch_extraction_signature
  property: init_none_implies_llama370m
  bound: 4  # 2 init states × 2 architectures = 4-cell decision table
- id: KH-APR-PRETRAIN-ARCH-002
  obligation: gqa_7_to_1_invariants
  property: gqa_ratio_kernel_polymorphism
  bound: 8  # GQA ratios in {1, 2, 4, 7, 8} × 2 head_dim values = 10 (clamped to 8)

