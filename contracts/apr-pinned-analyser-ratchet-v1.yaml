# ─────────────────────────────────────────────────────────────────────────────
# apr-pinned-analyser-ratchet-v1 — a ratchet's number is a property of the tree
# AND the instrument (PP-066 DAG row G-10, epic #2873, issue #2999; PMAT-1059)
#
# WHAT IT GOVERNS
#   scripts/pmat_bin.sh (the ONE pin), scripts/check_pmat_pinned.sh (every
#   analyser reference under scripts/ and .github/workflows/ resolves through
#   it), scripts/hardcoded_path_shipped_baseline.txt (stamped: count,
#   pmat_version, basis) and scripts/check_hardcoded_paths.sh --full-if-capable
#   (absolute compare only under a matching stamp; otherwise REPORT and decide
#   HEAD vs merge-base under the same binary).
#
# PROOF LADDER, STATED HONESTLY (F-26)
#   * L1 — the guards exist and are wired in ci.yml job guard-runner-labels.
#   * L2 — falsification tests cover the obligations, MEASURED: check_pmat_pinned.sh
#          --self-test 15/15, check_hardcoded_paths.sh --self-test 13/13 (2026-09-06),
#          including the registered mutations (one added path RED on both compare
#          paths; a stamp bumped without a measurement refused).
#   * L3/L4 — NOT APPLICABLE and not declared: shell guards over a text file.
# ─────────────────────────────────────────────────────────────────────────────
name: apr-pinned-analyser-ratchet
version: "1.0.0"
scope: >
  The analyser pin, the analyser-reference guard, the stamped shipped-tier
  baseline and the differential ratchet. Out of scope: what the analyser
  detects (pmat#1017 owns the detector) and the re-baseline itself, which is
  its own ticket (PMAT-1061) and never lands as a raise.
status: active

metadata:
  kind: pattern     # a pin-and-compare rule over shell guards and a text file, not a kernel
  version: "1.0.0"
  created: '2026-09-06'
  last_modified: '2026-09-06'
  author: PAIML Engineering
  references:
    - 'scripts/pmat_bin.sh — PMAT_PIN, resolution order, refusal with both versions named'
    - 'scripts/check_pmat_pinned.sh — the operator assertion as a guard: grep -rEn "(^|[^_/])pmat " scripts/ .github/workflows/ | grep -v pmat_bin == 0'
    - 'scripts/check_hardcoded_paths.sh — --full-if-capable: stamped baseline, REPORT BASELINE-STALE/INVALID, HEAD vs merge-base'
    - 'scripts/hardcoded_path_shipped_baseline.txt — count:, pmat_version:, basis:'
    - 'scripts/lib/resolve_base.sh — the base resolver shared with check_roadmap_diff_additive.sh (G-6)'
    - 'paiml/infra machines/intel/forjar.yaml — the fleet pin (3.31.0 -> 3.37.0, PMAT-231) that armed the ratchet on 2026-09-06'
    - 'PP-066 DAG row G-10, issue #2999, epic #2873'
  description: >
    On 2026-09-06 the fleet's analyser moved 3.31.0 -> 3.37.0 and the shipped-tier
    ratchet, whose baseline 277 named no instrument, counted 317 on an unchanged
    tree: every open PR went red for a defect none introduced. The pin lives in
    one file; every gate resolves through it; the baseline is stamped; a count is
    compared only against a count measured by the same binary; anything else is
    REPORTed and decided by the differential under the same binary.

equations:
  one_pin:
    formula: |
      PMAT := scripts/pmat_bin.sh(PMAT_PIN)        # exported, version asserted
      forall line in scripts/** ∪ .github/workflows/**:
        line =~ /(^|[^_\/])pmat / ∧ line !~ /pmat_bin/  =>  violation
    domain: 'every text line under scripts/ and .github/workflows/'
    codomain: 'bool'
    invariants:
    - 'PROSE COUNTS (case table rows 1-5): a comment that teaches the unpinned spelling is the line a reader copies.'
    - 'THE RESOLVER REFUSES OFF-PIN AND ABSENT (rows 12-14) and is option-neutral (row 15).'
    preconditions: []
    postconditions:
    - 'check_pmat_pinned.sh exits 0 only at zero violations and lists every violation otherwise'

  stamped_baseline:
    formula: |
      baseline := (count: N, pmat_version: X.Y.Z, basis: "$PMAT analyze hardcoded-paths …")
      valid(baseline) ⟺ all three parse
      ¬valid  =>  the number is NOT compared (REPORT BASELINE-INVALID)
    domain: 'scripts/hardcoded_path_shipped_baseline.txt'
    codomain: 'valid | INVALID'
    invariants:
    - 'INVALID IS NOT A NUMBER (ratchet row R5).'
    - 'A STAMP IS NOT A MEASUREMENT (row R6): pmat_version moves while count: stands => refused.'
    preconditions: []
    postconditions:
    - 'the 277 recorded on 2026-09-05 stays INVALID until PMAT-1061 measures it under the pin'

  no_absolute_compare_across_instruments:
    formula: |
      stamp == PMAT_VERSION  =>  verdict := shipped(HEAD) <= count                     (rows R1, R2)
      stamp != PMAT_VERSION  =>  REPORT BASELINE-STALE{stamp, PMAT_VERSION};
                                 verdict := shipped(HEAD) - shipped(merge-base) <= 0    (rows R3, R4)
      no base nameable       =>  FAIL (never the branch against itself)                (row R7)
      no analyser at the pin =>  FAIL (ENV)                                             (row R8)
    domain: 'the shipped-tier scan of HEAD and of merge-base(origin/main, HEAD) under the same binary'
    codomain: 'PASS | FAIL'
    invariants:
    - 'ONE ADDED PATH IS RED ON BOTH PATHS (rows R2, R4): the registered mutation.'
    - 'THE DIFFERENTIAL NAMES THE PATH (row R4): comm -13 base head.'
    preconditions:
    - 'the base is named by scripts/lib/resolve_base.sh on every CI checkout shape (G-6 case table)'
    postconditions:
    - 'the log carries the pin the verdict was measured under'

proof_obligations:
  - id: PIN-OB-001
    statement: "No execution surface under scripts/ or .github/workflows/ invokes or teaches the unpinned analyser spelling."
    discharged_by: falsification_tests[0]
  - id: PIN-OB-002
    statement: "The resolver accepts only a binary at the pin and refuses absent or off-pin binaries without mutating the caller's shell."
    discharged_by: falsification_tests[0]
  - id: PIN-OB-003
    statement: "A count is compared only against a count measured by the same binary; otherwise the verdict is the differential, and INVALID is never a number."
    discharged_by: falsification_tests[1]
  - id: PIN-OB-004
    statement: "Both guards are wired in ci.yml job guard-runner-labels, case table before the live check."
    discharged_by: falsification_tests[2]

falsification_tests:
  - id: PIN-F-001
    rule: one pin, every reference resolves through it
    prediction: >-
      15/15 rows: the five unpinned spellings match, the six sanctioned ones do
      not, the resolver resolves at the pin and refuses off-pin and absent, and
      leaks no shell option. Reverting to a bare spelling anywhere under
      scripts/ or .github/workflows/ turns the live guard RED naming the line.
    test: 'bash scripts/check_pmat_pinned.sh --self-test'
    if_fails: >-
      a gate's number silently depends on whichever analyser PATH resolves
    mutation: >-
      reintroduce one bare `pmat comply check` in any script; check_pmat_pinned.sh
      must turn RED naming it.

  - id: PIN-F-002
    rule: stamped baseline, no absolute compare across instruments
    prediction: >-
      ratchet rows R1-R8 hold: PASS/RED by the absolute compare under a matching
      stamp; REPORT BASELINE-STALE + differential PASS/RED under a stale stamp
      (the RED names src/f8.rs); REPORT BASELINE-INVALID + differential under an
      invalid stamp; a stamp bump without a measurement refused; no base => RED;
      no analyser at the pin => FAIL (ENV).
    test: 'bash scripts/check_hardcoded_paths.sh --self-test'
    if_fails: >-
      the day the fleet's analyser moves, every PR goes red (or green) for a
      defect no PR introduced — the G-10 landmine
    mutation: >-
      make the ratchet compare shipped <= count regardless of the stamp; rows R3
      and R5 must turn RED.

  - id: PIN-F-003
    rule: wired, case table then live
    prediction: >-
      check_guards_are_wired.sh names neither guard as unwired while ci.yml
      carries the four steps.
    test: 'bash scripts/check_guards_are_wired.sh'
    if_fails: >-
      a guard that exists and gates nothing (class #2878)
    mutation: >-
      delete the check_pmat_pinned.sh steps from ci.yml; check_guards_are_wired.sh
      must turn RED naming the script.

non_goals:
  - "The re-baseline (PMAT-1061): measured under the pin, stamped, its own PR."
  - "What counts as a machine-specific path: the analyser's detector (pmat#1017)."
  - "Makefile recipes: outside the operator assertion's surface; tracked separately."

binding_registry:
  guard: scripts/check_pmat_pinned.sh
  ci_job: guard-runner-labels
  make_target: tier3
  issue: "https://github.com/paiml/aprender/issues/2999"
