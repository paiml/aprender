# CRUX-I-15 — Agent memory plugin interface

metadata:
  id: CRUX-I-15
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "I — Observability & Metrics"
  competitor: ecosystem
  demand_score: 3
  intake_status: missing
  description: >
    Agent memory plugin interface: pluggable KV + vector store for agent
    short/long-term memory. Canonical: LangGraph `checkpointer` +
    LlamaIndex `ChatMemoryBuffer`; must expose `put(key, value, ttl)`,
    `get(key) → Option<value>`, `search(embedding, k) → [id, score]`.
    TTL expiry is observable and monotonic.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - spec.modelcontextprotocol.io
  - github.com/anthropics/anthropic-sdk-python — Agent SDK
equations:
  agent_memory:
    formula: |
      put(k, v, ttl)  : store[k] = (v, now() + ttl) ; index(embed(v))
      get(k)           : return store[k].v if now() < store[k].expiry else None
      search(e, k)     : return top_k { (id, cos(e, embed[id])) : id ∈ store }
      # monotonic expiry: no resurrection after TTL
    domain: "(backend: {sqlite, redis, qdrant}, ttl: Duration, dim: usize)"
    codomain: "observable KV+vector store with expiry"
    invariants:
    - "put/get round-trip: get(k) = v after put(k, v, ∞)"
    - "TTL monotonic: after ttl elapses, get(k) = None; never revives"
    - "search(embed(v), 1) returns k such that get(k) = v (recall@1 = 1.0)"

falsification_tests:
- id: FALSIFY-CRUX-I-15-001
  rule: put/get round-trip
  prediction: "put(k, v) then get(k) returns v"
  test: |
    set -euo pipefail
    apr agent memory put --key hello --value world --ttl 3600
    out=$(apr agent memory get --key hello --format json | jq -r .value)
    test "$out" = "world"
  if_fails: rule 'put/get round-trip' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-I-15-002
  rule: TTL expiry is monotonic (no resurrection)
  prediction: "put with ttl=1s; after 2s get returns null; stays null"
  test: |
    set -euo pipefail
    apr agent memory put --key ephem --value x --ttl 1
    sleep 2
    apr agent memory get --key ephem --format json > /tmp/g1.json
    sleep 1
    apr agent memory get --key ephem --format json > /tmp/g2.json
    python3 -c "
    import json
    assert json.load(open('/tmp/g1.json'))['value'] is None
    assert json.load(open('/tmp/g2.json'))['value'] is None
    "
  if_fails: rule 'TTL expiry is monotonic (no resurrection)' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-I-15-003
  rule: self-recall at k=1 is perfect
  prediction: "search(embed(v), k=1) returns the key that stored v"
  test: |
    set -euo pipefail
    apr agent memory put --key a --value "the fox jumped" --ttl 3600
    apr agent memory put --key b --value "python ate cython" --ttl 3600
    apr agent memory search --query "the fox jumped" --k 1 --format json > /tmp/s.json
    python3 -c "
    import json; d=json.load(open('/tmp/s.json'))
    assert d['hits'][0]['key'] == 'a', d
    "

  if_fails: rule 'self-recall at k=1 is perfect' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr agent memory matches LangGraph checkpointer + LlamaIndex memory semantics"
- type: invariant
  property: "TTL is monotonic (no key ever un-expires)"
- type: invariant
  property: "self-recall@1 == 1.0"

