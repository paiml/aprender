metadata:
  id: CRUX-A-19
  version: "1.1.0"
  created: "2026-04-18"
  last_updated: "2026-04-20"
  author: PAIML Engineering
  registry: true
  status: partial
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Intake & Discovery"
  competitor: huggingface
  demand_score: 4  # 1..5, high priority in pmat work
  intake_status: partial
  description: >
    Progress bar with ETA and parallel chunks. Parity target is
    HuggingFace's `tqdm`-powered progress output from `hf_hub_download` /
    `snapshot_download` (and `huggingface-cli download`), which shows per-
    file percentage, transferred bytes, total bytes, transfer rate, and
    ETA. Aprender parity: `apr pull hf://<repo>` on a TTY MUST emit a
    per-file progress indicator (default `indicatif`-style) containing
    `{percent}%`, `{bytes}/{total}`, `{rate}/s`, and `ETA {time}`; on a
    non-TTY or with `--quiet`/`APR_PROGRESS=0` progress MUST be suppressed.
    Parallel chunk counts MUST reflect actual concurrency (see CRUX-A-07).
    References:
    https://huggingface.co/docs/huggingface_hub/guides/download
    https://tqdm.github.io/docs/tqdm/
  references:
  - "https://huggingface.co/docs/huggingface_hub/guides/download"
  - "https://tqdm.github.io/docs/tqdm/"
  - "https://docs.rs/indicatif/latest/indicatif/"

equations:
  progress_fields:
    formula: |
      On TTY stderr during apr pull, for each downloaded file F:
        a progress line appears containing:
          pct:    matches regex   "(\\d{1,3})%"
          bytes:  matches regex   "\\d+(\\.\\d+)?\\s*(B|KiB|MiB|GiB)"
          total:  appears as      "/\\s*\\d+(\\.\\d+)?\\s*(B|KiB|MiB|GiB)"
          rate:   matches regex   "(\\d+(\\.\\d+)?\\s*(B|KiB|MiB|GiB))/s"
          eta:    matches regex   "ETA\\s+(\\d{1,2}:)?\\d{1,2}:\\d{2}"
        AND final line shows 100%.
    domain: "apr pull invocation with TTY stderr"
    codomain: "stream of stderr lines"
    invariants:
    - "Progress is on stderr (never pollutes stdout piping)"
    - "All four fields (pct, bytes/total, rate, ETA) appear at least once per file"
    - "Final progress line for each file shows 100%"

  progress_suppression:
    formula: |
      (non-TTY stderr) OR --quiet OR APR_PROGRESS=0 →
        stderr contains zero lines matching the progress regex above.
      (TTY stderr) AND default flags →
        stderr contains at least one progress line per file > 1 KiB.
    domain: "(tty-ness, flags, env)"
    codomain: "stderr line count matching progress regex"
    invariants:
    - "Redirecting stderr to a file suppresses progress (clean logs)"
    - "--quiet is honored even on a TTY"
    - "APR_PROGRESS=0 env var force-disables progress"

  parallel_chunks_visibility:
    formula: |
      When xet / multi-chunk mode is active (see CRUX-A-07):
        progress line OR verbose log reports parallelism P = min(cores, 8)
        AND cumulative bytes transferred monotonically increases.
    domain: "xet-enabled large file download"
    codomain: "observed parallelism integer + byte counter"
    invariants:
    - "Parallel chunk count visible in --verbose output"
    - "Byte counter is monotonic (never decreases)"
    - "ETA decreases (non-strictly) as download proceeds after warm-up"

falsification_tests:
- id: FALSIFY-CRUX-A-19-001
  rule: progress bar emits pct/bytes/rate/ETA on TTY
  prediction: "apr pull on a PTY shows all four progress fields on stderr"
  test: |
    TMP=$(mktemp -d)
    LOG=$(mktemp)
    # Force a pty via script(1) so stderr is a TTY
    script -qefc "apr pull hf://openai-community/gpt2 --include 'model.safetensors' --out '$TMP' 2>&1" /dev/null > "$LOG"
    grep -qE '[0-9]{1,3}%' "$LOG" || { echo "FAIL: no percent in progress" >&2; exit 1; }
    grep -qE '[0-9.]+\s*(B|KiB|MiB|GiB)' "$LOG" || { echo "FAIL: no bytes shown" >&2; exit 1; }
    grep -qE '[0-9.]+\s*(B|KiB|MiB|GiB)/s' "$LOG" || { echo "FAIL: no rate shown" >&2; exit 1; }
    grep -qE 'ETA\s+([0-9]{1,2}:)?[0-9]{1,2}:[0-9]{2}' "$LOG" || { echo "FAIL: no ETA" >&2; exit 1; }
  if_fails: "progress bar missing required tqdm-parity fields on TTY"
  # No algorithm-level sub-claim: this gate asserts actual PTY rendering of
  # tqdm-parity fields (pct, bytes, rate, ETA). Requires live download path
  # + indicatif renderer wiring. Discharge deferred to TTY-gated follow-up.

- id: FALSIFY-CRUX-A-19-002
  rule: non-TTY suppresses progress
  prediction: "apr pull with redirected stderr emits zero progress lines"
  test: |
    TMP=$(mktemp -d)
    ERR=$(mktemp)
    apr pull hf://openai-community/gpt2 --include 'config.json' --out "$TMP" 2>"$ERR" >/dev/null
    # Should have no ANSI-bar/progress lines in non-TTY stderr
    grep -cE '[0-9]{1,3}%.*(KiB|MiB|GiB)/s' "$ERR" | grep -q '^0$' || {
      echo "FAIL: progress emitted on non-TTY stderr" >&2; exit 1
    }
  if_fails: "apr pull leaked progress lines to piped/redirected stderr"
  discharge_status: PARTIAL_ALGORITHM_LEVEL
  evidence_discharged_by:
    classifier: crates/apr-cli/src/commands/progress.rs
    tests:
    - commands::progress::tests::non_tty_always_suppresses
    - commands::progress::tests::three_suppression_signals_observationally_equivalent
    scope: >
      Algorithm-level discharge: the decision function
      `progress_enabled(stderr_is_tty=false, ...) -> false` returns false
      for any non-TTY stderr regardless of flag/env state. NOT YET
      DISCHARGED: real stderr TTY probe at the `apr pull` entrypoint and
      actual suppression of indicatif output (requires live-download
      path wiring; TTY-gated follow-up harness).

- id: FALSIFY-CRUX-A-19-003
  rule: --quiet and APR_PROGRESS=0 honor suppression on TTY
  prediction: "apr pull --quiet on TTY shows zero progress"
  test: |
    TMP=$(mktemp -d)
    LOG=$(mktemp)
    script -qefc "apr pull --quiet hf://openai-community/gpt2 --include 'config.json' --out '$TMP' 2>&1" /dev/null > "$LOG"
    grep -cE '[0-9]{1,3}%' "$LOG" | grep -q '^0$' || {
      echo "FAIL: --quiet did not suppress progress" >&2; exit 1
    }
    TMP2=$(mktemp -d); LOG2=$(mktemp)
    APR_PROGRESS=0 script -qefc "apr pull hf://openai-community/gpt2 --include 'config.json' --out '$TMP2' 2>&1" /dev/null > "$LOG2"
    grep -cE '[0-9]{1,3}%' "$LOG2" | grep -q '^0$' || {
      echo "FAIL: APR_PROGRESS=0 did not suppress progress" >&2; exit 1
    }
  if_fails: "--quiet or APR_PROGRESS=0 did not suppress progress output"
  discharge_status: PARTIAL_ALGORITHM_LEVEL
  evidence_discharged_by:
    classifier: crates/apr-cli/src/commands/progress.rs
    tests:
    - commands::progress::tests::quiet_flag_suppresses_on_tty
    - commands::progress::tests::apr_progress_zero_suppresses_on_tty
    - commands::progress::tests::falsy_env_variants_all_suppress
    - commands::progress::tests::quiet_overrides_truthy_env
    - commands::progress::tests::three_suppression_signals_observationally_equivalent
    scope: >
      Algorithm-level discharge: the decision function returns false when
      `quiet_flag=true` regardless of TTY/env, and returns false when
      `APR_PROGRESS` is any falsy value ("0", "false", "no", "off") on a
      TTY. The three suppression signals (non-TTY, --quiet, APR_PROGRESS
      falsy) are observationally equivalent. NOT YET DISCHARGED: PTY-
      backed integration test proving `apr pull --quiet` and
      `APR_PROGRESS=0 apr pull` actually emit zero progress lines under
      script(1) (requires live download path; TTY-gated follow-up).

- id: FALSIFY-CRUX-A-19-004
  rule: parallel chunk count surfaces in verbose mode
  prediction: "apr pull --verbose on xet-backed file reports >=2 chunks in log"
  test: |
    TMP=$(mktemp -d); LOG=$(mktemp)
    APR_XET=1 apr pull hf://openai-community/gpt2 --include 'model.safetensors' \
      --out "$TMP" --verbose 2>"$LOG" >/dev/null
    CHUNKS=$(grep -cE '(chunk|range).*[0-9]+' "$LOG" || true)
    [ "$CHUNKS" -ge 2 ] || {
      echo "FAIL: expected >=2 chunk log lines, saw $CHUNKS" >&2; exit 1
    }
  if_fails: "parallel chunk accounting invisible in --verbose log"
  # No algorithm-level sub-claim: this gate requires xet chunk logging to
  # be wired into the real download path. Discharge deferred.

proof_obligations:
- type: equivalence
  property: "apr pull TTY progress shows pct+bytes+rate+ETA, matching huggingface-cli tqdm output"
- type: invariant
  property: "Progress is emitted on stderr only when stderr is a TTY and --quiet/APR_PROGRESS=0 are not set"
- type: invariant
  property: "Final progress line per file shows 100% and byte counter equals total size"
- type: invariant
  property: "Parallel chunk count surfaces in --verbose log and matches configured concurrency"
- type: invariant
  property: "Byte counter is monotonic non-decreasing over the download lifetime"

