metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 3: The APR Model Format
  contract: apr-book-ch03
  status: enforced
  title: "The APR Model Format"
  part: I
  example: ch03_apr_format
  arxiv_citations: []

api_calls:
  - module: "aprender::format::validated_tensors"
    functions: ["TensorStats::compute"]
    min_calls: 1
preconditions:
  - "cargo build -p aprender-core --example ch03_apr_format succeeds"
  - "Zero legacy names in chapter text"
postconditions:
  - "TensorStats computed on real float data"
  - "Layout contract (row-major) demonstrated with assertions"
  - "Magic bytes and format version validated"
falsification:
  - condition: "cargo run -p aprender-core --example ch03_apr_format exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Example contains zero aprender::* API calls (hollow)"
    severity: P0
    action: rewrite_with_real_apis
  - condition: "No TensorStats::compute called on real data"
    severity: P0
    action: add_tensor_stats
  - condition: "Layout contract not exercised with assertion"
    severity: P0
    action: add_layout_assertion
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH03-001
    description: "Chapter 03's example ch03_apr_format builds and runs to exit 0, with its 8 assertion(s) holding"
    test: "cargo run -p aprender-core --example ch03_apr_format"
    prediction: "Exit 0. book-contracts 'Chapter Examples Run' runs the same command for all 27 chapters"
    if_fails: "An API the chapter teaches changed or regressed, so the example panics on an assertion or no longer compiles"
