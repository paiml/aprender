metadata:
  version: 1.0.0
  kind: schema
  description: |
    Training-pool admission gate (agent-trace ruling 2026-09-25, item 6). A captured
    lane row enters the fine-tune/distill pool only when it is secret-scan clean AND
    carries no sealed-test hash (review-corpus-contamination-v1). A secret hit
    QUARANTINES the row byte-for-byte; it is never redacted in place. A sealed-test hit
    REFUSES the row, and is checked first, so a test item is never stored beside
    training data. An empty sealed index admits nothing (Unchecked), since an empty scan
    proves nothing. Implementation: crates/aprender-review-experiment/src/pool.rs.
  references:
    - "contracts/review-corpus-contamination-v1.yaml"
    - "docs/specifications/review-experiment-protocol.md"

equations:
  admit:
    formula: "pool(R) = { r in R : sealed != {} and leak(r) = false and secrets(r) = {} }"

falsification_tests:
  - id: FALSIFY-TPA-001
    name: planted_aws_key_is_quarantined
    prediction: "a lane output carrying an AWS access key id is Quarantined byte-identical, and is not in the pool; a clean neighbour is admitted"
    test_harness: "cargo test -p aprender-review-experiment --lib falsify_tpa_001"
    expected_output: "exit 0"
    if_fails: "Secrets reach the training pool, or a quarantined row was rewritten in place."
  - id: FALSIFY-TPA-002
    name: planted_test_split_diff_is_refused
    prediction: "a row carrying a sealed test diff, or only its diff sha, is Refused and not in the pool"
    test_harness: "cargo test -p aprender-review-experiment --lib falsify_tpa_002"
    expected_output: "exit 0"
    if_fails: "Sealed test items leak into training data (S-3)."
  - id: FALSIFY-TPA-003
    name: secret_scanner_case_table
    prediction: "every must-match (AWS id/secret, GitHub, PEM private key, Anthropic, Slack, JSON-escaped key) is a hit; no must-not-match is"
    test_harness: "cargo test -p aprender-review-experiment --lib secret_scanner_case_table"
    expected_output: "exit 0"
    if_fails: "The scanner misses a key shape, or flags prose and would quarantine clean rows."
  - id: FALSIFY-TPA-004
    name: empty_sealed_index_admits_nothing
    prediction: "with no sealed items indexed, no row is admitted"
    test_harness: "cargo test -p aprender-review-experiment --lib empty_sealed_index_refuses_everything"
    expected_output: "exit 0"
    if_fails: "A missing test manifest silently admits every row."
