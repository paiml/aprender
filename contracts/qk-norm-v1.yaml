metadata:
  version: 1.0.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: QK normalization — per-head RMSNorm applied to Q and K before attention
  references:
  - Henry et al. (2020) Query-Key Normalization for Transformers
  - Qwen3 Technical Report — QK normalization for training stability
  - Zhang & Sennrich (2019) Root Mean Square Layer Normalization
  depends_on:
  - rmsnorm-kernel-v1
equations:
  qk_rmsnorm:
    formula: Q_norm = RMSNorm(Q) = Q / sqrt(mean(Q²) + ε) * weight
    domain: Q ∈ ℝ^{head_dim}, weight ∈ ℝ^{head_dim}, ε > 0
    codomain: Q_norm ∈ ℝ^{head_dim}
    invariants:
    - RMS(output / weight) ≈ 1.0 when weight = 1
    - '|output_i| <= |weight_i| * sqrt(d_k) / sqrt(ε) (bounded amplitude)'
    - RMSNorm(0) = 0 (zero-stability)
    preconditions:
    - input.iter().all(|v| v.is_finite())
    - input.len() > 0
    lean_theorem: Theorems.Qk_Rmsnorm
proof_obligations:
- id: QKN-INV-001
  type: invariant
  property: Unit RMS after normalization
  formal: RMS(RMSNorm(x, 1)) ≈ 1.0
  tolerance: 0.1
  applies_to: all
- id: QKN-BND-002
  type: bound
  property: Output amplitude bounded
  formal: '|output_i| <= |weight_i| * sqrt(d_k / ε)'
  applies_to: all
- id: QKN-INV-003
  type: invariant
  property: Idempotent with unit weight
  formal: RMSNorm(RMSNorm(x, 1), 1) ≈ RMSNorm(x, 1)
  tolerance: 0.001
  applies_to: all
- id: QKN-INV-004
  type: invariant
  property: Zero-input stability
  formal: RMSNorm(0, w) = 0
  applies_to: all
- id: QKN-EQ-005
  type: equivalence
  property: SIMD matches scalar within ULP
  tolerance: 8.0
  applies_to: simd
- id: QKN-INV-006
  type: invariant
  property: Per-head independence
  formal: RMSNorm([h1;h2;...]) = [RMSNorm(h1); RMSNorm(h2); ...]
  tolerance: 0.0
  applies_to: all
falsification_tests:
- id: FALSIFY-QKN-001
  rule: Unit RMS
  prediction: RMS of normalized output ≈ 1.0 with unit weight
  test: proptest with random vectors, RMSNorm without affine
  if_fails: Normalization denominator incorrect
- id: FALSIFY-QKN-002
  rule: Bounded amplitude
  prediction: Output bounded by weight * sqrt(d_k/eps)
  test: proptest verifying element-wise bounds
  if_fails: Missing eps guard in denominator
- id: FALSIFY-QKN-003
  rule: Idempotent
  prediction: Double-applying RMSNorm ≈ single application
  test: proptest comparing single vs double application
  if_fails: Normalization not convergent
- id: FALSIFY-QKN-004
  rule: Zero-stability
  prediction: RMSNorm(0) = 0
  test: direct assertion on zero input
  if_fails: Division by zero not handled by eps
- id: FALSIFY-QKN-005
  rule: SIMD scalar equivalence
  prediction: SIMD QK-norm matches scalar within 8 ULP
  test: 'proptest: compare scalar vs SIMD QK-norm output'
  if_fails: SIMD normalization diverges beyond ULP tolerance
- id: FALSIFY-QKN-006
  rule: Cross-backend equivalence — the REAL kernel, on the path generation takes
  prediction: "`apr run --gpu` on a dense-Qwen3 Q4_K_M GGUF stays on CUDA: no `diverges from CPU … falling back to CPU` line, and `apr qa` golden_output passes on GPU, on lambda (sm_89) and on gx10 (GB10, sm_121)"
  test: "bash scripts/check_model_ladder.sh — rung qwen3-1.7b-q4km, backend cuda, both required hosts (receipts under evidence/dogfood/models/<version>/)"
  if_fails: "the per-head RMSNorm did not run where generation runs — at 4a538ddef the kernel was correct in isolation and SKIPPED by the manual CUDA graph replay (argmax 25 ≠ 198 at position 1 on both silicons, #3413); a simulation-vs-CPU proptest cannot see that, which is why this falsifier was rewritten (EPIC #3477)"
- id: FALSIFY-QKN-007
  rule: Per-head independence
  prediction: Normalizing N heads produces same result as normalizing each head independently
  test: proptest comparing batch per-head vs individual head normalization
  if_fails: Head slicing or offset computation incorrect in GPU kernel
- id: FALSIFY-QKN-008
  rule: The simulation is not the kernel
  prediction: "the CPU-vs-simulation proptest (the old QKN-006 body) still passes — it guards the algorithm, and is recorded as NOT guarding the dispatch"
  test: proptest comparing GPU reference simulation vs CPU at Qwen3-8B dimensions
  if_fails: GPU algorithm diverges from CPU — check argument order, head count, or rsqrt precision
kani_harnesses:
- id: KANI-QKN-001
  obligation: QKN-INV-001
  property: RMSNorm output finite for small vectors
  bound: 8
  strategy: stub_float
  solver: cadical
  harness: verify_qk_norm_finite
- id: KANI-QKN-002
  obligation: QKN-INV-004
  property: Zero input produces zero output (eps-guarded)
  bound: 8
  strategy: stub_float
  solver: cadical
  harness: verify_qk_norm_zero_stability
- id: KANI-QK_NOR-003
  obligation: Unit RMS after normalization
  property: Unit RMS after normalization
  bound: 8
  strategy: exhaustive
- id: KANI-QK_NOR-004
  obligation: Output amplitude bounded
  property: Output amplitude bounded
  bound: 8
  strategy: stub_float
- id: KANI-QK_NOR-005
  obligation: Idempotent with unit weight
  property: Idempotent with unit weight
  bound: 8
  strategy: exhaustive
- id: KANI-QK_NOR-006
  obligation: Zero-input stability
  property: Zero-input stability
  bound: 8
  strategy: exhaustive
- id: KANI-QK_NOR-007
  obligation: SIMD matches scalar within ULP
  property: SIMD matches scalar within ULP
  bound: 8
  strategy: exhaustive
- id: KANI-QK_NOR-008
  obligation: GPU kernel matches CPU reference
  property: "GPU reference SIMULATION matches CPU reference — this harness checks the algorithm in Rust, it cannot execute the CUDA kernel or the graph that dispatches it; the kernel-on-the-generation-path obligation is discharged only by FALSIFY-QKN-006 (measured per host), never by this harness (#3477)"
  bound: 8
  strategy: exhaustive
- id: KANI-QK_NOR-009
  obligation: Per-head independence
  property: Per-head independence
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-QKN-001
  name: QK Normalization Contract
  description: Per-head QK RMSNorm quality gate
  checks:
  - unit_rms
  - bounded_amplitude
  - idempotent
  - zero_stability
  pass_criteria: All 8 falsification tests pass; FALSIFY-QKN-006 is read from the per-host ladder receipts, never from a simulation
  falsification: Set eps=0 to trigger division by zero
