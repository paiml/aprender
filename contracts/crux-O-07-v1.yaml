equations:
  level_2_features_are_oof__never_in_sample:
    formula: |
      a mutation that feeds in-sample level-1 predictions to level 2 is detected by the leak test: the L2 holdout score on a pure-noise label rises above chance (asserted RED) while the OOF path stays at chance
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "level-2 features are OOF, never in-sample"
  dynamic_stacking_falls_back_when_stacking_hurts:
    formula: |
      on a fixture where L2 holdout score < L1 holdout score, the final model is the L1 ensemble and the decision is recorded in the fit summary
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "dynamic stacking falls back when stacking hurts"

falsification_tests:
- id: FALSIFY-CRUX-O-07-001
  rule: "level-2 features are OOF, never in-sample"
  prediction: "a mutation that feeds in-sample level-1 predictions to level 2 is detected by the leak test: the L2 holdout score on a pure-noise label rises above chance (asserted RED) while the OOF path stays at chance"
  test: >-
    LIVE-PENDING - level-2 features are OOF, never in-sample. No test surface exists today because the capability is unimplemented: Multi-layer stack ensembling with a leakage guard (num_stack_levels, auto_stack, dynamic_stacking) (aprender#3377, CRUX-O-07). PROMOTE by authoring a test named stack_uses_oof_not_insample in module `automl/stacking/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'level-2 features are OOF, never in-sample' is violated — the autogluon parity claim for CRUX-O-07 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"
- id: FALSIFY-CRUX-O-07-002
  rule: "dynamic stacking falls back when stacking hurts"
  prediction: "on a fixture where L2 holdout score < L1 holdout score, the final model is the L1 ensemble and the decision is recorded in the fit summary"
  test: >-
    LIVE-PENDING - dynamic stacking falls back when stacking hurts. No test surface exists today because the capability is unimplemented: Multi-layer stack ensembling with a leakage guard (num_stack_levels, auto_stack, dynamic_stacking) (aprender#3377, CRUX-O-07). PROMOTE by authoring a test named dynamic_stacking_fallback_recorded in module `automl/stacking/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'dynamic stacking falls back when stacking hurts' is violated — the autogluon parity claim for CRUX-O-07 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"

