summary: >
  Schema contract on the three provenance fields every published
  .apr model MUST embed in its JSON metadata: license,
  data_source, data_license. Makes apr inspect a sufficient
  provenance-audit tool — no sidecar manifest required.

motivation: >
  SHIP-TWO-001 AC-SHIP2-012 requires that the MODEL-2 sovereign
  checkpoint ship with its data provenance bound to the binary
  itself, not only to an adjacent manifest.yaml. A sidecar-only
  scheme breaks the moment someone redistributes the .apr alone
  (HF Hub download, Slack DM, S3 bucket copy). Embedding license
  + data_source + data_license in AprV2Metadata makes 'apr
  inspect model.apr' answer "what data trained this, under what
  license?" from the bytes alone. FALSIFY-SHIP-022 formalizes
  this as a ship-blocker: if any of the three is missing, apr
  inspect reports (missing) and the publish gate fails.

# ─────────────────────────────────────────────────────────────
# Required fields in AprV2Metadata (embedded in .apr binary)
# ─────────────────────────────────────────────────────────────

required_fields:
  - name: license
    type: Option<String>
    constraint: |
      Valid SPDX identifier (e.g. "Apache-2.0", "CC-BY-4.0",
      "MIT"). Non-empty, non-null. "unknown" / "proprietary" /
      "TBD" are explicitly REJECTED (see
      publish-manifest-v1.yaml RJ-PM-003).
    ship_blocker: true
  - name: data_source
    type: Option<String>
    constraint: |
      Human-readable data origin string. For distilled models,
      the literal "teacher-only" is acceptable (pure knowledge
      distillation with no additional data). For pretrained
      models, a dataset identifier (e.g. "bigcode/the-stack-v2",
      "CommonCrawl-2024-42"). Non-empty, non-null.
    ship_blocker: true
  - name: data_license
    type: Option<String>
    constraint: |
      Valid SPDX identifier for the license covering
      data_source. For distillation-only models where
      data_source == "teacher-only", data_license inherits from
      the teacher's license. Non-empty, non-null.
    ship_blocker: true

# ─────────────────────────────────────────────────────────────
# Invariants — machine-checkable properties of AprV2Metadata
# ─────────────────────────────────────────────────────────────

invariants:

  - id: INV-APR-PROV-001
    description: >
      AprV2Metadata serialization round-trips license,
      data_source, data_license as named JSON keys (not buried
      in custom/extra). Given a struct with all three set, the
      JSON round-trip preserves each field byte-for-byte.
    falsifier: >
      Construct AprV2Metadata { license: Some("Apache-2.0"),
      data_source: Some("teacher-only"),
      data_license: Some("Apache-2.0"), .. }; serialize via
      AprV2Metadata::to_json; reparse via
      AprV2Metadata::from_json; assert all three Option<String>
      values match bit-identically. Any field lost / mangled /
      shifted to custom fails.

  - id: INV-APR-PROV-002
    description: >
      apr inspect always emits a "Provenance" block in both
      text and JSON modes. Missing values render as "(missing)"
      in text and null in JSON — they are NEVER silently
      skipped via serde's skip_serializing_if=Option::is_none.
      This is the cornerstone that makes FALSIFY-SHIP-022
      grep-checkable: a human or tool can scan for the three
      keys and verify they are non-empty.
    falsifier: >
      Run 'apr inspect model.apr' where model was written with
      license=None, data_source=None, data_license=None.
      Assert the output contains the literal strings "license",
      "data_source", and "data_license" (three keys present) and
      that each value equals "(missing)" (text) or null (JSON).
      If any key is absent, INV-APR-PROV-002 is violated.

  - id: INV-APR-PROV-003
    description: >
      On a publish-gated path (e.g. 'apr validate-manifest'
      --strict), all three fields MUST be present AND non-empty
      AND (for license / data_license) valid SPDX identifiers.
      Missing / empty / "unknown" / "proprietary" / "TBD" all
      fail. This is the hard ship gate — the publish pipeline
      exits nonzero.
    falsifier: >
      Publish gate input: AprV2Metadata with data_source =
      Some("". to_string()) (empty string). Assert the publish
      validator returns Err with a message naming data_source.
      Same for data_license = Some("unknown"). Same for
      license = None. Any failure to reject these inputs
      violates INV-APR-PROV-003.

# ─────────────────────────────────────────────────────────────
# Acceptance gates (bind to AC-SHIP2-012)
# ─────────────────────────────────────────────────────────────

gates:

  - id: GATE-APR-PROV-001
    rule: >
      AprV2Metadata round-trips license, data_source,
      data_license as named fields (INV-APR-PROV-001).
    evidence_required: >
      `cargo test -p aprender-core --lib
      falsify_ship_022_apr_metadata_provenance_round_trip`
      exits 0.
    evidence_discharged_by:
      - "crates/aprender-core/src/format/tests/provenance_tests.rs::falsify_ship_022_apr_metadata_provenance_round_trip"
    verdict: pass
    binds_to: AC-SHIP2-012
    falsification_id: FALSIFY-SHIP-022

  - id: GATE-APR-PROV-002
    rule: >
      apr inspect surfaces license, data_source, data_license
      in both text and JSON output (INV-APR-PROV-002), with
      "(missing)" / null rendering for absent values rather
      than silent skip. The JSON half is verified at the
      AprV2Metadata serialization layer (aprender-core); the
      text half is verified against the extracted
      format_provenance_block helper in apr-cli.
    evidence_required: >
      `cargo test -p aprender-core --lib
      falsify_ship_022_inspect_emits_provenance_keys`
      exits 0 AND
      `cargo test -p apr-cli --lib
      falsify_ship_022_inspect_emits_provenance_keys`
      exits 0 AND
      `cargo test -p apr-cli --lib
      falsify_ship_022_inspect_missing_renders_as_missing`
      exits 0 AND
      `cargo test -p apr-cli --lib
      falsify_ship_022_inspect_populated_renders_values`
      exits 0.
    evidence_discharged_by:
      - "crates/aprender-core/src/format/tests/provenance_tests.rs::falsify_ship_022_inspect_emits_provenance_keys"
      - "crates/apr-cli/src/commands/inspect_tests.rs::inspect_tests::falsify_ship_022_inspect_emits_provenance_keys"
      - "crates/apr-cli/src/commands/inspect_tests.rs::inspect_tests::falsify_ship_022_inspect_missing_renders_as_missing"
      - "crates/apr-cli/src/commands/inspect_tests.rs::inspect_tests::falsify_ship_022_inspect_populated_renders_values"
    verdict: pass
    binds_to: AC-SHIP2-012
    falsification_id: FALSIFY-SHIP-022
    ship_blocking: true

  - id: GATE-APR-PROV-003
    rule: >
      Publish gate rejects missing / empty / "unknown"
      provenance fields (INV-APR-PROV-003). Reuses the existing
      publish-manifest-v1 RJ-PM-003 semantics for apr-file
      embedded metadata.
    evidence_required: >
      Integration test constructs AprV2Metadata with each of
      (license=None, data_source="", data_license="unknown")
      and asserts the publish validator returns Err naming the
      offending field. The actual validator can ship later; the
      contract declares the obligation now so the gate cannot
      be silently forgotten.
    verdict: pass
    binds_to: AC-SHIP2-012
    falsification_id: FALSIFY-SHIP-022

  - id: GATE-APR-PROV-004
    rule: >
      AC-SHIP1-009 (MODEL-1 teacher license + data provenance
      recorded in model.apr metadata) is discharged by the SAME
      AprV2Metadata + serde-JSON decision rule that discharges
      AC-SHIP2-012. The three named fields (license, data_source,
      data_license) round-trip byte-identically and never leak
      into custom — proved today against teacher-representative
      values (license="apache-2.0",
      data_source="qwen2.5-coder-7b-instruct",
      data_license="apache-2.0"). Algorithm is model-agnostic,
      so the same harness that passes for MODEL-2 passes for
      MODEL-1 with no code change — only the input values
      differ. This is the second multi-bind of the
      C-APR-PROVENANCE contract (SHIP-TWO-001 first-ever
      multi-model PARTIAL discharge that crosses MODEL-1/MODEL-2).
    evidence_required: >
      `cargo test -p aprender-core --lib
      falsify_ship_009_apr_metadata_applies_to_model_1_teacher`
      exits 0 AND
      `cargo test -p aprender-core --lib
      falsify_ship_009_gate_apr_prov_004_has_partial_discharge_marker`
      exits 0. Both tests are siblings of the SHIP-022 harness
      and require zero new infrastructure — AprV2Metadata,
      to_json / from_json, and the `custom` escape hatch are
      all unchanged from v1.0.0.
    verdict: pass
    binds_to: AC-SHIP1-009
    falsification_id: FALSIFY-SHIP-009
    ship_blocking: true
    discharge_status: DISCHARGED
    discharged_evidence:
      date: "2026-04-25"
