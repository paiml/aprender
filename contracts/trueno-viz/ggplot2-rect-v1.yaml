metadata:
  id: ggplot2-rect-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    geom_rect with aes(xmin, xmax, ymin, ymax). layout() must reproduce ggplot_build() in ggplot2
    4.0.3: the four bounds pass through in data order (reversed bounds and NA kept), fill grey35
    (#595959) and colour/linewidth/linetype/alpha defaults, and the scales trained on all four
    bounds. Scope: the default Cartesian panel with the default continuous scales, no facets, no
    data-mapped colour, fill, size, shape or alpha; a non-default coord or a facet is refused with a
    typed error. Tick labels are compared for data magnitudes that format() prints without exponent
    notation. The oracle is a committed JSON fixture produced by R; R is never run at test time.
    Layout only: this contract does not claim that the renderer draws the layer as ggplot2 does.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), GeomRect'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_rect/generate.R'
equations:
  passthrough:
    formula: "xmin, xmax, ymin, ymax are copied unchanged, row for row; nothing is sorted or dropped"
    domain: four numeric or NA columns
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
  scale_training:
    formula: "Position scales train on the four bound columns: a reversed rectangle still contributes both ends"
    domain: one panel
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
proof_obligations:
- id: GC-INV-001
  type: invariant
  property: passthrough matches ggplot2
  formal: 'forall case in passthrough: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: passthrough
- id: GC-INV-002
  type: invariant
  property: scale_training matches ggplot2
  formal: 'forall case in scale_training: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: scale_training
enforcement:
  oracle_cases:
    description: All nine committed cases (basic, reversed, NA edge, duplicate rows, text groups, zero width, negative, style, one row) equal ggplot2 column for column
    check: grammar::ggplot2_marks_oracle::rect::basic
    severity: ERROR
  refuse_missing:
    description: "A rect missing any of the four bounds is refused with Error::Rendering"
    check: grammar::ggplot2_marks_oracle::refuses_missing_required_aesthetics
    severity: ERROR
  refuse_coord:
    description: "A non-default coord (coord_cartesian limits, coord_flip, polar) or any facet is refused with Error::UnsupportedCoord, never laid out as the default panel"
    check: grammar::ggplot2_marks_oracle::refuses_non_default_coord
    severity: ERROR
falsification_tests:
- id: FALSIFY-GC-001
  rule: Default fill is grey35
  prediction: "mutating FILL_RECT 89 -> 51 (grey20) turns rect::basic RED (8 cases RED (style overrides the fill, so it stays green))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::rect::basic -- --exact
  if_fails: The default fill is not compared
- id: FALSIFY-GC-002
  rule: xmin comes from the xmin aesthetic
  prediction: "mutating xmin/xmax slots swapped turns rect::basic RED (9 of 9 cases RED)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::rect::basic -- --exact
  if_fails: The bounds are not compared
- id: FALSIFY-GC-003
  rule: Text groups rank in C collation (byte order)
  prediction: "mutating reversing the byte comparison in GroupKey::order turns rect::groups_text RED (10+ cases RED (every case with text groups, area and rect))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::rect::groups_text -- --exact
  if_fails: No fixture uses text groups
- id: FALSIFY-GC-004
  rule: Non-default coord and facets are refused
  prediction: "a Coord with limits, coord_flip, polar, or a facet makes layout() return Error::UnsupportedCoord instead of laying out the default panel"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_non_default_coord -- --exact
  if_fails: layout() silently ignores the coord, and this contract's scope claim is false
qa_gate:
  id: F-GC-001
  name: ggplot2 conformance (geom_rect)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for every geom_rect fixture, and out-of-scope input is a typed error
  checks:
  - oracle_cases
  - refuse_missing
  - refuse_coord
