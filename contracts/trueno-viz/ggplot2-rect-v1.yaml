metadata:
  id: ggplot2-rect-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    geom_rect with aes(xmin, xmax, ymin, ymax). layout() must reproduce ggplot_build() in ggplot2
    4.0.3: the four bounds pass through in data order (reversed bounds and NA kept), fill grey35
    (#595959) and colour/linewidth/linetype/alpha defaults, and the scales trained on all four
    bounds. Scope: the default Cartesian panel with the default continuous scales, no facets, no
    data-mapped colour, fill, size, shape or alpha; a non-default coord or a facet is refused with a
    typed error. Also refused with a typed error: a column shorter than the frame, an infinite or text position, a layer stat other than the geom's default, a geom alpha that layout does not read, and an aesthetic that ggplot2 keeps and trains a scale on but this layer would drop (a mapped x or y on rect, xmin, xmax, ymin or ymax on text, a fixed size on every geom but text). Tick labels are compared for data magnitudes that format() prints without exponent
    notation. The oracle is a committed JSON fixture produced by R; R is never run at test time.
    Layout only: this contract does not claim that the renderer draws the layer as ggplot2 does.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), GeomRect'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_rect/generate.R'
equations:
  passthrough:
    formula: "xmin, xmax, ymin, ymax are copied unchanged, row for row; nothing is sorted or dropped"
    domain: four numeric or NA columns
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
  scale_training:
    formula: "Position scales train on the four bound columns: a reversed rectangle still contributes both ends"
    domain: one panel
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
proof_obligations:
- id: GC-INV-001
  type: invariant
  property: passthrough matches ggplot2
  formal: 'forall case in passthrough: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: passthrough
- id: GC-INV-002
  type: invariant
  property: scale_training matches ggplot2
  formal: 'forall case in scale_training: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: scale_training
enforcement:
  oracle_cases:
    description: All ten committed cases (basic, reversed, NA edge, duplicate rows, text groups, zero width, negative, style, one row) equal ggplot2 column for column
    check: grammar::ggplot2_marks_oracle::rect  # every test of the module, one per case
    severity: ERROR
  refuse_missing:
    description: "A rect missing any of the four bounds is refused with Error::Rendering"
    check: grammar::ggplot2_marks_oracle::refuses_missing_required_aesthetics
    severity: ERROR
  refuse_coord:
    description: "Every non-default coord (xlim, ylim, flip, polar, fixed) and every facet, on this geom and on every other marks geom, is refused with Error::UnsupportedCoord, never laid out as the default panel"
    check: grammar::ggplot2_marks_oracle::refuses_every_non_default_coord_and_facet_for_every_geom
    severity: ERROR
  refuse_ragged:
    description: "A mapped column shorter than the frame is refused with Error::Rendering, never NA-padded, for every geom"
    check: grammar::ggplot2_marks_oracle::refuses_a_short_column_for_every_geom
    severity: ERROR
  refuse_nonfinite:
    description: "An infinite position is refused with Error::ScaleDomain and a text position with Error::Rendering, for every geom and every position column"
    check: grammar::ggplot2_marks_oracle::refuses_infinite_and_text_positions_for_every_geom
    severity: ERROR
  refuse_stat:
    description: "A layer stat other than the geom's default is refused with Error::UnsupportedStat"
    check: grammar::ggplot2_marks_oracle::refuses_a_stat_the_layer_does_not_model
    severity: ERROR
  refuse_alpha:
    description: "A geom alpha that layout() does not read is refused"
    check: grammar::ggplot2_marks_oracle::refuses_a_geom_alpha_that_layout_does_not_read
    severity: ERROR
  refuse_dropped_aesthetics:
    description: "An aesthetic ggplot2 keeps but this layer would drop is refused"
    check: grammar::ggplot2_marks_oracle::refuses_aesthetics_ggplot2_keeps_and_this_layer_would_drop
    severity: ERROR
  overwritten_aesthetics_equal_default:
    description: "Aesthetics ggplot2 overwrites give a layer equal to the default layer"
    check: grammar::ggplot2_marks_oracle::overwritten_aesthetics_equal_default
    severity: ERROR
falsification_tests:
- id: FALSIFY-GC-001
  rule: Default fill is grey35
  prediction: "mutating FILL_RECT 89 -> 51 (grey20) turns rect::basic RED (8 cases RED (style overrides the fill, so it stays green))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::rect::basic -- --exact
  if_fails: The default fill is not compared
- id: FALSIFY-GC-002
  rule: xmin comes from the xmin aesthetic
  prediction: "mutating xmin/xmax slots swapped turns rect::basic RED (9 of 9 cases RED)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::rect::basic -- --exact
  if_fails: The bounds are not compared
- id: FALSIFY-GC-003
  rule: Text groups rank in C collation (byte order)
  prediction: "mutating reversing the byte comparison in GroupKey::order turns rect::group_order_c RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::rect::group_order_c -- --exact
  if_fails: Group order is not byte (C) collation, so a case-insensitive or locale sort passes
- id: FALSIFY-GC-004
  rule: Non-default coord and facets are refused
  prediction: "allowing ylim, or allowing coord_fixed, makes refuses_every_non_default_coord_and_facet_for_every_geom RED for all five geoms (mutations M19, M20 of the round-1 review)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_every_non_default_coord_and_facet_for_every_geom -- --exact
  if_fails: layout() silently ignores the coord, and this contract's scope claim is false
- id: FALSIFY-GC-005
  rule: A short column is a typed error
  prediction: "replacing the ragged-column error in position_column by Ok(NaN) turns refuses_a_short_column_for_every_geom RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_a_short_column_for_every_geom -- --exact
  if_fails: A ragged frame is NA-padded into numbers ggplot2 cannot produce
- id: FALSIFY-GC-006
  rule: A stat the layer does not model is refused
  prediction: "dropping the stat refusal in refuse_layer_parameters turns refuses_a_stat_the_layer_does_not_model RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_a_stat_the_layer_does_not_model -- --exact
  if_fails: geom.stat(..) is silently ignored by layout()
qa_gate:
  id: F-GC-001
  name: ggplot2 conformance (geom_rect)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for every geom_rect fixture, and out-of-scope input is a typed error
  checks:
  - oracle_cases
  - refuse_missing
  - refuse_coord
  - refuse_ragged
  - refuse_nonfinite
  - refuse_stat
  - refuse_alpha
  - refuse_dropped_aesthetics
  - overwritten_aesthetics_equal_default
