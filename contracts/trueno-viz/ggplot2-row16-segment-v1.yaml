metadata:
  id: ggplot2-row16-segment-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-16'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance row 16 (PLOT-GG-001, paiml/aprender#6909) - geom_segment. One segment per row from (x, y) to (xend, yend), rows in data order. The scales train on x with xend and on y with yend; an unmapped end column is absent from the layer data, and a segment with neither end is Err(Rendering). NA positions are kept and not trained.
    The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation;
    R is never run at test time. Every case goes through the public builder and layout().
    Scope: stated in the fixtures: facet_wrap over an all-text column per panel as R (layer data matched to the plot's panels by level); other facets, a numeric facet column, a data-mapped colour, size, shape, alpha or fill, text or infinite positions, group columns with gaps or mixed types, and layer data whose facet levels are absent from the plot data return Err(Rendering). Continuous x and y, numeric data; any coordinate system but the default coord_cartesian (coord_flip, limits, polar, fixed) returns Err(UnsupportedCoord) because layout() applies none. Stat: only the identity stat (none, or Stat::Identity) is in scope; any other stat returns Err(UnsupportedStat) because layout() computes none, and any companion geom other than geom_point returns Err(UnsupportedLayer). Position adjustments other than the nudge of geom_text, na.rm and orientation are not expressible in the builder (ggplot2 defaults: identity, FALSE, NA). A trained x or y range with no finite value or a single value returns Err(ScaleDomain) (ggplot2 widens such ranges in a way the shared scale code does not reproduce). Anything outside the scope returns a typed Err, never a panic. Tick labels are claimed exact only for non-zero data magnitude from 2^-8 (0.0039) to 10^4 (paiml/aprender#6958).
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_segment'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_segment/generate.R'
equations:
  segments:
    formula: 'layer_data(geom_segment) = rows (x, y, xend, yend, PANEL, group, colour, linewidth 0.5, linetype 1, alpha) in data order'
    domain: numeric columns, continuous scales, facet_wrap or no facet
    codomain: BuiltLayer.path (xend, yend) and the trained panel scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs; labels, colours, groups, panels and counts exact
    preconditions:
    - trained x and y ranges are non-degenerate, else ScaleDomain
    - coordinate system is the default coord_cartesian, else UnsupportedCoord
    - every layer has the identity stat, else UnsupportedStat; companion layers are geom_point only, else UnsupportedLayer
proof_obligations:
- id: GG16-INV-001
  type: invariant
  property: Layer data and trained scales match ggplot2
  formal: 'forall case: layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs; exact labels, colours, groups, panels)'
  applies_to: segments
enforcement:
  primary_cases:
    description: the main fixtures are reproduced
    check: grammar::ggplot2_segment_oracle::plain
    severity: ERROR
  group_or_style_cases:
    description: group, colour and facet fixtures are reproduced
    check: grammar::ggplot2_segment_oracle::numeric_groups_in_facet_wrap
    severity: ERROR
  edge_cases:
    description: edge fixtures are reproduced or refused with a typed Err
    check: grammar::ggplot2_segment_oracle::na_rows_are_kept_and_not_trained
    severity: ERROR
falsification_tests:
- id: FALSIFY-GG16-001
  rule: The scales train on xend and yend
  prediction: removing the geom_segment xend and yend training in GGPlot::trained_domains turns ends_beyond_the_start_points_widen_the_scales RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_segment_oracle::ends_beyond_the_start_points_widen_the_scales
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG16-002
  rule: xend and yend come from their own columns
  prediction: swapping the xend and yend columns read in path.rs build_layer turns plain RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_segment_oracle::plain
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG16-003
  rule: An unmapped end column is absent
  prediction: defaulting yend to a copy of y when unmapped turns xend_alone_leaves_no_yend_column RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_segment_oracle::xend_alone_leaves_no_yend_column
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG16-004
  rule: Group ids rank the sorted distinct value
  prediction: giving every segment row group -1 turns text_group_ids_rank_sorted_levels RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_segment_oracle::text_group_ids_rank_sorted_levels
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG16-005
  rule: A segment with neither end is refused
  prediction: removing the missing-end refusal in path.rs build_layer turns a_segment_without_xend_or_yend_is_refused RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_segment_oracle::a_segment_without_xend_or_yend_is_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-GG16-001
  name: ggplot2 conformance row 16 (geom_segment)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for the row-16 fixtures
  checks:
  - primary_cases
  - group_or_style_cases
  - edge_cases
