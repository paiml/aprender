metadata:
  id: ggplot2-dist-density-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance, distribution rows (PLOT-GG-001, paiml/aprender#6909, ticket paiml/aprender#6964) - geom_density: stat_density with bw = nrd0 (or a number), adjust, n, trim; R 4.6 density.default (BinDist, FFT, linear approx) on a 512-point grid by default; density, scaled, ndensity, count, wdensity, n.
    The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation;
    R is never run at test time. Every case goes through the public builder and layout().
    Scope: continuous numeric data, one panel, no facets, plain coord_cartesian. Non-default coordinates (coord_flip, limits, polar, fixed) return Err(UnsupportedCoord) because layout() applies none; facets, mixing with other geoms, text or infinite positions, a continuous colour or fill mapping, two discrete mappings without a group, a fixed fill, a mapped alpha, a flipped orientation and invalid parameters return a typed Err (Rendering, UnknownColumn, ScaleDomain, EmptyData or UnsupportedCoord), never a panic. Mapped colours and fills carry the key but the palette is not resolved (the fixture holds the real palette). The layout path is fuzzed on extreme and non-finite f32 and on empty data: it never panics or hangs and builds a bounded number of bins and rows.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_density'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_density/generate.R'
equations:
  density_stat_density:
    formula: 'geom_density layer = ggplot_build() data'
    domain: numeric columns, continuous scales, one panel, no facet
    codomain: BuiltLayer.dist and the trained panel scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs; groups, panels, counts and column sets exact
    preconditions:
    - coordinate system is the default coord_cartesian, else UnsupportedCoord
    - trained x and y ranges are non-degenerate, else ScaleDomain
proof_obligations:
- id: DENS-INV-001
  type: invariant
  property: Layer data and trained scales match ggplot2
  formal: 'forall case: layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs; exact groups, panels, counts, column sets)'
  applies_to: density_stat_density
enforcement:
  primary_cases:
    description: the main fixtures are reproduced
    check: grammar::ggplot2_dist_oracle::dens_default
    severity: ERROR
  group_or_style_cases:
    description: group, colour and fill fixtures are reproduced
    check: grammar::ggplot2_dist_oracle::dens_fill_two_groups
    severity: ERROR
  edge_cases:
    description: NA and edge fixtures are reproduced
    check: grammar::ggplot2_dist_oracle::dens_na_x
    severity: ERROR
falsification_tests:
- id: FALSIFY-DENS-001
  rule: nrd0 bandwidth
  prediction: changing the 0.9 factor of bw.nrd0 turns dens_default RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::dens_default
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-DENS-002
  rule: trim
  prediction: inverting trim turns dens_trim_two_groups RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::dens_trim_two_groups
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-DENS-003
  rule: Grid scaling
  prediction: dropping the 2n-1 factor of the density lattice turns dens_n64 RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::dens_n64
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-DENS-004
  rule: IQR divisor
  prediction: changing 1.34 to 1.35 in bw.nrd0 turns dens_default RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::dens_default
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-DENS-005
  rule: A group of one point and a constant x are typed errors
  prediction: accepting a group of one point or a degenerate scale turns degenerate_and_tiny_groups_are_typed_errors RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::degenerate_and_tiny_groups_are_typed_errors
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-DENS-006
  rule: Non-default coordinate systems are refused
  prediction: accepting any Cartesian coord turns non_default_coord_is_a_typed_error RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::non_default_coord_is_a_typed_error
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-DENS-001
  name: ggplot2 conformance (geom_density)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for the geom_density fixtures
  checks:
  - primary_cases
  - group_or_style_cases
  - edge_cases
