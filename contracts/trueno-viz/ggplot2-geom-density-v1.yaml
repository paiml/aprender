metadata:
  id: ggplot2-geom-density-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-15'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance row geom_density (PLOT-GG-001, paiml/aprender#6964, master #6909). geom_density() draws stat_density: bw.nrd0 bandwidth, gaussian kernel, 512 points from the smallest to the largest x, with the columns density, scaled, ndensity, count, wdensity and n. R's density() does not sum kernels; it bins the data linearly onto a 2n grid over [from - 4 bw, to + 4 bw], convolves with the kernel ordinates, and interpolates onto the output grid. The port does the same with the circular convolution summed directly, which equals R's FFT up to rounding, so the oracle holds at 1e-9 relative plus 1e-12 absolute.
    The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation; R is never run at test time. Every case goes through the public builder and layout(). The y scale is trained on 0 and the largest density (GeomArea's ymin = 0).
    Scope: one ungrouped geom_density layer on a numeric x, default bw, adjust, kernel, n, trim and bounds. Missing x values are dropped as ggplot2 does. Fewer than two values, constant data (zero spread, where ggplot2 falls back to the first value), a grouped layer, a y aesthetic, a mapped alpha, a non-default stat, facets, any coordinate system but plain Cartesian, a scale_x or scale_y spec, text or infinite x, and a density layer mixed with other geoms return a typed Err (Rendering, UnsupportedStat, UnsupportedCoord or UnsupportedLayer), never a panic. geom_density is not one of the 49 core rows of the ontology, so this contract binds no ggplot2-row entity.
  references:
  - 'Silverman (1986) Density Estimation for Statistics and Data Analysis, rule of thumb (bw.nrd0)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_density, stat_density, compute_density'
  - 'R 4.6.2: stats::density.default, stats::bw.nrd0'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_density/generate.R'
equations:
  stat_density:
    formula: 'density(x) = approx(grid, convolve(BinDist(x, 1/n), dnorm(k * step, sd = bw.nrd0(x))))(from + i * (to - from) / 511), i = 0..511'
    domain: numeric x with at least two distinct values
    codomain: BuiltLayer x, y = density, BuiltLayer.density (scaled, count, wdensity, n) and the trained panel scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs
    - exactly 512 grid points from min(x) to max(x)
    preconditions:
    - at least two values after dropping missing ones, else Rendering
    - nonzero spread, else Rendering
    - plain coord_cartesian and no facet, else UnsupportedCoord or Rendering
proof_obligations:
- id: GGD-INV-001
  type: invariant
  property: Layer data and trained scales match ggplot2
  formal: 'forall case: layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs)'
  applies_to: stat_density
enforcement:
  default_case:
    description: the 40-value fixture is reproduced
    check: grammar::ggplot2_dist_density_oracle::default
    severity: ERROR
  bandwidth_cases:
    description: the IQR branch of bw.nrd0 and the smallest sample are reproduced
    check: grammar::ggplot2_dist_density_oracle::outlier
    severity: ERROR
  refusal_cases:
    description: degenerate and out-of-scope input is refused with a typed Err
    check: grammar::dist::tests::density_drops_missing_and_refuses_degenerate_input
    severity: ERROR
falsification_tests:
- id: FALSIFY-GGD-001
  rule: Silverman's constant and exponent
  prediction: changing the 0.9 factor or the n^-0.2 exponent of bw_nrd0 turns the default fixture RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_density_oracle::default
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGD-002
  rule: The bandwidth takes the smaller of sd and IQR / 1.34
  prediction: using sd alone in bw_nrd0 turns the outlier fixture RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_density_oracle::outlier
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGD-003
  rule: The grid is bound by the data range and extends 4 bandwidths past it
  prediction: changing EXT or the output range turns the three-value fixture RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_density_oracle::three
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGD-004
  rule: Negative data bins and interpolates like positive data
  prediction: dropping the floor in bin_dist or the sign handling turns the negative fixture RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_density_oracle::negative
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGD-005
  rule: Degenerate input is refused
  prediction: letting a constant or one-value sample through bw_nrd0 turns the refusal test RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::dist::tests::density_drops_missing_and_refuses_degenerate_input
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGD-006
  rule: Non-default coordinate systems and facets are refused
  prediction: removing the check_scope call in dist::layout turns the coords test RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::dist::tests::coords_facets_and_mixed_layers_are_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-GGD-001
  name: ggplot2 conformance row geom_density
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for the geom_density fixtures
  checks:
  - default_case
  - bandwidth_cases
  - refusal_cases
