metadata:
  id: ggplot2-bars-stat-identity-geom-col-v1
  kind: pattern
  version: 1.1.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance, bars train, rows stat_identity + geom_col (PLOT-GG-001, paiml/aprender#6909). bar_layout() with BarStat::Identity takes each row's y as the bar height, keeps ggplot2's row order, and stacks (including negative values) as geom_col() does by default. The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (fixtures/ggplot2/stat_identity_geom_col/generate.R); R is
    never run at test time. Continuous values compare at 1e-9 relative + 1e-12 absolute; group ids, counts,
    levels and labels compare exactly.
    Level and group order is bytewise (LC_COLLATE=C): every generate.R pins it with Sys.setlocale and records it as "collate" in the fixture, and each oracle test asserts it, so R's locale-dependent sort() is never the reference.
    Scope: vertical bars over a text x. Under a facet the stat and the position run per panel (group ids stay global, and position_dodge(preserve = single) takes its n from the busiest x of any panel) while the scales are trained across panels; position scales are trained over every layer of the plot (a point, hline or vline layer next to the bars widens them), as the facet_bars, facet_bars_single and mixed_layers fixtures record. Typed errors, not drawn and not guessed: a bar layer with its own data under a facet, and the framebuffer and SVG renderers on bars over a text x ("bars on a discrete x are not drawn yet").
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), StatCount, GeomBar, GeomCol, PositionStack, PositionFill, PositionDodge'
  - 'crates/aprender-viz/fixtures/ggplot2/stat_identity_geom_col/generate.R'
equations:
  stat_identity:
    formula: 'bar height y = the given y of each row; no count or prop; rows keep input order'
    domain: text x, optional text fill, numeric y
    codomain: Vec<BarRow>
    invariants:
    - count and prop are absent
    - group ids are the dense rank of the (x, fill) pairs present, whatever the row order
  negative_stack:
    formula: 'a bar with ymax == 0 gets ymax := ymin before the sign test; bars with ymax < 0 stack downward from 0 separately from the rest'
    domain: y of either sign
    codomain: ymin, ymax, y
    invariants:
    - negative and non-negative bars never share a stack
proof_obligations:
- id: GGC1-INV-001
  type: invariant
  property: Identity bars match GeomCol, including the negative stack
  formal: '∀ row: (x, y, ymin, ymax, xmin, xmax, width, group) ≈ ggplot2 row; y axis range, breaks, labels equal'
  applies_to: stat_identity
- id: GGC1-INV-002
  type: invariant
  property: One bar per x needs no stacking
  formal: '∀ row: unfilled geom_col: ymin = min(y, 0), ymax = max(y, 0)'
  applies_to: negative_stack
enforcement:
  col_stack_matches:
    description: filled geom_col with a negative value equals ggplot2's stacked output
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_stat_identity_geom_col
    severity: ERROR
  col_plain_matches:
    description: unfilled geom_col equals ggplot2's
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_stat_identity_geom_col_plain
    severity: ERROR
  col_mixed_layers_match:
    description: geom_col next to a point layer trains one y scale over both (R range (-2.05, 21.05))
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_col_and_point_share_the_y_scale
    severity: ERROR
  col_hline_matches:
    description: geom_col next to geom_hline widens y to the intercept
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_col_and_hline_extend_y
    severity: ERROR
  col_companions_match:
    description: geom_col beside geom_vline, geom_hline and geom_point (bars_companions fixtures) trains both position scales over every layer as ggplot2 does
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_col_point_and_vline
    severity: ERROR
  col_non_finite_y_refused:
    description: a NaN or infinite y in a geom_col layer is a typed error, not a bar
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_col_with_a_nan_y_is_a_typed_error
    severity: ERROR
falsification_tests:
- id: FALSIFY-GGC1-001
  rule: Negative bars are recognised after setup_data
  prediction: mutating the ymax == 0 test in position::stack to never match turns 4 tests RED (_stat_identity_geom_col, _public_geom_col and the two zero_height_bar tests; measured, 4 failed, 39 passed, rc=101)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_stat_identity_geom_col grammar::ggplot2_bars_oracle::ggplot2_bars_public_geom_col grammar::ggplot2_bars_oracle::ggplot2_bars_position_stack_zero_height_bar grammar::ggplot2_bars_oracle::ggplot2_bars_public_position_stack_zero_height_bar
  if_fails: The negative value in the fixture is not exercised
- id: FALSIFY-GGC1-002
  rule: geom_col width is 0.9
  prediction: mutating DEFAULT_BAR_WIDTH 0.9 -> 0.8 turns 17 of the 43 tests RED, both identity tests among them (measured, 17 failed, 26 passed, rc=101); mutating the geom default (geom.rs DEFAULT_BAR_WIDTH_F32 0.9 -> 0.8) turns 21 RED, the public, facet and mixed-layer tests (measured, 21 failed, 22 passed, rc=101)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_stat_identity_geom_col grammar::ggplot2_bars_oracle::ggplot2_bars_stat_identity_geom_col_plain grammar::ggplot2_bars_oracle::ggplot2_bars_public_geom_col
  if_fails: Edges of identity bars are not compared
- id: FALSIFY-GGC1-003
  rule: An identity layer over several layers shares one y scale
  prediction: dropping the y of non-bar layers from the scale training (layout_with_bars) turns _mixed_col_and_point_share_the_y_scale and _mixed_point_outside_the_bar_x_range RED (measured, 2 failed, 41 passed, rc=101); dropping an hline intercept turns _mixed_col_and_hline_extend_y RED (measured, 1 failed, 42 passed, rc=101)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_col_and_point_share_the_y_scale grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_point_outside_the_bar_x_range grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_col_and_hline_extend_y
  if_fails: The y range of geom_col + geom_point(aes(y = z)) is the same as the bars' alone
- id: FALSIFY-GGC1-004
  rule: A vline beside bars widens the x range on the discrete axis
  prediction: dropping the vline intercept from the x range in layout_with_bars turns 6 bars_companions tests RED, _col_and_vline_right_of_the_bars_widen_x among them (measured, mutation M2)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_col_and_vline_right_of_the_bars_widen_x
  if_fails: The vline fixture does not lie outside the bars' x range
- id: FALSIFY-GGC1-005
  rule: Point levels the bars lack extend the discrete x
  prediction: training the discrete levels from the bar layers only turns 3 tests RED, _point_with_new_levels_extends_the_discrete_x among them (measured, mutation M3)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_point_with_new_levels_extends_the_discrete_x
  if_fails: The fixture's point levels are all bar levels
- id: FALSIFY-GGC1-006
  rule: A non-finite y is refused
  prediction: removing the finite check in stat_count number_column turns _col_with_a_nan_y_is_a_typed_error RED (measured, mutation M9)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_col_with_a_nan_y_is_a_typed_error
  if_fails: NaN rows are dropped or drawn silently
- id: FALSIFY-GGC1-007
  rule: A numeric x beside bars sits at its own value on the discrete axis
  prediction: dropping the companion x from the x range in layout_with_bars turns _point_with_a_numeric_x_sits_at_its_value and _mixed_point_outside_the_bar_x_range RED (measured, 2 failed, 72 passed, rc=101)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_point_with_a_numeric_x_sits_at_its_value
  if_fails: The numeric x is mapped onto a level or dropped
qa_gate:
  id: F-GGC1-001
  name: ggplot2 conformance bars row 2 (stat_identity + geom_col)
  description: aprender-viz bar_layout equals ggplot2 4.0.3 ggplot_build() for the geom_col fixtures
  checks:
  - col_stack_matches
  - col_plain_matches
  - col_mixed_layers_match
  - col_hline_matches
  - col_companions_match
  - col_non_finite_y_refused
