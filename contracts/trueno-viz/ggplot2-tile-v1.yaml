metadata:
  id: ggplot2-tile-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    geom_tile with aes(x, y). layout() must reproduce ggplot_build() in ggplot2 4.0.3: data order
    kept, NA rows kept, width and height = resolution(zero = FALSE, discrete = TRUE) of x and y,
    xmin/xmax = x -/+ width/2 (ditto y), the constant width/height columns, and
    fill/colour/linewidth/linetype/alpha defaults. Scope: the default Cartesian panel with the
    default continuous scales, no facets, no data-mapped colour, fill, size, shape or alpha; a non-
    default coord or a facet is refused with a typed error. Also refused with a typed error: a column shorter than the frame, an infinite or text position, a layer stat other than the geom's default, a companion layer that layout() does not lay out beside it (any geom but these five and geom_point, a stat other than identity on that geom_point, or a point position that is unmapped, text, short, infinite or inherits xmin, xmax, ymin or ymax), a geom alpha that layout does not read, and an aesthetic that ggplot2 keeps and trains a scale on but this layer would drop (a mapped x or y on rect, xmin, xmax, ymin or ymax on text, a fixed size on every geom but text). Tick labels are compared for data
    magnitudes that format() prints without exponent notation. The oracle is a committed JSON
    fixture produced by R; R is never run at test time. Layout only: this contract does not claim
    that the renderer draws the layer as ggplot2 does.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), GeomTile'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_tile/generate.R'
equations:
  resolution:
    formula: "resolution(v) = smallest gap above sqrt(eps) between the sorted distinct finite values; 1 when the range is zero-width (or empty)"
    domain: finite v
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
  bounds:
    formula: "xmin = x - w/2, xmax = x + w/2, ymin = y - h/2, ymax = y + h/2 with w, h the resolutions of x and y"
    domain: one layer
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
  scale_training:
    formula: "Position scales train on the built bounds (xmin, xmax, ymin, ymax) and x, y"
    domain: one panel
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
proof_obligations:
- id: GT-INV-001
  type: invariant
  property: resolution matches ggplot2
  formal: 'forall case in resolution: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: resolution
- id: GT-INV-002
  type: invariant
  property: bounds matches ggplot2
  formal: 'forall case in bounds: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: bounds
- id: GT-INV-003
  type: invariant
  property: scale_training matches ggplot2
  formal: 'forall case in scale_training: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: scale_training
enforcement:
  oracle_cases:
    description: All ten committed cases (regular grid, fractional resolution, unsorted duplicates, NA cells, one cell, one x, groups, style, uneven gaps) equal ggplot2 column for column
    check: grammar::ggplot2_marks_oracle::tile  # every test of the module, one per case
    severity: ERROR
  refuse_discrete:
    description: Text positions are refused (a discrete scale is not modelled), as are infinite positions
    check: grammar::ggplot2_marks_oracle::refuses_infinite_and_text_positions_and_numeric_labels
    severity: ERROR
  refuse_coord:
    description: "Every non-default coord (xlim, ylim, flip, polar, fixed) and every facet, on this geom and on every other marks geom, is refused with Error::UnsupportedCoord, never laid out as the default panel"
    check: grammar::ggplot2_marks_oracle::refuses_every_non_default_coord_and_facet_for_every_geom
    severity: ERROR
  refuse_ragged:
    description: "A mapped column shorter than the frame is refused with Error::Rendering, never NA-padded, for every geom"
    check: grammar::ggplot2_marks_oracle::refuses_a_short_column_for_every_geom
    severity: ERROR
  refuse_nonfinite:
    description: "An infinite position is refused with Error::ScaleDomain and a text position with Error::Rendering, for every geom and every position column"
    check: grammar::ggplot2_marks_oracle::refuses_infinite_and_text_positions_for_every_geom
    severity: ERROR
  refuse_stat:
    description: "A layer stat other than the geom's default is refused with Error::UnsupportedStat"
    check: grammar::ggplot2_marks_oracle::refuses_a_stat_the_layer_does_not_model
    severity: ERROR
  refuse_alpha:
    description: "A geom alpha that layout() does not read is refused"
    check: grammar::ggplot2_marks_oracle::refuses_a_geom_alpha_that_layout_does_not_read
    severity: ERROR
  refuse_dropped_aesthetics:
    description: "An aesthetic ggplot2 keeps but this layer would drop is refused"
    check: grammar::ggplot2_marks_oracle::refuses_aesthetics_ggplot2_keeps_and_this_layer_would_drop
    severity: ERROR
  overwritten_aesthetics_equal_default:
    description: "Aesthetics ggplot2 overwrites give a layer equal to the default layer"
    check: grammar::ggplot2_marks_oracle::overwritten_aesthetics_equal_default
    severity: ERROR
  companion_cases:
    description: "The five geoms beside each other and beside geom_point (24 committed cases, both orders, two and three layers, NA point cells) equal ggplot2 for every marks layer, the point rows and both shared panel scales"
    check: grammar::ggplot2_marks_oracle::companions  # every test of the module, one per case
    severity: ERROR
  refuse_companions:
    description: "Beside this geom, every layer but the five and geom_point (bar, histogram, boxplot, violin, smooth, line, path, step, reference lines) is refused with Error::UnsupportedLayer naming it, in either order, never laid out with scales its stat would widen"
    check: grammar::ggplot2_marks_oracle::refuses_every_companion_geom_layout_does_not_model_for_every_geom
    severity: ERROR
  refuse_point_stat:
    description: "Beside this geom, a geom_point with any stat but identity is refused with Error::UnsupportedStat naming the stat"
    check: grammar::ggplot2_marks_oracle::refuses_every_stat_on_a_point_beside_every_geom
    severity: ERROR
  refuse_point_companion:
    description: "Beside this geom, a geom_point whose x or y is unmapped, unknown, text, short or infinite, or that inherits xmin/xmax/ymin/ymax, is refused with a typed error"
    check: grammar::ggplot2_marks_oracle::refuses_a_point_companion_layout_does_not_model_for_every_geom
    severity: ERROR
  refuse_one_axis:
    description: "A layout that trains one position scale and not the other is refused with Error::ScaleDomain"
    check: grammar::ggplot2_marks_oracle::refuses_a_layout_that_trains_one_axis_only
    severity: ERROR
falsification_tests:
- id: FALSIFY-GT-001
  rule: Bounds are x -/+ width/2
  prediction: "mutating xmin = x - w/2 -> x - w turns tile::grid_regular RED (9 of 9 cases RED)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::tile::grid_regular -- --exact
  if_fails: The half-width is not compared
- id: FALSIFY-GT-002
  rule: Resolution is the smallest gap
  prediction: "mutating fold(INFINITY, f64::min) -> f64::max turns tile::wide_gaps RED (3 cases RED (fractional_res, same_x, wide_gaps))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::tile::wide_gaps -- --exact
  if_fails: No fixture has uneven gaps
- id: FALSIFY-GT-003
  rule: A zero-width range has resolution 1
  prediction: "mutating return 1.0 -> return 2.0 in resolution() turns tile::single_cell RED (2 cases RED (same_x, single_cell))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::tile::single_cell -- --exact
  if_fails: No fixture has a single distinct x or y
- id: FALSIFY-GT-004
  rule: Non-default coord and facets are refused
  prediction: "allowing ylim, or allowing coord_fixed, makes refuses_every_non_default_coord_and_facet_for_every_geom RED for all five geoms (mutations M19, M20 of the round-1 review)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_every_non_default_coord_and_facet_for_every_geom -- --exact
  if_fails: layout() silently ignores the coord, and this contract's scope claim is false
- id: FALSIFY-GT-005
  rule: A short column is a typed error
  prediction: "replacing the ragged-column error in position_column by Ok(NaN) turns refuses_a_short_column_for_every_geom RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_a_short_column_for_every_geom -- --exact
  if_fails: A ragged frame is NA-padded into numbers ggplot2 cannot produce
- id: FALSIFY-GT-006
  rule: A stat the layer does not model is refused
  prediction: "dropping the stat refusal in refuse_layer_parameters turns refuses_a_stat_the_layer_does_not_model RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_a_stat_the_layer_does_not_model -- --exact
  if_fails: geom.stat(..) is silently ignored by layout()
qa_gate:
  id: F-GT-001
  name: ggplot2 conformance (geom_tile)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for every geom_tile fixture, and out-of-scope input is a typed error
  checks:
  - oracle_cases
  - refuse_discrete
  - refuse_coord
  - refuse_ragged
  - refuse_nonfinite
  - refuse_stat
  - refuse_alpha
  - refuse_dropped_aesthetics
  - overwritten_aesthetics_equal_default
  - companion_cases
  - refuse_companions
  - refuse_point_stat
  - refuse_point_companion
  - refuse_one_axis
