  prediction: halving the tail by dropping the 0.5 factor in upper_tail turns the_t_quantile_matches_r_for_every_df_and_level RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_geom_smooth_oracle::the_t_quantile_matches_r_for_every_df_and_level
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-GG-SMOOTH-LM-001
  name: ggplot2 conformance (geom_smooth lm)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for these fixtures
  checks:
  - primary_cases
  - edge_cases
  - quantile_cases
