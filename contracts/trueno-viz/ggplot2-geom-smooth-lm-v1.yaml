metadata:
  id: ggplot2-geom-smooth-lm-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-16'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance, core row 16 geom_smooth(method = "lm") (PLOT-GG-001, paiml/aprender#6983, master #6909). stat_smooth with formula y ~ x per group: the lm fit of the group's finite rows,
    solved as R solves it (LINPACK dqrdc2 Householder QR with limited pivoting and tol 1e-7 on the uncentred [1, x], qr.solve of R for the leverage, predict.lm in R's operation order), evaluated
    at n = 80 points evenly spaced over the group's own x range: fitted y, se of the mean prediction, and ymin/ymax = y -+ qt(1 - (1 - level) / 2, df) * se with df = n - rank; when the slope column
    is rank-deficient (its norm after the intercept falls below 1e-7 of its original norm, e.g. x = 1e8, 1e8 + 8, 1e8 + 16) R drops the slope, draws a flat line at mean(y) with df = n - 1, and so
    does this engine; a rank verdict within 1e-6 of that threshold is refused (R's own verdict there depends on the BLAS). se = FALSE leaves x and y only; a group with fewer than two distinct x
    vanishes as in R; the position scales are trained on x, y, ymin and ymax of the stat output. 28 cases against ggplot2 4.0.3 under R 4.6.2: the 16 base cases plus an offset ladder from
    x near 1e3 to 1e10 and near 1 and both sides of the rank rule. Measured against R, the largest relative error of any fitted column over all cases is 3.6e-13 (the ymin of the groups case); the
    absolute x error grows with the x magnitude only through R's own x grid (1.9e-6 at x = 1e10, relative 1.9e-16). The Student-t quantile is in-crate (regularised incomplete beta, safeguarded
    Newton, Stirling-difference front factor at large df), no crates.io dependency, tested directly against R's qt() for 11 df values from 1 to 1e6 at 8 levels; it returns an Err, never a
    quantile, when the solver does not converge. Scope: continuous numeric x and y, one panel. Refused with a typed Err, never a panic and never an Ok with an empty or partial layer: a method
    other than lm (a bare geom_smooth() is refused, not fitted with lm), a stat other than stat_smooth, fullrange = TRUE, level outside (0, 1), n of 0 or past 1000000, a facet, a mapped colour,
    size, shape, alpha, fill, label, ymin or ymax, a text or missing position column, a layer with no fittable group, a rank verdict within 1e-6 of R's threshold, scale_x/scale_y, any coordinate
    system but the default coord_cartesian (also for a smooth layer alone), a companion other than geom_point, a point companion with a missing column, a non-count stat or infinite or text
    positions, and a drawn plot (to_svg, to_framebuffer, to_terminal). Every refusal above applies only to plots that contain a smooth layer: the same scale, facet or point plot without one is
    unchanged. The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation; R is never run at test time. Every case goes through the public builder and layout().
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_smooth, stat_smooth, predict.lm(interval = "confidence")'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_smooth/generate.R'
entity: {type: ggplot2-row, ref: geom_smooth}
equations:
  lm_band:
    formula: 'x_i = lo + i * (hi - lo) / (n - 1); [1, x] = QR by dqrdc2 (tol 1e-7); y = [1, x_i] beta; se = sqrt(res_var * |[1, x_i] R^-1|^2); ymin, ymax = y -+ qt(1 - (1 - level) / 2, m - rank) se'
    domain: numeric columns, one panel, groups with at least 2 distinct finite x
    codomain: smooth(x,y,ymin,ymax,se,group) -> BuiltLayer.smooth and the trained scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs; groups and flipped_aes exact
    preconditions:
    - x and y are mapped to existing numeric columns, else UnknownColumn or Rendering
    - method lm, stat smooth or none, no facet, no mapped colour, size, shape, alpha, fill, label, ymin or ymax, else UnsupportedStat or Rendering
    - level in (0, 1), n in 1..=1000000, fullrange FALSE, else Rendering
    - coordinate system is the default coord_cartesian, else UnsupportedCoord, also for a smooth layer alone
    - companions are geom_point only, else UnsupportedLayer
    - 'known difference from R: a plot whose groups all have one distinct x returns Err(Rendering) where R returns an empty layer (the fixture expected_constant_x.json records R: 0 rows)'
    - 'known difference from R: n = 1 (a single evaluation point, so a single trained x) returns Err(ScaleDomain) where R draws it'
    - 'known difference from R: level outside (0, 1), n above 1000000 and fullrange = TRUE return Err(Rendering); R gives infinite or empty bands, an unbounded allocation, or a wider x range'
    - 'known difference from R: a data-mapped colour, size, shape, alpha, fill or label (which split groups or style the layer in R), a mapped ymin or ymax, and a facet return Err(Rendering); R draws them'
    - 'known difference from R: scale_x/scale_y with a smooth layer return Err(UnsupportedLayer); to_svg and to_framebuffer return Err(UnsupportedLayer) because the renderer draws no smooth layer'
    - 'same as R: the fit is R''s lm() on the uncentred design, so the offset ladder (x near 1e3 to 1e10 and near 1) matches R to within the tolerance, including R''s own rounding drift at large x, and a slope column below the 1e-7 rank threshold is dropped (flat line at mean(y), df = n - 1)'
    - 'known difference from R: a rank verdict within 1e-6 of the threshold (slope norm / original norm between 1 - 1e-6 and 1 + 1e-6 times 1e-7) returns Err(Rendering) where R decides by the last digit of a norm and so by its BLAS (x = 65319712 + 8 k, k = 0..2 is such a case)'
    - 'known difference from R: no new refusal applies without a smooth layer. With one: a point companion with an unknown column, a non-count stat (stat_count) or infinite or text positions returns Err(UnknownColumn, UnsupportedStat or Rendering) (marks.rs treats the smooth as a modelled companion); scale_x/scale_y and a facet return Err; a line, area, ribbon, boxplot or bar companion returns Err(UnsupportedLayer); the terminal target returns Err(Rendering) for the smooth layer'
    - 'known difference from the tolerance claim: the Student-t quantile is measured to 6e-10 relative at df = 1e8 (3e-12 at 1e6, the table limit); every smooth with fewer than 1e6 rows per group is inside 1e-9 with margin'
    - 'public API change (semver): GeomType::Smooth gains the field spec: SmoothSpec (breaks exhaustive struct patterns and literals), and BuiltLayer gains pub smooth: Option<BuiltSmooth> (breaks struct literals)'
    - 'not expressible in the builder, so not refused and not fitted: formula other than y ~ x, weights, orientation = "y", xseq, span, na.rm (ggplot2 defaults are used: y ~ x, no weights, orientation NA, na.rm FALSE)'
    - 'same as R: a row with a missing or infinite x or y is dropped before the fit; a zero-width y range is widened by the scale (continuous_range), not refused'
proof_obligations:
- id: GG-SMOOTH-LM-INV-001
  type: invariant
  property: Built layer data and trained scales match ggplot2
  formal: '∀ case with ≥2 distinct finite x in some group: layout(case) ≈ ggplot2 fixture (1e-9 rel + 1e-12 abs)'
  applies_to: lm_band
- id: GG-SMOOTH-LM-INV-002
  type: invariant
  property: The Student-t quantile matches R's qt()
  formal: '∀ df in {1,2,3,5,10,30,78,100,1000,1e4,1e6}, q in the fixture table: qt_upper(q, df) ≈ qt(q, df, lower.tail = FALSE) (1e-9 rel + 1e-12 abs)'
  applies_to: lm_band
- id: GG-SMOOTH-LM-INV-003
  type: invariant
  property: Out-of-scope input is a typed Err
  formal: '∀ unsupported input: layout() → Err, never a panic and never an Ok with an empty layer'
  applies_to: lm_band
enforcement:
  primary_cases:
    description: the fitted line and band are reproduced
    check: grammar::ggplot2_geom_smooth_oracle::noisy_data_gets_a_fitted_band
    severity: ERROR
  edge_cases:
    description: two points, constant y, dropped rows and vanishing groups are reproduced
    check: grammar::ggplot2_geom_smooth_oracle::two_points_have_no_residual_degrees_of_freedom
    severity: ERROR
  rank_cases:
    description: the offset ladder and R's rank rule are reproduced
    check: grammar::ggplot2_geom_smooth_oracle::the_offset_ladder_matches_r_including_where_the_slope_is_dropped
    severity: ERROR
  quantile_cases:
    description: the t quantile equals R's qt()
    check: grammar::ggplot2_geom_smooth_oracle::the_t_quantile_matches_r_for_every_df_and_level
    severity: ERROR
falsification_tests:
- id: FALSIFY-GG-SMOOTH-LM-001
  rule: The band uses qt(.975, m-2)
  prediction: using fit.df + 1.0 in the quantile in append_group turns noisy_data_gets_a_fitted_band RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_geom_smooth_oracle::noisy_data_gets_a_fitted_band
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG-SMOOTH-LM-002
  rule: The grid is seq(lo, hi, length.out = n)
  prediction: dividing the grid step by n instead of n - 1 in x_grid turns a_non_default_n_changes_the_grid RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_geom_smooth_oracle::a_non_default_n_changes_the_grid
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
