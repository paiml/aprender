metadata:
  id: render-total-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    Totality of the aprender-viz GGPlot grammar renderers and the draw primitives (paiml/aprender#6941,
    Refs #6909). For every f32 input (NaN, infinities, f32::MAX, subnormals), every coordinate
    limit and every canvas from 1x1 to 512x512, a plot built through GGPlot renders through
    to_framebuffer(), to_svg() and to_terminal() without panicking and in work bounded by the
    canvas, not by the data. Rows with a non-finite position are dropped for every geom except the stroke layers (line, path, step, hline, vline, abline), which refuse a non-finite or out-of-limit position with a typed error from layout() (plot-lines-render-v1) and so never reach a renderer. The
    aliased line computes Bresenham's minor offset in closed form and visits only the steps that
    land on the canvas, so it equals the unclipped walk for every i32 endpoint. The antialiased
    line is clipped, in f64, to the canvas grown by 1024 px before its loop, and clipping changes
    nothing for a segment with both ends inside that guard. NOT covered: the plots/ module renderers
    (ScatterPlot, LineChart, Histogram, from_prompt and the others) and the wasm entry points that
    call them; they still panic or run unbounded for extreme input (paiml/aprender#6952). Three
    stated deviations from the old output: draw_rect no longer shifts a rectangle that starts off
    canvas (an intended fix, RT-EQV-003); an antialiased segment that crosses the guard stays
    within a stated distance of the ideal segment (RT-DEV-001); the circle changes path at radius 4096 within one pixel of the edge
    (RT-DEV-002).
  references:
  - 'Liang & Barsky (1984) Another Efficient Line Clipping Algorithm, CACM 27(2)'
  - 'Bresenham (1965) Algorithm for computer control of a digital plotter, IBM Systems Journal 4(1)'
  - 'Wu (1991) An Efficient Antialiasing Technique, SIGGRAPH 91'
  - 'ggplot2 4.0.3: rows with non-finite positions are removed with a warning'
  - 'crates/aprender-viz/tests/render_total.rs'
equations:
  non_finite_rows_dropped:
    formula: 'rows(layer) = { i : isfinite(x[i]) ∧ isfinite(y[i]) }; every geom except a stroke layer reads only rows(layer); a stroke layer with an infinite position or under coord xlim/ylim is refused by layout()'
    domain: any f32 columns, including NaN, +Inf, -Inf
    codomain: Vec<(f32, f32)> of finite pairs
    invariants:
    - a dropped row never reaches a pixel, a polyline vertex, a bar or an SVG attribute
    - a plot with only non-finite rows renders as an empty panel
  bresenham_closed_form:
    formula: 'n = max(|dx|, |dy|), m = min(|dx|, |dy|); step k ∈ [0, n] lights (major0 + s_major·k, minor0 + s_minor·floor((2·m·k + n) / (2·n))), computed in i128; only the k whose pixel lies on the canvas are visited (major range intersected with a binary-searched minor range)'
    domain: any i32 endpoints (x0, y0, x1, y1) and any canvas
    codomain: framebuffer mutation
    invariants:
    - the lit pixels equal the incremental Bresenham walk (err = dx - |dy|, step x when 2·err ≥ -|dy|, step y when 2·err ≤ dx) pixel for pixel
    - work is at most max(width, height) steps plus two binary searches of log2(n) steps
  segment_clip:
    formula: 'clip(s, B) = s if s ⊂ B; else Liang-Barsky(s, B) in f64, clamped to B; None if s ∩ B = ∅ or any coordinate is non-finite; B = canvas grown by 1024 px'
    domain: segment (x0, y0, x1, y1) of f64 from any f32
    codomain: Option<segment inside B>
    invariants:
    - the antialiased rasteriser's loop length is at most the diagonal of B
    - a segment with both ends in B is returned bit for bit
  bounded_primitives:
    formula: 'draw_circle, draw_rect and fill_rect compute in i64 or saturate; a circle above radius 4096 is filled over the canvas rows only; an area slice walks canvas rows only; draw_rect(x, w) covers [x, x + w) ∩ canvas'
    domain: any i32 centre, radius, origin and any u32 extent
    codomain: framebuffer mutation
    invariants:
    - no integer overflow for any argument
    - work is at most (canvas height) rows or (2 * 4096 + 1) midpoint steps
    - a rectangle that starts left of or above the canvas keeps its far edge at origin + extent
proof_obligations:
- id: RT-INV-001
  type: invariant
  property: No GGPlot grammar renderer (framebuffer, SVG, terminal) and no draw primitive panics or runs unbounded; the plots/ renderers and the wasm entry points are not covered (paiml/aprender#6952)
  formal: '∀ data ∈ f32^n, coord limits, (w, h) ∈ [1,512]²: GGPlot.to_framebuffer ∧ GGPlot.to_svg ∧ GGPlot.to_terminal terminate without panic'
  applies_to: bounded_primitives
- id: RT-INV-002
  type: invariant
  property: Non-finite rows are dropped for every non-stroke geom; a stroke layer refuses them
  formal: '∀ row i, ∀ non-stroke layer: ¬(isfinite(x[i]) ∧ isfinite(y[i])) ⇒ row i contributes no mark and no SVG attribute; ∀ stroke layer with an infinite position: build() succeeds and to_framebuffer() and to_svg() return Err, never a panic'
  applies_to: non_finite_rows_dropped
- id: RT-INV-003
  type: invariant
  property: The SVG carries no NaN or infinity in any attribute or text
  formal: '∀ svg = to_svg(plot): "NaN" ∉ markup(svg) ∧ "inf" ∉ lower(markup(svg))'
  applies_to: non_finite_rows_dropped
- id: RT-EQV-001
  type: equivalence
  property: The aliased line equals the unclipped Bresenham walk for every i32 endpoint; the antialiased line equals the unclipped Wu walk for segments near the canvas
  formal: '∀ x0, y0, x1, y1 ∈ i32, canvas: draw_line = bresenham_walk pixel for pixel (no clipping, no deviation); ∀ segment with both ends in B: draw_line_aa(clip(s, B)) = wu_walk(s) pixel for pixel'
  applies_to: bresenham_closed_form
- id: RT-DEV-001
  type: bound
  property: An antialiased segment that crosses the guard box stays on the ideal segment; drawn-to-ideal at most 2.0 px, ideal-to-drawn at most 1.0 px (the aliased line has no deviation, RT-EQV-001)
  formal: '∀ segment s with an end outside B: (a) every lit pixel centre of draw_line_aa(clip(s, B)) lies within Euclidean distance 2.0 of s; (b) on every major-axis canvas line at least 2 px inside the canvas and 2 px from either end of s, a lit pixel lies within 1.0 of where s crosses that line. Measured on 4103 segments (the three review repros; 1000 with one end on a 512x512 canvas and the other 2000 to 20000 px away; 300 on 800x600; 2000 near-vertical and near-horizontal segments hugging each edge within 8 px; 500 crossing the canvas; 300 crossing it with ends 1e6 to 1e30 px away): (a) 1.3117 px, at an end pixel placed by the end-pixel rule main already has (geometric ceiling sqrt(2.5) = 1.58), (b) 0.5000 px. The unclipped Wu walk of main measures 2.62 px and 2.41 px on the same far segments, because its f32 accumulator drifts over thousands of steps'
  applies_to: segment_clip
- id: RT-EQV-002
  type: equivalence
  property: Circles up to radius 4096 are the midpoint circle
  formal: '∀ centre, radius ≤ 4096: draw_circle = midpoint_circle_reference'
  applies_to: bounded_primitives
- id: RT-EQV-003
  type: equivalence
  property: A rectangle is clipped to the canvas without moving its far edge (an intended fix of a defect on main)
  formal: '∀ origin x ∈ i32, extent w ∈ u32, canvas: columns painted by draw_rect(x, ·, w, ·) = [max(x, 0), min(x + w, width)); the same for rows. Main shifted a rectangle with x < 0 to start at 0 and kept its width, so a geom_bar whose left edge was off canvas was drawn too wide: the default 2-bar chart changed by 38,056 px'
  applies_to: bounded_primitives
- id: RT-DEV-002
  type: bound
  property: The filled circle changes path at radius 4096; the two paths differ only within one pixel of the edge
  formal: '∀ centre: the pixels where the midpoint circle of radius 4096 and the exact integer disc of radius 4096 differ satisfy (r - 1)² < dx² + dy² < (r + 1)²; draw_circle(4097) differs from draw_circle(4096) only where (r - 1)² < dx² + dy² < (r + 2)². The outline above 4096 draws the two end points of each canvas row, so it has gaps near the top and bottom of the circle that the midpoint outline does not'
  applies_to: bounded_primitives
enforcement:
  repros_are_bounded:
    description: the twelve inputs that panicked or hung now return inside a hard time bound
    check: cargo test -p aprender-viz --test render_total
    severity: ERROR
  totality_property:
    description: arbitrary f32, limits and canvas sizes through every geom and output
    check: render_total::every_geom_renders_total
    severity: ERROR
  clipping_equivalence:
    description: the aliased line equals the unclipped walk everywhere; the clipped antialiased line equals the unclipped one near the canvas
    check: render_total::bresenham_line_equals_the_unclipped_line_far_off_the_canvas
    severity: ERROR
  pinned_geometry:
    description: bar and rectangle edges, the circle threshold and the antialiased guard-crossing bound are pinned by fixed cases
    check: render_total::filled_circle_uses_the_midpoint_up_to_4096_and_the_exact_rows_above
    severity: ERROR
falsification_tests:
- id: FALSIFY-RT-001
  rule: Non-finite rows are dropped
  prediction: removing the is_finite filter in BuiltGGPlot::build_layer turns non_finite_rows_are_dropped_not_drawn_at_pixel_zero RED; removing the finite check in BuiltGGPlot::pixel turns three more tests RED (the filter in panel_points is load-bearing, see FALSIFY-RT-008)
  test: cargo test -p aprender-viz --test render_total non_finite_rows_are_dropped_not_drawn_at_pixel_zero
  if_fails: A NaN or infinite row reaches a rasteriser; the totality property cannot see it
- id: FALSIFY-RT-002
  rule: An antialiased segment is clipped before it is walked
  prediction: making canvas_segment return its input unclipped turns wu_line_stays_on_the_ideal_segment_far_off_the_canvas RED, and point_line_area_bar_layers_stack_total and rasterisers_return_for_any_f32_and_i32 hang (measured, both run past 60 s and the run hit its 400 s timeout); every_geom_renders_total, line_coordlim_outside and area_coordlim_outside stay green (stroke layers clip in grammar/stroke.rs, and under xlim/ylim a stroke layer is refused before any segment is drawn)
  test: cargo test -p aprender-viz --test render_total wu_line_stays_on_the_ideal_segment_far_off_the_canvas
  if_fails: No test draws an antialiased segment with an end far off the canvas
- id: FALSIFY-RT-003
  rule: Clipped output stays inside the guard box
  prediction: removing the clamp at the end of clip_segment turns rasterisers_return_for_any_f32_and_i32 RED (an overflow in draw_line_aa)
  test: cargo test -p aprender-viz --test render_total rasterisers_return_for_any_f32_and_i32
  if_fails: The property never draws a segment with one huge and one small endpoint
- id: FALSIFY-RT-004
  rule: draw_circle does not overflow
  prediction: replacing the i64 centre arithmetic in draw_circle with i32 turns point_coordlim_outside RED
  test: cargo test -p aprender-viz --test render_total point_coordlim_outside
  if_fails: No repro puts a circle centre near i32::MAX
- id: FALSIFY-RT-005
  rule: fill_rect does not overflow
  prediction: replacing saturating_add in Framebuffer::fill_rect with + turns bar_coordlim_outside RED
  test: cargo test -p aprender-viz --test render_total bar_coordlim_outside
  if_fails: No repro puts a rectangle origin near u32::MAX
- id: FALSIFY-RT-006
  rule: An area slice walks canvas rows only
  prediction: removing the row clamp in render_area turns area_huge_y_close RED (a hang)
  test: cargo test -p aprender-viz --test render_total area_huge_y_close
  if_fails: The baseline does not map to an extreme pixel in the repro
- id: FALSIFY-RT-007
  rule: Near-canvas output is unchanged by clipping
  prediction: clipping every segment (no guard box shortcut) turns wu_line_equals_the_unclipped_line_near_the_canvas RED
  test: cargo test -p aprender-viz --test render_total wu_line_equals_the_unclipped_line_near_the_canvas
  if_fails: The reference copy and the shipped rasteriser share a bug, or the property never leaves the canvas
- id: FALSIFY-RT-008
  rule: Dropped rows leave no trace in any geom
  prediction: removing the finite filter in GGPlot::panel_points turns dropped_rows_change_nothing_for_every_geom RED (a bar's width is range / n over the rows kept)
  test: cargo test -p aprender-viz --test render_total dropped_rows_change_nothing_for_every_geom
  if_fails: The kept NaN rows are counted by a geom, or the test no longer renders a bar
- id: FALSIFY-RT-009
  rule: draw_rect keeps the far edge of a rectangle that starts off canvas
  prediction: restoring the shift (start.max(0) + extent in draw_rect) turns three bar-geometry tests in grammar::ggplot and two draw_rect tests in render::primitives RED; the expected rectangles are computed from the scale, not from the output
  test: cargo test -p aprender-viz --lib
  if_fails: A bar with a negative left edge is drawn wider than its slot
- id: FALSIFY-RT-010
  rule: The circle changes path exactly above radius 4096
  prediction: changing the threshold comparison to >= or the constant to 4095 turns filled_circle_uses_the_midpoint_up_to_4096_and_the_exact_rows_above and circle_outline_uses_the_midpoint_up_to_4096_and_the_row_ends_above RED
  test: cargo test -p aprender-viz --test render_total _uses_the_midpoint_up_to_4096_
  if_fails: The radius property draws 1..=4096 uniformly and hits the threshold with probability 1/4096
- id: FALSIFY-RT-011
  rule: The antialiased guard-crossing deviation is bounded against the ideal segment
  prediction: a clip that moves the cut end off the ideal segment by more than WU_DRAWN_BOUND (2.0 px) or WU_COVER_BOUND (1.0 px) turns wu_line_stays_on_the_ideal_segment_far_off_the_canvas RED (the constants are test thresholds, not code, so lowering them only checks the test is sharp)
  test: cargo test -p aprender-viz --test render_total wu_line_stays_on_the_ideal_segment_far_off_the_canvas
  if_fails: The bound in RT-DEV-001 is not measured on the segments the test draws, or the edge-hugging family is missing
- id: FALSIFY-RT-012
  rule: The aliased line is the unclipped Bresenham walk for every i32
  prediction: dropping the + n rounding term of the closed form, starting one step after the first visible step, or weakening the comparison in first_step_reaching turns bresenham_line_equals_the_unclipped_line_far_off_the_canvas RED (the three review repros, 2300 far segments and 2000 edge-hugging near-vertical and near-horizontal ones)
  test: cargo test -p aprender-viz --test render_total bresenham_line_equals_the_unclipped_line_far_off_the_canvas
  if_fails: The reference walk and the closed form share a bug (ending one step after the last visible step is an equivalent mutant, since that step is off the canvas and plot_pixel_if_visible drops it); bresenham_line_is_the_nearest_pixel_per_column_for_any_i32 checks both against a brute-force i128 nearest-pixel reference
qa_gate:
  id: F-RT-001
  name: aprender-viz GGPlot renderers and draw primitives are total
  description: the GGPlot grammar renderers (framebuffer, SVG, terminal) and the draw primitives neither panic nor run unbounded for any f32 input; the plots/ renderers and the wasm entry points are not covered (paiml/aprender#6952)
  checks:
  - repros_are_bounded
  - totality_property
  - clipping_equivalence
  - pinned_geometry
