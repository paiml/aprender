metadata:
  id: ggplot2-row18-text-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-16'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance row 18 (PLOT-GG-001, paiml/aprender#6909) - geom_text. x and y are shifted by nudge_x and nudge_y (position_nudge) and the scales retrain on the shifted positions; angle, hjust and vjust pass through (defaults 0, 0.5, 0.5); size defaults to 11 / .pt mm; labels pass through as text. group is -1 unless group is mapped (label forms no group). NA positions are kept and not trained. Font family, fontface and lineheight are not layout and not claimed.
    The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation;
    R is never run at test time. Every case goes through the public builder and layout().
    Scope: stated in the fixtures: facet_wrap over an all-text column per panel as R (layer data matched to the plot's panels by level); other facets, a numeric facet column, a data-mapped colour, size, shape, alpha or fill, text or infinite positions, group columns with gaps or mixed types, and layer data whose facet levels are absent from the plot data return Err(Rendering). Continuous x and y, numeric data; any coordinate system but the default coord_cartesian (coord_flip, limits, polar, fixed) returns Err(UnsupportedCoord) because layout() applies none. Stat: only the identity stat (none, or Stat::Identity) is in scope; any other stat returns Err(UnsupportedStat) because layout() computes none, and any companion geom other than geom_point returns Err(UnsupportedLayer). Position adjustments other than the nudge of geom_text, na.rm and orientation are not expressible in the builder (ggplot2 defaults: identity, FALSE, NA). A trained x or y range with no finite value or a single value returns Err(ScaleDomain) (ggplot2 widens such ranges in a way the shared scale code does not reproduce). Known differences from ggplot2 4.0.3, all refused with Err(Rendering) - a numeric label column (R accepts it and prints the numbers; R's number formatting is not modelled), a non-finite nudge_x, nudge_y, hjust, vjust or angle (R accepts them), and a geom_point with an infinite x or y beside a segment or polygon (measured on 4.0.3: R keeps the row in layer_data, clamps it to the panel edge and the scale ignores it; layout() drops such rows, so it refuses rather than answer differently; the merged line, path, step and reference rows keep their own Err(Rendering)). A geom_point routed to the scaled layout (text position column, or scale_x/scale_y) beside a line keeps that layout's Err(UnsupportedLayer). Stated limit - positions are f64 sums of the f32 inputs, but the trained scale limits are f32, so for an x + nudge that is not representable in f32 the limits differ from R by up to about 6e-8 rel (the 1e-9 claim holds where the sum is f32-representable, as in every fixture). Anything outside the scope returns a typed Err, never a panic. Tick labels are claimed exact only for non-zero data magnitude from 2^-8 (0.0039) to 10^4 (paiml/aprender#6958).
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_text'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_text/generate.R'
entity: {type: ggplot2-row, ref: geom_text}
equations:
  labels:
    formula: 'layer_data(geom_text) = rows (x + nudge_x, y + nudge_y, label, PANEL, group, nudge, colour, size, angle, hjust, vjust, alpha)'
    domain: numeric columns, continuous scales, facet_wrap or no facet
    codomain: BuiltLayer.text and the trained panel scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs (trained scale limits at f32 precision, see the stated limit); labels, colours, groups, panels and counts exact
    preconditions:
    - trained x and y ranges are non-degenerate, else ScaleDomain
    - coordinate system is the default coord_cartesian, else UnsupportedCoord
    - every layer has the identity stat, else UnsupportedStat; companion layers are geom_point only, else UnsupportedLayer
proof_obligations:
- id: GG18-INV-001
  type: invariant
  property: Layer data and trained scales match ggplot2
  formal: 'forall case: layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs; exact labels, colours, groups, panels)'
  applies_to: labels
enforcement:
  primary_cases:
    description: the main fixtures are reproduced
    check: grammar::ggplot2_text_oracle::plain
    severity: ERROR
  group_or_style_cases:
    description: group, colour and facet fixtures are reproduced
    check: grammar::ggplot2_text_oracle::text_group_ids_rank_sorted_levels
    severity: ERROR
  edge_cases:
    description: edge fixtures are reproduced or refused with a typed Err
    check: grammar::ggplot2_text_oracle::na_rows_are_kept_and_not_trained
    severity: ERROR
falsification_tests:
- id: FALSIFY-GG18-001
  rule: position_nudge shifts the positions
  prediction: dropping the nudge from the positions in text.rs build_layer turns nudge_shifts_positions_and_retrains_the_scales RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::nudge_shifts_positions_and_retrains_the_scales
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-002
  rule: The scales retrain on the nudged positions
  prediction: ignoring the nudge in GGPlot::trained_domains turns nudge_shifts_positions_and_retrains_the_scales RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::nudge_shifts_positions_and_retrains_the_scales
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-003
  rule: The default size is 11 / .pt
  prediction: changing DEFAULT_SIZE_MM in text.rs turns plain RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::plain
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-004
  rule: hjust and vjust are not swapped
  prediction: swapping hjust and vjust in text.rs build_layer turns hjust_vjust_and_angle_pass_through RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::hjust_vjust_and_angle_pass_through
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-005
  rule: A text layer without a label is refused
  prediction: returning empty labels when the label aesthetic is absent turns a_text_layer_without_a_label_is_refused RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::a_text_layer_without_a_label_is_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-006
  rule: Text beside a path-family layer is refused by the path-family guard on its own
  prediction: letting require_identity_stats (path.rs) accept the line beside geom_text turns the_path_guard_refuses_text_beside_a_path_layer RED, with require_modelled_companions untouched
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::the_path_guard_refuses_text_beside_a_path_layer
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-007
  rule: A path-family layer beside text is refused by the marks guard on its own
  prediction: letting require_modelled_companions (marks.rs) accept the line beside geom_text turns the_marks_guard_refuses_a_path_layer_beside_text RED, with require_identity_stats untouched
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::the_marks_guard_refuses_a_path_layer_beside_text
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-008
  rule: A text layer under any non-default coord is refused, alone or beside geom_point
  prediction: dropping geom_text from the layers require_default_coord (path.rs) checks turns every_non_default_coord_is_refused_for_text RED (text alone under coord_flip returns Ok)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::every_non_default_coord_is_refused_for_text
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-009
  rule: A numeric label column is refused (known difference from ggplot2 4.0.3, which prints the numbers)
  prediction: removing the numeric-column check in text.rs labels turns a_numeric_label_column_is_refused RED (the layout returns Ok)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::a_numeric_label_column_is_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-010
  rule: A non-finite nudge_x, nudge_y, hjust, vjust or angle is refused (known difference from ggplot2 4.0.3)
  prediction: removing the is_finite check in text.rs refuse_non_finite turns non_finite_text_params_are_refused RED (the layout returns Ok)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::non_finite_text_params_are_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-011
  rule: A geom_point routed to the scaled layout (text position column, or a scale_x/scale_y spec) beside a line keeps the scaled scope refusal Err(UnsupportedLayer) as on main; the path companion guard runs only after that routing
  prediction: moving require_path_point_companions in ggplot.rs layout() before the uses_position_scales branch turns a_point_routed_to_the_scaled_layout_keeps_the_scoped_refusal_beside_a_line RED (Err(Rendering) / Err(UnknownColumn) instead of UnsupportedLayer)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::a_point_routed_to_the_scaled_layout_keeps_the_scoped_refusal_beside_a_line
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG18-012
  rule: A geom_point with an infinite x or y beside a segment or polygon is refused with Err(Rendering) (known difference from ggplot2 4.0.3, which keeps the row in layer_data, clamps it to the panel edge and leaves the scale untrained by it)
  prediction: letting require_path_point_companions pass an infinite value (Infinite::Keep for segment and polygon) turns an_infinite_point_position_beside_segment_or_polygon_is_refused RED (the layout returns Ok with the row dropped)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_text_oracle::an_infinite_point_position_beside_segment_or_polygon_is_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-GG18-001
  name: ggplot2 conformance row 18 (geom_text)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for the row-18 fixtures
  checks:
  - primary_cases
  - group_or_style_cases
  - edge_cases
