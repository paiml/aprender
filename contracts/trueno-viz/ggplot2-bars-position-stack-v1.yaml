metadata:
  id: ggplot2-bars-position-stack-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-15'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance row position_stack (PLOT-GG-001, paiml/aprender#6929, master #6909). position_stack() stacks the bars sharing an x: the first group on top unless reverse = TRUE, negative and positive bars separately, y at the vjust point of each segment (default 1, the top edge); with no repeated x and vjust = 1 the data is left alone. The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation; R is never run at test time. Every case goes through bar_layout(). Scope: vertical bars (orientation x), a discrete text x and a discrete text fill, geom_col (stat identity) and geom_bar (stat count), vjust and reverse of position_stack, no facet in the fixture, no dodge. Anything else is out of scope for this row.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), position_stack, pos_stack'
  - 'crates/aprender-viz/fixtures/ggplot2/position_stack/generate.R'
entity: {type: ggplot2-row, ref: position_stack}
equations:
  stack:
    formula: 'pos_stack(data, vjust, fill = FALSE) per (PANEL, xmin)'
    domain: discrete text x and fill, finite numeric y (geom_col) or counted rows (geom_bar)
    codomain: BarRow.{y,ymin,ymax} and the trained discrete x and continuous y scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs; labels, groups and panels exact
    preconditions:
    - x and fill are text columns, else BarError::WrongType
proof_obligations:
- id: GGPS-INV-001
  type: invariant
  property: Bar rows and trained scales match ggplot2
  formal: 'forall case: bar_layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs; exact labels, groups, panels)'
  applies_to: stack
enforcement:
  default_cases:
    description: the default stack fixture (col_stack, first group on top) is reproduced
    check: grammar::ggplot2_bars_stack_oracle::position_stack_col_default
    severity: ERROR
  reverse_and_count_cases:
    description: the reverse fixtures (col_stack_reverse, col_stack_reverse_vjust_half) are reproduced
    check: grammar::ggplot2_bars_stack_oracle::position_stack_reverse
    severity: ERROR
  edge_cases:
    description: the negative-value fixtures (col_stack_negative, col_stack_negative_vjust_half) are reproduced
    check: grammar::ggplot2_bars_stack_oracle::position_stack_negative_values
    severity: ERROR
falsification_tests:
- id: FALSIFY-GGPS-001
  rule: The first group stacks on top
  prediction: stacking in group order from the bottom turns position_stack_col_default RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_stack_oracle::position_stack_col_default
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGPS-002
  rule: vjust selects the point inside each segment
  prediction: ignoring vjust turns position_stack_vjust RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_stack_oracle::position_stack_vjust
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGPS-003
  rule: reverse flips the stacking order
  prediction: ignoring reverse in stack() turns position_stack_reverse RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_stack_oracle::position_stack_reverse
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGPS-004
  rule: Negative bars stack apart from positive ones
  prediction: stacking negative and positive bars together turns position_stack_negative_values RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_stack_oracle::position_stack_negative_values
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GGPS-005
  rule: A unique x with vjust 1 is left alone
  prediction: stacking when no x repeats turns position_stack_unique_x RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_stack_oracle::position_stack_unique_x
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-GGPS-001
  name: ggplot2 conformance row position_stack
  description: aprender-viz bar_layout equals ggplot2 4.0.3 ggplot_build() for the position_stack fixtures
  checks:
  - default_cases
  - reverse_and_count_cases
  - edge_cases
