metadata:
  id: ggplot2-area-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    geom_area (stat_align + position_stack). layout() must reproduce ggplot_build() in ggplot2 4.0.3
    for the layer data frame (x, y, group, ymin, ymax, xmin/xmax after stacking, align_padding when
    stat_align ran, fill/colour/linewidth/linetype/alpha defaults) and for the trained, expanded
    scales. Scope: the default Cartesian panel with the default continuous scales, no facets, no
    data-mapped colour, fill, size, shape or alpha; a non-default coord or a facet is refused with a
    typed error. Tick labels are compared for data magnitudes that format() prints without exponent
    notation. The oracle is a committed JSON fixture produced by R; R is never run at test time.
    Layout only: this contract does not claim that the renderer draws the layer as ggplot2 does.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), GeomArea'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_area/generate.R'
equations:
  single_group:
    formula: "A lone group skips stat_align: rows sort stably by x; ymin = 0, ymax = y; an x that repeats stacks in data order within that x and adds xmin = xmax = x, y = ymax"
    domain: one group, y >= 0, NA rows dropped
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
  stat_align:
    formula: "With several groups every group is resampled on loc = unique(sort(c(u - a, u, u + a))) for u in the distinct x, a = min(0.001 * span, min gap / 3), by linear interpolation (ties averaged, no extrapolation), padded with y = 0 rows at min - a and max + a flagged align_padding; a group whose x are all equal is dropped"
    domain: two or more groups, y >= 0
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
  stack_order:
    formula: "position_stack piles rows sharing an x in order(xmin, -group): the highest group id sits lowest; ymin = min(below, below + y), ymax = max(...), y = ymax"
    domain: rows sharing an x
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
proof_obligations:
- id: GA-INV-001
  type: invariant
  property: single_group matches ggplot2
  formal: 'forall case in single_group: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: single_group
- id: GA-INV-002
  type: invariant
  property: stat_align matches ggplot2
  formal: 'forall case in stat_align: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: stat_align
- id: GA-INV-003
  type: invariant
  property: stack_order matches ggplot2
  formal: 'forall case in stack_order: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: stack_order
enforcement:
  oracle_cases:
    description: All nine committed cases (single, duplicate, NA, text and numeric groups, 2-row groups, zero y, style, duplicate x inside a group, a gap smaller than 0.3% of the span) equal ggplot2 column for column
    check: grammar::ggplot2_marks_oracle::area::groups_text
    severity: ERROR
  refuse_negative:
    description: Negative y is refused (position_stack splits on sign; not modelled)
    check: grammar::ggplot2_marks_oracle::refuses_negative_area_and_degenerate_groups
    severity: ERROR
  refuse_coord:
    description: "A non-default coord (coord_cartesian limits, coord_flip, polar) or any facet is refused with Error::UnsupportedCoord, never laid out as the default panel"
    check: grammar::ggplot2_marks_oracle::refuses_non_default_coord
    severity: ERROR
falsification_tests:
- id: FALSIFY-GA-001
  rule: Alignment offset is 0.001 of the x span
  prediction: "mutating span * 0.001 -> span * 0.002 turns area::groups_text RED (6 cases RED (dup_in_group_multi, groups_num, groups_text, na_rows and two more))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::area::groups_text -- --exact
  if_fails: The fixtures cannot see the align offset
- id: FALSIFY-GA-002
  rule: Stack order is order(xmin, -group)
  prediction: "mutating flipping the group comparison in stack() turns area::groups_num RED (6 cases RED (dup_in_group_multi, groups_num, groups_text, na_rows and two more))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::area::groups_num -- --exact
  if_fails: No fixture stacks two groups at one x
- id: FALSIFY-GA-003
  rule: Offset is capped at a third of the smallest x gap
  prediction: "mutating min_gap / 3.0 -> min_gap / 2.0 turns area::tiny_gap RED (only tiny_gap RED (the other eight cases have 0.001 * span as the binding term))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::area::tiny_gap -- --exact
  if_fails: No fixture has a gap small enough for the cap to bind
- id: FALSIFY-GA-004
  rule: A repeated x inside a group keeps first and last row, first moved left by the offset
  prediction: "mutating first.0 - adjust -> first.0 + adjust turns area::dup_in_group_multi RED (only dup_in_group_multi RED)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::area::dup_in_group_multi -- --exact
  if_fails: No fixture repeats an x inside a group in the aligned (multi-group) path
- id: FALSIFY-GA-005
  rule: Non-default coord and facets are refused
  prediction: "a Coord with limits, coord_flip, polar, or a facet makes layout() return Error::UnsupportedCoord instead of laying out the default panel"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_non_default_coord -- --exact
  if_fails: layout() silently ignores the coord, and this contract's scope claim is false
qa_gate:
  id: F-GA-001
  name: ggplot2 conformance (geom_area)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for every geom_area fixture, and out-of-scope input is a typed error
  checks:
  - oracle_cases
  - refuse_negative
  - refuse_coord
