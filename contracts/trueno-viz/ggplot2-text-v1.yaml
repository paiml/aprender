metadata:
  id: ggplot2-text-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    geom_text with aes(x, y, label), layout only: positions and ranges, labels as passthrough
    strings. layout() must reproduce ggplot_build() in ggplot2 4.0.3: data order, NA kept, labels
    verbatim (spaces, commas, unicode, empty, NA), and the GeomText defaults (colour black, size 11
    / .pt, family empty, angle 0, hjust = vjust = 0.5, fontface 1, lineheight 1.2). Glyph metrics
    and rendering are not claimed. Scope: the default Cartesian panel with the default continuous
    scales, no facets, no data-mapped colour, fill, size, shape or alpha; a non-default coord or a
    facet is refused with a typed error. Also refused with a typed error: a column shorter than the frame, an infinite or text position, a layer stat other than the geom's default, a geom alpha that layout does not read, and an aesthetic that ggplot2 keeps and trains a scale on but this layer would drop (a mapped x or y on rect, xmin, xmax, ymin or ymax on text, a fixed size on every geom but text). Tick labels are compared for data magnitudes that format()
    prints without exponent notation. The oracle is a committed JSON fixture produced by R; R is
    never run at test time. Layout only: this contract does not claim that the renderer draws the
    layer as ggplot2 does.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), GeomText'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_text/generate.R'
equations:
  passthrough:
    formula: "x, y and label are copied unchanged, row for row; label is not part of the group id"
    domain: finite or NA positions, string labels
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
  default_aes:
    formula: "size = 11 / .pt mm (= 3.866057838660578), colour = black, family = '', angle = 0, hjust = vjust = 0.5, fontface = 1, lineheight = 1.2, nudge_x = nudge_y = 0, alpha = NA"
    domain: no aesthetic set
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
proof_obligations:
- id: GX-INV-001
  type: invariant
  property: passthrough matches ggplot2
  formal: 'forall case in passthrough: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: passthrough
- id: GX-INV-002
  type: invariant
  property: default_aes matches ggplot2
  formal: 'forall case in default_aes: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: default_aes
enforcement:
  oracle_cases:
    description: All nine committed cases (basic, unsorted duplicates, NA positions, groups, style, odd labels, one row, negative, NA label) equal ggplot2 column for column
    check: grammar::ggplot2_marks_oracle::text  # every test of the module, one per case
    severity: ERROR
  refuse_numeric_label:
    description: A numeric label column, and non-finite or text positions, are refused with a typed error
    check: grammar::ggplot2_marks_oracle::refuses_infinite_and_text_positions_and_numeric_labels
    severity: ERROR
  refuse_coord:
    description: "Every non-default coord (xlim, ylim, flip, polar, fixed) and every facet, on this geom and on every other marks geom, is refused with Error::UnsupportedCoord, never laid out as the default panel"
    check: grammar::ggplot2_marks_oracle::refuses_every_non_default_coord_and_facet_for_every_geom
    severity: ERROR
  refuse_ragged:
    description: "A mapped column shorter than the frame is refused with Error::Rendering, never NA-padded, for every geom"
    check: grammar::ggplot2_marks_oracle::refuses_a_short_column_for_every_geom
    severity: ERROR
  refuse_nonfinite:
    description: "An infinite position is refused with Error::ScaleDomain and a text position with Error::Rendering, for every geom and every position column"
    check: grammar::ggplot2_marks_oracle::refuses_infinite_and_text_positions_for_every_geom
    severity: ERROR
  refuse_parameters:
    description: "A layer stat other than the geom's default, a geom alpha layout does not read, and an aesthetic ggplot2 keeps but this layer would drop are refused; aesthetics ggplot2 overwrites equal the default layer"
    check: grammar::ggplot2_marks_oracle::refuses_a_stat_the_layer_does_not_model
    severity: ERROR
falsification_tests:
- id: FALSIFY-GX-001
  rule: Default font size is 11 pt / .pt
  prediction: "mutating FONTSIZE_PT 11 -> 12 turns text::basic RED (8 cases RED (style sets size, so it stays green))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::text::basic -- --exact
  if_fails: The default size is not compared
- id: FALSIFY-GX-002
  rule: An NA label stays NA
  prediction: "mutating Null label -> empty string turns text::na_label RED (only na_label RED)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::text::na_label -- --exact
  if_fails: No fixture has an NA label
- id: FALSIFY-GX-003
  rule: Default hjust is 0.5
  prediction: "mutating (hjust, 0.5) -> (hjust, 0.0) turns text::basic RED (9 of 9 cases RED)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::text::basic -- --exact
  if_fails: The default justification is not compared
- id: FALSIFY-GX-004
  rule: Non-default coord and facets are refused
  prediction: "allowing ylim, or allowing coord_fixed, makes refuses_every_non_default_coord_and_facet_for_every_geom RED for all five geoms (mutations M19, M20 of the round-1 review)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_every_non_default_coord_and_facet_for_every_geom -- --exact
  if_fails: layout() silently ignores the coord, and this contract's scope claim is false
- id: FALSIFY-GX-005
  rule: A short column is a typed error
  prediction: "replacing the ragged-column error in position_column by Ok(NaN) turns refuses_a_short_column_for_every_geom RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_a_short_column_for_every_geom -- --exact
  if_fails: A ragged frame is NA-padded into numbers ggplot2 cannot produce
- id: FALSIFY-GX-006
  rule: A stat the layer does not model is refused
  prediction: "dropping the stat refusal in refuse_layer_parameters turns refuses_a_stat_the_layer_does_not_model RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_a_stat_the_layer_does_not_model -- --exact
  if_fails: geom.stat(..) is silently ignored by layout()
qa_gate:
  id: F-GX-001
  name: ggplot2 conformance (geom_text)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for every geom_text fixture, and out-of-scope input is a typed error
  checks:
  - oracle_cases
  - refuse_numeric_label
  - refuse_coord
  - refuse_ragged
  - refuse_nonfinite
  - refuse_parameters
