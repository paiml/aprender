metadata:
  id: ggplot2-row17-polygon-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-16'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance row 17 (PLOT-GG-001, paiml/aprender#6909) - geom_polygon. Rows keep data order and are neither sorted nor closed at build time; every row carries colour NA (white, alpha 0), fill #333333FF, linewidth 0.5 and linetype 1. Groups rank the sorted distinct value. NA vertices are kept and not trained.
    The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation;
    R is never run at test time. Every case goes through the public builder and layout().
    Scope: stated in the fixtures: facet_wrap over an all-text column per panel as R (layer data matched to the plot's panels by level); other facets, a numeric facet column, a data-mapped colour, size, shape, alpha or fill, text or infinite positions, group columns with gaps or mixed types, and layer data whose facet levels are absent from the plot data return Err(Rendering). Continuous x and y, numeric data; any coordinate system but the default coord_cartesian (coord_flip, limits, polar, fixed) returns Err(UnsupportedCoord) because layout() applies none. Stat: only the identity stat (none, or Stat::Identity) is in scope; any other stat returns Err(UnsupportedStat) because layout() computes none, and any companion geom other than geom_point returns Err(UnsupportedLayer). Position adjustments other than the nudge of geom_text, na.rm and orientation are not expressible in the builder (ggplot2 defaults: identity, FALSE, NA). A trained x or y range with no finite value or a single value returns Err(ScaleDomain) (ggplot2 widens such ranges in a way the shared scale code does not reproduce). Anything outside the scope returns a typed Err, never a panic. Tick labels are claimed exact only for non-zero data magnitude from 2^-8 (0.0039) to 10^4 (paiml/aprender#6958).
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_polygon'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_polygon/generate.R'
equations:
  polygons:
    formula: 'layer_data(geom_polygon) = rows (x, y, PANEL, group, colour NA, fill #333333FF, linewidth 0.5, linetype 1, alpha) in data order'
    domain: numeric columns, continuous scales, facet_wrap or no facet
    codomain: BuiltLayer.path (fill) and the trained panel scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs; labels, colours, groups, panels and counts exact
    preconditions:
    - trained x and y ranges are non-degenerate, else ScaleDomain
    - coordinate system is the default coord_cartesian, else UnsupportedCoord
    - every layer has the identity stat, else UnsupportedStat; companion layers are geom_point only, else UnsupportedLayer
proof_obligations:
- id: GG17-INV-001
  type: invariant
  property: Layer data and trained scales match ggplot2
  formal: 'forall case: layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs; exact labels, colours, groups, panels)'
  applies_to: polygons
enforcement:
  primary_cases:
    description: the main fixtures are reproduced
    check: grammar::ggplot2_polygon_oracle::one_group_keeps_row_order
    severity: ERROR
  group_or_style_cases:
    description: group, colour and facet fixtures are reproduced
    check: grammar::ggplot2_polygon_oracle::facet_wrap_panels
    severity: ERROR
  edge_cases:
    description: edge fixtures are reproduced or refused with a typed Err
    check: grammar::ggplot2_polygon_oracle::na_vertices_are_kept_and_not_trained
    severity: ERROR
falsification_tests:
- id: FALSIFY-GG17-001
  rule: The default fill is grey20
  prediction: changing POLYGON_FILL in path.rs turns one_group_keeps_row_order RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_polygon_oracle::one_group_keeps_row_order
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG17-002
  rule: The default outline colour is NA, transparent
  prediction: making POLYGON_NO_COLOUR opaque turns one_group_keeps_row_order RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_polygon_oracle::one_group_keeps_row_order
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG17-003
  rule: Rows keep data order
  prediction: reversing x in the geom_polygon arm of path.rs build_layer turns one_group_keeps_row_order RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_polygon_oracle::one_group_keeps_row_order
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG17-004
  rule: A fixed colour overrides the NA outline
  prediction: ignoring color_value for a polygon turns fixed_colour_and_alpha RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_polygon_oracle::fixed_colour_and_alpha
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG17-005
  rule: A data-mapped fill is refused
  prediction: removing the fill clause of the refusal in path.rs stroke_aes turns a_data_mapped_fill_is_refused RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_polygon_oracle::a_data_mapped_fill_is_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-GG17-001
  name: ggplot2 conformance row 17 (geom_polygon)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for the row-17 fixtures
  checks:
  - primary_cases
  - group_or_style_cases
  - edge_cases
