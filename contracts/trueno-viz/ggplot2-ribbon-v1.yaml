metadata:
  id: ggplot2-ribbon-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    geom_ribbon with aes(x, ymin, ymax). layout() must reproduce ggplot_build() in ggplot2 4.0.3:
    rows ordered by (group, x) with NA x last, y = ymin, NA kept,
    fill/colour/linewidth/linetype/alpha defaults, and the scales trained on x, ymin and ymax.
    Scope: the default Cartesian panel with the default continuous scales, no facets, no data-mapped
    colour, fill, size, shape or alpha; a non-default coord or a facet is refused with a typed
    error. Also refused with a typed error: a column shorter than the frame, an infinite or text position, a layer stat other than the geom's default, a companion layer that layout() does not lay out beside it (any geom but these five and geom_point, a stat other than identity on that geom_point, or a point position that is unmapped, text, short, infinite or inherits xmin, xmax, ymin or ymax), a geom alpha that layout does not read, and an aesthetic that ggplot2 keeps and trains a scale on but this layer would drop (a mapped x or y on rect, xmin, xmax, ymin or ymax on text, a fixed size on every geom but text). Tick labels are compared for data magnitudes that format() prints without exponent
    notation. The oracle is a committed JSON fixture produced by R; R is never run at test time.
    Layout only: this contract does not claim that the renderer draws the layer as ggplot2 does.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), GeomRibbon'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_ribbon/generate.R'
equations:
  setup_data:
    formula: "order(PANEL, group, x) is stable and places NA x last; y is ymin; flipped_aes is FALSE; NA ymin/ymax rows are kept"
    domain: x/ymin/ymax numeric or NA
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
  scale_training:
    formula: "Position scales train on the built x, ymin, ymax, y (ymin may exceed ymax: reversed bounds both count)"
    domain: one panel
    codomain: built layer data frame
    invariants:
    - the built column set and every value equal ggplot2 4.0.3's
    preconditions:
    - input inside the stated scope
proof_obligations:
- id: GR-INV-001
  type: invariant
  property: setup_data matches ggplot2
  formal: 'forall case in setup_data: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: setup_data
- id: GR-INV-002
  type: invariant
  property: scale_training matches ggplot2
  formal: 'forall case in scale_training: columns(layout) = columns(ggplot_build) and values within 1e-9 rel + 1e-12 abs (labels, colours, groups exact)'
  applies_to: scale_training
enforcement:
  oracle_cases:
    description: All nine committed cases (unsorted, text and numeric groups, NA ymin, NA x, duplicate x, reversed bounds, 2-row groups, style) equal ggplot2 column for column
    check: grammar::ggplot2_marks_oracle::ribbon  # every test of the module, one per case
    severity: ERROR
  refuse_missing:
    description: "A ribbon without ymin or ymax, and the flipped xmin/xmax form, are refused with Error::Rendering"
    check: grammar::ggplot2_marks_oracle::refuses_missing_required_aesthetics
    severity: ERROR
  refuse_coord:
    description: "Every non-default coord (xlim, ylim, flip, polar, fixed) and every facet, on this geom and on every other marks geom, is refused with Error::UnsupportedCoord, never laid out as the default panel"
    check: grammar::ggplot2_marks_oracle::refuses_every_non_default_coord_and_facet_for_every_geom
    severity: ERROR
  refuse_ragged:
    description: "A mapped column shorter than the frame is refused with Error::Rendering, never NA-padded, for every geom"
    check: grammar::ggplot2_marks_oracle::refuses_a_short_column_for_every_geom
    severity: ERROR
  refuse_nonfinite:
    description: "An infinite position is refused with Error::ScaleDomain and a text position with Error::Rendering, for every geom and every position column"
    check: grammar::ggplot2_marks_oracle::refuses_infinite_and_text_positions_for_every_geom
    severity: ERROR
  refuse_stat:
    description: "A layer stat other than the geom's default is refused with Error::UnsupportedStat"
    check: grammar::ggplot2_marks_oracle::refuses_a_stat_the_layer_does_not_model
    severity: ERROR
  refuse_alpha:
    description: "A geom alpha that layout() does not read is refused"
    check: grammar::ggplot2_marks_oracle::refuses_a_geom_alpha_that_layout_does_not_read
    severity: ERROR
  refuse_dropped_aesthetics:
    description: "An aesthetic ggplot2 keeps but this layer would drop is refused"
    check: grammar::ggplot2_marks_oracle::refuses_aesthetics_ggplot2_keeps_and_this_layer_would_drop
    severity: ERROR
  overwritten_aesthetics_equal_default:
    description: "Aesthetics ggplot2 overwrites give a layer equal to the default layer"
    check: grammar::ggplot2_marks_oracle::overwritten_aesthetics_equal_default
    severity: ERROR
  companion_cases:
    description: "The five geoms beside each other and beside geom_point (24 committed cases, both orders, two and three layers, NA point cells) equal ggplot2 for every marks layer, the point rows and both shared panel scales"
    check: grammar::ggplot2_marks_oracle::companions  # every test of the module, one per case
    severity: ERROR
  refuse_companions:
    description: "Beside this geom, every layer but the five and geom_point (bar, histogram, boxplot, violin, smooth, line, path, step, reference lines) is refused with Error::UnsupportedLayer naming it, in either order, never laid out with scales its stat would widen"
    check: grammar::ggplot2_marks_oracle::refuses_every_companion_geom_layout_does_not_model_for_every_geom
    severity: ERROR
  refuse_point_stat:
    description: "Beside this geom, a geom_point with any stat but identity is refused with Error::UnsupportedStat naming the stat"
    check: grammar::ggplot2_marks_oracle::refuses_every_stat_on_a_point_beside_every_geom
    severity: ERROR
  refuse_point_companion:
    description: "Beside this geom, a geom_point whose x or y is unmapped, text or short, or that inherits xmin/xmax/ymin/ymax, is refused with Error::Rendering"
    check: grammar::ggplot2_marks_oracle::refuses_a_point_companion_layout_does_not_model_for_every_geom
    severity: ERROR
  refuse_point_column:
    description: "Beside this geom, a geom_point position column that is missing is refused with Error::UnknownColumn and one with an infinite value (in the plot frame or the layer frame) with Error::ScaleDomain; an NA cell is laid out"
    check: grammar::ggplot2_marks_oracle::refuses_a_missing_or_infinite_point_column_and_keeps_an_na_cell_for_every_geom
    severity: ERROR
  refuse_one_axis:
    description: "A layout that trains one position scale and not the other is refused with Error::ScaleDomain"
    check: grammar::ggplot2_marks_oracle::refuses_a_layout_that_trains_one_axis_only
    severity: ERROR
falsification_tests:
- id: FALSIFY-GR-001
  rule: NA x sorts last
  prediction: "mutating (true, false) => Greater -> Less in na_last turns ribbon::na_x RED (only na_x RED)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::ribbon::na_x -- --exact
  if_fails: No fixture has an NA x
- id: FALSIFY-GR-002
  rule: Rows sort by group before x
  prediction: "mutating dropping the group key from the sort turns ribbon::groups_text RED (3 cases RED (groups_num, groups_text, two_row_groups))"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::ribbon::groups_text -- --exact
  if_fails: No fixture interleaves groups in the data
- id: FALSIFY-GR-003
  rule: y column equals ymin
  prediction: "mutating num.insert(y, pick(&ymin)) -> pick(&ymax) turns ribbon::basic_unsorted RED (9 of 9 cases RED)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::ribbon::basic_unsorted -- --exact
  if_fails: The y column is not compared
- id: FALSIFY-GR-004
  rule: Non-default coord and facets are refused
  prediction: "allowing ylim, or allowing coord_fixed, makes refuses_every_non_default_coord_and_facet_for_every_geom RED for all five geoms (mutations M19, M20 of the round-1 review)"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_every_non_default_coord_and_facet_for_every_geom -- --exact
  if_fails: layout() silently ignores the coord, and this contract's scope claim is false
- id: FALSIFY-GR-005
  rule: A short column is a typed error
  prediction: "replacing the ragged-column error in position_column by Ok(NaN) turns refuses_a_short_column_for_every_geom RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_a_short_column_for_every_geom -- --exact
  if_fails: A ragged frame is NA-padded into numbers ggplot2 cannot produce
- id: FALSIFY-GR-006
  rule: A stat the layer does not model is refused
  prediction: "dropping the stat refusal in refuse_layer_parameters turns refuses_a_stat_the_layer_does_not_model RED"
  test: cargo test -p aprender-viz --lib grammar::ggplot2_marks_oracle::refuses_a_stat_the_layer_does_not_model -- --exact
  if_fails: geom.stat(..) is silently ignored by layout()
qa_gate:
  id: F-GR-001
  name: ggplot2 conformance (geom_ribbon)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for every geom_ribbon fixture, and out-of-scope input is a typed error
  checks:
  - oracle_cases
  - refuse_missing
  - refuse_coord
  - refuse_ragged
  - refuse_nonfinite
  - refuse_stat
  - refuse_alpha
  - refuse_dropped_aesthetics
  - overwritten_aesthetics_equal_default
  - companion_cases
  - refuse_companions
  - refuse_point_stat
  - refuse_point_companion
  - refuse_point_column
  - refuse_one_axis
