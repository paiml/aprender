  - {row: 49, name: ggsave, concept: OutputTarget, aes: ""}

equations:
  proven:
    formula: "proven(r) ⟺ contract(r) ∧ fixture(r, v) ∧ surface(r) ∧ receipt(r, v),  v = entity.properties.ggplot2"
    domain: "the 49 core_rows"
    codomain: "proven or a plot:notProven literal naming each missing item"
    invariants:
      - "a missing file is a missing item, never a pass"
      - "a fixture at another ggplot2 version is not a fixture"
    preconditions:
      - "every row's concept is the one its name's prefix gives, else the table is refused by name"
    postconditions:
      - "not_proven = core_rows \\ proven, one plot:notProven per member"
    lean_theorem: none — L4 not declared

invariants:
  - id: GGO-INV-001
    property: a row without all four proofs fails the shape
    formal: '¬proven(r) ⇒ Fail(ggplot2-core)'
    prose: false
  - id: GGO-INV-002
    property: the plant fires through the shape or the gate declines
    formal: 'pc_shapes(ggplot2-core) ≠ fired ⇒ verdict = Unknown'
    prose: false

falsification_tests:
  - id: FALSIFY-GGO-001
    rule: the extractor's table, bindings and evidence
    prediction: "a concept that disagrees with its name, a duplicate row, a row contract naming no core row and a foreign-schema receipt are each refused by name; a row missing any of the four items carries plot:notProven"
    test: cargo test -p aprender-contracts --lib ontology::extract::ggplot2_core
    if_fails: a row without its proofs is graded as proven, or a broken table is read
  - id: FALSIFY-GGO-002
    rule: the plant fires through the shape
    prediction: "a bare planted row gives exactly one maxCount violation on plot:notProven; a fully evidenced row gives none; dropping maxCount 0 makes the control not-fired and the gate declines"
    test: cargo test -p aprender-contracts --lib lint::ggplot2_core_gate
    if_fails: the shape can be emptied without the gate noticing

qa_gate:
  id: F-GGO-001
  name: ggplot2-core
  description: 'Each of the 49 ggplot2 usable-core rows is proven, or the ggplot2-core shape is RED (PLOT-GG-001)'
  checks:
    - table_matches_prefixes
    - not_proven_never_admitted
    - plant_fires_through_shape
  pass_criteria: 'All falsification tests pass; `pv lint contracts/ --gate shapes --shape ggplot2-core` exits 1 naming each not-proven row until all 49 are proven'
  falsification: 'delete the maxCount 0 on plot:notProven → pc_shapes["ggplot2-core"] not-fired → exit 2'
