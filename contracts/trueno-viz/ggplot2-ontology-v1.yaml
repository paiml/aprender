  - {row: 33, name: scale_colour_discrete, concept: Scale, aes: ""}
  - {row: 34, name: scale_colour_continuous, concept: Scale, aes: ""}
  - {row: 35, name: scale_fill_discrete, concept: Scale, aes: ""}
  - {row: 36, name: scale_fill_continuous, concept: Scale, aes: ""}
