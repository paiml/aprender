metadata:
  id: ggplot2-bars-position-dodge-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance, bars train, row position_dodge (PLOT-GG-001, paiml/aprender#6909). position::apply(Position::dodge()) splits each x's bar width between its groups in group order (preserve = total, width = NULL), as PositionDodge and pos_dodge() do; preserve = single, width = 0.5 and width = 2 (wider than the bars) are also covered, and a group with several rows at one x (dup fixture) is counted once. The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (fixtures/ggplot2/position_dodge/generate.R); R is
    never run at test time. Continuous values compare at 1e-9 relative + 1e-12 absolute; group ids, counts,
    levels and labels compare exactly. Level and group order is bytewise (LC_COLLATE=C); every generate.R pins it and records it as "collate" in the fixture.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), StatCount, GeomBar, GeomCol, PositionStack, PositionFill, PositionDodge'
  - 'crates/aprender-viz/fixtures/ggplot2/position_dodge/generate.R'
equations:
  pos_dodge:
    formula: 'per xmin with n distinct groups (n = max distinct groups at any xmin when preserve = single; a group repeated at an x counts once): x := x + width * ((idx - 0.5) / n - 0.5); xmin := x - d_width / n / 2; xmax := x + d_width / n / 2; width = NULL means the bar width, d_width = max(xmax - xmin); n = 1 leaves the bar alone'
    domain: bars with xmin and xmax, idx = dense rank of the bar's group among the distinct groups at that x (not the row number)
    codomain: x, xmin, xmax
    invariants:
    - a lone bar at an x keeps its full width under preserve = total
    - y, ymin and ymax are untouched
proof_obligations:
- id: GGD1-INV-001
  type: invariant
  property: Dodged positions match PositionDodge
  formal: '∀ bar: (x, xmin, xmax) ≈ ggplot2 row (1e-9 rel + 1e-12 abs) for default, preserve = single and width = 0.5'
  applies_to: pos_dodge
enforcement:
  dodge_default_matches:
    description: default dodge equals ggplot2's
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_position_dodge
    severity: ERROR
  dodge_single_matches:
    description: preserve = single equals ggplot2's
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_position_dodge_preserve_single
    severity: ERROR
  dodge_width_matches:
    description: width = 0.5 equals ggplot2's
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_position_dodge_width
    severity: ERROR
  dodge_repeated_group_matches:
    description: a group repeated at one x counts once (rank and n), total and single
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_position_dodge_repeated_group
    severity: ERROR
  dodge_repeated_group_single_matches:
    description: preserve = single takes the max distinct groups per x, not rows
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_position_dodge_repeated_group_preserve_single
    severity: ERROR
  dodge_width_wider_matches:
    description: width = 2 (wider than the bars) equals ggplot2 incl. the discrete range union
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_position_dodge_width_wider_than_bars
    severity: ERROR
  dodge_public_matches:
    description: GGPlot::layout() with geom_bar and Layer::position(dodge) equals the same fixtures
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_public_position_dodge_repeated_group
    severity: ERROR
falsification_tests:
- id: FALSIFY-GGD1-001
  rule: preserve defaults to total
  prediction: mutating DODGE_PRESERVE Total -> Single turns ggplot2_bars_position_dodge, _position_dodge_repeated_group and the two public dodge tests RED (measured, 4 failed, 26 passed, rc=101)
  test: cargo test -p aprender-viz --lib ggplot2_bars (crates/aprender-viz/src/grammar/ggplot2_bars_oracle.rs)
  if_fails: The fixture has the same number of groups at every x; the busiest x must differ from the others
- id: FALSIFY-GGD1-002
  rule: Bar centres are spaced by the dodge width
  prediction: scaling the spacing term (x + 0.8 * width * ...) turns 8 dodge tests RED, six bar_layout tests and two public (measured, 8 failed, 22 passed, rc=101)
  test: cargo test -p aprender-viz --lib ggplot2_bars (crates/aprender-viz/src/grammar/ggplot2_bars_oracle.rs)
  if_fails: x of a dodged bar is not compared
- id: FALSIFY-GGD1-003
  rule: Each dodged bar is d_width / n wide
  prediction: dropping the /2 in xmin (x - d_width / n) turns the same 8 dodge tests RED (measured, 8 failed, 22 passed, rc=101)
  test: cargo test -p aprender-viz --lib ggplot2_bars (crates/aprender-viz/src/grammar/ggplot2_bars_oracle.rs)
  if_fails: xmin and xmax of a dodged bar are not compared
- id: FALSIFY-GGD1-004
  rule: n counts distinct groups per x, idx is the dense group rank
  prediction: counting rows instead of groups (Preserve::Total => column.len()) turns _position_dodge_repeated_group RED (measured rc=101); ranking by row instead of dense group rank turns _position_dodge_repeated_group and _position_dodge_repeated_group_preserve_single RED (measured rc=101); on the public path the same mutation set also turns ggplot2_bars_public_position_dodge_repeated_group RED
  test: cargo test -p aprender-viz --lib ggplot2_bars (crates/aprender-viz/src/grammar/ggplot2_bars_oracle.rs)
  if_fails: The fixture has no x with a repeated group (a, g1, g1, g2); every group has one row per x
- id: FALSIFY-GGD1-005
  rule: The discrete range is unioned with the bars
  prediction: removing the discrete range union in stat_count turns _position_dodge_width_wider_than_bars RED (measured rc=101); the preserve default Total -> Single turns 4 tests RED (position_dodge, _repeated_group, and their two public twins; measured, 4 failed, 26 passed, rc=101); dropping the position from the layer (public path) turns 4 public position tests RED (measured rc=101)
  test: cargo test -p aprender-viz --lib ggplot2_bars (crates/aprender-viz/src/grammar/ggplot2_bars_oracle.rs)
  if_fails: No fixture has bars that reach past the expanded levels
qa_gate:
  id: F-GGD1-001
  name: ggplot2 conformance bars row 4 (position_dodge)
  description: aprender-viz dodged bars equal ggplot2 4.0.3 ggplot_build()
  checks:
  - dodge_default_matches
  - dodge_single_matches
  - dodge_width_matches
  - dodge_repeated_group_matches
  - dodge_repeated_group_single_matches
  - dodge_width_wider_matches
  - dodge_public_matches
