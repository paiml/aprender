metadata:
  id: plot-lines-render-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    The line family (geom line, path, step) and the reference lines (hline, vline, abline) are drawn by the plot verb in the terminal and as SVG, and by the raster target, from one clipped-polyline representation (PLOT-GG-001, paiml/aprender#6909). Drawn means proven by rendered-output tests: SVG polylines at pixel coordinates computed independently from the axis ticks, and terminal cells. Scope: continuous x and y; coord cartesian only. coord_flip with a stroke layer is refused with a typed Err in the SVG, raster and terminal targets (tested in each), and the CLI accepts no flip kind (exit 2). Tick-label claims hold for the tested magnitude range 0..20 only. Strokes are drawn above raster layers in the SVG. Documented deviation - the CLI missing-value warning counts every row with a missing x or y, where ggplot2 counts only the rows it removes. Unsupported options give a typed error with exit code 2; no renderer panic is reachable from the tested extreme inputs.
  references:
  - 'ggplot2 4.0.3: geom_line, geom_path, geom_step, geom_hline, geom_vline, geom_abline'
  - 'crates/aprender-viz/src/grammar/stroke.rs'
equations:
  stroke_polyline:
    formula: 'runs = split(rows by panel, group, finite); polyline = clip(run, visible domain); pixel = scale(value)'
    domain: finite continuous x and y; cartesian coord
    codomain: terminal cells, SVG polyline points, raster pixels
    invariants:
    - a NaN vertex, a group change or a panel change ends a run
    - every drawn point lies inside the visible domain
    preconditions:
    - the trained scales are non-degenerate, else ScaleDomain
proof_obligations:
- id: PLOTLINES-INV-001
  type: invariant
  property: Each stroke geom is drawn at the pixel the scales give its data value
  formal: '∀ case: svg_point(case) ≈ tick_pixel(case.value), tolerance 0.01 px'
  applies_to: stroke_polyline
enforcement:
  svg_cases:
    description: SVG strokes sit at the axis pixels
    check: line_is_a_polyline_through_the_data_at_the_axis_pixels
    severity: ERROR
  terminal_cases:
    description: terminal cells carry the strokes
    check: terminal_line_marks_its_data_cells_and_joins_them
    severity: ERROR
  cli_cases:
    description: the plot verb exposes the geoms and refuses bad options with exit 2
    check: plot_lines_usage_errors_are_exit_2_and_data_errors_exit_1
    severity: ERROR
falsification_tests:
- id: FALSIFY-PLOTLINES-001
  rule: line draws one polyline through the data, sorted by x, at the axis pixels
  prediction: dropping the sort or moving a vertex turns line_is_a_polyline_through_the_data_at_the_axis_pixels and plot_line_svg_draws_the_data_at_axis_pixels RED
  test: cargo test -p aprender-viz --test stroke_render -- --exact line_is_a_polyline_through_the_data_at_the_axis_pixels
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-002
  rule: path keeps the data order
  prediction: sorting a path by x turns line_sorts_by_x_and_path_keeps_the_data_order and plot_path_keeps_row_order_and_line_sorts_by_x RED
  test: cargo test -p aprender-viz --test stroke_render -- --exact line_sorts_by_x_and_path_keeps_the_data_order
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-003
  rule: step draws the staircase of each direction
  prediction: swapping the vh corner turns step_draws_the_stairs_of_each_direction and plot_step_directions_match_the_staircases RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact step_draws_the_stairs_of_each_direction
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-004
  rule: hline and vline span the panel at their value
  prediction: drawing hline as vline turns reference_lines_span_the_panel_at_the_axis_pixels RED (measured); drawing vline as hline turns it RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact reference_lines_span_the_panel_at_the_axis_pixels
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-005
  rule: terminal hline fills the row of its axis label
  prediction: drawing hline as vline turns terminal_hline_fills_the_row_of_its_axis_label RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact terminal_hline_fills_the_row_of_its_axis_label
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-006
  rule: terminal vline fills the column of its tick
  prediction: drawing vline as hline turns terminal_vline_fills_the_column_of_its_tick RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact terminal_vline_fills_the_column_of_its_tick
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-007
  rule: abline is slope*x+intercept clipped to the panel
  prediction: ignoring the slope turns an_abline_leaving_the_panel_is_clipped_to_it RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact an_abline_leaving_the_panel_is_clipped_to_it
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-008
  rule: hline trains the scale and abline does not
  prediction: training the scale with an abline turns plot_hline_widens_the_axis_but_abline_does_not RED
  test: cargo test -p aprender-present-cli --test present_cli_surface_gate -- --exact plot_hline_widens_the_axis_but_abline_does_not
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-009
  rule: a missing value or a group change ends the line
  prediction: not breaking at a group or at NaN turns a_missing_value_breaks_the_line_and_groups_are_separate_lines RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact a_missing_value_breaks_the_line_and_groups_are_separate_lines
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-010
  rule: the terminal breaks a line at a missing value and still draws the titles
  prediction: not breaking at NaN turns terminal_breaks_the_line_at_a_missing_value_and_draws_the_titles RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact terminal_breaks_the_line_at_a_missing_value_and_draws_the_titles
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-011
  rule: coord_flip is a typed error for strokes in the SVG and raster targets
  prediction: allowing the flip turns svg_and_raster_refuse_a_flipped_coord_for_strokes RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact svg_and_raster_refuse_a_flipped_coord_for_strokes
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-012
  rule: the terminal refuses a flipped coord for strokes
  prediction: drawing strokes under a flip turns terminal_refuses_a_flipped_coord_for_strokes RED
  test: cargo test -p aprender-viz --test stroke_render -- --exact terminal_refuses_a_flipped_coord_for_strokes
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-013
  rule: the raster draws the stroke where the SVG puts it
  prediction: skipping the raster stroke turns raster_draws_the_stroke_where_the_svg_puts_it RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact raster_draws_the_stroke_where_the_svg_puts_it
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-014
  rule: linewidth 0.5 mm is 0.5*72.27/25.4 px and the colour reaches the stroke
  prediction: changing the factor turns colour_and_width_reach_the_stroke RED (measured)
  test: cargo test -p aprender-viz --test stroke_render -- --exact colour_and_width_reach_the_stroke
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-015
  rule: terminal cells between two vertices are Bresenham
  prediction: keeping only the endpoints turns cells_between_is_bresenham RED (measured)
  test: cargo test -p aprender-viz --lib grammar::stroke::tests::cells_between_is_bresenham
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-016
  rule: a plot of reference lines alone is a ScaleDomain error, not a picture
  prediction: drawing a default panel turns a_plot_of_reference_lines_alone_is_a_typed_error_not_a_picture RED
  test: cargo test -p aprender-viz --test stroke_render -- --exact a_plot_of_reference_lines_alone_is_a_typed_error_not_a_picture
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-017
  rule: axis titles and the plot title are still drawn with lines
  prediction: dropping labs when strokes are present turns axis_titles_and_the_title_are_still_drawn_with_lines RED
  test: cargo test -p aprender-viz --test stroke_render -- --exact axis_titles_and_the_title_are_still_drawn_with_lines
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-018
  rule: unsupported options and bad input exit 2, data errors exit 1
  prediction: exiting 1 for usage turns plot_lines_usage_errors_are_exit_2_and_data_errors_exit_1 RED (measured)
  test: cargo test -p aprender-present-cli --test present_cli_surface_gate -- --exact plot_lines_usage_errors_are_exit_2_and_data_errors_exit_1
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-019
  rule: extreme inputs neither panic nor hang
  prediction: a panic on f32::MAX, NaN, inf or 5000 vertices turns extreme_inputs_neither_panic_nor_hang RED
  test: cargo test -p aprender-viz --test stroke_render -- --exact extreme_inputs_neither_panic_nor_hang
  if_fails: The test cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-PLOTLINES-020
  rule: the CLI never panics on extreme values
  prediction: a panic on an extreme CLI value turns plot_extreme_inputs_never_panic RED
  test: cargo test -p aprender-present-cli --test present_cli_surface_gate -- --exact plot_extreme_inputs_never_panic
  if_fails: The test cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-PLOTLINES-001
  name: plot verb lines and reference lines
  description: line, path, step, hline, vline and abline are drawn in the terminal, SVG and raster targets
  checks:
  - svg_cases
  - terminal_cases
  - cli_cases
