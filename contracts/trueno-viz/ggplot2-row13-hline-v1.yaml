metadata:
  id: ggplot2-row13-hline-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance row 13 (PLOT-GG-001, paiml/aprender#6909) - geom_hline. yintercept is replicated per panel and TRAINS the y scale; it never trains x and takes no data aesthetics.
    The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation;
    R is never run at test time. Every case goes through the public builder and layout().
    Scope: stated in the fixtures: facet_wrap per panel as R; other facets, data-mapped colour, size, shape, alpha, fill or label, a non-default Geom width, text or infinite positions, group columns with gaps or mixed types, and layer data whose facet levels are absent from the plot data return Err(Rendering). Continuous x and y, numeric data; any coordinate system but the default coord_cartesian (coord_flip, limits, polar, fixed) returns Err(UnsupportedCoord) because layout() applies none. Anything outside the scope returns a typed
    Err (Rendering, UnknownColumn, ScaleDomain or UnsupportedCoord), never a panic. Tick labels are claimed exact only for non-zero data magnitude from 2^-8 (0.0039) to 10^4, with the edges proven in row 10 (line::tick_labels_match_r_at_the_edges_of_the_claimed_magnitude_range); beyond that range the shared label formatter differs from R's fixed-versus-scientific choice (paiml/aprender#6958) and no label is claimed.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_hline'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_hline/generate.R'
equations:
  hline_training:
    formula: 'y limits = range(data y U yintercept)'
    domain: numeric columns, continuous scales, facet_wrap or no facet
    codomain: BuiltLayer.path and the trained panel scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs; labels (for non-zero data magnitude from 2^-8 to 10^4), colours, groups, panels and counts exact
    preconditions:
    - trained x and y ranges are non-degenerate, else ScaleDomain
    - coordinate system is the default coord_cartesian, else UnsupportedCoord
proof_obligations:
- id: GG13-INV-001
  type: invariant
  property: Layer data and trained scales match ggplot2
  formal: 'forall case: layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs; exact labels, colours, groups, panels)'
  applies_to: hline_training
enforcement:
  primary_cases:
    description: the main fixtures are reproduced
    check: grammar::ggplot2_lines_oracle::hline::inside_the_data_range_changes_nothing
    severity: ERROR
  group_or_style_cases:
    description: group, colour and facet fixtures are reproduced
    check: grammar::ggplot2_lines_oracle::hline::above_the_range_widens_y
    severity: ERROR
  edge_cases:
    description: edge fixtures are reproduced or refused with a typed Err
    check: grammar::ggplot2_lines_oracle::hline::without_data_the_axes_are_degenerate_and_refused
    severity: ERROR
falsification_tests:
- id: FALSIFY-GG13-001
  rule: hline trains y
  prediction: not training y with the intercept turns hline::above_the_range_widens_y and hline::below_the_range_widens_y RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::hline::above_the_range_widens_y grammar::ggplot2_lines_oracle::hline::below_the_range_widens_y
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG13-002
  rule: Layers accumulate
  prediction: training only the first hline turns hline::two_layers_widen_both_ends RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::hline::two_layers_widen_both_ends
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG13-003
  rule: Replicated per panel
  prediction: emitting one panel turns hline::facet_wrap_replicates_the_line_per_panel RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::hline::facet_wrap_replicates_the_line_per_panel
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG13-004
  rule: Non-default coordinate systems are refused
  prediction: removing the require_default_coord call in GGPlot::layout turns robustness::every_non_default_coord_is_refused_for_every_geom RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::robustness::every_non_default_coord_is_refused_for_every_geom
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-GG13-001
  name: ggplot2 conformance row 13 (geom_hline)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for the row-13 fixtures
  checks:
  - primary_cases
  - group_or_style_cases
  - edge_cases
