metadata:
  id: ggplot2-row14-vline-v1
  kind: pattern
  version: 1.1.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance row 14 (PLOT-GG-001, paiml/aprender#6909) - geom_vline. xintercept is replicated per panel and TRAINS the x scale; it never trains y.
    The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation;
    R is never run at test time. Every case goes through the public builder and layout().
    Scope: stated in the fixtures: facet_wrap per panel as R; other facets, data-mapped colour, size, shape, alpha, fill or label, a non-default Geom width, text or infinite positions, group columns with gaps or mixed types, and layer data whose facet levels are absent from the plot data return Err(Rendering). Continuous x and y, numeric data; any coordinate system but the default coord_cartesian (coord_flip, limits, polar, fixed) returns Err(UnsupportedCoord) because layout() applies none. Stat: only the identity stat (none, or Stat::Identity) is in scope; any other stat on any layer of the plot (stat_count, stat_bin, stat_density, stat_boxplot, stat_smooth, stat_bin_2d, stat_summary sum or mean) returns Err(UnsupportedStat) because layout() computes none, and any companion geom other than geom_point returns Err(UnsupportedLayer). Position adjustments, na.rm and orientation are not expressible in the builder (ggplot2 defaults: identity, FALSE, NA). Anything outside the scope returns a typed
    Err (Rendering, UnknownColumn, ScaleDomain, UnsupportedCoord, UnsupportedStat or UnsupportedLayer), never a panic. Tick labels are claimed exact only for non-zero data magnitude from 2^-8 (0.0039) to 10^4, with the edges proven in row 10 (line::tick_labels_match_r_at_the_edges_of_the_claimed_magnitude_range); beyond that range the shared label formatter differs from R's fixed-versus-scientific choice (paiml/aprender#6958) and no label is claimed.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_vline'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_vline/generate.R'
equations:
  vline_training:
    formula: 'x limits = range(data x U xintercept)'
    domain: numeric columns, continuous scales, facet_wrap or no facet
    codomain: BuiltLayer.path and the trained panel scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs; labels (for non-zero data magnitude from 2^-8 to 10^4), colours, groups, panels and counts exact
    preconditions:
    - trained x and y ranges are non-degenerate, else ScaleDomain
    - coordinate system is the default coord_cartesian, else UnsupportedCoord
    - every layer has the identity stat, else UnsupportedStat; companion layers are geom_point only, else UnsupportedLayer
proof_obligations:
- id: GG14-INV-001
  type: invariant
  property: Layer data and trained scales match ggplot2
  formal: 'forall case: layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs; exact labels, colours, groups, panels)'
  applies_to: vline_training
enforcement:
  primary_cases:
    description: the main fixtures are reproduced
    check: grammar::ggplot2_lines_oracle::vline::inside_the_data_range_changes_nothing
    severity: ERROR
  group_or_style_cases:
    description: group, colour and facet fixtures are reproduced
    check: grammar::ggplot2_lines_oracle::vline::above_the_range_widens_x
    severity: ERROR
  edge_cases:
    description: edge fixtures are reproduced or refused with a typed Err
    check: grammar::ggplot2_lines_oracle::vline::without_data_the_axes_are_degenerate_and_refused
    severity: ERROR
falsification_tests:
- id: FALSIFY-GG14-001
  rule: vline trains x
  prediction: not training x with the intercept turns vline::above_the_range_widens_x and vline::below_the_range_widens_x RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::vline::above_the_range_widens_x grammar::ggplot2_lines_oracle::vline::below_the_range_widens_x
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG14-002
  rule: Layers accumulate
  prediction: training only the first vline turns vline::two_layers_widen_both_ends RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::vline::two_layers_widen_both_ends
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG14-003
  rule: Replicated per panel
  prediction: emitting one panel turns vline::facet_wrap_replicates_the_line_per_panel RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::vline::facet_wrap_replicates_the_line_per_panel
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG14-004
  rule: Non-default coordinate systems are refused
  prediction: removing the require_default_coord call in GGPlot::layout turns robustness::every_non_default_coord_is_refused_for_every_geom RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::robustness::every_non_default_coord_is_refused_for_every_geom
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-GG14-005
  rule: Non-identity stats are refused
  prediction: accepting any one non-identity stat in path.rs require_identity_stats (or removing its call in GGPlot::layout) turns robustness::every_non_identity_stat_is_refused_on_vline RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_lines_oracle::robustness::every_non_identity_stat_is_refused_on_vline
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-GG14-001
  name: ggplot2 conformance row 14 (geom_vline)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for the row-14 fixtures
  checks:
  - primary_cases
  - group_or_style_cases
  - edge_cases
