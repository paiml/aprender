metadata:
  id: ggplot2-bars-stat-count-geom-bar-v1
  kind: pattern
  version: 1.2.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance, bars train, rows stat_count + geom_bar (PLOT-GG-001, paiml/aprender#6909). bar_layout() counts rows per discrete x and group as StatCount does (count, prop = count / sum(abs(count)) within the group), applies GeomBar's setup_data edges (width 0.9, just 0.5) and trains the discrete x axis (expansion add 0.6) and the continuous y axis. The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (fixtures/ggplot2/stat_count_geom_bar/generate.R); R is
    never run at test time. Continuous values compare at 1e-9 relative + 1e-12 absolute; group ids, counts,
    levels and labels compare exactly.
    Level and group order is bytewise (LC_COLLATE=C): every generate.R pins it with Sys.setlocale and records it as "collate" in the fixture, and each oracle test asserts it, so R's locale-dependent sort() is never the reference.
    Scope: vertical bars over a text x. Under a facet the stat and the position run per panel (group ids stay global, and position_dodge(preserve = single) takes its n from the busiest x of any panel) while the scales are trained across panels; position scales are trained over every layer of the plot (a point, hline or vline layer next to the bars widens them), as the facet_bars, facet_bars_single and mixed_layers fixtures record. Typed errors, not drawn and not guessed: a bar layer with its own data under a facet, and the framebuffer and SVG renderers on bars over a text x ("bars on a discrete x are not drawn yet").
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), StatCount, GeomBar, GeomCol, PositionStack, PositionFill, PositionDodge'
  - 'crates/aprender-viz/fixtures/ggplot2/stat_count_geom_bar/generate.R'
equations:
  stat_count:
    formula: 'count = number of rows per (group, x); prop = count / sum(abs(count)) within the group; y = count'
    domain: a text x column, optionally a text fill column (groups = dense rank of the (x, fill) pairs present)
    codomain: Vec<BarRow>
    invariants:
    - one bar per (group, x), rows in group order
    - prop is 1 when a group holds one x, and count / total when aes(group = 1) merges the x levels
  bar_edges:
    formula: 'ymin = min(y, 0); ymax = max(y, 0); xmin = x - 0.9 * 0.5; xmax = x + 0.9 * 0.5'
    domain: one bar
    codomain: edges in data space
    invariants:
    - the default bar width is 0.9 of the unit resolution
  discrete_x_axis:
    formula: 'continuous_range = range((1 - 0.6, n + 0.6), (min xmin, max xmax)); level i sits at i'
    domain: n >= 1 text levels sorted bytewise (under LC_COLLATE=C, B sorts before a); the oracle pins LC_COLLATE=C in every generate.R and records it as "collate" in each fixture, so R's locale-dependent sort() is never the reference
    codomain: DiscreteAxis
    invariants:
    - break positions are 1..n and labels are the level names
proof_obligations:
- id: GGB1-INV-001
  type: invariant
  property: Counts, props and group ids match StatCount
  formal: '∀ bar: count = ggplot2.count and prop ≈ ggplot2.prop (1e-9 rel) and group = ggplot2.group'
  applies_to: stat_count
- id: GGB1-INV-002
  type: invariant
  property: Bar edges and width match GeomBar
  formal: '∀ bar: (x, y, ymin, ymax, xmin, xmax, width) ≈ ggplot2 row (1e-9 rel + 1e-12 abs)'
  applies_to: bar_edges
- id: GGB1-INV-003
  type: invariant
  property: Discrete x axis and count y axis match ggplot2
  formal: '∀ axis: x.limits = levels, x.continuous_range ≈ ggplot2, breaks and labels equal; y limits, range, breaks, labels, n_censored equal'
  applies_to: discrete_x_axis
enforcement:
  counts_match:
    description: counts, props and groups equal ggplot2's for the default and the group = 1 plots
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_stat_count_geom_bar
    severity: ERROR
  prop_merged_group_matches:
    description: prop = count / total when the x levels share one group
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_stat_count_group1_prop
    severity: ERROR
  level_order_c_collation:
    description: levels (x = a, B, B, c) and groups sort bytewise, as under LC_COLLATE=C
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_level_order_is_bytewise_c_collation
    severity: ERROR
  public_default_width_matches:
    description: GGPlot::layout() over geom_bar reaches bar_layout with width 0.9 and the stat_count output
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_public_geom_bar_default_width_and_stat_count
    severity: ERROR
  public_geom_col_matches:
    description: GGPlot::layout() over geom_col uses stat identity
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_public_geom_col
    severity: ERROR
  facet_stat_matches:
    description: under a facet counts, props and groups are computed per panel (global group ids)
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_facet_stat_count_per_panel
    severity: ERROR
  mixed_layers_match:
    description: scales are trained over every layer (col + point, point outside the bars, two bar layers)
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_two_bar_layers_union_their_levels
    severity: ERROR
  unsupported_is_typed_error:
    description: text-x bars are refused by the renderers with a typed error
    check: grammar::ggplot2_bars_oracle::bars_on_a_discrete_x_are_not_drawn_yet_and_say_so
    severity: ERROR
  bar_layer_fill_ranks_first:
    description: a fill mapped on the bar layer under a plot-level x ranks fill before x in the group ids, as ggplot2's add_group does over computed_mapping
    check: grammar::ggplot2_bars_oracle::ggplot2_bars_layer_fill_under_plot_x_ranks_fill_first
    severity: ERROR
  bar_scope_refusals:
    description: a non-default coord, a stat other than count or identity, a short column, a degenerate y range and a non-finite width are typed errors
    check: grammar::ggplot2_bars_oracle::bars_under_a_non_default_coord_are_refused
    severity: ERROR
falsification_tests:
- id: FALSIFY-GGB1-001
  rule: Bar width is 0.9
  prediction: mutating DEFAULT_BAR_WIDTH 0.9 -> 0.8 turns 17 of the 43 ggplot2_bars tests RED (measured, 17 failed, 26 passed, rc=101); mutating the geom default (geom.rs DEFAULT_BAR_WIDTH_F32 0.9 -> 0.8) turns 21 RED (measured, 21 failed, 22 passed, rc=101). The default moved from 0.8 to 0.9 with this row, so a numeric-x geom_bar() caller (wasm.rs, examples/grammar_of_graphics.rs) draws 12% wider bars
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_stat_count_geom_bar grammar::ggplot2_bars_oracle::ggplot2_bars_stat_identity_geom_col grammar::ggplot2_bars_oracle::ggplot2_bars_public_geom_bar_default_width_and_stat_count grammar::ggplot2_bars_oracle::ggplot2_bars_public_geom_col
  if_fails: A 10% narrower bar is invisible to the oracle; the edges are not compared
- id: FALSIFY-GGB1-002
  rule: Discrete expansion is add 0.6
  prediction: mutating DISCRETE_EXPAND_ADD 0.6 -> 0.5 turns 37 of the 43 ggplot2_bars tests RED (measured, 37 failed, 6 passed, rc=101; every bar plot shares the discrete x axis)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_stat_count_geom_bar grammar::ggplot2_bars_oracle::ggplot2_bars_stat_identity_geom_col grammar::ggplot2_bars_oracle::ggplot2_bars_position_dodge grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_col_and_hline_extend_y
  if_fails: The x continuous_range is not compared
- id: FALSIFY-GGB1-003
  rule: Levels sort bytewise (LC_COLLATE=C), not case-insensitively
  prediction: sorting levels case-insensitively turns exactly _level_order_is_bytewise_c_collation, _group_order_is_bytewise_c_collation and _public_level_and_group_order_c_collation RED (measured on the level sort, 3 failed, 40 passed, rc=101; the fixture is x = a, B, B, c, whose C-locale limits are B, a, c)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_level_order_is_bytewise_c_collation grammar::ggplot2_bars_oracle::ggplot2_bars_group_order_is_bytewise_c_collation grammar::ggplot2_bars_oracle::ggplot2_bars_public_level_and_group_order_c_collation
  if_fails: The mixed-case fixture is not in the suite; an all-lowercase x cannot tell the two orders apart
- id: FALSIFY-GGB1-004
  rule: The public builder reaches the bar code
  prediction: dropping .width(..) at the single call site (GGPlot::bar_spec) turns ggplot2_bars_public_geom_bar_width RED and nothing else (measured, 1 failed, 42 passed, rc=101); making the Identity stat branch unreachable turns 13 tests RED (measured, 13 failed, 30 passed, rc=101); dropping .position(..) turns 9 tests RED (measured, 9 failed, 34 passed, rc=101)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_public_geom_bar_width grammar::ggplot2_bars_oracle::ggplot2_bars_public_geom_col grammar::ggplot2_bars_oracle::ggplot2_bars_public_position_dodge
  if_fails: layout() is not compared with the same fixtures as bar_layout()
- id: FALSIFY-GGB1-005
  rule: Facets split the stat and the position, not the scales
  prediction: ignoring the facet when the bars are built (every row in one panel) turns the 7 facet tests RED (measured, 7 failed, 36 passed, rc=101); counts, props and group ids per panel come from facet_bars and facet_bars_single (6 rows for geom_bar(fill) + facet_wrap, y range (-0.1, 2.1))
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_facet_stat_count_per_panel grammar::ggplot2_bars_oracle::ggplot2_bars_facet_position_dodge_per_panel grammar::ggplot2_bars_oracle::ggplot2_bars_facet_position_fill_per_panel grammar::ggplot2_bars_oracle::ggplot2_bars_facet_position_stack_per_panel grammar::ggplot2_bars_oracle::ggplot2_bars_facet_dodge_preserve_single_is_global grammar::ggplot2_bars_oracle::ggplot2_bars_facet_dodge_total_is_per_panel grammar::ggplot2_bars_oracle::ggplot2_bars_facet_group_ids_are_global
  if_fails: The facet fixtures do not count differently per panel than pooled
- id: FALSIFY-GGB1-006
  rule: Position scales are trained over every layer
  prediction: dropping the y and x of non-bar layers from the scale training in layout_with_bars turns _mixed_col_and_point_share_the_y_scale and _mixed_point_outside_the_bar_x_range RED (measured, 2 failed, 41 passed, rc=101); dropping an hline intercept turns _mixed_col_and_hline_extend_y RED (measured, 1 failed, 42 passed, rc=101); the levels of two bar layers are unioned (_mixed_two_bar_layers_union_their_levels)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_col_and_point_share_the_y_scale grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_point_outside_the_bar_x_range grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_col_and_hline_extend_y grammar::ggplot2_bars_oracle::ggplot2_bars_mixed_two_bar_layers_union_their_levels
  if_fails: A later layer can overwrite or ignore the shared scale
- id: FALSIFY-GGB1-007
  rule: Unsupported shapes are typed errors
  prediction: letting the renderers draw text-x bars (removing the Err) turns _bars_on_a_discrete_x_are_not_drawn_yet_and_say_so RED (measured with the message changed, 1 failed, 42 passed, rc=101); a bar layer with its own data under a facet returns an Err naming it (_bar_layer_with_its_own_data_under_a_facet_is_a_typed_error)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::bars_on_a_discrete_x_are_not_drawn_yet_and_say_so grammar::ggplot2_bars_oracle::bar_layer_with_its_own_data_under_a_facet_is_a_typed_error
  if_fails: A text-x bar plot renders without bars, silently
- id: FALSIFY-GGB1-008
  rule: Layer fill under a plot x ranks fill first
  prediction: setting fill_first to false turns the 3 layer_fill tests RED (measured, mutation M1); replacing the condition with layer.aes.fill.is_some() alone turns _layer_x_and_fill_together_rank_x_first RED (measured, mutation M4)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::ggplot2_bars_layer_fill_under_plot_x_ranks_fill_first
  if_fails: The fixture's x and fill orders agree, so the rank order is invisible
- id: FALSIFY-GGB1-009
  rule: Bars under a non-default coord are refused
  prediction: removing the coord check in layout_with_bars turns bars_under_a_non_default_coord_are_refused RED (measured, mutation M6)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::bars_under_a_non_default_coord_are_refused
  if_fails: A flipped or limited coord is laid out as cartesian
- id: FALSIFY-GGB1-010
  rule: Only stat_count and stat_identity make bars
  prediction: removing the stat guard in bar_spec turns a_bar_stat_other_than_count_or_identity_is_refused RED (measured, mutation M7)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_bar_stat_other_than_count_or_identity_is_refused
  if_fails: stat_bin bars are counted as stat_count
- id: FALSIFY-GGB1-011
  rule: A column shorter than the frame is refused
  prediction: removing the length check in stat_count full_column turns a_short_column_is_refused_not_read_past RED (measured, mutation M5)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_short_column_is_refused_not_read_past
  if_fails: A ragged frame is padded or truncated silently
- id: FALSIFY-GGB1-012
  rule: A y range with one value is refused
  prediction: removing the degenerate-range check in layout_with_bars turns a_degenerate_y_range_beside_bars_is_refused RED (measured, mutation M8)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_degenerate_y_range_beside_bars_is_refused
  if_fails: A zero-height scale is trained
- id: FALSIFY-GGB1-013
  rule: Companion layers beside bars take the identity stat only
  prediction: removing the stat check in require_bar_companion turns bars_beside_an_unsupported_companion_are_refused RED (measured, mutation M10)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::bars_beside_an_unsupported_companion_are_refused
  if_fails: A smoothed companion is laid out as raw data
- id: FALSIFY-GGB1-014
  rule: A bar or dodge width must be finite
  prediction: removing the finite-width check in bar_spec turns a_non_finite_bar_or_dodge_width_is_refused RED (measured, 1 failed, 70 passed, rc=101)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_non_finite_bar_or_dodge_width_is_refused
  if_fails: An infinite width trains an infinite x range
- id: FALSIFY-GGB1-015
  rule: A mapped colour, alpha, size, shape or label on a bar is refused
  prediction: removing the aesthetic guard in bar_spec (or any one of its five terms) turns a_mapped_colour_alpha_size_shape_or_label_on_a_bar_is_refused RED (measured, mutations M1 to M5)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_mapped_colour_alpha_size_shape_or_label_on_a_bar_is_refused
  if_fails: ggplot2 groups by every discrete mapped aesthetic, so the bar count and stacking differ from R and layout() returns Ok
- id: FALSIFY-GGB1-016
  rule: A position other than identity on a non-bar layer is refused
  prediction: removing require_identity_position turns a_position_other_than_identity_on_a_non_bar_layer_is_refused RED (measured, mutation M7)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_position_other_than_identity_on_a_non_bar_layer_is_refused
  if_fails: geom_point(position = stack) is laid out unstacked while ggplot2 stacks it
- id: FALSIFY-GGB1-017
  rule: A numeric or short facet column under bars is refused
  prediction: removing the require_text_facet loop in layout_with_bars turns a_facet_column_that_is_numeric_or_short_is_refused_under_bars RED (measured, mutation M8)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_facet_column_that_is_numeric_or_short_is_refused_under_bars
  if_fails: a numeric facet sorts as text (10 before 2) or a short column makes a panel named NA
- id: FALSIFY-GGB1-018
  rule: geom_bar with a y mapped is refused as ggplot2 does
  prediction: removing the y guard on the count arm of bar_spec turns geom_bar_with_a_y_mapped_is_refused_as_ggplot2_does RED (measured, mutation M10)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::geom_bar_with_a_y_mapped_is_refused_as_ggplot2_does
  if_fails: geom_bar counts and ignores the y that ggplot2 refuses
- id: FALSIFY-GGB1-019
  rule: A point companion with a short column is refused
  prediction: removing the length check in require_bar_companion turns a_point_companion_with_a_short_column_is_refused RED (measured, mutation M9)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_point_companion_with_a_short_column_is_refused
  if_fails: a ragged companion loses rows silently
- id: FALSIFY-GGB1-020
  rule: A non-finite stack or fill vjust is refused
  prediction: removing the vjust finiteness check in bar_spec turns a_non_finite_stack_or_fill_vjust_is_refused RED (measured, mutation M6)
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_bars_oracle::a_non_finite_stack_or_fill_vjust_is_refused
  if_fails: every y is NaN and layout() returns Ok
qa_gate:
  id: F-GGB1-001
  name: ggplot2 conformance bars row 1 (stat_count + geom_bar)
  description: aprender-viz bar_layout equals ggplot2 4.0.3 ggplot_build() for the stat_count fixtures
  checks:
  - counts_match
  - prop_merged_group_matches
  - level_order_c_collation
  - public_default_width_matches
  - public_geom_col_matches
  - facet_stat_matches
  - mixed_layers_match
  - unsupported_is_typed_error
  - bar_layer_fill_ranks_first
  - bar_scope_refusals
