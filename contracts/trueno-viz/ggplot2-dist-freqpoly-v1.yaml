metadata:
  id: ggplot2-dist-freqpoly-v1
  kind: pattern
  version: 1.0.0
  created: '2026-11-12'
  author: PAIML Engineering
  description: >-
    ggplot2 conformance, distribution rows (PLOT-GG-001, paiml/aprender#6909, ticket paiml/aprender#6963) - geom_freqpoly: stat_bin with the two padding bins (geom_freqpoly forces pad = TRUE, even when pad = FALSE is passed), as a path; counts, density, ncount, ndensity.
    The oracle is a committed JSON fixture produced by ggplot2 4.0.3 (R 4.6.2) under C collation;
    R is never run at test time. Every case goes through the public builder and layout().
    Scope: continuous numeric data, one panel, no facets, plain coord_cartesian. Non-default coordinates (coord_flip, limits, polar, fixed) return Err(UnsupportedCoord) because layout() applies none; facets of every kind, ylim, a stat other than the geom's own, an aesthetic the layer does not use, ragged columns, a position scale beyond +-1e100, mixing with other geoms, text or infinite positions, a continuous colour or fill mapping, two discrete mappings without a group, a fixed fill, a mapped alpha, a flipped orientation and invalid parameters return a typed Err (Rendering, UnknownColumn, ScaleDomain, EmptyData or UnsupportedCoord), never a panic. Mapped colours and fills carry the key but the palette is not resolved (the fixture holds the real palette). The layout path is fuzzed on extreme and non-finite f32 and on empty data: it never panics or hangs and builds a bounded number of bins and rows.
  references:
  - 'Wickham (2010) A Layered Grammar of Graphics, J. Comput. Graph. Stat. 19(1)'
  - 'ggplot2 4.0.3: ggplot_build(), geom_freqpoly'
  - 'crates/aprender-viz/fixtures/ggplot2/geom_freqpoly/generate.R'
equations:
  freqpoly_stat_bin_pad:
    formula: 'geom_freqpoly layer = ggplot_build() data'
    domain: numeric columns, continuous scales, one panel, no facet
    codomain: BuiltLayer.dist and the trained panel scales
    invariants:
    - matches ggplot2 4.0.3 within 1e-9 rel + 1e-12 abs; groups, panels, counts and column sets exact
    preconditions:
    - coordinate system is the default coord_cartesian, else UnsupportedCoord
    - trained x and y ranges are non-degenerate, else ScaleDomain
proof_obligations:
- id: FREQ-INV-001
  type: invariant
  property: Layer data and trained scales match ggplot2
  formal: 'forall case: layout(case) ~ ggplot2 fixture (1e-9 rel + 1e-12 abs; exact groups, panels, counts, column sets)'
  applies_to: freqpoly_stat_bin_pad
enforcement:
  primary_cases:
    description: the main fixtures are reproduced
    check: grammar::ggplot2_dist_oracle::freq_default
    severity: ERROR
  group_or_style_cases:
    description: group, colour and fill fixtures are reproduced
    check: grammar::ggplot2_dist_oracle::freq_colour_two_groups
    severity: ERROR
  edge_cases:
    description: NA and edge fixtures are reproduced
    check: grammar::ggplot2_dist_oracle::freq_na_x
    severity: ERROR
falsification_tests:
- id: FALSIFY-FREQ-001
  rule: Padding bins
  prediction: dropping the padding bins turns freq_default RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::freq_default
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-002
  rule: Padding position
  prediction: moving the last padding bin by one extra width turns freq_bins5 RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::freq_bins5
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-003
  rule: ncount
  prediction: dividing ncount by the total instead of the maximum turns freq_breaks RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::freq_breaks
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-004
  rule: pad = FALSE is overridden
  prediction: honouring pad = FALSE turns freq_pad_false RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::freq_pad_false
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-005
  rule: Non-default coordinate systems are refused
  prediction: accepting any Cartesian coord turns non_default_coord_is_a_typed_error RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::non_default_coord_is_a_typed_error
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-006
  rule: A stat other than the geom's own is refused
  prediction: accepting any other stat turns a_stat_other_than_the_geoms_own_is_refused RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::a_stat_other_than_the_geoms_own_is_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-007
  rule: Aesthetics the layer does not use are refused
  prediction: ignoring a mapped size, shape, label or unused y/ymin/ymax turns unused_aesthetics_are_refused_not_ignored RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::unused_aesthetics_are_refused_not_ignored
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-008
  rule: Ragged columns are a typed error
  prediction: padding a short column with NA turns ragged_columns_are_a_typed_error RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::ragged_columns_are_a_typed_error
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-009
  rule: Extreme parameters return a typed error
  prediction: raising the 1e100 scale bound to 1e300 turns extreme_parameters_return_a_typed_error_not_a_hang RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::extreme_parameters_return_a_typed_error_not_a_hang
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-010
  rule: Limits and every facet kind are refused
  prediction: accepting ylim or a row, column, grid or wrap facet turns every_coord_limit_and_facet_kind_is_refused RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::every_coord_limit_and_facet_kind_is_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-011
  rule: Position scales are refused
  prediction: applying or ignoring scale_x/scale_y beside the layer instead of refusing turns position_scale_specs_beside_dist_layers_are_refused RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::position_scale_specs_beside_dist_layers_are_refused
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-012
  rule: Grouping is O(n log n)
  prediction: a per-row linear group search or a per-group row scan turns one_hundred_thousand_groups_lay_out_in_bounded_time RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::one_hundred_thousand_groups_lay_out_in_bounded_time
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
- id: FALSIFY-FREQ-013
  rule: Geom alpha reaches the layer
  prediction: dropping the geom's alpha, or accepting it set twice or NaN, turns geom_alpha_reaches_every_dist_layer RED
  test: cargo test -p aprender-viz --lib -- --exact grammar::ggplot2_dist_oracle::geom_alpha_reaches_every_dist_layer
  if_fails: The fixture or comparison cannot see this behaviour; the row proves nothing about it
qa_gate:
  id: F-FREQ-001
  name: ggplot2 conformance (geom_freqpoly)
  description: aprender-viz layout equals ggplot2 4.0.3 ggplot_build() for the geom_freqpoly fixtures
  checks:
  - primary_cases
  - group_or_style_cases
  - edge_cases
