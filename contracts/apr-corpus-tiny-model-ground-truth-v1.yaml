metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    apr-corpus-tiny-model-ground-truth: Model format conversion falsification
  contract: apr-corpus-tiny-model-ground-truth
  status: enforced
  repo: "paiml/tiny-model-ground-truth"
  purpose: "Model format conversion falsification"
  language: "Python"
  domain: "Model formats"
  category: ground-truth
  topic: paiml-ground-truth
  tags: [model-format,falsification]

oracle_integration:
  rag_indexed: true
  freshness_days: 90
  description: "Corpus provides ground-truth patterns for apr oracle --rag queries in the Model formats domain"
preconditions:
  - "Repository paiml/tiny-model-ground-truth exists and is not archived"
  - "Contains at least 10 ground-truth files"
  - "Files have consistent format (tests, examples, or recipes)"
postconditions:
  - "All ground-truth patterns are falsifiable"
  - "Patterns have Rust equivalents or mappings documented"
  - "Corpus indexed in oracle RAG pipeline"
falsification:
  - condition: "Repository contains zero test files"
    severity: P0
    action: add_tests
  - condition: "No Rust equivalent mapping documented"
    severity: P1
    action: add_mapping
  - condition: "Corpus not indexed in oracle RAG (apr oracle --rag fails to find domain patterns)"
    severity: P1
    action: reindex
  - condition: "Last commit older than 180 days (staleness)"
    severity: P1
    action: refresh_or_archive
  - condition: "Ground-truth pattern contradicts current aprender API"
    severity: P0
    action: update_pattern

entity:
  type: repo

# #7235: the postcondition "Corpus indexed in oracle RAG pipeline", bound to a
# lib test that CI runs. It reads every apr-corpus-*-v1.yaml repo and asserts
# the default oracle IndexConfig lists it as a corpus directory.
falsification_tests:
  - id: FALSIFY-CORPUS-TINY-MODEL-GROUND-TRUTH-001
    rule: "the corpus repo named in this contract is in the oracle RAG default IndexConfig (rust or python corpus dirs)"
    prediction: "falsify_apr_corpus_every_contract_repo_is_rag_indexed passes; it fails when a contract's repo is not indexed by default"
    test: "cargo test -p aprender-orchestrate --lib falsify_apr_corpus_every_contract_repo_is_rag_indexed"
