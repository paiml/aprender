equations:
  zero_gradient_prediction_matches_a_pinned_reference_within_t:
    formula: |
      loading a pinned small checkpoint via apr pull and predicting a 100-row fixture matches the committed reference probabilities within 1e-4
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "zero-gradient prediction matches a pinned reference within tolerance"
  the_context_limit_is_enforced__not_silently_truncated:
    formula: |
      a context of rows > the model's documented max is an Err naming the limit; a mutation that truncates instead turns this RED
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "the context limit is enforced, not silently truncated"

