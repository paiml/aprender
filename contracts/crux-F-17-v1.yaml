# CRUX-F-17 — Attention pattern visualization

metadata:
  id: CRUX-F-17
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "F — Tensor Ops & Low-level"
  competitor: pytorch
  demand_score: 3
  intake_status: missing
  description: >
    Dump per-layer, per-head attention matrices and render HTML heatmaps.
    Canonical: HF `model(..., output_attentions=True)` + BertViz
    (github.com/jessevig/bertviz, McCormick 2019). Useful for diagnosing
    attention-sink, position bias, failing induction-heads.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/tensorflow/tensorboard
  - github.com/wandb/wandb
equations:
  attention_viz:
    formula: |
      attn[l,h,i,j] = softmax(q[l,h,i] · k[l,h,j] / sqrt(d_k) + mask[i,j])[j]
      # property: rows sum to 1 (softmax normalization)
      sum_j attn[l,h,i,j] = 1 for every (l,h,i)
    domain: "(model, prompt: str, layers ⊂ [0..L-1], heads ⊂ [0..H-1])"
    codomain: "{out_dir}/attn_l{L}_h{H}.html + attn.npy (shape (L,H,seq,seq))"
    invariants:
    - "attn.npy shape == (|layers|, |heads|, seq, seq)"
    - "every row sums to 1.0 ± 1e-5"
    - "masked positions (where mask=-inf) yield ≤ 1e-9 after softmax"

falsification_tests:
- id: FALSIFY-CRUX-F-17-001
  rule: attention rows are proper distributions
  prediction: "every row in every (layer, head) slice sums to ~1.0"
  test: |
    set -euo pipefail
    apr attn-viz tests/fixtures/tinyllama-hf --prompt "Hello world" \
      --layers 0,1 --heads 0,1 --out /tmp/av
    python3 - <<'PY'
    import numpy as np
    a = np.load("/tmp/av/attn.npy")
    assert a.shape[0] == 2 and a.shape[1] == 2
    sums = a.sum(axis=-1)
    assert np.allclose(sums, 1.0, atol=1e-5), (sums.min(), sums.max())
    PY
  if_fails: rule 'attention rows are proper distributions' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-F-17-002
  rule: causal mask zeroes future positions
  prediction: "upper-triangular positions (j > i) are ≤ 1e-9"
  test: |
    set -euo pipefail
    python3 - <<'PY'
    import numpy as np
    a = np.load("/tmp/av/attn.npy")
    L, H, S, _ = a.shape
    mask = np.triu(np.ones((S, S)), k=1).astype(bool)
    assert (a[..., mask] <= 1e-9).all(), a[..., mask].max()
    PY
  if_fails: rule 'causal mask zeroes future positions' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-F-17-003
  rule: HTML output contains one heatmap per requested head
  prediction: "html contains |layers|*|heads| canvas/svg elements"
  test: |
    set -euo pipefail
    n=$(grep -o '<svg\|<canvas' /tmp/av/attn.html | wc -l)
    python3 -c "assert $n >= 4, $n"

  if_fails: rule 'HTML output contains one heatmap per requested head' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr attn-viz attention values match HF `output_attentions=True` to 1e-5 on same model+prompt"
- type: invariant
  property: "row softmax normalization preserved"
- type: invariant
  property: "causal mask honored (future positions ≈ 0)"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

