equations:
  the_refit_model_saw_every_row:
    formula: |
      the refit estimator's training-row count equals n_train + n_val, asserted through the fitted row count it reports
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "the refit model saw every row"
  refit_keeps_the_selected_hyperparameters_and_drops_the_bag_c:
    formula: |
      the artifact after refit has one child per selected model and its hyperparameters are byte-equal to the pre-refit winner's
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "refit keeps the selected hyperparameters and drops the bag children"

