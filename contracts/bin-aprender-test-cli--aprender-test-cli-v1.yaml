# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────
# bin-aprender-test-cli--aprender-test-cli-v1 — the `aprender-test-cli` bin target of package aprender-test-cli (ONT-10 slice S2), drafted to the exemplar
# contracts/bin-aprender-contracts-cli--pv-v1.yaml over the binary-surface-v1 vocabulary (#4476, #4079, aprender#4502).
#
#
# MEASURED (2026-09-26, batch/ont-10 @ ff9587b596, release build, default features, LC_ALL=C recursive --help walk):
#   - `aprender-test-cli --version` printed "probador 0.69.3", the pre-monorepo name. FIXED 2026-09-27 on batch/ont-10:
#     the clap name is now aprender-test-cli. G0.1 (git sha in --version) is a warning and RED today.
#   - the walk gives 34 leaves; `comply` and `serve` take an OPTIONAL subcommand (Usage `[COMMAND]`) and run on
#     their own. `llm experiment` required one (`<COMMAND>`) and was a ledger orphan; FIXED 2026-09-27: a bare
#     `llm experiment` runs `status` (Usage `[COMMAND]`), so C = 37 invocable paths.
#   - surface_audit.csv: 39 rows = the 37 + 2 HTTP routes of the dev
#     server (GET /, GET /ws), which are the route kind and out of this CLI shape.
#
# CONVENTION THIS DRAFT ASKS OF extract:binary (ONT-4g, aprender-98): nodes also typed bin:target/<package>/<target>
# (no targetNode in pv's subset); commands as bin:command literals (full path below the binary name, space-joined);
# the csv join yields bin:ledgerOrphan / bin:unledgeredCommand.
# A group whose Usage line shows `[COMMAND]` is itself a command path (it runs without a subcommand); one showing
# `<COMMAND>` is not.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────────────────────────────────────────────────────────────────────
name: bin-aprender-test-cli--aprender-test-cli-v1
version: "1.0.0"
scope: >
  The command surface of the `aprender-test-cli` binary (package aprender-test-cli, src crates/aprender-test-cli/src/main.rs): its help, usage errors, version string, the 37 invocable command paths, and its surface-audit rows.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    The command surface of the `aprender-test-cli` binary (package aprender-test-cli, src crates/aprender-test-cli/src/main.rs): its help, usage errors, version string, the 37 invocable command paths, and its surface-audit rows.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'crates/aprender-test-cli/src/main.rs — the clap Command tree'
    - 'docs/audits/surface_audit.csv — the ledger'
    - 'aprender#4502 — ONT-10, slice S2'

entity:
  type: binary
  ref: binary/aprender-test-cli/aprender-test-cli

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-aprender-test-cli-surface
    targetClass: bin:target/aprender-test-cli/aprender-test-cli
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["aprender-test-cli"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-test-cli"]}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "^aprender-test-cli [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-26 (no sha); a warning until the version string carries it
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: warning}
      - path: bin:command
        minCount: 37
        maxCount: 37
        in:
          - "animation check"
          - "audio check"
          - "av-sync check"
          - "av-sync report"
          - "build"
          - "comply"
          - "comply check"
          - "comply diff"
          - "comply enforce"
          - "comply migrate"
          - "comply report"
          - "config"
          - "coverage"
          - "init"
          - "llm bench"
          - "llm data-audit"
          - "llm experiment"
          - "llm experiment compare"
          - "llm experiment init"
          - "llm experiment status"
          - "llm gen-dataset"
          - "llm load"
          - "llm report"
          - "llm score"
          - "llm sweep"
          - "llm test"
          - "playbook"
          - "record"
          - "report"
          - "serve"
          - "serve score"
          - "serve tree"
          - "serve viz"
          - "stress"
          - "test"
          - "video check"
          - "watch"
      - {path: bin:unledgeredCommand, maxCount: 0}
      - {path: bin:ledgerOrphan, maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(aprender-test-cli)) = invocable paths of the recursive --help walk ∧ commands ⊆ {f.feature : f ∈ surface_audit, f.binary = aprender-test-cli}"
    domain: "the aprender-test-cli line of the tracked snapshot, the clap tree of the default-feature build, and the ledger rows with binary = aprender-test-cli"
    codomain: "set equality (37 paths on 2026-09-27), or a Fail naming each path in the symmetric difference"
    invariants:
      - "a leaf is a command; a group whose Usage shows [COMMAND] is also one; clap's auto `help` is not"
    preconditions:
      - "the snapshot was written at this commit"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `aprender-test-cli --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-APRENDER_TEST_CLI-INV-001
    property: every aprender-test-cli command path has an audited ledger row, and every CLI row names a command path
    formal: '∀ c ∈ commands(aprender-test-cli): |{r ∈ surface_audit : r.binary = aprender-test-cli ∧ r.feature = c}| ≥ 1'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-APRENDER_TEST_CLI-001
    rule: 'G1.2 help answers'
    prediction: '`aprender-test-cli --help` exits 0 with non-empty stdout'
    test: 'scripts/dogfood_surfaces.sh --cli aprender-test-cli'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-26: exit 0, GREEN)'
    mutation: 'make the top-level --help return an error; must turn RED'
  - id: FALSIFY-BIN-APRENDER_TEST_CLI-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`aprender-test-cli --no-such-flag` exits 2'
    test: 'scripts/dogfood_surfaces.sh --cli aprender-test-cli'
    if_fails: 'a typo is silently ignored (observed 2026-09-26: exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-APRENDER_TEST_CLI-003
    rule: 'G0.1 the version names the commit'
    prediction: '`aprender-test-cli --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: "LIVE RED 2026-09-27: `aprender-test-cli 0.69.3` — no sha"
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-APRENDER_TEST_CLI-004
    rule: 'G1.3/G1.4 the surface set equals the snapshot'
    prediction: 'the enumerated surface of aprender-test-cli equals the in: list of this shape, no more and no fewer'
    test: 'pv lint contracts/ --gate shapes, once extract:binary writes the node'
    if_fails: "GREEN on the walk 2026-09-27: 37 = 34 leaves + comply, serve, llm experiment"
    mutation: 'add a subcommand/route/tool without re-snapshotting; must turn RED naming it'
  - id: FALSIFY-BIN-APRENDER_TEST_CLI-005
    rule: 'ledger rows exist and resolve'
    prediction: "docs/audits/surface_audit.csv has ≥1 row per command path with binary = aprender-test-cli, and no CLI row names a non-command"
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: "GREEN 2026-09-27: 39 rows = 37 commands + 2 dev-server routes (GET /, GET /ws) the CLI shape does not judge"
    mutation: 'delete every aprender-test-cli row; must turn RED naming aprender-test-cli'

