# CRUX-A-17 — Manifest signing cosign/sigstore

metadata:
  id: CRUX-A-17
  version: "1.2.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: partial
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Hub & Distribution"
  competitor: ecosystem
  demand_score: 2
  intake_status: missing
  description: >
    Sign apr model manifests with cosign / sigstore (keyless OIDC or
    keyed). Canonical: `cosign sign-blob` + `cosign verify-blob`
    (github.com/sigstore/cosign). Signature is detached;
    `.sig` and `.crt` alongside manifest; verification exits 0 on
    tampered-free blob and non-zero on any byte mutation.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/huggingface/transformers — Trainer
  - docs.python.org — packaging, signatures, supply chain
equations:
  cosign_sign:
    formula: |
      sign(blob) → { sig: bytes, cert: x509, bundle: rekor_entry }
      verify(blob, sig, cert) =
        x509.verify_chain(cert, fulcio_roots)
        ∧ signature_verify(cert.pubkey, blob, sig)
        ∧ rekor.check_inclusion(bundle)
      tamper(blob) ⇒ verify = false (fail closed)
    domain: "(manifest: Path, oidc_issuer: str?, keyless: bool)"
    codomain: "{sig: Path, cert: Path, bundle: Path}"
    invariants:
    - "verify on original blob returns exit 0"
    - "verify on byte-flipped blob returns non-zero exit"
    - "signed manifest round-trips through cosign binary (external verifier)"

falsification_tests:
- id: FALSIFY-CRUX-A-17-001
  rule: round-trip sign → verify succeeds
  prediction: "apr sign produces artifacts cosign verify-blob accepts"
  test: |
    set -euo pipefail
    apr publish sign /tmp/manifest.json --keyless \
      --sig /tmp/m.sig --cert /tmp/m.crt --bundle /tmp/m.bundle
    cosign verify-blob --bundle /tmp/m.bundle \
      --certificate /tmp/m.crt --signature /tmp/m.sig /tmp/manifest.json
  if_fails: rule 'round-trip sign → verify succeeds' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/sign_artifacts.rs
    sub_claim: |
      Algorithm-level necessary condition: the three sidecar artifacts
      (.sig, .crt, .bundle) exist at predictable paths adjacent to the
      manifest. Without this layout, `cosign verify-blob` cannot locate
      the inputs. The classifier proves path computation is deterministic
      and the parent directory is shared.
    tests:
    - artifact_paths_use_dot_suffix_convention
    - artifact_paths_adjacent_to_manifest
    - artifact_paths_relative_manifest_is_fine
    - artifact_paths_are_deterministic
    - all_present_false_when_paths_do_not_exist
    scope: sidecar path layout (pure function)
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: cosign binary round-trip harness + Fulcio OIDC issuance
- id: FALSIFY-CRUX-A-17-002
  rule: tampered blob fails verification
  prediction: "one-byte flip → verify exit != 0"
  test: |
    set -euo pipefail
    cp /tmp/manifest.json /tmp/bad.json
    printf 'X' | dd of=/tmp/bad.json bs=1 count=1 seek=0 conv=notrunc
    ! cosign verify-blob --bundle /tmp/m.bundle \
        --certificate /tmp/m.crt --signature /tmp/m.sig /tmp/bad.json 2>/tmp/err
    grep -E "verification failed|invalid signature" /tmp/err
  if_fails: rule 'tampered blob fails verification' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/sign_artifacts.rs
    sub_claim: |
      Necessary condition for tamper detection: sha256(blob_after) !=
      sha256(blob_before) for any one-bit mutation, append, or
      truncation. If this gate passes, the signing pipeline has
      fail-closed semantics at the hash layer BEFORE any X.509 /
      Fulcio / Rekor work begins. Proved here for single-byte flip,
      byte-append, byte-truncation, and empty-vs-nonempty.
    tests:
    - content_hash_matches_identical_blob
    - content_hash_rejects_single_byte_flip
    - content_hash_rejects_trailing_byte_append
    - content_hash_rejects_truncation
    - content_hash_rejects_empty_against_nonempty
    - content_hash_mismatch_carries_hex_for_debug
    scope: sha256 gate (pure function)
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: cosign verify-blob end-to-end failure-exit-code harness
- id: FALSIFY-CRUX-A-17-003
  rule: rekor transparency log inclusion proof present
  prediction: "bundle contains rekor entry with UUID and SET"
  test: |
    set -euo pipefail
    python3 -c "
    import json
    b = json.load(open('/tmp/m.bundle'))
    assert 'Payload' in b or 'rekor' in json.dumps(b).lower(), b.keys()
    "

  if_fails: rule 'rekor transparency log inclusion proof present' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/sign_artifacts.rs
    sub_claim: |
      Algorithm-level necessary condition: the bundle is valid JSON and
      carries a rekor-inclusion-proof envelope (Payload + Base64Signature,
      or a rekorBundle-shaped key, or rekor_bundle snake-case). Without
      this envelope there is no inclusion proof to verify. Full
      crypto-layer inclusion verification requires live Rekor access.
    tests:
    - bundle_with_cosign_modern_shape_is_recognized
    - bundle_with_legacy_rekor_bundle_key_is_recognized
    - bundle_with_rekor_snake_case_key_is_recognized
    - bundle_without_rekor_or_payload_is_rejected
    - bundle_with_only_payload_but_no_signature_is_rejected
    - malformed_bundle_json_is_rejected
    - bundle_classifier_is_pure
    scope: bundle shape classifier (pure function, JSON parse only)
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: live Rekor transparency-log inclusion-verify harness
proof_obligations:
- type: equivalence
  property: "apr publish sign produces cosign-compatible sig + cert + bundle"
- type: invariant
  property: "tamper detection (verify fails closed on any mutation)"
- type: invariant
  property: "rekor transparency log inclusion"

