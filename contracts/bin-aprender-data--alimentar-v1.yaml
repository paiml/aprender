# ──────────────────────────────────────────────
# bin-aprender-data--alimentar-v1 — the `alimentar` bin target of package aprender-data (ONT-10 slice S10)
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha, helpSha,
# gitSha, …) live in binary-surface-v1 and are not restated. Moved from docs/ont-10/binary-contracts/ (aprender-bb).
#
# binary-alimentar-v1 — ONT-10 slice S10: the `alimentar` binary as an entity (ONT-001 v4.17 ONT-4g; #4476, #4079)
#
# MEASURED (2026-09-26, batch/ont-10 @ b1cd8c0b0, `cargo build --release -p aprender-data --features cli`, default
# features otherwise): `alimentar --version` = "alimentar 0.69.3"; the recursive --help walk gives 31 leaf commands,
# the set below. surface_audit.csv has 35 alimentar rows: the 31, plus 4 for commands the DEFAULT build does not
# expose, because they sit behind non-default features:
#   doctest extract, doctest merge   (feature `doctest`)
#   hub push, import hf              (feature `hf-hub`)
# Those 4 are bin:ledgerOrphan today, so `alimentar-commands` is RED until either the ledger rows name their
# feature or the release build enables it. Recorded, not hidden: that is the defect this shape exists to find.
# G0.1 (--version carries the git sha) is a warning here and RED on every current build: the string is "0.69.3".
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-data--alimentar-v1
version: "1.0.0"
scope: >
  The built `alimentar` target of package `aprender-data` (default features) as the focus node binary/aprender-data/alimentar: its identity and its exact CLI command set, and the surface_audit.csv rows that must resolve to it.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice S10 (alimentar). Per-binary shapes over the node extract:binary (ONT-4g, #4476) draws
    for binary/aprender-data/alimentar, on the binary-surface-v1 vocabulary.
  references:
    - 'crates/aprender-data/tests/cli_surface_gate.rs — the gate falsifiers 001, 002, 004 and 006 run'
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (the ledger; binary column = alimentar)'
    - 'scripts/dogfood_surfaces.sh (the snapshot extract:binary reads)'
    - 'aprender#4502 — ONT-10'

entity:
  type: binary
  ref: binary/aprender-data/alimentar

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-alimentar-surface
    targetClass: bin:target/aprender-data/alimentar
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["alimentar"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-data"]}
      - {path: "bin:versionString", minCount: 1, maxCount: 1, pattern: "^alimentar [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-27 (no sha); a warning until the version string carries it
      - {path: "bin:versionString", minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: "warning"}
      - path: bin:command
        minCount: 31
        maxCount: 31
        in:
          - "convert"
          - "dedup"
          - "drift compare"
          - "drift detect"
          - "drift merge"
          - "drift report"
          - "drift sketch"
          - "fed manifest"
          - "fed plan"
          - "fed split"
          - "fed verify"
          - "filter-text"
          - "fim"
          - "head"
          - "import local"
          - "info"
          - "mix"
          - "quality check"
          - "quality profiles"
          - "quality report"
          - "quality score"
          - "registry delete"
          - "registry init"
          - "registry list"
          - "registry pull"
          - "registry push"
          - "registry search"
          - "registry show-info"
          - "repl"
          - "schema"
          - "view"
      - {path: "bin:ledgerOrphan", maxCount: 0}
      - {path: "bin:unledgeredCommand", maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(binary/aprender-data/alimentar) = C, |C| = 31, where C = the leaves of the recursive --help walk of the default-feature build ∧ ledgerOrphan = { r ∈ csv : r.binary = alimentar ∧ r.feature ∉ C }; unledgeredCommand = C ∖ { r.feature : r.binary = alimentar }"
    domain: "the snapshot record dogfood_surfaces.sh writes for this target; docs/audits/surface_audit.csv rows whose binary column is alimentar"
    codomain: "set equality, or a Fail naming each member of the symmetric difference; literals on the focus node, one per orphan row or unledgered command"
    invariants:
      - "in + minCount 31 + maxCount 31 over distinct literals is set equality: an added, dropped or renamed command is a violation naming it"
      - "a ledger row for a command the built binary does not expose is a violation, never a silent skip"
    preconditions:
      - "the snapshot was written at this commit, default features"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `alimentar --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-ALIMENTAR-INV-001
    property: every alimentar surface member has an audited ledger row, and every ledger row names one
    formal: '∀ c ∈ surface(alimentar): ∃ r ∈ surface_audit : r.binary = alimentar ∧ path(r) = c; ∀ r with r.binary = alimentar: path(r) ∈ surface(alimentar)'
    prose: false

  - id: BIN-ALIMENTAR-INV-002
    property: unusable input is a clean rejection, never a success and never a panic
    formal: '∀ a ∈ rejection_rows(crates/aprender-data/tests/cli_surface_gate.rs): exit(a) ∉ {0, 101} ∧ "panicked" ∉ stderr(a)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-ALIMENTAR-001
    rule: 'G1.2 help answers'
    prediction: '`alimentar --help` exits 0 and advertises ≥1 subcommand; every advertised `<cmd> --help` exits 0'
    test: 'cargo test -p aprender-data --test cli_surface_gate every_advertised_subcommand_is_reachable'
    if_fails: 'the binary cannot describe its own surface, or advertises a command it cannot reach (observed 2026-09-26: GREEN)'
    mutation: 'make one subcommand''s --help return an error; must turn RED naming it'
  - id: FALSIFY-BIN-ALIMENTAR-002
    rule: 'G1.2 an unknown flag or subcommand is a usage error'
    prediction: '`alimentar --no-such-flag` and `alimentar no-such-subcommand` each exit 2'
    test: 'cargo test -p aprender-data --test cli_surface_gate unknown_'
    if_fails: 'a typo is silently ignored (observed 2026-09-26: both exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-ALIMENTAR-003
    rule: 'G0.1 the version names the commit'
    prediction: '`alimentar --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'LIVE RED 2026-09-27: "alimentar 0.69.3" — no sha; a stale alimentar reads as HEAD'
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-ALIMENTAR-004
    rule: 'G1.3/G1.4 the command set equals the snapshot'
    prediction: 'the advertised top-level subcommands are exactly convert, info, head, schema, mix, fim, dedup, filter-text, view, import, registry, drift, quality, fed, repl'
    test: 'cargo test -p aprender-data --test cli_surface_gate advertised_subcommands_are_the_pinned_surface'
    if_fails: 'a subcommand was added or removed without updating the pinned surface (observed 2026-09-26: GREEN)'
    mutation: 'add a subcommand without editing SUBCOMMANDS; must turn RED naming it'
  - id: FALSIFY-BIN-ALIMENTAR-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 row per surface member with binary = alimentar (35 rows on 2026-09-27)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'the dogfood coverage ratio is computed over a ledger that silently omits a shipped surface member'
    mutation: 'delete every alimentar row; must turn RED naming alimentar'
  - id: FALSIFY-BIN-ALIMENTAR-006
    rule: 'unusable input is rejected cleanly'
    prediction: '`info`, `head`, `schema` and `convert <in> <out>` on a missing, empty and garbage input: each exits non-zero, not 101, with no "panicked" on stderr'
    test: 'cargo test -p aprender-data --test cli_surface_gate unusable_input_is_rejected'
    if_fails: 'MEASURED 2026-09-26 (aprender-01): GREEN on an unmutated tree; no source mutation was run for this binary'
    mutation: 'make a rejection path return Ok(()) or unwrap the read; must turn RED on that row'
