metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    apr-tool-ccpo: Claude Code proxy to other AI engines
  contract: apr-tool-ccpo
  status: enforced
  repo: "paiml/ccpo"
  purpose: "Claude Code proxy to other AI engines"
  language: "Rust"
  category: active-tool
  topic: paiml-active-tool
  expected: {archived: false, has_readme: false, has_ci_workflows: true}

inputs:
  - "AI API requests"
outputs:
  - "Proxied responses"
preconditions:
  - "Repository paiml/ccpo exists and is not archived"
  - "Repository paiml/ccpo has no README as of the 2026-11-18 snapshot (follow-up: create_readme)"
  - "CI pipeline passes on main branch"
postconditions:
  - "Tool produces documented outputs from documented inputs"
  - "No legacy names in source code imports"
falsification:
  - condition: "gh repo view paiml/ccpo returns archived=true"
    severity: P0
    action: reclassify
  - condition: "README.md missing or empty"
    severity: P0
    action: create_readme
  - condition: "No CI workflow in .github/workflows/"
    severity: P1
    action: add_ci
  - condition: "cargo build fails (Rust) or equivalent build fails"
    severity: P0
    action: fix_build
  - condition: "Zero tests in repository"
    severity: P1
    action: add_tests

entity:
  type: repo
  ref: paiml/ccpo@360f173fb16b68b735b8323edbbe56c5fc49b9db

# #7235: bound to a CI-run test. The snapshot is dated evidence captured from the GitHub API (see captured_at in
# evidence/github/repo/), not a live check of the repo.
falsification_tests:
  - id: FALSIFY-APR_TOOL_CCPO_V1-BIND-001
    rule: "the snapshot of paiml/ccpo (evidence/github/repo/, dated evidence captured at 2026-11-18T20:13:38Z, not a live check) equals the state this row declares (metadata.expected, default archived=false, has_readme=true, has_ci_workflows=true), and its ref and nameWithOwner match this row"
    prediction: "apr_tool_rows_hold_against_repo_snapshots fails when the snapshot is missing, disagrees with the row, or records the repo archived, without a README or without a CI workflow"
    test: "cargo test -p aprender-contracts --lib apr_tool_rows_hold_against_repo_snapshots"
