metadata:
  id: CRUX-A-12
  version: "1.1.0"
  created: "2026-04-18"
  last_updated: "2026-04-20"
  author: PAIML Engineering
  registry: true
  status: partial
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Intake & Discovery"
  competitor: ollama
  demand_score: 4  # 1..5, high priority in pmat work
  intake_status: missing
  description: >
    `apr ps` — list running / VRAM-resident models. Parity target is
    `ollama ps` (https://github.com/ollama/ollama/blob/main/docs/api.md#list-running-models
    and CLI `ollama ps`), which reports NAME, ID, SIZE, PROCESSOR, and UNTIL
    (idle-eviction timestamp) for each model currently loaded by the serve
    daemon. aprender equivalent: `apr ps` queries the `apr serve` control socket
    (or HTTP GET /api/ps) and emits the same fields plus `--json` for scripts.
  references:
  - "https://github.com/ollama/ollama/blob/main/docs/api.md#list-running-models"
  - "https://github.com/ollama/ollama/blob/main/cmd/cmd.go"  # ListRunningHandler

equations:
  ps_row_schema:
    formula: |
      Each row in `apr ps --json` output is a JSON object with fields:
        name:        string          (e.g. "qwen2.5-coder:7b-q4_k_m")
        id:          string          (sha256 prefix, ≥12 hex chars)
        size_bytes:  u64 > 0
        processor:   string ∈ {"100% GPU", "NN%/MM% CPU/GPU", "100% CPU"}
        until:       RFC3339 string  (idle-eviction deadline, monotonic ≥ now)
    domain: "`apr serve` loaded-model registry"
    codomain: array of RunningModel JSON objects
    invariants:
    - "Every required field present and typed correctly"
    - "until ≥ now (no already-evicted entries shown)"
    - "size_bytes matches the file on disk (not quant-name estimate)"

  ps_reflects_runtime_state:
    formula: |
      Let L = set of models currently mmap'd/resident in `apr serve` at time t.
      `apr ps` at time t ≥ t₀ returns exactly L, modulo models evicted in
      the [t₀, t] window.
    domain: (serve_state_t0, elapsed)
    codomain: Set[RunningModel]
    invariants:
    - "A model not currently loaded MUST NOT appear in apr ps"
    - "A model loaded in the last ≤5s MUST appear"

  ollama_ps_parity:
    formula: |
      Same-model-loaded state: `apr ps --json` and `ollama ps --format json`
      yield the same (name_normalized, processor_pct_gpu) tuple up to name
      prefix mapping; field set is a superset of ollama's.
    domain: identical load state
    codomain: JSON ps listing
    invariants:
    - "apr ps columns are a superset of ollama ps columns (NAME, SIZE, PROCESSOR)"
    - "processor_pct_gpu parses identically from both tools"

falsification_tests:
- id: FALSIFY-CRUX-A-12-001
  rule: empty ps when nothing loaded
  prediction: "`apr ps --json` returns [] when serve has no model loaded"
  test: |
    apr serve --daemon --idle-timeout 0 &
    PID=$!; sleep 1
    apr ps --json | jq 'length == 0'
    kill $PID
  if_fails: "apr ps reports phantom entries for unloaded models"
  evidence_discharged_by:
    classifier: crates/apr-cli/src/commands/ps_schema.rs
    sub_claim: >
      A pure classifier distinguishes a literal empty JSON array `[]` from all
      non-empty, null, object, or scalar representations. This guarantees that
      when `apr ps --json` emits `[]`, downstream consumers can detect the
      empty state unambiguously (the necessary condition for a valid empty
      response).
    tests:
    - falsify_001_sub_claim_empty_is_empty_array
    - is_empty_ps_rejects_non_array_types
    - empty_array_passes_validation
    scope: >
      PARTIAL_ALGORITHM_LEVEL. Classifier proves the JSON-shape sub-claim. Full
      discharge requires booting `apr serve --daemon` with zero models loaded
      and asserting stdout of `apr ps --json` is the literal `[]`. Deferred to
      CRUX-A-12 integration discharge (owner: serve team).
    discharge_status: PARTIAL_ALGORITHM_LEVEL

- id: FALSIFY-CRUX-A-12-002
  rule: load is visible in ps
  prediction: "running a short completion makes that model appear in apr ps"
  test: |
    apr serve --daemon &
    PID=$!; sleep 1
    apr run hf://unsloth/Qwen2.5-Coder-7B-Instruct-GGUF --prompt "hi" --max-tokens 4 >/dev/null
    apr ps --json | jq -e '.[] | select(.name | contains("Qwen2.5-Coder-7B"))' >/dev/null
    kill $PID
  if_fails: "apr ps does not show a model that was just loaded"

- id: FALSIFY-CRUX-A-12-003
  rule: row schema complete
  prediction: "every row has {name,id,size_bytes,processor,until}"
  test: |
    apr ps --json | jq -e 'all(.[]; (.name and .id and .size_bytes and .processor and .until))'
  if_fails: "apr ps row missing required fields (schema drift)"
  evidence_discharged_by:
    classifier: crates/apr-cli/src/commands/ps_schema.rs
    sub_claim: >
      `validate_ps_row` rejects any JSON object missing one of {name, id,
      size_bytes, processor, until}, and further rejects bad types
      (size_bytes=0 or string, id<12 hex chars, processor outside the
      ollama-parity set, until not RFC3339 shape). `validate_ps_array`
      enforces the same rule for every row. Any real `apr ps --json` output
      can be fed through this classifier and will fail closed on schema
      drift.
    tests:
    - falsify_003_sub_claim_good_row_validates
    - missing_name_is_error
    - missing_id_is_error
    - missing_size_bytes_is_error
    - missing_processor_is_error
    - missing_until_is_error
    - size_bytes_zero_is_error
    - size_bytes_string_is_error
    - short_id_is_error
    - non_hex_id_is_error
    - processor_garbage_rejected
    - processor_bad_sum_rejected
    - until_not_rfc3339_rejected
    - two_row_array_validates_each_row
    - second_row_malformed_is_detected
    - validate_rejects_non_array_top_level
    - validate_rejects_row_that_is_not_object
    scope: >
      PARTIAL_ALGORITHM_LEVEL. Classifier fully proves the row-schema sub-
      claim on any JSON payload. Full discharge requires `apr serve` to
      actually emit this schema; wiring the real `apr ps` CLI into the
      classifier is the integration step, deferred.
    discharge_status: PARTIAL_ALGORITHM_LEVEL

- id: FALSIFY-CRUX-A-12-004
  rule: parity with ollama ps column set
  prediction: "apr ps columns ⊇ {NAME, SIZE, PROCESSOR}"
  test: |
    # TODO: capture `ollama ps` text transcript in evidence/crux/ollama/ps-golden.txt
    HDR=$(apr ps | head -1)
    for col in NAME SIZE PROCESSOR; do
      echo "$HDR" | grep -qw "$col" || { echo "missing column $col"; exit 1; }
    done
  if_fails: "apr ps header lacks one or more ollama-parity columns"
  evidence_discharged_by:
    classifier: crates/apr-cli/src/commands/ps_schema.rs
    sub_claim: >
      `header_has_required_columns` enforces that the `apr ps` text header
      contains each of {NAME, SIZE, PROCESSOR} as a whole token (not as a
      prefix/suffix inside another word). A header that drops, renames, or
      substrings a required column is rejected at this layer.
    tests:
    - falsify_004_sub_claim_header_has_required_columns
    - header_missing_name_rejected
    - header_missing_size_rejected
    - header_missing_processor_rejected
    - header_named_not_a_name_match
    - header_case_matters
    scope: >
      PARTIAL_ALGORITHM_LEVEL. Classifier proves the header-token-set sub-
      claim for any text header. Full parity-vs-ollama discharge requires a
      golden `ollama ps` transcript at evidence/crux/ollama/ps-golden.txt and
      running `apr ps | head -1` against it, deferred.
    discharge_status: PARTIAL_ALGORITHM_LEVEL

proof_obligations:
- type: invariant
  property: "apr ps rows reflect the currently-loaded model set in apr serve"
- type: invariant
  property: "Every apr ps row satisfies the RunningModel JSON schema"
- type: invariant
