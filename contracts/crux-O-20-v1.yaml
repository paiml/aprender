  prediction: "for every (item, step) q0.1 <= q0.5 <= q0.9, asserted over the whole fixture; a mutation that shuffles the quantile columns turns this RED"
  test: >-
    LIVE-PENDING - quantile forecasts are monotone in the quantile level. No test surface exists today because the capability is unimplemented: Probabilistic forecasts: quantile_levels and the forecasting metric family (WQL, MQL, MASE, SMAPE, RMSSE, WAPE) (aprender#3390, CRUX-O-20). PROMOTE by authoring a test named quantiles_monotone in module `forecast/metrics/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
