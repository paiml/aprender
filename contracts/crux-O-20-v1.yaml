  competitor: autogluon
  demand_score: 5  # 1..5, critical priority in pmat work
  intake_status: missing
  github_issue: 3390
  description: >
    Probabilistic forecasts: quantile_levels and the forecasting metric family (WQL, MQL, MASE, SMAPE, RMSSE, WAPE). Competitor verb: TimeSeriesPredictor(eval_metric="WQL", quantile_levels=[0.1,0.5,0.9]). Gap measured in aprender at eb262f8eb: ARIMA.forecast returns a point path; metrics/probabilistic.rs holds classification-probability metrics, and metrics/regression.rs has no seasonal-scaled (MASE/RMSSE) or quantile (WQL/MQL) losses.
  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
