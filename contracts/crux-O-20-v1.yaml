  - 'evidence: evidence/crux/autogluon/api-surface.md'

equations:
  quantile_forecasts_are_monotone_in_the_quantile_level:
    formula: |
      for every (item, step) q0.1 <= q0.5 <= q0.9, asserted over the whole fixture; a mutation that shuffles the quantile columns turns this RED
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "quantile forecasts are monotone in the quantile level"
  each_metric_matches_the_autogluon_reference_value_on_a_pinne:
    formula: |
      WQL, MASE, SMAPE, RMSSE, WAPE and MQL computed on a committed (y_true, y_pred, quantiles) fixture equal the reference values produced by autogluon.timeseries.metrics within 1e-9
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "each metric matches the AutoGluon reference value on a pinned fixture"

