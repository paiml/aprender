metadata:
  version: 1.0.0
  kind: schema
  description: |
    PCU (Page Content Unit) contract for book/src/cli/validate.md (apr validate CLI reference).
    Enforces: page exists, references the command, has a runnable example.
  references:
    - "docs/specifications/book-completeness-spec.md"

equations:
  pcu_header_present:
    formula: "file_contains(book/src/cli/validate.md, 'PCU: cli-validate')"
  command_mentioned:
    formula: "file_contains(book/src/cli/validate.md, 'apr validate')"
  example_block_present:
    formula: "file_contains_fenced(book/src/cli/validate.md, language='bash')"

falsification_tests:
  - id: FALSIFY-PAGE-CLI-VALIDATE-001
    name: stub_exists
    prediction: "book/src/cli/validate.md exists on disk"
    test_harness: "test -f book/src/cli/validate.md"
    expected_output: "exit 0"
    if_fails: "Run scripts/gen-cli-chapter-stubs.sh to regenerate."

  - id: FALSIFY-PAGE-CLI-VALIDATE-002
    name: command_mentioned
    prediction: "page references the command at least once"
    test_harness: "grep -q 'apr validate' book/src/cli/validate.md"
    expected_output: "exit 0"
    if_fails: "Add a mention of `apr validate` to the chapter."

  - id: FALSIFY-PAGE-CLI-VALIDATE-003
    name: runnable_example
    prediction: "page has at least one ```bash code block"
    test_harness: "grep -c '^```bash' book/src/cli/validate.md"
    expected_output: "stdout >= 1"
    if_fails: "Add a ```bash code block with a runnable example."

  - id: FALSIFY-PAGE-CLI-VALIDATE-004
    name: truncated_shard_refused
    prediction: "a shard whose size differs from .apr-manifest.json, or is absent, is refused with a re-download hint"
    test_harness: "cargo test -p apr-cli --lib validate_shard_manifest"
    expected_output: "test result: ok. 5 passed"
    if_fails: "validate_shard_manifest in crates/apr-cli/src/validate.rs accepts a missing, truncated or unparseable shard manifest."

  - id: FALSIFY-PAGE-CLI-VALIDATE-005
    name: shard_index_dispatches_to_manifest
    prediction: "a sharded index.json next to .apr-manifest.json is validated against it; without a manifest it passes"
    test_harness: "cargo test -p apr-cli --lib validate_shard_index"
    expected_output: "test result: ok. 3 passed"
    if_fails: "validate_shard_index in crates/apr-cli/src/validate.rs stopped delegating to validate_shard_manifest."
