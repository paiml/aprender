# CRUX-E-02 — Perplexity on held-out corpus

metadata:
  id: CRUX-E-02
  version: "1.1.0"
  created: "2026-04-18"
  updated: "2026-04-21"
  author: PAIML Engineering
  registry: true
  status: partial
  kind: kernel
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "E — Evaluation"
  competitor: llama_cpp
  demand_score: 5
  intake_status: partial
  description: >
    Perplexity on held-out corpus. Root-cause workflow extracted from
    llama_cpp `examples/perplexity` (`llama-perplexity -m model.gguf -f
    wikitext-2-raw.txt -c 2048`). Aprender pure-math surface: `apr ppl
    --log-probs-file <path>.json --json` computes `PPL = exp(-mean(log p))`
    via the pure classifier `aprender::metrics::perplexity`. The
    live-inference surface (`apr eval model.apr --task perplexity --corpus
    ...`) remains PARTIAL under BLOCKER-UPSTREAM-MISSING pending a stable
    per-token log-probs extraction path for arbitrary GGUF/APR models.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - 'llama.cpp examples/perplexity — canonical PPL CLI'
  - 'arXiv:2402.16775 — held-out perplexity for pretraining evaluation'
  - 'https://github.com/ggerganov/llama.cpp/issues/7111 (user demand)'

equations:
  perplexity_definition:
    formula: |
      PPL(log_probs) = exp(- (1/N) * Σ_{i=1..N} log p_i)
      where:
        log p_i ∈ (-∞, 0]  (natural log of observed-token probability)
        N = |log_probs| > 0
    domain: "(log_probs: Vec<f64>)"
    codomain: "PerplexityOutcome (Ok{ppl, mean_nll, num_tokens} | EmptyLogProbs | NonFiniteLogProb | PositiveLogProb)"
    invariants:
    - "N > 0 and all log p_i finite and <= 0 -> Ok with ppl >= 1.0 and finite"
    - "empty log_probs -> EmptyLogProbs (distinct; no silent pass)"
    - "any NaN or +/-inf -> NonFiniteLogProb"
    - "any log p_i > 0 -> PositiveLogProb(value) (probability > 1 impossible)"
    - "log p_i == 0 for all i -> ppl == 1.0 (perfect prediction)"
    - "mean_nll_a < mean_nll_b -> ppl_a < ppl_b (monotone in NLL)"

  ppl_json_schema:
    formula: |
      `apr ppl --log-probs-file FILE.json --json` output MUST contain:
        ppl: f64 >= 1.0
        mean_nll: f64 >= 0.0
        num_tokens: u64 > 0
        log_probs_path: string (valid path)
    domain: "CLI invocation over a JSON array of f64 log-probabilities"
    codomain: "JSON object"
    invariants:
    - "All 4 keys MUST be present"
    - "ppl == exp(mean_nll) (round-trip consistency)"
    - "num_tokens == len(log_probs)"

falsification_tests:
- id: FALSIFY-CRUX-E-02-001
  rule: "apr ppl --help advertises the --log-probs-file flag"
  prediction: "apr ppl --help exits 0 and stdout contains --log-probs-file"
  test: |
    apr ppl --help | grep -F -- '--log-probs-file'
  if_fails: "CLI does not surface perplexity; users cannot reach the classifier"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/ppl.rs
    sub_claim: "--log-probs-file flag plumbed through clap"
    tests:
    - falsify_crux_e_02_help_advertises_log_probs_file_flag
    - falsify_crux_e_02_rejects_bare_ppl_without_file
    scope: FULL
    discharge_status: FULL

- id: FALSIFY-CRUX-E-02-002
  rule: "JSON output emits `ppl` key with correct value"
  prediction: "For log p_i = -ln(2), apr ppl --json reports ppl approximately 2.0"
  test: |
    apr ppl --json --log-probs-file /tmp/log_probs.json | jq -e '.ppl'
  if_fails: "JSON schema regression — consumers parsing the output will break"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/ppl.rs
    sub_claim: "print_json emits ppl, mean_nll, num_tokens, log_probs_path keys"
    tests:
    - falsify_crux_e_02_json_emits_ppl_key
    scope: FULL
    discharge_status: FULL

- id: FALSIFY-CRUX-E-02-003
  rule: "PPL >= 1.0 and finite for any valid input"
  prediction: "compute_perplexity(valid log_probs).ppl >= 1.0 and finite"
  test: |
    true
  if_fails: "Cross-entropy computation broken — ppl < 1 or NaN/Inf"
  evidence_discharged_by:
    classifier_path: crates/aprender-core/src/metrics/perplexity.rs
    sub_claim: "classify_ppl_at_least_one holds on representative inputs"
    tests:
    - ppl_at_least_one_invariant_holds
    - perfect_prediction_ppl_is_one
    - uniform_log_prob_gives_correct_ppl
    - falsify_crux_e_02_004_ppl_at_least_one_and_finite
    - falsify_crux_e_02_perfect_prediction_ppl_is_one
    scope: FULL
    discharge_status: FULL

- id: FALSIFY-CRUX-E-02-004
  rule: "No silent pass on ill-formed log-prob input"
  prediction: "empty / NaN / +/-inf / strictly-positive log-prob all map to distinct Outcome variants"
  test: |
    true
  if_fails: "Silent zero/default on bad input would mask quantile bugs and broken models"
  evidence_discharged_by:
    classifier_path: crates/aprender-core/src/metrics/perplexity.rs
    sub_claim: "EmptyLogProbs, NonFiniteLogProb, PositiveLogProb are distinct variants"
    tests:
    - empty_log_probs_distinct_outcome
    - nan_log_prob_rejected
    - positive_infinity_rejected
    - negative_infinity_rejected
    - positive_log_prob_rejected
    - classifier_functions_all_pass
    - falsify_crux_e_02_empty_distinct_outcome
    - falsify_crux_e_02_nan_log_prob_rejected_via_cli
    - falsify_crux_e_02_empty_file_rejected_via_cli
    scope: FULL
    discharge_status: FULL

- id: FALSIFY-CRUX-E-02-005
  rule: "PPL monotone in mean NLL"
  prediction: "mean_nll_a < mean_nll_b implies ppl_a < ppl_b"
  test: |
    true
  if_fails: "exp() monotonicity broken OR sign of mean_nll inverted"
  evidence_discharged_by:
    classifier_path: crates/aprender-core/src/metrics/perplexity.rs
    sub_claim: "compute_perplexity preserves order under mean NLL"
    tests:
    - ppl_monotone_in_mean_nll
    - falsify_crux_e_02_ppl_monotone_in_nll
    scope: FULL
    discharge_status: FULL

- id: FALSIFY-CRUX-E-02-006
  rule: "PPL in known-good band for live fp16 Llama-3-8B on WikiText-2"
  prediction: "5.5 <= ppl <= 7.5 (llama.cpp reference: 6.12)"
  test: |
    OUT=$(apr eval models/llama-3-8b-fp16.apr --task perplexity \
      --corpus evidence/crux/llama_cpp/wikitext-2-raw.txt \
      --context 2048 --json)
    echo "$OUT" | jq -e '.ppl >= 5.5 and .ppl <= 7.5'
  if_fails: "Llama-3-8B fp16 perplexity outside [5.5, 7.5] band — model or tokenizer broken"
  evidence_discharged_by:
    classifier_path: crates/aprender-core/src/metrics/perplexity.rs
    sub_claim: "PPL ballpark smoke-test on realistic mean NLL (~1.8 nats) lands in [5.5, 7.5]"
    tests:
    - known_wikitext_ballpark_ppl
    scope: PARTIAL_ALGORITHM_LEVEL
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "BLOCKER-UPSTREAM-MISSING — no stable per-token log-probs extraction path for arbitrary GGUF/APR models in-tree; classifier holds on synthetic inputs but cannot be exercised against live inference until `apr eval --task perplexity --corpus <path>` wiring lands (separate ticket)"

proof_obligations:
- type: invariant
  property: "ppl >= 1.0 and finite (no NaN/Inf)"
- type: invariant
  property: "JSON output emits ppl, mean_nll, num_tokens, log_probs_path keys"
- type: invariant
  property: "ill-formed inputs (empty/NaN/Inf/positive log-prob) produce distinct Outcome variants"
- type: invariant
  property: "ppl monotone in mean NLL (order-preserving under exp)"
- type: invariant
  property: "--log-probs-file CLI flag reaches the classifier layer"

