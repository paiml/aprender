# CRUX-J-16 — OpenCLAW event log / audit trail
# Resolved 2026-04-18: category J competitor = openclaw.ai.

metadata:
  id: CRUX-J-16
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "J — OpenCLAW Agent Orchestration"
  competitor: openclaw
  demand_score: 2
  intake_status: missing
  description: >
    OpenCLAW writes every tool invocation, message receipt, and daemon
    state change to `~/.openclaw/audit.log` (newline-delimited JSON).
    Aprender parity: any long-running `apr` daemon MUST ship a structured,
    append-only event log at a documented $HOME path. Overlaps with
    renacer tracing (distributed tracing feature flag).
  openclaw_interpretation: openclaw-agent-resolved

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5.J'
  - https://openclaw.ai/
  - evidence/crux/openclaw/gaps.md

equations:
  audit_trail:
    formula: |
      audit_log := append_only_file($HOME/.aprender/audit.log)
      emit(event) : audit_log := audit_log ++ [ndjson(event)]
      ∀ event_kind ∈ {tool_call, msg_in, msg_out, daemon_state} : audit_log captures event_kind
      invariant: audit_log is never truncated mid-run (only rotated)
    domain: runtime event stream
    codomain: on-disk append-only log
    invariants:
    - "append-only (no mid-run truncation)"
    - "structured format (NDJSON or equivalent)"
    - "covers all four event kinds above"

falsification_tests:
- id: FALSIFY-CRUX-J-16-001
  rule: apr daemon emits a structured event log
  prediction: "apr serve / renacer docs reference a structured audit / event log"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "audit log structured OR NDJSON event log OR renacer tracing append-only" --limit 1 --format json | grep -q '"matches"' || {
        echo "FAIL: no structured audit-log story documented" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-16 parity broken — apr daemon MUST ship a structured audit log
- id: FALSIFY-CRUX-J-16-002
  rule: audit log path lives under $HOME or a documented state dir
  prediction: "audit log path is documented and user-owned"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "~/.aprender/audit OR XDG_STATE_HOME audit apr" --limit 1 --format json | grep -q '"matches"' || {
        echo "SKIP: audit-log path evidence not yet indexed" >&2
        exit 77
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-16 path invariant — audit log must live under $HOME or documented state dir

proof_obligations:
- type: invariant
  property: "audit log is append-only"
- type: invariant
  property: "audit log covers tool_call / msg_in / msg_out / daemon_state"

verification_summary:
  total_obligations: 2
  proven: 0
  tested: 0
  status: draft

pmat_work_tracking:
  ticket_tag: crux-crux-j-16
  priority: low
  auto_created: true
