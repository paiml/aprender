equations:
  seasonalnaive_is_exactly_the_lag_m_copy:
    formula: |
      forecast[t] == y[t - m] for the whole horizon on a fixture with m=24, byte-equal
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "SeasonalNaive is exactly the lag-m copy"
  autoarima_selects_the_planted_order:
    formula: |
      on a fixture generated from ARIMA(2,1,1) the selected (p,d,q) equals (2,1,1) in >= 9 of 10 seeds
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "AutoARIMA selects the planted order"
  ets_and_theta_match_the_statsforecast_reference:
    formula: |
      point forecasts on the AirPassengers fixture equal the statsforecast reference within 1e-6
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "ETS and Theta match the statsforecast reference"

