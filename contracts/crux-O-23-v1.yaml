  prediction: "forecast[t] == y[t - m] for the whole horizon on a fixture with m=24, byte-equal"
  test: >-
    LIVE-PENDING - SeasonalNaive is exactly the lag-m copy. No test surface exists today because the capability is partial: Local statistical baselines: SeasonalNaive, ETS, Theta, AutoARIMA, Croston (aprender#3393, CRUX-O-23). PROMOTE by authoring a test named seasonal_naive_is_lag_copy in module `forecast/local/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'SeasonalNaive is exactly the lag-m copy' is violated — the autogluon parity claim for CRUX-O-23 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"
