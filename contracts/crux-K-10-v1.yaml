- type: invariant
  property: "No silent drop of optional general.* keys (author, license, url, source.*)"
- type: parity
  property: "apr GGUF metadata round-trip matches llama.cpp gguf-py reader/writer preservation semantics on golden Qwen2.5-Coder-1.5B Q4_K_M fixture"
