contract: aprender-train-distill-cli-surface
metadata:
  kind: pattern
  version: "1.0.0"
  description: >
    ONT-10 binary slice S17: the CLI surface of the `aprender-train-distill` binary (package aprender-train-distill).
    It pins the invariants that `crates/aprender-train-distill/tests/cli_surface_gate.rs`
    enforces against the binary built from HEAD (CARGO_BIN_EXE_aprender-train-distill, never PATH).
    Shape follows contracts/pv-cli-surface-v1.yaml. Defects found by the
    2026-09-26 surface probe: none.
  references:
    - "contracts/pv-cli-surface-v1.yaml"
    - "contracts/apr-mono-binary-rule-v1.yaml"
    - "crates/aprender-train-distill/tests/cli_surface_gate.rs"
equations:
  version_pinned:
    formula: "contains(stdout(aprender-train-distill --version), CARGO_PKG_VERSION(aprender-train-distill))"
    domain: "the binary built from this tree"
    codomain: "{true, false}"
    invariants:
      - "resolved via CARGO_BIN_EXE_aprender-train-distill, which cannot fall back to a stale PATH copy"
  surface_pinned:
    formula: "subcommands(aprender-train-distill --help) \\ {help} = [run, estimate, validate, export]"
    domain: "the Commands: section of --help"
    codomain: "{equal, differs}"
    invariants:
      - "adding or removing a subcommand edits the gate's SUBCOMMANDS list and this formula together"
  advertised_implies_reachable:
    formula: "forall s in subcommands(aprender-train-distill --help) . exit_code(aprender-train-distill s --help) = 0"
    domain: "every subcommand the binary advertises"
    codomain: "{0, non-zero}"
    invariants:
      - "the universe is enumerated from the binary, not hardcoded"
  unknown_subcommand_is_usage_error:
    formula: "exit_code(aprender-train-distill no-such-subcommand) = 2"
    domain: "an argv whose first word is not a subcommand"
    codomain: "{0, 1, 2, other}"
  unusable_input_is_rejected:
    formula: >
      forall (s, i) in rejection_rows . exit_code(aprender-train-distill s i) not in {0, 101}
      and not contains(stderr, "panicked")
    domain: "`validate -c` and `run -c --dry-run` on each of the three unusable inputs; unusable inputs = {missing path, empty file, garbage bytes}"
    codomain: "{rejected, accepted, panicked}"
    invariants:
      - "a panic (101) is not a rejection: it is the crash this row exists to catch"
proof_obligations:
  - id: TDIS-INV-001
    type: invariant
    property: "aprender-train-distill --version reports the version of the crate it was built from"
    formal: "TDIS-VERSION-PINNED"
    applies_to: all
  - id: TDIS-INV-002
    type: invariant
    property: "The advertised subcommand set is the pinned surface"
    formal: "TDIS-SURFACE-PINNED"
    applies_to: all
  - id: TDIS-INV-003
    type: invariant
    property: "Every advertised subcommand is reachable"
    formal: "TDIS-ADVERTISED-REACHABLE"
    applies_to: all
  - id: TDIS-INV-004
    type: invariant
    property: "An unknown subcommand is a usage error (exit 2)"
    formal: "TDIS-UNKNOWN-IS-USAGE"
    applies_to: all
  - id: TDIS-INV-005
    type: invariant
    property: "Input the binary cannot process is rejected with a clean non-zero exit"
    formal: "TDIS-REJECTS-UNUSABLE"
    applies_to: all
falsification_tests:
  - id: FALSIFY-TDIS-001
    rule: "TDIS-VERSION-PINNED"
    prediction: "`aprender-train-distill --version` exits 0 and contains CARGO_PKG_VERSION."
    test_harness: "cargo test -p aprender-train-distill --test cli_surface_gate version_reports_the_crate_version"
    expected_output: "exit 0"
    if_fails: "The binary under test is not the one this tree builds, or --version lost the crate version."
  - id: FALSIFY-TDIS-002
    rule: "TDIS-SURFACE-PINNED"
    prediction: "`aprender-train-distill --help` advertises exactly: run, estimate, validate, export."
    test_harness: "cargo test -p aprender-train-distill --test cli_surface_gate advertised_subcommands_are_the_pinned_surface"
    expected_output: "exit 0"
    if_fails: "A subcommand was added or removed without updating the surface contract."
  - id: FALSIFY-TDIS-003
    rule: "TDIS-ADVERTISED-REACHABLE"
    prediction: "Every advertised subcommand exits 0 for `<cmd> --help`."
    test_harness: "cargo test -p aprender-train-distill --test cli_surface_gate every_advertised_subcommand_is_reachable"
    expected_output: "exit 0"
    if_fails: "A command is advertised but unreachable (the #2527 defect class)."
  - id: FALSIFY-TDIS-004
    rule: "TDIS-UNKNOWN-IS-USAGE"
    prediction: "`aprender-train-distill no-such-subcommand` exits 2."
    test_harness: "cargo test -p aprender-train-distill --test cli_surface_gate unknown_subcommand_is_a_usage_error"
    expected_output: "exit 0"
    if_fails: "The parser accepted an unknown subcommand or mapped a usage error to another code."
  - id: FALSIFY-TDIS-005
    rule: "TDIS-REJECTS-UNUSABLE"
    prediction: "Each rejection row exits non-zero, not 101, with no panic on stderr."
    test_harness: "cargo test -p aprender-train-distill --test cli_surface_gate unusable_input_is_rejected"
    expected_output: "exit 0 on an unmutated tree"
    if_fails: >
      MEASURED 2026-09-26 (aprender-01): 5/5 GREEN on an unmutated tree; no source mutation was run for this binary.
qa_gate:
  id: F-TDIS-001
  name: "aprender-train-distill CLI surface gate (ONT-10 S17)"
  checks:
    - "version_pinned"
    - "surface_pinned"
    - "advertised_implies_reachable"
    - "unknown_subcommand_is_usage_error"
    - "unusable_input_is_rejected"
  pass_criteria: >
    All 5 falsification tests pass via `cargo test -p aprender-train-distill --test cli_surface_gate`.
