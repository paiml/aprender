name: qlora-hyperparameters
version: "1.0.0"
scope: "crates/aprender-train/src/finetune/"

description: |
  QLoRA fine-tuning hyperparameter bounds: rank ∈ [4,256], alpha ∈ [1,512], lr ∈ [1e-6, 1e-3], target modules valid.

equations:
  rank_bounds:
    description: "4 ≤ rank ≤ 256 (power of 2 preferred)"
    formula: "4 ≤ rank ≤ 256 (power of 2 preferred)"

  alpha_scaling:
    description: "alpha/rank ∈ [0.5, 4.0] for stable gradients"
    formula: "alpha/rank ∈ [0.5, 4.0] for stable gradients"

  lr_range:
    description: "1e-6 ≤ learning_rate ≤ 1e-3"
    formula: "1e-6 ≤ learning_rate ≤ 1e-3"

