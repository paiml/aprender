metadata:
  version: "1.0.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  description: "QLoRA hyperparameter validation"
  references:
    - "Provable contract for qlora-hyperparameters-v1"

name: qlora-hyperparameters
version: "1.0.0"
scope: "crates/aprender-train/src/finetune/"

description: |
  QLoRA fine-tuning hyperparameter bounds: rank ∈ [4,256], alpha ∈ [1,512], lr ∈ [1e-6, 1e-3], target modules valid.

equations:
  rank_bounds:
    description: "4 ≤ rank ≤ 256 (power of 2 preferred)"
    formula: "4 ≤ rank ≤ 256 (power of 2 preferred)"

  alpha_scaling:
    description: "alpha/rank ∈ [0.5, 4.0] for stable gradients"
    formula: "alpha/rank ∈ [0.5, 4.0] for stable gradients"

  lr_range:
    description: "1e-6 ≤ learning_rate ≤ 1e-3"
    formula: "1e-6 ≤ learning_rate ≤ 1e-3"

falsification:
  - id: FALSIFY-QLORA_HYPERPARAMETERS_V1_001
    description: "4 ≤ rank ≤ 256 (power of 2 preferred)"
    test: "Related tests in crates/aprender-train/src/finetune/"
    evidence: "cargo test --lib"

  - id: FALSIFY-QLORA_HYPERPARAMETERS_V1_002
    description: "alpha/rank ∈ [0.5, 4.0] for stable gradients"
    test: "Related tests in crates/aprender-train/src/finetune/"
    evidence: "cargo test --lib"

  - id: FALSIFY-QLORA_HYPERPARAMETERS_V1_003
    description: "1e-6 ≤ learning_rate ≤ 1e-3"
    test: "Related tests in crates/aprender-train/src/finetune/"
    evidence: "cargo test --lib"

falsification_tests:
  - id: FALSIFY-QLORA-HYPERPARAMETERS-001
    description: "LoRA rank outside the accepted range is rejected by config validation (validator bound is 1..=1024, wider than the 4..=256 preference)"
    test: "cargo test -p aprender-train --lib test_invalid_lora_rank_too_high"
    prediction: "rank 2000 yields InvalidLoRARank"
    if_fails: "Out-of-range ranks pass validation"
  - id: FALSIFY-QLORA-HYPERPARAMETERS-002
    description: "Non-positive LoRA alpha is rejected; tuner rank is clamped to 4..=64"
    test: "cargo test -p aprender-train --lib test_invalid_lora_alpha"
    prediction: "alpha 0.0 yields InvalidLoRAAlpha"
    if_fails: "Degenerate alpha passes validation"
  - id: FALSIFY-QLORA-HYPERPARAMETERS-003
    description: "Tuner clamps LoRA rank into 4..=64"
    test: "cargo test -p aprender-train --lib test_extract_trial_params_rank_clamping"
    prediction: "rank 0 -> 4 and rank 80 -> 64"
    if_fails: "Tuner proposes ranks outside the bound"
  - id: FALSIFY-QLORA-HYPERPARAMETERS-004
    description: "Non-positive learning rate is rejected (the 1e-6..1e-3 band itself is not enforced by a test)"
    test: "cargo test -p aprender-train --lib test_invalid_learning_rate"
    prediction: "lr 0.0 and -0.1 yield InvalidLearningRate"
    if_fails: "Invalid learning rates pass validation"
