metadata:
  version: 1.0.0
  created: '2026-03-09'
  author: PAIML Engineering
  description: Online softmax — single-pass max+sum via running normalizer (Milakov & Gimelshein 2018)
  references:
  - Milakov & Gimelshein (2018) Online normalizer calculation for softmax
  - Rabe & Staats (2022) Self-attention Does Not Need O(n²) Memory
  depends_on:
  - softmax-kernel-v1.yaml
equations:
  online_normalizer:
    formula: "Online update rule (streaming max + sum_exp):\n  Given running state (m_{i-1}, d_{i-1}) and new score x_i:\n\
      \    m_i = max(m_{i-1}, x_i)\n    d_i = d_{i-1} · exp(m_{i-1} - m_i) + exp(x_i - m_i)\nFinal: softmax(x)_j = exp(x_j\
      \ - m_n) / d_n\n"
    domain: x ∈ ℝ^n, n ≥ 1
    codomain: σ(x) ∈ (0,1)^n, Σ σ(x)_i = 1
    invariants:
    - d_i > 0 for all i (sum of positive exponentials)
    - m_i = max(x_1, ..., x_i)
    - d_i = Σ_{j=1}^{i} exp(x_j - m_i)
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Online_Normalizer
  standard_softmax:
    formula: σ(x)_i = exp(x_i - max(x)) / Σ_j exp(x_j - max(x))
    domain: x ∈ ℝ^n
    codomain: (0,1)^n
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Standard_Softmax
proof_obligations:
- type: loop_invariant
  property: Running max tracks true max of elements seen
  formal: '∀k ≤ i: m_i ≥ x_k ∧ m_i = max(x_1, ..., x_i)'
  applies_to_phase: online_scan
- type: loop_invariant
  property: Running sum_exp is correct partial sum
  formal: d_i = Σ_{j=1}^{i} exp(x_j - m_i)
  applies_to_phase: online_scan
- type: loop_variant
  property: Remaining elements decreases each iteration
  formal: V(state) = n - i, V ≥ 0, V strictly decreasing
  applies_to_phase: online_scan
- type: old_state
  property: Normalizer update preserves equivalence to full recomputation
  formal: d_i = old(d_{i-1}) · exp(old(m_{i-1}) - m_i) + exp(x_i - m_i)
- type: equivalence
  property: Online matches standard softmax
  formal: '|online_softmax(x) - standard_softmax(x)| < ε element-wise'
  tolerance: 1.0e-05
  applies_to: all
- type: invariant
  property: Output sums to 1
  formal: '|Σ σ(x)_i - 1.0| < ε'
  tolerance: 1.0e-06
  applies_to: all
- type: invariant
  property: All outputs strictly positive
  formal: σ(x)_i > 0 for all i
  applies_to: all
- type: monotonicity
  property: Order preservation
  formal: x_i > x_j ⟹ σ(x)_i > σ(x)_j
  applies_to: all
- type: invariant
  property: Shift invariance
  formal: softmax(x + c) = softmax(x) for any scalar c
  applies_to: all
- type: invariant
  property: Two-pass (not three)
  formal: 'Reads scores array exactly twice: once for online max+sum, once for normalize'
  applies_to: all
kernel_structure:
  phases:
  - name: online_scan
    description: Single pass computing running (max, sum_exp) pair
    invariant: 'After processing x_1..x_i: m = max(x_1..x_i), d = Σ exp(x_j - m)'
  - name: normalize
    description: Single pass computing weights[j] = exp(scores[j] - m) / d
    invariant: Each weight computed from final (m, d) state
verification_summary:
  total_obligations: 10
  l2_property_tested: 10
  l3_kani_proved: 10
  l4_lean_proved: 9
  l4_sorry_count: 0
  l4_not_applicable: 1
  honest_level: L4
  lean_file: crates/aprender-contracts-staging/lean/ProvableContracts/Theorems/OnlineSoftmax.lean
  lean_theorems:
  - obligation: Running max tracks true max of elements seen
    theorems:
    - ProvableContracts.OnlineSoftmax.foldl_max_ge
    - ProvableContracts.OnlineSoftmax.foldl_max_mem
    note: >-
      Running max m_i ≥ start and ≥ every element seen (foldl_max_mem), and
      dominates the accumulator (foldl_max_ge); together m_i = max(x_1..x_i).
  - obligation: Running sum_exp is correct partial sum
    theorems:
    - ProvableContracts.OnlineSoftmax.foldl_step_snd
    - ProvableContracts.OnlineSoftmax.scan_denom
    note: >-
      The scan's running denominator equals Σ_{j≤i} exp(x_j − m_i) exactly
      (denom l M), proved by induction over the whole fold.
  - obligation: Remaining elements decreases each iteration
    theorems:
    - ProvableContracts.OnlineSoftmax.loop_variant_decreases
    note: >-
      Variant V(i)=n−i is ≥0 and strictly decreasing while i<n (elementary Nat
      arithmetic); the scan terminates in exactly n steps.
  - obligation: Normalizer update preserves equivalence to full recomputation
    theorems:
    - ProvableContracts.OnlineSoftmax.denom_rescale
    - ProvableContracts.OnlineSoftmax.online_update_denom
    note: >-
      One recurrence step d_i = d_{i-1}·exp(m_{i-1}−m_i)+exp(x_i−m_i) equals the
      full shifted recomputation denom(prefix++[x_i]) m_i, for ALL m_{i-1},m_i.
  - obligation: Online matches standard softmax
    theorems:
    - ProvableContracts.OnlineSoftmax.online_eq_standard
    - ProvableContracts.OnlineSoftmax.softmax_sub_const
    note: >-
      HEADLINE. Over ℝ online == standard EXACTLY (not merely within ε): both the
      online-max and standard-max shifted quotients equal softmax(x)_i, because
      subtracting any constant before exp cancels (softmax_sub_const). The ε=1e-5
      in the obligation is the FP realization of this exact identity (FALSIFY-OSM-001).
  - obligation: Output sums to 1
    theorems:
    - ProvableContracts.OnlineSoftmax.softmax_sum_one
    note: 'Σ_i softmax(x)_i = Z/Z = 1 exactly (Z = Σ exp(x_j) > 0).'
  - obligation: All outputs strictly positive
    theorems:
    - ProvableContracts.OnlineSoftmax.softmax_pos
    - ProvableContracts.OnlineSoftmax.softmax_denom_pos
    note: 'exp(x_i) > 0 and Z > 0 ⟹ softmax(x)_i = exp(x_i)/Z > 0.'
  - obligation: Order preservation
    theorems:
    - ProvableContracts.OnlineSoftmax.softmax_strict_mono
    note: 'x_i > x_j ⟹ softmax(x)_i > softmax(x)_j (shared Z>0, exp strictly monotone).'
  - obligation: Shift invariance
    theorems:
    - ProvableContracts.OnlineSoftmax.softmax_shift_invariant
    note: 'softmax(x+c)=softmax(x): corollary of softmax_sub_const with m=−c.'
  not_applicable_detail:
  - obligation: Two-pass (not three)
    class: genuine-na
    reason: >-
      "Reads scores array exactly twice" is a memory-access / source-structure
      claim about the concrete loop implementation (a (b)-class runtime property,
      analogous to byte-layout or source-syntax), with NO algebraic content over
      ℝ. It is verified by the deterministic falsification test FALSIFY-OSM
      (kernel_structure phases) and the reference impl, not by a Lean theorem.
falsification_tests:
- id: FALSIFY-OSM-001
  rule: Equivalence to standard softmax
  prediction: '|online_softmax(x) - standard_softmax(x)| < 1e-5 element-wise'
  test: proptest with random f32 vectors, lengths 1..4096
  if_fails: Online normalizer update has numerical drift
- id: FALSIFY-OSM-002
  rule: Sum-to-one
  prediction: '|Σ online_softmax(x)_i - 1.0| < 1e-6'
  test: proptest with random vectors including extreme ranges
  if_fails: Normalizer denominator computation error
- id: FALSIFY-OSM-003
  rule: Positivity
  prediction: online_softmax(x)_i > 0 for all i
  test: proptest including vectors with large negative values
  if_fails: Underflow in exp() not handled
- id: FALSIFY-OSM-004
  rule: Shift invariance
  prediction: '|online_softmax(x + c) - online_softmax(x)| < 1e-6'
  test: proptest with random shift c in [-1000, 1000]
  if_fails: Max subtraction not properly applied
- id: FALSIFY-OSM-005
  rule: Decoder attention dimensions
  prediction: Correct for kv_len in {1, 6, 64, 448, 1500}
  test: deterministic test with Whisper self-attn and cross-attn dimensions
  if_fails: Edge case at specific sequence lengths
- id: FALSIFY-OSM-006
  rule: Single-element softmax
  prediction: online_softmax([x]) = [1.0] for any finite x
  test: exact equality test
  if_fails: Base case handling
- id: FALSIFY-OSM-007
  rule: Loop invariant — running max
  prediction: After processing x_1..x_i, m_i = max(x_1..x_i)
  test: Instrument online_scan loop, assert invariant at each step for random vectors
  if_fails: Running max not updated correctly when new element is smaller
- id: FALSIFY-OSM-008
  rule: Loop variant — termination
  prediction: Loop counter advances by exactly 1 per iteration, terminates at n
  test: Verify n - i strictly decreasing and reaches 0
  if_fails: Off-by-one in loop bounds or infinite loop
- id: FALSIFY-OSM-009
  rule: Old state — normalizer update
  prediction: d_i computed from old d_{i-1} matches full recomputation Σ exp(x_j - m_i)
  test: 'proptest: compute d both ways at each step, assert equality within ε'
  if_fails: Normalizer rescaling factor exp(m_{i-1} - m_i) incorrect
- id: FALSIFY-OSM-010
  rule: Loop invariant — partial sum correctness
  prediction: d_i = Σ_{j=1}^{i} exp(x_j - m_i) holds after processing each element
  test: Instrument scan loop, recompute partial sum from scratch at each step
  if_fails: Running sum accumulation diverges from recomputed sum
