qa_gate:
  id: F-ASCL-001
  name: Attention Scaling Contract
  description: Numerical stability and scaling quality gate
  checks:
  - scaled_dot_product
  - variance_preservation
  - softmax_saturation
  - score_bound_with_qknorm
  - attention_entropy
  - numerical_stability
  pass_criteria: All 7 falsification tests pass
  falsification: Remove 1/√d_k scaling to trigger softmax saturation
verification_summary:
  total_obligations: 7
  l2_property_tested: 7
  l3_kani_proved: 0
  l4_lean_proved: 6
  l4_sorry_count: 0
  l4_not_applicable: 0
  # Honest ceiling: 6/7 analytic obligations discharged in verified Lean
  # (crates/aprender-contracts-staging/lean/ProvableContracts/Theorems/Attention/Scaling.lean,
  # zero `sorry`). The 7th obligation, "Scaling prevents saturation"
  # (H(softmax(QKᵀ/√d_k)) > H(softmax(QKᵀ)) for large d_k), is a genuine analytic
  # claim (strict monotonicity of softmax entropy in temperature, dH/dT>0) that is
  # left UNCOVERED (analytic-unproven), NOT marked N/A. Because
  # l4_lean_proved(6) + l4_not_applicable(0) < total(7), the contract honestly
  # remains L3 — a truthful L3, not a manufactured L4.
