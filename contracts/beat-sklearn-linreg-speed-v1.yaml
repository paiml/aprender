contract: beat-sklearn-linreg-speed
metadata:
  kind: beat-benchmark
  version: "1.0.0"
  description: >
    Pillar-1 BEAT benchmark: aprender LinearRegression fit+predict must be
    comfortably FASTER than scikit-learn (LAPACK lstsq) on the same data, same
    host, same run. The beat is gated on the RELATIVE ratio apr_ms/sklearn_ms so
    it is robust to CI-host speed variance (a slow runner slows both sides). Runs
    nightly (needs uv + scikit-learn), not per-PR.
  references:
  - "docs/specifications/campaign-ev-reprioritization-2026-06-12.md"
  - "crates/aprender-core/tests/beat_sklearn_linreg_speed.rs"
  - "crates/aprender-core/src/primitives/matrix.rs"
version: 1
status: enforced
date: 2026-06-13

beat:
  pillar: 1
  incumbent: scikit-learn
  incumbent_pinned: "2026-06-13 via uv run --with scikit-learn (LAPACK lstsq)"
  canonical_task: >
    LinearRegression fit+predict on make_regression(n_samples=200000,
    n_features=20, noise=0.1, seed=42). apr and scikit-learn are timed on the
    SAME generated data, SAME host, SAME run (median of 5 + warmup); the metric
    is the relative ratio apr_ms / sklearn_ms.
  metric: wall_clock_ratio_apr_over_sklearn
  direction: lower_is_better
  baseline_value: 1.0000      # sklearn is the 1.0 reference (apr/sklearn vs itself)
  baseline_floor: 0.5600      # measured apr/sklearn ~0.56 (apr 1.78x faster, commit 34d61a608).
                              # CORROBORATED 2026-07-30 at 200_000x50: 0.519-0.565 over 5 runs
                              # (apr ~1.85x). The test had drifted to 10_000x20, where the ratio
                              # is ~0.26 and the absolute time ~1.2ms - small enough that one
                              # scheduler preemption swung a nightly to 1.044 and failed the gate.
                              # This floor was always the LARGE-workload number.
  beat_threshold: 0.9000      # apr must stay <= 0.90 (>= ~1.11x faster) — large margin vs 0.56
  baseline_sourced_date: "2026-06-13"
  approved_compute: CPU
  ci_gate_name: "beat_sklearn_linreg_speed"

# #7235: falsification tests bound to CI-run tests. The speed ratio itself needs uv +
# scikit-learn and runs only in beat-speed-nightly.yml (#[ignore]): NOT CI evidence.
falsification_tests:
  - id: FALSIFY-BEAT-SKLEARN-LINREG-SPEED-001
    rule: "the LinearRegression fit+predict path being timed is numerically correct (recovers y = 2x + 1 exactly); CPU algorithm-level check only, the apr_ms/sklearn_ms <= beat_threshold claim is nightly-only and is not covered here"
    prediction: "test_simple_regression fails if fit returns wrong coefficients or intercept"
    test: "cargo test -p aprender-core --lib test_simple_regression"
  - id: FALSIFY-BEAT-SKLEARN-LINREG-SPEED-002
    rule: "predict(fit(X, y), X) reproduces y on a multi-feature problem"
    prediction: "test_prediction_invariant fails if predictions drift from the exact linear target"
    test: "cargo test -p aprender-core --lib test_prediction_invariant"
