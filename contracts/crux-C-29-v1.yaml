# CRUX-C-29 — NUMA-aware memory placement

metadata:
  id: CRUX-C-29
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "C — Serving & Chat UX"
  competitor: llama_cpp
  demand_score: 3
  intake_status: missing
  description: >
    NUMA-aware weight/activation placement on multi-socket boxes.
    Canonical: llama.cpp `--numa distribute|isolate|numactl`, or explicit
    `numactl --cpunodebind=0 --membind=0 ...`.

equations:
  numa_binding:
    formula: |
      weights are mmap'd with MPOL_BIND to a single node (no interleave)
      threads are pinned via sched_setaffinity(cpu_set_of(node))
      cross-node memory access count ≈ 0 during decode
      observed decode_tps(--numa isolate) ≥ 1.15 × decode_tps(no binding)
                                             on 2-socket AMD EPYC
    domain: "(policy ∈ {distribute, isolate, numactl}, node: u32)"
    codomain: "bound threads + mbind'd memory regions"
    invariants:
    - "numastat shows near-zero numa_miss + numa_foreign for apr-serve PID under --numa isolate"
    - "--numa on single-socket box is a no-op with warning, never errors"
    - "when libnuma.so missing, --numa falls back + prints actionable install hint"

falsification_tests:
- id: FALSIFY-CRUX-C-29-001
  rule: numastat shows ~0 cross-node misses under --numa isolate
  prediction: "numa_miss count for apr-serve process stays < 1% of numa_hit count"
  test: |
    set -euo pipefail
    nodes=$(numactl --hardware | grep -c 'node [0-9]* size')
    [ "$nodes" -ge 2 ] || { echo "requires multi-node box — skipping"; exit 0; }
    apr serve tests/fixtures/tinyllama-q4_k_m.gguf --port 18181 --numa isolate &
    PID=$!
    trap "kill $PID" EXIT
    sleep 2
    curl -s http://127.0.0.1:18181/v1/completions -d '{"prompt":"hi","max_tokens":128}' >/dev/null
    hit=$(numastat -p "$PID" | awk '/^Total/ {print $2}')
    miss=$(numastat -p "$PID" | awk '/^Total/ {print $3}')
    python3 -c "assert $miss / max($hit,1) < 0.01, 'miss=$miss hit=$hit'"
- id: FALSIFY-CRUX-C-29-002
  rule: single-socket machine emits warning but does not error
  prediction: "on 1-socket host, --numa isolate logs WARN and continues"
  test: |
    set -euo pipefail
    nodes=$(numactl --hardware | grep -c 'node [0-9]* size')
    [ "$nodes" -eq 1 ] || { echo "requires single-socket — skipping"; exit 0; }
    apr serve tests/fixtures/tinyllama-q4_k_m.gguf --port 18182 --numa isolate 2>/tmp/log &
    PID=$!
    trap "kill $PID" EXIT
    sleep 2
    curl -sf http://127.0.0.1:18182/health
    grep -E "WARN.*numa|single.*socket" /tmp/log

proof_obligations:
- type: parity
  property: "apr serve --numa isolate matches llama.cpp `--numa isolate` thread+memory binding"
- type: invariant
  property: "numa_miss / numa_hit < 1% on multi-socket host"
- type: invariant
  property: "single-socket host: warn + continue, never exit nonzero"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

pmat_work_tracking:
  ticket_tag: crux-crux-c-29
