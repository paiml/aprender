# ─────────────────────────────────────────────────────────────
# Equations / invariants
# ─────────────────────────────────────────────────────────────
equations:
  every_story_has_contract:
    formula: |
      ∀ story s in stories[]:
        exists file at contracts/crux-{s.id}-v1.yaml
        AND that file has metadata.status ∈ {draft, enforced}
    domain: stories[] (exactly 250)
    codomain: bool
    invariants:
      - "len(stories) == 250"
      - "No story removed without a deprecation contract amendment"
      - "Story IDs stable after v2.0.0 publish (gaps C-14,F-10,H-04,I-05,K-06 are intentional)"

  coverage_non_regressive:
    formula: |
      count(stories where status == supported) is monotone non-decreasing
      across subsequent master-contract versions.
    domain: master contract version history
    codomain: bool
    invariants:
      - "A story may move ❌→🔨→✅; never ✅→🔨 or ✅→❌ without a defect ticket"

  pmat_work_coverage:
    formula: |
      ∀ story s with s.status == missing:
        exists pmat work ticket t with tag = "crux-{s.id}"
        AND priority(t) == priority_mapping[s.demand_score]
    domain: stories[] where status == missing
    codomain: bool
    invariants:
      - "Every missing story has exactly one pmat work ticket"
      - "When status flips missing → partial/supported, ticket MUST be closed"

  openclaw_interpretation_discipline:
    formula: |
      ∀ s in Category J:
        s.interpretation == pending UNTIL user confirms OpenCLAW identity.
    domain: Category J (CRUX-J-01..CRUX-J-20)
    codomain: bool
    invariants:
      - "Phase 0 completion requires Category J interpretation resolved"

