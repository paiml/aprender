# ─────────────────────────────────────────────────────────────
# Falsification conditions
# ─────────────────────────────────────────────────────────────
falsification:
  - id: FALSIFY-CRUX-001
    condition: "stories[] does not contain exactly 250 entries"
    severity: P0
    check: "yq '.stories | length' contracts/crux-competitive-research-ux-v1.yaml"
    expected: "250"

  - id: FALSIFY-CRUX-002
    condition: "A story references a contract file that does not exist"
    severity: P0
    check: |
      for s in $(yq '.stories[].contract' contracts/crux-competitive-research-ux-v1.yaml); do
        test -f "contracts/$s" || { echo "MISSING: $s"; exit 1; }
      done

  - id: FALSIFY-CRUX-003
    condition: "A story declares status=supported but no golden test exists"
    severity: P0
    check: "apr qa --crux --status supported --require-golden-output"
    expected: "exit 0"

  - id: FALSIFY-CRUX-004
    condition: "Category J has any entry with interpretation != pending before OpenCLAW resolved"
    severity: P1
    check: |
      yq '[.stories[] | select(.id | test("^CRUX-J-")) | .interpretation] | unique' \
        contracts/crux-competitive-research-ux-v1.yaml
    expected: '["pending"]'

  - id: FALSIFY-CRUX-005
    condition: "Coverage regressed: story moved ✅→🔨 or ✅→❌ without a defect ticket"
    severity: P0
    check: |
      git diff HEAD~1 -- contracts/crux-competitive-research-ux-v1.yaml \
        | scripts/check_crux_coverage_monotone.sh

  - id: FALSIFY-CRUX-006
    condition: "OpenAI/Ollama SDK compatibility stories claim supported but SDK tests fail"
    severity: P0
    applies_to: [CRUX-K-01, CRUX-K-02]
    check: |
      uv run --with openai pytest tests/crux/test_openai_sdk.py
      uv run --with ollama pytest tests/crux/test_ollama_sdk.py

  - id: FALSIFY-CRUX-007
    condition: "A status=missing story has no corresponding pmat work ticket"
    severity: P0
    check: |
      for id in $(yq '.stories[] | select(.status=="missing") | .id' \
                    contracts/crux-competitive-research-ux-v1.yaml); do
        pmat work list -t "crux-$id" --status open | grep -q "$id" \
          || { echo "NO PMAT TICKET FOR $id"; exit 1; }
      done

  - id: FALSIFY-CRUX-008
    condition: "pmat work ticket priority mismatches demand_score mapping"
    severity: P1
    check: |
      scripts/check_crux_priority_alignment.sh

  - id: FALSIFY-CRUX-009
    condition: "demand_score not in [1..5] for any story"
    severity: P0
    check: |
      yq '[.stories[].demand_score] | unique' \
        contracts/crux-competitive-research-ux-v1.yaml
    expected: "[2,3,4,5]  (1 permitted if any truly-niche story added later)"

  - id: FALSIFY-CRUX-010
    condition: "Subspec §6 coverage table drifts from stories[] status counts"
    severity: P1
    check: |
      awk '/^\| CRUX-[A-K]-[0-9]+ \|/ { match($0, /\| (✅|🔨|❌|🤔) \|/, a); print a[1] }' \
          docs/specifications/crux-competitive-research-ux-workflows.md \
        | sort | uniq -c \
        | diff - <(yq '.coverage_intake | to_entries | .[] | [.value, .key] | @tsv' \
                     contracts/crux-competitive-research-ux-v1.yaml)

# ─────────────────────────────────────────────────────────────
# pmat work integration (mirrors subspec §12)
# ─────────────────────────────────────────────────────────────
pmat_work:
  priority_mapping:
    5: critical
    4: high
    3: medium
    2: low
    1: low

  bulk_create_command: |
    yq '.stories[] | select(.status == "missing")
        | [.id, .title, .demand_score, .category, .competitor] | @tsv' \
        contracts/crux-competitive-research-ux-v1.yaml |
    while IFS=$'\t' read -r id title score cat competitor; do
      case "$score" in
        5) prio=critical ;;
        4) prio=high ;;
        3) prio=medium ;;
        *) prio=low ;;
      esac
      pmat work add "CRUX gap: $id — $title" \
        -d "Contract: contracts/crux-$id-v1.yaml | Competitor: $competitor" \
        -p "$prio" \
        -t "crux,gap,crux-$cat,competitor-$competitor,crux-$id"
    done

  expected_tickets: 140
  tag_taxonomy:
    per_story: "crux-<ID>"        # unique per story, closes with story
    per_category: "crux-<letter>" # e.g. crux-C for all serving gaps
    per_competitor: "competitor-<name>"
    umbrella: "crux,gap"

  closure_command: "pmat work complete <ticket-id>"
  falsify_command: "pmat work falsify <ticket-id>"
  checkpoint_command: "pmat work checkpoint <ticket-id>"

  ci_trailer_invariant: |
    Every PR that modifies contracts/crux-*.yaml MUST carry a
    CRUX-Work: <ticket-id> trailer in the commit message. Enforced
    by pre-push hook calling `pmat work validate`.

