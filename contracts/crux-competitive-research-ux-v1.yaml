# ─────────────────────────────────────────────────────────────
# Contract: CRUX-001  (Competitive Research UX Workflows)
# ─────────────────────────────────────────────────────────────
# Master registry for the CRUX subspec. Binds 250 sub-contracts
# (crux-{A..K}-{nn}-v1.yaml) under one roof so `pmat comply check`
# can walk the tree, `apr qa --crux` emits per-story PASS/FAIL,
# and `pmat work` tracks every ❌ missing story.
#
# Subspec:  docs/specifications/crux-competitive-research-ux-workflows.md
# Version:  2.0 (expanded 100 → 250 per user request 2026-04-18)
# Parent:   docs/specifications/aprender-monorepo-consolidation.md Rule 7
# Peer:     contracts/apr-cli-commands-v1.yaml
#
# Maintenance rule: THIS FILE AND THE SUBSPEC MOVE AS ONE. Any
# status flip or story addition updates both in the same commit.
# ─────────────────────────────────────────────────────────────

metadata:
  version: "2.0.0"
  created: "2026-04-18"
  updated: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: DRAFT
  subspec: "docs/specifications/crux-competitive-research-ux-workflows.md"
  parent_contracts: []
  description: >
    Registry of 250 user stories derived from root-cause workflow
    analysis of six dominant open-source ML projects. Each story
    has a dedicated sub-contract (crux-{letter}-{nn}-v1.yaml) and
    a demand_score (1..5). Every status=missing story gets a
    pmat work ticket; demand_score maps directly to pmat priority.
  references:
    - "docs/specifications/crux-competitive-research-ux-workflows.md"
    - "contracts/apr-cli-commands-v1.yaml"
    - "https://github.com/ollama/ollama"
    - "https://github.com/ggml-org/llama.cpp"
    - "https://github.com/pytorch/pytorch"
    - "https://github.com/huggingface/transformers"
    - "https://github.com/vllm-project/vllm"
    - "https://github.com/mlfoundations/open_clip"

# ─────────────────────────────────────────────────────────────
# Demand scoring rubric (see subspec §4)
# ─────────────────────────────────────────────────────────────
demand_rubric:
  5: "Canonical verb; README fold; top-20 issue-volume; top-10 bug-label"
  4: "High-traffic verb; common bug-label target"
  3: "Documented power-user feature; moderate volume"
  2: "Niche but real workflow"
  1: "Edge case; included for completeness"

# ─────────────────────────────────────────────────────────────
# Demand → pmat work priority mapping
# ─────────────────────────────────────────────────────────────
priority_mapping:
  5: critical
  4: high
  3: medium
  2: low
  1: low

