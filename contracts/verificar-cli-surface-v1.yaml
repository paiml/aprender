contract: verificar-cli-surface
metadata:
  kind: pattern
  version: "1.0.0"
  description: >
    ONT-10 binary slice S11: the CLI surface of the `verificar` binary (package aprender-verify-ml).
    It pins the invariants that `crates/aprender-verify-ml/tests/cli_surface_gate.rs`
    enforces against the binary built from HEAD (CARGO_BIN_EXE_verificar, never PATH).
    Shape follows contracts/pv-cli-surface-v1.yaml. Defects found by the
    2026-09-26 surface probe: `verificar verify -i <file>` panicked at verificar.rs read_dir expect() (exit 101); `verificar train -i <missing>` wrote a 255-byte placeholder model and exited 0. Fixed: verify requires a directory, train requires an existing input. NOT fixed: train on an existing input still writes a placeholder model (finding a01-ont10-verificar-train-placeholder).
  references:
    - "contracts/pv-cli-surface-v1.yaml"
    - "contracts/apr-mono-binary-rule-v1.yaml"
    - "crates/aprender-verify-ml/tests/cli_surface_gate.rs"
equations:
  version_pinned:
    formula: "contains(stdout(verificar --version), CARGO_PKG_VERSION(aprender-verify-ml))"
    domain: "the binary built from this tree"
    codomain: "{true, false}"
    invariants:
      - "resolved via CARGO_BIN_EXE_verificar, which cannot fall back to a stale PATH copy"
  surface_pinned:
    formula: "subcommands(verificar --help) \\ {help} = [generate, stats, corpus, depyler, verify, train, evaluate, distill, codex, export, mutate]"
    domain: "the Commands: section of --help"
    codomain: "{equal, differs}"
    invariants:
      - "adding or removing a subcommand edits the gate's SUBCOMMANDS list and this formula together"
  advertised_implies_reachable:
    formula: "forall s in subcommands(verificar --help) . exit_code(verificar s --help) = 0"
    domain: "every subcommand the binary advertises"
    codomain: "{0, non-zero}"
    invariants:
      - "the universe is enumerated from the binary, not hardcoded"
  unknown_subcommand_is_usage_error:
    formula: "exit_code(verificar no-such-subcommand) = 2"
    domain: "an argv whose first word is not a subcommand"
    codomain: "{0, 1, 2, other}"
  unusable_input_is_rejected:
    formula: >
      forall (s, i) in rejection_rows . exit_code(verificar s i) not in {0, 101}
      and not contains(stderr, "panicked")
    domain: "`verify -i` on each of the three unusable inputs, and `train -i <missing>`; unusable inputs = {missing path, empty file, garbage bytes}"
    codomain: "{rejected, accepted, panicked}"
    invariants:
      - "a panic (101) is not a rejection: it is the crash this row exists to catch"
proof_obligations:
  - id: VRFS-INV-001
    type: invariant
    property: "verificar --version reports the version of the crate it was built from"
    formal: "VRFS-VERSION-PINNED"
    applies_to: all
  - id: VRFS-INV-002
    type: invariant
    property: "The advertised subcommand set is the pinned surface"
    formal: "VRFS-SURFACE-PINNED"
    applies_to: all
  - id: VRFS-INV-003
    type: invariant
    property: "Every advertised subcommand is reachable"
    formal: "VRFS-ADVERTISED-REACHABLE"
    applies_to: all
  - id: VRFS-INV-004
    type: invariant
    property: "An unknown subcommand is a usage error (exit 2)"
    formal: "VRFS-UNKNOWN-IS-USAGE"
    applies_to: all
  - id: VRFS-INV-005
    type: invariant
    property: "Input the binary cannot process is rejected with a clean non-zero exit"
    formal: "VRFS-REJECTS-UNUSABLE"
    applies_to: all
falsification_tests:
  - id: FALSIFY-VRFS-001
    rule: "VRFS-VERSION-PINNED"
    prediction: "`verificar --version` exits 0 and contains CARGO_PKG_VERSION."
    test_harness: "cargo test -p aprender-verify-ml --test cli_surface_gate version_reports_the_crate_version"
    expected_output: "exit 0"
    if_fails: "The binary under test is not the one this tree builds, or --version lost the crate version."
  - id: FALSIFY-VRFS-002
    rule: "VRFS-SURFACE-PINNED"
    prediction: "`verificar --help` advertises exactly: generate, stats, corpus, depyler, verify, train, evaluate, distill, codex, export, mutate."
    test_harness: "cargo test -p aprender-verify-ml --test cli_surface_gate advertised_subcommands_are_the_pinned_surface"
    expected_output: "exit 0"
    if_fails: "A subcommand was added or removed without updating the surface contract."
  - id: FALSIFY-VRFS-003
    rule: "VRFS-ADVERTISED-REACHABLE"
    prediction: "Every advertised subcommand exits 0 for `<cmd> --help`."
    test_harness: "cargo test -p aprender-verify-ml --test cli_surface_gate every_advertised_subcommand_is_reachable"
    expected_output: "exit 0"
    if_fails: "A command is advertised but unreachable (the #2527 defect class)."
  - id: FALSIFY-VRFS-004
    rule: "VRFS-UNKNOWN-IS-USAGE"
    prediction: "`verificar no-such-subcommand` exits 2."
    test_harness: "cargo test -p aprender-verify-ml --test cli_surface_gate unknown_subcommand_is_a_usage_error"
    expected_output: "exit 0"
    if_fails: "The parser accepted an unknown subcommand or mapped a usage error to another code."
  - id: FALSIFY-VRFS-005
    rule: "VRFS-REJECTS-UNUSABLE"
    prediction: "Each rejection row exits non-zero, not 101, with no panic on stderr."
    test_harness: "cargo test -p aprender-verify-ml --test cli_surface_gate unusable_input_is_rejected"
    expected_output: "exit 0 on an unmutated tree"
    if_fails: >
      MEASURED 2026-09-26 (aprender-01): verify fix reverted -> RED (empty.bin got Some(101)); train guard removed alone -> RED on the train row; restored, 5/5 GREEN.
qa_gate:
  id: F-VRFS-001
  name: "verificar CLI surface gate (ONT-10 S11)"
  checks:
    - "version_pinned"
    - "surface_pinned"
    - "advertised_implies_reachable"
    - "unknown_subcommand_is_usage_error"
    - "unusable_input_is_rejected"
  pass_criteria: >
    All 5 falsification tests pass via `cargo test -p aprender-verify-ml --test cli_surface_gate`.
