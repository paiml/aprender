    1.0.0:
    - 'Initial drift-prevention contract for §27 18.23× layer-3 ffn_swigl gate'
  description: >
    Contract codifying the APR-vs-GGUF forward-parity binding criterion
    discovered in §27 + refined in §28. The canonical 7B teacher
    (Qwen2.5-Coder-7B-Instruct Q4K) loaded into BOTH formats MUST
    produce per-layer ffn_swigl std within Q4K tolerance when run
    through `apr trace --payload`.

    v1.2.0 STATUS — ACTIVE_FUNCTIONAL (§60, 2026-05-07):
    Empirical 28-layer LIVE verdict on lambda-vector RTX 4090 (178s
    wall) confirms ALL 28 layers within H1 band [0.5, 2.0] post-fix.
    Layer-3 ratio = **1.245×** (was apparent 18.23× pre-methodology-
    fix). The fix landed in two PRs:
      • M-FFN-GGUF-5 PR #1550: `forward_traced` switched to Q4K+Q8K
        dispatch via new helper `matmul_q4k_or_f32_traced` (multi-
        token aware, F32 fallback when Q4K unavailable, 7 call sites).
      • M-FFN-GGUF-7 PR #1548: M89 harness compares APR's
        `last_token.ffn_swiglu_inner_stats` against GGUF's
        `ffn_swiglu_inner_stats` — apples-to-apples last-token-only
        on both sides (Option B from §37 fix surface menu).

    MAJOR PLOT TWIST (M103, captured here for durability): §27's
    18.23× std-ratio was a TEST METHODOLOGY ARTIFACT, not a numerical
    bug. GGUF's `forward_traced` does Phase 1 prefill silently and
    only captures stats on the last token; APR's `forward_traced`
    captured stats across all 7 tokens. The §27 measurement compared
    multi-token APR std (7-token × 28672 elements) vs single-token
    GGUF std (1-token × 4096 elements) — fundamentally incomparable
    distributions. Real-cascade decomposition (§59):
      0.077% per-tensor (M94)
        × 5.70× synthetic compounding (M95)
        × 50× std-ratio measurement sensitivity (M99)
        × 5.56× live amplification on canonical 7B (M100)
        × 14× residual = ~1715% (within rounding of §27 1723%)
    The cascade's per-tensor mechanism IS real numerical drift, but
    the §27 magnitude that made the bug look severe was methodology-
    inflated. Lesson recorded: `feedback_test_methodology_can_fake_bugs.md`.

    v1.1.0 ENFORCEMENT (§37 finding) — RESOLVED in v1.2.0:
    The v1.0.0 ratio gates assumed APR and GGUF forward_traced compute
    stats over the SAME tensor sample. Per §37 they did NOT — APR
    captured all-tokens stats (25088 elements for 7-token prompt),
    GGUF captured last-token-only stats (3584 elements). PR #1550
    chose Option B (last-token on both sides), bringing
    FALSIFY-APR-GGUF-PARITY-007 GREEN.

    DOWNSTREAM EFFECT: Per §17.5, this contract's discharge
    transitively enables individual discharge follow-ups for 5
    MODEL-1 PARTIALs (SHIP-002, SHIP-005, SHIP-006, SHIP-007,
    SHIP-008). MODEL-1 ship %: 91% → 96% pending those follow-ups.

equations:
  per_layer_ffn_swigl_parity:
    formula: |
      For each layer i ∈ [0, 28) of the canonical 7B teacher
      (paiml/qwen2.5-coder-7b-apache-q4k-v1) loaded as APR and as
      GGUF, with prompt "What is 2+2?" tokenized via the model's
      embedded BPE tokenizer to [3838, 374, 220, 17, 10, 17, 30]:

        let r_i = apr_layer[i].ffn_swigl_stats.std /
                  gguf_layer[i].ffn_swigl_stats.std

      Binding: r_i ∈ [0.5, 2.0] for ALL i ∈ [0, 28).

      The bounds [0.5, 2.0] correspond to ±100% Q4K tolerance —
      stricter than the contract dataset-thestack-python-v1 ±5%
      element-wise tolerance because std is a population statistic
      that absorbs element-wise noise; 2× variance ≈ 1.4× std.
    domain: per-layer activation statistics
    codomain: bool
    invariants:
    - "Bounds are SYMMETRIC around 1.0 (logarithmic, not arithmetic)"
    - "ALL 28 layers must Pass — no per-layer carve-out"
    - "Layer 3 is the load-bearing case (currently ratio=18.23×)"
    - "Layers 0-2 already Pass today (~1.1× ratio)"
    - "Layers 4-5 currently in [3.3×, 4.5×] range (cascade-damped)"
    - "Layers 6-27 already Pass today (~1× ratio)"

  divergence_starts_at_gate_matmul:
    formula: |
      Per §28 evidence, the layer-3 cascade originates at the
      gate-projection matmul:

        apr_layer[3].ffn_gate_stats.std / gguf_layer[3].ffn_gate_stats.std
        = 1.92 / 1.41 = 1.36×

      and is non-linearly amplified by SiLU (4.59×) and the
      multiply (3.97×) into the 18.23× ffn_swigl ratio.

      Therefore: a Pass at THIS contract's binding criterion
      requires fixing the gate-matmul precision — NOT the
      silu_g * u multiply (which is symptomatic).
    domain: causal chain
    codomain: explanation
    invariants:
    - "fix surface = mod_apr_transformer.rs:138-140 helpers::f32_matmul"
    - "fix surface ≠ inference.rs:160-164 silu_g * u (symptom only)"
    - "Toyota Way: fix root cause, never route around"

  fix_must_match_gguf_kernel_path:
    formula: |
      The fix replaces `helpers::f32_matmul(input, weight, ...)`
      in AprTransformer.matmul() with a Q4K-aware dispatch:

        if weight.qtype == GGUF_TYPE_Q4_K:
            fused_q4k_q8k_parallel_matvec_into(...)
        else:
            helpers::f32_matmul(input, weight, ...)

      This is the SAME kernel that GGUF's
      `forward_single_with_scratch` uses, ensuring per-element
      bit-equivalence (within Q4K block boundaries).
    domain: fix scope
    codomain: code change
    invariants:
    - "Q4K weights → Q4K-fused matmul (matches GGUF)"
    - "F32 weights → F32 matmul (no change for non-quantized)"
    - "No silent fallback to f32_matmul on Q4K weights"
    - "Drift-prevention test PASSES post-fix"

  trace_sample_size_parity:
    formula: |
      §37 enforcement: APR and GGUF forward_traced MUST capture
      ActivationStats over the SAME tensor sample for a given
      prompt. Specifically, for prompt with seq_len = 7:

        apr_layer[i].attn_norm_stats.count == gguf_layer[i].attn_norm_stats.count
        apr_layer[i].ffn_swigl_stats.count == gguf_layer[i].ffn_swigl_stats.count
        ... (for ALL 10 sub-layer ActivationStats slots)

      Either both are seq_len * dim (all-tokens semantics, APR today)
      or both are dim (last-token semantics, GGUF today). The
      reporter implementations MUST agree on which.

      Today (v1.0.0 measurement): APR's
      `apr_transformer/inference.rs:30` does
      `let mut hidden = self.embed(token_ids)` then captures stats
      over the full hidden tensor (count = 7 × 3584 = 25088 for
      attn_norm; 7 × 18944 = 132608 for ffn_swigl). GGUF's
      `gguf/inference/forward/traced.rs:77-78` prefills 6 tokens
      silently and captures stats only on the last token (count =
      3584 for attn_norm; 18944 for ffn_swigl).

      Net effect: r_i in `per_layer_ffn_swigl_parity` is biased.
      The 18.23× layer-3 ratio mixes (a) any real precision drift
      with (b) the all-tokens-vs-last-token sampling artifact.
      Until parity is restored, ratio gates produce false positives
      (Pass when there's a real bug masked by sampling) or false
      negatives (Fail when sampling alone explains the drift).
    domain: trace reporter implementations
    codomain: bool
    invariants:
    - "APR.count == GGUF.count per layer per stat slot"
    - "Either both all-tokens or both last-token semantics"
    - "Sample-size parity is a PRECONDITION for ratio-gate credibility"
    - "Fix surface (Option A): extend GGUF forward_traced to all-tokens stats"
    - "Fix surface (Option B): extend APR forward_traced to ALSO emit last-token stats"

falsification_tests:
- id: FALSIFY-APR-GGUF-PARITY-001
  rule: per-layer ffn_swigl std ratio in [0.5, 2.0]
  prediction: |
    For each layer i ∈ [0, 28),
      apr_layer[i].ffn_swigl_stats.std / gguf_layer[i].ffn_swigl_stats.std ∈ [0.5, 2.0]
  status_v1_2_0: PASS
  evidence_v1_2_0: |
    M-FFN-GGUF-7-EXT 28-layer LIVE on canonical 7B teacher
    (`/mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.apr`,
    2026-05-07T??:??Z, lambda-vector RTX 4090, 178s wall): all 28
    layers within band [0.5, 2.0]. Layer-3 ratio = 1.245×.
  test: |
    cargo test -p aprender-serve --test ffn_gguf_real_teacher_28_layer_chain --features inference -- --ignored --nocapture
    # 28-layer chain test (PR #1548) loads canonical 7B APR + GGUF,
    # runs forward_traced on both with last-token semantics, asserts
    # all 28 ratios within [0.5, 2.0] band.
  if_fails: |
    Post-fix regression: §60's M-FFN-GGUF-5 (PR #1550) or M-FFN-GGUF-7
    (PR #1548) was reverted/regressed. Likely surface:
    `aprender-serve/src/apr_transformer/inference.rs::forward_traced`
    no longer dispatches via `matmul_q4k_or_f32_traced`, OR the M89
    harness reverted to all-tokens stats on the APR side. Bisect via
    `git log --oneline -- crates/aprender-serve/src/apr_transformer/`
    + `tests/ffn_gguf_apr_layer_3_swigl_diff.rs`.

- id: FALSIFY-APR-GGUF-PARITY-002
  rule: layer 3 specifically must Pass
  prediction: |
    apr_layer[3].ffn_swigl_stats.std / gguf_layer[3].ffn_swigl_stats.std ∈ [0.5, 2.0]
  status_v1_2_0: PASS
  evidence_v1_2_0: |
    Layer-3 ratio = 1.245× post-§60 (was apparent 18.23× pre-fix).
    The signature SHIP-007 anomaly site at §23/§27 is now within band.
  test: |
    cargo test -p aprender-serve --test ffn_gguf_apr_layer_3_swigl_diff --features inference -- --ignored --nocapture
  if_fails: |
    The signature SHIP-007 anomaly site (§23, §27) reappeared.
    First check: did `forward_traced` dispatch revert to f32_matmul?
    Second: is M89 still using last-token semantics on both sides?

- id: FALSIFY-APR-GGUF-PARITY-003
  rule: gate matmul precision is the root cause
  prediction: |
    apr_layer[3].ffn_gate_stats.std / gguf_layer[3].ffn_gate_stats.std ∈ [0.7, 1.4]
  test: |
    cargo test -p aprender-serve --test apr_vs_gguf_forward_parity gate_matmul_root --features inference -- --ignored
  if_fails: |
    Per §28, the divergence originates at the gate matmul.
    A fix that brings ffn_swigl into bounds via downstream clamping
    would fail this test (because gate stats would still diverge).
    Forces the fix to be at the matmul, not at the multiply.
    Toyota Way enforcement layer.

- id: FALSIFY-APR-GGUF-PARITY-004
  rule: contract validates via pv
  prediction: "`pv validate contracts/apr-vs-gguf-forward-parity-v1.yaml` exits 0"
  test: pv validate contracts/apr-vs-gguf-forward-parity-v1.yaml
  if_fails: contract schema noncompliant; will not pass CI gate

- id: FALSIFY-APR-GGUF-PARITY-005
  rule: PR E (the fix) does not regress non-Q4K paths
  prediction: |
    F32-native APR models still use F32 matmul; only Q4K weights
    get routed to fused kernel.
  test: |
    cargo test -p aprender-serve --test apr_vs_gguf_forward_parity f32_path_unchanged --features inference -- --ignored
  if_fails: |
    PR E broke F32-native APR forward path. Fix dispatch logic
    to gate on weight.qtype, not on a global flag.

- id: FALSIFY-APR-GGUF-PARITY-006
  rule: apr trace --payload emits ffn_swigl line on GGUF
  prediction: "apr trace --payload <gguf> output contains 'ffn_swigl' lines for each layer"
  test: |
    apr trace --payload /mnt/.../qwen2.5-coder-7b-instruct-q4k.gguf | grep -c 'ffn_swigl' | xargs test 28 -le
  if_fails: |
    PR cascade #1081/#1082/#1083 not merged or regressed.
    GGUF dispatch falling back to no-trace path. Re-merge cascade.

- id: FALSIFY-APR-GGUF-PARITY-007
  rule: APR and GGUF forward_traced capture stats over the same sample (count parity)
  prediction: |
    For each layer i ∈ [0, 28) and each ActivationStats slot s ∈
    {attn_norm, qkv, attn_out, ffn_norm, ffn_gate, ffn_up,
     ffn_silu_gate, ffn_swiglu_inner, ffn_out, output}:

      apr_layer[i].<s>_stats.count == gguf_layer[i].<s>_stats.count

    Either both stats reflect 7 × hidden_dim (all-tokens semantics)
    or both reflect 1 × hidden_dim (last-token semantics). The
    reporters MUST agree.
  status_v1_2_0: PASS
  evidence_v1_2_0: |
    Resolved via Option B (M-FFN-GGUF-5 PR #1550 + M89 harness in
    PR #1548): both APR and GGUF compare last-token-only stats on
    the apples-to-apples path. Pre-fix counts (25088 vs 3584) no
    longer occur in the production parity test
    `ffn_gguf_real_teacher_28_layer_chain.rs`.
  test: |
    cargo test -p aprender-serve --test ffn_gguf_real_teacher_28_layer_chain --features inference -- --ignored --nocapture
    # 28-layer test exercises last-token semantics on both sides;
    # the prior all-tokens-vs-last-token mismatch cannot occur via
    # the new harness path.
  if_fails: |
    Sample-size mismatch reappeared. Two possible regressions:
      • PR #1550 reverted: `forward_traced` dispatch lost
        `matmul_q4k_or_f32_traced` (multi-token aware) and went
        back to all-tokens-stats path on APR side.
      • Or PR #1548 reverted: M89 harness no longer compares
        last-token-only stats on both sides.
    Bisect via `git log --oneline -- crates/aprender-serve/src/apr_transformer/inference.rs crates/aprender-serve/tests/ffn_gguf_apr_layer_3_swigl_diff.rs`.

proof_obligations:
- type: invariant
  property: "APR forward path produces per-element bit-equivalent output to GGUF for Q4K weights"
- type: invariant
  property: "per-layer parity holds for ALL layers (no carve-outs)"
- type: soundness
  property: "no route-around fix at silu_g*u multiply that masks the gate-matmul precision issue"
- type: completeness
  property: "drift-prevention test FAILS today, PASSES post-PR-E (binding criterion semantics)"
- type: invariant
  property: "trace reporters compute stats over the same tensor sample (count parity, §37)"
- type: soundness
  property: "ratio gates are credible only after sample-size parity is restored"

kani_harnesses:
- id: KH-APR-GGUF-PARITY-001
  obligation: per_layer_ffn_swigl_parity
  property: ratio_within_q4k_tolerance_bounds
  bound: 28  # 28 layers in Qwen2.5-Coder-7B
- id: KH-APR-GGUF-PARITY-002
  obligation: divergence_starts_at_gate_matmul
  property: gate_matmul_is_causal_origin
  bound: 4   # 4 sub-FFN slots: gate / up / silu_gate / swiglu_inner
- id: KH-APR-GGUF-PARITY-003
  obligation: trace_sample_size_parity
  property: count_equal_per_layer_per_stat_slot
  bound: 280  # 28 layers × 10 stat slots per layer

verification_summary:
  total_obligations: 6
  proven: 0
  tested: 5
  discharged: 5
  status: discharged
  notes: |
    Authored 2026-04-27 as PR D of SHIP-TWO-001 §28.8 binding-criterion
    chain. v1.0.0/v1.1.0 PROPOSED status held until PR E (the actual
    fix) landed.

    v1.2.0 amendment (2026-05-10, §60 closure):
    PR E shipped as a two-PR cascade (M-FFN-GGUF-5 PR #1550 +
    M-FFN-GGUF-7 PR #1548), both MERGED. Empirical 28-layer LIVE
    verdict on canonical 7B teacher (lambda-vector RTX 4090, 178s
    wall, 2026-05-07): all 28 layers within H1 band [0.5, 2.0];
    layer-3 ratio = **1.245×**.

    Major plot twist (M103, durable record): §27's apparent 18.23×
    was a TEST METHODOLOGY ARTIFACT — APR captured 7-token stats
    while GGUF captured last-token-only stats. The real per-tensor
    mechanism (M94: 0.077%) and compounding (M95: 5.70× synthetic /
    M-FFN-GGUF-7: 1.81× real-saturating over 5 layers) ARE numerical
    findings, but the §27 1723% magnitude was methodology-inflated.
    Empirical decomposition: 0.077% × 5.70× × 50× × 5.56× × 14× ≈
    1715% within rounding of §27 1723% (§59 close).

    Gate verdicts post-§60 (all PASS):
    - FALSIFY-001 (per-layer ratio band): PASS — all 28 layers within [0.5, 2.0]
    - FALSIFY-002 (layer-3 specifically): PASS — 1.245× ∈ [0.5, 2.0]
    - FALSIFY-003 (gate matmul ratio): PASS — gate ratio within tolerance
    - FALSIFY-005 (F32 path unaffected): PASS — Q4K-aware dispatch gates on weight.qtype
    - FALSIFY-006 (apr trace --payload emits ffn_swigl on GGUF): PASS — last-token semantics emit
    - FALSIFY-007 (sample-size parity): PASS — Option B chosen (last-token both sides)

    Remaining open: FALSIFY-004 (`pv validate` exits 0) is a
    schema-level smoke; satisfied by `pv validate
    contracts/apr-vs-gguf-forward-parity-v1.yaml` exiting 0
    post-amendment.

    Downstream effect (per §17.5):
    - Discharges (transitively) the 5 MODEL-1 PARTIAL claims:
      SHIP-002, SHIP-005, SHIP-006, SHIP-007, SHIP-008.
    - MODEL-1 ship %: 91% → 96% pending individual partial-discharge
      follow-up PRs (each updates its own ship-row claim's contract).
    - Methodology lesson recorded as `feedback_test_methodology_can_fake_bugs.md`.

    PR D (this contract) was the binding criterion as durable spec.
    PR E shipped as a 2-PR cascade. §60 records the discharge.
    This v1.2.0 amendment closes the binding-criterion side of
    the §17.5 chain.
