metadata:
  version: 1.0.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: Qwen3.5 end-to-end verification — composing all kernel contracts into
    a complete model proof
  references:
  - Qwen3.5 Technical Report — full model architecture
  - Vaswani et al. (2017) Attention Is All You Need
  - Yang et al. (2024) Gated Delta Networks
  - 'Su et al. (2021) RoFormer: Enhanced Transformer with Rotary Position Embedding'
  depends_on:
  - qwen35-hybrid-forward-v1
  - qwen35-shapes-v1
  - inference-pipeline-v1
  - embedding-algebra-v1
  - sliding-window-attention-v1
  - rope-extrapolation-v1
  - attention-scaling-v1
  - kv-cache-sizing-v1
equations:
  model_parameter_count:
    formula: P = V*d + L*(d_attn + d_ffn + d_norm) + d_final + V*d
    domain: V=vocab, d=hidden, L=layers, d_attn/d_ffn/d_norm=per-layer params;
      the trailing V*d is the untied lm_head (contracts/model-families/qwen3_5.yaml
      constraints.tied_embeddings = false)
    invariants:
    - Total ≈ 9.05B for Qwen3.5-9B
    - Embedding dominates for large V
    - Per-layer cost linear in d^2
    preconditions:
    - 'input.len() > 0'
    - num_layers > 0
    lean_theorem: Theorems.Model_Parameter_Count
  flops_per_token:
    formula: F ≈ 2*P (forward pass) for dense compute
    domain: Approximate FLOPs per token for autoregressive generation
    invariants:
    - Linear in P
    - Attention FLOP component is O(seq_len * d)
    - GDN FLOP component is O(d^2) per token (no quadratic)
    preconditions:
    - 'input.len() > 0'
    - vocab_size > 0
    lean_theorem: Theorems.Flops_Per_Token
  memory_breakdown:
    formula: M = M_weights + M_kv + M_activations
    domain: Total GPU memory during inference
    invariants:
    - M_weights depends on quantization (Q4K < Q6K < F16 < F32)
    - M_kv grows linearly with sequence length
    - M_activations bounded by batch_size * seq_len * d
    preconditions:
    - 'input.len() > 0'
    - num_layers > 0
    lean_theorem: Theorems.Memory_Breakdown
  throughput_model:
    formula: tok/s = min(bandwidth / bytes_per_token, compute / flops_per_token)
    domain: Roofline-limited throughput
    invariants:
    - Memory-bound for small batch (typical inference)
    - Compute-bound for large batch or long prefill
    - GDN layers reduce attention bottleneck
    preconditions:
    - 'input.len() > 0'
    - batch_size > 0
    lean_theorem: Theorems.Throughput_Model
  verification_ladder:
    formula: coverage(contract_set) = verified_obligations / total_obligations
    domain: Fraction of proof obligations with passing tests or Kani proofs
    invariants:
    - coverage ∈ [0, 1]
    - coverage = 1 means all obligations verified
    - 'Each layer adds: attention/GDN + FFN + 2*RMSNorm obligations'
    preconditions:
    - 'input.len() > 0'
    - num_layers > 0
    lean_theorem: Theorems.Verification_Ladder
  contract_composition:
    formula: model_contract = compose(embedding, L × block, final_norm, unembed)
    domain: Full model as composition of verified components
    invariants:
    - Each component independently verified
    - Composition preserves shape invariants
    - Residual stream provides compositional proof structure
    preconditions:
    - indices.iter().all(|&i| i < vocab_size)
    - indices.len() > 0
    lean_theorem: Theorems.Contract_Composition
proof_obligations:
- id: QE2E-INV-001
  type: invariant
  property: Parameter count matches architecture
  formal: P(Qwen3.5-9B) ∈ [9.0B, 9.2B]
  applies_to: all
  note: >-
    #3091: the 9B instantiation is NOT proved, and is not asserted anywhere. This
    contract's own model_parameter_count formula, evaluated on the in-tree
    constants (contracts/model-families/qwen3_5.yaml size_variants.9b: V=248320,
    d=4096, L=32, n_h=16, d_k=256, intermediate_dim=12288, untied lm_head), sums to
    8,208,535,552 = 8.209B -- outside [9.0B, 9.2B]. That descriptor's
    tensor_template states no Gated DeltaNet tensors, so the ~0.8B difference has no
    in-tree shape to come from, and whether the range or the descriptor is wrong is
    open. qe2e_inv_001_parameter_sum_matches_tensor_inventory discharges the
    model_parameter_count EQUATION (the config-derived sum equals the measured
    tensor inventory) on the real Qwen3.5 layer structures; the range instantiation
    stays unproved rather than being widened to fit.
- id: QE2E-BND-002
  type: bound
  property: FLOPs bounded by 2P
  formal: F(s) <= 2*P + 4*L_attn*d_kv*s
  applies_to: all
  note: >-
    ont-delta (#3091): tightened from 'F <= 2 * P + O(seq_len * d * L)'. An O()
    with no constant states no bound at all -- every F satisfies it, so no input
    could falsify the obligation and FALSIFY-QE2E-002 had nothing to assert. The
    constant is now named: s = cached positions, L_attn = full-attention layers
    (a Gated DeltaNet layer carries a fixed-size recurrent state, so its cost does
    not grow with s), d_kv = num_kv_heads * head_dim, and QK^T and A*V each cost
    2*d_kv per cached position per such layer. The slope is asserted as an
    EQUALITY by qe2e_bnd_002_flops_bounded_by_2p_plus_attention_term, so the
    constant cannot be lowered either.
- id: QE2E-ORD-003
  type: ordering
  property: Quantization memory ordering
  formal: n % 256 == 0 → M(Q4K, n) < M(Q6K, n) < M(F16, n) < M(F32, n)
  applies_to: all
  note: >-
    Precondition n % 256 == 0 (n = element count, a whole number of K-quant
    super-blocks). K-quant encoders pad to whole 256-element super-blocks, so
    the unconditional ordering is false for small tensors: one Q6K block is
    210 bytes vs 2n bytes of F16, failing for n <= 105; one Q4K block is 144
    bytes, failing M(Q4K) < M(F16) for n <= 72. At whole super-blocks the
    per-element sizes are 0.5625 < 0.8203 < 2 < 4 bytes.
- id: QE2E-MON-004
  type: monotonicity
  property: Throughput increases with bandwidth
  formal: bw1 < bw2 → tok_s(bw1) <= tok_s(bw2)
  applies_to: all
- id: QE2E-BND-005
  type: bound
  property: Verification coverage at 100%
  formal: coverage(qwen35_contracts) = 1.0
  applies_to: all
- id: QE2E-INV-006
  type: invariant
  property: Compositional proof structure
  formal: '∀l: shape(block_l(x)) = shape(x)'
  applies_to: all
- id: QE2E-CON-007
  type: conservation
  property: 'End-to-end shape: tokens in → logits out'
  formal: shape(model(tokens)) = [seq_len, V]
  tolerance: 0.0
  applies_to: all
falsification_tests:
- id: FALSIFY-QE2E-001
  rule: Parameter count
  prediction: Total params ≈ 9.05B
  test: 'Deterministic: sum all parameter shapes'
  if_fails: Architecture config mismatch
- id: FALSIFY-QE2E-002
  rule: FLOPs estimate
  prediction: 2P FLOPs per forward token
  test: qe2e_bnd_002_flops_bounded_by_2p_plus_attention_term
  if_fails: Missing layer in FLOP count
- id: FALSIFY-QE2E-003
  rule: Memory ordering
  prediction: Q4K < Q6K < F16 < F32 memory
  test: qe2e_ord_003_quantization_memory_ordering
  if_fails: Quantization byte formula wrong
- id: FALSIFY-QE2E-004
  rule: Throughput roofline
  prediction: tok/s bounded by bandwidth and compute
  test: qe2e_mon_004_throughput_is_monotone_in_bandwidth
  if_fails: Roofline formula error
- id: FALSIFY-QE2E-005
  rule: Coverage completeness
  prediction: All obligations have test or proof
  test: pv coverage --binding check
  if_fails: Missing obligation coverage
- id: FALSIFY-QE2E-006
  rule: Compositional proof structure
  prediction: 'Each block preserves shape: shape(block_l(x)) = shape(x)'
  test: qe2e_inv_006_every_block_preserves_d_model
  if_fails: Block l breaks shape invariant
- id: FALSIFY-QE2E-007
  rule: End-to-end shape conservation
  prediction: tokens → [seq_len, d] → ... → [seq_len, V]
  test: qe2e_con_007_tokens_in_logits_out_shape
  if_fails: Shape break in layer composition
kani_harnesses:
- id: KANI-QE2E-001
  obligation: QE2E-INV-001
  property: Parameter count within expected range
  bound: 1
  strategy: exhaustive
  solver: cadical
  harness: verify_parameter_count
- id: KANI-QE2E-002
  obligation: QE2E-ORD-003
  property: Quantization memory ordering
  bound: 4
  strategy: bounded_int
  harness: verify_quant_ordering
- id: KANI-QWEN35-003
  obligation: QE2E-INV-001
  property: Parameter count matches architecture
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-004
  obligation: QE2E-BND-002
  property: FLOPs bounded by 2P
  bound: 8
  strategy: stub_float
- id: KANI-QWEN35-005
  obligation: QE2E-ORD-003
  property: Quantization memory ordering
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-006
  obligation: QE2E-MON-004
  property: Throughput increases with bandwidth
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-007
  obligation: QE2E-BND-005
  property: Verification coverage at 100%
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-008
  obligation: QE2E-INV-006
  property: Compositional proof structure
  bound: 8
  strategy: exhaustive
- id: KANI-QWEN35-009
  obligation: QE2E-CON-007
  property: 'End-to-end shape: tokens in → logits out'
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-QE2E-001
  name: Qwen3.5 End-to-End Verification
  description: Full model verification composition quality gate
  checks:
  - model_parameter_count
  - flops_per_token
  - memory_breakdown
  - throughput_model
  - verification_ladder
  - contract_composition
  pass_criteria: All 7 falsification tests pass + 100% obligation coverage
  falsification: Remove one layer from parameter count to break total
