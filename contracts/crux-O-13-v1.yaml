equations:
  the_student_is_faster_and_within_tolerance_of_the_teacher:
    formula: |
      student pred_time < 0.25 x teacher pred_time AND student validation score >= teacher score - 0.02 on a fixture
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "the student is faster and within tolerance of the teacher"
  augmentation_produces_rows_the_training_set_does_not_contain:
    formula: |
      with augment_method=spunge the student's training set has > n_train rows and the added rows are not row-equal to any original
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "augmentation produces rows the training set does not contain"

falsification_tests:
- id: FALSIFY-CRUX-O-13-001
  rule: "the student is faster and within tolerance of the teacher"
  prediction: "student pred_time < 0.25 x teacher pred_time AND student validation score >= teacher score - 0.02 on a fixture"
  test: >-
    LIVE-PENDING - the student is faster and within tolerance of the teacher. No test surface exists today because the capability is unimplemented: Model distillation: compress the ensemble into one fast student (aprender#3383, CRUX-O-13). PROMOTE by authoring a test named student_faster_within_tolerance in module `automl/distill/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'the student is faster and within tolerance of the teacher' is violated — the autogluon parity claim for CRUX-O-13 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"
- id: FALSIFY-CRUX-O-13-002
  rule: "augmentation produces rows the training set does not contain"
  prediction: "with augment_method=spunge the student's training set has > n_train rows and the added rows are not row-equal to any original"
  test: >-
    LIVE-PENDING - augmentation produces rows the training set does not contain. No test surface exists today because the capability is unimplemented: Model distillation: compress the ensemble into one fast student (aprender#3383, CRUX-O-13). PROMOTE by authoring a test named augmented_rows_are_novel in module `automl/distill/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'augmentation produces rows the training set does not contain' is violated — the autogluon parity claim for CRUX-O-13 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"

proof_obligations:
- type: invariant
  property: "the student is faster and within tolerance of the teacher"
- type: invariant
  property: "augmentation produces rows the training set does not contain"

