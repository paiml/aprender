  description: >
    Model distillation: compress the ensemble into one fast student. Competitor verb: predictor.distill(time_limit=..., augment_method="spunge"). Gap measured in aprender at eb262f8eb: Distillation exists only for LLMs in the training crate (knowledge distillation of transformers); nothing trains a single tabular student on the teacher ensemble's soft labels with data augmentation.
