metadata:
  version: 2.0.0
  created: '2026-04-04'
  author: PAIML Engineering
  description: |
    Chat template correctness contract — template selection, trait completeness,
    thinking mode suppression, architecture-aware dispatch.

    Motivated by PMAT-181 dogfood: three separate template bugs shipped
    (missing trait methods, wrong template for Qwen3, uncached architecture)
    because no contract enforced invariants. All caught by manual dogfood,
    NOT by tests or contracts.

    v2.0.0 (#3755, #3723): a model file's OWN chat template is rendered, never retyped.
    The hand-typed Qwen3 no-think scaffold `<think>\n</think>\n` was not the model's
    (`<think>\n\n</think>\n\n`), and Qwen3.5-0.8B answered 2+2 = "2" with it; v1 pinned
    that literal. v2 asserts the derivation: byte-equality with HF's apply_chat_template
    over the host inventory, thinking capability derived by rendering, thinking OFF by
    default wherever the model allows it (PMAT-181's protection, derived), a refused mode
    named, reasoning kept out of the answer, and limits on an untrusted template.
  references:
  - 'PMAT-181: Qwen3 thinking block loops'
  - 'PMAT-182: apr-cli ChatMLTemplate missing trait methods'
  - 'PMAT-185: AppState cached_architecture was None for GGUF'
  - '#3755: hand-coded Qwen3 no-think scaffold (0.8B answers 2+2="2")'
  - '#3723: thinking toggle, derived capability'
  - '#3724: golden gate judged Qwen3 in a mode production never used'
  depends_on:
  - inference-pipeline-v1
  - special-tokens-registry-v1
equations:
  trait_completeness:
    formula: |
      forall T: impl ChatTemplateEngine =>
        T::format_message is defined
        AND T::format_conversation is defined
        AND T::special_tokens is defined
        AND T::format is defined
        AND T::supports_system_prompt is defined
    domain: All types implementing ChatTemplateEngine trait
    codomain: compile-time guarantee (Rust trait system)
    invariants:
    - Every impl block satisfies all 5 required methods
    - No partial implementations (caught at compile time)
    - Default methods, if any, are semantically correct
    preconditions:
    - Type declares `impl ChatTemplateEngine for T`
    postconditions:
    - Rust compiler rejects incomplete impls
    lean_theorem: Theorems.Trait_Completeness
    notes: |
      PMAT-182 bug: ChatMLTemplate lost 3 methods during mid-edit of
      Qwen3NoThinkTemplate. Rust caught this at compile time, but the
      broken code was committed to the repo. Contract enforcement via
      explicit test prevents regressions if code is feature-gated.
  architecture_aware_selection:
    formula: |
      format_chat_prompt(Some(T_file), _, M, t).text
        == hf_apply_chat_template(T_file.source, M, add_generation_prompt=true,
                                  enable_thinking=modes(T_file).resolve(t))   (byte for byte)

      format_chat_prompt(None, name, M, t).text == format_messages(M, name)   (fallback)
      detect_format_from_name(name) never returns Qwen3NoThink (legacy variant)
    domain: T_file = the GGUF tokenizer.chat_template / sibling tokenizer_config.json chat_template /
      APR metadata; M = messages
    codomain: the prompt text every apr verb sends (run, chat, serve, code, qa)
    invariants:
    - A file that ships a template gets THAT template, rendered in HF's environment (trim/lstrip blocks,
      Python string methods, loop controls, raise_exception, strftime_now, json.dumps-style tojson)
    - No hand-typed think scaffold exists for any family
    - The per-family template is only the fallback for a file with no template
    preconditions:
    - the template compiles and renders a one-message conversation within the limits
    postconditions:
    - the rendered prompt equals the reference rendering of the same template
    lean_theorem: Theorems.Architecture_Aware_Selection
    notes: '#3755: the model ships its template; apr retyped it and got it wrong. Oracle: crates/aprender-serve/tests/fixtures/chat_templates
      (9 templates from 21 inventory GGUFs, 81 renderings by transformers 5.3.0), regenerated by scripts/render_chat_template_reference.py.'
  appstate_architecture_cache:
    formula: |
      forall constructor C that accepts OwnedQuantizedModel:
        C(model, ...).cached_architecture == Some(model.config.architecture)
    domain: AppState construction with GGUF model
    codomain: cached_architecture ∈ Option<String>
    invariants:
    - cached_architecture is NEVER None when a quantized model is loaded
    - Architecture string matches GGUF general.architecture metadata
    - Cache is populated at construction time (not lazy)
    preconditions:
    - quantized_model.config.architecture is non-empty
    postconditions:
    - state.model_architecture() returns Some(arch) immediately
    lean_theorem: Theorems.AppState_Architecture_Cache
    notes: |
      PMAT-185 root cause: with_quantized_model_and_vocab() set
      cached_architecture: None. model_architecture() fell through
      to RwLock-guarded model access, sometimes returning None on
      first request. Chat template detection got no hint, defaulted
      to Raw/ChatML instead of Qwen3NoThink.
  thinking_block_suppression:
    formula: |
      split(completion) = (reasoning, answer): reasoning runs to </think> from the block the prompt
      opened (Qwen3.5 ON) or the completion opened (Qwen3); a block still open at the end is an
      error naming the token budget; with thinking OFF by default a Qwen3 answer carries no reasoning
    domain: Model completions
    codomain: (Option<reasoning>, answer) or an unclosed-block error
    invariants:
    - The answer never contains the reasoning (message.reasoning_content / delta.reasoning_content / --json
      reasoning carry it)
    - An unclosed think block is never returned as an empty answer (#3720)
    preconditions:
    - the ChatPrompt the completion was generated from
    postconditions:
    - answer has no <think> block
    lean_theorem: Theorems.Thinking_Block_Suppression
  format_conversation_determinism:
    formula: |
      forall template T, messages M:
        T.format_conversation(M) == T.format_conversation(M)
    domain: Any ChatTemplateEngine impl, any message sequence
    codomain: Formatted prompt string
    invariants:
    - Same inputs always produce same output
    - No internal state mutation between calls
    - Thread-safe (Send + Sync required by trait bound)
    preconditions:
    - messages.len() >= 0
    postconditions:
    - Output is deterministic and reproducible
  thinking_modes_derivation:
    formula: |
      modes(T) = Both     if render(T, enable_thinking=true) != render(T, enable_thinking=false)
              = OnOnly   else if render(T) leaves a <think> block open
              = OffOnly  otherwise
      resolve(None) = OFF where modes(T) allows it, else ON;  resolve(t) refused if !modes(T).allows(t)
    domain: T = a model file's own chat template
    codomain: ThinkingModes and the resolved mode
    invariants:
    - Derived by rendering, never by searching for <think> markers (Qwen3-30B-A3B-Instruct-2507 has markers
      and no mode)
    - A refused mode is an error naming what the template offers (apr exit 15, HTTP 422), never silently
      mapped
    - 'One function: apr run/chat/code/serve and the release gate (#3712) call ThinkingModes'
    preconditions:
    - T renders
    postconditions:
    - the mode used is the resolved one
    lean_theorem: Theorems.Thinking_Modes_Derivation
  untrusted_template_limits:
    formula: |
      render(T) refused if steps > EMBEDDED_TEMPLATE_FUEL (5e6) or output > EMBEDDED_TEMPLATE_MAX_OUTPUT (4 MiB)
      or recursion > MAX_RECURSION_DEPTH
    domain: A GGUF template is untrusted input (downloaded from the internet)
    codomain: a rendered prompt, or a refusal naming the limit
    invariants:
    - A looping, recursing or output-flooding template is refused by name, never hangs
    - 'Residual (as in jinja2''s sandbox): one expression such as ''x'' * 10**12 allocates before any
      limit applies'
    preconditions:
    - none
    postconditions:
    - render terminates
    lean_theorem: Theorems.Untrusted_Template_Limits
proof_obligations:
- id: CT7C0E-INV-001
  type: invariant
  property: 'Qwen3 does not think unless asked: its default prompt is its OWN thinking-off rendering'
  formal: modes(T)==Both ==> format_chat_prompt(Some(T),_,M,None).text == hf_apply_chat_template(T,M,enable_thinking=false)
  applies_to: architecture_aware_selection
- id: CT7C0E-INV-002
  type: invariant
  property: AppState always caches GGUF architecture
  formal: with_quantized_model_and_vocab(m, v).cached_architecture.is_some()
  applies_to: appstate_architecture_cache
- id: CT7C0E-INV-003
  type: invariant
  property: the answer never carries the reasoning; an unclosed block is an error
  formal: split(c).answer does not contain <think>; open block at end ==> Err(budget)
  applies_to: thinking_block_suppression
- id: CT7C0E-INV-004
  type: invariant
  property: format_conversation is pure
  formal: '∀ T, M: T.format_conversation(M) == T.format_conversation(M)'
  applies_to: format_conversation_determinism
- id: CT7C0E-INV-005
  type: invariant
  property: embedded rendering is byte-equal to HF apply_chat_template
  formal: 'forall (T,M,t) in inventory fixtures: EmbeddedChatTemplate::new(T).render(M,true,t) == reference'
  applies_to: architecture_aware_selection
- id: CT7C0E-INV-006
  type: invariant
  property: thinking capability is derived by rendering; an unhonourable mode is refused
  formal: modes(T) as defined; !modes(T).allows(t) ==> resolve(Some(t)) is Err(ThinkingModeUnsupported)
  applies_to: thinking_modes_derivation
- id: CT7C0E-INV-007
  type: invariant
  property: an untrusted template cannot hang or flood a render
  formal: steps <= 5e6 && output <= 4 MiB, else Err naming the limit
  applies_to: untrusted_template_limits
enforcement:
  qwen3_template_selection:
    description: A Qwen3/Qwen3.5 model's default prompt is its own thinking-off rendering; no hand-typed
      scaffold
    check: contract_tests::FALSIFY-CT-001
    severity: ERROR
  architecture_cache_populated:
    description: GGUF AppState constructors must cache architecture
    check: contract_tests::FALSIFY-CT-002
    severity: ERROR
  thinking_block_clean:
    description: No thinking blocks in stripped output
    check: contract_tests::FALSIFY-CT-003
    severity: ERROR
  template_determinism:
    description: Same messages produce same prompt
    check: contract_tests::FALSIFY-CT-004
    severity: ERROR
  template_trait_coverage:
    description: All ChatTemplateEngine impls have all methods
    check: contract_tests::FALSIFY-CT-005
    severity: ERROR
  embedded_byte_equality:
    description: Embedded rendering byte-equal to HF over the inventory fixtures
    check: chat_template_embedded_oracle::FALSIFY-CT-007
    severity: ERROR
  thinking_modes:
    description: Derived capability; unhonourable mode refused
    check: contract_tests::FALSIFY-CT-006
    severity: ERROR
  untrusted_template_limits:
    description: Fuel, output cap, recursion limit
    check: chat_template_embedded_limits::FALSIFY-CT-008
    severity: ERROR
falsification_tests:
- id: FALSIFY-CT-001
  rule: Qwen3 default is the model's own thinking-off prompt
  prediction: format_chat_prompt(Some(T), _, [user], None) equals the HF thinking-off rendering for every
    qwen3/qwen35 inventory template, ending with the model's <think>\n\n</think>\n\n
  test: |
    falsify_ct_001_qwen3_default_is_the_models_own_no_think_prompt
    falsify_ct_001_no_template_fallback_types_no_scaffold
    MUTANT: restore the hand-typed `<think>\n</think>\n` scaffold as the qwen3 default -> RED (byte mismatch at the scaffold)
  file: src/chat_template_contract_tests.rs
  if_fails: 'Qwen3 thinks by default, or gets a prompt that is not its own (0.8B: 2+2 = "2")'
- id: FALSIFY-CT-002
  rule: AppState architecture cache
  prediction: with_quantized_model_and_vocab populates cached_architecture
  test: |
    let model = create_test_quantized_model("qwen3");
    let state = AppState::with_quantized_model_and_vocab(model, vocab).unwrap();
    assert_eq!(state.model_architecture(), Some("qwen3".to_string()));
  file: src/api/mod_app_state_gpu.rs
  if_fails: Architecture not cached, template auto-detection falls back to wrong default
- id: FALSIFY-CT-003
  rule: Thinking block suppression
  prediction: strip_thinking_blocks removes all think tags
  test: |
    assert_eq!(strip_thinking_blocks("</think>\n\n4"), "4");
    assert_eq!(strip_thinking_blocks("<think>reasoning</think>answer"), "answer");
    assert_eq!(strip_thinking_blocks("</think></think></think>"), "");
    assert_eq!(strip_thinking_blocks("clean text"), "clean text");
    assert!(!strip_thinking_blocks("<think>x</think>y</think>z").contains("</think>"));
  file: src/agent/driver/apr_serve.rs
  if_fails: Think tags leak into user-visible output, corrupting responses
- id: FALSIFY-CT-004
  rule: Template determinism
  prediction: Same messages produce identical prompts
  test: |
    falsify_ct_004_embedded_template_deterministic
    falsify_ct_004_chatml_deterministic
  file: src/chat_template_contract_tests.rs
  if_fails: Non-deterministic prompts cause inconsistent model behavior
- id: FALSIFY-CT-005
  rule: Template trait coverage
  prediction: All template impls satisfy ChatTemplateEngine
  test: |
    // Compile-time check — these lines fail to compile if any impl is incomplete
    let templates: Vec<Box<dyn ChatTemplateEngine>> = vec![
        Box::new(ChatMLTemplate::new()),
        Box::new(Llama2Template::new()),
        Box::new(ZephyrTemplate::new()),
        Box::new(MistralTemplate::new()),
        Box::new(PhiTemplate::new()),
        Box::new(AlpacaTemplate::new()),
        Box::new(RawTemplate::new()),
    ];
    for t in &templates {
        let _ = t.format();
        let _ = t.supports_system_prompt();
        let _ = t.special_tokens();
    }
  file: src/chat_template.rs
  if_fails: Incomplete trait impl causes runtime panic on unsupported template method
- id: FALSIFY-CT-006
  rule: Both thinking modes are the model's own renderings; an unhonourable mode is refused
  prediction: Qwen3-8B ON and OFF prompts equal the HF renderings; ON on Qwen3-30B-A3B-Instruct-2507 and
    on a template-less file is ThinkingModeUnsupported
  test: |
    falsify_ct_006_both_modes_rendered_and_unhonourable_refused
    thinking_modes_are_derived_by_rendering
    on_only_template_and_resolution
  file: src/chat_template_contract_tests.rs
  if_fails: Thinking silently ignored or mapped to the wrong mode
- id: FALSIFY-CT-007
  rule: Embedded rendering is byte-equal to HF apply_chat_template
  prediction: 81/81 inventory renderings (9 templates x 3 conversations x thinking on/off/unset) reproduced
    byte for byte
  test: |
    embedded_rendering_is_byte_equal_to_hf
    tojson_writes_what_python_writes
  file: src/chat_template_embedded_oracle.rs
  if_fails: 'apr''s prompt is not the model''s (the #3755 class)'
- id: FALSIFY-CT-008
  rule: An untrusted template is refused, never hangs
  prediction: a looping, recursing or 1 GB-output template fails to load, naming the limit
  test: |
    looping_template_is_refused_not_hung
    huge_output_is_refused_not_allocated
    recursive_template_is_refused
    raise_exception_carries_the_templates_message
  file: src/chat_template_embedded_oracle.rs
  if_fails: a hostile GGUF hangs or OOMs apr serve
kani_harnesses:
- id: KANI-CT-001
  obligation: No hand-typed think scaffold
  property: detect_format_from_name never returns Qwen3NoThink (legacy variant)
  bound: 8
  strategy: exhaustive
