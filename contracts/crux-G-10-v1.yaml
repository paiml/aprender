# CRUX-G-10 — Org-scoped publish permissions

metadata:
  id: CRUX-G-10
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "G — Format Conversion"
  competitor: huggingface
  demand_score: 3
  intake_status: partial
  description: >
    Check org-scoped token permissions before uploading, with actionable error
    on missing write scope. Canonical: HF `whoami()` returns `auth.orgs[*].role`;
    HF `create_repo(repo_id='org/name')` fails with 403 if token lacks write.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/huggingface/trl
  - arXiv:2305.18290 — DPO
equations:
  org_scope_check:
    formula: |
      owner, name = split(repo, '/')
      whoami = HF GET /api/whoami-v2  (auth=token)
      allowed = (owner == whoami.name)
             OR (owner ∈ {o.name : o in whoami.orgs AND o.role ∈ {write, admin}})
      if not allowed: fail_fast("token missing write on {owner}")
    domain: "(repo: String, token: String)"
    codomain: "bool (allowed) + actionable stderr on mismatch"
    invariants:
    - "personal-repo upload with user token succeeds"
    - "org-repo upload with read-only token rejected before any bytes uploaded"
    - "error message names the missing role (read|write|admin)"

falsification_tests:
- id: FALSIFY-CRUX-G-10-001
  rule: read-only token on org repo rejected pre-upload
  prediction: "apr publish --repo org/x --token read-only exits non-zero BEFORE network upload"
  test: |
    set -euo pipefail
    HF_TOKEN=read_only_fixture ! apr publish tests/fixtures/tinyllama-hf \
      --repo testorg/x --dry-run 2>/tmp/err
    grep -E "write.*role|read-only|403" /tmp/err
  if_fails: rule 'read-only token on org repo rejected pre-upload' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-G-10-002
  rule: personal-repo upload with user token OK
  prediction: "same user's repo accepts upload; exit=0"
  test: |
    set -euo pipefail
    HF_TOKEN=$HF_TOKEN apr publish tests/fixtures/tinyllama-hf \
      --repo $(apr whoami --format json | jq -r .username)/test-tmp --dry-run
  if_fails: rule 'personal-repo upload with user token OK' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-G-10-003
  rule: permission check happens before any file upload
  prediction: "strace shows no POST /commit before whoami check fails"
  test: |
    set -euo pipefail
    HF_TOKEN=bad_token strace -f -e trace=connect apr publish \
      tests/fixtures/tinyllama-hf --repo org/x --dry-run 2>/tmp/strace || true
    # whoami must complete before any large-upload attempt
    ! grep -E "POST.*commit|POST.*upload" /tmp/strace

  if_fails: rule 'permission check happens before any file upload' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr org-scope check matches HF whoami-v2 + create_repo 403 semantics"
- type: invariant
  property: "permission mismatch fails before first data-plane byte"
- type: invariant
  property: "error names the specific missing role"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

