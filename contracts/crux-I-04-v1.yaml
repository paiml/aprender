# CRUX-I-04 — Ollama /api/chat function calling

metadata:
  id: CRUX-I-04
  version: "1.1.0"
  created: "2026-04-18"
  updated: "2026-04-22"
  author: PAIML Engineering
  registry: true
  status: partial
  kind: kernel
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "I — Observability & Metrics"
  competitor: ollama
  demand_score: 5
  intake_status: partial
  description: >
    Ollama /api/chat function calling. Non-streaming responses that carry tool
    calls MUST satisfy: `message.tool_calls` is a non-empty JSON array, each
    element has `function.name` (string) and `function.arguments` (JSON object,
    NOT a stringified JSON blob). Every called tool name MUST appear in the
    request's declared `tools[*].function.name` set (no model hallucinations).
    For streaming, `tool_calls` MUST appear atomically in the single terminator
    `done == true` frame and NOT in any non-terminator frame.

    v1.1.0: ships CRUX-SHIP-001 retrofit — `apr ollama-tools-lint
    --response-file FILE [--request-file FILE] [--stream]` dispatches pure
    classifiers (36 unit tests) over any captured /api/chat tool-call response
    (16 e2e tests). Live `/api/chat` handler with `tools[]` support in
    aprender-serve remains the only path still PARTIAL_ALGORITHM_LEVEL under
    BLOCKER-UPSTREAM-MISSING.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - 'https://github.com/ollama/ollama/blob/main/docs/api.md#generate-a-chat-completion'
  - 'https://platform.openai.com/docs/guides/function-calling'

equations:
  tool_call_response_schema:
    formula: |
      Competitor reference (Ollama /api/chat with tools):
        POST /api/chat { model, messages, tools: [ OpenAIToolSchema ] }
        → { message: { role: "assistant",
                       content: string,
                       tool_calls: [ { function: { name: string,
                                                   arguments: object } } ] },
            done: bool, ... }

      Aprender equivalent (apr serve --ollama-compat --port 11434):
        same wire schema. Given a tools[] array containing a function
        `get_weather` with JSON-schema parameters { location: string, unit: enum },
        and a user turn that demands its invocation, response MUST satisfy:

          response.message.tool_calls           : array, length >= 1
          response.message.tool_calls[0].function.name      == "get_weather"
          response.message.tool_calls[0].function.arguments : object
          json_schema_validate(arguments, tools[0].function.parameters) == true
    domain: HTTP POST /api/chat with `tools` param on apr serve --ollama-compat
    codomain: JSON response body with message.tool_calls[]
    invariants:
    - "response.message.tool_calls is an array when the model elects to call a tool"
    - "tool_calls[i].function.name is one of the declared tool names"
    - "tool_calls[i].function.arguments is a JSON object (not a stringified JSON)"
    - "arguments validates against the declared tool parameter JSON schema"

  streaming_tool_call_terminator:
    formula: |
      When stream=true, NDJSON chunks are emitted; exactly one chunk carries
      `done: true`, and if the turn produced any tool_calls they MUST appear in
      that final chunk under message.tool_calls[]. Earlier chunks MAY carry
      incremental text content but MUST NOT split a single tool_call across
      chunks.

        exists exactly one k* with chunks[k*].done == true
        for all k != k*: chunks[k].message.tool_calls is absent or empty
        chunks[k*].message.tool_calls == final aggregated tool_calls
    domain: streamed /api/chat response NDJSON
    codomain: ordered sequence of chunks
    invariants:
    - "Exactly one chunk has done=true (terminator uniqueness)"
    - "All tool_calls appear atomically in the terminator chunk"
    - "Non-terminator chunks do not contain tool_calls"

falsification_tests:
- id: FALSIFY-CRUX-I-04-001
  rule: tool_calls produced for forcing prompt
  prediction: "posting a weather-tool schema + a user question that demands it yields message.tool_calls[0].function.name == 'get_weather'"
  test: |
    set -euo pipefail
    RESP=$(curl -sS http://127.0.0.1:11434/api/chat -H 'content-type: application/json' \
      --data @evidence/crux/ollama/tool-call-weather-request.json)
    echo "$RESP" | jq -e '.message.tool_calls[0].function.name == "get_weather"' >/dev/null
  if_fails: "apr serve --ollama-compat did not emit tool_calls[0].function.name == get_weather"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/ollama_tool_call_classifier.rs
    cli_path: crates/apr-cli/src/commands/ollama_tools_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_i_04.rs
    sub_claim: |
      Algorithm-level necessary conditions on an already-parsed non-streaming
      /api/chat tool-call response:
        (a) top-level is a JSON object (else `NotAnObject`);
        (b) `message` exists and is a JSON object (else `MissingMessage` /
            `MessageNotAnObject`);
        (c) `message.tool_calls` is a non-empty JSON array (else
            `MissingToolCalls` / `ToolCallsNotAnArray` / `ToolCallsEmpty`);
        (d) each call is an object with `function.name: string` (else
            `ToolCallNotAnObject` / `MissingFunction` / `FunctionNotAnObject`
            / `FunctionNameNotAString`).
      Classifier is a pure function of the parsed response; deterministic.
      CLI surface: `apr ollama-tools-lint --response-file FILE` dispatches
      the classifier end-to-end over a captured non-streaming response.
    tests:
    - schema_ok_on_well_formed_tool_call
    - schema_rejects_non_object_top_level
    - schema_rejects_missing_message
    - schema_rejects_non_object_message
    - schema_rejects_missing_tool_calls
    - schema_rejects_tool_calls_not_array
    - schema_rejects_empty_tool_calls
    - schema_rejects_non_object_tool_call
    - schema_rejects_missing_function
    - schema_rejects_function_not_object
    - schema_rejects_missing_function_name
    - schema_rejects_non_string_function_name
    - schema_classifier_is_deterministic
    - falsify_crux_i_04_non_streaming_accepts_well_formed_tool_call
    - falsify_crux_i_04_rejects_missing_function_name
    - falsify_crux_i_04_rejects_empty_tool_calls_array
    scope: "(parsed_json_response) → ToolCallSchemaOutcome (pure) + CLI e2e over captured response"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "live /api/chat handler in aprender-serve emitting tool_calls[] when tools[] is declared in the request"

- id: FALSIFY-CRUX-I-04-002
  rule: arguments is a JSON object matching declared schema
  prediction: "tool_calls[0].function.arguments parses as object and validates against tools[0].function.parameters"
  test: |
    set -euo pipefail
    RESP=$(curl -sS http://127.0.0.1:11434/api/chat -H 'content-type: application/json' \
      --data @evidence/crux/ollama/tool-call-weather-request.json)
    # arguments must be an object (NOT a stringified JSON blob)
    echo "$RESP" | jq -e '.message.tool_calls[0].function.arguments | type == "object"' >/dev/null
    # must contain the required `location` field per the declared schema
    echo "$RESP" | jq -e '.message.tool_calls[0].function.arguments.location | type == "string"' >/dev/null
    # TODO: once apr bundles a JSON-schema validator in tests, cross-check args
    # against tools[0].function.parameters instead of spot-checking `location`.
  if_fails: "tool call arguments not a JSON object or missing required field from declared schema"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/ollama_tool_call_classifier.rs
    cli_path: crates/apr-cli/src/commands/ollama_tools_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_i_04.rs
    sub_claim: |
      Algorithm-level necessary condition on the tool-call argument shape:
        (a) `function.arguments` is present (else `MissingFunctionArguments`);
        (b) `function.arguments` is NOT a string — the canonical OpenAI/Ollama
            drift bug where `arguments` arrives as a stringified JSON blob
            instead of a first-class object (else `FunctionArgumentsIsString`);
        (c) `function.arguments` is a JSON object (else
            `FunctionArgumentsNotAnObject`).
      Pure; deterministic. The classifier rejects stringified-arguments even
      though the content may be "JSON-parseable" — strict schema validation
      downstream requires a first-class object. JSON-schema validation of
      arguments against the declared tool parameters remains part of the
      live-handler discharge (still PARTIAL here).
    tests:
    - schema_rejects_missing_arguments
    - schema_rejects_stringified_arguments
    - schema_rejects_non_object_non_string_arguments
    - schema_reports_second_call_violations
    - falsify_crux_i_04_rejects_stringified_arguments
    scope: "(parsed_json_response) → ToolCallSchemaOutcome (pure) + CLI e2e"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "live /api/chat handler emitting object-typed arguments + bundled JSON-schema validator cross-checking arguments against declared tools[].function.parameters"

- id: FALSIFY-CRUX-I-04-003
  rule: streamed tool_calls arrive in the done=true chunk
  prediction: "stream=true: exactly one chunk has done=true, and that chunk carries the tool_calls"
  test: |
    set -euo pipefail
    CHUNKS=$(curl -sS -N http://127.0.0.1:11434/api/chat -H 'content-type: application/json' \
      --data @evidence/crux/ollama/tool-call-weather-request-stream.json)
    # count terminators
    DONE=$(echo "$CHUNKS" | jq -cr 'select(.done == true)' | wc -l)
    [ "$DONE" -eq 1 ] || { echo "expected exactly 1 done=true chunk, got $DONE"; exit 1; }
    # tool_calls must appear in the terminator chunk
    echo "$CHUNKS" | jq -e 'select(.done == true) | .message.tool_calls[0].function.name == "get_weather"' >/dev/null
    # and MUST NOT appear in any non-terminator chunk
    NONTERM=$(echo "$CHUNKS" | jq -cr 'select(.done != true) | .message.tool_calls // empty' | wc -l)
    [ "$NONTERM" -eq 0 ]
  if_fails: "streamed tool_calls split across chunks or terminator did not carry tool_calls"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/ollama_tool_call_classifier.rs
    cli_path: crates/apr-cli/src/commands/ollama_tools_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_i_04.rs
    sub_claim: |
      Algorithm-level necessary conditions on an already-parsed ordered NDJSON
      frame list for streaming tool calls:
        (a) frame list is non-empty (else `NoFrames`);
        (b) every frame is a JSON object with a boolean `done` field (else
            `FrameNotAnObject` / `MissingDoneField` / `DoneNotBool`);
        (c) exactly the last frame has `done == true` (else `EarlyDoneFrame`
            / `NoTerminalFrame`);
        (d) no non-terminator frame carries a non-empty `message.tool_calls[]`
            (else `ToolCallsInNonTerminatorFrame`) — the atomicity invariant.
      Pure; deterministic. CLI surface reads captured NDJSON and dispatches
      the classifier end-to-end.
    tests:
    - ndjson_ok_on_single_terminator_with_tool_calls
    - ndjson_ok_on_terminator_only
    - ndjson_ok_when_no_tool_calls_anywhere
    - ndjson_rejects_empty
    - ndjson_rejects_non_object_frame
    - ndjson_rejects_missing_done
    - ndjson_rejects_non_bool_done
    - ndjson_rejects_early_done_true
    - ndjson_rejects_missing_terminator
    - ndjson_rejects_tool_calls_in_non_terminator
    - ndjson_allows_empty_tool_calls_array_in_non_terminator
    - ndjson_classifier_is_deterministic
    - falsify_crux_i_04_stream_accepts_well_formed_tool_call_ndjson
    - falsify_crux_i_04_stream_rejects_tool_calls_in_non_terminator
    - falsify_crux_i_04_stream_rejects_early_done_true
    - falsify_crux_i_04_stream_rejects_missing_terminator
    - falsify_crux_i_04_stream_rejects_empty_file
    scope: "(ordered_ndjson_frames) → StreamingToolCallOutcome (pure) + CLI e2e over captured NDJSON"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "live /api/chat handler emitting application/x-ndjson stream with tool_calls atomically delivered in the terminal done=true frame"

- id: FALSIFY-CRUX-I-04-004
  rule: wire-schema parity with Ollama
  prediction: "apr serve --ollama-compat response is indistinguishable from upstream ollama for the same request"
  test: |
    set -euo pipefail
    # golden captured with: ollama serve && curl /api/chat ... > golden.json
    GOLDEN=evidence/crux/ollama/tool-call-weather-response.golden.json
    RESP=$(curl -sS http://127.0.0.1:11434/api/chat -H 'content-type: application/json' \
      --data @evidence/crux/ollama/tool-call-weather-request.json)
    # Compare structural keys only (not generated content), to avoid flakes on sampled text
    diff <(echo "$RESP"  | jq -S 'paths | join(".")' | sort -u) \
         <(jq -S 'paths | join(".")' "$GOLDEN" | sort -u)
  if_fails: "response schema diverges from Ollama golden (missing or extra fields)"
  discharge_status: BLOCKER_UPSTREAM_MISSING
  blocked_on: "live apr serve --ollama-compat emitting /api/chat with tool_calls + an Ollama-captured golden fixture to diff against"

- id: FALSIFY-CRUX-I-04-005
  rule: tool name must be one of declared tools
  prediction: "every tool_calls[i].function.name is a member of the request's tools[*].function.name set"
  test: |
    set -euo pipefail
    REQ=evidence/crux/ollama/tool-call-weather-request.json
    RESP=$(curl -sS http://127.0.0.1:11434/api/chat -H 'content-type: application/json' --data @"$REQ")
    DECLARED=$(jq -cr '.tools[].function.name' "$REQ" | sort -u)
    CALLED=$(echo "$RESP" | jq -cr '.message.tool_calls[]?.function.name' | sort -u)
    # every called name must appear in declared
    for name in $CALLED; do
      grep -Fxq "$name" <(echo "$DECLARED") || { echo "hallucinated tool: $name"; exit 1; }
    done
  if_fails: "model invented a tool name not in the declared tools[] array"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/ollama_tool_call_classifier.rs
    cli_path: crates/apr-cli/src/commands/ollama_tools_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_i_04.rs
    sub_claim: |
      Allowlist gate: given the captured request's `tools[*].function.name`
      set and the captured response's `message.tool_calls[]`, every called
      name MUST be a member of the declared set (else
      `HallucinatedToolName{index, name}`). When the request declares no
      tools but the response carries tool calls, the response is rejected
      with `NoDeclaredTools`. When neither side has tools, the outcome is
      `Ok`. Pure; deterministic. CLI surface reads both files and reports
      the allowlist verdict in the JSON report.
    tests:
    - allowlist_ok_when_called_name_matches_declared
    - allowlist_rejects_hallucinated_name
    - allowlist_flags_no_declared_tools_when_calls_present
    - allowlist_ok_when_no_declared_and_no_calls
    - allowlist_ok_when_no_tool_calls_present
    - allowlist_reports_second_call_hallucination
    - allowlist_classifier_is_deterministic
    - falsify_crux_i_04_allowlist_accepts_declared_tool
    - falsify_crux_i_04_allowlist_rejects_hallucinated_tool
    - falsify_crux_i_04_without_request_file_flags_no_declared_tools
    scope: "(parsed_request, parsed_response) → ToolNameAllowlistOutcome (pure) + CLI e2e"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "live /api/chat handler emitting tool_calls against a real tools[] request so the allowlist can be checked end-to-end on a live server"

proof_obligations:
- type: invariant
  property: "response.message.tool_calls is an array when the model elects to call a tool"
- type: invariant
  property: "tool_calls[i].function.name ∈ declared tools[*].function.name"
- type: invariant
  property: "tool_calls[i].function.arguments is a JSON object, not a string"
- type: invariant
  property: "arguments validate against declared tool parameter JSON schema"
- type: invariant
  property: "streamed tool_calls appear atomically in the unique done=true chunk"

