equations:
  zero_shot_output_matches_a_pinned_reference:
    formula: |
      a pinned small checkpoint pulled by `apr pull` forecasts the committed fixture within 1e-3 of the reference quantiles
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "zero-shot output matches a pinned reference"
  fine_tuning_changes_the_weights_and_improves_the_in_domain_m:
    formula: |
      after fine_tune on the fixture the WQL improves by >= 5% relative AND at least one weight tensor differs from the pulled checkpoint
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "fine-tuning changes the weights and improves the in-domain metric"

