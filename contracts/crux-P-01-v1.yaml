falsification_tests:
- id: FALSIFY-CRUX-P-01-001
  obligation: CRUX-P-01-OB-01
  rule: kl measured with one tool
  prediction: an arm scored by a different llama.cpp build or corpus sha is refused, not averaged in
  if_fails: 'the C1 claim ''kl measured with one tool'' is unproven (owed EXT-27 #4409; planned: the EXT-27
    fixture binds FALSIFY-CRUX-P-01-001)'
- id: FALSIFY-CRUX-P-01-002
  obligation: CRUX-P-01-OB-02
  rule: gap blocks only when it widens
  prediction: one tensor re-quantized to Q2_K widens the gap and turns the gate RED; an unchanged artifact
    stays GREEN
  if_fails: 'the C1 claim ''gap blocks only when it widens'' is unproven (owed EXT-27 #4409; planned:
    the EXT-27 fixture binds FALSIFY-CRUX-P-01-002)'
