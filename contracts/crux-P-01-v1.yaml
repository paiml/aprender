equations:
  kl_measured_with_one_tool:
    formula: Every arm, ours included, is scored by the same pinned llama.cpp build on the same committed
      corpus
    domain: EXT-001 C1 arms on pinned revisions
    codomain: PASS iff the property holds; the planted failure turns it RED
