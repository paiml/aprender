    - Every arm, ours included, is scored by the same pinned llama.cpp build on the same committed corpus
  gap_blocks_only_when_it_widens:
    formula: The gate compares our gap to our previous release's gap on the same pins, never to an absolute
      floor
    domain: EXT-001 C1 arms on pinned revisions
