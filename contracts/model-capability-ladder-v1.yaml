falsification_tests:
  - id: FALSIFY-MCL-001
    rule: "Runner and gate exist and are executable"
    prediction: "both scripts are regular files with the execute bit"
    test: "test -x scripts/model_ladder.sh && test -x scripts/check_model_ladder.sh"
    if_fails: "the ladder is a document, not a gate"
  - id: FALSIFY-MCL-002
    rule: "The gate is declared to the dogfood"
    prediction: "Cargo.toml [package.metadata.dogfood] gates names scripts/check_model_ladder.sh"
    test: "grep -q 'scripts/check_model_ladder.sh' Cargo.toml"
    if_fails: "a gate no runner calls is a facility with a self-test and no caller"
  - id: FALSIFY-MCL-003
    rule: "The gate discriminates — its case table runs and every case lands on its expected exit"
    prediction: "check_model_ladder.sh --self-test exits 0 and reports >= 6 cases (green, red-golden, red-fallback, red-capability, stale-version, vacuous-empty)"
    test: "bash scripts/check_model_ladder.sh --self-test"
    if_fails: "a validator that has only seen valid input is indistinguishable from exit 0"
  - id: FALSIFY-MCL-004
    rule: "Skipped is not passed"
    prediction: "a receipt whose golden_output gate is skipped:true, passed:true is RED"
    test: "bash scripts/check_model_ladder.sh --self-test --case red-skipped-is-not-passed"
    if_fails: "`apr qa --json` marks skipped gates passed:true; a reader that trusts `passed` alone passes a model that was never generated from"
  - id: FALSIFY-MCL-005
    rule: "Fallback is red even when tokens are right"
    prediction: "a receipt with backends.cuda.fallback=true and golden_output passed is RED"
    test: "bash scripts/check_model_ladder.sh --self-test --case red-fallback"
    if_fails: "the parity guard's CPU fallback produces correct text; a text-only check certifies a GPU path that never ran"
  - id: FALSIFY-MCL-006
    rule: "The runner never reads $? through a pipe and never invokes a bare apr"
    prediction: "model_ladder.sh sources scripts/apr_bin.sh and has no `| … ; rc=$?` shape"
    test: "grep -q 'scripts/apr_bin.sh' scripts/model_ladder.sh && ! grep -E '\\|[^|]*; *rc=\\$\\?' scripts/model_ladder.sh"
    if_fails: "two release gates in this repo could never fail for exactly this reason (#2336, #2360)"
  - id: FALSIFY-MCL-007
    rule: "The ladder at origin/main is a floor"
    prediction: "removing a rung present at origin/main makes the gate exit 1 with 'DROPPED'"
    test: "bash scripts/check_model_ladder.sh --self-test --case red-dropped-rung"
    if_fails: "any state the author writes and the gate reads can be moved in the same commit"
  - id: FALSIFY-MCL-008
    rule: "Contract validates"
    prediction: "pv validate accepts this file"
    test: "pv validate contracts/model-capability-ladder-v1.yaml"
    if_fails: "schema drift"
  - id: FALSIFY-MCL-009
    rule: "A rung that lists hosts: is a claim only there"
    prediction: "a rung with hosts: [gx10] absent from lambda's receipt is skip, not FAIL (case green-rung-listed-one-host, rc 0); the same rung absent from gx10's receipt is FAIL (case red-listed-host-absent, rc 1)"
    test: "bash scripts/check_model_ladder.sh --self-test --case green-rung-listed-one-host && bash scripts/check_model_ladder.sh --self-test --case red-listed-host-absent"
    if_fails: "a size that fits one host could never be required anywhere, or would be required where it cannot load"
  - id: FALSIFY-MCL-010
    rule: "hosts: is a floor like rungs and backends"
    prediction: "narrowing a rung from every host at origin/main to hosts: [gx10] makes the gate exit 1 with 'hosts DROPPED'"
    test: "bash scripts/check_model_ladder.sh --self-test --case red-dropped-host-on-rung"
    if_fails: "a required (rung, host) pair could be dropped by adding a key instead of removing one"
  - id: FALSIFY-MCL-011
    rule: "A Q4_K rung cannot be made optional or CPU-only"
    prediction: "`required: false` on a Q4_K rung exits 1 naming the rung (case red-q4k-required-false); a Q4_K rung with backends [cpu] exits 1 (case red-q4k-rung-cpu-only)"
    test: "bash scripts/check_model_ladder.sh --self-test --case red-q4k-required-false && bash scripts/check_model_ladder.sh --self-test --case red-q4k-rung-cpu-only"
    if_fails: "the 0.69.0 hold: qwen3-8b-q4km was required: false, so an empty-output CUDA model was a note, not a failure"
  - id: FALSIFY-MCL-012
    rule: "An inventory model missing from the run is named"
    prediction: "a receipt whose inventory lists a file with no present row exits 1 with 'is MISSING from the run' naming the file (case red-inventory-model-missing)"
    test: "bash scripts/check_model_ladder.sh --self-test --case red-inventory-model-missing"
    if_fails: "the universe is the list again: a model the host holds is never measured"
  - id: FALSIFY-MCL-013
    rule: "An inventory model beyond the ladder is judged on CUDA like a rung"
    prediction: "an inventory-only row whose golden_output is skipped, or whose cuda fell back, exits 1 naming inv:<file> (cases red-inventory-model-golden-skipped, red-inventory-model-fell-back); green on cuda exits 0 (case green-inventory-beyond-ladder)"
    test: "bash scripts/check_model_ladder.sh --self-test --case red-inventory-model-golden-skipped && bash scripts/check_model_ladder.sh --self-test --case red-inventory-model-fell-back && bash scripts/check_model_ladder.sh --self-test --case green-inventory-beyond-ladder"
    if_fails: "an unlisted model is recorded but never judged — present is not green"
  - id: FALSIFY-MCL-014
    rule: "A receipt without a measured inventory is not evidence"
    prediction: "a v1 receipt (no inventory) exits 1; an empty inventory exits 1; a ladder with no inventory block exits 1 (cases red-receipt-v1-no-inventory, red-inventory-empty, red-ladder-without-inventory)"
    test: "bash scripts/check_model_ladder.sh --self-test --case red-receipt-v1-no-inventory && bash scripts/check_model_ladder.sh --self-test --case red-inventory-empty && bash scripts/check_model_ladder.sh --self-test --case red-ladder-without-inventory"
    if_fails: "absence scored as conformance: a host that listed nothing proved nothing and passed"
  - id: FALSIFY-MCL-015
    rule: "Every GPU apr call runs under the fleet lock, choom'd to 1000, with a bounded wait"
    prediction: "check_model_ladder.sh --self-test: model_ladder.sh makes no \"$APR\" <subcommand> call outside apr_locked; a fake apr called through --lock-probe sees the lock held and oom_score_adj 1000; a lock held elsewhere declines with exit 2 naming the holder's pid; four producer mutants (raw call, no flock, no choom, no -w) are each killed. The real run is RED when the audit finds a raw call"
    test: "bash scripts/check_model_ladder.sh --self-test"
    if_fails: "a ladder run on gx10's unified memory OOM-kills the CI pool (15:56:08Z, 18 kills in 10 s) or hangs a release on a stuck lock"

  - id: FALSIFY-MCL-016
    rule: "Cells: verbs x thinking x context rung, derived and proved"
    prediction: "check_model_ladder.sh --self-test: green-cells passes (20 owed on lambda, 12 pass, 8 honest refusals); a missing cell, a duplicate row, a fallback, a thinking block that never closed, a prompt under its rung, an empty answer, a co-tenant refusal, an OOM instead of a refusal, a rung that passes nowhere, thinking_modes that disagree with the template, a missing context_length (#3733), no cells, a consumer without a number, a missing context-rungs file, a dropped cells block or verb, a rung id or consumer dropped from context-rungs.json vs origin/main, an arch with no held representative, and a pass where the declared arithmetic says the cell cannot fit (the arithmetic decides what is owed, so it must be right) are each RED naming it; 11 module mutants are each killed by their case"
    test: "bash scripts/check_model_ladder.sh --self-test"
    if_fails: "a release dogfoods one verb at one short prompt with thinking off and calls the model family working"

qa_gate:
  id: F-MCL-001
  name: Model Capability Ladder
  description: "T-2 pre-publish: every required rung green on every required host, per receipt"
  checks:
    - receipts_present_per_required_host
    - receipt_version_matches_cut
    - required_rungs_present_and_green
    - claimed_backends_ran_without_fallback
    - ladder_not_shrunk_vs_origin_main
    - q4k_rungs_required_and_claim_cuda
    - every_inventory_model_measured_and_green_on_cuda
  pass_criteria: "check_model_ladder.sh exits 0 with executed >= 1 and a non-empty measured inventory on every required host"
  falsification: "plant a receipt with cuda.fallback=true → exit 1"
