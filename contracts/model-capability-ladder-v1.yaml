      required: true
      note: "hybrid Gated DeltaNet, dense FFN — #3510 (operator 2026-09-19: every dense size through 27B is a 0.68.2 requirement). RED by construction until the per-size CPU reference and the #3090 device path pass apr qa Golden Output on both hosts"
    - id: qwen35-9b-q4km
