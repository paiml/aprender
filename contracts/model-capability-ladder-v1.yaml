metadata:
  version: 1.0.0
  created: '2026-09-18'
  author: PAIML Engineering
  description: "Model capability ladder — the pre-release proof that every model ARCHITECTURE a release claims to support actually produces correct output on every backend it claims, on every silicon class the fleet ships for. One rung per (architecture, quant); each rung is measured by `apr qa` (capability_match + golden_output on CPU and GPU) plus the `apr run --gpu` fallback line, per host, and the per-host receipt is what T-2 reads. Born from the 0.68.1 finding (EPIC #3477): dense Qwen3 on CUDA diverged at position 1 (argmax 25 != 198) on sm_89 AND GB10, the parity guard silently fell back to CPU, `apr qa` was the only surface that said so, and no release step ran `apr qa` on a Qwen3 — the dogfood picks `find ~/models | head -1` and checks that a command printed something."
  kind: pattern
  references:
    - "scripts/model_ladder.sh — per-host runner, writes evidence/dogfood/models/<version>/<host>.json"
    - "scripts/check_model_ladder.sh — the declared dogfood gate (Cargo.toml [package.metadata.dogfood]) that reads every required host's receipt"
    - "docs/specifications/APR-RELEASE-001-train-and-build-kaizen.md §4 T-2 — the row this contract discharges"
    - "paiml/aprender#3477 (EPIC 0.68.2 — measured matrix, contract gaps, SHACL rows)"
    - "paiml/aprender#3413 (dense Qwen3 GPU divergence — the rung this ladder is RED on today)"
    - "paiml/aprender#3432 (second refusal site — `apr qa` capability_match red on qwen35 while `apr run` serves it)"
    - "contracts/apr-cpu-vs-gpu-output-parity-v1.yaml (per-inference parity guard; this ladder is its release-time consumer)"
    - "contracts/qwen-story-v1.yaml (the narrative ladder 0.5B → 30B-MoE; it has no dense-Qwen3 rung and no per-backend golden check)"
  tags:
    - dogfood
    - release-gate
    - model-support
    - gpu-parity
    - qwen3

five_whys:
  symptom: "Alfredo: 'it doesn't work'. Dense Qwen3 `--gpu` on 0.68.1 produces garbage on CUDA on both fleet GPUs and silently runs on CPU; `apr qa` names it (Golden Output FAIL) while the same run's Throughput and GPU-Speedup gates PASS on the garbage path."
  why_1: "No release step runs `apr qa` on a dense Qwen3, or on any model per architecture: the dogfood grid takes ONE model (`find ~/models | head -1`) and its check is `| head -1 && echo OK` — that a command printed a line."
  why_2: "The per-inference parity guard is designed to hide the failure from the user (CPU fallback), so the only observable is a warning line nobody greps for and a qa gate nobody runs."
  why_3: "The contracts that cover this surface were proved against the wrong object: qk-norm-v1 FALSIFY-QKN-006 compares CPU to a 'GPU reference simulation', KANI-QK_NOR-008 is a Kani harness for a CUDA kernel, apr-cpu-vs-gpu-output-parity-v1 has no qa_gate, qwen3-e2e-verification-v1 self-declares coverage = 1.0."
  why_4: "The support claim lives in prose (README, book, #3077's table-to-be) and evidence/models/supported.yaml is a citation index with no arch, backend or receipt column (#3369)."
  why_5: "There was no unit of release evidence at the granularity 'this ARCHITECTURE on this BACKEND on this SILICON' — the unit was 'a model ran' or 'a kernel test passed'."
  root_cause: "Capability was asserted per binary, never measured per (architecture, backend, silicon). The ladder makes that triple the unit of evidence and the receipt the thing T-2 reads."

# ONT-4c1 (ONT-001 v4.6 §3.7): the rungs below are the corpus's `gguf` entities — one `model:Model` focus node per
# rung, keyed by `sha256`, resolved to the tracked receipts under evidence/dogfood/models/ by `pv lint --gate shapes`.
# Class-level (no `ref`): the GGUF files live on hosts, the rungs are what the tree knows about them.
entity:
  type: gguf

# THE LADDER. One rung per (family, arch, quant). `required: true` rungs must be
# present and green on every required host before T-2 is green (a rung may
# carry `hosts: [..]` to claim only the hosts whose memory holds it — #3510:
# 122B-A10B fits GB10's unified memory and no 24 GB card); an absent
# required rung on a host is a FAIL for that host, not a SKIP (a host that does
# not hold the model has not measured it). `backends` is what the RELEASE claims
# for that arch; a claimed backend that falls back is RED.
# sha256 pins the exact file: a rung measured on a different file is a different
# measurement (Q5_K taught us three readers can each invent a layout).
#
# #3712 (operator 2026-09-21: "you must ensure all models Q4_K CUDA work; the end";
# publishing with "most working" is a "p0 tire fire"):
#   * NO Q4_K rung is optional. `required: false` on a Q4_K rung is refused by the
#     gate, and so is a Q4_K rung whose `backends` does not claim cuda.
#   * The universe is what each host HOLDS, not this list. `inventory` names where
#     and what to look for; scripts/model_ladder.sh measures every match on the host
#     (on `inventory.backends`) and writes the list into the receipt (schema v2).
#     An inventory model missing from the run, or not green on CUDA, is a FAIL
#     naming it. A rung is still how a model gets a pinned sha256 and a host list.
ladder:
  hosts:
    - { id: lambda, isa: x86_64, gpu: "RTX 4090", cc: sm_89,  required: true }
    - { id: gx10,   isa: aarch64, gpu: "GB10",     cc: sm_121, required: true }
  # #3943 (b), cop ruling 2026-09-23: the `serve` probe waits on the SERVER, not a clock.
  # It waits while the process is alive AND making progress (serve log growing, or the
  # process tree's CPU time growing). A load quiet on both for stall_s is HUNG -> RED.
  # ceiling_s is the one hard bound on the whole wait, for every rung. A process that
  # dies mid-load is RED at once. The old fixed 90 s was shorter than a 27B load on
  # gx10 (the server reached "listening" after the probe had given up), so stall_s keeps
  # the old number as a window of NO PROGRESS instead of a total.
  serve_health:
    stall_s: 90
    ceiling_s: 900
  inventory:
    # #3957 F2: `apr_sha_drift` (#3940) is DELETED. It declared, in prose no code read, that
    # receipts measured at 9b7739951 stood for the cut 28c24207a. check_model_ladder.sh now
    # binds every receipt to the cut by `apr_sha` (equal, or equal-tree outside evidence/)
    # and refuses this key by name, so a delta is re-measured, never declared.
    dirs: ["~/models", "~/.apr/models", "~/.cache/apr/models"]   # depth 1, the fleet's model dirs
    # WIDENED 2026-09-22 by operator ruling: "don't leave behind. if it fits on this machine
    # and/or gx10 with CUDA we must support for Qwen 3.5 and 2.5. we kick the MoE work to later".
    # MEASURED before the change: 28 models held on lambda, 18 swept, 10 INVISIBLE TO EVERY GATE,
    # because the universe was a filename glob over q4_k/q4k only. That is #3712's own defect in a
    # new form -- it replaced a hand-picked list with a glob, which has the same omission property,
    # moved from a human decision to a string match nobody reviews (#3846). Escapees included
    # Qwen3-Coder-30B-A3B-Instruct-Q4_0 (a Q4 quant `*q4_k*` does not match) and
    # Qwen3.5-35B-A3B-UD-IQ4_XS (a 35B Qwen3.5 no gate had ever loaded). The two `.apr` files
    # escaped in PRINCIPLE rather than by accident: an .apr filename need not carry its
    # quantisation at all, so a name-based universe cannot see them. The durable fix is to derive
    # the universe from the file HEADER, which `apr inspect --json` already reports (#3846); these
    # four patterns close the 2.5/3.5 hole now. Adds 7 measurable models (0.34-7.11 GB: IQ2_XXS,
    # IQ3_M, IQ4_XS x2, f16, and both .apr) plus one deferred MoE.
    patterns: ["*q4_k*.gguf", "*q4k*.gguf", "*q4_k*.apr", "*q4k*.apr",
               "*qwen2.5*.gguf", "*qwen3.5*.gguf", "*qwen2.5*.apr", "*qwen3.5*.apr"]   # case-insensitive
    # DEFERRED, per the same ruling's "we kick the MoE work to later". A match is printed DEFERRED
    # and NEVER counted green: this build has no CUDA forward for qwen3moe at all (#3714), so an
    # A3B model owes cells no code can satisfy. This is a DECLARED deferral carrying a reason, not
    # an exemption -- an inventory model that fails and is not named here is still refused, which
    # the case table proves. Delete this key when #3714 lands.
    # EMPTY. The last deferral, "*A3B*", is RETIRED with this fold: the qwen3moe CUDA forward
    # (#3714 R2, PMAT-3714-r2-on-v2@6f6fa9a83) is folded into 0.69.1 on the operator ruling of
    # 2026-09-23, relayed verbatim by aprender-6a (cop): "fold in MoE". An A3B model now owes
    # every cell like any other rung, and #3817 (run --gpu silently falling back to CPU) must be
    # shown fixed by the envelope, not assumed from parity.
    deferred: {}
      # THE THREE FILENAME DEFERRALS DECLARED HERE ON 2026-09-23 ARE RETIRED.
      # Operator doctrine, same day, verbatim: "no defer; from now forward we practice
      # toyota way and oracle approach of crux with capabiltiy report style from Alfredo".
      # A capability is ORACLE-PROVEN or it is RED; there is no third state, so
      # "the model runs but tensor_contract cannot inspect it" is RED and the work is the
      # missing IQ dequantizer in aprender-core (#3850), not a declaration. Stop the line.
      #   retired: Qwen2.5-0.5B-Instruct-IQ3_M.gguf
      #            Qwen2.5-0.5B-Instruct-IQ4_XS.gguf
      #            Qwen3.5-4B-UD-Q4_K_XL.gguf
      # *A3B* was the one deferral kept past that doctrine, as an explicit operator ruling of
      # 2026-09-22 ("we kick the MoE work to later"). It is retired by the ruling of 2026-09-23
      # above, which makes #3714 a 0.69.1 requirement.
    # #3957 F9/F10: NAMED RED verdicts. Unlike `deferred`, they are not declarations. Each one is
    # a claim about CAUSE that check_model_ladder.sh admits only when THIS sweep re-proves it
    # (scripts/lib/model_ladder_redmodel.py); otherwise the row is plain FAIL and blocks. A proven
    # cell prints RED-MODEL / RED-UNSUPPORTED, is never counted green, and does not block. A key
    # matching no held file, or matching a green row, is refused.
    #
    # F9, operator ruling 2026-09-23 on #3957 (verbatim): "proceed with (a)". The FILE is
    # defective, as proven each sweep by llama.cpp on the identical GGUF (the CRUX greedy rows),
    # a positive control on the sibling, and apr CPU == GPU. Covers thinking ON only.
    red_model:
      Qwen3.5-0.8B-IQ4_XS.gguf:
        ticket: "#3951"            # never closes its think block
        defect: think_never_closed
        thinking: "on"
        control: Qwen3.5-4B-Q4_K_M.gguf
      Qwen3.5-0.8B-Q4_K_M.gguf:
        ticket: "#3948"            # closes it EMPTY (fold quorum on #3948, item 2)
        defect: think_empty
        thinking: "on"
        control: Qwen3.5-4B-Q4_K_M.gguf
    # F10, operator ruling 2026-09-23 on #3957 (verbatim): "c". apr has no CUDA forward for
    # qwen35moe (hybrid SSM + MoE) and must REFUSE it by name on `apr run --gpu`: no fallback, no
    # output (aprender-serve capability::no_cuda_forward_reason). The CUDA forward is 0.70.0 work.
    red_unsupported:
      "Qwen3.5-35B-A3B*.gguf":
        architecture: qwen35moe
        ticket: "#3977"
    backends: [cuda]
  # #3712 row B (operator 2026-09-21: "MORE than enough tokens for our needs (overdo it), and our verbs are
  # dogfooded, i.e chat with and without thinking, ditto run, ditto code"). A cell is (model, host, verb,
  # thinking, context rung). The RUNGS are not declared here: ids and token counts live in ONE file,
  # evidence/release/context-rungs.json (apr-release-context-rungs/v1, #3715), which pv reads too;
  # consumer-max is the max over its consumers[].max_prompt_tokens. Thinking modes are derived per model
  # from its chat template (#3723). A cell fits a host iff weights + kv_bytes_per_token * tokens + workspace
  # <= the host's TOTAL GPU memory (operator "a", #3710): a fitting cell must pass, a non-fitting one must be
  # an honest pre-load refusal, and every owed cell must pass on >= 1 required host. Long rungs are owed by
  # the families below plus ONE representative per other arch, named here by file (cop 2026-09-21).
  cells:
    verbs: [run, chat, serve, code]
    # #3828: a removal from this block must be DECLARED here with a reason, or the
    # anti-shrink floor in check_model_ladder.sh refuses it as a silent shrink. The
    # declaration is printed on every run, so a withdrawal cannot decay into an absence
    # nobody re-reads. This is the mechanism #3817 needed and did not have.
    withdrawn:
      representatives:
        qwen3moe: >-
          #3817, 0.69.1: not a fit question and not a regression — this build has NO CUDA
          forward for the qwen3moe architecture at all (#3714, lands 0.70.0). `apr run --gpu`
          now refuses it by name at pre-load rather than silently falling back to CPU, so a
          long-rung representative for it would owe cells no code can satisfy and a
          RefusalCell would be a false arithmetic claim. Restore this key with #3714.
    long_rungs_for:
      families: [qwen35]                      # every consumer's family: the full rung set, through declared
      representatives:                        # one file per other arch the fleet holds
        qwen2: qwen2.5-coder-7b-instruct-q4_k_m.gguf      # lambda + gx10
        qwen3: Qwen3-8B-Q4_K_M.gguf                       # lambda + gx10
        # qwen3moe: REMOVED for 0.69.1 (#3817). Not a fit question — this build has no CUDA
        # forward for the architecture at all (#3714, lands 0.70.0), so `apr run --gpu` refuses
        # pre-load by name and there is no GPU cell to owe. The CPU path is unchanged and works.
        # Restore this line with the GPU forward, not before.
  rungs:
    - id: qwen2-1.5b-q4km
      family: qwen2.5
      arch: qwen2
      gguf: qwen2.5-1.5b-instruct-q4_k_m.gguf
      sha256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
      backends: [cpu, cuda]
      required: true
      note: "control rung — the architecture every other gate already exercises; if this is red the host is broken, not the model"
    - id: qwen3-1.7b-q4km
      family: qwen3
      arch: qwen3
      gguf: Qwen3-1.7B-Q4_K_M.gguf
      sha256: b139949c5bd74937ad8ed8c8cf3d9ffb1e99c866c823204dc42c0d91fa181897
      backends: [cpu, cuda]
      required: true
      note: "dense Qwen3 (per-head QK RMSNorm) — RED on cuda at 4a538ddef on both hosts (#3413)"
    - id: qwen3-8b-q4km
      family: qwen3
      arch: qwen3
      gguf: Qwen3-8B-Q4_K_M.gguf
      sha256: d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785
      backends: [cpu, cuda]
      required: true    # flipped 2026-09-22 (#3724): the empty-output defect this key was hiding is FIXED
                        # and MEASURED green 8/8 on BOTH lambda (where it failed) and gx10 at 3ebb1c61e.
                        # `required: false` on a Q4_K rung is what let 0.69.0 ship it as a note instead of a
                        # failure -- FALSIFY-MCL-011's own if_fails says so -- and no Q4_K model is optional.
      note: "second dense-Qwen3 size. No Q4_K model is optional (#3712), so the release gate refuses this key and the release cannot ship on it. FLIPPED to true for 0.69.1: the condition this note used to name as the reason for deferring — 'the flip lands with the Qwen3-8B CUDA fix and a committed green lambda receipt' — is the release's own work, not a reason to wait. Arming it surfaced what the key had masked since 0.69.0: the committed 0.68.2 lambda receipt carries qa_rc 5 / golden_output 'Empty output' / green false, so ladder-green fires missingGreenHost: lambda and takes contracts, pv lint, check_model_ladder and clean-room red together — ONE cause, four gates. resolve() unions green witnesses ACROSS versions, so a green 0.69.1 lambda receipt closes all four and no committed receipt is edited"
    - id: qwen35-0.8b-q4km
      family: qwen3.5
      arch: qwen35
      gguf: Qwen3.5-0.8B-Q4_K_M.gguf
      sha256: bd258782e35f7f458f8aced1adc053e6e92e89bc735ba3be89d38a06121dc517
      backends: [cpu, cuda]
      required: true
      note: "hybrid Gated DeltaNet — cuda claimed since 2026-09-19 (operator: GPU is required for 0.68.2; #3090 on PMAT-3477-gdn-gpu). RED by construction until that path passes apr qa Golden Output GPU on both hosts; the cpu half went green at f4c0daa37"
