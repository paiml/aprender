equations:
  rung_green:
    formula: "green(rung, host) = present(file, sha256) ∧ qa.capability_match ∧ qa.golden_output ∧ ∀ b ∈ backends: ran_on(b) ∧ ¬fallback(b)"
    domain: "every rung in ladder.rungs, every host in ladder.hosts with required: true"
    invariants:
      - "`apr qa --json` is the measurement; a Skipped gate counts as NOT passed even though the report marks it passed:true"
      - "ran_on(cuda) is proved by the ABSENCE of the `diverges from CPU … falling back to CPU` and `path rejected` lines in `apr run --gpu` output, never by the flag that was passed"
      - "a rung the host does not hold is absent, and absent is FAIL for a required rung: an unmeasured claim is not a passed claim"
    preconditions:
      - "binary pinned via scripts/apr_bin.sh (built from HEAD) or DOGFOOD_ALLOW_UNPINNED=1 for the published-crate mode"
      - "every apr call runs through apr_locked: the fleet GPU lock (flock, bounded wait; a held lock is an ENV decline naming its holder) and choom -n 1000, so a measurement and never a CI job is the OOM victim (#3712; gx10 global OOM 2026-09-21 15:56:08Z killed CI containers)"
  host_receipt:
    formula: "receipt(host) = {schema: apr-model-ladder-receipt/v2, host, version, sha, apr_sha, gpu, cc, inventory: [{file, sha256, bytes}], rungs: [{id, file, present, capability_match, golden_output, backends: {b: {ran, fallback, rc}}}]}"
    domain: "evidence/dogfood/models/<version>/<host>.json, written only by scripts/model_ladder.sh"
    invariants:
      - "receipt.version equals the cargo root version of the tree it was measured on"
      - "receipt.sha equals the git HEAD the binary was built from"
      - "receipt.executed >= 1 — a receipt that measured nothing is a decline (exit 2), never a pass"
      - "receipt.inventory is MEASURED on the host (every file under inventory.dirs matching inventory.patterns), never copied from the ladder; an empty inventory is FAIL"
    preconditions:
      - "python3 with json on the host (yaml is read by python3 too)"
  gate_verdict:
    formula: "T2_models = ∀ host required: receipt(host) fresh(version) ∧ ∀ rung required: green(rung, host) ∧ ∀ f ∈ receipt(host).inventory: green(f, host, inventory.backends)"
    domain: "scripts/check_model_ladder.sh, invoked by scripts/dogfood.sh through [package.metadata.dogfood]"
    invariants:
      - "the rung list at origin/main is the floor: a PR may add rungs, hosts or backends and may not remove any (same construction as check_multiplatform_dogfood.sh layer 2)"
      - "a missing receipt is FAIL, not DEFER: unlike the multiplatform gate this needs no published crate, a dev build measures it"
      - "a Q4_K rung (file or id matches q4_?k) is required and claims cuda — the key `required: false` on one is refused, not tolerated (#3712)"
    preconditions:
      - "git can read origin/main:contracts/model-capability-ladder-v1.yaml, or the run is the bootstrap"

proof_obligations:
  - id: MCL-INV-001
    type: invariant
    property: "Every architecture the release claims is a rung"
    formal: "∀ arch ∈ claimed_archs(README, book, #3077 table): ∃ rung ∈ ladder.rungs with rung.arch = arch"
    applies_to: rung_green
  - id: MCL-INV-002
    type: invariant
    property: "A claimed backend that silently falls back is red"
    formal: "fallback(cuda) ⟹ ¬green(rung, host), even when the final tokens are correct"
    applies_to: rung_green
  - id: MCL-INV-003
    type: invariant
    property: "The gate is red on the tree it was born on"
    formal: "verdict(gate, 4a538ddef, receipts₁) = 1 ∧ {qwen3-1.7b-q4km/cuda, qwen35-0.8b-q4km/capability_match} ⊆ failures(gate, 4a538ddef, receipts₁) ∧ ∀ h ∈ {lambda, gx10}: h ∈ failing_hosts"
    applies_to: gate_verdict
  - id: MCL-INV-004
    type: invariant
    property: "Receipts are per host and per version, never inherited across silicon"
    formal: "∀ h₁, h₂ ∈ hosts: h₁ ≠ h₂ ⟹ green(rung, h₁) ∌ evidence(rung, h₂) ∧ T2 ⟹ ∀ h ∈ required_hosts: ∃ receipt(h, version)"
    applies_to: host_receipt
  - id: MCL-INV-005
    type: invariant
    property: "The ladder can grow and cannot shrink in the same PR that reads it"
    formal: "rungs(origin/main) ⊆ rungs(HEAD) ∧ hosts(origin/main) ⊆ hosts(HEAD) ∧ ∀ rung: backends_main(rung) ⊆ backends_head(rung)"
    applies_to: gate_verdict
  - id: MCL-INV-006
    type: invariant
    property: "No Q4_K rung is optional, and every one claims CUDA"
    formal: "∀ rung ∈ ladder.rungs: q4k(rung) ⟹ rung.required = true ∧ cuda ∈ rung.backends"
    applies_to: gate_verdict
  - id: MCL-INV-008
    type: invariant
    property: "Every owed (model, verb, thinking, rung) cell is proved: pass where it fits, an honest refusal where it does not, and a pass on at least one required host"
    formal: "∀ host, m ∈ inventory(host), v ∈ cells.verbs, t ∈ modes(template(m)), r ∈ rungs(m): |rows(host, m, v, t, r)| = 1 ∧ (fits(m, r, total(host)) ⟹ pass(row) ∧ backend = cuda ∧ ¬fallback ∧ prompt_tokens ≥ tokens(r) ∧ answer_chars > 0 ∧ (t = on ⟹ think_closed)) ∧ (¬fits ⟹ refused(row) ∧ required_bytes(row) > total(host)) ∧ ∃ host': pass(host', m, v, t, r)"
    applies_to: gate_verdict
  - id: MCL-INV-007
    type: invariant
