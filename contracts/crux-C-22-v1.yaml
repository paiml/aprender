# CRUX-C-22 — Typical sampling

metadata:
  id: CRUX-C-22
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "C — Serving & Chat UX"
  competitor: llama_cpp
  demand_score: 3
  intake_status: missing
  description: >
    Typical-p (locally typical) sampling (arXiv:2202.00666).
    Canonical: llama.cpp `--typical 0.95` or HF `typical_p=0.95` —
    keep tokens whose information content is close to entropy.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/huggingface/accelerate
  - github.com/pytorch/pytorch — DDP/FSDP
equations:
  typical_p:
    formula: |
      H = -sum(p_i * log p_i)                      # entropy
      c_i = |−log p_i − H|                         # distance from typicality
      keep smallest cumulative-probability subset S s.t. sum_{i∈S} p_i ≥ p
      sorted by c_i ASC; renormalize; sample
    domain: "(logits: Vec<f32>, p ∈ (0,1])"
    codomain: "filtered token distribution"
    invariants:
    - "p = 1.0 → no filtering (identity)"
    - "tokens kept are exactly those whose |−log p − H| is smallest cumulative sum ≥ p"
    - "matches HF `TypicalLogitsWarper` bit-for-bit on f32 logits"

falsification_tests:
- id: FALSIFY-CRUX-C-22-001
  rule: p=1.0 is identity (no change from greedy/temperature-only)
  prediction: "typical-p=1.0 yields same token_ids as no typical filter"
  test: |
    set -euo pipefail
    apr run tests/fixtures/tinyllama-q4_k_m.gguf --prompt "The" --typical 1.0 --seed 5 --max-tokens 16 --format json > /tmp/typ.json
    apr run tests/fixtures/tinyllama-q4_k_m.gguf --prompt "The" --seed 5 --max-tokens 16 --format json > /tmp/base.json
    diff <(jq .token_ids /tmp/typ.json) <(jq .token_ids /tmp/base.json)
  if_fails: rule 'p=1.0 is identity (no change from greedy/temperature-only)' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-C-22-002
  rule: matches HF TypicalLogitsWarper on identical logits
  prediction: "kept-token set identical to HF reference on a captured logits tensor"
  test: |
    set -euo pipefail
    # apr writes the post-filter prob vector for introspection
    apr debug sample --logits tests/fixtures/logits_row.npy --typical 0.95 --format json > /tmp/apr.json
    python3 - <<'PY'
    import numpy as np, json
    from transformers import TypicalLogitsWarper
    logits = np.load("tests/fixtures/logits_row.npy")
    import torch; t = torch.tensor(logits)
    w = TypicalLogitsWarper(mass=0.95)
    hf = w(None, t.unsqueeze(0))[0].tolist()
    apr = json.load(open("/tmp/apr.json"))["filtered_logits"]
    diffs = [abs(a-b) for a,b in zip(apr, hf)]
    assert max(diffs) < 1e-5, max(diffs)
    PY

  if_fails: rule 'matches HF TypicalLogitsWarper on identical logits' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr --typical matches HF `TypicalLogitsWarper` and llama.cpp `--typical` on identical logits"
- type: invariant
  property: "p=1.0 is mathematically identity; verified by byte-equal tokens"
- type: invariant
  property: "filtered distribution renormalizes to sum=1.0 ± 1e-6"

