contract: neuralprophet-parity
metadata:
  version: 1.2.0
  created: '2026-09-05'
  author: PAIML Engineering
  kind: kernel
  # ONT-7 (plan 08-33): the parity bars hold in the committed tree; no qualifier is claimed.
  valid_under:
    world: committed
  description: >
    The FROZEN correctness bar for `crates/aprender-forecast`'s NeuralProphet-lite port
    (`src/np.rs`) and for the D-10 training rules that make it work (SC3). Every number the
    `np::parity` ladder asserts lives HERE, once, and is read at test time rather than written as a
    Rust literal: a test that hardcodes a tolerance can be loosened without the contract ever
    noticing, while a tolerance that lives here can only move as a `pv diff`-visible edit. D-15.

    THE ORACLE. `crates/aprender-forecast/tests/fixtures/np_oracle_peyton.json`, generated by
    Python `neuralprophet==0.9.0` (which needs `pandas<3`, `numpy<2.3`, `torch<2.6`) on the Peyton
    Manning Wikipedia page-view series (2905 daily rows, log scale). The split is the last 365 rows
    held out: train on rows `0..n-365`, forecast/score the remainder. The oracle publishes
    `trend_seasonality` (its `data_params.ds.{shift,scale}` = 2007-12-10 / 2596 days,
    `data_params.y.{shift,scale}` = 5.26269018890489 / 4.582609246193553, an 11-entry
    `changepoints_t`, `batch` 64, `epochs` 80, and `mae_365ahead_on_test_rows` 0.461050683504761
    over its own `n_test_rows` 363), `ar30_linear` and `ar30_hidden32` (`mae_1step_test` 0.2557 and
    0.3933), and the two baselines `naive_1step_mae_test` 0.34613807677421315 and
    `mean_forecast_mae_test` 0.6894077599365513.

    WHAT IS BARRED AND WHAT IS ONLY RECORDED. Data preparation is barred against NeuralProphet's own
    published numbers to 1e-9 (measured: shift/scale to 1e-16, changepoints to 1.1e-16, and the auto
    batch/epoch formulas reproduce NP's 64/80 EXACTLY as integers). The two accuracy bars are the
    SC3 literals: 365-day-ahead holdout MAE <= 0.47 lag-free (Python NP 0.4611; Rust measured 0.4463
    IN THIS TREE at seed 42, and 0.4510 in the spike at seed 7, with the spike's seed 1/2/3 ablation
    giving 0.4549/0.4515/0.4508), and the AR-Net with `n_lags = 30` beating the oracle's own naive
    one-step baseline (0.3461; Rust measured 0.2458 in this tree at seed 42, 0.2509 in the spike).
    The in-tree numbers are the ones the ladder actually produces; the spike numbers are kept
    beside them because the seed-to-seed spread is what sets the headroom under the bar.
    Nothing here bars Rust to Python's *value*: NeuralProphet's lr-finder, its torch RNG and its
    epoch schedule are not reproducible from the oracle, so a value-parity bar would be barring
    seed luck. What IS reproducible — the data preparation and the two auto-formulas — is barred
    exactly, and the accuracy claims are barred as one-sided thresholds against numbers the oracle
    published.

    THE D-10 TRAINING RULES ARE INVARIANTS, NOT PREFERENCES. NP-lite is the best point forecaster in
    the spike-006 benchmark (mean MASE 1.029) BECAUSE of these rules, and each has a measured
    counter-example: (a) core's own smooth-L1 (Huber) loss in `aprender::nn::loss` is DETACHED from
    the autograd graph — its `forward` maps over `diff.data()` and rewraps the result in a fresh
    `Tensor`, so after `backward()` every parameter gradient is `None` and the model cannot train at
    all, which is why `np::weighted_huber` is built from graph ops with a constant 0/1 mask (the
    mask is piecewise constant, so this is the EXACT gradient, not an approximation); (b) full-batch
    training collapses the fit to test MAE 2.6168 against 0.4510, because the auto-epoch formula
    assumes mini-batches (80 epochs x 1 batch = 80 steps); (c) `clear_graph()` must run after every
    optimiser step or the thread-local tape grows without bound and is left dirty for the next
    caller on that thread; (d) the learning rate is selected by TRAIN loss and never by test error —
    on this very dataset the lowest train loss (lr 0.1, 0.01498) is NOT the best test MAE (lr 0.01,
    0.4112), so selecting by test would silently turn a forecast into a fitted curve; (e) Fourier
    features are on days since 1900-01-01, NeuralProphet's own epoch, and the whole data-prep bar
    fails if that epoch moves.

    OUT OF SCOPE, DELIBERATELY. NeuralProphet's quantile regression and `n_forecasts > 1` were not
    spiked (CONTEXT deferred): the shipped band is residual-standard-deviation based and the
    response's `diagnostics.band` says so in words rather than implying a coverage guarantee it does
    not have. Empirical coverage of the nominal 80 % band was measured at 0.60-0.69 on rolling
    origins (D-16). Do NOT add a coverage bar here until quantile regression ships.
  references:
    - 'Triebe, O., Hewamalage, H., Pilyugina, P., Laptev, N., Bergmeir, C. & Rajagopal, R. (2021). NeuralProphet: Explainable Forecasting at Scale. arXiv:2111.15397.'
    - '.claude/skills/spike-findings-aprender/references/neuralprophet-autograd.md (the validated implementation blueprint: the D-10 training rules, the ops the model needs, and the What-to-Avoid list each rule came from).'
    - '.claude/skills/spike-findings-aprender/sources/002-neuralprophet-autograd/RUN-OUTPUT.md (the measured numbers behind every tolerance here: the loss-connectivity table, the data-prep matches, the lr sweep, the AR-Net table and the seed/epoch/full-batch ablations).'
    - '.claude/skills/spike-findings-aprender/sources/004-forecast-mcp-thin-server/src/np.rs (the evolved port this crate carries verbatim, D-08).'

# Machine-readable mirror of the D-10 training rules' non-tolerance knobs. Not part of the
# `Contract` struct (the parser drops unknown top-level keys), and deliberately so: these are
# read by the `np::parity` module at test time so the lr sweeps and the mini-batch bounds are
# asserted from the contract rather than from a test literal, exactly as the tolerances are
# read from `equations.*.float_tolerance`.
constants:
  # The lr sweeps the shipped `"neuralprophet"` arm uses, selected by TRAIN loss (D-10).
  # Comma-separated because a sweep is an ordered list, not a scalar.
  lr_sweep_lag_free: '0.01,0.03,0.1'
  lr_sweep_with_lags: '0.03,0.1'
  # `epochs = auto_epochs(n).min(320)` when lags are on: the linear AR case needs 4x the
  # auto budget, and 320 is where that stops paying (spike-002 AR-linear budget probe).
  auto_epochs_cap_with_lags: 320
  # Above this many samples `auto_batch` is REQUIRED to return a strict mini-batch.
  min_rows_for_mini_batch: 64
  # The clamp `auto_batch` applies, asserted over a bounded grid.
  auto_batch_min: 8
  auto_batch_max: 2048
  # NeuralProphet's own values for the Peyton Manning training split (2540 lag-free samples).
  np_peyton_batch: 64
  np_peyton_epochs: 80
  # The Fourier epoch, as a civil date. Moving it invalidates every seasonality feature.
  fourier_epoch_year: 1900

equations:

  data_prep_vs_oracle_abs:
    formula: 'max(|shift_rust - shift_np|, |scale_rust - scale_np|, |t0_rust - t0_np|, |t_span_rust - t_span_np|, max_j |cps_rust[j] - changepoints_t_np[j]|) <= 1.0e-9'
    domain: 'the raw (ds, y) Peyton Manning history and the oracle split (train = all but the last 365 rows), through `np::NpData::new(ds, y, n_train, 10, 0.8)`'
    codomain: 'NeuralProphet 0.9.0 own data parameters as committed in `np_oracle_peyton.json`: `trend_seasonality.data_params.y.{shift,scale}`, `.ds.{shift,scale}` and `trend_seasonality.changepoints_t`'
    float_tolerance: 1.0e-9
    invariants:
      - 'soft normalisation is shift = min(observed train y) and scale = q95 - min, with q95 the numpy-linear percentile; NEVER a mean/std standardisation'
      - 'time is t = (day - t0) / t_span with t0 the FIRST history day and t_span the span of the TRAIN portion in days (2007-12-10 and 2596 for this oracle)'
      - 'changepoints_t is `changepoints_range * i / (n_changepoints + 1)` for i in 0..=n_changepoints, i.e. 11 entries at n_changepoints = 10, cp_range 0.8 — the first is 0.0 and they stop at 0.7273, NOT at 0.8'
      - 'the auto formulas are asserted as EXACT integers, not within a tolerance: auto_batch(2540) == 64 and auto_epochs(2540) == 80, which are NeuralProphet own reported values'
      - 'measured: shift and scale match to 1e-16, changepoints to 1.1e-16 — the 1e-9 bar is deliberately loose relative to the measurement so an f64-formatting change in the oracle is not a false failure'
    preconditions:
      - 'the CSV is read sorted-ascending and de-duplicated by ds (test_support::read_csv), because the oracle was generated from the same de-duplicated frame'

  lag_free_holdout_mae:
    formula: 'mean_i |predict_ts(model, test_day_i) - y_i| <= 0.47 over the 365 held-out daily rows'
    domain: 'the lag-free NeuralProphet-lite model (n_lags = 0) trained on the first n-365 Peyton Manning rows with seed 42, lr selected by lowest FINAL TRAIN LOSS from constants.lr_sweep_lag_free, auto batch and auto epochs'
    codomain: 'the held-out y values from the same CSV; the oracle`s own number on the same split is trend_seasonality.mae_365ahead_on_test_rows = 0.461050683504761 over its n_test_rows = 363'
    float_tolerance: 0.47
    invariants:
      - 'this is the SC3 literal. It is a one-sided THRESHOLD, not a parity residual: the port is required to be at least as good as NeuralProphet was on this split, with headroom for seed variation'
      - 'measured 0.4463 IN THIS TREE at seed 42 with the train-loss-selected lr 0.1 (final train loss 0.01498); the spike measured 0.4510 at seed 7, and its seed 1/2/3 ablation gives 0.4549 / 0.4515 / 0.4508. The seed-to-seed spread is ~0.009 and the bar sits ~0.015 above the worst value ever observed'
      - 'the lr MUST be selected by train loss (D-10). On this dataset the best TEST MAE is lr 0.01 (0.4112) while the best TRAIN loss is lr 0.1 (0.4510) — selecting by test would report 0.4112 and be measuring nothing'
      - 'the model is scored on ALL 365 held-out rows while NeuralProphet covered 363 of them; the two-row difference is NP dropping rows its own windowing could not cover, and is recorded rather than corrected for'
    preconditions:
      - 'data_prep_vs_oracle_abs holds for the same split — an MAE computed on a differently normalised series is not a comparable number'

  ar_net_vs_naive_margin:
    formula: 'mean_i |predict_ar_1step(model, test_idx_i) - y_i| < naive_1step_mae_test - 0.0'
    domain: 'the AR-Net model (n_lags = 30, ar_layers [32], ReLU) trained on the same split with seed 42, lr from constants.lr_sweep_with_lags selected by train loss, epochs = auto_epochs(n).min(constants.auto_epochs_cap_with_lags)'
    codomain: 'the oracle`s own naive one-step baseline `naive_1step_mae_test` = 0.34613807677421315 (predict the previously observed row)'
    float_tolerance: 0.0
    invariants:
      - 'the margin is 0.0: the claim is BEATING the naive baseline, not beating it by a stated amount. A margin > 0 would be an accuracy claim the spike did not measure across seeds'
      - 'measured 0.2458 IN THIS TREE at seed 42 (lr 0.1, final train loss 0.00829); the spike measured 0.2509 for hidden [32] and 0.3216 for the linear AR head at seed 7. The achieved margin over naive is ~0.10, and Python NeuralProphet own AR-Net (0.3933) does NOT beat naive on this split'
      - 'the baseline is the ORACLE own number, not a Rust-computed naive: comparing a Rust model against a Rust baseline would be a self-comparison'
      - 'one-step-ahead uses TRUE lags (predict_ar_1step), never recursively fed predictions; the recursive path (predict_ar_recursive) is what the horizon forecast uses and is NOT scored here'
    preconditions:
      - 'n_lags < the training grid span, which the door enforces before any fit (D-11)'

  huber_grad_min_abs:
    formula: 'after weighted_huber(pred, target, w, beta).backward(), forall parameter p: p.grad() is Some(g) and max_i |g_i| > 0.0'
    domain: 'a freshly initialised NpModel and one forward pass over a small batch'
    codomain: 'the autograd tape built by `np::weighted_huber`'
    float_tolerance: 0.0
    invariants:
      - 'this is the CONNECTIVITY bar, not a numeric-accuracy bar: the failure it exists to catch is a gradient of `None` (a detached loss), which is why the threshold is a strict > 0.0 on at least one entry rather than a tolerance'
      - 'core own smooth-L1 (Huber) loss in `aprender::nn::loss` FAILS this: it maps over `diff.data()` and rewraps in a fresh `Tensor`, and the measured parameter gradient after backward() is None (spike-002 section 0). It must never be imported into np.rs; 06-09 files the core ticket'
      - 'the 0/1 mask multiplied into the quadratic and linear branches is a CONSTANT tensor (built from `a.data()`, no requires_grad), so it contributes no gradient path and the result is the exact SmoothL1 subgradient'

  fourier_epoch_1900:
    formula: 'fourier_feats(day, seasons, out) uses t = day - days_from_civil(1900, 1, 1)'
    domain: 'any calendar day and any seasonality list'
    codomain: 'the sin/cos feature block, all sin(k) first then all cos(k) per seasonality'
    invariants:
      - 'NeuralProphet phases its Fourier terms on 1900-01-01, not on the series start and not on the Unix epoch. Moving the epoch shifts every seasonal phase and breaks data_prep_vs_oracle_abs downstream'
      - 'the per-seasonality layout is the SIN BLOCK then the COS BLOCK (NP order), never interleaved sin/cos pairs (Prophet order) — the two produce identical fits but incompatible weight vectors'
      - 'auto seasonalities use NP resolutions 6 (yearly, period 365.25) / 3 (weekly, period 7) / 6 (daily, period 1) with Prophet`s span-and-spacing disable rules'

  mini_batch_never_full:
    formula: 'forall n >= constants.min_rows_for_mini_batch: auto_batch(n) < n and constants.auto_batch_min <= auto_batch(n) <= constants.auto_batch_max'
    domain: 'the sample count of a training set, bounded by types::MAX_POINTS (20000)'
    codomain: 'the batch size the training loop uses when the caller does not pin one'
    invariants:
      - 'FULL-BATCH TRAINING COLLAPSES THE FIT. Measured on this very dataset: full batch (2540 rows, 80 steps) gives final train loss 0.34177 and test MAE 2.6168, against 0.01498 / 0.4510 with the auto mini-batch. The auto-EPOCH formula assumes mini-batches, so raising the batch silently removes 97 % of the optimiser steps'
      - 'do NOT "optimise" the batch size upward as a throughput change: it is a correctness knob here, not a performance knob'
      - 'auto_batch(2540) == 64, which is NeuralProphet own value for this split'
      - 'the clamp keeps the batch in [8, 2048] and then `min(n)`, so a series shorter than 8 rows trains on one batch of its whole self — below MIN_POINTS, and refused at the door before reaching this code'

  lr_selected_by_train_loss:
    formula: 'selected_lr = argmin_{lr in sweep} final_train_loss(lr), where sweep = constants.lr_sweep_lag_free when n_lags == 0 else constants.lr_sweep_with_lags'
    domain: 'a fitted series and the shipped sweep for its lag configuration'
    codomain: 'the learning rate the response reports as `diagnostics.selected_lr`'
    invariants:
      - 'NEVER select the learning rate (or the epoch count) by test error. NeuralProphet uses a range test; a short sweep selected by TRAIN loss is the reproducible stand-in'
      - 'on Peyton Manning the two disagree, which is the whole point: lowest train loss is lr 0.1 (test MAE 0.4510) while lowest test MAE is lr 0.01 (0.4112). A test-selected number would not be a forecast'
      - 'a learning rate whose final train loss is non-finite is SKIPPED, not selected; if every rate diverges the door returns Internal rather than a forecast'
      - 'the selected rate is reported in diagnostics so a caller can see which arm of the sweep won'

  tape_cleared_per_step:
    formula: 'graph_tape_len() == 0 after train(), and clear_graph() runs once per optimiser step inside the loop'
    domain: 'any completed fit, and any completed `forecast(model = neuralprophet)` call'
    codomain: 'the thread-local autograd tape'
    invariants:
      - 'the tape is THREAD-LOCAL and unbounded: a fit that does not clear it accumulates the entire training history and leaves it dirty for the next caller on that thread'
      - 'the server runs each fit on `spawn_blocking`, so two fits never interleave on one thread; the per-step clear is what makes that safe rather than merely likely (T-06-12)'
      - 'the prediction helpers (predict_ts, predict_trend, predict_ar_1step, predict_ar_recursive) each clear the tape too, because they build a no_grad forward that still allocates tape entries'

  huber_built_from_ops:
    formula: 'weighted_huber = mean( (0.5/beta * d^2 * mask + (|d| - 0.5*beta) * (1 - mask)) * w ), with d = pred - target and mask a CONSTANT 0/1 tensor of |d| < beta'
    domain: 'a graph-connected prediction tensor, a constant target and a constant sample-weight tensor'
    codomain: 'a scalar loss whose backward() reaches every model parameter'
    invariants:
      - 'built from `sub`, `abs`, `pow`, `mul_scalar`, `mul`, `add` and `mean` — all graph-connected ops. No raw `data()` -> `Tensor::new` round trip anywhere on the value path'
      - 'the mask is read from `a.data()` and rebuilt as a plain (non-requires_grad) tensor: it is piecewise constant in the parameters, so multiplying by it yields the EXACT SmoothL1 subgradient rather than an approximation'
      - 'the sample weight is NeuralProphet `_get_time_based_sample_weight` with end_w = 2 and start_t = 0, applied inside the mean'
      - 'beta is the huber_beta the shipped arm pins at 0.3'

  event_effect_recovery_rel:
    formula: 'forall event columns j: |w_j * scale - effect| / |effect| <= 0.10, with w_j the learned weight of the additive Linear(E, 1) event block on column j, scale the NpData soft-normalisation width, and effect the planted per-indicator magnitude'
    domain: 'a synthetic daily series carrying a KNOWN additive per-indicator effect on every active event column, trained by np::train with an events::EventDesign attached, at n_lags = 0 AND at n_lags > 0'
    codomain: 'the denormalised per-column weights of the event block, one per (event, window offset) column, as recorded by np::TrainLog'
    float_tolerance: 0.10
    invariants:
      - 'the bar is PER COLUMN and never on an average: an average hides a single column that learned nothing, and a block whose columns disagree is not a recovered effect. SC3 says "recovered to within 10 % on every indicator column"'
      - 'MEASURED, spike 013: a planted magnitude of 8.0 on six columns (promo -1..+1, blackfriday 0..+2) over a 1200-point synthetic daily series of scale 30.43 recovered as +7.769, +8.293, +7.990, +8.043, +8.249, +8.462 — worst absolute error 0.462, which is 5.8 % of the planted effect. The 10 % bar sits at roughly 1.7x the worst error ever observed'
      - 'the bar binds at n_lags > 0 as well as lag-free (D-30), and that half is the one this equation exists for: spike 013 measured ONLY the lag-free path, and spike 014 measured the AR term ABSORBING a smooth continuous driver — the `price` regressor weight collapsed from -0.0493 lag-free to -0.0048 at seven lags. An event effect absorbed by the AR term would leave the block reporting a near-zero weight while the forecast still looked right, so the per-column bar at lags is a real risk this catches rather than a formality'
      - 'the weights are read in NORMALISED space and multiplied by NpData::scale to reach the planted units; comparing a normalised weight against a raw effect would be comparing two different quantities'
      - 'the bar is RELATIVE (|w*scale - effect| / |effect|), not absolute: an absolute 10 % of one planted magnitude is not 10 % of another, and this equation is meant to bind at whatever magnitude a test plants'
      - 'a passing recovery bar is not by itself evidence the block is wired into the optimiser — a block whose parameters are built but never extended into the AdamW vector fails this bar with "effect not recovered" rather than with its true cause. events::tests::the_event_block_weights_are_actually_optimised names that cause separately'
      - 'MEASURED 2026-09-21 (plan 06.1-05), the AR-absorption MECHANISM, which is per-column and not uniform: the FIRST column of each event — the one whose n_lags-day lag window contains no earlier day of the same window — recovers correctly at EVERY budget tested (7.7 to 8.7 against a planted 8.0), while the TRAILING columns, whose lag windows overlap the event, drift anywhere from 4.3 to 10.7 until the fit converges. The AR term can read the effect out of the lags, so the split between the two terms is under-determined rather than wrong, and it is the trailing columns that pay for it. A bar taken on an average, or on the first column alone, would not see this'
    preconditions:
      - 'the event block is composed BESIDE NpModel with one `.add()` on the forward and both parameter sets handed to ONE AdamW; a block trained by a second optimiser is a different model'
      - 'the planted effect is applied through the SAME event_row expansion the block reads, so "recovered" is a statement about the block and not about the harness agreeing with itself'
      - 'clear_graph() runs after every optimiser step, as tape_cleared_per_step requires: an un-cleared tape changes nothing about the arithmetic but makes the measurement unreproducible in a long-lived process'
      - 'the planted event OCCURRENCES cover the whole series span. A fixed occurrence list on a longer series leaves its later rows event-free, and np::sample_weight weights the later rows MORE (newer_w = 2), so the measurement would be reporting the generator rather than the model. Re-measured with and without: at 2400 points lag-free the worst relative error moved from 0.034-0.038 to 0.017-0.025'
      - 'AT n_lags > 0 THE FIT MUST BE CONVERGED, AND THIS IS AN OPEN ITEM RATHER THAN A SETTLED PRECONDITION. The bar is measured at constants.auto_epochs_cap_with_lags epochs with the learning rate selected by final train loss. MEASURED 2026-09-21 on a 1200-point synthetic series, worst relative error per column across seeds 42/43/7/11: at np::door_epochs own budget (110 epochs) 0.0915 / 0.2293 / 0.4660 / 0.3326 — THREE OF FOUR OVER THE BAR; at the 320-epoch AR cap 0.0528 / 0.0659 / 0.0668 / 0.0667 — all inside. On a 2400-point series: at door_epochs (90) 0.2191 / 0.3597 / 0.3897 / 0.2954, all over; at the cap 0.0677 / 0.0628 / 0.1663 / 0.0901 — ONE OF FOUR STILL OVER. So this equation is NOT a claim that the shipped door configuration recovers the effect at lags. RESOLVED by plan 06.1-06, and NOT by relaxing this bar: the door now REFUSES holidays together with n_lags > 0, so the configuration this precondition describes is no longer reachable from the public door and the bar is not being asserted over a configuration it fails. Raising the epoch budget was considered and rejected on measurement — np::door_epochs at n_lags > 0 is min(auto_epochs(n), constants.auto_epochs_cap_with_lags) and auto_epochs DECREASES with the point count, so the 320 cap binds only at n <= 50 against a fit_min_points of 10 and is a budget the door configures for no realistic series; even at 320 one seed at 2400 points still reads 0.1663; and a flat 320 at 5000 points with six event columns prices at 191.7 % of fit_max_np_train_cost, so it would turn requests the door accepts today into refusals. A cost bound is a published surface. The lag-free arm has no such precondition — it holds at the door budget at both series lengths, worst 0.017-0.063, and plan 06.1-06 re-measured it THROUGH THE DOOR under the door''s own sweep and epoch rule'

  event_training_determinism_bitwise:
    formula: 'train(d, cfg with event_design, seed = s) twice yields BIT-IDENTICAL event weights and a BIT-IDENTICAL epoch_loss trace; and the same fit at seed s2 (s2 != s) yields event weights that DIFFER'
    domain: 'two np::train calls with an events::EventDesign attached at one seed, and a third at a different seed, on the same series and the same TrainConfig in every other field'
    codomain: 'the per-column event weights of the additive Linear(E, 1) block, and the per-epoch training loss trace, compared by IEEE-754 bit pattern'
    float_tolerance: 0.0
    invariants:
      - 'the tolerance is EXACTLY 0.0 and the comparison is on BIT PATTERNS, not on values: f64 equality would treat -0.0 and +0.0 as equal and would treat two NaNs as unequal, and neither is the statement this bar makes. A reproducible fit reproduces the bits'
      - 'THE SECOND HALF IS THE BAR. "Two runs at one seed agree" is satisfied by an implementation that ignores the seed entirely, or that never trains at all. Requiring seed 43 to DIFFER from seed 42 is what makes this check able to fail, and it is asserted rather than assumed'
      - 'MEASURED, spike 013 and plan 06.1-05: seed 42 twice is bit-identical in both the weights and the loss trace, and seed 43 differs. The block is drawn from the SAME Rng as NpModel and AFTER it, so an events-OFF run at one seed initialises the model identically — which is what makes an events ON/OFF comparison a comparison of the BLOCK'
      - 'the block''s draws DO shift the subsequent shuffle stream, so an events-ON and an events-OFF fit at the same seed are NOT the same fit. MEASURED 2026-09-21 (plan 06.1-06) through the public door on a 1200-point series: the two forecasts differ by a near-constant level of -1.7864 with a mean absolute deviation of 0.0703, i.e. 3.9 % of the shift. Any reconciliation of published event components against an ON-minus-OFF difference must remove that level first, or it is measuring the two fits rather than the events'
      - 'the bar binds THROUGH THE PUBLIC DOOR as well as at the library level (plan 06.1-06): the door selects its learning rate by train loss over a sweep, so a non-deterministic fit could also change WHICH rate wins, and only a door-level check sees that'
    preconditions:
      - 'clear_graph() runs after every optimiser step, as tape_cleared_per_step requires: a tape left dirty by a previous fit on the same thread makes the measurement unreproducible without changing any arithmetic'
      - 'the seed reaches BOTH parameter sets through one Rng, and the block is drawn after the model; a block seeded independently would make the events-OFF control a different model rather than the same one without a block'

  event_tape_length_flat_in_columns:
    formula: 'tape_len_per_step(E) - tape_len_per_step(0) is the SAME fixed increment for every event-column count E > 0; it does not grow with E'
    domain: 'np::train with an events::EventDesign of E columns, for at least two VERY different non-zero E, against the events-OFF baseline on the same series and TrainConfig'
    codomain: 'the autograd tape length recorded per optimiser step by np::TrainLog::tape_len_per_step'
    float_tolerance: 0.0
    invariants:
      - 'the tolerance is EXACTLY 0.0 because this is a COUNT, not a measurement: the increment is equal or it is not, and an approximate tape length would not mean anything'
      - 'MEASURED, spike 013 and reproduced exactly by plan 06.1-05: 20 entries per step with events OFF, 25 with events ON — a fixed increment of FIVE — and the increment is IDENTICAL at 6 columns and at 280. The block is one Linear forward and one add regardless of its width'
      - 'THE CONSEQUENCE, which is why this bar exists: a per-step tape that grew with the column count would mean clear_graph() is clearing an ever-larger graph, and a wide design would leak tape into every subsequent step. A flat increment is what makes the existing tape_cleared_per_step guarantee survive the event block'
      - 'ONE column count cannot establish this. A single observation cannot distinguish a fixed increment from a linear one, which is why the domain requires two very different E and the shipped test uses 6 against 280'
    preconditions:
      - 'the events-OFF baseline is taken on the SAME series and the SAME TrainConfig in every other field, so the difference is attributable to the block'
      - 'clear_graph() runs per step; without it the recorded per-step length is the cumulative history and the increment is meaningless'

proof_obligations:

  - type: equivalence
    property: 'Rust NeuralProphet-lite data preparation reproduces NeuralProphet 0.9.0 own normalisation, time scaling and changepoint grid from the raw (ds, y) alone'
    formal: 'max_abs_diff(NpData::new(ds, y, n_train, 10, 0.8), oracle.trend_seasonality.data_params + changepoints_t) ≤ equations.data_prep_vs_oracle_abs.float_tolerance'
    applies_to: all

  - type: equivalence
    property: 'The auto batch and auto epoch formulas reproduce NeuralProphet own reported values exactly, as integers'
    formal: 'auto_batch(n_train) == constants.np_peyton_batch ∧ auto_epochs(n_train) == constants.np_peyton_epochs'
    applies_to: all

  - type: bound
    property: 'The lag-free model forecasts 365 days ahead on the Peyton Manning holdout at least as well as the SC3 bar'
    formal: 'mae_365ahead ≤ equations.lag_free_holdout_mae.float_tolerance'
    applies_to: all

  - type: bound
    property: 'The AR-Net with 30 lags and one hidden layer of 32 beats the oracle own naive one-step baseline'
    formal: 'mae_1step_rust < oracle.naive_1step_mae_test − equations.ar_net_vs_naive_margin.float_tolerance'
    applies_to: all

  - type: invariant
    property: 'The Huber loss is graph-connected: after backward() every model parameter has a gradient with at least one non-zero entry'
    formal: '∀ p in model.parameters(): p.grad() = Some(g) ∧ max_i |g_i| > equations.huber_grad_min_abs.float_tolerance'
    applies_to: all

  - type: invariant
    property: 'The Huber loss is assembled from graph-connected ops with a constant mask, never from a detached data round trip'
    formal: 'weighted_huber: ¬∃ `Tensor::new(raw_data)` on the value path ∧ ¬ requires_grad on the mask tensor'
    applies_to: all

  - type: bound
    property: 'The auto batch size is a strict mini-batch and stays inside the documented clamp over the whole supported range'
    formal: '∀ n in [constants.min_rows_for_mini_batch, types::MAX_POINTS]: auto_batch(n) < n ∧ constants.auto_batch_min ≤ auto_batch(n) ≤ constants.auto_batch_max'
    applies_to: all

  - type: determinism
    property: 'A completed fit leaves the thread-local autograd tape empty, so the next fit on that thread starts clean'
    formal: 'graph_tape_len() after train() == 0 ∧ graph_tape_len() after a completed forecast(model = neuralprophet) == 0'
    applies_to: all

  - type: invariant
    property: 'The learning rate is selected by final TRAIN loss over the shipped sweep, never by test error'
    formal: 'selected_lr in sweep && final_train_loss(selected_lr) = min over sweep'
    applies_to: all

  - type: invariant
    property: 'Fourier seasonality features are phased on days since 1900-01-01, NeuralProphet own epoch'
    formal: '∃ f: fourier_feats(day, ..) = f(day − days_from_civil(constants.fourier_epoch_year, 1, 1))'
    applies_to: all

  - type: bound
    property: 'A planted additive event effect is recovered by the event block on EVERY indicator column, at n_lags = 0 and at n_lags > 0 alike, rather than being absorbed by the trend, the seasonality or the AR term'
    formal: '∀ j in event columns: |w_j * NpData::scale - effect| / |effect| ≤ equations.event_effect_recovery_rel.float_tolerance, for n_lags in {0, 7}'
    applies_to: all

  - type: determinism
    property: 'The event block is bitwise reproducible at a fixed seed and genuinely seed-dependent, and its autograd tape cost is flat in the event-column count'
    formal: 'bits(train(d, cfg_E, s).event_weights()) == bits(train(d, cfg_E, s).event_weights()) ∧ bits(train(d, cfg_E, s).event_weights()) ≠ bits(train(d, cfg_E, s2).event_weights()) for s2 ≠ s, both at equations.event_training_determinism_bitwise.float_tolerance = 0.0; ∧ tape_len_per_step(E1) - tape_len_per_step(0) == tape_len_per_step(E2) - tape_len_per_step(0) for any two E1, E2 > 0, at equations.event_tape_length_flat_in_columns.float_tolerance = 0.0'
    status: proven
    evidence: 'crates/aprender-forecast/src/events.rs::tests::fixed_seed_event_training_is_bit_identical_and_a_different_seed_differs and ::tests::the_tape_does_not_grow_with_the_event_column_count; and through the PUBLIC DOOR, crates/aprender-forecast/src/forecast.rs::tests::door_level_event_training_is_deterministic_at_a_fixed_seed'

falsification_tests:

  - id: FALSIFY-NP-001
    rule: 'Data preparation matches the NeuralProphet 0.9.0 oracle'
    prediction: 'NpData::new on the Peyton Manning CSV with the oracle split reproduces shift 5.26269018890489, scale 4.582609246193553, t0 2007-12-10, t_span 2596 and all 11 changepoints_t within 1.0e-9, and auto_batch/auto_epochs return exactly 64/80.'
    test: 'cargo test -p aprender-forecast --lib np::parity::data_prep_matches_np_oracle'
    if_fails: 'The soft-normalisation rule (min / q95-min with a numpy-linear percentile), the t0-and-train-span time scaling, or the changepoint linspace diverged from NeuralProphet. Nothing downstream in this contract means anything until this rung is green — every later number is computed on this normalisation.'

  - id: FALSIFY-NP-002
    rule: 'The lag-free model meets the SC3 holdout accuracy bar'
    prediction: 'With seed 42 and the lr selected by lowest final TRAIN loss from {0.01, 0.03, 0.1}, the 365-day-ahead MAE on the held-out Peyton Manning rows is <= 0.47 (measured 0.4463 in this tree; Python NeuralProphet 0.4611 on the same split).'
    test: 'cargo test -p aprender-forecast --lib np::parity::lag_free_365_day_mae_within_contract'
    if_fails: 'Either the training recipe regressed (batch, epochs, one-cycle schedule, weight decay, sample weighting) or the trend/seasonality feature construction changed. Check FALSIFY-NP-004 first: a full-batch regression alone moves this number from 0.45 to 2.6.'

  - id: FALSIFY-NP-003
    rule: 'The AR-Net beats the naive one-step baseline'
    prediction: 'With n_lags 30, ar_layers [32], seed 42 and the lr selected by train loss from {0.03, 0.1}, the one-step MAE over the held-out rows via predict_ar_1step is strictly below the oracle naive_1step_mae_test of 0.34613807677421315 (measured 0.2458 in this tree).'
    test: 'cargo test -p aprender-forecast --lib np::parity::ar_net_30_lags_beats_naive_one_step'
    if_fails: 'The AR head is not learning: check the lag stationarisation (raw lags MINUS the detached trend at the lag times MINUS the seasonality at the lag times), the ReLU between AR layers, or the epoch cap. An AR-Net that cannot beat "repeat the last value" is not a nowcaster.'

  - id: FALSIFY-NP-004
    rule: 'The auto batch size is always a strict mini-batch'
    prediction: 'For n from 64 to 20000 in steps of 97, auto_batch(n) < n and 8 <= auto_batch(n) <= 2048; and auto_batch(2540) == 64.'
    test: 'cargo test -p aprender-forecast --lib np::parity::auto_batch_is_mini_batch_over_grid'
    if_fails: 'Someone "optimised" the batch size. Full-batch training collapses this model to test MAE 2.6168 because the auto-epoch formula assumes mini-batches: 80 epochs of one batch is 80 optimiser steps, not 3200.'

  - id: FALSIFY-NP-005
    rule: 'The Huber loss is graph-connected'
    prediction: 'After weighted_huber(...).backward() on a fresh NpModel, every parameter has Some(grad) and at least one gradient entry has absolute value strictly above 0.0.'
    test: 'cargo test -p aprender-forecast --lib np::parity::weighted_huber_is_graph_connected'
    if_fails: 'The loss was replaced by (or now routes through) a detached implementation — core own smooth-L1 loss in `aprender::nn::loss` is exactly such an implementation and returns None gradients. A detached loss does not fail loudly: it trains to the initialisation and reports a plausible number.'

  - id: FALSIFY-NP-006
    rule: 'A completed fit leaves the autograd tape empty'
    prediction: 'graph_tape_len() == 0 immediately after np::train() returns, and after a completed forecast(model = neuralprophet) call.'
    test: 'cargo test -p aprender-forecast --lib np::parity::train_clears_the_tape'
    if_fails: 'clear_graph() was removed from the step loop or from a predict helper. The tape is thread-local and unbounded, so the leak is invisible in a single fit and fatal in a server that reuses blocking threads (T-06-12).'

  - id: FALSIFY-NP-007
    rule: 'The auto batch size for the Peyton split is NeuralProphet own value, not the full batch'
    prediction: 'auto_batch(2540) == 64.'
    test: 'cargo test -p aprender-forecast --lib np::parity::full_batch_is_not_what_auto_batch_returns'
    if_fails: 'The formula 2^(1 + floor(1.5*log10(n))) clamped to [8, 2048] and capped at n was altered. 64 is the value NeuralProphet 0.9.0 itself reports for this training set, so a different answer is a divergence from the oracle, not a tuning choice.'

  - id: FALSIFY-NP-008
    rule: 'The shipped door refuses the three NeuralProphet-specific misuses'
    prediction: 'forecast(model = neuralprophet) returns ForecastError::Validation whose message contains "supports freq D only" for freq W, "365" for n_lags 366, and "smaller than the series span" for n_lags at or above the training grid span — never Internal, and never a forecast.'
    test: 'cargo test -p aprender-forecast --lib forecast::tests::neuralprophet_refuses'
    if_fails: 'The door defaults where it should refuse (D-11). n_lags above the span is the dangerous one: it reaches the training loop and indexes a window that does not exist.'

  - id: FALSIFY-NP-009
    rule: 'Fourier seasonality features are phased on 1900-01-01'
    prediction: 'For a known day and a known seasonality, fourier_feats reproduces sin(k*2*pi*t/P) then cos(k*2*pi*t/P) with t = day - days_from_civil(1900, 1, 1) exactly, and the same features computed against any other epoch differ.'
    test: 'cargo test -p aprender-forecast --lib np::parity::fourier_features_are_phased_on_1900'
    if_fails: 'The Fourier epoch moved (to the series start, to the Unix epoch, or to Prophet own convention), or the sin-block-then-cos-block layout was interleaved into sin/cos pairs. Either change silently shifts every seasonal phase and invalidates the data-prep parity claim.'

  - id: FALSIFY-NP-010
    rule: 'The learning rate is chosen by lowest final TRAIN loss over the shipped sweep'
    prediction: 'Training the same series at each rate in constants.lr_sweep_lag_free and taking the argmin of the final train loss selects the same rate the shipped arm reports as diagnostics.selected_lr.'
    test: 'cargo test -p aprender-forecast --lib np::parity::lr_selection_is_by_train_loss'
    if_fails: 'Selection now consults something other than the final train loss — most dangerously the test error, which turns the reported MAE into a fitted number rather than a forecast. On Peyton Manning the two criteria disagree (train picks 0.1, test would pick 0.01), so this is not a hypothetical.'

  - id: FALSIFY-NP-011
    rule: 'A planted additive event effect is recovered on every indicator column, with and without AR lags'
    prediction: 'On a 1200-point synthetic daily series carrying a known additive per-indicator effect on six event columns, every learned event weight denormalised by NpData::scale is within equations.event_effect_recovery_rel.float_tolerance (10 %) of the planted magnitude — asserted PER COLUMN, at n_lags = 0 and again at n_lags = 7.'
    test: 'cargo test -p aprender-forecast --lib events::tests::a_planted_effect_is_recovered'
    if_fails: 'Either the block is not being optimised (its parameters were built but never extended into the AdamW vector — check events::tests::the_event_block_weights_are_actually_optimised, which names that cause directly), or the effect is being absorbed by another term. The n_lags = 7 half is the one that catches absorption: spike 014 measured the AR term swallowing a smooth continuous driver almost entirely (a weight of -0.0493 lag-free collapsing to -0.0048 at seven lags), and an absorbed event effect still produces a plausible-looking forecast while the per-event component it reports is wrong.'

  - id: FALSIFY-NP-012
    rule: 'Event training is bitwise deterministic at a fixed seed, genuinely seed-dependent, and flat in tape cost'
    prediction: 'Two fits of the same series with the same event design at seed 42 produce bit-identical event weights AND a bit-identical epoch_loss trace; the same fit at seed 43 produces DIFFERENT weights; and the per-step autograd tape increment over the events-OFF baseline is the same fixed number at 6 event columns and at 280 (measured 20 OFF against 25 ON, an increment of five at both). The determinism half also holds THROUGH THE PUBLIC DOOR, where the learning rate is selected by train loss over a sweep.'
    test: 'cargo test -p aprender-forecast --lib events::tests::fixed_seed_event_training_is_bit_identical_and_a_different_seed_differs events::tests::the_tape_does_not_grow_with_the_event_column_count forecast::tests::door_level_event_training_is_deterministic_at_a_fixed_seed'
    if_fails: 'If the seed-42 halves disagree, something outside the seeded Rng is entering the fit — most likely an unordered iteration or an uncleared tape from a previous fit on the same thread, neither of which changes the arithmetic but both of which make the result unreproducible. If the seed-43 half AGREES, the seed is not reaching the block at all and the determinism claim is vacuous. If the tape increment grows with the column count, clear_graph() is clearing an ever-larger graph and a wide event design leaks tape into every subsequent step, which is the leak tape_cleared_per_step exists to prevent.'

kani_harnesses:

  # DECLARED, NOT EXECUTED. cargo-kani is not installed in this repository and no
  # #[kani::proof] harness exists anywhere under crates/. Each entry names the
  # runnable, identically bounded test that is the ACTUAL evidence.
  - id: KANI-NP-001
    obligation: 'The auto batch size is a strict mini-batch inside the documented clamp for every supported sample count'
    property: 'forall n in [64, 20000]: auto_batch(n) < n && 8 <= auto_batch(n) <= 2048'
    bound: 20000
    strategy: bounded_int
    harness: 'NOT EXECUTED — the evidence is the runnable, identically bounded test `np::parity::auto_batch_is_mini_batch_over_grid` in crates/aprender-forecast/src/np.rs, which enumerates n = 64, 161, 258, ... 19983 (step 97, 206 points) across the whole supported range up to types::MAX_POINTS'

  - id: KANI-NP-002
    obligation: 'The one-cycle learning-rate schedule stays inside (0, max_lr] over the whole progress interval'
    property: 'forall p in [0, 1]: 0 < one_cycle_lr(p, max_lr) <= max_lr'
    bound: 1000
    strategy: bounded_int
    harness: 'NOT EXECUTED — the schedule is three cosine segments between max_lr/100, max_lr/10 and max_lr, so the property is analytic; a bounded checker over f64 progress values would enumerate a discretisation and prove a property about the discretisation. No runnable harness is claimed for this obligation, and it is recorded here rather than silently dropped.'

qa_gate:
  id: F-FORECAST-NP-001
  name: 'NeuralProphet-lite parity and training-rule gate'
  description: >
    The blocking gate for the NeuralProphet-lite correctness claim (SC3) and for the D-10 training
    rules. Every check below is a test in `crates/aprender-forecast/src/np.rs::parity` or
    `src/forecast.rs::tests`, and every numeric bar it asserts is read from THIS file at test time.
    A rung that has only ever been observed passing is not evidence: each FALSIFY-NP test must have
    been seen RED under an induced change to this file alone.
  checks:
    - 'contract schema validity (pv validate, zero errors) and non-zero pv status counts'
    - 'data preparation matches the NeuralProphet 0.9.0 oracle to 1e-9, and auto batch/epochs match exactly'
    - 'lag-free 365-day-ahead holdout MAE <= 0.47 with the lr selected by TRAIN loss'
    - 'AR-Net (30 lags, hidden [32]) one-step MAE beats the oracle naive baseline'
    - 'weighted_huber is graph-connected: Some(grad) with a non-zero entry on every parameter'
    - 'auto_batch is a strict mini-batch over the whole supported range, and 64 on the Peyton split'
    - 'the autograd tape is empty after train() and after a completed neuralprophet forecast'
    - 'the three NeuralProphet-specific door refusals are Validation-class with fix-naming messages'
    - 'no tolerance literal inside the np parity test module — every bar is contract-read'
  pass_criteria: 'All FALSIFY-NP tests pass and each numeric one was observed RED under an induced tolerance change made in this file alone.'
  falsification: >
    OBSERVED, not merely prescribed. Changing ONLY this file — `lag_free_holdout_mae.float_tolerance`
    0.47 -> 0.40 and `ar_net_vs_naive_margin.float_tolerance` 0.0 -> 0.20, with not one line of Rust
    touched — turns exactly FALSIFY-NP-002 and FALSIFY-NP-003 red (7 passed / 2 failed), and each
    failure QUOTES THE NEW BAR: "holdout MAE 0.4463 exceeds the contract bar 0.4" and "one-step MAE
    0.2458 must beat the oracle's naive baseline 0.3461 by more than 0.2". A byte-identical
    `git checkout` of this file restores 9 passed / 0 failed. That is the proof the ladder reads its
    bars from here at test time rather than duplicating them as literals. Note that
    `huber_grad_min_abs` CANNOT be induced-RED by tightening: it is a strict `> 0.0` connectivity
    check, and raising it above zero would test gradient MAGNITUDE, which is a different and
    seed-dependent property. Its induced negative is a code mutation instead — route
    `weighted_huber` through a detached loss and observe None gradients.
