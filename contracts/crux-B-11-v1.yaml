# CRUX-B-11 — FP8 quantization H100+

metadata:
  id: CRUX-B-11
  version: "1.3.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: partial
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "B — Inspection & Debugging"
  competitor: vllm
  demand_score: 3
  intake_status: missing
  description: >
    FP8 (E4M3/E5M2) quantization targeted at Hopper/Blackwell GPUs.
    Canonical: `vllm serve --quantization fp8` dispatches TransformerEngine
    FP8 GEMM; llama.cpp has `--type f8_e4m3` in experimental branches.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - 'https://arxiv.org/abs/2209.05433 — FP8 Formats for Deep Learning (NVIDIA/Arm/Intel)'
  - 'https://docs.nvidia.com/deeplearning/transformer-engine/ — TransformerEngine FP8 spec'
equations:
  fp8_scaled_roundtrip:
    formula: |
      W_fp8 = round(W_fp16 / scale, E4M3_ULP) with scale = max(|W|) / 448.0
      dequant(W_fp8) = W_fp8 * scale
      invariant: |dequant(W_fp8) - W_fp16| / |W_fp16| ≤ 0.01  (1% Frobenius relative err)
    domain: "(W: Tensor<f16>, fmt ∈ {E4M3, E5M2})"
    codomain: "Tensor<fp8> + scalar scale (per-tensor or per-channel)"
    invariants:
    - "E4M3 range [−448, +448], 7-bit mantissa; E5M2 range [−57344, +57344]"
    - "relative Frobenius err ≤ 1% vs fp16 on all linear weights"
    - "on non-Hopper GPU, apr quantize --fp8 exits 2 with capability-required msg"

falsification_tests:
- id: FALSIFY-CRUX-B-11-001
  rule: fp8 round-trip preserves within 1% Frobenius
  prediction: "|W_fp16 - dequant(quant_fp8(W_fp16))|_F / |W_fp16|_F ≤ 0.01"
  test: |
    set -euo pipefail
    apr quantize tests/fixtures/small-fp16.safetensors --format fp8-e4m3 -o /tmp/fp8.apr
    python3 - <<'PY'
    import numpy as np, safetensors.numpy as st
    orig = st.load_file("tests/fixtures/small-fp16.safetensors")
    dequant = __import__("subprocess").check_output(["apr","dequant","/tmp/fp8.apr","--format","npz","-o","/tmp/deq.npz"])
    deq = np.load("/tmp/deq.npz")
    for k, w in orig.items():
      err = np.linalg.norm(w - deq[k]) / np.linalg.norm(w)
      assert err <= 0.01, f"{k}: err={err:.4f}"
    PY
  if_fails: rule 'fp8 round-trip preserves within 1% Frobenius' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/fp8_classifier.rs
    cli_path: crates/apr-cli/src/commands/fp8_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_b_11.rs
    e2e_tests:
    - falsify_crux_b_11_001_frobenius_ok_on_identical_vectors
    - falsify_crux_b_11_001_frobenius_rejects_degraded_reconstruction
    - falsify_crux_b_11_001_frobenius_rejects_length_mismatch
    - falsify_crux_b_11_001_frobenius_rejects_zero_original
    sub_claim: |
      Algorithm-level necessary conditions:
        (a) `e4m3_positive_finites` enumerates exactly 127 ascending
            finite magnitudes with endpoints 2⁻⁹ and 448 per the E4M3-FN
            spec (NaN slot absent; no ±∞);
        (b) `e4m3_round_to_nearest` is argmin over {0} ∪ positive finites,
            identity on representable values, saturation-clamping
            at ±448, sign-preserving, NaN-propagating, tie-deterministic
            (first-min wins → reproducible);
        (c) `fp8_absmax_scale = max(|W|)/448` places the largest input
            at the E4M3 max (zero tensor → neutral 1.0);
        (d) `relative_frobenius_error` is `None` on length mismatch
            or zero-norm original (ill-defined ratio), not a silent 0;
        (e) `classify_frobenius_error` returns `Ok{rel_err}` only when
            rel_err ≤ `FP8_MAX_FROBENIUS_REL_ERR` (0.01), `Degraded`
            otherwise, surfacing the threshold, and `InvalidInput` on
            pipeline errors rather than falsely passing.
        (f) End-to-end absmax round-trip on a deterministic 4096-element
            LCG uniform in [-1,1] satisfies the synthetic algorithm-correctness
            guard (rel_err < 0.05) with a lower bound > 1e-4 to guard against
            a broken test. The paper's 1% bound requires real LLM weight
            statistics and is the full-discharge condition below.
    tests:
    - e4m3_max_finite_is_exactly_448
    - e4m3_positive_finites_has_exactly_126_entries
    - e4m3_positive_finites_are_sorted_ascending_and_unique
    - e4m3_positive_finites_endpoints_match_spec
    - e4m3_round_on_exactly_representable_is_identity
    - e4m3_round_clamps_above_max
    - e4m3_round_preserves_sign_through_zero
    - e4m3_round_nan_is_nan
    - e4m3_round_tiny_value_goes_to_zero_or_smallest_subnormal
    - absmax_scale_zero_vector_is_one
    - absmax_scale_puts_max_at_448
    - roundtrip_zero_vector_is_zero
    - roundtrip_preserves_sign
    - frobenius_norm_zero_vector_is_zero
    - frobenius_norm_unit_basis_is_one
    - relative_frobenius_error_identical_is_zero
    - relative_frobenius_error_length_mismatch_is_none
    - relative_frobenius_error_zero_original_is_none
    - classify_frobenius_under_threshold_is_ok
    - classify_frobenius_above_threshold_is_degraded
    - classify_frobenius_length_mismatch_is_invalid
    - fp8_mean_roundtrip_error_under_synthetic_uniform_bound
    scope: "E4M3 table + round-to-nearest + absmax-scaled round-trip + rel-Frobenius classifier (pure f32).
      NOTE: the synthetic test asserts `FP8_MAX_FROBENIUS_REL_ERR_SYNTHETIC = 0.05`,
      not the paper's 1% bound, because the contract's 1% figure is empirical
      on real LLM linear weights (Gaussian-ish) and does not hold under uniform
      [-1,1] input where per-element ULP error dominates."
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "`apr quantize --format fp8-e4m3` + `apr dequant` CLI surfaces + Hopper hardware for bit-exact TransformerEngine parity check"

- id: FALSIFY-CRUX-B-11-002
  rule: non-Hopper GPU rejected with exit 2
  prediction: "apr quantize --fp8 on sm<90 prints 'requires Hopper/Blackwell' and exits 2"
  test: |
    set -e
    # Simulate by forcing capability detection off
    APR_CUDA_SM_OVERRIDE=80 apr quantize tests/fixtures/small-fp16.safetensors --format fp8-e4m3 -o /tmp/bad.apr 2>/tmp/err && exit 1 || [ $? -eq 2 ]
    grep -Ei "hopper|sm_?90|capability" /tmp/err

  if_fails: rule 'non-Hopper GPU rejected with exit 2' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/fp8_classifier.rs
    cli_path: crates/apr-cli/src/commands/fp8_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_b_11.rs
    e2e_tests:
    - falsify_crux_b_11_002_capability_ok_on_sm_90
    - falsify_crux_b_11_002_capability_ok_on_sm_100_blackwell
    - falsify_crux_b_11_002_capability_rejects_sm_80_ampere
    - falsify_crux_b_11_002_capability_rejects_sm_0_unknown
    sub_claim: |
      Algorithm-level necessary condition: `classify_sm_capability`
      admits sm ≥ `FP8_MIN_HOPPER_SM` (90) as `Capable`, and every
      smaller value as `Incapable { required=90, exit_code=2, message }`
      where the message names "hopper", "sm_90", or "capability" —
      satisfying the grep oracle in the original test. The classifier
      is a pure, deterministic function of the SM number and has a
      single branch boundary at sm=90 (tested both sides).
    tests:
    - sm_90_is_capable
    - sm_100_blackwell_is_capable
    - sm_120_next_gen_is_capable
    - sm_80_ampere_is_incapable_exit_2
    - sm_86_ampere_incapable_message_mentions_hopper
    - sm_0_unknown_gpu_is_incapable
    - sm_capability_is_deterministic
    - capability_boundary_is_sm_90_inclusive
    scope: "SM capability → (Capable | Incapable{exit_code=2, message}) classifier"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "wiring `APR_CUDA_SM_OVERRIDE` + `apr quantize --format fp8-e4m3` exit-code path through clap"

proof_obligations:
- type: equivalence
  property: "apr quantize --fp8 matches `vllm serve --quantization fp8` numerical envelope (≤1% Frobenius)"
- type: invariant
  property: "FP8 quantize on sm<90 fails fast with actionable capability msg"
- type: invariant
  property: "per-tensor scale stored in metadata; dequant is exact inverse modulo FP8 ULP"

