  - date: '2026-04-18'
    revision: '4.9'
    author: kaizen-paiml
    summary: >
      PMAT-CODE-PERMISSIONS-001 closed — permission-modes row flipped
      NONE → SHIPPED. New crates/aprender-orchestrate/src/agent/
      permission.rs ships the full Claude-Code permission-mode lattice:
      `PermissionMode::{Default, Plan, AcceptEdits, BypassPermissions}`
      with serde `#[serde(rename_all = "camelCase")]` to match Claude's
      JSON surface; `PermissionVerdict::{Allow, Ask, Block}` is the
      per-capability decision. `verdict(&Capability)` encodes the
      matrix: Bypass allows everything; Plan blocks writes/shell/
      network but allows reads + Memory + Rag; AcceptEdits auto-allows
      reads + writes but asks on shell/network; Default asks on
      everything mutating. `parse()` accepts canonical camelCase +
      kebab-case + snake_case with whitespace trimming so the
      `--permission-mode` CLI flag, TOML manifest field, and
      `/permissions <mode>` slash command all share one happy path.
      `next()` cycles in Claude's Shift+Tab order (default → plan →
      acceptEdits → bypassPermissions → default) so the REPL can wire
      a single key handler. `would_run_unattended()` helper lets
      `apr code -p <prompt>` batch mode short-circuit when a tool
      would prompt. 15 unit tests cover every mode × cap combination,
      every parse alias + whitespace, serde JSON round-trip (asserts
      camelCase on the wire), Display, next-cycle, unattended helper.
      **Headline 11/3/7 → 12/3/6 over 21 rows**. **ALL P0 + P1
      TICKETS NOW CLOSED.** SHIPPED cap (≥9) still MET; MISSING cap
      (≤4) still needs 2 more MISSING→{SHIPPED,PARTIAL} flips. All
      6 remaining MISSING rows are P2 deferred surfaces (notebook,
      monitor, plugins, IDE, status-line, org-policy). Follow-up
      PMAT-CODE-PERMISSIONS-RUNTIME-001 (P2) wires Shift+Tab +
      `/permissions` + prompt-loop runtime — the primitive is ready
      for call sites today.
  - date: '2026-04-18'
