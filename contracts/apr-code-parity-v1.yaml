# ─────────────────────────────────────────────────────────────────────────────
# Falsification gates
# ─────────────────────────────────────────────────────────────────────────────

falsification_conditions:

  - id: FALSIFY-CODE-PARITY-001
    name: Row-by-row mechanical audit
    status: DRAFT
    description: >
      For every entry in `categories`, CI re-runs `cross_check_command`
      and asserts the output satisfies the row's `expected_*` constraint.
      A row whose cross_check fails indicates either (a) the code changed
      and the matrix is stale, or (b) the matrix lied. Either way this
      contract must be updated before the PR can merge.

      Harness: `pv validate contracts/apr-code-parity-v1.yaml` via the
      in-tree `aprender-contracts-cli` crate. Bash/shell harnesses are
      forbidden — see CLAUDE.md § "Contract Validation: DOGFOOD pv,
      NEVER bash". If `pv validate` does not yet support
      `kind: ParityMatrixContract`, the fix is PMAT-CONTRACTS-PARITY-001
      (extend `aprender-contracts/src/schema/` to add the new kind +
      validator rule that runs each row's cross_check_command and
      asserts the expected_* constraint). NOT a bash wrapper.
    test_harness:
      tool: aprender-contracts-cli     # in-tree dogfooded validator
      binary: pv
      command: pv validate contracts/apr-code-parity-v1.yaml
      expected_exit_code_on_pass: 0
      expected_exit_code_on_drift: 1
    planned_tests: PLANNED_M4_BETA
    schema_extension_ticket: PMAT-CONTRACTS-PARITY-001

  - id: FALSIFY-CODE-PARITY-002
    name: Headline aggregate invariant
    status: DRAFT
    description: >
      Counts statuses across all 20 rows and asserts the aggregate
      matches `headline.counts`. Adding a new category without bumping
      `audit_revision` and re-counting is rejected.
      Harness: `pv validate` (same tool as -001; a schema rule that
      counts status values and asserts equality with headline.counts).
    test_harness:
      tool: aprender-contracts-cli
      binary: pv
      command: pv validate contracts/apr-code-parity-v1.yaml
    planned_tests: PLANNED_M4_BETA

  - id: FALSIFY-CODE-PARITY-003
    name: Prose ↔ YAML drift check
    status: DRAFT
    description: >
      Parses the matrix table in docs/specifications/apr-mcp-server-spec.md
      and asserts row-for-row that every `(category, status, ticket)`
      tuple matches this YAML. Prevents the prose from drifting from the
      contract (or vice versa).
      Harness: `pv validate` with a `--check-doc-drift` mode (new
      subflag to add under PMAT-CONTRACTS-PARITY-001 scope), reading
      the markdown table from the path named in `metadata.spec`.
    test_harness:
      tool: aprender-contracts-cli
      binary: pv
      command: pv validate contracts/apr-code-parity-v1.yaml --check-doc-drift
    planned_tests: PLANNED_M4_BETA

  - id: FALSIFY-CODE-PARITY-004
    name: P0 closure gate
    status: DRAFT
    description: >
      When any of the 4 P0 tickets (MCP-CLIENT, SLASH-PARITY, HOOKS,
      SPAWN-PARITY) is marked closed in the roadmap, CI asserts the
      corresponding row's `status` has been updated in this file AND
      the headline `shipped` count has been incremented.
    planned_tests: PLANNED_M5

  - id: FALSIFY-CODE-PARITY-005
    name: Epic closure gate (headline reaches ≥9/7/≤4)
    status: DRAFT
    description: >
      Epic PMAT-CODE-PARITY-MATRIX-001 cannot be marked closed while
      `headline.counts` has shipped < 9 or missing > 4.
    acceptance_criterion:
      - headline.counts.shipped >= 9
      - headline.counts.missing <= 4
    planned_tests: PLANNED_M6

