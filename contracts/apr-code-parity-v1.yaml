    author: kaizen-paiml
    summary: >
      PMAT-CODE-WORKTREE-001 closed — worktree-isolation row flipped
      NONE → SHIPPED. New crates/aprender-orchestrate/src/agent/
      worktree.rs ships the full `git worktree`-backed isolation
      lifecycle: `WorktreeSession::create(repo, branch)` shells out to
      `git worktree add -b <branch> <.git/apr-worktrees/<sanitized>>`,
      `.is_dirty()` probes via `git status --porcelain`,
      `.auto_close_if_clean()` returns `Ok(None)` on clean (removing
      worktree + deleting branch) or `Ok(Some((path, branch)))` on
      dirty (caller keeps it — Claude-Code-parity semantic), and the
      Drop impl is intentionally a no-op so callers must pick an
      explicit disposition (Poka-Yoke — prevents silent discard of
      agent work). Branch-name sanitizer maps non-alphanumeric
      characters to `-` so `feature/x/y` becomes `feature-x-y` under
      `.git/apr-worktrees/`. 8 unit tests shell out to a real git
      binary against `tempfile::tempdir()` repos (with
      `core.hooksPath=/dev/null` to isolate from parent-repo pmat
      pre-commit hooks) and gracefully skip when git isn't on PATH.
      **Headline 10/3/8 → 11/3/7 over 21 rows**. SHIPPED cap (≥9)
      still MET; MISSING cap (≤4) still needs 3 more
      MISSING→{SHIPPED,PARTIAL} flips. Remaining P1: permission-modes.
      Then 2 of the 6 P2 deferred rows close the epic. Follow-up
      PMAT-CODE-WORKTREE-RUNTIME-001 (P2) wires the primitive into
      SpawnConfig + AgentPool::spawn.
