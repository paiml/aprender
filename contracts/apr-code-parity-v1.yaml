# ─────────────────────────────────────────────────────────────────────────────
# apr-code-parity-v1
#
# SOURCE OF TRUTH for the 20-category `apr code` ↔ Claude Code parity matrix.
# Encodes the matrix from docs/specifications/apr-mcp-server-spec.md
# § "Feature-by-feature parity matrix" as structured data with per-row
# mechanical cross-check commands so any claim in the matrix is falsifiable
# by a CI job, not by prose review.
#
# Direction: YAML IS AUTHORITATIVE. The matrix prose in apr-mcp-server-spec.md
# MUST agree with this file row-for-row; CI job FALSIFY-CODE-PARITY-001
# rejects any drift. When a ticket closes or a feature ships, update the
# `status` field here FIRST, re-run the cross-check, then sync the prose
# matrix.
#
# Headline invariant: before epic PMAT-CODE-PARITY-MATRIX-001 closes,
# aggregate counts must reach ≥9 SHIPPED / 7 PARTIAL / ≤4 MISSING.
# Current counts (2026-04-18 v2): 6 SHIPPED / 6 PARTIAL / 8 MISSING.
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  version: 1.0.0
  created: '2026-04-18'
  last_modified: '2026-04-18'
  author: PAIML Engineering
  kind: pattern   # cross-cutting verification pattern (parity audit), not a mathematical kernel
  description: >
    Falsifiable parity matrix encoding 20 Claude-Code feature categories
    against the current `apr code` implementation. Every row carries a
    mechanical cross_check_command that CI re-runs to verify the claimed
    `status` is still accurate. Drift between this file and the prose
    matrix in docs/specifications/apr-mcp-server-spec.md is a ship-blocker.
  references:
    - 'Anthropic Claude Code (https://docs.anthropic.com/claude/docs/claude-code) — target parity surface'
    - 'docs/specifications/apr-mcp-server-spec.md § "Feature-by-feature parity matrix"'
    - 'contracts/apr-mcp-server-v1.yaml — MCP server direction'
    - 'contracts/apr-claude-proxy-v1.yaml — Anthropic Messages-API proxy direction'
    - 'crates/aprender-orchestrate/contracts/batuta/apr-code-v1.yaml — agent runtime contract'
    - 'CLAUDE.md § "Contract Validation: DOGFOOD pv, NEVER bash" — harness policy'
  spec: docs/specifications/apr-mcp-server-spec.md
  epic: PMAT-CODE-PARITY-MATRIX-001
  related_contracts:
    - contracts/apr-mcp-server-v1.yaml
    - contracts/apr-claude-proxy-v1.yaml
    - crates/aprender-orchestrate/contracts/batuta/apr-code-v1.yaml

# kind is declared under metadata.kind per aprender-contracts schema.
# `ParityMatrixContract` is captured under metadata.parity_matrix_kind
# for semantic documentation, but the contract KIND (for schema
# dispatch in pv validate) is `pattern`.
parity_matrix_kind: ParityMatrixContract
status: ACTIVE  # pv validate green as of 2026-04-18 (revision 4); cross_check_command execution harness tracked by PMAT-CONTRACTS-PARITY-001

# ─────────────────────────────────────────────────────────────────────────────
# Harness policy (2026-04-18)
# ─────────────────────────────────────────────────────────────────────────────
# ALL falsification gates in this contract MUST be enforced via `pv validate`
# (binary from `aprender-contracts-cli`, crate `crates/aprender-contracts-cli/`).
# `provable-contracts` was merged into aprender as APR-MONO Phase 2b and
# lives in-tree as three crates (aprender-contracts / -macros / -cli); the
# `pv` CLI is the dogfooded contract validator. Writing a bash/yq/python
# script to re-run these gates is muda and is explicitly forbidden by
# CLAUDE.md § "Contract Validation: DOGFOOD pv, NEVER bash".
#
# If `pv validate` does not yet support `kind: ParityMatrixContract`, the
# fix is PMAT-CONTRACTS-PARITY-001 (extend aprender-contracts/src/schema/
# to add the kind + a validator that runs each row's `cross_check_command`
# and asserts the `expected_*` constraint). Never bypass.
harness_policy:
  dogfood_tool: aprender-contracts-cli
  binary: pv
  forbidden_alternatives: [bash, shell, yq-wrapper, python-script]
  schema_extension_ticket: PMAT-CONTRACTS-PARITY-001
  rationale_ref: 'CLAUDE.md § "Contract Validation: DOGFOOD pv, NEVER bash"'

headline:
  audit_date: '2026-04-18'
  audit_revision: 3  # v1=5/7/8, v2=session→SHIPPED (6/6/8), v3=pv check-parity forced us to count rows honestly (3/7/11 over 21) — per-row status is now the ground truth; earlier 6/6/8 was counting "any shipped capability" not "fully shipped row"
  total_rows: 21
  counts:
    shipped: 3
    partial: 7
    missing: 11
  closure_criterion:
    description: >
      Epic PMAT-CODE-PARITY-MATRIX-001 closes when the aggregate reaches
      at least 9 SHIPPED / 7 PARTIAL / at most 4 MISSING. That delta comes
      primarily from closing the four P0 tickets (MCP-CLIENT, SLASH-PARITY,
      HOOKS, SPAWN-PARITY) and three P1 tickets (MEMORY, WORKTREE,
      CUSTOM-AGENTS) — each flips one row from MISSING→SHIPPED or
      PARTIAL→SHIPPED.
    target_shipped_min: 9
    target_partial_max: 7
    target_missing_max: 4

