metadata:
  version: 1.0.0
  created: '2026-10-29'
  author: PAIML Engineering
  description: "aprender-cbtop PCIe collector legal link widths (#6291) — the code constant VALID_WIDTHS and the spec's link_width_valid assertion agree on one set: x0 (link down/unknown) plus the PCIe widths x1, x2, x4, x8, x12, x16, x32."
  kind: pattern
  references:
    - "crates/aprender-cbtop/src/bricks/collectors/pcie.rs — VALID_WIDTHS, width_valid"
    - "docs/specifications/aprender-compute/compute-block-tui-cbtop.md — link_width_valid"
    - "aprender#6291 — spec/code width-set disagreement"

equations:
  legal_link_width:
    formula: "w in {0, 1, 2, 4, 8, 12, 16, 32}"
    domain: "u8 current_link_width read from sysfs"
    codomain: "bool (width accepted)"
    invariants:
      - "sentinel widths such as 63 and 255 are rejected"
      - "x12 and x32 are legal PCIe widths and are accepted"
      - "an empty history verifies vacuously"

proof_obligations:
  - id: CBTOP-PCIEW-INV-001
    type: invariant
    property: "the code width set equals the contract set"
    formal: "VALID_WIDTHS == [0,1,2,4,8,12,16,32]"
    applies_to: legal_link_width
  - id: CBTOP-PCIEW-INV-002
    type: invariant
    property: "non-PCIe widths are rejected"
    formal: "w in {3,5,6,7,24,63,255} => not valid"
    applies_to: legal_link_width

falsification_tests:
  - id: FALSIFY-CBTOP-PCIEW-001
    rule: "width set edited without the contract"
    prediction: "dropping 12 or 32 from VALID_WIDTHS turns test_valid_widths_match_contract_set RED"
    test: "cargo test -p aprender-cbtop --lib test_valid_widths_match_contract_set"
    if_fails: "the width set can drift from the spec again"
  - id: FALSIFY-CBTOP-PCIEW-002
    rule: "sentinel accepted"
    prediction: "adding 63 to VALID_WIDTHS turns test_width_valid_rejects_invalid_and_accepts_empty_history RED"
    test: "cargo test -p aprender-cbtop --lib test_width_valid_rejects_invalid_and_accepts_empty_history"
    if_fails: "unknown-width sentinels are unguarded"
