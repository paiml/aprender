contract: trueno-zram-cli-surface
metadata:
  kind: pattern
  version: "1.0.0"
  description: >
    ONT-10 binary slice S11: the CLI surface of the `trueno-zram` binary (package aprender-zram-cli).
    It pins the invariants that `crates/aprender-zram-cli/tests/cli_surface_gate.rs`
    enforces against the binary built from HEAD (CARGO_BIN_EXE_trueno-zram, never PATH).
    Shape follows contracts/pv-cli-surface-v1.yaml. Defects found by the
    2026-09-26 surface probe: none. The crate had no integration test before this gate.
  references:
    - "contracts/pv-cli-surface-v1.yaml"
    - "contracts/apr-mono-binary-rule-v1.yaml"
    - "crates/aprender-zram-cli/tests/cli_surface_gate.rs"
equations:
  version_pinned:
    formula: "contains(stdout(trueno-zram --version), CARGO_PKG_VERSION(aprender-zram-cli))"
    domain: "the binary built from this tree"
    codomain: "{true, false}"
    invariants:
      - "resolved via CARGO_BIN_EXE_trueno-zram, which cannot fall back to a stale PATH copy"
  surface_pinned:
    formula: "subcommands(trueno-zram --help) \\ {help} = [create, remove, status, benchmark]"
    domain: "the Commands: section of --help"
    codomain: "{equal, differs}"
    invariants:
      - "adding or removing a subcommand edits the gate's SUBCOMMANDS list and this formula together"
  advertised_implies_reachable:
    formula: "forall s in subcommands(trueno-zram --help) . exit_code(trueno-zram s --help) = 0"
    domain: "every subcommand the binary advertises"
    codomain: "{0, non-zero}"
    invariants:
      - "the universe is enumerated from the binary, not hardcoded"
  unknown_subcommand_is_usage_error:
    formula: "exit_code(trueno-zram no-such-subcommand) = 2"
    domain: "an argv whose first word is not a subcommand"
    codomain: "{0, 1, 2, other}"
  unusable_input_is_rejected:
    formula: >
      forall (s, i) in rejection_rows . exit_code(trueno-zram s i) not in {0, 101}
      and not contains(stderr, "panicked")
    domain: "`create -d 17` (outside 0..=16) and `--format bogus`; both are clap-level, so the gate never touches a zram device; unusable inputs = {missing path, empty file, garbage bytes}"
    codomain: "{rejected, accepted, panicked}"
    invariants:
      - "a panic (101) is not a rejection: it is the crash this row exists to catch"
proof_obligations:
  - id: ZRMS-INV-001
    type: invariant
    property: "trueno-zram --version reports the version of the crate it was built from"
    formal: "ZRMS-VERSION-PINNED"
    applies_to: all
  - id: ZRMS-INV-002
    type: invariant
    property: "The advertised subcommand set is the pinned surface"
    formal: "ZRMS-SURFACE-PINNED"
    applies_to: all
  - id: ZRMS-INV-003
    type: invariant
    property: "Every advertised subcommand is reachable"
    formal: "ZRMS-ADVERTISED-REACHABLE"
    applies_to: all
  - id: ZRMS-INV-004
    type: invariant
    property: "An unknown subcommand is a usage error (exit 2)"
    formal: "ZRMS-UNKNOWN-IS-USAGE"
    applies_to: all
  - id: ZRMS-INV-005
    type: invariant
    property: "Input the binary cannot process is rejected with a clean non-zero exit"
    formal: "ZRMS-REJECTS-UNUSABLE"
    applies_to: all
falsification_tests:
  - id: FALSIFY-ZRMS-001
    rule: "ZRMS-VERSION-PINNED"
    prediction: "`trueno-zram --version` exits 0 and contains CARGO_PKG_VERSION."
    test_harness: "cargo test -p aprender-zram-cli --test cli_surface_gate version_reports_the_crate_version"
    expected_output: "exit 0"
    if_fails: "The binary under test is not the one this tree builds, or --version lost the crate version."
  - id: FALSIFY-ZRMS-002
    rule: "ZRMS-SURFACE-PINNED"
    prediction: "`trueno-zram --help` advertises exactly: create, remove, status, benchmark."
    test_harness: "cargo test -p aprender-zram-cli --test cli_surface_gate advertised_subcommands_are_the_pinned_surface"
    expected_output: "exit 0"
    if_fails: "A subcommand was added or removed without updating the surface contract."
  - id: FALSIFY-ZRMS-003
    rule: "ZRMS-ADVERTISED-REACHABLE"
    prediction: "Every advertised subcommand exits 0 for `<cmd> --help`."
    test_harness: "cargo test -p aprender-zram-cli --test cli_surface_gate every_advertised_subcommand_is_reachable"
    expected_output: "exit 0"
    if_fails: "A command is advertised but unreachable (the #2527 defect class)."
  - id: FALSIFY-ZRMS-004
    rule: "ZRMS-UNKNOWN-IS-USAGE"
    prediction: "`trueno-zram no-such-subcommand` exits 2."
    test_harness: "cargo test -p aprender-zram-cli --test cli_surface_gate unknown_subcommand_is_a_usage_error"
    expected_output: "exit 0"
    if_fails: "The parser accepted an unknown subcommand or mapped a usage error to another code."
  - id: FALSIFY-ZRMS-005
    rule: "ZRMS-REJECTS-UNUSABLE"
    prediction: "Each rejection row exits non-zero, not 101, with no panic on stderr."
    test_harness: "cargo test -p aprender-zram-cli --test cli_surface_gate unusable_input_is_rejected"
    expected_output: "exit 0 on an unmutated tree"
    if_fails: >
      MEASURED 2026-09-26 (aprender-01): 5/5 GREEN. Both rows are clap value checks; no source mutation was run for this binary.
qa_gate:
  id: F-ZRMS-001
  name: "trueno-zram CLI surface gate (ONT-10 S11)"
  checks:
    - "version_pinned"
    - "surface_pinned"
    - "advertised_implies_reachable"
    - "unknown_subcommand_is_usage_error"
    - "unusable_input_is_rejected"
  pass_criteria: >
    All 5 falsification tests pass via `cargo test -p aprender-zram-cli --test cli_surface_gate`.
