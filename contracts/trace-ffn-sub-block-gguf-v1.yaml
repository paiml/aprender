metadata:
  id: C-TRACE-FFN-SUB-BLOCK-GGUF
  version: 1.7.0
  created: '2026-05-06'
  author: PAIML Engineering
  kind: pattern
  status: ACTIVE_ALGORITHM_LEVEL
  description: |
    GGUF-side sub-FFN telemetry extension — sibling pattern to
    `trace-ffn-sub-block-v1` (which extends APR's `AprTransformer::
    forward_traced`). This contract pins the GGUF-side equivalent
    `OwnedQuantizedModel::forward_traced` so SHIP-007 layer-3
    bisection can compare APR-side ffn_swigl std vs GGUF-side
    ffn_swigl std on the same canonical 7B teacher prompt.

    BACKGROUND: SHIP-007 layer-3 ffn_swigl bisection (§21 spec
    v2.66.0, aprender PR #1072 squash 211edeafc) narrowed the bug
    to "(layer=3, ffn_swigl element-wise multiply)" on the APR
    forward path:
    - Layer 3 ffn_swigl std = 1.222 (17.2× layer-2 baseline 0.071)
    - Cascades to layer 3 ffn_out std = 11.459 (53× layer-2)
    - gate/up individually normal at layer 3
    - silu(gate) at layer 3 is 3.2× baseline (precursor)

    The §21 falsification cannot distinguish two competing
    hypotheses without GGUF-side per-layer sub-FFN telemetry:

      H1: Token-position-dependent correlation — at the 7-token
          prompt, layer 3 tokens produce correlated gate/up not
          present at layers 1-2 (NORMAL model behavior).
      H2: APR-side bug — APR forward path produces different
          VALUES than GGUF (despite SHIP-003 PR #1059 proving
          weights are byte-equivalent at cos≥0.9999999).

    The bisection between H1 and H2 requires running `apr trace
    --payload` on both sides and comparing layer-3 ffn_swigl std.
    GGUF currently has NO `forward_traced` method — only
    `forward_*` orchestrators in `crates/aprender-serve/src/gguf/
    inference/forward/*`. This contract pins the architecture for
    adding GGUF-side traced forward.

    SCOPE: extends `trace-ffn-sub-block-v1` (APR sibling) with
    the parallel GGUF-side method, using the same 5 sub-FFN
    fields:
      - gate_proj_out (post gate matmul)
      - up_proj_out (post up matmul)
      - silu_gate (post silu activation on gate)
      - swiglu_inner (silu_gate * up_proj_out, the swigl product)
      - ffn_down_out (post down matmul, pre-residual)

    Mirrors the proven `trace-moe-gpu-sub-stages-v1` pattern that
    closed the M-GPU-MOE-1.4 NaN bisection at L6 moe_ffn_out via
    qtype-aware dispatch fix (M85 PR #1529 squash `89cb26af7`):
    extend an existing trace surface to a sibling implementation
    path WITHOUT modifying production hot paths (additive-purity
    invariant).

    THE GOAL: extend `OwnedQuantizedModel::forward_traced` (NEW
    method) so a future SHIP-007 layer-3 bisection PR can run
    `apr trace --json --payload` on both APR forward AND GGUF
    forward, diff per-layer ffn_swigl std, distinguish H1 from
    H2, and either:
    - confirm H1 (normal model behavior — SHIP-007 root cause is
      ELSEWHERE, likely in lm_head or post-FFN residual)
    - confirm H2 (APR-side bug — fix at `inference.rs:160-164`
      element-wise multiply at SwiGLU site)

    Per memory `project_ship_007_layer_3_swiglu_bisection.md`,
    this gap blocks SHIP-007 root-cause from being pinned to a
    specific code line; it transitively blocks 5 MODEL-1
    PARTIALs (SHIP-002, SHIP-005, SHIP-006, SHIP-007, SHIP-008).

    PRIOR-WORK DISCOVERY (during contract authoring):
    PRs #1081 (scaffold, PR A) + #1082 (sub-FFN populate, PR B)
    have ALREADY shipped the dense-path forward_traced for GGUF.
    The 4 sub-FFN ActivationStats slots are populated for SwiGLU
    paths. So M-FFN-GGUF-1 + M-FFN-GGUF-2 are SHIPPED (retroactive
    discovery; contract authored AFTER the work). M-FFN-GGUF-3
    (heavy comparison harness for layer-3 ffn_swigl) and
    M-FFN-GGUF-4 (SHIP-007 fix PR cites H1 or H2) remain OPEN.

    The contract still serves a load-bearing purpose: it pins the
    architecture explicitly so future cascade extensions (heavy
    harness + fix) have a clear discharge path, and it cross-
    references the prior-work PRs for anyone reading the contract
    surface for the first time.

    v1.7.0 AMENDMENT (2026-05-06): A3 (Q4K BLOCK-SCALE VARIANCE) FALSIFIED.

    M95 (v1.6.0 amendment) recorded a 28× magnitude gap between
    M95's synthetic 0.4391% (5-tensor chained) and §27's 1723%
    (18.23× std-ratio at layer-3 ffn_swigl). Three candidate
    amplifiers were pinned: A1 (RoPE phase amplification),
    A2 (Softmax saturation), A3 (Real-weight magnitude variance).

    A3 was the strongest candidate because real Qwen Q4K weights
    have huge per-tensor magnitude variance not present in
    synthetic tests. The hypothesis: per-block scale variance
    amplifies M94 mechanism beyond linear-scaling.

    Authored a sixth lib-only falsifier (FALSIFY-FFN-GGUF-010) in
    `crates/aprender-serve/src/apr_transformer/helpers.rs::
    determinism_tests`:

      falsify_ffn_gguf_010_q4k_block_scale_variance

    Test compares Path A vs Path B per-block divergence at 7 block
    scales spanning 4 orders of magnitude:
      d ∈ {0.001, 0.01, 0.05, 0.1, 0.5, 1.0, 10.0}

    Each scale produces a single Q4K super-block; both paths run
    the same matvec, rel_diff measured. Test reports the
    variance_factor (max rel_diff / min rel_diff across scales).

    EMPIRICAL RESULT (2026-05-06):
      d=0.001:  0.091873% rel_diff (matvec=-15.4 vs -15.4)
      d=0.01:   0.091873%
      d=0.05:   0.091924%
      d=0.1:    0.092017%
      d=0.5:    0.091932%
      d=1.0:    0.091932% (M94-comparable; note dmin=0 here vs M94's
                          dmin=-0.25 → slight rel_diff difference)
      d=10.0:   0.091966%

    variance_factor = max/min = **1.00×** across 4 orders of
    magnitude in block scale.

    A3 EMPIRICALLY FALSIFIED at the per-block granularity.

    The M94 mechanism is LINEAR-SCALING: Path A and Path B both
    scale proportionally with block magnitude, so rel_diff (a
    RATIO) is scale-INVARIANT. Per-block magnitude variance in
    real Qwen weights does NOT amplify M94 mechanism beyond the
    measured 0.077-0.092% rel_diff baseline.

    AMPLIFIER LANDSCAPE POST-A3 FALSIFICATION:
    - A1 (RoPE phase amplification) — UNTESTED, candidate.
    - A2 (Softmax saturation)       — UNTESTED, candidate.
    - A3 (Block-scale variance)     — FALSIFIED ✗

    NEXT INVESTIGATION CANDIDATE (M-FFN-GGUF-4 step (g)): A2
    (softmax saturation) is the simplest synthetic test — small
    logits vector with one near-saturated value (e.g. 10.0)
    plus a tiny perturbation (0.077% of max), measure
    softmax(logits) before/after, check whether output
    probability drift exceeds input drift.

    A1 (RoPE phase) is harder to test in isolation — RoPE
    rotates per-position by per-frequency phase; small magnitude
    drift becomes rotational drift that interacts with
    subsequent attention dot products. The test fixture would
    need RoPE rotation + dot product against another rotated
    vector with a corresponding small drift.

    Both A1 and A2 are smaller scope than M-FFN-GGUF-6 (real-
    teacher falsifier). M-FFN-GGUF-6 remains the most-direct
    test but is gated on operator dispatch.

    GAP-EXPLANATION STATE:
    - M94 mechanism (Q8K activation quant + fused inline dequant)
      EXPLAINS bit-level divergence per matvec.
    - M95 super-linear compounding EXPLAINS chained drift up to
      ~5.70× over 5 ops.
    - 28× magnitude gap to §27's 1723% UNEXPLAINED at synthetic
      level. A3 falsified narrows the gap to A1 + A2 + non-linear
      stage interaction (silu saturation, RoPE-attn coupling) +
      potentially real-teacher only.

    STATUS PROMOTIONS (v1.7.0):

    - FALSIFY-FFN-GGUF-010 (NEW): block-scale variance falsified
      asserted as regression-test invariant; status DISCHARGED
      (test passes; A3 empirically falsified at per-block scale).
    - M-FFN-GGUF-4 step (f) A3 candidate: NEW → DISCHARGED
      (variance_factor 1.00× rules out block-scale variance as
      §27 amplifier).
    - Contract metadata.status: ACTIVE_ALGORITHM_LEVEL → unchanged
      (still gated on M-FFN-GGUF-5 actual fix landing).

    Production hot paths byte-unchanged. New test additive in
    `crates/aprender-serve/src/apr_transformer/helpers.rs::
    determinism_tests`.

    v1.6.0 AMENDMENT (2026-05-06): COMPOUNDING CONFIRMED — SUPER-LINEAR GROWTH.

    M94 confirmed Path A vs Path B differ by 0.077% on a SINGLE
    144-byte Q4K super-block matvec. v1.5.0 amendment hypothesized
    (without measurement) that this divergence "compounds across
    28 layers × 4 matmuls/layer × 7 tokens" to match the §27
    layer-3 ffn_swigl 18.23× std-ratio.

    QUESTION (M95): does the M94 mechanism actually COMPOUND, and
    if so, at what growth rate?

    Three sub-hypotheses:
    - H-COMPOUND-LINEAR:    rel_diff(N) ≈ rel_diff(1) × N
    - H-COMPOUND-SUBLINEAR: rel_diff(N) ≈ rel_diff(1) × √N
    - H-COMPOUND-SUPER:     rel_diff(N) ≈ rel_diff(1) × N^k, k > 1

    Authored a fifth lib-only falsifier (FALSIFY-FFN-GGUF-009) in
    `crates/aprender-serve/src/apr_transformer/helpers.rs::
    determinism_tests`:

      falsify_ffn_gguf_009_multi_tensor_divergence_compound

    Test runs N=5 sequential matvecs (chained — each output is the
    next input, with RMSNorm between layers to keep magnitude
    bounded), comparing Path A vs Path B at the final layer.

    EMPIRICAL RESULT (2026-05-06):
      Single-tensor rel_diff (M94): 0.077%
      5-tensor chained rel_diff:    0.4391%
      Growth factor:                5.70×

    Linear projection would be 5.00× (5 × 0.077%). Sub-linear
    (√N) projection would be 2.24×. The empirical 5.70× growth
    is **SUPER-LINEAR** — H-COMPOUND-SUPER is empirically
    consistent.

    QUANTITATIVE EXTRAPOLATION TO §27:
      §27 measures layer-3 chain depth (3 layers × ~7 tensor-ops
      = 21 chained ops) with 7 tokens.
      Naive super-linear extrapolation:
        21 × 0.077% × (5.70/5)^log2(21/5) ≈ 1.85% (rel_diff)

      This is FAR BELOW §27's 1723% (18.23× std-ratio).

    GAP ANALYSIS: the M94 mechanism explains COMPOUNDING but not
    the §27 MAGNITUDE. Three candidate amplifiers (M-FFN-GGUF-6
    investigation scope):

    - **A1 (RoPE phase amplification)**: RoPE rotates F32 vectors
      by per-position phase; small magnitude drift becomes
      ROTATIONAL drift which can amplify non-linearly across
      attention heads.

    - **A2 (Softmax saturation)**: attention logits drift by
      ~rel_diff% in magnitude → softmax(logits) can amplify
      tiny logit differences when one logit is near-saturated
      (max-token) and another is in the tail.

    - **A3 (Real-weight magnitude variance)**: synthetic weights
      have uniform magnitude; real Qwen Q4K weights have huge
      per-tensor magnitude variance. The 0.077% per-tensor
      divergence on a synthetic block may be 5-50× larger on
      a typical real layer-3 down_proj tensor.

    NEXT INVESTIGATION STEP RECOMMENDATION (M-FFN-GGUF-6): real-
    teacher falsifier. Load actual layer-3 down_proj Q4K bytes
    from canonical 7B Qwen2.5-Coder .apr file, run both Path A
    and Path B against a real activation vector, measure rel_diff.
    If real-teacher rel_diff is 5-50× larger than synthetic, A3
    explains the §27 magnitude alone. If real-teacher rel_diff
    matches synthetic, A1 + A2 are the load-bearing amplifiers.

    STATUS PROMOTIONS (v1.6.0):

    - FALSIFY-FFN-GGUF-009 (NEW): super-linear compounding
      asserted as regression-test invariant; status DISCHARGED
      (test passes on first run; H-COMPOUND-SUPER empirically
      consistent).
    - M-FFN-GGUF-4 step (e) compounding-hypothesis: NEW →
      DISCHARGED (compounding confirmed empirically; magnitude
      gap deferred to M-FFN-GGUF-6).
    - M-FFN-GGUF-6 (NEW, NEXT): real-teacher falsifier; PENDING
      (gated on operator dispatch with canonical 7B teacher
      .apr file present; the file is on lambda-vector RTX 4090
      at `/mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b
      -instruct-q4k.apr`).
    - Contract metadata.status: ACTIVE_ALGORITHM_LEVEL → unchanged
      (still gated on M-FFN-GGUF-5 actual fix landing).

    Production hot paths byte-unchanged. New test additive in
    `crates/aprender-serve/src/apr_transformer/helpers.rs::
    determinism_tests`.

    v1.5.0 AMENDMENT (2026-05-06): H2d.3 + H2d.4 EMPIRICALLY CONFIRMED.

    THIS IS THE FIRST HYPOTHESIS *CONFIRMATION* IN THE CHAIN. After
    three sequential falsifications (M91 §28, M92 H2a', M93 H2d.2),
    the H2d.4 falsifier (FALSIFY-FFN-GGUF-008) is the first test
    that produces the EXPECTED bit-level divergence between the two
    paths.

    Authored a fourth lib-only falsifier in `crates/aprender-serve/
    src/apr_transformer/helpers.rs::determinism_tests`:

      falsify_ffn_gguf_008_fused_vs_standalone_q4k_matvec

    Test compares:
      Path A (APR-style):  dequantize_q4_k_simd + manual F32 dot
      Path B (GGUF-style): quantize_activations_q8k_into +
                           fused_q4k_q8k_parallel_matvec_into

    On a synthetic 144-byte Q4K super-block + 256-element F32
    activation. Both paths compute the same mathematical operation
    (W @ a) on the same Q4K weight bytes but Path B has an
    additional Q8K activation-quantization step Path A doesn't
    have.

    EMPIRICAL RESULT (2026-05-06):
      Path A = -18882.443 (0xc69384e3)
      Path B = -18897.059 (0xc693a21e)
      diff   = 14.615 (rel_diff = 0.077%)
      bits_a != bits_b ✓

    Paths DIFFER at bit level as expected. Math agreement within
    0.10% (well below 10% sanity bound) — Q8K precision loss is
    mathematically reasonable but NOT bit-exact. This **CONFIRMS
    H2d.3 + H2d.4 simultaneously** at the kernel level.

    SHIP-007 §22 ROOT CAUSE NOW HAS A CONCRETE MECHANISM:

    APR's loader path uses Path A semantics — full F32 dequant of
    weights, then F32 matmul with F32 activations. GGUF's matvec
    uses Path B semantics — Q8K quantization of activations + fused
    inline Q4K dequant during the parallel matvec. Per-tensor the
    bit divergence is small (0.077%) but cumulative across 28 layers
    × 4 matmuls/layer × 7 tokens, the divergence compounds in a
    way that matches the §27 layer-3 ffn_swigl 18.23× APR↔GGUF drift.

    HYPOTHESIS CHAIN (CLOSED for kernel-level reduction-order):
    - §28  parallel-reduction non-determinism      (M91): FALSIFIED
    - H2a' SIMD-vs-scalar dot reduction            (M92): FALSIFIED
    - H2d.2 APR-internal Q4K dequant byte-identity (M93): FALSIFIED
    - H2d.3 + H2d.4 fused-vs-standalone matvec     (M94): CONFIRMED ✓

    This **CLOSES** the M-FFN-GGUF-4 step (c) hypothesis-narrowing
    cascade with a CONFIRMED mechanism. The v1.4.0 "remaining viable
    hypotheses {H2d.1, H2d.3, H2d.4}" set is now resolved:
    - H2d.1 (per-block boundaries) — not refuted but no longer
            load-bearing because H2d.3+H2d.4 already explain the
            mechanism with positive evidence.
    - H2d.3 (Q8K activation quant) — CONFIRMED ✓
    - H2d.4 (fused inline dequant) — CONFIRMED ✓ (entangled with
            H2d.3 in this falsifier; separating requires a
            Q8K-only or fused-only ablation but is not necessary
            to scope the SHIP-007 §22 fix).

    SHIP-007 §22 FIX SCOPE (post-confirmation):

    Two architecturally-clean options for closing the §22 18.23×
    drift now that the mechanism is empirically identified:

      Option-A (PROMOTE GGUF-PATH semantics into APR forward):
              add Q8K activation quantization + fused-inline-dequant
              matvec to APR's `apr_transformer::helpers::f32_matmul`
              call sites. APR forward becomes byte-equivalent to
              GGUF forward at the matmul boundary.
              Cost: ~250-400 LOC, 1-2 PRs, no production-path
                    deletion.
              Risk: SHIP-003 PR #1059 cos≥0.9999999 weight invariance
                    may need re-verification post-Q8K-activation.

      Option-B (PROMOTE APR-PATH semantics into GGUF forward):
              skip Q8K activation quantization in GGUF's matvec,
              call standalone dequant + F32 matmul. GGUF forward
              becomes byte-equivalent to APR forward at the matmul
              boundary, at the cost of ~2-3× memory bandwidth
              regression (full F32 weights in cache instead of
              Q4K bytes + Q8K activations).
              Cost: ~150-300 LOC, 1 PR, but performance regression.
              Risk: GGUF inference TPS drops below Ollama parity.

    DECISION DEFERRED TO SHIP-007 §22 FIX-PR (M-FFN-GGUF-5):
      gate Option-A vs Option-B on the parity-vs-perf tradeoff.
      Most likely Option-A because SHIP-007 has been gating MODEL-2
      training for ~3 weeks and parity unblocks downstream work,
      while a one-time perf regression is recoverable.

    STATUS PROMOTIONS (v1.5.0):

    - FALSIFY-FFN-GGUF-008 (NEW): bit-divergent fused-vs-standalone
      matvec asserted as regression-test invariant; status
      DISCHARGED with the OPPOSITE polarity from M91/M92/M93 (this
      one ASSERTS difference rather than identity).
    - M-FFN-GGUF-4 step (c) hypothesis-narrowing: ALGORITHM_LEVEL
      → DISCHARGED — chain produced first CONFIRMED mechanism.
    - M-FFN-GGUF-5 (NEW, NEXT): SHIP-007 §22 actual fix PR; gate
      Option-A vs Option-B; PENDING.
    - Contract metadata.status: ACTIVE_ALGORITHM_LEVEL → unchanged
      (still gated on M-FFN-GGUF-5 actual fix landing — flips to
      DISCHARGED when the SHIP-007 §22 18.23× drift is closed in
      end-to-end retrace).

    Production hot paths byte-unchanged. New test additive in
    `crates/aprender-serve/src/apr_transformer/helpers.rs::
    determinism_tests`.

    v1.4.0 AMENDMENT (2026-05-06): H2d.2 ALSO FALSIFIED AT DEQUANT LEVEL.

    Authored a third lib-only falsifier (FALSIFY-FFN-GGUF-007) at
    `crates/aprender-serve/tests/ffn_gguf_007_q4k_dequant_byte_identity.rs`:

      falsify_ffn_gguf_007_q4k_scalar_vs_simd_dequant_byte_identity

    Test runs `realizar::quantize::dequantize_q4_k` (scalar) and
    `realizar::quantize::dequantize_q4_k_simd` (AVX2 if available)
    on a synthetic 144-byte Q4K super-block and compares the
    resulting Vec<f32> bit-by-bit via `f32::to_bits()`.

    EMPIRICAL RESULT (2026-05-06): both paths produce BYTE-IDENTICAL
    output across all 256 elements. element[0] = 10.75 (0x412c0000);
    element[255] = 1.25 (0x3fa00000). Asserted as regression-test
    invariant.

    This **FALSIFIES H2d.2 at the APR-internal dequant level**.
    APR's two own Q4K dequant paths agree byte-for-byte on the
    same input. The SHIP-007 §22 layer-3 18.23× drift cannot be
    explained by APR's loader picking one dequant path while
    GGUF's matvec uses a different APR-internal dequant path —
    they're equivalent.

    THIRD HYPOTHESIS FALSIFICATION IN ONE SESSION:
    - §28  parallel-reduction non-determinism (M91): FALSIFIED
    - H2a' SIMD-vs-scalar dot reduction (M92): FALSIFIED
    - H2d.2 APR-internal Q4K dequant byte-identity (this v1.4.0):
      FALSIFIED

    REMAINING VIABLE HYPOTHESES (post-three-falsification):

    - H2d.1: per-block dequant boundaries differ between APR's
             whole-row F32 reduction (calls `dequantize_q4_k_simd`
             once for the full row, then `f32_matmul`) and GGUF's
             super-block Q4K-byte-by-byte fused reduction
             (`fused_q4k_q8k_parallel_matvec_into` has its own
             inline dequant per super-block as the matvec
             progresses).
    - H2d.3: Q8K activation quantization in GGUF's path (a step
             APR doesn't have at all). APR passes F32 activations
             through f32_matmul; GGUF quantizes activations to Q8K
             before each matmul. This Q8K quantization rounds
             activations to ~7-bit precision, which compounds
             across layers DIFFERENTLY than APR's full-F32 path.
    - H2d.4 (NEW): the FUSED matvec's INLINE Q4K dequant in
             `fused_q4k_q8k_parallel_matvec_into` may produce
             different bits than the STANDALONE dequant routines
             (`dequantize_q4_k`, `dequantize_q4_k_simd`). Both
             are byte-identical to each other (this M93), but
             that doesn't constrain the inline-fused dequant
             path which is a separate code path.

    NEXT STEP RECOMMENDATION: H2d.4 — author a falsifier comparing
    standalone `dequantize_q4_k_simd` followed by `f32_matmul` vs
    the fused `fused_q4k_q8k_parallel_matvec_into` on the same Q4K
    bytes + (Q8K-quantized → dequantized → re-Q8K-quantized)
    activation, with a control over Q8K precision loss. Most
    direct test of H2d.1 + H2d.4 combined.

    Alternative: accept that SHIP-007 §22 root cause may NOT be in
    a single-tensor reduction-order boundary at all. The cumulative
    drift could be from accumulator precision in residual-addition
    sums (which APR and GGUF may handle in different orders), the
    RMSNorm rsqrt approximation, or the per-token tokenization
    difference. Each is its own falsifier candidate.

    STATUS PROMOTIONS (v1.4.0):

    - FALSIFY-FFN-GGUF-007 (NEW): byte-identical scalar+SIMD Q4K
      dequant asserted as regression-test invariant; status
      DISCHARGED (test passes on first run; H2d.2 empirically
      falsified at APR-internal dequant level).
    - M-FFN-GGUF-4 step (c) candidate H2d.2 narrowing: SHIPPED
      (this falsifier reduces step (c) hypothesis space from
      {1,2,3} to {1,3,4}).
    - Contract metadata.status: ACTIVE_ALGORITHM_LEVEL → unchanged
      (still gated on M-FFN-GGUF-4 step (c) actual fix landing).

