qa_gate:
  id: F-GQ-001
  name: GQA Contract
  description: Grouped query attention with KV broadcasting quality gate
  checks:
  - weight_normalization
  - mha_equivalence
  - convex_bound
  - simd_equivalence
  pass_criteria: All 9 falsification tests pass + Kani harnesses verify
  falsification: Skip KV head broadcasting, use wrong head index
