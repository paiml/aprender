- id: KANI-GQA_KE-008
  obligation: KV head broadcasting correctness
  property: KV head broadcasting correctness
  bound: 8
  strategy: exhaustive
- id: KANI-GQA_KE-009
  obligation: SIMD matches scalar within ULP
  property: SIMD matches scalar within ULP
  bound: 8
  strategy: exhaustive
- id: KANI-GQA_KE-010
  obligation: GPU PTX matches CPU within cosine >= 0.98
  property: GPU PTX matches CPU within cosine >= 0.98
  bound: 8
  strategy: exhaustive
- id: KANI-GQA_KE-011
