metadata:
  version: 1.1.0
  created: '2026-04-05'
  author: PAIML Engineering
  description: "apr --version traceability contract — the version output must always contain an informative build identifier; never the bare '(unknown)' sentinel when a CARGO_PKG_VERSION or any alternative identifier is available; AND the embedded git SHA must match the actual HEAD of the source tree at build time (including in git worktrees)"
  references:
    - "paiml/aprender#597 (Version string shows (unknown) instead of git hash)"
    - "paiml/aprender#1862 (build.rs misses HEAD changes in worktrees because ../../.git is a file pointer, not a directory)"
  registry: true
  tags:
    - cli
    - version
    - build
    - sentinel
    - worktree
    - five-whys

five_whys:
  symptom: "apr --version emits 'apr 0.4.13 (unknown)' on hosts built via cargo install (from path or crates.io); local git-worktree builds correctly emit 'apr 0.4.13 (b8c5d809)'"
  why_1: "APR_GIT_SHA env var fell back to 'unknown' at build time because git rev-parse --short HEAD failed"
  why_2: "cargo install copies source to a temp workspace without the .git/ directory; on crates.io tarball installs there is no .git either. git rev-parse runs but finds no repo."
  why_3: "build.rs has only one hash source — the git command. No env var check, committed hash file, or informative fallback."
  why_4: "Release process (scripts/release.sh, .github/workflows/release.yml) calls cargo publish directly without writing hash metadata into the package."
  why_5: "No provable-contract forbids the '(unknown)' sentinel in version output — 'version is traceable' was never formalized."
  root_cause: "Single git-command source + no release-time hash baking + no contract forbidding sentinel leaked a meaningless version identifier to production binaries."

equations:
  non_sentinel_version:
    formula: "apr --version output MUST NOT contain '(unknown)' when CARGO_PKG_VERSION is available"
    lean_theorem: Theorems.NonSentinelVersion
    domain: "any apr binary built by cargo (path or crates.io)"
    codomain: "version string"
    invariants:
      - "apr --version output contains a non-sentinel build identifier"
      - "Fallback identifier MUST include CARGO_PKG_VERSION when git hash is unavailable"
      - "Common sentinel forms are forbidden: (unknown), 0000000, <empty>, null"

  fallback_hierarchy:
    formula: "APR_GIT_SHA = override ∨ git_hash ∨ committed_sha ∨ 'v{version}+no-git'"
    domain: "build-time environment"
    codomain: "APR_GIT_SHA environment variable"
    invariants:
      - "Env var APR_GIT_SHA_OVERRIDE, if set, wins (for CI/release)"
      - "Otherwise: try git rev-parse --short HEAD"
      - "Otherwise: try reading crates/apr-cli/.git-sha committed file"
      - "Otherwise: emit 'v{CARGO_PKG_VERSION}+no-git' as informative fallback"

  worktree_head_freshness:
    formula: "apr --version SHA == git rev-parse --short HEAD (post-rebuild, in any layout)"
    domain: "any build location: primary checkout or git worktree"
    codomain: "embedded APR_GIT_SHA in the apr binary"
    invariants:
      - "After cargo build, `apr --version` SHA matches `git rev-parse --short HEAD` run from the same directory"
      - "Holds for primary checkouts where .git is a directory"
      - "Holds for git worktrees where .git is a file pointer (gitdir: <common>/worktrees/<name>)"
      - "Holds after HEAD moves (e.g. git pull, git checkout) — build.rs must declare rerun-if-changed on the resolved <git-dir>/HEAD"
      - "Uses `git rev-parse --git-dir` (worktree-local) for HEAD and `git rev-parse --git-common-dir` for refs/heads/"

proof_obligations:
  - type: invariant
    property: "No '(unknown)' sentinel in version output"
    formal: "apr --version output ∌ '(unknown)'"
    applies_to: non_sentinel_version
  - type: invariant
    property: "Fallback includes package version"
    formal: "git_hash = none ⟹ APR_GIT_SHA contains CARGO_PKG_VERSION"
    applies_to: fallback_hierarchy
  - type: invariant
    property: "Embedded SHA matches HEAD in any git layout"
    formal: "apr --version SHA = git rev-parse --short HEAD (post-build)"
    applies_to: worktree_head_freshness

falsification_tests:
  - id: FALSIFY-VERSION-001
    rule: "apr --version does not contain '(unknown)'"
    prediction: "apr --version output does not contain the string '(unknown)'"
    test: "! apr --version 2>&1 | grep -qE '\\(unknown\\)'"
    if_fails: "Sentinel still leaking — fallback logic not reached or not wired"
  - id: FALSIFY-VERSION-002
    rule: "apr --version does not contain known sentinel forms"
    prediction: "apr --version output contains no sentinel from the forbidden set"
    test: "! apr --version 2>&1 | grep -qE '\\(unknown\\)|\\(0000000\\)|\\(<empty>\\)|\\(null\\)'"
    if_fails: "Alternative sentinel leaked"
  - id: FALSIFY-VERSION-003
    rule: "apr --version on crates.io-style build contains version"
    prediction: "When built without git context, apr --version output contains the package version string"
    test: "apr --version 2>&1 | grep -qE '0\\.[1-9][0-9]*\\.[0-9]+'"
    if_fails: "Version string missing entirely"
  - id: FALSIFY-VERSION-004
    rule: "build.rs registers worktree-aware rerun-if-changed triggers"
    prediction: "build.rs invokes `git rev-parse --git-dir` and `--git-common-dir` (not a hardcoded `../../.git/HEAD` path)"
    test: "grep -qE 'rev-parse.*--git-(dir|common-dir)' crates/apr-cli/build.rs && ! grep -qE '\\.\\./\\.\\./\\.git/HEAD' crates/apr-cli/build.rs"
    if_fails: "build.rs still relies on a hardcoded relative .git/HEAD path; worktree HEAD changes won't trigger rebuild"

kani_harnesses:
  - id: KANI-VERSION-001
    obligation: "version output is non-sentinel"
    bound: 4
    strategy: bounded_int

qa_gate:
  id: F-VERSION-001
  name: "apr --version traceability contract"
  description: "apr --version output must always contain a meaningful build identifier; never the bare '(unknown)' or other sentinel forms"
  checks:
    - "non_sentinel_version"
    - "fallback_hierarchy"
  pass_criteria: "FALSIFY-VERSION-{001,002,003} all PASS on a cargo-install-built binary (no git context)"
