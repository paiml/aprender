contract: prophet-parity
metadata:
  version: 3.0.0
  created: '2026-09-05'
  author: PAIML Engineering
  kind: kernel
  # ONT-7 (plan 08-33): the parity bars hold in the committed tree; no qualifier is claimed.
  valid_under:
    world: committed
  description: >
    The FROZEN correctness bar for `crates/aprender-forecast`'s Prophet 1.4.0 port (D-04): every
    tolerance the parity ladder asserts lives HERE, once, and is read at test time via
    `test_support::equation_tolerance` / `constant_u64`. A test that hardcodes a tolerance can be
    loosened without the contract ever noticing; a tolerance that lives here can only move as a
    `pv diff`-visible edit (Phase 3 D-10(c) precedent), never as an inline relaxation. D-15.

    THE ORACLE. Seven fixtures generated by Python `prophet==1.4.0` (Prophet 1.4.0) and committed
    byte-verified in `crates/aprender-forecast/tests/fixtures/`:
    `peyton_manning_prophet140.json`, `air_passengers_prophet140.json`,
    `retail_sales_prophet140.json` (spike 001 — these carry `log_posterior_at_map_unnormalized`,
    Python's own `-lp` at its MAP, and no `uncertainty` block); `peyton_default_prophet140.json`,
    `peyton_holidays_prophet140.json`, `wp_log_R_logistic_prophet140.json`,
    `air_multiplicative_prophet140.json` (spike 003 — these carry `columns`, `s_a`, `s_m`,
    `history.cap_scaled`, `forecast.trend_lower/upper` and a precomputed `uncertainty` block, but
    NO `log_posterior_at_map_unnormalized`). The asymmetry is a property of the fixtures, not a
    choice: `objective_at_python_map_abs` can only be asserted against an oracle where the oracle
    published the number, so it binds the three spike-001 fixtures. On the spike-003 fixtures the
    Python reference for `fitted_objective_slack` is the Rust objective evaluated at PYTHON's MAP
    parameters — a legitimate stand-in precisely because `objective_at_python_map_abs` proves, on
    every fixture that does publish `-lp`, that this quantity IS Python's objective.

    TWO FURTHER ORACLES CARRY THE EXTRA-REGRESSOR LADDER, and they are a separate family with their
    own `regressor_*` keys: `retail_regressors_prophet140.json` (24 columns — four regressors, no
    holidays) and `retail_regressors_holidays_prophet140.json` (30 columns — the same four regressors
    plus `blackfriday` with a -1..+2 window and `newyear` with +0..+1). Both are spike 011, both are
    `prophet==1.4.0` under Python 3.12, and both are committed byte-identical to the spike originals —
    re-running the oracle is a DIFFERENT measurement, not the same one. They publish `columns`,
    `prior_scales`, `s_a`, `s_m`, `component_cols`, `X_first3` / `X_last3`, `extra_regressors` and a
    full `forecast.components` block, and they carry `params.lp__` rather than
    `log_posterior_at_map_unnormalized`. Their rungs live in
    `crates/aprender-forecast/src/reg_parity.rs`, one test per rung per fixture, and bind the
    `regressor_*` equations below — never the seven-fixture keys, whose bars were measured on a
    different design.

    WHY THE PREDICT PATH IS BARRED RELATIVE TO `y_scale` AS WELL AS ABSOLUTELY. D-04 states the
    predict-path bar as an absolute 1e-10 on Peyton Manning, whose `y_scale` is 12.85. The same
    absolute bar is FALSE on `retail_sales`, whose `y_scale` is 518253: Python's parameters through
    Rust `predict` reproduce Python's `yhat` to 2.3e-10 ABSOLUTE there, which is 4.4e-16 RELATIVE —
    tighter than Peyton in every sense that matters, and yet an absolute 1e-10 bar would call it a
    failure. So the contract carries BOTH: `predict_path_abs_peyton` (the D-04 literal, asserted on
    the D-04 dataset and its `peyton_default` twin) and `predict_path_rel_yscale` (max|d yhat| <=
    tol * y_scale, asserted on all seven).

    WHAT IS DELIBERATELY NOT BARRED. `future_yhat_band_peyton_abs` is the disagreement Prophet's own
    two optimisers (Newton vs L-BFGS) show on Peyton Manning; it applies to `peyton_manning` and
    `peyton_default` ONLY. `air_passengers` and `retail_sales` have no committed control band, and
    their optimisers disagree by ~35 and ~1702 in `yhat` units respectively, because the yearly
    Fourier block is near-unidentified on monthly data — many parameter vectors sit within a
    fraction of an objective unit of Python's MAP and produce visibly different daily-resolution
    curves. Barring a future-yhat number there would be barring optimiser luck, not parity, so the
    ladder RECORDS those two numbers in its assertion message and bars nothing. The real bar on
    those fixtures is `fitted_objective_slack` plus the whole Python-parameters-through-Rust chain.

    HOW TO READ THE LADDER. Every rung is its own `#[cfg(test)]` test named
    `<fixture>_<rung>` inside `crates/aprender-forecast/src/prophet.rs::parity`, so a regression
    names the RUNG and the FIXTURE rather than "Prophet broke". Rung order: data preparation,
    objective at Python's MAP, Python's parameters through Rust `predict` (with components and the
    reconstruction identity), the Rust fit's own objective and forecast, and the 80% band widths.
  references:
    - 'Taylor, S. J. & Letham, B. (2018). Forecasting at Scale. The American Statistician 72(1), 37-45.'
    - 'Prophet 1.4.0 Stan model `prophet.stan` (the `linear_trend` / `logistic_trend` functions and the model block this port reproduces term for term).'
    - '.claude/skills/spike-findings-aprender/references/prophet-fit-and-predict.md (the validated implementation blueprint: the D-09 fit recipe and the parity judgement rules).'
    - '.claude/skills/spike-findings-aprender/sources/001-prophet-map-fit-lbfgs/RUN-OUTPUT.md (the measured numbers behind the objective, predict-path and fit tolerances).'
    - '.claude/skills/spike-findings-aprender/sources/003-prophet-intervals-and-components/RUN-OUTPUT.md (the measured numbers behind the component, reconstruction and band-width tolerances).'

# Machine-readable mirror of the D-09 fit recipe's numeric knobs. Not part of the
# `Contract` struct (the parser drops unknown top-level keys), and deliberately so:
# these are read by `test_support::constant_u64("prophet-parity-v1", ...)` so the ladder
# passes `max_rounds` to `fit_prophet` from the contract rather than from a test literal,
# exactly as the tolerances are read from `equations.*.float_tolerance`.
constants:
  max_rounds: 8
  max_iters_per_round: 2000
  fit_budget_secs: 15
  lbfgs_memory: 20

equations:

  data_prep_exact:
    formula: 'max(|t_rust - t_py|, |y_scaled_rust - y_scaled_py|, |changepoints_t_rust - changepoints_t_py|, |X_rust - X_py| over the first and last 3 rows) <= 0.0'
    domain: 'the raw (ds, y) history of a committed Prophet 1.4.0 fixture, plus the fixture Spec (growth, cap, seasonality mode, holidays, changepoint_prior_scale)'
    codomain: 'the Stan data block Prophet 1.4.0 built from the same (ds, y): t, y_scaled, changepoints_t, the Fourier/holiday design matrix X, the column NAMES and order, s_a, s_m and prior_scales'
    float_tolerance: 0.0
    invariants:
      - 'EXACT, not approximate: the measured max abs diff is 0.00e0 on all seven fixtures, so any non-zero difference is a defect and the bar is 0.0'
      - 'seasonality (name, period, fourier_order) list equal to the fixture; prior_scales equal'
      - 'on spike-003 fixtures additionally: `columns` order equal, `s_a` and `s_m` equal, and `history.cap_scaled` reproduced for logistic growth'
      - 'y_scale is max|y| (never a mean), t is (day - start)/t_scale_days, and changepoints_t come from linspace-round over the first changepoint_range of the history'
    preconditions:
      - 'the history is strictly ascending in ds and has at least 2 points'

  objective_at_python_map_abs:
    formula: '|f_rust(theta_py) - f_python| <= 1.0e-9, where f_python = -log_posterior_at_map_unnormalized and f_rust is the UNSCALED negative log posterior (Model::objective / Model::scale)'
    domain: 'theta_py = the Prophet 1.4.0 MAP (k, m, delta, beta, sigma_obs) as committed in the fixture `params` block'
    codomain: 'Python Prophet 1.4.0 own `-lp` at that same point, as committed in `log_posterior_at_map_unnormalized`'
    float_tolerance: 1.0e-9
    invariants:
      - 'binds the three spike-001 fixtures (peyton_manning, air_passengers, retail_sales) — the only committed fixtures that publish Python -lp'
      - 'the fixture stores a POSITIVE log posterior while the model computes a NEGATIVE log posterior, so the residual is the SUM |f_rust + lp|'
      - 'Model::new scales the objective by 1/T (the D-09 recipe); the fixture number is unscaled, so the scale is undone before comparing'
      - 'measured: 0.0 exactly on peyton_manning, and <= 9.1e-13 across the three (the 1e-9 literal is D-04 and stays as the bar, not the measurement)'
    preconditions:
      - 'data_prep_exact holds for the same fixture — an objective computed on a different design matrix is not a parity claim'

  predict_path_abs_peyton:
    formula: 'max|yhat_rust(theta_py) - yhat_py| <= 1.0e-10 and max|trend_rust(theta_py) - trend_py| <= 1.0e-10'
    domain: 'the Peyton Manning fixtures (peyton_manning, peyton_default), Python MAP parameters pushed through Rust `predict` over the fixture forecast ds (history + 365 daily future rows)'
    codomain: 'the fixture `forecast.yhat` / `forecast.trend` columns Python Prophet 1.4.0 produced'
    float_tolerance: 1.0e-10
    invariants:
      - 'this is D-04 own absolute literal, asserted on the D-04 dataset; measured 5.3e-15'
      - 'ABSOLUTE bars only make sense at Peyton y_scale (12.85) — see predict_path_rel_yscale for the general form'

  predict_path_rel_yscale:
    formula: 'max|yhat_rust(theta_py) - yhat_py| <= 1.0e-14 * y_scale and max|trend_rust(theta_py) - trend_py| <= 1.0e-14 * y_scale'
    domain: 'all seven committed fixtures, Python MAP parameters pushed through Rust `predict` over the fixture forecast ds'
    codomain: 'the fixture `forecast.yhat` / `forecast.trend` columns'
    float_tolerance: 1.0e-14
    invariants:
      - 'the scale-free form of predict_path_abs_peyton; measured <= 5.5e-16 relative on every fixture'
      - 'retail_sales is 2.3e-10 ABSOLUTE at y_scale 518253 — an absolute 1e-10 bar would be FALSE there while the relative bar is met by four orders of magnitude'
      - 'the fit is not involved: this rung is fit-independent by construction, so an optimiser disagreement cannot leak into it'

  regressor_standardization_abs:
    formula: 'max(|mu_rust - mu_py|, |std_rust - std_py|) over every extra regressor <= 1.0e-14'
    domain: 'the HISTORY rows only of each caller-supplied regressor column in BOTH committed regressor oracles — `retail_regressors_prophet140.json` (24 columns, four regressors, no holidays) and `retail_regressors_holidays_prophet140.json` (30 columns, the same four regressors plus `blackfriday` with a -1..+2 window and `newyear` with +0..+1) — plus its requested `standardize` setting (absent = Prophet auto)'
    codomain: 'Prophet 1.4.0 `initialize_scales` output as committed in the fixture `extra_regressors.<name>.mu` / `.std`'
    float_tolerance: 1.0e-14
    invariants:
      - 'the spread is pandas `Series.std()` — the SAMPLE standard deviation, variance divided by (n - 1), i.e. ddof = 1. numpy default ddof = 0 gives 6.500320 where the oracle stores 6.511441581253706 for `price`: a silent 0.17 percent shift in every coefficient that surfaces as arithmetic-looking noise rather than as a wrong divisor'
      - 'measured 3.6e-15 worst case across the four regressors, so the bar has roughly 2.8x headroom'
      - 'the constants are computed over HISTORY rows only, never over history + horizon: including future rows would leak the forecast period into the scaling'
      - 'the two oracles share one `regressor_values` block and one history, so the four (mu, std) pairs are IDENTICAL at 24 and at 30 columns. That is not redundancy: standardisation is defined over the history rows of the regressor column alone, and a port that let a holiday column reach `initialize_scales` would break exactly this equality'
      - 'Prophet auto means "do not standardize a column whose unique history values are EXACTLY the two-element set {0, 1}" — both present. A single-valued column is NOT exempt, is standardized, and yields std = 0.0, which the door refuses as constant'
    preconditions:
      - 'the regressor carries one value per history row and per horizon row, so its length is exactly points + horizon'

  regressor_predict_path_rel_yscale:
    formula: 'max|yhat_rust(theta_py) - yhat_py| <= 1.0e-15 * y_scale and max|trend_rust(theta_py) - trend_py| <= 1.0e-15 * y_scale, on the extra-regressor path'
    domain: 'BOTH committed regressor oracles — `retail_regressors_prophet140.json` (24 columns) and `retail_regressors_holidays_prophet140.json` (30 columns) — with Python MAP parameters (k, m, delta, beta, sigma_obs) pushed through the regressor-aware Rust `predict` over the fixture forecast ds (293 history + 12 horizon = 305 rows) with the full per-row regressor value channel'
    codomain: 'the fixture `forecast.yhat` / `forecast.trend` columns Python Prophet 1.4.0 produced with the same regressors'
    float_tolerance: 1.0e-15
    invariants:
      - 'DELIBERATELY TIGHTER than, and a SEPARATE key from, the crate-wide `predict_path_rel_yscale` (1.0e-14). SC1 names 1e-15 of y_scale for the regressor path specifically; reusing the looser key would accept a regressor path that the Success Criterion says must not pass'
      - 'measured 4.5e-16 relative at 24 columns and 3.4e-16 at 30, so the bar has roughly 2.2x and 2.9x headroom — tight, measured, and the number the Success Criterion asks for'
      - 'RELATIVE to y_scale, not absolute: on retail_sales the absolute 1.0e-10 bar passes with only about 3x headroom at a y_scale of 518253 and would begin failing for arithmetic reasons rather than for a defect'
      - 'fit-independent by construction — the oracle MAP is pushed through predict, so an optimiser disagreement cannot leak into this rung'
    preconditions:
      - 'data_prep_exact holds for the same fixture: a predict path over a different design matrix is not a parity claim'
      - 'the value channel covers every predicted row, so its length equals the forecast grid length'

  regressor_column_order_exact:
    formula: 'the Rust design column NAME list equals Python element-for-element, and max(|prior_scales_rust - prior_scales_py|, |s_a_rust - s_a_py|, |s_m_rust - s_m_py|) <= 0.0'
    domain: 'the spliced Rust design for BOTH committed regressor oracles — `retail_regressors_prophet140.json` (24 columns) and `retail_regressors_holidays_prophet140.json` (30 columns)'
    codomain: 'the fixture `columns`, `prior_scales`, `s_a` and `s_m` arrays Prophet 1.4.0 produced for the same request'
    float_tolerance: 0.0
    invariants:
      - 'THIS KEY COVERS NAMES, MASKS AND PRIOR SCALES ONLY. The design-matrix CELLS are barred separately by `regressor_design_cells_abs` at a MEASURED 1.0e-14, because the committed spike records a non-zero residual there and an exact-zero cell bar would reject the validated port. Conflating the two is the defect this split exists to prevent'
      - 'MEASURED ORDER: seasonalities in insertion order, then holiday columns sorted by the generated `{name}_delim_{±offset}` string, then extra regressors in INSERTION order. At 30 columns that is yearly_delim_1..20, then blackfriday_delim_+0, blackfriday_delim_+1, blackfriday_delim_+2, blackfriday_delim_-1, newyear_delim_+0, newyear_delim_+1, then promo, price, discount, weather'
      - 'the holiday sort yields +0, +1, +2, -1 because the PLUS sign sorts before the HYPHEN in ASCII (0x2B < 0x2D). This is not a special case in the port: it is what the crate existing `hcols.sort_by(name)` already yields, and the oracle agrees'
      - 'REGRESSORS APPEND and no existing column index moves. That structural fact is what D-19 no-argument bitwise invariance gate rests on, and what makes `splice` early return on an empty slice a correct no-op rather than a rebuild that happens to produce the same bytes'
      - 'EXACT is right here and nowhere else in the regressor block: names are strings, `s_a` / `s_m` are mask BITS and `prior_scales` are the caller own integers echoed back. A non-zero difference in any of them is a structural defect with no arithmetic excuse, so these are deliberately NOT relaxed to the cell bar'
      - 'measured: max abs d prior_scales / s_a / s_m = 0.00e0 at BOTH widths, and column order identical at both (.claude/skills/spike-findings-aprender/sources/011-prophet-regressor-parity/RUN-OUTPUT.md:18-23 and :82-87)'
    preconditions:
      - 'the regressor list is spliced in the caller insertion order, never sorted'

  regressor_design_cells_abs:
    formula: 'max|X_rust - X_py| over the fixture X_first3 and X_last3 history row blocks <= 1.0e-14'
    domain: 'the `X_first3` and `X_last3` row blocks both regressor oracles publish (3 x 24 and 3 x 30 cells respectively), against the corresponding rows of the spliced Rust design'
    codomain: 'the standardised design-matrix cells Prophet 1.4.0 built for the same request'
    float_tolerance: 1.0e-14
    invariants:
      - 'MEASURED, NOT CHOSEN: the committed spike records `max abs d X (first3 + last3 rows) = 3.33e-15` at BOTH 24 and 30 columns (.claude/skills/spike-findings-aprender/sources/011-prophet-regressor-parity/RUN-OUTPUT.md:24 and :88). An exact-zero bar on these cells REJECTS the validated port, which is why this key exists separately from `regressor_column_order_exact`'
      - 'the residual is float ARITHMETIC, not disagreement: a standardised cell is (v - mu) / std, and Python and Rust reach the same value by different association orders. 1e-14 gives roughly 3x headroom over the measured 3.33e-15'
      - 'still TIGHT enough to be a real bar: a column-order defect or a wrong standardisation divisor moves cells by order unity, not by 1e-15. The ddof = 0 trap alone shifts `price` cells by ~0.17 percent, twelve orders of magnitude above this bar'
      - 'NAMES, the `s_a` / `s_m` masks and `prior_scales` stay at EXACT zero under `regressor_column_order_exact` and are deliberately NOT relaxed to this bar: they are strings, mask bits and echoed caller integers, and a non-zero difference in any of them is a structural defect with no arithmetic excuse'
      - 'the crate-wide `data_prep_exact` (0.0) still binds the seven NON-regressor fixtures unchanged. This key is additive and narrows nothing'
    preconditions:
      - 'the standardisation constants agree first (`regressor_standardization_abs`): a cell comparison over a different mu / std is not a parity claim'

  regressor_components_rel_yscale:
    formula: 'for every named component c the fixture publishes and Rust `predict` produces: max|c_rust(theta_py) - c_py| <= 1.0e-14 * y_scale'
    domain: 'the named components of the regressor-aware Rust `predict` at Python MAP parameters on both regressor oracles: the yearly seasonality, each holiday and the `holidays` roll-up at 30 columns, one component per regressor, `extra_regressors_additive`, `extra_regressors_multiplicative`, `additive_terms` and `multiplicative_terms`'
    codomain: 'the corresponding `forecast.components` arrays of the fixture'
    float_tolerance: 1.0e-14
    invariants:
      - 'RELATIVE to y_scale, and that is the whole point. The crate-wide `components_via_python_params_abs` is an ABSOLUTE 1.0e-10; on retail_sales (y_scale 518253) the measured worst is 3.6e-11, which passes with only about 3x headroom and would begin failing for arithmetic reasons rather than for a defect. SC1 names the relative form for this path'
      - '`extra_regressors_additive` is a sum over the additive regressor columns SCALED BY y_scale; `extra_regressors_multiplicative` is a FRACTION and is NOT rescaled. A roll-up that applied y_scale to the multiplicative arm would be wrong by five orders of magnitude and is exactly what this rung catches'
      - 'COUNTS ARE PART OF THE BAR: 9 components are compared at 24 columns (promo, price, discount, weather, yearly, extra_regressors_additive, extra_regressors_multiplicative, additive_terms, multiplicative_terms) and 12 at 30 (those plus blackfriday, newyear, holidays). The ladder asserts set EQUALITY and the count as EQUALITY, not as a floor — an intersection plus a minimum is satisfiable by comparing the wrong nine'
      - 'measured worst absolute difference 3.6e-11 at 24 columns and 2.9e-11 at 30, i.e. 6.9e-17 and 5.6e-17 of y_scale — roughly 145x and 180x headroom against this bar'
      - 'the fixture publishes no `<component>_lower` / `_upper` or `cap` arrays on these two oracles, but the ladder still filters them by name so a regenerated fixture that grew them does not silently change the compared set'
    preconditions:
      - 'the predict path agrees first (`regressor_predict_path_rel_yscale`): components that sum to a different yhat are not a parity claim'

  regressor_fitted_objective_slack:
    formula: 'f_rust(theta_fit) <= f_reference + 0.5, ONE-SIDED, where theta_fit is the D-09 restart-loop MAP on the spliced design and f_reference is the Rust objective at the oracle MAP parameters'
    domain: 'both committed regressor oracles, fitted by `fit::fit_prophet(spliced_design, constants.max_rounds)`'
    codomain: 'the unscaled negative log posterior at the Prophet 1.4.0 MAP for the same design'
    float_tolerance: 0.5
    invariants:
      - 'ONE-SIDED. A LOWER objective than Python is a BETTER MAP and is never a failure; only exceeding the reference by more than the slack is a defect'
      - 'THE RULE THIS PHASE DEPENDS ON: a regressor coefficient disagreement is not a defect until the objective control says so. Rust `price` beta came out +0.183202 against Python +0.036035 — a ratio of 5.08x, re-measured in-tree — at a measured slack of -3.4166. That is a better optimum on a flat ridge, not a parity failure, and asserting on the beta VALUE would make the ladder red for being right'
      - 'measured slack -3.4166 at 24 columns and -2.2226 at 30, IN-TREE by `reg_parity::<stem>_fit_objective_and_identifiability` on 2026-09-21, reproducing the spike RUN-OUTPUT numbers of -3.42 and -2.22. Both are far below the +0.5 bar, and both are NEGATIVE — the Rust fit reaches a lower objective than the oracle MAP at both widths'
      - 'the in-tree identifiability ratios, recorded: at 24 columns promo 1.02x, price 5.08x, discount 2.31x, weather 0.96x; at 30 columns promo 1.00x, price 2.51x, discount 1.38x, weather 1.01x. The two well-conditioned controls (promo, weather) land within a few percent at both widths while the collinear pair does not — which is what an identifiability story looks like, and why the objective is the control and the coefficient is not'
      - 'BETA FINITENESS IS ASSERTED SEPARATELY AND FIRST. A NaN compares false against every bound, so an ill-conditioned solve would make this one-sided slack, the ratio table and every downstream comparison pass while proving nothing. Finiteness is not a value assertion and does not re-open the rule above'
      - 'the identifiability table (oracle beta, Rust beta, ratio, per regressor) is PRINTED and carried in this rung assertion message. `discount` is a 6-month cosine and therefore a harmonic of the yearly seasonality (r = 0.999 against yearly_delim_4); its coefficient is not identifiable and is recorded rather than barred'
      - 'FitInfo.objective is already unscaled (best_f / Model::scale)'
      - 'THE `lp__` QUESTION, RESOLVED BY MEASUREMENT RATHER THAN LEFT AS A GAP. Both regressor oracles DO publish a Python objective — `params.lp__`, Stan log posterior at the MAP — so the premise that they do not was half wrong. Measured against the existing rung-2 arithmetic (Model::objective(pack(theta_py)) / Model::scale, summed because the fixture stores a POSITIVE log posterior): f_rust = -1022.494294424 against lp__ = 1022.4943, residual 5.576e-6 at 24 columns; f_rust = -1022.462291772 against lp__ = 1022.4623, residual 8.228e-6 at 30'
      - 'THE GUESSED EXPLANATION IS REFUTED. The residual is NOT Stan Jacobian and prior terms this port omits: the oracle stores `lp__` rounded to FOUR DECIMAL PLACES, and both residuals are bounded by half of that last place. `lp__` is EXACTLY the Rust objective rounded to four decimals at both widths. So the rung is NOT absent — it is asserted as a digit-for-digit identity by `reg_parity::<stem>_objective_at_python_map`, which reads no tolerance because there is none in it, and is therefore not a `float_tolerance` key here'
      - 'that rung is what makes THIS one legitimate: f_reference is the RUST objective at the oracle MAP rather than a published Python number, and that stand-in is only valid because the quantity is PROVEN to be Python objective on the same two fixtures — the identical argument `objective_at_python_map_abs` makes for the spike-001 family'
      - 'the crate-wide `objective_at_python_map_abs` (1.0e-9) is DELIBERATELY NOT extended to these two fixtures: at a residual of 5.6e-6 that would be writing something false into this contract. The oracle precision, not the port, is the limit'
    preconditions:
      - 'every returned beta is finite'

  fitted_objective_slack:
    formula: 'f_rust(theta_fit) <= f_python + 0.5, where theta_fit is the D-09 restart-loop MAP and f_python is Python -lp where published, else the Rust objective at theta_py'
    domain: 'the seven committed fixtures fitted by `fit::fit_prophet(design, constants.max_rounds)`'
    codomain: 'the unscaled negative log posterior at Python 1.4.0 MAP'
    float_tolerance: 0.5
    invariants:
      - 'ONE-SIDED. A lower objective than Python is a BETTER MAP, never a failure; only exceeding Python by more than the slack is a defect'
      - 'parity is judged on objective slack, NOT on parameter equality and NOT on daily-resolution yhat for monthly data — the yearly Fourier block is near-unidentified on air/retail (prophet-fit-and-predict.md)'
      - 'measured with the restart loop: -0.13 / -0.54 / -0.20 / -0.04 on the four spike-003 fixtures; the single-round spike-001 numbers were -0.13 / +0.41 / +0.02'
      - 'FitInfo.objective is already unscaled (best_f / Model::scale)'

  future_yhat_band_peyton_abs:
    formula: 'max|yhat_rust(theta_fit) - yhat_py| over the FUTURE rows <= 0.0079'
    domain: 'peyton_manning and peyton_default ONLY'
    codomain: 'the fixture `forecast.yhat` future rows'
    float_tolerance: 0.0079
    invariants:
      - 'the bar is Prophet OWN Newton-vs-L-BFGS disagreement on Peyton Manning, not an arbitrary epsilon; Rust measured 0.0049 single round and 0.0030 with restarts'
      - 'air_passengers and retail_sales have NO committed control band: their optimisers disagree by ~35 and ~1702 yhat units, so the ladder records those numbers in its assertion message and asserts NOTHING about them'
      - 'wp_log_R_logistic, peyton_holidays and air_multiplicative likewise carry no control band for this quantity'

  components_via_python_params_abs:
    formula: 'for every named component c the fixture publishes and Rust `predict` produces: max|c_rust(theta_py) - c_py| <= 1.0e-10'
    domain: 'the named components of Rust `predict` at Python MAP parameters: each seasonality, each holiday, `holidays`, `additive_terms`, `multiplicative_terms`'
    codomain: 'the corresponding `forecast.components` arrays of the fixture'
    float_tolerance: 1.0e-10
    invariants:
      - 'additive components are on the original scale (multiplied by y_scale); multiplicative components are FRACTIONS and are not rescaled'
      - 'the fixture also publishes `<component>_lower` / `<component>_upper` and (logistic only) `cap`; those are sampled or derived quantities with no Rust point-estimate twin and are skipped by name'
      - 'measured <= 6.7e-16'

  components_rebuild_yhat_abs:
    formula: '|trend * (1 + multiplicative_terms) + additive_terms - yhat| <= 1.0e-12, pointwise'
    domain: 'the Rust `predict` output at Python MAP parameters, over every forecast row'
    codomain: 'the same output `yhat` column'
    float_tolerance: 1.0e-12
    invariants:
      - 'this is an INTERNAL identity, not an oracle comparison: it proves the component decomposition the tool returns actually reconstructs the number the tool returns'
      - 'measured 0.0 exactly'

  band_width_rel:
    formula: '|mean_width_rust - mean_width_py| <= 0.02 * mean_width_py, for the mean 80% band width over the history rows and over the future rows separately'
    domain: >
      the Rust 80% interval from 1000 draws at seed 42. On the four spike-003 fixtures the Rust side is
      the RUST FIT parameters (the spike-003 probe) and the Python reference is the precomputed
      `uncertainty.hist_band_mean_width` / `uncertainty.future_band_mean_width`. On the three spike-001
      fixtures there is NO `uncertainty` block, so the Python reference is DERIVED from the fixture own
      arrays — mean of `forecast.yhat_upper - forecast.yhat_lower` over the future rows (the forecast `ds`
      strictly after the last `history.ds`, i.e. the 365 daily rows of `make_future_dataframe(periods=365)`)
      and, separately, over the history rows — and the Rust side is PYTHON parameters through Rust
      `predict` (the same fit-independent call the predict-path rung makes), so air/retail unbarred
      optimiser disagreement cannot leak into a band verdict. `Prophet()` defaults are
      interval_width 0.80 and uncertainty_samples 1000 on both families.
    codomain: 'the mean 80% band width Python Prophet 1.4.0 produced on the same rows'
    float_tolerance: 0.02
    invariants:
      - 'RELATIVE, because band widths are Monte-Carlo estimates whose absolute size ranges over four orders of magnitude across the seven fixtures'
      - 'measured 0.02%-0.4% on the spike-003 fixtures; the seed-to-seed variance of the Rust band alone is ~1.2%, which is why the bar is 2% and not tighter'
      - 'SC2 names all four datasets: all seven fixtures sit under this one bar'

  poisson_sampler_domain:
    formula: 'for every reachable lambda, ALL THREE of: |E[poisson(rng, lambda)] - lambda| <= float_tolerance * lambda; |Var[poisson(rng, lambda)] - lambda| <= variance_tolerance * lambda; and, wherever the expected zero count is large enough to measure (N * exp(-lambda) >= 30), |P[poisson(rng, lambda) = 0] - exp(-lambda)| <= zero_mass_tolerance * exp(-lambda) — each estimated from 60 000 draws at a fixed seed'
    domain: >
      the changepoint-count draw of the logistic uncertainty path — `prophet::poisson(&mut rng, lambda)`
      with `lambda = changepoints_t.len() * (t_max - 1)`, called once per simulation row from `predict`s
      `Growth::Logistic` arm. "Reachable" is what the forecast door admits, not what the parity ladder
      happens to exercise.
    codomain: 'a non-negative count whose mean and variance are both lambda'
    float_tolerance: 0.01
    variance_tolerance: 0.05
    zero_mass_tolerance: 0.22
    invariants:
      - 'THE NUMERICAL FACT: Knuths product method compares a running product of uniforms against `l = (-lambda).exp()`, and that is EXACTLY 0.0 for lambda > 745.13. Past that point the loop can only end when the product itself underflows through f64s subnormals — roughly 745 steps on average, since E[-ln U] = 1 and the smallest positive subnormal is near e^-744 — so the count SATURATES near 745 regardless of lambda. Measured pre-fix means at N = 20 000: 745.13 at lambda 900 and 745.45 at lambda 2839'
      - 'REACHABILITY, IN BOUNDS — every factor inside every door bound: 100 consecutive daily points (span 99, n_changepoints 25) with `horizon: 3650, growth: "logistic"` gives t_max ~= 37.9 and lambda ~= 922; the 10-point `fit_min_points` floor with the same horizon gives lambda ~= 2839. This is not a theoretical regime'
      - 'PARITY, NOT PREFERENCE: Python Prophet draws this count with `np.random.poisson`, which is correct at any lambda. A sampler that saturates is a divergence from the oracle this contract is written against, not a documented design difference'
      - 'WHY THE LADDER WAS SILENT: `wp_log_R_logistic` is the ONLY logistic fixture, and its measured lambda is 3.1239 (25 changepoints x (t_max 1.124957 - 1)) — about a tenth of the 30.0 branch threshold — so all 32 parity rungs take the unchanged Knuth path. The ladders green here is a COVERAGE fact, recorded so it is not mistaken for evidence'
      - 'THE BAR IS ON THE DISTRIBUTION, NEVER ON THE STREAM: the sampler draws from `prophet::Rng`, this crates own seeded xorshift, never MT19937, so a draw-for-draw match with numpy was never available and is not what is asserted. Mean and variance are what a band-width estimate depends on, and both are exactly lambda for `lambda + sqrt(lambda) * N(0, 1)`'
      - 'THE MEAN TOLERANCE IS A REAL BAR, NOT A FUDGE — RESTATED FOR N = 60 000 (plan 06-17). The relative standard error of the mean is sqrt(1 / (lambda * N)), so at N = 60 000 the 1 % bar is 4.24 sigma at the lambda = 3 this plan added (0.2357 %), 5.48 at lambda 5, 13.2 at 29, 13.6 at 31, 24.5 at 100, 73.5 at 900 and 130.5 at 2839. THE WEAKEST POINT IS lambda = 3 AT 4.24 SIGMA, and it is why N had to rise: the same bar at the same point was only 2.45 sigma at the N = 20 000 this sweep used before, below the 4-sigma floor this contract holds every statistical bar to. The 06-13 statement of this invariant described N = 20 000 (3.16 sigma at lambda 5) and is superseded rather than deleted, because a documented number that no longer describes the test is worse than none. The measured post-fix maximum is 0.165 % (lambda 31) and the pre-fix failure at lambda 900 is 17.2 % — 17x the bar'
      - 'WHY ONE STATISTIC WAS NOT A DOMAIN CHECK (WR-02). Until plan 06-17 the falsification test barred the MEAN alone, and `fn poisson(_rng, lambda) -> lambda.round() as usize` — a ZERO-VARIANCE stub, which collapses every logistic band to the deterministic trend while the caller is still told the interval carries the `interval_width` it asked for — reported rel = 0.000000 at EVERY sweep point and passed outright. That is an output whose meaning changes with nothing in the response to say so. The `codomain` above always promised "mean AND VARIANCE", and FALSIFY-PROPHET-013 always described its failure in variance terms; only the assertion was narrower than both. OBSERVED: under the stub the variance bar reports rel = 1.000000 at all seven lambdas and the zero-mass bar rel = 1.000000 at lambda 3 and 5, while the mean bar still passes at all seven'
      - 'THE VARIANCE TOLERANCE AND ITS SIGMA ARITHMETIC. For a Poisson the fourth central moment is lambda + 3*lambda^2, so the relative standard error of the sample variance is sqrt(1/lambda + 2) / sqrt(N) — 0.624 % at lambda = 3 and essentially flat across the sweep (0.606 % at 5, 0.578 % at 2839). At `variance_tolerance: 0.05` and N = 60 000 that is 8.02 sigma at lambda 3, 8.26 at 5, 8.59 at 29, 8.59 at 31, 8.64 at 100, 8.66 at 900 and 8.66 at 2839, while the zero-variance stub sits at a relative deviation of 1.0 — twenty times the bar. THE REVIEWS SUGGESTED "1-2 %" BAR IS REFUSED and the refusal is recorded rather than silently widened: 2 % is 1.91 sigma at N = 20 000, a flake rather than a bar, and the raise-N escape does not rescue it either — at N = 80 000 a 2 % bar is still only 3.70 sigma at the lambda = 3 this sweep now includes. Note that `round()` inflates a NORMAL-branch variance by about 1/12, which is 0.27 % at lambda 31 and smaller above (negligible against 5 %), while the Knuth branch draws exact integers and carries no such term'
      - 'THE ZERO-MASS TOLERANCE IS WHAT DETECTS A LOWERED BRANCH THRESHOLD (WR-01, second half). The mean is exactly the statistic the normal approximation gets right, so lowering `poisson_normal_branch_lambda` to 3.2 — handing every real logistic request the approximation, in the lambda < 30 regime this contract itself says it is not standard for — left every mean inside the 0.01 bar. The LOW TAIL is where it is visibly wrong: the clamped normal draws round(lambda + sqrt(lambda) * Z).max(0), which is 0 whenever Z < (0.5 - lambda)/sqrt(lambda), giving 0.02209 at lambda = 5 against an exact exp(-5) = 0.006738 (3.28x, a relative deviation of 2.278) and 0.07446 at lambda = 3 against exp(-3) = 0.049787 (1.50x, a relative deviation of 0.4956). OBSERVED at the lowered threshold: p_zero = 0.022133, rel = 2.284878 at lambda = 5 — the analytic prediction to three digits — while every mean stayed inside 0.01 and the VARIANCE bar also stayed green, which is why BOTH new bars were needed and neither alone would do'
      - 'THE ZERO-MASS BAR IS PINNED BY TWO CONSTRAINTS, AND THE WINDOW DOES NOT EXIST AT N = 20 000. The relative standard error on p_zero is sqrt((1 - p) / (N * p)), which at N = 60 000 is 4.957 % at lambda = 5 and 1.784 % at lambda = 3. One shared key must be at least 4 sigma above the noise at its weakest point (>= 4 x 0.04957 = 0.1983 at lambda 5) AND at most half the SMALLER defect gap so it still discriminates (<= 0.4956 / 2 = 0.2478 at lambda 3). `zero_mass_tolerance: 0.22` sits inside [0.1983, 0.2478] — 4.44 sigma at lambda 5 and 12.34 sigma at lambda 3. At N = 20 000 the same two constraints are 0.3434 and 0.2478 and DO NOT OVERLAP, so no single shared key there is both non-flaky and discriminating; that infeasibility, not the defect gap, is what forced N to 60 000'
      - 'THE ZERO-MASS BAR IS APPLIED ONLY WHERE IT MEANS SOMETHING, AND SAYS SO. It runs where N * exp(-lambda) >= 30, which at N = 60 000 selects lambda = 3 (2 987 expected zeros) and lambda = 5 (404), and skips 29 and above, where exp(-29) = 2.5e-13 makes a zero a rounding artefact rather than an observation. The sweep PRINTS every point it checked and every point it skipped with the expected count and the reason, and a non-vacuity assertion pins the checked count at 2, so N, LAMBDAS or the minimum cannot move and quietly leave this bar running nowhere — a silently-skipped assertion is the vacuous-guard class this whole round exists to end'
      - 'EVERY SHIPPED BAR CLEARS 4 SIGMA AT EVERY POINT IT IS APPLIED, and the weakest of the three is the MEAN bar at lambda = 3 (4.24 sigma), not either of the new ones. Adding a sweep point weakens every bar at that point, so the arithmetic above is redone for all three bars at all seven lambdas rather than only for the two being added'

  band_width_last30_rel:
    formula: '|mean_width_rust(last 30 rows) - uncertainty.future_band_last30_mean_width| <= 0.02 * uncertainty.future_band_last30_mean_width'
    domain: 'the last 30 forecast rows of the four spike-003 fixtures, Rust fit parameters, 1000 draws at seed 42'
    codomain: 'the fixture `uncertainty.future_band_last30_mean_width`'
    float_tolerance: 0.02
    invariants:
      - 'the widest part of the fan, where the trend-shift simulation has accumulated the most; measured up to 1.4% on wp_log_R_logistic'
      - 'binds only the spike-003 fixtures — the spike-001 files publish no last-30 reference'

  trend_band_width_rel:
    formula: '|mean_trend_width_rust(future rows) - uncertainty.future_trend_band_mean_width| <= 0.05 * uncertainty.future_trend_band_mean_width'
    domain: 'the future forecast rows of the four spike-003 fixtures, Rust fit parameters, 1000 draws at seed 42'
    codomain: 'the fixture `uncertainty.future_trend_band_mean_width`'
    float_tolerance: 0.05
    invariants:
      - 'the TREND band excludes the observation-noise term, so it is a much smaller number and a much noisier ratio than the yhat band'
      - 'measured 3.9% on peyton_default, which is why it is excluded from the 2% bar and given its own'

  fit_recipe:
    formula: 'theta_fit = restart_loop(LbfgsF64::new(max_iters_per_round, 1e-7, lbfgs_memory), objective = negative log posterior / T, guard = 1e300 on non-finite, exact L1 on delta), rounds <= max_rounds'
    domain: 'a Design built by `prophet::make_design` from a strictly ascending history'
    codomain: '(Params, FitInfo{rounds, iterations, evals, objective, status, budget_hit})'
    invariants:
      - 'EVERY piece is load-bearing and was measured against Prophet 1.4.0: objective divided by T, the non-finite guard returning 1e300, EXACT L1 on delta (never a smoothed surrogate), LbfgsF64::new(2000, 1e-7, 20), Stalled ACCEPTED as success, restarts from the stall point until the relative improvement falls below 1e-6 or max_rounds is spent, and the x-keyed value+grad cache'
      - 'D-09 diagnostics are observable and asserted on every fixture: rounds <= max_rounds, status in {Stalled, Converged}, budget_hit == false'
      - >
        THE 15 s BUDGET IS COOPERATIVE, NOT A CAP (REVIEW-06-U1). `fit_prophet` inspects the elapsed wall
        clock exactly once per COMPLETED L-BFGS round, after that round improvement check — i.e. only at
        round boundaries. A single round of up to `max_iters_per_round` iterations may therefore overrun
        15 s, and `budget_hit` means "a round boundary was crossed late", never "the fit was cut off at
        15 s". The HARD bounds on the work a request can buy are `max_iters_per_round`,
        `types::MAX_POINTS` and `types::MAX_HORIZON`. Do NOT add a mid-iteration budget check: that would
        change the recipe the whole ladder was measured under.
      - 'Stalled is the EXPECTED terminal status: exact L1 on delta puts kinks in the objective and L-BFGS stalls at one rather than converging'
      - 'fit_budget_secs is a cooperative budget checked only at a round boundary; it is NOT a hard wall-clock cap and no code enforces one'

proof_obligations:

  - type: equivalence
    property: 'Rust data preparation reproduces Prophet 1.4.0 Stan data block exactly, from the raw (ds, y) alone, on every committed fixture'
    formal: '∀ fixture: max_abs_diff(design, stan_data) ≤ equations.data_prep_exact.float_tolerance'
    applies_to: all

  - type: bound
    property: 'The Rust objective evaluated at Python MAP is within 1e-9 of Python own -lp, on every committed fixture that publishes -lp'
    formal: '∀ fixture with lp: |f_rust(theta_py) + log_posterior_at_map_unnormalized| ≤ equations.objective_at_python_map_abs.float_tolerance'
    applies_to: all

  - type: bound
    property: 'On the Peyton Manning datasets, Python parameters through Rust predict reproduce Python yhat and trend to 1e-10 absolute'
    formal: 'max|yhat_rust(theta_py) - yhat_py| <= equations.predict_path_abs_peyton.float_tolerance'
    applies_to: all

  - type: bound
    property: 'On every committed fixture, Python parameters through Rust predict reproduce Python yhat and trend to 1e-14 relative to y_scale'
    formal: 'forall fixture: max|yhat_rust(theta_py) - yhat_py| <= equations.predict_path_rel_yscale.float_tolerance * y_scale'
    applies_to: all

  - type: invariant
    property: 'The changepoint-count sampler operates INSIDE its numerical domain — in its SPREAD and its LOW TAIL as well as its centre — for every lambda the forecast door can produce, not merely for the lambdas the parity ladder happens to reach'
    formal: 'forall lambda in (0, s_max * (max_horizon_ratio - 1)]: |E[poisson(lambda)] - lambda| <= equations.poisson_sampler_domain.float_tolerance * lambda AND |Var[poisson(lambda)] - lambda| <= equations.poisson_sampler_domain.variance_tolerance * lambda AND (N * exp(-lambda) >= 30 -> |P[poisson(lambda) = 0] - exp(-lambda)| <= equations.poisson_sampler_domain.zero_mass_tolerance * exp(-lambda))'
    applies_to: all

  - type: bound
    property: 'The Rust MAP fit never lands more than 0.5 objective units above Python MAP on any committed fixture'
    formal: '∀ fixture: f_rust(theta_fit) - f_python ≤ equations.fitted_objective_slack.float_tolerance'
    applies_to: all

  - type: bound
    property: 'On Peyton Manning, the Rust fitted forecast lies inside Prophet own Newton-vs-L-BFGS disagreement band over the future rows'
    formal: 'max|yhat_rust(theta_fit) - yhat_py| over future rows <= equations.future_yhat_band_peyton_abs.float_tolerance'
    applies_to: all

  - type: bound
    property: 'Every named component Rust predict produces at Python MAP matches the fixture component array to 1e-10'
    formal: 'forall component c published by the fixture: max|c_rust(theta_py) - c_py| <= equations.components_via_python_params_abs.float_tolerance'
    applies_to: all

  - type: invariant
    property: 'The returned component decomposition reconstructs the returned yhat: trend*(1+multiplicative_terms)+additive_terms == yhat'
    formal: '∀ i: |trend_i*(1+mul_i) + add_i - yhat_i| ≤ equations.components_rebuild_yhat_abs.float_tolerance'
    applies_to: all

  - type: bound
    property: 'Mean 80% band width over history and over future rows is within 2% of the Python reference on all seven fixtures'
    formal: '∀ fixture: |w_rust - w_py| ≤ equations.band_width_rel.float_tolerance * w_py'
    applies_to: all

  - type: bound
    property: 'Mean 80% band width over the last 30 forecast rows is within 2% of uncertainty.future_band_last30_mean_width'
    formal: '∀ spike003 fixture: |w30_rust - w30_py| ≤ equations.band_width_last30_rel.float_tolerance * w30_py'
    applies_to: all

  - type: bound
    property: 'Mean future TREND band width is within 5% of uncertainty.future_trend_band_mean_width'
    formal: '∀ spike003 fixture: |wt_rust - wt_py| ≤ equations.trend_band_width_rel.float_tolerance * wt_py'
    applies_to: all

  - type: determinism
    property: 'The D-09 fit recipe terminates within max_rounds restarts with a Stalled or Converged status and without hitting the cooperative budget, on every committed fixture'
    formal: '∀ fixture: info.rounds ≤ constants.max_rounds ∧ info.status in {Stalled, Converged} ∧ info.budget_hit == false'
    applies_to: all

  - type: equivalence
    property: 'The extra-regressor design reproduces Prophet 1.4.0 at BOTH committed widths, with names, masks and prior scales EXACT and the standardised cells inside their measured bar — and the components, predict path and fitted objective follow at their own rungs'
    formal: 'forall regressor fixture in {24 columns, 30 columns}: columns_rust == columns_py elementwise AND max(|prior_scales_rust - prior_scales_py|, |s_a_rust - s_a_py|, |s_m_rust - s_m_py|) <= equations.regressor_column_order_exact.float_tolerance AND max|X_rust - X_py| over X_first3/X_last3 <= equations.regressor_design_cells_abs.float_tolerance AND max|c_rust(theta_py) - c_py| <= equations.regressor_components_rel_yscale.float_tolerance * y_scale for every published component AND f_rust(theta_fit) - f_reference <= equations.regressor_fitted_objective_slack.float_tolerance'
    applies_to: all

falsification_tests:

  - id: FALSIFY-PROPHET-001
    rule: 'Data preparation parity is EXACT'
    prediction: 'For all seven fixtures the max abs difference between the Rust design (t, y_scaled, changepoints_t, X first/last 3 rows) and the fixture Stan data is 0.0, the seasonality (name, period, fourier_order) list is equal, prior_scales are equal, and on spike-003 fixtures the column names/order, s_a, s_m and history.cap_scaled agree.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::data_prep_exact'
    if_fails: 'The Fourier column order, the changepoint linspace-round rule, the y_scale definition (max|y|, not mean), the holiday-window column naming/sort, or the logistic cap scaling diverged from Prophet 1.4.0. Nothing downstream in this contract means anything until this rung is green.'

  - id: FALSIFY-PROPHET-002
    rule: 'Objective parity at Python MAP'
    prediction: 'peyton_manning_objective_at_python_map, air_passengers_objective_at_python_map and retail_sales_objective_at_python_map each report |f_rust(theta_py) + lp| <= 1.0e-9.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::objective_at_python_map'
    if_fails: 'A prior term, the 2*sigma^2 term, the n*ln(sigma) term, the exact L1 on delta, or the 1/T scaling diverged from the Prophet 1.4.0 Stan model block. This is the rung that makes every later claim about the fit meaningful.'

  - id: FALSIFY-PROPHET-003
    rule: 'Predict-path parity, absolute, on the D-04 dataset'
    prediction: 'peyton_manning_predict_path_via_python_params and peyton_default_predict_path_via_python_params report max|d yhat| and max|d trend| <= 1.0e-10 against the fixture forecast columns.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::peyton_manning_predict_path_via_python_params'
    if_fails: 'The prediction path (trend extrapolation past the last changepoint, the future feature rows, or the additive/multiplicative assembly) diverged. Because this rung uses PYTHON parameters it cannot be excused by an optimiser difference.'

  - id: FALSIFY-PROPHET-004
    rule: 'Predict-path parity, relative to y_scale, on every fixture'
    prediction: 'All seven <fixture>_predict_path_via_python_params tests report max|d yhat| <= 1.0e-14 * y_scale and max|d trend| <= 1.0e-14 * y_scale.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::predict_path_via_python_params'
    if_fails: 'The predict path diverged on a growth mode, a seasonality mode or a holiday configuration that Peyton alone does not exercise (logistic gammas, multiplicative assembly, holiday windows).'

  - id: FALSIFY-PROPHET-005
    rule: 'The Rust MAP fit is not worse than Python by more than the slack'
    prediction: 'All seven <fixture>_fit_objective_and_forecast tests report info.objective <= f_python + 0.5.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::fit_objective_and_forecast'
    if_fails: 'The D-09 recipe was changed (memory, tolerance, per-round iteration cap, the improvement threshold, the restart loop, or the acceptance of Stalled), or the objective/gradient pair disagrees so line search cannot descend.'

  - id: FALSIFY-PROPHET-006
    rule: 'Peyton future forecast lies inside Prophet own optimiser band'
    prediction: 'peyton_manning_fit_objective_and_forecast and peyton_default_fit_objective_and_forecast report future max|d yhat| <= 0.0079 against the fixture forecast.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::peyton_manning_fit_objective_and_forecast'
    if_fails: 'The fit reached a materially different basin than Prophet own. Note the bar is Prophet Newton-vs-L-BFGS disagreement, so a failure means Rust is further from Python than Python is from itself.'

  - id: FALSIFY-PROPHET-007
    rule: 'Named component parity at Python MAP'
    prediction: 'Every named component the fixture publishes and Rust predict produces matches to 1.0e-10 on all seven fixtures.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::predict_path_via_python_params'
    if_fails: 'A component was assembled from the wrong column subset, or an additive component was left unscaled / a multiplicative component was scaled by y_scale.'

  - id: FALSIFY-PROPHET-008
    rule: 'The component decomposition reconstructs yhat'
    prediction: 'trend*(1+multiplicative_terms)+additive_terms reproduces yhat within 1.0e-12 on every forecast row of every fixture.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::predict_path_via_python_params'
    if_fails: 'The tool returns a decomposition that does not add up to the number it returns — a caller charting components would be charting a different model than the forecast.'

  - id: FALSIFY-PROPHET-009
    rule: '80% band widths are within 2% of the Python reference'
    prediction: 'All seven <fixture>_band_widths_within_contract tests report |w_rust - w_py| <= 0.02 * w_py for the history mean width and the future mean width.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::band_widths_within_contract'
    if_fails: 'The uncertainty simulation diverged: the trend-shift matrix construction, the Laplace scale (mean|delta| + 1e-8), the changepoint likelihood, the observation-noise term, or the numpy-linear percentile rule.'

  - id: FALSIFY-PROPHET-010
    rule: 'Last-30-row band width is within 2%'
    prediction: 'The four spike-003 <fixture>_band_widths_within_contract tests report |w30_rust - w30_py| <= 0.02 * uncertainty.future_band_last30_mean_width.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::peyton_default_band_widths_within_contract'
    if_fails: 'The fan does not widen the way Prophet does: the cumulative double-sum over the trend-shift matrix, or the single_diff spacing, is wrong.'

  - id: FALSIFY-PROPHET-011
    rule: 'Future TREND band width is within 5%'
    prediction: 'The four spike-003 <fixture>_band_widths_within_contract tests report |wt_rust - wt_py| <= 0.05 * uncertainty.future_trend_band_mean_width.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::wp_log_r_logistic_band_widths_within_contract'
    if_fails: 'The trend-only percentile path is wrong — most likely the logistic re-simulation (Poisson-many new changepoints on (1, T], Laplace deltas, full piecewise_logistic re-evaluation) rather than the linear path.'

  - id: FALSIFY-PROPHET-012
    rule: 'D-09 fit diagnostics are observable and bounded'
    prediction: 'Every <fixture>_fit_objective_and_forecast test observes info.rounds <= constants.max_rounds (8), info.status in {Stalled, Converged}, and info.budget_hit == false.'
    test: 'cargo test -p aprender-forecast --lib prophet::parity::fit_objective_and_forecast'
    if_fails: 'Either the restart loop is spinning (rounds at the cap), the optimiser is reporting a failure status the recipe does not accept, or a fixture-sized fit is now crossing the 15 s cooperative budget — a performance regression that also invalidates the recorded ladder wall.'

  - id: FALSIFY-PROPHET-013
    rule: 'The changepoint-count sampler stays inside its numerical domain'
    prediction: 'prophet::sampler::poisson_mean_and_variance_track_lambda_across_its_whole_domain draws 60 000 samples at each of lambda = 3, 5, 29, 31, 100, 900 and 2839 and reports |mean - lambda| / lambda <= equations.poisson_sampler_domain.float_tolerance (0.01) at every one. THE PRE-FIX IMPLEMENTATION FAILS THIS: with Knuths product method used at every lambda the measured means are 745.13 at lambda 900 (rel 0.172) and 745.45 at lambda 2839 (rel 0.737), while 3 / 5 / 29 / 31 / 100 track. `prophet::sampler::wp_log_r_logistic_fixture_lambda_is_far_below_the_branch_threshold` measures the only logistic fixtures lambda at 3.1239, which is why all 32 parity rungs pass either way.'
    test: 'cargo test -p aprender-forecast --lib prophet::sampler'
    if_fails: 'The logistic bands are again being computed by a sampler running outside its domain: the simulated changepoint count saturates near 745 instead of tracking lambda, the simulated trends spread less than the Poisson law asks for, and `yhat_lower` / `yhat_upper` come back NARROWER than the `interval_width` the response advertises — with nothing in `diagnostics` to say so. That is a silent change in the meaning of an output the caller is told to trust.'

  - id: FALSIFY-PROPHET-014
    rule: 'The sampler domain check bars the SPREAD and the LOW TAIL, not only the centre'
    prediction: 'The same seven-point sweep additionally reports |var - lambda| / lambda <= equations.poisson_sampler_domain.variance_tolerance (0.05) at every lambda, and |p_zero - exp(-lambda)| / exp(-lambda) <= equations.poisson_sampler_domain.zero_mass_tolerance (0.22) at the two lambdas where N * exp(-lambda) >= 30 (3 and 5 at N = 60 000). TWO IMPLEMENTATIONS THAT PASS FALSIFY-PROPHET-013 FAIL THIS, both OBSERVED under plan 06-17 and then restored. (a) `fn poisson(_rng, lambda) -> lambda.round() as usize`, a zero-variance stub: variance rel = 1.000000 at all seven lambdas and zero mass rel = 1.000000 at 3 and 5, while every MEAN still reports rel = 0.000000. (b) `poisson_normal_branch_lambda` lowered from 30 to 3.2, handing every real logistic request the normal approximation: zero mass rel = 2.284878 at lambda = 5 (p_zero 0.022133 against an exact 0.006738) while every mean stays inside 0.01 AND the variance bar also stays green — so neither of the other two bars would have caught it.'
    test: 'cargo test -p aprender-forecast --lib prophet::sampler::poisson_mean_and_variance_track_lambda_across_its_whole_domain'
    if_fails: 'The sampler SPREAD has left its domain even if its centre has not. A count with the right mean and the wrong variance makes the simulated trends spread by something other than the Poisson law, so `yhat_lower` / `yhat_upper` come back NARROWER (or wider) than the `interval_width` the response advertises, with `diagnostics` saying nothing — the same silent change of meaning FALSIFY-PROPHET-013 guards against, in the moment the mean alone cannot see it. If it is the zero-mass half that is red, check `poisson_normal_branch_lambda` first: the low tail is the statistic that moves when the exact sampler is swapped for the approximation.'

  - id: FALSIFY-PROPHET-015
    rule: 'The extra-regressor ladder holds at BOTH committed widths, and each rung binds its OWN bar'
    prediction: 'The twelve `reg_parity::retail_regressors_*` and `reg_parity::retail_regressors_holidays_*` tests report: the column NAME list equal element-for-element with a count of exactly 24 and exactly 30; max abs d prior_scales / s_a / s_m = 0.00e0 at the exact bar; max abs d X over X_first3 + X_last3 = 3.331e-15 at BOTH widths, inside the measured 1.0e-14 cell bar; mu and std within 1.0e-14 (worst 3.55e-15) with promo at exactly mu = 0.0, std = 1.0; the Rust objective at the oracle MAP equal to the published `lp__` in every one of the four decimals the oracle wrote down; yhat and trend within 1.0e-15 * y_scale (measured 2.33e-10 and 1.75e-10 absolute at a y_scale of 518253); EXACTLY 9 and EXACTLY 12 components compared as set equality within 1.0e-14 * y_scale (worst 3.6e-11 and 2.9e-11); and a one-sided fitted objective slack of -3.4166 and -2.2226 against the +0.5 bar with every beta finite.'
    test: 'cargo test -p aprender-forecast --lib reg_parity'
    if_fails: 'Read WHICH rung named itself. A red column-order rung means the splice stopped appending or the holiday name sort moved, and the D-19 no-argument invariance gate is no longer free. A red CELL rung at order-unity means the standardisation divisor or the column order is wrong; at order 1e-15 it means the bar was tightened to exact and is now rejecting the validated port — restore the measured bar, do not loosen the port. A red components rung with a COUNT mismatch means the compared set silently grew or shrank, which is how a value comparison stops comparing. A red objective rung is the only rung entitled to be read as a fit defect, and only after the printed identifiability table is checked: a coefficient 4.7x from Python at NEGATIVE slack is a better optimum, not a parity failure.'

  - id: FALSIFY-PROPHET-016
    rule: 'No contract-owned tolerance literal lives in the regressor ladder source'
    prediction: '`reg_parity::no_literal_tolerance_lives_in_this_module` reads its own source via include_str!, strips line AND block comments, and finds none of 1e-14 / 1e-15 / 1e-10 / 0.5 / 0.02 / 0.0079 / 3.33e-15 in the remainder; `reg_parity::no_literal_case_table` proves the pattern discriminates by running a must-match / must-not-match table in the same process as the gate itself.'
    test: 'cargo test -p aprender-forecast --lib reg_parity::no_literal'
    if_fails: 'Either a bar was hardcoded into a test instead of read from this contract — in which case it can be loosened without the contract ever noticing, and every tolerance in this file becomes decorative — or the pattern itself drifted, which the case table names directly. A gate without its case table has been wrong five times in this repo (CLAUDE.md Verification Discipline rule 7); the two tests ship together for that reason.'

