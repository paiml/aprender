- type: invariant
  property: "lr(0) ≈ 0 and lr(warmup_steps) == lr_max"
- type: invariant
  property: "lr is monotone non-decreasing on [0, W] and non-increasing on [W, T]"
- type: invariant
  property: "lr(total_steps) ≈ min_lr"
- type: invariant
  property: "Cosine decay is smooth (no per-step jumps > 5%)"
- type: equivalence
  property: "apr --lr-schedule cosine --warmup-steps W  ≅  HF get_cosine_schedule_with_warmup(optimizer, W, T) / PyTorch CosineAnnealingLR"

