  intake_status: partial
  description: >
    Auto-generate model card. Root-cause workflow extracted from huggingface UX — see master
    subspec §5.G and §2 Five Whys methodology for rationale. This
    draft contract exists to satisfy the Iron Rule "no contract → no user
    story"; the falsification body below is a placeholder and MUST be
    replaced with the competitor's canonical CLI transcript before promotion.

equations:
  model_card_generation:
    formula: |
      HuggingFace canonical:
        from huggingface_hub import ModelCard, ModelCardData
        card = ModelCard.from_template(
            card_data=ModelCardData(language="en", license="apache-2.0",
                                     model_name="foo", base_model="bar"),
            template_path=None  # uses default jinja template
        )
        card.save("README.md")
      → README.md with YAML front-matter (language, license, tags, model_name,
        base_model, datasets, metrics) + Markdown body sections
      apr parity:
        apr model-card model.apr -o README.md
        (or apr publish ... --generate-model-card)
      → README.md with YAML front-matter containing AT LEAST:
        {license, model_name, base_model_or_architecture, tags, created_at}
      AND body sections: "Model Details", "Intended Use", "Training Data",
                         "Evaluation", "Limitations"
    domain: "local model file + optional metadata flags"
    codomain: "README.md text with YAML front-matter and required Markdown sections"
    invariants:
    - "Output file starts with a YAML front-matter block delimited by `---`"
    - "Front-matter includes required keys: license, model_name (or model-index.name)"
    - "Body contains H2 sections: Model Details, Intended Use, Training Data, Evaluation, Limitations"
    - "Generator is deterministic given the same model + metadata (no timestamps in body)"

  front_matter_parseable_by_hf:
    formula: |
      YAML front-matter produced by apr must be accepted by
      huggingface_hub.ModelCard.load(path) without raising.
    domain: "README.md generated by apr"
    codomain: "huggingface_hub.ModelCard object"
    invariants:
    - "ModelCard.load on apr-generated README.md does not raise"
    - "card.data.license is non-null"

falsification_tests:
- id: FALSIFY-CRUX-G-03-001
  rule: "apr-generated model card has required YAML front-matter and Markdown sections, and is loadable by huggingface_hub.ModelCard"
  prediction: "apr model-card model.apr -o README.md produces a file with YAML front-matter (license, model_name) and H2 sections Model Details / Intended Use / Training Data / Evaluation / Limitations"
  test: |
    set -euo pipefail
    TMP=$(mktemp -d)
    apr model-card tests/fixtures/tiny-q4k.apr \
        --license apache-2.0 --base-model paiml/tiny \
        -o "$TMP/README.md"
    head -1 "$TMP/README.md" | grep -q '^---$'
    grep -q '^license:' "$TMP/README.md"
    grep -q '^model_name:\|^model-index:' "$TMP/README.md"
    grep -q '^## Model Details'   "$TMP/README.md"
    grep -q '^## Intended Use'    "$TMP/README.md"
    grep -q '^## Training Data'   "$TMP/README.md"
    grep -q '^## Evaluation'      "$TMP/README.md"
    grep -q '^## Limitations'     "$TMP/README.md"
    uv run --with huggingface_hub python3 -c "
    from huggingface_hub import ModelCard
    c = ModelCard.load('$TMP/README.md')
    assert c.data.license == 'apache-2.0', c.data.license
    "
  if_fails: "model card missing required YAML front-matter, required sections, or not loadable by huggingface_hub.ModelCard"

- id: FALSIFY-CRUX-G-03-002
  rule: "card generation is deterministic on identical inputs"
  prediction: "two runs with the same flags produce byte-identical output (no wall-clock timestamps leaking in)"
  test: |
    set -euo pipefail
    A=$(mktemp); B=$(mktemp)
    apr model-card tests/fixtures/tiny-q4k.apr --license apache-2.0 \
        --base-model paiml/tiny -o "$A"
    apr model-card tests/fixtures/tiny-q4k.apr --license apache-2.0 \
        --base-model paiml/tiny -o "$B"
    diff "$A" "$B"
  if_fails: "model-card output is non-deterministic (timestamps or random data leaking into body)"

proof_obligations:
- type: invariant
  property: "apr-generated README.md begins with YAML front-matter and contains required H2 sections"
- type: invariant
  property: "apr-generated README.md is loadable by huggingface_hub.ModelCard.load without error"
- type: parity
  property: "apr model-card produces a README.md with the same required front-matter keys as huggingface_hub.ModelCard.from_template on equivalent ModelCardData"
  competitor: huggingface
  reference: "https://huggingface.co/docs/huggingface_hub/main/en/package_reference/cards (ModelCard.from_template, ModelCard.load)"

