# CRUX-A-25 — Garbage-collect unused models

metadata:
  id: CRUX-A-25
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Intake & Discovery"
  competitor: ollama
  demand_score: 3
  intake_status: missing
  description: >
    `apr rm TAG` removes a manifest; `apr gc` deletes now-unreferenced blobs.
    Canonical: `ollama rm` decrements a blob refcount; Ollama daemon runs
    periodic GC. We expose it as an explicit verb plus optional `--gc` flag.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/huggingface/transformers — Trainer
  - docs.python.org — packaging, signatures, supply chain
equations:
  refcounted_gc:
    formula: |
      refcount(blob) = |{ manifest in registry if blob ∈ manifest.blobs }|
      apr rm TAG: delete manifest(TAG); no blob bytes freed yet
      apr gc:     for blob in blobs(): if refcount(blob)==0: unlink(blob_path)
      post-gc disk_bytes = sum(sizeof(blob) for blob with refcount ≥ 1)
    domain: "(action: {rm, gc}, tag: Option<str>, dry_run: bool)"
    codomain: "bytes freed + manifest of deletions (JSON when --format=json)"
    invariants:
    - "no blob referenced by any live manifest is ever unlinked"
    - "gc is idempotent — second run frees 0 bytes"
    - "--dry-run prints the candidate list without unlinking"

falsification_tests:
- id: FALSIFY-CRUX-A-25-001
  rule: gc frees bytes after rm of last referrer
  prediction: "pull → rm → gc frees ≥ (blob_size - 4 KiB) bytes"
  test: |
    set -euo pipefail
    export APR_MODELS=/tmp/apr-gc-$$
    mkdir -p "$APR_MODELS"
    apr pull hf://Qwen/Qwen2.5-0.5B-Instruct-GGUF:qwen2.5-0.5b-instruct-q4_k_m.gguf
    before=$(du -sb "$APR_MODELS" | cut -f1)
    apr rm qwen2.5-0.5b-instruct:q4_k_m
    apr gc
    after=$(du -sb "$APR_MODELS" | cut -f1)
    freed=$((before - after))
    [ "$freed" -gt 100000000 ]
  if_fails: rule 'gc frees bytes after rm of last referrer' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-A-25-002
  rule: gc never deletes referenced blobs
  prediction: "gc after rm of one of two copies frees 0 bytes (blob still referenced)"
  test: |
    set -euo pipefail
    apr pull hf://gpt2
    apr cp gpt2:latest gpt2:dup
    before=$(du -sb "$APR_MODELS" | cut -f1)
    apr rm gpt2:latest
    apr gc
    after=$(du -sb "$APR_MODELS" | cut -f1)
    delta=$((before - after))
    [ "$delta" -lt 8192 ]
  if_fails: rule 'gc never deletes referenced blobs' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-A-25-003
  rule: --dry-run prints but does not delete
  prediction: "apr gc --dry-run leaves disk usage unchanged"
  test: |
    set -euo pipefail
    apr pull hf://gpt2
    apr rm gpt2:latest
    before=$(du -sb "$APR_MODELS" | cut -f1)
    apr gc --dry-run > /tmp/plan.txt
    after=$(du -sb "$APR_MODELS" | cut -f1)
    [ "$before" = "$after" ]
    grep -E "would free|candidate" /tmp/plan.txt

  if_fails: rule '--dry-run prints but does not delete' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr rm + apr gc together match `ollama rm` refcount semantics"
- type: invariant
  property: "gc is refcount-safe — no live blob is ever unlinked"
- type: invariant
  property: "gc --dry-run never mutates; plan exactly equals subsequent real run"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

pmat_work_tracking:
  ticket_tag: crux-crux-a-25
  priority: medium
  auto_created: true
