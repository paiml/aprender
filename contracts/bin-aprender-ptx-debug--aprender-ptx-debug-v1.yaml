# ──────────────────────────────────────────────
# bin-aprender-ptx-debug--aprender-ptx-debug-v1 — the `aprender-ptx-debug` bin target of package aprender-ptx-debug
# (ONT-10 slice S18, 1/3)
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha256, helpSha256,
# gitSha, …) live in binary-surface-v1 and are not restated.
#
# MEASURED (2026-09-27, batch/ont-10 @ 8e88b8fc5d, release build, default features, private CARGO_TARGET_DIR):
#   `--version` = "aprender-ptx-debug 0.69.3": name right, no sha (G0.1 LIVE RED).
#   `--help` exits 0. `--no-such-flag` exits 1, not 2 (G1.2 LIVE RED): src/cli.rs exit_code_for_parse_error maps every
#   parse failure except help/version to 1 on purpose ("preserving the exit status" of the pre-clap parser), and
#   tests/cli_args.rs pins it. Turning it GREEN is a code + test change, not a contract edit.
#   Commands: analyze, gen-fkr, version (clap's `help` excluded); no nested subcommands; no enumerated flag values.
#   surface_audit.csv: 3 rows, set-equal to the commands.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-ptx-debug--aprender-ptx-debug-v1
version: "1.0.0"
scope: >
  The command surface of the `aprender-ptx-debug` binary (package aprender-ptx-debug, src
  crates/aprender-ptx-debug/src/bin/main.rs): its help, its usage errors, its version string, its subcommand set, and
  its surface-audit rows. Out of scope: what the PTX analysis computes.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-27'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    aprender-ptx-debug answers --help, rejects an unknown flag as a usage error, names the commit it was built from,
    exposes exactly the subcommands the snapshot records, and has an audited ledger row for each.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'contracts/bin-aprender-contracts-cli--pv-v1.yaml — the exemplar'
    - 'crates/aprender-ptx-debug/src/cli.rs — the clap Cli and exit_code_for_parse_error'
    - 'docs/audits/surface_audit.csv — the rows whose binary column is aprender-ptx-debug'
    - 'aprender#4502 — ONT-10, slice S18'

entity:
  type: binary
  ref: binary/aprender-ptx-debug/aprender-ptx-debug

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-aprender-ptx-debug-surface
    targetClass: bin:target/aprender-ptx-debug/aprender-ptx-debug
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["aprender-ptx-debug"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-ptx-debug"]}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "^aprender-ptx-debug [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-27 (no sha); a warning until the version string carries it
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: warning}
      - path: bin:command
        minCount: 3
        maxCount: 3
        in:
          - "analyze"
          - "gen-fkr"
          - "version"
      - {path: bin:unledgeredCommand, maxCount: 0}
      - {path: bin:ledgerOrphan, maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(aprender-ptx-debug)) = subcommands(clap(Cli)) = {analyze, gen-fkr, version} ∧ commands ⊆ {f.feature : f ∈ surface_audit, f.binary = aprender-ptx-debug}"
    domain: "the aprender-ptx-debug line of the tracked snapshot, the clap Command enum, and the 3 ledger rows"
    codomain: "set equality, or a Fail naming each command in the symmetric difference"
    invariants:
      - "a subcommand clap accepts and the snapshot omits is an unaudited surface"
    preconditions:
      - "the snapshot was written at this commit"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `aprender-ptx-debug --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-APRENDER-PTX-DEBUG-INV-001
    property: every aprender-ptx-debug subcommand has an audited ledger row
    formal: '∀ c ∈ commands(aprender-ptx-debug): |{r ∈ surface_audit : r.binary = aprender-ptx-debug ∧ r.feature = "aprender-ptx-debug " ++ c}| ≥ 1'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-APRENDER-PTX-DEBUG-001
    rule: 'G1.2 help answers'
    prediction: '`aprender-ptx-debug --help` exits 0 with non-empty stdout'
    test: 'scripts/dogfood_surfaces.sh --cli aprender-ptx-debug'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-27: exit 0, GREEN)'
    mutation: 'map DisplayHelp to 1 in exit_code_for_parse_error; must turn RED'
  - id: FALSIFY-BIN-APRENDER-PTX-DEBUG-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`aprender-ptx-debug --no-such-flag` exits 2'
    test: 'scripts/dogfood_surfaces.sh --cli aprender-ptx-debug'
    if_fails: 'LIVE RED 2026-09-27: exits 1 — exit_code_for_parse_error maps every parse error to 1 by design, pinned by tests/cli_args.rs; a wrapper cannot tell a typo from an analysis failure'
    mutation: 'after the fix, map ErrorKind::UnknownArgument back to 1; must turn RED'
  - id: FALSIFY-BIN-APRENDER-PTX-DEBUG-003
    rule: 'G0.1 the version names the commit'
    prediction: '`aprender-ptx-debug --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'LIVE RED 2026-09-27: "aprender-ptx-debug 0.69.3" — no sha; a stale binary reads as HEAD'
    mutation: 'drop the sha from version_string(); must turn RED'
  - id: FALSIFY-BIN-APRENDER-PTX-DEBUG-004
    rule: 'G1.3/G1.4 enumerated values are parsed by clap and the command set equals the snapshot'
    prediction: 'no flag takes an enumerated value (observed 2026-09-27); subcommands(clap) = {analyze, gen-fkr, version}'
    test: 'NOT YET WRITTEN — pv lint contracts/ --gate shapes on the snapshot, after extract:binary (ONT-4g)'
    if_fails: 'a subcommand could be added or dropped unmodelled'
    mutation: 'add a subcommand without re-snapshotting; must turn RED naming it'
  - id: FALSIFY-BIN-APRENDER-PTX-DEBUG-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 row per command with binary = aprender-ptx-debug (3 on 2026-09-27)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'the binary would ship unaudited (observed 2026-09-27: 3/3, GREEN)'
    mutation: 'delete every aprender-ptx-debug row; must turn RED naming aprender-ptx-debug'
