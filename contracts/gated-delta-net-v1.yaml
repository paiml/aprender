metadata:
  version: 2.0.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: Gated Delta Net — Qwen3.5 linear attention with decay, delta rule, and causal conv1d
  references:
  - 'Yang et al. (2024) Gated Delta Networks: Improving Mamba2 with Delta Rule'
  - Qwen3.5 Technical Report — Qwen3_5GatedDeltaNet layer
  - GH-278 implementation notes
  - aprender-serve gguf/inference/forward/forward_qwen35.rs (deltanet_prep_token, delta_rule_head), the served recurrence these equations state
  depends_on:
  - conv1d-kernel-v1
equations:
  decay:
    formula: α_t = exp(g_t),  g_t = softplus(a_t + dt_bias) × ssm_a,  ssm_a = −exp(A_log)
    domain: a_t ∈ ℝ (the alpha projection of x_t, one per value head), dt_bias ∈ ℝ, A_log ∈ ℝ
    codomain: α_t ∈ (0, 1) over ℝ; α_t ∈ [0, 1] in f32
    invariants:
    - Over ℝ, g_t < 0 because softplus > 0 and ssm_a < 0, so the state decays and never grows
    - Decay controls information retention
    - GGUF stores ssm_a, which is already −exp(A_log); APR and SafeTensors store A_log
    - Version 1.0.0 stated α_t = sigmoid(exp(A_log) × dt + dt_bias), which no crate computes
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Decay
  read:
    formula: r_t = S̃_tᵀ k_t,  S̃_t = α_t S_{t−1}
    domain: per value head, S_{t−1} ∈ ℝ^{k_dim × v_dim} with S_0 = 0, k_t ∈ ℝ^{k_dim} L2-normalised
    codomain: r_t ∈ ℝ^{v_dim}
    invariants:
    - Read is linear projection from state
    - The read sees the decayed state, because serve multiplies S by α_t before it reads (delta_rule_head step 1). Version 1.0.0 read the state before the decay
    - Value head h reads key head h mod H_k (GGUF order, as ggml_repeat tiles)
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Read
  delta:
    formula: δ_t = β_t × (v_t - r_t)
    domain: β_t = sigmoid(b_t) ∈ (0, 1) with b_t the beta projection of x_t, v_t ∈ ℝ^{v_dim}, r_t ∈ ℝ^{v_dim}
    codomain: δ_t ∈ ℝ^{v_dim}
    invariants:
    - Delta rule corrects toward target v_t
    - sigmoid is applied to b_t once
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Delta
  write:
    formula: S_t = S̃_t + k_t ⊗ δ_t,  S̃_t = α_t S_{t−1}
    domain: S̃_t ∈ ℝ^{k_dim × v_dim}, k_t ∈ ℝ^{k_dim}, δ_t ∈ ℝ^{v_dim}
    codomain: S_t ∈ ℝ^{k_dim × v_dim}
    invariants:
    - State shape preserved across timesteps
    - Outer product k_t ⊗ δ_t has shape [k_dim, v_dim]
    - Written out, S_t = α_t S_{t−1} + β_t k_t ⊗ (v_t − α_t S_{t−1}ᵀ k_t)
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Write
  output:
    formula: o_t = S_tᵀ q_t / √d_k
    domain: S_t ∈ ℝ^{k_dim × v_dim} after this step's write, q_t ∈ ℝ^{k_dim} L2-normalised, d_k = k_dim
    codomain: o_t ∈ ℝ^{v_dim}
    invariants:
    - z_t is not applied here. It gates once, as silu(z_t) inside gated_rmsnorm. Version 1.0.0 also multiplied o_t by z_t
    - gated_rmsnorm normalises per head, so a constant factor c on o_t changes the layer only through ε (as if ε were ε/c²). A test of the layer output cannot see a missing 1/√d_k, so test o_t directly
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Output
  gated_rmsnorm:
    formula: out_i = x_i / sqrt(Σ_j x_j² / d + ε) × w_i × silu(z_i), per head chunk of d = head_v_dim
    domain: x, z ∈ ℝ^{heads × d}, w ∈ ℝ^{d}, ε > 0
    codomain: out ∈ ℝ^{heads × d}
    invariants:
    - The input is normalised per head; the gate z is not
    - w is shared across heads (no head stride); z is indexed per head
    preconditions:
    - input.len() > 0
    - input.len() % head_v_dim == 0
    - input.iter().all(|v| v.is_finite())
proof_obligations:
- id: GDN-BND-001
  type: bound
  property: Decay in unit interval
  formal: α_t = exp(g_t) ∈ (0, 1) since g_t = softplus(a_t + dt_bias) × ssm_a < 0 (softplus > 0, ssm_a = −exp(A_log) < 0)
  applies_to: all
  lean:
    theorem: GatedDeltaNet.decay_mem_unit_interval
    module: ProvableContracts.GatedDeltaNet
    file: lean/ProvableContracts/Theorems/GatedDeltaNet/Recurrence.lean
    status: wip
    depends_on:
    - Real.exp_pos
    - Real.exp_lt_one
    - Real.log_pos
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.ExpDeriv
    - Mathlib.Analysis.SpecialFunctions.Log.Basic
    notes: >-
      Open again in 2.0.0. The theorem now in Recurrence.lean proves the bound
      for the 1.0.0 decay, σ(exp(A_log)·dt + dt_bias), which no crate computes.
      The served decay needs: softplus(x) = log(1 + exp x) > 0 (Real.log_pos,
      since 1 + exp x > 1); −exp(A_log) < 0 (Real.exp_pos); so g < 0 and
      0 < exp(g) < 1 (Real.exp_pos, Real.exp_lt_one). The bound holds over ℝ.
      In f32, softplus rounds to 0 once a + dt_bias is below about −17 (α = 1),
      and exp(g) underflows to 0.
- id: GDN-INV-002
  type: invariant
  property: State shape preserved
  formal: shape(state_{t+1}) == shape(state_t) == [k_dim, v_dim]
  applies_to: all
  lean:
    theorem: GatedDeltaNet.write_iterate_preserves_shape
    module: ProvableContracts.GatedDeltaNet
    file: lean/ProvableContracts/Theorems/GatedDeltaNet/Recurrence.lean
    status: proved
    mathlib_imports: []
    notes: >-
      Write S_{t+1}=α·S_t+k⊗δ keeps shape [k_dim,v_dim]: the outer product
      k⊗δ is [k_dim,v_dim], scalar-scale and elementwise-add preserve shape.
      Proved for n iterations by induction (write_iterate_preserves_shape);
      also outer_shape and write_preserves_shape. Core-only, no Mathlib.
- id: GDN-INV-003
  type: invariant
  property: Causal conv1d
  formal: conv1d output at t depends only on t..t-k+1
  applies_to: all
  lean:
    theorem: GatedDeltaNet.conv1d_causal
    module: ProvableContracts.GatedDeltaNet
    file: lean/ProvableContracts/Theorems/GatedDeltaNet/Recurrence.lean
    status: proved
    depends_on:
    - Finset.sum_congr
    - Nat.sub_le
    mathlib_imports:
    - Mathlib.Algebra.BigOperators.Group.Finset.Basic
    notes: >-
      o[t]=Σ_{j<k} w[j]·x[t−j] reads only indices t−j ≤ t. If two signals agree
      on all indices ≤ t the outputs at t are equal, so no future (>t) input can
      change o[t] (conv1d_causal + corollary conv1d_future_indep).
- id: GDN-INV-004
  type: invariant
  property: L2 norm preserves direction
  formal: L2(q) / ||L2(q)|| ≈ q / ||q||
  applies_to: all
  lean:
    theorem: GatedDeltaNet.normalize_same_direction
    module: ProvableContracts.GatedDeltaNet
    file: lean/ProvableContracts/Theorems/GatedDeltaNet/Recurrence.lean
    status: proved
    depends_on:
    - Real.sqrt_pos
    - Finset.single_le_sum
    mathlib_imports:
    - Mathlib.Data.Real.Sqrt
    notes: >-
      normalize(q)=(1/‖q‖)·q with ‖q‖>0 for q≠0 (l2norm_pos_of_ne via
      normSq_pos_of_ne); a strictly-positive scalar multiple is parallel to q
      (cosine similarity 1), so direction is preserved. Proof over ℝ^ι.
- id: GDN-EQ-005
  type: equivalence
  property: SIMD matches scalar within ULP
  tolerance: 8.0
  applies_to: simd
verification_summary:
  total_obligations: 5
  l2_property_tested: 4
  l3_kani_proved: 0
  l4_lean_proved: 3
  l4_sorry_count: 0
  l4_not_applicable: 1
  lean_file: crates/aprender-contracts-staging/lean/ProvableContracts/Theorems/GatedDeltaNet/Recurrence.lean
  lean_standalone_verified: false
  notes: >-
    3 of 5 obligations proved sorry-free in Lean 4 (Mathlib), verified by
    `lake env lean ProvableContracts/Theorems/GatedDeltaNet/Recurrence.lean`
    (exit 0, 0 sorry): write preserves [k_dim,v_dim] shape for n steps
    [GDN-INV-002], causal conv1d finite-support independence of future inputs
    [GDN-INV-003], L2-normalize is a positive scalar multiple hence
    direction-preserving [GDN-INV-004]. GDN-BND-001 is wip in 2.0.0: its Lean
    theorem and its property test (FALSIFY-GDN-001) both cover the 1.0.0
    sigmoid decay, so neither counts until it covers
    exp(softplus(a + dt_bias)·ssm_a). 3 proved + 1 wip + 1 N/A == 5.
    GDN-EQ-005 (SIMD==scalar within 8 ULP) is a runtime floating-point
    reduction-order property with NO exact algebraic identity — genuinely
    l4_not_applicable, verified empirically at L2 by FALSIFY-GDN-005, not faked
    to force L4. No obligation yet covers the recurrence's values: the scalar
    reference the tests call, gdn_recurrence_scalar, computes S ← αS + β k⊗v
    and o = qᵀS, with no v − Sᵀk term and no 1/√d_k. FALSIFY-GDN-006 states
    the check that would catch that; its test is not written yet.
    KANI-GDN-001's harness, verify_decay_bound, also still checks the 1.0.0
    sigmoid; l3_kani_proved is 0, so it is not counted.
falsification_tests:
- id: FALSIFY-GDN-001
  rule: Decay bound
  prediction: 'α = exp(softplus(a + dt_bias) × ssm_a) is finite and in [0, 1] for all finite a and dt_bias and every ssm_a < 0, and equals that expression evaluated in f64 within 1e-6. The range alone cannot see the 1.0.0 sigmoid decay, which is in (0, 1) too. Planted: the sigmoid decay restored turns it RED on the value; a flipped decay sign turns it RED on the range'
  test: '[U] the 2.0.0 test is not written. Today FALSIFY-GDN-001 is aprender-core''s prop_decay_in_unit_interval (tests/contracts/gated_delta_net_contract.rs), which checks the 1.0.0 sigmoid''s range, so it does not count (GDN-BND-001 is wip). Planned: proptest with extreme values, checking the range and the f64 value'
  if_fails: Decay sign or softplus wrong; α > 1 makes the state grow without bound
- id: FALSIFY-GDN-002
  rule: State shape
  prediction: State [k_dim, v_dim] after any number of updates
  test: proptest running recurrence for random timesteps
  if_fails: Outer product dimension mismatch
- id: FALSIFY-GDN-003
  rule: Causal conv
  prediction: Modifying future input does not change current output
  test: proptest comparing outputs with/without future modification
  if_fails: Conv1d not properly causal
- id: FALSIFY-GDN-004
  rule: L2 direction
  prediction: L2-normalized vector has same direction as input
  test: proptest checking cosine similarity ≈ 1
  if_fails: L2 normalization changes direction
- id: FALSIFY-GDN-005
  rule: SIMD equivalence
  prediction: SIMD and scalar give same result within ULP
  test: proptest comparing backends
  if_fails: SIMD reduction order differs
- id: FALSIFY-GDN-006
  rule: Delta rule
  prediction: 'The scalar reference matches serve''s delta_rule_head step by step, including the v − S̃ᵀk correction and the 1/√d_k output scale. Planted: the reference scaling o by 1/√d_v, or using one width for both, turns it RED, which only unequal widths can show'
  test: '[U] not written. Planned: proptest over random q, k, v, β, g and up to 8 timesteps, comparing S_t and o_t, at d_k = 8 and d_v = 4, with serve driven through delta_rule_recurrence_gqa on one key head and one value head. Unequal widths, because every local Qwen3.5 checkpoint has d_k = d_v = 128, and at equal widths both plants pass. Through delta_rule_recurrence_gqa, because it computes the scale (1/√head_k_dim, forward_qwen35.rs:247 at 316dee2cd4); a scale the test computed and passed to delta_rule_head would check the reference against the test, not against serve'
  if_fails: The reference is not the served recurrence (at 1.0.0 it computed S ← αS + β k⊗v)
kani_harnesses:
- id: KANI-GDN-001
  obligation: GDN-BND-001
  property: Decay exp(softplus(a + dt_bias) × ssm_a) in [0, 1] for bounded inputs with ssm_a < 0
  bound: 8
  strategy: stub_float
  solver: cadical
  harness: verify_decay_bound
- id: KANI-GDN-002
  obligation: GDN-INV-002
  property: State shape preserved after recurrence update
  bound: 4
  strategy: bounded_int
  solver: cadical
  harness: verify_state_shape_preserved
- id: KANI-GATED_-003
  obligation: GDN-BND-001
  property: Decay in unit interval
  bound: 8
  strategy: exhaustive
- id: KANI-GATED_-004
  obligation: GDN-INV-002
  property: State shape preserved
  bound: 8
  strategy: exhaustive
- id: KANI-GATED_-005
  obligation: GDN-INV-003
  property: Causal conv1d
  bound: 8
  strategy: exhaustive
- id: KANI-GATED_-006
  obligation: GDN-INV-004
  property: L2 norm preserves direction
  bound: 8
  strategy: exhaustive
- id: KANI-GATED_-007
  obligation: GDN-EQ-005
  property: SIMD matches scalar within ULP
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-GDN-001
  name: Gated Delta Net Contract
  description: Qwen3.5 linear attention recurrence quality gate
  checks:
  - decay_bound
  - state_shape
  - causal_conv
  - l2_direction
  - delta_rule
  pass_criteria: All 6 falsification tests pass
  falsification: Drop the minus sign in ssm_a = −exp(A_log), so α exceeds 1; FALSIFY-GDN-001 must fail
simd_dispatch:
  gated_delta_net:
    scalar: gdn_recurrence_scalar
    avx2: gdn_recurrence_avx2
    ptx: gated_delta_net_ptx
