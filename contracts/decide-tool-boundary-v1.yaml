qa_gate:
  id: F-DECIDE-TOOL-001
  name: 'Decision classify tool boundary gate'
  description: >
    The blocking gate for the classify tool boundary. Every correctness check is unit-falsifiable
    and runs in CI once plan 08-06 lands its tests; the accepted-region check is LIVE and is run by
    `just laya-deploy-verify` against a cold pmcp.run instance, never by a libtest assertion (plans
    08-17/08-18: deployed-passed at 3 008 MB; re-opened at 10 240 MB by v7.0.0 and measured by plan
    08-30). Every binding was `implemented` from plan 08-12; v7.0.0 set accepted_region_cold to
    `partial` until plan 08-30's live record at 10 240 MB passed. It passed (v9.0.0: 8 proven-cold
    samples, all under the cap), the row is `implemented` again, and `make contract-audit-phase8`
    runs with PHASE8_LIVE_EXEMPT unset and refuses every BIND- line.
  checks:
    - 'contract schema validity (pv validate, zero errors) and non-zero pv status counts'
    - 'every Rust boundary constant asserted EQUAL to this file'
    - 'count, byte and token-budget bounds each refuse one past and accept exactly-at'
    - 'response labels and probabilities ordered by task.json under both serde_json backings'
    - 'truncation flag on an over-room text'
    - 'every bound refusal an isError tool result (tool_rejected) on both transports, naming the key, omitting the text; model failures internal'
    - 'the served description promises truncation only when the artifact''s window fits the budget'
    - 'admission refuses the pending + 1th concurrent library caller and holds a slot until its blocking work ends; over live stdio pipelined calls are serialised by pmcp and all served in order'
    - 'LIVE, NOT IN CI: both maximal shapes complete cold under 30 s for every proven-cold sample, at lambda_memory_mb (plans 08-17/08-18 at 3 008 MB; plan 08-30 at 10 240 MB)'
  pass_criteria: 'FALSIFY-DECIDE-TOOL-001..008 pass on every host and each has been observed RED under an induced negative; FALSIFY-DECIDE-TOOL-009 has live evidence for both shapes with every cold sample under api_gateway_timeout_ms.'
  falsification: >
    Change constants.classify_max_total_tokens alone (touching no Rust) and the contract-mirror test
    must go red naming the key; revert and it goes green. Raise the budget past the derivation and
    the second proof obligation is violated on paper before any deploy can violate it live.
