contract: beat-ollama-decode-throughput-speed
metadata:
  kind: beat-benchmark
  version: "2.0.0"
  description: >
    Pillar-4 SPEED beat (PMAT-755 / audit gap #4): apr GPU decode tok/s vs ollama
    warm-daemon decode (eval) tok/s for the SAME Q4_K_M GGUF, SAME host/GPU (RTX
    4090 sm_89), SAME prompt. Audit gap #4 asked to convert the "apr ~1.23x faster
    than ollama" observation (PMAT-742, 2026-06-13) from TRACKING into a
    falsifiable GATED beat.

    VERDICT SUPERSEDED 2026-07-31 — THE 1.371x BEAT CLAIM IS WITHDRAWN.
    This is now a NO-COLLAPSE PARITY FLOOR, not a beat. apr does not currently
    win GPU decode against ollama on sm_89.

    Four independent measurements on the same host (lambda RTX 4090 sm_89):
      2026-06-15  apr 412.3  ollama 300.7  1.371x  promotion claim (#2067)
      2026-07-29  apr 332.7  ollama 299.9  1.109x  cuda-nightly, PASSED
      2026-07-31  apr 342.4  ollama 328.6  1.042x  cuda-nightly, FAILED
      2026-07-31  apr 318.2  ollama 313.5  1.015x  idle box, this harness
    The OLLAMA column reproduces across six weeks (300.7/299.9/328.6/313.5), so
    the drift is not the measuring rig. The 2026-07-29 PASS at 1.109x was already
    this regression clearing the gate by 0.8%; it went unexamined because green.

    #2323 (2026-07-27) made auto_q4k return Mwv on every device; sm_89 previously
    defaulted to HwDp4a, whose INT8 activation quant fails the F2 first-token
    cosine floor (0.9186 < 0.95). The 412.3 figure predates that change. This is
    NOT "#2323 cost 23%": re-running today with HW_DP4A_Q4K=1 measures 20.3 tok/s,
    because HwDp4a is F2-rejected and the run ends on CPU SIMD. The claim is
    withdrawn as unreproducible, not reattributed.

    The floor is 0.90: 12% under the worst observed median so it does not flake,
    while still catching the class that matters (CPU fallback ~= ratio 0.065).
    Restoring a >= 1.10x win is tracked separately; until then Pillar-4 must not
    claim a GPU decode win over ollama on sm_89. Still a MANUAL/GPU gate
    (#[ignore], NVIDIA host only).

    2026-09-01 (aprender#2835): THE 0.90 FLOOR IS SCOPED TO sm_89 AND DOES NOT
    TRANSFER. aprender#2740 retired the ada-4090 matrix leg and, in the same
    commit, deleted the `matrix.name == 'ada-4090'` predicate that scoped this
    step to it - so from 2026-08-30 the gate ran on gx10 (GB10, sm_121) and
    asserted an sm_89 number there, red four nights. Removing a matrix leg
    re-targets every step whose predicate named it. The harness now keys the
    floor by compute capability (SILICON_FLOORS); sm_121 has NO entry and yields
    UNCALIBRATED-SILICON rather than a pass or a foreign threshold. Four GB10
    nights are recorded as data (0.579/0.647/0.638/0.619, ollama stable within
    0.8%) and are explicitly NOT a calibration: a threshold comes from samples,
    never from invention.

    SCOPE: STEADY-STATE GPU DECODE only — marginal token-generation rate with
    model load + FP8-weight-cache build + CUDA-graph capture + prefill amortized
    out. apr's one-shot CLI has a large (~3.4-3.9s) fixed per-invocation startup
    cost that ollama's resident daemon avoids; SHORT-PROMPT one-shot WALL-CLOCK
    still favors ollama and is a SEPARATE, conceded comparison (NOT measured here).

    MEASUREMENTS (RTX 4090, qwen2.5-coder-1.5b-instruct-q4_k_m.gguf, same GGUF on
    both sides, warm; #2049 FP8 fix + #2060 kernel-arg fix applied):
      * ollama warm eval (decode): TIGHT, ~294-306 tok/s, median ~300.7 tok/s.
      * apr clean steady-state decode (128/384 differential): 8 trials
        [458.0, 411.2, 430.4, 421.3, 369.9, 413.4, 384.3, 402.1] tok/s,
        median 412.3, min 369.9, max 458.0. ZERO stalls / 8 trials.
      * median ratio apr/ollama = 1.371x; worst single run 369.9 = 1.230x ollama
        median (EVERY single run clears the 1.10x threshold); best 1.523x.
      * Robustness: a worst-case single-run 1.10x gate had a ~12.5% flake rate on
        the PRIOR (pre-fix) distribution; on this post-fix distribution a
        median-of-7 >= 1.10x gate bootstraps to a ~0% false-FAIL rate (median-of-5
        also ~0%). median-of-7 is chosen for extra non-flakiness margin.

    DEPENDENCY: this enforced beat's NO-STALL premise DEPENDS on #2049 (the FP8
    warmup OOB fix) being on main. The re-measure above was taken on a build of
    origin/main MERGED with the #2049 branch (and #2060, the layout/elementwise
    kernel-arg SIGSEGV fix). If #2049 is reverted/absent, the ~1-in-6 stall returns
    and a median gate can flake — this gate must NOT be enforced without #2049.

    WHY GATEABLE NOW (vs the prior TRACKING verdict): the prior verdict kept this
    TRACKING for two stated reasons: (1) the ~1-in-6 decode stall, and (2) wide
    non-stalled variance. #2049 fixes (1) directly (0/8 stalls re-measured); (2) is
    handled by the median-of-7 estimator plus the wide 1.37x-vs-1.10x margin. The
    correctness-headline Pillar-4 beat remains apr-fail-closed-garbage-beat; this
    SPEED beat is now a second, independently-gateable Pillar-4 win.
  references:
  - "crates/aprender-serve/tests/beat_ollama_decode_throughput_speed.rs"
  - "memory/project_pmat742_gpu_parity_falsepos.md (origin of the 1.23x TRACKING number)"
  - "memory/project_fusion_003_1_5b_falsified.md (the 1-in-6 CUDA_ERROR variance class — fixed by #2049)"
  - "contracts/apr-fail-closed-garbage-beat-v1.yaml (the correctness-headline Pillar-4 beat)"
version: 2
# ENFORCED (manual/GPU gate) as a NO-COLLAPSE FLOOR, not a beat. The 1.371x win
# claim is WITHDRAWN (see VERDICT SUPERSEDED in the description); the enforced
# assertion is median-of-7 >= ollama median x 0.90 (`beat_threshold` below), which
# catches CPU fallback (~0.065) without asserting a win apr does not have. The
# ~1-in-6 decode-stall variance is fixed by #2049, which the median premise still
# DEPENDS on (see description DEPENDENCY).
status: enforced
date: 2026-06-15

# Beat-benchmark parameters. baseline_value records the WORST reproducible
# post-#2323 ratio (1.015x); beat_threshold (0.90) is the no-collapse floor the
# median-of-7 harness asserts on an NVIDIA host.
beat:
  pillar: 4
  incumbent: ollama
  incumbent_pinned: >
    2026-06-15 RTX 4090 (sm_89), ollama serving qwen2.5-coder:1.5b-instruct-q4_K_M
    (same GGUF as apr), warm daemon (100% GPU), `ollama run ... --verbose` eval
    rate. TIGHT distribution ~294-306 tok/s, median ~300.7 tok/s.
  canonical_task: >
    Steady-state GPU decode throughput on qwen2.5-coder-1.5b-instruct-q4_k_m
    (Q4_K_M GGUF). apr: `apr run <gguf> --gpu --benchmark`; decode rate derived by
    amortizing the ~3.4-3.9s fixed overhead (128/384 differential). ollama:
    `ollama run <model> --verbose` "eval rate" (already decode-only). Same host,
    same GPU, same GGUF weights. Metric = ratio apr_median7_decode_tps /
    ollama_median_eval_tps. NOT one-shot cold wall-clock (conceded).
  metric: decode_tps_ratio_apr_over_ollama
  direction: higher_is_better
  baseline_value: 1.0150      # WITHDRAWN 2026-07-31: the 1.371x (412.3/300.7, 2026-06-15) is NOT reproducible.
                              # Measured post-#2323 on the same host: 1.109 (07-29), 1.042 (07-31), 1.015 (idle).
                              # Pinned to the WORST of the three, not the best.
  baseline_floor: 0.9000      # NO-COLLAPSE floor, 12% under the worst observed median (1.015). Not a beat floor.
  beat_threshold: 0.9000      # no-collapse gate: apr median-of-7 >= ollama median x 0.90. 1.10 asserted a win
                              # apr does not currently have and failed ~every other night. Recovery tracked separately.
  baseline_sourced_date: "2026-06-15"
  approved_compute: GPU       # RTX 4090 (sm_89) steady-state decode; needs apr --features cuda + ollama
  ci_gate_name: "beat_ollama_decode_throughput_speed"

# CI gating: ENFORCED but MANUAL/operator-gated (documented honestly, like the
# cuda-oxide throughput gate): there is NO NVIDIA GitHub Actions runner, so the
# per-PR CPU CI cannot run it. The enforcing test is `#[ignore]`d and only runs on
# an NVIDIA host that has BOTH `apr` built `--features cuda` AND `ollama` installed
# with the Q4_K_M model.
ci_gating:
  mode: manual          # ENFORCED gate, run manually on a GPU host (no NVIDIA CI runner)
  reason: >
    ENFORCED median-of-7 >= 0.90x NO-COLLAPSE FLOOR (NOT a beat threshold; the
    1.371x win claim is withdrawn — see VERDICT SUPERSEDED). (1) Non-flaky: the
    ~1-in-6 catastrophic decode stall (FUSION-003 1-in-6 CUDA_ERROR class) that
    previously made a median gate flake is FIXED by #2049 (FP8-warmup OOB poison) —
    re-measured 0 stalls / 8 trials. 0.90 also sits 12% under the worst observed
    post-#2323 median (1.015), so it does not flake for distributional reasons
    either. This gate's non-stall premise DEPENDS on #2049 being on main; do NOT
    enforce without it. (2) Manual/GPU: requires an RTX-class GPU, apr
    `--features cuda`, ollama + the Q4_K_M model, and the matching GGUF on disk —
    none on the CPU-only self-hosted CI runners. Like the cuda-oxide throughput
    beat, it runs manually on an NVIDIA host (lambda-vector RTX 4090 / gx10 GB10),
    not in per-PR CI. A green run proves apr did not COLLAPSE; it does not license
    any claim that apr is faster than ollama.
  run_recipe: |
    # On an NVIDIA host with apr (--features cuda), ollama, and the model:
    #   1. Resolve the cuda apr binary. NEVER hardcode a path and never call a bare
    #      `apr` — scripts/apr_bin.sh exports $APR and PROVES it was built from HEAD
    #      (four apr binaries once coexisted here; a bare `apr` won at 26 days old).
    #        cargo build --release --features cuda
    #        . scripts/apr_bin.sh || exit 1    # -> $APR
    #      The build must include #2049 (FP8 stall fix); without it the median premise
    #      above does not hold.
    #   2. Ensure the GGUF + ollama model match:
    #        ls ~/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
    #        ollama pull qwen2.5-coder:1.5b-instruct-q4_K_M && ollama ps
    #   3. Run the ignored ENFORCED gate (asserts apr median-of-7 >= ollama
    #      median x 0.90 — the no-collapse floor; FAILS the build on a collapse):
    #        APR_BIN="$APR" \
    #        APR_GGUF=$HOME/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf \
    #        OLLAMA_MODEL=qwen2.5-coder:1.5b-instruct-q4_K_M \
    #        cargo test -p aprender-serve --test beat_ollama_decode_throughput_speed \
    #          -- --ignored --nocapture
