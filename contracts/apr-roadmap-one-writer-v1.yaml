# ─────────────────────────────────────────────────────────────────────────────
# apr-roadmap-one-writer-v1 — docs/roadmaps/roadmap.yaml has ONE writer (T21,
# operator ruling RQ-8)
#
# WHAT IT GOVERNS
#   Pull requests commit docs/roadmaps/entries/<ID>.yaml only. CI regenerates
#   the aggregate before any reader runs, and ONE writer PR changes
#   roadmap.yaml and nothing else. The per-PR comparison "committed ==
#   aggregate" (check_roadmap_fragment_required.sh rule 2) moves to the writer
#   PR: the one move RQ-8 rules.
#
#   THIS VERSION IS THE RULE ALONE (BLD-001 split, PR1). The nightly host-timer
#   writer that opens the writer PR lands in a follow-up pull request. Until
#   then the writer PR is a hand-opened aggregate refresh, at most one a day,
#   holding roadmap.yaml and nothing else. Every reader judges the fresh copy,
#   so a lagging committed aggregate changes no verdict. A tag-time check that
#   refuses a lagging committed copy is NOT part of this rule: it is a new
#   blocking publish check, so it follows separately (see non_goals). Until it
#   lands, a release cut between a fragment landing and the next writer PR
#   carries a roadmap.yaml that lags its fragments.
#
#   One writer cleans 0 of the pull requests open when it lands; it prevents
#   the next re-dirty of the generated file.
#
# PROOF LADDER, STATED HONESTLY
#   * L1 — every script exists and is wired (ci/sections.yml, guard-tree job).
#   * L2 — falsification MEASURED by hermetic case tables and mutant runs:
#          roadmap_aggregate.sh 25 rows / 11 mutants, roadmap_one_writer_ci.sh
#          16 / 9, check_roadmap_one_writer.sh 13 / 8,
#          roadmap_to_fragments.sh 11 / 7,
#          check_roadmap_fragment_required.sh 23 / 2,
#          check_row_pr_write_set.sh 17 / 1; every mutant killed.
#   * L3/L4 — NOT APPLICABLE: a generated YAML data file, not a kernel.
#   * WHAT BLOCKS FROM THE START: every EXISTING verdict moved onto the
#     fresh copy (R3 and R4 on fresh refs, pmat work validate on the fresh
#     roadmap.yaml, fragments the generator refuses); every environment gap
#     behind them (exit 2, never a pass). The bash aggregator refuses exactly
#     what the existing python generator refuses (parity, fork (i)), so moving
#     a check onto it makes no new verdict.
#   * WHAT IS SHADOW: only the verdict no existing check made — the writer-shape
#     judge (check_roadmap_one_writer.sh). It prints `SHADOW FAIL` and exits 0. Nothing counts
#     green nights automatically: the admission PR that sets
#     ROADMAP_ONE_WRITER_MODE=enforce must cite three consecutive green
#     nights of the shape judge, and must first make scripts/batch_fold.sh stop
#     committing roadmap.yaml beside other files (it is a second writer today,
#     which the shape judge names in shadow).
# ─────────────────────────────────────────────────────────────────────────────
name: apr-roadmap-one-writer
version: "1.0.0"
scope: >
  docs/roadmaps/roadmap.yaml as a generated file: who writes it, when it is
  compared with the aggregate of docs/roadmaps/entries/, and where. Out of
  scope: the fragment schema (apr-roadmap-fragments-v1), id uniqueness
  (apr-roadmap-ids-unique-v1), the additive rule (apr-roadmap-additive-diff-v1),
  pmat's own writer (`pmat work add/complete` still rewrites roadmap.yaml; a
  converter and an upstream ticket cover it), and the PRs open when this lands.
status: active

metadata:
  kind: pattern     # a write-ownership rule over a generated file, not a math kernel
  version: "1.0.0"
  created: '2026-10-04'
  last_modified: '2026-10-05'
  author: PAIML Engineering
  references:
    - 'scripts/roadmap_aggregate.sh — bash aggregator: --print/--write/--check/--roundtrip · --selftest · --mutants'
    - 'scripts/roadmap_one_writer_ci.sh — guard-tree step before every reader: regen, pmat work validate, fresh-ref diff guards'
    - 'scripts/check_roadmap_one_writer.sh — PR-side: names a roadmap.yaml edit outside the writer shape (shadow)'
    - 'scripts/check_roadmap_fragment_required.sh — R4: rule 1 writer licence, rule 2 moved (RQ-8)'
    - 'scripts/roadmap_to_fragments.sh — converts a pmat-style roadmap.yaml edit into fragments, roadmap.yaml back at base'
  description: >
    Eleven open pull requests carried hand-merged copies of roadmap.yaml (239
    new ids, 4 edited ids), each already shipping its fragment, and the file
    was a merge conflict in nine of them. With one writer, a PR's diff never
    touches the aggregate, so a fragment cannot conflict with another PR's
    fragment through the generated file.

equations:
  aggregate_is_base_plus_fragments:
    formula: |
      aggregate(base, F) = base with every entry e replaced by F[e.id] when present,
                           then every fragment id absent from base inserted at the slot of its
                           prefix by numeral (check_roadmap_sorted.sh order); a prefix base lacks,
                           or a legacy id, is appended in filename order
      --check  ⇔  committed bytes == aggregate(committed, F) bytes
      refused (exit 1): exactly what the python generator refuses — a *.yaml it cannot read as
                        UTF-8 text (invalid UTF-8, a directory, a dangling or unreadable link)
    domain: 'docs/roadmaps/roadmap.yaml and docs/roadmaps/entries/*.yaml'
    codomain: 'bytes, or a refusal'
    invariants:
    - 'BYTE-IDENTICAL TO THE PYTHON GENERATOR, with the same refusals (rows D1, P1-P7, L1, L2).'
    preconditions: []
    postconditions:
    - 'exit 0 ok · 1 refused or stale · 2 environment (never a pass)'

  readers_see_the_fresh_aggregate:
    formula: |
      guard-tree job: roadmap_one_writer_ci.sh runs BEFORE guard_tree.sh;
        (a) --write in the CI clone (never committed)  (b) pmat work validate on it
        (c) diff guards R3/R4 rule 1 on FRESH(base)..FRESH(head) commit objects
    domain: 'the guard-tree job of ci/sections.yml'
    codomain: 'bool'
    invariants:
    - 'A FRAGMENT-ONLY PR IS JUDGED ON THE ENTRIES IT CHANGES: raw refs see an untouched roadmap.yaml and pass vacuously (control row K1).'
    preconditions: []
    postconditions:
    - 'R3, R4 and pmat work validate on the fresh copy BLOCK in every mode: before RQ-8 the same checks judged these entries on the committed copy'
    - 'absent pmat, an unregenerated copy, or an aggregator that cannot answer is ENV, exit 2 in every mode, never a pass'
    - 'fragments the aggregator refuses BLOCK in every mode: the existing generator refuses them too, so R4 rule 2 blocked them before RQ-8'
    - 'the regen step sits in the guard-tree-steps job before guard_tree.sh, whose runner continues past a red step (row W1; moved to a fail-fast job, W2 refuses)'

  one_writer_shape:
    formula: |
      writer shape ⇔ merge-base..HEAD changes docs/roadmaps/roadmap.yaml and nothing else
      PR edits roadmap.yaml outside the writer shape  ⇒  named (SHADOW FAIL; exit 1 in enforce)
      writer PR accepted ⇔ committed == aggregate(head)
                          ∨ (stale in a merge ref: copy == aggregate(copy, held fragments), each held
                               fragment at head or at merge-base(head^1, head^2) — main may edit one later
                             ∧ aggregate(head copy) == aggregate(base copy)
                             ∧ ids(base copy) ⊆ ids(head copy))
    domain: 'a pull request diff'
    codomain: 'bool'
    invariants:
    - 'A HAND EDIT IN A WRITER-SHAPED PR STAYS NAMED, covered by a fragment or not, and so does a deleted entry: on the stale path by this judge (rows W7, W8, W9); on the fresh path a base-only edit equals aggregate(head), so the judge accepts it and R4 rule 1 names it and BLOCKS (R4 row "a lifecycle edit written straight into the base"; R4 FAIL CHANGED / FAIL DRIFT).'
    - 'A ROW PR (agent/<DAG-row>) writes no fragment either: check_row_pr_write_set.sh rule 2 reads docs/roadmaps/entries/ as it reads roadmap.yaml, so the move to fragments makes that guard compare no less (round-3 L; its row 14, mutant nofrag).'
    preconditions: []
    postconditions:
    - 'the writer PR still requires committed == fresh (fresh path) or a fragment-faithful stale copy'

proof_obligations:
  - id: RMOW-OB-001
    statement: "The bash aggregator equals the python generator byte for byte and refuses exactly what it refuses."
    discharged_by: falsification_tests[0]
  - id: RMOW-OB-002
    statement: "Every worktree reader that guard_tree.sh runs after this step reads the fresh aggregate; R3, R4 and pmat validate judge it and block."
    discharged_by: falsification_tests[1]
  - id: RMOW-OB-003
    statement: "A PR edit of roadmap.yaml outside the writer shape is named; the writer PR is accepted, stale or not, and a hand edit in it is named."
    discharged_by: falsification_tests[2]

falsification_tests:

  - id: RMOW-F-001
    rule: the aggregate is base plus fragments, byte-identical to the python generator, same refusals
    prediction: >-
      Row D1 diffs bash and python output on the real tree (identical); invalid
      UTF-8 and a dangling link named *.yaml exit 1, as python does (P6, P7);
      the id is the filename (P1), PMAT-5 beside PMAT-05 is two entries (P2), a
      missing final newline is pasted verbatim (P3) and CRLF reads as LF (P4),
      each as python does; a symlinked fragment (L1) and a symlinked entries
      DIR (L2) are followed, as python's open() and os.listdir follow them.
    test: 'bash scripts/roadmap_aggregate.sh --selftest && bash scripts/roadmap_aggregate.sh --mutants'
    if_fails: >-
      the generated file depends on which generator ran, or two PRs mint one
      ticket through spelling twins
    mutation: >-
      --mutants: strnum numge append idline addnl nocr nofollow nosup noutf8 nofix nodirlink, all killed.

  - id: RMOW-F-002
    rule: readers see the fresh aggregate; diff guards judge fresh refs
    prediction: >-
      A fragment-only retitle BLOCKS through fresh refs in shadow mode (F1)
      and passes on raw refs (control K1); a fresh copy pmat rejects blocks
      (V1); PMAT-4 beside a-04 passes, as in the existing generator (P1); no
      pmat and an unregenerated copy exit 2 in shadow mode (E1, R2); fragments
      the generator refuses block in both modes (B1, B1e); the regen step is
      wired before guard_tree.sh in guard-tree-steps (W1) and a move refuses (W2).
    test: 'bash scripts/roadmap_one_writer_ci.sh --selftest && bash scripts/roadmap_one_writer_ci.sh --mutants'
    if_fails: >-
      a fragment-only PR changes an entry non-additively and every diff guard
      passes because roadmap.yaml is untouched
    mutation: >-
      --mutants: stalefresh novalidate norefs regenpass noblock nofreshgate softenv wiring refsany, all
      killed; refsany over-blocks, so the control rows O1-O3 and P1 can turn RED;
      it also runs check_roadmap_fragment_required.sh --mutants (movednovalid nomb).

  - id: RMOW-F-003
    rule: one writer shape
    prediction: >-
      A PR editing roadmap.yaml with other files is named (W1); the writer
      PR passes fresh (W2) and stale in a merge ref (W6); a base-only hand
      edit (W7), a fragment-covered hand edit (W8) and a deleted
      fragment-covered entry (W9) are named; a stale writer after main edited
      a fragment it holds passes (W10). R4 rows: STALE WRITER passes, also
      after main edited a held fragment; 'FAIL  CHANGED  PMAT-300', 'FAIL  DRIFT',
      'REMOVED  PMAT-300'; fragments the aggregator refuses are 'FAIL  FRAGMENTS';
      an aggregator that cannot run is ENV (rc 2).
    test: 'bash scripts/check_roadmap_one_writer.sh --selftest && bash scripts/check_roadmap_one_writer.sh --mutants && bash scripts/check_roadmap_fragment_required.sh --self-test && bash scripts/check_roadmap_fragment_required.sh --mutants'
    if_fails: >-
      the writer PR is refused forever, or it carries a hand edit through
    mutation: >-
      --mutants: anyshape noequal nostale anystale nofaithful nodelete nomb nameall, all killed;
      nameall names every change, so the control rows W1, W3, W5 can turn RED;
      R4 --mutants: movednovalid nomb, all killed.

non_goals:
  - "Cleaning the PRs open when this lands: one writer cleans 0 of them; it prevents the next re-dirty."
  - "Blocking on the NEW verdict (writer shape) before the admission PR cites three green nights of the shape judge; existing verdicts moved onto the fresh copy block from the start."
  - "The nightly host-timer writer: a follow-up pull request (BLD-001 PR2); until it lands, at most one hand-opened aggregate refresh PR a day."
  - "Changing pmat's writer: `pmat work add/complete` still rewrites roadmap.yaml; scripts/roadmap_to_fragments.sh converts that diff."
  - "A publish preflight check that refuses a tag whose committed roadmap.yaml is not the aggregate: a new blocking publish check, so it is a separate follow-up that lands report-only, runs clean-room first, and blocks only after three green nights."

binding_registry:
  guard: scripts/check_roadmap_one_writer.sh
  ci_step: "ci/sections.yml guard-tree: 'Regenerate the roadmap aggregate before any reader (one writer, T21)' and 'One-writer roadmap case tables and mutants (T21)'"
