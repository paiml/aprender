metadata:
  version: "1.0.0"
  created: "2026-04-08"
  author: PAIML Engineering
  registry: true
  references:
    - "docs/specifications/aprender-monorepo-consolidation.md"
  description: >
    APR-BOOK Chapter 5: Unsupervised Learning
  contract: apr-book-ch05
  status: enforced
  title: "Unsupervised Learning"
  part: II
  example: ch05_unsupervised
  arxiv_citations: ["0909.4061"]

preconditions:
  - "cargo build -p aprender-core --example ch05_unsupervised succeeds"
  - "All arXiv IDs in citation table are valid"
  - "Zero legacy names in chapter text"
postconditions:
  - "Example produces correct output"
  - "All assert!() in example pass"
falsification:
  - condition: "cargo run -p aprender-core --example ch05_unsupervised exits non-zero"
    severity: P0
    action: reject_chapter
  - condition: "Section without arXiv citation"
    severity: P0
    action: reject_chapter
  - condition: "Legacy name appears in chapter text"
    severity: P0
    action: reject_chapter
  - condition: "Oracle --explain output contradicts chapter claim"
    severity: P0
    action: reject_chapter
  - condition: "assert!() failure in example"
    severity: P0
    action: reject_chapter

falsification_tests:
  - id: FALSIFY-BOOK-CH05-001
    description: "Chapter 05's example ch05_unsupervised builds and runs to exit 0, with its 5 assertion(s) holding"
    test: "cargo run -p aprender-core --example ch05_unsupervised"
    prediction: "Exit 0. book-contracts 'Chapter Examples Run' runs the same command for all 27 chapters"
    if_fails: "An API the chapter teaches changed or regressed, so the example panics on an assertion or no longer compiles"
