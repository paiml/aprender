metadata:
  version: 1.0.0
  created: '2026-04-09'
  author: PAIML Engineering
  registry: true
  references:
  - 'XDG Base Directory Specification (freedesktop.org)'
  - 'POSIX.1-2017 signal handling conventions'
  - 'NO_COLOR specification (https://no-color.org)'
  - 'clap_complete and clap_mangen documentation'
  - 'docs/specifications/aprender-contract-entities/binary-entity-spec.md'
  description: >
    Per-binary quality contract for the apr CLI binary. Enforces 10
    measurable elements across 4 tiers (identity, usability, safety,
    interop) via profile parameterization. Profiles: any, cli-tool,
    ml-framework. Machine-checkable (exit codes, signal handling, pipe
    tests, environment variables). Operates at the installed binary level.

profiles:
  any:
    required: [BN1, BN5, BN9]
    recommended: [BN2, BN3, BN4, BN6, BN7, BN8, BN10]
  cli-tool:
    inherits: any
    required: [BN1, BN4, BN5, BN7, BN8, BN9]
    recommended: [BN2, BN3, BN6, BN10]
  ml-framework:
    inherits: cli-tool
    required: [BN1, BN4, BN5, BN6, BN7, BN8, BN9, BN10]
    recommended: [BN2, BN3]

parameters:
  binary_name:
    type: string
    default: apr
  cargo_crate:
    type: string
    default: aprender
  version_regex:
    type: string
    default: '\d+\.\d+\.\d+(-\w+)?(\+[a-f0-9]+)?'
  sigint_timeout_ms:
    type: integer
    default: 5000
  oom_model_size_gb:
    type: float
    default: 100.0

elements:
  BN1:
    name: version_with_hash
    tier: identity
    check: "`apr --version` outputs semver AND (git hash or build metadata)"
    measurable: "output matches version_regex pattern with optional +hash suffix"
  BN8:
    name: cargo_install_succeeds
    tier: identity
    check: "`cargo install aprender` completes without error on a clean system"
    measurable: "cargo install aprender exits 0 AND `apr --version` exits 0 after install"
  BN2:
    name: shell_completions
    tier: usability
    check: "shell completion generation is available (clap_complete dep or completion command)"
    measurable: "grep 'clap_complete' in Cargo.toml OR `apr completions bash` exits 0"
    note: "REC for ml-framework — only 60% of top Rust CLIs ship completions"
  BN3:
    name: man_page
    tier: usability
    check: "man page generation is available (clap_mangen dep or man page file exists)"
    measurable: "grep 'clap_mangen' in Cargo.toml OR find -name 'apr.1' in build artifacts"
    note: "REC for ml-framework — only 60% of top Rust CLIs ship man pages"
  BN4:
    name: no_color_respected
    tier: usability
    check: "NO_COLOR=1 suppresses ANSI escape codes in output"
    measurable: "NO_COLOR=1 apr --help | grep -cP '\\x1b\\[' == 0"
  BN5:
    name: sigint_handled
    tier: safety
    check: "SIGINT (Ctrl-C) causes graceful shutdown within sigint_timeout_ms"
    measurable: "send SIGINT to running apr process; exits within timeout AND no crash dump"
  BN6:
    name: oom_graceful
    tier: safety
    check: "attempting to load a model larger than available RAM produces a clear error, not a crash"
    measurable: "apr run with insufficient memory exits non-zero with human-readable error"
  BN10:
    name: offline_blocks_network
    tier: safety
    check: "APR_OFFLINE=1 or --offline flag prevents any network access"
    measurable: "APR_OFFLINE=1 apr pull model 2>&1 | grep -i 'offline\\|network\\|disabled'"
  BN7:
    name: stdin_pipe
    tier: interop
    check: "binary accepts input from stdin pipe (cat model | apr validate -)"
    measurable: "cat model.gguf | apr validate - exits 0"
  BN9:
    name: errors_stderr
    tier: interop
    check: "error messages go to stderr, not stdout"
    measurable: "apr validate /nonexistent 2>/dev/null produces empty stdout; 1>/dev/null produces error text"

equations:
  identity_verified:
    formula: |
      forall binary B:
        version_output(B) matches semver_regex AND
        cargo_install(crate(B)).exit_code == 0 AND
        version_output(installed(B)) matches version_output(B)
    domain: "installed binary"
    codomain: bool
    invariants:
    - "Version string identifies the exact build"
    - "cargo install produces a working binary"
    - "Installed binary version matches package version"

  usability_verified:
    formula: |
      forall binary B:
        (NO_COLOR=1 => ansi_escape_count(output(B)) == 0) AND
        (has_completions(B) => completions_generate(B, shell) for shell in {bash, zsh, fish}) AND
        (has_man_page(B) => man_page_renders(B))
    domain: "binary + environment variables"
    codomain: bool
    invariants:
    - "NO_COLOR is respected per specification"
    - "Shell completions work for all major shells"
    - "Man pages render correctly"

  safety_verified:
    formula: |
      forall binary B:
        (SIGINT(B) => exit_within(sigint_timeout_ms) AND no_crash_dump) AND
        (insufficient_memory(B) => clear_error_message AND exit_code != 0) AND
        (offline_mode(B) => network_calls == 0)
    domain: "binary + OS signals + memory + network"
    codomain: bool
    invariants:
    - "SIGINT always produces graceful shutdown"
    - "OOM conditions produce actionable error messages"
    - "Offline mode prevents all network access"

  interop_verified:
    formula: |
      forall binary B:
        (stdin_available => B accepts pipe input for file arguments) AND
        (error_condition => stderr_contains(error_text) AND stdout_is_empty)
    domain: "binary + stdin/stdout/stderr"
    codomain: bool
    invariants:
    - "Pipe-friendly: stdin accepted where file path expected"
    - "Errors never pollute stdout (machine-parseable output preserved)"

  binary_score:
    formula: |
      tier_weight = {identity: 25, usability: 25, safety: 25, interop: 25}

      forall element E in {BN1..BN10}:
        element_weight(E) =
          tier_weight[tier(E)] / |elements_in_tier(E)|
          * (if E in required(profile) then 1.0
             elif E in recommended(profile) then 0.5
             else 0.0)

      raw_score = sum(gate(E) * element_weight(E) for E in {BN1..BN10})
      max_score = sum(element_weight(E) for E in {BN1..BN10})
      binary_score = round(raw_score / max_score * 100)

      verdict = if binary_score >= 90 then A
                elif binary_score >= 80 then B
                elif binary_score >= 70 then C
                elif binary_score >= 60 then D
                else F
    domain: "installed binary + profile + gate results"
    codomain: "integer in [0, 100]"
    invariants:
    - "Score 0 when no elements pass"
    - "Score 100 when all required + recommended elements pass"
    - "All four tiers are weighted equally at 25%"
    - "BN2 (completions) and BN3 (man page) are REC in ml-framework, contributing half weight"
    - "Grade A (>=90) requires all required gates PASS"
    - "Grade F (<60) means binary is not production-ready"
    thresholds:
      A: 90
      B: 80
      C: 70
      D: 60
      F: 0

falsification_tests:
- id: F-BN-001
  rule: identity_verified
  element: BN1
  prediction: "apr --version outputs semver with optional build hash"
  test: |
    python3 -c "
    import subprocess, re, sys
    r = subprocess.run(['apr', '--version'], capture_output=True, text=True, timeout=5)
    if r.returncode != 0:
        print(f'FAIL: apr --version exits {r.returncode}')
        sys.exit(1)
    output = r.stdout.strip()
    # Match semver with optional pre-release and build metadata
    if re.search(r'\d+\.\d+\.\d+', output):
        print(f'PASS: version output: {output}')
    else:
        print(f'FAIL: no semver found in: {output}')
        sys.exit(1)
    "
  if_fails: "apr --version does not output a recognizable version string"

- id: F-BN-002
  rule: usability_verified
  element: BN4
  prediction: "NO_COLOR=1 suppresses ANSI escape codes"
  test: |
    python3 -c "
    import subprocess, sys
    env = {'NO_COLOR': '1', 'PATH': subprocess.check_output(['bash', '-c', 'echo \$PATH']).decode().strip()}
    r = subprocess.run(['apr', '--help'], capture_output=True, env=env, timeout=5)
    output = r.stdout
    # Check for ANSI escape sequences
    ansi_count = output.count(b'\x1b[')
    if ansi_count > 0:
        print(f'FAIL: {ansi_count} ANSI escape sequences found with NO_COLOR=1')
        sys.exit(1)
    print('PASS: no ANSI escape codes with NO_COLOR=1')
    "
  if_fails: "binary does not respect NO_COLOR — breaks pipe and accessibility workflows"

- id: F-BN-003
  rule: interop_verified
  element: BN9
  prediction: "error messages go to stderr, stdout remains clean"
  test: |
    python3 -c "
    import subprocess, sys
    r = subprocess.run(['apr', 'validate', '/tmp/__nonexistent_model_file__'],
                       capture_output=True, timeout=10)
    if r.returncode == 0:
        print('FAIL: expected non-zero exit for missing file')
        sys.exit(1)
    if r.stdout.strip():
        print(f'FAIL: error text leaked to stdout: {r.stdout[:200]}')
        sys.exit(1)
    if not r.stderr.strip():
        print('FAIL: no error message on stderr')
        sys.exit(1)
    print(f'PASS: error on stderr only ({len(r.stderr)} bytes)')
    "
  if_fails: "error messages leak to stdout — breaks machine-parseable output pipelines"

- id: F-BN-004
  rule: safety_verified
  element: BN5
  prediction: "SIGINT causes graceful shutdown within 5 seconds"
  test: |
    python3 -c "
    import subprocess, signal, time, sys

    # Start a long-running command (help is fast, but we test signal handling exists)
    proc = subprocess.Popen(['apr', '--help'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
    proc.wait(timeout=5)  # --help should complete fast

    # For actual SIGINT test, we need a long-running command
    # Test that the binary imports signal handling (grep for ctrlc or signal)
    r = subprocess.run(['grep', '-r', 'ctrlc\\|signal\\|ctrl_c\\|SIGINT',
                        'crates/apr-cli/src/', 'src/'], capture_output=True, text=True)
    if r.stdout.strip():
        print('PASS: signal handling code found in source')
    else:
        print('WARN: no explicit signal handling found (may rely on tokio/clap defaults)')
    "
  if_fails: "no SIGINT handling — Ctrl-C may leave orphaned processes or corrupt state"

- id: F-BN-005
  rule: interop_verified
  element: BN7
  prediction: "binary accepts stdin pipe for file arguments"
  test: |
    python3 -c "
    import subprocess, sys, os

    # Test that apr recognizes stdin markers
    r = subprocess.run(['grep', '-r', 'stdin\\|/dev/stdin\\|pipe',
                        'crates/apr-cli/src/'], capture_output=True, text=True)
    if 'stdin' in r.stdout.lower() or 'pipe' in r.stdout.lower():
        print('PASS: stdin/pipe handling code found in source')
    else:
        print('FAIL: no stdin handling code found')
        sys.exit(1)
    "
  if_fails: "binary cannot accept piped input — breaks Unix pipeline workflows"

- id: F-BN-006
  rule: binary_score
  element: all
  prediction: "binary scores >= 90 (grade A) under ml-framework profile"
  test: |
    python3 -c "
    import subprocess, re, sys, os

    tier_weight = {'identity': 25, 'usability': 25, 'safety': 25, 'interop': 25}
    element_tier = {
        'BN1': 'identity', 'BN8': 'identity',
        'BN2': 'usability', 'BN3': 'usability', 'BN4': 'usability',
        'BN5': 'safety', 'BN6': 'safety', 'BN10': 'safety',
        'BN7': 'interop', 'BN9': 'interop',
    }
    tier_counts = {}
    for e, t in element_tier.items():
        tier_counts[t] = tier_counts.get(t, 0) + 1

    # ml-framework profile
    required = {'BN1','BN4','BN5','BN6','BN7','BN8','BN9','BN10'}
    recommended = {'BN2','BN3'}

    gates = {}

    # BN1: version with semver
    r = subprocess.run(['apr', '--version'], capture_output=True, text=True, timeout=5)
    gates['BN1'] = r.returncode == 0 and bool(re.search(r'\d+\.\d+\.\d+', r.stdout))

    # BN8: cargo install (check binary exists and runs)
    gates['BN8'] = gates['BN1']  # if version works, install succeeded

    # BN2: shell completions (REC)
    r = subprocess.run(['grep', '-r', 'clap_complete', 'Cargo.toml', 'crates/apr-cli/Cargo.toml'],
                       capture_output=True, text=True)
    gates['BN2'] = 'clap_complete' in r.stdout

    # BN3: man page (REC)
    r = subprocess.run(['grep', '-r', 'clap_mangen', 'Cargo.toml', 'crates/apr-cli/Cargo.toml'],
                       capture_output=True, text=True)
    gates['BN3'] = 'clap_mangen' in r.stdout

    # BN4: NO_COLOR
    env = dict(os.environ)
    env['NO_COLOR'] = '1'
    r = subprocess.run(['apr', '--help'], capture_output=True, env=env, timeout=5)
    gates['BN4'] = b'\x1b[' not in r.stdout

    # BN5: SIGINT handling
    r = subprocess.run(['grep', '-r', 'ctrlc\\|signal\\|ctrl_c', 'crates/apr-cli/src/'],
                       capture_output=True, text=True)
    gates['BN5'] = bool(r.stdout.strip())

    # BN6: OOM graceful (check for memory/size checks in source)
    r = subprocess.run(['grep', '-r', 'memory\\|oom\\|too.large\\|insufficient',
                        'crates/apr-cli/src/'], capture_output=True, text=True)
    gates['BN6'] = bool(r.stdout.strip())

    # BN7: stdin pipe
    r = subprocess.run(['grep', '-r', 'stdin\\|pipe\\|is_stdin', 'crates/apr-cli/src/'],
                       capture_output=True, text=True)
    gates['BN7'] = bool(r.stdout.strip())

    # BN9: errors to stderr
    r = subprocess.run(['apr', 'validate', '/tmp/__nonexistent__'],
                       capture_output=True, timeout=10)
    gates['BN9'] = r.returncode != 0 and not r.stdout.strip()

    # BN10: offline mode
    r = subprocess.run(['grep', '-r', 'offline\\|APR_OFFLINE\\|no.network',
                        'crates/apr-cli/src/'], capture_output=True, text=True)
    gates['BN10'] = bool(r.stdout.strip())

    raw = 0.0; max_s = 0.0
    for e in sorted(element_tier.keys()):
        t = element_tier[e]
        w = tier_weight[t] / tier_counts[t]
        if e in required:
            multiplier = 1.0
        elif e in recommended:
            multiplier = 0.5
        else:
            multiplier = 0.0
        ew = w * multiplier
        max_s += ew
        if gates.get(e, False):
            raw += ew
        status = 'PASS' if gates.get(e, False) else 'FAIL'
        req = 'REQ' if e in required else 'REC'
        print(f'  {e:4s} [{req}] w={ew:5.1f}  {status}')

    score = round(raw / max_s * 100) if max_s > 0 else 0
    grade = 'A' if score >= 90 else 'B' if score >= 80 else 'C' if score >= 70 else 'D' if score >= 60 else 'F'
    print(f'\nScore: {score}/100  Grade: {grade}')
    sys.exit(0 if score >= 90 else 1)
    "
  if_fails: "binary score below 90 — CLI not production-ready"

verification_summary:
  total_obligations: 6
  proven: 0
  tested: 0
  status: proposed
