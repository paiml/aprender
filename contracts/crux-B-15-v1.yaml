# CRUX-B-15 — IQ-quants IQ3_XXS / IQ2_S

metadata:
  id: CRUX-B-15
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "B — Inspection & Debugging"
  competitor: llama_cpp
  demand_score: 3
  intake_status: missing
  description: >
    Import-hardness-based (IQ) quants IQ3_XXS and IQ2_S (and the full family
    IQ1_S..IQ4_NL). Canonical: `llama-quantize model.gguf out.gguf IQ3_XXS`
    using importance-matrix from `llama-imatrix`.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/huggingface/peft — LoRA/PEFT
  - arXiv:2106.09685 — LoRA
equations:
  imatrix_driven_quant:
    formula: |
      imat[i] = mean(|activations[i]|^2) over calibration set
      quant_IQ3_XXS(W) uses imat to weight per-row scale selection:
        scale[row] = optimal_scale(W[row], imat[row], bits=3.0625 avg)
      ppl(quant_model, wikitext-2) - ppl(fp16_model, wikitext-2) ≤ 0.5
    domain: "(W: Tensor<f16>, imat_path: PathBuf, qtype ∈ {IQ1_S, IQ2_XXS, IQ2_S, IQ3_XXS, IQ3_S, IQ4_XS, IQ4_NL})"
    codomain: "quantized tensor block + per-row scales + imat hash in metadata"
    invariants:
    - "imatrix file presence is required for IQ2_*, IQ3_*; absence → exit 2"
    - "ppl drift ≤ 0.5 on wikitext-2 vs llama.cpp llama-quantize reference"
    - "file size matches llama.cpp reference ± 1%"

falsification_tests:
- id: FALSIFY-CRUX-B-15-001
  rule: IQ3_XXS file size parity with llama-quantize reference
  prediction: "apr quantize --format iq3_xxs and llama-quantize IQ3_XXS produce bytes within 1%"
  test: |
    set -euo pipefail
    ref=$(ls -l tests/fixtures/tinyllama-iq3_xxs.gguf | awk '{print $5}')
    apr quantize tests/fixtures/tinyllama-fp16.gguf --format iq3_xxs \
      --imatrix tests/fixtures/tinyllama.imatrix -o /tmp/mine.gguf
    mine=$(ls -l /tmp/mine.gguf | awk '{print $5}')
    diff_pct=$(python3 -c "print(abs($ref-$mine)/$ref*100)")
    python3 -c "assert $diff_pct < 1.0, '$diff_pct%'"
  if_fails: rule 'IQ3_XXS file size parity with llama-quantize reference' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-B-15-002
  rule: missing imatrix yields exit 2 with actionable msg
  prediction: "IQ3_XXS without --imatrix exits 2; stderr mentions llama-imatrix"
  test: |
    set -e
    apr quantize tests/fixtures/tinyllama-fp16.gguf --format iq3_xxs -o /tmp/fail.gguf 2>/tmp/err && exit 1 || [ $? -eq 2 ]
    grep -Ei "imatrix|llama-imatrix" /tmp/err
  if_fails: rule 'missing imatrix yields exit 2 with actionable msg' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-B-15-003
  rule: ppl drift ≤ 0.5 on wikitext-2
  prediction: "perplexity(iq3_xxs) - perplexity(fp16) ≤ 0.5"
  test: |
    set -euo pipefail
    p_fp16=$(apr eval tests/fixtures/tinyllama-fp16.gguf --metric perplexity --dataset wikitext-2 --limit 128 --format json | jq .ppl)
    p_iq=$(apr eval /tmp/mine.gguf --metric perplexity --dataset wikitext-2 --limit 128 --format json | jq .ppl)
    python3 -c "assert ($p_iq) - ($p_fp16) <= 0.5"

  if_fails: rule 'ppl drift ≤ 0.5 on wikitext-2' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr quantize --format iq3_xxs matches `llama-quantize IQ3_XXS` file size ± 1% and ppl drift ≤ 0.5"
- type: invariant
  property: "IQ types require imatrix; absence rejected at parse time"
- type: invariant
  property: "imat hash persisted in metadata for reproducibility"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

pmat_work_tracking:
