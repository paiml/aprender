- type: invariant
  property: "scripts/openai_smoke.py exists and exits 0 against a ready apr serve"
- type: invariant
  property: "Sync, async, and streaming chat.completions.create all return non-empty content"
- type: invariant
  property: "client.embeddings.create returns a list-of-numbers embedding with length > 0"
- type: invariant
  property: "Tool-use round-trip: first call tool_calls (finish_reason=tool_calls), second call content (finish_reason=stop)"
- type: invariant
  property: "Smoke-script failures emit {probe_name, http_status} to stderr before non-zero exit"

