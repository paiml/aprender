name: gemm-backward-tiled
version: "1.0.0"
scope: "crates/aprender-compute/src/backends/"

description: |
  Backward GEMM for training: dW = X^T·dY, dX = dY·W^T. Tiled for L1/L2 cache.

equations:
  gradient_correctness:
    description: "‖dW_tiled - dW_naive‖ < ε·‖dW_naive‖"
    formula: "‖dW_tiled - dW_naive‖ < ε·‖dW_naive‖"

  transpose_identity:
    description: "A^T^T == A for all tile sizes"
    formula: "A^T^T == A for all tile sizes"

falsification:
