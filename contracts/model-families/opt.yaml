metadata:
  version: "1.0"
  created: "2026-04-12"
  description: "Model family descriptor: opt"
  kind: model-family
  references:
    - "https://huggingface.co/"

family: opt
display_name: "Meta OPT"
vendor: Meta
architectures:
  - OPTForCausalLM
  - OPTModel
hf_pattern: "facebook/opt-*"

size_variants:
  125m:
    parameters: "125M"
    hidden_dim: 768
    num_layers: 12
    num_heads: 12
    num_kv_heads: 12
    intermediate_dim: 3072
    vocab_size: 50272
    max_position_embeddings: 2048
    head_dim: 64
    norm_eps: 0.00001
  350m:
    parameters: "350M"
    hidden_dim: 1024
    num_layers: 24
    num_heads: 16
    num_kv_heads: 16
    intermediate_dim: 4096
    vocab_size: 50272
    max_position_embeddings: 2048
    head_dim: 64
    norm_eps: 0.00001
  1.3b:
    parameters: "1.3B"
    hidden_dim: 2048
    num_layers: 24
    num_heads: 32
    num_kv_heads: 32
    intermediate_dim: 8192
    vocab_size: 50272
    max_position_embeddings: 2048
    head_dim: 64
    norm_eps: 0.00001
  2.7b:
    parameters: "2.7B"
    hidden_dim: 2560
    num_layers: 32
    num_heads: 32
    num_kv_heads: 32
    intermediate_dim: 10240
    vocab_size: 50272
    max_position_embeddings: 2048
    head_dim: 80
    norm_eps: 0.00001
  6.7b:
    parameters: "6.7B"
    hidden_dim: 4096
    num_layers: 32
    num_heads: 32
    num_kv_heads: 32
    intermediate_dim: 16384
    vocab_size: 50272
    max_position_embeddings: 2048
    head_dim: 128
    norm_eps: 0.00001
  13b:
    parameters: "13B"
    hidden_dim: 5120
    num_layers: 40
    num_heads: 40
    num_kv_heads: 40
    intermediate_dim: 20480
