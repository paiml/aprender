metadata:
  version: "1.0"
  created: "2026-05-13"
  description: "Model family descriptor: olmo / olmo2 (closes GH-1591)"
  kind: model-family
  references:
    - "https://huggingface.co/allenai/OLMo-1B-hf/blob/main/config.json"
    - "https://huggingface.co/allenai/OLMo-7B-hf/blob/main/config.json"
    - "https://huggingface.co/allenai/OLMo-2-1124-7B/blob/main/config.json"
    - "https://huggingface.co/allenai/OLMo-2-1124-13B/blob/main/config.json"

family: olmo
display_name: "AllenAI OLMo"
vendor: AllenAI
architectures:
  - OlmoForCausalLM
  - Olmo2ForCausalLM
hf_pattern: "allenai/OLMo*"

# OLMo (v1, _hf flavour) is a Llama-derivative without learnable layer-norm
# weights and without bias (non-parametric LN replaced with RMSNorm at the
# `_hf` checkpoints). OLMo-2 adopts standard RMSNorm with learnable weights
# and standard Llama-3 tensor names. Both reuse `LlamaForCausalLM` tensor
# naming — the engine's Llama mapper handles them. New variant sizes /
# norm-eps differences are documented per-size.
size_variants:
  1b:
    parameters: "1B"
    hidden_dim: 2048
    num_layers: 16
    num_heads: 16
    num_kv_heads: 16
    intermediate_dim: 8192
    vocab_size: 50304
    max_position_embeddings: 2048
    head_dim: 128
    rope_theta: 10000.0
    rms_norm_eps: 0.00001
  7b:
    parameters: "7B"
    hidden_dim: 4096
    num_layers: 32
    num_heads: 32
    num_kv_heads: 32
    intermediate_dim: 11008
    vocab_size: 50304
    max_position_embeddings: 2048
    head_dim: 128
    rope_theta: 10000.0
    rms_norm_eps: 0.00001
  olmo2_7b:
    parameters: "7B"
    hidden_dim: 4096
    num_layers: 32
    num_heads: 32
    num_kv_heads: 32
    intermediate_dim: 11008
    vocab_size: 100352
    max_position_embeddings: 4096
    head_dim: 128
    rope_theta: 500000.0
    rms_norm_eps: 0.000001
  olmo2_13b:
    parameters: "13B"
    hidden_dim: 5120
    num_layers: 40
    num_heads: 40
    num_kv_heads: 40
    intermediate_dim: 13824
    vocab_size: 100352
    max_position_embeddings: 4096
    head_dim: 128
    rope_theta: 500000.0
    rms_norm_eps: 0.000001

constraints:
  attention_type: mha
  activation: silu
  norm_type: rmsnorm
  has_bias: false
  tied_embeddings: false
  positional_encoding: rope
  mlp_type: swiglu

tensor_template:
  embedding: "model.embed_tokens.weight"
  lm_head: "lm_head.weight"
  final_norm: "model.norm.weight"
  per_layer:
    q_proj: "model.layers.{n}.self_attn.q_proj.weight"
    k_proj: "model.layers.{n}.self_attn.k_proj.weight"
    v_proj: "model.layers.{n}.self_attn.v_proj.weight"
    o_proj: "model.layers.{n}.self_attn.o_proj.weight"
    gate_proj: "model.layers.{n}.mlp.gate_proj.weight"
    up_proj: "model.layers.{n}.mlp.up_proj.weight"
    down_proj: "model.layers.{n}.mlp.down_proj.weight"
    input_layernorm: "model.layers.{n}.input_layernorm.weight"
    post_attention_layernorm: "model.layers.{n}.post_attention_layernorm.weight"
    q_proj_bias: null
    k_proj_bias: null
    v_proj_bias: null

gguf_tensor_template:
  embedding: "token_embd.weight"
  position_embedding: null
  lm_head: "output.weight"
  final_norm_weight: "output_norm.weight"
  final_norm_bias: null
  per_layer:
    q_proj: "attn_q.weight"
    k_proj: "attn_k.weight"
    v_proj: "attn_v.weight"
    o_proj: "attn_output.weight"
    gate_proj: "ffn_gate.weight"
    up_proj: "ffn_up.weight"
    down_proj: "ffn_down.weight"
    input_layernorm: "attn_norm.weight"
    post_attention_layernorm: "ffn_norm.weight"
    q_proj_bias: null
    k_proj_bias: null
    v_proj_bias: null

shape_template:
  embedding: "[vocab_size, hidden_dim]"
  lm_head: "[vocab_size, hidden_dim]"
  q_proj: "[num_heads * head_dim, hidden_dim]"
  k_proj: "[num_kv_heads * head_dim, hidden_dim]"
  v_proj: "[num_kv_heads * head_dim, hidden_dim]"
  o_proj: "[hidden_dim, num_heads * head_dim]"
  gate_proj: "[intermediate_dim, hidden_dim]"
  up_proj: "[intermediate_dim, hidden_dim]"
  down_proj: "[hidden_dim, intermediate_dim]"
  input_layernorm: "[hidden_dim]"
  post_attention_layernorm: "[hidden_dim]"

quantizations:
  - q4_k_m
  - q5_k_m
  - q6_k
  - q8_0
  - f16
  - f32

certification:
  playbook_path: "../apr-model-qa-playbook/playbooks/models/olmo-{size}.playbook.yaml"
  csv_family_key: "olmo"
  size_categories:
    1b: small
    7b: medium
    olmo2_7b: medium
    olmo2_13b: large
