metadata:
  version: "1.0"
  created: "2026-04-05"
  description: "Model family descriptor: rwkv7"
  kind: model-family
  references:
    - "https://huggingface.co/"

family: rwkv7
display_name: "RWKV-7 Linear Attention"
vendor: RWKV Foundation
architectures:
  - Rwkv7ForCausalLM
  - RwkvForCausalLM
hf_pattern: "RWKV/RWKV7-*"

size_variants:
  0.1b:
    parameters: "191M"
    hidden_dim: 768
    num_layers: 12
    num_heads: 12
    intermediate_dim: 3072
    vocab_size: 65536
    head_dim: 64
  0.4b:
    parameters: "400M"
    hidden_dim: 1024
    num_layers: 24
    num_heads: 16
    intermediate_dim: 4096
    vocab_size: 65536
    head_dim: 64

# RWKV7 is NOT a transformer — it uses linear recurrence, not attention.
# num_heads is intentionally omitted (null in config.json).
# We use gelu activation with gelu_mlp since RWKV uses GELU-based channel mixing.
# No positional encoding — state carries temporal info via recurrence.
constraints:
  attention_type: linear
  activation: gelu
  norm_type: layernorm
  has_bias: false
  tied_embeddings: false
  positional_encoding: none
  mlp_type: gelu_mlp

tensor_template:
  embed: "model.embeddings.weight"
  head: "model.head.weight"
  ln_out_weight: "model.ln_out.weight"
  ln_out_bias: "model.ln_out.bias"
  per_layer:
    ln1_weight: "model.blocks.{n}.ln1.weight"
    ln1_bias: "model.blocks.{n}.ln1.bias"
    ln2_weight: "model.blocks.{n}.ln2.weight"
    ln2_bias: "model.blocks.{n}.ln2.bias"
    att_receptance: "model.blocks.{n}.att.receptance.weight"
    att_key: "model.blocks.{n}.att.key.weight"
    att_value: "model.blocks.{n}.att.value.weight"
    att_gate: "model.blocks.{n}.att.gate.weight"
    att_output: "model.blocks.{n}.att.output.weight"
    ffn_key: "model.blocks.{n}.ffn.key.weight"
    ffn_value: "model.blocks.{n}.ffn.value.weight"
    ffn_receptance: "model.blocks.{n}.ffn.receptance.weight"

shape_template:
  embed: "[vocab_size, hidden_dim]"
  head: "[vocab_size, hidden_dim]"
  ln_out_weight: "[hidden_dim]"
  att_receptance: "[hidden_dim, hidden_dim]"
  att_key: "[hidden_dim, hidden_dim]"
  att_value: "[hidden_dim, hidden_dim]"
  att_gate: "[hidden_dim, hidden_dim]"
  att_output: "[hidden_dim, hidden_dim]"
  ffn_key: "[intermediate_dim, hidden_dim]"
  ffn_value: "[hidden_dim, intermediate_dim]"

quantizations:
  - f16
  - f32

falsification_tests:
  - id: FALSIFY-MF-RWKV7-001
    description: "every rwkv7 size variant declares nonzero dimensions"
    test: "cargo test -p aprender-core --lib falsify_mf_001_positive_dimensions"
    prediction: "load_all_families loads rwkv7.yaml and none of its size variants has a zero hidden_dim, num_layers, num_heads, num_kv_heads, intermediate_dim, vocab_size or head_dim"
    if_fails: "a rwkv7 size variant declares a zero dimension"
  - id: FALSIFY-MF-RWKV7-002
    description: "every rwkv7 size variant divides its query heads evenly into KV groups"
    test: "cargo test -p aprender-core --lib falsify_mf_002_gqa_divisibility"
    prediction: "for every rwkv7 size variant, num_heads % num_kv_heads == 0"
    if_fails: "a rwkv7 size variant has a head count the GQA kernel cannot group"
  - id: FALSIFY-MF-RWKV7-003
    description: "rwkv7.yaml loads through the family loader with every required field"
    test: "cargo test -p aprender-core --lib falsify_mf_004_schema_completeness"
    prediction: "load_family_yaml parses rwkv7.yaml without error and the result has a family, vendor, architectures and at least one size variant"
    if_fails: "rwkv7.yaml is missing a required field or no longer parses"
  - id: FALSIFY-MF-RWKV7-004
    description: "no rwkv7 size variant has more KV heads than query heads"
    test: "cargo test -p aprender-core --lib falsify_mf_008_kv_heads_le_q_heads"
    prediction: "for every rwkv7 size variant, num_kv_heads <= num_heads"
    if_fails: "a rwkv7 size variant declares more KV heads than query heads"
