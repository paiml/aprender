metadata:
  version: "1.0"
  created: "2026-04-05"
  description: "Model family descriptor: mamba"
  kind: model-family
  references:
    - "https://huggingface.co/"

family: mamba
display_name: "Mamba State Space Model"
vendor: state-spaces
architectures:
  - MambaForCausalLM
  - MambaModel
hf_pattern: "state-spaces/mamba-*"

size_variants:
  130m:
    parameters: "130M"
    hidden_dim: 768
    num_layers: 24
    num_heads: 12
    intermediate_dim: 1536
    vocab_size: 50280
    head_dim: 64
  370m:
    parameters: "370M"
    hidden_dim: 1024
    num_layers: 48
    num_heads: 16
    intermediate_dim: 2048
    vocab_size: 50280
    head_dim: 64
  790m:
    parameters: "790M"
    hidden_dim: 1536
    num_layers: 48
    num_heads: 24
    intermediate_dim: 3072
    vocab_size: 50280
    head_dim: 64

# Mamba is a pure SSM (State Space Model) — no attention mechanism at all.
# Uses selective state space recurrence instead of attention.
# d_state=16, conv_kernel=4, expand=2 are architecture-level constants.
# No num_attention_heads — intentionally null/absent in config.json.
# No positional encoding — state carries temporal info via recurrence.
constraints:
  attention_type: ssm
  activation: silu
  norm_type: rmsnorm
  has_bias: false
  tied_embeddings: true
  positional_encoding: none
  mlp_type: gated

tensor_template:
  embed_tokens: "backbone.embeddings.weight"
  norm_f_weight: "backbone.norm_f.weight"
  per_layer:
    norm_weight: "backbone.layers.{n}.norm.weight"
    mixer_in_proj: "backbone.layers.{n}.mixer.in_proj.weight"
    mixer_out_proj: "backbone.layers.{n}.mixer.out_proj.weight"
    mixer_conv1d_weight: "backbone.layers.{n}.mixer.conv1d.weight"
    mixer_conv1d_bias: "backbone.layers.{n}.mixer.conv1d.bias"

shape_template:
  embed_tokens: "[vocab_size, hidden_dim]"
  norm_f_weight: "[hidden_dim]"
  norm_weight: "[hidden_dim]"
  mixer_in_proj: "[2*hidden_dim, hidden_dim]"
  mixer_out_proj: "[hidden_dim, hidden_dim]"

quantizations:
  - f16
  - f32

falsification_tests:
  - id: FALSIFY-MF-MAMBA-001
    description: "every mamba size variant declares nonzero dimensions"
    test: "cargo test -p aprender-core --lib falsify_mf_001_positive_dimensions"
    prediction: "load_all_families loads mamba.yaml and none of its size variants has a zero hidden_dim, num_layers, num_heads, num_kv_heads, intermediate_dim, vocab_size or head_dim"
    if_fails: "a mamba size variant declares a zero dimension"
  - id: FALSIFY-MF-MAMBA-002
    description: "every mamba size variant divides its query heads evenly into KV groups"
    test: "cargo test -p aprender-core --lib falsify_mf_002_gqa_divisibility"
    prediction: "for every mamba size variant, num_heads % num_kv_heads == 0"
    if_fails: "a mamba size variant has a head count the GQA kernel cannot group"
  - id: FALSIFY-MF-MAMBA-003
    description: "mamba.yaml loads through the family loader with every required field"
    test: "cargo test -p aprender-core --lib falsify_mf_004_schema_completeness"
    prediction: "load_family_yaml parses mamba.yaml without error and the result has a family, vendor, architectures and at least one size variant"
    if_fails: "mamba.yaml is missing a required field or no longer parses"
  - id: FALSIFY-MF-MAMBA-004
    description: "no mamba size variant has more KV heads than query heads"
    test: "cargo test -p aprender-core --lib falsify_mf_008_kv_heads_le_q_heads"
    prediction: "for every mamba size variant, num_kv_heads <= num_heads"
    if_fails: "a mamba size variant declares more KV heads than query heads"
