# ─────────────────────────────────────────────────────────────
# Contract: C-LLAMA-370M-SOVEREIGN
# Architectural contract for the 370M Llama-family sovereign
# Python code-completion model (SHIP-TWO-001 MODEL-2 "albor").
# ─────────────────────────────────────────────────────────────
# Discharges SHIP-TWO-001 AC-SHIP2-001 (architecture registered).
# This contract extends contracts/model-families/llama.yaml with a
# new `370m` size variant, and freezes the exact dimensions,
# attention topology, RoPE configuration, activation, and
# embedding-tying decision for the albor sovereign model.
#
# Why a dedicated contract rather than merely amending llama.yaml?
# Because the 370m slot is NOT a Meta-shipped variant — it is a
# from-scratch PAIML training target whose dimensions must be
# frozen *as a compiler-level invariant* before pretraining
# begins. Re-deriving the dimensions from a training script is
# how MODEL-1 v2 divergence escaped review (rank mismatch: recipe
# said 32, run used 16 — see
# memory/project_ship_two_001_model1_qlora_divergence.md).
#
# Parent: contracts/model-families/llama.yaml           (base family)
# Peer:   contracts/tokenizer-bpe-v1.yaml               (50K BPE vocab)
# Peer:   contracts/training-loop-pretrain-v1.yaml      (pretrain loop)
# Peer:   contracts/tensor-layout-v1.yaml               (row-major APR)
#
# References:
#   - docs/specifications/aprender-train/ship-two-models-spec.md §5
#     (MODEL-2 — albor, 370M, hidden=1024, layers=24, heads=16, kv_heads=4)
#   - Touvron et al. (2023) LLaMA: Open and Efficient Foundation Language
#     Models. arXiv:2302.13971
#   - Su et al. (2021) RoFormer: Enhanced Transformer with Rotary Position
#     Embedding. arXiv:2104.09864
#   - Shazeer (2020) GLU Variants Improve Transformer. arXiv:2002.05202
#   - Ainslie et al. (2023) GQA: Training Generalized Multi-Query
#     Transformer Models from Multi-Head Checkpoints. arXiv:2305.13245
# ─────────────────────────────────────────────────────────────

