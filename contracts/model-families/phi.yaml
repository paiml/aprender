metadata:
  version: "1.0"
  created: "2026-04-05"
  description: "Model family descriptor: phi"
  kind: model-family
  references:
    - "https://huggingface.co/"

family: phi
display_name: "Microsoft Phi"
vendor: Microsoft
architectures:
  - PhiForCausalLM
  # Phi3ForCausalLM removed: Phi-3/4 use SiLU+RMSNorm+GQA+RoPE (Class A),
  # NOT LayerNorm+GELU+MHA like Phi-2. Resolved via phi3→llama alias.
hf_pattern: "microsoft/phi-*"

size_variants:
  2.7b:
    parameters: "2.7B"
    hidden_dim: 2560
    num_layers: 32
    num_heads: 32
    num_kv_heads: 32
    intermediate_dim: 10240
    vocab_size: 51200
    max_position_embeddings: 2048
    head_dim: 80
    rope_theta: 10000.0
    rms_norm_eps: 0.00001
  3.8b:
    parameters: "3.8B"
    hidden_dim: 3072
    num_layers: 32
    num_heads: 32
    num_kv_heads: 32
    intermediate_dim: 8192
    vocab_size: 32064
    max_position_embeddings: 4096
    head_dim: 96
    rope_theta: 10000.0
    rms_norm_eps: 0.00001

constraints:
  attention_type: mha
  activation: gelu
  norm_type: layernorm
  has_bias: true
  tied_embeddings: false
  positional_encoding: rope
  mlp_type: standard

tensor_template:
  embedding: "model.embed_tokens.weight"
  lm_head: "lm_head.weight"
  final_norm: "model.norm.weight"
  per_layer:
    q_proj: "model.layers.{n}.self_attn.q_proj.weight"
    k_proj: "model.layers.{n}.self_attn.k_proj.weight"
    v_proj: "model.layers.{n}.self_attn.v_proj.weight"
    o_proj: "model.layers.{n}.self_attn.o_proj.weight"
    gate_proj: "model.layers.{n}.mlp.gate_proj.weight"
    up_proj: "model.layers.{n}.mlp.up_proj.weight"
    down_proj: "model.layers.{n}.mlp.down_proj.weight"
    input_layernorm: "model.layers.{n}.input_layernorm.weight"
    post_attention_layernorm: "model.layers.{n}.post_attention_layernorm.weight"
    q_proj_bias: "model.layers.{n}.self_attn.q_proj.bias"
    k_proj_bias: "model.layers.{n}.self_attn.k_proj.bias"
    v_proj_bias: "model.layers.{n}.self_attn.v_proj.bias"

shape_template:
  embedding: "[vocab_size, hidden_dim]"
  lm_head: "[vocab_size, hidden_dim]"
  q_proj: "[num_heads * head_dim, hidden_dim]"
  k_proj: "[num_kv_heads * head_dim, hidden_dim]"
  v_proj: "[num_kv_heads * head_dim, hidden_dim]"
  o_proj: "[hidden_dim, num_heads * head_dim]"
  gate_proj: "[intermediate_dim, hidden_dim]"
  up_proj: "[intermediate_dim, hidden_dim]"
  down_proj: "[hidden_dim, intermediate_dim]"
  input_layernorm: "[hidden_dim]"
  post_attention_layernorm: "[hidden_dim]"

quantizations:
  - q4_k_m
  - q5_k_m
  - q8_0
  - f16
  - f32

chat_template:
  format: phi
  template: "{% for message in messages %}{% if message['role'] == 'system' %}<|system|>\n{{ message['content'] }}<|end|>\n{% elif message['role'] == 'user' %}<|user|>\n{{ message['content'] }}<|end|>\n{% elif message['role'] == 'assistant' %}<|assistant|>\n{{ message['content'] }}<|end|>\n{% endif %}{% endfor %}{% if add_generation_prompt %}<|assistant|>\n{% endif %}"
  bos_token: ""
  eos_token: "<|end|>"
  special_tokens:
    system: "<|system|>"
    user: "<|user|>"
    assistant: "<|assistant|>"
    end: "<|end|>"

certification:
  playbook_path: "../apr-model-qa-playbook/playbooks/models/phi-{size}.playbook.yaml"
  csv_family_key: "phi"
  size_categories:
    2.7b: small
    3.8b: small

falsification_tests:
  - id: FALSIFY-MF-PHI-001
    description: "every phi size variant declares nonzero dimensions"
    test: "cargo test -p aprender-core --lib falsify_mf_001_positive_dimensions"
    prediction: "load_all_families loads phi.yaml and none of its size variants has a zero hidden_dim, num_layers, num_heads, num_kv_heads, intermediate_dim, vocab_size or head_dim"
    if_fails: "a phi size variant declares a zero dimension"
  - id: FALSIFY-MF-PHI-002
    description: "every phi size variant divides its query heads evenly into KV groups"
    test: "cargo test -p aprender-core --lib falsify_mf_002_gqa_divisibility"
    prediction: "for every phi size variant, num_heads % num_kv_heads == 0"
    if_fails: "a phi size variant has a head count the GQA kernel cannot group"
  - id: FALSIFY-MF-PHI-003
    description: "phi.yaml loads through the family loader with every required field"
    test: "cargo test -p aprender-core --lib falsify_mf_004_schema_completeness"
    prediction: "load_family_yaml parses phi.yaml without error and the result has a family, vendor, architectures and at least one size variant"
    if_fails: "phi.yaml is missing a required field or no longer parses"
  - id: FALSIFY-MF-PHI-004
    description: "no phi size variant has more KV heads than query heads"
    test: "cargo test -p aprender-core --lib falsify_mf_008_kv_heads_le_q_heads"
    prediction: "for every phi size variant, num_kv_heads <= num_heads"
    if_fails: "a phi size variant declares more KV heads than query heads"
