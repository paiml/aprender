metadata:
  version: "1.0"
  created: "2026-05-13"
  description: "Model family descriptor: granite (closes GH-1588)"
  kind: model-family
  references:
    - "https://huggingface.co/ibm-granite/granite-3.1-2b-base/blob/main/config.json"
    - "https://huggingface.co/ibm-granite/granite-3.1-8b-base/blob/main/config.json"

family: granite
display_name: "IBM Granite"
vendor: IBM
architectures:
  - GraniteForCausalLM
hf_pattern: "ibm-granite/granite-*"

# Granite 3.x dense models follow Llama-3 architecture (GQA + RoPE + SwiGLU
# + RMSNorm) with the IBM Granite vocab (49152 tokens). The MoE variants
# (granite-3.0-3b-a800m-*) use GraniteMoeForCausalLM and are out of scope.
size_variants:
  2b:
    parameters: "2.5B"
    hidden_dim: 2048
    num_layers: 40
    num_heads: 32
    num_kv_heads: 8
    intermediate_dim: 8192
    vocab_size: 49152
    max_position_embeddings: 131072
    head_dim: 64
    rope_theta: 10000000.0
    rms_norm_eps: 0.00001
  8b:
    parameters: "8B"
    hidden_dim: 4096
    num_layers: 40
    num_heads: 32
    num_kv_heads: 8
    intermediate_dim: 12800
    vocab_size: 49152
    max_position_embeddings: 131072
    head_dim: 128
    rope_theta: 10000000.0
    rms_norm_eps: 0.00001

constraints:
  attention_type: gqa
  activation: silu
  norm_type: rmsnorm
  has_bias: false
  tied_embeddings: true
  positional_encoding: rope
  mlp_type: swiglu

# Tensor naming is identical to LLaMA (HuggingFace `LlamaForCausalLM` →
# `GraniteForCausalLM` is a thin rename + tied-embedding flip + RoPE-theta
# scaling). `from_model_type("granite" / "granite3")` already returns
# `Architecture::Llama`, so the tensor mapper path is shared.
tensor_template:
  embedding: "model.embed_tokens.weight"
  lm_head: "lm_head.weight"
  final_norm: "model.norm.weight"
  per_layer:
    q_proj: "model.layers.{n}.self_attn.q_proj.weight"
    k_proj: "model.layers.{n}.self_attn.k_proj.weight"
    v_proj: "model.layers.{n}.self_attn.v_proj.weight"
    o_proj: "model.layers.{n}.self_attn.o_proj.weight"
    gate_proj: "model.layers.{n}.mlp.gate_proj.weight"
    up_proj: "model.layers.{n}.mlp.up_proj.weight"
    down_proj: "model.layers.{n}.mlp.down_proj.weight"
    input_layernorm: "model.layers.{n}.input_layernorm.weight"
    post_attention_layernorm: "model.layers.{n}.post_attention_layernorm.weight"
    q_proj_bias: null
    k_proj_bias: null
    v_proj_bias: null

gguf_tensor_template:
  embedding: "token_embd.weight"
  position_embedding: null
  lm_head: "output.weight"
  final_norm_weight: "output_norm.weight"
  final_norm_bias: null
  per_layer:
    q_proj: "attn_q.weight"
    k_proj: "attn_k.weight"
    v_proj: "attn_v.weight"
    o_proj: "attn_output.weight"
    gate_proj: "ffn_gate.weight"
    up_proj: "ffn_up.weight"
    down_proj: "ffn_down.weight"
    input_layernorm: "attn_norm.weight"
    post_attention_layernorm: "ffn_norm.weight"
    q_proj_bias: null
    k_proj_bias: null
    v_proj_bias: null

shape_template:
  embedding: "[vocab_size, hidden_dim]"
  lm_head: "[vocab_size, hidden_dim]"
  q_proj: "[num_heads * head_dim, hidden_dim]"
  k_proj: "[num_kv_heads * head_dim, hidden_dim]"
  v_proj: "[num_kv_heads * head_dim, hidden_dim]"
  o_proj: "[hidden_dim, num_heads * head_dim]"
  gate_proj: "[intermediate_dim, hidden_dim]"
  up_proj: "[intermediate_dim, hidden_dim]"
  down_proj: "[hidden_dim, intermediate_dim]"
  input_layernorm: "[hidden_dim]"
  post_attention_layernorm: "[hidden_dim]"

quantizations:
  - q4_k_m
  - q5_k_m
  - q6_k
  - q8_0
  - f16
  - f32

chat_template:
  format: granite
  template: "{%- for msg in messages %}<|start_of_role|>{{ msg['role'] }}<|end_of_role|>{{ msg['content'] }}<|end_of_text|>\n{%- endfor %}{%- if add_generation_prompt %}<|start_of_role|>assistant<|end_of_role|>{%- endif %}"
  bos_token: "<|end_of_text|>"
  eos_token: "<|end_of_text|>"
  special_tokens:
    start_of_role: "<|start_of_role|>"
    end_of_role: "<|end_of_role|>"
    end_of_text: "<|end_of_text|>"

certification:
  playbook_path: "../apr-model-qa-playbook/playbooks/models/granite-{size}.playbook.yaml"
  csv_family_key: "granite"
  size_categories:
    2b: small
    8b: medium
