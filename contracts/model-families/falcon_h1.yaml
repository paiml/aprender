metadata:
  version: "1.0"
  created: "2026-04-05"
  description: "Model family descriptor: falcon_h1"
  kind: model-family
  references:
    - "https://huggingface.co/"

family: falcon_h1
display_name: "Falcon-H1 Hybrid Transformer+SSM"
vendor: TII (Technology Innovation Institute)
architectures:
  - FalconH1ForCausalLM
  - Falcon3ForCausalLM
hf_pattern: "tiiuae/Falcon-H1-*"

size_variants:
  tiny:
    parameters: "91M"
    hidden_dim: 512
    num_layers: 24
    num_heads: 8
    num_kv_heads: 2
    intermediate_dim: 768
    vocab_size: 32768
    max_position_embeddings: 8192
    head_dim: 64
    rope_theta: 10000.0
    rms_norm_eps: 0.000001
  0.5b:
    parameters: "521M"
    hidden_dim: 1024
    num_layers: 36
    num_heads: 8
    num_kv_heads: 2
    intermediate_dim: 2816
    vocab_size: 32784
    max_position_embeddings: 8192
    head_dim: 128
    rope_theta: 10000.0
    rms_norm_eps: 0.000001

# Falcon-H1 is a hybrid: GQA attention + Mamba-2 SSM heads in parallel per layer.
# The attention portion uses standard GQA + RMSNorm + SiLU + RoPE (Class A kernels).
# The SSM portion requires separate Mamba-2 kernels (not yet supported for inference).
constraints:
  attention_type: gqa
  activation: silu
  norm_type: rmsnorm
  has_bias: false
  tied_embeddings: false
  positional_encoding: rope
  mlp_type: swiglu

tensor_template:
  embed_tokens: "model.embed_tokens.weight"
  norm_weight: "model.norm.weight"
  lm_head: "lm_head.weight"
  per_layer:
    input_layernorm_weight: "model.layers.{n}.input_layernorm.weight"
    self_attn_q_proj: "model.layers.{n}.self_attn.q_proj.weight"
    self_attn_k_proj: "model.layers.{n}.self_attn.k_proj.weight"
    self_attn_v_proj: "model.layers.{n}.self_attn.v_proj.weight"
    self_attn_o_proj: "model.layers.{n}.self_attn.o_proj.weight"
    post_attention_layernorm_weight: "model.layers.{n}.post_attention_layernorm.weight"
    mlp_gate_proj: "model.layers.{n}.mlp.gate_proj.weight"
    mlp_up_proj: "model.layers.{n}.mlp.up_proj.weight"
    mlp_down_proj: "model.layers.{n}.mlp.down_proj.weight"

shape_template:
  embed_tokens: "[vocab_size, hidden_dim]"
  norm_weight: "[hidden_dim]"
  lm_head: "[vocab_size, hidden_dim]"
  input_layernorm: "[hidden_dim]"
  self_attn_q_proj: "[num_heads*head_dim, hidden_dim]"
  self_attn_k_proj: "[num_kv_heads*head_dim, hidden_dim]"
  self_attn_v_proj: "[num_kv_heads*head_dim, hidden_dim]"
  self_attn_o_proj: "[hidden_dim, num_heads*head_dim]"
  mlp_gate_proj: "[intermediate_dim, hidden_dim]"
  mlp_up_proj: "[intermediate_dim, hidden_dim]"
  mlp_down_proj: "[hidden_dim, intermediate_dim]"

quantizations:
  - f16
  - f32

falsification_tests:
  - id: FALSIFY-MF-FALCON_H1-001
    description: "every falcon_h1 size variant declares nonzero dimensions"
    test: "cargo test -p aprender-core --lib falsify_mf_001_positive_dimensions"
    prediction: "load_all_families loads falcon_h1.yaml and none of its size variants has a zero hidden_dim, num_layers, num_heads, num_kv_heads, intermediate_dim, vocab_size or head_dim"
    if_fails: "a falcon_h1 size variant declares a zero dimension"
  - id: FALSIFY-MF-FALCON_H1-002
    description: "every falcon_h1 size variant divides its query heads evenly into KV groups"
    test: "cargo test -p aprender-core --lib falsify_mf_002_gqa_divisibility"
    prediction: "for every falcon_h1 size variant, num_heads % num_kv_heads == 0"
    if_fails: "a falcon_h1 size variant has a head count the GQA kernel cannot group"
  - id: FALSIFY-MF-FALCON_H1-003
    description: "falcon_h1.yaml loads through the family loader with every required field"
    test: "cargo test -p aprender-core --lib falsify_mf_004_schema_completeness"
    prediction: "load_family_yaml parses falcon_h1.yaml without error and the result has a family, vendor, architectures and at least one size variant"
    if_fails: "falcon_h1.yaml is missing a required field or no longer parses"
  - id: FALSIFY-MF-FALCON_H1-004
    description: "no falcon_h1 size variant has more KV heads than query heads"
    test: "cargo test -p aprender-core --lib falsify_mf_008_kv_heads_le_q_heads"
    prediction: "for every falcon_h1 size variant, num_kv_heads <= num_heads"
    if_fails: "a falcon_h1 size variant declares more KV heads than query heads"
