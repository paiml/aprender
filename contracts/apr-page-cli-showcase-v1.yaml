metadata:
  version: 1.0.0
  kind: schema
  description: |
    PCU (Page Content Unit) contract for book/src/cli/showcase.md (apr showcase CLI reference).
    Enforces: page exists, references the command, has a runnable example.
  references:
    - "docs/specifications/book-completeness-spec.md"

equations:
  pcu_header_present:
    formula: "file_contains(book/src/cli/showcase.md, 'PCU: cli-showcase')"
  command_mentioned:
    formula: "file_contains(book/src/cli/showcase.md, 'apr showcase')"
  example_block_present:
    formula: "file_contains_fenced(book/src/cli/showcase.md, language='bash')"

falsification_tests:
  - id: FALSIFY-PAGE-CLI-SHOWCASE-001
    name: stub_exists
    prediction: "book/src/cli/showcase.md exists on disk"
    test_harness: "test -f book/src/cli/showcase.md"
    expected_output: "exit 0"
    if_fails: "Run scripts/gen-cli-chapter-stubs.sh to regenerate."

  - id: FALSIFY-PAGE-CLI-SHOWCASE-002
    name: command_mentioned
    prediction: "page references the command at least once"
    test_harness: "grep -q 'apr showcase' book/src/cli/showcase.md"
    expected_output: "exit 0"
    if_fails: "Add a mention of `apr showcase` to the chapter."

  - id: FALSIFY-PAGE-CLI-SHOWCASE-003
    name: runnable_example
    prediction: "page has at least one ```bash code block"
    test_harness: "grep -c '^```bash' book/src/cli/showcase.md"
    expected_output: "stdout >= 1"
    if_fails: "Add a ```bash code block with a runnable example."

  - id: FALSIFY-PAGE-CLI-SHOWCASE-004
    name: unknown_step_names_input
    prediction: "an unknown --step is rejected with a message naming the input and listing every valid step"
    test_harness: "cargo test -p apr-cli --lib parse_showcase_step"
    expected_output: "test result: ok. 3 passed"
    if_fails: "parse_showcase_step in crates/apr-cli/src/validate.rs lost its unknown-step message or a SHOWCASE_STEPS entry no longer round-trips."
