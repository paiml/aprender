metadata:
  id: CRUX-A-04
  version: "1.0.0-draft"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Intake & Discovery"
  competitor: huggingface
  demand_score: 4  # 1..5, high priority in pmat work
  intake_status: missing
  description: >
    Include/exclude file globs for selective repository download. Parity target
    is `huggingface-cli download REPO_ID --include PATTERN --exclude PATTERN`
    (see https://huggingface.co/docs/huggingface_hub/guides/download#download-files-from-the-hub
    and `huggingface_hub.snapshot_download(allow_patterns=..., ignore_patterns=...)`).
    aprender equivalent: `apr pull hf://<repo> --include <glob> --exclude <glob>` which
    must resolve the same file subset and skip everything else in a single pass.
  references:
  - "https://huggingface.co/docs/huggingface_hub/guides/download"
  - "https://huggingface.co/docs/huggingface_hub/v0.24.0/en/package_reference/file_download#huggingface_hub.snapshot_download"

equations:
  glob_selection_set:
    formula: |
      Let R = set of files in the remote repo.
      Let I = union of files matching any --include glob (∅ means "all files").
      Let X = union of files matching any --exclude glob.
      Selected(R, I, X) = (if I == ∅ then R else R ∩ I) \ X
    domain: (repo_file_list, include_globs, exclude_globs)
    codomain: Set[file_path]
    invariants:
    - "--exclude wins over --include for overlapping matches"
    - "Empty --include means 'take everything'; empty --exclude means 'drop nothing'"
    - "Glob semantics match fnmatch / gitignore style (*, ?, **) used by huggingface_hub"

  download_idempotence:
    formula: |
      For identical (repo_id, include_globs, exclude_globs, revision),
      two consecutive `apr pull` invocations SHALL produce byte-identical
      local trees and the second invocation MUST be a cache hit (no redownload).
    domain: apr pull invocation
    codomain: local filesystem tree
    invariants:
    - "File set is a pure function of the four inputs above"
    - "Second run wall-clock < 10% of first (cache hit)"
    - "sha256 of every downloaded file stable across runs"

  parity_with_huggingface_cli:
    formula: |
      Selected_apr(R, I, X) == Selected_hfcli(R, I, X)
      for every (R, I, X) tuple in evidence/crux/huggingface/glob-goldens.json
    domain: (repo, include, exclude) tuples
    codomain: file set equality
    invariants:
    - "apr pull selects the SAME files as huggingface-cli download on goldens"
    - "No extra files, no missing files"

falsification_tests:
- id: FALSIFY-CRUX-A-04-001
  rule: include glob restricts download to matching files
  prediction: "--include '*.safetensors' downloads ONLY safetensors files"
  test: |
    TMP=$(mktemp -d)
    apr pull hf://openai-community/gpt2 --include '*.safetensors' --out "$TMP" >/dev/null
    # Any non-safetensors file present is a falsification
    find "$TMP" -type f ! -name '*.safetensors' | grep -q . && exit 1 || exit 0
  if_fails: "apr pull downloaded files NOT matching any --include glob"

- id: FALSIFY-CRUX-A-04-002
  rule: exclude glob removes matching files
  prediction: "--exclude '*.bin' produces zero .bin files locally"
  test: |
    TMP=$(mktemp -d)
    apr pull hf://openai-community/gpt2 --exclude '*.bin' --out "$TMP" >/dev/null
    [ "$(find "$TMP" -type f -name '*.bin' | wc -l)" -eq 0 ]
  if_fails: "apr pull kept files matching --exclude"

- id: FALSIFY-CRUX-A-04-003
  rule: exclude wins over include
  prediction: "--include '*.json' --exclude 'config.json' excludes config.json"
  test: |
    TMP=$(mktemp -d)
    apr pull hf://openai-community/gpt2 --include '*.json' --exclude 'config.json' --out "$TMP" >/dev/null
    [ ! -f "$TMP/config.json" ] && ls "$TMP"/*.json >/dev/null 2>&1
  if_fails: "precedence rule violated — exclude did not override include"

- id: FALSIFY-CRUX-A-04-004
  rule: parity with huggingface-cli on golden set
  prediction: "apr file set == huggingface-cli file set for same globs"
  test: |
    # TODO: implement once evidence/crux/huggingface/glob-goldens.json exists
    GOLD=/home/noah/src/aprender-worktrees/crux-spec/evidence/crux/huggingface/glob-goldens.json
    [ -f "$GOLD" ] || { echo "golden set absent"; exit 2; }
    python3 - <<'PY'
    import json, subprocess, os, tempfile, pathlib
    cases = json.load(open(os.environ["GOLD"]))
    for c in cases:
        with tempfile.TemporaryDirectory() as d:
            subprocess.run(["apr","pull",c["repo"],"--include",*c["include"],"--exclude",*c["exclude"],"--out",d], check=True)
            got = sorted(str(p.relative_to(d)) for p in pathlib.Path(d).rglob("*") if p.is_file())
            assert got == c["expected_files"], (c["repo"], got, c["expected_files"])
    PY
  if_fails: "apr pull file selection diverges from huggingface-cli"

proof_obligations:
- type: invariant
  property: "Selected(R, I, X) = (R ∩ I) \\ X with I=∅ ⇒ R"
- type: invariant
  property: "Second identical pull is cache hit (no network I/O)"
- type: equivalence
  property: "apr pull globs ≡ huggingface-cli download globs on evidence goldens"
- type: invariant
  property: "Glob syntax matches huggingface_hub fnmatch semantics"

