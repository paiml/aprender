equations:
  a_model_that_raises_during_fit_is_recorded__not_swallowed_an:
    formula: |
      a portfolio containing a deliberately failing model finishes; model_failures() has exactly one row naming the model and the error string; the leaderboard omits it
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "a model that raises during fit is recorded, not swallowed and not fatal"
  learning_curves_have_one_point_per_boosting_epoch_iteration:
    formula: |
      for a GBM with n_estimators=50 and learning_curves=true the curve has 50 validation points, monotone non-increasing after early-stopping's best iteration is asserted absent
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "learning curves have one point per boosting/epoch iteration"

falsification_tests:
- id: FALSIFY-CRUX-O-16-001
  rule: "a model that raises during fit is recorded, not swallowed and not fatal"
  prediction: "a portfolio containing a deliberately failing model finishes; model_failures() has exactly one row naming the model and the error string; the leaderboard omits it"
  test: >-
    LIVE-PENDING - a model that raises during fit is recorded, not swallowed and not fatal. No test surface exists today because the capability is unimplemented: Fit diagnostics: fit_summary, model_failures and learning curves (aprender#3386, CRUX-O-16). PROMOTE by authoring a test named failing_model_is_recorded_not_fatal in module `automl/summary/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'a model that raises during fit is recorded, not swallowed and not fatal' is violated — the autogluon parity claim for CRUX-O-16 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"
- id: FALSIFY-CRUX-O-16-002
  rule: "learning curves have one point per boosting/epoch iteration"
  prediction: "for a GBM with n_estimators=50 and learning_curves=true the curve has 50 validation points, monotone non-increasing after early-stopping's best iteration is asserted absent"
  test: >-
    LIVE-PENDING - learning curves have one point per boosting/epoch iteration. No test surface exists today because the capability is unimplemented: Fit diagnostics: fit_summary, model_failures and learning curves (aprender#3386, CRUX-O-16). PROMOTE by authoring a test named learning_curve_length_matches_iterations in module `automl/summary/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'learning curves have one point per boosting/epoch iteration' is violated — the autogluon parity claim for CRUX-O-16 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"

