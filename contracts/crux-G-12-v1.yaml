equations:
  cas_post_upload_verify:
    formula: |
      HuggingFace Xet (CAS) canonical:
        For an LFS/Xet-uploaded file F:
          GET /api/models/<repo>/tree/main ↓
            entry.lfs = { oid: <sha256>, size: <bytes>, pointerSize: ... }
          where entry.lfs.oid == sha256(raw bytes of F)
      apr parity (--verify / --verify-sha):
        apr publish hf://<repo> F --verify
        POST-conditions (apr MUST check, not just HTTP 200):
          sha256_local  = sha256(F)
          size_local    = stat -c %s F
          tree_entry    = GET .../tree/main → select path == basename(F)
          assert tree_entry.lfs.oid == sha256_local
          assert tree_entry.size    == size_local
        On mismatch: exit != 0, stderr names (local vs remote) sha256.
    domain: "(local file F, target repo) after upload"
    codomain: "(apr exit code, stderr) after remote verification"
    invariants:
    - "apr --verify always fetches /tree/main AFTER upload and compares sha256"
    - "HTTP 200 is NEVER sufficient — must verify lfs.oid parity (MEMORY: HF commit NDJSON load-bearing)"
    - "On sha mismatch, apr exits non-zero and prints both local and remote sha256"
    - "On size mismatch, apr exits non-zero and prints both byte counts"

  cas_blob_dedup_identity:
    formula: |
      Xet CAS property: uploading the same content twice must yield the
      same lfs.oid and must not re-upload the raw bytes (cache hit).
      apr must surface this:
        second `apr publish` of identical F should log "cache-hit" or
        complete in < 0.5s for a ≥10 MiB file (network skipped).
    domain: "idempotent re-upload of identical bytes"
    codomain: "wall-time + lfs.oid"
    invariants:
    - "lfs.oid is stable across re-uploads of identical content"
    - "Second upload of identical content completes materially faster than first (CAS cache hit)"

falsification_tests:
- id: FALSIFY-CRUX-G-12-001
  rule: "apr --verify confirms remote lfs.oid equals local sha256"
  prediction: "after apr publish --verify of an LFS-eligible file, the /tree lfs.oid equals local sha256, and apr exits 0 only if so"
  test: |
    set -euo pipefail
    : "${HF_TOKEN:?HF_TOKEN required (per MEMORY, it IS available)}"
    REPO="paiml/crux-g12-verify-$$"
    F=tests/fixtures/tiny-q4k.apr
    LOCAL=$(sha256sum "$F" | awk '{print $1}')
    apr publish "hf://$REPO" --create-repo --lfs --verify "$F"
    REMOTE=$(curl -sH "Authorization: Bearer $HF_TOKEN" \
             "https://huggingface.co/api/models/$REPO/tree/main" | \
             jq -r --arg f "$(basename $F)" \
                '.[] | select(.path == $f) | .lfs.oid // .oid')
    [ -n "$REMOTE" ] || { echo "no remote oid returned"; exit 1; }
    [ "$REMOTE" = "$LOCAL" ] || { echo "sha mismatch local=$LOCAL remote=$REMOTE"; exit 1; }
  if_fails: "apr --verify did not actually compare remote lfs.oid to local sha256 (HTTP 200 treated as truth)"

- id: FALSIFY-CRUX-G-12-002
  rule: "apr --verify exits non-zero when remote content diverges from local"
  prediction: "injecting a post-upload divergence (e.g., remote serves a different blob) makes apr --verify exit non-zero"
  test: |
    set -euo pipefail
    : "${HF_TOKEN:?HF_TOKEN required}"
    # Upload file A, then verify with a claim that local sha == <wrong>
    F=tests/fixtures/tiny-q4k.apr
    REPO="paiml/crux-g12-mismatch-$$"
    apr publish "hf://$REPO" --create-repo --lfs "$F" >/dev/null
    # Force apr to verify against a wrong expected hash
    set +e
    apr publish "hf://$REPO" --verify-sha deadbeef"$(printf 'f%.0s' {1..56})" "$F" 2>&1
    RC=$?
    set -e
    [ $RC -ne 0 ] || { echo "apr --verify-sha accepted a wrong sha"; exit 1; }
  if_fails: "apr --verify-sha accepted a sha256 that does not match the remote (verification is a no-op)"

- id: FALSIFY-CRUX-G-12-003
  rule: "CAS cache hit on identical re-upload (Xet dedup parity)"
  prediction: "second upload of byte-identical content completes in < 50% of first upload's wall-time"
  test: |
    set -euo pipefail
    : "${HF_TOKEN:?HF_TOKEN required}"
    REPO="paiml/crux-g12-cas-$$"
    F=tests/fixtures/tiny-q4k.apr
    T1=$( { time apr publish "hf://$REPO" --create-repo --lfs "$F" >/dev/null ; } 2>&1 | \
           awk '/real/{print $2}')
    T2=$( { time apr publish "hf://$REPO" --lfs "$F" >/dev/null ; } 2>&1 | \
           awk '/real/{print $2}')
    # Convert MmSs to seconds and compare (rough floor via python)
    uv run python3 - <<PY
    import re
    def sec(s):
        m = re.match(r'(\d+)m([\d.]+)s', s)
        return int(m.group(1))*60 + float(m.group(2)) if m else float(s)
    t1, t2 = sec("$T1"), sec("$T2")
    assert t2 < 0.5*t1 or t2 < 2.0, f"no CAS cache benefit: {t1}s then {t2}s"
    PY
  if_fails: "second upload of identical content took ≥50% of first upload time — Xet CAS dedup not engaged"

