# apr-code-eval-task-v1 — the TASK node of the apr code eval ontology (APR-CODE-EVAL-001).
#
# A task is the unit of the eval. It is only useful if it can fail: a task with no
# hidden test, or whose hidden test already passes before any edit, scores a model
# for doing nothing. SWE-bench Verified fixed exactly that by validating every task
# against its gold patch and against the unpatched repo; this contract takes that rule.
metadata:
  version: "1.0.0"
  created: "2026-10-14"
  author: PAIML Engineering
  kind: kernel
  registry: true
  description: |
    Task schema and task-set invariants for the `apr code` eval (epic #5281, ticket #5282).
    Four task kinds share one record: repo (SWE-bench Verified style: real repo at a
    pinned commit, hidden fail-to-pass and pass-to-pass tests), function (EvalPlus
    HumanEval+/MBPP+ style: signature + docstring, extended hidden tests), edit (Aider
    polyglot style: an exercise in one of several languages, edited through a declared
    edit format), terminal (Terminal-Bench style: a container task judged by a check of
    the final state). Every task is dated, so a run can split its score at the model's
    training cutoff (LiveCodeBench practice).
  references:
    - "docs/specifications/apr-code-eval-v1.md §3 (task)"
    - "Jimenez et al. (2024) SWE-bench: Can Language Models Resolve Real-World GitHub Issues? (ICLR) — FAIL_TO_PASS / PASS_TO_PASS"
    - "OpenAI (2024) Introducing SWE-bench Verified — human-validated, solvable subset"
    - "Liu et al. (2023) Is Your Code Generated by ChatGPT Really Correct? (EvalPlus, NeurIPS) — HumanEval+/MBPP+"
    - "Aider polyglot benchmark (2024) — 225 Exercism exercises, 6 languages, edit formats"
    - "Terminal-Bench (2025) — agentic terminal tasks judged by post-state tests"
    - "Jain et al. (2024) LiveCodeBench — dated problems for contamination-free evaluation"
name: apr-code-eval-task
version: "1.0.0"
status: PROPOSED
scope: "task loader and task-set manifest of the apr code eval harness (ticket #5283)"
description: |
  A task set T is a manifest of records t = (id, kind, release_date, prompt, snapshot,
  hidden_tests, gold, sha256). Only `prompt` and `snapshot` are ever shown to the agent.
  `hidden_tests` are split into fail_to_pass (F2P: must fail before the edit and pass
  after) and pass_to_pass (P2P: must pass before and after; the regression guard).
  Function, edit and terminal tasks have P2P = ∅ allowed but never F2P = ∅.

equations:
  ACE-TASK-001:
    description: "A task set is non-empty and its ids are unique"
    formula: "|T| ≥ 1  ∧  ∀ t₁ t₂ ∈ T. t₁.id = t₂.id ⇒ t₁ = t₂"
    note: "An empty set is refused at load. It never reaches the metric as 0/0."
  ACE-TASK-002:
    description: "Every task can fail: it has at least one fail-to-pass hidden test"
    formula: "∀ t ∈ T. |F2P(t)| ≥ 1"
  ACE-TASK-003:
    description: "Gold validation (SWE-bench Verified rule): the gold edit resolves the task and the null edit does not"
    formula: "∀ t ∈ T. resolved(t, gold(t)) = true  ∧  resolved(t, ∅) = false"
    note: "A task whose F2P already passes on the untouched snapshot rewards a model for doing nothing; it is invalid, not easy."
  ACE-TASK-004:
    description: "Hidden tests are not visible to the agent"
    formula: "∀ t ∈ T. paths(hidden_tests(t)) ∩ paths(snapshot(t)) = ∅  ∧  hidden_tests(t) ∉ prompt(t)"
  ACE-TASK-005:
    description: "The task-set digest is order-independent and changes when any task byte changes"
    formula: "digest(T) = sha256( concat_{t ∈ sort_by_id(T)} ( t.id ‖ 0x00 ‖ sha256(bytes(t)) ) )"
  ACE-TASK-006:
    description: "Every task is dated, so the score can be split at the model cutoff"
    formula: "∀ t ∈ T. release_date(t) ∈ ISO-8601 date  ∧  release_date(t) ≤ load_date"

proof_obligations:
  - id: ACE-TASK-PO-001
    type: precondition
    property: "Loader refuses an empty task set and a duplicate id (ACE-TASK-001)"
    formal: "(|T| = 0 ∨ ∃ duplicate id) ⇒ load(T) = Err"
  - id: ACE-TASK-PO-002
    type: invariant
    property: "No loaded task has an empty fail-to-pass list (ACE-TASK-002)"
    formal: "load(T) = Ok ⇒ ∀ t. |F2P(t)| ≥ 1"
  - id: ACE-TASK-PO-003
    type: invariant
    property: "A task enters a suite only after gold and null validation in the sandbox (ACE-TASK-003)"
    formal: "t ∈ suite ⇒ validated(t) ∧ resolved(t, gold) ∧ ¬resolved(t, ∅)"
  - id: ACE-TASK-PO-004
    type: invariant
    property: "The agent-visible view of a task carries no hidden-test bytes (ACE-TASK-004)"
    formal: "∀ t. bytes(hidden_tests(t)) ⊄ bytes(agent_view(t))"
  - id: ACE-TASK-PO-005
    type: equivalence
    property: "Set digest is a function of the content, not the file order (ACE-TASK-005)"
    formal: "digest(T) = digest(permute(T))  ∧  (T ≠ T' ⇒ digest(T) ≠ digest(T'))"
  - id: ACE-TASK-PO-006
    type: completeness
    property: "Every task carries a release date (ACE-TASK-006)"
    formal: "∀ t ∈ T. release_date(t) ≠ ⊥"

falsification_tests:
  - id: FALSIFY-ACE-TASK-001
    name: empty_set_refused
    prediction: "load() of a manifest with zero tasks returns Err, and so does one with two tasks sharing an id."
    test_harness: "PLANNED (#5283, crate not yet built): unit test falsify_ace_task_001_empty_and_duplicate_refused in the task module"
    expected_output: "test result: ok"
    if_fails: "The loader accepts a set that can only produce 0/0 or double-counts a task."
  - id: FALSIFY-ACE-TASK-002
    name: no_f2p_refused
    prediction: "A task record with fail_to_pass: [] is rejected at load."
    test_harness: "PLANNED (#5283, crate not yet built): unit test falsify_ace_task_002_empty_f2p_refused in the task module"
    expected_output: "test result: ok"
    if_fails: "A task that cannot fail is in the suite; it inflates every score."
  - id: FALSIFY-ACE-TASK-003
    name: null_patch_resolves_is_invalid
    prediction: "A planted task whose F2P test already passes on the untouched snapshot fails validation (null edit resolves it)."
    test_harness: "PLANNED (#5283, crate not yet built): unit test falsify_ace_task_003_null_patch_task_rejected in the task module"
    expected_output: "test result: ok"
    if_fails: "Validation skips the null-edit run; do-nothing answers would score."
  - id: FALSIFY-ACE-TASK-004
    name: hidden_test_leak_detected
    prediction: "A planted task whose snapshot contains the hidden test file is rejected, naming the path."
    test_harness: "PLANNED (#5283, crate not yet built): unit test falsify_ace_task_004_hidden_test_in_snapshot_rejected in the task module"
    expected_output: "test result: ok"
    if_fails: "The agent can read the answer key."
  - id: FALSIFY-ACE-TASK-005
    name: digest_order_independent_and_sensitive
    prediction: "Shuffling the manifest keeps the digest; flipping one byte in one task changes it (proptest)."
    test_harness: "PLANNED (#5283, crate not yet built): unit test prop_ace_task_005_digest in the task module"
    expected_output: "test result: ok"
    if_fails: "Two receipts with the same digest may have run different tasks."
  - id: FALSIFY-ACE-TASK-006
    name: undated_task_refused
    prediction: "A task record without release_date is rejected at load."
    test_harness: "PLANNED (#5283, crate not yet built): unit test falsify_ace_task_006_undated_refused in the task module"
    expected_output: "test result: ok"
    if_fails: "The post-cutoff (contamination-free) score cannot be computed."
