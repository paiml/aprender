equations:
  docker_image_smoke:
    formula: |
      Ecosystem reference: ollama/ollama:latest — a published Docker image on
      Docker Hub that starts a serving daemon on a documented port with a
      minimal `docker run` incantation:
        docker run -d -p 11434:11434 ollama/ollama
      Parity requirement for apr:
        docker run -d -p 8080:8080 paiml/apr-serve:latest
        → container healthy within 30s, HTTP GET http://127.0.0.1:8080/health
          returns 200 with { "status": "ok" }
        → HTTP GET http://127.0.0.1:8080/v1/models returns 200 with JSON list
    domain: "`docker run -d -p 8080:8080 paiml/apr-serve:latest`"
    codomain: "running container exposing /health and /v1/* endpoints"
    invariants:
    - "Image is published on Docker Hub as paiml/apr-serve:latest (pullable without auth)"
    - "CMD entrypoint runs `apr serve --host 0.0.0.0 --port 8080`"
    - "EXPOSE 8080 in Dockerfile matches runtime listen port"
    - "Container health-check passes within 30s of start"
    - "Reference: https://hub.docker.com/r/ollama/ollama"

  image_labels_and_size:
    formula: |
      OCI image label standards (opencontainers/image-spec):
        org.opencontainers.image.source     → github repo URL
        org.opencontainers.image.version    → apr --version string
        org.opencontainers.image.licenses   → SPDX identifier (Apache-2.0)
        org.opencontainers.image.title      → "apr-serve"
