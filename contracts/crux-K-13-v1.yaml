falsification_tests:
- id: FALSIFY-CRUX-K-13-001
  rule: "paiml/apr-serve:latest can be pulled and starts healthy"
  prediction: "docker run -d paiml/apr-serve:latest yields /health==200 within 30s"
  test: |
    set -euo pipefail
    command -v docker >/dev/null || { echo "skip: docker unavailable"; exit 0; }
    docker pull paiml/apr-serve:latest
    CID=$(docker run -d --rm -p 18080:8080 paiml/apr-serve:latest)
    trap "docker rm -f $CID >/dev/null 2>&1 || true" EXIT
    for i in $(seq 1 30); do
      if curl -sf http://127.0.0.1:18080/health >/dev/null; then
        echo "ok after ${i}s"; exit 0
      fi
      sleep 1
    done
    echo "container did not become healthy"; exit 1
  if_fails: "paiml/apr-serve:latest image is missing on Docker Hub or does not become healthy within 30s"

- id: FALSIFY-CRUX-K-13-002
  rule: "/v1/models endpoint returns JSON list on default image"
  prediction: "GET /v1/models returns 200 with {\"data\":[...]} envelope"
  test: |
    set -euo pipefail
    command -v docker >/dev/null || { echo "skip: docker unavailable"; exit 0; }
    CID=$(docker run -d --rm -p 18081:8080 paiml/apr-serve:latest)
    trap "docker rm -f $CID >/dev/null 2>&1 || true" EXIT
    for i in $(seq 1 30); do
      curl -sf http://127.0.0.1:18081/health >/dev/null && break
      sleep 1
    done
    curl -sS http://127.0.0.1:18081/v1/models | jq -e '.data | type == "array"'
  if_fails: "Docker image does not expose OpenAI-compatible /v1/models endpoint"

- id: FALSIFY-CRUX-K-13-003
  rule: "OCI labels present on published image"
  prediction: "docker inspect reports all four required OCI labels"
  test: |
    set -euo pipefail
    command -v docker >/dev/null || { echo "skip: docker unavailable"; exit 0; }
    docker pull paiml/apr-serve:latest >/dev/null
    LBLS=$(docker inspect paiml/apr-serve:latest \
             | jq -r '.[0].Config.Labels // {}')
    for K in \
        org.opencontainers.image.source \
        org.opencontainers.image.version \
        org.opencontainers.image.licenses \
        org.opencontainers.image.title; do
      V=$(echo "$LBLS" | jq -r --arg k "$K" '.[$k] // empty')
      [ -n "$V" ] || { echo "missing label: $K"; exit 1; }
    done
  if_fails: "published image missing one or more required OCI annotation labels"

- id: FALSIFY-CRUX-K-13-004
  rule: "compressed image size <= 500 MiB"
  prediction: "sum of compressed layer sizes from registry manifest <= 500 MiB"
  test: |
    set -euo pipefail
    command -v docker >/dev/null || { echo "skip: docker unavailable"; exit 0; }
    # docker manifest inspect returns layer sizes in bytes
    SUM=$(docker manifest inspect paiml/apr-serve:latest 2>/dev/null \
            | jq '[.layers[].size] | add // 0')
    LIMIT=$((500 * 1024 * 1024))
    [ "$SUM" -le "$LIMIT" ]
  if_fails: "paiml/apr-serve:latest compressed size exceeds 500 MiB budget"

