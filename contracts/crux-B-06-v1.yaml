equations:
  kquant_coverage:
    formula: |
      apr quantize --method M produces a parseable file for
        M ∈ {q2k, q3k, q4k, q5k, q6k, q8k}
      Matches the llama.cpp K-quant series introduced in
      https://github.com/ggerganov/llama.cpp/pull/1684.
    domain: K-quant method name
    codomain: output file (GGUF or APR) loadable by apr inspect
    invariants:
    - "Each of Q2..Q8 K-quant methods produces a non-empty, parseable file"
    - "File size strictly increases with bit width: Q2 < Q3 < Q4 < Q5 < Q6 < Q8"

  ppl_monotonicity:
    formula: |
      Let PPL(q) = perplexity on wikitext-2-raw-test of quantization q.
      PPL(q8k) <= PPL(q6k) <= PPL(q5k) <= PPL(q4k) <= PPL(q3k) <= PPL(q2k)
      (within +/-1% tolerance per step; strict monotonicity at larger gaps).
      Ref: https://github.com/ggerganov/llama.cpp/pull/1684 (K-quant PPL tables)
    domain: (model, wikitext-2 test set)
    codomain: monotonic non-increasing sequence of PPL as bits ↑
    invariants:
    - "Higher-bit K-quants MUST NOT have worse PPL than lower-bit by more than 1%"
    - "Q2K ≥ Q4K ≥ Q8K PPL ordering must hold strictly"

  ppl_absolute_bound:
    formula: |
      PPL(q4k) <= 1.10 * PPL(fp16)
      (Q4K should stay within ~10% of FP16 baseline per llama.cpp evidence)
    domain: apr quantize outputs vs fp16 baseline
    codomain: bool
    invariants:
    - "Q4K PPL within 10% of fp16 baseline on wikitext-2"

falsification_tests:
- id: FALSIFY-CRUX-B-06-001
  rule: all K-quants produce parseable output
  prediction: "apr quantize --method {q2k,q3k,q4k,q5k,q6k,q8k} produces loadable files"
  test: |
    SRC=$(mktemp -d)
    apr pull hf://hf-internal-testing/tiny-random-llama -o "$SRC"
    INPUT="${SRC}/model.safetensors"
    [ -f "$INPUT" ] || INPUT="${SRC}/pytorch_model.bin"
    for M in q2k q3k q4k q5k q6k q8k; do
      OUT="${SRC}/model-${M}.apr"
      apr quantize "$INPUT" --method "$M" -o "$OUT"
      apr inspect "$OUT" >/dev/null || { echo "$M unparseable"; exit 1; }
    done
  if_fails: "one or more K-quant methods produced an unparseable file"

- id: FALSIFY-CRUX-B-06-002
  rule: file-size monotonic with bit width
  prediction: "size(Q2) < size(Q3) < size(Q4) < size(Q5) < size(Q6) < size(Q8)"
  test: |
    SRC=$(mktemp -d)
    apr pull hf://hf-internal-testing/tiny-random-llama -o "$SRC"
    INPUT="${SRC}/model.safetensors"
    declare -A SIZE
    for M in q2k q3k q4k q5k q6k q8k; do
      OUT="${SRC}/model-${M}.apr"
      apr quantize "$INPUT" --method "$M" -o "$OUT"
      SIZE[$M]=$(stat -c%s "$OUT")
    done
    python3 -c "
    import sys
    s = [${SIZE[q2k]}, ${SIZE[q3k]}, ${SIZE[q4k]}, ${SIZE[q5k]}, ${SIZE[q6k]}, ${SIZE[q8k]}]
    assert all(a < b for a, b in zip(s, s[1:])), s
    "
  if_fails: "file size not strictly monotonic in bit width"

- id: FALSIFY-CRUX-B-06-003
  rule: "PPL monotonic: Q8 <= Q6 <= Q4 <= Q2 (within 1% step tolerance)"
  prediction: "PPL on wikitext-2 decreases (or stays equal) as bit width increases"
  test: |
    SRC=$(mktemp -d)
    apr pull hf://TinyLlama/TinyLlama-1.1B-Chat-v1.0 -o "$SRC"
    INPUT="${SRC}/model.safetensors"
    declare -A PPL
    for M in q2k q4k q6k q8k; do
      OUT="${SRC}/m-${M}.gguf"
      apr quantize "$INPUT" --method "$M" --format gguf -o "$OUT"
      # Use apr eval --metric ppl on wikitext-2-raw-test
      PPL[$M]=$(apr eval "$OUT" --dataset wikitext-2-raw --metric ppl --json | jq '.ppl')
    done
    python3 -c "
    p = {'q2k': ${PPL[q2k]}, 'q4k': ${PPL[q4k]}, 'q6k': ${PPL[q6k]}, 'q8k': ${PPL[q8k]}}
    order = ['q8k','q6k','q4k','q2k']
    for a,b in zip(order, order[1:]):
        assert p[a] <= p[b] * 1.01, (a,b,p[a],p[b])
    "
  if_fails: "PPL non-monotonic: higher-bit K-quant has worse perplexity than lower-bit"

- id: FALSIFY-CRUX-B-06-004
  rule: Q4K PPL within 10% of fp16 baseline
  prediction: "PPL(Q4K) <= 1.10 * PPL(fp16)"
  test: |
    SRC=$(mktemp -d)
    apr pull hf://TinyLlama/TinyLlama-1.1B-Chat-v1.0 -o "$SRC"
    INPUT="${SRC}/model.safetensors"
    FP16="${SRC}/fp16.gguf"
    Q4K="${SRC}/q4k.gguf"
    apr export "$INPUT" --format gguf --dtype f16 -o "$FP16"
    apr quantize "$INPUT" --method q4k --format gguf -o "$Q4K"
    P_FP16=$(apr eval "$FP16" --dataset wikitext-2-raw --metric ppl --json | jq '.ppl')
    P_Q4K=$(apr eval "$Q4K" --dataset wikitext-2-raw --metric ppl --json | jq '.ppl')
    python3 -c "assert $P_Q4K <= 1.10 * $P_FP16, ($P_Q4K, $P_FP16)"
  if_fails: "Q4K degrades PPL by more than 10% vs fp16 baseline"

