metadata:
  version: "1.0.0"
  created: "2026-09-26"
  author: PAIML Engineering
  registry: true
  references:
  - "crates/aprender-train/src/recipe.rs"
  - "crates/aprender-train/src/recipe_tests.rs"
  - "crates/apr-cli/src/commands/finetune_recipe.rs"
  - "crates/apr-cli/src/commands/distill.rs"
  - "crates/apr-cli/src/commands/finetune.rs"
  - "crates/aprender-train/src/finetune/instruct_trainer.rs"
  - "crates/aprender-train/src/train/shard_reader.rs"
  - "crates/aprender-train-distill/src/pipeline.rs"
  - "docs/specifications/EPIC-0.75-crux-finetune-distill-plan.md"
  description: >
    One declarative recipe for apr fine-tune and distill (E8 #4002, row R-1).
    A recipe plus a seed plus the binary sha fully determines a run. The recipe
    is validated before any model or data is loaded, and every refusal names
    the recipe field it concerns, so a recipe defect is never confused with a
    CLI flag error. The recipe hash identifies the run in every CRUX receipt.

equations:
  recipe_schema:
    formula: |
      recipe = {
        recipe_version: 1,
        base:     { model: non-empty string },
        data:     { train: non-empty path, sha256: 64 lowercase hex },
        method:   { kind ∈ {lora, qlora, full, distill}, rank?: u32, alpha?: f64,
                    teacher?: string, temperature?: f64 },
        eval:     { held_out: non-empty path, sha256: 64 lowercase hex,
                    metric ∈ {loss, accuracy} },
        training: { epochs: u32 > 0, batch_size: u32 > 0,
                    learning_rate: finite > 0, seed: u64 (required, no default) }
      }
    domain: recipe YAML text
    codomain: Recipe | RecipeError{field, reason}
    invariants:
    - "Every section is required; a missing section is refused naming that section"
    - "Unknown keys are refused at every level (a typo cannot silently default)"
    - "lora/qlora require rank > 0; full takes no rank/alpha"
    - "distill requires a teacher distinct from base.model; only distill takes teacher/temperature"
    - "eval.sha256 != data.sha256 (the eval split is not the train data)"
    - "seed has no default: two recipes that differ only by an omitted seed are different recipes"

  recipe_hash:
    formula: |
      hash(r) = sha256(canonical_json(r))
    domain: validated Recipe
    codomain: 64 lowercase hex
    invariants:
    - "YAML key order and quoting do not change the hash"
    - "Any value change (including the seed) changes the hash"

falsification_tests:
- id: FALSIFY-RECIPE-001
  rule: a missing section is refused and named
  prediction: "a recipe without eval is refused with field == eval, before any model load"
  test: |
    cargo test -p aprender-train --lib recipe::tests::refusals_name_the_field
  if_fails: "a recipe missing eval is accepted, or the refusal does not name the field"

- id: FALSIFY-RECIPE-002
  rule: unknown keys are refused
  prediction: "a misspelled key (top-level or nested) is refused, never ignored"
  test: |
    cargo test -p aprender-train --lib recipe::tests::refusals_name_the_field
  if_fails: "a typo in a recipe key silently falls back to a default"

- id: FALSIFY-RECIPE-003
  rule: method constraints
  prediction: "distill without a teacher, a self-teacher, lora without rank, full with rank are all refused"
  test: |
    cargo test -p aprender-train --lib recipe::tests::refusals_name_the_field
  if_fails: "an ill-formed method block is accepted"

- id: FALSIFY-RECIPE-004
  rule: hash is canonical
  prediction: "reordered keys hash equal; a changed seed hashes different"
  test: |
    cargo test -p aprender-train --lib recipe::tests::hash_ignores_formatting_and_tracks_values
  if_fails: "the recipe hash depends on formatting, or misses a value change"

- id: FALSIFY-RECIPE-005
  rule: positive control
  prediction: "a well-formed lora recipe and a well-formed distill recipe both parse"
  test: |
    cargo test -p aprender-train --lib recipe::tests::good_recipe_parses
    cargo test -p aprender-train --lib recipe::tests::distill_with_distinct_teacher_parses
  if_fails: "the validator refuses valid recipes (a gate that refuses everything proves nothing)"

- id: FALSIFY-RECIPE-006
  rule: the finetune consumer honors what the recipe declares
  prediction: "apr finetune --recipe carries training.seed to the trainer and refuses (naming training.batch_size) a batch size the per-sample trainer cannot honor"
  test: |
    cargo test -p apr-cli --lib commands::finetune_recipe::tests
  if_fails: "a recipe field is validated but silently not applied, so the run differs from the recipe that names it"

- id: FALSIFY-RECIPE-007
  rule: the distill trainers honor the configured learning rate and seed
  prediction: "the config-mode CPU student steps at training.learning_rate (two rates end at different losses), and training.seed survives translation into the distill pipeline and reaches the cuda student trainer"
  test: |
    cargo test -p aprender-train-distill --lib pipeline::tests::falsify_recipe_007_configured_lr_drives_the_student
    cargo test -p aprender-train-distill --lib config::tests::training_seed_defaults_to_42_and_round_trips
    cargo test -p apr-cli --lib falsify_apr_distill_train_010_translator_preserves_config
  if_fails: "the distill student trains at a hardcoded rate or seed, so a recipe's lr/seed change nothing"

- id: FALSIFY-RECIPE-008
  rule: the distill consumer honors what the recipe declares
  prediction: "apr distill --recipe maps student, teacher, the hashed .bin shard, temperature, epochs, batch_size, learning_rate and seed onto the cuda backend, refuses by name a non-distill kind, an adapter rank/alpha and a non-shard data.train, and the shard reader reads exactly the hashed file"
  test: |
    cargo test -p apr-cli --lib commands::finetune_recipe::tests::a_valid_distill_recipe_supplies_the_distill_args
    cargo test -p apr-cli --lib commands::finetune_recipe::tests::distill_refusals_name_the_recipe_field
    cargo test -p aprender-train --lib train::shard_reader::tests::a_single_shard_file_reads_only_that_file
  if_fails: "a distill recipe field is validated but not applied, or the run reads data other than the bytes the recipe hashed"

- id: FALSIFY-RECIPE-009
  rule: the finetune consumer validates on the recipe's held-out set
  prediction: "apr finetune --recipe trains on all of data.train and validates on exactly eval.held_out (no train sample diverted to validation), refuses eval.metric accuracy by name, and refuses at parse time the merge, --task and multi-adapter modes that would not run that validation"
  test: |
    cargo test -p aprender-train --lib finetune::instruct_trainer::tests::a_held_out_set_is_the_validation_set_and_the_corpus_all_trains
    cargo test -p apr-cli --lib commands::finetune_recipe::tests
    cargo test -p apr-cli --lib test_parse_finetune_recipe_conflicts_with_modes_that_drop_eval
  if_fails: "a recipe's eval split is hashed but never evaluated, so the reported validation loss is measured on a slice of the training data"

- id: FALSIFY-RECIPE-010
  rule: the distill consumer evaluates the recipe's held-out set
  prediction: "apr distill --recipe measures KD loss on eval.held_out after training, forward only, over exactly one pass of whole batches, reports it as val_loss, and refuses by name a held-out set that is not a .bin shard and eval.metric accuracy"
  test: |
    cargo test -p aprender-train-distill --lib pipeline::tests::falsify_recipe_010_held_out_is_evaluated_not_trained
    cargo test -p apr-cli --lib commands::finetune_recipe::tests::held_out_batches_counts_whole_batches_in_one_pass
    cargo test -p apr-cli --lib commands::finetune_recipe::tests::distill_refusals_name_the_recipe_field
  if_fails: "a distill recipe's eval split is hashed but never evaluated, or eval trains the student on the held-out set"

- id: FALSIFY-RECIPE-011
  rule: nothing outside the recipe changes a distill recipe run
  prediction: "apr distill --recipe refuses, before any model load and naming <env>, an APR_DISTILL_SMOKE_SEQ_LEN override (even one equal to the default); a recipe run always uses seq_len 256, and outside a recipe a malformed override is refused rather than read as 256"
  test: |
    cargo test -p apr-cli --lib commands::finetune_recipe::tests::a_seq_len_override_is_refused_under_a_recipe
    cargo test -p apr-cli --lib commands::finetune_recipe::tests::a_malformed_seq_len_override_is_refused_not_defaulted
  if_fails: "an environment variable changes the distill window length while the recipe hash, the run's identity, stays the same"

- id: FALSIFY-RECIPE-012
  rule: the config-mode distill report names the data it trained on
  prediction: "apr distill --config --stage train reports train_data as synthetic batches and dataset_path_read false, naming dataset.path, because the KD pipeline draws synthetic batches and never reads the configured dataset"
  test: |
    cargo test -p apr-cli --lib commands::distill::tests::config_train_report_names_its_synthetic_data
  if_fails: "a config-mode train run reports completed as if it trained on dataset.path while it trained on synthetic batches"

proof_obligations:
- id: RECIPE-INV-001
  type: invariant
  property: "every refusal carries the dotted path of the offending recipe field"
- id: RECIPE-INV-002
  type: invariant
  property: "unknown keys are refused at every level"
- id: RECIPE-INV-003
  type: invariant
  property: "recipe hash is invariant under formatting and sensitive to every value"
- id: RECIPE-INV-004
  type: invariant
  property: "valid lora and distill recipes are accepted"
- id: RECIPE-INV-005
  type: invariant
  property: "every recipe field a consumer accepts is applied by that consumer, or refused by name"

verification_summary:
  total_obligations: 5
  proven: 0
  tested: 5
  status: tested
