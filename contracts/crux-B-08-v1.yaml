# CRUX-B-08 — AWQ quantization
# Auto-scaffolded from crux-competitive-research-ux-v1.yaml.

metadata:
  id: CRUX-B-08
  version: "1.2.0"
  created: "2026-04-18"
  updated: "2026-04-21"
  author: PAIML Engineering
  registry: true
  status: partial
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "B — Inspection & Debugging"
  competitor: vllm
  demand_score: 5
  intake_status: missing
  description: >
    AWQ (Activation-aware Weight Quantization) parity. vllm exposes
    `python -m awq.quantize --model-path M --w-bit 4 --q-group-size 128`;
    the aprender surface is `apr quantize M.apr --method awq --bits 4
    --group-size 128 -o out.apr`. Per Lin et al. 2023 (arXiv:2306.00978),
    salient-weight-aware scaling preserves >=80% of fp16 quality at <=0.30x
    the file size on HumanEval-style tasks.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - "https://arxiv.org/abs/2306.00978 — AWQ paper"
  - "https://github.com/mit-han-lab/llm-awq — reference implementation"
  - "https://docs.vllm.ai/en/latest/quantization/auto_awq.html"

equations:
  awq_quality_retention:
    formula: |
      Let P_fp16 = pass@1(M_fp16, HumanEval[0..9])
      Let P_awq  = pass@1(quantize(M, method=AWQ, w_bit=4, q_group_size=128), HumanEval[0..9])
      Contract: P_awq >= 0.80 * P_fp16
      (AWQ 4-bit MUST retain >= 80% of fp16 baseline pass@1 on HumanEval/0..9)
    domain: (model M, HumanEval prompts[0..9])
    codomain: pass@1 score ∈ [0,1]
    invariants:
    - "AWQ output MUST pass `apr qa --require-golden-output` on HumanEval/0..9"
    - "Per-group scale is stored per 128-channel tile (q_group_size=128 default)"
    - "AWQ runs salient-weight activation calibration before scaling"

  awq_cli_parity:
    formula: |
      vllm   : python -m awq.quantize --model-path M --w-bit 4 --q-group-size 128 --output out
      aprender: apr quantize M.apr --method awq --bits 4 --group-size 128 -o out.apr
      Artifact sizes MUST agree to within 5% of the vllm AWQ reference.
    domain: (model M, bits ∈ {3,4,8}, group_size ∈ {64,128})
    codomain: quantized APR file
    invariants:
    - "apr quantize --method awq accepts --bits and --group-size flags"
    - "Group size default = 128 (matches vllm/awq reference)"

falsification_tests:
- id: FALSIFY-CRUX-B-08-001
  rule: AWQ retains >=80% of fp16 pass@1
  prediction: "pass@1(AWQ, HumanEval/0..9) >= 0.80 * pass@1(fp16, HumanEval/0..9)"
  test: |
    set -euo pipefail
    apr quantize model.apr --method awq --bits 4 --group-size 128 -o /tmp/model-awq.apr
    P_FP16=$(apr qa model.apr --eval humaneval --shard 0..9 --json | jq '.pass_at_1')
    P_AWQ=$(apr qa /tmp/model-awq.apr --eval humaneval --shard 0..9 --require-golden-output --json | jq '.pass_at_1')
    python3 -c "import sys; sys.exit(0 if $P_AWQ >= 0.80 * $P_FP16 else 1)"
  if_fails: "AWQ 4-bit degraded quality below 80% of fp16 baseline; salient-weight scaling ineffective"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/awq_classifier.rs
    cli_path: crates/apr-cli/src/commands/awq_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_b_08.rs
    e2e_tests:
    - falsify_crux_b_08_001_quality_retained_ok
    - falsify_crux_b_08_001_quality_rejects_degraded
    - falsify_crux_b_08_001_quality_rejects_zero_baseline
    sub_claim: |
      Algorithm-level necessary condition: `classify_quality_retention`
      computes the retention ratio ρ = P_awq / P_fp16 and admits only
      ρ >= `AWQ_MIN_QUALITY_RETENTION` (0.80) as the `Retained` verdict.
      Below-threshold retention and zero-baseline inputs return
      `Degraded` rather than panicking, so a broken fp16 baseline fails
      the gate visibly instead of being silently masked.
    tests:
    - retention_above_threshold_is_retained
    - retention_exactly_at_threshold_is_retained
    - retention_below_threshold_is_degraded
    - retention_zero_baseline_is_degraded_not_panic
    - retention_is_deterministic
    scope: pass@1 retention threshold (pure ratio classifier)
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: real AWQ quantizer + HumanEval/0..9 scoring harness

- id: FALSIFY-CRUX-B-08-002
  rule: CLI surface matches vllm
  prediction: "the SHIPPED `apr quantize` clap parser decides whether a recorded argv is accepted; it has no --method/--bits/--group-size, so the vllm/awq surface is NOT exposed"
  test: |
    cargo test -p apr-cli --lib flags_gate_rejects_the_method_bits_argv_the_shipped_cli_never_took
  if_fails: "apr quantize missing AWQ-equivalent flags; competitor parity broken"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/quantize_flag_parity.rs
    cli_path: crates/apr-cli/src/commands/awq_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_b_08.rs
    e2e_tests:
    - falsify_crux_b_08_002_flags_ok_on_a_real_quantize_argv
    - falsify_crux_b_08_002_flags_reject_method_bits_group_size
    - falsify_crux_b_08_002_flags_reject_quantize_without_the_required_file
    - falsify_crux_b_08_002_flags_observer_can_assert_expected_rejection
    - falsify_crux_b_08_002_stale_per_flag_label_is_unusable_input
    sub_claim: |
      HONEST STATE (aprender#2377 finding 2): this gate used to be discharged
      by `parse_awq_flags` + `validate_awq_flags`, a hand-rolled argv matcher
      that lived beside the assertion and understood `--method`, `--bits` and
      `--group-size`. The shipped `apr quantize` takes none of those three, so
      the gate had never once validated the command it named — it validated a
      second parser. Both functions are DELETED.
      The verdict now comes from the shipped clap parser
      (`quantize_flag_parity::shipped_quantize_verdict`, contract
      apr-lint-flag-parity-v1), which REJECTS `--method awq --bits 4
      --group-size 128`. That rejection is the truthful state of this rule:
      the vllm/awq CLI surface is not implemented, and the gate now says so
      instead of asserting the opposite.
    tests:
    - shipped_parser_rejects_the_awq_argv_the_hand_rolled_parser_accepted
    - shipped_parser_accepts_a_real_quantize_invocation
    - gate_fails_when_observation_expects_the_nonexistent_flags_to_be_accepted
    - gate_passes_when_observation_expects_the_nonexistent_flags_to_be_rejected
    - flags_gate_rejects_the_method_bits_argv_the_shipped_cli_never_took
    - flags_gate_accepts_a_real_quantize_invocation
    - flags_gate_stale_vocabulary_is_unusable_input
    scope: argv → shipped clap Command → {accepted, rejected}
    discharge_status: REFUTED_SURFACE_NOT_IMPLEMENTED
    full_discharge_blocked_on: "`apr quantize` gaining a --method/--bits/--group-size surface (or this rule being retired); see contracts/apr-lint-flag-parity-v1.yaml"

- id: FALSIFY-CRUX-B-08-003
  rule: AWQ artifact size <= 0.3x fp16
  prediction: "4-bit AWQ file <= 30% of fp16 source size"
  test: |
    FP16=$(stat -c%s model.apr)
    AWQ=$(stat -c%s /tmp/model-awq.apr)
    python3 -c "import sys; sys.exit(0 if $AWQ <= 0.30 * $FP16 else 1)"
  if_fails: "AWQ output not compressed to ~4 bits/weight; packing bug"
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/awq_classifier.rs
    cli_path: crates/apr-cli/src/commands/awq_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_b_08.rs
    e2e_tests:
    - falsify_crux_b_08_003_compression_ok
    - falsify_crux_b_08_003_compression_rejects_over_ceiling
    - falsify_crux_b_08_003_compression_rejects_zero_source
    sub_claim: |
      Algorithm-level necessary condition: `classify_compression_ratio`
      computes ρ = awq_bytes / fp16_bytes and admits only ρ <=
      `AWQ_MAX_COMPRESSION_RATIO` (0.30) as `Compressed`. Zero-byte
      fp16 source is handled as `Insufficient { ratio: ∞ }` rather
      than a division-by-zero panic.
    tests:
    - compression_well_under_ceiling_is_compressed
    - compression_exactly_at_ceiling_is_compressed
    - compression_over_ceiling_is_insufficient
    - compression_zero_source_is_insufficient
    scope: byte-ratio ceiling (pure comparator)
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: real AWQ 4-bit packer + fp16 source pair on disk

