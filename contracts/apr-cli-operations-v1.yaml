metadata:
  version: 1.0.0
  created: '2026-04-03'
  author: PAIML Engineering
  registry: true
  description: >
    All 48 apr-cli operations — argument validation, side-effect classification,
    resource cleanup, concurrent safety, and progress reporting invariants.
    Covers run, check, serve, inspect, debug, validate, lint, explain, canary,
    trace, tensors, diff, chat, tui, import, export, pull, list, rm, convert,
    compile, quantize, merge, prune, distill, publish, eval, bench, profile,
    parity, ptx, ptx-map, flow, tree, data, tokenize, pipeline, diagnose,
    qa, qualify, probar, compare-hf, showcase, hex, cbtop, rosetta, oracle,
    decrypt, encrypt.
  references:
  - 'apr-cli/src/dispatch.rs — main dispatch_core_command()'
  - 'apr-cli/src/commands/ — per-command modules'
  - 'apr-cli/src/error.rs — CliError with exit codes'
  - 'POSIX.1-2017 Section 12 — Utility Conventions'
  depends_on:
  - cli-dispatch-v1
  - model-format-conversion-v1
  - http-api-v1
equations:
  side_effect_classification:
    formula: |
      classify(cmd): Command -> SideEffectClass
        ReadOnly = {check, inspect, debug, validate, lint, explain, list,
                    eval, bench, profile, parity, ptx, ptx-map, flow, tree,
                    tensors, diff, hex, cbtop, rosetta, qa, qualify,
                    compare-hf, showcase, diagnose, oracle}
        Mutating = {import, export, convert, quantize, merge, prune, distill,
                    publish, compile, rm, data, tokenize, pipeline,
                    decrypt, encrypt}
        LongRunning = {run, serve, chat, tui, canary, trace, pull, probar}
    domain: Any apr CLI command
    codomain: SideEffectClass in {ReadOnly, Mutating, LongRunning}
    invariants:
    - ReadOnly commands NEVER modify files, models, or external state
    - Mutating commands write to explicit --output path (never implicit overwrite)
    - LongRunning commands support graceful SIGINT/SIGTERM shutdown
    - Classification is exhaustive — every command has exactly one class
    preconditions:
    - command is a valid Commands variant
    postconditions:
    - returned class matches documented behavior
    lean_theorem: Theorems.Side_Effect_Classification
  resource_cleanup:
    formula: |
      cleanup(cmd): Command -> Result<(), CleanupError>
        GPU context released on exit (even on error/panic)
        Temporary files deleted on exit
        Network connections closed
        mmap regions unmapped
        Thread pool joined (no orphan threads)
    domain: Any command after execution (success or failure)
    codomain: All resources released
    invariants:
    - No GPU memory leak after command exit
    - No temporary files left in /tmp after command exit
    - No zombie threads after command exit
    - Drop handlers run even on panic (RAII guarantee)
    preconditions:
    - command has finished execution (Ok or Err)
    postconditions:
    - GPU memory usage returns to pre-command level
    - /tmp file count returns to pre-command level
    lean_theorem: Theorems.Resource_Cleanup
  inference_determinism:
    formula: |
      run(model, prompt, seed): (Model, String, u64) -> Result<String, InferenceError>
        Given identical (model, prompt, seed, temperature=0.0):
          run(m, p, s) == run(m, p, s)  (deterministic)
        temperature > 0 -> non-deterministic (expected)
    domain: Model path, prompt text, random seed
    codomain: Result<generated text, InferenceError>
    invariants:
    - temperature=0 is always deterministic (greedy decoding)
    - seed controls randomness when temperature > 0
    - Output is valid UTF-8
    - Token count <= max_tokens parameter
    preconditions:
    - model file exists and passes format validation
    - prompt is non-empty valid UTF-8
    postconditions:
    - output is valid UTF-8
    - output token count <= max_tokens
    lean_theorem: Theorems.Inference_Determinism
  progress_reporting:
    formula: |
      progress(cmd, callback): (Command, Fn(Progress)) -> ()
        For long-running commands:
          callback called at least once per second
          progress.pct monotonically increasing [0.0, 1.0]
          progress.pct == 1.0 on completion
          progress.eta decreasing (or None if unknown)
    domain: Long-running command with progress callback
    codomain: Stream of Progress events
    invariants:
    - Progress percentage is monotonically non-decreasing
    - Progress never exceeds 1.0
    - At least one update per second for interactive use
    - Final progress is exactly 1.0 on success
    preconditions:
    - command is in LongRunning class
    postconditions:
    - final progress == 1.0 on Ok
    lean_theorem: Theorems.Progress_Reporting
  concurrent_model_access:
    formula: |
      concurrent(model, requests): (Model, Vec<Request>) -> Vec<Result>
        Multiple inference requests on same model:
          No data race on model weights (immutable after load)
          KV cache per-request (not shared)
          Results independent of request ordering
    domain: Loaded model with concurrent request batch
    codomain: Vec of independent results
    invariants:
    - Model weights are immutable during inference (no aliased mutation)
    - Each request has its own KV cache (no cross-contamination)
    - Results are independent of execution order
    - Concurrent load does not exceed GPU memory limit
    preconditions:
    - model loaded successfully
    - requests.len() > 0
    postconditions:
    - results.len() == requests.len()
    - each result independent of others
    lean_theorem: Theorems.Concurrent_Model_Access
  tokenizer_consistency:
    formula: |
      tokenize(text): String -> Vec<Token>
        decode(encode(text)) == text  (roundtrip for valid text)
        encode(text).len() <= text.len() * MAX_EXPANSION_RATIO
        Special tokens never appear in encoded non-special text
    domain: Valid UTF-8 text string
    codomain: Vec<Token> (token IDs)
    invariants:
    - Roundtrip encode/decode preserves original text
    - Token count bounded by input length * expansion ratio
    - Special tokens (BOS, EOS, PAD) only appear when explicitly added
    - Empty string produces empty token list
    preconditions:
    - text is valid UTF-8
    - tokenizer model loaded
    postconditions:
    - decode(result) == text
    lean_theorem: Theorems.Tokenizer_Consistency

kernel_structure:
  phases:
  - name: validate_input
    description: Validate command arguments, model path, and resource availability
  - name: execute
    description: Dispatch to command handler, perform operation with progress reporting
  - name: verify_output
    description: Verify postconditions, release resources, return result

proof_obligations:
- id: ACO-INV-001
  type: invariant
  property: ReadOnly commands have no side effects
  formal: forall cmd in ReadOnly, fs_state_before == fs_state_after
  applies_to: side_effect_classification
  lean:
    theorem: Theorems.SideEffectClassification
    status: sorry
- id: ACO-INV-002
  type: invariant
  property: No resource leaks after command exit
  formal: forall cmd, gpu_mem_after <= gpu_mem_before AND tmp_files_after <= tmp_files_before
  applies_to: resource_cleanup
  lean:
    theorem: Theorems.ResourceCleanup
    status: sorry
- id: ACO-DET-003
  type: determinism
  property: Greedy decoding is deterministic
  formal: temperature=0 -> run(m,p,s) == run(m,p,s)
  applies_to: inference_determinism
  lean:
    theorem: Theorems.InferenceDeterminism
    status: sorry
- id: ACO-MON-004
  type: monotonicity
  property: Progress percentage monotonically increasing
  formal: forall t1 < t2, progress(t1).pct <= progress(t2).pct
  applies_to: progress_reporting
  lean:
    theorem: Theorems.ProgressReporting
    status: sorry
- id: ACO-INV-005
  type: invariant
  property: Concurrent inference results independent
  formal: result_i independent of request ordering
  applies_to: concurrent_model_access
  lean:
    theorem: Theorems.ConcurrentModelAccess
    status: sorry
- id: ACO-RT-006
  type: roundtrip
  property: Tokenizer encode/decode roundtrip
  formal: decode(encode(text)) == text for valid UTF-8
  applies_to: tokenizer_consistency
  lean:
    theorem: Theorems.TokenizerConsistency
    status: sorry
- id: ACO-BND-007
  type: bound
  property: Token count bounded by input length
  formal: encode(text).len() <= text.len() * MAX_EXPANSION_RATIO
  tolerance: 1e-6
  applies_to: tokenizer_consistency
  lean:
    theorem: Theorems.TokenizerConsistencyBound
    status: sorry
falsification_tests:
- id: FALSIFY-OPS-001
  rule: ReadOnly commands have no side effects
  prediction: apr check does not modify any file (before/after hash identical)
  test: Snapshot filesystem, run apr check, diff snapshot
  if_fails: Read-only command has hidden file mutation
- id: FALSIFY-OPS-002
  rule: No resource leaks after command exit
  prediction: GPU memory returns to baseline after inference error
  test: Force inference OOM, measure GPU memory after, compare to baseline
  if_fails: GPU memory leak on error path
- id: FALSIFY-OPS-003
  rule: Greedy decoding is deterministic
  prediction: Two runs with temperature=0 produce identical output
  test: Run same prompt twice with temperature=0, assert output equality
  if_fails: Non-deterministic codepath in greedy sampling
- id: FALSIFY-OPS-004
  rule: Progress percentage monotonically increasing
  prediction: Progress never decreases during model loading
  test: Capture all progress events during pull, verify monotonicity
  if_fails: Progress percentage regression (confuses users)
- id: FALSIFY-OPS-005
  rule: Concurrent inference results independent
  prediction: Result of request A is identical whether B runs concurrently or not
  test: Run request A alone, then with concurrent B, diff results
  if_fails: KV cache contamination between concurrent requests
- id: FALSIFY-OPS-006
  rule: Tokenizer encode/decode roundtrip
  prediction: Random UTF-8 strings survive tokenize/detokenize roundtrip
  test: Generate 1000 random UTF-8 strings, encode then decode, assert equality
  if_fails: Tokenizer drops or corrupts characters
- id: FALSIFY-OPS-007
  rule: Token count bounded by input length
  prediction: No input produces more than 4x tokens (BPE worst case)
  test: Encode adversarial strings (single-byte tokens), verify count <= 4 * len
  if_fails: Token explosion — unbounded memory usage
- id: FALSIFY-OPS-008
  rule: A --ci gate exits non-zero whenever the report it printed says FAIL
  prediction: apr cbtop --headless --simulated --ci exits non-zero when the report reads "Status FAIL | CI red", with no explicit --throughput or --brick-score threshold set
  test: commands::cbtop::tests::test_ci_gate_fails_on_red_report_without_explicit_thresholds
  if_fails: The CI gate ignores its own verdict and cannot fail the build it exists to fail
- id: FALSIFY-OPS-009
  rule: A benchmark refuses to report measurements it never took
  prediction: apr cbtop --iterations 0 is rejected at parse time rather than producing a report scoring every brick a perfect 100/A from zero samples
  test: tests::test_parse_cbtop_rejects_zero_iterations
  if_fails: Appending --iterations 0 turns any cbtop --ci gate unconditionally green
- id: FALSIFY-OPS-010
  rule: Report timestamps carry the real UTC date
  prediction: The timestamp in a cbtop report matches the UTC date at the moment it was generated, on both headless paths
  test: commands::cbtop::tests::test_chrono_timestamp_is_current_utc_date
  if_fails: Persisted CI provenance is stamped with a stale hardcoded date
- id: FALSIFY-OPS-011
  rule: ptx-map printers cover decode, prefill, hit and miss paths
  prediction: print_json and print_reverse_lookup complete on every table and report launches/layer x layers
  test: commands::ptx_map::tests::print_json_and_reverse_lookup_cover_every_branch
  if_fails: ptx-map JSON or reverse-lookup output panics or miscounts launches
- id: FALSIFY-OPS-012
  rule: apr run prints every output mode and derives tok/s as documented
  prediction: print_run_output succeeds for stream, json, benchmark and text; effective_tok_per_sec prefers the reported rate, else tokens/duration, else 0.0
  test: commands::run::tests::print_run_output_serves_every_mode_and_derives_the_rate
  if_fails: apr run output errors on a finished run or reports a wrong rate
- id: FALSIFY-OPS-014
  rule: benchmark summaries use the sample standard deviation and the t interval
  prediction: stat_summary of [2,4,6] has mean 4, stddev 2 and a 95% margin of t(3)*2/sqrt(3); one sample collapses the interval; an empty slice yields zeros
  test: llm::benchmark::tests::stat_summary_computes_mean_stddev_and_t_interval
  if_fails: benchmark confidence intervals are wrong, so a speed claim rests on a wrong error bar
- id: FALSIFY-OPS-015
  rule: pv lint layers CLI flags over the config file
  prediction: build_config takes scalars from the flag when set else the file, merges suppression lists, and lets a CLI rule override beat the file; a missing config yields defaults
  test: commands::lint::tests::build_config_merges_cli_flags_over_the_config_file
  if_fails: pv lint silently ignores a flag or a config setting
- id: FALSIFY-OPS-016
  rule: Mock page coverage cannot be read before it is started, and stopping ends collection
  prediction: take_coverage before start_coverage is an InvalidState error; after start it returns the page url and added functions; stop_coverage returns the final report and later takes fail
  test: mock_page_take_coverage_5695::stop_coverage_returns_final_report_then_disables
  if_fails: Coverage reads succeed on a page that never enabled collection, or keep succeeding after stop
- id: FALSIFY-OPS-017
  rule: Resuming a classifier checkpoint restores what was saved and refuses a foreign dataset
  prediction: resume_from_apr_checkpoint returns the saved epoch and the saved classifier weights, and a checkpoint from a different corpus is rejected with F-CKPT-006 before any weight is touched
  test: finetune::classify_trainer::tests::test_resume_rejects_data_hash_mismatch
  if_fails: A resume silently continues from weights trained on different data, or loses the epoch
- id: FALSIFY-OPS-018
  rule: batch inference never aborts on a failing prompt
  prediction: run_batch_loop emits one JSONL error row and counts one failure per bad-JSON, encode-failed or model-less prompt, skips blank lines, and returns an IoError when the sink is unwritable
  test: infer::tests_batch_loop_5691::bad_json_encode_failure_and_missing_model_each_emit_one_error_row_5691
  if_fails: a bad prompt aborts or silently vanishes from a batch run
- id: FALSIFY-OPS-019
  rule: oracle recommender emits a distinct code example per stack component
  prediction: generate_code_example returns Some for every known component with a distinct non-empty body, honours a recommended aprender path, and returns None for an unknown component
  test: oracle::recommender::tests::code_example_exists_for_every_stack_component_and_is_distinct
  if_fails: the oracle shows the wrong or no example for a recommended component
- id: FALSIFY-OPS-020
  rule: extract-frames fails loudly and dry-runs without side effects
  prediction: run_extract_frames rejects a missing path and a video-less or fully excluded directory with distinct errors, rejects a malformed exclude glob, lists videos on dry-run without creating frame dirs, and leaves a populated frames dir untouched under skip-existing
  test: extract::tests::skip_existing_treats_a_populated_frames_dir_as_done_but_an_empty_one_as_pending
  if_fails: extract-frames re-extracts finished videos or hides why nothing was processed
- id: FALSIFY-OPS-021
  rule: /v1/predict computes from the loaded tensor and refuses what it cannot compute
  prediction: apr_predict_handler rejects empty features with 400, reports a missing weights/output tensor as 400, returns the dot product for matching-length weights, and argmax class plus ranked top-k for logits
  test: api::tests::apr_predict_5698::predict_classification_takes_argmax_and_ranks_top_k
  if_fails: The predict endpoint returns a plausible number or class that is not derived from the loaded model
- id: FALSIFY-OPS-022
  rule: The MoE FFN layer refuses malformed router input and routes k=1 to exactly one expert
  prediction: moe_ffn_forward_layer rejects a wrong hidden length, a quantized router and a short router byte_size, and with top-k 1 returns the favoured expert's SwiGLU output unchanged
  test: gguf::qwen3_moe_load::moe_ffn_layer_5699_tests::moe_ffn_layer_5699_k1_output_is_the_routed_experts_swiglu
  if_fails: A mis-sized router or hidden vector reads past its tensor, or routing mixes experts that top-k 1 should exclude
kani_harnesses:
- id: KANI-OPS-001
  obligation: ReadOnly commands have no side effects
  property: No file mutation in readonly commands
  bound: 8
  strategy: exhaustive
  harness: verify_readonly_no_mutation
- id: KANI-OPS-002
  obligation: No resource leaks after command exit
  property: Resources freed on all exit paths
  bound: 8
  strategy: exhaustive
  harness: verify_resource_cleanup
- id: KANI-OPS-003
  obligation: Greedy decoding is deterministic
  property: temperature=0 -> deterministic output
  bound: 4
  strategy: exhaustive
  harness: verify_greedy_determinism
- id: KANI-OPS-004
  obligation: Progress percentage monotonically increasing
  property: pct(t1) <= pct(t2) for t1 < t2
  bound: 16
  strategy: bounded_int
  harness: verify_progress_monotonic
- id: KANI-OPS-005
  obligation: Concurrent inference results independent
  property: No cross-request state contamination
  bound: 4
  strategy: exhaustive
  harness: verify_concurrent_independence
- id: KANI-OPS-006
  obligation: Tokenizer encode/decode roundtrip
  property: decode(encode(s)) == s
  bound: 8
  strategy: exhaustive
  harness: verify_tokenizer_roundtrip
- id: KANI-OPS-007
  obligation: Token count bounded by input length
  property: tokens.len() <= input.len() * 4
  bound: 16
  strategy: bounded_int
  harness: verify_token_count_bounded
qa_gate:
  id: F-OPS-GATE
  name: APR CLI Operations Contract
  description: All 48 apr-cli operations — safety, determinism, and resource management
  checks:
  - side_effect_classification
  - resource_cleanup
  - inference_determinism
  - progress_reporting
  - concurrent_model_access
  - tokenizer_consistency
  pass_criteria: All 21 falsification tests pass
  falsification: >
    Run read-only command with filesystem watcher to detect mutations.
    Force inference error and measure GPU memory leak.
    Run two greedy inferences and diff output.
