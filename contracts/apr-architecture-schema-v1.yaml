metadata:
  version: 1.0.0
  created: '2026-04-04'
  author: PAIML Engineering
  description: >
    LLM architecture schema contract — full structural specification of
    transformer model components. Covers the complete model graph from
    embedding through attention layers (Q/K/V projections, MHA/GQA/MQA),
    FFN blocks (gate/up/down, SwiGLU, MoE), normalization (RMSNorm,
    LayerNorm), position encoding (RoPE, ALiBi), and output head
    (lm_head, tied embeddings). This is the authoritative schema against
    which `apr check`, `apr validate`, and `apr import --strict` verify
    tensor names, shapes, and dtypes.
  references:
  - 'aprender/src/format/gguf/api.rs:80 — GgufModelConfig struct'
  - 'aprender/src/format/model_family.rs — ModelFamilyConfig, ModelSizeConfig'
  - 'apr-cli/src/commands/check.rs — 10-stage model integrity pipeline'
  - 'Vaswani et al. (2017) Attention Is All You Need. NeurIPS 2017'
  - 'Shazeer (2020) GLU Variants Improve Transformer. arXiv:2002.05202'
  - 'Su et al. (2021) RoFormer: Enhanced Transformer with Rotary Position Embedding'
  - 'Ainslie et al. (2023) GQA: Training Generalized Multi-Query Transformer Models'
  depends_on:
  - tensor-layout-v1
  - qwen2-weight-loading-v1
  - layer-parity-v1

equations:
  architecture_config_invariants:
    formula: |
      validate_config(config): GgufModelConfig -> Result<(), ConfigError>
        Required: hidden_size > 0, num_layers > 0, num_heads > 0, vocab_size > 0
        Derived: head_dim = hidden_size / num_heads (unless explicit)
        GQA: num_kv_heads divides num_heads evenly
        MoE: num_experts > 0 implies num_experts_per_tok > 0
        Bounds: hidden_size in [64, 65536], num_layers in [1, 512],
                vocab_size in [1, 1_000_000]
    domain: GgufModelConfig with Optional fields
    codomain: Result<ValidatedConfig, ConfigError>
    invariants:
    - hidden_size % num_heads == 0 (head_dim is integer)
    - num_heads % num_kv_heads == 0 (GQA group size is integer)
    - num_experts_per_tok <= num_experts
    - rms_norm_eps > 0 (prevents division by zero)
    preconditions:
    - config has at least hidden_size, num_layers, num_heads, vocab_size
    postconditions:
    - result.head_dim * result.num_heads == result.hidden_size
    - result.kv_group_size * result.num_kv_heads == result.num_heads
    lean_theorem: Theorems.ArchitectureConfigInvariants

  attention_tensor_shapes:
    formula: |
      validate_attention_tensors(layer_i, config): (usize, Config) -> Result<(), ShapeError>
        Q projection: [hidden_size, num_heads * head_dim]
        K projection: [hidden_size, num_kv_heads * head_dim]
        V projection: [hidden_size, num_kv_heads * head_dim]
        O projection: [num_heads * head_dim, hidden_size]
        Attention output: [batch, seq_len, hidden_size]
    domain: Layer index, validated model config
    codomain: Result<(), ShapeError> with per-tensor diagnostics
    invariants:
    - Q shape == [hidden_size, num_heads * head_dim]
    - K shape == V shape == [hidden_size, num_kv_heads * head_dim]
    - O shape == transpose(Q shape)
    - All attention tensors have same dtype
    preconditions:
    - layer_i < config.num_layers
    - config is validated (head_dim * num_heads == hidden_size)
    postconditions:
    - all 4 projection tensors exist for each layer
    - shapes match config exactly
    lean_theorem: Theorems.AttentionTensorShapes

  ffn_tensor_shapes:
    formula: |
      validate_ffn_tensors(layer_i, config): (usize, Config) -> Result<(), ShapeError>
        Standard FFN:
          gate:   [hidden_size, intermediate_size]
          up:     [hidden_size, intermediate_size]
          down:   [intermediate_size, hidden_size]
        SwiGLU: gate and up are fused or separate (both valid)
        MoE: each expert has own gate/up/down with shape [hidden_size, moe_intermediate_size]
    domain: Layer index, validated model config
    codomain: Result<(), ShapeError>
    invariants:
    - gate and up shapes are identical
    - down shape is transpose of gate shape
    - MoE experts all have identical shapes
    preconditions:
    - layer_i < config.num_layers
    - intermediate_size > 0
    postconditions:
    - standard FFN has 3 tensors (gate, up, down) OR 2 tensors (merged gate_up, down)
    - MoE FFN has 3 * num_experts tensors per layer
    lean_theorem: Theorems.FfnTensorShapes

  normalization_tensor_shapes:
    formula: |
      validate_norm_tensors(layer_i, config): (usize, Config) -> Result<(), ShapeError>
        RMSNorm: weight shape = [hidden_size], no bias
        LayerNorm: weight shape = [hidden_size], bias shape = [hidden_size]
        Pre-norm: attn_norm before attention, ffn_norm before FFN
        Post-norm: final_norm after last layer
    domain: Layer index, validated model config
    codomain: Result<(), ShapeError>
    invariants:
    - Every layer has exactly 2 norm tensors (attn_norm, ffn_norm)
    - Final norm exists after last layer
    - Norm weight shape == [hidden_size]
    preconditions:
    - layer_i < config.num_layers
    postconditions:
    - norm_count_per_layer == 2
    - final_norm exists
    lean_theorem: Theorems.NormalizationTensorShapes

  embedding_tensor_shapes:
    formula: |
      validate_embeddings(config): Config -> Result<(), ShapeError>
        Token embedding: [vocab_size, hidden_size]
        LM head (output): [hidden_size, vocab_size] OR tied to embedding
        Position embedding: optional, [max_position_embeddings, hidden_size]
    domain: Validated model config
    codomain: Result<(), ShapeError>
    invariants:
    - Token embedding exists and shape == [vocab_size, hidden_size]
    - LM head exists OR embedding is marked as tied
    - If tied, embedding and lm_head share same tensor data
    preconditions:
    - vocab_size > 0
    - hidden_size > 0
    postconditions:
    - embedding_count >= 1 (token embedding)
    - lm_head_exists || tied_embeddings
    lean_theorem: Theorems.EmbeddingTensorShapes

  rope_position_encoding:
    formula: |
      validate_rope(config): Config -> Result<(), RopeError>
        RoPE theta: default 10000.0, Qwen2.5 uses 1000000.0
        RoPE type: 0 = NORM (adjacent pairs), 2 = NEOX (split halves)
        Frequency: freq_i = 1 / (theta ^ (2i / head_dim))
        Applied to Q and K projections only (not V)
    domain: Config with rope_theta and rope_type fields
    codomain: Result<RopeConfig, RopeError>
    invariants:
    - rope_theta > 0
    - rope_type in {0, 2} (CORRECTNESS-011)
    - freq vector length == head_dim / 2
    preconditions:
    - config.rope_theta.is_some() || config uses default 10000.0
    postconditions:
    - freq.len() == head_dim / 2
    - all freq values are finite and positive
    lean_theorem: Theorems.RopePositionEncoding

  total_tensor_count:
    formula: |
      expected_tensors(config): Config -> usize
        Standard: 1 (embed) + num_layers * (4 attn + 3 ffn + 2 norm) + 1 (final_norm) + 1 (lm_head)
                = 1 + num_layers * 9 + 2
        GQA: same formula (K,V smaller but still separate tensors)
        MoE: 1 + num_layers * (4 attn + 3*num_experts ffn + 2 norm) + 2
        Tied: subtract 1 if lm_head is tied to embedding
    domain: Validated model config
    codomain: Expected tensor count (usize)
    invariants:
    - Actual tensor count matches expected (within tolerance for format-specific extras)
    - Tolerance for metadata/vocab tensors (+/- 5 tensors)
    preconditions:
    - config is fully validated
    postconditions:
    - "abs(actual - expected) <= 5"
    lean_theorem: Theorems.TotalTensorCount

kernel_structure:
  phases:
  - name: validate_input
    description: Parse config from model metadata, validate required fields and bounds
  - name: execute
    description: Walk tensor graph verifying attention/FFN/norm/embedding shapes per layer
  - name: verify_output
    description: Verify total tensor count matches expected, no orphan tensors

proof_obligations:
- type: invariant
  property: Head dimension divides hidden size evenly
  formal: hidden_size % num_heads == 0
  tolerance: 1e-6
  applies_to: architecture_config_invariants
  lean:
    theorem: Theorems.ArchitectureConfigInvariants
    status: sorry
- type: invariant
  property: GQA group size divides num_heads evenly
  formal: num_heads % num_kv_heads == 0
  applies_to: architecture_config_invariants
  lean:
    theorem: Theorems.ArchitectureConfigGqaInvariant
    status: sorry
- type: postcondition
  property: Attention Q/K/V/O shapes match config
  formal: "Q=[h, n_h*d_h], K=V=[h, n_kv*d_h], O=[n_h*d_h, h]"
  applies_to: attention_tensor_shapes
  lean:
    theorem: Theorems.AttentionTensorShapes
    status: sorry
- type: postcondition
  property: FFN gate/up/down shapes are transpose-consistent
  formal: "gate.shape == up.shape, down.shape == transpose(gate.shape)"
  applies_to: ffn_tensor_shapes
  lean:
    theorem: Theorems.FfnTensorShapes
    status: sorry
- type: invariant
  property: Every layer has exactly 2 norm tensors
  formal: norm_count_per_layer == 2 for all layers
  applies_to: normalization_tensor_shapes
  lean:
    theorem: Theorems.NormalizationTensorShapes
    status: sorry
- type: postcondition
  property: Embedding exists and has correct shape
  formal: "embed.shape == [vocab_size, hidden_size]"
  applies_to: embedding_tensor_shapes
  lean:
    theorem: Theorems.EmbeddingTensorShapes
    status: sorry
- type: invariant
  property: RoPE frequency vector length matches head_dim
  formal: freq.len() == head_dim / 2
  applies_to: rope_position_encoding
  lean:
    theorem: Theorems.RopePositionEncoding
    status: sorry
- type: bound
  property: Total tensor count within tolerance of expected
  formal: "abs(actual_tensors - expected_tensors(config)) <= 5"
  applies_to: total_tensor_count
  lean:
    theorem: Theorems.TotalTensorCount
    status: sorry

falsification_tests:
- id: FALSIFY-ARCH-001
  rule: Head dimension divides hidden size evenly
  prediction: Config with hidden_size=769, num_heads=12 rejected (769 not divisible)
  test: Create config with prime hidden_size, attempt validate
  if_fails: Integer division truncates silently instead of erroring
- id: FALSIFY-ARCH-002
  rule: GQA group size consistency
  prediction: Config with num_heads=12, num_kv_heads=5 rejected (12 not divisible by 5)
  test: Create config with non-divisible head/kv ratio
  if_fails: GQA attention produces wrong-shaped output
- id: FALSIFY-ARCH-003
  rule: Attention shapes match config
  prediction: Model with wrong-shaped Q projection fails check
  test: Craft model with Q=[hidden_size, hidden_size+1], run check
  if_fails: Shape validation skips attention projection check
- id: FALSIFY-ARCH-004
  rule: FFN transpose consistency
  prediction: Model with gate=[H,I] and down=[H,I] (not transposed) fails check
  test: Craft model with non-transposed down projection
  if_fails: Check accepts inconsistent FFN shapes
- id: FALSIFY-ARCH-005
  rule: Norm tensors per layer
  prediction: Model missing ffn_norm on layer 3 fails check
  test: Remove one norm tensor from valid model, run check
  if_fails: Check counts total norms instead of per-layer
- id: FALSIFY-ARCH-006
  rule: Embedding shape matches vocab
  prediction: Embedding with shape [vocab_size-1, hidden_size] fails
  test: Modify embedding shape to off-by-one
  if_fails: Embedding shape not validated against vocab_size metadata
- id: FALSIFY-ARCH-007
  rule: RoPE type is valid
  prediction: Config with rope_type=3 rejected
  test: Set invalid rope_type in GGUF metadata
  if_fails: Unknown rope_type silently defaults to 0
- id: FALSIFY-ARCH-008
  rule: Total tensor count within tolerance
  prediction: Model missing 10 tensors fails check
  test: Remove 10 tensors from valid model
  if_fails: Tolerance too generous or count not validated

kani_harnesses:
- id: KANI-ARCH-001
  obligation: Head dimension divides hidden size evenly
  property: hidden_size % num_heads == 0
  bound: 16
  strategy: bounded_int
  harness: verify_head_dim_divides
- id: KANI-ARCH-002
  obligation: GQA group size divides num_heads evenly
  property: num_heads % num_kv_heads == 0
  bound: 16
  strategy: bounded_int
  harness: verify_gqa_divides
- id: KANI-ARCH-003
  obligation: Attention Q/K/V/O shapes match config
  property: "shape validation passes for correct shapes"
  bound: 8
  strategy: exhaustive
  harness: verify_attention_shapes
- id: KANI-ARCH-004
  obligation: FFN gate/up/down shapes are transpose-consistent
  property: "down.shape == transpose(gate.shape)"
  bound: 8
  strategy: exhaustive
  harness: verify_ffn_shapes
- id: KANI-ARCH-005
  obligation: Every layer has exactly 2 norm tensors
  property: norm_count == 2 * num_layers + 1
  bound: 8
  strategy: bounded_int
  harness: verify_norm_count
- id: KANI-ARCH-006
  obligation: Embedding exists and has correct shape
  property: "embed.shape == [vocab_size, hidden_size]"
  bound: 8
  strategy: exhaustive
  harness: verify_embedding_shape
- id: KANI-ARCH-007
  obligation: RoPE frequency vector length matches head_dim
  property: freq.len() == head_dim / 2
  bound: 16
  strategy: bounded_int
  harness: verify_rope_freq_length
- id: KANI-ARCH-008
  obligation: Total tensor count within tolerance of expected
  property: "abs(actual - expected) <= 5"
  bound: 16
  strategy: bounded_int
  harness: verify_tensor_count_tolerance

qa_gate:
  id: F-ARCH-GATE
  name: Architecture Schema Contract
  description: Quality gate for full LLM architecture validation
  checks:
  - validation
  - falsification
  pass_criteria: All 8 falsification tests pass

toyota_way_principles:
  jidoka: >
    Any shape mismatch stops the pipeline. A model with wrong-shaped
    attention projections will produce garbage — fail fast at import,
    not silently at inference.
  poka_yoke: >
    Config validation derives head_dim from hidden_size/num_heads —
    impossible to set inconsistent values. GQA divisibility checked
    before any tensor is read.
  genchi_genbutsu: >
    Falsification uses real malformed models: prime hidden_size,
    missing norm tensors, off-by-one embeddings. Not synthetic assertions.
