metadata:
  version: 1.0.0
  created: '2026-04-03'
  author: PAIML Engineering
  description: Secret provider — provider dispatch, ephemeral cleanup, drift detection
  references:
  - 'SOPS (Mozilla) encrypted file format'
  - 'OWASP Secret Management Cheat Sheet (2024)'
equations:
  provider_dispatch:
    formula: 'resolve: SecretRef -> Result<ResolvedSecret, SecretError>'
    domain: ref ∈ SecretRef
    codomain: Result<ResolvedSecret, SecretError>
    invariants:
    - Env → env::var(key) or SecretError::NotFound
    - File → fs::read_to_string(key) or SecretError::NotFound
    - Sops → sops_decrypt(key) or SecretError::DecryptFailed
    - OnePassword → op_read(key) or SecretError::ProviderFailed
    - Every provider returns explicit Result, never panics
    preconditions:
    - ref.key.len() > 0
    - ref.provider is a valid SecretProvider variant
    lean_theorem: Theorems.Provider_Dispatch
  ephemeral_cleanup:
    formula: 'drop(secret) when ephemeral=true → memory zeroed'
    domain: secret ∈ ResolvedSecret where secret.ephemeral = true
    codomain: ()
    invariants:
    - Memory zeroed on drop (zeroize crate)
    - Secret does not appear in logs
    - Secret does not appear in error messages
    - Secret does not appear in debug output
    preconditions:
    - secret.ephemeral is set
    lean_theorem: Theorems.Ephemeral_Cleanup
  drift_detection:
    formula: 'stored_hash = current_hash → NoDrift; stored_hash ≠ current_hash → Drifted; stored_hash = None → NewSecret'
    domain: (ref ∈ SecretRef, stored ∈ Option<Hash>, current ∈ Hash)
    codomain: DriftStatus ∈ {NoDrift, Drifted(old, new), NewSecret}
    invariants:
    - Same secret value → NoDrift
    - Changed secret value → Drifted with both hashes
    - First-time secret → NewSecret
    preconditions:
    - current hash is valid BLAKE3 hash
    lean_theorem: Theorems.Drift_Detection
proof_obligations:
- type: completeness
  property: All providers handled
  formal: '∀ provider: resolve(provider, key) returns Result'
  applies_to: all
- type: frame
  property: Ephemeral cleanup
  formal: 'drop(secret) zeroes memory, no log leakage'
  applies_to: all
- type: determinism
  property: Drift detection
  formal: 'same secret → NoDrift, changed → Drifted'
  applies_to: all
enforcement:
  provider_dispatch:
    description: Every provider must resolve or return explicit error
    check: contract_tests::FALSIFY-FSEC-001
    severity: ERROR
  ephemeral_cleanup:
    description: Ephemeral secrets must be zeroed and never logged
    check: contract_tests::FALSIFY-FSEC-002
    severity: ERROR
  drift_detection:
    description: Secret changes must be detected between runs
    check: contract_tests::FALSIFY-FSEC-003
    severity: ERROR
falsification_tests:
- id: FALSIFY-FSEC-001
  rule: Provider completeness
  prediction: Env provider returns NotFound for absent variable
  test: resolve SecretRef(Env, "NONEXISTENT_VAR"), verify SecretError::NotFound
  if_fails: Env provider panics or returns empty string instead of error
- id: FALSIFY-FSEC-002
  rule: Ephemeral safety
  prediction: Ephemeral secret not present in panic backtrace
  test: create ephemeral secret, trigger panic in handler, inspect backtrace
  if_fails: Secret value captured in Display/Debug impl or error chain
- id: FALSIFY-FSEC-003
  rule: Drift detection
  prediction: Changed secret file detected as Drifted on next run
  test: resolve secret, modify file, re-resolve, verify DriftStatus::Drifted
  if_fails: Drift hash not updated or comparison uses wrong hash
- id: FALSIFY-FSEC-004
  rule: Decrypt failure
  prediction: Sops provider with wrong key returns DecryptFailed, not garbage
  test: create encrypted secret, resolve with wrong key, verify DecryptFailed
  if_fails: Sops returns partial/garbage decryption instead of clean error
kani_harnesses:
- id: KANI-FSEC-001
  obligation: All providers handled
  property: Provider dispatch completeness
  bound: 8
  strategy: exhaustive
  harness: verify_provider_dispatch
- id: KANI-FSEC-002
  obligation: Ephemeral cleanup
  property: Ephemeral memory zeroing
  bound: 8
  strategy: exhaustive
  harness: verify_ephemeral_cleanup
- id: KANI-FSEC-003
  obligation: Drift detection
  property: Drift detection correctness
  bound: 8
  strategy: exhaustive
  harness: verify_drift_detection
qa_gate:
  id: F-SEC-001
  name: Secret Provider Contract
  description: Secret provider management quality gate
  checks:
  - provider_dispatch
  - ephemeral_cleanup
  - drift_detection
  pass_criteria: All 4 falsification tests pass
  falsification: Return empty string instead of SecretError::NotFound for missing env var
