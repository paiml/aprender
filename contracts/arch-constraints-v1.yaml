metadata:
  version: 1.0.0
  created: '2026-02-23'
  author: PAIML Engineering
  description: Per-architecture inference constraints — source of truth
  registry: true
  references:
  - 'GH-323: ArchConstraints codegen'
  - 'realizar/src/gguf/config.rs: Consumer'
  - 'aprender/contracts/model-families/*.yaml: Source data'
equations:
  arch_constraint_lookup:
    formula: constraints(arch) = { norm_type, activation, pos_enc, mlp_type, weight_layout,
      has_bias, tied_emb, has_qk_norm, eps }
    domain: arch ∈ { llama, mistral, phi3, qwen2, qwen3, qwen3moe, deepseek2, gemma, gemma2,
      gpt2, bloom, stablelm, falcon, falcon_7b, falcon_40b, yi, internlm2, command-r,
      mamba, smollm, olmo, granite, starcoder, t5, whisper }
    codomain: ArchConstraints struct
    invariants:
    - Every GGUF general.architecture value maps to exactly one constraint set
    - Enum fields are exhaustive over the defined enum variants
    - DeepSeek eps = 1e-6 (not default 1e-5)
    preconditions:
    - 'input.len() > 0'
    lean_theorem: Theorems.Arch_Constraint_Lookup
enums:
  NormType:
    LayerNorm: Standard Layer Normalization with optional bias
    RmsNorm: Root Mean Square Normalization without bias
  Activation:
    Gelu: Gaussian Error Linear Unit
    Silu: Sigmoid Linear Unit
  PositionalEncoding:
    Absolute: Learned absolute position embeddings
    Rope: Rotary Position Embedding
    Alibi: Attention with Linear Biases
    None: No positional encoding (SSM/recurrence)
  MlpType:
    GeluMlp: 'Standard GELU MLP: up → GELU → down'
    SwiGlu: 'SwiGLU: gate ⊙ SiLU(up) → down'
    GatedMlp: 'Gated MLP: gate ⊙ GELU(up) → down'
  WeightLayout:
    Linear: Standard [out_features, in_features] — no transpose
    Conv1D: Conv1D [in_features, out_features] — requires transpose
