falsification_tests:
- id: FALSIFY-ARCH-CONSTRAINTS-001
  rule: Model-family consistency
  prediction: Every model-family YAML's constraints section matches this contract
  test: Cross-reference aprender/contracts/model-families/*.yaml constraints
  if_fails: Contract drifted from model-family source YAMLs
- id: FALSIFY-ARCH-CONSTRAINTS-002
  rule: Enum exhaustiveness
  prediction: No architecture has unknown enum values
  test: build.rs parse validation — invalid enum value causes build error
  if_fails: New architecture added without updating contract enums
- id: FALSIFY-ARCH-CONSTRAINTS-003
  rule: DeepSeek epsilon regression
  prediction: DeepSeek eps is 1e-6, not 1e-5 (bug fix from hand-maintained code)
  test: Regression test in realizar config tests
  if_fails: DeepSeek eps reverted to incorrect default 1e-5
qa_gate:
  id: F-ACV-001
  name: arch-constraints-v1 Contract
  description: Quality gate for Per-architecture inference constraints — source of
    truth
  checks:
  - validation
  - falsification
proof_obligations:
- type: invariant
  property: Every GGUF general.architecture value maps to exactly one constraint set
  formal: Every GGUF general.architecture value maps to exactly one constraint set
  applies_to: all
- type: invariant
  property: Enum fields are exhaustive over the defined enum variants
  formal: Enum fields are exhaustive over the defined enum variants
  applies_to: all
kani_harnesses:
- id: KANI-ARCH_C-001
  obligation: Every GGUF general.architecture value maps to exactly one constraint
    set
  property: Every GGUF general.architecture value maps to exactly one constraint set
  bound: 8
  strategy: exhaustive
- id: KANI-ARCH_C-002
  obligation: Enum fields are exhaustive over the defined enum variants
  property: Enum fields are exhaustive over the defined enum variants
