- type: invariant
  property: "Complete shards emit zero network bytes when --resume finds them intact"
- type: invariant
  property: "ETag mismatch discards the partial and restarts from byte 0 with a stderr warning"
- type: invariant
  property: "Advisory file lock at <target>.lock prevents concurrent writers (second invocation exits non-zero)"

