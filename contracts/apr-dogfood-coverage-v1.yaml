    - "per_cluster_floor"
    - "cluster_reporting_pairing"
    - "cluster_id_is_not_a_key"
    - "cluster_membership_is_declared"
    - "doubly_dark_rows"
    - "every_declared_binary_probed"
  pass_criteria: "F-DOGCOV-{001..016} all PASS; any one FAIL is NO-GO"

verification_summary:
  total_obligations: 16
  proven: 0
  tested: 16
  status: proposed
  notes: >
    All sixteen obligations are TESTED against the committed ledger, re-measured
    2026-08-22 at cbb1ccd78, and each carries a named mutation that must turn it RED.

    v1.1.0 adds the PER-CLUSTER floor (F-DOGCOV-013), the T2 reporting-pairing rule
    (F-DOGCOV-014) and the T1 `cluster_id` key ban (F-DOGCOV-015), and moves the
    ledger from 8 columns to 10.

    v1.2.0 closes three holes in that work, each found by adversarial review and
    each proved by an A/B against the v1.1.0 code rather than by argument.
    F-DOGCOV-016 adds the MEMBERSHIP ratchet: the release arm was satisfiable by
    relabelling alone, and the v1.1.0 module reports `clusters gated 3/3 (100.0%)`  [t2-pairing allow (quoting the pre-fix verdict)]
    and exits 0 on a ledger where a gated feature was simply moved into the
    zero-gate cluster. F-DOGCOV-015 becomes an ALLOWLIST: the four-syntax
    blacklist returns OK on all twelve ordinary keying constructs it was A/B'd
    against. F-DOGCOV-014 is carried to every channel a cluster ratio can be
    emitted through -- it had been applied to one generated string, so a RECEIPT
    could state the proxy alone and the gate would look stricter while measuring
    less -- and it is keyed on the NUMBER rather than on a phrase.

    ONE LEDGER, NOT TWO. The clustered file REPLACED docs/audits/surface_audit.csv
    rather than sitting beside it as surface_audit_clustered.csv. Two ledgers over
    one surface is the drift hazard this repo keeps re-finding: the second copy
    goes stale silently, and every consumer then has to be told which one is
    authoritative. The clustered file is a strict superset in shape -- the same 830
    rows in the same order, plus two columns -- so there was nothing to lose by
    replacing, and a permanent divergence risk in keeping both. Three cells DID
    disagree (`apr run --backend {cpu,cuda,wgpu}` cited commands_enum.rs:110 in the
    clustered snapshot and :154 in the landed ledger); :154 is the `backend:` arg
    and :110 is a chat-template arg, so the LANDED value is correct and won. That
    disagreement is itself the argument against two ledgers.

    THE COMPARAND IS UNCHANGED. The per-cluster floor derives every number from
    `git show origin/main:docs/audits/surface_audit.csv`, the same ref the other
    floors use. No cluster count, no gate count and no zero-cluster count is
    written as a literal in any gate file. The `baselines:` block below is
    DOCUMENTATION re-derivable by `python3 scripts/dogfood_baseline.py --check`;
    editing it changes nothing the gate enforces.

    SCHEMA-UPGRADE WINDOW, declared rather than hidden: while origin/main still
    carries the 8-column ledger, the per-cluster RATCHET has no floor to derive and
    prints a SCHEMA UPGRADE banner instead of silently passing. The release arm
    still applies in that window. The branch is self-closing -- it is unreachable
    once the 10-column ledger is on main -- and a HALF-migrated comparand (one
    cluster column, or blank labels) is a hard failure, not an upgrade.

    scripts/dogfood_cluster.py produces the K-SELECTION EVIDENCE ONLY (the sweep
    and docs/audits/surface_audit_elbow.png). It does NOT write `cluster_id` or
    cluster_label and re-running it will not regenerate them. That is deliberate:
    the labels are human-owned after the first assignment, so the columns are not
    reproducible from the script and the contract does not pretend otherwise.

    F-DOGCOV-010/011/012 are the BLOCKING gate, wired into `ci / gate` as
    scripts/check_dogfood_coverage.sh. Its floors are not written down anywhere in
    this repository: they are derived at run time from
    `git show origin/main:docs/audits/surface_audit.csv`. That is deliberate. The
    multi-platform dogfood gate kept its floor and its universe as literals in one
    file, so a single commit editing both defeated it while it reported green.
    Reading the comparand from a ref a pull request cannot rewrite is the fix.

    proven: 0 is deliberate and stays deliberate. The three KH-DOGCOV harnesses
    declare intent; no Rust harness stands behind them. This contract is TESTED,
    never PROVED, and the summary should keep saying so until one is written.

    F-DOGCOV-002 EXECUTES AS OF 2026-08-22. It was SKIP-only in the first draft because
    scripts/dogfood_surfaces.sh had no --emit-features mode; that mode now exists, is
    deterministic (two runs byte-identical), declares its scope on stderr plus a
    FEATURESET line, and is consumed by scripts/dogfood_reconcile.py. Both were
    discrimination-tested against the COMMITTED files rather than a scratch copy:
    GREEN on the clean tree, GREEN on a byte-identical no-op, RED in each direction
    under its own mutation.

    proven: 0 is deliberate and is NOT a formality. The three KH-DOGCOV harnesses
    declare intent; no Rust harness exists behind them, so this contract is TESTED,
    never PROVED. Reading `status: proposed` as shape rather than proof is correct.

    Known gap, recorded rather than papered over: 247 of 830 ledger rows (flags, HTTP
    routes, MCP tools, REPL verbs, annotated forms) sit outside what --help can
    enumerate, so F-DOGCOV-002 reconciles 583 rows and COUNTS the remaining 247. The
    HTTP third is reachable today by setting DOGFOOD_LIVE_SERVER; measured against a
    live server on 2026-08-22 the ledger's route set was complete in the
    binary-to-ledger direction (0 missing), while the SOURCE-TABLE fallback the script
    uses without a live server missed 5 routes including /v1/chat/completions and
    claimed 2 that are only conditionally mounted.
