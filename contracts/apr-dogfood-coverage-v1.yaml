metadata:
  version: 1.2.0
  created: '2026-08-22'
  author: PAIML Engineering
  references:
  - 'docs/audits/surface_audit.csv — 142 of 830 features gated, across 28 binaries and 14 clusters, measured 2026-08-22 @ 4bbfeb07f'
  - 'docs/audits/surface_audit_elbow.png — k-selection evidence: inertia knee and silhouette over k in [2,45]'
  - 'scripts/dogfood_cluster.py — the k-sweep that produced the elbow plot (k-selection ONLY; it does not write the columns)'
  - 'scripts/check_no_cluster_id_keys.sh — T1 enforcement: nothing may key on `cluster_id`'
  - 'docs/audits/dogfood-0.63.0-ledger.md — 201 findings, 37 clusters, 171 open, 16 open P0'
  - '.claude/skills/apr-dogfood/SKILL.md — Phase 2, the coverage gate this contract enforces'
  - 'scripts/dogfood_surfaces.sh — the runtime enumeration that supplies the denominator'
  description: >
    The gate-coverage contract for the apr-dogfood protocol. A gate suite with no
    denominator reports a clean sweep over whatever subset it happens to cover; this
    contract supplies the denominator and ratchets it. Measured baseline: 142 of 830
    shipped features carry a gate (17.1%), all 142 in the `apr` binary, 27 of 28
    binaries at zero. Coverage is ALLOWED to be 17.1%. It is not allowed to become
    17.0%.

  # ---------------------------------------------------------------------------
  # G2.3 BASELINES -- measured 2026-08-22 at cbb1ccd78, never rounded.
  #
  # Every value below cites the command that produced it, because a baseline
  # nobody can re-derive is a number someone will eventually "correct" to a
  # rounder one. These are RATCHET FLOORS, not targets: coverage is allowed to be
  # 17.1%, it is not allowed to become 17.0%.
  #
  # Reproduce the whole block with:
  #     python3 scripts/dogfood_baseline.py
  # which reads docs/audits/surface_audit.csv and prints exactly this YAML.
  # ---------------------------------------------------------------------------
  baselines:
    measured_at: '2026-08-22'
    measured_commit: cbb1ccd78
    ledger: docs/audits/surface_audit.csv

    overall:
      command: "python3 scripts/dogfood_baseline.py  # section: totals"
      rows: 830
      covered: 142
      ratio: 0.1711            # 142/830 -- 17.1%, NOT "about 17%"
      binaries: 28
      binaries_at_zero_coverage: 27
      clusters: 14
      clusters_at_zero_coverage: 9
      note: >
        All 142 covered features are in `apr`. 27 of 28 binaries have no gate at
        all, including aprender-orchestrate (184 features), aprender-test-cli (39)
        and pv (38).

    per_binary:
      command: "python3 scripts/dogfood_baseline.py  # section: per_binary"
      note: >
        covered may never DECREASE for any binary; total may never decrease
        without a reconciliation finding recording which direction moved.
      apr: {total: 367, covered: 142}
      aprender-orchestrate: {total: 184, covered: 0}
      aprender-test-cli: {total: 39, covered: 0}
      pv: {total: 38, covered: 0}
      alimentar: {total: 35, covered: 0}
      aprender-cgp: {total: 25, covered: 0}
      aprender-profile: {total: 16, covered: 0}
      apr-qa: {total: 15, covered: 0}
      aprender-train-shell: {total: 13, covered: 0}
      trueno-rag: {total: 13, covered: 0}
      simular: {total: 12, covered: 0}
      verificar: {total: 11, covered: 0}
      aprender-explain: {total: 7, covered: 0}
      presentar: {total: 7, covered: 0}
      aprender-train-bench: {total: 6, covered: 0}
      aprender-train-inspect: {total: 6, covered: 0}
      aprender-cbtop: {total: 4, covered: 0}
      aprender-db: {total: 4, covered: 0}
      aprender-train-distill: {total: 4, covered: 0}
      aprender-train-lora: {total: 4, covered: 0}
      ptop: {total: 4, covered: 0}
      trueno-zram: {total: 4, covered: 0}
      aprender-compute-xtask: {total: 3, covered: 0}
      aprender-ptx-debug: {total: 3, covered: 0}
      apr-corpus-ingest: {total: 2, covered: 0}
      score: {total: 2, covered: 0}
      apr-qa-readme-sync: {total: 1, covered: 0}
      aprender-zram-generator: {total: 1, covered: 0}

    per_cluster:
      command: "python3 scripts/dogfood_baseline.py  # section: per_cluster"
      clusters: 14
      clusters_at_zero_coverage: 9
      key: cluster_label
      note: >
        THE ALLOCATION NOBODY CHOSE. 93.0% of all gate effort sits over 26.4% of
        the surface: three clusters (apr-lint-diag, http-apr-serve,
        apr-core-commands) hold 132 of 142 gates over 219 of 830 features, and the
        remaining eleven clusters share 10 gates over 611 features. It accreted;
        it was never allocated. Adding a 56th gate to apr-lint-diag (83.3% covered)
        buys less than the FIRST gate in contracts-pv (0 of 76).

        The cluster, not the binary, is the unit. `aprender-orchestrate` is three
        unrelated subsystems -- 95 Banco HTTP routes, a 56-feature agent stack, 17
        Pacha secrets commands -- so a per-BINARY floor of ">= 1 gate" lets one
        gate on Pacha make all 184 features look touched.

        REPORTED WITH THE FEATURE FRACTION, ALWAYS (T2). "5 of 14 clusters gated" is 35.7% of a PROXY; the features underneath are 142 of 830 = 17.1%.
        One gate in a 95-member cluster is 1%, not "covered". A receipt that
        prints the cluster figure alone rebuilds the vacuity failure one level
        up, looking stricter than what it replaced while measuring less. The
        pairing is enforced in
        scripts/lib/dogfood_coverage_gate.py::enforce_pairing -- keyed on the
        NUMBER (a denominator equal to the cluster count) rather than on a
        phrase, and applied to every surface that can emit one: the gate report,
        the receipt, scripts/dogfood_baseline.py and the skill.

        KEYED ON `cluster_label`, NEVER `cluster_id` (T1). k-means labels permute when
        the input moves; an obligation keyed on an id silently re-points at a
        different set of features. Enforced by scripts/check_no_cluster_id_keys.sh.

        A PRIOR, NEVER EVIDENCE (T3). Cluster membership says where to look. It
        cannot assert that a feature works, and quality_1_10 is never derived from
        it -- severity comes from the 0.63.0 ledger.
      apr-core-commands: {total: 109, covered: 38}          # 34.9% of cluster, 26.8% of gate effort
      entrypoint-and-mcp: {total: 99, covered: 9}           #  9.1% of cluster,  6.3% of gate effort
      http-orchestrate-banco: {total: 95, covered: 0}       #  ZERO -- one HTTP harness, the cheapest large win
      contracts-pv: {total: 76, covered: 0}                 #  ZERO -- one contract-CLI harness, 76 pv subcommands
      data-pipeline: {total: 76, covered: 0}                #  ZERO
      apr-lint-diag: {total: 66, covered: 55}               # 83.3% of cluster, 38.7% of gate effort
      orchestrate-agent-stack: {total: 56, covered: 0}      #  ZERO
      test-harness: {total: 49, covered: 0}                 #  ZERO
      http-apr-serve: {total: 44, covered: 39}              # 88.6% of cluster, 27.5% of gate effort
      profiling: {total: 44, covered: 1}                    #  2.3% of cluster,  0.7% of gate effort
      rag-eval: {total: 44, covered: 0}                     #  ZERO
      qa-cgp: {total: 37, covered: 0}                       #  ZERO
      simulation: {total: 18, covered: 0}                   #  ZERO
      orchestrate-pacha-secrets: {total: 17, covered: 0}    #  ZERO

    per_band:
      command: "python3 scripts/dogfood_baseline.py  # section: per_band"
      note: >
        THE ARGUMENT FOR MAKING COVERAGE THE ORGANIZING GATE. Where gates look,
        they find defects: the 1-2 band is 72.5% covered. Where they do not look,
        the surface scores 6 by DEFAULT -- 672 rows scored exactly 6, and 644 of
        those carry no gate. A 6 does not mean "fine", it means UNLOOKED-AT, and
        the 4.3% coverage of that band is why.
      q1_2: {total: 80, covered: 58}     # 72.5%
      q3_4: {total: 49, covered: 27}     # 55.1%
      q5_6: {total: 673, covered: 29}    # 4.3%
      q7_8: {total: 8, covered: 8}       # 100.0%
      q9_10: {total: 20, covered: 20}    # 100.0%

    hardware_provenance:
      command: "python3 scripts/dogfood_baseline.py  # section: totals"
      unknown: 427
      direction: "may only DECREASE -- 427 is a ceiling"
      note: >
        Hardware is never inferred from a feature's name. A CUDA kernel with no
        job that runs it is UNKNOWN.

    confidence:
      command: "python3 scripts/dogfood_baseline.py  # section: totals"
      low_and_uncovered: 204
      direction: "may only DECREASE -- 204 is a ceiling"
      note: >
        A row that is BOTH low-confidence and ungated is doubly dark: nothing
        checks it, and the ledger itself is unsure what it claims.

    broken_and_ungated:
      command: "python3 scripts/dogfood_baseline.py  # section: totals"
      count: 44
      direction: "may only DECREASE -- target 0"
      note: >
        All 44 are in `apr`. Each needs an open issue or a written waiver before
        the next release; the enumerated list is in the Phase 2 report and in
        .claude/skills/apr-dogfood/SKILL.md.

equations:
  gate_coverage_ratio:
    formula: |
      covered = |{ r in surface_audit.csv : r.in_dogfood_skill == "yes" }|
      total   = |surface_audit.csv|
      coverage = covered / total
      REQUIRE: covered >= 142 AND total >= 830
    domain: "rows of docs/audits/surface_audit.csv, reconciled against the runtime enumeration"
    codomain: "f64 in [0.0, 1.0]"
    invariants:
    - "Baseline 142/830 = 0.171 measured 2026-08-22 at 4bbfeb07f"
    - "The covered count may never decrease (ratchet)"
    - "The total may never decrease without a corresponding ledger update (a shrinking denominator inflates coverage)"

  denominator_reconciliation:
    formula: |
      runtime = enumerate(binaries, subcommands, routes, mcp_tools)   # from the BUILT binary
      ledger  = rows(surface_audit.csv)
      REQUIRE: runtime \ ledger == {} AND ledger \ runtime == {}
    domain: "the shipped surface at HEAD vs the committed ledger"
    codomain: bool
    invariants:
    - "A feature in the binary but not the ledger is RED — the ledger is stale"
    - "A feature in the ledger but not the binary is RED — the surface shrank unnoticed"
    - "Neither direction may be silently reconciled; that turns the ledger back into a list"

  broken_and_ungated:
    formula: |
      REQUIRE: |{ r : r.quality_1_10 <= 4 AND r.in_dogfood_skill != "yes" }| == 0
    domain: "features carrying a live ledger defect"
    codomain: "non-negative integer"
    invariants:
    - "Baseline is 44, all 44 in the `apr` binary — every one a defect that shipped and would ship again unnoticed"
    - "Target is 0; at --release each remaining entry needs an open issue AND a written waiver"

  hardware_provenance:
    formula: |
      REQUIRE: |{ r : r.verified_hardware == "UNKNOWN" }| <= 427
      forall r : r.verified_hardware != "UNKNOWN" =>
        exists a CI job that RAN r on that target, or a cargo feature gate that compiles it
    domain: "the verified_hardware column"
    codomain: bool
    invariants:
    - "Baseline 427 UNKNOWN of 830; may never increase"
    - "Hardware is NEVER inferred from a feature's name — a CUDA kernel with no job that runs it is UNKNOWN"

  per_cluster_floor:
    formula: |
      clusters(L) = { r.cluster_label : r in L }          # the LABEL, never the id
      gates(c, L) = |{ r in L : r.cluster_label == c AND r.in_dogfood_skill == "yes" }|

      RATCHET  (always):
        forall c in clusters(BASE) : gates(c, HEAD) >= gates(c, BASE)
        |{ c : gates(c, HEAD) == 0 }| <= |{ c : gates(c, BASE) == 0 }|
        clusters(BASE) subset-of clusters(HEAD)

      RELEASE ARM (DOGFOOD_RELEASE=1):
        forall c in clusters(HEAD) : gates(c, HEAD) >= 1

      BASE is `git show origin/main:docs/audits/surface_audit.csv`. There is no
      floor NUMBER in this repository. To lower one, land it on main first.
    domain: "the cluster_label column of the reconciled ledger"
    codomain: bool
    invariants:
    - "Baseline 2026-08-22: 14 clusters, 5 gated, 9 at zero, under 142 of 830 features gated -- the release arm is RED on arrival, which is the finding"
    - "A cluster leaves zero only on an EARNED gate: one written for a feature already in the cluster on the comparand, or for genuinely new surface. A gate that arrived by moving an already-gated feature in is evidence about the cluster it came FROM"
    - "A feature may not change cluster_label between the comparand and the working ledger without an entry in docs/audits/cluster_reassignments.yaml stating from, to and a reason"
    - "A gate on one cluster member is evidence about the cluster; a cluster at zero has NO evidence at all"
    - "n gates per cluster scales SUB-LINEARLY in cluster size -- the target was never 830 gates"
    - "The unit is the cluster, not the binary: aprender-orchestrate's 184 features are three unrelated subsystems"
    - "A cluster_label present on the comparand may not vanish -- renaming a label retires every obligation citing it"

  cluster_reporting_pairing:
    formula: |
      forall lines emitted by the per-cluster report:
        states_cluster_fraction(line) => states_feature_fraction(line)
      AND at least one line states a cluster fraction (a rule applied to an empty
      report proves nothing)
    domain: "the text of the G2.5 report, read back by the gate before printing"
    codomain: bool
    invariants:
    - "T2. Cluster coverage is a PROXY: one gate in a 95-member cluster is 1%, not covered"
    - "5/14 clusters (35.7%) and 142/830 features (17.1%) are reported together, always"
    - "Enforced mechanically by enforce_pairing(); deleting the feature fraction from the emitter turns the gate RED"
    - "This is the single most important trap: reporting the proxy alone is how a coverage gate becomes theatre while looking stricter"

  cluster_membership_is_declared:
    formula: |
      forall k in keys(BASE) INTERSECT keys(HEAD):
        label(k, HEAD) == label(k, BASE)
        OR declared(k, from=label(k,BASE), to=label(k,HEAD), reason != "")
      AND forall c: earned_gates(c, HEAD) counts only gates on features that were
        already in c on BASE, or are absent from BASE entirely
    domain: "(binary, feature) rows common to the comparand and the working ledger"
    codomain: bool
    preconditions:
    - "BASE and HEAD both parse as 10-column ledgers with >= 100 rows"
    - "every row carries a non-empty cluster_label (enforced by ledger_schema)"
    postconditions:
    - "every observed move appears in the reassignment log with a matching from, to and a non-empty reason"
    - "earned_gates(c) <= gates(c) for every cluster, with equality exactly when no gated feature moved into c"
    invariants:
    - "The release arm was satisfiable by RELABELLING ALONE: move an already-gated feature into a zero-gate cluster and that cluster stops being at zero with no evidence written. Nine zeros become nine tickets only if a zero cannot be made to stop EXISTING"
    - "Clusters are DERIVED, so a re-cluster legitimately moves members. The answer is a DECLARATION, not a prohibition: a re-cluster must stay possible, a SILENT one must not"
    - "A declaration is checked in BOTH directions -- an entry whose `to` disagrees with the working ledger is a pre-authorisation, which is how a declaration becomes a blanket permit"
    - "A declaration buys legibility, never evidence: the zero-gate set and the release arm count EARNED gates only, so writing a gate is the only way off zero"
    - "The log is docs/audits/cluster_reassignments.yaml and it is a LOG, not a queue: an entry stays valid once its move has landed, because its `to` still agrees with the ledger"

  cluster_id_is_not_a_key:
    formula: |
      forall declarations d in contracts/ U scripts/ U .claude/ U docs/audits/ U .github/:
        NOT keys_on(d, `cluster_id`)     unless d carries the pragma
                                         `cluster-id-guard allow (<reason>)`
    domain: "tracked declaration surfaces where a floor, gate or obligation is written"
    codomain: bool
    invariants:
    - "T1. k-means labels PERMUTE on re-run: cluster 3 becomes cluster 9 when the input moves"
    - "An obligation keyed on the id silently re-points at a different set of features -- the stale-hardcoded-list class in new clothes"
    - "cluster_label is the durable key and is HUMAN-OWNED after the first assignment, never regenerated"
    - "scripts/dogfood_cluster.py deliberately does NOT write the columns; it produces the k-selection evidence only"

  ledger_schema:
    formula: |
      forall r in surface_audit.csv:
        |columns(r)| == 10 AND r.evidence_path != ""
        AND r.cluster_label != "" AND r.cluster_id != ""   # cluster-id-guard allow (presence check in the formal predicate, not a key)
    domain: "RFC 4180 rows, 10 columns"
    codomain: bool
    invariants:
    - "Columns are exactly: binary, feature, quality_1_10, verified_hardware, top_competitor, in_dogfood_skill, cluster_id, cluster_label, evidence_path, confidence"
    - "A row with no evidence_path is invalid — an unevidenced claim is not a ledger entry"
    - "A row with an empty cluster_label belongs to no cluster and is therefore outside every per-cluster floor; the gate refuses to read such a ledger"
    - "`cluster_id` -> `cluster_label` must be a BIJECTION; a label served by two ids means a re-run permuted the ids and the ledger took the permutation halfway"
    - "There is ONE ledger. The clustered file REPLACED the 8-column one rather than sitting beside it: two ledgers over one surface is the drift hazard this repo keeps re-finding"

falsification_tests:
- id: F-DOGCOV-001
  rule: gate coverage ratchet
  prediction: "covered rows >= 142 and total rows >= 830"
  test: |
    python3 - <<'EOF'
    import csv
    rows = list(csv.DictReader(open('docs/audits/surface_audit.csv')))
    cov = sum(1 for r in rows if r['in_dogfood_skill'].strip().lower() == 'yes')
    assert len(rows) >= 830, f"denominator shrank to {len(rows)}"
    assert cov >= 142, f"coverage regressed to {cov}/{len(rows)}"
    EOF
  if_fails: "gate coverage regressed below the committed baseline — NO-GO regardless of every other gate being green"
  mutation: "flip one in_dogfood_skill from yes to no; the assert must turn RED"

- id: F-DOGCOV-002
  rule: denominator reconciliation
  prediction: >
    Within the emitter's DECLARED scope (the CLI subcommand tree to depth 4, from
    --help on the built binary), the runtime enumeration and the ledger describe the
    same surface in BOTH directions. Measured 2026-08-22 at cbb1ccd78: dirA=0, dirB=0.
  test: |
    # Runs for real as of 2026-08-22 -- scripts/dogfood_surfaces.sh grew the
    # --emit-features mode this contract needed. It is deterministic (two runs are
    # byte-identical) and it declares its scope on stderr and in a FEATURESET line.
    bash scripts/dogfood_surfaces.sh --emit-features > /tmp/dogcov-runtime.txt 2>/tmp/dogcov-scope.txt
    rc=$?; [ "$rc" -eq 0 ] || { echo "emit-features failed rc=$rc"; exit 1; }
    python3 scripts/dogfood_reconcile.py /tmp/dogcov-runtime.txt
  if_fails: >
    The ledger no longer describes the shipped surface, so the coverage ratio is
    measuring declared state rather than resolved state. NEITHER direction may be
    silently reconciled -- "in the binary, not in the ledger" means the ledger went
    stale; "in the ledger, not in the binary" means the surface shrank unnoticed.
    Both are findings; fixing the CSV to match without recording which direction
    moved turns the ledger back into a list.
  mutation: >
    Four-way discrimination, all four run 2026-08-22 and all four behaved:
    clean tree GREEN; a no-op copy of the CSV GREEN (a gate that fires on a no-op
    measures nothing); dropping the live row `apr canary check` turns dirA RED;
    adding a row for `apr zzz-deleted-command` turns dirB RED.
  scope_and_allowance: >
    The emitter cannot enumerate flags (70 rows), HTTP routes (146, live-server
    only), MCP tools (15), REPL verbs, or annotated/positional forms (5) -- 247 of
    830 rows sit outside its scope and are counted, never silently dropped.
    A further 28 in-scope rows are a DECLARED allowance: 26 are hidden by a default
    cargo build behind `dev`, `hf-hub`, `doctest` and `eval`, PROVEN by rebuilding
    with the feature and watching the subcommands appear (not inferred from the cfg
    attribute); 2 are the literal `help` subcommand the emitter filters. The
    allowance is ENUMERATED rather than tolerated as a count, so a 29th mismatch
    still turns the gate RED.

- id: F-DOGCOV-003
  rule: no broken-and-ungated feature
  prediction: "every feature with quality <= 4 carries a gate, or an issue plus a waiver"
  test: |
    python3 - <<'EOF'
    import csv
    rows = list(csv.DictReader(open('docs/audits/surface_audit.csv')))
    bad = [r for r in rows
           if int(r['quality_1_10']) <= 4 and r['in_dogfood_skill'].strip().lower() != 'yes']
    print(f"{len(bad)} broken-and-ungated (baseline 44)")
    assert len(bad) <= 44, f"grew to {len(bad)}"
    EOF
  if_fails: "a known-broken feature has no gate — it shipped once and will ship again unnoticed"
  mutation: "set one covered row's quality to 2 and its in_dogfood_skill to no; the count must exceed 44"

- id: F-DOGCOV-004
  rule: hardware provenance never inferred
  prediction: "UNKNOWN count <= 427 and every non-UNKNOWN claim names a job or a feature gate"
  test: |
    python3 - <<'EOF'
    import csv
    rows = list(csv.DictReader(open('docs/audits/surface_audit.csv')))
    unk = sum(1 for r in rows if r['verified_hardware'].strip().upper() == 'UNKNOWN')
    assert unk <= 427, f"UNKNOWN grew to {unk}"
    EOF
  if_fails: "hardware verification regressed, or a claim was inferred from a feature name rather than a job that ran"
  mutation: "claim nvidia-cuda for a feature no CI job runs; the provenance check must turn RED"

- id: F-DOGCOV-005
  rule: ledger schema, evidence, and the id/label bijection
  prediction: "830+ rows, exactly 10 columns, zero blank evidence_path, zero blank cluster_label, id<->label a bijection"
  test: |
    python3 - <<'EOF'
    import collections, csv
    exp = ['binary','feature','quality_1_10','verified_hardware',
           'top_competitor','in_dogfood_skill','cluster_id','cluster_label',
           'evidence_path','confidence']
    rdr = csv.DictReader(open('docs/audits/surface_audit.csv'))
    assert rdr.fieldnames == exp, rdr.fieldnames
    rows = list(rdr)
    assert all(len(r) == 10 for r in rows), "ragged row"
    assert not [r for r in rows if not r['evidence_path'].strip()], "row with no evidence"
    assert not [r for r in rows if not r['cluster_label'].strip()], "row with no cluster"
    fwd, rev = collections.defaultdict(set), collections.defaultdict(set)
    for r in rows:
        fwd[r['cluster_label']].add(r['cluster_id'])  # cluster-id-guard allow (bijection check, not a key)
        rev[r['cluster_id']].add(r['cluster_label'])  # cluster-id-guard allow (bijection check, not a key)
    assert all(len(v) == 1 for v in fwd.values()), "a label carries two ids"
    assert all(len(v) == 1 for v in rev.values()), "an id carries two labels"
    EOF
  if_fails: >
    The ledger is malformed, carries an unevidenced claim, or has a row outside
    every cluster. A broken bijection means a re-cluster permuted the ids and the
    ledger took the permutation halfway -- exactly the drift T1 exists to stop.
  mutation: "blank one evidence_path, blank one cluster_label, or give one label two ids; each must turn the assert RED"

- id: F-DOGCOV-013
  rule: per-cluster floor (G2.5)
  prediction: >
    No cluster_label loses a gate, no cluster_label present on origin/main
    vanishes, no feature changes cluster_label undeclared, and the count of
    clusters with zero EARNED gates does not rise. Measured 2026-08-22: 14 clusters, 5 gated, 9 at zero, under 142 of 830 features gated;
    93.0% of gate effort over 26.4% of the surface. At DOGFOOD_RELEASE=1 every
    cluster must carry >= 1 EARNED gate, which is RED on arrival -- nine clusters
    with no evidence at all is the finding, not the 688 uncovered rows.
  test: |
    bash scripts/check_dogfood_coverage.sh
    # and the registered mutation table, which runs the same script against a
    # scratch repo whose `main` carries the ledger:
    bash scripts/check_dogfood_coverage.sh --self-test
  if_fails: >
    A gate was traded out of a cluster, or a cluster_label was renamed and took
    every obligation citing it with it. The per-BINARY floor cannot see either:
    aprender-orchestrate's 184 features are three unrelated subsystems, so one
    gate on Pacha secrets makes all 184 look touched.
  mutation: >
    M5, run 2026-08-22 and attributed by finding text, not by exit code: ungate
    solo-cluster's ONLY gate AND gate a member of pad-cluster in the same edit, so
    the overall count and every per-binary count are UNCHANGED. RED naming
    "gates in cluster `solo-cluster`"; restoring the ledger -> GREEN; a
    byte-identical no-op rebuild -> GREEN. Engagement proved by an md5 delta on
    the ledger before the verdict is read.

    M8, added 2026-08-22, is the attack the count-only floor could not see. Move
    a GATED feature into the zero-gate cluster and write ONE new gate in the
    cluster it left. Every count then holds: solo-cluster still has one gate,
    pad-cluster's gate count ROSE, the zero-gate cluster count FELL, no label
    vanished, overall and per-binary both rose. Run against the pre-fix module it
    prints `clusters gated 3/3 (100.0%)` and exits 0  [t2-pairing allow (quoting
    the pre-fix verdict verbatim is the evidence)]  -- a zero that stopped
    EXISTING rather than being closed, with nothing proved about pad-cluster's 200
