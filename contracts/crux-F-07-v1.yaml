# CRUX-F-07 — GPU memory timeline Chrome trace
# Promoted to PARTIAL_ALGORITHM_LEVEL at v1.1.0 under CRUX-SHIP-001 (2026-05-16):
# - classifier: crates/apr-cli/src/commands/gpu_memtrace_classifier.rs (13 unit tests)
# - CLI surface: `apr gpu-memtrace-lint --trace-file FILE`
# - e2e: crates/apr-cli/tests/falsification_crux_f_07.rs (11 tests)
# Full discharge of FALSIFY-CRUX-F-07-004 (peak agrees with NVML within
# 10%) requires a live emitter wired into `apr profile --gpu-memory-trace`
# alongside an NVML reading at peak — tracked as BLOCKER-UPSTREAM-MISSING.

metadata:
  id: CRUX-F-07
  version: "1.1.0"
  created: "2026-04-18"
  updated: "2026-05-16"
  author: PAIML Engineering
  registry: true
  status: partial
  kind: kernel
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "F — Tensor Ops & Low-level"
  competitor: pytorch
  demand_score: 4  # 1..5, high priority in pmat work
  intake_status: missing
  description: >
    GPU memory timeline Chrome trace. Competitor
    `torch.cuda.memory._record_memory_history(max_entries=100_000)` +
    `torch.cuda.memory._dump_snapshot("mem.pickle")` (see
    https://pytorch.org/docs/stable/torch_cuda_memory.html and
    https://pytorch.org/blog/understanding-gpu-memory-1/) emits a pickle
    that pytorch.org/memory_viz renders as an interactive allocator
    timeline. Parity: `apr profile --gpu-memory-trace=out.json` MUST emit
    a Chrome Trace Event Format JSON (https://docs.google.com/document/d/1CvAClvFfyA5R-PhYUmn5OOQtYMH4h6I0nSsKchNAySU)
    enumerating per-allocation events with timestamps, sizes, stream
    handles, and allocation stacks, loadable in chrome://tracing or
    https://ui.perfetto.dev.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/tensorflow/tensorboard
  - github.com/wandb/wandb
equations:
  chrome_trace_schema:
    formula: |
      out.json = { "traceEvents": [ E_0, E_1, ..., E_{n-1} ], "displayTimeUnit": "ns" }
      each E_i ∈ {
        { "ph": "B"|"E"|"i"|"X", "pid": gpu_id, "tid": stream_id,
          "ts": microseconds_since_run_start, "name": "alloc"|"free"|"kernel",
          "args": { "bytes": u64, "addr": hex_str, "stack": [frame...] } }
      }
    domain: apr profile --gpu-memory-trace invocation on a real inference run
    codomain: Chrome Trace Event Format v0.4 JSON document
    invariants:
    - "File parses as JSON with top-level traceEvents array (perfetto.dev requirement)"
    - "Every alloc event has a matching free event with the same addr"
    - "Σ alloc.bytes − Σ free.bytes (ending) ≤ peak resident GPU bytes reported by nvidia-smi"

  monotonic_timestamps:
    formula: |
      For all events E_i, E_j with i < j on the same (pid, tid):
        E_i.ts ≤ E_j.ts
      AND first event has ts = 0 (trace is relative to run start)
    domain: traceEvents array ordered by array index
    codomain: bool
    invariants:
    - "Timestamps are monotone per-stream (CUDA stream ordering preserved)"
    - "First event ts == 0 (perfetto.dev relative-time convention)"

  peak_memory_matches_nvml:
    formula: |
      peak_from_trace = max over prefixes of (Σ alloc.bytes − Σ free.bytes)
      peak_from_nvml  = nvmlDeviceGetMemoryInfo().used  at same wall-clock instant
      |peak_from_trace − peak_from_nvml| / peak_from_nvml < 0.10   (within 10%)
    domain: (trace, nvml snapshot) at peak allocation
    codomain: bool
    invariants:
    - "Trace-derived peak agrees with NVML-reported peak within 10%"
    - "Guards against silent accounting drift (e.g. missed free or double-count)"

falsification_tests:
- id: FALSIFY-CRUX-F-07-001
  rule: Chrome Trace JSON schema is valid and loadable
  prediction: "apr profile --gpu-memory-trace emits JSON parsed by perfetto.dev schema"
  test: |
    OUT=/tmp/apr-memtrace.json
    rm -f "$OUT"
    apr profile --gpu-memory-trace "$OUT" --prompt "hi" --max-tokens 8 \
      /mnt/nvme-raid0/models/qwen2.5-coder-1.5b-q4k.apr 2>/dev/null
    [ -s "$OUT" ] || { echo "FAIL: no trace written" >&2; exit 1; }
    jq -e '.traceEvents | type == "array" and length > 0' "$OUT" \
      || { echo "FAIL: traceEvents missing or empty" >&2; exit 1; }
    jq -e '.traceEvents | all(.ph? != null and .ts? != null and .name? != null)' "$OUT" \
      || { echo "FAIL: required Chrome Trace fields missing" >&2; exit 1; }

  if_fails: rule 'Chrome Trace JSON schema is valid and loadable' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/gpu_memtrace_classifier.rs
    cli_path: crates/apr-cli/src/commands/gpu_memtrace_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_f_07.rs
    e2e_tests:
    - falsify_crux_f_07_001_schema_ok_on_good_body
    - falsify_crux_f_07_001_schema_rejects_missing_trace_events
    - falsify_crux_f_07_001_schema_rejects_event_missing_ph
    sub_claim: |
      Algorithm-level necessary conditions: `classify_schema` verifies the
      Chrome Trace JSON root is an object containing a non-empty
      `traceEvents` array; every entry has the required Chrome Trace
      fields (`ph`, `ts`, `name`); `displayTimeUnit` (if present) is one
      of {ns, ms}. Outcome variants name the first violation deterministically
      (MissingTraceEvents, TraceEventsEmpty, EventMissingField, etc.).
    scope: "(body) -> ChromeTraceSchemaOutcome (pure)"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "live `apr profile --gpu-memory-trace` emitter"
- id: FALSIFY-CRUX-F-07-002
  rule: alloc/free events pair by address
  prediction: "every alloc event has a matching free with identical addr"
  test: |
    OUT=/tmp/apr-memtrace.json
    python3 - "$OUT" <<'PY'
    import json, sys
    d = json.load(open(sys.argv[1]))
    allocs = {e['args']['addr'] for e in d['traceEvents'] if e.get('name') == 'alloc'}
    frees  = {e['args']['addr'] for e in d['traceEvents'] if e.get('name') == 'free'}
    orphans = allocs - frees
    assert not orphans, f"FAIL: {len(orphans)} unfreed addrs"
    PY

  if_fails: rule 'alloc/free events pair by address' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/gpu_memtrace_classifier.rs
    cli_path: crates/apr-cli/src/commands/gpu_memtrace_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_f_07.rs
    e2e_tests:
    - falsify_crux_f_07_002_alloc_free_pairing_rejects_orphan_alloc
    - falsify_crux_f_07_002_alloc_free_pairing_rejects_orphan_free
    sub_claim: |
      Algorithm-level necessary conditions: `classify_alloc_free_pairing`
      collects every `args.addr` from `alloc` and `free` events; reports
      `OrphanAllocs { addresses }` (memory leak signature) or
      `OrphanFrees { addresses }` (double-free / accounting bug signature)
      with sorted address lists so the bug is debuggable from lint output
      alone. `AllocMissingAddr { index }` surfaces malformed emitters
      where the args object lacks the addr key.
    scope: "(body) -> AllocFreePairingOutcome (pure)"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "live `apr profile --gpu-memory-trace` emitter writing balanced alloc/free events"
- id: FALSIFY-CRUX-F-07-003
  rule: timestamps monotone per stream
  prediction: "per-(pid,tid) timestamps are non-decreasing"
  test: |
    OUT=/tmp/apr-memtrace.json
    python3 - "$OUT" <<'PY'
    import json, sys
    from collections import defaultdict
    d = json.load(open(sys.argv[1]))
    last = defaultdict(lambda: -1)
    for e in d['traceEvents']:
        k = (e.get('pid'), e.get('tid'))
        assert e['ts'] >= last[k], f"FAIL: non-monotone ts on {k}: {e['ts']} < {last[k]}"
        last[k] = e['ts']
    PY

  if_fails: rule 'timestamps monotone per stream' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/gpu_memtrace_classifier.rs
    cli_path: crates/apr-cli/src/commands/gpu_memtrace_lint.rs
    e2e_path: crates/apr-cli/tests/falsification_crux_f_07.rs
    e2e_tests:
    - falsify_crux_f_07_003_monotonic_timestamps_rejects_violation
    - falsify_crux_f_07_003_monotonic_timestamps_allows_cross_stream_interleave
    sub_claim: |
      Algorithm-level necessary conditions: `classify_monotonic_timestamps`
      walks the trace once tracking the last seen `ts` per `(pid, tid)`
      key; reports `NonMonotonic { index, pid, tid, prev_ts, got_ts }`
      on first violation. Different streams may freely interleave (CUDA
      stream ordering is per-stream); only within a single (pid, tid)
      must timestamps be non-decreasing.
    scope: "(body) -> MonotonicTimestampsOutcome (pure)"
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "live `apr profile --gpu-memory-trace` emitter preserving CUDA stream ordering"
- id: FALSIFY-CRUX-F-07-004
  rule: trace-derived peak agrees with NVML within 10%
  prediction: "|peak_trace − peak_nvml| / peak_nvml < 0.10"
  test: |
    # TODO: capture nvidia-smi --query-gpu=memory.used samples in parallel
    OUT=/tmp/apr-memtrace.json
    NVML_PEAK_MB=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | head -1)
    python3 - "$OUT" "$NVML_PEAK_MB" <<'PY'
    import json, sys
    d = json.load(open(sys.argv[1]))
    nvml = int(sys.argv[2]) * 1024 * 1024
    running, peak = 0, 0
    for e in d['traceEvents']:
        if e.get('name') == 'alloc': running += e['args']['bytes']
        elif e.get('name') == 'free': running -= e['args']['bytes']
        peak = max(peak, running)
    drift = abs(peak - nvml) / max(nvml, 1)
    assert drift < 0.10, f"FAIL: peak drift {drift:.2%} > 10%"
    PY

  if_fails: rule 'trace-derived peak agrees with NVML within 10%' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: invariant
  property: "Output file is valid Chrome Trace Event Format JSON (perfetto.dev loadable)"
- type: invariant
  property: "Every alloc event pairs with exactly one free event of identical addr"
- type: invariant
  property: "Timestamps are monotone non-decreasing per (pid, tid) stream"
- type: equivalence
  property: "Trace-derived peak memory agrees with NVML nvmlDeviceGetMemoryInfo() within 10%"

