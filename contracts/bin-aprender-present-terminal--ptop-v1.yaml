# ──────────────────────────────────────────────
# bin-aprender-present-terminal--ptop-v1 — the `ptop` bin target of package aprender-present-terminal (ONT-10 slice S13 (2/2))
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha, helpSha,
# gitSha, …) live in binary-surface-v1 and are not restated. Moved from docs/ont-10/binary-contracts/ (aprender-bb).
#
# binary-ptop-v1 — ONT-10 slice S13 (2/2): the `ptop` target of package `aprender-present-terminal` as an entity
# (ONT-001 v4.17 ONT-4g; #4476, #4079)
#
# MEASURED (2026-09-26, batch/ont-10 @ b6cf6d2ed, release build, private CARGO_TARGET_DIR). ptop declares
# `required-features = ["ptop"]` and the package's default features are empty, so a default build does not produce
# it at all; it was built with `--features ptop`, the smallest build that has it.
#   `ptop --version` = "ptop 0.69.3". Name right; no git sha, so G0.1 (warning) is RED today.
#   --help: no subcommands (0 commands) and 10 long options, --help/--version excluded: --config, --deterministic,
#   --dump-config, --explode, --height, --no-color, --qa-timing, --refresh, --render-once, --width. The --help
#   description line is the library's ("Terminal backend for Presentar UI framework…"), not ptop's; not shaped.
#   surface_audit.csv holds 4 rows with binary=ptop (ledger at cf038d37f): the bare entry row `ptop (interactive TUI
#   system monitor)`, and `ptop --dump-config`, `ptop --render-once`, `ptop --render-once --explode <PANEL>`. Every
#   option a row names is in --help: GREEN today apart from G0.1.
#
# CONVENTION (S15's option join, plus one rule): a row whose feature after the binary name starts with `-` joins
# bin:option on its first long option; a row that is the bare binary name (optionally with a parenthetical) is the
# default mode and resolves to the focus node itself.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender-present-terminal--ptop-v1
version: "1.0.0"
scope: >
  The built `ptop` target of package `aprender-present-terminal` (features = ["ptop"], its required feature) as the focus node binary/aprender-present-terminal/ptop: its identity, its options, and the surface_audit.csv rows that must resolve to it.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice S13 (2/2) (ptop). Per-binary shapes over the node extract:binary (ONT-4g, #4476) draws
    for binary/aprender-present-terminal/ptop, on the binary-surface-v1 vocabulary.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (the ledger; binary column = ptop)'
    - 'scripts/dogfood_surfaces.sh (the snapshot extract:binary reads)'
    - 'crates/aprender-present-terminal/Cargo.toml ([[bin]] ptop, required-features = ["ptop"])'
    - 'aprender#4502 — ONT-10'

entity:
  type: binary
  ref: binary/aprender-present-terminal/ptop

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: binary-ptop-surface
    targetClass: bin:target/aprender-present-terminal/ptop
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["ptop"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-present-terminal"]}
      - {path: "bin:versionString", minCount: 1, maxCount: 1, pattern: "^ptop [0-9]+\\.[0-9]+\\.[0-9]+"}
      # G0.1 — LIVE RED 2026-09-27 (no sha); a warning until the version string carries it
      - {path: "bin:versionString", minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: "warning"}
      - {path: "bin:command", maxCount: 0}
      - path: bin:option
        minCount: 10
        maxCount: 10
        in:
          - "--config"
          - "--deterministic"
          - "--dump-config"
          - "--explode"
          - "--height"
          - "--no-color"
          - "--qa-timing"
          - "--refresh"
          - "--render-once"
          - "--width"
      - {path: "bin:ledgerOrphan", maxCount: 0}

equations:
  surface_equals_snapshot:
    formula: "commands(binary/aprender-present-terminal/ptop) = ∅; options = O, |O| = 10, O = the long options of --help of the --features ptop build, --help and --version excluded ∧ ledgerOrphan = { r ∈ csv : r.binary = ptop ∧ key(r) ≠ ⊤ ∧ key(r) ∉ O }; key(r) = ⊤ (the node) for the bare entry row, else the first long option of r.feature"
    domain: "the snapshot record dogfood_surfaces.sh writes for this target; docs/audits/surface_audit.csv rows whose binary column is ptop (4 on 2026-09-26)"
    codomain: "set equality, or a Fail naming each member of the symmetric difference; literals on the focus node, one per orphan row"
    invariants:
      - "in + minCount 10 + maxCount 10 is set equality on options: an added, dropped or renamed option is a violation naming it"
      - "a ledgered option the built binary does not accept is a violation, never a silent skip"
    preconditions:
      - "the snapshot was written at this commit, default features"
    postconditions:
      - "help_sha256 in the snapshot is the sha256 of `ptop --help` at this commit"
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-PTOP-INV-001
    property: every ptop surface member has an audited ledger row, and every ledger row names one
    formal: '∀ c ∈ surface(ptop): ∃ r ∈ surface_audit : r.binary = ptop ∧ path(r) = c; ∀ r with r.binary = ptop: path(r) ∈ surface(ptop)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-PTOP-001
    rule: 'G1.2 help answers'
    prediction: '`ptop --help` exits 0 with non-empty stdout'
    test: 'scripts/dogfood_surfaces.sh --cli ptop'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-27: exit 0, GREEN)'
    mutation: 'make the top-level --help return an error; must turn RED'
  - id: FALSIFY-BIN-PTOP-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`ptop --no-such-flag` exits 2'
    test: 'scripts/dogfood_surfaces.sh --cli ptop'
    if_fails: 'a typo is silently ignored (observed 2026-09-27: exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-PTOP-003
    rule: 'G0.1 the version names the commit'
    prediction: '`ptop --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'LIVE RED 2026-09-27: "ptop 0.69.3" — no sha; a stale ptop reads as HEAD'
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-PTOP-004
    rule: 'G1.3/G1.4 the surface set equals the snapshot'
    prediction: 'the surface literals in the shape above = the snapshot''s, set-equal'
    test: 'NOT YET WRITTEN — pv lint contracts/ --gate shapes on the snapshot, after extract:binary (ONT-4g)'
    if_fails: 'an added, dropped or renamed surface member ships with the ontology green (enumerated-value parsing not probed for this binary)'
    mutation: 'remove one surface literal from the snapshot; must turn RED naming it'
  - id: FALSIFY-BIN-PTOP-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 row per surface member with binary = ptop (4 rows on 2026-09-27)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'the dogfood coverage ratio is computed over a ledger that silently omits a shipped surface member'
    mutation: 'delete every ptop row; must turn RED naming ptop'
  - id: FALSIFY-BIN-PTOP-006
    rule: 'ledgered option removed is red'
    prediction: 'deleting --render-once from the snapshot''s option list makes ptop-options RED: |O| = 9 and the two --render-once rows become bin:ledgerOrphan'
    test: 'pv lint contracts/ --gate shapes --format json (after ONT-4g), on the snapshot with --render-once removed'
    if_fails: 'ptop''s headless render mode, the one CI can exercise, could vanish with the ontology green.'
    mutation: 'the edit in the prediction; must turn RED — verdict Fail, results on binary/aprender-present-terminal/ptop paths bin:option and bin:ledgerOrphan'
  - id: FALSIFY-BIN-PTOP-007
    rule: 'default feature build has no node'
    prediction: 'an extractor that builds aprender-present-terminal with default features produces no ptop target, so no focus node exists and the 4 ledger rows resolve to nothing'
    test: 'pv lint contracts/ --gate shapes --format json (after ONT-4g), on a snapshot from a default-feature build'
    if_fails: 'A binary the ledger lists could drop out of the ontology silently because its feature is opt-in.'
    mutation: 'the edit in the prediction; must turn RED — the ONT-4g surface_audit_bins gate names ptop as a ledgered binary with no node'
