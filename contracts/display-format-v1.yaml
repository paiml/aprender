metadata:
  version: 1.0.0
  description: Generic display-format contract — common Rust API pattern
  references:
  - 'Rust API Guidelines: https://rust-lang.github.io/api-guidelines/'
equations:
  display_format:
    formula: "fmt::Display::fmt(&self, f) -> fmt::Result with width/precision"
    domain: "Rust std::fmt::Display implementors with format specifiers"
    invariants:
    - "fmt() never panics (returns Err on write failure)"
    - "Output is deterministic for the same input"
    - "Alternate format (#) produces strictly more information"
    preconditions:
    - "self is in a valid state (all fields initialized)"
    - "width > 0 when format specifier includes width"
    postconditions:
    - "output is valid UTF-8"
    - "output.len() <= self.max_display_len() when bounded"
    lean_theorem: Theorems.Display_Format
  render:
    formula: "render(data, format) -> String where format in {text, json, markdown}"
    domain: "Format-polymorphic rendering of structured data"
    invariants:
    - "render(data, Json) is valid JSON (serde_json::from_str succeeds)"
    - "render(data, Markdown) contains no raw HTML injection"
    preconditions:
    - "data is Serialize-capable"
    - "format is a recognized OutputFormat variant"
    postconditions:
    - "output is non-empty when data has at least one field"
    lean_theorem: Theorems.Render
proof_obligations:
- type: invariant
  property: display-format correctness
falsification_tests:
- id: FALSIFY-GEN-001
  rule: display-format contract
  prediction: Function follows display-format pattern
  if_fails: Implementation deviates from pattern
kani_harnesses:
- id: KANI-GEN-001
  obligation: display-format correctness
  bound: 8
  strategy: bounded_int
  solver: cadical
qa_gate:
  id: F-DFV-001
  name: display-format-v1 Contract
  description: Quality gate for Generic display-format contract — common Rust API
    pattern
  checks:
  - validation
  - falsification
