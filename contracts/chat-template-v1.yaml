metadata:
  version: "1.5.0"
  created: "2026-04-13"
  updated: "2026-06-14"
  author: PAIML Engineering
  registry: true
  references:
    - "HuggingFace tokenizers chat_template specification"
    - "Jinja2/minijinja template engine"
    - "docs/specifications/aprender-train/ship-two-models-spec.md AC-SHIP1-008"
    - "docs/specifications/aprender-train/ship-two-models-spec.md §60 (SHIP-007 §22 closure — upstream blocker for SHIP-008 LIVE discharge)"
    - "docs/specifications/aprender-train/ship-two-models-spec.md §61.8 (Branch B closure)"
    - "evidence/ship-008-discharge-2026-05-10/discharge-evidence-v1.json (LIVE 2026-05-10)"
  description: |
    Chat template rendering contract. Defines correctness for Jinja2-style
    chat templates used by LLMs (ChatML, Llama, Qwen, Mistral formats).

    v1.3.0 (2026-05-10): GATE-CHAT-SHIP-008 promoted PARTIAL_ALGORITHM_LEVEL
    → DISCHARGED via live `apr run` on canonical 7B teacher. Run
    `/mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.apr`
    with prompt = AC_SHIP1_008_CANONICAL_USER ("Write a Python function to
    compute the nth Fibonacci number.") via apr v0.32.0 post-e856eb91f
    M-FFN-GGUF-5. Teacher emits 256-token ChatML response with conversational
    opening ("Certainly! The Fibonacci sequence..."), Markdown ### headings,
    3 ```python``` fenced code blocks (all parseable via Python ast.parse,
    0 syntax errors), and 2 valid function definitions
    (fibonacci_iterative, fibonacci_recursive). Backend chain: CUDA
    (transient ILLEGAL_ADDRESS) → wgpu (rejected via apr-cpu-vs-gpu-output-
    parity-v1 fallback gate) → CPU (selected). Wall: 82.97s. Upstream
    blocker SHIP-007 §22 RESOLVED 2026-05-07 (PR #1550 e856eb91f);
    Branch B finding RESOLVED via PR #1612 (gguf-prompt-sensitivity-v1
    v1.1.0). Evidence: evidence/ship-008-discharge-2026-05-10/. MODEL-1
    ship % flips 92% → 93% (2 of 5 §17.5 PARTIALs LIVE-discharged).

    v1.1.0 (2026-04-22): Added GATE-CHAT-SHIP-008 binding the ChatML
    `format_conversation` render to a byte-exact golden string for the
    canonical (system, user) Qwen2.5-Coder-7B teacher prompt. Discharges
    FALSIFY-SHIP-008 / AC-SHIP1-008 at PARTIAL_ALGORITHM_LEVEL.

name: chat-template
version: "1.3.0"
scope: "crates/aprender-core/src/text/chat_template/ + crates/aprender-serve/src/chat/"

description: |
  Chat templates convert structured messages [{role, content}] into
  model-specific prompt strings. Uses minijinja for Jinja2 compatibility
  with HuggingFace tokenizer_config.json chat_template field.

  Critical correctness property: template rendering must produce identical
  output to HuggingFace transformers for the same inputs.

equations:
  render_correctness:
    description: "Template rendering matches HuggingFace reference output"
    formula: "∀ messages, template: render(template, messages) == hf_render(template, messages)"
    note: "Verified against golden outputs from HuggingFace tokenizers"

  special_token_injection:
    description: "BOS/EOS tokens are correctly placed"
    formula: "∀ rendered: starts_with(bos_token) ∧ ends_with(eos_token) when add_generation_prompt=false"
    note: "Some templates omit BOS (e.g., Llama 3). Template-dependent."

  role_mapping:
    description: "All standard roles are supported"
    formula: "∀ role ∈ {system, user, assistant, tool}: template handles role without error"
    note: "Unknown roles should produce a clear error, not silently drop"

falsification:
  - id: FALSIFY-CHAT-001
    description: "ChatML template produces correct output"
    test: "chat template tests in aprender-core"
    evidence: "cargo test -p aprender-core --lib chat_template"

  - id: FALSIFY-CHAT-002
    description: "Llama 3 template produces correct output"
    test: "chat template tests"
    evidence: "cargo test -p aprender-core --lib chat_template"

  - id: FALSIFY-CHAT-003
    description: "Missing template produces error, not silent skip"
    test: "PMAT-237 lesson: process validation, not outcome validation"
    evidence: "cargo test -p aprender-core --lib chat_template"

  - id: FALSIFY-CHAT-762
    description: |
      Llama2Template::format_conversation preserves system context and emits exactly one BOS.
      An adversarial chat-template bug-hunt (2026-06-14) found three real defects, all fixed
      (PMAT-762): (1) a system-only message (no following user) was silently DROPPED — output
      was just "<s>"; (2) multiple system messages OVERWROTE each other (only the last kept);
      (3) the [system, user] case emitted a DOUBLE "<s>" (double-BOS) because the new-round
      "<s>" fired even though only a system message preceded the first user turn. Now: system
      messages concatenate, an unconsumed system prompt is flushed as a trailing INST block,
      and the new-round "<s>" only opens AFTER a completed assistant turn (turn_started guard).
    test: "falsify_ct_762_* in chat_template_contract_tests.rs (system-only, multi-system, double-BOS, multi-turn-separator)"
    evidence: "cargo test -p aprender-serve --lib falsify_ct_762"

  - id: FALSIFY-CHAT-763
    description: |
      RawTemplate (the fallback selected by detect_format_from_name for unknown / "default"-
      named models) newline-separates messages instead of bare-concatenating them. The
      previous `.map(sanitize).collect::<String>()` produced "HelloWorld" for a multi-turn
      chat — an unparseable prompt. Reachable via format_chat_messages(Some(request.model)) on
      the registry_fallback + chat_completions_stream paths when the model name matches no
      template pattern. Fixed (PMAT-763) to emit `content + '\n'` per message, matching the
      realize_handlers raw fallback. (The cuda/gpu chat backends use real-arch
      tokenize_chat_prompt, so they were never on the Raw path.)
    test: "falsify_ct_763_rawtemplate_separates_messages in chat_template_contract_tests.rs"
    evidence: "cargo test -p aprender-serve --lib falsify_ct_763"

  - id: NOTE-CHAT-BOS-FALSE-POSITIVE
    description: |
      The 2026-06-14 chat-template bug-hunt flagged "serve missing BOS vs CLI" (serve's
      tokenize_chat_prompt does no explicit BOS prepend; CLI infer/mod.rs does, GH-278).
      RESOLVED as a FALSE POSITIVE via code analysis: BPETokenizer::encode maps a template's
      literal "<s>"/"<|im_start|>" to its special-token id (bpe_encode special-token split
      when merge_rules present, else greedy token_to_id match) and does NOT auto-prepend BOS.
      So serve gets BOS exactly once VIA THE TEMPLATE; the CLI prepends only because its
      non-templated raw-prompt path has no embedded BOS. A blind serve-side prepend would
      CAUSE double-BOS — DO NOT add one. No code change; recorded to prevent a harmful fix.
    test: "n/a (analysis — see evidence/chat-template-adversarial-audit-2026-06-14/findings.md)"
    evidence: "crates/aprender-serve/src/tokenizer.rs encode() + api/openai_handlers.rs tokenize_chat_prompt()"

  - id: GATE-CHAT-SHIP-008
    description: |
      MODEL-1 teacher (Qwen2.5-Coder-7B-Instruct, ChatML family) renders
      canonical (system, user) messages to a byte-exact golden string.
      Binds `ChatMLTemplate::format_conversation` to the golden via a
      pure `verdict_from_chat_template_render(rendered, golden) -> Pass|Fail`
      decision rule. Any single-byte divergence — role, delimiter,
      content, generation prompt, or whitespace — flips the verdict
      to Fail before teacher inference runs.
    discharges: "AC-SHIP1-008 / FALSIFY-SHIP-008"
    ship_blocking: true
    discharge_status: DISCHARGED
    evidence_discharged_by:
      - "crates/aprender-core/src/text/chat_template/ship_008.rs (verdict fn + 5-section mutation survey)"
      - "cargo test -p aprender-core --lib falsify_ship_008_chat_template_render_bind"
      - 'evidence/ship-008-discharge-2026-05-10/discharge-evidence-v1.json (LIVE on canonical 7B 2026-05-10)'
      - 'evidence/ship-008-discharge-2026-05-10/apr-run-output.txt (raw teacher render log)'
      - 'evidence/ship-008-discharge-2026-05-10/completion.md (extracted ChatML response)'
      - 'evidence/ship-008-discharge-2026-05-10/parse-result.json (Python ast.parse + structural verdict)'
    live_discharge:
      date: '2026-05-10'
      host: noah-Lambda-Vector (RTX 4090)
      binary: '/mnt/nvme-raid0/targets/aprender/release/apr (v0.32.0 post-e856eb91f M-FFN-GGUF-5)'
      artifact: '/mnt/nvme-raid0/models/ship-two-001/qwen2.5-coder-7b-instruct-q4k.apr'
      artifact_sha256: 'a394dd286732a5f32dfb983fd2ea0eeba4d6239ac4c47e44bcfe62f590ddeb28'
      artifact_size_bytes: 8035635652
      command: 'apr run <artifact> --prompt "Write a Python function to compute the nth Fibonacci number." --max-tokens 256'
      teacher_response_summary:
        first_line: "Certainly! The Fibonacci sequence is a series of numbers..."
        code_blocks_emitted: 3
        function_defs_emitted: ["fibonacci_iterative", "fibonacci_recursive"]
        python_syntax_errors: 0
        has_markdown_structure: true
      wall_time_seconds: 82.97
      backend_path: 'CUDA (transient ILLEGAL_ADDRESS) → wgpu (rejected via apr-cpu-vs-gpu-output-parity-v1) → CPU (selected)'
      upstream_blocker_resolved:
        blocker: 'SHIP-007 §22 — APR vs GGUF forward parity (per §17.5 chain)'
        resolution_date: '2026-05-07'
        resolution_pr: 'aprender#1550 squash e856eb91f (M-FFN-GGUF-5) + #1556 (M-FFN-GGUF-5b)'
        binding_criterion_contract: 'contracts/apr-vs-gguf-forward-parity-v1.yaml v1.2.0 ACTIVE_FUNCTIONAL (PR #1608)'
      branch_b_finding_resolved:
        branch: '§61.8 Branch B — GGUF prompt-insensitive output bug'
        investigation_pr: 'aprender#1612 (gguf-prompt-sensitivity-v1 v1.1.0 ACTIVE_FUNCTIONAL)'
        evidence: 'APR + ChatML auto-wrap path through run_inference produces clean conversational output. The original §61.8 byte-identical claim was a CLI output truncation artifact.'
    full_discharge_blocks_on: |
      RESOLVED 2026-05-10 — see live_discharge block above.

      Pre-discharge gate: Live teacher render via `apr run <canonical 7B
      teacher>.apr --prompt "<AC_SHIP1_008_CANONICAL_USER>"` + verify
      teacher emits clean ChatML-formatted response containing valid
      Python (Python ast.parse on each fenced code block, function defs
      named "fibonacci*", conversational opening "Certainly!").
      Algorithm-level rule (PARTIAL) was dischargeable offline; LIVE
      discharge required upstream SHIP-007 §22 + Branch B resolution.
    counter_example_classes:
      - "empty render (engine crash / returned empty string)"
      - "missing trailing <|im_start|>assistant\\n generation prompt"
      - "wrong special-token family (ChatML → Llama2 / <|user|> drift)"
      - "role-order swap (user before system)"
      - "single-byte flip at trailing newline (byte-equality, not approx)"
      - "live regression: teacher emits non-Python or '\\ns\\ns' degenerate output on canonical USER message"

qa_gate:
  id: F-CHAT-TEMPLATE-GATE
  name: Chat Template Gate
  description: Quality gate for chat template Jinja2 rendering correctness (ChatML, Llama, Qwen, Mistral)
  checks:
  - validation
  - falsification
  pass_criteria: All falsification tests pass; render output byte-equivalent to HuggingFace reference
