  description: >
    Quality presets (medium / good / high / best / extreme) that name a model portfolio and a time budget. Competitor verb: fit(..., presets="best_quality")  # tabular/src/autogluon/tabular/configs/presets_configs.py. Gap measured in aprender at eb262f8eb: No preset vocabulary. AutoTuner takes a SearchSpace the caller hand-builds (crates/aprender-core/src/automl/params.rs); there is no named bundle of {models, bagging, stacking, time_limit}.
