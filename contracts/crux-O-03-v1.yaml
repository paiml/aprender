equations:
  every_preset_name_resolves_to_a_portfolio_and_unknown_names_:
    formula: |
      the five quality presets each yield a non-empty ordered model list; `presets="bestest"` is an Err whose message contains all five valid names
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "every preset name resolves to a portfolio and unknown names are rejected with the valid list"
  presets_are_ordered__a_higher_preset_never_fits_fewer_model_:
    formula: |
      for medium < good < high < best the family count is monotone non-decreasing, asserted pairwise
    domain: "the fixture and inputs named in the prediction"
    codomain: "PASS iff the prediction holds; the mutation named in the prediction (where one is named) turns it RED"
    invariants:
    - "presets are ordered: a higher preset never fits FEWER model families than the one below it"

falsification_tests:
- id: FALSIFY-CRUX-O-03-001
  rule: "every preset name resolves to a portfolio and unknown names are rejected with the valid list"
  prediction: "the five quality presets each yield a non-empty ordered model list; `presets=\"bestest\"` is an Err whose message contains all five valid names"
  test: >-
    LIVE-PENDING - every preset name resolves to a portfolio and unknown names are rejected with the valid list. No test surface exists today because the capability is unimplemented: Quality presets (medium / good / high / best / extreme) that name a model portfolio and a time budget (aprender#3373, CRUX-O-03). PROMOTE by authoring a test named preset_table_resolves in module `automl/presets/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'every preset name resolves to a portfolio and unknown names are rejected with the valid list' is violated — the autogluon parity claim for CRUX-O-03 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"
- id: FALSIFY-CRUX-O-03-002
  rule: "presets are ordered: a higher preset never fits FEWER model families than the one below it"
  prediction: "for medium < good < high < best the family count is monotone non-decreasing, asserted pairwise"
  test: >-
    LIVE-PENDING - presets are ordered: a higher preset never fits FEWER model families than the one below it. No test surface exists today because the capability is unimplemented: Quality presets (medium / good / high / best / extreme) that name a model portfolio and a time budget (aprender#3373, CRUX-O-03). PROMOTE by authoring a test named preset_monotone_families in module `automl/presets/tests` of crate `aprender-core`; this gate then binds to it and the contract moves from draft to active. Until then the obligation is RECORDED and unfalsifiable-by-absence, NOT satisfied.
  if_fails: "rule 'presets are ordered: a higher preset never fits FEWER model families than the one below it' is violated — the autogluon parity claim for CRUX-O-03 is FALSE and the contract MUST be re-verified against the competitor's canonical implementation"

proof_obligations:
- type: invariant
  property: "every preset name resolves to a portfolio and unknown names are rejected with the valid list"
- type: invariant
  property: "presets are ordered: a higher preset never fits FEWER model families than the one below it"

