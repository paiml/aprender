# CRUX-D-18 — Reward-model training

metadata:
  id: CRUX-D-18
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "D — Inference & Generation"
  competitor: huggingface
  demand_score: 3
  intake_status: missing
  description: >
    Train a scalar-head reward model from (prompt, chosen, rejected) tuples.
    Canonical: HF TRL `RewardTrainer` (Bradley-Terry loss), used as the RM
    for downstream PPO/DPO.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/vllm-project/vllm
  - github.com/ggerganov/llama.cpp
  - github.com/ollama/ollama
equations:
  bradley_terry_loss:
    formula: |
      r_w = RM(prompt, chosen)     # scalar reward on chosen
      r_l = RM(prompt, rejected)   # scalar reward on rejected
      L = -log sigmoid(r_w - r_l)
    domain: "(base_model: Path, train_jsonl: Path, num_labels = 1)"
    codomain: "model.safetensors with scalar regression head + reward_head.weight"
    invariants:
    - "train accuracy (r_w > r_l) → 1.0 on held-out as training converges"
    - "a random (bos-only) completion gets lower reward than a real one"
    - "RM outputs a scalar (dim 1), not a probability vector"

falsification_tests:
- id: FALSIFY-CRUX-D-18-001
  rule: bradley-terry loss matches TRL within 1e-4
  prediction: "step-0 loss(apr RewardTrainer) == step-0 loss(TRL RewardTrainer) on same batch"
  test: |
    set -euo pipefail
    apr train-rm tests/fixtures/tiny-pref.jsonl --model tests/fixtures/tinyllama-hf \
      --steps 1 --dump-loss /tmp/rm-loss.json
    python3 - <<'PY'
    import json
    apr = json.load(open("/tmp/rm-loss.json"))["loss"]
    ref = 0.6931  # captured from TRL RewardTrainer step-0 on same batch
    assert abs(apr - ref) < 1e-4
    PY
  if_fails: rule 'bradley-terry loss matches TRL within 1e-4' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-D-18-002
  rule: trained RM scores chosen > rejected on held-out
  prediction: "held-out accuracy > 0.7 after N steps on synthetic data"
  test: |
    set -euo pipefail
    apr train-rm tests/fixtures/toy-pref.jsonl --model tests/fixtures/tinyllama-hf \
      --steps 200 --output /tmp/rm
    acc=$(apr eval-rm /tmp/rm tests/fixtures/toy-pref-holdout.jsonl --format json | jq .accuracy)
    python3 -c "assert $acc > 0.7"
  if_fails: rule 'trained RM scores chosen > rejected on held-out' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-D-18-003
  rule: saved model has scalar regression head (num_labels=1)
  prediction: "score_head.weight.shape == (1, hidden)"
  test: |
    set -euo pipefail
    shape=$(apr inspect /tmp/rm/model.safetensors --tensor score.weight --format json | jq -r .shape)
    python3 -c "s=$shape; assert s[0]==1, s"

  if_fails: rule 'saved model has scalar regression head (num_labels=1)' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr train-rm matches TRL RewardTrainer Bradley-Terry loss within 1e-4"
- type: invariant
  property: "RM output dimension == 1 (scalar); enforced by head config"
- type: invariant
  property: "chosen reward > rejected reward on held-out ≥ 70% accuracy after convergence"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

