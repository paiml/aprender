# CRUX-A-08 — Custom mirror / HF_ENDPOINT

metadata:
  id: CRUX-A-08
  version: "1.2.0"
  created: "2026-04-18"
  last_updated: "2026-04-20"
  author: PAIML Engineering
  registry: true
  status: partial
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Intake & Discovery"
  competitor: huggingface
  demand_score: 3
  intake_status: missing
  description: >
    Let users point `apr pull` at a private mirror via `HF_ENDPOINT` (same
    contract as `huggingface_hub`: env var overrides the default
    https://huggingface.co base URL for all hub API calls).

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/huggingface/transformers — Trainer
  - docs.python.org — packaging, signatures, supply chain
equations:
  endpoint_override:
    formula: |
      pull_url(repo, file, endpoint) =
        f"{endpoint.rstrip('/')}/{repo}/resolve/{revision}/{file}"
      where endpoint = os.getenv("HF_ENDPOINT", "https://huggingface.co")
    domain: "(repo: str, file: str, endpoint: Option<URL>)"
    codomain: "URL used for GET /{repo}/resolve/{rev}/{file}"
    invariants:
    - "HF_ENDPOINT unset → apr pull hits https://huggingface.co verbatim"
    - "HF_ENDPOINT=https://mirror.local → no request goes to huggingface.co"
    - "trailing slash stripped; scheme must be http|https; bad scheme → exit 2"

falsification_tests:
- id: FALSIFY-CRUX-A-08-001
  rule: HF_ENDPOINT redirects all pulls; zero leaks to canonical host
  prediction: "strace -f -e trace=connect apr pull hf://bert-base-uncased shows ONLY mirror IPs, never huggingface.co"
  test: |
    set -euo pipefail
    MIRROR="http://127.0.0.1:18080"
    python3 -m http.server 18080 --directory /tmp/mirror &>/tmp/mirror.log & PID=$!
    trap "kill $PID" EXIT
    sleep 1
    HF_ENDPOINT="$MIRROR" strace -f -e trace=connect -o /tmp/trace.log apr pull hf://bert-base-uncased --dry-run 2>/dev/null || true
    grep -E "huggingface\.co|34\.160|3\.163" /tmp/trace.log && exit 1
    grep -E "127\.0\.0\.1|18080" /tmp/trace.log >/dev/null
  if_fails: "apr pull leaked to huggingface.co despite HF_ENDPOINT override — check hf_hub::Client constructor"
  discharge_status: PARTIAL_ALGORITHM_LEVEL
  evidence_discharged_by:
    classifier: crates/apr-cli/src/commands/hf_endpoint.rs
    sub_claim: >
      The pure `resolve_endpoint(env) -> Result<String, EndpointError>` and
      `pull_url(endpoint, repo, revision, file) -> String` classifier proves
      that when `HF_ENDPOINT=http://127.0.0.1:18080` is set, the resolved URL
      for `apr pull` targets the mirror and contains no "huggingface.co"
      substring. Conversely, when HF_ENDPOINT is unset, the URL is anchored
      at the canonical host `https://huggingface.co`. This is the algorithm-
      level precondition for the integration-level strace check: if the
      classifier is correct, every URL passed to the HTTP client is already
      mirror-targeted, so no packet can leak to huggingface.co absent a bug
      below this layer.
    tests:
    - commands::hf_endpoint::tests::falsify_001_sub_claim_mirror_keeps_url_off_huggingface_co
    - commands::hf_endpoint::tests::falsify_001_sub_claim_unset_uses_canonical_host
    - commands::hf_endpoint::tests::hf_endpoint_override_wins
    - commands::hf_endpoint::tests::ftp_scheme_rejected
    - commands::hf_endpoint::tests::file_scheme_rejected
    - commands::hf_endpoint::tests::pull_url_mirror_matches_hf_formula
    - commands::hf_endpoint::tests::url_targets_endpoint_agreement
    - commands::hf_endpoint::tests::resolve_is_deterministic
    scope: >
      Algorithm-level discharge: the classifier implements the contract
      `endpoint_override` formula
      `pull_url = {endpoint.rstrip('/')}/{repo}/resolve/{revision}/{file}`
      exactly, including trailing-slash stripping and http|https scheme
      enforcement. NOT YET DISCHARGED: strace-level zero-leak verification
      at the integration boundary (requires live HTTP client wiring plus
      a local mirror server under `strace -f -e trace=connect`). The
      classifier proves the URL construction is correct; the remaining
      FALSIFY gate verifies that the HTTP client actually consumes the
      resolved URL with no fallback to huggingface.co.

proof_obligations:
- type: equivalence
  property: "apr pull with HF_ENDPOINT matches `huggingface_hub.snapshot_download(endpoint=...)` URL construction"
- type: invariant
  property: "network isolation — strace shows zero packets to non-endpoint hosts"
- type: invariant
  property: "HF_ENDPOINT with invalid scheme (ftp://, file://) rejected at parse time with exit 2"

