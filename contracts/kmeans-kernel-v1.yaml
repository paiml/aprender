metadata:
  version: 1.1.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: K-Means kernel — Lloyd's algorithm for cluster assignment
  references:
  - Lloyd (1982) Least Squares Quantization in PCM
  - 'Arthur & Vassilvitskii (2007) k-means++: The Advantages of Careful Seeding'
equations:
  assignment:
    formula: c_i = argmin_j ||x_i - mu_j||^2
    domain: x in R^{N x d}, mu in R^{K x d}, K >= 1
    codomain: c in {0, ..., K-1}^N
    invariants:
    - Each point assigned to nearest centroid
    - Every cluster index in [0, K-1]
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Assignment
  update:
    formula: mu_j = (1/|S_j|) * sum_{i in S_j} x_i
    domain: 'x in R^{N x d}, S_j = {i : c_i = j}'
    codomain: mu in R^{K x d}
    invariants:
    - New centroid is mean of assigned points
    - Empty cluster centroid unchanged
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Update
  objective:
    formula: J = sum_{i=1}^{N} ||x_i - mu_{c_i}||^2
    domain: x in R^{N x d}, mu in R^{K x d}, c in {0..K-1}^N
    codomain: J in R_>=0
    invariants:
    - J >= 0 (non-negative)
    - J is non-increasing across iterations (monotone convergence)
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Objective
  restarts:
    formula: 'J_best = min_{r in 0..n_init} J(Lloyd(init_r)), init_r = greedy D2 (k-means++) seeding from row seed mod N (r = 0) or SplitMix64(seed, r)'
    domain: n_init >= 1, init_r seeded by (seed, r) via SplitMix64
    codomain: J_best in R_>=0
    invariants:
    - J_best <= J(Lloyd(init_0)) (never worse than a single init)
    - ties keep the earlier restart, so n_init = 1 is exactly the single-init fit
    - same seed and n_init give bit-identical inertia and labels
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Restarts
proof_obligations:
- id: KM-INV-001
  type: invariant
  property: Nearest centroid assignment
  formal: '||x_i - mu_{c_i}|| <= ||x_i - mu_j|| for all j'
  applies_to: all
- id: KM-MON-002
  type: monotonicity
  property: Objective non-increasing
  formal: J_{t+1} <= J_t after each assignment+update step
  applies_to: all
- id: KM-BND-003
  type: bound
  property: Objective non-negative
  formal: J >= 0
  applies_to: all
- id: KM-INV-004
  type: invariant
  property: Valid cluster indices
  formal: c_i in {0, ..., K-1} for all i
  applies_to: all
- id: KM-MON-006
  type: monotonicity
  property: Best-of-n_init never worse than single init
  formal: '∀ n ≥ 1: J_best(n) ≤ J_best(1)'
  applies_to: all
- id: KM-EQ-005
  type: equivalence
  property: SIMD matches scalar within ULP
  tolerance: 8.0
  applies_to: simd
kernel_structure:
  phases:
  - name: initialize
    description: Initialize K centroids (random or k-means++)
    invariant: K distinct centroids
  - name: assign
    description: Assign each point to nearest centroid
    invariant: All assignments in [0, K-1]
  - name: update
    description: Recompute centroids as cluster means
    invariant: Centroid is mean of assigned points
  - name: check_convergence
    description: Check if assignments changed
    invariant: Terminates in finite iterations
simd_dispatch:
  kmeans_assign:
    scalar: kmeans_assign_scalar
    avx2: kmeans_assign_avx2
    ptx: kmeans_ptx
enforcement:
  nearest_assignment:
    description: Each point must be assigned to its nearest centroid
    check: contract_tests::FALSIFY-KM-001
    severity: ERROR
  convergence:
    description: Objective must not increase between iterations
    check: contract_tests::FALSIFY-KM-002
    severity: ERROR
  restarts:
    description: Best-of-n_init inertia must not exceed the single-init inertia
    check: contract_tests::FALSIFY-KM-007
    severity: ERROR
falsification_tests:
- id: FALSIFY-KM-001
  rule: Nearest assignment
  prediction: dist(x_i, mu_{c_i}) <= dist(x_i, mu_j) for all j
  test: proptest with random points and centroids, K=2..8, d=1..16
  if_fails: Distance comparison or argmin implementation incorrect
- id: FALSIFY-KM-002
  rule: Monotone convergence
  prediction: J_{t+1} <= J_t for 100 random iterations
  test: proptest running 100 iterations on random data
  if_fails: Centroid update not correctly computing mean
- id: FALSIFY-KM-003
  rule: Objective non-negativity
  prediction: J >= 0 for any assignment
  test: proptest with random data and random assignments
  if_fails: Squared distance computation has sign error
- id: FALSIFY-KM-004
  rule: Valid indices
  prediction: All c_i in [0, K-1]
  test: proptest checking assignments after each iteration
  if_fails: Out-of-bounds cluster index
- id: FALSIFY-KM-005
  rule: SIMD equivalence
  prediction: '|assign_avx2(x) - assign_scalar(x)| = 0 (exact match for argmin)'
  test: proptest comparing scalar vs SIMD assignments
  if_fails: SIMD distance computation differs
- id: FALSIFY-KM-006
  rule: Boundary - K=1
  prediction: All points assigned to cluster 0, centroid = mean(x)
  test: proptest with K=1
  if_fails: Single-cluster degenerate case not handled
- id: FALSIFY-KM-007
  rule: n_init monotone
  prediction: inertia(n_init=10) <= inertia(n_init=1) on 96 seeded blob fits (24 datasets x K in {2,3,5,8})
  test: cluster::kmeans::tests_kmeans_contract::falsify_km_007_n_init_never_worse_than_single
  if_fails: Best-of selection keeps a worse restart (last-run-wins mutant turns this RED)
- id: FALSIFY-KM-008
  rule: n_init explores
  prediction: n_init=10 strictly beats n_init=1 on at least one of the 96 fits; on the E9 corpus (232x2665 TF-IDF) it wins at 15/29 K and loses at 0 with run-keyed D2 seeding (21/29 with farthest-point) (examples/kmeans_n_init_e9.rs)
  test: cluster::kmeans::tests_kmeans_contract::falsify_km_008_n_init_strictly_improves_somewhere
  if_fails: Restarts reuse the same start row (same-start mutant turns this RED, 0/96)
- id: FALSIFY-KM-009
  rule: n_init reproducible
  prediction: same seed + n_init give bit-identical inertia and labels; default n_init = 1 (sklearn>=1.4 "auto" for k-means++-family seeding); n_init = 0 clamps to 1
  test: cluster::kmeans::tests_kmeans_contract::falsify_km_009_n_init_reproducible
  if_fails: Restart seeding depends on unseeded state
- id: FALSIFY-KM-010
  rule: pre-n_init saved models still load
  prediction: bincode and safetensors files written before n_init existed (tests/fixtures/kmeans, generated by d868ec946^) load with n_init = 1 and their original centroids and labels; a current file round-trips n_init; current bytes = legacy bytes ++ n_init (u64, last field)
  test: cluster::kmeans::tests_kmeans_contract::falsify_km_010_pre_n_init_bincode_loads
  if_fails: Adding n_init broke on-disk compatibility of saved KMeans models
- id: FALSIFY-KM-011
  rule: D2 seeding beats farthest-point
  prediction: over the 96 KM-007 single-init fits, total inertia with greedy D2 seeding < farthest-point seeding (29635.9 vs 30066.0; 30 wins / 31 losses, so the claim is the aggregate, not a per-fit majority); on E9 with n_init=10 aprender is above sklearn at 8/29 K, max +0.64% (25/29, max +1.35% with farthest-point)
  test: cluster::kmeans::tests_kmeans_contract::falsify_km_011_d2_beats_farthest_point
  if_fails: Seeding regressed to argmax (farthest-point ties the reference and fails the strict inequality)
- id: FALSIFY-KM-012
  rule: D2 draws are proportional to squared distance
  prediction: 50 copies of one point plus two distinct points, k = 3, 32 seeds - the init never draws a zero-weight duplicate, so all three seeded rows are distinct
  test: cluster::kmeans::tests_kmeans_contract::falsify_km_012_zero_weight_rows_never_drawn
  if_fails: Candidates are drawn uniformly or the cumulative search can land on a zero-weight row
- id: FALSIFY-KM-013
  rule: restarts draw independently of their start row
  prediction: over runs 0..200 on 60 rows (k = 5, seed 11), more than half of the run pairs that share restart_start_row seed different centroids
  test: cluster::kmeans::tests_kmeans_contract::falsify_km_013_restarts_sharing_a_start_row_still_differ
  if_fails: The D2 RNG is keyed on the start row instead of the run, so colliding restarts repeat each other (run-blind mutant turns this RED)
kani_harnesses:
- id: KANI-KM-001
  obligation: KM-INV-001
  property: Assignment selects nearest centroid for small N
  bound: 4
  strategy: stub_float
  solver: cadical
  harness: verify_kmeans_nearest
- id: KANI-KM-002
  obligation: KM-BND-001
  property: Objective is non-negative
  bound: 4
  strategy: stub_float
  solver: cadical
  harness: verify_kmeans_objective_nonneg
- id: KANI-KMEANS-003
  obligation: Nearest centroid assignment
  property: Nearest centroid assignment
  bound: 8
  strategy: exhaustive
- id: KANI-KMEANS-004
  obligation: Objective non-increasing
  property: Objective non-increasing
  bound: 8
  strategy: exhaustive
- id: KANI-KMEANS-005
  obligation: Objective non-negative
  property: Objective non-negative
  bound: 8
  strategy: exhaustive
- id: KANI-KMEANS-006
  obligation: Valid cluster indices
  property: Valid cluster indices
  bound: 8
  strategy: exhaustive
- id: KANI-KMEANS-007
  obligation: SIMD matches scalar within ULP
  property: SIMD matches scalar within ULP
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-KM-001
  name: K-Means Contract
  description: Lloyd's algorithm cluster assignment quality gate
  checks:
  - nearest_assignment
  - monotone_convergence
  - objective_bound
  - simd_equivalence
  pass_criteria: All 6 falsification tests pass + Kani harnesses verify
  falsification: Use random assignment instead of nearest centroid
