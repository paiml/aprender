contract: apr-page-examples-qa-verify
metadata:
  kind: schema
  version: "1.0.0"
  description: "Apr Page Examples Qa Verify contract"
  references:
  - "docs/specifications/aprender-monorepo-consolidation.md"
version: 1
status: draft
date: 2026-04-08

page:
  id: "examples-qa-verify"
  title: "QA: Aprender Quality Gates"
  part: "reference"
  category: "case-study"
  path: "book/src/examples/qa-verify.md"
  example: "qa_verify"
  arxiv: []

sections:
  - heading: "Run"
    has_code: true
    has_assertion: false
    citation: null
  - heading: "Source"
    has_code: true
    has_assertion: false
    citation: null

falsification:
  - condition: "Page .md file does not exist at declared path"
    severity: P0
    action: delete_from_summary
  - condition: "Example does not compile"
    severity: P0
    action: delete_from_summary
  - condition: "Example exits non-zero"
    severity: P0
    action: delete_from_summary
  - condition: "Section in .md not listed in contract"
    severity: P0
    action: delete_section
  - condition: "Legacy name in page text"
    severity: P0
    action: delete_from_summary

# #7235: falsification tests bound to CI-run tests.
falsification_tests:
  - id: FALSIFY-APR-PAGE-EXAMPLES-QA-VERIFY-001
    rule: "the page exists at its declared path and its ## sections are exactly the contract's sections list (a missing page, a missing section or an unlisted section is a P0)"
    prediction: "book_page_contracts_match_their_pages passes; it fails when the page is absent or its section headings drift from the contract"
    test: "cargo test -p aprender-contracts --lib book_page_contracts_match_their_pages"
