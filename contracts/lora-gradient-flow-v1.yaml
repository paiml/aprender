metadata:
  version: "1.2.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  description: "LoRA gradient flow correctness"
  references:
    - "Provable contract for lora-gradient-flow-v1"
    - "PMAT-805: CPU train_step routed through model.forward() (no LoRA) and apply_rope severed the autograd graph for the Q projection — both adapters silently untrained on the default q_proj+v_proj target set"
    - "docs/specifications/aprender-train/r15-cuda-lora-cells.md (0.72 R15 cells C1 and C3; 1.2.0 adds the proposed rows FALSIFY-LORA_GRADIENT_FLOW_V1_004 and _005)"

name: lora-gradient-flow
version: "1.2.0"
scope: "crates/aprender-train/src/finetune/"

description: |
  LoRA adapter gradients flow correctly: dL/dA and dL/dB computed via chain rule through frozen base.
  The CPU forward used for loss MUST route through `forward_with_lora` (not plain `model.forward`),
  and every op between the loss and the adapters — including RoPE — MUST be autograd-connected so
  gradients reach BOTH the q_proj and v_proj adapters (PMAT-805).

equations:
  frozen_base:
    description: "∇W_base == 0 during LoRA training"
    formula: "∇W_base == 0 during LoRA training"

  adapter_gradient:
    description: "∇A, ∇B non-zero for non-zero loss (BOTH q_proj and v_proj adapters)"
    formula: "∇A, ∇B non-zero for non-zero loss"

  rope_backward:
    description: "RoPE is autograd-connected: grad_x = R(-θ)·grad_out (transpose rotation)"
    formula: "grad_x[i] = g[i]·cos(θ) + g[i+half]·sin(θ); grad_x[i+half] = -g[i]·sin(θ) + g[i+half]·cos(θ)"

falsification:
  - id: FALSIFY-LORA_GRADIENT_FLOW_V1_001
    description: "∇W_base == 0 during LoRA training"
    test: "crates/aprender-train/src/finetune/instruct_pipeline/tests.rs::falsify_pmat805_cpu_train_step_trains_lora_overfit_one_batch (base weights frozen; only lora_layers stepped)"
    evidence: "cargo test -p aprender-train --lib falsify_pmat805"

  - id: FALSIFY-LORA_GRADIENT_FLOW_V1_002
    description: "∇A, ∇B non-zero for non-zero loss — overfit-one-batch moves BOTH Q and V adapters and strictly decreases loss"
    test: "crates/aprender-train/src/finetune/instruct_pipeline/tests.rs::falsify_pmat805_cpu_train_step_trains_lora_overfit_one_batch"
    evidence: "cargo test -p aprender-train --lib falsify_pmat805_cpu_train_step_trains_lora_overfit_one_batch"

  - id: FALSIFY-LORA_GRADIENT_FLOW_V1_003
    description: "RoPE backward matches finite-difference gradients (graph not severed at RoPE)"
    test: "crates/aprender-train/src/transformer/attention.rs::tests::falsify_pmat805_rope_backward_matches_finite_difference"
    evidence: "cargo test -p aprender-train --lib falsify_pmat805_rope_backward_matches_finite_difference"

  - id: FALSIFY-LORA_GRADIENT_FLOW_V1_004
    description: "PROPOSED (0.72 R15 cell C1, la-0.72): extracting the inline CUDA Q/V LoRA backward in backward_nf4_attention (cuda_block.rs:4297, Q ~:4427-4485, V ~:4588-4625) into one lora_backward(x, a, b, dy, da, db, dx) helper changes no number. On a tiny NF4 run with a fixed seed at alpha = 2·rank (the CLI default, s = 2), the gradients of step 2 (dA_q, dB_q, dA_v, dB_v and dX) are bit-identical (max |Δ| = 0, compared as raw f32 bits) to the 316dee2cd4 inline path. Step 2, because B starts at zero: at step 1, dA and the adapter's share of dX are zero on both sides, so the check would say nothing about them. The extraction lands as its own commit, before K44's fix (qwen35-qlora-e2e-v1 QQE-011). That fix changes the gradients by design whenever s ≠ 1, so after it this test is re-run at alpha = rank (s = 1), where the fix changes no number. Planted: computing dInter before dB inside the helper must be RED, because dInter overwrites the lora_inter scratch that dB reads (Q :4445-4453, V :4605-4606), so dB would come from dInter. The inline path has no explicit alpha/rank factor to drop: the scale sits in B, which is uploaded already multiplied by s."
    test: "[U] not written; needs cargo + CUDA after LIVE 0.70.1, GPU lock around the test binary only"
    evidence: "none yet; desk read of 316dee2cd4 (docs/specifications/aprender-train/r15-cuda-lora-cells.md, C1)"

  - id: FALSIFY-LORA_GRADIENT_FLOW_V1_005
    description: "PROPOSED (0.72 R15 cell C3, la-0.72): with all seven targets on the CUDA NF4 path (C2), the attention backward (backward_nf4_attention, cuda_block.rs:4297) calls the C1 lora_backward helper for k and o as well as q and v, and backward_nf4_ffn (:4103, no LoRA code at 316dee2cd4) calls it for gate, up and down. On a tiny dense NF4 model, fixed seed, weight_decay 0, N >= 2 optimizer steps: every adapter in every layer moved (each B off zero, which only a gradient can do since B starts at zero; each A off init, from step 2, since dA = 0 while B = 0), every adapter gradient is finite, and the step-N loss differs from the step-1 loss. Planted: removing the gate/up/down helper calls from backward_nf4_ffn leaves those B exactly zero, so the test is RED"
    test: "[U] not written; needs cargo + CUDA after LIVE 0.70.1, GPU lock around the test binary only"
    evidence: "none yet; desk read of 316dee2cd4 (docs/specifications/aprender-train/r15-cuda-lora-cells.md, C3; the falsifier S-R15 named at shaping)"
