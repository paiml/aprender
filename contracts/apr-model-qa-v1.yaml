metadata:
  version: 1.1.0
  created: '2026-04-04'
  updated: '2026-04-17'
  author: PAIML Engineering
  registry: true
  description: >
    Model quality assurance contract — check, validate, qa, lint, probar
    commands that verify model integrity, detect regressions, and enforce
    quality gates before deployment. The defensive layer of apr-cli.

    v1.1.0 (SPEC-SHIP-TWO-001 §12.1): Adds Golden Output ship-blocker
    semantics — when `--require-golden-output` is set, a SKIPPED
    golden_output gate (tokenizer missing, feature off, etc.) is promoted
    to FAIL instead of counting as pass. Motivated by the MODEL-1
    falsification event 2026-04-17 where a distilled checkpoint emitting
    garbage ("ylkoylko...") passed Tensor Contract but failed Golden
    Output — a silent-skip path could have let it ship for 14 days.
  references:
  - 'apr-cli/src/commands/check.rs — run_check(), aggregate_results()'
  - 'apr-cli/src/commands/validate.rs — validate_model()'
  - 'apr-cli/src/commands/qa.rs — run_qa_pipeline(), QaReport,
    QaConfig.require_golden_output'
  - 'apr-cli/src/commands/qa_gguf.rs — promote_golden_output_to_blocker()'
  - 'apr-cli/src/commands/lint.rs — lint_model()'
  - 'apr-cli/src/commands/probar.rs — run_property_tests()'
  - 'apr-cli/src/commands/canary.rs — canary_test(), canary_report()'
  - 'docs/specifications/aprender-train/ship-two-models-spec.md §12.1,
    §12.5 FALSIFY-EX-001'
  depends_on:
  - apr-cli-v1
  - apr-cli-operations-v1

equations:
  model_integrity_check:
    formula: |
      check(path): Path -> Result<CheckReport, CheckError>
        Stages: header, metadata, tensors, shapes, dtypes, architecture,
                embedding_validity, qkv_detection, layer_norms, vocabulary
        Each stage produces pass/fail + evidence
        Overall: pass iff all stages pass
    domain: Path to model file (GGUF, SafeTensors, APR)
    codomain: Result<CheckReport, CheckError>
    invariants:
    - Check is read-only (never modifies the model file)
    - Deterministic (same file → same report)
    - Partial failure reported per-stage (not all-or-nothing)
    preconditions:
    - path.exists() && is_valid_model_file(path)
    postconditions:
    - report.stages.len() >= 8
    - report.pass == report.stages.iter().all(|s| s.passed)
    lean_theorem: Theorems.ModelIntegrityCheck

  qa_gate_composition:
    formula: |
      qa(path, gates): (Path, QaConfig) -> Result<QaReport, QaError>
        gates: [NaN/Inf, shape, dtype, vocab, embedding, perplexity, canary]
        Each gate is independently configurable (enable/disable, threshold)
        Report includes per-gate verdict + aggregate score
        Exit code 0 iff all enabled gates pass
    domain: Model path, QA configuration with gate thresholds
    codomain: Result<QaReport, QaError>
    invariants:
    - Gate order does not affect results (commutative)
    - Disabled gates do not appear in report
    - Aggregate score = passed_gates / enabled_gates
    preconditions:
    - at least one gate enabled
    - path is a valid model file
    postconditions:
    - report.score == passed_count / enabled_count
    - report.pass == (report.score == 1.0)
    lean_theorem: Theorems.QaGateComposition

  golden_output_ship_blocker:
    formula: |
      promote_golden_output_to_blocker(gates, config):
        (Vec<GateResult>, QaConfig) -> ()
        When config.require_golden_output is true AND a gate named
        "golden_output" is present with skipped=true, the gate is
        mutated in-place:
            gate.passed   := false
            gate.skipped  := false
            gate.message  := "FAIL: golden_output skipped while
                              --require-golden-output set (<reason>)"
        Other gates are never mutated. Passed and already-failed
        golden_output gates are never mutated (idempotent).
    domain: (Mutable gate list, QA configuration)
    codomain: ()
    invariants:
    - If config.require_golden_output == false, no gate is mutated
    - Only the gate named "golden_output" may be mutated
    - A passed (passed=true, skipped=false) gate is never demoted
    - A failed (passed=false, skipped=false) gate remains failed
    - Function is idempotent — applying it twice yields the same state
    preconditions:
    - gates contains at most one entry with name == "golden_output"
    postconditions:
    - If config.require_golden_output && golden_output.skipped (before)
      then golden_output.passed == false (after)
    - All non-golden_output gates are pointwise unchanged
    lean_theorem: Theorems.GoldenOutputShipBlocker

  canary_regression_detection:
    formula: |
      canary(model, baseline): (Path, CanaryBaseline) -> Result<CanaryReport, CanaryError>
        Run fixed prompts, compare outputs to baseline
        Regression: output diverges beyond tolerance
        Pass: output matches baseline within tolerance
    domain: Model path, CanaryBaseline with expected outputs
    codomain: Result<CanaryReport, CanaryError>
    invariants:
    - Canary prompts are fixed (not randomized)
    - Comparison is token-level (not string-level)
    - Baseline is immutable once captured
    preconditions:
    - model produces output for canary prompts
    - baseline.prompts.len() > 0
    postconditions:
    - report.regressions.len() == count of diverged prompts
    - report.pass == (report.regressions.is_empty())
    lean_theorem: Theorems.CanaryRegressionDetection

  lint_model_conventions:
    formula: |
      lint(path): Path -> Result<LintReport, LintError>
        Rules: naming conventions, dtype consistency, shape validity,
               metadata completeness, tensor ordering
        Each rule produces finding (error, warning, info)
        Findings reference the specific tensor or metadata field
    domain: Path to model file
    codomain: Result<LintReport, LintError>
    invariants:
    - Lint is read-only
    - Findings are deduplicated
    - "Severity ordering — error > warning > info"
    preconditions:
    - path.exists()
    postconditions:
    - report.findings sorted by severity desc
    - no duplicate findings (same rule + same location)
    lean_theorem: Theorems.LintModelConventions

  probar_property_tests:
    formula: |
      probar(model, properties): (Path, Vec<Property>) -> Result<ProbarReport, ProbarError>
        Run property-based tests against model behavior:
          - Softmax output sums to 1
          - Attention scores are non-negative
          - Embedding norms bounded
          - Layer output shapes match config
    domain: Model path, list of properties to check
    codomain: Result<ProbarReport, ProbarError>
    invariants:
    - Each property tested independently
    - Failure of one property does not skip others
    - Random seeds logged for reproducibility
    preconditions:
    - model loads successfully
    - properties.len() > 0
    postconditions:
    - report.tested == properties.len()
    - report.pass == report.failures.is_empty()
    lean_theorem: Theorems.ProbarPropertyTests

kernel_structure:
  phases:
  - name: validate_input
    description: Validate model path, load configuration, initialize QA gates
  - name: execute
    description: Run check stages, QA gates, lint rules, and property tests
  - name: verify_output
    description: Aggregate results, compute scores, generate reports

proof_obligations:
- type: invariant
  property: Check is read-only
  formal: hash(file_before) == hash(file_after) for check(file)
  applies_to: model_integrity_check
  lean:
    theorem: Theorems.ModelIntegrityCheck
    status: sorry
- type: postcondition
  property: QA gate composition score
  formal: report.score == passed_count / enabled_count
  tolerance: 1e-6
  applies_to: qa_gate_composition
  lean:
    theorem: Theorems.QaGateComposition
    status: sorry
- type: determinism
  property: Check is deterministic
  formal: check(path) == check(path) for all valid paths
  applies_to: model_integrity_check
  lean:
    theorem: Theorems.ModelIntegrityCheckDeterminism
    status: sorry
- type: invariant
  property: Canary detects regression
  formal: baseline_after == baseline_before for canary(model, baseline)
  applies_to: canary_regression_detection
  lean:
    theorem: Theorems.CanaryRegressionDetection
    status: sorry
- type: postcondition
  property: Lint findings deduplicated
  formal: no two findings have same (rule, location) pair
  applies_to: lint_model_conventions
  lean:
    theorem: Theorems.LintModelConventions
    status: sorry
- type: completeness
  property: Probar tests all properties
  formal: report.tested == properties.len()
  applies_to: probar_property_tests
  lean:
    theorem: Theorems.ProbarPropertyTests
    status: sorry
- type: postcondition
  property: Golden Output ship-blocker promotes skipped to failed
  formal: |
    forall g in gates: g.name == "golden_output" && g.skipped (before)
      && config.require_golden_output
      => !g.passed && !g.skipped (after)
  applies_to: golden_output_ship_blocker
  lean:
    theorem: Theorems.GoldenOutputShipBlocker
    status: sorry
- type: invariant
  property: Golden Output ship-blocker is scope-limited
  formal: |
    forall g in gates: g.name != "golden_output"
      => g (after) == g (before)
  applies_to: golden_output_ship_blocker
  lean:
    theorem: Theorems.GoldenOutputShipBlockerScope
    status: sorry
- type: idempotency
  property: Golden Output ship-blocker is idempotent
  formal: promote(promote(gates, c), c) == promote(gates, c)
  applies_to: golden_output_ship_blocker
  lean:
    theorem: Theorems.GoldenOutputShipBlockerIdempotent
    status: sorry

falsification_tests:
- id: FALSIFY-QA-001
  rule: Check is read-only
  prediction: SHA-256 of model file unchanged after `apr check`
  test: Hash file, run check, hash again
  if_fails: Check writes metadata or fixes back to model file
- id: FALSIFY-QA-002
  rule: QA gate composition score
  prediction: 3/4 gates passing → score == 0.75
  test: Configure 4 gates, make 1 fail, verify score
  if_fails: Score calculation off-by-one or counts disabled gates
- id: FALSIFY-QA-003
  rule: Canary detects regression
  prediction: Modified model fails canary against original baseline
  test: Capture baseline, quantize model, run canary, expect regression
  if_fails: Canary comparison too lenient or ignores token-level changes
- id: FALSIFY-QA-004
  rule: Lint findings deduplicated
  prediction: Model with 1 naming violation produces exactly 1 finding
  test: Lint model, count findings for same rule+tensor
  if_fails: Same finding emitted multiple times (per-layer duplication)
- id: FALSIFY-QA-005
  rule: Probar tests all properties
  prediction: Requesting 5 properties yields report.tested == 5
  test: Run probar with 5 properties, check report
  if_fails: Some properties silently skipped on error
- id: FALSIFY-QA-006
  rule: Check is deterministic
  prediction: Running check twice on same model produces identical reports
  test: Run check twice, diff JSON outputs
  if_fails: Non-deterministic metadata or timestamp in report
- id: FALSIFY-EX-001
  rule: Golden Output is a hard ship-blocker under --require-golden-output
  prediction: |
    `apr qa --require-golden-output <bad-model>` exits non-zero when the
    model produces garbage output, even if all other gates pass. A
    SKIPPED golden_output gate (tokenizer missing, feature off) also
    produces a non-zero exit — it cannot silently pass.
  test: |
    1. Given a model that emits garbage tokens, run
       `apr qa --require-golden-output model.apr` and assert exit != 0.
    2. Given any model, run `apr qa --require-golden-output
       --skip-golden model.apr` and assert the golden_output gate is
       not skipped (override behavior) and the command fails if the
       gate would skip silently.
    3. Given a passing model, same command exits 0.
    Regression harnesses: promote_golden_output_skipped_becomes_failed_when_required,
    promote_golden_output_noop_when_flag_off,
    promote_golden_output_already_failed_stays_failed,
    promote_golden_output_passed_stays_passed,
    promote_golden_output_does_not_touch_other_gates
    (qa_tests_report_pass_fail.rs).
  if_fails: |
    A garbage checkpoint can ship — the MODEL-1 2026-04-17 falsification
    (qwen2.5-coder-7b-distilled-v2-q4k.apr emitting "ylkoylko...") is
    repeatable. Forbid merging any release-blocking PR until fixed.
  spec_reference: ship-two-models-spec.md §12.1, §12.5
  ship_blocking: true

kani_harnesses:
- id: KANI-QA-001
  obligation: Check is read-only
  property: hash(file_before) == hash(file_after) for check(file)
  bound: 8
  strategy: exhaustive
  harness: verify_check_readonly
- id: KANI-QA-002
  obligation: QA gate composition is correct
  property: score == passed / enabled
  bound: 8
  strategy: exhaustive
  harness: verify_qa_score
- id: KANI-QA-003
  obligation: Check is deterministic
  property: check(path) == check(path)
  bound: 4
  strategy: exhaustive
  harness: verify_check_deterministic
- id: KANI-QA-004
  obligation: Canary baseline is immutable
  property: baseline_after == baseline_before for canary(model, baseline)
  bound: 4
  strategy: exhaustive
  harness: verify_canary_baseline_immutable
- id: KANI-QA-005
  obligation: Lint findings are deduplicated
  property: no duplicate (rule, location) pairs
  bound: 16
  strategy: exhaustive
  harness: verify_lint_dedup
- id: KANI-QA-006
  obligation: Probar tests all requested properties
  property: tested == requested
  bound: 8
  strategy: exhaustive
  harness: verify_probar_completeness
- id: KANI-EX-001
  obligation: Golden Output ship-blocker promotes skipped to failed
  property: |
    require_golden_output && golden_output.skipped (before)
      => !golden_output.passed && !golden_output.skipped (after)
  bound: 4
  strategy: exhaustive
  harness: verify_golden_output_ship_blocker
- id: KANI-EX-002
  obligation: Golden Output ship-blocker is scope-limited
  property: non-golden-output gates are unchanged
  bound: 4
  strategy: exhaustive
  harness: verify_golden_output_ship_blocker_scope

qa_gate:
  id: F-QA-GATE
  name: Model QA Contract
  description: Quality gate for check, qa, lint, probar, canary
  checks:
  - validation
  - falsification
  pass_criteria: All 7 falsification tests pass (including FALSIFY-EX-001)
