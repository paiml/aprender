      disposition: enforced
      rung: 4
      checked_by: 'aprender-core ModernBertConfig::from_json_bytes (UnsupportedActivation / UnsupportedRope), reached at rung 4 (b) (ea940faec)'
      refusal: [ConfigBlob]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept && cargo test -p aprender-core --lib models::modernbert::config::tests::unsupported_forward_semantics_are_refused'
    - id: encoder_dims
      bound: 'vocab_size, hidden_size, intermediate_size, heads > 0; the products vocab x d, 3 x d x d and 2 x intermediate x d fit usize; every weight stored at EXACTLY its config shape'
      disposition: enforced
      rung: 6
      checked_by: 'aprender-core ModernBertConfig::from_json_bytes (ZeroDimension / DimensionOverflow) and load_tensor (shape compared, then size, BEFORE any widening allocation); rung 4 (c) already bounds every stored entry by the file, so a config dimension cannot size an allocation the file does not hold'
