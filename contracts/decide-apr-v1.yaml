contract: decide-apr
metadata:
  version: 3.0.0
  created: '2026-09-25'
  author: PAIML Engineering
  kind: kernel
  # ONT-7 (plan 08-33): the artifact schema and its load ladder hold in the committed tree; no
  # backend, host or feature qualifies the claim.
  valid_under:
    world: committed
  description: >
    The `decide-apr-v1` ARTIFACT SCHEMA (D-17) and the single declaration of the D-05 task schema:
    what a decision-model .apr contains, where each item lives, what a loader must check — in
    order — before it may classify, how the artifact is identified (D-11), which bytes are
    deterministic, and what makes an artifact DEPLOYABLE. Implemented by `aprender-decide`
    (`task`, `artifact`, `verify`) and read by both decision MCP servers; the Python trainer
    writes the task and training rows to the same schema. One schema, written down once, BEFORE
    the code that implements it (the setfit-apr-v1 lesson: three plans describing an artifact
    three ways because no plan wrote it down).

    WHY F16 ON DISK, F32 IN COMPUTE. The artifact stores the checkpoint's F16 weights as the raw
    little-endian bytes copied from the safetensors file — never re-rounded through f32 — and the
    loader widens them to f32 at load (`AprV2DequantExt::get_tensor_as_f32`). That is exactly the
    widening the parity oracle performs (laya-parity-v1), so parity is a statement about
    computation, not about storage precision.

    THE LABEL INDEX IS DOCUMENT ORDER (D-05), AND THAT IS A PARSING RULE, NOT A HOPE. pmcp 2.19.3
    enables `serde_json/preserve_order` for every binary that links it, while a library tested
    alone gets key-sorted maps (RESEARCH Pitfall 2). A task parsed through `serde_json::Value` or
    `Map` therefore has a build-graph-dependent label order. Criteria are read from the raw bytes
    with an order-preserving map visitor, and the manifest stores labels as an ARRAY, so the order
    holds in every build shape.

    PROBES DO NOT DEPEND ON THE USER'S TASK OR ON THE PACKING MACHINE. Probes run through a
    contract-resident SYNTHETIC PROBE TASK (K = 2), so their cost is bounded by construction
    (`probe_max_row_tokens`, which prices decide-tool-boundary-v1 `probe_budget_ms`); a stance task's
    own prefix is ~55 built tokens before any state (spike-025 fixture markers at 17/32/43), so a
    task-bound probe could not meet a 48-token bound. The stored expectations are the ones Laya's
    OWN predict path computed on the F16 reload (`probes.json`), never the packer's Rust values, so
    the artifact bytes do not depend on the packing machine's floating-point kernels.

    PROVABILITY HONESTY. `cargo-kani` is not installed in this repository and there is not one
    `#[kani::proof]` harness anywhere under `crates/`. The `kani_harnesses:` entries are DECLARED and
    NOT EXECUTED; each names the runnable test that is the actual evidence.

    ANNOTATION HONESTY. `#[contract]` is METADATA-ONLY in this repository (see setfit-apr-v1). The
    enforcement mechanism for everything below is the named test, never the annotation.

    BINDING HONESTY, AND STAGED TEST REFERENCES. Every equation is registered `status: pending` in
    `contracts/aprender/binding.yaml` because `aprender-decide` does not exist yet; each binding is
    flipped by the plan that lands its code. No falsification test cites a test that does not exist
    yet (CI's strict-binding gate starts a new contract at zero): each carries a prose
    `implemented_by:`, and the implementing plan adds its `test:` line in the same commit as the test.
  references:
    - 'contracts/setfit-apr-v1.yaml — the APR artifact-schema precedent: one custom metadata key, head as tensors, bounded read, load ladder, probe replay.'
    - 'crates/apr-format/src/v2/ — the APR v2 container: 64-byte header whose CRC covers ONLY the header (header_impl.rs compute_checksum), flattened `custom` metadata map, TensorDType F16 = 1 / F32 = 0 / U8 = 7 (tensor_index_impl.rs), and the index parser (reader_impl.rs:95) that reserved Vec::with_capacity(tensor_count) straight from the header.'
    - '.claude/skills/spike-findings-aprender/references/laya-rust-inference.md — the builder (option shrink, markers, max_len 512, head_max_len 192) and the four published Laya files.'
    - '.claude/skills/spike-findings-aprender/sources/026-laya-mcp-default-lambda/src/lib.rs — render_options and the marker-count refusal (markers.len() != opts.len(), lib.rs:233).'
    - 'contracts/laya-finetune-gate-v1.yaml — the run dir this artifact is packed from, recipe_id, gate report and probes.json schemas.'
    - 'contracts/laya-parity-v1.yaml — pack_rescore_probs_abs, the full-eval parity run at pack and verify time.'
    - 'contracts/tensor-layout-v1.yaml — row-major for every tensor written here.'
  depends_on:
    - laya-finetune-gate-v1
    - laya-parity-v1

# FLAT scalars only (the decide-tool-boundary-v1 rule). The schemas, manifest map, blob set,
# load ladder, probe task/inputs and deploy_eligibility are TOP-LEVEL keys below.
constants:
  # 1.25 GiB. Derivation: ~421M parameters x 2 bytes F16 = ~843 MB + 3.4 MB tokenizer +
  # configs / task / recipe / gate blobs + index ~= 0.85 GB measured on Laya-en. The setfit-apr-v1
  # 1 GiB cap would leave only ~1.26x headroom and is NOT inherited silently.
  max_artifact_bytes: 1342177280
  # Laya-en has a few hundred weight tensors (205 in the published checkpoint) plus six blobs. The
  # bound is generous and exists so a header cannot demand an arbitrary index allocation.
  max_tensor_count: 4096
  # The metadata section is the manifest (~2.4 KB on Laya-en). The container reader parses the
  # header-declared section into a JSON tree at 40-50x its size, so rung 2 bounds the declared
  # length before the reader runs: 1 MiB is ~400x headroom and caps that parse near 50 MB.
  max_metadata_bytes: 1048576
  # A probe row longer than this is refused at pack: it would break decide-tool-boundary-v1
  # probe_budget_ms (2 x 48 x 11 ms = 1056 -> 1100).
  probe_max_row_tokens: 48
  probe_probabilities_abs: 1.0e-5
  # The smallest encodable tensor-index entry: u16 name length + u8 dtype + u8 ndim + u64 offset
  # + u64 size = 20 bytes. Rung 2 bounds tensor_count x this by the index extent.
  min_index_entry_bytes: 20
  # The most criteria a task.json may declare (task::MAX_CRITERIA; refused while the criteria
  # object is read, before the entry is stored or compared: V1-b). Derivation, from the builder
  # (laya::builder, Laya common.py build_sequence): every option's [MASK] marker occupies its OWN
  # row position; position 0 is [CLS] and the head's closing [SEP] sits at position >= 1, so the
  # first marker is at >= 2; only markers below max_len survive. A task with K > max_len - 2
  # therefore loses a marker under ANY tokenizer, and is refused at load anyway (marker_rule).
  # Over Laya-en's max_len 512 (the only served agent config): 512 - 2 = 510.
  # NOT max_len / 4: the shrink cuts each option to max(4, (head_max_len - 16) / K) tokens but
  # never lengthens a shorter one, so an option can keep 2 tokens ([MASK] + a one-token name).
  # Measured on Laya-en's tokenizer (snapshot 55cf4c4e, max_len 512, head_max_len 192, plan
  # 08-26): one-token names keep every marker up to K = 253 and lose one from K = 254; options
  # of >= 4 tokens keep every marker up to K = 127. A bound of 128 would refuse K = 129..253
  # tasks Laya serves. An artifact whose agent declares a larger max_len does not raise this
  # bound: it is a constant on the task blob.
  max_criteria: 510
  schema_version: 1

# ---------------------------------------------------------------------------------------------
# D-05: the task schema, declared once, shared by trainer, artifact and server.
# ---------------------------------------------------------------------------------------------
task_json_schema:
  shape: '{type: "choice", instructions: string, criteria: object}, deny_unknown_fields'
  criteria: 'object whose DOCUMENT ORDER is the label index; names unique (found with a set: the duplicate scan is linear); at least 2 and at most max_criteria; each value a string or null (null or empty = name only)'
  parse_rule: 'criteria are read from the raw bytes with an order-preserving map visitor, NEVER via serde_json::Value / Map (pmcp 2.19.3 enables serde_json/preserve_order for every binary linking it while a library tested alone gets key-sorted maps — RESEARCH Pitfall 2). This is how "order is the label index" holds in every build shape'
  refusals:
    - 'type other than "choice"'
    - 'fewer than 2 criteria'
    - 'more than max_criteria criteria (refused while reading: the entry that would exceed the bound is refused before it is stored or compared, and the parse stops; TaskError::TooManyCriteria)'
    - 'a duplicate criterion name'
    - 'MARKER LOSS: the built row keeps FEWER [MASK] markers than the task has criteria'
  marker_rule: 'Laya''s builder first SHRINKS option token sequences to fit head_max_len (common.py build_sequence: when the option budget falls below 16 each option is cut to max(4, (head_max_len - 16) / K) tokens) and keeps only markers below max_len. A task is refused ONLY when the built row keeps fewer markers than criteria — the exact spike-026 rule (markers.len() != opts.len(), lib.rs:233). Options that are merely longer than head_max_len are SHRUNK exactly as Laya does and SERVED, never refused: refusing on raw option length would reject tasks the reference serves, changing observable inference semantics'
  when_checked: 'once, when the task is loaded, by building the row with an EMPTY state: markers precede the state, so marker loss does not depend on the caller''s text and is never re-checked per request'

train_row_schema:
  shape: '{text: string, label: string}, one JSON object per line of train.jsonl / eval.jsonl, deny_unknown_fields'
  label: 'a criterion NAME, never an index (RESEARCH Open Q3: an index silently re-means under a criteria reorder, contradicting the order-as-index rule); an unknown name is refused'

# ---------------------------------------------------------------------------------------------
# The artifact.
# ---------------------------------------------------------------------------------------------
manifest:
  storage: 'the STRING value of EXACTLY ONE custom metadata key `decide`; the string is the JSON serialization of typed Rust structs (arrays, never maps keyed by label), so its bytes do not depend on the serde_json map backing'
  model_type: decide
  fields:
    schema: 'string: "decide-apr-v1"'
    schema_version: 'integer: 1'
    method: 'string: "laya" (the only method this version knows)'
    variant: 'string: the recipe variant ("production" | "synthetic-fixture"), copied from recipe.json so every reader sees it; deployability is deploy_eligibility (08-09 verify), never this field'
    base: 'object {family, checkpoint, repo, revision, sha256} — D-04 declared base'
    labels: 'ARRAY of criterion names in task.json document order'
    agent: 'object {head_layers, max_len, head_max_len}'
    blobs: 'array of {name, sha256} in blob_tensors order — an ARRAY, not a map keyed by blob name, so the manifest bytes do not depend on the serde_json map backing'
    recipe_id: 'string: sha256 hex of the decide.recipe_json blob bytes'
    calibration: 'object {bucket, t_fitted, t_applied, clamp_hit, slice_ids_sha256}'
    gate: 'object {pass, margin, ece_post, report_sha256}'
    inputs_sha256: 'object {task_json, train_jsonl, eval_jsonl, base_model, tokenizer_json}'
    device_used: string
    probes: 'array of {input_index, tokens, label, probabilities_f32_hex[]} — copied from probes.json (Python values)'
  no_timestamp: 'no timestamp or host field anywhere: two packs of the same inputs are byte-identical'
  # CLASS A (provenance binding, LOAD side; plan 08-19). Every manifest leaf equals a value
  # derived from a sha-bound source, checked by the load ladder on EVERY door (load_bytes,
  # load_hashed = the Lambda cold start, load_path = the stdio server), with no verify step.
  # Key: the leaf as a JSON pointer, array indices generalised to [*]. `rung`: the rung that
  # refuses a manifest whose leaf disagrees with its source. `sources`: each comparison the
  # leaf takes part in — `recipe:<ptr>` a field of the decide.recipe_json blob, `report:<ptr>`
  # a field of the decide.gate_report_json blob, `sha256:<blob>` the digest of that blob,
  # `derived:<what>` a value computed from sha-bound inputs. `source`: the same, in prose.
  bindings:
    '/schema':
      rung: 3
      sources: ['derived:the rung-3 constant schema == decide-apr-v1']
      source: 'rung-3 constant ARTIFACT_SCHEMA'
    '/schema_version':
      rung: 3
      sources: ['derived:the rung-3 constant schema_version == 1']
      source: 'rung-3 constant ARTIFACT_SCHEMA_VERSION'
    '/method':
      rung: 3
      sources: ['derived:the rung-3 constant method in {laya}']
      source: 'rung-3 constant METHOD_LAYA'
    '/variant':
      rung: 4
      sources: ['recipe:/variant']
      source: 'decide.recipe_json blob variant'
    '/base/family':
      rung: 4
      sources: ['recipe:/base/family']
      source: 'decide.recipe_json blob base.family'
    '/base/checkpoint':
      rung: 4
      sources: ['recipe:/base/checkpoint']
      source: 'decide.recipe_json blob base.checkpoint'
    '/base/repo':
      rung: 4
      sources: ['recipe:/base/repo']
      source: 'decide.recipe_json blob base.repo'
    '/base/revision':
      rung: 4
      sources: ['recipe:/base/revision']
      source: 'decide.recipe_json blob base.revision'
    '/base/sha256':
      rung: 4
      sources: ['recipe:/base/sha256', 'report:/inputs_sha256/base_model']
      source: 'decide.recipe_json blob base.sha256 AND decide.gate_report_json inputs_sha256.base_model'
    '/labels/[*]':
      rung: 4
      sources: ['derived:the decide.task_json blob criteria in document order']
      source: 'labels parsed from the decide.task_json blob (D-05)'
    '/agent/head_layers':
      rung: 4
      sources: ['derived:the decide.agent_config blob head_layers']
      source: 'decide.agent_config blob'
    '/agent/max_len':
      rung: 4
      sources: ['derived:the decide.agent_config blob max_len']
      source: 'decide.agent_config blob'
    '/agent/head_max_len':
      rung: 4
      sources: ['derived:the decide.agent_config blob head_max_len']
      source: 'decide.agent_config blob'
    '/blobs/[*]/name':
      rung: 4
      sources: ['derived:blob_tensors, in order']
      source: 'the contract blob_tensors list'
    '/blobs/[*]/sha256':
      rung: 4
      sources: ['derived:the sha256 of the blob tensor the entry names']
      source: 'sha256 of the named blob tensor''s bytes'
    '/recipe_id':
      rung: 4
      sources: ['sha256:decide.recipe_json', 'report:/recipe_id']
      source: 'sha256 of the decide.recipe_json blob AND decide.gate_report_json recipe_id'
    '/calibration/bucket':
      rung: 4
      sources: ['report:/calibration/bucket', 'derived:bucket_key(choice, K of the decide.task_json blob)']
      source: 'decide.gate_report_json calibration.bucket AND the task''s own bucket key'
    '/calibration/t_fitted':
      rung: 4
      sources: ['report:/calibration/t_fitted']
      source: 'decide.gate_report_json calibration.t_fitted'
    '/calibration/t_applied':
      rung: 4
      sources: ['report:/calibration/t_applied', 'derived:applied_temperature_f64(the decide.agent_config blob, choice, K of the decide.task_json blob)']
      source: 'decide.gate_report_json calibration.t_applied AND applied temperature of the agent config blob for the task bucket (bit for bit: the temperature the loaded model applies)'
    '/calibration/clamp_hit':
      rung: 4
      sources: ['report:/calibration/clamp_hit']
      source: 'decide.gate_report_json calibration.clamp_hit'
    '/calibration/slice_ids_sha256':
      rung: 4
      sources: ['report:/calibration/slice_ids_sha256']
      source: 'decide.gate_report_json calibration.slice_ids_sha256'
    '/gate/pass':
      rung: 4
      sources: ['report:/pass']
      source: 'decide.gate_report_json pass'
    '/gate/margin':
      rung: 4
      sources: ['report:/margin']
      source: 'decide.gate_report_json margin (f64 bits)'
    '/gate/ece_post':
      rung: 4
      sources: ['report:/fine_tuned/ece_post']
      source: 'decide.gate_report_json fine_tuned.ece_post (f64 bits)'
    '/gate/report_sha256':
      rung: 4
      sources: ['sha256:decide.gate_report_json']
      source: 'sha256 of the decide.gate_report_json blob'
    '/inputs_sha256/task_json':
      rung: 4
      sources: ['sha256:decide.task_json', 'report:/inputs_sha256/task_json']
      source: 'sha256 of the decide.task_json blob AND decide.gate_report_json inputs_sha256.task_json'
    '/inputs_sha256/train_jsonl':
      rung: 4
      sources: ['report:/inputs_sha256/train_jsonl']
      source: 'decide.gate_report_json inputs_sha256.train_jsonl'
    '/inputs_sha256/eval_jsonl':
      rung: 4
      sources: ['report:/inputs_sha256/eval_jsonl']
      source: 'decide.gate_report_json inputs_sha256.eval_jsonl'
    '/inputs_sha256/base_model':
      rung: 4
      sources: ['report:/inputs_sha256/base_model']
      source: 'decide.gate_report_json inputs_sha256.base_model'
    '/inputs_sha256/tokenizer_json':
      rung: 4
      sources: ['sha256:tokenizer.blob', 'report:/inputs_sha256/tokenizer_json']
      source: 'sha256 of the tokenizer.blob blob AND decide.gate_report_json inputs_sha256.tokenizer_json'
    '/device_used':
      rung: 4
      sources: ['report:/device_used']
      source: 'decide.gate_report_json device_used'
    '/probes/[*]/input_index':
      rung: 7
      sources: ['derived:rung-7 replay against the rebuilt model']
      source: 'rung-7 probe replay (input order)'
    '/probes/[*]/tokens':
      rung: 7
      sources: ['derived:rung-7 replay against the rebuilt model']
      source: 'rung-7 probe replay (built-row length)'
    '/probes/[*]/label':
      rung: 7
      sources: ['derived:rung-7 replay against the rebuilt model']
      source: 'rung-7 probe replay (label exact)'
    '/probes/[*]/probabilities_f32_hex/[*]':
      rung: 7
      sources: ['derived:rung-7 replay against the rebuilt model']
      source: 'rung-7 probe replay within probe_probabilities_abs'

blob_tensors:
  # U8 tensors, raw bytes, sha256 recorded in manifest.blobs, verified BEFORE any weight is installed.
  - tokenizer.blob
  - decide.task_json
  - decide.encoder_config
  - decide.agent_config
  - decide.recipe_json
  - decide.gate_report_json

weight_tensors:
  names: 'every checkpoint tensor under its VERBATIM Laya name'
  dtype: 'F16 raw little-endian bytes copied from model.safetensors (never re-rounded through f32); the `temperature` buffer stays F32'
  act_head: 'act_head.* tensors are stored so the tensor set is a bijection with the checkpoint, and are unused at inference'
  layout: 'row-major ([out, in]) per contracts/tensor-layout-v1.yaml'

identity:
  # D-11
  artifact_sha256: 'sha256 of the WHOLE .apr file bytes'
  recipe_id: 'sha256 of the decide.recipe_json blob bytes (== the run dir recipe.json bytes)'
  note: 'the APR v2 header CRC covers ONLY the 64-byte header, so payload integrity comes from the whole-file sha256 plus the per-blob hashes, never from the CRC'

load_ladder:
  # In order. Each rung is a typed refusal naming the rung. The verified decider is minted only
  # at the end.
  rungs:
    - rung: 1
      name: bounded_read
      rule: 'declared length checked against max_artifact_bytes before the reader is touched; the read is capped at max_artifact_bytes + 1 bytes'
    - rung: 2
      name: header_and_index_extent
      rule: 'AprV2Header::from_bytes on the first 64 bytes BEFORE any index parser runs: magic, CRC, version == APR v2 (apr-format VERSION_V2 = 2.0; the container reader parses any version with the v2 layout, so rung 2 checks it: V9-d), row-major flag; metadata_size <= max_metadata_bytes (the reader parses the declared section into a JSON tree); then tensor_count <= max_tensor_count AND, with checked arithmetic, tensor_count x min_index_entry_bytes <= data_offset - tensor_index_offset <= file length. Review finding verified at crates/apr-format/src/v2/reader_impl.rs:95: the reader reserved the index vector at the header''s declared count, so a small file with a valid header CRC could request a multi-hundred-GB allocation before any structural rung ran. Plan 08-05 also caps the reader''s capacity at what the index bytes can hold, for every APR consumer; this rung stays as the decide-specific bound'
    - rung: 3
      name: manifest
      rule: 'model_type == "decide"; exactly one custom key; the manifest string parsed with deny_unknown_fields; schema_version == 1; method known'
    - rung: 4
      name: structural
      rule: 'every tensor-index name unique, checked with a set BEFORE any lookup by name (DuplicateTensor, WR-01 decide side; the apr-format reader also refuses a repeat at rung 3, plan 08-20); tensor set derived from the encoder config + agent config (names, dtype, per-entry byte size == product(shape) x dtype width); every blob sha256 matches manifest.blobs; task.json re-parsed and its labels equal manifest.labels; and every manifest field equals the value of the sha-bound source manifest.bindings names (base and variant: the recipe blob), refused as ManifestDisagreesWithBlob naming the field'
    - rung: 5
      name: non_finite_scan
      rule: 'every widened weight is finite'
    - rung: 6
      name: rebuild
      rule: 'F16 widened to f32 through AprV2DequantExt::get_tensor_as_f32; the model is built'
    - rung: 7
      name: probe_replay
      rule: 'every stored probe replayed; probabilities within probe_probabilities_abs (NaN-visible within), label exact; a classify failure DURING replay (the rebuilt model''s first forward pass) is a rung-7 refusal (ProbeReplay), never rung 6''s (V9-b)'
    - rung: 8
      name: mint
      rule: 'the verified decider is minted by a private constructor reachable ONLY through this ladder; a trybuild compile-fail test proves no second minting path'

  reader: 'the zero-copy AprV2ReaderRef; AprV2Reader::from_bytes copies and would hold a second ~0.85 GB'

probe_policy:
  probe_task:
    type: choice
    instructions: "probe"
    criteria: {"yes": null, "no": null}
    k: 2
    bucket: 'choice:2'
  probe_task_literal: '{type: "choice", instructions: "probe", criteria: {"yes": null, "no": null}}'
  inputs:
    # Exactly two, contract-resident, SYNTHETIC — never sampled from any dataset, so no tweet text
    # reaches any artifact.
    - 'the quick brown fox jumps over the lazy dog'
    - 'Stance check: I firmly support this position!!! #debate @user123'
  expectations: 'the probabilities Laya''s OWN predict path computed on the F16 reload (run dir probes.json, laya-finetune-gate-v1 probes_json_schema), recorded as f32 bit-pattern hex'
  pack_rule: 'the packer runs its Rust probe, checks it against probes.json within probe_probabilities_abs (label exact), refuses a probe row longer than probe_max_row_tokens, and stores the PYTHON values, never its own — the artifact bytes do not depend on the packing machine''s floating-point kernels (NEON on the dev box and AVX on x86 CI can differ in the last bits)'
  load_rule: 'every load replays both probes and compares the Rust result to the stored Python values within probe_probabilities_abs with the NaN-visible within idiom; label exact'
  full_eval: 'full-eval parity runs at PACK and VERIFY time (laya-parity-v1 pack_rescore_probs_abs), not at every load'

deploy_eligibility:
  rule: 'an artifact is deployable ONLY when `pack_laya verify <apr> --run <dir> --data <dir> --base <dir>` (plan 08-09) accepts that exact file'
  verify_checks:
    - 'the full load ladder'
    - 'recipe variant == production (laya-finetune-gate-v1 synthetic_not_deployable)'
    - '(load, every door) the manifest''s base equals the embedded recipe blob''s base, field by field (rung 4, manifest.bindings); (verify, check_base, plan 08-21) the recipe''s base equals the laya-finetune-gate-v1 base block field by field (family, checkpoint, repo, revision, then sha256) and the base dir''s model.safetensors hashes to that sha256; (verify, the zero-shot load) the base dir''s encoder/config.json, rl_agent_config.json and tokenizer/tokenizer.json hash to that block''s pins on the exact bytes the baseline is built from, and the tokenizer also to inputs_sha256.tokenizer_json'
    - 'data-dir hashes equal to the manifest''s inputs_sha256'
    - 'split re-verification (laya-finetune-gate-v1 split_disjointness)'
    - 'Rust re-score of every eval row — fine-tuned from the artifact, zero-shot from the base — within the noise-referenced bound(c, s) of laya-parity-v1 pack_rescore_probs_abs (floor 1.0e-5 when the run carries no rescore-noise.json record)'
    - 'the gate recomputed from those verified probabilities (laya-finetune-gate-v1 gate_pass)'
    - 'the seed-selection rule re-derived from the per-seed probability files (laya-finetune-gate-v1 seed_policy, 1.4.0)'
  inspect: '`inspect` reports identity only; embedded report fields alone NEVER make an artifact eligible'

# ---------------------------------------------------------------------------------------------
# CLASS B (untrusted-input bounds), ARTIFACT HALF (plan 08-26). Every size, count or config value a
# decide-apr-v1 artifact supplies that sizes an allocation, a loop, a scan or a forward pass, with
# the bound that is checked BEFORE it does. Enumerated by inspection of the ladder (artifact.rs),
# core's ModernBERT config / loader / layer, the task parser (task.rs) and the row builder
# (laya/builder.rs). `disposition`: enforced (a hostile case is refused, or the value is
# overridden) or accepted (with the reason and the behaviour the sweep asserts). `owner_crate`: the
# crate whose code enforces it; rows owned by aprender-decide are swept, by id, by
# artifact::ladder::artifact_bounds_table_is_swept (a hostile case built from the packed tiny
# artifact, refused with `refusal` at `rung`); rows owned by another crate name a test that must
# exist in that crate (plan 08-31's ledger proves it runs).
# ---------------------------------------------------------------------------------------------
untrusted_input_bounds:
  see_also: 'decide-tool-boundary-v1 untrusted_input_bounds: the REQUEST half (frame, argument shape, text count, text bytes, built-token budget), plans 08-23 / 08-24. This table is the ARTIFACT half: what a .apr file supplies.'
  rows:
    - id: file_length
      bound: max_artifact_bytes
      disposition: enforced
      rung: 1
      checked_by: 'artifact::read_bounded_within (declared length before the reader is touched; the read capped at cap + 1) and open_within (in-memory input_bytes)'
      refusal: [ArtifactTooLarge]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::declared_length_over_cap && cargo test -p aprender-decide --lib artifact::ladder::read_over_cap && cargo test -p aprender-decide --lib artifact::ladder::in_memory_over_cap'
    - id: header_version
      bound: 'APR v2 (apr-format VERSION_V2 = 2.0)'
      disposition: enforced
      rung: 2
      checked_by: 'artifact::rung2_header (the container reader parses any version with the v2 layout; V9-d)'
      refusal: [Header]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::header_version_refused'
    - id: metadata_size
      bound: max_metadata_bytes
      disposition: enforced
      rung: 2
