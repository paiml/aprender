      rung: 4
      checked_by: 'artifact::rung4_structure (c) check_dtype against the architecture-derived set'
      refusal: [DtypeMismatch]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: load_tensor_dtype
      bound: 'F16 / F32 only, payload EXACTLY product(shape) x width bytes'
      disposition: enforced
      rung: 6
      checked_by: 'aprender-core modernbert::load_tensor (ea940faec): defence in depth behind tensor_dtype for every caller of core''s loader'
      owner_crate: aprender-core
      test: 'cargo test -p aprender-core --lib models::modernbert::load::tests::refuses_foreign_dtype_and_truncated_payload'
    - id: tensor_entry_size
      bound: 'entry size == product(shape) x dtype width (checked arithmetic)'
      disposition: enforced
      rung: 4
      checked_by: 'artifact::check_size in rung4_structure (c)'
      refusal: [SizeMismatch]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::size_mismatch && cargo test -p aprender-decide --lib artifact::ladder::size_rule_exhaustive'
    - id: tensor_data_range
      bound: 'data_offset + entry offset + entry size inside the file (checked arithmetic)'
      disposition: enforced
      rung: 4
      checked_by: 'artifact::rung4_structure (a) and (c): get_tensor_data None -> DataOutOfBounds (the reader does not check data ranges at parse)'
      refusal: [DataOutOfBounds]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: tensor_name_set
      bound: 'the index name set == the architecture-derived set; the scan is O(expected x observed) with expected <= 6 x 1024 + 12 x 64 + 20 names (6 per encoder layer minus layer 0''s attn_norm, 12 per head layer, 3 embedding / final norms, 11 type_emb / scorer / act_head, temperature, 6 blobs; bounded by num_hidden_layers and head_layers) and observed <= max_tensor_count'
      disposition: enforced
      rung: 4
      checked_by: 'artifact::check_name_set in rung4_structure (b), after both layer counts are bounded'
      refusal: [MissingTensor, UnexpectedTensor]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::missing_tensor && cargo test -p aprender-decide --lib artifact::ladder::extra_tensor'
    - id: non_finite
      bound: 'every F16 / F32 weight finite'
      disposition: enforced
      rung: 5
      checked_by: 'artifact::rung5_finite on the raw bit patterns (no widening, no allocation)'
      refusal: [NonFiniteWeight]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::nan_weight'
    - id: criteria_count
      bound: max_criteria
      disposition: enforced
      rung: 4
      checked_by: 'task::OrderedCriteria visit_map (MAX_CRITERIA), while the criteria object is read and before the entry is stored or compared; duplicates found with a set (V1-b)'
      refusal: ['Task(TooManyCriteria']
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib task::tests::too_many_criteria_refused_while_reading && cargo test -p aprender-decide --lib task::tests::max_criteria_matches_contract'
    - id: probe_row_tokens
      bound: probe_max_row_tokens
      disposition: enforced
      rung: 7
      checked_by: 'artifact::run_probes: every probe row is BUILT and checked before any forward pass (plan 08-26), so the load-time replay, the only forward a load runs, is bounded whatever max_len or the tokenizer say; pack refuses the same row as ProbeRowOverBudget'
      refusal: [ProbeMismatch]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::probe_row_budget_checked_before_replay_forward && cargo test -p aprender-decide --lib artifact::ladder::probe_row_over_budget'
    - id: tokenizer_truncation_padding
      bound: 'none honoured: the tokenizer file''s truncation and padding blocks are disabled per call'
      disposition: enforced
      rung: 6
      checked_by: 'laya::builder::Builder::from_bytes (with_truncation(None), with_padding(None)); the builder is the only thing that truncates, and it reports it (D-12, V9-a)'
      refusal: none
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib laya::tests::tokenizer_truncation_and_padding_are_disabled && cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: inspect_read
      bound: max_artifact_bytes
      disposition: enforced
      rung: 'pack_laya inspect'
      checked_by: 'examples/pack_laya.rs cmd_inspect: read_decide_apr_bytes_bounded(file, Some(metadata length)), then inspect_manifest (rungs 1-4) (IN-02)'
      refusal: [ArtifactTooLarge]
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::declared_length_over_cap && cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: agent_max_len
      bound: 'max_len >= 1 (AgentConfig); no upper bound'
      disposition: accepted
      rung: 4
      checked_by: 'laya::AgentConfig::from_json_bytes (max_len > 0)'
      reason: 'max_len sizes no allocation and no forward before another bound applies. The builder uses it only in saturating arithmetic, take() and truncate(); every forward row is bounded first: the load-time replay by probe_max_row_tokens (probe_row_tokens, checked before the forward), served rows by decide-tool-boundary-v1 built_tokens_total (checked after one tokenization, before any forward). A larger max_len serves longer rows only inside those budgets'
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: agent_head_max_len
      bound: 'none'
      disposition: accepted
      rung: 4
      checked_by: 'laya::builder::Builder::prefix (saturating isize arithmetic)'
      reason: 'head_max_len only decides the option shrink and the head keep length: saturating arithmetic (to_isize), then take(); options are capped at 48 tokens each and K at max_criteria, so the prefix it shapes is bounded by those, not by head_max_len'
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: encoder_row_length
      bound: 'the caller''s row (core public API)'
      disposition: accepted
      rung: 7
      checked_by: 'aprender-core ModernBertEncoder::forward / ModernBertLayer::forward size by the caller''s ids (layer_row_length refuses empty and mis-sized rows)'
      reason: 'core''s public forward has no row cap of its own: the caller bounds the row. On the decide path every row is bounded before the forward: replay rows by probe_max_row_tokens (probe_row_tokens), served rows by decide-tool-boundary-v1 built_tokens_total, and every built row by the builder''s max_len truncate'
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: layer_row_length
      bound: 'l >= 1 and x.len() == l x d (checked multiply), before RopeTable::new'
      disposition: enforced
      rung: 7
      checked_by: 'aprender-core ModernBertLayer::forward / forward_with_rope (WR-04 / V10-b, plan 08-20)'
      owner_crate: aprender-core
      test: 'cargo test -p aprender-core --lib models::modernbert::layer::tests::layer_forward_empty_row_is_refused && cargo test -p aprender-core --lib models::modernbert::layer::tests::layer_forward_huge_l_is_refused_before_rope && cargo test -p aprender-core --lib models::modernbert::layer::tests::layer_forward_with_rope_empty_row_is_refused'
    - id: token_ids
      bound: 'every id < vocab_size'
      disposition: enforced
      rung: 7
      checked_by: 'aprender-core ModernBertEmbeddings::forward (OutOfVocab, never an index panic); at load the replay''s refusal is ProbeReplay at rung 7 (probe_replay_failure_is_rung_7)'
      owner_crate: aprender-core
      test: 'cargo test -p aprender-core --lib models::modernbert::tests::forward_refuses_out_of_vocab_and_empty && cargo test -p aprender-decide --lib artifact::ladder::probe_replay_failure_is_rung_7'
    - id: config_blob_parse
      bound: 'the blob''s bytes (<= max_artifact_bytes); nesting <= serde_json''s recursion limit (128)'
      disposition: accepted
      rung: 4
      checked_by: 'serde_json::from_slice for the encoder / agent config, task, recipe and gate-report blobs'
      reason: 'each JSON blob is parsed in time and memory linear in its bytes, which the file cap bounds; serde_json refuses nesting past its recursion limit as an error, not a stack overflow. No count inside them sizes further work except the rows above (layer counts, criteria, max_len / head_max_len)'
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: tokenizer_pipeline
      bound: 'the blob''s bytes (<= max_artifact_bytes); the pipeline itself unbounded by the ladder'
      disposition: accepted
      rung: 6
      checked_by: 'none in the ladder (HF tokenizers executes the blob''s normalizer / pre-tokenizer / model / added-token config); verify binds the blob to the pinned base tokenizer'
      reason: 'a tokenizer.json is configuration the tokenizers crate executes: a normalizer can declare an expanding replacement, and bounding that needs an allowlist of pipeline components the ladder does not have. Accepted because deployability binds it: verify requires the base dir''s tokenizer/tokenizer.json to hash to laya-finetune-gate-v1 base.tokenizer_json_sha256 and to inputs_sha256.tokenizer_json, which rung 4 binds to the tokenizer.blob digest, so a DEPLOYED artifact runs exactly Laya-en''s pinned tokenizer. An artifact that was never verified runs whatever tokenizer it carries'
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'
    - id: run_dir_files
      bound: 'none on the inputs; the packed product <= max_artifact_bytes'
      disposition: accepted
      rung: pack
      checked_by: 'pack::PackInputs::from_run_dir reads the operator''s run and data dirs; write_decide_apr refuses a packed artifact over the cap'
      reason: 'back office: the run dir, data dir and base dir are the operator''s own files on the operator''s machine (pack_laya pack / verify), never bytes a server receives. What pack WRITES is capped, so no artifact it produces can exceed what the load ladder accepts'
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::artifact_bounds_table_is_swept'

equations:

  task_order_is_label_index:
    formula: 'labels(parse_task(bytes)) == criteria names in document order of bytes, independent of the serde_json map backing'
    domain: 'task.json bytes (data dir, decide.task_json blob)'
    codomain: 'an ordered label list, or a typed refusal'
    invariants:
      - 'read with an order-preserving map visitor, never serde_json::Value / Map (Pitfall 2)'
      - 'refuses type != "choice", fewer than 2 criteria, more than max_criteria criteria (while reading), duplicate names, unknown fields'

  marker_preservation:
    formula: 'accept(task) iff len(markers(build_row(task, state = ""))) == K, where build_row applies Laya''s option shrink'
    domain: 'a parsed task and the artifact''s agent config (max_len, head_max_len)'
    codomain: 'a servable task, or a typed refusal naming the lost markers'
    invariants:
      - 'options longer than head_max_len are shrunk exactly as Laya does and served; only marker LOSS is refused (spike-026 lib.rs:233)'
      - 'checked once at task load; markers precede the state, so the caller''s text cannot change the outcome'

  single_manifest_key:
    formula: 'custom_keys(apr) == {"decide"} AND parse(custom["decide"]) under deny_unknown_fields AND schema_version == 1 AND method in {"laya"} AND model_type == "decide"'
    domain: 'the APR v2 metadata section'
    codomain: 'a typed manifest, or a rung-3 refusal'

  blob_integrity:
    formula: 'forall b in blob_tensors: sha256(bytes(b)) == manifest.blobs[b] AND dtype(b) == U8 AND forall leaf f in manifest.bindings: manifest[f] == source(f)'
    domain: 'the six blob tensors'
    codomain: 'verified blobs, before any weight is installed, and a manifest every leaf of which equals its sha-bound source; or a rung-4 refusal naming the blob or the manifest field (ManifestDisagreesWithBlob)'

  tensor_set_derived:
    formula: 'names(index) == expected_names(encoder_config, agent_config) ∪ blob_tensors AND forall e: e.size == product(e.shape) * width(e.dtype)'
    domain: 'the tensor index, after rung 3'
    codomain: 'a structurally valid index, or a rung-4 refusal naming the entry'
    invariants:
      - 'weights F16 except `temperature` (F32); blobs U8; act_head.* present though unused (bijection with the checkpoint)'

  bounded_read_and_index_extent:
    formula: 'declared_len <= max_artifact_bytes AND bytes_read <= max_artifact_bytes + 1 AND tensor_count <= max_tensor_count AND tensor_count * min_index_entry_bytes <= data_offset - tensor_index_offset <= file_len (checked arithmetic)'
    domain: 'any byte stream presented as a decide-apr-v1 artifact, including a hostile one'
    codomain: 'a bounded buffer and a header whose index extent is consistent, or a rung-1 / rung-2 refusal'
    invariants:
      - 'no allocation proportional to a header-declared count happens before this bound (reader_impl.rs:95 review finding)'
      - 'the + 1 distinguishes a legal artifact of exactly the cap from a truncated larger stream'

  probe_replay:
    formula: 'forall probe p in manifest.probes: within(|p_rust(probe_task, input_p) - p.stored|, probe_probabilities_abs) AND label_rust == p.label AND tokens_rust == p.tokens <= probe_max_row_tokens'
    domain: 'a rebuilt model at every load (rung 7) and at pack'
    codomain: 'agreement, or a typed ProbeMismatch naming the probe and component'
    invariants:
      - 'stored values are Python''s (probes.json), never the packer''s Rust values'
      - 'NaN-visible comparison: matches!(delta.partial_cmp(&bound), Some(Less | Equal))'

  artifact_identity:
    formula: 'artifact_sha256 = sha256(whole .apr bytes) AND recipe_id = sha256(decide.recipe_json blob bytes)'
    domain: 'a loaded artifact'
    codomain: 'the D-11 identity reported in every classify response'
    invariants:
      - 'the header CRC covers only the 64-byte header and is never used as an identity'

  determinism:
    formula: 'pack(inputs) in process A == pack(inputs) in process B, byte for byte, under both serde_json map backings'
    domain: 'the same run dir, data dir and base'
    codomain: 'byte-identical .apr files'
    invariants:
      - 'no timestamp, host or map-ordered field anywhere'
      - 'probe expectations are Python values, so the packing machine''s float kernels cannot move the bytes'

  size_cap:
    formula: 'len(apr) <= max_artifact_bytes, refused at cap + 1'
    domain: 'the packed file and any file presented to the loader'
    codomain: 'accept or a typed TooLarge refusal'
    invariants:
      - 'derived from the Laya-en tensor set (~0.85 GB), not inherited from setfit-apr-v1''s 1 GiB'

  private_mint:
    formula: 'the only path to a Decider value (aprender_decide::Decider, the verified decider) is load_verified (rungs 1..8), reached through Decider::load_bytes / Decider::load_path'
    domain: 'the aprender-decide public API'
    codomain: 'a compile-time guarantee'
    invariants:
      - 'a trybuild compile-fail test proves no second minting path'

  deploy_eligible:
    formula: 'deployable(apr) iff pack_laya_verify(apr, run, data, base) accepts that exact file'
    domain: 'a packed artifact plus its run dir, data dir and declared base'
    codomain: 'DeployEligible, or a typed refusal naming the failed check'
    invariants:
      - 'embedded report fields alone never make an artifact eligible; `inspect` reports identity only'
      - 'the check list is deploy_eligibility.verify_checks'

proof_obligations:

  - type: ordering
    property: 'Task criteria document order is the label index in every build shape'
    formal: '∀ bytes, backing in {preserve_order, sorted}: labels(parse_task_backing(bytes)) == document_order(bytes)'
    applies_to: all

  - type: bound
    property: 'No index allocation exceeds what the header''s index extent can hold'
    formal: '∀ header h accepted at rung 2: h.tensor_count ≤ max_tensor_count ∧ h.tensor_count * 20 ≤ h.data_offset - h.tensor_index_offset'
    applies_to: all

  - type: bound
    property: 'An artifact larger than max_artifact_bytes is refused before the reader allocates it'
    formal: '∀ stream: bytes_read ≤ max_artifact_bytes + 1'
    applies_to: all

  - type: determinism
    property: 'Packing is byte-deterministic across processes and map backings'
    formal: '∀ inputs: pack_A(inputs) == pack_B(inputs)'
    applies_to: all

  - type: roundtrip
    property: 'Pack then load recovers every tensor and blob exactly'
    formal: '∀ run: unpack(pack(run)).tensors == run.tensors ∧ unpack(pack(run)).blobs == run.blobs'
    applies_to: all

  - type: soundness
    property: 'A verified decider exists only after every rung passed'
    formal: '∀ d: VerifiedDecider ⇒ rungs_1_to_7_passed(d)'
    applies_to: all

falsification_tests:

  - id: FALSIFY-DECIDE-APR-001
    rule: 'Each load-ladder rung refuses its own induced negative, naming the rung'
    prediction: 'Header CRC flip, wrong model_type, two custom keys, an unknown manifest key, schema_version 2, an unknown method, a blob hash mismatch, a wrong tensor size, a NaN weight and a perturbed probe are each refused at their own rung.'
    implemented_by: 'plan 08-05 (aprender_decide::artifact ladder tests); the test: line is added in that plan''s commit'
    test: 'cargo test -p aprender-decide --lib artifact::ladder::header_crc_flip && cargo test -p aprender-decide --lib artifact::ladder::wrong_model_type && cargo test -p aprender-decide --lib artifact::ladder::two_custom_keys && cargo test -p aprender-decide --lib artifact::ladder::unknown_manifest_key && cargo test -p aprender-decide --lib artifact::ladder::schema_version_2 && cargo test -p aprender-decide --lib artifact::ladder::unknown_method && cargo test -p aprender-decide --lib artifact::ladder::tokenizer_blob_hash && cargo test -p aprender-decide --lib artifact::ladder::size_mismatch && cargo test -p aprender-decide --lib artifact::ladder::nan_weight && cargo test -p aprender-decide --lib artifact::ladder::probe_mismatch'
    if_fails: 'A rung does not bite, so an artifact inconsistent in that respect reaches classification.'

  - id: FALSIFY-DECIDE-APR-002
    rule: 'Packing is byte-deterministic across processes'
    prediction: 'Two separate processes packing the same inputs produce files with the same sha256.'
    implemented_by: 'plan 08-05 (pack determinism test)'
    test: 'cargo test -p aprender-decide --lib artifact::determinism::golden_sha && cargo test -p aprender-decide --lib artifact::determinism::same_process_twice'
    if_fails: 'A timestamp, host field or map-ordered field entered the artifact; identity (D-11) is no longer a function of the inputs.'

  - id: FALSIFY-DECIDE-APR-003
    rule: 'Packing is byte-deterministic across serde_json map backings'
    prediction: 'The pack built with serde_json/preserve_order and the one built without produce identical bytes.'
    implemented_by: 'plan 08-05 (dual-backing determinism test): the same golden_sha run standalone (preserve_order=OFF) and with the test-only serde-preserve-order feature (preserve_order=ON), each run printing its backing via artifact::determinism::backing_canary. Plan 08-12 moved the ON leg off `-p aprender-mcp-setfit` feature unification onto the explicit feature, as FALSIFY-DECIDE-APR-007 does'
    test: 'cargo test -p aprender-decide --lib artifact::determinism::golden_sha && cargo test -p aprender-decide --features serde-preserve-order --lib artifact::determinism::golden_sha'
    if_fails: 'The manifest serialises a map, so its bytes depend on the build graph (Pitfall 2).'

  - id: FALSIFY-DECIDE-APR-004
    rule: 'Pack then load recovers every tensor and blob exactly'
    prediction: 'Every F16 weight''s bytes, the F32 temperature and each blob round-trip byte-identical against the run dir.'
    implemented_by: 'plan 08-05 (pack-unpack closure test)'
    test: 'cargo test -p aprender-decide --lib artifact::tests::pack_unpack_closure'
    if_fails: 'Weights were re-rounded through f32, or a blob was re-serialised instead of copied.'

  - id: FALSIFY-DECIDE-APR-005
    rule: 'artifact_sha256 equals the whole-file sha256 and recipe_id the recipe blob sha256'
    prediction: 'The loader''s reported identity equals shasum -a 256 of the file and of the run dir recipe.json.'
    implemented_by: 'plan 08-05 (identity test)'
    test: 'cargo test -p aprender-decide --lib artifact::tests::tiny_roundtrip && cargo test -p aprender-decide --lib artifact::tests::load_path_door'
    if_fails: 'The identity reported to callers is not the identity of the served bytes (D-11).'

  - id: FALSIFY-DECIDE-APR-006
    rule: 'The verified decider has no second minting path'
    prediction: 'A trybuild compile-fail case constructing VerifiedDecider outside the ladder fails to compile.'
    implemented_by: 'plan 08-05 (trybuild compile-fail test): tests/ui/decider_struct_literal.rs tries a struct literal and a Decider::new; dark in CI until plan 08-12 adds --test ui for this package'
    test: 'cargo test -p aprender-decide --test ui decider_has_no_second_minting_path'
    if_fails: 'Some consumer can classify with an unverified model.'

  - id: FALSIFY-DECIDE-APR-007
    rule: 'Task criteria order survives both serde_json backings'
    prediction: 'A task with criteria (none, against, favor) parses to labels [none, against, favor] with preserve_order on and off.'
    implemented_by: 'plan 08-04 (aprender_decide::task order tests); run standalone (preserve_order=OFF) and with the test-only serde-preserve-order feature (preserve_order=ON), each leg printing its backing via task::tests::serde_backing_canary'
    test: 'cargo test -p aprender-decide --lib task::tests::serde_backing_canary -- --nocapture && cargo test -p aprender-decide --lib task::tests::stance_order_none_against_favor && cargo test -p aprender-decide --features serde-preserve-order --lib task::tests::serde_backing_canary -- --nocapture && cargo test -p aprender-decide --features serde-preserve-order --lib task::tests::stance_order_none_against_favor'
    if_fails: 'Labels are attributed by map iteration order: every probability can be attributed to the wrong label.'

  - id: FALSIFY-DECIDE-APR-008
    rule: 'The size cap refuses cap + 1 before allocation'
    prediction: 'A declared length of max_artifact_bytes + 1 is refused with zero bytes read; a lying stream is cut at cap + 1 (limit-injected helper, no 1.25 GiB allocation).'
    implemented_by: 'plan 08-05 (bounded read tests)'
    test: 'cargo test -p aprender-decide --lib artifact::ladder::declared_length_over_cap && cargo test -p aprender-decide --lib artifact::ladder::read_over_cap && cargo test -p aprender-decide --lib artifact::ladder::in_memory_over_cap'
    if_fails: 'A hostile file can exhaust memory before any rung runs.'

  - id: FALSIFY-DECIDE-APR-009
    rule: 'A forged header whose tensor_count exceeds the index extent is refused before any index allocation'
    prediction: 'A small file with a valid header CRC and tensor_count = u32::MAX (or 4097) is refused at rung 2, and the reader allocates nothing proportional to the declared count.'
    implemented_by: 'plan 08-05 (index extent tests, incl. the apr-format with_capacity fix)'
    test: 'cargo test -p aprender-decide --lib artifact::ladder::tensor_count_over_cap && cargo test -p aprender-decide --lib artifact::ladder::index_extent_too_small && cargo test -p apr-format --lib v2::tests::forged_tensor_count_is_refused_by_both_readers && cargo test -p apr-format --lib v2::tests::index_capacity_is_bounded_by_the_index_bytes'
    if_fails: 'A tiny file can demand a multi-hundred-GB allocation (reader_impl.rs:95).'

  - id: FALSIFY-DECIDE-APR-010
    rule: 'Marker loss is refused while a merely shrunk task is served'
    prediction: 'A task whose options exceed head_max_len but keep all K markers after Laya''s shrink is served; a task that loses a marker is refused at load naming the lost markers.'
    implemented_by: 'plan 08-04 (aprender_decide::laya marker tests: laya::tests::shrunk_task_is_served and laya::tests::marker_loss_is_refused_at_load)'
    test: 'cargo test -p aprender-decide --lib laya::tests::shrunk_task_is_served && cargo test -p aprender-decide --lib laya::tests::marker_loss_is_refused_at_load'
    if_fails: 'Either a task the reference serves is refused (inference semantics changed), or a task with a missing marker scores the wrong positions.'

  - id: FALSIFY-DECIDE-APR-011
    rule: 'Probe expectations are Python values and every load replays them'
    prediction: 'The stored probe bits equal probes.json; perturbing one stored probability by 2e-5 makes load refuse at rung 7; a probe row over 48 tokens is refused at pack.'
    implemented_by: 'plans 08-05 (pack / replay) and 08-09 (probes.json from the trainer)'
    test: 'cargo test -p aprender-decide --lib artifact::determinism::no_rust_floats_in_manifest && cargo test -p aprender-decide --lib artifact::ladder::probe_mismatch && cargo test -p aprender-decide --lib artifact::ladder::probe_row_over_budget && cargo test -p aprender-decide --lib artifact::ladder::probe_disagrees_with_oracle'
    if_fails: 'Artifact bytes depend on the packing machine, or a corrupted model loads silently.'

  - id: FALSIFY-DECIDE-APR-012
    rule: 'Only pack_laya verify on the exact file makes an artifact deployable'
    prediction: 'An artifact whose embedded gate says pass but whose eval-probs were edited, or whose base sha differs, or whose recipe is synthetic-fixture, is refused by verify; inspect reports identity only.'
    implemented_by: 'plan 08-09 (aprender_decide::verify verify_run tests)'
    test: 'cargo test -p aprender-decide --lib verify::tests::synthetic_refused && cargo test -p aprender-decide --lib verify::tests::base_mismatch_contract && cargo test -p aprender-decide --lib verify::tests::forged_report'
    if_fails: 'A structurally valid artifact with plausible embedded metrics can be deployed without its gate ever being re-derived.'

  - id: FALSIFY-DECIDE-APR-013
    rule: 'Every manifest leaf is bound at load to a sha-bound source, on every load door'
    prediction: 'For every leaf of the packed manifest and every source manifest.bindings names for it, a coherent forgery (all author-controlled hashes re-pinned) that breaks exactly that one binding is refused at the rung the table names; the table''s leaf set equals the manifest''s; a forged base is refused by load_bytes, load_hashed (the Lambda door) and load_path (the stdio door) alike.'
    implemented_by: 'plan 08-19 (aprender_decide::artifact::check_manifest_bindings, rung 4 (e); the leaf sweep driven by manifest.bindings)'
    test: 'cargo test -p aprender-decide --lib artifact::ladder::every_manifest_leaf_is_bound && cargo test -p aprender-decide --lib artifact::ladder::manifest_bindings_table_matches_manifest_leaves && cargo test -p aprender-decide --lib artifact::ladder::manifest_bound_at_every_load_door'
    if_fails: 'A crafted .apr serves a manifest field (model.base in every classify response, the gate or calibration record a reader sees) that its own embedded blobs contradict.'

