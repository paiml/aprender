      test: 'cargo test -p aprender-decide --lib artifact::ladder::index_extent_too_small && cargo test -p aprender-decide --lib artifact::ladder::index_past_end && cargo test -p aprender-decide --lib artifact::ladder::rung2_predicate_exhaustive'
    - id: index_reservation
