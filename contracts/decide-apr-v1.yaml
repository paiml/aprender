      test: 'cargo test -p aprender-decide --lib artifact::ladder::untrusted_layer_counts_are_bounded_before_derivation && cargo test -p aprender-core --lib models::modernbert::config::tests::layer_count_is_capped_before_allocation'
    - id: head_layers
