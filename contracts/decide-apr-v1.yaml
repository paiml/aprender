      disposition: enforced
      rung: 3
      checked_by: 'apr-format parse_tensor_index_section (both readers; WR-01, plan 08-20). This is what refuses a repeated name at load today'
      owner_crate: apr-format
      test: 'cargo test -p apr-format --lib v2::tests::duplicate_tensor_names_are_refused_by_both_readers'
    - id: duplicate_names_ladder
      bound: 'every tensor index name unique (a set walk, independent of sort order)'
      disposition: enforced
      rung: 4
      checked_by: 'artifact::first_repeated_tensor_name, called at the start of rung4_structure before any lookup by name (WR-01, decide side)'
      refusal: [DuplicateTensor]
      reachable_via_load: false
      reachable_note: 'false while duplicate_names_reader holds: a hostile artifact is refused at rung 3 by the reader first, so a sweep case that loaded one would pass whether or not this check exists. The case calls the helper directly; duplicate_tensor_name_is_refused_at_load proves the load refusal names the tensor whichever rung gives it'
      owner_crate: aprender-decide
      test: 'cargo test -p aprender-decide --lib artifact::ladder::repeated_name_walk_names_the_first_repeat && cargo test -p aprender-decide --lib artifact::ladder::duplicate_tensor_name_is_refused_at_load'
    - id: num_hidden_layers
      bound: 1024
      disposition: enforced
      rung: 4
      checked_by: 'aprender-core ModernBertConfig::from_json_bytes (MAX_NUM_HIDDEN_LAYERS), reached at rung 4 (b) through artifact::parse_encoder_config, BEFORE the per-layer tensor names are derived (ea940faec)'
