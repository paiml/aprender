qa_gate:
  id: F-DECIDE-APR-001
  name: 'Decision-model APR artifact schema gate'
  description: >
    The blocking gate for the decide-apr-v1 artifact and the D-05 task schema. Every check must be
    observed RED under an in-band negative before it is trusted. Wired into tier3 through
    contract-validate (schema) and contract-audit-phase8 (binding coverage), and into the test
    suites named by the falsification tests as plans 08-04, 08-05 and 08-09 land them.
  checks:
    - 'contract schema validity (pv validate, zero errors) and non-zero pv status counts'
    - 'task order is the label index under both serde_json backings'
    - 'marker loss refused, shrunk tasks served'
    - 'bounded read and index-extent bound before any allocation'
    - 'every ladder rung refuses its induced negative'
    - 'every manifest leaf bound at load to its sha-bound source (manifest.bindings)'
    - 'byte determinism across processes and backings'
    - 'pack-unpack closure; identity equals whole-file sha256'
    - 'probe replay against stored Python values, NaN-visible'
    - 'private mint (trybuild compile-fail)'
    - 'deployability only through pack_laya verify on the exact file'
  pass_criteria: 'FALSIFY-DECIDE-APR-001..013 pass, each observed RED under its own induced negative.'
  falsification: >
    Forge a 64-byte header with a valid CRC and tensor_count = 4097: rung 2 must refuse it before
    the index parser runs. Flip one byte of the decide.recipe_json blob: rung 4 must refuse naming
    the blob, and recipe_id must no longer match the run dir.
