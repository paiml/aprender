      disposition: enforced
      rung: 3
      checked_by: 'apr-format parse_tensor_index_section index_capacity (every APR consumer; plan 08-20)'
      owner_crate: apr-format
      test: 'cargo test -p apr-format --lib v2::tests::forged_tensor_count_reserves_nothing_proportional && cargo test -p apr-format --lib v2::tests::index_capacity_is_bounded_by_the_index_bytes'
    - id: duplicate_names_reader
