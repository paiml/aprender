metadata:
  version: 1.0.0
  created: '2026-02-18'
  author: PAIML Engineering
  description: Cross-entropy kernel — log-sum-exp stable cross-entropy loss
  references:
  - Shannon (1948) A Mathematical Theory of Communication
  - Milakov & Gimelshein (2018) Online normalizer calculation for softmax
  depends_on:
  - softmax-kernel-v1
equations:
  cross_entropy:
    formula: CE(targets, logits) = -sum(targets_i * log_softmax(logits)_i)
    domain: targets in {0,1}^n with sum=1, logits in R^n, n >= 2
    codomain: CE in [0, +inf)
    invariants:
    - CE >= 0 (non-negativity)
    - CE(one_hot(k), logits) = -log_softmax(logits)_k
    - CE(p, p_logits) = H(p) when p = softmax(p_logits)
    preconditions:
    - logits.len() > 0
    - logits.iter().all(|v| v.is_finite())
    - target < logits.len()
    lean_theorem: Theorems.Cross_Entropy
    postconditions:
    - result.is_finite()
    - result >= 0.0
  log_softmax:
    formula: log_softmax(x)_i = x_i - max(x) - log(sum(exp(x_j - max(x))))
    domain: x in R^n, n >= 1
    codomain: log_softmax(x) in (-inf, 0]
    invariants:
    - log_softmax(x)_i <= 0 for all i
    - exp(log_softmax(x)) = softmax(x)
    - log_sum_exp trick preserves numerical stability
    preconditions:
    - x.iter().all(|v| v.is_finite())
    - x.len() > 0
    lean_theorem: Theorems.Log_Softmax
proof_obligations:
- type: invariant
  property: Non-negativity
  formal: CE(targets, logits) >= 0
  applies_to: all
  lean:
    theorem: CrossEntropy.cross_entropy_nonneg
    module: ProvableContracts.CrossEntropy
    status: proved
    depends_on:
    - CrossEntropy.log_softmax_le_zero
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.Log.Basic
    - Mathlib.Analysis.SpecialFunctions.ExpDeriv
    notes: Requires non-negative targets; log_softmax ≤ 0 gives -sum(t·ls) ≥ 0
- type: bound
  property: Log-softmax bounded above by zero
  formal: log_softmax(x)_i <= 0 for all i
  applies_to: all
  lean:
    theorem: CrossEntropy.log_softmax_le_zero
    module: ProvableContracts.CrossEntropy
    status: proved
    depends_on:
    - CrossEntropy.exp_le_sum
    - Real.log_le_log
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.Log.Basic
    - Mathlib.Analysis.SpecialFunctions.ExpDeriv
    notes: exp(xᵢ) ≤ Σ exp(xⱼ), so log(exp(xᵢ)) ≤ log(Σ exp(xⱼ))
- type: equivalence
  property: LogSoftmax + NLL equals CrossEntropy
  formal: '|CE(t, x) - (-sum(t_i * log_softmax(x)_i))| < eps'
  tolerance: 1.0e-06
  applies_to: all
- type: bound
  property: Finite output for finite inputs
  formal: CE is finite when logits and targets are finite
  applies_to: all
- type: equivalence
  property: SIMD matches scalar within ULP
  tolerance: 8.0
  applies_to: simd
- type: equivalence
  property: Backward gradient respects reduction mode (PyTorch parity)
  formal: >-
    dCE/dlogits = (softmax(logits) - onehot(targets)) * s, where the upstream
    scale s is: 1/batch for Reduction::Mean, 1 for Reduction::Sum, and the
    per-sample upstream gradient upstream[b] broadcast across sample b's classes
    for Reduction::None. Sum MUST NOT divide by batch.
  tolerance: 1.0e-06
  applies_to: all
  id: F-AUTOGRAD-CE-REDUCTION-001
  notes: >-
    Before PMAT-891 the backward unconditionally divided by batch (Mean-only) and
    read only grad_output[0], so Sum grad was batch× too small and None
    mis-broadcast the per-sample upstream. Closed-form softmax+NLL gradient is
    softmax-onehot, requiring no PyTorch reference (Bishop 2006, eq. 4.108).
- type: equivalence
  property: Label smoothing distributes eps/C off-target mass (PyTorch parity)
  formal: >-
    For CrossEntropyLoss(label_smoothing=eps) on C classes the smoothed target
    distribution is q_target = 1 - eps + eps/C and q_{i!=target} = eps/C, so
    loss = -sum_i q_i * log_softmax(logits)_i
         = -(1 - eps) * log p_target - (eps/C) * sum_i log p_i.
    This equals torch.nn.CrossEntropyLoss(label_smoothing=eps) exactly, and
    reduces to plain cross-entropy at eps = 0.
  tolerance: 1.0e-05
  applies_to: all
  id: OBLIG-CE-LABEL-SMOOTHING-UNIFORM-MASS
  notes: >-
    Before PMAT-910 the off-target per-class mass was (1-eps)/C instead of eps/C,
    inflating the smoothed loss by ~3.2x for typical eps/C (e.g. eps=0.1, C=5 gave
    2.384 vs the correct 0.7244). The uniform smoothing mass is eps/C per class
    (Szegedy et al. 2016, Rethinking the Inception Architecture, eq. label
    smoothing); backward is unaffected because autograd is only recorded when
    label_smoothing == 0.0.
- type: invariant
  property: Softmax partition of unity (outputs sum to 1)
  formal: sum_i softmax(z)_i = 1, i.e. the numerators sum to the denominator Z = sum_j exp(z_j)
  applies_to: all
  id: OBLIG-SOFTMAX-PARTITION-OF-UNITY
  lean:
    theorem: ProvableContracts.SoftmaxCore.softmax_partition
    module: ProvableContracts.Theorems.CrossEntropy.CoreSoftmaxInvariants
    status: proved
    core_only: true
    notes: >-
      Core-only (prelude, no Mathlib). softmax normalizes by exactly Z = sum_j
      exp(z_j), so the numerator list sums to the denominator; in Z-scaled fixed
      point the outputs sum to the full scale Z, which is Sum_i w_i/Z = 1.
- type: bound
  property: Softmax outputs are strictly positive (lower bound of (0,1])
  formal: softmax(z)_i > 0 for all i; equivalently the partition function Z > 0
  applies_to: all
  id: OBLIG-SOFTMAX-POSITIVE
  lean:
    theorem: ProvableContracts.SoftmaxCore.softmax_denom_pos
    module: ProvableContracts.Theorems.CrossEntropy.CoreSoftmaxInvariants
    status: proved
    core_only: true
    notes: >-
      Core-only. Z = sum of exp-weights is strictly positive (each exp(z_j) > 0),
      so softmax(z)_i = w_i/Z > 0. Proved over Int weights with positive head.
- type: bound
  property: Softmax outputs are at most one (upper bound of (0,1])
  formal: softmax(z)_i <= 1 for all i; equivalently each weight w_i <= Z
  applies_to: all
  id: OBLIG-SOFTMAX-LE-ONE
  lean:
    theorem: ProvableContracts.SoftmaxCore.softmax_num_le_denom
    module: ProvableContracts.Theorems.CrossEntropy.CoreSoftmaxInvariants
    status: proved
    core_only: true
    notes: >-
      Core-only. Each exp-weight is one term of the positive sum Z, so w_i <= Z,
      hence softmax(z)_i = w_i/Z <= 1. Proved by induction over Int weight lists.
- type: bound
  property: Softmax outputs are strictly below one when mass exists elsewhere
  formal: softmax(z)_i < 1 when sum_{j!=i} exp(z_j) > 0; equivalently w_i < Z
  applies_to: all
  id: OBLIG-SOFTMAX-LT-ONE
  lean:
    theorem: ProvableContracts.SoftmaxCore.softmax_num_lt_denom
    module: ProvableContracts.Theorems.CrossEntropy.CoreSoftmaxInvariants
    status: proved
    core_only: true
    notes: >-
      Core-only. With strictly-positive mass in the remaining classes, the head
      weight is strictly below Z, so softmax(z)_i < 1 (never saturates at 1).
- type: equivalence
  property: Log-softmax decomposition (log_softmax = z - logsumexp)
  formal: log_softmax(z)_i = z_i - lse, with lse = log(sum_j exp(z_j))
  applies_to: all
  id: OBLIG-LOG-SOFTMAX-DECOMPOSITION
  lean:
    theorem: ProvableContracts.LogSoftmaxCore.log_softmax_decomp
    module: ProvableContracts.Theorems.CrossEntropy.CoreSoftmaxInvariants
    status: proved
    core_only: true
    notes: >-
      Core-only definitional identity log_softmax(z)_i = z_i - lse; the companion
      core theorem log_softmax_nonpos re-proves CE-BND-001 (log_softmax <= 0) over
      Int from z_i <= lse, independent of the Mathlib proof of the same bound.
verification_summary:
  total_obligations: 12
  l2_property_tested: 11
  l3_kani_proved: 3
  l4_lean_proved: 7
  l4_sorry_count: 0
  l4_not_applicable: 1
kernel_structure:
  phases:
  - name: find_max
    description: Compute max(logits) for numerical stability
    invariant: max >= logits_i for all i
  - name: log_sum_exp
    description: Compute log(sum(exp(logits_i - max)))
    invariant: result is finite for finite inputs
  - name: log_softmax
    description: Compute logits_i - max - log_sum_exp
    invariant: log_softmax_i <= 0
  - name: nll
    description: Compute -sum(targets_i * log_softmax_i)
    invariant: result >= 0
simd_dispatch:
  cross_entropy:
    scalar: cross_entropy_scalar
    avx2: cross_entropy_avx2
    ptx: cross_entropy_ptx
enforcement:
  non_negativity:
    description: Cross-entropy loss must be non-negative
    check: contract_tests::FALSIFY-CE-001
    severity: ERROR
  numerical_stability:
    description: No NaN or Inf for finite inputs
    check: contract_tests::FALSIFY-CE-003
    severity: ERROR
falsification_tests:
- id: FALSIFY-CE-001
  rule: Non-negativity
  prediction: CE(targets, logits) >= 0 for valid probability targets
  test: proptest with random one-hot targets and logits, dim 2..128
  if_fails: Sign error in NLL computation
- id: FALSIFY-CE-002
  rule: Log-softmax upper bound
  prediction: log_softmax(x)_i <= 0 for all i
  test: proptest with random logits in [-1000, 1000]
  if_fails: Missing max subtraction in log-sum-exp
- id: FALSIFY-CE-003
  rule: Numerical stability
  prediction: No NaN/Inf in output for finite logits
  test: proptest with extreme values near f32::MIN/MAX
  if_fails: Log-sum-exp trick not applied or overflow in exp
- id: FALSIFY-CE-004
  rule: Decomposition equivalence
  prediction: '|CE(t,x) - NLL(t, log_softmax(x))| < 1e-6'
  test: proptest comparing fused CE vs separate log_softmax + NLL
  if_fails: Fused computation introduces different rounding
- id: FALSIFY-CE-005
  rule: SIMD equivalence
  prediction: '|cross_entropy_avx2(t,x) - cross_entropy_scalar(t,x)| < 8 ULP'
  test: proptest comparing scalar vs SIMD output
  if_fails: SIMD log/exp approximation differs
- id: FALSIFY-CE-006
  rule: Boundary - perfect prediction
  prediction: CE(one_hot(k), logits) approaches 0 as logits_k >> logits_j
  test: proptest with dominant logit at target index
  if_fails: Loss not approaching zero for confident predictions
- id: F-AUTOGRAD-CE-REDUCTION-001-SUM
  rule: Sum-reduction backward grad is softmax-onehot (NOT divided by batch)
  prediction: 'dCE/dlogits under Reduction::Sum == softmax(logits) - onehot(targets)'
  test: cargo test -p aprender-core --lib falsify_ce_reduction_001_sum_grad_not_divided_by_batch
  if_fails: Backward divides Sum-reduction grad by batch (PyTorch divergence, batch× too small)
- id: F-AUTOGRAD-CE-REDUCTION-001-MEAN
  rule: Mean-reduction backward grad is (softmax-onehot)/batch (no regression)
  prediction: 'dCE/dlogits under Reduction::Mean == (softmax(logits) - onehot(targets)) / batch'
  test: cargo test -p aprender-core --lib falsify_ce_reduction_001_mean_grad_divided_by_batch
  if_fails: Mean-reduction default behavior regressed
- id: F-AUTOGRAD-CE-REDUCTION-001-NONE
  rule: None-reduction backward scales each sample row by its own per-sample upstream
  prediction: 'dCE/dlogits[b] under Reduction::None == (softmax-onehot)[b] * upstream[b]'
  test: cargo test -p aprender-core --lib falsify_ce_reduction_001_none_per_sample_upstream
  if_fails: Backward reads only grad_output[0] and mis-broadcasts the per-sample upstream
- id: OBLIG-CE-LABEL-SMOOTHING-UNIFORM-MASS-ORACLE
  rule: Label-smoothed CE equals the analytic/torch eps/C-mass oracle
  prediction: 'CrossEntropyLoss(eps).forward == -(1-eps)*log p_t - (eps/C)*sum_i log p_i (== torch)'
  test: cargo test -p aprender-core --lib test_cross_entropy_label_smoothing_uniform_mass_oracle
  if_fails: Off-target per-class mass is not eps/C (e.g. the (1-eps)/C bug, ~3.2x too large)
- id: OBLIG-CE-LABEL-SMOOTHING-UNIFORM-MASS-EPS0
  rule: eps=0 label smoothing reduces to plain cross-entropy
  prediction: 'CrossEntropyLoss(0.0).forward == CrossEntropyLoss::new().forward'
  test: cargo test -p aprender-core --lib test_cross_entropy_label_smoothing_zero_equals_plain
  if_fails: Smoothing branch does not reduce to plain CE at eps=0 (regression)
- id: FALSIFY-SOFTMAX-PARTITION
  rule: Softmax partition of unity
  prediction: sum(softmax(logits)) == 1 within tolerance for all finite logits
  test: proptest with random finite logits, dim 2..128, assert |sum - 1| < 1e-6
  if_fails: Normalization uses a denominator other than the sum of exp weights
- id: FALSIFY-SOFTMAX-POSITIVE
  rule: Softmax outputs strictly positive
  prediction: softmax(logits)_i > 0 for all i and all finite logits
  test: proptest with random finite logits in [-1000, 1000], dim 2..128
  if_fails: Underflow to zero or a non-positive exp weight in the numerator
- id: FALSIFY-SOFTMAX-LE-ONE
  rule: Softmax outputs bounded above by one
  prediction: softmax(logits)_i <= 1 for all i and all finite logits
  test: proptest with random finite logits, dim 2..128, assert max(softmax) <= 1
  if_fails: A single weight exceeds the partition function Z (impossible if Z = sum)
- id: FALSIFY-SOFTMAX-LT-ONE
  rule: Softmax strictly below one with mass elsewhere
  prediction: softmax(logits)_i < 1 when at least one other class has finite logit
  test: proptest with dim >= 2 random finite logits, assert max(softmax) < 1
  if_fails: Softmax saturates at exactly 1, dropping mass from the other classes
- id: FALSIFY-LOG-SOFTMAX-DECOMPOSITION
  rule: Log-softmax decomposition
  prediction: '|log_softmax(z)_i - (z_i - logsumexp(z))| < 1e-6 for all i'
  test: proptest comparing log_softmax vs z_i minus log-sum-exp, dim 2..128
  if_fails: Log-softmax does not equal z minus the log-sum-exp normalizer
kani_harnesses:
- id: KANI-CE-001
  obligation: CE-INV-001
  property: Cross-entropy is non-negative for small inputs
  bound: 4
  strategy: stub_float
  solver: cadical
  harness: verify_cross_entropy_non_negative
- id: KANI-CE-002
  obligation: CE-BND-001
  property: Log-softmax bounded above by zero
  bound: 8
  strategy: stub_float
  solver: cadical
  harness: verify_log_softmax_upper_bound
- id: KANI-CE-003
  obligation: CE-BND-002
  property: Output finite for finite inputs
  bound: 4
  strategy: stub_float
  solver: cadical
  harness: verify_cross_entropy_finite
- id: KANI-CROSS_-004
  obligation: Non-negativity
  property: Non-negativity
  bound: 8
  strategy: exhaustive
- id: KANI-CROSS_-005
  obligation: Log-softmax bounded above by zero
  property: Log-softmax bounded above by zero
  bound: 8
  strategy: stub_float
- id: KANI-CROSS_-006
  obligation: LogSoftmax + NLL equals CrossEntropy
  property: LogSoftmax + NLL equals CrossEntropy
  bound: 8
  strategy: exhaustive
- id: KANI-CROSS_-007
  obligation: Finite output for finite inputs
  property: Finite output for finite inputs
  bound: 8
  strategy: exhaustive
- id: KANI-CROSS_-008
  obligation: SIMD matches scalar within ULP
  property: SIMD matches scalar within ULP
  bound: 8
  strategy: exhaustive
qa_gate:
  id: F-CE-001
  name: Cross-Entropy Contract
  description: Numerically stable cross-entropy loss quality gate
  checks:
  - non_negativity
  - log_softmax_bound
  - numerical_stability
  - simd_equivalence
  pass_criteria: All 6 falsification tests pass + Kani harnesses verify
  falsification: Remove max subtraction from log-sum-exp
