  amendment_history:
    - version: 1.5.0
      date: '2026-05-09'
      kind: status_promotion
      title: 'M109 DISCHARGE — F-QW3-MOE-PARITY-001 PASSED, status ACTIVE_ALGORITHM_LEVEL → ACTIVE_RUNTIME'
      description: |
        Per the M34 FAST PATH plan and the v1.4.0 functional discharge audit
        trail, this v1.5.0 amendment records the **formal numerical-parity
        discharge** of M32d via FALSIFY-QW3-MOE-FORWARD-004 axis (a)
        cosine ≥ 0.99 vs HF FP16 reference logits.

        Discharge measured 2026-05-09 on lambda-vector RTX 4090
        (companion `paiml/claude-code-parity-apr` PR #95 squash 9c2833334,
        M109 milestone-table row).

        ## Live test results

          cargo test --release -p aprender-serve --test qwen3_moe_parity -- \
            --include-ignored f_qw3_moe_parity_001_cosine_vs_hf_fp16

          F-QW3-MOE-PARITY-001:
            elapsed       = 555.52868ms
            cos_sim       = 0.995384
            threshold     = 0.99
            apr_argmax    = 3555 (val = 22.3671)
            hf_argmax     = 3555 (" What")

          test result: ok. 4 passed; 0 failed; 0 ignored

        ## Margin analysis

        - cos_sim 0.995384 ≥ 0.99 threshold by **0.0054** (substantial
          margin, well above noise floor).
        - **apr_argmax = hf_argmax = 3555** (exact agreement, not just
          "cos > 0.99 forces argmax under near-tie hypothesis"). This is
          a stronger discharge than the contract requires.

        ## Discovery: stale "60 GB HF download is pending" claim

        v1.4.0 (2026-05-02) recorded the cosine measurement as
        "operator-confirm pending ~60 GB HF download". Companion-repo
        M109 (2026-05-09) discovered the FP16 weights had been on
        lambda-vector at /mnt/nvme-raid0/models/Qwen3-Coder-30B-A3B-Instruct/
        (57 GB across 16 safetensors shards, Mar 8 timestamps) for ~62
        days — well before v1.4.0 was authored.

        Five-whys on root cause (companion M109 commit body):

          (1) "operator-confirm pending X" claims age silently when X
              becomes mechanically checkable.
          (2) Companion-side detector (12 asserts at M107) covers
              M-count / gate-count / contract-version / fixture-count
              / status-anchor consistency, but NOT "is the X-pending
              claim still true on disk?"
          (3) Future M110-class kaizen: extend detector to query
              filesystem state for mechanically-checkable "pending"
              claims.

        ## Fixture generation reproducibility

        HF FP16 fixture generated in **52s wall** (vs script's "10-30 min"
        estimate which assumed HF Hub download):

          uv run --with torch --with transformers --with accelerate \
            scripts/generate_qwen3_moe_fp16_logits.py \
            --model /mnt/nvme-raid0/models/Qwen3-Coder-30B-A3B-Instruct \
            --output crates/aprender-serve/tests/fixtures/qwen3_moe_fp16_logits_pos0.json

        Fixture committed in this PR at
        crates/aprender-serve/tests/fixtures/qwen3_moe_fp16_logits_pos0.json
        (2.06 MiB, 151936-dim FP32 logit vector for prompt
        "What is 2+2?" at position 6 = end-of-prompt).

        ## F-QW3-MOE-PARITY-002 sibling status

        FALSIFY-QW3-MOE-FORWARD-004 axis (b) — argmax(apr_logits) ==
        llama_cpp_top1_token — was **deferred** in this discharge.
        CPU-only `llama-cli` (build #7746) on the
        Qwen3-Coder-30B-A3B-Instruct-Q4_K_M GGUF hung at 99.9% single-CPU
        for 2 hours without producing output, even with `-ngl 999`
        GPU-offload flag (suspected MoE expert dispatch is CPU-bound in
        this llama.cpp build — upstream issue, not aprender-side).

        The transitive sanity check is no longer load-bearing: axis (a)
        already proved `apr_argmax = hf_argmax = 3555` directly.
        Discharge of axis (a) alone is sufficient for the ACTIVE_RUNTIME
        flip per AC_QW3_MOE_005's primary gate semantics.

        F-QW3-MOE-PARITY-002 stays `[#ignore]`-gated for regression
        coverage when llama.cpp's MoE-on-CPU performance improves.

        ## Status promotions

          - status: ACTIVE_ALGORITHM_LEVEL → ACTIVE_RUNTIME
          - implementation_stages.M32d: PENDING → DISCHARGED
          - FALSIFY-QW3-MOE-FORWARD-004 axis (a): DISCHARGED
            (cos_sim 0.995384, apr_argmax = hf_argmax)
          - FALSIFY-QW3-MOE-FORWARD-004 axis (b): DEFERRED
            (transitive — not load-bearing post axis-a discharge;
            test stays for regression coverage)

        ## Cross-repo refs

          - companion M109: paiml/claude-code-parity-apr#95 squash
            9c2833334 (2026-05-09T15:02:33Z)
          - companion ticketing M108: paiml/claude-code-parity-apr#94
          - aprender#1584: closes via this PR (operator-confirm gate)

