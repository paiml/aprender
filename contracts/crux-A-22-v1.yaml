# CRUX-A-22 — Disk-quota enforcement on registry

metadata:
  id: CRUX-A-22
  version: "1.2.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: partial
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Hub & Distribution"
  competitor: ollama
  demand_score: 2
  intake_status: missing
  description: >
    Enforce an absolute byte quota on the local model registry. Canonical:
    Ollama `OLLAMA_MAX_MODELS`/manual prune; docker `--storage-opt
    size=...`. Must reject `apr pull` when aggregate manifest size +
    incoming model > quota, and emit a machine-parseable error with
    used/available/needed fields.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/huggingface/transformers — Trainer
  - docs.python.org — packaging, signatures, supply chain
equations:
  quota:
    formula: |
      used(registry) = Σ size(blob)_b for b ∈ unique blobs in manifest
      free = quota - used
      allow(pull) = free ≥ size(incoming)
      # enforcement is pre-download: no bytes land on disk on reject
    domain: "(registry: Path, quota: u64 bytes, incoming: Manifest)"
    codomain: "{allowed: bool, used: u64, free: u64, needed: u64}"
    invariants:
    - "quota never exceeded (disk usage always ≤ quota after any pull)"
    - "rejection is pre-download (no partial blobs left on disk)"
    - "error body is valid JSON with used/free/needed fields"

falsification_tests:
- id: FALSIFY-CRUX-A-22-001
  rule: pull rejected when it would exceed quota
  prediction: "pull 2GB model with 1GB remaining fails with quota error"
  test: |
    set -euo pipefail
    export APR_MODELS=/tmp/apr-quota
    rm -rf /tmp/apr-quota && mkdir -p /tmp/apr-quota
    apr registry set-quota 1048576  # 1 MB
    ! apr pull hf://openai/whisper-tiny 2>/tmp/err >/dev/null
    python3 -c "
    import json
    e = json.loads(open('/tmp/err').read().split('\n')[-2])
    assert e['used'] + e['needed'] > e['used'] + e['free'], e
    assert all(k in e for k in ('used','free','needed'))
    "
  if_fails: rule 'pull rejected when it would exceed quota' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/registry_quota.rs
    sub_claim: |
      Algorithm-level necessary condition: `classify_pull_against_quota`
      returns Reject iff `used + incoming > quota`, with the triple
      (used, free, needed) preserved in full. `render_quota_error_json`
      then emits a single-line JSON body carrying all three required
      keys plus a stable `error: "registry_quota_exceeded"` discriminator.
      The FALSIFY invariant `needed > free` follows from the Reject
      precondition and is separately re-asserted on the serialized body.
    tests:
    - allow_when_incoming_fits
    - allow_exactly_at_quota_boundary
    - reject_one_byte_over_quota
    - reject_when_already_over_quota
    - saturating_arithmetic_prevents_overflow
    - classifier_is_deterministic
    - reject_preserves_all_three_fields
    - error_json_contains_required_keys
    - error_json_values_roundtrip
    - error_json_discriminator_is_stable
    - error_json_is_single_line
    - error_json_parses_with_same_arithmetic_invariant
    scope: quota decision + machine-parseable error body (pure functions)
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "`apr pull` pre-download enforcement harness against a real HF fixture"
- id: FALSIFY-CRUX-A-22-002
  rule: no partial blobs on disk after reject
  prediction: "registry byte count unchanged after rejection"
  test: |
    set -euo pipefail
    before=$(du -sb /tmp/apr-quota | awk '{print $1}')
    ! apr pull hf://openai/whisper-tiny 2>/dev/null >/dev/null
    after=$(du -sb /tmp/apr-quota | awk '{print $1}')
    python3 -c "assert $before == $after, ($before, $after)"
  if_fails: rule 'no partial blobs on disk after reject' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/registry_quota.rs
    sub_claim: |
      Algorithm-level necessary condition: the quota decision is a pure
      function of (quota, used, incoming) with no I/O. Because the
      decision runs pre-download, a Reject verdict cannot have left
      partial blobs on disk — there is no code path that starts a
      network transfer before the classifier returns. Determinism is
      proven on identical inputs.
    tests:
    - classifier_is_deterministic
    - reject_one_byte_over_quota
    - reject_preserves_all_three_fields
    - saturating_arithmetic_prevents_overflow
    scope: pre-download purity (no I/O in classifier)
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "end-to-end reject harness that asserts `du -sb` is unchanged after a rejected pull"
- id: FALSIFY-CRUX-A-22-003
  rule: permitted pull succeeds and stays under quota
  prediction: "pull within budget lands blobs; du ≤ quota"
  test: |
    set -euo pipefail
    apr registry set-quota 104857600  # 100 MB
    apr pull hf://paiml/tiny-fixture
    quota=$(apr registry info --format json | jq -r .quota)
    used=$(du -sb /tmp/apr-quota | awk '{print $1}')
    python3 -c "assert $used <= $quota, ($used, $quota)"

  if_fails: rule 'permitted pull succeeds and stays under quota' is violated — contract MUST be re-verified against competitor canonical reference
  evidence_discharged_by:
    classifier_path: crates/apr-cli/src/commands/registry_quota.rs
    sub_claim: |
      Algorithm-level necessary condition: an Allow verdict carries
      `free_after = quota - (used + incoming)`, so the post-pull
      invariant `used + incoming ≤ quota` is true by construction.
      The exact-fit boundary (used + incoming == quota) is explicitly
      tested and classified as Allow.
    tests:
    - allow_when_incoming_fits
    - allow_exactly_at_quota_boundary
    scope: post-pull quota invariant (pure function)
    discharge_status: PARTIAL_ALGORITHM_LEVEL
    full_discharge_blocked_on: "end-to-end pull + `du` harness against a real HF fixture"
proof_obligations:
- type: equivalence
  property: "apr registry quota semantics match Ollama OLLAMA_MAX_MODELS / docker storage-opt"
- type: invariant
  property: "quota never exceeded"
- type: invariant
  property: "rejection is pre-download (atomic)"

