  category: "A — Model Intake & Discovery"
  competitor: huggingface
  demand_score: 4  # 1..5, high priority in pmat work
  intake_status: partial
  description: >
    Pull from local directory (file://). Parity target is HuggingFace's
    `hf_hub_download(..., local_files_only=True)` / `snapshot_download(...,
    local_files_only=True)` mode and the `HF_HUB_OFFLINE=1` env var, which
    resolve files exclusively from the local cache (`HF_HOME` /
    `~/.cache/huggingface/hub/`) with zero network I/O. Aprender parity:
    `apr pull file:///path/to/dir` and `apr pull hf://<repo> --local-only`
    MUST copy (or symlink) files from a local directory or local cache into
    the target path WITHOUT any outbound DNS/HTTP requests, preserving
    sha256 integrity. See
    https://huggingface.co/docs/huggingface_hub/guides/download#download-from-the-cache
    and https://huggingface.co/docs/huggingface_hub/package_reference/environment_variables#hfhuboffline
  references:
  - "https://huggingface.co/docs/huggingface_hub/guides/download#download-from-the-cache"
  - "https://huggingface.co/docs/huggingface_hub/package_reference/environment_variables#hfhuboffline"
  - "https://huggingface.co/docs/huggingface_hub/v0.24.0/en/package_reference/file_download#huggingface_hub.hf_hub_download.local_files_only"

equations:
  local_scheme_resolution:
    formula: |
      apr pull file:///PATH [--include GLOB] [--exclude GLOB]:
        Selected = Selected(PATH, include, exclude)  (same globs as CRUX-A-04)
        For each f ∈ Selected: copy or hardlink PATH/f → OUT/f
        exit_code == 0 iff PATH exists AND Selected ≠ ∅
      Zero TCP connections are opened for the duration of the call.
    domain: "file:// URL + include/exclude globs"
    codomain: "local filesystem tree + empty network trace"
    invariants:
    - "file:// path resolves via filesystem, no DNS lookup"
    - "Strace/ss-netstat during run shows zero outbound TCP connect() syscalls"
    - "sha256 of copied files equals sha256 of source files"

  offline_mode_for_hf_urls:
    formula: |
      With HF_HUB_OFFLINE=1 OR --local-only flag:
        apr pull hf://REPO resolves from $HF_HOME/hub cache
        if cache hit → exit 0, files materialized into OUT
        if cache miss → exit non-zero with clear "offline, cache miss" message
        zero network I/O in either case.
    domain: "(hf://<repo>, HF_HOME cache state)"
    codomain: "local tree + exit code + empty network trace"
    invariants:
    - "HF_HUB_OFFLINE=1 → zero network I/O regardless of cache state"
    - "Cache miss under offline mode is a hard error, not a silent network fallback"
    - "Error message names the missing file(s)"

  parity_with_huggingface_cli_offline:
    formula: |
      ∀ (REPO, REV) ∈ evidence/crux/huggingface/offline-goldens.json:
        run huggingface-cli download REPO --revision REV  (populate cache)
        then HF_HUB_OFFLINE=1 apr pull hf://REPO --revision REV --out OUT
        sha256(OUT/*) == sha256(cache/*)
    domain: "(repo, revision) tuples with populated HF cache"
    codomain: "sha256 file tree equality + empty network trace"
    invariants:
    - "Offline apr pull returns same bytes as online huggingface-cli download"
    - "Works on the HF cache directory layout (blobs + snapshots/ symlinks)"

falsification_tests:
- id: FALSIFY-CRUX-A-15-001
  rule: file:// URL copies files from local path with zero network I/O
  prediction: "apr pull file:///SRC issues zero TCP connect() syscalls"
  test: |
    SRC=$(mktemp -d); OUT=$(mktemp -d)
    echo '{"model":"test"}' > "$SRC/config.json"
    printf '%s\n' "fake weight bytes" > "$SRC/model.safetensors"
    # Trace network calls with strace (fall back to ss check if strace unavailable)
    if command -v strace >/dev/null; then
      TRACE=$(mktemp)
      strace -f -e trace=connect -o "$TRACE" apr pull "file://$SRC" --out "$OUT" 2>/dev/null
      # Filter to IPv4/IPv6 sockaddr connects (ignore AF_UNIX)
      grep -E 'connect\(.*(AF_INET|sin_family=AF_INET|sin6_family)' "$TRACE" && {
        echo "FAIL: file:// pull made outbound TCP connect" >&2; exit 1
      }
    fi
    [ -f "$OUT/config.json" ] || { echo "FAIL: config.json not copied" >&2; exit 1; }
    diff "$SRC/config.json" "$OUT/config.json"
  if_fails: "apr pull file:// made outbound network calls or did not copy files"
  discharge_status: PARTIAL_ALGORITHM_LEVEL
  evidence_discharged_by:
    sub_claim: >
      A necessary condition for "zero outbound TCP" is that any `file://`
      URL is classified as the Local transport and therefore never reaches
      the HTTP dispatch layer. This sub-claim is discharged by the pure
      classifier `commands::pull_scheme::classify_pull_source`.
    tests:
    - file: crates/apr-cli/src/commands/pull_scheme.rs
      tests:
      - commands::pull_scheme::tests::file_scheme_absolute_path
      - commands::pull_scheme::tests::file_scheme_relative_path
      - commands::pull_scheme::tests::file_scheme_is_always_local_transport
      - commands::pull_scheme::tests::is_local_transport_rejects_non_local
    - file: crates/apr-cli/src/commands/pull_scheme.rs
      properties:
      - "∀ src starting with 'file://': is_local_transport(classify(src)) == true"
      - "∀ src starting with 'hf://' | 'https://' | 'http://' | bare org/repo | short-name:
         is_local_transport(classify(src)) == false"
    scope: >
      ONLY the classification step is discharged. The actual filesystem
      copy that preserves sha256 (FALSIFY-001 full), the strace-verified
      absence of AF_INET connect() syscalls during a real `apr pull`, and
      the `--out` integration are NOT discharged here — they require a
      file:// transport implementation in `commands::pull` itself.

- id: FALSIFY-CRUX-A-15-002
  rule: HF_HUB_OFFLINE=1 hits cache and makes zero network calls
  prediction: "after priming cache, HF_HUB_OFFLINE=1 apr pull succeeds with no DNS"
  test: |
    OUT=$(mktemp -d)
    # Prime cache
    apr pull hf://openai-community/gpt2 --include 'config.json' --out "$OUT" >/dev/null
    # Now offline
    OUT2=$(mktemp -d)
    if command -v strace >/dev/null; then
      TRACE=$(mktemp)
      HF_HUB_OFFLINE=1 strace -f -e trace=connect -o "$TRACE" \
        apr pull hf://openai-community/gpt2 --include 'config.json' --out "$OUT2" 2>/dev/null
      grep -E 'connect\(.*(AF_INET|sin_family=AF_INET|sin6_family)' "$TRACE" && {
        echo "FAIL: offline mode issued TCP connect" >&2; exit 1
      }
    fi
    [ -f "$OUT2/config.json" ] || { echo "FAIL: offline pull did not materialize file" >&2; exit 1; }
  if_fails: "HF_HUB_OFFLINE=1 did not prevent network I/O or failed to hit cache"

- id: FALSIFY-CRUX-A-15-003
  rule: offline cache miss exits non-zero with clear error
  prediction: "HF_HUB_OFFLINE=1 on empty cache exits non-zero with cache-miss message"
  test: |
    CACHE=$(mktemp -d)
    OUT=$(mktemp -d)
    set +e
    HF_HOME="$CACHE" HF_HUB_OFFLINE=1 apr pull hf://openai-community/gpt2 \
      --include 'config.json' --out "$OUT" 2>&1 | tee /tmp/apr_offline.log
    RC=${PIPESTATUS[0]}
    set -e
    [ "$RC" -ne 0 ] || { echo "FAIL: cache miss in offline mode should exit non-zero" >&2; exit 1; }
    grep -iE 'offline|cache.?miss|not.?found' /tmp/apr_offline.log >/dev/null || {
      echo "FAIL: error message lacks offline/cache-miss context" >&2; exit 1
    }
  if_fails: "offline cache miss was silent or fell back to network"

- id: FALSIFY-CRUX-A-15-004
  rule: parity with huggingface-cli offline mode on golden
  prediction: "sha256 of apr file:// output matches huggingface-cli snapshot_download output"
  test: |
    GOLD=${APR_CRUX_GOLDENS:-evidence/crux}/huggingface/offline-goldens.json
    [ -f "$GOLD" ] || { echo "golden set absent"; exit 2; }
    python3 - "$GOLD" <<'PY'
    import json, subprocess, tempfile, hashlib, os, sys, pathlib
    for c in json.load(open(sys.argv[1])):
        with tempfile.TemporaryDirectory() as d:
            env = {**os.environ, "HF_HUB_OFFLINE": "1"}
            subprocess.run(["apr","pull",f"hf://{c['repo']}","--include",c["filename"],"--out",d],
                          check=True, env=env)
            got = hashlib.sha256(open(pathlib.Path(d)/c["filename"],"rb").read()).hexdigest()
            assert got == c["expected_sha256"], (c, got)
    PY
  if_fails: "apr offline output diverged from huggingface-cli golden bytes"

