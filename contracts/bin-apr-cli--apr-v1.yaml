# ──────────────────────────────────────────────
# bin-apr-cli--apr-v1 — the `apr` bin target of package apr-cli (ONT-10 slice S9; S8 adds routes + tools here)
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha256, helpSha256,
# gitSha, …) live in binary-surface-v1 and are not restated.
#
# WHY S8/S9 SPLIT BY KIND: `in` + minCount + maxCount on bin:command is set equality over the WHOLE node, and pv's
# shapes subset refuses the qualifiedValueShape family (crates/aprender-contracts/src/ontology/shapes.rs), so a
# command set cannot be halved. S9 owns identity + every CLI command. S8 (docs/ont-10/binary-contracts/
# binary-apr-cli-2of2-v1.yaml) owns bin:route and bin:mcpTool of the same node. When S8 moves it appends its
# properties to the ONE shape below; it does not add a second file.
#
# MEASURED (2026-09-26, batch/ont-10 @ b1cd8c0b0, release build, default features, private CARGO_TARGET_DIR):
#   `apr --version` = "apr 0.69.3 (b1cd8c0b08)": G0.1 GREEN.
#   `apr --help` exits 0; `apr --no-such-flag` exits 2; `apr qa --format nosuch x` exits 2.
#   Recursive --help walk: 262 leaves (clap's auto `help` excluded) + 2 runnable non-leaves = 264 commands:
#   `debug` (Usage shows [COMMAND]) and `sim help` (a real subcommand, "Show help").
#   surface_audit.csv rows with binary=apr: 375 = 318 CLI + 47 HTTP + 10 other. The 318 CLI rows reduce to 267
#   command paths (options stripped). Join against the 264, LIVE RED:
#     15 ledgerOrphan, all feature-gated off in the default build:
#       data x doctest extract|merge, data x hub push, data x import hf  (aprender-data features doctest / hf-hub)
#       mono archive|audit|publish|shims                                  (apr-cli feature `dev`)
#       rag eval compare|gate|generate|judge|metrics|retrieve|sample      (aprender-rag-cli feature `eval`)
#     12 unledgeredCommand: capability, pv census, pv challenge check|gen,
#       pv discharge check|gen-axioms|label-ratchet|run, pv extract, pv obligations, pv ontology export|tbox.
#
# CONVENTION ASKED OF extract:binary (ONT-4g, aprender-98): (1) a non-leaf whose Usage shows `[COMMAND]` is also a
# bin:command; (2) only clap's auto-generated `help` is excluded, a user-defined `help` is a command; (3) the
# ledger's binary column says `apr` for BOTH apr targets (apr-cli:apr, aprender:apr), so both nodes join the same
# rows. G0.5 (the two apr targets' help equal) spans two nodes; it stays with the surface_audit_bins gate.
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-apr-cli--apr-v1
version: "1.0.0"
scope: >
  The command surface of the `apr` binary of package apr-cli (src crates/apr-cli/src/main.rs): its help, its usage
  errors, its version string, its exact CLI command set, and its surface-audit rows. HTTP routes and MCP tools are
  slice S8. Out of scope: what each subcommand computes.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    apr (apr-cli) answers --help, rejects an unknown flag as a usage error, names the commit it was built from,
    exposes exactly the 264 commands the snapshot records, and has an audited ledger row for each.
  references:
    - 'contracts/binary-surface-v1.yaml — the shared shapes and vocabulary'
    - 'contracts/bin-aprender-contracts-cli--pv-v1.yaml — the exemplar'
    - 'crates/apr-cli/src/lib.rs — the clap Commands enum'
    - 'docs/audits/surface_audit.csv — the rows whose binary column is apr'
    - 'aprender#4502 — ONT-10, slices S8/S9'

entity:
  type: binary
  ref: binary/apr-cli/apr

relations:
  depends_on: [binary-surface-v1]

