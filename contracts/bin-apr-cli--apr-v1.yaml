equations:
  surface_equals_snapshot:
    formula: "commands(snapshot(apr)) = C, |C| = 264, C = leaves(--help walk) ∪ {non-leaves whose Usage shows [COMMAND]} ∪ {user-defined help} ∧ C = {path(f) : f ∈ surface_audit, f.binary = apr, f is a CLI row}"
    domain: "the apr-cli:apr line of the tracked snapshot and the CLI ledger rows with binary = apr (318 rows, 267 paths)"
    codomain: "set equality, or a Fail naming each command in the symmetric difference"
    invariants:
      - "in + minCount 264 + maxCount 264 over distinct literals is set equality: an added, dropped or renamed command is a violation naming it"
      - "a feature-gated command is a member only if the default build exposes it; its ledger row is an orphan until then"
    preconditions:
      - "the snapshot was written at this commit, default features"
    postconditions:
      - "path(r) = r.feature minus the leading 'apr ', cut at the first token starting with -, <, [ or ("
    lean_theorem: none — L4 not declared

invariants:
  - id: BIN-APR-CLI-APR-INV-001
    property: every apr (apr-cli) command has an audited ledger row, and every CLI ledger row names a command
    formal: '∀ c ∈ commands(apr): ∃ r ∈ surface_audit : r.binary = apr ∧ path(r) = c; ∀ r CLI row with r.binary = apr: path(r) ∈ commands(apr)'
    prose: false

falsification_tests:
  - id: FALSIFY-BIN-APR-CLI-APR-001
    rule: 'G1.2 help answers'
    prediction: '`apr --help` exits 0 with non-empty stdout'
    test: 'scripts/dogfood_surfaces.sh --cli apr'
    if_fails: 'the binary cannot describe its own surface (observed 2026-09-26: exit 0, GREEN)'
    mutation: 'make the top-level --help return an error; must turn RED'
  - id: FALSIFY-BIN-APR-CLI-APR-002
    rule: 'G1.2 an unknown flag is a usage error'
    prediction: '`apr --no-such-flag` exits 2'
    test: 'scripts/dogfood_surfaces.sh --cli apr'
    if_fails: 'a typo is silently ignored (observed 2026-09-26: exit 2, GREEN)'
    mutation: 'add #[arg(allow_hyphen_values)] catch-all at the top level; must turn RED'
  - id: FALSIFY-BIN-APR-CLI-APR-003
    rule: 'G0.1 the version names the commit'
    prediction: '`apr --version` contains the first 9 hex of the git sha it was built from'
    test: 'NOT YET WRITTEN — the binary-target shape bin:versionLacksSha, once extract:binary lands'
    if_fails: 'a stale apr reads as HEAD (observed 2026-09-26: "apr 0.69.3 (b1cd8c0b08)", GREEN)'
    mutation: 'drop the sha from the version string; must turn RED'
  - id: FALSIFY-BIN-APR-CLI-APR-004
    rule: 'G1.3/G1.4 enumerated values are parsed by clap and the command set equals the snapshot'
    prediction: '`apr qa --format nosuch x` exits 2; commands(snapshot) = the 264 literals above'
    test: 'NOT YET WRITTEN — pv lint contracts/ --gate shapes on the snapshot, after extract:binary (ONT-4g)'
    if_fails: 'a leaves-only walk drops `debug` and `sim help`: minCount 264 RED and the `apr debug` row an orphan (observed 2026-09-26: --format exits 2, GREEN)'
    mutation: 'remove `qa` from the snapshot; must turn RED on bin:command and bin:ledgerOrphan naming qa'
  - id: FALSIFY-BIN-APR-CLI-APR-005
    rule: 'ledger rows exist'
    prediction: 'docs/audits/surface_audit.csv has ≥1 CLI row per command with binary = apr (318 CLI rows on 2026-09-26)'
    test: 'scripts/check_surface_audit_bins.sh (aprender#4476)'
    if_fails: 'LIVE RED 2026-09-26: 12 commands unledgered (capability, pv census|challenge *|discharge *|extract|obligations|ontology *), 15 rows orphaned by default-off features (data x doctest|hub|import hf, mono *, rag eval *)'
    mutation: 'delete every apr row; must turn RED naming apr'
