# ─────────────────────────────────────────────────────────────────────────────
# findings-ledger-v1 — findings go to docs/findings/*.jsonl, not to new issues;
# every PR discharges an issue (APR-EPIC-001 v1.3 intake control, row A8, #4455)
#
# WHAT IT GOVERNS
#   * docs/findings/*.jsonl: one JSON object per line and per finding, each
#     with the seven required keys. Sessions append here instead of running
#     `gh issue create`; the cop mints issues from the ledger when the target
#     epic has budget.
#   * Rule 18, "every PR closes one": at PR time, the body of a pull request
#     must discharge an OPEN issue (`Closes #N`, or a rule-20 `Refs #P row
#     <id>`), or say why it cannot (`no-issue: <reason>` at the start of a
#     line). It is enforced by `scripts/check_pr_closes_issue.sh
#     --require-close` in ci.yml's R-2 step. Merged-PR reconciliation
#     (check_reconcile.sh) omits the flag, because a merged PR's target is
#     closed by then.
#
# PROOF LADDER, STATED HONESTLY
#   * L1 — both resolvers exist and are wired. check_findings_ledger.sh runs
#          bare under guard_tree.sh; --require-close runs in ci.yml's R-2 step
#          on pull_request.
#   * L2 — case tables, MEASURED 2026-09-25:
#          check_findings_ledger.sh --self-test has 19 cases, 10/10 mutants
#          killed; check_pr_closes_issue.sh --self-test has 93 cases (72 of
#          them rule-18 rows); 45 mutants, 44 killed, 1 equivalent
#          (dropping CLOSE_LINE_RE's end anchor: the extracting sed re-anchors it).
#   * L3/L4 — NOT APPLICABLE: a data file and a PR body, not a kernel.
# ─────────────────────────────────────────────────────────────────────────────
name: findings-ledger
version: "1.0.0"
scope: >
  Every docs/findings/*.jsonl file, and the body of every pull request at PR
  time. Out of scope: who may run `gh issue create` (a session rule in
  CLAUDE.md that no guard can observe, because every session files issues as
  the same GitHub account; see ledger row FND-20260925-flow011-author), and
  the cop's minting budget (APR-EPIC-001 FLOW-011..013, row A6).
status: active

metadata:
  kind: pattern     # a data-file and PR-body rule, not a math kernel. Set
                    # EXPLICITLY so `pv validate`'s `kernel` default never applies.
  version: "1.0.0"
  created: '2026-09-25'
  last_modified: '2026-09-25'
  author: PAIML Engineering
  references:
    - 'scripts/check_findings_ledger.sh — the ledger guard: bare (case table, then docs/findings/) · <dir> · --self-test (19 cases)'
    - 'scripts/check_pr_closes_issue.sh --require-close — rule 18 at PR time (72 rc-* rows in --self-test)'
    - '.github/workflows/ci.yml — the R-2 step (pull_request only) runs the guard with --require-close'
    - 'scripts/release/prepare_bump.sh — the bump PR body carries a `no-issue:` line and is preflighted with --require-close'
    - 'docs/findings/README.md — the row schema, for the sessions that write it'
    - 'APR-EPIC-001 v1.3 row A8, issue #4455'
  description: >
    A finding is one line of JSON with exactly the keys id, title, evidence,
    repro, suspected_epic, severity and found_at_sha, all non-empty strings.
    severity is P0..P3, found_at_sha is 7-40 lowercase hex, and id is
    [A-Za-z0-9._-]+ and unique across all ledger files. An empty ledger is
    RED. A pull request's body must discharge an open issue or give a
    `no-issue:` reason.

equations:
  every_row_is_complete:
    formula: |
      ∀ file ∈ docs/findings/*.jsonl, ∀ non-blank line ℓ ∈ file:
        r = json(ℓ) is an object
        keys(r) = {id, title, evidence, repro, suspected_epic, severity, found_at_sha}
        ∀ k: r[k] is a string with non-whitespace content
        r.severity ∈ {P0, P1, P2, P3}
        r.found_at_sha ~ ^[0-9a-f]{7,40}$
        r.id ~ ^[A-Za-z0-9._-]+$
    domain: 'every non-blank line of docs/findings/*.jsonl'
    codomain: 'bool'
    invariants:
    - 'ROWS SPLIT ON NEWLINE ONLY (case raw-u2028): a raw U+2028 inside a JSON string is valid, so splitlines() is not the row splitter.'
    - 'NO KEY TWICE (case duplicate-key): json keeps only the last value, so a row with two severity keys is refused rather than read as whichever came last.'
    - 'NO EXTRA KEYS (case typo-key): a misspelt `severty` is refused, so it cannot sit beside a row that is otherwise complete.'
    - 'ONLY *.jsonl IS LEDGER (case readme-ignored): README.md beside the rows is not parsed.'
    preconditions: []
    postconditions:
    - 'the guard prints one FAIL line per defect, naming <file>:<line>'

  ids_are_unique_and_the_ledger_is_not_empty:
    formula: |
      |{ r.id }| = |rows|  across ALL ledger files
      |rows| ≥ 1
    domain: 'the union of docs/findings/*.jsonl'
    codomain: 'bool'
    invariants:
    - 'A DUPLICATE ACROSS FILES IS A DUPLICATE (case dup-files): the second one is named, together with the location of the first.'
    - 'ZERO ROWS IS VACUOUS, NOT GREEN (case empty).'
    preconditions: []
    postconditions:
    - 'the OK line reports the row count it checked'

  every_pr_discharges_an_open_issue:
    formula: |
      prose(body) = the lines outside ``` / ~~~ fences, <!-- --> comments, HTML blocks, blockquotes (with lazy continuations) and lines starting inside a code span, tag or link reference definition opened earlier in the paragraph; an unclosed block runs to the end
      at PR time: prose ∋ a line, whole and at column 0, `(Closes|Fixes|Resolves)[:] [own/repo]#N[.]` with N an OPEN issue in this repo
               ∨ prose ∋ a line `Refs #P row <id>[.]` with P an OPEN issue in this repo whose body has an unticked line `- [ ] <id>:`
               ∨ prose ∋ a line matching ^no-issue:\s*\S
      a target that cannot be resolved fails as close-target-unverified, never as a pass
    domain: 'the pull_request body in ci.yml R-2, and the bump PR body in prepare_bump.sh'
    codomain: 'bool'
    invariants:
    - 'A DISCHARGE IS A WHOLE LINE AT COLUMN 0 OF PROSE (rc-close-fenced, -tilde-fence, -unclosed-fence, -unclosed-comment, -html-comment, -backticked, -double-tick, -indented, -blockquote, -in-sentence, -mid-word, -suffix; rc-row-ref-fenced, -in-sentence; rc-no-issue-fenced, -indented, -nbsp; rc-close-in-pre, -in-html-block, -in-pi, -in-cdata, -in-declaration, -after-comment-same-line, -lazy-quote, -in-multiline-code, -in-multiline-tag, -after-linkref, -in-code-after-comment, rc-fence-after-quote): fences, comments, HTML blocks and blockquotes are tracked line by line; a line touching a comment is dropped whole, an unclosed one running to the end as GitHub renders it, and only a line in one strict form counts. Where the pass is unsure it drops the line: a false RED costs a reworded body, a false GREEN a PR that closes nothing. It replaced a regex strip that agy rounds kept finding Markdown shapes past.'
    - 'NO FALSE RED ON LEGITIMATE LAYOUT (rc-two-close-lines, rc-close-after-fence, -after-comment, -after-inline-comment, rc-mixed-fences, rc-comment-opened-in-fence, rc-crlf-fence-closes, rc-no-issue-code-reason, rc-close-after-pre, -after-html-blank, -after-quote-blank, -after-quote-then-fence, rc-backtick-info-not-fence, rc-close-after-balanced-code, -after-closed-tag, -after-open-code-para).'
    - 'REFS ALONE DOES NOT DISCHARGE (rc-flow-012-refs-only, FALSIFY-FLOW-012).'
    - 'A ROW REF MUST NAME A REAL, UNTICKED ROW (rc-row-ref-fabricated, -ticked, -prefix): the parent body must carry `- [ ] <id>:` in prose (rc-row-ref-parent-fenced), matched whole, and `Refs` must start a word (rc-row-ref-mid-word: `Xrefs #N row X` is prose); a row ref closes nothing on merge, so an unchecked id would let `Refs #1 row x` discharge rule 18. An unreadable parent body is close-target-unverified (rc-row-ref-no-body).'
    - 'A CLOSED ISSUE, A PR NUMBER OR A CROSS-REPO TARGET DOES NOT DISCHARGE (rc-closes-closed, rc-closes-pr, rc-cross-repo).'
    - 'R-2 STILL APPLIES UNDER THE FLAG (rc-r2-still-applies).'
    - 'A `[bot]` AUTHOR IS EXEMPT FROM RULE 18 ONLY (rc-bot-exempt, rc-bot-r2-applies): dependabot cannot write a trailer; a human login that merely looks like a bot is not exempt (rc-bot-lookalike). ci.yml passes --author from the pull_request payload.'
    preconditions:
    - 'GH_TOKEN is set in the R-2 step, so issue state can be read'
    postconditions:
    - 'check_reconcile.sh does not pass the flag: merged PRs are judged by R-2 alone'

proof_obligations:
  - id: FND-OB-001
    statement: "Every ledger row carries exactly the seven keys, each non-empty, with a valid severity, sha and id."
    discharged_by: falsification_tests[0]
  - id: FND-OB-002
    statement: "Ids are unique across files, and an empty ledger is RED."
    discharged_by: falsification_tests[1]
  - id: FND-OB-003
    statement: "At PR time a body discharges an open issue or gives a no-issue reason."
    discharged_by: falsification_tests[2]
  - id: FND-OB-004
    statement: "Both guards are wired: the ledger guard under guard_tree, --require-close in ci.yml R-2."
    discharged_by: falsification_tests[3]

falsification_tests:

  - id: FND-F-001
    rule: every row is complete
    prediction: >-
      A good row PASSES. Non-JSON, a non-object, a missing repro, a
      whitespace-only evidence, a numeric suspected_epic, an unknown key,
      severity `high`, sha `HEAD`, a 6-hex sha and an id with a space all
      FAIL, each with its own marker.
    test: 'bash scripts/check_findings_ledger.sh --self-test'
    if_fails: >-
      the cop reads a finding it cannot triage without asking the author
    mutation: >-
      replace `if missing:` with `if False:` in check_dir; case missing-repro
      must turn RED.

  - id: FND-F-002
    rule: unique ids, non-empty ledger
    prediction: >-
      The same id twice in one file FAILS, as it does in two files (naming
      the first); a ledger with zero rows FAILS.
    test: 'bash scripts/check_findings_ledger.sh --self-test'
    if_fails: >-
      two findings share a handle and one is minted twice or never
    mutation: >-
      replace `if rows == 0:` with `if False:`; case empty must turn RED.

  - id: FND-F-003
    rule: every PR discharges an open issue
    prediction: >-
      Closes of an open issue, an own-repo prefix, a rule-20 row ref and a
      no-issue line PASS. Refs-only, no refs, an empty or mid-line no-issue,
      a closed issue, a PR number, a cross-repo target and a row ref to a
      closed issue FAIL as no-close. An unresolvable target FAILS as
      close-target-unverified.
    test: 'bash scripts/check_pr_closes_issue.sh --self-test'
    if_fails: >-
      PRs merge without closing anything, and the open-issue count only grows
    mutation: >-
      count `unknown` ref kinds as open in check_require_close; case
      rc-unresolvable must turn RED.

  - id: FND-F-004
    rule: both guards are wired
    prediction: >-
      check_guards_are_wired.sh passes with its ratchet unchanged;
      check_release_bump_pr_body.sh passes, so the bump PR body satisfies
      --require-close by construction.
    test: 'bash scripts/check_guards_are_wired.sh && bash scripts/check_release_bump_pr_body.sh'
    if_fails: >-
      the rule exists and gates nothing (class #2878)
    mutation: >-
      delete the `no-issue:` line that prepare_bump.sh appends; the prs-only
      row of check_release_bump_pr_body.sh must turn RED (measured
      2026-09-25: a bump whose CHANGELOG cites only PRs discharges nothing).

non_goals:
  - "Detecting who ran `gh issue create`: every session and the cop share one GitHub account (FND-20260925-flow011-author). That belongs to FLOW-011, row A6."
  - "Migrating issues already filed into the ledger."

binding_registry:
  guard: scripts/check_findings_ledger.sh
  ci_job: guard-tree                   # run bare by scripts/guard_tree.sh
  make_target: tier3
  issue: "https://github.com/paiml/aprender/issues/4455"
