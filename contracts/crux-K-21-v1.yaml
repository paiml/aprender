# CRUX-K-21 — MLX backend (Apple Silicon native)

metadata:
  id: CRUX-K-21
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "K — Deployment & Integration"
  competitor: ecosystem
  demand_score: 3
  intake_status: missing
  description: >
    MLX backend: run apr inference on Apple Silicon GPU via
    ml-explore/mlx. Canonical: `mlx_lm.load(model_path).generate(...)`
    over npz/safetensors weights. Shipped as a build-time feature
    gate — absent on non-Darwin arm64 builds. Parity vs apr native
    fp16 CPU: logit cosine ≥0.999 on the same prompt.

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5 + §12'
  - github.com/triton-inference-server/server
  - github.com/ai-dynamo/dynamo
  - github.com/NVIDIA/TensorRT-LLM
equations:
  mlx_backend:
    formula: |
      build target: aarch64-apple-darwin only
      apr run --backend mlx model.apr --prompt p →
         { logits, tokens, tps } where:
           cos_sim(logits_mlx, logits_native_fp16) ≥ 0.999
           tps_mlx ≥ 1.5 × tps_native_cpu (M3 Pro baseline)
    domain: "(model: Path, prompt: str, dtype ∈ {fp16, bf16})"
    codomain: "apr inference output over MLX GPU kernels"
    invariants:
    - "feature gate: `apr --features mlx` only builds on aarch64-apple-darwin"
    - "logit cosine ≥ 0.999 vs native fp16 CPU"
    - "determinism at temp=0 + seed=fixed (byte-identical token stream)"

falsification_tests:
- id: FALSIFY-CRUX-K-21-001
  rule: MLX feature absent on non-Darwin targets
  prediction: "`apr --features mlx` build fails on x86_64-unknown-linux-gnu"
  test: |
    set -euo pipefail
    if [[ "$(uname -sm)" == "Darwin arm64" ]]; then
      echo "skip: this FALSIFY only runs on non-darwin"
      exit 0
    fi
    ! cargo build --features mlx -p apr-cli 2>/tmp/err
    grep -E "mlx|darwin|feature" /tmp/err
  if_fails: rule 'MLX feature absent on non-Darwin targets' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-K-21-002
  rule: parity with native fp16 ≥0.999 cosine
  prediction: "mlx logits match native within cosine gate (Darwin arm64 only)"
  test: |
    set -euo pipefail
    if [[ "$(uname -sm)" != "Darwin arm64" ]]; then
      echo "skip: mlx path requires Apple Silicon"
      exit 0
    fi
    apr trace tests/fixtures/tiny.apr --dtype fp16 --input hello \
      --dump-logits /tmp/native.npy
    apr trace tests/fixtures/tiny.apr --backend mlx --input hello \
      --dump-logits /tmp/mlx.npy
    uv run --with numpy python3 -c "
    import numpy as np
    a=np.load('/tmp/mlx.npy'); b=np.load('/tmp/native.npy')
    cos=float((a.flatten() @ b.flatten()) / (np.linalg.norm(a)*np.linalg.norm(b)+1e-12))
    assert cos >= 0.999, cos
    "
  if_fails: rule 'parity with native fp16 ≥0.999 cosine' is violated — contract MUST be re-verified against competitor canonical reference
- id: FALSIFY-CRUX-K-21-003
  rule: determinism at temp=0 on MLX
  prediction: "two runs with temp=0, seed=42 produce identical tokens"
  test: |
    set -euo pipefail
    if [[ "$(uname -sm)" != "Darwin arm64" ]]; then
      echo "skip"; exit 0
    fi
    for i in 1 2; do
      apr run tests/fixtures/tiny.apr --backend mlx --prompt "2+2=?" \
        --temperature 0 --seed 42 --max-tokens 8 --format json > /tmp/m$i.json
    done
    diff <(jq -S .tokens /tmp/m1.json) <(jq -S .tokens /tmp/m2.json)

  if_fails: rule 'determinism at temp=0 on MLX' is violated — contract MUST be re-verified against competitor canonical reference
proof_obligations:
- type: equivalence
  property: "apr --backend mlx matches mlx_lm generate interface and yields ≥0.999 cosine vs native"
- type: invariant
  property: "feature flag gated to Darwin arm64"
- type: invariant
  property: "determinism at temp=0"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

