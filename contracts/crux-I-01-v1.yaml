  - spec.modelcontextprotocol.io
  - github.com/anthropics/anthropic-sdk-python — Agent SDK
equations:
  tools_list_schema:
    formula: |
      JSON-RPC 2.0 request { "method": "tools/list", "id": <n>, "jsonrpc": "2.0" }
      → response:
        response.jsonrpc == "2.0"
        response.id == <n>
        response.result.tools ∈ List[Tool], |tools| >= 1
        ∀ t ∈ tools:  t.name: string,
                      t.description: string,
                      t.inputSchema: JSONSchema object (type == "object")
    domain: JSON-RPC request to apr mcp serve
    codomain: tools/list response object
    invariants:
    - "tools array is non-empty (covers apr subcommands)"
    - "Each tool has {name, description, inputSchema} — all three REQUIRED by MCP spec"
    - "inputSchema is a JSON Schema object with type == 'object'"
    - "Reference: https://modelcontextprotocol.io/specification/2024-11-05/server/tools"

  tools_call_result:
    formula: |
      JSON-RPC request { "method": "tools/call",
                          "params": { "name": T, "arguments": A } }
      where T ∈ tools/list result
      → response.result: { content: Array<ContentBlock>, isError?: bool }
      and content[i] ∈ {text, image, resource} variants.
    domain: (tool name T, arguments A matching T.inputSchema)
    codomain: CallToolResult
    invariants:
    - "tools/call on a known tool returns content array"
    - "response content blocks validate against MCP ContentBlock schema"
    - "For 'qa' tool: result contains structured JSON or text block with pass/fail verdict"

  schema_description_codegen_parity:
    formula: |
      For every registered tool T:
        T.description == env!("APR_<T>_DESCRIPTION")
        T.inputSchema == env!("APR_<T>_SCHEMA")
      (both generated by build.rs — cannot be hand-edited)
    domain: registered MCP tools
    codomain: build-time constants
    invariants:
    - "FALSIFY-MCP-008 enforcement: descriptions & schemas are codegen-only (PMAT-514)"
    - "No runtime drift possible between codegen source and served metadata"

falsification_tests:
- id: FALSIFY-CRUX-I-01-001
  rule: "tools/list returns non-empty array"
  prediction: "apr mcp serve responds to tools/list with tools.length >= 1"
  test: |
    apr mcp serve --port 7701 &
    MCP_PID=$!
    trap "kill $MCP_PID 2>/dev/null || true" EXIT
    sleep 1
    N=$(curl -sS -X POST http://127.0.0.1:7701/rpc \
           -H 'Content-Type: application/json' \
           -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
         | jq '.result.tools | length')
    test "$N" -ge 1
  if_fails: "tools/list returns empty/missing tools array — no apr subcommands exposed"

- id: FALSIFY-CRUX-I-01-002
  rule: "each tool has {name, description, inputSchema}"
  prediction: "every tool entry contains all three required MCP fields"
  test: |
    apr mcp serve --port 7702 &
    MCP_PID=$!
    trap "kill $MCP_PID 2>/dev/null || true" EXIT
    sleep 1
    MISSING=$(curl -sS -X POST http://127.0.0.1:7702/rpc \
                -H 'Content-Type: application/json' \
                -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | \
              jq '[.result.tools[] | select(
                    (.name | type != "string") or
                    (.description | type != "string") or
                    (.inputSchema.type != "object"))] | length')
    test "$MISSING" -eq 0
  if_fails: "at least one tool is missing name/description/inputSchema or inputSchema.type != 'object'"

- id: FALSIFY-CRUX-I-01-003
  rule: "tools/call on 'qa' returns valid result"
  prediction: "tools/call method='qa' returns content array with pass/fail evidence"
  test: |
    apr mcp serve --port 7703 &
    MCP_PID=$!
    trap "kill $MCP_PID 2>/dev/null || true" EXIT
    sleep 1
    RESP=$(curl -sS -X POST http://127.0.0.1:7703/rpc \
             -H 'Content-Type: application/json' \
             -d '{"jsonrpc":"2.0","id":2,"method":"tools/call",
                  "params":{"name":"qa","arguments":{"model":"model.apr"}}}')
    echo "$RESP" | jq -e '.result.content | type == "array" and length >= 1'
  if_fails: "tools/call qa returned no content array (tool dispatch broken)"

- id: FALSIFY-CRUX-I-01-004
  rule: "MCP protocol: jsonrpc==2.0 + id echo"
  prediction: "every response echoes jsonrpc='2.0' and the request id"
  test: |
    apr mcp serve --port 7704 &
    MCP_PID=$!
    trap "kill $MCP_PID 2>/dev/null || true" EXIT
    sleep 1
    RESP=$(curl -sS -X POST http://127.0.0.1:7704/rpc \
             -H 'Content-Type: application/json' \
             -d '{"jsonrpc":"2.0","id":42,"method":"tools/list"}')
    echo "$RESP" | jq -e '.jsonrpc == "2.0" and .id == 42'
  if_fails: "MCP server violates JSON-RPC 2.0 envelope (jsonrpc/id mismatch)"

- id: FALSIFY-CRUX-I-01-005
  rule: "MCP ecosystem parity — schema codegen enforcement (FALSIFY-MCP-008)"
  prediction: "served descriptions/schemas match build.rs codegen constants"
  test: |
    # TODO: evidence/crux/ecosystem/i-01/ — record a reference mcp inspector session
    apr mcp serve --port 7705 &
    MCP_PID=$!
    trap "kill $MCP_PID 2>/dev/null || true" EXIT
    sleep 1
    SERVED=$(curl -sS -X POST http://127.0.0.1:7705/rpc \
               -H 'Content-Type: application/json' \
               -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | \
             jq -c '.result.tools | map({name, description, inputSchema}) | sort_by(.name)')
    EXPECTED=$(apr mcp dump-codegen-manifest --json | jq -c '. | sort_by(.name)')
    test "$SERVED" = "$EXPECTED"
  if_fails: "description/schema drift vs build.rs codegen (FALSIFY-MCP-008 regressed)"

proof_obligations:
- type: invariant
  property: "tools/list returns non-empty array (>=1 tool registered)"
- type: invariant
  property: "every tool has required MCP fields {name, description, inputSchema(type=object)}"
- type: invariant
  property: "JSON-RPC 2.0 envelope preserved (jsonrpc=='2.0', id echoed)"
- type: invariant
  property: "tools/call dispatches and returns MCP-shaped content array"
- type: equivalence
  property: "Served metadata matches Model Context Protocol 2024-11-05 server/tools schema and equals build.rs codegen manifest (no hand-edit drift)"
  reference: "https://modelcontextprotocol.io/specification/2024-11-05/server/tools"

