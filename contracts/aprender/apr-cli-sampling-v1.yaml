metadata:
  version: 1.1.0
  created: '2026-04-06'
  author: PAIML Engineering
  description: >
    CLI sampling parameter contract — temperature, top-k, top-p, seed,
    repeat-penalty, max-tokens bounds and determinism guarantees for
    apr run / apr serve inference endpoints.
  references:
  - 'apr-cli/src/commands/run.rs — SamplingConfig, generate()'
  - 'apr-cli/src/commands/serve/ — /v1/completions handler'
  - 'Holtzman et al. (2020) The Curious Case of Neural Text Degeneration'
  - 'Fan et al. (2018) Hierarchical Neural Story Generation (top-k)'
  depends_on:
  - apr-cli-v1
  - apr-serve-v1

equations:
  temperature_bounds:
    formula: |
      validate_temperature(t): f32 -> Result<f32, Error>
        t == 0.0 -> greedy decoding (argmax)
        0.0 < t < 1.0 -> sharper distribution
        t == 1.0 -> unmodified logits
        t > 1.0 -> flatter distribution (more random)
        t < 0.0 -> rejected
    domain: Temperature parameter from CLI or API
    codomain: Validated temperature value
    invariants:
    - Temperature must be non-negative
    - Temperature 0.0 produces deterministic output (GH-637)
    - Temperature 0.0 produces non-empty output on GPU (GH-637)
    - Temperature must be FINITE — NaN/±inf are rejected (PMAT-757). `NaN <= 0.0` is false
      (IEEE-754 unordered), so a bare `<= 0.0` guard lets NaN through; `logit / NaN = NaN`
      then poisons the whole distribution and silently biases sampling to the last token.
    preconditions:
    - temperature >= 0.0
    - temperature.is_finite()
    postconditions:
    - output tokens are non-empty for valid prompt
    lean_theorem: Theorems.TemperatureScaling

  top_k_top_p_interaction:
    formula: |
      sample(logits, top_k, top_p, temperature): Sampling
        1. Apply temperature: logits_t = logits / temperature
        2. Top-K filter: keep top_k highest logits (if top_k > 0)
        3. Top-P (nucleus): keep smallest set summing to >= top_p
        4. Sample from filtered distribution
      top_k=0 means no top-k filtering
      top_p=1.0 means no nucleus filtering
    domain: Logits vector, sampling parameters
    codomain: Sampled token ID
    invariants:
    - top_k=0 disables top-k (uses all tokens) (GH-569)
    - top_p=1.0 disables nucleus sampling
    - top_k=1 is equivalent to greedy (argmax)
    - Output token ID < vocab_size
    preconditions:
    - logits.len() == vocab_size
    - top_k >= 0
    - 0.0 < top_p <= 1.0
    postconditions:
    - sampled token_id < vocab_size
    lean_theorem: Theorems.TopK

  seed_determinism:
    formula: |
      generate(prompt, seed): (String, u64) -> Vec<TokenId>
        forall prompt, seed:
          generate(prompt, seed) == generate(prompt, seed)  (deterministic)
        Different seeds may produce different outputs
    domain: Prompt with explicit RNG seed
    codomain: Deterministic token sequence
    invariants:
    - Same seed produces identical output (GH-570)
    - Determinism holds across runs (no external entropy)
    - --seed 0 uses random seed (convention)
    - RNG draw value is in the HALF-OPEN interval [0, 1) (PMAT-757). sample_from_distribution
      selects on `rng_value < cumsum`; a draw of exactly 1.0 matches no token and falls
      through to the biased last-(lowest-prob)-token fallback. The naive
      `(state >> 33) as f32 / (1<<31) as f32` yields 1.0 because 2^31-1 rounds UP to 2^31 in
      f32; the f32-safe construction is `(state >> 40) as f32 / (1<<24) as f32`
      (numerator exact in f32 -> strictly < 1.0). Determinism is preserved.
    preconditions:
    - seed is a valid u64
    postconditions:
    - output is deterministic for given seed
    lean_theorem: Theorems.SeedDeterminism

  repeat_penalty:
    formula: |
      apply_repeat_penalty(logits, generated, penalty, window): Vec<f32>
        for each token in generated[-window..]:
          logits[token] /= penalty  (if logits[token] > 0)
          logits[token] *= penalty  (if logits[token] < 0)
    domain: Logits, generated tokens, penalty factor, window size
    codomain: Penalized logits
    invariants:
    - Penalty 1.0 is identity (no change) (GH-571)
    - Penalty > 1.0 reduces probability of repeated tokens
    - Window limits how far back to look
    preconditions:
    - penalty >= 1.0
    - window > 0
    postconditions:
    - repeated tokens have reduced logit values
    lean_theorem: Theorems.RepeatPenalty

  exit_code_on_failure:
    formula: |
      exit_code(result): Result<(), CliError> -> i32
        All error paths exit non-zero:
          prune failure -> exit != 0 (GH-608)
          train plan validation failure -> exit != 0 (GH-632)
          showcase missing step -> exit != 0 (GH-677)
    domain: Command result
    codomain: Process exit code
    invariants:
    - Error results never exit 0 (GH-608, 632, 647, 677)
    - Silent failures are prohibited
    preconditions:
    - command completed
    postconditions:
    - Err(_) => exit_code != 0
    lean_theorem: Theorems.ExitCodeOnFailure

kernel_structure:
  phases:
  - name: validate_input
    description: Parse and validate sampling parameters (temperature, top-k, top-p, seed, penalty)
  - name: execute
    description: Apply sampling strategy to model logits
  - name: verify_output
    description: Verify output determinism for seeded runs, exit codes for failures

proof_obligations:
- type: invariant
  property: Temperature must be non-negative
  formal: 'temperature >= 0.0'
  applies_to: temperature_bounds
  lean:
    theorem: Theorems.TemperatureScaling
    module: ProvableContracts.Theorems.Sampling.TemperatureScaling
    status: proved
    notes: >
      ANALYTIC-PROVED. tempScale_monotone / tempScale_mono_le / tempScale_preserves_argmax /
      valid_temperature_nonneg: for a valid temperature t > 0, dividing logits by t is an
      order-preserving rescaling, so it preserves the pairwise ordering and the argmax —
      exactly why t -> 0+ recovers greedy decoding and why any t > 0 leaves the sampled-from
      set intact. `valid_temperature_nonneg` records the guard `temperature >= 0.0`. Verified:
      lake env lean ProvableContracts/Theorems/Sampling/TemperatureScaling.lean (exit 0, 0 sorry).
- type: invariant
  property: Top-K 0 disables filtering
  formal: 'top_k == 0 => all tokens considered'
  applies_to: top_k_top_p_interaction
  lean:
    theorem: Theorems.TopK
    module: ProvableContracts.Theorems.Sampling.TopK
    status: proved
    notes: >
      ANALYTIC-PROVED (structural). topk_separates: every kept token strictly dominates every
      dropped token (top-k keeps the k largest logits, modelled by its cutoff threshold).
      topk_zero_keeps_all: a cutoff at/below the minimum (the top_k=0 sentinel) keeps every
      token — filtering disabled. topk_one_is_argmax: cutoff at the max keeps exactly the
      argmax, so top_k=1 == greedy. Verified: lake env lean
      ProvableContracts/Theorems/Sampling/TopK.lean (exit 0, 0 sorry).
- type: invariant
  property: Same seed produces identical output
  formal: 'generate(p, s) == generate(p, s)'
  applies_to: seed_determinism
  lean:
    theorem: Theorems.SeedDeterminism
    status: not-applicable
    notes: >
      GENUINE-NA (runtime/empirical). Bit-identical generation across separate process runs
      with no external entropy leakage is a property of the concrete RNG + I/O + threading
      pipeline, not a real-number identity. A Lean `f x = f x` reflexivity would prove nothing
      about the runtime claim (theater), so this stays outside the Lean layer and is enforced
      by falsification test FALSIFY-SAMP-003.
- type: invariant
  property: Temperature must be finite (NaN/inf rejected)
  formal: '!temperature.is_finite() => Err(_)'
  applies_to: temperature_bounds
  lean:
    theorem: Theorems.TemperatureBounds
    status: not-applicable
    notes: >
      GENUINE-NA (IEEE-754). The obligation is about detecting NaN / +-inf, which Lean's ℝ
      does not model (ℝ has no NaN or infinities). `NaN <= 0.0` being false under IEEE
      unordered semantics is precisely an IEEE-754 float fact, not a real-number theorem.
      Enforced by falsification test FALSIFY-SAMP-007.
- type: invariant
  property: RNG draw value is in [0, 1)
  formal: '0.0 <= lcg_state_to_unit_f32(s) < 1.0 for all s: u64'
  applies_to: seed_determinism
  lean:
    theorem: Theorems.SeedDeterminism
    status: not-applicable
    notes: >
      GENUINE-NA (IEEE-754 f32 rounding). The entire content of this obligation is f32
      round-to-nearest behaviour: the naive (state>>33)/(1<<31) maps 2^31-1 UP to 2^31 (=1.0),
      while (state>>40)/(1<<24) keeps the numerator exact in f32 so the quotient is strictly
      < 1.0. Lean's ℝ has no f32 rounding, so a real-number proof would NOT capture the actual
      concern. Enforced by falsification test FALSIFY-SAMP-008.
- type: invariant
  property: Penalty 1.0 is identity
  formal: 'apply_penalty(logits, _, 1.0, _) == logits'
  applies_to: repeat_penalty
  lean:
    theorem: Theorems.RepeatPenalty
    module: ProvableContracts.Theorems.Sampling.RepeatPenalty
    status: proved
    notes: >
      ANALYTIC-PROVED. penalty_one_identity: applyPenalty l 1 = l for every logit l (all three
      sign branches collapse via l/1 = l, l*1 = l). penalty_reduces_positive /
      penalty_reduces_negative strengthen it: any p >= 1 never increases a repeated token's
      logit. Verified: lake env lean ProvableContracts/Theorems/Sampling/RepeatPenalty.lean
      (exit 0, 0 sorry).
- type: invariant
  property: Error results never exit 0
  formal: 'Err(_) => exit_code != 0'
  applies_to: exit_code_on_failure
  lean:
    theorem: Theorems.ExitCodeOnFailure
    status: not-applicable
    notes: >
      GENUINE-NA (runtime CLI behaviour). This is a property of the real process exit code
      emitted by the `apr` binary on error paths, not a mathematical identity. Enforced by
      falsification tests FALSIFY-SAMP-005 / FALSIFY-SAMP-006.

falsification_tests:
- id: FALSIFY-SAMP-001
  rule: Temperature 0 produces non-empty output
  prediction: apr run --temperature 0 produces tokens on GPU
  test: |
    Run with temperature=0 --max-tokens 16, assert output.len() > 0.
  if_fails: Temperature 0 generates 0 tokens on GPU (GH-637)
- id: FALSIFY-SAMP-002
  rule: Top-K 0 disables filtering
  prediction: top_k=0 considers all vocab tokens
  test: |
    Compare output distribution with top_k=0 vs top_k=vocab_size.
  if_fails: top_k=0 interpreted as "keep 0 tokens" (GH-569)
- id: FALSIFY-SAMP-003
  rule: Seed determinism
  prediction: Same seed produces identical output across 2 runs
  test: |
    Run twice with --seed 42, assert outputs identical.
  if_fails: External entropy leaks into seeded generation (GH-570)
- id: FALSIFY-SAMP-004
  rule: Repeat penalty 1.0 is identity
  prediction: --repeat-penalty 1.0 produces same output as no penalty
  test: |
    Compare output with and without --repeat-penalty 1.0.
  if_fails: Penalty 1.0 modifies logits (GH-571)
- id: FALSIFY-SAMP-005
  rule: Prune exits non-zero on failure
  prediction: apr prune on invalid model exits != 0
  test: |
    Run apr prune on non-existent file, assert exit code != 0.
  if_fails: Prune exits 0 without producing output file (GH-608)
- id: FALSIFY-SAMP-006
  rule: Train plan exits non-zero on validation failure
  prediction: apr train plan with invalid config exits != 0
  test: |
    Run apr train plan with bad --model-size, assert exit code != 0.
  if_fails: Train plan exits 0 on validation failure (GH-632)
- id: FALSIFY-SAMP-007
  rule: Non-finite temperature is rejected (PMAT-757)
  prediction: apply_temperature rejects NaN / +inf / -inf with an error; positive finite still ok
  test: |
    cargo test -p aprender-serve --lib test_apply_temperature_rejects_non_finite
  if_fails: NaN/inf temperature passes the `<= 0.0` guard and `logit / NaN = NaN` poisons the
    distribution, silently biasing sampling to the last token with no error surfaced.
- id: FALSIFY-SAMP-008
  rule: RNG unit draw is in [0, 1) (PMAT-757)
  prediction: lcg_state_to_unit_f32(state) is in [0,1) for all states incl. u64::MAX (which
    the old (state>>33)/(1<<31) f32 formula mapped to exactly 1.0)
  test: |
    cargo test -p aprender-serve --lib test_lcg_state_to_unit_f32_in_half_open_unit_interval
  if_fails: rng_value can equal 1.0, so `rng_value < cumsum` never matches and
    sample_from_distribution falls through to its biased last-(lowest-prob)-token fallback.

kani_harnesses:
- id: KANI-SAMP-001
  obligation: Temperature must be non-negative
  property: 'temperature >= 0.0'
  bound: 8
  strategy: bounded_int
  harness: verify_temperature_bounds
- id: KANI-SAMP-002
  obligation: Top-K 0 disables filtering
  property: 'top_k == 0 => no filtering'
  bound: 8
  strategy: bounded_int
  harness: verify_top_k_zero
- id: KANI-SAMP-003
  obligation: Same seed produces identical output
  property: deterministic for same seed
  bound: 4
  strategy: exhaustive
  harness: verify_seed_determinism
- id: KANI-SAMP-004
  obligation: Penalty 1.0 is identity
  property: 'penalty == 1.0 => logits unchanged'
  bound: 8
  strategy: bounded_int
  harness: verify_penalty_identity
- id: KANI-SAMP-005
  obligation: Error results never exit 0
  property: 'Err => exit != 0'
  bound: 16
  strategy: exhaustive
  harness: verify_exit_code_on_failure

qa_gate:
  id: F-SAMP-GATE
  name: Sampling Parameter Contract
  description: Quality gate for CLI sampling parameters and determinism
  checks:
  - validation
  - falsification
  pass_criteria: All 6 falsification tests pass

# Level 4 (Lean-proved) climb — HONEST classification.
#   3 ANALYTIC obligations proved in verified Lean (0 sorry):
#     - Temperature non-negative / scaling preserves argmax (Theorems.Sampling.TemperatureScaling)
#     - Top-K structural: keeps k largest, top_k=0 no-filter, top_k=1 = argmax (Theorems.Sampling.TopK)
#     - Repeat-penalty 1.0 identity (Theorems.Sampling.RepeatPenalty)
#   4 GENUINELY-NOT-APPLICABLE obligations (runtime / IEEE-754, no real-number core):
#     - Seed bit-determinism across process runs (runtime/empirical)
#     - Finite-temperature (NaN/inf) rejection (IEEE-754; ℝ has no NaN/inf)
#     - RNG unit draw in [0,1) (IEEE-754 f32 rounding exactness)
#     - Error paths exit non-zero (runtime CLI process behaviour)
# proved (3) + not_applicable (4) == total_obligations (7); proved > 0 => L4.
verification_summary:
  total_obligations: 7
  l2_property_tested: 7
  l3_kani_proved: 5
  l4_lean_proved: 3
  l4_sorry_count: 0
  l4_not_applicable: 4
