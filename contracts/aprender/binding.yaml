# `target_crate:` at the top of this file is `aprender`, while every entry
# below names `aprender_contrastive_data::…` or `entrenar::…`. That was the
# open question plan 02-08 could not have answered mid-wave, so 02-02 probed
# it: cross-crate module paths are ACCEPTED (Bound 0 -> 1, BIND-001 24 -> 23,
