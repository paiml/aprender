# WHY ALL TEN STARTED `pending`, AND WHY THAT WAS THE POINT RATHER THAN AN OMISSION. Same
# ordering as Phase 4 above (Ph1 D-14): the claims contract is committed BEFORE the row type,
# the bench adapters and the report renderer exist, so no shipped code can quietly answer its
# questions differently.
#
# EACH FLIP WAS VERIFIED AGAINST THE SHIPPED SOURCE, NOT TRANSCRIBED — the discipline the
# Phase 4 block above records, applied here, and it found the same class of defect it found
# there. `pv audit` reads the `status` field and CANNOT resolve a symbol, so a
# `module_path`/`function` pair that names nothing is a claim nothing checks. TWO of the ten
# rows named functions that do not exist and never did on this branch:
#
#   - six rows named `apr_cli::commands::setfit_bench::bench_report`. There is no such
#     function. The completeness, pairing, selection-safety and no-selection equations are
#     implemented by `entrenar::train::setfit::bench_gate::verify_run` — in the LIBRARY, because
#     "which cells make a run complete" is the claim and an adapter that decided it would be a
#     second definition. The two presentation equations are implemented by the renderer's own
#     functions, named individually below.
#   - one row named `apr_cli::commands::setfit_bench::bench_run`. The entry point is `run`; the
#     resource protocol itself is `resource::measure_cold`, which is the dedicated fresh child
#     the contract's `cold_latency` and `inference_peak_rss` rules are about.
#
# Both were corrected here rather than flipped over, because flipping a status while leaving a
# `function` column that resolves to nothing records exactly the unverifiable green the Phase 4
# block declined to record.
#
# MEASURED, NOT ASSUMED, and the status was captured directly rather than through a pipe
# (CLAUDE.md rule 1): before this block existed,
#   target/release/pv audit contracts/setfit-benchmark-claims-v1.yaml \
#     --binding contracts/aprender/binding.yaml > /tmp/pv-audit-claims.log 2>&1; rc=$?
# returned rc=1 with ten "[ERROR] BIND-001 ... has no binding entry" lines, one per equation.
# `status: pending` is BIND-004, a WARNING (audit/mod.rs:182-194) — which is why plan 05-10
# also tightened the gate: with every equation implemented, a BIND-004 here now means an
# equation has REGRESSED to pending, and the gate says so instead of printing it and exiting 0.
#
# MEASURED, NOT ASSUMED, and the status was captured directly rather than through a pipe
# (CLAUDE.md rule 1): before this block existed,
#   target/release/pv audit contracts/setfit-benchmark-claims-v1.yaml \
#     --binding contracts/aprender/binding.yaml > /tmp/pv-audit-claims.log 2>&1; rc=$?
# returned rc=1 with ten "[ERROR] BIND-001 ... has no binding entry" lines, one per equation.
