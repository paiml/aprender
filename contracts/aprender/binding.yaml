# WHY ALL FIFTEEN STARTED `pending`, AND WHY THAT WAS THE POINT OF THE PHASE RATHER THAN AN
# OMISSION. Plan 04-01 commits the artifact schema BEFORE any code that could quietly answer
# its questions differently (Ph1 D-14, and the cross-AI review's finding that the writer, the
# loader and the codec each described the artifact and described it differently). None of the
# modules named below existed when this block landed.
#
# EACH FLIP WAS VERIFIED, NOT TRANSCRIBED (plan 04-10). A binding moved to `implemented`
# because someone believed the module had landed is a claim nothing checked — the exact failure
# class the scoped audits exist to catch. Every `module_path`/`function` pair below was resolved
# against the shipped source through the dogfooded pmat index before its status moved, and the
# check found a real discrepancy: `backend_identity` named a free function `backend_identity` in
# the `aprender::setfit::classify` module, and no such function existed at any point on this
# branch. The identity is produced by `ExecutionBackend::identity` in the encoder. Correcting
# the `function` column is a SEMANTIC edit to the registry, not a binding-status flip, so it was
# out of 04-10's scope and the entry stayed `pending` — which was the honest state: `pv audit`
# reported it as BIND-004 (a warning) rather than letting an unverifiable claim read as green.
#
# PLAN 04-19 (wave 11) DISCHARGED IT, CHECK FIRST. The row below names the shipped symbol, and the
# flip is earned rather than asserted: a guard in `aprender::setfit::classify`'s `mod backend` was
# written and observed RED against THIS FILE before the status moved. That ordering is the whole
# point — 04-10 declined precisely because flipping a status the tooling cannot resolve records a
# claim nothing checks, and `pv audit` still cannot resolve symbols; it reads the `status` field.
#
# WHY ENTRIES AT ALL, RATHER THAN NO ENTRIES. `pv audit` treats a MISSING entry as BIND-001, an
# ERROR — measured, not assumed: `pv audit contracts/setfit-apr-v1.yaml --binding
# contracts/aprender/binding.yaml > /tmp/pv-audit-04-01-pre.log 2>&1; rc=$?` (status captured
# directly, never through a pipe — CLAUDE.md rule 1) returned rc=1 with 15 BIND-001 errors,
# one per equation. `status: pending` is BIND-004, a WARNING (audit/mod.rs:182-194), so the
# scoped gate passes while the modules are still being written and fails the moment an
# equation is dropped or renamed out from under its entry.
#
# EACH IS FLIPPED TO `implemented` BY THE PLAN THAT LANDS ITS MODULE — the `module_path` and
# `function` columns below are the CLAIM that plan must make true. A plan that lands a module
# and leaves its binding `pending` has recorded a claim nothing checks, which is the exact
