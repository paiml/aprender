# Phase 2 bindings — contrastive-pair-protocol-v1 (24 equations) and
# tweet-eval-stance-benchmark-v1 (1 equation). Plan 02-08 is the phase's SINGLE
# owner of this file; plans 02-02..02-07 deliberately did not touch it so two
# wave-mates could never append to one YAML list concurrently.
#
# THREE TRAPS, each measured by plan 02-02's probe rather than assumed:
#
#  1. `contract:` MUST be the BARE filename. A `../` prefix — the form several
#     entries above use — parses cleanly, raises nothing, and binds NOTHING:
#     the probe left `Bound equations: 0` and `BIND-001: 24`. A silent no-op
#     inside a BLOCKING gate is worse than an error, so the audit gate's own
#     failure mode was induced and observed before it was wired (see the
#     `contract-audit-phase2` comment block in the Makefile).
#  2. `status:` accepts only implemented | partial | not_implemented | pending.
#     `planned` is a hard parse error.
#  3. Entries must be inserted BEFORE `critical_path:`. Appending at
#     end-of-file lands inside that list and yields
#     "invalid type: map, expected a string".
#
# `target_crate:` at the top of this file is `aprender`, while every entry
# below names `aprender_contrastive_data::…` or `entrenar::…`. That was the
# open question plan 02-08 could not have answered mid-wave, so 02-02 probed
# it: cross-crate module paths are ACCEPTED (Bound 0 -> 1, BIND-001 24 -> 23,
# no namespace complaint). Both are workspace members of this monorepo.
