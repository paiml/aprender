# Regression Metrics Contract v1.0.0
# Backing contract for #[provable_contracts_macros::contract("metrics-regression-v1")]
# Consumer: src/metrics/mod.rs

metadata:
  version: "1.0.0"
  created: "2026-04-01"
  author: "PAIML Engineering"
  description: "Regression evaluation metrics: MSE, MAE, R-squared"
  references:
    - "Hastie, Tibshirani, Friedman (2009). The Elements of Statistical Learning, 2nd Ed."
  enforcement_level: "standard"

equations:
  mse:
    formula: "MSE = (1/n) * sum((y_i - yhat_i)^2, i=1..n)"
    domain: "y, yhat ∈ R^n, n >= 1"
    codomain: "MSE ∈ [0, +inf)"
    invariants:
      - "MSE >= 0"
      - "MSE = 0 iff y == yhat"
    preconditions:
      - "y.len() == yhat.len()"
      - "y.len() >= 1"
    postconditions:
      - "result >= 0.0"

  r_squared:
    formula: "R^2 = 1 - SS_res / SS_tot = 1 - sum((y_i - yhat_i)^2) / sum((y_i - mean(y))^2)"
    domain: "y, yhat ∈ R^n, n >= 2, var(y) > 0"
    codomain: "R^2 ∈ (-inf, 1]"
    invariants:
      - "R^2 = 1 for perfect prediction"
      - "R^2 = 0 when predicting mean"
      - "R^2 can be negative for worse-than-mean predictions"
    preconditions:
      - "y.len() == yhat.len()"
      - "y.len() >= 2"
      - "variance(y) > 0"
    postconditions:
      - "result <= 1.0"

proof_obligations:
  - type: bound
    property: "MSE non-negativity"
    formal: "MSE(y, yhat) >= 0 for all y, yhat"
  - type: invariant
    property: "R-squared perfect prediction"
    formal: "R2(y, y) == 1.0 for all y with var(y) > 0"

falsification_tests:
  - id: "FALSIFY-REGRESSION-001"
    rule: "MSE zero iff perfect"
    prediction: "MSE(y, y) == 0.0 and MSE(y, yhat) > 0 when y != yhat"
    test: "proptest 1000 vector pairs; verify MSE=0 iff identical, MSE>0 otherwise"
    if_fails: "Squaring or averaging logic produces negative or wrong-zero values"
  - id: "FALSIFY-REGRESSION-002"
    rule: "R-squared mean prediction"
    prediction: "R2(y, mean(y) * ones) == 0.0 for any y with variance > 0"
    test: "proptest 1000 vectors with var > 0; predict mean; verify R2 ≈ 0.0"
    if_fails: "SS_tot or SS_res computation incorrect"
