# ──────────────────────────────────────────────
# bin-aprender--apr-v1 — the `apr` bin target of package aprender (ONT-10 slice S7 (apr(aprender) 1/2))
#
# Drafted to the exemplar contracts/bin-aprender-contracts-cli--pv-v1.yaml. The shared shapes (sha, helpSha,
# gitSha, …) live in binary-surface-v1 and are not restated. Moved from docs/ont-10/binary-contracts/ (aprender-bb).
#
# binary-aprender-apr-v1 — ONT-10 slice S7 (apr(aprender) 1/2): the `apr` target of the root facade package
# `aprender` (what `cargo install aprender` installs) as an entity — identity and the full CLI command set
# (ONT-001 v4.17 ONT-4g; #4476, #4079)
#
# THE SPLIT WITH S6 IS BY KIND, as S9/S8 split apr(apr-cli): `in` + minCount + maxCount on bin:command is set
# equality over the whole node, and pv's shapes subset refuses the qualifiedValueShape family, so one contract owns
# every CLI command. S7 owns identity + every CLI command of binary/aprender/apr; S6 (apr(aprender) 2/2) owns the
# HTTP route rows and the mcp:* rows of the same node.
#
# MEASURED (2026-09-26, batch/ont-10 @ b6cf6d2ed, release build, default features = ["cli"], private
# CARGO_TARGET_DIR):
#   `apr --version` = "apr 0.69.3 (b6cf6d2ede)" — name right, git sha present: G0.1 green.
#   Recursive --help walk, S9's convention (leaves + non-leaves whose Usage shows [COMMAND] + user-defined `help`;
#   clap's auto `help` excluded): 264 commands, and the set is byte-identical to S9's (binary/apr-cli/apr). The
#   facade target is a thin entry point over apr-cli, so the two command sets are equal by construction; G0.5 (the
#   two targets' helpSha256 equal) spans two nodes and stays with the ONT-4g surface_audit_bins gate.
#   The ledger's binary column says `apr` for both targets, so this node joins the same rows as S9: 375 apr rows =
#   318 CLI + 57 other; the 318 CLI rows reduce to 267 command paths (ledger at cf038d37f). Join against the 264:
#     15 ledger rows name commands the DEFAULT build lacks — RED today, all feature-gated:
#       data x doctest extract|merge, data x hub push, data x import hf  (aprender-data features doctest / hf-hub)
#       mono archive|audit|publish|shims                                  (apr-cli feature `dev`)
#       rag eval compare|gate|generate|judge|metrics|retrieve|sample      (aprender-rag-cli feature `eval`)
#     12 commands have no ledger row — RED today: capability, pv census, pv challenge check|gen,
#       pv discharge check|gen-axioms|label-ratchet|run, pv extract, pv obligations, pv ontology export|tbox.
#   One fix in the ledger or the build turns both S7 and S9 green: the same 27 paths are named on both nodes.
#
# CONVENTION: S9's, unchanged (a runnable non-leaf is a command; only clap's auto help is excluded; the join keys
# on the ledger's binary column).
#
# KIND: pattern (one binary's surface over the binary-surface-v1 vocabulary).
# ──────────────────────────────────────────────
name: bin-aprender--apr-v1
version: "1.0.0"
scope: >
  The built `apr` target of the root facade package `aprender` (default features) as the focus node binary/aprender/apr: its identity, its exact CLI command set, and the surface_audit.csv CLI rows that must resolve to it. HTTP and MCP rows are S6.
status: active

