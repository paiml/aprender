qa_gate:
  id: F-CB-001
  name: Continuous Batching Contract
  description: Unified scheduler correctness — throughput scaling and fairness
  checks:
  - token_budget
  - computed_monotonic
  - chunked_equivalence
  - decode_degradation
  - no_starvation
  - correctness_under_batching
  - no_empty_outputs
  pass_criteria: All 13 falsification tests pass + 3 Kani harnesses verify
  falsification: Schedule more tokens than budget to break throughput invariant
