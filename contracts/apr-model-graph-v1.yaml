qa_gate:
  id: F-GRAPH-GATE
  name: Model Graph Contract
  description: Full LLM forward-pass graph validation gate
  checks:
  - forward_pass_completeness
  - attention_mechanism
  - ffn_computation
  - residual_stream
  - kv_cache_management
  - tensor_name_resolution
  - quantization_precision
  pass_criteria: All 8 falsification tests pass, all 10 kani harnesses verify
  falsification: >
    Remove one layer's down_proj tensor to break shape preservation invariant.
    The model graph should detect the broken edge.

toyota_way_principles:
  jidoka: >
    "Automation with a human touch" — the graph validator walks every node
    in the DAG. A missing tensor or wrong shape stops import immediately with
    a precise error: "layer 3 down_proj expected [4096, 11008], got [4097, 11008]".
    No silent shape broadcasting.
  poka_yoke: >
    "Mistake-proofing" — model family templates are the single source of truth
    for tensor names and shapes. The template makes it impossible to construct
    a valid model graph with missing or misnamed tensors. New families must
    provide complete tensor_template and shape_template before import is enabled.
  genchi_genbutsu: >
    "Go and see" — falsification tests use real tensor data with injected
    defects (off-by-one shapes, NaN injection, missing tensors). Not
    synthetic assertions against mock objects.
  kaizen: >
    "Continuous improvement" — new model families (Falcon-H1, RWKV-7) extend
    the graph with SSM nodes. The architecture is additive: new node types
    compose with existing validation. Each new family adds its own falsification
    tests to the test suite.
