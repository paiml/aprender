# ─────────────────────────────────────────────────────────────────────────────
# apr-mcp-tool-inventory-v1
#
# HELIX-IDEA-002: link-time MCP handler auto-registration via the `inventory`
# crate plus a `#[mcp_tool]` proc-macro. Reduces "add a new tool" from a
# three-file edit (`tools/mod.rs`, the hardcoded `tool_definitions()` Vec at
# `server.rs:221-233`, and the dispatch match arm at `server.rs:461-483`)
# to a single file under `tools/`.
#
# Source pattern: helix-db `helix-macros/` (the `#[mcp_handler]` macro plus
# its inventory submission). Re-implemented as `aprender-mcp-macros` against
# our existing `ToolDefinition` / dispatch types.
#
# Scope at author time (2026-05-10): inventory is a FALLBACK path. Tools that
# need provability still go through the contracts schema codegen
# (FALSIFY-MCP-008 stays the source of truth for `inputSchema`). Inventory
# only owns the *registration* — name → handler fn pointer + ToolDefinition
# factory.
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  version: 1.0.0
  created: '2026-05-10'
  author: apr-cli team
  kind: registry
  description: >
    HELIX-IDEA-002 — `inventory`-backed MCP tool registry that supersedes
    the two hardcoded vectors in `aprender-mcp/src/server.rs` (the
    `tool_definitions()` constructor and the `dispatch_tool_call_with_sink`
    match arms). A new proc-macro crate `aprender-mcp-macros` exposes
    `#[mcp_tool]`; each annotated function emits an `inventory::submit!`
    block that the dispatcher iterates at startup. The contracts-derived
    `inputSchema` pipeline (FALSIFY-MCP-008) is unchanged — inventory
    owns registration, not schema.
  references:
    - 'docs/specifications/helix-db-feature-ideas.md §2.2 (HELIX-IDEA-002)'
    - 'crates/aprender-mcp/src/server.rs:221-233 (hardcoded definitions)'
    - 'crates/aprender-mcp/src/server.rs:461-483 (hardcoded dispatch)'
    - 'helix-db/helix-macros/ (pattern source)'
    - 'https://crates.io/crates/inventory'
    - 'contracts/apr-mcp-server-v1.yaml (parent)'
    - 'contracts/apr-mcp-tool-schemas-v1.yaml (schema source of truth)'
  depends_on:
    - apr-mcp-server-v1
    - apr-mcp-tool-schemas-v1

name: apr-mcp-tool-inventory
version: "1.0.0"
status: ACTIVE
scope: "the `aprender-mcp` server's tool registration path — additive `inventory` fallback alongside the contracts-driven schema codegen"
binary: "apr mcp"
crate: "aprender-mcp"
spec: docs/specifications/helix-db-feature-ideas.md

description: |
  HELIX-IDEA-002 promotes "adding a new MCP tool requires editing three
  files" from a known friction to an ACTIVE contract. The implementation
  introduces `aprender-mcp-macros` and an `inventory::collect!`-backed
  registry. A tool author writes one file under `tools/`:

    use aprender_mcp_macros::mcp_tool;

    #[mcp_tool(name = "apr.foo")]
    pub fn call(arguments: &serde_json::Value) -> ToolCallResult { ... }

  At link time the macro emits an `inventory::submit!` carrying:
  - `name: &'static str`
  - `definition: fn() -> ToolDefinition`  (returns the struct that goes
    into `tools/list`)
  - `dispatch: fn(&serde_json::Value, ...) -> ToolCallResult`

  The dispatcher iterates `inventory::iter::<McpToolEntry>` once at
  startup and builds two indices: a `Vec<ToolDefinition>` (replaces the
  hardcoded list at server.rs:221-233) and a `BTreeMap<&'static str,
  fn(&Value, ...) -> ToolCallResult>` (replaces the match-arm dispatch at
  server.rs:461-483).

  Co-existence rules with the existing pipeline:
  1. Schema source of truth is unchanged. Tools annotated with
     `#[mcp_tool]` still pull their `inputSchema` from the
     `APR_<TOOL>_SCHEMA` const generated by `build.rs` from
     `contracts/apr-mcp-tool-schemas-v1.yaml`. The macro does NOT
     auto-derive a schema with `schemars` — that would silently drift
     from the contract.
  2. FALSIFY-MCP-002 (every tool's `inputSchema` is JSON Schema Draft 7
     valid) is unchanged. The inventory pipeline must produce the same
     `Vec<ToolDefinition>` content as the hardcoded list it replaces;
     the migration is not allowed to drop or reorder tools.
  3. Compile-time uniqueness: the macro emits a static const declaration
     named after the tool. Two `#[mcp_tool(name = "apr.foo")]`
     declarations collide on the const name and fail to link. Test
     `falsify_inventory_002.rs` exercises this via a `compile_fail` doc
     test.

  Risk: `inventory` registers via static linker sections at process
  startup, synchronously and before tokio is initialized. The submitted
  records are `&'static` and read-only after startup, so they are
  trivially `Send + Sync`. The dispatcher's existing async/cancellation
  model is unchanged — the inventory iteration happens once, in
  `AprMcpServer::new()` / `Default`, and produces the same indices that
  the hardcoded vectors used to.

# ── Enforced falsification gates ──

falsification_conditions:
  - id: FALSIFY-INVENTORY-001
    description: >
      Iterating the inventory at startup yields exactly the same set of
      tool names as the previous hardcoded `tool_definitions()` vec
      (apr.version, apr.validate, apr.tensors, apr.bench, apr.qa,
      apr.trace, apr.run, apr.serve, apr.finetune). Migration is
      structure-preserving — no tool dropped, no ordering reliance.
      Test runs against a real `AprMcpServer` and compares the output
      of `tools/list` to a frozen golden set.
    test_file: crates/aprender-mcp/tests/falsify_inventory_001.rs
    test_name: inventory_yields_same_tool_set_as_hardcoded_list
    status: ENFORCED

  - id: FALSIFY-INVENTORY-002
    description: >
      Two tools registered with the same `name` MUST cause
      `AprMcpServer::default()` (which iterates the inventory at startup
      and builds the dispatch index) to panic with a clear
      duplicate-name diagnostic, rather than silently shadowing one
      registration with another. The test builds a `BTreeMap<&str, fn>`
      using the same logic the dispatcher uses, fed by a synthetic
      duplicate, and asserts the panic message names the offending
      tool. Runtime enforcement is acceptable here because every test
      that constructs `AprMcpServer::default()` exercises the check —
      a production duplicate would fail every test in the suite, not
      just one targeted gate.
    test_file: crates/aprender-mcp/tests/falsify_inventory_002.rs
    test_name: duplicate_tool_name_panics_at_index_build
    status: ENFORCED

  - id: FALSIFY-INVENTORY-003
    description: >
      The dispatch path through `inventory` is byte-identical to the
      previous `match name { ... }` path for every shipped tool. Test
      drives `AprMcpServer::handle_request` with each tool name in turn
      and asserts the response shape (success vs error envelope, content
      array, isError flag) matches the pre-migration golden output.
      Equivalence is checked at the JSON envelope level, not at the
      subprocess output level (subprocess output is covered by
      FALSIFY-MCP-003 / FALSIFY-MCP-004 in the parent contract).
    test_file: crates/aprender-mcp/tests/falsify_inventory_003.rs
    test_name: inventory_dispatch_envelope_matches_hardcoded_path
    status: ENFORCED

# ── Acceptance gate ──
qa_gate:
  id: F-INVENTORY-GATE
  name: "MCP tool inventory contract"
  pass_criteria: "All 3 FALSIFY-INVENTORY-* tests pass AND the existing 8 FALSIFY-MCP-* gates in apr-mcp-server-v1 still pass"
  run: "cargo test -p aprender-mcp --no-fail-fast"
  falsification: >
    Rename or delete any test_file / test_name and the
    `aprender-contracts::apr_mcp_tool_inventory_contract` integration
    test fails before aprender-mcp compiles. Drop a tool from the
    inventory and FALSIFY-INVENTORY-001 fails on the missing name.

toyota_way_principles:
  jidoka: >
    "Automation with a human touch" — adding a new tool is a one-file
    edit, but the file must declare a `#[mcp_tool(name = ...)]`. The
    macro can't be elided; forgetting it means the tool isn't visible
    to the dispatcher and the FALSIFY-INVENTORY-001 golden-set test
    fails on the first `cargo test` run.
  poka_yoke: >
    "Mistake-proofing" — Gate 002 makes silent name collisions
    structurally impossible. Two tools with the same `apr.foo` name
    fail to link, not at runtime when a request happens to route to
    the wrong one.
  genchi_genbutsu: >
    "Go and see" — Gates 001/003 exercise the real `AprMcpServer`
    over its public dispatch surface. No mocks; the path under test
    is what production MCP traffic hits.
  kaizen: >
    "Continuous improvement" — `inventory` is the smallest dep that
    closes the friction. If a future M5+ change moves dispatch to
    `pmcp`, the inventory entries become the input to whatever
    register-tool API pmcp exposes — the macro stays, only the
    consumer changes.
