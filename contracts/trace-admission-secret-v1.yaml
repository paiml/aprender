metadata:
  version: 1.0.0
  kind: schema
  description: |
    Trace admission (PRA-001 T6, gates G-SEC / G-SEC-FN; agent-trace ruling 2026-09-25
    item 6). A captured lane row enters the fine-tune/distill pool only when it is
    secret-scan clean AND carries no sealed-test hash (review-corpus-contamination-v1).
    The secret scan is the UNION of two in-process Rust scanners, no Go or Python:
    (a) builtin detectors (AWS key id/secret, GitHub token, PEM private key, Anthropic,
    Slack, JWT, high-entropy assignment), which honour no allowlist; (b) the gitleaks
    v8.30.1 ruleset vendored verbatim as data (data/gitleaks/, MIT, sha256-pinned) and
    interpreted in-process: keyword prefilter, regex, secret group, entropy floor,
    per-rule and global allowlists. Without a file path the scan fails safe: a
    path-scoped rule runs on all content, a path-conditioned (AND) allowlist allows
    nothing, and the one path-only rule (pkcs12-file) is listed, not dropped.
    Any hit QUARANTINES the row byte-for-byte; it is never redacted in place. A
    sealed-test hit REFUSES the row and is checked first. An empty sealed index admits
    nothing (Unchecked). Canaries are built at run time, so no key literal is in source.
    Implementation: crates/aprender-review-experiment/src/{secret,pool}.rs.
    Pending on T1/T3 (the trace index does not exist yet): the backfill run
    (`make trace-secret-scan-backfill`, G11) and the index's secret_scan record
    {scanner_versions, hits, status}; secret::SCANNER_VERSIONS is its version field.
  references:
    - "contracts/review-corpus-contamination-v1.yaml"
    - "docs/specifications/review-experiment-protocol.md"

equations:
  admit:
    formula: "pool(R) = { r in R : sealed != {} and leak(r) = false and builtin(r) ∪ gitleaks(r) = {} }"
  recall:
    formula: "for each canary c labelled (scanner s, rule k): k in scan(c), and scan_s(c) without k = {}"

falsification_tests:
  - id: FALSIFY-TAS-001
    name: every_canary_fires_its_labelled_rule
    prediction: "all 20 canaries (8 builtin, 12 gitleaks: AWS, GitHub PAT, private key, JWT, high-entropy generic, …) fire their labelled rule, bare and inside a JSONL row: 100% recall"
    test_harness: "cargo test -p aprender-review-experiment --lib falsify_tas_001"
    expected_output: "exit 0"
    if_fails: "A secret shape the gate claims to catch reaches the pool (G-SEC)."
  - id: FALSIFY-TAS-002
    name: removing_a_rule_turns_its_canary_red
    prediction: "with a canary's labelled rule removed, its scanner reports nothing on that canary"
    test_harness: "cargo test -p aprender-review-experiment --lib falsify_tas_002"
    expected_output: "exit 0"
    if_fails: "Recall is carried by some other rule, so the per-rule recall claim is untested (G-SEC-FN)."
  - id: FALSIFY-TAS-003
    name: aws_doc_key_needs_the_builtin_scanner
    prediction: "the AWS documentation key, which gitleaks allowlists (.+EXAMPLE$), is hit by the builtin scanner alone; with that rule removed nothing catches it"
    test_harness: "cargo test -p aprender-review-experiment --lib falsify_tas_003"
    expected_output: "exit 0"
    if_fails: "The union is not load-bearing, or an upstream allowlist is silently trusted."
  - id: FALSIFY-TAS-004
    name: planted_aws_key_is_quarantined
    prediction: "a lane output carrying the AWS key literal is Quarantined byte-identical and is not in the pool; a clean neighbour is admitted"
    test_harness: "cargo test -p aprender-review-experiment --lib falsify_tas_004"
    expected_output: "exit 0"
    if_fails: "Secrets reach the training pool, or a quarantined row was rewritten in place."
  - id: FALSIFY-TAS-005
    name: planted_test_split_diff_is_refused
    prediction: "a row carrying a sealed test diff, or only its diff sha, is Refused and not in the pool"
    test_harness: "cargo test -p aprender-review-experiment --lib falsify_tas_005"
    expected_output: "exit 0"
    if_fails: "Sealed test items leak into training data (S-3)."
  - id: FALSIFY-TAS-006
    name: scanner_case_tables
    prediction: "builtin must-match rows (incl. a JSON-escaped key) fire exactly their rule and must-not-match rows fire none; gitleaks drops a sub-entropy match and does not apply a path-conditioned allowlist; ordinary review rows fire neither scanner"
    test_harness: "cargo test -p aprender-review-experiment --lib -- case_table ordinary_review_rows_are_clean"
    expected_output: "exit 0"
    if_fails: "A key shape is missed, or clean rows are quarantined."
  - id: FALSIFY-TAS-007
    name: ruleset_pinned_and_complete
    prediction: "the vendored toml matches its sha256; all 222 declared rules are either compiled or listed path-only; no regex fails to compile"
    test_harness: "cargo test -p aprender-review-experiment --lib -- vendored_gitleaks_toml_is_sha_pinned every_gitleaks_rule_compiles"
    expected_output: "exit 0"
    if_fails: "The ruleset drifted from upstream, or a rule was silently dropped."
  - id: FALSIFY-TAS-008
    name: empty_sealed_index_admits_nothing
    prediction: "with no sealed items indexed, no row is admitted"
    test_harness: "cargo test -p aprender-review-experiment --lib empty_sealed_index_refuses_everything"
    expected_output: "exit 0"
    if_fails: "A missing test manifest silently admits every row."
