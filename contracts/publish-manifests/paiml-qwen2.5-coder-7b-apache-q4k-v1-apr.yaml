  # the schema does not model directly. We classify it as `finetune` because
  # the most recent pipeline stage that produced working weights was a
  # fine-tune performed upstream by Qwen. Our quantization is a lossless-to-
  # within-contract conversion (contracts/tensor-layout-v1.yaml) — no new
  # learned parameters.
  pipeline: finetune
  parent: Qwen/Qwen2.5-Coder-7B-Instruct
