qa_gate:
  id: F-LAYA-PARITY-001
  name: 'Laya torch -> .apr -> Rust parity gate'
  description: >
    The blocking parity gate for D-13 / D-17. Every bar is declared here before any parity run,
    read at test time, asserted NaN-visibly, and printed with the measured value and ARCH. The
    ladder localises a failure to its rung: ids -> embeddings -> layers -> final norm -> logits ->
    probabilities -> argmax, plus the discriminating window mutation and the pack-time re-score.
  checks:
    - 'contract schema validity (pv validate, zero errors) and non-zero pv status counts'
    - 'ids and markers exact on every fixture row'
    - 'embeddings, per-layer relative rms and final norm within their bars'
    - 'logits and probabilities within their bars; argmax exact'
    - 'window mutation fails the first local layer only'
    - 'pack/verify re-score of every eval row within the noise-referenced bound(c, s) = max(1.0e-5, pack_rescore_noise_k x noise(c, s)), noise recomputed in Rust from the hash-bound rescore-noise.json float64 record; the 1.0e-5 floor alone when the run carries no record; a bound above pack_rescore_bound_max_abs refused; argmax exact (A1)'
    - 'fixture rows (probs_abs, the tiny fixtures, the spike-025 14 rows) keep the 1.0e-5 literal; logits_abs and final_norm_abs are FIXTURE-ONLY'
    - 'measured max|delta| and ARCH printed; first x86_64 value recorded here'
    - 'x86_64: UNMEASURED (risk). Every A1 number is aarch64 (Apple M4 Pro, NEON 8x6 BLIS, Apple libm sinf/cosf). Pack and verify run on the dev box; the deploy target is Lambda arm64 (Graviton), so the deploy direction is aarch64 to aarch64 — but Linux glibc sinf/cosf differ from Apple libm, and a 1-ULP sincos change has flipped a row before (.planning/debug/resolved/laya-rescore-drift.md). On Lambda only decide-apr-v1''s two-probe replay at probe_probabilities_abs runs, so a cross-libm probe mismatch would REFUSE the load (fail-closed). The settle-it measurement is spike 028''s x86 procedure (.planning/spikes/028-laya-packability-noise-floor, "x86_64: unmeasured (risk)") against the committed float64 logits, needing no torch on the host; the first x86_64 value is recorded here when measured (deferred-items D-ITEM-08-13-A)'
  pass_criteria: 'FALSIFY-LAYA-PARITY-001..006 pass on aarch64 and x86_64 (x86_64 unmeasured as of A1), each observed RED under an induced negative (the window mutation is itself one).'
  falsification: >
    Mutate the local window by one in either direction: FALSIFY-LAYA-PARITY-004 must go red at the
    first local layer and green at the first global layer. If it does not, the ladder has stopped
    being evidence for the window.
