metadata:
  version: "1.0.0"
  created: "2026-04-13"
  author: PAIML Engineering
  registry: true
  references:
    - "Dettmers et al. (2023). QLoRA: Efficient Finetuning of Quantized Language Models."
  description: "NF4 backward pass with Tensor Core GEMM"

name: nf4-backward-tensor-core-gemm
version: "1.0.0"
scope: "crates/aprender-compute/src/backends/gpu/"

description: |
  QLoRA NF4 dequantize → FP16 → Tensor Core GEMM for backward pass. Fused kernel eliminates intermediate materialization.

equations:
  gradient_correctness:
    description: "∀ param: |nf4_grad - fp32_grad| < ε (ε = 1e-3)"
    formula: "∀ param: |nf4_grad - fp32_grad| < ε (ε = 1e-3)"

  memory_saving:
    description: "peak_vram(nf4) < 0.5 × peak_vram(fp16) for same model"
    formula: "peak_vram(nf4) < 0.5 × peak_vram(fp16) for same model"

falsification:
  - id: FALSIFY-NF4_BACKWARD_TENSOR_CORE_GEMM_V1_001
    description: "∀ param: |nf4_grad - fp32_grad| < ε (ε = 1e-3)"
    test: "Related tests in crates/aprender-compute/src/backends/gpu/"
    evidence: "cargo test --lib"

  - id: FALSIFY-NF4_BACKWARD_TENSOR_CORE_GEMM_V1_002
    description: "peak_vram(nf4) < 0.5 × peak_vram(fp16) for same model"
    test: "Related tests in crates/aprender-compute/src/backends/gpu/"
    evidence: "cargo test --lib"

falsification_tests:
  - id: FALSIFY-NF4-BACKWARD-001
    description: "Gradient through NF4-dequantised weights stays within quantisation error of fp32 (algorithm level; the fused tensor-core kernel and VRAM claim are GPU-only and NOT CI evidence)"
    test: "cargo test -p aprender-compute --lib test_nf4_backward_gradient_within_quant_error"
    prediction: "|dX_nf4 - dX_fp32| <= l1(dy) * eps_w"
    if_fails: "NF4 dequant error propagates beyond its bound into gradients"
