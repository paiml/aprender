# CRUX-K-12 — VSCode extension for apr

metadata:
  id: CRUX-K-12
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "K — Deployment & Integration"
  competitor: ecosystem
  demand_score: 3
  intake_status: missing
  description: >
    VSCode extension packaging apr as a LSP-style completion/chat
    provider. Canonical: VSCode Extension API — `package.json` has
    `engines.vscode`, `contributes.commands`, `main` entry point; VSIX
    installable via `code --install-extension`. Shape: JSON manifest +
    activation events.

equations:
  vscode_ext:
    formula: |
      package.json required fields:
        name, displayName, version, publisher, engines: { vscode: ">=^1.85.0" },
        main: "./out/extension.js",
        contributes: { commands: [ {command, title} ] },
        activationEvents: ["onCommand:apr.chat", "onStartupFinished"]
      build produces extension.vsix that `vsce verify-pat` accepts
      and `code --install-extension` installs without errors.
    domain: "(extension_dir: Path)"
    codomain: "extension.vsix file, valid manifest"
    invariants:
    - "package.json conforms to VSCode extension schema"
    - "every `contributes.commands[].command` matches an `activationEvents` entry"
    - "vsix SHA-256 is reproducible across builds (source + deps pinned)"

falsification_tests:
- id: FALSIFY-CRUX-K-12-001
  rule: package.json validates against VSCode schema
  prediction: "jsonschema validate passes for generated package.json"
  test: |
    set -euo pipefail
    apr ext scaffold vscode -o /tmp/ext
    uv run --with jsonschema python3 -c "
    import json, jsonschema, pathlib
    pkg = json.load(open('/tmp/ext/package.json'))
    assert 'engines' in pkg and 'vscode' in pkg['engines']
    assert pkg['main'].endswith('.js')
    assert 'commands' in pkg['contributes']
    assert all('command' in c and 'title' in c for c in pkg['contributes']['commands'])
    "
- id: FALSIFY-CRUX-K-12-002
  rule: every command has an activation event
  prediction: "set(commands) == set(onCommand:* in activationEvents)"
  test: |
    set -euo pipefail
    python3 -c "
    import json
    p = json.load(open('/tmp/ext/package.json'))
    cmds = { c['command'] for c in p['contributes']['commands'] }
    acts = { e.split(':',1)[1] for e in p['activationEvents'] if e.startswith('onCommand:') }
    assert cmds == acts or cmds.issubset(acts), (cmds, acts)
    "
- id: FALSIFY-CRUX-K-12-003
  rule: vsix build is reproducible
  prediction: "two clean builds produce byte-identical .vsix"
  test: |
    set -euo pipefail
    for i in 1 2; do
      rm -rf /tmp/ext-build$i; cp -r /tmp/ext /tmp/ext-build$i
      apr ext pack /tmp/ext-build$i -o /tmp/apr-ext$i.vsix
    done
    diff <(unzip -p /tmp/apr-ext1.vsix extension/package.json) \
         <(unzip -p /tmp/apr-ext2.vsix extension/package.json)
    sha256sum /tmp/apr-ext1.vsix /tmp/apr-ext2.vsix | awk '{print $1}' | sort -u | wc -l | \
      xargs -I {} test {} -eq 1

proof_obligations:
- type: parity
  property: "apr ext scaffold vscode emits valid package.json per VSCode Extension API"
- type: invariant
  property: "commands ⊆ activationEvents (no orphan commands)"
- type: invariant
  property: "vsix build is reproducible"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

pmat_work_tracking:
  ticket_tag: crux-crux-k-12
  priority: medium
  auto_created: true
