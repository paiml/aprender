# CRUX-J-19 — OpenCLAW offline / local-first fallback
# Resolved 2026-04-18: category J competitor = openclaw.ai.

metadata:
  id: CRUX-J-19
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "J — OpenCLAW Agent Orchestration"
  competitor: openclaw
  demand_score: 2
  intake_status: missing
  description: >
    OpenCLAW's tagline is "local-first personal AI assistant" — if the
    cloud backend is unreachable, the agent degrades to the user's local
    model instead of failing outright. Aprender parity: `apr` must be
    able to run end-to-end with a local realizar model only (no cloud
    backend required). Overlaps with CRUX-J-13 provider switching and
    realizar-first inference architecture.
  openclaw_interpretation: openclaw-agent-resolved

  references:
  - 'master: contracts/crux-competitive-research-ux-v1.yaml — §5.J'
  - https://openclaw.ai/
  - contracts/crux-J-13-v1.yaml
  - evidence/crux/openclaw/gaps.md

equations:
  local_first_fallback:
    formula: |
      run(backend) :=
        if backend.available : backend.complete(msg)
        else                 : local_realizar.complete(msg)    (if enabled)
      invariant: local_realizar.complete requires no network
      invariant: apr can be used end-to-end with backend = local ONLY
    domain: (backend_state, message)
    codomain: completion from chosen path
    invariants:
    - "local-only config is a first-class path, not a fallback-only workaround"
    - "no outbound network required when backend = local"
    - "cloud-unreachable emits an observable degrade, not silent cloud retry"

falsification_tests:
- id: FALSIFY-CRUX-J-19-001
  rule: local-only operation is supported
  prediction: "apr docs describe a local-only inference path via realizar"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "realizar local-only inference OR offline apr run" --limit 1 --format json | grep -q '"matches"' || {
        echo "FAIL: no local-only inference story documented" >&2
        exit 1
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-19 parity broken — apr MUST support a local-only inference path
- id: FALSIFY-CRUX-J-19-002
  rule: no silent cloud retry on local failure
  prediction: "backend-unreachable failure surfaces explicitly"
  test: |
    set -euo pipefail
    if command -v pmat >/dev/null 2>&1; then
      pmat query "cloud backend unreachable fallback OR observable degrade" --limit 1 --format json | grep -q '"matches"' || {
        echo "SKIP: degradation-observability evidence not yet indexed" >&2
        exit 77
      }
    else
      echo "SKIP: pmat not available" >&2; exit 77
    fi
  if_fails: CRUX-J-19 observability invariant — cloud/local transitions must be observable

proof_obligations:
- type: invariant
  property: "local-only path is first-class"
- type: invariant
  property: "degrade is observable, not silent"

verification_summary:
  total_obligations: 2
  proven: 0
  tested: 0
  status: draft

pmat_work_tracking:
  ticket_tag: crux-crux-j-19
  priority: low
  auto_created: true
