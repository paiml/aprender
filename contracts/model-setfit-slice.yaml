# ─────────────────────────────────────────────────────────────────────────────
# model-setfit-slice — one tracked .apr model file as a graded entity (ONT-001 §5 ONT-4c, Appendix B.6; #3847)
#
# WHY THIS FILE. v4.16's byte-level survey: slice_model.apr is the one tracked v2-magic file that parses under
# extract:apr-model's algorithm (version 2.0, header checksum matches, tensor_count 37), and its sha256 is pinned
# independently by crates/aprender-core/tests/fixtures/setfit/manifest.sha256. golden_v2.apr is the extractor's
# own control and is excluded — it would validate the checker against itself.
#
# TARGET. model:AprModel (v4.16 D-T2, qd4c4): `extract:apr-model` types its node model:AprModel as well as
# model:Model, and the ladder's armed `ladder-measured` shape targets model:LadderRung, so the two do not collide.
# `ignoredProperties` (D1c) declines model:file and model:contract, the extractor's bookkeeping.
#
# KIND: pattern. The edit that makes it fail: change one byte of the file — model:sha256 leaves its `in:`.
# ─────────────────────────────────────────────────────────────────────────────
name: model-setfit-slice
version: "1.0.0"
scope: >
  crates/aprender-core/tests/fixtures/setfit/slice_model.apr: format, container version, tensor count and the
  exact bytes. Out of scope: what the model computes.
status: active

metadata:
  version: "1.0.0"
  kind: pattern
  created: '2026-09-24'
  last_modified: '2026-09-24'
  author: PAIML Engineering
  description: >
    The SetFit slice model becomes a model:AprModel node; its bytes are pinned by sha256 and its header must
    parse as an APR v2 container.
  references:
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.16 Appendix B.6 (D1, D1c, D-T2)'
    - 'crates/aprender-contracts/src/ontology/extract/apr_model.rs'
    - 'crates/aprender-core/tests/fixtures/setfit/manifest.sha256'

entity:
  type: apr-model
  ref: crates/aprender-core/tests/fixtures/setfit/slice_model.apr

relations:
  depends_on: [ont-sigma-v1, ont-shapes-v1, ont-model-receipts-v1]

shape:
  targetClass: model:AprModel
  closed: true
  ignoredProperties: [model:file, model:contract]
  properties:
    - {path: model:format, in: ["apr"]}
    - {path: model:aprVersion, minCount: 1, maxCount: 1, pattern: "^[0-9]+\\.[0-9]+$"}
    - {path: model:tensorCount, minCount: 1, maxCount: 1, datatype: xsd:integer}
    - {path: model:sha256, minCount: 1, maxCount: 1, pattern: "^[0-9a-f]{64}$", in: ["4a75ee8031b3fbe0b17e1706a248aabbf158420c06f082bc29a89e2103d4057e"]}

equations:
  bytes_pinned:
    formula: "sha256(slice_model.apr) = 4a75ee80…4057e ∧ parse(slice_model.apr) = Ok"
    domain: the tracked file's bytes
    codomain: one model:AprModel node, or a PV-ONT-012 refusal naming the file
    invariants:
      - a file that does not parse is refused, never a node
    preconditions:
      - the file is tracked
    postconditions:
      - any byte change moves model:sha256 out of its in-list
    lean_theorem: "none — L4 not declared"

invariants:
  - id: MSS-INV-001
    property: the model file's bytes are exactly the pinned ones
    formal: 'sha256(ref) ≡ "4a75ee8031b3fbe0b17e1706a248aabbf158420c06f082bc29a89e2103d4057e"'
    prose: false

falsification_tests:
  - id: FALSIFY-MSS-001
    rule: a changed byte is refused
    prediction: >
      flipping one byte of slice_model.apr makes the shapes gate exit 1 on model-setfit-slice (model:sha256
      `in`), and a lying header is refused by extract:apr-model naming the file
    test: cargo test -p aprender-contracts --lib ontology::extract::apr_model
    if_fails: the model file can change with no contract noticing
