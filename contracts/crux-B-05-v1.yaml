# CRUX-B-05 — Safetensors shard/merge weight-map
# Promoted to partial_algorithm_level by CRUX-B-05 implementation PR
# (apr shard + apr unshard). Live FALSIFY-CRUX-B-05-001/002/003 ship as
# integration tests under `cargo test -p apr-cli --lib commands::shard`.

metadata:
  id: CRUX-B-05
  version: "1.1.0"
  created: "2026-04-18"
  updated: "2026-05-15"
  author: PAIML Engineering
  registry: true
  status: partial_algorithm_level
  kind: kernel
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "B — Inspection & Debugging"
  competitor: huggingface
  demand_score: 4  # 1..5, high priority in pmat work
  intake_status: supported
  description: >
    Safetensors shard/unshard via weight-map. Parity target is
    HuggingFace's weight-map format defined in
    `model.safetensors.index.json` (HF Transformers big-models docs)
    and the conventions used by `transformers.PreTrainedModel.save_pretrained`
    /`from_pretrained` when loading sharded safetensors. Aprender parity:
    `apr shard model.safetensors --max-shard-size SZ -o OUT/` MUST split
    into shards + emit a valid index.json;
    `apr unshard OUT/ -o merged.safetensors` MUST reconstruct a single
    safetensors file whose tensor values are byte-equivalent to the
    input (header insertion order is deterministic but not required to
    match the original byte-for-byte — see
    `split_then_merge_identity.invariants`). Round-trip (split → unshard)
    MUST be the identity on tensor values. v1.1.0 (2026-05-15): renamed
    the reconstruct verb from `apr merge` → `apr unshard` to avoid
    collision with the existing `apr merge` model-parameter-averaging
    command. See
    https://huggingface.co/docs/transformers/big_models#sharded-checkpoints
    and
    https://github.com/huggingface/transformers/blob/main/src/transformers/modeling_utils.py
  references:
  - "https://huggingface.co/docs/transformers/big_models#sharded-checkpoints"
  - "https://github.com/huggingface/safetensors"
  - "https://github.com/huggingface/transformers/blob/main/src/transformers/modeling_utils.py#L3300"

equations:
  weight_map_schema:
    formula: |
      index.json := {
        "metadata": {"total_size": u64},
        "weight_map": Dict[tensor_name -> shard_filename]
      }
      Constraints:
        set(weight_map.keys()) == set(all tensors in sharded set)
        set(weight_map.values()) ⊆ {shard files on disk}
        total_size == Σ (byte size of every tensor across all shards)
    domain: "index.json file contents"
    codomain: "{metadata, weight_map} dict"
    invariants:
    - "Every tensor appears in exactly one shard (no duplication)"
    - "weight_map values are filenames relative to index.json directory"
    - "JSON is sorted by key (deterministic output)"

  split_then_merge_identity:
    formula: |
      Let S = input model.safetensors (single file).
      Let (shards, index) = split(S, max_shard_size).
      Let M = merge(shards, index).
      ∀ tensor t: bytes(M[t]) == bytes(S[t])
      AND dtype(M[t]) == dtype(S[t])
      AND shape(M[t]) == shape(S[t])
    domain: "(single safetensors file, max_shard_size)"
    codomain: "merged safetensors file"
    invariants:
    - "split ∘ merge is the identity on tensor values"
    - "Tensor insertion order preserved"
    - "Header JSON metadata preserved (or reconstructed deterministically)"

  parity_with_transformers_loader:
    formula: |
      ∀ M in evidence/crux/huggingface/shard-merge-goldens.json:
        apr shard M.safetensors --max-shard-size 5GB -o SHARDED/
        apr merge SHARDED/ -o rebuilt.safetensors
        transformers.AutoModel.from_pretrained(SHARDED/)
          == transformers.AutoModel.from_pretrained(rebuilt.safetensors)
      (equality on state_dict tensor values)
    domain: "golden safetensors single-file models"
    codomain: "transformers-loadable weights (equal tensor values)"
    invariants:
    - "Sharded layout is load-compatible with HF transformers"
    - "Merged file is a drop-in replacement for the original"

falsification_tests:
- id: FALSIFY-CRUX-B-05-001
  rule: shard command emits valid weight-map
  prediction: "apr shard produces index.json with weight_map covering all tensors"
  test: |
    TMP=$(mktemp -d)
    python3 - "$TMP" <<'PY'
    import sys, os, torch
    from safetensors.torch import save_file
    d = sys.argv[1]
    sd = {f"t.{i}": torch.randn(512, 512, dtype=torch.float32) for i in range(20)}
    save_file(sd, os.path.join(d, "model.safetensors"))
    PY
    apr shard "$TMP/model.safetensors" --max-shard-size 2MB -o "$TMP/out/" >/dev/null
    IDX="$TMP/out/model.safetensors.index.json"
    [ -f "$IDX" ] || { echo "FAIL: no weight-map index" >&2; exit 1; }
    python3 - "$TMP" <<'PY'
    import sys, os, json
    from safetensors import safe_open
    d = sys.argv[1]
    idx = json.load(open(os.path.join(d,"out","model.safetensors.index.json")))
    wm = idx["weight_map"]
    with safe_open(os.path.join(d,"model.safetensors"), framework="pt") as f:
        orig = set(f.keys())
    assert set(wm.keys()) == orig, f"key mismatch: {orig ^ set(wm)}"
    for name, shard in wm.items():
        assert os.path.isfile(os.path.join(d,"out",shard)), shard
    PY
  if_fails: "apr shard weight-map does not cover all tensors or references missing shards"

- id: FALSIFY-CRUX-B-05-002
  rule: split-then-unshard is the identity on tensor values
  prediction: "apr shard + apr unshard restores byte-identical tensors"
  test: |
    TMP=$(mktemp -d)
    python3 - "$TMP" <<'PY'
    import sys, os, torch
    from safetensors.torch import save_file
    d = sys.argv[1]
    sd = {f"layer.{i}": torch.randn(256, 256, dtype=torch.float32) for i in range(30)}
    save_file(sd, os.path.join(d, "model.safetensors"))
    PY
    apr shard "$TMP/model.safetensors" --max-shard-size 1MB -o "$TMP/sharded/" >/dev/null
    apr unshard "$TMP/sharded/" -o "$TMP/rebuilt.safetensors" >/dev/null
    python3 - "$TMP" <<'PY'
    import sys, os, torch
    from safetensors.torch import load_file
    d = sys.argv[1]
    orig = load_file(os.path.join(d,"model.safetensors"))
    reb  = load_file(os.path.join(d,"rebuilt.safetensors"))
    assert set(orig) == set(reb)
    for k in orig:
        assert torch.equal(orig[k], reb[k]), f"tensor {k} diverged after split/unshard"
    PY
  if_fails: "split then unshard did not round-trip to byte-identical tensors"

- id: FALSIFY-CRUX-B-05-003
  rule: index.json metadata.total_size equals sum of tensor bytes
  prediction: "total_size in index.json == Σ dtype_size * numel for every tensor"
  test: |
    TMP=$(mktemp -d)
    python3 - "$TMP" <<'PY'
    import sys, os, torch
    from safetensors.torch import save_file
    d = sys.argv[1]
    sd = {"a": torch.randn(100, 100, dtype=torch.float32),
          "b": torch.randn(50, 50, dtype=torch.float16)}
    save_file(sd, os.path.join(d, "model.safetensors"))
    PY
    apr shard "$TMP/model.safetensors" --max-shard-size 1MB -o "$TMP/out/" >/dev/null
    python3 - "$TMP" <<'PY'
    import sys, os, json
    from safetensors import safe_open
    d = sys.argv[1]
    idx = json.load(open(os.path.join(d,"out","model.safetensors.index.json")))
    declared = idx["metadata"]["total_size"]
    actual = 0
    with safe_open(os.path.join(d,"model.safetensors"), framework="pt") as f:
        for k in f.keys():
            t = f.get_tensor(k)
            actual += t.element_size() * t.numel()
    assert declared == actual, f"total_size {declared} != actual {actual}"
    PY
  if_fails: "index.json total_size disagrees with sum of tensor bytes"

- id: FALSIFY-CRUX-B-05-004
  rule: parity with HF transformers sharded loader on golden
  prediction: "apr-sharded model loads in transformers with same state_dict as original"
  test: |
    GOLD=${APR_CRUX_GOLDENS:-evidence/crux}/huggingface/shard-merge-goldens.json
    [ -f "$GOLD" ] || { echo "golden set absent"; exit 2; }
    python3 - "$GOLD" <<'PY'
    import json, subprocess, tempfile, hashlib, os, sys, pathlib
    for c in json.load(open(sys.argv[1])):
        with tempfile.TemporaryDirectory() as d:
            subprocess.run(["apr","shard",c["input_safetensors"],
                           "--max-shard-size",c["max_shard_size"],"-o",d], check=True)
            idx_sha = hashlib.sha256(
                open(pathlib.Path(d)/"model.safetensors.index.json","rb").read()).hexdigest()
            assert idx_sha == c["expected_index_sha256"], (idx_sha, c["expected_index_sha256"])
    PY
  if_fails: "apr sharded index.json sha256 diverges from HF transformers reference"

proof_obligations:
- type: equivalence
  property: "apr shard/unshard produces index.json and layout compatible with HF transformers sharded loader on evidence/crux/huggingface/shard-merge-goldens.json"
- type: invariant
  property: "Every tensor appears in exactly one shard (no duplication, no omission)"
- type: invariant
  property: "index.json total_size equals Σ(element_size × numel) across all tensors"
- type: invariant
  property: "unshard(shard(S, SZ)) == S (identity on tensor values for any valid max_shard_size)"
- type: invariant
  property: "weight_map shard filenames are relative (no absolute paths, no ..)"

