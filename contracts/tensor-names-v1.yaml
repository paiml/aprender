metadata:
  version: 1.1.0
  created: '2026-02-23'
  updated: '2026-04-28'
  author: PAIML Engineering
  description: Architecture-specific tensor name resolution — source of truth
  registry: true
  references:
  - 'GH-311: Tensor name resolution contract'
  - 'architecture-requirements-v1.yaml: Weight role definitions'
  - 'realizar/src/tensor_names.rs: Generated Rust implementation'
  - 'aprender-serve/src/tensor_names_fallback.rs: GGUF/HF dispatch'
  five_whys_qwen3_moe_gap:
    symptom: |
      `apr code -p '<prompt>'` against Qwen3-Coder-30B-A3B-Instruct.gguf
      fails with: "Invalid shape: Tensor 'blk.0.ffn_up.weight' not found".
    why_1: |
      tensor_names_fallback.rs:368 hardcodes the dense-FFN GGUF name
      `blk.{n}.ffn_up.weight` for the FfnUpWeight role, regardless of
      the model's `general.architecture` metadata.
    why_2: |
      The HuggingFace-side tensor naming branches on architecture
      (per-arch templates exist for llama, qwen2, qwen3, qwen3_moe, …)
      but the GGUF-side `_fallback` is a single architecture-agnostic
      string per role.
    why_3: |
      qwen3_moe stores per-expert weights as 3D tensors with different
      llama.cpp names — `blk.{n}.ffn_gate_exps.weight`,
      `blk.{n}.ffn_up_exps.weight`, `blk.{n}.ffn_down_exps.weight`,
      plus a router `blk.{n}.ffn_gate_inp.weight`. None of these are
      `blk.{n}.ffn_up.weight` so the lookup fails.
    why_4: |
      No falsification test in the contract framework asserted
      "for every architecture A in architecture_map, every required
      role R has at least one template that resolves against a
      representative .gguf file for A". Without that, `pv validate`
      passes a contract whose GGUF templates are silently incomplete.
    why_5_root_cause: |
      The contract treated "GGUF tensor naming" as a flat fallback,
      not as an architecture-aware namespace. Every new architecture
      lands as a code patch in tensor_names_fallback.rs without a
      paired contract gate. v1.1.0 adds qwen3_moe as a first-class
      architecture key with its own GGUF templates AND adds an
      F-TNV-002 falsification gate against a real qwen3_moe.gguf
      tensor inventory.
    fix:
    - '1.1.0 — adds qwen3_moe to architecture_map'
    - '1.1.0 — adds 4 new MoE-specific layer_roles: ffn_gate_inp,
      ffn_gate_exps, ffn_up_exps, ffn_down_exps'
    - '1.1.0 — marks dense ffn_gate_weight / ffn_up_weight / ffn_down_weight
      as required: false for qwen3_moe (MoE replaces them)'
    - '1.1.0 — adds F-TNV-002 falsification: tensor inventory of
      Qwen3-Coder-30B-A3B-Instruct.gguf must contain every required
      qwen3_moe template across all 48 layers'
