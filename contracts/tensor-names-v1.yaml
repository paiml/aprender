equations:
  name_resolution:
    formula: "resolve(source, arch, role) =\n  first(name ∈ names(arch, role) : source.has_tensor(name))\n  ?? first(name\
      \ ∈ fallback(role) : source.has_tensor(name))\n  ?? first(name ∈ names(arch, role) : source.has_tensor(strip_prefix(\"\
      model.\", name)))\n  ?? Error(\"tensor not found\")\n"
    domain: 'source: TensorSource, arch: str, role: GlobalTensorRole | LayerTensorRole'
    codomain: Result<Vec<f32>, Error>
    invariants:
    - Architecture-specific names tried before fallbacks
    - Bare name (without 'model.' prefix) tried as last resort
    - Error message lists all attempted names for diagnostics
    preconditions:
    - input.len() > 0
    - input.iter().all(|v| v.is_finite())
    lean_theorem: Theorems.Name_Resolution
  architecture_normalization:
    formula: 'normalize(raw) = architecture_map[raw] ?? "llama" (default)

      '
    domain: 'raw: str (from config.json architectures or GGUF metadata)'
    codomain: canonical architecture key
    invariants:
    - Unknown architecture defaults to llama (safest default)
    - Case-sensitive matching on HF class names
    - Lowercase matching on GGUF arch strings
    preconditions:
    - input.iter().all(|v| v.is_finite())
    - input.len() > 0
    lean_theorem: Theorems.Architecture_Normalization
falsification_tests:
- id: FALSIFY-TNAME-001
  rule: YAML-Rust parity
  prediction: 'For every (architecture, role) pair in this YAML, the generated Rust lookup functions return identical name
    lists.

    '
  test: 'Deterministic: iterate all architectures and roles, compare YAML names against Rust function output.

    '
  if_fails: 'Generated code has diverged from YAML. Regenerate via build.rs.

    '
- id: FALSIFY-TNAME-002
  rule: Architecture map completeness
  prediction: 'Every architecture key referenced in global_roles, layer_roles, and fused_roles has a corresponding entry in
    architecture_map.

    '
  test: 'Deterministic: collect all arch keys from role definitions, verify each exists in architecture_map values.

    '
  if_fails: 'A new architecture was added to roles but not to the map.

    '
- id: FALSIFY-TNAME-003
  rule: Fallback non-empty for required roles
  prediction: 'Every role marked required=true has at least one fallback name.

    '
  test: 'Deterministic: check _fallback list for each required role.

    '
  if_fails: 'A required role has no GGUF fallback, breaking models with non-standard naming.

    '
- id: FALSIFY-TNAME-004
  rule: PhiForCausalLM maps to phi2, Phi3ForCausalLM maps to phi
  prediction: 'normalize_architecture("PhiForCausalLM") == "phi2" and normalize_architecture("Phi3ForCausalLM") == "phi".

    '
  test: 'Deterministic: direct assertion.

    '
  if_fails: 'Phi-1.5/Phi-2 models will use wrong tensor names (gate_proj instead of fc1).

    '
- id: FALSIFY-TNAME-005
  rule: Unknown architecture defaults to llama
  prediction: 'normalize_architecture("FutureArch2027") returns "llama".

    '
  test: 'Proptest: random strings all map to "llama".

    '
  if_fails: 'Default match arm is missing or maps to wrong architecture.

    '
- id: FALSIFY-TNAME-006
  rule: GPT-2 bare names resolved
  prediction: 'For GPT-2 architecture, global_names returns ["wte.weight", "transformer.wte.weight"] for embedding role (no
    "model." prefix).

    '
  test: 'Deterministic: verify exact name lists for GPT-2.

    '
  if_fails: 'GPT-2 names incorrectly prefixed, resolution will fail on real models.

    '
- id: FALSIFY-TNAME-007
  rule: Fused QKV resolution for GPT-2/GPT-NeoX
  prediction: 'fused_templates("gpt2", FusedQkv) returns non-empty list, while q_proj_weight templates for gpt2 returns empty
    list.

    '
  test: 'Deterministic: verify fused templates non-empty and separate Q/K/V empty.

    '
  if_fails: 'GPT-2 will try to load separate Q/K/V tensors that don''t exist.

    '
- id: F-TNV-002
  rule: qwen3_moe real GGUF inventory parity
  added: '2026-04-28'
  severity: CRITICAL
  prediction: |
    For every required role R in
    {ffn_gate_inp_weight, ffn_gate_exps_weight, ffn_up_exps_weight,
     ffn_down_exps_weight} and every layer n in [0, num_layers),
    the GGUF template templates[qwen3_moe] for role R resolves to a
    tensor name that exists in a canonical reference qwen3_moe GGUF
    (Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf, 17.3 GB).
  test: |
    `apr inspect <ref.gguf>` enumerates every blk.{n}.X tensor;
    iterate roles × architectures; assert each generated GGUF name
    appears in the inspected set, and conversely no observed
    blk.{n}.* name is unmapped.
  if_fails: |
    A required role's GGUF template diverged from llama.cpp's actual
    naming convention for this architecture. New architectures must
    extend templates[ARCH] before merging — falling back to dense
    `_fallback` causes "Tensor 'blk.0.ffn_up.weight' not found"
    runtime errors (the original five-whys symptom).
  cross_check_command: |
    cargo test -p aprender-serve --test qwen3_moe_tensor_inventory \
      --features cuda -- --nocapture
enforcement:
  yaml_rust_parity:
    description: YAML contract and generated Rust code must be identical
    check: tensor_names::tests::FALSIFY-TNAME-001
    severity: CRITICAL
  architecture_completeness:
    description: Every architecture in roles has a map entry
    check: tensor_names::tests::FALSIFY-TNAME-002
    severity: ERROR
  phi_distinction:
    description: PhiForCausalLM != Phi3ForCausalLM
    check: tensor_names::tests::FALSIFY-TNAME-004
    severity: CRITICAL
