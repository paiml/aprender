  # ── MoE roles (v1.1.0 — qwen3_moe and friends) ─────────────────────────
  # These four roles are present ONLY for MoE architectures. Dense models
  # use ffn_gate_weight / ffn_up_weight / ffn_down_weight above; MoE
  # models replace those with the four below. F-TNV-002 falsifies on a
  # representative qwen3_moe.gguf (Qwen3-Coder-30B-A3B-Instruct).
  ffn_gate_inp_weight:
    description: |
      MoE router/gating projection. Maps hidden state to expert logits.
      Shape [hidden_dim, num_experts]. Present in every MoE block.
    required: false
    required_per_arch:
      qwen3_moe: true
    templates:
      qwen3_moe:
      - model.layers.{n}.mlp.gate.weight
      _fallback:
      - blk.{n}.ffn_gate_inp.weight
  ffn_gate_exps_weight:
    description: |
      MoE per-expert gate projection (3D). Shape [num_experts,
      intermediate_size, hidden_dim]. SwiGLU-style gating per expert.
    required: false
    required_per_arch:
      qwen3_moe: true
    templates:
      qwen3_moe:
      - model.layers.{n}.mlp.experts.{e}.gate_proj.weight
      _fallback:
      - blk.{n}.ffn_gate_exps.weight
