metadata:
  version: 1.0.0
  created: '2026-02-23'
  author: PAIML Engineering
  description: Architecture-specific tensor name resolution — source of truth
  registry: true
  references:
  - 'GH-311: Tensor name resolution contract'
  - 'architecture-requirements-v1.yaml: Weight role definitions'
  - 'realizar/src/tensor_names.rs: Generated Rust implementation'
architecture_map:
  LlamaForCausalLM: llama
  LLaMAForCausalLM: llama
  llama: llama
  llama3: llama
  Qwen2ForCausalLM: qwen2
  qwen2: qwen2
  qwen2.5: qwen2
  qwen: qwen2
  Qwen3ForCausalLM: qwen3
  qwen3: qwen3
  MistralForCausalLM: mistral
  mistral: mistral
  GemmaForCausalLM: gemma
  Gemma2ForCausalLM: gemma
  gemma: gemma
  gemma2: gemma
  Phi3ForCausalLM: phi
  Phi3SmallForCausalLM: phi
  phi3: phi
  phi: phi
  PhiForCausalLM: phi2
  phi2: phi2
  DeepseekV2ForCausalLM: deepseek
  deepseek: deepseek
  GPT2LMHeadModel: gpt2
  gpt2: gpt2
  GPTNeoXForCausalLM: gpt_neox
  gpt_neox: gpt_neox
  BertModel: bert
  BertForMaskedLM: bert
  bert: bert
  OpenELMForCausalLM: openelm
  openelm: openelm
  FalconForCausalLM: falcon
  falcon: falcon
  StableLmForCausalLM: stablelm
  stablelm: stablelm
global_roles:
  embedding:
    description: Token embedding matrix [vocab_size, hidden_dim]
    required: true
    names:
      llama:
      - model.embed_tokens.weight
      qwen2:
      - model.embed_tokens.weight
      qwen3:
      - model.embed_tokens.weight
      mistral:
      - model.embed_tokens.weight
      gemma:
      - model.embed_tokens.weight
      phi:
      - model.embed_tokens.weight
      phi2:
      - model.embed_tokens.weight
      deepseek:
      - model.embed_tokens.weight
      gpt2:
      - wte.weight
      - transformer.wte.weight
      gpt_neox:
      - gpt_neox.embed_in.weight
      bert:
      - bert.embeddings.word_embeddings.weight
      - embeddings.word_embeddings.weight
      openelm:
      - model.embed_tokens.weight
      - transformer.token_embeddings.weight
      falcon:
      - transformer.word_embeddings.weight
      - model.embed_tokens.weight
      stablelm:
      - model.embed_tokens.weight
      _fallback:
      - token_embd.weight
  output_norm_weight:
    description: Final layer normalization weight
    required: true
    names:
      llama:
      - model.norm.weight
      qwen2:
      - model.norm.weight
      qwen3:
      - model.norm.weight
      mistral:
      - model.norm.weight
      gemma:
      - model.norm.weight
      phi:
      - model.norm.weight
      phi2:
      - model.final_layernorm.weight
      - model.norm.weight
      deepseek:
      - model.norm.weight
      gpt2:
      - ln_f.weight
      - transformer.ln_f.weight
      gpt_neox:
      - gpt_neox.final_layer_norm.weight
      bert:
      - bert.encoder.layer_norm.weight
      - encoder.layer_norm.weight
      openelm:
      - model.norm.weight
      - transformer.norm.weight
      falcon:
      - transformer.ln_f.weight
      - model.norm.weight
      stablelm:
      - model.norm.weight
      _fallback:
      - output_norm.weight
  output_norm_bias:
    description: Final layer normalization bias (optional, LayerNorm models)
    required: false
    names:
      llama: []
      qwen2: []
      qwen3: []
      mistral: []
      gemma: []
      phi: []
      phi2:
      - model.final_layernorm.bias
      deepseek: []
      gpt2:
      - ln_f.bias
      - transformer.ln_f.bias
      gpt_neox:
      - gpt_neox.final_layer_norm.bias
      bert:
      - bert.encoder.layer_norm.bias
      - encoder.layer_norm.bias
      openelm: []
      falcon:
      - transformer.ln_f.bias
      stablelm: []
      _fallback:
      - output_norm.bias
  lm_head:
    description: Language model head projection [vocab_size, hidden_dim]
    required: false
    names:
      llama:
      - lm_head.weight
      qwen2:
      - lm_head.weight
      qwen3:
      - lm_head.weight
      mistral:
      - lm_head.weight
      gemma:
      - lm_head.weight
      phi:
      - lm_head.weight
      phi2:
      - lm_head.weight
      deepseek:
      - lm_head.weight
      gpt2:
      - lm_head.weight
      gpt_neox:
      - embed_out.weight
      bert:
      - cls.predictions.decoder.weight
      openelm:
      - lm_head.weight
      falcon:
      - lm_head.weight
      stablelm:
      - lm_head.weight
      _fallback:
      - output.weight
  position_embedding:
    description: Absolute position embedding (GPT-2 style, optional)
    required: false
    names:
      llama: []
      qwen2: []
      qwen3: []
      mistral: []
      gemma: []
      phi: []
      phi2: []
      deepseek: []
      gpt2:
      - wpe.weight
      - transformer.wpe.weight
      gpt_neox: []
      bert:
      - bert.embeddings.position_embeddings.weight
      - embeddings.position_embeddings.weight
      openelm: []
      falcon: []
      stablelm: []
      _fallback: []
