# CRUX-A-11 — apr cp copy model with new tag

metadata:
  id: CRUX-A-11
  version: "1.1.0"
  created: "2026-04-18"
  author: PAIML Engineering
  registry: true
  status: draft
  parent_contracts:
  - crux-competitive-research-ux-v1
  category: "A — Model Intake & Discovery"
  competitor: ollama
  demand_score: 3
  intake_status: missing
  description: >
    Copy a local model under a new tag without re-downloading weights.
    Canonical: `ollama cp llama3:latest my-llama3:v1` — hard-links blobs,
    writes a new manifest pointing at the same blob sha256.

equations:
  copy_by_manifest:
    formula: |
      apr cp SRC DST creates manifest(DST) such that:
        manifest(DST).blobs == manifest(SRC).blobs  (identical sha256 list)
        stat(blob_path).st_ino == stat(blob_path_after_cp).st_ino  (hard-link)
        disk_usage_delta ≈ sizeof(manifest_json)     (only JSON, no re-copy)
    domain: "(src_tag: str, dst_tag: str) where src_tag ∈ local_registry"
    codomain: "manifest file + 0 new blobs"
    invariants:
    - "blob count unchanged across registry; only manifest count increments"
    - "`apr ls` lists both SRC and DST tags after cp"
    - "removing DST leaves SRC blobs intact (refcount decrement, not delete)"

falsification_tests:
- id: FALSIFY-CRUX-A-11-001
  rule: copy is manifest-only; no new blob bytes land on disk
  prediction: "du -b before vs after apr cp differs by ≤ 4 KiB (one manifest file)"
  test: |
    set -euo pipefail
    REG="$HOME/.apr/models"
    SRC="qwen2.5-0.5b:latest"
    DST="qwen2.5-0.5b:mycopy"
    before=$(du -sb "$REG" | cut -f1)
    apr cp "$SRC" "$DST"
    after=$(du -sb "$REG" | cut -f1)
    delta=$((after - before))
    [ "$delta" -le 4096 ] || { echo "cp allocated $delta bytes (expected ≤4096)"; exit 1; }
    apr ls | grep -q "$DST"
- id: FALSIFY-CRUX-A-11-002
  rule: blobs are hard-linked, not bytewise copied
  prediction: "blob inode is identical between SRC and DST manifest references"
  test: |
    set -euo pipefail
    src_blob=$(apr inspect --blob-path "qwen2.5-0.5b:latest" | head -1)
    dst_blob=$(apr inspect --blob-path "qwen2.5-0.5b:mycopy" | head -1)
    [ "$(stat -c %i "$src_blob")" = "$(stat -c %i "$dst_blob")" ]

proof_obligations:
- type: parity
  property: "apr cp matches `ollama cp` — identical blob sharing semantics"
- type: invariant
  property: "disk-usage delta ≤ 4 KiB per copy (manifest only)"
- type: invariant
  property: "removing DST does not affect SRC readability"

verification_summary:
  total_obligations: 3
  proven: 0
  tested: 0
  status: spec-complete

pmat_work_tracking:
  ticket_tag: crux-crux-a-11
  priority: medium
  auto_created: true
