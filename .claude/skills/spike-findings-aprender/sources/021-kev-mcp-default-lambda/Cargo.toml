[package]
name = "kev-mcp-cloud"
version = "0.1.0"
edition = "2021"
publish = false

# Spike 021-023: Kev-0.8B as a thin stateless pmcp MCP server, one crate for three AWS hosts:
# `bootstrap` (default Lambda / Lambda Managed Instances, loopback shim) and `server` (Fargate container).
[workspace]

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
# upstream Qwen3.5 forward + batched prefill, from the spike-016 merge worktree (@ 32103ba83)
realizar = { path = "/Users/guy/Development/machine-learning/aprender-016-upstream-sync/crates/aprender-serve", package = "aprender-serve", default-features = false }
trueno = { path = "/Users/guy/Development/machine-learning/aprender-016-upstream-sync/crates/aprender-compute", package = "aprender-compute", features = ["parallel"] }
pmcp = { version = "2.19", features = ["streamable-http", "schema-generation"] }
schemars = "1.0"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
once_cell = "1.19"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
lambda_http = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = false
