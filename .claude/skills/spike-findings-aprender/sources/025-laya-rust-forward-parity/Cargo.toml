[package]
name = "laya-rust-forward-parity"
version = "0.1.0"
edition = "2021"
publish = false

# Spike 025: Laya (ModernBERT-large + 2-layer head + marker scorer) forward in Rust, parity vs torch fp32.
[workspace]

[lib]
name = "laya"
path = "src/laya.rs"

[[bin]]
name = "laya-parity"
path = "src/main.rs"

[dependencies]
# upstream trueno (BLIS GEMM with the aarch64 8x6 NEON microkernel), the same tree spikes 017/020 used
trueno = { path = "/Users/guy/Development/machine-learning/aprender-016-upstream-sync/crates/aprender-compute", package = "aprender-compute" }
safetensors = "0.4"
half = { version = "2.4", default-features = false, features = ["std"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
libm = "0.2"

[profile.release]
debug = false
