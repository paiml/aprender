          # fetch of a public repo, and GitHub answers the fleet's IP with 401
          # once its anonymous quota is spent — the same throttle dfb8914
          # closed for the sibling clones. cargo-deny fetches with the git CLI
          # here, so a url rewrite carrying the job's own (read-only) token is
          # honoured. Scoped to this step's process: --global on a job
          # container that is discarded after the job.
