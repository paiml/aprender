  security:
    name: security
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 10
    # Rule 8: Security is a required check — no more continue-on-error.
    # Advisory exemptions go in .cargo/audit.toml, not in CI skip logic.
    # Moved from ubuntu-latest to self-hosted: matches sovereign runner policy
    # and avoids sibling checkout PWD issues on GitHub-hosted runners.
    steps:
      # Pre-checkout EACCES self-heal — see the `test` job for the five-whys
      # (paiml/.github#42). Root-owned leftovers from a hard-killed job break
      # the next job inside actions/checkout, before any of its steps run.
      - name: Pre-checkout ownership restore (EACCES self-heal)
        run: |
          set -u
          # Resolve the runner's _work root. Bare-metal that is
          # "<runner>/_work"; inside a job-level container the runner
          # path-translates these vars and it is "/__w" (bind-mounted from the
          # same host dir). So do NOT match on the name — an earlier revision
          # tested `*/_work` and silently narrowed every container job back to
          # the old workspace-only scope. Validate structurally instead: the
          # work root is the parent of BOTH the job workspace AND RUNNER_TEMP,
          # which holds on either side of the mount, so requiring the two to
          # agree pins us to the real work root and can never escape above it.
          WORK_ROOT="$(dirname "${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}")"
          if [ "$WORK_ROOT" != "$(dirname "${RUNNER_TEMP:-/dev/null}")" ] || [ ! -d "$WORK_ROOT" ]; then
            echo "::warning::could not resolve the runner _work root ('$WORK_ROOT') — narrowing to the repo workspace"
            WORK_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          fi
          # This job is bare-metal, so reclaiming root-owned leftovers needs
          # privilege. `sudo -n` never prompts, and `$(id -un):$(id -gn)` keeps
          # the invocation inside the narrow /etc/sudoers.d/runner-chown grant
          # (`chown -R noah:noah *`) instead of relying on a blanket rule.
          # Never fails the job: an unprivileged chown fixes whatever we own.
          OWNER="$(id -un):$(id -gn)"
          sudo -n chown -R "$OWNER" "$WORK_ROOT" 2>/dev/null \
            || chown -R "$OWNER" "$WORK_ROOT" 2>/dev/null \
            || true
          # Post-condition, not just an exit code: the sudoers drop-ins on intel
          # are machine-level config and NOT tracked in paiml/infra, so a reimage
          # can silently turn this step into a no-op. Assert the tree is actually
          # clean so that failure mode surfaces here instead of as a mystery
          # EACCES in the next job's checkout.
          if find "$WORK_ROOT" ! -user "$(id -un)" -print -quit 2>/dev/null | grep -q .; then
            echo "::warning::root-owned leftovers remain under $WORK_ROOT — checkout may fail with EACCES (is /etc/sudoers.d/runner-chown deployed?)"
          else
            echo "pre-checkout ownership restored under $WORK_ROOT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: roadmap-valid
        # BSE-09c (BSE-001 v1.2, infra PMAT-239): every repo's docs/roadmaps/roadmap.yaml
        # must parse AND validate before ci / gate — infra carried an unparseable roadmap
        # for an afternoon and pmat's own master a schema-invalid row, and no gate noticed.
        # Fail-closed: an absent pmat, or a pmat without `work validate`, is RED, never a
        # skip. `pmat work validate` exists since pmat v3.0.6 (measured in the pmat tree),
        # so the fleet pin (3.31.0 today, 3.37.0 after BSE-10b) carries it. Placed right
        # after checkout, ABOVE the `if: always()` ownership-restore teardown, so it runs
        # before anything in this job can fail and never sits after a teardown-last step.
        # A repo with no roadmap at pmat's canonical path is the ONLY NOT-RUN, and the step
        # says so — and names any roadmap-like file it found elsewhere, because a result
        # that was not measured must never read as a pass (2026-09-05 D1 quorum, Q4c).
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/fleet-bin/bin:$HOME/.cargo/bin:/usr/local/cargo/bin:$PATH"
          if [ ! -f docs/roadmaps/roadmap.yaml ]; then
            others=$(find . -maxdepth 3 -iname 'roadmap.y*ml' -not -path './docs/roadmaps/roadmap.yaml' -not -path './target/*' 2>/dev/null | sort | tr '\n' ' ')
            if [ -n "$others" ]; then
              echo "::warning::roadmap-valid: NOT-RUN — no docs/roadmaps/roadmap.yaml (pmat's canonical path), but roadmap-like file(s) exist elsewhere and were NOT validated: $others"
            else
              echo "roadmap-valid: NOT-RUN — no docs/roadmaps/roadmap.yaml (nothing to validate)"
            fi
            exit 0
          fi
          if ! command -v pmat >/dev/null 2>&1; then
            echo "::error::roadmap-valid: pmat is not on PATH — an absent verifier is a NO-GO, not a pass"
            exit 1
          fi
          if ! pmat work validate --help >/dev/null 2>&1; then
            echo "::error::roadmap-valid: $(pmat --version 2>&1 | head -1) has no 'work validate' (first in v3.0.6); the fleet pin is BSE-10b (infra PMAT-231)"
            exit 1
          fi
          pmat work validate
      - name: roadmap-fragment-parity
        # PMAT-1363 / paiml/aprender#3296. docs/roadmaps/roadmap.yaml is a
        # GENERATED aggregate of docs/roadmaps/entries/<id>.yaml. A pull request
        # therefore writes ONE fragment, named for its own Pmat-Ticket trailer,
        # and never touches the aggregate.
        #
        # WHY: every PR writing the roadmap makes it a shared mutable file on the
        # merge path — Amdahl serial fraction 1, so N pull requests contend on one
        # file however disjoint their code is. Measured in paiml/aprender
        # 2026-09-15: 146 PRs opened over 10 days against 88 merged, and of the
        # last 25 merge_group CI runs 7 succeeded and 15 were CANCELLED. A unique
        # filename per ticket makes them pairwise disjoint by construction.
        #
        # OPT-IN ON entries/ AND AN UNTRACKED AGGREGATE (see NOT-ACTIVE below),
        # AND THAT IS LOAD-BEARING. This workflow runs in
        # every consumer repo, and the ones that have not migrated still write
        # roadmap.yaml legitimately. Failing them would be the shape that took
        # every consumer red when `continue-on-error` was removed upstream: a gate
        # armed here lands everywhere at once. No entries/ dir => NOT-RUN, said
        # out loud, never a silent pass (the same discipline as roadmap-valid
        # above: a result that was not measured must never read as a pass).
        #
        # This is the bespoke form. It becomes `pmat comply` once pmat ships the
        # check (paiml/paiml-mcp-agent-toolkit#1363) — tracked, not forgotten.
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          entries=docs/roadmaps/entries
          aggregate=docs/roadmaps/roadmap.yaml
          if [ ! -d "$entries" ]; then
            echo "roadmap-fragment-parity: NOT-RUN — no $entries/ in this repo (not migrated)"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git fetch -q --no-tags origin "$BASE_SHA" 2>/dev/null || true
          fi
          if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "::error::roadmap-fragment-parity: base $BASE_SHA is unreachable — a check that cannot read its input does not pass"
            exit 1
          fi
          # ACTIVE ONLY ONCE THE AGGREGATE IS UNTRACKED (paiml/aprender#3709). A repo
          # that has entries/ but still COMMITS roadmap.yaml has not migrated: its own
          # roadmap-aggregate-check requires the committed file in sync, so arming here
          # would refuse every PR it opens (measured on aprender's sovereign-ci pin bump
          # for coverage_on, paiml/aprender#3676). Keyed on the BASE tree, not the PR
          # head: a PR that re-adds the aggregate must not switch its own gate off, and
          # the PR that deletes it (the migration) must not be refused by the gate that
          # deletion arms. No flag to forget: migrating is what switches it on.
          if git cat-file -e "$BASE_SHA:$aggregate" 2>/dev/null; then
            echo "roadmap-fragment-parity: NOT-ACTIVE — $aggregate is TRACKED at the base (${BASE_SHA:0:9}), so this repo still commits the aggregate; the check arms by itself once it is untracked (paiml/aprender#3709)"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          bad=0
          if printf '%s\n' "$files" | grep -qx "$aggregate"; then
            echo "::error::roadmap-fragment-parity: $aggregate is GENERATED — run 'make roadmap-aggregate' on the default branch, never edit it in a PR"
            bad=1
          fi
          trailers=$(git log --format='%(trailers:key=Pmat-Ticket,valueonly)' "$BASE_SHA..$HEAD_SHA" | tr -d ' ' | grep -v '^$' | sort -u || true)
          n=0
          while IFS= read -r f; do
            case "$f" in "$entries"/*.yaml) ;; *) continue ;; esac
            n=$((n + 1))
            id="${f##*/}"; id="${id%.yaml}"
            if ! printf '%s\n' "$trailers" | grep -qx "$id"; then
              echo "::error::roadmap-fragment-parity: $f has no matching 'Pmat-Ticket: $id' trailer on this branch"
              bad=1
            fi
          done <<< "$files"
          [ "$bad" = 0 ] || exit 1
          echo "roadmap-fragment-parity: ok — $n fragment(s), every one named for a Pmat-Ticket on this branch"
      - name: Install extra packages
        if: ${{ inputs.extra_pkgs != '' }}
        run: |
          apt-get update -qq && apt-get install -y -qq ${{ inputs.extra_pkgs }} 2>/dev/null || \
          sudo apt-get update -qq && sudo apt-get install -y -qq ${{ inputs.extra_pkgs }} 2>/dev/null || true
      # NOTE (paiml/.github#42, 2026-07-27): the former post-checkout step
      # "Reclaim sibling workspace ownership (defense in depth)" lived here
      # (added 2026-04-20, paiml/infra#69). It is superseded by the
      # pre-checkout restore above, which is strictly broader — it runs
      # before actions/checkout (the step that actually failed) and covers
      # the whole _work root instead of just $GITHUB_WORKSPACE/.. . Keeping
      # both would just pay for a second full-tree chown.
      - name: Checkout sibling repos (path deps)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE/.."
          # Anonymous git over HTTPS from the fleet's shared egress IP is throttled
          # by GitHub once the 16 runners have each cloned a few times: every job
          # on 2026-09-02 died here at "could not read Username for
          # 'https://github.com'" while the same clone with the job token answered.
          # The siblings are public, so the calling workflow's token can read them;
          # the header is per-invocation and never written to the checkout.
          # POSIX sh, not bash: these container steps run under `sh -e`. The
          # token rides in git's GIT_CONFIG_* environment (git >= 2.31), which
          # every git call in this step inherits.
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            GIT_CONFIG_COUNT=1
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          fi
          GIT_TERMINAL_PROMPT=0
          export GIT_TERMINAL_PROMPT
          # APR-MONO (2026-04-13): trueno, trueno-rag, trueno-db, trueno-viz,
          # alimentar, presentar, renacer, batuta, realizar, probar merged into
          # aprender monorepo and archived. Removed from sibling-clone list to
          # stop wasting runner minutes on 10 archived repos × 5 CI stages.
          # provable-contracts kept (pv codegen still uses it); aprender +
          # whisper.apr still active.
          for repo in provable-contracts aprender whisper.apr; do
            # Skip the current repo — it is already checked out at $GITHUB_WORKSPACE.
            # Compare against the checkout DIRECTORY name (github.event.repository.name),
            # NOT inputs.repo (the cargo package name). These differ for repos like
            # whisper.apr (dir "whisper.apr" vs crate "whisper-apr"); using inputs.repo
            # here fails to skip and `git reset --hard origin/main` clobbers the PR checkout.
            [ "$repo" = "${{ github.event.repository.name }}" ] && continue
            # Remove stale partial clones (file instead of dir)
            if [ -e "$repo" ] && [ ! -d "$repo" ]; then rm -f "$repo"; fi
            # Validate cached clone. If HEAD missing or fetch fails, nuke + re-clone.
            # Silent `|| true` on fetch previously masked broken caches (bashrs#197).
            if [ -d "$repo" ]; then
              if ! git -C "$repo" rev-parse HEAD >/dev/null 2>&1; then
                echo "::warning::$repo cache invalid (no HEAD) — re-cloning"
                rm -rf "$repo"
              elif ! (git -C "$repo" fetch --depth 1 origin main 2>&1 && git -C "$repo" reset --hard FETCH_HEAD >/dev/null 2>&1); then
                echo "::warning::$repo fetch failed — re-cloning"
                rm -rf "$repo"
              fi
            fi
            if [ ! -d "$repo" ]; then
              for attempt in 1 2 3; do
                git clone --depth 1 "https://github.com/paiml/$repo.git" "$repo" 2>&1 && break
                rm -rf "$repo"  # Clean failed clone before retry
                echo "::warning::Retry $attempt for $repo clone"
                sleep 2
              done
            fi
          done
          # Note: generated contract macros may have unused variables (provable-contracts#64).
          # This is handled by adding -A unused-variables to the clippy step.
          for repo in provable-contracts; do
            if [ ! -d "$repo" ]; then
              echo "::error::Critical sibling $repo missing — builds will fail"
            fi
          done
          # Note: generated contract macros may have unused variables (provable-contracts#64).
          # This is handled by adding -A unused-variables to the clippy step.
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      # FIVE-WHYS ROOT CAUSE (2026-04-24, aprender#1043 ANDON, paiml/infra#77):
      # The `security` job runs bare-metal (runs-on: [self-hosted, clean-room])
      # so 16 intel-clean-room-* runners all share HOME=/home/noah and thus
      # $HOME/.cargo/registry. Concurrent `cargo install cargo-audit` jobs
      # race on src/ extraction + .cache/ writes, producing:
      #   warning: failed to write cache, path: ~/.cargo/registry/index/.../.cache/ca/rg/<crate>, Permission denied (os error 13)
      #   error: couldn't read ~/.cargo/registry/src/.../fnv-1.0.7/lib.rs: Permission denied
      #   error: could not compile `fnv` (lib) due to 1 previous error
      # Per-runner CARGO_HOME (matches `target/` per-runner pattern already
      # used by the `test`/`lint`/`coverage` jobs above) eliminates the race
      # class at source. Independent of aprender#1043's workspace-test fix
      # (which addresses the containerized workspace-test job's registry
      # mount, not this bare-metal security job's $HOME).
      #
      # 2026-08-30: that per-runner CARGO_HOME moved off /tmp. The isolation
      # above is right; the location was not. /tmp is emptied at boot, so a
      # per-runner cache there HALF-persists — it survives between jobs and
      # vanishes on the next reboot, so the crates.io registry and the
      # cargo-audit compile are re-paid on an unpredictable subset of runs.
      # paiml/infra's shared-$HOME guard blocks that shape as
      # `cargo-install-boot-volatile`, and this exact step is the fixture it
      # was written from (infra#219, bad-cargo-install-tmp.yml).
      #
      # $RUNNER_TOOL_CACHE is the runner's own persistent tool directory
      # (<runner>/_work/_tool). It is already per-runner by construction —
      # each of the 16 intel services has its own _work tree — so it keeps
      # every property this step was reaching for, and survives a reboot.
      - name: Install cargo-audit (per-runner CARGO_HOME)
        run: |
          # Fail closed: an unset RUNNER_TOOL_CACHE would root CARGO_HOME at /
          # and the mkdir would fail with a message about the wrong thing.
          : "${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is unset; refusing to root CARGO_HOME at /}"
          export CARGO_HOME="$RUNNER_TOOL_CACHE/cargo-home-security"
          mkdir -p "$CARGO_HOME"
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          cargo install cargo-audit --locked --root "$CARGO_HOME" || true
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # forjar#422: same throttle as the cargo-deny step — authenticate the
          # advisory-db fetch with the job's own token via a url rewrite.
          # Step-local, never `git config --global`: the `security` job is bare-metal and
          # its global writes land in the shared runner ~/.gitconfig, where a stale
          # job token then rides on every later job's git request (2026-09-02: every
          # host job answered "Duplicate header: Authorization" -> HTTP 400).
          GIT_CONFIG_COUNT=1
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GIT_TERMINAL_PROMPT=0
          # FIVE-WHYS ROOT CAUSE (2026-04-12):
          # The "Checkout sibling repos" step does cd $GITHUB_WORKSPACE/..
          # and never restores PWD. Without this cd, cargo audit reads
          # .cargo/audit.toml from a sibling repo (main branch), not from
          # the PR checkout — causing advisory exemptions to be silently
          # ignored. This was the root cause of 5 CI reruns on PR #726.
          cd "$GITHUB_WORKSPACE"

          # Build --ignore flags from .cargo/audit.toml if it exists.
          # cargo-audit 0.22 does NOT read config files — only CLI flags.
          IGNORE_FLAGS=""
          if [ -f .cargo/audit.toml ]; then
            for id in $(sed -n 's/.*\(RUSTSEC-[0-9]*-[0-9]*\).*/\1/p' .cargo/audit.toml); do
              IGNORE_FLAGS="$IGNORE_FLAGS --ignore $id"
            done
            echo "Audit ignores: $IGNORE_FLAGS"
          fi

          # CONTRACT: FALSIFY-AUDIT-001 — verify PWD and ignore flag count.
          if [ -f .cargo/audit.toml ]; then
            EXPECTED=$(sed -n 's/.*\(RUSTSEC-[0-9]*-[0-9]*\).*/\1/p' .cargo/audit.toml | wc -l)
            ACTUAL=$(echo "$IGNORE_FLAGS" | tr ' ' '\n' | grep -c '^--ignore$' || echo 0)
            echo "FALSIFY-AUDIT-001: expected=$EXPECTED actual=$ACTUAL pwd=$(pwd)"
            if [ "$EXPECTED" -ne "$ACTUAL" ]; then
              echo "::error::FALSIFY-AUDIT-001: Expected $EXPECTED ignores, got $ACTUAL. PWD=$(pwd)"
              exit 1
            fi
          fi

          cargo audit $IGNORE_FLAGS
      # Symmetry with the container jobs (paiml/.github#42): every clean-room
      # job both tolerates poison on entry and refuses to leave any on exit,
      # so the invariant is uniform and greppable rather than per-job folklore.
      # This job runs unprivileged, so today it cannot itself create root-owned
      # files — the step is a guard against a future step here gaining
      # privilege (docker, sudo) and silently reintroducing the failure mode.
      - name: Restore runner ownership of workspace
        if: always()
        run: |
          set -u
          # Resolve the runner's _work root. Bare-metal that is
          # "<runner>/_work"; inside a job-level container the runner
          # path-translates these vars and it is "/__w" (bind-mounted from the
          # same host dir). So do NOT match on the name — an earlier revision
          # tested `*/_work` and silently narrowed every container job back to
          # the old workspace-only scope. Validate structurally instead: the
          # work root is the parent of BOTH the job workspace AND RUNNER_TEMP,
          # which holds on either side of the mount, so requiring the two to
          # agree pins us to the real work root and can never escape above it.
          WORK_ROOT="$(dirname "${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}")"
          if [ "$WORK_ROOT" != "$(dirname "${RUNNER_TEMP:-/dev/null}")" ] || [ ! -d "$WORK_ROOT" ]; then
            echo "::warning::could not resolve the runner _work root ('$WORK_ROOT') — narrowing to the repo workspace"
            WORK_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          fi
          OWNER="$(id -un):$(id -gn)"
          sudo -n chown -R "$OWNER" "$WORK_ROOT" 2>/dev/null \
            || chown -R "$OWNER" "$WORK_ROOT" 2>/dev/null \
            || true

  provenance:
    name: provenance
    # 2026-08-20: was ubuntu-latest under an f8 allowlist entry claiming OIDC
    # id-tokens are "only issued on GitHub-hosted runners". That claim is wrong:
    # GitHub mints OIDC id-tokens for self-hosted runners too — the runner
    # requests one from the Actions service via ACTIONS_ID_TOKEN_REQUEST_URL,
    # which is exactly how self-hosted runners do keyless cloud auth. The claim
    # had never been tested; it was asserted and then inherited.
    #
    # Hosted runners are banned fleet-wide (build-performance.md principle 8):
    # they bill on private repos, and when the spending limit is reached the job
    # does not start at all. On a PRIVATE repo this job was therefore producing
    # no attestation while looking merely advisory-red. See paiml/infra#231.
    #
    # This job is continue-on-error, so flipping it is a cheap experiment rather
    # than a bet: if OIDC really does fail here, the job goes advisory-red and
    # nothing blocks. Verify by confirming an attestation is still produced
    # (gh attestation list) before treating this as settled.
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Generate SLSA provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v2
        with:
          subject-path: 'Cargo.toml'
        continue-on-error: true

  gate:
    name: gate
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 5
    if: always()
    needs: [test, lint, coverage, security, provenance]
    steps:
      # ALLOWLIST, NOT DENYLIST. Each check previously read
      #   if [ "<result>" = "failure" ]; then exit 1
      # which fails ONLY on the literal string "failure". A GitHub job result
      # is one of: success, failure, cancelled, skipped. So a job that was
      # CANCELLED — by the concurrency group, by a timeout, by a runner going
      # away — sailed straight through the gate.
      #
      # Observed live on paiml/ruchy#197: `ci / security` was CANCELLED and
      # `ci / gate` reported SUCCESS, certifying a repo that had 21 open RUSTSEC
      # advisories. The gate was not wrong about security; it never looked,
      # because "cancelled" is not "failure".
      #
      # Requiring "success" makes every non-success state stop the line, which
      # is the only safe default for a gate: a check that did not run has not
      # passed. `skipped` is deliberately NOT tolerated here — all four of these
      # jobs are mandatory, and a silently skipped mandatory job is exactly the
      # failure mode this replaces.
      - name: Check results
        env:
          COVERAGE_ON: ${{ inputs.coverage_on }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          rc=0
          # coverage_on: 'always' keeps the rule above verbatim (coverage must succeed).
          # 'tag': coverage is OWED on a v* tag push and on workflow_dispatch --
          # there it must succeed, and skipped is RED (the anti-vacuity arm). On every
          # other event the job is skipped by its own `if:`; that skip, and only that
          # skip, is accepted here and printed as NOT MEASURED, never as a pass.
          case "$COVERAGE_ON" in
            always|tag) ;;
            *) echo "::error::coverage_on must be 'always' or 'tag', got '${COVERAGE_ON}'"; exit 1 ;;
          esac
          coverage_owed=1
          if [ "$COVERAGE_ON" = tag ]; then
            case "$EVENT_NAME" in
              workflow_dispatch) coverage_owed=1 ;;
              push) case "$GIT_REF" in refs/tags/v*) coverage_owed=1 ;; *) coverage_owed=0 ;; esac ;;
              *) coverage_owed=0 ;;
            esac
          fi
          for pair in \
            "test:${{ needs.test.result }}" \
            "lint:${{ needs.lint.result }}" \
            "coverage:${{ needs.coverage.result }}" \
            "security:${{ needs.security.result }}"; do
            job="${pair%%:*}"
            res="${pair#*:}"
            if [ "$job" = coverage ] && [ "$coverage_owed" = 0 ] && [ "$res" = skipped ]; then
              echo "coverage: NOT MEASURED on ${EVENT_NAME} (coverage_on=tag; owed on v* tags and dispatch)"
              continue
            fi
            if [ "$res" != "success" ]; then
              echo "::error::${job} did not succeed (result: ${res:-<none>})"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo "Gate FAILED — a mandatory job did not succeed."
            echo "Note: cancelled and skipped both count as not-passed."
            exit 1
          fi
          echo "All critical jobs passed (test + lint + coverage + security)"
