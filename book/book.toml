[book]
authors = ["Pragmatic AI Labs <info@paiml.com>"]
language = "en"
src = "src"
title = "Aprender — Pure Rust ML Framework"
description = "The complete guide to aprender: a next-generation machine learning framework in pure Rust with 70 workspace crates, 57 CLI commands, provable contracts, and SIMD/GPU acceleration"

[build]
build-dir = "book"
create-missing = true
use-default-preprocessors = true

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/paiml/aprender"
edit-url-template = "https://github.com/paiml/aprender/edit/main/book/{path}"
site-url = "/aprender/"

[output.html.playground]
editable = true
copyable = true
copy-js = true
runnable = false
