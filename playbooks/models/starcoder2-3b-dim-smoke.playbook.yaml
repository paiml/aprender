# StarCoder2-3B Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
# Class A kernel: GQA + RMSNorm + SwiGLU + RoPE
name: starcoder2-3b-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for StarCoder2-3B (metadata-only)"

model:
  hf_repo: "bigcode/starcoder2-3b"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: medium
  expected_hidden_dim: 3072
  expected_num_layers: 30
  expected_num_heads: 24
  expected_num_kv_heads: 2
  expected_vocab_size: 49152
  expected_intermediate_dim: 12288
  family: starcoder2
  size_variant: "3b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "starcoder2"
  kernel_class: "A"
  kernel_proof_ref: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
  tags:
    - code
    - dim-smoke
