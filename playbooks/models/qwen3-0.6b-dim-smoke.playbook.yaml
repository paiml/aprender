# Qwen3-0.6B Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: qwen3-0.6b-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Qwen3-0.6B (metadata-only)"

model:
  hf_repo: "Qwen/Qwen3-0.6B"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: tiny
  expected_hidden_dim: 1024
  expected_num_layers: 28
  expected_num_heads: 16
  expected_num_kv_heads: 8
  expected_vocab_size: 151936
  expected_intermediate_dim: 3072
  family: qwen3
  size_variant: "0.6b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
