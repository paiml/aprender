# Nemotron-Nano-4B Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: llama-3.1-nemotron-nano-4b-v1.1-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Llama-3.1-Nemotron-Nano-4B-v1.1 (metadata-only)"

model:
  hf_repo: "nvidia/Llama-3.1-Nemotron-Nano-4B-v1.1"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: medium
  expected_hidden_dim: 3072
  expected_num_layers: 32
  expected_num_heads: 32
  expected_num_kv_heads: 8
  expected_vocab_size: 128256
  expected_intermediate_dim: 9216
  family: nemotron
  size_variant: "4b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "llama"
  kernel_class: "A"
  kernel_proof_ref: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
  tags:
    - instruct
    - dim-smoke
