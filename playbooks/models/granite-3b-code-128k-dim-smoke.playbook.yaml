# Granite-3B-Code-128K Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: granite-3b-code-128k-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Granite-3B-Code-Instruct-128K (metadata-only)"

model:
  hf_repo: "ibm-granite/granite-3b-code-instruct-128k"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: medium
  expected_hidden_dim: 2560
  expected_num_layers: 32
  expected_num_heads: 32
  expected_num_kv_heads: 32
  expected_vocab_size: 49152
  expected_intermediate_dim: 10240
  family: granite-code
  size_variant: "3b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "granite"
  kernel_class: "A"
  kernel_proof_ref: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
  tags:
    - code
    - dim-smoke
