# Galactica-125M Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: galactica-125m-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Galactica-125M (metadata-only)"

model:
  hf_repo: "facebook/galactica-125m"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: tiny
  expected_hidden_dim: 768
  expected_num_layers: 12
  expected_num_heads: 12
  expected_vocab_size: 50000
  expected_intermediate_dim: 3072
  family: opt
  size_variant: "125m"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "opt"
  kernel_class: "B"
  kernel_proof_ref: "EleutherAI/gpt-neox-20b"
  tags:
    - scientific
    - dim-smoke
