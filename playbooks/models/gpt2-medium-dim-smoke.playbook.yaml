# GPT-2 Medium 355M Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: gpt2-medium-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for GPT-2 Medium 355M (metadata-only)"

model:
  hf_repo: "openai-community/gpt2-medium"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: tiny
  expected_hidden_dim: 1024
  expected_num_layers: 24
  expected_num_heads: 16
  expected_vocab_size: 50257
  family: gpt2
  size_variant: "355m"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "gpt2"
  kernel_class: "B"
  kernel_proof_ref: "EleutherAI/gpt-neox-20b"
  tags:
    - dim-smoke
