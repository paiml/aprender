# Falcon-H1-Tiny-90M Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: falcon-h1-tiny-90m-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Falcon-H1-Tiny-90M (metadata-only)"

model:
  hf_repo: "tiiuae/Falcon-H1-Tiny-90M-Instruct"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: tiny
  expected_hidden_dim: 512
  expected_num_layers: 24
  expected_num_heads: 8
  expected_vocab_size: 32768
  expected_intermediate_dim: 768
  expected_num_kv_heads: 2
  family: falcon-h1
  size_variant: "90m"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "falcon_h1"
  kernel_class: "A"
  kernel_proof_ref: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
  tags:
    - dim-smoke
