# Qwen2.5-Coder-7B Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: qwen2.5-coder-7b-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Qwen2.5-Coder-7B-Instruct (metadata-only)"

model:
  hf_repo: "Qwen/Qwen2.5-Coder-7B-Instruct"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: medium
  expected_hidden_dim: 3584
  expected_num_layers: 28
  expected_num_heads: 28
  expected_num_kv_heads: 4
  expected_vocab_size: 152064
  expected_intermediate_dim: 18944
  family: qwen2
  size_variant: "7b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "qwen2"
  tags:
    - code
    - instruct
    - dim-smoke
