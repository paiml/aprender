# TinyLlama-1.1B Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: tinyllama-1.1b-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for TinyLlama-1.1B-Chat-v1.0 (metadata-only)"

model:
  hf_repo: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: small
  expected_hidden_dim: 2048
  expected_num_layers: 22
  expected_num_heads: 32
  expected_num_kv_heads: 4
  expected_vocab_size: 32000
  expected_intermediate_dim: 5632
  family: llama
  size_variant: "1.1b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "llama"
  tags:
    - chat
    - instruct
    - dim-smoke
