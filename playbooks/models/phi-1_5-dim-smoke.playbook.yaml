# Phi-1.5 Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
# Class D kernel: GQA + LayerNorm + GELU/SiLU (Phi architecture)
name: phi-1_5-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Phi-1.5 (metadata-only)"

model:
  hf_repo: "microsoft/phi-1_5"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: small
  expected_hidden_dim: 2048
  expected_num_layers: 24
  expected_num_heads: 32
  expected_vocab_size: 51200
  expected_intermediate_dim: 8192
  family: phi
  size_variant: "1.5b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "phi"
  kernel_class: "D"
  kernel_proof_ref: "microsoft/phi-1_5"
  tags:
    - base
    - dim-smoke
    - class-d-proof-ref
