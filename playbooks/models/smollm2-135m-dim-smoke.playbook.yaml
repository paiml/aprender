# SmolLM2-135M Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: smollm2-135m-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for SmolLM2-135M (metadata-only)"

model:
  hf_repo: "HuggingFaceTB/SmolLM2-135M"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: tiny
  expected_hidden_dim: 576
  expected_num_layers: 30
  expected_num_heads: 9
  expected_vocab_size: 49152
  expected_intermediate_dim: 1536
  expected_num_kv_heads: 3
  family: smollm2
