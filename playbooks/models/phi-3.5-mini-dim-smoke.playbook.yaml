# Phi-3.5-mini Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: phi-3.5-mini-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Phi-3.5-mini-instruct (metadata-only)"

model:
  hf_repo: "microsoft/Phi-3.5-mini-instruct"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: medium
  expected_hidden_dim: 3072
  expected_num_layers: 32
  expected_num_heads: 32
  expected_num_kv_heads: 32
  expected_vocab_size: 32064
  expected_intermediate_dim: 8192
  family: phi
  size_variant: "3.8b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "phi3"
  kernel_class: "D"
  kernel_proof_ref: "microsoft/phi-1_5"
  tags:
    - instruct
    - dim-smoke
