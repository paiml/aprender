# Mamba2-130M Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
# SSM (State Space Model, no attention)
name: mamba2-130m-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Mamba2-130M (metadata-only, SSM)"

model:
  hf_repo: "AntonV/mamba2-130m-hf"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: tiny
  expected_hidden_dim: 768
  expected_num_layers: 24
  expected_num_heads: 24
  expected_vocab_size: 50288
  family: mamba2
  size_variant: "130m"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "mamba2"
  kernel_class: "none"
  tags:
    - dim-smoke
