# DeepSeek-Coder-1.3B Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: deepseek-coder-1.3b-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for DeepSeek-Coder-1.3B-Instruct (metadata-only)"

model:
  hf_repo: "deepseek-ai/deepseek-coder-1.3b-instruct"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: small
  expected_hidden_dim: 2048
  expected_num_layers: 24
  expected_num_heads: 16
  expected_num_kv_heads: 16
  expected_vocab_size: 32256
  expected_intermediate_dim: 5504
  family: deepseek
  size_variant: "1.3b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "llama"
  kernel_class: "A"
  kernel_proof_ref: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
  tags:
    - code
    - instruct
    - dim-smoke
