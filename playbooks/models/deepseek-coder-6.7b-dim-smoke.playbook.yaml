# DeepSeek-Coder-6.7B Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
name: deepseek-coder-6.7b-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for DeepSeek-Coder-6.7B-Instruct (metadata-only)"

model:
  hf_repo: "deepseek-ai/deepseek-coder-6.7b-instruct"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: medium
  expected_hidden_dim: 4096
  expected_num_layers: 32
  expected_num_heads: 32
  expected_num_kv_heads: 32
  expected_vocab_size: 32256
  expected_intermediate_dim: 11008
