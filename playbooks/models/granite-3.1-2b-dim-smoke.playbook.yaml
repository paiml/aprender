# Granite-3.1-2B Dimensional Smoke Playbook
# Metadata-only: verifies config.json + SafeTensors headers (~2-5s, no inference)
# Class A kernel: GQA + RMSNorm + SiLU + SwiGLU + RoPE (LLaMA-derived)
name: granite-3.1-2b-dim-smoke
version: "1.0.0"
description: "Dimensional smoke check for Granite-3.1-2B-Instruct (metadata-only)"

model:
  hf_repo: "ibm-granite/granite-3.1-2b-instruct"
  formats:
    - safetensors
  quantizations:
    - q4_k_m
  size_category: small
  expected_hidden_dim: 2048
  expected_num_layers: 40
  expected_num_heads: 32
  expected_num_kv_heads: 8
  expected_vocab_size: 49155
  expected_intermediate_dim: 8192
  family: granite
  size_variant: "2b"

test_matrix:
  modalities:
    - run
  backends:
    - cpu
  scenario_count: 1
  seed: 42
  timeout_ms: 30000
  prompts:
    - "What is 2+2?"

gates:
  g1_model_loads: "true"
  g2_basic_inference: "true"
  g3_no_crashes: "true"
  g4_output_quality: "true"

failure_policy: collect_all

metadata:
  author: "apr-qa-gen"
  tier: "dim-smoke"
  architecture: "granite"
  kernel_class: "A"
  kernel_proof_ref: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
  tags:
    - instruct
    - dim-smoke
