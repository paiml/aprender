# apr-recipe-v1 (contracts/apr-recipe-v1.yaml): Llama 3.2 1B, 16-bit LoRA on an Alpaca-style
# instruction JSONL (the shape of the Unsloth "alpaca" notebook).
#
#   apr finetune --recipe examples/recipes/llama-3.2-1b-lora-alpaca.yaml --dry-run
#
# --dry-run validates the recipe and prints it fully resolved, without opening a model or the
# data, so it runs on a fresh checkout. A real run needs the base, data and eval files below;
# relative paths resolve against this file's directory.
# lora.alpha and training.warmup reach the training run. lora.dropout, training.weight_decay
# and lora.target_modules are validated but not yet read by the training loop; the receipt lists any of
# them you move off their default under validated_not_applied.
recipe: apr-recipe-v1
name: llama-3.2-1b-lora-alpaca
base: models/llama-3.2-1b-instruct.apr
model_size: 1B
method: lora
data:
  train: data/alpaca-train.jsonl
eval:
  heldout: data/alpaca-heldout.jsonl
seed: 3407
lora:
  alpha: 16
training:
  rank: 16
  warmup: 0.03
  epochs: 1
  learning_rate: 0.0002
  max_seq_len: 2048
output:
  dir: out/llama-3.2-1b-lora-alpaca
