# apr-recipe-v1 (contracts/apr-recipe-v1.yaml): Mistral 7B instruct, 4-bit QLoRA with
# lora_alpha = 2 x rank (the common "alpha 32, rank 16" setting).
#
#   apr finetune --recipe examples/recipes/mistral-7b-qlora-alpha-2x.yaml --dry-run
#
# --dry-run validates the recipe and prints it fully resolved, without opening a model or the
# data. A real run needs the base, data and eval files below; relative paths resolve against
# this file's directory. Leave lora_alpha out and apr finetune picks 2 x rank itself.
recipe: apr-recipe-v1
name: mistral-7b-qlora-alpha-2x
base: models/mistral-7b-instruct.apr
model_size: 7B
method: qlora
data:
  train: data/instruct-train.jsonl
eval:
  heldout: data/instruct-heldout.jsonl
seed: 3407
training:
  rank: 16
  lora_alpha: 32
  epochs: 1
  learning_rate: 0.0002
  max_seq_len: 2048
output:
  dir: out/mistral-7b-qlora-alpha-2x
