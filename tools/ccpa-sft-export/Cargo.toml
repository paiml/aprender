[package]
name = "ccpa-sft-export"
version = "0.1.0"
edition = "2021"
description = "Convert CCPA Claude Code teacher.stream.ndjson captures into apr-code <tool_call> SFT JSONL for entrenar InstructSample fine-tuning."
publish = false

[[bin]]
name = "ccpa-sft-export"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone data tool — intentionally NOT a workspace member (see root
# Cargo.toml `exclude`). Build directly: `cargo build --release` inside this dir.
[workspace]
