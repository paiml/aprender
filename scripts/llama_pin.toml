# THE PINNED llama.cpp COMPARATOR (PARITY-009, aprender#2676).
#
# An unpinned comparator makes every ratio meaningless ACROSS TIME: the
# denominator changes silently between releases while the receipt claims a
# fixed baseline. This file is the declaration; scripts/llama_bin.sh is the
# resolver that refuses anything else.
#
# WHY A FILE AND NOT A CONSTANT IN THE SCRIPT. The comparator version is a
# RELEASE-ENGINEERING decision with a date and a rationale, not an
# implementation detail. Changing it must be a reviewable diff that a future
# reader can bisect, and the receipt records what this file said at the time.
#
# BUMPING THIS IS A DELIBERATE ACT. Every ratio measured against the old pin
# becomes incomparable with every ratio measured against the new one. Record
# WHY in the commit, and expect the first release after a bump to have no
# usable trend.

[comparator]
name = "llama.cpp"
# The upstream build tag llama.cpp reports in its own --version output.
# Recorded as the STRING the binary prints, not as a semver we invent.
# PINNED 2026-08-24 from the binary actually installed on lambda:
#   $ llama-cli --version
#   version: 7746 (39173bcac)
#   built with GNU 11.4.0 for Linux x86_64
# CUDA-enabled (5 cuda/cublas libs linked), RTX 4090 sm_89 detected at init.
#
# Recorded as the STRING the binary prints, not a semver we invent. Bumping
# this invalidates every ratio measured against 39173bcac — record why in the
# commit, and expect the first release after a bump to have no usable trend.
build_commit = "39173bcac"
# Verbatim configure line. gx10 requires -DGGML_CUDA_ARCHITECTURES=121;
# omitting it JITs from stale PTX, which produces CORRECT OUTPUT SLOWLY and
# fires no correctness gate — a performance defect invisible to every check we
# have. Recorded per host because the flags legitimately differ.
build_flags_lambda = "cmake -B build -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=89"
build_flags_gx10   = "cmake -B build -DGGML_CUDA=ON -DGGML_CUDA_ARCHITECTURES=121"
build_flags_intel  = "cmake -B build -DGGML_NATIVE=ON"
build_flags_mini   = "cmake -B build -DGGML_METAL=ON"

# BOOTSTRAP. `build_commit = "UNPINNED"` is the honest state today: no ratio
# has been measured yet, so there is nothing to invalidate by choosing a pin
# later. The resolver treats UNPINNED as "report, never gate" — it will not
# silently accept whatever llama.cpp happens to be installed and call it
# pinned. Set this to the real build tag in the commit that first measures a
# ratio, and that commit is the start of the comparable series.


# ── THE FAIRNESS PROTOCOL (PARITY-010, aprender#2677) ──────────────────────
#
# A ratio is only a measurement if a SKEPTICAL OUTSIDER can reproduce both
# invocations from this file alone. Every knob below is one this project has
# actually been burned by, in one direction or the other:
#
#   · The "ollama decode 1.371x" claim was WITHDRAWN after re-measurement gave
#     1.015-1.109x. Over-claiming and under-claiming are both reporting
#     failures.
#   · A golden gate once flipped between backends on a bare "Hello" prompt
#     under greedy decode, because the argmax margin was a near-tie (#2359).
#     Prompt and sampling are pinned for that reason, not for tidiness.
#   · apr pays a 3.4-3.9 s one-shot startup that a resident daemon does not.
#     llama-bench has no equivalent, so a naive single-length comparison
#     charges apr for startup and reports a fabricated deficit. The 128/384
#     DIFFERENTIAL cancels it, and it is the only technique in this fleet that
#     does.
#
# EVERY KEY HERE MUST BE SET before a ratio may arm a threshold.
# scripts/check_bench_protocol.sh refuses an incomplete declaration rather
# than letting an unstated knob become a silent degree of freedom.

[protocol]
# The differential. Two forced token counts; the ratio is computed from the
# SLOPE between them, which is what cancels fixed startup cost.
n_low  = 128
n_high = 384

# Sampling. Greedy with a fixed seed on both sides, so a decode difference is
# a decode difference and not a sampling difference.
temperature = 0.0
top_p = 1.0
seed = 42

# One prompt, long enough that the argmax margin is not a coin flip.
prompt_id = "essay-1000w-history-of-computing"

# Quantization must MATCH. Comparing apr Q4_K_M against a comparator's Q5 or
# F16 is the commonest way to produce an unfair number in either direction.
quantization = "Q4_K_M"

# Batch and context, stated because a comparator defaulting differently is a
# free advantage nobody declared.
#
# `batch_size = "default"` means EXACTLY ONE THING: pass no `-b` at all and let
# the comparator use its own. In the pinned build 39173bcac that is
# `n_batch = 2048` (llama.cpp common/common.h:316). The literal string is
# load-bearing — scripts/check_comparator_flags.sh refuses any invocation that
# carries `-b` while this says "default", and refuses one that omits `-b` while
# this names a number. Declaration and invocation cannot drift apart.
#
# IT WAS `1`, WHICH IS WHY THIS COMMENT IS LONG (#2737). `-b 1` is not a tidy
# control; it switches llama.cpp's batching off. Measured on gx10 against the
# pinned comparator, medians of 2 runs at `-ngl 999`:
#
#     band          agg tok/s   decode tok/s
#     c=1   -b 1        185.4          186.5
#     c=1   default     184.9          186.0
#     c=16  -b 1        181.9          181.8
#     c=16  default     434.2          109.0
#
# THE c=1 ROW IS THE FALSIFIER. There `-b 1` changes nothing (0.3%), so this was
# never a general slowdown — it was specifically the batching path being turned
# off. Under `-b 1`, `agg == decode`. Under the default, `agg ~= 4 x decode`,
# and that 4 is the server's own `n_parallel` showing up in the arithmetic
# (see comparator_parallel below).
#
# Effect on the number this epic exists to compute: the c=16 aggregate ratio
# moved 2.03x -> 4.85x, a 2.39x overstatement in apr's favour, manufactured by
# handicapping the baseline rather than by apr getting faster.
#
# WHY "AS A USER RUNS IT" IS THE RIGHT DENOMINATOR. Arm B1's floor is policy and
# §4.6.1 states that policy in words: *below 0.80x a user is better served by
# llama.cpp.* That question only means something against the llama.cpp a user
# actually gets. Imposing apr's own documented non-batching defect (PERF-000) on
# the comparator answers a different question — "is apr better than a llama.cpp
# we broke the same way as apr" — and answers it flatteringly.
batch_size = "default"
context_length = 4096

# The comparator's server slot count (`-np` / `--parallel`), declared for the
# same reason as batch_size and resolved the same way: "default" means pass no
# flag (#2737).
#
# THE PREMISE THAT THIS IS HOST-DERIVED IS WRONG, and the correction matters.
# Read from the pinned source rather than inferred from two hosts agreeing:
#
#   common/arg.cpp:991          `params.n_parallel = -1;  // auto by default`
#                               reached only under `ex == LLAMA_EXAMPLE_SERVER`
#   tools/server/server.cpp:86  `if (params.n_parallel < 0) { ... n_parallel = 4;
#                                params.kv_unified = true; }`
#
# So the auto value is the CONSTANT 4, baked into the pinned build. It does not
# consult core count, VRAM, or anything else about the host. Both servers picked
# 4 on gx10 because 4 is what 39173bcac picks everywhere, not because gx10 has
# some property. That also explains the `agg ~= 4 x decode` in the table above.
#
# It is therefore pin-determined and reproducible — but only by someone who
# reads llama.cpp's source, and §4.4's test is that a skeptical outsider can
# reproduce both invocations FROM THIS FILE. Two further reasons to write it
# down rather than leave it implied:
#
#   · it is entangled. The same branch flips `kv_unified = true`. A reader who
#     knows only "slots = 4" does not know the KV cache layout changed with it.
#   · it moves on a pin bump, silently. A future llama.cpp that auto-picks 8
#     would change every band above c=4 with no diff in this repo, which is the
#     exact cross-time drift build_commit exists to prevent.
#
# KEPT AT "default" ON PURPOSE. Pinning a number here would be the -b 1 mistake
# again in a second costume: at c=8 and c=16 the comparator runs 4 slots against
# 8 and 16 closed-loop clients, and that is a real constraint a real user hits.
# §4.6.1 asks whether the user is better served by llama.cpp, so the comparator
# must be the one the user gets. The resolved value is not left to inference —
# the server prints `n_parallel is set to auto, using n_parallel = 4` about
# itself, which is the §4.4.9 requested-vs-resolved pattern, and
# parity_host_receipt.sh REPORTs that line per lane.
comparator_parallel = "default"

# GPU layers offloaded. "all" on both sides or the comparison is CPU-vs-GPU
# wearing a GPU label.
gpu_layers = "all"

# Flash attention: on or off, but the SAME on both sides.
flash_attention = false

# Threads for any CPU-side work.
threads = 8

# Trials. apr's distribution is wider, so it takes the larger median.
apr_trials = 7
comparator_trials = 5

# THE TWO INVOCATIONS, VERBATIM. `{...}` are substituted from the keys above
# and from the resolved binaries; nothing else varies between runs.
apr_command = "apr run --gpu --benchmark --max-tokens {n} --temperature {temperature} --top-p {top_p} --seed {seed} {model}"
#
# NOTE ON THIS LANE'S STANDING. Per §4.4.8 and I-15, `llama-bench` is NEVER the
# comparator harness for Arm B — the comparator is `llama-server` driven by the
# same client as apr, declared in [protocol.http] below. This line is the CLI
# differential, a separate question. `-b` is dropped here too, for the same
# reason and so the two lanes cannot disagree about what "the comparator" means.
comparator_command = "{llama_bench} -m {model} -p 0 -n {n} -ngl 999 -t {threads} -r {comparator_trials}"

# ---------------------------------------------------------------------------
# [protocol.http] — the SECOND lane, added when `apr test llm bench` shipped
# (GH-876 Milestone 2). It is not a replacement for the CLI differential above;
# the two answer different questions and both are declared.
#
# WHY A SECOND LANE. The CLI differential runs two DIFFERENT programs
# (`apr run --benchmark` and `llama-bench`), each with its own timer, its own
# idea of what counts as a token, and its own startup cost — which is exactly
# why it needs the 128/384 slope to cancel that cost. It measures a runtime.
#
# The HTTP lane runs ONE client against two OpenAI-compatible servers. The same
# prompts, the same request bodies, the same clock, the same tokenizer-agnostic
# accounting on both sides. It cannot be unfair by construction in the way two
# hand-written scripts can, and it measures what a user actually gets.
#
# It also reports the right quantity directly. `decode_tok_per_sec` is
# 1000 / itl_p50_ms, an inter-token rate that excludes time-to-first-token, so
# a model load cannot inflate or deflate it. Deriving that number by hand from
# an end-to-end latency is how 2026-08-24 produced both an 11.8 tok/s figure
# quoted against a decode reference and a 244 tok/s "differential".
[protocol.http]
http_profile = "medium"
http_warmup_secs = 15
http_duration_secs = 30
http_runs = 3
http_cooldown_secs = 10
# BANDS, not a point. This was `http_concurrency = 1`, and that one line is why
# every parity number this project has published measures the WORST band and
# calls it the answer.
#
# Measured 2026-08-25, lambda RTX 4090, comparator pinned 39173bcac:
#
#   band   llama agg   apr agg    agg ratio    llama dec   apr dec   dec ratio
#   c=1        168.9      90.2       0.534x        171.5     100.7      0.587x
#   c=4        484.7     111.9       0.231x        123.3     113.8      0.923x
#   c=8        650.5     109.6       0.169x         83.0     112.2      1.352x
#   c=16      1120.8     108.4       0.097x         71.2     110.6      1.554x
#
# The two metrics tell OPPOSITE stories and only one of them is about adoption.
# apr's aggregate is FLAT at ~110 tok/s at every concurrency: it does not batch,
# it serialises. Per-user decode looks excellent at c=16 (1.554x) purely because
# each request gets the whole GPU in turn while llama.cpp shares it sixteen
# ways. A gate that reports only per-user decode would call 0.097x aggregate a
# PASS — which is the shape of every cannot-fail gate this epic exists to kill.
#
# So both are gated, on every band.
http_concurrency_bands = [1, 4, 8, 16]

# The band in which a runtime is allowed to sit, both metrics, every band.
# Lower bound: below this a user is better served by llama.cpp, which is the
# adoption question. Upper bound: a ratio above this is more likely a
# measurement error than a win, and must be explained before it is believed.
band_floor = 0.80
band_ceiling = 1.50
http_stream = true

# THE THREE INVOCATIONS, VERBATIM. {model} and {port} are substituted; the
# resolved comparator binary comes from scripts/llama_bin.sh, never from PATH.
#
# THESE ARE SUBSTITUTED, NOT RETYPED. Every knob below reads `{key}` from the
# declaration above. They used to carry the literals `4096`, `8` and `-b 1`
# alongside keys named context_length, threads and batch_size that nothing
# read — three more chances for the file to contradict itself (#2737).
apr_serve_command = "apr serve run {model} --gpu --port {port} --context-length {context_length}"
comparator_serve_command = "{llama_server} -m {model} --port {port} -ngl 999 -c {context_length} -t {threads} --no-warmup"
harness_command = "apr test llm bench --url http://127.0.0.1:{port} --model {model_name} --profile {http_profile} --warmup {http_warmup_secs} --duration {http_duration_secs} --runs {http_runs} --cooldown {http_cooldown_secs} --concurrency {http_concurrency} --stream --runtime-name {runtime_name}"

# ---------------------------------------------------------------------------
# THE §4.4-CONFORMANT LANE (APR-PERF-GATE-001 v2.2). Still keys of
# [protocol.http] — one lane, two modes — rather than a new table, so
# `llama_pin_get_raw` and every existing reader find them without change.
#
# `harness_command` above is the LEGACY mode. It writes no §4.4.6 tokenization
# block, no drain accounting and no `receipt.rN.json`, so `scripts/perf_gate.sh`
# cannot judge its output. The conformant producer is `apr test llm bench
# --band`, and at the time this section was written it had **no caller anywhere
# in the repository**: `git grep -- 'test llm bench --band' scripts/ Makefile
# .github/workflows/` returned nothing, and `git grep -- '--tokenization'` over
# the same three returned one unrelated hit in a doc-stub generator. A
# conformant protocol with a conformant receipt producer and no invocation
# measures nothing — the same shape PERF-025 closed one level up.
#
# THE METHOD IS DECLARED HERE, NOT LEFT TO THE OPERATOR'S MEMORY. §4.4.6:
# "The canonical method is `client_tokenizer` with the model's own tokenizer,
# applied identically to apr and to the comparator. Server-reported `usage`
# fields are two different implementations' opinions." Measured on this fleet,
# on one W1 corpus and one model file, the two servers' `usage` blocks reported
# 513 and 534 prompt tokens for the same 505-token wire text — a 4.09% gap in
# prefill work whose SIGN flips across prompt shapes, so it is not correctable
# by an offset. And under `http_stream = true`, which §4.5 requires, NEITHER
# server emits a `usage` block at all: `server_usage` yields `prompt_tokens = 0`
# on every request and §4.3.1's band assertion refuses the run as an
# instrumentation gap. `client_tokenizer` is not merely canonical here, it is
# the only method that can produce a judgeable W1 band.
band_tokenization_method = "client_tokenizer"

# THE TOKENIZER IS PINNED BY DIGEST, NOT BY PATH. Two of the four fleet hosts
# carry only a newer `tokenizers` re-save of the same vocabulary, and no single
# absolute path is correct on all four — the path this fleet was told to use,
# `~/models/qwen2.5-coder.canonical.tokenizer.json`, does not exist on `lambda`,
# where the same bytes live as `qwen2.5-coder-1.5b-instruct-q4k.tokenizer.json`.
# So `{tokenizer}` is supplied per host and its digest is COMPUTED from the file
# the run opens (`ClientTokenizer::from_file`); this value is what
# `--tokenizer-sha256` ASSERTS against. A mismatch refuses the run.
#
# `band_tokenizer_sha256` is `tokenizer.json` as HuggingFace serves it for
# Qwen2.5-Coder, 7,031,645 bytes, verified on lambda 2026-08-31.
# `band_tokenizer_sha256_resave` is the newer serialization: same 151,665
# entries, same ids, differing only in how `model.merges` is written.
band_tokenizer_sha256 = "c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539"
band_tokenizer_sha256_resave = "3fd169731d2cbde95e10bf356d66d5997fd885dd8dbb6fb4684da3f23b2585d8"

# THE FOURTH INVOCATION, VERBATIM. `{tokenizer}` is the host's copy of the file
# whose digest is declared above; every other `{key}` is substituted from this
# file. `--tokenization` is REQUIRED by the CLI under `--band` (it has no
# default there, per §4.4.6/I-13), so an invocation that drops it is refused by
# clap rather than silently downgraded to `server_usage`.
#
# ENFORCED, not merely written down: `scripts/check_band_client_tokenizer.sh`
# fails if this command loses either flag, and fails if any OTHER `--band`
# invocation that appears in `scripts/`, `Makefile` or `.github/workflows/` is
# missing them. It is the reason this declaration cannot rot into decoration.
band_harness_command = "apr test llm bench --band --url http://127.0.0.1:{port} --model {model_name} --receipt {receipt_dir} --bands {http_concurrency_bands} --workload {workload} --host {host} --accelerator {accelerator} --quantization {quantization} --compute-class {compute_class} --tokenization {band_tokenization_method} --tokenizer {tokenizer} --tokenizer-sha256 {band_tokenizer_sha256} --stream"
