# perf-receipt-fields.yaml — THE THREE-WAY SCHEMA MAP (PERF-004).
#
# WHY THIS FILE EXISTS
# --------------------
# scripts/perf_gate.sh reads a receipt schema that NOTHING IN THIS TREE WRITES.
# Four real artifacts were tried against it and all four returned rc=1:
#
#   evidence/parity-http/bands/apr-c1.json   a real `apr test llm bench --output`
#   a valid bench receipt                    scripts/lib/bench_receipt.py's own shape
#   a valid parity block                     scripts/lib/parity_block.py's own output
#   evidence/parity-http/findings.json       the one real receipt in evidence/
#
# Only the gate's own synthetic selftest fixture passed. A gate whose only
# passing input is a string literal inside itself measures the string literal.
#
# The instinct is to teach the gate to fill in what is missing. That is
# forbidden here: `requested`, `completed`, `timeouts`, `drain_ms` and
# `tokenization.method` would then be FIVE NUMBERS NOTHING MEASURES, wearing the
# shape of measurements. This file exists so the difference between "nobody
# wired it up" and "nobody instrumented it" is written down per field, in a form
# a guard can check, instead of being rediscovered each time someone tries to
# run the gate.
#
# THE FOUR PRODUCERS
# ------------------
#   P1  `apr test llm bench --output`  -> crates/apr-cli/src/commands/test_llm.rs
#       emits BenchmarkReport verbatim: {runs:[LoadTestResult], aggregate, regressions}
#       (crates/aprender-test-lib/src/llm/benchmark.rs). No provenance, no
#       tokenization, no scheduler block. This is the ONLY thing that measures.
#   P2  scripts/lib/parity_block.py    -> {parity:{lanes:[{bands:[...]}]}}
#       the designed consumer of P1. Ratios DERIVED from P1's samples.
#   P3  scripts/lib/perf_receipt.py    -> the receipt scripts/perf_gate.sh reads.
#       Converts P1 or P2. Derives what is derivable and REFUSES to write the
#       rest, copying the UNMEASURED entries below into the receipt so the gate
#       can name the gap and its owner instead of saying "ArmC schema".
#   P4  scripts/lib/receipt_sig.py     -> the `signature` block (PERF-007).
#       Called by scripts/perf_receipt_sign.sh ON THE MEASURING HOST, with a
#       key scoped to that host. It is deliberately NOT reachable from P3: a
#       renderer that runs anywhere and can sign its own output forges exactly
#       the evidence the release arm exists to check. P4 signs; it never
#       measures and never invents -- it refuses a receipt whose `commit` or
#       `provenance.host` is absent rather than filling either in.
#
# CLASSES
# -------
#   PRODUCED    a producer writes this exact field today.  needs: producer
#   DERIVED     computable from a field a producer writes. needs: producer + formula
#   POLICY      read from a committed decision file.       needs: policy
#   UNMEASURED  nothing measures it. It would have to be   needs: owner + spec + needs
#               invented. This bucket IS the finding.
#
# A field perf_gate.sh reads that is absent from this file is the defect that
# produced this ticket, one more time.
# scripts/check_perf_receipt_fields_have_producers.sh extracts the read set
# mechanically and fails on the difference in either direction.
schema_version: 1

# Receivers in the two reader scripts that are NOT the receipt, and why. The
# extractor includes a receiver by DEFAULT; forgetting to list a new non-receipt
# receiver here is a loud false alarm, never a silent miss.
non_receipt_receivers:
  perf_gate.sh:
    m: scripts/perf-matrix.yaml, the expected cell set
    bl: a baseline cell inside that matrix
    environ: process environment (PERF_GATE_TODAY, the injectable clock)
    fielddoc: this file, read by Arm C to name an absent field's owner
    e: one entry of this file
    # PERF-056 (#2777): §4.3.2 dates W2's expiry from an EVENT, so `bl` may
    # carry `expires_after: {anchor, days}` resolved against the matrix's
    # `expiry_anchors:` block. Both receivers are matrix content, never receipt
    # content -- classified here rather than left unknown, because an
    # unrecognised receiver silently removes its fields from this guard's
    # universe.
    cond: the `expires_after` mapping of a baseline cell in perf-matrix.yaml
    a: one entry of perf-matrix.yaml's `expiry_anchors:` block
    # PP-6/PP-33: the gate now reads its PHASES and its THRESHOLDS from
    # perf-matrix.yaml instead of hardcoding them, so five more matrix receivers
    # cross this extractor. They are named with an `mx_` prefix precisely so a
    # reader cannot mistake `mx_protocol` (the matrix's pinned sampler) for
    # `r["protocol"]` (what the run actually used) -- the two are compared
    # against each other, and giving them the same name is how that comparison
    # would quietly become a tautology.
    mx_arm: one arm of perf-matrix.yaml's `arms:` block (phase, delta, metrics, n_min)
    mx_host: one host of perf-matrix.yaml's `hosts:` block (compute_class, reachable_by, NA status)
    mx_protocol: perf-matrix.yaml's `protocol:` block, the PINNED protocol
    mx_stream: perf-matrix.yaml's `stream:` block
    mx_witness: perf-matrix.yaml's `witness:` block
    gated: arms.L3.gated, the per-band-class set of gated ratios
    side: one side of a PARITY lane, a different document (the PP-8 case rows)
  bench_receipt.py:
    environ: process environment (PERF_GATE_MATRIX, the injectable matrix path)
    band: the PARITY-lane band schema, a different document
    block: a parity block
    comp: a parity lane's comparator side
    lane: a parity lane
    side: one side of a parity lane
    bench: the bench sub-block of a host receipt, already covered by the top level

# Mode-dispatch keys: `_bench_of` and `_parity_of` probe these to decide WHICH
# document they were handed. They are not receipt content and carry no verdict.
dispatch_keys: [bench, parity]

fields:

  # ---------------------------------------------------------------- Arm A ---
  # Arm A is comparator-free and PRIMARY. Everything it needs is derivable from
  # P1 today: the derivation over evidence/parity-http/bands/ reproduces the
  # spec's own carried figures (c=4 0.310, c=8 0.152, c=16 0.075) to 3 decimals.
  # Arm A was never blocked on measurement. It was blocked on this file.
  bands:
    class: DERIVED
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/benchmark.rs, symbol: "pub runs: Vec<LoadTestResult>"}
    formula: one entry per concurrency artifact handed to perf_receipt.py

  bands[].concurrency:
    class: DERIVED
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "pub concurrency: usize"}
    formula: runs[0].concurrency, asserted equal across every run of one band

  bands[].aggregate_tok_per_sec:
    class: DERIVED
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "let tokens_per_sec"}
    formula: median(runs[].tokens_per_sec)
    caveat: >-
      P1 computes it as (tokens over SUCCESSFUL requests) / elapsed_secs, where
      elapsed_secs spans until every worker joined -- so the denominator already
      covers the drain overshoot §4.4.7 asks for. It does NOT apply §4.4.3's
      "non-truncated" exclusion. On the 2026-08-25 corpus truncated_pct is 100.0
      on BOTH sides (max_tokens=128 on every request), so applying that exclusion
      literally makes the numerator zero. Resolve what the exclusion means under
      a fixed-output workload before committing an Arm A ratchet from it.

  bands[].tokens_total:
    class: DERIVED
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "completion_tokens_total: total_tokens"}
    formula: sum(runs[].completion_tokens_total)

  # ---------------------------------------------------------------- Arm B ---
  # Both ratios are derivable from P1 on both sides, and P2 already computes
  # exactly them under different names. The whole of Arm B's gap is a rename
  # plus a re-nesting:
  #   P2  parity.lanes[].bands[].ratio_aggregate_tok_per_sec
  #   P3  bands[].agg_ratio
  bands[].agg_ratio:
    class: DERIVED
    required: always
    producer: {file: scripts/lib/parity_block.py, symbol: 'band["ratio_" + metric]'}
    formula: median(subject runs[].tokens_per_sec) / median(comparator runs[].tokens_per_sec)

  bands[].decode_ratio:
    class: DERIVED
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "let decode_tok_per_sec"}
    formula: median(subject runs[].decode_tok_per_sec) / median(comparator runs[].decode_tok_per_sec)

  bands[].comparator_status:
    class: POLICY
    required: conditional
    policy: scripts/perf-matrix.yaml
    formula: cell_exceptions entry matching (host, band, arm B); absent means the cell is gated

  # THE OTHER SIDE OF THE RATIO. Arm C asserted completed == requested on the
  # SUBJECT and never looked at the comparator, whose tok/s counts tokens from
  # successful requests only over the same wall clock -- so every request the
  # comparator loses lowers the denominator and flatters us. On the 2026-08-25
  # corpus it lost 3/80, 3/223, 6/302 and 10/522. Reported, never failed: the
  # comparator's loss rate has no committed threshold and inventing one here
  # would be the defect this gate exists to stop.
  bands[].comparator_requested:
    class: DERIVED
    required: conditional
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "total_requests: total"}
    formula: sum(comparator runs[].total_requests) for this band

  bands[].comparator_completed:
    class: DERIVED
    required: conditional
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "let successful"}
    formula: sum(comparator runs[].successful) for this band

  # ---------------------------------------------------------------- Arm C ---
  requested:
    class: DERIVED
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "total_requests: total"}
    formula: sum(runs[].total_requests) over the subject's bands
    caveat: >-
      Exact under the closed-loop client: run_phase_max stops ISSUING at T, so
      every counted request started inside the window. It stops being exact the
      moment an open-loop rate mode is used for a gated band.

  completed:
    class: DERIVED
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "let successful"}
    formula: sum(runs[].successful) over the subject's bands

  timeouts:
    class: UNMEASURED
    required: always
    owner: PERF-004
    spec: "§4.4.3"
    needs: >-
      The 120 s per-request bound §4.4.3 names ALREADY EXISTS -- client.rs sets
      a 120-second reqwest timeout. What is missing is the discriminant:
      loadtest.rs collapses every failure to `Err(_) => failed_record()`, so a
      timed-out request, a refused connection and a malformed response all land
      in the same `failed` counter. `failed` is a SUPERSET of `timeouts`, and
      substituting it would report a broken server as a slow one. Classify the
      error at both call sites (reqwest exposes is_timeout()) and carry the
      count through to LoadTestResult.

  drain_ms:
    class: UNMEASURED
    required: always
    owner: PERF-004
    spec: "§4.4.7"
    needs: >-
      The drain rule is not implemented in any client. run_phase_max -- the path
      the benchmark subcommand actually takes -- has no drain phase at all:
      workers loop `while Instant::now() < deadline` and the last request of each
      worker simply overruns T. run_phase_rate (open-loop, unused by the gate)
      polls a semaphore against a hardcoded 30 s deadline and records nothing.
      Neither measures the overshoot, so §4.4.7's `drain_ms > 0.5 x window =>
      SUSPECT` rule cannot be evaluated on any artifact this repo can produce.
      Implement the drain phase in the closed-loop client and record its length.

  tokenization:
    class: UNMEASURED
    required: always
    owner: PERF-004
    spec: "§4.4.6"
    needs: the block below; no producer emits a tokenization block of any shape

  tokenization.method:
    class: UNMEASURED
    required: always
    owner: PERF-004
    spec: "§4.4.6"
    needs: >-
      The harness counts tokens from the server's own `usage.completion_tokens`
      (loadtest.rs, send_one_request), which is §4.4.6's `server_usage` -- the
      method the spec says is NOT canonical, because two servers' usage fields
      are two implementations' opinions. Writing "server_usage" here would be
      accurate about today and would silently arm a ratio §4.4.6 refuses. The
      canonical `client_tokenizer` path does not exist, and the three sibling
      fields the block requires (tokenizer_sha256, counts_special_tokens,
      counts_prompt_echo) have no producer and nothing that could infer them.
      SGLang RFC #9808 is the cited prior art for getting this wrong.

  # ------------------------------------------------------------ Arm C-sig ---
  # §4.9.1 / I-10, landed on main by PERF-007. The staleness arm is what makes
  # Arm C a gate: two hosts are not CI runners and the fully-comparated one is
  # do-not-revive, so the gate cannot run ON the host that measures. What
  # reaches it is a FILE, and an unsigned file binds to no host and no commit.
  #
  # perf_gate.sh scopes this arm to `--phase release`, so these three are
  # at-release rather than always. That skip is spec-mandated and is the arm's
  # ONLY legal one -- receipt_sig.py has no "unsigned is exempt" path.
  commit:
    class: UNMEASURED
    required: at-release
    owner: PERF-007
    spec: "§4.9.1"
    needs: >-
      The commit the MEASURED BINARY was built from. No producer writes it:
      perf_receipt.py has no --commit flag, and giving it one that defaults to
      its own checkout's HEAD would be the forbidden repair in its purest form.
      The renderer converts artifacts on whatever box runs it, so its HEAD
      attests to where the CONVERSION happened, not to where the measurement
      did -- exactly the claim provenance.binary_sha256 exists because nobody
      can make from the harness side. receipt_sig.py refuses rather than
      defaults for the same reason: `_sign_target` raises NO-COMMIT because "a
      signature over an invented one attests to nothing". Carry the commit out
      of the host that BUILT and RAN the binary, beside binary_sha256, and make
      it a required flag on perf_receipt.py the way --resolution now is.

  signature:
    class: PRODUCED
    required: at-release
    producer: {file: scripts/lib/receipt_sig.py, symbol: "signed[SIGNATURE_KEY] = {"}
    caveat: >-
      The producer is the SIGNING step on the measuring host
      (scripts/perf_receipt_sign.sh -> receipt_sig.py::sign), never the
      renderer. perf_receipt.py must NOT gain a --sign flag: it runs anywhere,
      so a signature it applied would attest only that the renderer ran, which
      is the one thing the gate already knows -- a renderer able to sign its
      own output can forge the evidence the arm exists to check. receipt_sig.py
      enforces the split at source, refusing a key_id whose host prefix does
      not match provenance.host (KEY-HOST-MISMATCH), and that refusal is what
      makes the signature evidence rather than decoration. Re-pointing this
      producer at perf_receipt.py, or softening the class, hands the forgery
      back.
      PRODUCED describes the tool, not the fleet: no receipt under evidence/
      carries a signature yet, because sign() refuses a receipt whose `commit`
      is absent and `commit` above has no producer. The forjar deployment that
      would run this on a host is explicitly NOT implemented -- see
      perf_receipt_sign.sh, "WHAT THE FORJAR DEPLOYMENT WOULD BE".

  signature.key_id:
    class: PRODUCED
    required: at-release
    producer: {file: scripts/lib/receipt_sig.py, symbol: '"key_id": key_id,'}
    caveat: >-
      `<host>-<serial>`. The host half is load-bearing and checked on both
      ends: key_id_host() is what lets sign() refuse another host's evidence
      and the verifier reject a receipt signed by the wrong host's key.
      Rotation is a new serial, never an edit in place -- load_keyring refuses
      a duplicate key_id so a rotated key cannot keep validating silently.

  # ---------------------------------------------------------------- Arm D ---
  # §4.4.9's scheduler block. REPORTING today, blocking with PERF-001 -- and the
  # arm exists so a batching implementation's own failure modes are visible in
  # the PR that lands it, which requires these fields to exist BEFORE it lands.
  kv:
    class: UNMEASURED
    required: at-release
    owner: PERF-018
    spec: "§4.4.9"
    needs: the four counters below, read from the server rather than computed by the harness

  kv.bytes_used:
    class: UNMEASURED
    required: at-release
    owner: PERF-018
    spec: "§4.4.9"
    needs: KV bytes actually populated, reported by the server through /health and the receipt

  kv.bytes_reserved:
    class: UNMEASURED
    required: at-release
    owner: PERF-018
    spec: "§4.4.9"
    needs: KV bytes reserved at admission; under contiguous allocation this is the max_seq_len reservation

  kv.admission_rejected:
    class: UNMEASURED
    required: at-release
    owner: PERF-018
    spec: "§4.4.9"
    needs: count of requests refused for capacity, taken from the admission path

  kv.preempted_swap:
    class: UNMEASURED
    required: at-release
    owner: PERF-018
    spec: "§4.4.9"
    needs: >-
      sequences whose KV moved to host DRAM. There is no preemption today, so
      the honest value is zero -- but writing zero from the HARNESS rather than
      from the scheduler pins the field at zero across the PR that introduces
      preemption, which is the exact PR it exists to observe.

  # ---------------------------------------------------------------- Arm E ---
  itl:
    class: UNMEASURED
    required: at-release-w2
    owner: PERF-017
    spec: "§4.5 Arm E"
    needs: the two percentiles below, pooled per §4.4.3

  itl.p95_w1_ms:
    class: UNMEASURED
    required: at-release-w2
    owner: PERF-017
    spec: "§4.4.3"
    needs: >-
      §4.4.3 defines itl_ms as all inter-token gaps POOLED across requests, p50
      and p95. LoadTestResult carries itl_p50_ms only -- there is no itl p95 at
      all -- and even that p50 is a median of per-request means, not a pooled
      percentile. tpot_p95_ms exists and is a different quantity (per-request
      mean time per output token). Pool the gaps and emit the p95.

  itl.p95_w2_ms:
    class: UNMEASURED
    required: at-release-w2
    owner: PERF-017
    spec: "§4.4.3"
    needs: >-
      the same pooled percentile measured on the W2 workload. The prompts exist
      (crates/aprender-serve/benchmarks/qwen-coder/prompts-w2.jsonl); the pooled
      p95 does not.

  injector:
    class: UNMEASURED
    required: at-release-w2
    owner: PERF-017
    spec: "§4.5 Arm E"
    needs: a long-prefill injector; W2 today is a prompt file, not an injector with a schedule

  injector.stall_p95_ms:
    class: UNMEASURED
    required: at-release-w2
    owner: PERF-017
    spec: "§4.5 Arm E"
    needs: p95 decode stall observed while a long prefill runs; requires the injector to exist first

  injector.arrival_index:
    class: UNMEASURED
    required: at-release-w2
    owner: PERF-017
    spec: "§4.5 Arm E"
    needs: which sampled request the long prefill was injected at; requires the injector to exist first

  # ---------------------- delegated to scripts/lib/bench_receipt.py ---------
  # Arm C calls bench_receipt.py, so these are required transitively. They are
  # the reason a raw benchmark artifact can never pass on its own: a
  # BenchmarkReport carries no provenance object of any kind.
  provenance:
    class: PRODUCED
    required: always
    producer: {file: scripts/lib/parity_block.py, symbol: '"binary_path": binary'}

  provenance.binary_path:
    class: PRODUCED
    required: always
    producer: {file: scripts/lib/parity_block.py, symbol: '"binary_path": binary'}

  provenance.binary_sha256:
    class: PRODUCED
    required: always
    producer: {file: scripts/lib/parity_block.py, symbol: '"binary_sha256": sha'}
    caveat: >-
      Supplied by the CALLER (scripts/apr_bin.sh, scripts/llama_bin.sh), never by
      the harness. The 2026-08-25 band corpus in evidence/parity-http/bands/
      records no binary digest at all, so that corpus cannot produce a
      conformant receipt however good its numbers are. perf_receipt.py refuses
      to invent one; --derive-only prints the table and writes nothing.

  provenance.resolution:
    class: PRODUCED
    required: always
    producer: {file: scripts/lib/parity_block.py, symbol: '"resolution":'}

  provenance.compute_class:
    class: PRODUCED
    required: always
    producer: {file: scripts/lib/parity_block.py, symbol: '"compute_class": klass'}

  provenance.feature_set:
    class: PRODUCED
    required: conditional
    producer: {file: scripts/lib/parity_block.py, symbol: 'prov["feature_set"] = feature_set'}

  provenance.host:
    class: DERIVED
    required: conditional
    producer: {file: scripts/perf-matrix.yaml, symbol: "hosts:"}
    formula: "the --host argument, which must name a key under hosts: in the matrix"

  provenance.accelerator:
    class: DERIVED
    required: conditional
    producer: {file: scripts/perf-matrix.yaml, symbol: "accelerator:"}
    formula: hosts[host].accelerator

  provenance.model:
    class: DERIVED
    required: conditional
    producer: {file: scripts/lib/parity_block.py, symbol: "os.path.basename(args.model)"}
    formula: basename of the model path handed to the harness

  provenance.quantization:
    class: UNMEASURED
    required: conditional
    owner: PERF-004
    spec: "§4.4 join key"
    needs: >-
      Nothing reads the quantization out of the model file. It is part of the
      join key precisely so a Q4_K_M row cannot be compared with an F16 one, and
      today it can only be typed in by hand. `apr inspect` already reports it;
      read it from the artifact instead of accepting it as an argument.

  samples_ms:
    class: DERIVED
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "pub latency_ms: f64"}
    formula: concat(runs[].request_details[].latency_ms) across the subject's bands
    caveat: >-
      request_details is skipped when empty, so a run that produced none yields
      an empty samples_ms, which bench_receipt.py rejects as a vacuous pass --
      the correct outcome, and worth knowing before a release night rather than
      during one. It is present on the 2026-08-25 corpus.

  n:
    class: DERIVED
    required: conditional
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "pub latency_ms: f64"}
    formula: len(samples_ms); perf_receipt.py omits it rather than restating a length

  runs_discarded:
    class: UNMEASURED
    required: conditional
    owner: PERF-004
    spec: "§4.4.5"
    needs: >-
      The harness discards nothing today, so omitting the field is honest. It
      becomes required the moment any run is dropped, and its companion
      discard_reason is blocked on the same failure classification `timeouts`
      needs.

  discard_reason:
    class: UNMEASURED
    required: conditional
    owner: PERF-004
    spec: "§4.4.5"
    needs: one of early_eos/negative_delta/nonzero_exit/timeout, which needs the failure classification `timeouts` also needs

  comparability:
    class: POLICY
    required: conditional
    policy: scripts/lib/bench_receipt.py
    formula: >-
      cross-class-existence-only when the subject and comparator compute_class
      differ. perf_receipt.py REFUSES to build a receipt from such a lane rather
      than marking it: a cross-class row cannot arm Arm B's floor, and a receipt
      carrying the mark still walks into Arm A, which reads no comparator at all
      and would gate it happily.
  schema_version:
    class: UNMEASURED
    source: derived
    required: always
    owner: PERF-004
    spec: "§4 (the v3 wire)"
    needs: >-
      The wire generation the producer wrote. Absent means 2 (historical), and
      the L1 arm applies the v3 rules only at 3 or above -- so a receipt is
      never failed for not having been written in the future. Nothing emits it
      yet: scripts/lib/perf_receipt.py stamps 2 deliberately, because its
      inputs are historical band artifacts.

  run_id:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4 (PP-3)"
    needs: >-
      A uuid4 shared by BOTH lanes of one invocation. It is what makes a ratio
      paired: a baseline band whose run_id differs was measured in another
      invocation, and the quotient of two afternoons is not a ratio. No
      producer emits it.

  ratios:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-17)"
    needs: >-
      Read only so that a TOP-LEVEL `ratios` object can be refused. A ratio
      must sit inside the band it describes; a bandless one names no
      concurrency, which is how a c=1 figure comes to be quoted as the
      headline for a sixteen-user deployment. It must never be produced.

  short_of_n_predict:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4 (PP-28)"
    needs: >-
      Count of COMPLETED requests whose generated_tokens !=
      protocol.n_predict. `truncated` counts drain-abandoned requests only
      (drain.rs), so nothing in the current receipt witnesses a completion
      that stopped early -- and the gx10 c=1 corpus has 7 of 30 short, lambda
      c=1 has 28 of 55. Count it in the client and carry it per band and at
      the top level.

  protocol:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§5.1 (PP-22)"
    needs: >-
      The protocol block the run actually used, so it can be compared against
      the pinned one in scripts/perf-matrix.yaml. Absent, the window and the
      sampler are assumptions.

  protocol.sampler:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§5.1 (PP-28)"
    needs: >-
      the whole sampler block, compared against perf-matrix.yaml
      protocol.sampler. crates/aprender-test-lib/src/llm/client.rs rebuilds
      ChatRequest with `seed: None, ignore_eos: None` on the stream path, so
      the values are dropped before they reach the wire and no receipt can
      state them.

  protocol.sampler.temperature:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§5.1 (PP-28)"
    needs: >-
      temperature the run used, compared against perf-matrix.yaml
      protocol.sampler. crates/aprender-test-lib/src/llm/client.rs rebuilds
      ChatRequest with `seed: None, ignore_eos: None` on the stream path, so
      the values are dropped before they reach the wire and no receipt can
      state them.

  protocol.sampler.seed:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§5.1 (PP-28)"
    needs: >-
      seed the run used, compared against perf-matrix.yaml protocol.sampler.
      crates/aprender-test-lib/src/llm/client.rs rebuilds ChatRequest with
      `seed: None, ignore_eos: None` on the stream path, so the values are
      dropped before they reach the wire and no receipt can state them.

  protocol.sampler.ignore_eos:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§5.1 (PP-28)"
    needs: >-
      ignore_eos the run used, compared against perf-matrix.yaml
      protocol.sampler. crates/aprender-test-lib/src/llm/client.rs rebuilds
      ChatRequest with `seed: None, ignore_eos: None` on the stream path, so
      the values are dropped before they reach the wire and no receipt can
      state them.

  provenance.started_utc:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4 (PP-30)"
    needs: >-
      RFC3339 UTC instant the run began. Without it a comparator pin's expiry
      cannot be evaluated against the run, and two receipts cannot be ordered.

  provenance.clock_source:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4 (PP-30)"
    needs: >-
      Which clock produced started_utc. A timestamp with no clock named is a
      number, and CLOCK_REALTIME versus CLOCK_MONOTONIC is the difference
      between an orderable instant and an elapsed count.

  provenance.subject:
    class: UNMEASURED
    source: server
    required: always
    owner: PERF-007
    spec: "§4 (PP-18)"
    needs: >-
      The SERVED binary: {path, sha256, commit, feature_set}. `binary_*` at
      the top of provenance describe the CLIENT, which nothing said, so the
      one binary under test was the one field the receipt did not identify.

  provenance.subject.commit:
    class: UNMEASURED
    source: server
    required: at-release
    owner: PERF-007
    spec: "§4 (PP-18)"
    needs: >-
      The commit the SERVED binary was built from, which the staleness arm
      requires to be an ancestor of the commit under test. `receipt.commit` is
      a label the harness was handed; it does not constrain what answered.

  provenance.client:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-007
    spec: "§4 (PP-25)"
    needs: >-
      The load generator's own {path, sha256, commit}. PP-25 requires ONE
      client driving both lanes; with no client identity on either side, two
      clients is expressible and invisible.

  provenance.client.commit:
    class: UNMEASURED
    source: client
    required: at-release
    owner: PERF-007
    spec: "§4 (PP-18)"
    needs: >-
      The commit the CLIENT binary was built from; an ancestor test, same as
      the subject's. A load generator from another branch measures a different
      protocol.

  provenance.client.sha256:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-007
    spec: "§4 (PP-25)"
    needs: >-
      Digest of the client binary, compared against the baseline band's, so a
      pair driven by two different clients is refused rather than divided.

  provenance.server_config:
    class: UNMEASURED
    source: server
    required: always
    owner: PERF-018
    spec: "§5.2 (PP-2)"
    needs: >-
      The verbatim body of GET /v1/effective-config. Without it every server
      fact in the receipt is harness-declared: provenance.feature_set is
      copied from the `--server-feature` flag, so both 745fa8588 receipts say
      ['cuda'] whatever the server loaded. The route does not exist yet.

  provenance.server_config.compute_class:
    class: UNMEASURED
    source: server
    required: always
    owner: PERF-018
    spec: "§5.2 (PP-13)"
    needs: >-
      The dispatch path the SERVER says it took, compared against the
      harness's own claim. When they disagree the server wins; a flag is a
      request, not a measurement.

  provenance.server_config.offload:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-018
    spec: "§5.2 (PP-14)"
    needs: >-
      The offload decision block. Autofit that silently overrode an explicit
      operator argument measured a configuration nobody asked for, and nothing
      records that it happened.

  provenance.server_config.offload.autofit_applied:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-018
    spec: "§5.2 (PP-14)"
    needs: >-
      Whether the server re-decided the layer split for itself.

  provenance.server_config.offload.explicit_args:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-018
    spec: "§5.2 (PP-14)"
    needs: >-
      The offload arguments the operator actually passed. Autofit ANDed with a
      non-empty explicit set is the override the gate refuses.

  ladder:
    class: UNMEASURED
    source: derived
    required: always
    owner: PERF-018
    spec: "§4 (PP-24)"
    needs: >-
      {declared, derived, slots_admitted}. scripts/lib/perf_receipt.py emits
      the block with `declared` read from the matrix and the rest null, which
      is the honest shape until a server reports admission.

  ladder.declared:
    class: UNMEASURED
    source: derived
    required: always
    owner: PERF-018
    spec: "§4 (PP-24)"
    needs: >-
      The band set the run was ASKED to measure, copied from perf-matrix.yaml
      `ladder.declared` by the producer (crates/aprender-test-lib/src/perf_gate/receipt.rs
      `Ladder`). The gate recomputes `derived` from it and the server-reported
      admissions (PP-24), so a receipt cannot excuse a band by writing its own.
  ladder.derived:
    class: UNMEASURED
    source: derived
    required: always
    owner: PERF-018
    spec: "§4 (PP-24)"
    needs: >-
      `declared` filtered by min(non-null slots_admitted). Null until either
      lane reports its admitted slot count; a copy of `declared` wearing the
      derived name would assert an admission nobody measured.

  ladder.slots_admitted:
    class: UNMEASURED
    source: server
    required: always
    owner: PERF-018
    spec: "§5.2 (PP-24)"
    needs: >-
      Slots each SERVER admitted, from its own effective-config. lambda's log
      prints `max_batch=11` and gx10's prints 32, and neither number reaches a
      receipt -- so a c=16 pair across those two hosts compares admission, not
      servers.

  ladder.slots_admitted.apr:
    class: UNMEASURED
    source: server
    required: always
    owner: PERF-018
    spec: "§5.2 (PP-24)"
    needs: >-
      Slots each SERVER admitted, from its own effective-config. lambda's log
      prints `max_batch=11` and gx10's prints 32, and neither number reaches a
      receipt -- so a c=16 pair across those two hosts compares admission, not
      servers.

  ladder.slots_admitted.llama:
    class: UNMEASURED
    source: server
    required: always
    owner: PERF-018
    spec: "§5.2 (PP-24)"
    needs: >-
      Slots each SERVER admitted, from its own effective-config. lambda's log
      prints `max_batch=11` and gx10's prints 32, and neither number reaches a
      receipt -- so a c=16 pair across those two hosts compares admission, not
      servers.

  bands[].status:
    class: UNMEASURED
    source: derived
    required: always
    owner: PERF-004
    spec: "§7.4"
    needs: >-
      MEASURED | UNMEASURED | NA | INVALID-CORRECTNESS | NONCONFORMANT-VALID |
      COMPARATOR_STALE, derived by the producer and re-checked here. The
      current receipts carry one word for every band and cannot distinguish a
      band that measured nothing from one that measured garbage.

  bands[].replicate:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4.3"
    needs: >-
      Which replicate this band entry is. Arm A's lower bound needs n >= 5
      entries for one (metric, band), and with no replicate index a receipt
      cannot carry more than one.

  bands[].window_ms:
    class: DERIVED
    source: client
    required: always
    producer: {file: crates/aprender-test-lib/src/perf_gate/window.rs, symbol: "pub window_ms: f64"}
    formula: the measurement window this band was run over; PP-10 compares each sample's issued_ms against it

  bands[].drain_ms:
    class: DERIVED
    source: client
    required: always
    producer: {file: crates/aprender-test-lib/src/perf_gate/window.rs, symbol: "pub drain_ms: f64"}
    formula: milliseconds between window close and the last in-flight request settling

  bands[].decode_tok_per_sec:
    class: DERIVED
    source: client
    required: always
    producer: {file: crates/aprender-test-lib/src/llm/loadtest.rs, symbol: "let decode_tok_per_sec"}
    formula: median(subject runs[].decode_tok_per_sec) for this band

  bands[].prefill_tok_per_sec:
    class: DERIVED
    source: client
    required: always
    producer: {file: scripts/lib/perf_receipt.py, symbol: 'band["prefill_tok_per_sec"] = _median'}
    formula: median(runs[].prefill_tok_per_sec) for this band
    caveat: >-
      The converter's value is CLIENT-DERIVED and is a different quantity from
      the server-timed one the v3 wire wants: on the 2026-08-25 corpus it
      reads 29.5/12.5/5.8 tok/s at c=4/8/16 against the comparator's
      6619/4620/3905, because at c>1 the client's first-token wait is
      queueing. That is why `prefill_source` exists and why the L1 arm refuses
      anything but `server` on a v3 receipt.

  bands[].prefill_source:
    class: PRODUCED
    source: derived
    required: conditional
    producer: {file: scripts/lib/perf_receipt.py, symbol: 'band["prefill_source"] = "client-derived"'}
    caveat: >-
      `server` iff the figure came from the server's own timings block;
      `client-derived` for anything the load generator inferred. Present iff
      prefill_tok_per_sec is.

  bands[].scaling_efficiency:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-31)"
    needs: >-
      agg(c) / (c * agg(1)), REPORTED and never ratcheted -- it FALLS when
      agg(1) improves, so ratcheting it up-only punished the work it existed
      to protect. The gate derives it from the aggregates when a receipt does
      not carry it, so the line a reader has always seen survives.

  bands[].overhead_share:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4"
    needs: >-
      agg(1)/dec(1): how much of a single client's decode rate survives the
      request path. Meaningful only at c=1, reported, never gated.

  bands[].roofline_tok_per_sec:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-23)"
    needs: >-
      Weights-bytes over device bandwidth: the rate a single stream cannot
      exceed. Needs provenance.model_file.bytes and a committed per-device
      bandwidth figure; neither exists, so a decode number 10x too high still
      reads as a win.

  bands[].samples:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4.4.5 (PP-7)"
    needs: >-
      The raw per-request rows, in the receipt rather than only in the
      companion .jsonl.gz, so a later threshold can be re-derived and so PP-10
      can see a request admitted after the window closed. The current receipts
      carry summary statistics and a gzip nobody reads.

  bands[].samples[].issued_ms:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4.4.7 (PP-10)"
    needs: >-
      Offset from window open at which the request was ISSUED. A request
      issued at or after window_ms is drain, and counting its tokens in the
      window inflates the throughput of the window that never contained it.

  bands[].witness:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-26)"
    needs: >-
      The batch-invariance witness: does the batched decode reproduce the m=1
      token stream? gx10's log shows 32 decode steps with all-slot-identical
      token ids (#2753), and every band in both receipts reads timeouts 0,
      errors 0, suspect [] -- a batch producing garbage at full speed is
      indistinguishable from one producing text.

  bands[].witness.batch_invariance:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-26)"
    needs: >-
      PASS | FAIL | UNMEASURABLE for this band.

  bands[].witness.declared_min:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-26)"
    needs: >-
      How many tokens the witness required to agree, compared against
      perf-matrix.yaml witness.min_agree_tokens. A witness with no declared
      length agrees on nothing.

  bands[].witness.m_formed:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-26)"
    needs: >-
      The batch size actually formed while the witness ran. A witness taken
      while no batch formed observed the m=1 path twice.

  bands[].witness.intra_agree_to:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-26)"
    needs: >-
      PP-26 (a): the shortest agreement between any slot of the batch and
      slot 0, for identical prompts. Below witness.min_agree_tokens the batch
      is not invariant across its own slots. Absent on a witness taken before
      v3.1, which the gate reads as the old single-slot rule.

  bands[].witness.max_constant_run:
    class: UNMEASURED
    source: server
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-26)"
    needs: >-
      PP-26 (b): the longest run of one repeated token id in any slot.
      #2753 emitted one id for 116 steps; at or above
      witness.max_constant_run the slot is frozen and the band FAILS.

  bands[].stream_mode:
    class: UNMEASURED
    source: server
    required: always
    owner: PERF-004
    spec: "§4 (PP-27)"
    needs: >-
      `live` | `replayed` | null, declared by the server on the first SSE
      chunk. Both 745fa8588 runs were taken with --stream OFF, so ttft, itl
      and decode are undefined in every one of their 2,396 samples and the
      receipts say so only in prose.

  bands[].stream_witness:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4 (PP-27)"
    needs: >-
      The CLIENT's own dual witness. A replayed stream declares itself live,
      so a server-side flag cannot be the only evidence.

  bands[].stream_witness.verdict:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4 (PP-27)"
    needs: >-
      live | replayed | undeclared, decided by the client.

  bands[].stream_witness.client_ttft_over_e2e_median:
    class: UNMEASURED
    source: client
    required: always
    owner: PERF-004
    spec: "§4 (PP-27)"
    needs: >-
      Median of (time to first token) / (end to end) over the band's requests.
      At or above perf-matrix.yaml stream.live_ttft_over_e2e_max every token
      arrived at the end, which is a replayed stream however it was declared.

  bands[].join_key:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-22)"
    needs: >-
      The tuple two bands must agree on before their quotient is a ratio:
      host, workload, band, model, quant, tokenization, window, replicates,
      interleaved, n_ctx_slot, kv_type, fa, n_batch, n_predict. llama.cpp's
      own compare-llama-bench.py refuses to compare rows unless 25 properties
      agree; ours agreed on four.

  bands[].join_key.n_batch:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-15/PP-22)"
    needs: >-
      The comparator's numeric batch size. `-b 1` does not tune llama.cpp, it
      switches its batching OFF -- measured on gx10 the c=16 aggregate went
      434.2 to 181.9 tok/s -- so a value of 1 is a crippled comparator, not a
      pinned one, and the ratio taken against it is meaningless.

  bands[].baseline:
    class: UNMEASURED
    source: client
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-3)"
    needs: >-
      The COMPARATOR lane's band, carried inside the subject's band, from the
      same invocation. It is what makes a ratio paired instead of a quotient
      of two afternoons; no receipt in evidence/ has a comparator lane at all.

  bands[].baseline.join_key:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-22)"
    needs: >-
      The comparator band's own join key, compared field by field against the
      subject's.

  bands[].baseline.join_key.window_ms:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-22)"
    needs: >-
      The comparator's window. On the 2026-08-25 corpus the apr c=16 lane ran
      43 s against llama.cpp's 25 s under one band label, and nothing could
      see it.

  bands[].baseline.join_key.n_batch:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-15/PP-22)"
    needs: >-
      The comparator's numeric batch size, on the comparator's own side of the
      join.

  bands[].baseline.client:
    class: UNMEASURED
    source: client
    required: conditional
    owner: PERF-007
    spec: "§4 (PP-25)"
    needs: >-
      Which client drove the comparator lane.

  bands[].baseline.client.sha256:
    class: UNMEASURED
    source: client
    required: conditional
    owner: PERF-007
    spec: "§4 (PP-25)"
    needs: >-
      Digest of that client, compared against the subject's. Two clients is
      two experiments.

  bands[].ratios:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-3)"
    needs: >-
      {agg, dec, prefill}, each {point, lcb95, method, n}. The ONLY place a
      ratio is representable, and only beside a baseline from the same run_id.

  bands[].ratios.agg:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-3)"
    needs: >-
      The agg ratio's interval object.

  bands[].ratios.agg.point:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (P-5)"
    needs: >-
      the point estimate of the agg ratio.

  bands[].ratios.agg.lcb95:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (P-5)"
    needs: >-
      the one-sided 95% lower bound of the agg ratio.

  bands[].ratios.dec:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (PP-3)"
    needs: >-
      The dec ratio's interval object.

  bands[].ratios.dec.point:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (P-5)"
    needs: >-
      the point estimate of the dec ratio.

  bands[].ratios.dec.lcb95:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (P-5)"
    needs: >-
      the one-sided 95% lower bound of the dec ratio.

  bands[].ratios[].point:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (P-5)"
    needs: >-
      The point estimate, addressed through the metric name Arm L3's gated set
      names. Arm L3 reads it as `b["ratios"][metric]["point"]`, so the
      extractor renders the metric level as a list index.

  bands[].ratios[].lcb95:
    class: UNMEASURED
    source: derived
    required: conditional
    owner: PERF-004
    spec: "§4 (P-5)"
    needs: >-
      The one-sided 95% lower bound, addressed through the metric name Arm
      L3's gated set names. Arm L3 reads it as `b["ratios"][metric]["lcb95"]`,
      so the extractor renders the metric level as a list index.


# ===========================================================================
# THE v3 WIRE (PP-LLAMA-001 §4). The 63 entries added above are keys
# perf_gate.sh's L1 arm reads and that NO producer in this tree writes yet. That
# is the point of the UNMEASURED class: the difference between "nobody wired it
# up" and "nobody instrumented it" is written down per field, in a form a guard
# can check -- and a receipt that cannot state them says so by name instead of
# reading as clean.
#
# `source:` IS NEW, and it is the field this file existed without for too long.
# A receipt states facts about three different things and used to spell them
# identically:
#
#   server    the SERVER answered for itself (GET /v1/effective-config, the
#             scheduler, the batch witness). PP-13: a server fact may not be
#             inferred from a harness flag, and rule 6 of
#             scripts/check_perf_receipt_fields_have_producers.sh refuses a
#             server-reported field labelled anything else.
#   client    the load generator observed it (windows, latencies, its own sha)
#   derived   computed from the two, in this repository, by a stated formula
#
# The measured defect: `provenance.feature_set` is copied from the harness's own
# `--server-feature` flag, and both 745fa8588 receipts therefore claim
# `["cuda"]` whatever the server actually loaded. A rule keyed on it is theater.
# ===========================================================================

# Fields the SERVER must answer for. Rule 6 requires `source: server` on every
# one; a prefix entry covers the whole subtree. Listed rather than inferred from
# the name so that adding a server fact under a new name is a deliberate act.
server_reported_prefixes:
- provenance.server_config
- ladder.slots_admitted
- bands[].witness
server_reported_fields:
- bands[].stream_mode
- provenance.subject
- provenance.subject.commit
