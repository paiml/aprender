# models_t1_hosts.conf -- the host pair models_t1.sh measures on (PMAT-7497, #7497).
# Operator 2026-11-27 1336Z/1338Z: crux and whisper run only on gx10, kfocus and jetson. models_t1.sh enforces
# it for REMOTE_HOST (gx10, kfocus or jetson; never lambda). LOCAL_HOST is still lambda: it is the host the 0.76
# release runs this script on, and the script refuses to run anywhere that does not identify as LOCAL_HOST.
# LOCAL_HOST is the host this script runs on (its leg runs in-process); REMOTE_HOST is reached over SSH.
# Moving LOCAL_HOST off lambda is a data change here once the release owner runs the script on that host and
# the leg's build env exists there; it is release gate content, so it needs quorum + non-author sign-off.
LOCAL_HOST=lambda
REMOTE_HOST=gx10
