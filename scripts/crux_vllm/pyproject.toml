[project]
name = "crux-vllm-engine"
version = "0.1.0"
description = "The vLLM CRUX engine (#3952): probe/gen rows for the CRUX judge"
requires-python = ">=3.10,<3.13"
dependencies = [
    "vllm==0.30.0",
    # vLLM JIT-compiles kernels at engine init and shells out to `ninja`; without it init dies with
    # FileNotFoundError: 'ninja' (measured on lambda, 2026-09-23). Pinned here, and checked by name in
    # the driver's preflight, so a missing ninja is a named refusal and never a silent skip.
    "ninja==1.13.2",
]
