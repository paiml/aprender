[package]
name = "aprender-test-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for Probar: Rust-native testing framework for WASM games"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["testing", "wasm", "games", "cli", "automation"]
categories = ["development-tools::testing", "command-line-utilities", "wasm"]

[features]
default = ["browser"]
# Enable real browser control for live validation (requires chromium)
browser = ["jugar-probar/browser"]
# `apr test llm` / `aprender-test-cli llm` -- endpoint correctness and load
# testing. main.rs gates Commands::Llm on #[cfg(feature = "llm")] and, when it
# is off, tells the user to "Rebuild with --features llm". That feature did not
# exist on THIS crate, so the advice was impossible to follow:
#
#     error: the package 'aprender-test-cli' does not contain this feature: llm
#     help: packages with the missing feature: aprender-test-lib, aprender-verify-ml
#
# The subcommand was advertised in --help and permanently unreachable. The
# feature exists on the dependency; forward to it, exactly as `browser` does.
llm = ["jugar-probar/llm"]

[lib]
name = "probador"

[[bin]]
name = "aprender-test-cli"
path = "src/main.rs"

[dependencies]
# Core library (was: jugar-probar) — dep key preserves Rust identifier
jugar-probar = { path = "../aprender-test-lib", version = "0.65.1", package = "aprender-test-lib" }

# CLI framework
clap = { workspace = true }
console = { workspace = true }
indicatif = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

# HTTP Server for WASM dev
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio-tungstenite = { workspace = true }
mime_guess = { workspace = true }
notify = { workspace = true }
futures = { workspace = true }
chrono = "0.4"

# Debug and scoring utilities
atty = "0.2"
glob = "0.3"

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = "2.0"
predicates = "3.1"

[lints]
workspace = true
