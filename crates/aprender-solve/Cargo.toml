[package]
name = "aprender-solve"
version.workspace = true
edition = "2021"
description = "Dense linear algebra solvers — LU, QR, SVD, Cholesky with provable contracts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/trueno"
keywords = ["linear-algebra", "lu", "qr", "svd", "cholesky"]
categories = ["science", "algorithms", "mathematics"]
authors = ["Trueno Engineering"]

[lib]
name = "trueno_solve"

[dependencies]
thiserror = "2"

[dev-dependencies]
proptest = "1"
criterion = { workspace = true }
# RNE reference for the f32_to_f16 falsifier (OBLIG-SOLVE-F32-F16-RNE). Test-only.
half = { workspace = true }

[[bench]]
name = "solve_bench"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
uninlined_format_args = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
needless_range_loop = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"
many_single_char_names = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
too_many_lines = "allow"  # ML / linear-algebra routines can be long (matches workspace policy)
