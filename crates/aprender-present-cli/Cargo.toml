[package]
exclude = ["/tests/", "benches/", "docs/", ".github/", ".pmat/", "target/", ".profraw", ".profdata", ".vscode/", ".idea/", "proptest-regressions/"]
name = "aprender-present-cli"
description = "CLI for Presentar WASM apps - serve and bundle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The `presentar` bin target is GONE — deliberately. This crate declares no
# binary at all now, and FALSIFY-MONO-011 no longer exempts it.
#
# `presentar` is a pre-consolidation name. Published, it installed a binary of
# that name into ~/.cargo/bin, where it collided with the identically-named
# binary the standalone `presentar` crate ships. The capability moved, intact,
# to `apr present <SUBCOMMAND>`; the functions below are what apr-cli calls.
#
# clap left with the binary: this crate no longer parses arguments, apr-cli
# does.

[lib]
name = "aprender_present_cli"
path = "src/lib.rs"

[dependencies]
presentar-yaml = { workspace = true }
notify = { version = "7.0", optional = true }
tiny_http = "0.12"
tungstenite = { version = "0.26", optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[features]
default = []
dev-server = ["dep:notify", "dep:tungstenite"]

[lints]
workspace = true
