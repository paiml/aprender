[package]
name = "aprender-gemm-codegen"
version.workspace = true
edition = "2021"
rust-version = "1.91"
authors = ["Pragmatic AI Labs"]
license = "MIT"
description = "Compile-time GEMM microkernel code generation for trueno (sovereign, no external BLAS)"

[lints.rust]
unsafe_code = "allow"


[lib]
proc-macro = true

[dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"
