[package]
exclude = ["/tests/", "benches/", "docs/", ".github/", ".pmat/", "target/", ".profraw", ".profdata", ".vscode/", ".idea/", "proptest-regressions/"]
name = "aprender-present-terminal"
description = "Terminal backend for Presentar UI framework with zero-allocation rendering"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "presentar_terminal"

[dependencies]
# Internal crates
presentar-core = { workspace = true }

# Terminal rendering (direct crossterm backend)
crossterm = "0.28"

# Zero-allocation cell buffer (PROBAR-SPEC-009 compliant)
compact_str = "0.8"
bitvec = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"

# Error handling
thiserror = "2.0"

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

# ttop for parity testing against the reference implementation
# See SPEC-024 Section 11 - Visual Comparison Findings
ttop = "2.0"
# NOTE: trueno-viz dev-dep removed — it was unused (0 references) and its ^0.51.0
# requirement created a crates.io publish cycle
# (aprender-compute → aprender-present-terminal → aprender-viz → aprender-compute).

[[bench]]
name = "terminal"
harness = false

[features]
default = []
ptop = ["sysinfo", "clap", "serde_json"]
tui-compare = ["clap"]
bench-tool = ["clap"]
score = ["clap", "serde", "serde_json", "serde_yaml_ng"]

# SPEC-024: Enforcement features
# These features require interface tests to exist and pass
ptop-release = ["ptop"]  # Use for release builds - triggers stricter enforcement

[dependencies.sysinfo]
# 0.32 does NOT have ProcessRefreshKind::nothing() (added in 0.33), and
# refresh_processes' arity changed. The code here was written against 0.33+, so
# `--features ptop` failed to compile with 28 errors while the default build was
# clean — and nothing in .github/workflows builds ptop, so it was invisible.
version = "0.33"
optional = true

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.serde_yaml_ng]
version = "0.10"
optional = true

# The `score` and `ptop` bin targets are GONE — deliberately. This crate
# declares no binary at all now, and FALSIFY-MONO-011 no longer exempts it.
#
# `cargo install` drops every bin target into ~/.cargo/bin unqualified, and both
# names are ones this project has no claim to: `score` is a bare English word,
# and `ptop` is a real system monitor shipped by unrelated projects. Two crates
# in this workspace each installing a `ptop` would silently overwrite whichever
# was installed first.
#
# The capability is unchanged, only its address:
#   score  ->  apr score   (src/tools/score.rs :: run)
#   ptop   ->  apr top     (src/ptop/run.rs    :: run)
#
# Both features still exist and still gate the code; they now gate a library
# module instead of a binary, and apr-cli turns them on.

[[example]]
name = "tui-compare"
required-features = ["tui-compare"]

[[example]]
name = "cbtop-bench"
required-features = ["bench-tool"]

[[example]]
name = "test_connections"
required-features = ["ptop"]

[lints]
workspace = true
