[package]
exclude = ["/tests/", "benches/", "docs/", ".github/", ".pmat/", "target/", ".profraw", ".profdata", ".vscode/", ".idea/", "proptest-regressions/"]
name = "aprender-present-terminal"
description = "Terminal backend for Presentar UI framework with zero-allocation rendering"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "presentar_terminal"

[dependencies]
# Internal crates
presentar-core = { workspace = true }

# Terminal rendering (direct crossterm backend)
crossterm = "0.28"

# Zero-allocation cell buffer (PROBAR-SPEC-009 compliant)
compact_str = "0.8"
bitvec = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"

# Error handling
thiserror = "2.0"

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

# NOTE: `ttop = "2.0"` REMOVED (same reason as the trueno-viz note below).
# `ttop` is the published name of the in-tree `crates/aprender-viz-ttop`, which
# is binary-only (no [lib]) — so the crates.io copy could not be swapped for it.
# Nothing here imported `ttop::`; the dep only dragged in a parallel crates.io
# stack (ttop 2.0 -> presentar-terminal 0.3.5 -> presentar-core 0.3.4 ->
# trueno 0.14.6), i.e. a second copy of THIS crate and of the SIMD foundation.
# SPEC-024 Section 11 visual-parity comparison was never wired up in code.
# NOTE: trueno-viz dev-dep removed — it was unused (0 references) and its ^0.51.0
# requirement created a crates.io publish cycle
# (aprender-compute → aprender-present-terminal → aprender-viz → aprender-compute).

[[bench]]
name = "terminal"
harness = false

[features]
default = []
ptop = ["sysinfo", "clap", "serde_json"]
tui-compare = ["clap"]
bench-tool = ["clap"]
score = ["clap", "serde", "serde_json", "serde_yaml_ng"]

# SPEC-024: Enforcement features
# These features require interface tests to exist and pass
ptop-release = ["ptop"]  # Use for release builds - triggers stricter enforcement

[dependencies.sysinfo]
# 0.32 does NOT have ProcessRefreshKind::nothing() (added in 0.33), and
# refresh_processes' arity changed. The code here was written against 0.33+, so
# `--features ptop` failed to compile with 28 errors while the default build was
# clean — and nothing in .github/workflows builds ptop, so it was invisible.
version = "0.33"
optional = true

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.serde_yaml_ng]
version = "0.10"
optional = true

[[bin]]
name = "score"
path = "src/bin/score.rs"
required-features = ["score"]

[[bin]]
name = "ptop"
path = "src/bin/ptop.rs"
required-features = ["ptop"]

[[example]]
name = "tui-compare"
required-features = ["tui-compare"]

[[example]]
name = "cbtop-bench"
required-features = ["bench-tool"]

[[example]]
name = "test_connections"
required-features = ["ptop"]

[lints]
workspace = true
