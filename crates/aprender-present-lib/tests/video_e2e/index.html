<!doctype html>
<html><head><meta charset="utf-8"><title>video e2e</title></head>
<body style="margin:0;position:relative">
<canvas id="c" width="800" height="600"></canvas>
<script type="module">
import init, * as m from './video_e2e.js';
await init();
window.e2e = new m.E2e();
window.layoutOk = () => {
  const r = [...document.querySelectorAll('video')].map(v => v.getBoundingClientRect()).sort((a, b) => a.y - b.y || a.x - b.x);
  return r.length === 3 && r[0].y === r[1].y && r[1].x >= r[0].right && r[2].y >= r[0].bottom && r[2].width > 0;
};
window.ready = true;
</script>
</body></html>
