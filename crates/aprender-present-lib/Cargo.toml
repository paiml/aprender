[package]
exclude = ["/tests/", "benches/", "docs/", ".github/", ".pmat/", "target/", ".profraw", ".profdata", ".vscode/", ".idea/", "proptest-regressions/"]
name = "aprender-present-lib"
description = "WASM-first visualization and rapid application framework"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["src/**/*", "assets/**/*", "Cargo.toml"]

[dependencies]
presentar-core = { workspace = true }
presentar-widgets = { workspace = true }
presentar-layout = { workspace = true }
presentar-yaml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
aprender-legacy-codec = { workspace = true }
zstd = { version = "0.14", optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck"]
shell-autocomplete = ["dep:zstd"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
# The root workspace entry carries no features (the pre-monorepo presentar manifest did), so
# the browser module names every web-sys type it touches here. Without the list the crate
# does not build for wasm32 (aprender#6888).
web-sys = { workspace = true, features = [
    "BinaryType", "CanvasRenderingContext2d", "CanvasWindingRule", "CloseEvent", "Document",
    "Element", "ErrorEvent", "Event", "EventTarget", "History", "HtmlCanvasElement", "ImageData",
    "HtmlElement", "HtmlMediaElement", "HtmlVideoElement", "KeyboardEvent", "Location", "MessageEvent", "MouseEvent", "Node", "Performance", "PointerEvent",
    "PopStateEvent", "Storage", "Touch", "TouchEvent", "TouchList", "Url", "WebSocket",
    "WheelEvent", "Window", "console",
] }
console_error_panic_hook = { workspace = true }
# getrandom 0.2 refuses wasm32-unknown-unknown without "js" (aprender#6888).
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
provable-contracts = { path = "../aprender-contracts", package = "aprender-contracts" }
presentar-test = { path = "../aprender-present-test", package = "aprender-present-test" }
sha2 = "0.10"
hex = "0.4"
regex = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
