[package]
name = "aprender-rag-cli"
version = "0.63.0"
edition = "2021"
authors = ["Pragmatic AI Labs"]
description = "RAG pipeline command surface (index/query/transcribe/eval), mounted as `apr rag`"
license = "MIT"
repository = "https://github.com/paiml/trueno-rag"
readme = "../aprender-rag/README.md"

# No `[[bin]]`. This crate used to publish a binary called `trueno-rag`, which
# names a project (`trueno`) that is now `crates/aprender-compute` and tells a
# user nothing about `cargo install aprender-rag-cli`. The pipeline is unchanged
# and reachable as `apr rag <demo|index|query|transcribe|extract-frames|info|eval>`;
# `apr-cli` depends on this crate and calls `aprender_rag_cli::run`, the same
# entry point `main` called.
[lib]
name = "aprender_rag_cli"
path = "src/lib.rs"

[dependencies]
# APR-MONO §S #1976: flat-layout relocation from crates/aprender-rag/crates/trueno-rag-cli/
# to crates/aprender-rag-cli/; dep now resolves via root [workspace.dependencies].
aprender-rag = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rayon = "1.11"
globset = "0.4"
blake3 = "1.5"

[features]
default = []
# Enable production semantic embeddings via fastembed (GH-1)
embeddings = ["aprender-rag/embeddings"]
# Enable NVIDIA Embed Nemotron 8B support (GH-3)
nemotron = ["aprender-rag/nemotron"]
# Enable GPU-accelerated transcription via aprender (GH-2)
transcription = ["aprender-rag/transcription"]
# LLM-as-judge evaluation via Anthropic API (PMAT-015)
eval = ["aprender-rag/eval"]
# SQLite+FTS5 index export (PMAT-017)
sqlite = ["aprender-rag/sqlite"]
# Image OCR via tesseract CLI (PMAT-023)
ocr = ["aprender-rag/ocr"]

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"

[lints]
workspace = true
