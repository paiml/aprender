[package]
name = "aprender-common"
version.workspace = true
edition = "2024"
authors = ["Noah Gift <noah@paiml.com>"]
description = "Shared utilities for the Batuta stack: formatting, system info, display helpers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/batuta-common"
keywords = ["formatting", "utilities", "terminal", "display"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "batuta_common"

[dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
zstd = { version = "0.13", default-features = false }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# ML-specific cast allows (match the workspace policy). APR-MONO self-containment surfaced
# these once math.rs compiles in-tree; this crate predates `[lints] workspace = true`.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"  # ML algorithms / test assertions often compare floats (matches workspace policy)
