metadata:
  version: "1.0"
  created: "2026-04-05"
  description: "Model family descriptor: openelm"
  kind: model-family
  references:
    - "https://huggingface.co/"

family: openelm
display_name: "Apple OpenELM"
vendor: Apple
architectures:
  - OpenELMForCausalLM
  - OpenELMModel
hf_pattern: "apple/OpenELM-*"

# OpenELM uses variable-width attention: per-layer num_query_heads and num_kv_heads
# arrays, plus per-layer ffn_multipliers. The size_variants list the MAX head counts
# (last layer), which determines head_dim = hidden_dim / max_num_heads.
size_variants:
  270m:
    parameters: "270M"
    hidden_dim: 1280
    num_layers: 16
    num_heads: 20
    num_kv_heads: 5
    intermediate_dim: 5120
    vocab_size: 32000
    max_position_embeddings: 2048
    head_dim: 64
    rope_theta: 10000.0
    rms_norm_eps: 0.000001
  450m:
    parameters: "450M"
    hidden_dim: 1536
    num_layers: 20
    num_heads: 24
    num_kv_heads: 6
    intermediate_dim: 6144
    vocab_size: 32000
    max_position_embeddings: 2048
    head_dim: 64
    rope_theta: 10000.0
    rms_norm_eps: 0.000001

constraints:
  attention_type: gqa
  activation: silu
  norm_type: rmsnorm
  has_bias: false
  tied_embeddings: false
  positional_encoding: rope
  mlp_type: swiglu

tensor_template:
  token_embeddings: "transformer.token_embeddings.weight"
  norm_weight: "transformer.norm.weight"
  per_layer:
    attn_norm_weight: "transformer.layers.{n}.attn_norm.weight"
    qkv_proj: "transformer.layers.{n}.attn.qkv_proj.weight"
    out_proj: "transformer.layers.{n}.attn.out_proj.weight"
    ffn_norm_weight: "transformer.layers.{n}.ffn_norm.weight"
    proj_1: "transformer.layers.{n}.ffn.proj_1.weight"
    proj_2: "transformer.layers.{n}.ffn.proj_2.weight"

shape_template:
  token_embeddings: "[vocab_size, hidden_dim]"
  norm_weight: "[hidden_dim]"
  attn_norm_weight: "[hidden_dim]"
  ffn_norm_weight: "[hidden_dim]"

quantizations:
  - f16
  - f32

falsification_tests:
  - id: FALSIFY-MF-OPENELM-001
    description: "every openelm size variant declares nonzero dimensions"
    test: "cargo test -p aprender-core --lib falsify_mf_001_positive_dimensions"
    prediction: "load_all_families loads openelm.yaml and none of its size variants has a zero hidden_dim, num_layers, num_heads, num_kv_heads, intermediate_dim, vocab_size or head_dim"
    if_fails: "a openelm size variant declares a zero dimension"
  - id: FALSIFY-MF-OPENELM-002
    description: "every openelm size variant divides its query heads evenly into KV groups"
    test: "cargo test -p aprender-core --lib falsify_mf_002_gqa_divisibility"
    prediction: "for every openelm size variant, num_heads % num_kv_heads == 0"
    if_fails: "a openelm size variant has a head count the GQA kernel cannot group"
  - id: FALSIFY-MF-OPENELM-003
    description: "openelm.yaml loads through the family loader with every required field"
    test: "cargo test -p aprender-core --lib falsify_mf_004_schema_completeness"
    prediction: "load_family_yaml parses openelm.yaml without error and the result has a family, vendor, architectures and at least one size variant"
    if_fails: "openelm.yaml is missing a required field or no longer parses"
  - id: FALSIFY-MF-OPENELM-004
    description: "no openelm size variant has more KV heads than query heads"
    test: "cargo test -p aprender-core --lib falsify_mf_008_kv_heads_le_q_heads"
    prediction: "for every openelm size variant, num_kv_heads <= num_heads"
    if_fails: "a openelm size variant declares more KV heads than query heads"
