[package]
name = "aprender-monte-carlo"
version.workspace = true
edition = "2021"
authors = ["paiml"]
description = "Monte Carlo simulations for finance, stock market, and business forecasting"
license = "MIT"
repository = "https://github.com/paiml/aprender"
keywords = ["monte-carlo", "finance", "simulation", "risk", "forecasting"]
categories = ["algorithms", "command-line-utilities", "science", "simulation"]
readme = "README.md"

[lib]
name = "aprender_monte_carlo"
path = "src/lib.rs"

[[example]]
name = "aprender-monte-carlo"

[dependencies]
aprender = { path = "../../", version = "0.63.0" }
clap = { workspace = true }
rand = "0.9"
rand_chacha = "0.9"
csv = "1.3"
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
criterion = { workspace = true }
predicates = "3"
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
