[package]
name = "aprender-cgp"
version.workspace = true
edition = "2021"
rust-version = "1.91"
authors = ["Pragmatic AI Labs"]
license = "MIT"
description = "Compute-GPU-Profile: Unified performance analysis CLI for scalar, SIMD, wgpu, and CUDA workloads"
repository = "https://github.com/paiml/trueno"
keywords = ["profiling", "gpu", "simd", "cuda", "performance"]
categories = ["command-line-utilities", "development-tools::profiling"]

[lints.rust]
unsafe_code = "allow"


[lib]
name = "cgp"

[dependencies]
# CLI framework
clap = { workspace = true }
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = "0.10"
# Error handling
anyhow = { workspace = true }
thiserror = "2.0"
# Time
chrono = { workspace = true }
# System detection
which = { workspace = true }
num_cpus = "1.17"
# Output formatting
comfy-table = "7"
colored = { workspace = true }
# GPU profiling: direct cuBLAS measurement (OWN THE STACK)
trueno-gpu = { path = "../aprender-gpu", version = "0.63.0", features = ["cuda"], optional = true, package = "aprender-gpu" }

[features]
default = []
cuda = ["dep:trueno-gpu"]

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[[bin]]
name = "aprender-cgp"
path = "src/main.rs"
