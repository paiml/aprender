[package]
name = "aprender-explain"
version.workspace = true
edition = "2021"
description = "PTX/SIMD/wgpu visualization and tracing CLI for Trueno"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/trueno"
keywords = ["ptx", "simd", "gpu", "analysis", "visualization"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "trueno_explain"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
colored = "2.0"
regex = "1.10"

# TUI dependencies — presentar-terminal
presentar-core = { workspace = true }
presentar-terminal = { workspace = true }
crossterm = "0.28"

# Internal dependency for PTX generation
trueno-gpu = { version = "0.54.0", path = "../aprender-gpu", package = "aprender-gpu", features = ["cuda"] }

[dev-dependencies]
proptest = "1.4"
pretty_assertions = "1.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
# Inherit workspace policy
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
uninlined_format_args = "allow"
useless_vec = "allow"
unnecessary_unwrap = "allow"
# CLI diagnostic tool — expect() on constant regex/config patterns is acceptable
expect_used = "allow"
unwrap_used = "allow"
panic = "allow"
unreachable = "allow"
