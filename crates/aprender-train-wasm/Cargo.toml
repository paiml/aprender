[package]
name = "aprender-train-wasm"
version.workspace = true
edition = "2021"
description = "WASM bindings for Entrenar training monitor"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
proptest = "1.4"

