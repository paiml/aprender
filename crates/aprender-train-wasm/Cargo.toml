[package]
name = "aprender-train-wasm"
version.workspace = true
edition.workspace = true
description = "WASM bindings for Entrenar training monitor"
license = "MIT"
keywords = ["ml", "training", "deep-learning", "aprender"]
categories = ["science"]

[package.metadata.docs.rs]
all-features = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
proptest = "1.4"

[profile.release]
opt-level = "s"
lto = true

[lints]
workspace = true
