[package]
name = "aprender-train-lora"
version.workspace = true
edition = "2021"
authors = ["PAIML <hello@paiml.com>"]
description = "LoRA/QLoRA configuration optimizer and memory planner"
license = "MIT"
repository = "https://github.com/paiml/entrenar"

[lib]
name = "entrenar_lora"
path = "src/lib.rs"

[[bin]]
name = "aprender-train-lora"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
entrenar = { workspace = true }
entrenar-common = { version = "0.64.0", path = "../aprender-train-common", package = "aprender-train-common" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"
assert_cmd = "2"
predicates = "3"
