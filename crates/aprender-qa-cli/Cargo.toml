[package]
name = "aprender-qa-cli"
description = "CLI for APR model qualification testing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false  # Internal QA harness; reached through `apr qa`, not `cargo add`

[lib]
name = "aprender_qa_cli"
path = "src/lib.rs"

[[bin]]
name = "apr-qa"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
aprender-qa-gen = { version = "0.62.0", path = "../aprender-qa-gen" }
aprender-qa-runner = { version = "0.62.0", path = "../aprender-qa-runner" }
aprender-qa-report = { version = "0.62.0", path = "../aprender-qa-report" }
aprender-qa-certify = { version = "0.62.0", path = "../aprender-qa-certify" }
ctrlc = "3.4"
safetensors = { workspace = true }
colored = "2.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
