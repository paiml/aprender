[package]
name = "aprender-cuda-edge"
version.workspace = true
edition = "2021"
authors = ["Pragmatic AI Labs"]
license = "MIT"
description = "GPU edge-case test framework — null fuzzing, shared memory probing, lifecycle chaos, quantization parity, PTX poison trapping"
repository = "https://github.com/paiml/trueno"
keywords = ["cuda", "gpu", "testing", "edge-case", "fuzzing"]
categories = ["development-tools::testing"]

[lib]
name = "trueno_cuda_edge"

[dependencies]
thiserror = "2.0"
serde = { workspace = true }
trueno-gpu = { version = "0.63.0", path = "../aprender-gpu", package = "aprender-gpu", optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
cuda = ["dep:trueno-gpu", "trueno-gpu/cuda"]
full = ["cuda"]

[lints.rust]
unsafe_code = "allow"


[[example]]
name = "null_fuzzer_demo"

[[example]]
name = "quant_oracle_demo"

[[example]]
name = "ptx_verifier_demo"

[[example]]
name = "falsification_report_demo"
