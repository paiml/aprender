[package]
name = "aprender-tsp"
version.workspace = true
edition = "2021"
authors = ["paiml"]
description = "Local TSP optimization with personalized .apr models"
license = "MIT"
repository = "https://github.com/paiml/aprender"
keywords = ["tsp", "optimization", "metaheuristics", "solver", "routing"]
categories = ["algorithms", "command-line-utilities", "science"]
readme = "README.md"

[lib]
name = "aprender_tsp"
path = "src/lib.rs"

[[example]]
name = "aprender-tsp"

[dependencies]
aprender = { path = "../../", version = "0.65.1" }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
crc32fast = "1.4"

[dev-dependencies]
assert_cmd = "2"
criterion = { workspace = true }
predicates = "3"
proptest = "1"
tempfile = "3"

[[bench]]
name = "tsp_benchmarks"
harness = false

[lints]
workspace = true
