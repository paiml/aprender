[package]
exclude = ["tests/", "benches/", "docs/", ".github/", "book/", ".pmat/", "target/", ".profraw", ".profdata", ".vscode/", ".idea/", "proptest-regressions/"]
name = "aprender-zram"
description = "SIMD-accelerated LZ4/ZSTD compression engine for Linux zram devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
trueno-zram-core.workspace = true
trueno-zram-adaptive = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "benchmarks"
harness = false

[features]
default = ["std", "adaptive"]
std = []
cuda = ["trueno-zram-core/cuda"]
adaptive = ["dep:trueno-zram-adaptive"]

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

[[workspace.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [{{version}}] - {{date}}"
