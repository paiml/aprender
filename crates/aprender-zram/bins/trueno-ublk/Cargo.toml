[package]
name = "trueno-ublk"
version = "0.63.0"
edition = "2021"
rust-version = "0.63.0"
license = "MIT"
authors = ["PAIML"]
repository = "https://github.com/paiml/aprender"
description = "Pure Rust ublk block device for compressed RAM storage (educational - use kernel zram for production)"
keywords = ["ublk", "zram", "compression", "gpu", "block-device"]
categories = ["command-line-utilities", "compression", "filesystem"]

[lib]
name = "trueno_ublk"
path = "src/lib.rs"

[[bin]]
name = "trueno-ublk"
path = "src/main.rs"

[[example]]
name = "block_device"
path = "examples/block_device.rs"

[[example]]
name = "compression_stats"
path = "examples/compression_stats.rs"

[[example]]
name = "entropy_routing"
path = "examples/entropy_routing.rs"

[[example]]
name = "batched_benchmark"
path = "examples/batched_benchmark.rs"

[dependencies]
# Internal crates (cuda disabled - API mismatch with trueno-gpu)
# APR-MONO: the path was `../../crates/trueno-zram-core`, a PRE-CONSOLIDATION
# location that has not existed since the merge — the crate is now the workspace
# member `aprender-zram-core` (whose [lib] name is still `trueno_zram_core`).
# Nothing caught it because this manifest was neither a workspace member nor
# excluded, so no cargo command ever loaded it.
trueno-zram-core = { package = "aprender-zram-core", path = "../../../aprender-zram-core" }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = "1.0"

# ublk (zero deps - direct kernel interface)
io-uring = "0.7"
ctrlc = "3.4"

# TUI (presentar-terminal)
crossterm = "0.28"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info
nix = { version = "0.29", features = ["fs", "mount", "event", "ioctl", "mman", "user", "sched", "process"] }
procfs = "0.17"
libublk = "0.4.5"

# Parallel processing
rayon = "1.10"

# Fast hasher for integer keys (2-5x faster than SipHash for u64)
rustc-hash = "2.1"

# Fast locks (PERF-018: 10-20% faster than std RwLock, spinning before sleeping)
parking_lot = "0.12"

# Memory locking for swap deadlock prevention (DT-007)
duende-mlock = "1.0"

# ublk device lifecycle management (cleanup orphaned devices)
duende-ublk = "0.2"

# Daemon lifecycle management (DT-008)
duende-core = "0.2"
duende-platform = "0.2"
duende-policy = "0.2"

# Async trait for Daemon impl
async-trait = "0.1"

# Visualization integration (VIZ-001/002/003/004)
renacer = { workspace = true, default-features = false }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3.14"
jugar-probar = { path = "../../../aprender-test-lib", package = "aprender-test-lib", default-features = false, features = ["tui"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "iops"
harness = false

[[bench]]
name = "swap_comparison"
harness = false

[features]
default = []
# cuda feature disabled - trueno-gpu API mismatch in trueno-zram-core 0.2
# cuda = ["trueno-zram-core/cuda"]

[lints]
workspace = true

# APR-MONO: excluded from the root workspace (see the root manifest).
#
# This does NOT make the crate loadable standalone, and that is inherent rather
# than an oversight: it inherits SEVEN workspace dependencies (clap, tokio, serde,
# serde_json, thiserror, proptest, and the in-tree sibling `renacer`), so a
# standalone root would have to duplicate the workspace dependency table for a
# crate that does not compile anyway (`error[E0433]: could not find visualize in
# renacer`). `cargo metadata` on this manifest still fails; the ROOT workspace no
# longer does, which was the actual defect. Reviving this crate means resolving
# renacer first — tracked in #2470.
[workspace]
