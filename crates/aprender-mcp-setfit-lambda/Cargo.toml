[package]
name = "aprender-mcp-setfit-lambda"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "AWS Lambda loopback wrapper for the thin SetFit MCP server (pmcp.run deployment)"
publish = false

# AWS Lambda's Custom Runtime API requires the binary to be named `bootstrap`
# exactly — a platform constant, not a choice. `cargo pmcp deploy` finds the
# deployable by this name.
[[bin]]
name = "bootstrap"
path = "src/main.rs"

[lib]
name = "aprender_mcp_setfit_lambda"
path = "src/lib.rs"

[dependencies]
# The server crate owns the tool surface and model loading; this crate is a
# transport shim over it, mirroring the proven quote-pricing-lambda pattern.
aprender-mcp-setfit = { path = "../aprender-mcp-setfit" }
pmcp = { version = "2.9", features = ["streamable-http", "schema-generation"] }

lambda_http = "0.13"
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
once_cell = "1.19"

serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
