[package]
name = "aprender-ptx-debug"
version.workspace = true
edition = "2021"
authors = ["Pragmatic AI Labs"]
license = "MIT"
description = "Pure Rust PTX debugging and static analysis tool"
repository = "https://github.com/paiml/trueno"
readme = "README.md"
keywords = ["ptx", "cuda", "gpu", "static-analysis", "debugging"]
categories = ["development-tools::debugging", "development-tools::testing"]

[lib]
name = "trueno_ptx_debug"

[dependencies]
thiserror = "2.0"
# CLI surface (`apr ptx-debug`) — the clap Subcommand enum lives in this crate
# so apr-cli embeds it verbatim instead of keeping a second copy that can drift.
clap = { version = "4", features = ["derive"] }

# Inherit workspace lints
[lints.rust]
unsafe_code = "allow"


[dev-dependencies]
proptest = "1.9"

[features]
default = []
# Enable renacer integration for runtime tracing
runtime-trace = []
