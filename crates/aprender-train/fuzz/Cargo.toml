[package]
name = "entrenar-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.entrenar]
path = ".."

# Parameter calculation fuzzing (LLaMA model configs)
[[bin]]
name = "parameter_calc"
path = "fuzz_targets/parameter_calc.rs"
test = false
doc = false
bench = false

# Tensor operations fuzzing (autograd ops)
[[bin]]
name = "tensor_ops"
path = "fuzz_targets/tensor_ops.rs"
test = false
doc = false
bench = false

# LoRA configuration fuzzing
[[bin]]
name = "lora_config"
path = "fuzz_targets/lora_config.rs"
test = false
doc = false
bench = false

# APR-MONO: this manifest is nested inside the workspace but is NOT a member and
# NOT in the root `exclude` list, so cargo treated it as part of the parent
# workspace and every command against it failed with "current package believes
# it's in a workspace when it's not". An explicit empty `[workspace]` makes it
# its own root, which is how crates/aprender-gpu/fuzz already worked.
[workspace]
members = ["."]
