[package]
name = "aprender-zram-core"
description = "SIMD-accelerated LZ4/ZSTD compression for memory pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "trueno_zram_core"

[dependencies]
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
rayon = "1.10"

[[bench]]
name = "compression"
harness = false

[[example]]
name = "parallel_scaling"
# No required features - uses dev-dependency rayon

[features]
default = ["std"]
std = []
# Enable nightly-only SIMD features
nightly = []

[lints.rust]
unsafe_code = "allow"
# APR-MONO: declare the kani proof cfg (matches the root workspace check-cfg) so
# `#[cfg(kani)]` harnesses don't trip unexpected_cfgs under -D warnings in-tree.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

