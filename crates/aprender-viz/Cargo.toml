[package]
name = "aprender-viz"
version.workspace = true
edition = "2021"
rust-version = "1.75"
authors = ["PAIML Team"]
description = "SIMD/GPU/WASM-accelerated visualization library for data science and ML"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/trueno-viz"
documentation = "https://docs.rs/trueno-viz"
readme = "README.md"
keywords = ["visualization", "simd", "gpu", "wasm", "data-science"]
categories = ["visualization", "graphics", "science", "wasm"]

[dependencies]
# Core SIMD/GPU acceleration
trueno = { version = "0.64.0", path = "../aprender-compute", package = "aprender-compute", default-features = false }

# Shared Batuta stack utilities (display traits, formatting)
batuta-common = { workspace = true }

# PNG encoding (pure Rust, no libpng)
png = "0.17"

# Base64 encoding for SVG embedded images
base64 = "0.22"

# Error handling
thiserror = "2.0"

# Optional: ML integration
aprender = { path = "../aprender-core", version = "0.64.0", package = "aprender-core", optional = true }

# Optional: Graph integration
trueno-graph = { version = "0.64.0", path = "../aprender-graph", package = "aprender-graph", default-features = false, optional = true }

# Optional: Database integration
trueno-db = { workspace = true, optional = true }

# NOTE: entrenar (=aprender-train) removed (APR-MONO self-containment): aprender-train
# depends on viz (train plots via viz), so viz→entrenar closed a train↔viz cycle. The
# entrenar inference-path interop module was dropped (re-home in aprender-train if needed).

# Optional: Serialization (for ML integration)
serde = { version = "1.0", features = ["derive"], optional = true }

# NOTE: realizar (=aprender-serve) + repartir (=aprender-distribute) removed (APR-MONO
# self-containment): both were unused in viz src, and serve→viz is the correct direction
# (the inference server plots via viz), so viz→serve closed a viz↔serve cycle.
# trueno-zram = { version = "0.1", optional = true }  # Not yet on crates.io

# NOTE: the TUI `monitor` feature was removed (#1979). Its `monitor` module (ttop-2.0
# btop-like TUI: collectors, ratatui widgets, wgpu/nvidia/manzana GPU backends) was
# deleted in the ttop-2.0 refactor, leaving the feature and its optional deps (crossterm,
# serde_yaml_ng, dirs, nvml-wrapper, tokio, rmp-serde, rustls, wgpu, manzana) dead. The
# only remaining consumers were monitor-gated tests/examples that imported the deleted
# module, so the feature, its sub-features, those deps, and the gated code were all removed.

# Dynamic library loading for AMD GPU (ROCm SMI)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Optional: WASM support
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }

[dev-dependencies]
# Testing
proptest = "1.4"
criterion = { version = "0.6", features = ["html_reports"] }

# Test utilities
tempfile = "3.10"
approx = "0.5"


[features]
default = []

# SIMD acceleration is built-in to trueno by default
# No feature flag needed

# GPU compute acceleration (native)
gpu = ["trueno/gpu"]

# GPU compute acceleration (WebGPU/WASM)
gpu-wasm = ["trueno/gpu-wasm", "wasm"]

# Parallel processing with rayon
parallel = ["trueno/parallel"]

# ML library integration
ml = ["dep:aprender", "dep:serde"]

# Graph library integration
graph = ["dep:trueno-graph"]

# Database integration
db = ["dep:trueno-db"]

# Terminal output support
terminal = []

# SVG output support
svg = []

# WASM/WebAssembly support
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]

# NOTE: the `monitor` feature and its sub-features (monitor-nvidia, monitor-remote,
# monitor-tls, monitor-stack, gpu-wgpu, gpu-iokit, afterburner, apple-hardware, gpu-full,
# accel-full, monitor-full) were removed (#1979). The `monitor` module they gated was
# deleted in the ttop-2.0 refactor, so every one of these features only pulled in dead
# optional deps and gated tests/examples that no longer compiled.

# All features enabled (excluding wasm which needs special build)
full = ["gpu", "parallel", "ml", "graph", "db", "terminal", "svg"]

[lib]
name = "trueno_viz"
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "scatter_benchmark"
harness = false

[[bench]]
name = "framebuffer_benchmark"
harness = false

[[bench]]
name = "histogram_benchmark"
harness = false

[[bench]]
name = "heatmap_benchmark"
harness = false

[[bench]]
name = "line_benchmark"
harness = false

[[bench]]
name = "encoder_benchmark"
harness = false

[[example]]
name = "aprender_integration"
required-features = ["ml"]

[[example]]
name = "trueno_graph_integration"
required-features = ["graph"]

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition", "--cfg", "docsrs"]
all-features = true

[lints]
workspace = true

[package.metadata.release]
shared-version = true

[[package.metadata.release.pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [{{version}}] - {{date}}"

