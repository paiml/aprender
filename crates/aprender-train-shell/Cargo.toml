[package]
name = "aprender-train-shell"
version.workspace = true
edition = "2021"
authors = ["PAIML <hello@paiml.com>"]
description = "Interactive REPL for HuggingFace model exploration and distillation"
license = "MIT"
repository = "https://github.com/paiml/entrenar"

[lib]
name = "entrenar_shell"
path = "src/lib.rs"

[[bin]]
name = "aprender-train-shell"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
entrenar = { workspace = true }
entrenar-common = { version = "0.63.0", path = "../aprender-train-common", package = "aprender-train-common" }
clap = { workspace = true }
rustyline = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0"
dirs = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
