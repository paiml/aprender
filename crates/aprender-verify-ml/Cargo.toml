[package]
name = "aprender-verify-ml"
version.workspace = true
edition = "2021"
rust-version = "1.70"
authors = ["Pragmatic AI Labs"]
license = "MIT"
description = "Synthetic Data Factory for Domain-Specific Code Intelligence"
repository = "https://github.com/paiml/verificar"
documentation = "https://docs.rs/verificar"
readme = "README.md"
keywords = ["testing", "code-generation", "transpiler", "verification", "synthetic-data"]
categories = ["development-tools::testing", "compilers"]

[lints.rust]
unsafe_code = "allow"

[lib]
name = "verificar"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parquet data output
parquet = { version = "59", optional = true }
arrow = { version = "59", optional = true }

# Random number generation for sampling
rand = "0.9"
rand_distr = "0.5"

# Parallelization for generation
rayon = "1.10"

# Progress tracking
indicatif = "0.18"

# UUID for test case IDs
uuid = { version = "1.11", features = ["v4", "serde"] }

# Core compute primitives - SIMD-accelerated tensor operations
trueno = { workspace = true }

# Machine learning for bug prediction (optional)
aprender = { path = "../aprender-core", version = "0.65.2", package = "aprender-core", optional = true }

# LLM fine-tuning integration (optional)
entrenar = { workspace = true, optional = true }

# Tree-sitter for grammar parsing (optional)
tree-sitter = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }

# Pest for PEG grammars (optional)
pest = { version = "2.7", optional = true }
pest_derive = { version = "2.7", optional = true }

[dev-dependencies]
proptest = "1.6"
criterion = { workspace = true }
renacer = { path = "../aprender-profile", package = "aprender-profile" }
tempfile = "3.14"

[features]
default = []
parquet = ["dep:parquet", "dep:arrow"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-python", "dep:tree-sitter-c", "dep:tree-sitter-typescript"]
pest = ["dep:pest", "dep:pest_derive"]
ml = ["dep:aprender"]
llm = ["dep:entrenar"]
full = ["parquet", "tree-sitter", "pest", "ml", "llm"]
# Chaos engineering features (from renacer)
chaos-basic = []
chaos-network = ["chaos-basic"]
chaos-byzantine = ["chaos-basic"]
chaos-full = ["chaos-network", "chaos-byzantine"]

[[test]]
name = "book"
path = "tests/book/mod.rs"

[[bench]]
name = "generator"
harness = false

[[bench]]
name = "mutator"
harness = false

[[bench]]
name = "oracle"
harness = false

[[example]]
name = "grammar_validation"
required-features = ["tree-sitter"]

[[example]]
name = "generator_basic"

[[example]]
name = "backend_selector"
required-features = ["ml"]

[[example]]
name = "experiment_tracking"
required-features = ["ml"]

