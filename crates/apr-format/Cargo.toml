[package]
name = "apr-format"
version.workspace = true
edition = "2021"
rust-version = "1.91"
description = "Sovereign `.apr` model container format (read + write, v1 APRN + v2 APR\\0) — zero ML/GPU/tokenizer dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/aprender"
keywords = ["apr", "model-format", "serialization", "machine-learning", "container"]
categories = ["science", "encoding", "data-structures"]
authors = ["PAIML Engineering"]

[lib]
name = "apr_format"

[dependencies]
# Serialization — the format's only structural dependencies.
serde = { workspace = true }
rmp-serde = { workspace = true }
# PIN: bincode 2.x changes the on-disk encoding and breaks v1 payload roundtrip.
# The workspace requirement is `1.3` (i.e. `^1.3`), which still excludes 2.x —
# the old `=1.3` here meant `>=1.3.0, <1.4.0`, so this only widens patch/minor.
bincode = { workspace = true }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# IEEE-754 half precision — replaces the trueno::f32_to_f16 / f16_to_f32 calls.
half = { version = "2.4", default-features = false, features = ["std"] }
thiserror = "2"
# Constant-memory streaming v2 writer spills tensor data to a temp file.
tempfile = { workspace = true }

# --- Optional, off-by-default ---
# Zero-copy memory-mapped loading (v2 container).
memmap2 = { version = "0.9", optional = true }
# Payload compression for the v1 container.
lz4_flex = { version = "0.11", optional = true }
zstd = { version = "0.13", optional = true }

[dev-dependencies]
# Property tests for the model-card JSON round-trip (generating.rs).
proptest = { workspace = true }
# Sovereignty falsifier parses the leaf's own dependency graph (match the
# workspace's existing 0.19 to avoid a duplicate cargo_metadata in the lock).
cargo_metadata = "0.19"

[features]
default = []
# Zero-copy mmap loading (OS memory map of the v2 container).
mmap = ["dep:memmap2"]
# Payload compression (v1 container): LZ4 + Zstd.
compression = ["dep:lz4_flex", "dep:zstd"]
# Placeholder seams for the sovereign-leaf security surface (Stage 2+).
encryption = []
signing = []
# Convenience meta-feature: everything except the security seams.
full = ["mmap", "compression"]

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
uninlined_format_args = "allow"
# The format performs documented LE/size casts between integer widths.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Moved doc comments reference identifiers/paths (e.g. `config.json::architectures[0]`,
# `Qwen2ForCausalLM`, `LAYOUT_ROW_MAJOR`) that doc_markdown wants in backticks but
# read fine as-is; mirror aprender-core's allowance for domain identifiers in docs.
doc_markdown = "allow"
