[package]
name = "aprender-train-inspect"
version.workspace = true
edition = "2021"
authors = ["PAIML <hello@paiml.com>"]
description = "SafeTensors model inspection and format conversion"
license = "MIT"
repository = "https://github.com/paiml/entrenar"

[lib]
name = "entrenar_inspect"
path = "src/lib.rs"

# APR-MONO Rule 1: `apr` is the only user-facing binary. The former
# `aprender-train-inspect` bin is now `apr train inspect`, which calls
# `entrenar_inspect::cli::run_*` — the same entry points its `main` called.
# See contracts/apr-mono-binary-rule-v1.yaml.

[lints]
workspace = true

[dependencies]
entrenar = { workspace = true }
entrenar-common = { version = "0.63.0", path = "../aprender-train-common", package = "aprender-train-common" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"
assert_cmd = "2"
predicates = "3"
