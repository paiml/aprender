[package]
name = "aprender-train-inspect"
version.workspace = true
edition = "2021"
authors = ["PAIML <hello@paiml.com>"]
description = "SafeTensors model inspection and format conversion"
license = "MIT"
repository = "https://github.com/paiml/entrenar"

[lib]
name = "entrenar_inspect"
path = "src/lib.rs"

[[bin]]
name = "aprender-train-inspect"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
entrenar = { version = "0.47.1", path = "../aprender-train", package = "aprender-train" }
entrenar-common = { version = "0.47.1", path = "../aprender-train-common", package = "aprender-train-common" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"
assert_cmd = "2"
predicates = "3"
