[package]
name = "aprender-train-inspect"
version.workspace = true
edition = "2021"
authors = ["PAIML <hello@paiml.com>"]
description = "SafeTensors model inspection and format conversion"
license = "MIT"
repository = "https://github.com/paiml/entrenar"

[lib]
name = "entrenar_inspect"
path = "src/lib.rs"

[[bin]]
name = "aprender-train-inspect"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
entrenar = { workspace = true }
entrenar-common = { version = "0.63.0", path = "../aprender-train-common", package = "aprender-train-common" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2.0"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
assert_cmd = "2"
predicates = "3"
