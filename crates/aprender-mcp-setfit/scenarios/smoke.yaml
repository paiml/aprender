# aprender-setfit-predict — protocol smoke test.
#
# The cheapest scenario proving the deployed thin server is reachable and
# serving its declared surface: transport up, the ONE tool registered, and a
# real classification round-trip through core's verified SetFit path. Run this
# most often (post-deploy and scheduled).
#
# Assertion vocabulary verified against mcp-tester's scenario.rs (Assertion +
# Comparison enums): tool_call results expose { success, result: <text>,
# parsed: <JSON|null>, error }; `path` is a DOTTED path, arrays by index;
# `numeric`/`array_length` REQUIRE a flattened comparison key
# (greater_than / greater_than_or_equal / equals / between…).
#
# COLD START: the first request after idle pays the ~87MB model load (~10s
# observed on the 2048MB function). The timeout below covers it.
# RUN WITH:  cargo pmcp test run <url> --scenarios crates/aprender-mcp-setfit/scenarios/ --transport jsonrpc
# `--transport jsonrpc` is REQUIRED, not a preference: cargo-pmcp's `test run`
# calls mcp-tester's run_scenario_with_transport, which (unlike mcp-tester's
# own CLI) never runs the initialize step, so the default http transport fails
# every tool_call with "Client not initialized" (cargo-pmcp finding, 2026-08-18).
# jsonrpc posts each request statelessly — which is also what this stateless
# server speaks.
name: aprender-setfit-predict smoke
description: Reachability, single-tool registration, and one real classification.
timeout: 90
stop_on_failure: true

steps:
  # The thin philosophy is observable protocol surface: this server advertises
  # exactly one task-shaped tool — array_length equals 1, name pinned.
  - name: List tools — exactly the one classify tool
    operation:
      type: list_tools
    assertions:
      - type: success
      - type: array_length
        path: tools
        equals: 1
      - type: equals
        path: tools[0].name
        value: classify

  # One complete document, one result — the response is the same
  # ClassifyResponse envelope `apr predict --json` and /v1/classify emit.
  # Labels are deliberately NOT pinned: an 8-shot pilot model has small
  # margins, and retraining (more shots, new seed) may flip them; the
  # envelope structure is the contract this scenario guards.
  - name: Classify one document end to end
    operation:
      type: tool_call
      tool: classify
      arguments:
        texts:
          - "Every woman deserves the right to make her own healthcare decisions."
    assertions:
      - type: success
      - type: equals
        path: parsed.schema_version
        value: 1
      - type: matches
        path: parsed.artifact_sha256
        pattern: "^[0-9a-f]{64}$"
      - type: exists
        path: parsed.backend
      - type: numeric
        path: parsed.latency_ms
        greater_than: 0
      - type: array_length
        path: parsed.results
        equals: 1
      - type: exists
        path: parsed.results[0].label
      - type: numeric
        path: parsed.results[0].margin
        greater_than_or_equal: 0
      - type: numeric
        path: parsed.results[0].token_count
        greater_than: 0
