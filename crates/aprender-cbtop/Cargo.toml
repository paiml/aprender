[package]
name = "aprender-cbtop"
version.workspace = true
edition = "2021"
description = "Compute Block Top - Real-time load testing and hardware monitoring TUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/trueno"
keywords = ["gpu", "cuda", "simd", "monitoring", "tui"]
categories = ["command-line-utilities", "hardware-support", "visualization"]
exclude = [
    # #4130: test targets that cannot compile from the published .crate, so they are not shipped (cargo drops a
    # target whose file is excluded). Each either uses a PATH-ONLY sibling dev-dependency, which `cargo package`
    # strips (PMAT-955 / preflight R6 forbid versioning it: the 0.65.0 publish cycle), or `include_str!`s a file
    # outside this crate (the repo-root contracts/, CLAUDE.md, LICENSE, apr-cli sources). They still run in the
    # workspace. Root-anchored (CB-510). Measured by scripts/package_tarball_build.sh (#4114).
    "/tests/tui_pixel_f301.rs",
]
authors = ["Trueno Engineering"]

[[bin]]
name = "aprender-cbtop"
path = "src/main.rs"

[lib]
name = "cbtop"

[dependencies]
# Canonical Brick/Widget framework - ALL WIDGETS FROM HERE
# Provides: BrailleGraph, Meter, Table, TuiApp, DirectTerminalCanvas, ColorMode
presentar-core = { workspace = true }
presentar-terminal = { workspace = true }

# Compute backends
trueno = { workspace = true }
trueno-gpu = { version = "0.69.0", path = "../aprender-gpu", package = "aprender-gpu", optional = true }

# Terminal handling
crossterm = "0.28"

# Async runtime for wgpu
pollster = "0.4"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Batuta shared utilities (format_bytes, sys info)
batuta-common = { workspace = true }

# Error handling
anyhow = "1"
thiserror = "1"

# Time handling
chrono = "0.4"

# Serialization for headless mode
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5.0"

# Unix statvfs for disk metrics
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
aprender-build-sha = { workspace = true }  # #4219: APR_GIT_SHA for --version

[dev-dependencies]
proptest = "1"
tempfile = "3"
# TUI pixel-level testing framework
jugar-probar = { path = "../aprender-test-lib", package = "aprender-test-lib" }

[features]
default = []
cuda = ["dep:trueno-gpu", "trueno-gpu/cuda"]
wos-kernel = []
full = ["cuda", "wos-kernel"]

[lints.clippy]
wildcard_enum_match_arm = "deny"
