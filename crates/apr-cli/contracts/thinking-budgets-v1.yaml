metadata:
  id: C-THINKING-BUDGETS
  version: "1.1.0"
  created: "2026-09-23"
  author: PAIML Engineering
  kind: pattern
  status: enforced
  description: |
    The token budget the golden gate's THINKING-ON leg gives a model to close its
    `<think>` block, per model, each with the measurement it came from.

    WHY THIS EXISTS. The budget was `const THINKING_ON_BUDGET: usize = 2048`, measured
    on ONE model — qwen3-8b-q4km on lambda, where the three golden questions produce
    blocks of 545 / 114 / 126 tokens — and applied to EVERY model the detector routes
    to a no-think template, including a 0.8B. `Qwen3.5-0.8B-IQ4_XS.gguf` then generated
    8,901 characters without closing, roughly 4x the longest block that 8B produced on
    the same question, and the gate reported it as a model failure.

    It cannot be one: with one model's basis behind the number, the gate cannot tell
    "a 0.8B reasoning model loops on `What is 2+2?`" — a plausible property of the
    model — from "the budget is wrong for this architecture". THAT INABILITY IS THE
    DEFECT, whichever is true here. An unbasis'd threshold is a property of the
    harness, not of the model.

    THE SHAPE IS `evidence/parity/thresholds.yaml`'s, which already got this right for
    cosine and is copied rather than reinvented:
      - every entry carries the measurement it came from, in band;
      - `default` does NOT apply to a model listed here: a listed model with no
        `budget` is FAIL-CLOSED, never silently given the default;
      - a budget without a basis is not a budget.

    AND IT IS DATA. The `const` had no env seam, so probing it meant a
    `--features cuda,inference` rebuild. A threshold you cannot vary without rebuilding
    is a threshold nobody will ever re-measure. `APR_THINKING_ON_BUDGET` overrides it
    for a probe; the override is announced in the failure text so a probed number can
    never be mistaken for a measured one.

    Related: aprender#3861 (`gpu_speedup`'s floor is a ratio measured on one pair and
    applied everywhere) is the same class of number, unresolved, and may share this fix.
  references:
    - crates/apr-cli/src/commands/golden_output.rs
    - evidence/parity/thresholds.yaml
  depends_on: []

schema: apr/thinking-budgets/v1

# Applies ONLY to models absent from `models:` below.
default:
  budget: 2048
  basis: |
    qwen3-8b-q4km on lambda (RTX 4090, sm_89), greedy: the three golden questions
    produce think blocks of 545 / 114 / 126 tokens and every block closes. 512 — the
    production leg's budget — is not enough for the first on x86, which is the defect
    #3724 fixed. This basis is ONE model of 8B; it is the default because it is the
    only measurement we have, not because it generalises.

# A listed model takes its entry and NEVER falls back to `default`.
# An entry with no `budget` is FAIL-CLOSED: the gate refuses rather than guessing.
models:
  "Qwen3.5-0.8B-IQ4_XS.gguf":
    # NO `budget` KEY ON PURPOSE. This is the model that exposed the defect, and the
    # measured state is that NO budget closes it (see why_unmeasured). Refusing names that, where
    # inheriting 2048 would republish an 8B's number as this model's measurement.
    why_unmeasured: |
      Generated 8,901 chars without closing at 2048 on lambda (#3907). MEASURED since
      (aprender#4663, operator ruling A, 2026-10-04): NO budget closes it, so the entry
      keeps no `budget` and the leg stays FAIL-CLOSED. Released apr 0.70.1 cuda
      (04332f838), lambda RTX 4090, greedy ON leg on the official template: unclosed at
      2048 / 4096 / 8192 / 16384 with 8,910 / 17,795 / 35,574 / 71,140 chars; output
      grows linearly with the budget. The text is coherent, reaches "2 + 2 = 4", then
      loops ("Wait, I should check..."). A model property, not apr: llama.cpp with
      Qwen's sampling (T 0.6, top-k 20, top-p 0.95, 8 seeds, 2048) closes 4/8; llama.cpp
      greedy closes only because an early near-tie ("Identify the Core Task") resolves
      differently across engines and backends. Evidence (in-tree):
      evidence/thinking-budgets/qwen35-0.8b-thinking-on-2026-10-04.md.
    owed_by: "nothing unblocks it here: with no `budget` the ON leg FAILS for this model (fail-closed, not waived). Only a change to the leg itself, e.g. a sampled closure rate, could pass it, and that is a gate change for its own ticket (aprender#4663)"
  "Qwen3.5-0.8B-Q4_K_M.gguf":
    # #3948 quorum item 3: recorded explicitly, so a failure on this model cites ITS measurement
    # and never the 8B-measured `default`. The budget is not what fails here.
    budget: 2048
    basis: |
      Measured on lambda (RTX 4090, cuda). History: #3948 @ 5103e07de, on apr's old ON prompt
      (`assistant\n`), the `<think>` block closed EMPTY at 16, 64 and 2048 alike; the official
      template (#3990, ends `assistant\n<think>\n`) removed that. RE-MEASURED (aprender#4666,
      operator ruling A, 2026-10-04) on released apr 0.70.1 cuda (04332f838), greedy ON leg on
      the official template: UNCLOSED at 2048 / 4096 / 8192 / 16384 with 6,723 / 13,225 /
      26,243 / 52,290 chars; output grows linearly with the budget. The text is coherent,
      reaches "2 + 2 = 4", then loops ("Wait, I should check..."). So the budget is not what
      fails and no budget makes the greedy leg pass; greedy, it stays FAIL. A model property, not
      apr: with Qwen's sampling (T 0.6, top-k 20, top-p 0.95, 8 seeds, 2048) llama.cpp closes
      2/8 and apr closes 5/8; llama.cpp greedy closes only because an early near-tie resolves
      differently across engines. Evidence (in-tree):
      evidence/thinking-budgets/qwen35-0.8b-thinking-on-2026-10-04.md.
    # #4696 (GATE CHANGE): this row is judged SAMPLED, not greedy. The leg runs once per seed with
    # Qwen's recommended thinking sampler and passes iff at least `min_pass` runs pass the unchanged
    # per-run judge (closed block, >= 3 words of reasoning, right answer). A run that errors or never
    # runs counts as a FAILED seed, never as not run.
    sampling:
      temperature: 0.6
      top_k: 20
      top_p: 0.95
      seeds: [0, 1, 2, 3, 4, 5, 6, 7]
      min_pass: 4
      basis: |
        #4696: apr greedy never closes the think block on this model at any budget from 2048 to
        16384 tokens, while sampled runs do, so greedy measures a decoding mode the model does not
        close in, not the model. Measured with Qwen's sampler (T 0.6, top_k 20, top_p 0.95), 8 seeds,
        2048 tokens, official template: apr Q4_K_M closed 5/8; llama.cpp Q4_K_M 2/8 and IQ4_XS 4/8,
        which reads as a model property. min_pass 4 of 8 sits one seed under apr's measured 5/8.
        That measurement counted CLOSURE; this gate counts closure AND a right answer, so the
        first sweep on a cut is the first measurement of the pass rate itself. IQ4_XS is NOT given a
        sampled rule: apr was not measured on it, so its row stays fail-closed.

# #4046 merge-back: the contract-integrity ratchet requires every contract to state its
# equations. This is the resolution rule the golden gate's thinking_on_budget_for applies.
equations:
  budget_resolution:
    formula: >
      budget(m) = models[m].budget        if m in models and models[m].budget is set;
                  FAIL-CLOSED              if m in models and models[m].budget is unset;
                  default.budget           if m not in models and default is set;
                  FAIL-CLOSED              otherwise
    domain: "m = the model file name the golden gate's thinking-ON leg is judging"
    codomain: "a token count with its basis, or a refusal"
    invariants:
      - "a listed model never inherits the default"
      - "a budget without a basis is not a budget"
  sampled_on_leg:
    formula: >
      pass(m) = |{ s in models[m].sampling.seeds : judge(generate(m, budget(m), sampler, s)) = PASS }|
                >= models[m].sampling.min_pass,          if models[m].sampling is set;
                judge(generate_greedy(m, budget(m))) = PASS,   otherwise
    domain: "m = a model whose row resolves a budget; sampler = (temperature, top_k, top_p) from the row"
    codomain: "PASS, or FAIL naming passes/seeds, the threshold and the first failing seed"
    invariants:
      - "an errored or missing seed run is a failed seed, never a skipped one"
      - "1 <= min_pass <= |seeds|, temperature > 0 and a non-empty basis, else the leg refuses"
      - "a model whose row has no `sampling` is judged greedy, exactly as before"
