# Softmax Kernel Contract v1.0.0
# THE SOURCE OF TRUTH for softmax correctness and performance
#
# STATUS: Authoritative — all Tensor-based softmax MUST follow this contract
# CONSUMERS:
#   - src/nn/functional.rs (softmax, log_softmax, softmax_1d)
#   - src/autograd/ops/activation.rs (Tensor::softmax)
#   - tests/contracts/softmax_contract.rs
#
# ENFORCEMENT: provable_contracts_macros::contract("softmax-kernel-v1", equation = "softmax")
#
# Mathematical Foundation:
#   softmax(x)_i = exp(x_i - max(x)) / Σ_j exp(x_j - max(x))
#   The max subtraction is essential for numerical stability (no NaN/Inf).

metadata:
  version: "1.0.0"
  created: "2026-03-02"
  author: "PAIML Engineering"
  description: "Correctness and performance specification for softmax kernels"
  references:
    - "GH-384: Softmax 1.6x slower than ndarray"
    - "Bridle (1990). Training Stochastic Model Recognition Algorithms as Networks can Lead to Maximum Mutual Information Estimation of Parameters"
    - "Milakov & Gimelshein (2018). Online normalizer calculation for softmax. arXiv:1805.02867"
  issues:
    - "https://github.com/paiml/aprender/issues/384"

# =============================================================================
# KERNEL EQUATIONS
# =============================================================================

equations:
  softmax:
    formula: "softmax(x)_i = exp(x_i - max(x)) / Σ_j exp(x_j - max(x))"
    domain: "x ∈ R^n, n ≥ 1"
    properties:
      - probability_simplex: "Σ_i softmax(x)_i = 1.0"
      - non_negative: "softmax(x)_i >= 0 ∀i"
      - monotone: "x_i > x_j → softmax(x)_i > softmax(x)_j"
      - shift_invariant: "softmax(x + c) == softmax(x) ∀c ∈ R"
      - max_dominance: "as x_i → ∞, softmax(x)_i → 1.0"

  log_softmax:
    formula: "log_softmax(x)_i = x_i - max(x) - log(Σ_j exp(x_j - max(x)))"
    domain: "x ∈ R^n, n ≥ 1"
    properties:
      - negative: "log_softmax(x)_i ≤ 0 ∀i"
      - log_sum_one: "Σ_i exp(log_softmax(x)_i) = 1.0"
      - consistency: "log_softmax(x) == log(softmax(x)) (to float precision)"

# =============================================================================
# IMPLEMENTATION MANDATES
# =============================================================================

implementation:
  three_pass_inline:
    description: "Tensor softmax MUST use 3-pass inline pattern (no per-row allocation)"
    pattern: |
      // Pass 1: max — auto-vectorizable
      let mut max_val = f32::NEG_INFINITY;
      for &v in row { max_val = max_val.max(v); }
      // Pass 2: exp + sum — auto-vectorizable
      let mut sum = 0.0f32;
      for i in 0..n { let e = (row[i] - max_val).exp(); out[i] = e; sum += e; }
      // Pass 3: normalize — auto-vectorizable
      let inv_sum = 1.0 / sum;
      for i in 0..n { out[i] *= inv_sum; }
    rationale: "Avoids 2 intermediate Vec allocations per row that softmax_1d creates"

  numerical_stability:
    description: "MUST subtract max before exp to prevent overflow"
    assertion: "No intermediate value exceeds exp(88.7) ≈ f32::MAX"

  one_path_rule:
    description: "All Tensor softmax delegates to nn::functional::softmax (UCBD §4)"
    canonical_source: "src/nn/functional.rs::softmax"

# =============================================================================
# PERFORMANCE BOUNDS
# =============================================================================

performance:
  benchmark_crate: "aprender-bench-compute"
  benchmark_file: "benches/softmax.rs"
  reference: "ndarray 3-pass scalar implementation"

  bounds:
    softmax_32000:
      min_ratio_vs_ndarray: 0.55
      target_ratio: 0.75
      measured_ratio: 0.64
      measured_date: "2026-03-02"

    softmax_128256:
      min_ratio_vs_ndarray: 0.70
      target_ratio: 0.90
      measured_ratio: 0.87
      measured_date: "2026-03-02"

    softmax_1d_4096:
      min_ratio_vs_ndarray: 0.70
      target_ratio: 0.90
      measured_ratio: 0.87
      measured_date: "2026-03-02"

# =============================================================================
# FALSIFICATION TESTS
# =============================================================================

falsification:

  FALSIFY-SM-001:
    name: "Probability simplex"
    assertion: "sum(softmax(x)) ≈ 1.0 (within 1e-5)"
    status: "PASS"

  FALSIFY-SM-002:
    name: "Non-negativity"
    assertion: "∀i: softmax(x)[i] >= 0"
    status: "PASS"

  FALSIFY-SM-003:
    name: "Shift invariance"
    assertion: "softmax(x + c) ≈ softmax(x) (within 1e-5)"
    status: "PASS"

  FALSIFY-SM-004:
    name: "Numerical stability"
    assertion: "softmax([1000, 1001, 1002]) produces valid probabilities (no NaN/Inf)"
    status: "PASS"

  FALSIFY-SM-005:
    name: "Log-softmax consistency"
    assertion: "exp(log_softmax(x)) ≈ softmax(x) (within 1e-5)"
    status: "PASS"

  FALSIFY-SM-006:
    name: "Monotonicity"
    assertion: "x[i] > x[j] → softmax(x)[i] > softmax(x)[j]"
    status: "PASS"

# =============================================================================
# QA GATE
# =============================================================================

qa_gate:
  id: "F-SOFTMAX-001"
  name: "Softmax Kernel Contract"
  description: "Validates softmax correctness and performance bounds"
  checks:
    - "Tensor softmax uses 3-pass inline pattern (no softmax_1d delegation)"
    - "Max subtraction before exp in all paths"
    - "Benchmark ratio >= min_ratio for all measured bounds"
    - "All FALSIFY tests pass"
  pass_criteria: "All checks pass"

proof_obligations:
- id: SM54B5-PRE-001
  type: precondition
  property: Input vector is finite and non-empty
  formal: '∀i: ¬isNaN(x_i) ∧ ¬isInf(x_i) ∧ len(x) > 0'
  applies_to: all
- id: SM54B5-POST-002
  type: postcondition
  property: Output is a valid probability distribution
  formal: 'len(σ(x)) = len(x) ∧ ∀i: 0 < σ(x)_i < 1 ∧ |Σ σ(x)_i - 1| < ε'
  tolerance: 1.0e-06
  requires: SM-PRE-001
  applies_to: all
- id: SM54B5-FRM-003
  type: frame
  property: Only output buffer is modified; input vector unchanged
  formal: modifies(output) ∧ preserves(input)
  applies_to: all
- id: SM54B5-INV-004
  type: invariant
  property: Output sums to 1
  formal: '|Σ σ(x)_i - 1.0| < ε'
  tolerance: 1.0e-06
  applies_to: all
  lean:
    theorem: Softmax.partition_of_unity
    module: ProvableContracts.Softmax
    status: proved
    depends_on:
    - Real.exp_pos
    - Finset.sum_div_distrib
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.ExpDeriv
    - Mathlib.Algebra.BigOperators.Group.Finset
    notes: Proof over reals; f32 gap addressed by error-bound lemma
- id: SM54B5-INV-005
  type: invariant
  property: All outputs strictly positive
  formal: σ(x)_i > 0 for all i
  applies_to: all
  lean:
    theorem: Softmax.softmax_pos
    module: ProvableContracts.Softmax
    status: proved
    depends_on:
    - Real.exp_pos
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.ExpDeriv
    notes: Follows from exp_pos and positivity of denominator
- id: SM54B5-BND-006
  type: bound
  property: Each output bounded in (0,1)
  formal: 0 < σ(x)_i < 1 for all i
  applies_to: all
  lean:
    theorem: Softmax.softmax_bounded
    module: ProvableContracts.Softmax
    status: proved
    depends_on:
    - Softmax.softmax_pos
    - Softmax.partition_of_unity
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.ExpDeriv
    notes: Upper bound from partition-of-unity; lower bound from positivity
- id: SM54B5-MON-007
  type: monotonicity
  property: Order preservation
  formal: x_i > x_j ⟹ σ(x)_i > σ(x)_j
  applies_to: all
  lean:
    theorem: Softmax.monotone
    module: ProvableContracts.Softmax
    status: proved
    depends_on:
    - Real.exp_strictMono
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.ExpDeriv
    notes: Follows from strict monotonicity of exp
- id: SM54B5-EQ-008
  type: equivalence
  property: SIMD matches scalar within ULP
  tolerance: 8.0
  applies_to: simd
- id: SM54B5-INV-009
  type: invariant
  property: Translation invariance
  formal: σ(x + c·1) = σ(x) for any scalar c
  applies_to: all
  lean:
    theorem: Softmax.shift_invariance
    module: ProvableContracts.Softmax
    status: proved
    depends_on: []
    mathlib_imports:
    - Mathlib.Analysis.SpecialFunctions.ExpDeriv
    notes: Key for numerical stability; exp(x-c)/Σexp(x-c) = exp(x)/Σexp(x)

