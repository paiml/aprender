# Kernel Fusion Contract v1.0.0
# THE SOURCE OF TRUTH for GPU kernel fusion decisions
#
# STATUS: Authoritative - every fusion decision MUST be documented here
# SPEC: docs/specifications/qwen2.5-coder-showcase-demo.md Section 11.7
# CONSUMERS:
#   - realizar/src/cuda/executor/layers/indexed.rs (transformer layer dispatch)
#   - realizar/src/cuda/executor/layers/graphed.rs (CUDA graph capture)
#   - trueno-gpu/src/kernels/quantize/fused.rs (fused kernel implementations)
#   - trueno-gpu/src/kernels/elementwise/swiglu.rs (SwiGLU kernels)
#   - crates/apr-cli/src/commands/qa.rs (F-FUSION-001 QA gate)
#
# ENFORCEMENT: realizar MUST validate fusion config at executor construction.
# Code comments alone are NOT sufficient documentation for fusion decisions.
#
# WHY THIS CONTRACT EXISTS (Five-Whys, 2026-02-09):
#   Why 1: Why is decode 80.6 tok/s (0.64x Ollama)?
#   → FFN launches 5 separate kernels per layer × 28 layers
#   Why 2: Why 5 separate FFN kernels when a fused kernel EXISTS?
#   → FusedRmsNormGateUpSwigluQ4KKernel exists but is never called
#   Why 3: Why was it never wired in?
#   → Was tried (PAR-077), found 3x slower, but decision not enforced
#   Why 4: Why is there no enforcement?
#   → Fusion decisions lived only in code comments, not contracts
#   Why 5: ROOT CAUSE — No Poka-Yoke for kernel fusion opportunities
#   → FIX: This contract + compile-time enforcement

metadata:
  references:
    - Internal contract
  version: "1.0.0"
  created: "2026-02-09"
  author: "PAIML Engineering"
  description: "Kernel fusion decision contract with Poka-Yoke enforcement"
  lessons_learned:
    - "PAR-077: Fused RMSNorm+Gate+Up+SwiGLU was 3x slower (shared memory overhead)"
    - "Code comments are not contracts — decisions must be falsifiable"
    - "L2 cache naturally serves input reuse for small vectors (6KB input vs 15MB weights)"
    - "llama.cpp uses DP4A + Q8_1 pre-quantization, not just fusion"

# =============================================================================
# THEORETICAL FOUNDATION
# =============================================================================
#
# 1. Toyota Production System — Poka-Yoke (mistake-proofing)
#    Citation: Shingo, S. (1986). Zero Quality Control. Productivity Press.
#    Principle: "Make it impossible to do wrong"
#    Application: Fusion decisions enforced at executor construction
#
# 2. Roofline Model — Memory/compute bound classification
#    Citation: Williams, S., Waterman, A., Patterson, D. (2009).
#              "Roofline: An Insightful Visual Performance Model"
#              Communications of the ACM, 52(4), 65-76.
#    Principle: Kernel fusion only helps when launch overhead > compute time
#    Application: Q4K GEMV is memory-bound (AI ≈ 4); fusion saves memory traffic
#
# 3. CUDA Graph Replay — Launch overhead elimination
#    Citation: NVIDIA (2023). CUDA Programming Guide, §3.2.8.7.3
#    Principle: Graph replay eliminates kernel launch overhead
#    Application: Under graph, fusion benefit = memory traffic savings only
#
# =============================================================================

# =============================================================================
# FUSION DECISION REGISTRY
# =============================================================================
# Each entry documents a kernel fusion opportunity and its status.
# Status: ACTIVE (used in production), BLOCKED (tried, slower), PLANNED, REJECTED
#
# RULE: Any fused kernel in trueno-gpu MUST have a corresponding entry here.
# If a kernel exists but has no entry, the build MUST fail (Poka-Yoke).

fusion_decisions:

  # -------------------------------------------------------------------------
  # ACTIVE fusions (currently used in production inference)
  # -------------------------------------------------------------------------

  swiglu_fused:
    id: "FUSION-001"
    status: "ACTIVE"
    description: "Fused SiLU activation + element-wise multiply"
    kernels:
      fused: "FusedSwigluKernel (trueno-gpu/src/kernels/elementwise/swiglu.rs)"
      replaces:
        - "SiluKernel (trueno-gpu/src/kernels/elementwise/activations.rs)"
        - "ElementwiseMulKernel (trueno-gpu/src/kernels/elementwise/activations.rs)"
    call_site: "realizar/src/cuda/executor/layers/indexed.rs:1411"
    saves_per_layer: 1  # 1 fewer kernel launch, 1 fewer intermediate buffer read/write
    saves_per_token_28L: 28  # 28 layers × 1 launch
    memory_saved_bytes: 75776  # intermediate_dim × 4 bytes (18944 × 4 for 7B)
    benchmark:
      model: "qwen2.5-coder-7b-instruct-q4_k_m"
      unfused_tok_s: null  # Not benchmarked separately (already fused)
      fused_tok_s: null
      decision_date: "2026-02-04"
    falsification: "Replacing fused_swiglu_into with separate SiLU + Mul must be slower"

  batched_swiglu:
    id: "FUSION-002"
    status: "ACTIVE"
    description: "Batched SwiGLU for prefill (M sequences in parallel)"
    kernels:
      fused: "BatchedSwigluKernel (trueno-gpu/src/kernels/elementwise/swiglu.rs)"
      replaces:
        - "M × FusedSwigluKernel invocations"
    call_site: "realizar/src/cuda/executor/layers/prefill.rs"
    benchmark:
      model: "qwen2.5-coder-7b-instruct-q4_k_m"
      prefill_tok_s: 290  # Batched prefill throughput
      decision_date: "2026-02-08"

  fused_qkv_gemv:
    id: "FUSION-006"
    status: "ACTIVE"
    description: "Fused Q/K/V projection in single kernel (3x launch reduction)"
    kernels:
      fused: "FusedQKVKernel (trueno-gpu/src/kernels/fused/mod.rs)"
      replaces:
        - "Q projection GEMV"
        - "K projection GEMV"
        - "V projection GEMV"
    call_site: "realizar/src/cuda/executor/layers/indexed.rs"
    saves_per_layer: 2  # 3 kernels → 1
    saves_per_token_28L: 56  # 28 layers × 2 launches
    benchmark:
      model: "qwen2.5-coder-7b-instruct-q4_k_m"
      decision_date: "2026-02-08"
    falsification: "Splitting into 3 separate Q/K/V GEMVs must be slower due to 3x launch overhead"

  fused_gate_up_gemv:
    id: "FUSION-007"
    status: "ACTIVE"
    description: "Fused Gate+Up FFN with SwiGLU activation in single kernel"
    kernels:
      fused: "FusedGateUpKernel (trueno-gpu/src/kernels/fused/mod.rs)"
      replaces:
        - "Gate projection GEMV"
        - "Up projection GEMV"
        - "FusedSwigluKernel"
    call_site: "realizar/src/cuda/executor/layers/indexed.rs"
    saves_per_layer: 2  # 3 kernels → 1
    saves_per_token_28L: 56  # 28 layers × 2 launches
    benchmark:
      model: "qwen2.5-coder-7b-instruct-q4_k_m"
      decision_date: "2026-02-08"
    falsification: "Splitting into separate gate+up+swiglu must show higher launch overhead"

  fused_gemm_bias_gelu:
    id: "FUSION-008"
    status: "ACTIVE"
    description: "Fused GEMM + Bias + GELU activation in single kernel"
    kernels:
      fused: "FusedGemmBiasGeluKernel (trueno-gpu/src/kernels/fused/gemm_bias_gelu.rs)"
      replaces:
        - "GemmKernel"
        - "BiasAddKernel"
        - "GeluKernel"
    call_site: "trueno-gpu/src/kernels/fused/gemm_bias_gelu.rs"
    saves_per_layer: 2  # 3 kernels → 1
    benchmark:
      decision_date: "2026-02-08"
    falsification: "Splitting GEMM+Bias+GELU into 3 kernels must show overhead"

  fused_rmsnorm_q4k_gemv:
    id: "FUSION-009"
    status: "ACTIVE"
    description: "Fused RMSNorm + Q4K GEMV (2-way fusion, avoids intermediate buffer)"
    kernels:
      fused: "FusedRmsNormQ4KGemvKernel (trueno-gpu/src/kernels/quantize/fused/rmsnorm_gemv.rs)"
      replaces:
        - "RmsNormKernel"
        - "Q4K GEMV (MWV)"
    call_site: "realizar/src/cuda/executor/layers/indexed.rs"
    saves_per_layer: 1  # 2 kernels → 1
    saves_per_token_28L: 28  # 28 layers × 1 launch
    memory_saved_bytes: 14336  # hidden_dim × 4 bytes (3584 × 4 for 7B) — avoids intermediate RMSNorm buffer
    benchmark:
      model: "qwen2.5-coder-7b-instruct-q4_k_m"
      decision_date: "2026-02-09"
    falsification: "Separate RMSNorm + Q4K GEMV must show extra memory traffic for intermediate buffer"

  fused_gate_up_q4k_gemv:
    id: "FUSION-010"
    status: "ACTIVE"
    description: "Fused Gate+Up Q4K GEMV sharing input vector load"
    kernels:
      fused: "FusedGateUpQ4KGemvKernel (trueno-gpu/src/kernels/quantize/fused/gate_up_gemv.rs)"
      replaces:
        - "Q4K Gate GEMV"
        - "Q4K Up GEMV"
    call_site: "realizar/src/cuda/executor/layers/indexed.rs"
    saves_per_layer: 1  # 2 kernels → 1
    saves_per_token_28L: 28  # 28 layers × 1 launch
    benchmark:
      model: "qwen2.5-coder-7b-instruct-q4_k_m"
      decision_date: "2026-02-09"
    falsification: "Separate gate+up Q4K GEMVs must load input vector twice"

  # -------------------------------------------------------------------------
  # BLOCKED fusions (tried, found slower — MUST remain documented)
  # -------------------------------------------------------------------------

  rmsnorm_gate_up_swiglu_fused_q4k:
    id: "FUSION-003"
    status: "BLOCKED"
    description: "Fused RMSNorm + Gate Q4K GEMV + Up Q4K GEMV + SwiGLU"
    kernels:
      fused: "FusedRmsNormGateUpSwigluQ4KKernel (trueno-gpu/src/kernels/quantize/fused.rs)"
      replaces:
        - "RmsNormKernel"
        - "Q4K Gate GEMV (MWV)"
        - "Q4K Up GEMV (MWV)"
        - "FusedSwigluKernel"
    call_site: "NOT WIRED — see PAR-077"
    saves_per_layer: 3  # 4 kernels → 1
    saves_per_token_28L: 84  # 28 layers × 3 launches
    blocking_reason: |
      PAR-077: Measured 3x SLOWER than unfused path.
      Root cause: Input vector is 6KB (hidden_dim=3584 × 4B), weights are 15MB per projection.
      Weights dominate by 2500x. The fused kernel loads input into shared memory (14KB)
      and uses barrier synchronization, but L2 cache naturally serves input reuse
      between separate gate/up kernels WITHOUT the shared memory + barrier overhead.
      The fused kernel uses 256 threads (8 warps) per output element, while the MWV
      kernel uses 3 warps with better memory coalescing.
    benchmark:
      model: "qwen2.5-coder-7b-instruct-q4_k_m"
      unfused_tok_s: 80.6
      fused_tok_s: 26.9  # ~3x slower
      decision_date: "2026-02-08"
      gpu: "RTX 4090"
    revisit_conditions:
      - "Shared memory > 96KB per SM (Blackwell+)"
      - "Input vector > 32KB (hidden_dim > 8192)"
      - "MWV kernel rewritten to use shared memory"
    falsification: |
      Re-benchmark annually or when GPU architecture changes.
      If fused becomes within 10% of unfused, switch to fused.

  # -------------------------------------------------------------------------
  # PLANNED fusions (identified but not yet implemented)
  # -------------------------------------------------------------------------

  dp4a_q8_1_input_quantization:
    id: "FUSION-004"
    status: "PLANNED"
    description: "Pre-quantize input to Q8_1, use DP4A hardware INT8 dot products"
    reference: "llama.cpp vecdotq.cuh:461 — vec_dot_q4_K_q8_1_impl_vmmq()"
    expected_speedup: "1.5-2x (hardware INT8 dot product vs f32 dequant+accumulate)"
    implementation_notes: |
      llama.cpp quantizes f32 input → Q8_1 format once per token, then uses
      dp4a.u32.s32 hardware instructions for ALL GEMV operations.
      This amortizes the quantization cost across 10 GEMVs per layer.
      Our MWV kernel currently dequantizes Q4K weights to f32 and accumulates in f32.
    blocking_reason: "Requires new Q8_1 quantization kernel + MWV rewrite"
    priority: "P0 — biggest remaining performance opportunity"

  gate_up_interleaved_weights:
    id: "FUSION-005"
    status: "PLANNED"
    description: "Interleave gate+up weight rows for single-pass GEMV"
    reference: "llama.cpp mmvq.cu:311 — GGML_GLU_OP_SWIGLU"
    expected_speedup: "1.1-1.3x (single weight read for gate+up)"
    implementation_notes: |
      llama.cpp interleaves gate and up weight rows so one GEMV kernel
      reads both projections and applies SwiGLU output-side.
      Requires weight layout transformation at model load time.
    blocking_reason: "Requires weight interleaving at GGUF load + new kernel"
    priority: "P1 — moderate impact, complex implementation"

# =============================================================================
# ENFORCEMENT RULES
# =============================================================================

enforcement:
  # Rule 1: Every fused kernel in trueno-gpu MUST have a fusion_decisions entry
  kernel_registry_complete:
    description: "No orphaned fused kernels (kernel exists but decision undocumented)"
    check: "scan trueno-gpu/src/kernels/ for Kernel impls, verify each has entry"
    severity: "ERROR"

  # Rule 2: BLOCKED decisions must have benchmarks
  blocked_must_benchmark:
    description: "BLOCKED fusions must include measured tok/s for fused AND unfused"
    check: "all BLOCKED entries have non-null benchmark.unfused_tok_s and benchmark.fused_tok_s"
    severity: "ERROR"

  # Rule 3: ACTIVE fusions must be actually called
  active_must_be_called:
    description: "ACTIVE fusions must have a call_site that actually executes"
    check: "call_site file:line exists and contains the kernel dispatch"
    severity: "ERROR"

  # Rule 4: No fusion decisions in code comments only
  no_comment_only_decisions:
    description: "Fusion decisions MUST be in this contract, not just code comments"
    check: "grep for 'fused.*BLOCKED\\|fused.*slower\\|fusion.*disabled' in realizar/"
    severity: "WARNING"

  # Rule 5: Re-evaluation schedule
  revisit_schedule:
    description: "BLOCKED decisions must be re-evaluated per revisit_conditions"
    check: "All BLOCKED entries have non-empty revisit_conditions"
    severity: "WARNING"

# =============================================================================
# QA GATE DEFINITION
# =============================================================================

qa_gate:
  id: "F-FUSION-001"
  name: "Kernel Fusion Contract"
  description: "Validates kernel fusion decisions are documented and enforced"
  checks:
    - "All fused kernels in trueno-gpu have contract entries"
    - "All ACTIVE fusions have valid call sites"
    - "All BLOCKED fusions have benchmark data"
    - "No orphaned fusion decisions (contract entry but kernel deleted)"
  pass_criteria: "All checks pass"
  falsification: "Introduce an undocumented fused kernel — gate must catch it"

equations:
  identity:
    formula: f(x) = x
    preconditions:
    - q.len() > 0
    - k.len() == v.len()
    lean_theorem: Theorems.Identity
  fusion_decision_registry:
    formula: |
      registry_check: KernelRegistry -> Result<(), RegistryError>
        For every fused kernel K in trueno-gpu/src/kernels/:
          exists entry E in fusion_decisions where E.kernels.fused == K
        For every ACTIVE entry E:
          E.call_site exists and dispatches E.kernels.fused
        For every BLOCKED entry E:
          E.benchmark.unfused_tok_s is non-null AND E.benchmark.fused_tok_s is non-null
    domain: Set of fused kernel implementations and contract entries
    codomain: Result<(), RegistryError>
    invariants:
    - No orphaned kernels (kernel exists without contract entry)
    - No phantom entries (entry exists without kernel)
    - ACTIVE kernels have valid call sites
    - BLOCKED kernels have complete benchmark data
    preconditions:
    - trueno-gpu crate compiles
    - fusion_decisions is non-empty
    lean_theorem: Theorems.FusionDecisionRegistry
  fusion_performance:
    formula: |
      perf_gate: (FusedKernel, UnfusedBaseline) -> Decision
        fused_tok_s >= unfused_tok_s * 0.9 -> ACTIVE (fused is within 10%)
        fused_tok_s < unfused_tok_s * 0.9 -> BLOCKED (fused too slow)
    domain: Benchmark measurements for fused and unfused paths
    codomain: Decision in {ACTIVE, BLOCKED}
    invariants:
    - BLOCKED fusions are slower than unfused by >10%
    - ACTIVE fusions meet or exceed unfused performance
    preconditions:
    - benchmark.unfused_tok_s > 0
    - benchmark.fused_tok_s > 0
    lean_theorem: Theorems.FusionPerformance

proof_obligations:
# ── Registry / runtime obligations (GENUINELY-NOT-APPLICABLE to Lean) ──
# These three are filesystem / runtime / benchmark predicates: they quantify
# over the set of kernel source files on disk, over whether a call_site
# file:line exists and dispatches, and over measured tok/s numbers. None has an
# algebraic statement to prove — they are enforced by the `enforcement` scan +
# `kani_harnesses` and are marked l4_not_applicable in verification_summary.
- id: KF42A6-INV-001
  type: invariant
  property: Registry completeness — no orphaned kernels
  formal: for all K in fused_kernels, exists E in fusion_decisions where E.kernels.fused == K
  tolerance: 1e-6
  applies_to: all
  l4_status: not_applicable
  notes: >-
    N/A for Lean: quantifies over kernel *source files on disk* in
    trueno-gpu/src/kernels/. A filesystem-completeness scan, not an algebraic
    identity. Enforced by enforcement.kernel_registry_complete + KANI-FUSION-001.
- id: KF42A6-POST-002
  type: postcondition
  property: ACTIVE entry call site validity
  formal: for all E where E.status == ACTIVE, file_exists(E.call_site) and dispatches(E.kernels.fused)
  applies_to: all
  l4_status: not_applicable
  notes: >-
    N/A for Lean: file_exists(call_site) and dispatches(...) are runtime /
    build-graph predicates over real source paths, not provable in exact
    arithmetic. Enforced by enforcement.active_must_be_called + KANI-FUSION-002.
- id: KF42A6-PRE-003
  type: precondition
  property: BLOCKED entries have complete benchmarks
  formal: for all E where E.status == BLOCKED, E.benchmark.unfused_tok_s != null and E.benchmark.fused_tok_s != null
  applies_to: all
  l4_status: not_applicable
  notes: >-
    N/A for Lean: a data-completeness check over measured wall-clock tok/s
    (empirical GPU benchmarks). No algebraic content. Enforced by
    enforcement.blocked_must_benchmark + KANI-FUSION-003.
# ── Fusion forward-equivalence obligations (ANALYTIC — proved in Lean) ──
# The analytic CORE of kernel fusion: a fused kernel must compute EXACTLY the
# same value as the unfused sequence it replaces (fusion is a launch-count /
# memory-traffic optimization, never a semantic change). Proved sorry-free in
# CORE Lean 4 (no Mathlib) over List Int, verified with the standalone `lean`.
- type: equivalence
  property: SwiGLU activation×multiply fusion — fused(x) == unfused(x)
  formal: swigluFused f u v = hmul (vmap f u) v
  applies_to: all
  id: FUSION-FWD-001
  lean:
    theorem: Fusion.swiglu_fusion_correct
    module: ProvableContracts.Fusion
    status: proved
    mathlib_imports: []
    notes: >-
      CORE-ONLY Lean (no Mathlib, no ProvableContracts imports). Proves the
      zipWith/map fusion law: fusing activation f with the element-wise multiply
      (single pass) equals mapping f then multiplying — for ANY f : Int → Int
      (SiLU/SwiGLU is one instance). Covers FUSION-001 (FusedSwigluKernel) and
      FUSION-007 (FusedGateUpKernel SwiGLU output). Structural induction, sorry-free.
- type: equivalence
  property: Multi-projection GEMV fusion — stacked GEMV == concatenated GEMVs
  formal: matvec (A ++ B) x = matvec A x ++ matvec B x
  applies_to: all
  id: FUSION-FWD-002
  lean:
    theorem: Fusion.matvec_append
    module: ProvableContracts.Fusion
    status: proved
    depends_on:
    - Fusion.matvec_append3
    mathlib_imports: []
    notes: >-
      CORE-ONLY Lean. A GEMV over stacked (appended) weight rows equals the
      concatenation of the separate per-projection GEMV outputs. This is the
      forward-equivalence of FUSION-006 (FusedQKVKernel, 3-way matvec_append3)
      and FUSION-010 (FusedGateUpQ4KGemvKernel, 2-way). Structural induction, sorry-free.
- type: equivalence
  property: Pipeline fusion — fused GEMM+bias+GELU == staged composition
  formal: fuse3 f g h x = f (g (h x))
  applies_to: all
  id: FUSION-FWD-003
  lean:
    theorem: Fusion.pipeline_fusion_correct
    module: ProvableContracts.Fusion
    status: proved
    depends_on:
    - Fusion.gemm_bias_gelu_fusion
    mathlib_imports: []
    notes: >-
      CORE-ONLY Lean. A fused 3-stage pipeline equals the composition of its
      stages; gemm_bias_gelu_fusion instantiates f=vmap gelu, g=vadd bias,
      h=matvec W to certify FUSION-008 (FusedGemmBiasGeluKernel) computes exactly
      gelu(bias + W·x). Proved by rfl, sorry-free.

kani_harnesses:
- id: KANI-FUSION-001
  obligation: Registry completeness — no orphaned kernels
  property: Every fused kernel has a contract entry
  bound: 8
  strategy: exhaustive
  harness: verify_registry_completeness
- id: KANI-FUSION-002
  obligation: ACTIVE entry call site validity
  property: All ACTIVE entries have valid call sites
  bound: 8
  strategy: exhaustive
  harness: verify_active_call_sites
- id: KANI-FUSION-003
  obligation: BLOCKED entries have complete benchmarks
  property: All BLOCKED entries have non-null benchmark measurements
  bound: 8
  strategy: exhaustive
  harness: verify_blocked_benchmarks

falsification_tests:
- id: FALSIFY-FUSION-FWD-001
  rule: SwiGLU activation×multiply fusion forward-equivalence
  prediction: swigluFused f u v == hmul (vmap f u) v for all activations f and integer u, v
  test: lean crates/aprender-contracts-staging/lean/ProvableContracts/Theorems/Fusion/Correctness.lean
  if_fails: Fused SiLU+multiply diverges from map-then-multiply — activation applied wrong side
- id: FALSIFY-FUSION-FWD-002
  rule: Multi-projection GEMV fusion forward-equivalence
  prediction: matvec (A ++ B) x == matvec A x ++ matvec B x for stacked projection weights
  test: lean crates/aprender-contracts-staging/lean/ProvableContracts/Theorems/Fusion/Correctness.lean
  if_fails: Stacked QKV/gate+up GEMV output slicing does not match separate GEMVs
- id: FALSIFY-FUSION-FWD-003
  rule: Pipeline (GEMM+bias+GELU) fusion forward-equivalence
  prediction: fuse3 f g h x == f (g (h x)); gemm_bias_gelu_fusion == gelu(bias + W·x)
  test: lean crates/aprender-contracts-staging/lean/ProvableContracts/Theorems/Fusion/Correctness.lean
  if_fails: Fused GEMM+bias+GELU kernel does not equal the staged composition
- id: FALSIFY-FUSION-001
  rule: Registry completeness
  prediction: Adding a fused kernel without a contract entry triggers ERROR
  test: Scan trueno-gpu/src/kernels/ for Kernel impls, verify each has fusion_decisions entry
  if_fails: Registry enforcement check is not scanning all kernel files
- id: FALSIFY-FUSION-002
  rule: BLOCKED benchmark completeness
  prediction: BLOCKED entry with null unfused_tok_s triggers ERROR
  test: Validate all BLOCKED entries have non-null benchmark fields
  if_fails: Benchmark completeness check not validating null fields
- id: FALSIFY-FUSION-003
  rule: Performance gate threshold
  prediction: FUSION-003 (3x slower) remains BLOCKED because 26.9 < 80.6 * 0.9
  test: Verify fused_tok_s < unfused_tok_s * 0.9 for all BLOCKED entries
  if_fails: Performance threshold not enforced or gate bypassed
