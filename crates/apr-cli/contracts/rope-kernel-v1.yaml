# Rotary Position Embedding (RoPE) Kernel Contract v1.0.0
# THE SOURCE OF TRUTH for RoPE correctness and performance
#
# STATUS: Authoritative — all RoPE implementations MUST follow this contract
# CONSUMERS:
#   - src/nn/transformer/attention_helpers.rs (RotaryPositionEmbedding::apply)
#   - crates/aprender-bench-compute/benches/rope.rs
#   - tests/contracts/rope_contract.rs
#
# ENFORCEMENT: provable_contracts_macros::contract("rope-kernel-v1", equation = "rope")
#
# Mathematical Foundation:
#   RoPE rotates pairs of features by position-dependent angles:
#   (q_2i, q_2i+1) = (q_2i cos(mθ_i) - q_2i+1 sin(mθ_i),
#                      q_2i sin(mθ_i) + q_2i+1 cos(mθ_i))
#   where m is position and θ_i = base^(-2i/d)
#
# Citation: Su et al. (2021). RoFormer: Enhanced Transformer with Rotary
#   Position Embedding. arXiv:2104.09864

metadata:
  version: "1.0.0"
  created: "2026-03-02"
  author: "PAIML Engineering"
  description: "Correctness and performance specification for RoPE kernels"
  references:
    - "GH-389: RoPE prefill 3.6x slower (FIXED — now 2.5x faster)"
    - "Su et al. (2021). RoFormer: Enhanced Transformer with Rotary Position Embedding. arXiv:2104.09864"
    - "Press et al. (2022). Train Short, Test Long. ICLR (ALiBi comparison)"
  issues:
    - "https://github.com/paiml/aprender/issues/389"

# =============================================================================
# KERNEL EQUATION
# =============================================================================

equations:
  rope:
    formula: |
      For each position m, head h, dimension pair i:
        θ_i = base^(-2i/d)
        cos_val = cos(m × θ_i)
        sin_val = sin(m × θ_i)
        output[..., 2i]   = x[..., 2i] × cos_val - x[..., 2i+1] × sin_val
        output[..., 2i+1] = x[..., 2i] × sin_val + x[..., 2i+1] × cos_val
    domain: "x ∈ R^[batch, seq, heads, head_dim], head_dim even"
    properties:
      - rotation: "RoPE applies 2D rotation to each (x_2i, x_2i+1) pair"
      - norm_preserving: "||RoPE(x)|| == ||x|| (rotation preserves L2 norm)"
      - relative_position: "⟨RoPE(q, m), RoPE(k, n)⟩ depends only on m-n"
      - precomputable: "cos/sin cache depends only on position, not input"
      - identity_at_zero: "RoPE(x, pos=0) ≈ x (cos(0)=1, sin(0)=0)"

  inv_freq:
    formula: "θ_i = 1 / base^(2i / d)"
    description: "Inverse frequency for dimension i with base (default 10000)"

# =============================================================================
# IMPLEMENTATION MANDATES
# =============================================================================

implementation:
  precomputed_cache:
    description: "cos/sin values MUST be precomputed at construction time"
    assertion: "RotaryPositionEmbedding::new precomputes cos_cache and sin_cache"
    rationale: "Avoids redundant trig computation during inference"

  zero_copy_output:
    description: "MUST use Tensor::from_vec for output"

  interleaved_pairs:
    description: "Rotation operates on interleaved pairs (x_2i, x_2i+1)"
    assertion: "head_dim must be even"

  input_layout:
    description: "Input tensor is [batch, seq, heads, head_dim]"
    note: "This is the standard layout for attention Q/K before head splitting"

# =============================================================================
# PERFORMANCE BOUNDS
# =============================================================================

performance:
  benchmark_crate: "aprender-bench-compute"
  benchmark_file: "benches/rope.rs"
  reference: "Handwritten scalar 4-loop with identical precomputed cache"

  bounds:
    rope_1tok_32heads_128dim:
      description: "Single token decode (1×32×128)"
      min_ratio_vs_reference: 1.5
      target_ratio: 2.5
      measured_ratio: 2.3
      measured_date: "2026-03-02"
      note: "FASTER than reference — aprender RoPE beats scalar ref"

    rope_prefill_512tok_32heads_128dim:
      description: "Prefill 512 tokens (512×32×128)"
      min_ratio_vs_reference: 1.5
      target_ratio: 3.0
      measured_ratio: 2.5
      measured_date: "2026-03-02"
      note: "FASTER than reference — from_vec eliminated allocation overhead"
      history:
        - { date: "2026-03-01", ratio: 0.28, note: "Before from_vec (3.6x slower)" }
        - { date: "2026-03-02", ratio: 2.5, note: "After from_vec (2.5x faster)" }

  status: "RESOLVED — RoPE is faster than reference at all sizes"

# =============================================================================
# FALSIFICATION TESTS
# =============================================================================

falsification:

  FALSIFY-ROPE-001:
    name: "Norm preservation"
    assertion: "||RoPE(x, pos)|| ≈ ||x|| (within 1e-5)"
    status: "PASS"

  FALSIFY-ROPE-002:
    name: "Identity at position zero"
    assertion: "RoPE(x, pos=0) ≈ x (within 1e-6, since cos(0)=1, sin(0)=0)"
    status: "PASS"

  FALSIFY-ROPE-003:
    name: "Rotation consistency"
    assertion: "RoPE(RoPE(x, 1), 1) == RoPE(x, 2) (rotation composes)"
    status: "PASS"

  FALSIFY-ROPE-004:
    name: "Head dimension constraint"
    assertion: "RoPE panics if head_dim is odd"
    status: "PASS"

  FALSIFY-ROPE-005:
    name: "Relative position inner product"
    assertion: "⟨RoPE(q,m), RoPE(k,n)⟩ depends only on m-n for fixed q,k"
    status: "PASS"

  FALSIFY-ROPE-006:
    name: "Base frequency effect"
    assertion: "Higher base → slower rotation → longer effective context"
    status: "PASS"

# =============================================================================
# QA GATE
# =============================================================================

qa_gate:
  id: "F-ROPE-001"
  name: "RoPE Kernel Contract"
  checks:
    - "Precomputed cos/sin cache (no runtime trig in apply)"
    - "Tensor::from_vec for output"
    - "Performance >= reference at all sizes"
    - "All FALSIFY tests pass"
  pass_criteria: "All checks pass"

proof_obligations:
- id: RP-PRE-001
  type: precondition
  property: Input dimension is even, position non-negative
  formal: 'd mod 2 = 0 ∧ d > 0 ∧ m ≥ 0 ∧ ∀i: isFinite(x_i)'
- id: RP-POST-002
  type: postcondition
  property: Output has same dimension as input, all elements finite
  formal: 'len(out) = len(x) ∧ ∀i: isFinite(out_i)'
  requires: ROPE-PRE-001
  lean:
    theorem: ProvableContracts.Rope.ropeList_length
    module: ProvableContracts.Theorems.Rope
    status: proved
    notes: 'Length preservation proved over ℝ (RoPE maps ℝ^d → ℝ^d via a per-pair
      map, so len(out)=len(x)); real-valued outputs are always finite, so the
      analytic content is discharged. The f32/IEEE isFinite(out_i) check is a
      runtime concern.'
- id: RP-FRM-003
  type: frame
  property: Input vector and position unchanged
  formal: modifies(output) ∧ preserves(x, m, θ)
- id: RP-INV-004
  type: invariant
  property: Norm preservation
  formal: '|‖RoPE(x, m)‖ - ‖x‖| < ε'
  tolerance: 1.0e-05
  applies_to: all
  lean:
    theorem: ProvableContracts.Rope.ropePairs_normSq
    module: ProvableContracts.Theorems.Rope
    status: proved
    depends_on:
    - Real.sin_sq_add_cos_sq
    notes: 'Whole-vector norm preservation ‖RoPE(x,m)‖ = ‖x‖ (equivalently on the
      squared norm), reduced pairwise to rope_norm_sq, which uses sin²+cos²=1.'
- id: RP-INV-005
  type: invariant
  property: Relative position encoding
  formal: ⟨RoPE(q, m), RoPE(k, n)⟩ = f(q, k, m-n)
  applies_to: all
  lean:
    theorem: ProvableContracts.Rope.rope_relative
    module: ProvableContracts.Theorems.Rope
    status: proved
    depends_on:
    - Real.cos_sub
    - Real.sin_sub
    notes: '⟨R(a)q, R(b)k⟩ = ⟨q, R(b−a)k⟩, so with a=mθ, b=nθ the inner product
      depends only on n−m. Pure polynomial identity after cos_sub/sin_sub.'
- id: RP-EQ-006
  type: equivalence
  property: SIMD matches scalar
  tolerance: 4.0
  applies_to: simd
- id: RP-BND-007
  type: bound
  property: Output bounded by input norm
  formal: ‖RoPE(x, m)‖ ≤ ‖x‖ + ε
  applies_to: all
  lean:
    theorem: ProvableContracts.Rope.ropePairs_norm_le
    module: ProvableContracts.Theorems.Rope
    status: proved
    depends_on:
    - ProvableContracts.Rope.ropePairs_normSq
    notes: 'Immediate from norm equality: ‖RoPE(x,m)‖ = ‖x‖ ≤ ‖x‖ + ε for ε ≥ 0.'

kani_harnesses:
- id: KANI-RP-001
  obligation: RP-INV-001
  property: Norm preservation for small vectors
  bound: 4
  strategy: stub_float
  harness: verify_rope_norm_preservation
- id: KANI-ROPE_K-002
  obligation: Input dimension is even, position non-negative
  property: Input dimension is even, position non-negative
  bound: 8
  strategy: exhaustive
- id: KANI-ROPE_K-003
  obligation: Output has same dimension as input, all elements finite
  property: Output has same dimension as input, all elements finite
  bound: 8
  strategy: exhaustive
- id: KANI-ROPE_K-004
  obligation: Input vector and position unchanged
  property: Input vector and position unchanged
  bound: 8
  strategy: exhaustive
- id: KANI-ROPE_K-005
  obligation: Norm preservation
  property: Norm preservation
  bound: 8
  strategy: exhaustive
- id: KANI-ROPE_K-006
  obligation: Relative position encoding
  property: Relative position encoding
  bound: 8
  strategy: exhaustive
- id: KANI-ROPE_K-007
  obligation: SIMD matches scalar
  property: SIMD matches scalar
  bound: 8
  strategy: exhaustive
- id: KANI-ROPE_K-008
  obligation: Output bounded by input norm
  property: Output bounded by input norm
  bound: 8
  strategy: stub_float

falsification_tests:
- id: FALSIFY-RP-001
  rule: Norm preservation
  prediction: ‖RoPE(x, m)‖ ≈ ‖x‖ for random x, m
  test: proptest with random vectors and positions
  if_fails: sin/cos computation error or pair indexing bug
- id: FALSIFY-RP-002
  rule: Relative position
  prediction: dot(RoPE(q,m), RoPE(k,n)) = dot(RoPE(q,0), RoPE(k,n-m))
  test: proptest verifying translation invariance of inner product
  if_fails: Incorrect frequency computation
- id: FALSIFY-RP-003
  rule: SIMD equivalence
  prediction: '|rope_avx2(x) - rope_scalar(x)| < 4 ULP'
  test: proptest comparing implementations
  if_fails: SIMD sincos approximation differs
- id: FALSIFY-RP-004
  rule: Zero position
  prediction: RoPE(x, 0) = x (identity at position 0)
  test: direct test with m=0
  if_fails: Off-by-one in position indexing
- id: FALSIFY-RP-005
  rule: Precondition - odd dimension
  prediction: RoPE with odd d panics or returns Err
  test: 'proptest: random odd-dimension vectors'
  if_fails: Missing even-dimension validation
- id: FALSIFY-RP-006
  rule: Frame condition
  prediction: Input vector unchanged after RoPE application
  test: 'proptest: clone input, apply RoPE, assert clone == original'
  if_fails: RoPE modifies input buffer
- id: FALSIFY-RP-007
  rule: Postcondition - output length
  prediction: len(RoPE(x, m)) = len(x)
  test: 'proptest: random inputs, verify length'
  if_fails: Output allocation mismatch
