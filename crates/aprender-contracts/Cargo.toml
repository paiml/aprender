[package]
name = "aprender-contracts"
description = "Papers to Math to Contracts in Code — YAML contract parsing, validation, scaffold generation, and Kani harness codegen for provable Rust kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["verification", "formal-methods", "kani", "contracts", "ml-kernels"]
categories = ["development-tools::testing", "mathematics"]
exclude = ["tests/", "benches/"]

[features]
default = []
kani = []

[lib]
name = "provable_contracts"

[dependencies]
provable-contracts-macros = { path = "../aprender-contracts-macros", version = "0.59.0", package = "aprender-contracts-macros" }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
# Oracle for f16-conversion falsifiers (PMAT-905). `half` is a workspace leaf crate
# (no aprender dependency) → dev-dep introduces no cycle. Used only in tests.
half = { workspace = true }

[[bench]]
name = "benchmarks"
harness = false

[lints.rust]
unsafe_code = "allow"
# `cfg(kani)` is set by the Kani model checker harness (`cargo kani`), not by a
# Cargo feature. Declare it so it is a known cfg name under normal builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
