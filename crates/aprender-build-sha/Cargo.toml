[package]
name = "aprender-build-sha"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Build-script helper that stamps APR_GIT_SHA into every aprender binary's --version"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/aprender"
keywords = ["build", "version", "git", "sha", "aprender"]
categories = ["development-tools::build-utils"]
authors = ["PAIML Engineering"]

# No dependencies, on purpose: this is a BUILD-dependency of every aprender
# binary package (#4219), so anything it pulled in would compile into every
# build script in the workspace.

[lib]
name = "build_sha"

[lints]
workspace = true
