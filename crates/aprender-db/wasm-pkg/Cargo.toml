[package]
name = "trueno-db-wasm"
version = "0.3.2"
edition = "2021"
authors = ["Pragmatic AI Labs <info@paiml.com>"]
description = "Browser demo for trueno-db with WebGPU/SIMD128"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Parent crate (simd only, no tokio for WASM)
trueno-db = { path = "..", default-features = false, features = ["simd", "wasm"] }
trueno = { path = "../../aprender-compute", package = "aprender-compute" }  # in-tree SIMD backend (APR-MONO)

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Web APIs
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Navigator",
    "Document",
    "Element",
    "HtmlElement",
    "Performance",
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
] }

[features]
default = []
webgpu = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# APR-MONO: this manifest is nested inside the workspace but is NOT a member and
# NOT in the root `exclude` list, so cargo treated it as part of the parent
# workspace and every command against it failed with "current package believes
# it's in a workspace when it's not". An explicit empty `[workspace]` makes it
# its own root, which is how crates/aprender-gpu/fuzz already worked.
[workspace]
members = ["."]
