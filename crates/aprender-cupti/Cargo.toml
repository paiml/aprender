[package]
name = "aprender-cupti"
version.workspace = true
edition = "2021"
description = "Rust bindings for NVIDIA CUPTI profiling - ComputeBrick analysis"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paiml/trueno"
keywords = ["cuda", "profiling", "gpu", "nvidia", "cupti"]
categories = ["development-tools::profiling", "hardware-support"]

[lib]
name = "trueno_cupti"

[dependencies]
thiserror = "2"
bitflags = "2"
libc = "0.2"

[build-dependencies]
bindgen = { version = "0.71", optional = true }

[dev-dependencies]
# None for now - CUPTI requires NVIDIA hardware

[features]
default = []
# Generate fresh bindings from cupti.h (requires CUDA Toolkit)
bindgen = ["dep:bindgen"]
# Enable warp-level tracing (high overhead, detailed analysis)
warp-trace = []
# Enable PC sampling for instruction-level profiling
pc-sampling = []
# Enable memory access tracking
memory-trace = []
