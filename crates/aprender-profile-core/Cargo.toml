[package]
name = "aprender-profile-core"
version.workspace = true
edition = "2021"
authors = ["Pragmatic AI Labs <info@paiml.com>"]
license = "MIT"
repository = "https://github.com/paiml/renacer"
description = "Core tracing primitives for renacer — zero-dep span/event types for CPU-GPU pipelining instrumentation"
rust-version = "1.75"

[features]
# trace_context.rs converts to `opentelemetry::trace::{TraceId, SpanId}` under
# this feature. The sibling aprender-profile declares the same feature as
# `["dep:opentelemetry", ...]`; -core copied the NAME without the dependency, so
# `--features otlp` never compiled. 0.31.0 is the version already in Cargo.lock
# (via aprender-profile), so this adds no new locked package.
otlp = ["dep:opentelemetry"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lib]
name = "renacer_core"

[dependencies]
opentelemetry = { version = "0.31.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
static_assertions = "1"
