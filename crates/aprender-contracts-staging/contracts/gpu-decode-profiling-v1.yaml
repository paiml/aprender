qa_gate:
  id: F-GDP-001
  name: GPU Decode Profiling Contract
  description: Ensures BrickProfiler data reflects real GPU execution AND report output is faithful
  checks:
  - wall_coverage_threshold
  - graph_disable_enforcement
  - immediate_sync_verification
  - lm_head_call_count
  - brick_ordering
  - token_accounting
  - coverage_upper_bound
  - reproducibility
  - report_fidelity_actual_us
  - report_fidelity_no_hardcoded_scores
  - report_completeness_brick_count
  - report_completeness_falsification_accounting
  - report_denominator_decoded_tokens
  - report_metadata_no_magic_constants
  - report_metadata_no_137
  pass_criteria: All 15 falsification tests pass (GDP-001 through GDP-015)
  falsification: Enable CUDA graphs during profiling to break wall coverage; hardcode score:100 to break report fidelity
