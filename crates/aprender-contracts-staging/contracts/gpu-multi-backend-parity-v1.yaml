metadata:
  version: 1.0.0
  created: '2026-03-26'
  author: PAIML Engineering
  description: Multi-backend GPU parity contract — ensures at least one GPU backend
    (wgpu, CUDA, NVRTC) produces cosine >= 0.98 vs CPU. Addresses GH-559 (sm_121 JIT
    bug) by validating at model load time.
  references:
  - 'GH-559: GPU parity FAILED cosine=-0.005 on Blackwell sm_121'
  - 'albor#82: PyTorch canary proves hardware correct (cosine=1.0)'
  - 'entrenar#309: training 21x slower than PyTorch (same root cause)'
  - §25 GPU Compute Architecture Specification
  - Ivanov et al. (2021) Data Movement Is All You Need — MLSys 2021
  - NVIDIA PTX ISA v8.5 — forward compatibility specification
  depends_on:
  - ptx-target-parity-v1
  - gpu-context-health-v1
  - backend-dispatch-v1
equations:
  multi_backend_parity:
    formula: 'exists b in backends: cosine(forward(b, token), forward(cpu, token))
      >= 0.98'
    domain: backends = {wgpu, cuda_jit, cuda_nvrtc} intersect available_backends
    codomain: Boolean
    invariants:
    - At least one GPU backend must produce cosine >= 0.98 vs CPU
    - If no GPU backend passes, system uses CPU (never garbage GPU output)
    - Backend selection is deterministic for a given (model, device) pair
    - Parity gate runs at model load time, not per-token
    preconditions:
    - 'input.len() > 0'
    - num_backends > 0
    lean_theorem: Theorems.Multi_Backend_Parity
  backend_priority:
    formula: select(backends) = first(b in [cuda, wgpu, cpu] where parity(b) >= 0.98)
    domain: 'backends sorted by expected performance: cuda > wgpu > cpu'
    invariants:
    - CUDA preferred when JIT works (pre-Blackwell, post-driver-fix)
    - wgpu fallback when CUDA JIT broken (Blackwell sm_121)
    - CPU always available as last resort
    preconditions:
    - 'input.len() > 0'
    - num_backends > 0
    lean_theorem: Theorems.Backend_Priority
  bandwidth_bound_theorem:
    formula: latency(backend) >= model_bytes / bandwidth(device)
    domain: All backends, all devices
    invariants:
    - Q4K reads 0.5625 B/element (4.5 bits per weight)
    - FP16 reads 2.0 B/element (16 bits per weight)
    - Q4K backend is at most bandwidth(FP16)/bandwidth(Q4K) = 3.56x faster
    - Memory bandwidth is the bottleneck for M=1 decode (Ivanov 2021)
    preconditions:
    - 'input.len() > 0'
    - bandwidth_gbps > 0.0
    lean_theorem: Theorems.Bandwidth_Bound_Theorem
  jit_compilation_correctness:
    formula: cosine(jit_sass(ptx, device), reference_sass(ptx, device)) >= 0.9999
    domain: ptx = valid PTX with .target sm_90, device in {sm_89, sm_90, sm_121}
    codomain: cosine similarity of output logits
    invariants:
    - JIT SASS must produce numerically equivalent results to offline-compiled SASS
    - NVIDIA PTX ISA guarantees forward compatibility for .target <= device SM
    - 'VIOLATION on sm_121: cosine = -0.005 (GH-559)'
    preconditions:
    - 'input.len() > 0'
    lean_theorem: Theorems.Jit_Compilation_Correctness
proof_obligations:
- type: invariant
  property: At least one backend passes parity
  formal: 'for all models M, exists b: cosine(forward(b, M, bos), forward(cpu, M,
    bos)) >= 0.98'
  tolerance: 0.02
  applies_to: all
- type: invariant
  property: Failed backend never serves inference
  formal: parity(b) < 0.98 implies b is not used for token generation
  applies_to: all
- type: invariant
  property: Backend selection is deterministic
  formal: select(M, D, t1) == select(M, D, t2) for same model M and device D
  applies_to: all
- type: equivalence
  property: wgpu matches CPU within tolerance
  formal: cosine(forward(wgpu, M, token), forward(cpu, M, token)) >= 0.98
  tolerance: 0.02
  applies_to: wgpu
- type: equivalence
  property: NVRTC-compiled CUDA matches CPU within tolerance
  formal: cosine(forward(nvrtc, M, token), forward(cpu, M, token)) >= 0.98
  tolerance: 0.02
  applies_to: nvrtc
- type: bound
  property: Q4K bandwidth advantage
  formal: latency(q4k_gemv) <= latency(fp16_gemm) for M=1 on same device
  applies_to: all
kernel_structure:
  phases:
  - name: parity_probe
    description: Run 1-token forward on candidate backend, compare with CPU
    invariant: cosine similarity >= 0.98 for backend to be accepted
  - name: backend_select
    description: Choose highest-priority passing backend
    invariant: Selection is deterministic and cached for session
  - name: inference_dispatch
    description: Route all subsequent tokens to selected backend
    invariant: No backend switching mid-session
falsification_tests:
- id: FALSIFY-MBP-001
  rule: wgpu parity on sm_121
  prediction: cosine(wgpu_forward, cpu_forward) >= 0.98 on GB10 Blackwell
  test: Run forward with wgpu backend on gx10, compare with CPU
  if_fails: Vulkan shader compiler also has sm_121 issues — need NVRTC or CPU-only
- id: FALSIFY-MBP-002
  rule: NVRTC parity on sm_121
  prediction: cosine(nvrtc_forward, cpu_forward) >= 0.98 on GB10 Blackwell
  test: Compile PTX via NVRTC with --gpu-architecture=sm_121, run forward, compare
  if_fails: NVRTC compiler also produces wrong sm_121 SASS — driver bug, not JIT-specific
- id: FALSIFY-MBP-003
  rule: PyTorch canary (hardware validation)
  prediction: cosine(pytorch_gpu, pytorch_cpu) >= 0.9999 on same device
  test: uv run --with torch python3 scripts/canary-pytorch-gpu.py
  if_fails: Hardware defect — not a software issue
- id: FALSIFY-MBP-004
  rule: CUDA JIT parity on pre-Blackwell
  prediction: cosine(cuda_jit, cpu) >= 0.98 on sm_89 (Ada) and sm_90 (Hopper)
  test: Run parity gate on RTX 4090 (sm_89) — must pass
  if_fails: JIT bug is not sm_121-specific — broader NVIDIA driver issue
- id: FALSIFY-MBP-005
  rule: Q4K bandwidth advantage over cuBLAS
  prediction: Q4K GEMV tok/s >= 2x cuBLAS FP16 HGEMM tok/s for M=1 decode
  test: Benchmark both paths on same model and GPU
  if_fails: Q4K kernel overhead negates bandwidth advantage — cuBLAS is better path
- id: FALSIFY-MBP-006
  rule: No silent fallback to garbage backend
  prediction: If parity < 0.98, inference uses CPU (not failed GPU)
  test: Set CUDA to produce garbage, verify output matches CPU exactly
  if_fails: Toyota Way violation — system serves garbage instead of stopping the line
- id: FALSIFY-MBP-007
  rule: Driver update resolves JIT bug
  prediction: Future NVIDIA driver (>590) produces cosine >= 0.98 on sm_121 via JIT
  test: After driver update, re-run parity gate
  if_fails: JIT bug persists across driver versions — permanent NVRTC/wgpu requirement
kani_harnesses:
- id: KANI-MBP-001
  obligation: Backend selection determinism
  property: select() returns same backend for same (model_hash, device_id)
  bound: 8
  strategy: exhaustive
  solver: cadical
  harness: verify_backend_selection_deterministic
- id: KANI-MBP-002
  obligation: Failed backend not used
  property: parity_score < threshold implies backend not in active set
  bound: 4
  strategy: bounded_int
  solver: cadical
  harness: verify_failed_backend_excluded
- id: KANI-GPU_MU-003
  obligation: At least one backend passes parity
  property: At least one backend passes parity
  bound: 8
  strategy: exhaustive
- id: KANI-GPU_MU-004
  obligation: Failed backend never serves inference
  property: Failed backend never serves inference
  bound: 8
  strategy: exhaustive
- id: KANI-GPU_MU-005
  obligation: Backend selection is deterministic
  property: Backend selection is deterministic
  bound: 8
  strategy: exhaustive
- id: KANI-GPU_MU-006
  obligation: wgpu matches CPU within tolerance
  property: wgpu matches CPU within tolerance
  bound: 8
  strategy: exhaustive
- id: KANI-GPU_MU-007
  obligation: NVRTC-compiled CUDA matches CPU within tolerance
  property: NVRTC-compiled CUDA matches CPU within tolerance
  bound: 8
  strategy: exhaustive
- id: KANI-GPU_MU-008
  obligation: Q4K bandwidth advantage
  property: Q4K bandwidth advantage
  bound: 8
  strategy: exhaustive
five_whys:
  symptom: GPU inference produces cosine=-0.005 vs CPU on Blackwell sm_121
  analysis:
  - why: Why does GPU produce wrong logits?
    answer: ALL custom PTX kernels (RMSNorm, GEMV, attention, etc.) produce wrong
      results
  - why: Why do all PTX kernels produce wrong results?
    answer: NVIDIA driver JIT compiler generates numerically incorrect SASS from sm_90
      PTX on sm_121
  - why: Why does the JIT produce wrong SASS?
    answer: Driver JIT is a lightweight compiler with less testing than nvcc/NVRTC
      on new architectures
  - why: Why doesn't this affect PyTorch?
    answer: PyTorch uses pre-compiled SASS (cuBLAS/cuDNN) that bypasses the JIT entirely
  - why: Why do we use JIT instead of pre-compiled SASS?
    answer: PTX allows runtime kernel specialization (quantization type, hidden_dim,
      head_count baked into PTX)
  root_cause: NVIDIA driver JIT compiler bug on sm_121 — generates wrong SASS from
    valid PTX
  fix: Use NVRTC (offline compiler) for sm_120+, or complete wgpu inference path (Vulkan
    compiler works correctly)
qa_gate:
  id: F-MBP-001
  name: Multi-Backend GPU Parity
  description: Ensures at least one GPU backend produces correct results, with automatic
    fallback
  checks:
  - wgpu_parity
  - nvrtc_parity
  - pytorch_canary
  - no_silent_garbage
  - q4k_bandwidth_advantage
  pass_criteria: PyTorch canary passes (hardware OK) AND at least one sovereign backend
    (wgpu or NVRTC) passes parity
  falsification: Force all GPU backends to fail, verify CPU fallback activates cleanly
enforcement:
  parity_gate:
    description: Cosine similarity >= 0.98 between GPU and CPU forward pass
    check: validate_gpu_first_token + cosine parity gate in OwnedQuantizedModelCuda
    severity: ERROR — blocks GPU inference, falls back to next backend
  toyota_way:
    description: Never bypass the parity gate
    check: SKIP_PARITY_GATE=1 is forbidden in production
    severity: CRITICAL — bypassing produces garbage output (cosine=-0.005)
