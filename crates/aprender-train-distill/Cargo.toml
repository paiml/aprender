[package]
name = "aprender-train-distill"
version.workspace = true
edition = "2021"
authors = ["PAIML <hello@paiml.com>"]
description = "End-to-end knowledge distillation CLI"
license = "MIT"
repository = "https://github.com/paiml/entrenar"

[lib]
name = "entrenar_distill"
path = "src/lib.rs"

[[bin]]
name = "aprender-train-distill"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
hub = ["entrenar/hub"]

[dependencies]
entrenar = { version = "0.31.1", path = "../aprender-train", package = "aprender-train" }
entrenar-common = { version = "0.31.1", path = "../aprender-train-common", package = "aprender-train-common" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
ndarray = "0.16"
safetensors = "0.7"
bytemuck = { version = "1.19", features = ["derive"] }
half = "2.4"

[dev-dependencies]
proptest = "1.4"
tempfile = "3.8"
assert_cmd = "2"
predicates = "3"
