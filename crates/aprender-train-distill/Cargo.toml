[package]
name = "aprender-train-distill"
version.workspace = true
edition = "2021"
authors = ["PAIML <hello@paiml.com>"]
description = "End-to-end knowledge distillation CLI"
license = "MIT"
repository = "https://github.com/paiml/entrenar"

[lib]
name = "entrenar_distill"
path = "src/lib.rs"

[[bin]]
name = "aprender-train-distill"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
hub = ["entrenar/hub"]
# SPEC-DISTILL-001 Phase 1b (PMAT-693): enables CudaTrainerTeacher, the
# real teacher backend that delegates to entrenar's CudaTransformerTrainer
# in inference-only mode. Without this feature, only FixtureTeacher is
# available (sufficient for unit tests; real distillation requires `cuda`).
cuda = ["entrenar/cuda"]
# Phase 4 Stage B: real-corpus batch source wrapping ShardBatchIter from
# aprender-train. Without this feature, only SyntheticBatchSource is
# available (sufficient for smoke + fixture tests).
shard-batch-source = []

[dependencies]
entrenar = { workspace = true }
entrenar-common = { version = "0.63.0", path = "../aprender-train-common", package = "aprender-train-common" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
thiserror = "2.0"
ndarray = "0.16"
safetensors = { workspace = true }
bytemuck = { version = "1.19", features = ["derive"] }
half = "2.4"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
assert_cmd = "2"
predicates = "3"
