[package]
name = "aprender-contracts-cli"
description = "CLI for provable-contracts — validate, scaffold, verify, status, audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pv"
path = "src/main.rs"

# ONT-5: the reasoner. Private to this target (F-7); the library holds only the graph and the checker.
[[bin]]
name = "pv-sat"
path = "src/bin/pv-sat/main.rs"

[dependencies]
aprender-contracts = { path = "../aprender-contracts", version = "0.69.3" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
