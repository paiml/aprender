# Review tiers by what a change touches (FLOW-011 rev6 section 4). pmat and the gate derive the tier from the
# changed paths with scripts/review_tier.sh; an author-set tier is never read. A diff spanning tiers takes the
# highest. Globs are bash [[ == ]] patterns against repo-relative paths ('*' also matches '/').
version: 1
default: standard
sensitive:
  - ".github/*"
  - "ci/*"
  - ".pmat/*"
  - "scripts/check_*"
  - "scripts/*"
  - "scripts/review_tier.sh"
  - "scripts/pre_receipt.sh"
  - "scripts/ci_*"
  - "scripts/*gate*"
  - "scripts/release/*"
  - "scripts/*publish*"
  - "scripts/*sign*"
  - "scripts/*forjar*"
  - "forjar/*"
  - "*.pem"
  - "*.key"
  - "Cargo.toml"
  - "Cargo.lock"
  - "rust-toolchain.toml"
  - "deny.toml"
  - ".cargo/*"
  - "Makefile"
  - ".gitignore"
  - ".config/*"
  - ".githooks/*"
  - ".pv/*"
  - ".pv.toml"
  - ".quorum/*"
  - ".bashrsignore"
  - ".cargo-mutants.toml"
  - ".gitattributes"
  - ".proptest.toml"
  - ".pmat-*"
  - ".pmat.yaml"
  - "pmat.toml"
  - "tools/*"
  - "tools.toml"
  - "schemas/*"
  - "codecov.yml"
  - "rustfmt.toml"
  - ".claude/*"
  - ".agents/*"
  - ".clippy.toml"
  - "docs/roadmaps/roadmap-base.yaml"
light:
  - "docs/*"
  - "README.md"
  - "CHANGELOG.md"
  - "*/README.md"
  - "*/CHANGELOG.md"
  - "docs/roadmaps/entries/*"
# A file matching neither list is standard, unless its diff is comment-only (blank lines and whole-line comments),
# which review_tier.sh checks mechanically and treats as light.
# Scope, declared: every script under scripts/ and every file a CI surface (.github, ci/) names is sensitive; the
# check proves it by scanning those surfaces. contracts/*, docs/specifications and CLAUDE.md are standard (gates
# validate them; they are not gate machinery).  crates/*/Cargo.toml and build.rs stay standard (rev6 names only the workspace Cargo.toml). A
# script a workflow runs but that is not named above is standard until it is added here; comment stripping is
# line-based (whole-line `#`/`//` comments), so a heredoc or multi-line string body is code, not stripped.
