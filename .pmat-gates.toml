# PMAT Quality Gate Configuration for aprender
# ComputeBrick ecosystem - ML inference runtime
# Updated for PMAT v2.215.0

[gates]
# Run clippy linter
run_clippy = true

# Enforce strict clippy (-D warnings)
clippy_strict = true

# Run test suite
run_tests = true

# Test timeout in seconds
test_timeout = 600

# Check code coverage
check_coverage = true

# Minimum coverage percentage (target: 95%, achieved: 96.94%)
min_coverage = 95.0

# Check cyclomatic complexity
check_complexity = true

# Maximum cyclomatic complexity per function
max_complexity = 10

[exclude]
# The key is `paths`, NOT `patterns`. pmat reads `[exclude] paths`,
# `exclude_paths`, or `[quality-gates] exclude`
# (quality_gate_config.rs::extract_excludes_from_table). Under `patterns` these
# three entries parsed as valid TOML, were never read, and excluded nothing --
# a config that looks like it works and does not.
#
# mdBook generated files (not our code)
# Python helper scripts (one-off utilities, not production code)
paths = [
    "**/book/**",
    "**/target/**",
    "scripts/*.py",
]

[verification_ladder]
# GH-292: L5 (Lean proofs) is research-stage. L3 (falsification tests) is production-ready.
min_level = "L3"

[dependency_health]
# GH-292: 75-crate ML framework workspace needs arrow+wgpu+tokio+axum
# Individual crates stay under 250, but workspace aggregate is ~470
max_transitive = 500

[file_health]
# GH-292: Exclude generated files from file health checks
exclude = [
    "**/generated_contracts.rs",
    "**/browser.rs",
    "**/api_coverage.rs",
    "**/gpu_coverage.rs",
    "**/apr_coverage.rs",
    "**/convert_coverage.rs",
    "**/*_tests.rs",
    "**/*_trainer_tests.rs",
    "**/classify_trainer_tests.rs",
    "**/training_plan_tests.rs",
    "**/cuda_block.rs",
    "**/cuda_trainer.rs",
    "**/validators.rs",
    "**/locator.rs",
    "**/deterministic.rs",
    "**/pipeline.rs",
    "**/performance_parity.rs",
    "crates/aprender-test-lib/**",
    "crates/aprender-test-cli/**",
    "crates/aprender-verify/**",
    "crates/aprender-verify-ml/**",
    "**/examples/**",
    "**/tests/**",
    "**/wgsl_forward.rs",
    "**/cta64_wmma.rs",
    "**/blis/compute.rs",
    "**/ptop/app.rs",
    "**/transformer/model.rs",
    "**/finetune.rs",
    "**/multi_adapter_pipeline.rs",
    "**/wgsl_forward.rs",
    "**/cta64_wmma.rs",
    "**/classify_pipeline/tests.rs",
    "crates/aprender-gpu/**",
    "crates/aprender-train/**",
    "crates/aprender-present-terminal/**",
    "**/benches/**",
]

[tdg]
# CB-200 ratchet: functions below min_grade (pmat comply); the count may only fall.
# 602 re-measured 2026-09-15 under pmat 3.40.1 (602 under 3.40.0, 2026-09-14; 609 under
# 3.39.0, 2026-09-03). 3.40.0 -> 3.40.1 read the same tree the same: the instrument moved,
# the count did not. Between those readings #3004 added one B- definition
# (registry/wgpu_probe.rs entry, 603) and merged, because no required job runs
# `pmat comply`; it was split into four graded tables in the pin-bump PR, back to 602.
baseline = 599
# 599 re-measured 2026-09-18 under pmat 3.41.1 (the fleet pin, infra#692) from a cold index at
# 3409b29d2. Instrument vs tree, separated: 3.41.1 reads 602 on 5d95ed54e, the tree that banked
# 601 under 3.40.2 (+1 from the instrument on that tree, definition not identified), and 599
# here, so the tree is 3 definitions better than 09-17 under the same binary. Lowered, never raised.
# 601 re-measured 2026-09-17 under pmat 3.40.2 on the 0.68.0 release tree: 604 at head = 602 +
# three additions since the 09-15 baseline (one Rust fn refactored to A+, two C++ reference
# `main`s under evidence/** now excluded above); 604 - 3 = 601. Lowered, never raised.
# CB-200: 21 functions below A are in non-release crates (test-lib, test-cli, train/cuda)
# These are complex GPU/inference functions where high cyclomatic complexity is inherent
min_grade = "B"
exclude = [
    # evidence/** holds vendored REFERENCE harnesses (e.g. the llama.cpp d1d3c3396 C++
    # producers under evidence/parity/l0-1/) that exist to reproduce a cited measurement
    # bit-for-bit; refactoring them for a grade would invalidate the evidence they produce.
    # Not shipped code. Excluded 2026-09-17 (0.68 train: two C++ `main`s were 2 of the 3
    # definitions added over the 602 baseline; the third, a Rust one, was refactored).
    "evidence/**",
    "crates/aprender-test-lib/**",
    "crates/aprender-test-cli/**",
    "crates/aprender-verify-ml/**",
    "**/generated_contracts.rs",
    "**/tensor_names_fallback.rs",
]

[dead_code]
# Library crates have higher "dead code" due to public APIs used by external consumers
# 30% threshold accounts for public APIs not called internally
max_dead_code_percent = 30.0
# Exclude files that are primarily public API surface
exclude_patterns = [
    "src/nn/functional.rs",      # PyTorch-style F.relu() API
    "src/nn/init.rs",            # Weight initialization API
    "src/metrics/classification.rs", # sklearn-style metrics API
]

[compute-brick]
enabled = true
require_safety_comments = true
require_target_feature = true
cv_threshold_percent = 15.0
efficiency_threshold_percent = 25.0

[hooks]
pre_commit = ["pmat comply check --failures-only"]
