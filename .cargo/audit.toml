# cargo-audit configuration
# Mirrors deny.toml ignore list for consistency.

[advisories]
ignore = [
    # Unmaintained transitive deps — no available fix
    "RUSTSEC-2024-0370",  # proc-macro-error: transitive via tabled_derive
    "RUSTSEC-2024-0375",  # atty: transitive, unmaintained
    "RUSTSEC-2024-0384",  # instant: transitive via web-time
    "RUSTSEC-2024-0436",  # paste: transitive via simba/nalgebra/parquet
    "RUSTSEC-2025-0057",  # unsafe-libyaml: transitive
    "RUSTSEC-2025-0119",  # number_prefix: transitive via indicatif
    "RUSTSEC-2025-0134",  # rustls-pemfile 1.x: transitive
    "RUSTSEC-2025-0141",  # bincode: transitive, widely used
    "RUSTSEC-2026-0002",  # lru 0.12.5: transitive via ratatui

    # atty 0.2.14 — unsound read (different advisory from 2024-0375 unmaintained)
    "RUSTSEC-2021-0145",
    # rand 0.8.5 — unmaintained, transitive (no drop-in for 0.8 API)
    "RUSTSEC-2026-0097",

    # wasmtime 43 + cranelift — test-only dep (aprender-test-lib), not production.
    # v43 still has advisories for cranelift internals. Upgrade to >=43.0.2 when available.
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0096",
    # wasmtime 43 — table allocation panic (severity 5.9 medium). Same
    # test-only dep + same upgrade path (>=43.0.2 / >=44.0.1) as the
    # cranelift cluster above. Availability bug, not RCE. Published
    # 2026-04-30; surfaced first on 2026-05-01 CI runs.
    "RUSTSEC-2026-0114",
    # wasmtime 43.0.2 — "Stores can mix up type indices between engines",
    # severity 3.8 LOW. Published 2026-07-31 and broke the security gate the
    # same day, blocking the v0.62.0 release.
    #
    # NOT taken on faith from the cluster above — the "test-only, not
    # production" claim was re-verified for this one:
    #   cargo tree -p aprender                        -> 0 wasmtime paths
    #   cargo tree -p aprender --no-default-features  -> 0 wasmtime paths
    # wasmtime is optional and gated behind aprender-test-lib's `runtime`
    # feature, which NOTHING in the workspace enables (its only consumer,
    # aprender-qa-runner, takes `features = ["llm-types"]`). It appears here
    # solely because Cargo.lock records optional dependencies, so cargo-audit
    # sees it while no shipped artifact ever links it.
    #
    # The fix is a real upgrade, not this line: 43 -> >=46.0.2,<47 or >=47.0.3,
    # a four-major jump on a test-only dep. Tracked separately; revisit before
    # anything starts enabling `runtime`.
    "RUSTSEC-2026-0222",
    # wasmtime 43.0.2 - "Filesystem sandbox escape when paths or symlinks
    # contain trailing slashes", CVSS 8.8 HIGH. Published 2026-08-20; first
    # broke the security gate on 2026-08-31, taking `ci / gate` -- a REQUIRED
    # check -- red on every open pull request at once (#2799 through #2803).
    #
    # Highest severity in this cluster so far, so the reachability claim was
    # re-verified rather than inherited from the entries above:
    #   cargo tree -p aprender                        -> 0 wasmtime paths
    #   cargo tree -p aprender --no-default-features  -> 0 wasmtime paths
    #   cargo tree -p apr-cli                         -> 0 wasmtime paths
    # wasmtime is optional and gated behind aprender-test-lib's `runtime`
    # feature, which nothing in the workspace enables. No shipped artifact
    # links it, and nothing here runs untrusted wasm with a preopened
    # directory, which is the only way the escape is reachable at all.
    #
    # There is NO fixed 43.x: the advisory's ranges are >=24.0.13,<25,
    # >=36.0.14,<37, >=46.0.3,<47 and >=47.0.4. So the real fix is the same
    # three-major-version bump the -0222 note above already defers, and it
    # must land before anything starts enabling `runtime`.
    "RUSTSEC-2026-0269",

    # rustls-webpki 0.101.7 — transitive via aws-smithy-http-client (rustls 0.21).
    # Direct 0.103.x path already bumped to >=0.103.12. The 0.101.7 pin lives
    # inside AWS SDK transitive graph with no drop-in upgrade path short of a
    # major-version SDK bump.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # quick-xml 0.37.5 — quadratic parse of duplicate-attribute start tags (DoS,
    # not RCE). Affected ONLY via NsReader; orchestrate's sole use (oracle/arxiv.rs)
    # is quick_xml::Reader, not NsReader — not the affected path. Patched >=0.41.0
    # is a 0.37->0.41 API break deferred past v0.57.0.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",  # quick-xml NsReader namespace-alloc DoS — same not-affected path as -0194

    # rkyv 0.7.46 — published 2026-08-09 and broke the security gate the same
    # day, blocking every open PR (main was green on the commit before it).
    #
    # Reachability re-verified rather than assumed, the same way the wasmtime
    # 43.0.2 entry above was. (Deliberately no bare advisory id in this prose:
    # CI builds its --ignore list by grepping every RUSTSEC-dddd-dddd token out
    # of this file, comments included, so naming one here would silently exempt
    # it.) Checks run on this branch:
    #   cargo tree --workspace --all-features | grep -c rkyv   -> 0
    #   cargo tree -p aprender                                 -> 0
    #   cargo tree -p aprender --no-default-features           -> 0
    #   cargo tree -p aprender --features full                 -> 0
    #   cargo tree -p aprender-db --all-features               -> 0
    # ZERO paths, even with --all-features. The chain is
    # aprender-db -> duckdb -> rust_decimal -> rkyv, but duckdb is optional
    # (gated behind aprender-db's `competitive-benchmarks`) AND rust_decimal's
    # own `rkyv` dependency is optional and never enabled. It appears here only
    # because Cargo.lock records optional dependencies, so cargo-audit sees it
    # while nothing in the workspace can link it.
    #
    # The advisory's fix is rkyv >=0.8.17. We cannot take it: rust_decimal
    # 1.42.1 is the newest published version and it still requires rkyv 0.7.
    # Drop this line the moment rust_decimal ships a 0.8-based release.
    "RUSTSEC-2026-0235",

    # SVG rendering stack — UNMAINTAINED only (no CVE, no patched release exists).
    # Both enter solely via resvg -> usvg -> {fontdb, rustybuzz} -> ttf-parser;
    # no direct usage in the workspace. Reviewed 2026-07-26. Re-review if a
    # maintained fork appears or resvg migrates off them.
    "RUSTSEC-2026-0192",  # ttf-parser 0.25.1 unmaintained
    "RUSTSEC-2026-0206",  # rustybuzz 0.20.1 unmaintained

    # h2 0.3.x empty DATA frames. The 0.3 line has NO patched release -- upstream
    # fixed it in 0.4.16 only. Both other exposures were REMOVED rather than
    # exempted: h2 0.4.15 was updated to 0.4.16, and the reqwest 0.11 path was
    # deleted by moving aprender-serve's two stray 0.11 pins to 0.12 (the rest of
    # the workspace was already on 0.12). What remains enters solely through
    # aprender-data's OPTIONAL, non-default `s3` feature:
    #   aws-sdk-s3 -> aws-smithy-http-client -> hyper 0.14 -> h2 0.3.27
    # Updating the AWS SDK does not help: aws-smithy-http-client 1.3.0 still pins
    # hyper 0.14, and that upgrade raises MSRV to 1.94.1 while CI pins 1.93.0.
    # cargo-deny already passes without an exemption because it walks the ACTIVATED
    # graph; cargo-audit scans Cargo.lock, which lists feature-gated deps too.
    # Reachability measured on this branch, not assumed:
    #   cargo tree -p aprender-data              | grep -cE "h2 v0.3|hyper v0.14"  -> 0
    #   cargo tree -p aprender-data --features s3| grep -cE "h2 v0.3|hyper v0.14"  -> 4
    #   cargo tree --workspace                   | grep -cE "h2 v0.3"              -> 0
    # REMOVE WHEN aws-smithy-http-client drops hyper 0.14.
    "RUSTSEC-2026-0258",  # h2 0.3.27 via optional s3 feature only
]
