# cargo-audit configuration
# Mirrors deny.toml ignore list for consistency.

[advisories]
ignore = [
    # Unmaintained transitive deps — no available fix
    "RUSTSEC-2024-0370",  # proc-macro-error: transitive via tabled_derive
    "RUSTSEC-2024-0375",  # atty: transitive, unmaintained
    "RUSTSEC-2024-0384",  # instant: transitive via web-time
    "RUSTSEC-2024-0436",  # paste: transitive via simba/nalgebra/parquet
    "RUSTSEC-2025-0057",  # unsafe-libyaml: transitive
    "RUSTSEC-2025-0119",  # number_prefix: transitive via indicatif
    "RUSTSEC-2025-0134",  # rustls-pemfile 1.x: transitive
    "RUSTSEC-2025-0141",  # bincode: transitive, widely used
    "RUSTSEC-2026-0002",  # lru 0.12.5: transitive via ratatui

    # atty 0.2.14 — unsound read (different advisory from 2024-0375 unmaintained)
    "RUSTSEC-2021-0145",
    # rand 0.8.5 — unmaintained, transitive (no drop-in for 0.8 API)
    "RUSTSEC-2026-0097",

    # wasmtime 43 + cranelift — test-only dep (aprender-test-lib), not production.
    # v43 still has advisories for cranelift internals. Upgrade to >=43.0.2 when available.
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0096",
    # wasmtime 43 — table allocation panic (severity 5.9 medium). Same
    # test-only dep + same upgrade path (>=43.0.2 / >=44.0.1) as the
    # cranelift cluster above. Availability bug, not RCE. Published
    # 2026-04-30; surfaced first on 2026-05-01 CI runs.
    "RUSTSEC-2026-0114",

    # rustls-webpki 0.101.7 — transitive via aws-smithy-http-client (rustls 0.21).
    # Direct 0.103.x path already bumped to >=0.103.12. The 0.101.7 pin lives
    # inside AWS SDK transitive graph with no drop-in upgrade path short of a
    # major-version SDK bump.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # quick-xml 0.37.5 — quadratic parse of duplicate-attribute start tags (DoS,
    # not RCE). Affected ONLY via NsReader; orchestrate's sole use (oracle/arxiv.rs)
    # is quick_xml::Reader, not NsReader — not the affected path. Patched >=0.41.0
    # is a 0.37->0.41 API break deferred past v0.57.0.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",  # quick-xml NsReader namespace-alloc DoS — same not-affected path as -0194
]
