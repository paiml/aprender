# tools.toml — pinned CI tool versions (BSE-10a, PMAT-1066).
#
# These are ASSERTED by scripts/check_tool_versions.sh, never installed by
# CI. The fleet installer is infra's forjar pin, applied to every clean-room
# runner (paiml/infra, machines/intel/forjar.yaml):
#
#   stack-tool-pmat    (line 779)  version: "3.41.1"   # infra 9c411f4, 2026-09-18 (#692)
#   stack-tool-bashrs                version: "7.4.1"
#
# ALWAYS LATEST (operator rule, 2026-09-14): "we always go latest crates.io on
# our stack." This file names that version and check_tool_versions.sh asserts it.
#
# THE ORDER IS CONVERGE -> PROVE -> ASSERT, AND IT IS NOT NEGOTIABLE. This file
# was once moved to 7.0.4 ahead of the fleet and a guard-cargo job on yoga-build2
# answered `FAIL bashrs pinned 7.0.4 found 7.0.1` twenty minutes later. Four login
# shells reporting a version is not the same statement as "every environment a job
# executes in is at that version". Move the boxes first, prove it on each of them,
# and only then move the line below.
#
# Both directions red-line the repo, which is why neither is a shortcut. On
# 2026-09-14 the drift ran the other way: another repo on the shared box ran an
# unpinned `cargo install bashrs`, the binary went 7.0.1 -> 7.3.0, and `main` was
# red for three hours on `FAIL bashrs pinned 7.0.1 found 7.3.0`. The fix was to
# restore the asserted version, not to bump this file to match whatever the box
# happened to have -- a pin that chases the box asserts nothing.
#
# The fleet declaration lives in paiml/infra machines/*/forjar.yaml and is
# asserted against crates.io daily by infra's scripts/check_stack_tools_latest.sh
# (PMAT-589, infra#588), which exists because the pins there were hand-copied
# "latest" values with dates beside them -- 8 of 16 had gone stale, forjar itself
# among them. Bump this file in the SAME change that converges the fleet.
#
# CHANGING THE INSTRUMENT RE-RECORDS THE BASELINES. Three carry a
# `# tool_version=` header and are measured by these tools, so they move together
# with the versions below or the ratchets refuse:
#   scripts/shell_lint_baseline.txt   bashrs
#   scripts/complexity_baseline.txt   pmat
#   scripts/cb200_baseline.txt        pmat (mirrors .pmat-gates.toml [tdg] baseline)
#
# ci.yml used to run, per job:
#   command -v pmat > /dev/null 2>&1 || cargo install pmat --locked --quiet || true
#   cargo install bashrs --locked --quiet || true
# unpinned, PATH-first, and fail-open (the trailing `|| true` swallowed a
# failed install and carried on with whatever pmat/bashrs happened to already
# be on PATH). aprender also forbids self-hosted jobs from installing into the
# shared ~/.cargo/bin (scripts/check_cargo_install_private_root.sh,
# aprender#2353) — the fleet pin is the only thing allowed to put a binary
# there. This file is the aprender-side half of that contract: it names the
# version the fleet is supposed to have, so check_tool_versions.sh can fail
# closed the moment the two drift apart, instead of silently running whatever
# crates.io served at install time.
#
# Bump this file in the SAME commit as the infra forjar.yaml version bump.

[pmat]
version = "3.41.1"

[bashrs]
version = "7.4.1"
