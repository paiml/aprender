name: fixture-cuda-features-list-ok
on: [workflow_dispatch]
jobs:
  x86_64-cpu:
    runs-on: [self-hosted, clean-room]
    steps:
      - run: cargo test -p aprender-compute --lib
  aarch64-cuda-sm121:
    runs-on: [self-hosted, gpu, gx10]
    steps:
      - run: cargo test -p aprender-train --features "cuda,serve" --lib
