self-hosted-runner:
  # The real label set in use, from `grep -h runs-on .github/workflows/*.yml`
  # (BSE-01, PMAT-1062). `self-hosted`, `X64`/`x64`, `Linux`/`linux` and
  # `ARM64`/`arm64` are already known to actionlint; the rest are this fleet's
  # custom labels and would otherwise report "label ... is unknown" on every
  # self-hosted job.
  labels:
    - clean-room
    - intel
    - gpu
    - gx10
    - cuda
    - blackwell
    - yoga
    - ephemeral
    - docker
    - build
    - ARM64
    - gb10
    - ada
    - perf-solo
    # mini (Apple M4, #3204): the fleet's only macOS/arm64 runner. `mini` is the
    # one-box opt-in label (infra machines/gx10/forjar.yaml: an opt-in label names
    # ONE BOX, never a capability); apple-silicon/m4 describe it.
    - macOS
    - apple-silicon
    - m4
    - mini
