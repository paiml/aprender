self-hosted-runner:
  # The real label set in use, from `grep -h runs-on .github/workflows/*.yml`
  # (BSE-01, PMAT-1062). `self-hosted`, `X64`/`x64`, `Linux`/`linux` and
  # `ARM64`/`arm64` are already known to actionlint; the rest are this fleet's
  # custom labels and would otherwise report "label ... is unknown" on every
  # self-hosted job.
  labels:
    - clean-room
    - intel
    - gpu
    - gx10
    - cuda
    - blackwell
    # yoga: the fleet's x86_64 + Ada (sm_89) GPU runner, stood up 2026-09-08
    # (paiml/infra PMAT-263). `ada` is the generation label, the counterpart of
    # gx10's `blackwell`; `yoga` is the machine label. Added here because
    # cuda-nightly's ada-yoga leg selects on them literally — infra#352 requires
    # a guard to be able to SEE the labels a job selects, so they cannot be
    # hidden behind a matrix expression to dodge this list.
    - ada
    - yoga
