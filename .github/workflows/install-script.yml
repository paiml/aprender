# #3073 (operator rule 2026-09-10: no GitHub-hosted runners): runs on the
# clean-room pool like every other lightweight workflow (book.yml, etc.).
#
# Path-scoped to scripts/install.sh's own test suite (issue #3365) rather than
# folded into ci.yml's whole-repo job, because it does real network installs
# (a real stable release + a real nightly, per install_test.sh) and has no
# reason to run on every unrelated PR.
#
# Watches BOTH sides of the coupling, per book.yml's own documented lesson
# ("a parity gate must run when EITHER side moves; watching only one of them
# is how it comes to certify nothing", learned there the hard way twice):
# install.sh assumes a specific asset-naming shape from binary-release.yml
# (stable: apr-vX.Y.Z-<target>-<cpu|cuda>.tar.gz) and nightly.yml (nightly:
# apr-<target>.tar.gz, no variant suffix). A rename in either workflow breaks
# install.sh without a single line of install.sh itself changing.
name: apr install.sh

on:
  push:
    branches: [main]
    paths:
      - "scripts/install.sh"
      - "scripts/tests/install_test.sh"
      - "scripts/tests/install_e2e_container.sh"
      - ".github/workflows/install-script.yml"
      - ".github/workflows/binary-release.yml"
      - ".github/workflows/nightly.yml"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/tests/install_test.sh"
      - "scripts/tests/install_e2e_container.sh"
      - ".github/workflows/install-script.yml"
      - ".github/workflows/binary-release.yml"
      - ".github/workflows/nightly.yml"
  # #3676 rule 3 (scripts/check_workflow_path_filters.sh): a path filter is a
  # claim that nothing outside these paths can break this gate; the nightly run
  # re-checks the claim every day. Set ~5h early for the dispatch delay (#3292).
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read

jobs:
  test:
    name: install_test.sh
    runs-on: [self-hosted, Linux, X64, clean-room]
    steps:
      - uses: actions/checkout@v7

      # pmat/bashrs are pinned-fleet tools, never installed per-job (BSE-10a,
      # PMAT-1066) — see ci.yml's identical step for why.
      - name: pmat/bashrs must match the pinned fleet versions (never install)
        run: setsid --wait bash scripts/check_tool_versions.sh

      - name: "bashrs SEC/DET/IDEM (scripts/install.sh, scripts/tests/install_test.sh)"
        run: |
          bashrs lint --level error scripts/tests/install_test.sh
          # #3546: install.sh and the container e2e are held to 0 errors AND 0 warnings, not just 0 errors.
          for f in scripts/install.sh scripts/tests/install_e2e_container.sh; do
            out="$(bashrs lint "$f" 2>&1 | sed 's/\x1b\[[0-9;]*m//g')" || true  # bashrs colours even a pipe
            printf '%s\n' "$out" | grep -E 'Summary:'
            printf '%s\n' "$out" | grep -qE 'Summary: 0 error\(s\), 0 warning\(s\)' || { printf '%s\n' "$out"; exit 1; }
          done

      # Proves install_test.sh's own mutual-exclusivity row discriminates
      # before trusting the full run below — same discipline as
      # check_bashrs_gate.sh --self-test in ci.yml.
      - name: install_test.sh --self-test
        run: bash scripts/tests/install_test.sh --self-test

      # Full suite: real downloads from paiml/aprender's actual latest stable
      # release and the nightly prerelease. This is deliberately not mocked —
      # it is the same contract a user's `curl | sh` exercises.
      - name: install_test.sh
        run: bash scripts/tests/install_test.sh

  # #3546: the README one-liner end to end, per channel, nightly and on every install.sh change. See the script
  # header for the five checks. RED today on `apr --version` for any release built without APR_GIT_SHA_OVERRIDE
  # (it prints `+no-git`), which is the point: two rcs of one version must be told apart.
  e2e-container:
    name: curl | bash in a clean container (${{ matrix.channel }})
    runs-on: [self-hosted, Linux, X64, clean-room, docker]
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, rc]
    steps:
      - uses: actions/checkout@v7
      - name: Preflight - docker
        run: bash scripts/ci_self_hosted_preflight.sh --need docker
      - name: version comparator case table
        run: bash scripts/tests/install_e2e_container.sh --self-test
      - name: curl | bash --channel ${{ matrix.channel }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/tests/install_e2e_container.sh ${{ matrix.channel }}
