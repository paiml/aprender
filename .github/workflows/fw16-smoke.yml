# THROWAWAY (infra-8d, cop OK 2026-09-26): framework16 runner probes. Superseded
# by a2's routing PR. Not on main. Run 3: the clean-room container, as
# fat_driver starts it (long-lived, the workspace bind-mounted, docker exec).
name: fw16 smoke
on:
  push:
    branches: [fw16-smoke]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, aprender, framework16]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: clean-room container smoke
        run: |
          set -eu
          n="fw16-smoke-$GITHUB_RUN_ID"
          docker run -d --name "$n" --entrypoint tail -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            localhost:5000/sovereign-ci:stable -f /dev/null
          trap 'docker rm -f "$n" >/dev/null' EXIT
          docker exec "$n" sh -c 'id; cargo --version; rustc --version; ls /usr/local/rustup >/dev/null && echo rustup-home-ok; ls /workspace/Cargo.toml'
          docker exec "$n" sh -c 'cd /workspace && cargo metadata --format-version 1 --no-deps >/dev/null && echo cargo-metadata-ok'
