# THROWAWAY (infra-8d, cop OK 2026-09-26): framework16 runner probes. Superseded
# by a2's routing PR. Not on main. Run 2: the clean-room toolset preflight.
name: fw16 smoke
on:
  push:
    branches: [fw16-smoke]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, aprender, framework16]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: clean-room toolset preflight (the fleet-toolset probe)
        env:
          PREFLIGHT_OUT: ${{ runner.temp }}/preflight.json
        run: |
          rc=0; bash scripts/ci_self_hosted_preflight.sh || rc=$?
          cat "$PREFLIGHT_OUT" 2>/dev/null || true
          exit $rc
