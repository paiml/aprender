# Nightly Qwen-story regression cron + pmat bug-hunt manifest.
#
# Contract: contracts/qwen-story-v1.yaml § FALSIFY-QWEN-STORY-006.
# Runs `scripts/qwen-story.sh` against the canonical Qwen model registry,
# emits a pmat manifest of high-risk untested code in each beat's command
# modules, and opens (or comments on) a tracking issue when the manifest
# grows beyond a threshold.
#
# Self-hosted runners only — the story exercises ~30 GB of model files that
# don't fit on GitHub-hosted runners. Per memory rule
# `feedback_self_hosted_only`.

name: qwen-story-daily

on:
  schedule:
    # 04:17 UTC daily — off-peak for the self-hosted fleet.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      pmat_hunt:
        description: 'Run pmat bug-hunt manifest (1 = yes, 0 = skip for speed)'
        required: false
        default: '1'
      file_issue:
        description: 'File a tracking issue if manifest grows'
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write   # to open/comment on the tracking issue

concurrency:
  group: qwen-story-daily
  cancel-in-progress: false

jobs:
  story:
    name: Qwen story (apr-cli E2E)
    # THE SELECTOR NAMED A POOL THAT NO LONGER EXISTS. `[self-hosted, cuda, X64]`
    # resolved to the RTX 4090 lambda-labs runner, which aprender#2740 /
    # paiml/infra#359 REMOVED ("lambda-labs is the workstation and must never be
    # a CI host"). Nothing else in the org carries `cuda` + `X64`: the live
    # inventory is one gx10-blackwell runner and sixteen intel clean-room
    # runners. So this cron has queued and been cancelled every day since
    # 2026-08-30 — a dark lane, and exactly the failure the previous comment here
    # warned about, arriving from the other direction.
    #
    # gx10 is the fleet's only sanctioned GPU runner. Its labels are literal, not
    # a matrix expression, because paiml/infra#352 requires a selector that can
    # reach gx10 to name `gpu` and a guard can only check labels it can see.
    runs-on: [self-hosted, gpu, gx10, cuda, blackwell]
    # PP-19 / §5.4: this job now contends gx10 with cuda-nightly and
    # silicon-nightly, so it joins their host group. Groups are repo-wide, so the
    # shared name is what serialises the three. The workflow-level
    # `qwen-story-daily` group above still keeps this lane from overlapping
    # itself. Enforced by scripts/check_perf_concurrency_groups.sh.
    concurrency:
      group: perf-gx10
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      # Default to the runner user's $HOME/models (the models live there, e.g.
      # /home/noah/models). The old hardcoded /home/runner/models was the retired
      # runner's path → every beat SKIPped (missing model) even once scheduled.
      PMAT_HUNT: ${{ github.event.inputs.pmat_hunt || '1' }}
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install apr from HEAD
        shell: bash
        run: |
          set -euo pipefail
          cargo install --path crates/apr-cli --force --features cuda 2>&1 | tail -5

          # `cargo install` writes to ~/.cargo/bin. On this runner ~/.local/bin
          # comes FIRST in PATH and held a 24-day-old apr, so every previous run
          # of this story installed a fresh binary and then executed a stale one:
          #
          #   /home/noah/.local/bin/apr   0.60.0             2026-07-06  <- won
          #   /home/noah/.cargo/bin/apr   0.61.0 (e514cc5ed) 2026-07-30
          #
          # Detected because the format_parity gate reported its OLD result
          # shape (value/threshold 17/17, a token id) on a commit whose source
          # reports 64/64 decode steps. Put the freshly built binary first.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          # Fail closed on staleness. A path fix alone would silently rot again
          # the next time PATH changes; this asserts that the apr the story is
          # about to run IS the one just built from this checkout.
          #
          # This was hand-rolled as `GOT=$(apr --version)` compared against
          # Cargo.toml's version, which is weaker than it looks in two ways
          # (#2358): it read the version off a BARE `apr` - the exact defect the
          # step exists to catch, six lines under a comment explaining it - and
          # it compared only the VERSION, so any two builds of 0.63.0 matched,
          # including a month-old one. scripts/apr_bin.sh asks cargo for the
          # binary and compares the git SHA that build.rs embeds, so "fresh"
          # means built from THIS commit rather than tagged with this number.
          # APR_BIN_STRICT=1 makes "cannot prove" mean "refuse".
          export APR_BIN_STRICT=1
          . scripts/apr_bin.sh || {
            echo "::error::STALE or missing apr - the story would validate code that is not this commit."
            exit 1
          }
          echo "apr pinned to: $APR"
          "$APR" --version

      - name: Run scripts/qwen-story.sh
        id: story
        continue-on-error: true
        # `$?` after a pipeline is the LAST command's status - tee's - not the
        # script's. GitHub's DEFAULT shell is `bash -e {0}`, WITHOUT pipefail
        # (only an explicit `shell: bash` yields `-eo pipefail`), and `set +e`
        # above disables even errexit. So this step reported exit_code=0 for
        # every run since the cron was added: the "Fail the job" step at the
        # bottom and the issue-filing step were both unreachable, and three
        # consecutive green runs proved nothing.
        #
        # ${PIPESTATUS[0]} reads the FIRST pipeline element's status directly
        # and does not depend on any shell default. `set -o pipefail` is kept
        # as belt-and-braces so the step is correct under either reading.
        # This is the same pipe-then-$? defect scripts/qwen-story.sh:17-18
        # already warns about in its own header.
        shell: bash
        run: |
          set +e
          set -o pipefail
          bash scripts/qwen-story.sh 2>&1 | tee /tmp/story.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract pmat bug-hunt manifest
        id: manifest
        shell: bash
        run: |
          # Pull the pmat hunt lines out of the log into a structured artifact.
          #
          # The pattern used to be '^(    gap|    churn|    fault)' - FOUR
          # leading spaces - while qwen-story.sh emits these rows with EIGHT
          # (see the pmat_rows filters). So it matched nothing, on every run:
          # pmat-manifest.txt was 0 lines even on nights when the story log
          # plainly contained `        churn ...` rows, which in turn pinned
          # `growth` at 0 forever and made the "manifest grew by >5" alert
          # branch below unreachable. Anchor on leading whitespace instead of a
          # hardcoded indent so the two files cannot drift apart again.
          mkdir -p /tmp/qwen-story-artifacts
          grep -E '^[[:space:]]+(gap|churn|fault)[[:space:]]' /tmp/story.log \
            > /tmp/qwen-story-artifacts/pmat-manifest.txt || true
          LINES=$(wc -l < /tmp/qwen-story-artifacts/pmat-manifest.txt)
          echo "manifest_lines=$LINES" >> "$GITHUB_OUTPUT"
          # Compare against the last successful run's manifest (artifact from prior workflow).
          # If the manifest grew by >5 lines, flag it.
          PREV_LINES=$(gh run list --workflow=qwen-story-daily.yml --status=success --limit=1 \
            --json databaseId --jq '.[0].databaseId' 2>/dev/null \
            | xargs -I {} gh run download {} -n pmat-manifest -D /tmp/prev 2>/dev/null \
            && wc -l < /tmp/prev/pmat-manifest.txt 2>/dev/null || echo 0)
          GROWTH=$((LINES - PREV_LINES))
          echo "growth=$GROWTH" >> "$GITHUB_OUTPUT"
          echo "Previous manifest: $PREV_LINES lines, current: $LINES lines, growth: $GROWTH"

      - name: Upload pmat manifest artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pmat-manifest
          path: /tmp/qwen-story-artifacts/pmat-manifest.txt
          retention-days: 90

      - name: Upload story log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-log
          path: /tmp/story.log
          retention-days: 30

      # NOTE `continue-on-error`. This step NOTIFIES; it does not judge. When it
      # was allowed to fail it took the real verdict down with it: on 2026-07-31
      # it died with "could not add label: 'qwen-story-daily' not found", which
      # (a) made the job's error message about labels instead of about the story
      # and (b) skipped "Fail the job" below, because a step `if:` without a
      # status function carries an implicit `success()`. Notification failures
      # must never be able to mask or fake the story's own result.
      - name: File / update tracking issue on failure
        continue-on-error: true
        if: |
          (steps.story.outputs.exit_code != '0' ||
           fromJson(steps.manifest.outputs.growth || '0') > 5) &&
          (github.event.inputs.file_issue != 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          # Neither `qwen-story-daily` nor `regression` existed in this repo, so
          # `gh issue create --label qwen-story-daily,regression` had never once
          # succeeded - the alerting path was dead from the day it was written.
          # Create them idempotently rather than assuming a human did.
          for L in qwen-story-daily regression; do
            gh label create "$L" --description "Filed by qwen-story-daily" --force >/dev/null 2>&1 || true
          done
          TITLE="qwen-story-daily: story exit=${{ steps.story.outputs.exit_code }} manifest_growth=${{ steps.manifest.outputs.growth }}"
          # Look for an existing open issue with the qwen-story-daily label.
          EXISTING=$(gh issue list --label qwen-story-daily --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          {
            echo "## Qwen story daily run — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- Story exit code: \`${{ steps.story.outputs.exit_code }}\`"
            echo "- Pmat manifest lines: \`${{ steps.manifest.outputs.manifest_lines }}\` (growth: ${{ steps.manifest.outputs.growth }})"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "### Story log (tail)"
            echo '```'
            tail -50 /tmp/story.log
            echo '```'
            echo ""
            echo "### Manifest (top 20 lines)"
            echo '```'
            head -20 /tmp/qwen-story-artifacts/pmat-manifest.txt 2>/dev/null || echo "(empty)"
            echo '```'
          } > /tmp/issue-body.md
          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            echo "Filing new tracking issue"
            gh issue create --title "$TITLE" \
              --label qwen-story-daily,regression \
              --body-file /tmp/issue-body.md
          fi

      # `always() &&` is load-bearing. Without a status function GitHub prepends
      # an implicit `success()`, so ANY earlier step failing skips this one -
      # including the purely cosmetic issue-filing step above. That is exactly
      # what happened on 2026-07-31: the story really had failed, this step was
      # skipped, and the job's only error was about a missing label. The
      # authoritative verdict must not be conditional on the notifier's health.
      - name: Fail the job if the story failed
        if: always() && steps.story.outputs.exit_code != '0'
        run: |
          echo "::error::Qwen story exited with code ${{ steps.story.outputs.exit_code }}. See artifact 'story-log' for details."
          exit 1

      # Fail closed on a MISSING verdict. `exit_code` is written by the story
      # step; if that step is itself skipped or dies before the redirect, the
      # output is the empty string, `'' != '0'` is true, and the step above
      # already fails. This one covers the opposite hole: a story step that
      # somehow reports success without ever having produced a verdict.
      - name: The story must have produced a verdict
        if: always()
        run: |
          EC='${{ steps.story.outputs.exit_code }}'
          if [ -z "$EC" ]; then
            echo "::error::qwen-story.sh produced NO exit_code output - the run cannot be called green."
            exit 1
          fi
          echo "story verdict: exit_code=$EC"
