name: Release

# One command: gh workflow run release.yml -f version=0.73.0 [-f dry_run=true]
# Publish only (aprender#6886): gh workflow run release.yml -f version=0.72.5 -f publish_only=true -f dry_run=false
#   for a version the promote timer already tagged: no bump, no tag, no push. scripts/release/publish_tagged.sh takes the
#   night's CRUX receipts for the tag commit from nightly-evidence and runs that commit's cascade-publish.sh, which asks
#   clean-room on the exact tag commit and the publish preflight. Case table: falsify_publish_tagged.sh.
# bump on release/X.Y.Z -> infra clean-room on THAT sha -> tag -> cascade publish -> binary-release.
# KZ-001 item b, aprender#6729. Logic and case table: scripts/release/one_command.sh, falsify_one_command.sh.
# dry_run=true stops after the bump (WOULD lines): no push, no tag, no publish. Needs no crates.io token.
# Real run publishes via crates.io Trusted Publishing (OIDC, no stored CARGO_REGISTRY_TOKEN secret) and needs secret
# INFRA_ACTIONS_READ (clean-room dispatch on paiml/infra; name kept: release_lanes.sh and its falsifier rows reference it).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z to release (must be above the last tag)'
        required: true
        type: string
      dry_run:
        description: 'Stop after the bump; no push, tag or publish'
        default: true
        type: boolean
      sha:
        description: 'The green nightly sha to release (40 hex, on main). The release never builds from main HEAD (T5). Unused with publish_only'
        required: false   # one_command.sh still refuses a missing or malformed sha (exit 2); publish_only reads the tag
        default: ''
        type: string
      publish_only:
        description: 'Publish a version that is ALREADY TAGGED (by the promote timer). No bump, no tag, no push'
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write   # Trusted Publishing: OIDC exchange for a short-lived crates.io token
  actions: write    # gh workflow run binary-release.yml
  pull-requests: write   # T5: next_dev_bump.sh opens the X.(Y+1).0-dev bump PR on main after the tag

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, clean-room]
    environment: infra-read   # holds the INFRA_ACTIONS_READ the nightly release lanes read paiml/infra with; only main may use it (#6907)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: git identity
        run: |
          git config user.name "aprender-release"
          git config user.email "noreply@paiml.com"
      - id: auth
        if: ${{ !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: release
        env:
          GH_TOKEN: ${{ secrets.INFRA_ACTIONS_READ }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run && '1' || '0' }}
          SHA: ${{ inputs.sha }}
          NDB_GH_TOKEN: ${{ github.token }}   # GH_TOKEN above reads paiml/infra only
          PUBLISH_ONLY: ${{ inputs.publish_only && '1' || '0' }}
        run: |
          if [ "$PUBLISH_ONLY" = 1 ]; then
            bash scripts/release/publish_tagged.sh "$VERSION" "$DRY"
          else
            bash scripts/release/one_command.sh "$VERSION" "$DRY" "$SHA"
          fi
      - name: binary assets
        # publish_only: the promote timer's own printed step dispatches Binary Release for its tag; not repeated here
        if: ${{ !inputs.dry_run && !inputs.publish_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run binary-release.yml --ref "v$VERSION" -f tag="v$VERSION"
