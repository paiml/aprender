name: Coverage Nightly

# Coverage as scheduled automation (report-mode, non-blocking).
#
# Rationale: coverage is recurring maintenance, so it belongs in a cron job, not
# ad-hoc work. Until this existed, coverage ran nowhere in CI — the 96.35% figure
# was a local point-in-time number, never tracked. This job measures nightly,
# surfaces the ranked gaps via the pinned analyser's `query --coverage-gaps` (the dogfooded
# analysis CLAUDE.md mandates), and keeps a single tracking issue up to date so
# the autonomous loop can fix the top gaps as small `test(...)` PRs.
#
# RATCHET MODE (promoted 2026-07-29, as this header always intended). The step
# below no longer ends in `|| true`. It enforces COV_FLOOR - the last MEASURED
# value - so red means coverage REGRESSED, not that the 95% target is unmet.
#
# It could not be armed before now because the measurement was broken: every run
# reported `TOTAL: 0/0 lines covered (0%)` (phase 2 scoped its report to the root
# facade - fixed in #2333). Arming on top of that would have pinned the nightly
# red forever. First real number, 2026-07-29 on 95145584f:
# 786448/885829 = 88.78%, NOT the 96.35% that had been quoted since before the
# measurement ever worked.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC — ahead of the 04:00 binary nightly
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # open/update the single coverage tracking issue

concurrency:
  group: coverage-nightly
  cancel-in-progress: true

jobs:
  coverage:
    # intel-clean-room pool (15 runners, large RAM) — right fit for a heavy
    # full-workspace llvm-cov run. The `clean-room` label pins to that pool.
    runs-on: [self-hosted, Linux, X64, clean-room]
    timeout-minutes: 75
    env:
      IMAGE: localhost:5000/sovereign-ci:stable
      # PER-RUN PRIVATE TOOL ROOT (#2353). mac-server runs 16 runners under ONE
      # $HOME, so $HOME/.cargo/bin is shared mutable state across every
      # concurrent job. `cargo install` replaces a binary there; a job that is
      # mid-run and execs that same path gets whatever exists at that instant.
      # On 2026-07-31 this job died with
      #   could not execute process `/home/noah/.cargo/bin/cargo-llvm-cov`
      #   (never executed) No such file or directory (os error 2)
      # and reported an EMPTY coverage figure into the tracking issue — a
      # MISSING measurement, the class project_coverage_floor_measurement_broken
      # is about. ENOENT on an absolute path means the path did not exist when
      # exec'd, which nothing but a concurrent writer to that path can produce.
      #
      # The fix removes the shared path rather than retrying around it: every
      # `cargo install` in this job lands in a directory private to THIS job,
      # which no other job can address. Note this deliberately redirects only
      # the INSTALL ROOT, not CARGO_HOME (which is what the `security` job
      # isolates): the registry/git caches under ~/.cargo are guarded by cargo's
      # own package-cache lock and are safe to share, while a private CARGO_HOME
      # would re-download the whole dependency graph every night for no gain.
      #
      # 2026-08-30: that root moved off /tmp. /tmp is emptied at boot, so a
      # root there HALF-persists — it survives between jobs on a long-lived
      # self-hosted box and vanishes on reboot. That is the shape paiml/infra's
      # shared-$HOME guard blocks as `cargo-install-boot-volatile`. $RUNNER_TEMP
      # lives under the runner's own _work tree and is wiped per JOB: private
      # for the same reason the per-run name was, and it never half-persists,
      # so the compile is paid honestly every run.
      #
      # Defined HERE, in the job `env:`, and not only via $GITHUB_ENV in a step:
      # `scripts/check_runner_labels.sh` reads the workflow STATICALLY and fails
      # a job that interpolates a variable its `env:` does not define — because
      # an undefined shell variable is the empty string, so the step runs, goes
      # green, and silently stops doing what it says. A $GITHUB_ENV assignment
      # is correct at runtime but invisible to that reader, so it would trade a
      # real /tmp defect for a real blind spot.
      #
      # `github.workspace` IS available in a job-level `env:` where `runner` is
      # not (GitHub rejects `Unrecognized named-value: runner`), and its parent
      # is inside the runner's own _work tree: job-private, off the boot volume,
      # and nowhere near the shared $HOME.
      COV_TOOLS: ${{ github.workspace }}/../apr-cov-tools
      CARGO_INSTALL_ROOT: ${{ github.workspace }}/../apr-cov-tools
    steps:
      # clean: false — a coverage run builds from source and doesn't need a
      # pristine tree, and the default git-clean choked on root-owned leftovers
      # (e.g. contracts/.pv/cache from prior `pv` jobs → EACCES on rmdir),
      # failing checkout before any coverage ran.
      - uses: actions/checkout@v7
        with:
          clean: false

      # Provision cargo-llvm-cov WITHOUT touching ~/.cargo/bin (#2353).
      #
      # Preferred source is the copy already baked into sovereign-ci at
      # /usr/local/cargo/bin/cargo-llvm-cov — verified 2026-08-13 on mac-server
      # to be the SAME version the runtime install was producing (0.8.7) and to
      # execute on the host once copied out (host glibc 2.35). Using it costs a
      # 4.5MB file copy instead of a ~5.5min compile, and the binary is pinned
      # to whatever the image ships rather than to whatever crates.io has today.
      #
      # Fallback (image not cached / registry down / binary won't run here):
      # compile it, but with an explicit --root so it STILL never lands in
      # ~/.cargo/bin. Both paths write only to $COV_TOOLS.
      #
      # Fail closed. A coverage run without a working cargo-llvm-cov must be RED
      # here, not a green job that reports an empty percentage.
      - name: Provision cargo-llvm-cov into the job-private root
        run: |
          set -euo pipefail
          mkdir -p "$COV_TOOLS/bin"
          src="none"
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            # --user: without it the copy lands root-owned and the cleanup step
            # (running as the runner user) cannot remove it.
            if docker run --rm --user "$(id -u):$(id -g)" \
                 -v "$COV_TOOLS/bin:/out" --entrypoint sh "$IMAGE" \
                 -c 'cp /usr/local/cargo/bin/cargo-llvm-cov /out/'; then
              src="image"
            else
              echo "::warning::could not copy cargo-llvm-cov out of $IMAGE — will build it"
            fi
          else
            echo "sovereign-ci image not cached on this runner — will build the tool"
          fi
          if [ "$src" = "image" ]; then
            if ! "$COV_TOOLS/bin/cargo-llvm-cov" llvm-cov --version; then
              echo "::warning::baked cargo-llvm-cov does not run on this host — falling back to cargo install"
              rm -f "$COV_TOOLS/bin/cargo-llvm-cov"
              src="none"
            fi
          fi
          if [ "$src" = "none" ]; then
            export PATH="$COV_TOOLS/bin:$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
            cargo install cargo-llvm-cov --locked --root "$COV_TOOLS"
            src="cargo-install"
          fi
          # Prove the mechanism engaged: name the file that will actually run.
          # Under `set -e` this last check is the fail-closed gate — no working
          # tool here means a RED job, never a green one reporting no number.
          echo "provisioned from: $src"
          ls -l "$COV_TOOLS/bin/cargo-llvm-cov"
          "$COV_TOOLS/bin/cargo-llvm-cov" llvm-cov --version
          # Ahead of ~/.cargo/bin for every later step in this job.
          echo "$COV_TOOLS/bin" >> "$GITHUB_PATH"

      # Data + summary via the maintained Makefile machinery (handles the
      # mold-linker/config.toml dance + slow-test skips correctly). Non-blocking.
      # COV_TARGET_DIR= forces the writable workspace-local ./target: the Makefile
      # otherwise picks /mnt/nvme-raid0/targets/aprender whenever /mnt/nvme-raid0
      # exists (it does on the runner) but it isn't writable by the runner user.
      - name: Coverage (cargo llvm-cov via make)
        id: cov
        run: |
          set -o pipefail
          # The 15 intel runners aren't uniformly provisioned: cargo may be off
          # PATH for a raw `run:` step, so put it there for the make subshell.
          # $COV_TOOLS/bin goes FIRST so the Makefile's `which cargo-llvm-cov`
          # short-circuits on the private copy — if ~/.cargo/bin led here, the
          # private root would be decorative and #2353 would still be live.
          export PATH="$COV_TOOLS/bin:$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          # Assert it, don't assume it: a measurement run must prove which
          # binary it is about to use, not describe its intent.
          resolved="$(command -v cargo-llvm-cov || true)"
          echo "cargo-llvm-cov resolves to: ${resolved:-<none>}"
          case "$resolved" in
            "$COV_TOOLS/bin/"*) ;;
            *)
              echo "::error::cargo-llvm-cov resolved to '${resolved:-<none>}', not the job-private root $COV_TOOLS/bin"
              echo "::error::a concurrent job could replace that path mid-run (aprender#2353)"
              exit 1
              ;;
          esac
          # ARMED (was `|| true`). `make coverage` now enforces a RATCHET floor
          # (COV_FLOOR, the last measured value) rather than the aspirational 95%
          # target, so a red here means coverage went DOWN - not that we have not
          # reached 95% yet. set -o pipefail above makes the tee transparent.
          # Do NOT let a failing `make` abort before the output is written.
          # The default shell here is `bash -e`, so with `set -o pipefail` a
          # coverage failure killed this step at the `make` line -- the two
          # lines below never ran, `steps.cov.outputs.pct` stayed UNSET, and
          # the report steps (`if: always()`) rendered a BLANK figure:
          #     **Line coverage: ** (target >= 95%)
          # An empty number where a percentage belongs reads as "nothing to
          # see"; the whole point of the `${pct:-unknown}` fallback was to say
          # so out loud. Observed on the 2026-08-19 run, where the real cause
          # was a corrupted llvm-cov target dir after the power outage.
          #
          # ${PIPESTATUS[0]} is `make`'s status, NOT tee's -- reading `$?`
          # through a pipe is the recurring defect this repo has shipped twice
          # (#2336 qwen-story-daily, #2360 make publish).
          set +e
          make coverage COV_TARGET_DIR= 2>&1 | tee /tmp/cov.log
          cov_rc=${PIPESTATUS[0]}
          set -e
          pct="$(grep -oE 'TOTAL: [0-9]+/[0-9]+ lines covered \([0-9]+%\)' /tmp/cov.log | tail -1 | grep -oE '[0-9]+%' || true)"
          echo "pct=${pct:-unknown}" >> "$GITHUB_OUTPUT"
          # Still fails the job on a real coverage regression: the gate stays
          # ARMED, it just reports a value first.
          exit "$cov_rc"

      # The analyser is resolved through scripts/pmat_bin.sh (PMAT-1059/G-10,
      # #2999), never installed here: this job runs on the self-hosted
      # clean-room pool, which already carries the pinned analyser on PATH
      # (paiml/infra forjar, PMAT-231) — the resolver accepts it because the
      # version matches. Resolving it in its own step fails the job early and
      # explicitly if the fleet ever drifts off the pin, rather than the old
      # `|| true` which let a missing/wrong analyser pass silently.
      - name: Resolve pinned analyser
        run: |
          export PATH="$COV_TOOLS/bin:$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          . scripts/pmat_bin.sh || exit 1

      # Dogfooded gap analysis — analyser query, NOT raw llvm-cov output (CLAUDE.md).
      # Same default ./target as the make step so the analyser finds the coverage profiles.
      - name: Gap analysis (coverage-gaps via the pinned analyser)
        id: gaps
        if: always()
        run: |
          export PATH="$COV_TOOLS/bin:$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          . scripts/pmat_bin.sh || exit 1
          "$PMAT" query --coverage-gaps --exclude-tests --limit 30 > /tmp/gaps.txt 2>/dev/null \
            || echo "(coverage-gaps returned no data — coverage profile missing?)" > /tmp/gaps.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Coverage — $(date -u +%Y-%m-%d)"
            echo ""
            # aprender#2627: this read `${COV_THRESHOLD:-95}`. COV_THRESHOLD is
            # a *Makefile* variable; it is not exported, so the shell here never
            # had it and the `:-95` fallback fired on every run since the line
            # was written. The summary therefore always printed the aspirational
            # 95% while `make coverage` enforces COV_FLOOR (88) -- the report
            # named a gate that is not the gate. Read both from the Makefile so
            # the summary cannot drift from what is enforced.
            COV_FLOOR="$(make -s --eval='print-floor: ; @echo $(COV_FLOOR)' print-floor 2>/dev/null || echo unknown)"
            COV_THRESHOLD="$(make -s --eval='print-target: ; @echo $(COV_THRESHOLD)' print-target 2>/dev/null || echo unknown)"
            echo "**Line coverage: ${{ steps.cov.outputs.pct }}** (enforced floor ${COV_FLOOR}%, target ${COV_THRESHOLD}%)"
            echo ""
            echo "### Top uncovered functions (\`query --coverage-gaps --exclude-tests\` via the pinned analyser)"
            echo '```'
            head -30 /tmp/gaps.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Single self-updating tracking issue — the loop's worklist.
      - name: Update coverage tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Nightly coverage report"
          body="$(printf '%s\n' \
            "_Auto-updated by Coverage Nightly — $(date -u +%Y-%m-%dT%H:%MZ)._" \
            "" \
            "**Line coverage: ${{ steps.cov.outputs.pct }}** (target ≥ 95%)" \
            "" \
            "### Top uncovered (\`--coverage-gaps --exclude-tests\` via the pinned analyser)" \
            '```' \
            "$(head -30 /tmp/gaps.txt)" \
            '```' \
            "" \
            "The autonomous loop fixes top gaps as small \`test(...)\` PRs. Per Rule 7, coverage and contracts co-evolve — each gap fix also adds/strengthens a contract." )"
          num="$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body" && echo "updated issue #$num"
          else
            gh issue create --title "$title" --body "$body" && echo "created tracking issue"
          fi

      # A tool root that is never removed is just a slower leak. Drop
      # this run's, then sweep any orphan left by a hard-killed run (which skips
      # even `if: always()` steps — the same failure mode the workspace-test
      # ownership-restore step exists for).
      - name: Remove the job-private tool root
        if: always()
        run: |
          # Never `rm -rf` an unvalidated variable: if the resolve step above
          # died, COV_TOOLS is unset and this would be `rm -rf ""`.
          if [ -n "${COV_TOOLS:-}" ]; then rm -rf "$COV_TOOLS"; fi
          # Legacy sweep: roots left under /tmp by runs from before the move to
          # $RUNNER_TEMP. Nothing new lands there — $RUNNER_TEMP is wiped per
          # job — so this only reaps what earlier runs abandoned.
          find /tmp -maxdepth 1 -name 'apr-cov-tools-*' -uid "$(id -u)" -mtime +1 \
            -exec rm -rf {} + 2>/dev/null || true
