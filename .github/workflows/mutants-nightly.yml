name: Mutants Nightly

# #4142 (operator ruling via the cop, 2026-09-24): the PR `mutants` job caps a diff at MUTANTS_CAP mutants and is
# RED "too many to judge" above it. This run is the other half: every night it mutates everything merged to main
# since the newest SUCCESSFUL nightly (the last 24 hours on a first run) across the WORKSPACE with no cap, through
# the same scripts/mutants_diff_gate.sh, so nothing that merged is left unjudged. A survivor turns this run red and
# names itself.

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read # the newest successful run's head is the diff base

concurrency:
  group: mutants-nightly
  cancel-in-progress: false

jobs:
  mutants:
    runs-on: [self-hosted, Linux, clean-room]
    timeout-minutes: 360
    env:
      IMAGE: localhost:5000/sovereign-ci:stable
      MUTANTS_JOBS: ${{ vars.MUTANTS_NIGHTLY_JOBS || '8' }}
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal)
        # Same guard as the PR mutants job: a hard-killed docker job leaves root-owned files behind.
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "$IMAGE" \
              bash -c 'chown -R 1000:1000 /workspace 2>/dev/null || true'
          else
            echo "Image not cached — no prior docker job on this runner, nothing to restore"
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Everything merged since the last nightly that JUDGED main, as a diff
        id: day
        # Not a rolling "24 hours ago" window: that has no memory, so one missed or failed run would drop a day of
        # merges for good (degraded quorum, Sonnet, #4142). The base is the head of the newest SUCCESSFUL run of
        # this workflow, if it is an ancestor of HEAD; otherwise (first run, or a rewritten main) it is the last
        # 24 hours, and the log says which base was used and why.
        # REST with curl + python3, never `gh`: the fleet boxes carry no gh (scripts/ci_self_hosted_preflight.sh,
        # #3074), and a missing gh swallowed by `|| true` would read as "no prior run" every night (Sonnet, #4142).
        # A listing that FAILS is red; only a listing that SUCCEEDS with zero runs means "first run".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          if ! LAST=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                   "$API/actions/workflows/mutants-nightly.yml/runs?branch=main&status=success&per_page=1" \
                 | python3 -c 'import json,sys; r=json.load(sys.stdin)["workflow_runs"]; print(r[0]["head_sha"] if r else "")'); then
            echo "::error::could not list successful mutants-nightly runs -- refusing to guess a base"
            exit 1
          fi
          if [ -n "$LAST" ] && git merge-base --is-ancestor "$LAST" HEAD 2>/dev/null; then
            SINCE=$LAST; WHY="the newest successful mutants-nightly run judged ${LAST:0:9}"
          else
            SINCE=$(git rev-list -n1 --before='24 hours ago' HEAD)
            WHY="no successful prior run whose head is an ancestor of HEAD (got '${LAST:0:9}'): falling back to 24 hours"
          fi
          if [ -z "$SINCE" ]; then
            echo "::error::no base commit for the nightly diff ($WHY) -- refusing rather than judging nothing"
            exit 1
          fi
          git diff "$SINCE" HEAD > day.diff
          echo "day.diff: ${SINCE:0:9}..$(git rev-parse --short=9 HEAD) -- $WHY; $(wc -l < day.diff) lines"
      - name: Pull sovereign-ci image (with retry + local-cache fallback)
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already cached locally — skipping pull"
            exit 0
          fi
          for i in $(seq 1 15); do
            if docker pull "$IMAGE"; then exit 0; fi
            sleep $((4 + 6 * i))
          done
          echo "::error::Registry localhost:5000 unreachable after 15 attempts AND image not in local cache"
          exit 1
      - name: Mutate the day's merges across the workspace (no cap)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e MUTANTS_JOBS \
            "$IMAGE" \
            bash -c '
              set -uo pipefail
              # Private install root, per scripts/check_cargo_install_private_root.sh.
              export CARGO_INSTALL_ROOT=/usr/local/cargo-mutants-root
              export PATH="$CARGO_INSTALL_ROOT/bin:$PATH"
              if ! cargo mutants --version > /dev/null 2>&1; then
                cargo install cargo-mutants --locked --version 27.1.0 > /tmp/mi.log 2>&1 || {
                  echo "::error::cargo-mutants install failed; the nightly cannot run"
                  tail -20 /tmp/mi.log
                  exit 1
                }
              fi
              cargo mutants --version || { echo "::error::cargo-mutants not runnable after install"; exit 1; }
              # the crates ci.yml workspace-test --excludes, derived from its nextest line (see ci.yml mutants)
              EXCL=$(grep -m1 -E "^[[:space:]]+cargo nextest run --profile ci --workspace --lib" .github/workflows/ci.yml \
                | grep -oE -- "--exclude [a-z0-9_-]+" | sed "s/^--exclude /--exclude-crate /" | tr "\n" " ")
              [ -n "$EXCL" ] || { echo "::error::no --exclude list found on the workspace-test nextest line"; exit 1; }
              # shellcheck disable=SC2086
              bash scripts/mutants_diff_gate.sh day.diff --cap 0 --jobs "$MUTANTS_JOBS" --max-missed 0 --out mutants-gate $EXCL
            '
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-nightly
          path: mutants-gate/
