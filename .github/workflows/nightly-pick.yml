# Nightly pick: ONE job picks the night's candidate C and publishes it as refs/heads/nightly/<night>.
#
# Every producer measures that C, the nightly train prints its line for that C, and a release
# promotes that C. The ref is created once and never moved (a create-only push: its lease expects the ref absent), so a
# merge to main after the pick cannot change the night's line. Contract: contracts/nightly-pick-v1.yaml.
#
# WHY A PICK, NOT CRON SPACING. Scheduled events here fire 1h43m to 5h48m late (14 nights measured),
# so producers that each read main's head at their own start judge different commits in one night.
# A producer chains from this workflow (workflow_run on "Nightly pick", or a dispatch carrying the
# night) and runs `scripts/release/nightly_pick.sh verify --night N --sha <what it built>`.
#
# The schedule below is a fallback trigger only. A dispatch is the reliable one, and a re-pick is
# idempotent: it prints KEPT and leaves the ref as it is. The night is the UTC date of (created_at - 12h)
# of this run, so a pick that fires late still lands on its own night, and a rerun the next evening
# lands on the night its producers build (they read the same created_at), never on the next one.
#
# The ref is a BRANCH because repository rulesets cover only branches and tags; a ruleset on refs/heads/nightly/*
# (update, deletion and non-fast-forward refused; creation allowed; no bypass) keeps it immutable on the server. It is
# pushed with this workflow's GITHUB_TOKEN, so creating it fires no workflow. The rolling tag refs/tags/nightly is never C.
#
# REPORT-ONLY. Nothing reads refs/heads/nightly/* yet; no job here gates anything.
name: Nightly pick

on:
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read # this run's own created_at, which is the night (a rerun keeps it)

concurrency:
  group: nightly-pick
  cancel-in-progress: false

jobs:
  pick:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, clean-room]
    timeout-minutes: 10
    outputs:
      night: ${{ steps.pick.outputs.night }}
      c: ${{ steps.pick.outputs.c }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Picker case table
        run: bash scripts/release/nightly_pick.sh --self-test

      - name: Pick C for the night
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # the clock the producers read (workflow_run.created_at), not now: a rerun after noon UTC the next
          # day would otherwise pick the next night while every chained producer builds this one
          at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          night="$(bash scripts/release/nightly_pick.sh night --at "$at")"
          rc=0
          bash scripts/release/nightly_pick.sh pick --night "$night" --sha "$GITHUB_SHA" || rc=$?
          [ "$rc" -eq 0 ] || { echo "pick exited $rc"; exit "$rc"; }
          c="$(bash scripts/release/nightly_pick.sh resolve --night "$night")"
          {
            echo "night=$night"
            echo "c=$c"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Nightly pick"
            echo ""
            echo "| night | C | main at pick |"
            echo "|---|---|---|"
            echo "| $night | \`$c\` | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"
