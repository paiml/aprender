# PR Authorization Gate — block PRs from unauthorized contributors
# Calls reusable workflow from paiml/.github
name: PR Gate

on:
  pull_request:
    types: [opened, reopened]

# RS-01 (infra#3828): one run per PR; a reopen supersedes the run it replaces.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  authorize:
    # Fork PRs never run privileged steps (paiml accepts no fork contributions).
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    uses: paiml/.github/.github/workflows/pr-gate.yml@main

  no-pull-request-target:
    # P0 guard: a workflow that reintroduces the pull_request_target trigger fails here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, clean-room]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # G5 (infra#3828): a PR gate makes 0 network fetches. yq v4.52.2 is provisioned on the runner;
      # this step asserts it and never downloads. A missing or wrong yq is RED, never fetched.
      - name: yq v4.52.2 is provisioned for the pull_request_target guard (no download; fail closed)
        run: |
          set -euo pipefail
          command -v yq > /dev/null 2>&1 || { echo "::error::yq is not provisioned on this runner (pinned v4.52.2); the gate does not download it"; exit 1; }
          case "$(yq --version 2>&1)" in *" v4.52.2") ;; *) echo "::error::yq is '$(yq --version 2>&1)', not v4.52.2 (provision it; the gate does not download it)"; exit 1 ;; esac
      - name: guard and its fixture test
        run: sh scripts/guards/test-no-pull-request-target-guard.sh && sh scripts/guards/no-pull-request-target-guard.sh
