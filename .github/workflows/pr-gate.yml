# PR Authorization Gate — block PRs from unauthorized contributors
# Calls reusable workflow from paiml/.github
name: PR Gate

on:
  pull_request:
    types: [opened, reopened]

# RS-01 (infra#3828): one run per PR; a reopen supersedes the run it replaces.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  authorize:
    # Fork PRs never run privileged steps (paiml accepts no fork contributions).
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    uses: paiml/.github/.github/workflows/pr-gate.yml@main

  no-pull-request-target:
    # P0 guard: a workflow that reintroduces the pull_request_target trigger fails here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, clean-room]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin yq v4.52.2 for the pull_request_target guard (sha256-verified, fail closed)
        env:
          YQ_BASE: https://github.com/mikefarah/yq/releases/download/v4.52.2
          YQ_SHA256_AMD64: a74bd266990339e0c48a2103534aef692abf99f19390d12c2b0ce6830385c459
          YQ_SHA256_ARM64: c82856ac30da522f50dcdd4f53065487b5a2927e9b87ff637956900986f1f7c2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) YQ_URL="$YQ_BASE/yq_linux_amd64"; YQ_SHA256="$YQ_SHA256_AMD64" ;;
            aarch64 | arm64) YQ_URL="$YQ_BASE/yq_linux_arm64"; YQ_SHA256="$YQ_SHA256_ARM64" ;;
            *) echo "::error::no pinned yq for arch $(uname -m)"; exit 1 ;;
          esac
          d="$RUNNER_TEMP/yq-4.52.2"
          mkdir -p "$d"
          curl -fsSL --retry 3 --retry-delay 5 -o "$d/yq" "$YQ_URL"
          printf '%s  %s\n' "$YQ_SHA256" "$d/yq" | sha256sum -c -
          chmod +x "$d/yq"
          echo "$d" >> "$GITHUB_PATH"
      - name: guard and its fixture test
        run: sh scripts/guards/test-no-pull-request-target-guard.sh && sh scripts/guards/no-pull-request-target-guard.sh
