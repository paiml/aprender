name: Binary Release

# Attaches cross-compiled `pv` binaries (provable-contracts CLI from
# crates/aprender-contracts-cli) to a GitHub Release as tar.gz +
# sha256. Decoupled from `cargo publish` — downstream consumers can
# `curl` the prebuilt binary instead of `cargo install
# aprender-contracts-cli --locked` (which compiles a large workspace
# from source and is slow on cold caches).
#
# The aprender workspace ships dozens of crates; the `pv` lane scopes
# itself to `aprender-contracts-cli`. The `apr-cuda` and `apr-cpu` lanes
# below ship FOUR `apr` binaries per tag — {cuda, cpu} x {x86_64, aarch64} —
# an operator HARD REQUIREMENT for every tag and every release (2026-09-10,
# PMAT-1096/PMAT-1098, row 67-A1 of docs/specifications/06x-release-schedule.md,
# Alfredo's #2869): a release without all four is not done, and
# `verify-apr-assets` FAILS the workflow when any is missing. v0.66.0 shipped
# ZERO apr binaries and nothing was red — the verify job asked about two
# assets, and only after a build lane that had already died. The question is
# now one script, `scripts/check_release_assets.sh`, shared by this workflow,
# `scripts/release_criteria.sh` C13 and the post-publish dogfood.
#
# The CUDA lane runs on the SELF-HOSTED fleet only — operator rule
# (2026-09-10): we do not use hosted GitHub runners; we use gx10, lambda
# or yoga. aarch64 builds on gx10 (GB10 sm_121), x86_64 on yoga (RTX 4090
# sm_89; lambda when it is registered). No CUDA toolkit is needed at build
# time — aprender-gpu's `cuda` feature is `dep:libloading`, the driver
# (libcuda.so) is loaded at RUNTIME.
#
# The build runs INSIDE `rust:1.93.0-bullseye` (glibc 2.31, rustc 1.93.0 =
# rust-toolchain.toml's pin; the x86_64 image on yoga, the arm64 image on
# gx10 — both measured 2026-09-10), because a gnu binary's glibc floor is
# its BUILDER's glibc: the first v0.66.0 assets were built natively and
# came out needing GLIBC_2.43 (yoga is Ubuntu 26.04) and 2.39 (gx10 is
# 24.04) — the x86_64 one does not even start on lambda's 22.04
# (`libm.so.6: version GLIBC_2.43 not found`). The floor recorded in the
# job summary is the CONTAINER's `ldd --version`, never the host's. gx10's
# runner user is not in the docker group but has passwordless sudo, hence
# the `sudo -n docker` fallback (moot on the disposable runners, whose user
# is in the docker group). The lane's runs-on carries `ephemeral,docker`: it
# runs on the forjar-managed disposable runner containers (paiml/infra
# machines/<box>/forjar-ephemeral.yaml — one container per job, --ephemeral,
# nvidia runtime), never on the persistent actions.runner.* services.
# What each check proves:
# the loader string `libcuda.so` is in the artifact ONLY under `--features
# cuda` (1 vs 0, measured on 0.66.0 builds of both kinds) — that proves
# the feature is in the bytes; `apr gpu --json` on the yoga (sm_89) and
# gx10 (sm_121) runners proves the asset runs and sees the device on a
# real GPU host (it reads nvidia-smi, so it is a host proof, not a
# feature proof). Together: the downloaded binary is a CUDA binary that
# runs on both architectures.
#
# Triggered by:
#   - `release: published` — fires automatically on each tagged release
#   - `workflow_dispatch` — manual re-run / backfill, takes a tag input
#
# Targets: 4 Linux (x86_64/aarch64 × musl/gnu). musl variants are
# static and ideal for Docker / scratch / Alpine; gnu variants are
# smaller and match typical Linux distributions. aarch64 builds use
# `cross`. Strip uses the matching ${triple}-strip per target — the
# musl cross image lacks gnu-strip and vice-versa (lessons from
# pmat v3.16.0 first-run failure on aarch64-musl).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v0.31.2)'
        required: true
        type: string

permissions:
  contents: write  # upload assets to the release

concurrency:
  group: pv-binary-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CROSS_VERSION: v0.2.5

jobs:
  build:
    name: pv ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross: false
          - target: x86_64-unknown-linux-gnu
            cross: false
          - target: aarch64-unknown-linux-musl
            cross: true
          - target: aarch64-unknown-linux-gnu
            cross: true
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved (release event missing tag_name and no dispatch input)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building pv for $TAG → ${{ matrix.target }}"

      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The workspace pins a specific channel in `rust-toolchain.toml`
      # which overrides the dtolnay action for any cargo invocation in
      # the tree. Add the target explicitly to that pinned toolchain so
      # native cross-compiles (x86_64-musl) don't fail with `can't find
      # crate for core` mid-build.
      - name: Install target on workspace-pinned toolchain
        if: ${{ !matrix.cross }}
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cross
        if: matrix.cross
        run: |
          dir="$RUNNER_TEMP/cross"
          mkdir -p "$dir"
          curl -sL "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pv-binary-${{ matrix.target }}

      - name: Build pv
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin pv -p aprender-contracts-cli --target ${{ matrix.target }} --locked
          else
            cargo build --release --bin pv -p aprender-contracts-cli --target ${{ matrix.target }} --locked
          fi

      - name: Strip binary
        run: |
          TARGET="${{ matrix.target }}"
          BIN_PATH="target/${TARGET}/release/pv"
          case "$TARGET" in
            aarch64-unknown-linux-musl) STRIP=aarch64-linux-musl-strip ;;
            aarch64-unknown-linux-gnu)  STRIP=aarch64-linux-gnu-strip ;;
            *)                          STRIP="" ;;
          esac
          if [ -n "$STRIP" ]; then
            docker run --rm -v "$PWD/target:/target:Z" \
              "ghcr.io/cross-rs/${TARGET}:main" \
              "$STRIP" "/$BIN_PATH"
          else
            strip "$BIN_PATH"
          fi
          ls -la "$BIN_PATH"

      - name: Package archive
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="pv-${VERSION}-${TARGET}"
          mkdir -p "$ARCHIVE"
          cp "target/${TARGET}/release/pv" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          du -h "${ARCHIVE}.tar.gz"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.sha }}" \
            --clobber

  build-apr-cuda:
    name: apr (cuda) ${{ matrix.target }} on ${{ matrix.host }}
    runs-on: ${{ fromJSON(matrix.labels) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: yoga
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga", "ephemeral", "docker"]'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10", "ephemeral", "docker"]'
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved (release event missing tag_name and no dispatch input)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building apr --features cuda for $TAG → ${{ matrix.target }}"

      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # FIRST thing this box does after it has a working tree. Run 34448908554
      # built a 21 MB CUDA asset here and then died on `gh: command not found`
      # at the upload — forty minutes of GPU spent on a shell error a one-second
      # check names at second zero. `docker` and `objdump` are named because
      # this job's later steps use them; `gh` is NOT, because the upload below
      # is REST (#3074).
      - name: Preflight — this box has the tools this job assumes
        run: bash scripts/ci_self_hosted_preflight.sh --cuda --need docker objdump

      # Build inside rust:1.93.0-bullseye: the container's glibc (2.31) is the
      # asset's floor, the image's rustc is the workspace pin, the target is the
      # image's native one. Host caches for the registry and the target dir.
      - name: Build apr with --features cuda inside rust:1.93.0-bullseye (glibc 2.31 floor)
        run: |
          DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER="sudo -n docker"
          # The runner is itself a disposable container (labels ephemeral,docker — infra
          # machines/<box>/forjar-ephemeral.yaml): the bullseye build is a SIBLING container
          # through the mounted socket, so every bind-mount path must exist on the HOST at
          # the same path. The work root is mirrored host<->container; $HOME is not.
          CACHE="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/cache-apr-cuda/${{ matrix.target }}"
          mkdir -p "$CACHE/registry" "$CACHE/target"
          # The bind-mount TARGET inside the workspace must exist BEFORE the container
          # starts: when it does not, dockerd creates the mountpoint as root, and after
          # the container exits the workspace carries an empty root-owned `target/` the
          # runner (uid 1001) cannot write — run 34488955316 built the asset in 1m54s and
          # then died on `mkdir: cannot create directory 'target/aarch64-unknown-linux-gnu':
          # Permission denied`. Pre-creating it as the runner keeps the ownership.
          mkdir -p "$GITHUB_WORKSPACE/target"
          $DOCKER run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CACHE/registry:/usr/local/cargo/registry" \
            -v "$CACHE/target:/workspace/target" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e CARGO_INCREMENTAL=0 \
            rust:1.93.0-bullseye \
            sh -c 'set -e; ldd --version | head -1 > /workspace/target/BUILDER_GLIBC; rustc --version > /workspace/target/BUILDER_RUSTC; cargo build --release -p apr-cli --bin apr --target ${{ matrix.target }} --features cuda --locked; strip target/${{ matrix.target }}/release/apr'
          # the mounted target dir is the host cache; expose the binary where the next steps expect it
          mkdir -p "target/${{ matrix.target }}/release"
          cp "$CACHE/target/${{ matrix.target }}/release/apr" "target/${{ matrix.target }}/release/apr"
          GLIBC=$(cat "$CACHE/target/BUILDER_GLIBC"); RUSTC=$(cat "$CACHE/target/BUILDER_RUSTC")
          echo "builder glibc: $GLIBC"; echo "builder rustc: $RUSTC"; nvidia-smi -L | head -1
          {
            echo "### apr (cuda) ${{ matrix.target }} built on ${{ matrix.host }} inside rust:1.93.0-bullseye"
            echo "- toolchain: $RUSTC"
            echo "- glibc floor of this asset (the container's): $GLIBC"
            echo "- device present on the builder host: $(nvidia-smi -L | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The feature must be in the BYTES, not in the intent: the driver loader
      # string exists only under --features cuda (0.66.0: cuda=1, non-cuda=0).
      - name: Prove the cuda feature is in the artifact
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          n=$(grep -ac 'libcuda.so' "$BIN" || true)
          echo "libcuda.so loader strings in $BIN: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::$BIN carries no libcuda.so loader string — this is NOT a CUDA build"
            exit 1
          fi
          "$BIN" --version

      - name: Package archive
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="apr-${VERSION}-${TARGET}-cuda"
          mkdir -p "$ARCHIVE"
          cp "target/${TARGET}/release/apr" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          du -h "${ARCHIVE}.tar.gz"

      # Self-hosted boxes carry no `gh` (measured: `gh: command not found` on gx10, run
      # 34448908554). The REST API with the job token needs only curl + python3.
      - name: Upload assets to release (REST, no gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          rel=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/$TAG")
          rid=$(printf '%s' "$rel" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for f in "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.sha }}"; do
            # --clobber semantics: delete an asset of the same name first
            aid=$(printf '%s' "$rel" | python3 -c 'import json,sys; n=sys.argv[1]; print(next((a["id"] for a in json.load(sys.stdin)["assets"] if a["name"]==n), ""))' "$f")
            [ -n "$aid" ] && curl -sSf -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$aid" > /dev/null
            curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$rid/assets?name=$f" \
              | python3 -c 'import json,sys; a=json.load(sys.stdin); print("uploaded", a["name"], a["size"], "bytes")'
          done

  # The CPU half of the operator's four-asset rule (2026-09-10, row 67-A1 of
  # docs/specifications/06x-release-schedule.md, #3082): {cuda, cpu} x {x86_64,
  # aarch64}. v0.66.0 shipped ZERO apr binaries and nothing was red, because the
  # verify job below only ever asked about the two CUDA ones.
  #
  # DEFAULT FEATURES ARE THE CPU BUILD, and that is a read of the manifest, not a
  # belief: crates/apr-cli/Cargo.toml `default = ["hf-hub", "safetensors-compare",
  # "inference", "training", "visualization", "zram"]` (line 75) does not contain
  # `cuda`; `cuda = ["inference", "realizar/cuda", "entrenar/cuda", ...]` (line 89)
  # is opt-in. So this lane is the cuda lane's build step with `--features cuda`
  # dropped, and the loader-string check INVERTED: the same discriminator that
  # proves the CUDA asset is a CUDA build (libcuda.so == 1) proves this one is not
  # (== 0). Measured on the 0.66.0 builds of both kinds (#3072).
  #
  # Same two boxes as the cuda lane: an aarch64 asset must be built on aarch64.
  # When #3086 lands, the cuda lane's build step moves inside
  # `rust:1.93.0-bullseye` for a glibc 2.31 floor; this lane is written to be the
  # same step, so the merge moves both or neither.
  build-apr-cpu:
    name: apr (cpu) ${{ matrix.target }} on ${{ matrix.host }}
    runs-on: ${{ fromJSON(matrix.labels) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: yoga
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga"]'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10"]'
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved (release event missing tag_name and no dispatch input)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building apr (default features, no cuda) for $TAG -> ${{ matrix.target }}"

      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # 67-C2: the first thing this box does after it has a working tree. No
      # `--cuda` here — a CPU asset must build on a box with no visible device,
      # and asserting one would make this lane lie about what it needs. `docker`
      # and `objdump` are named because the steps below use them (objdump reads
      # the asset's glibc floor; docker is the label these boxes carry).
      - name: Preflight - this box has the tools this job assumes
        run: bash scripts/ci_self_hosted_preflight.sh --need docker objdump

      # Build inside rust:1.93.0-bullseye: the container's glibc (2.31) is the
      # asset's floor, the image's rustc is the workspace pin, the target is the
      # image's native one. Host caches for the registry and the target dir.
      - name: Build apr on the default features (no cuda) inside rust:1.93.0-bullseye (glibc 2.31 floor)
        run: |
          DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER="sudo -n docker"
          # The runner is itself a disposable container (labels ephemeral,docker — infra
          # machines/<box>/forjar-ephemeral.yaml): the bullseye build is a SIBLING container
          # through the mounted socket, so every bind-mount path must exist on the HOST at
          # the same path. The work root is mirrored host<->container; $HOME is not.
          CACHE="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/cache-apr-cpu/${{ matrix.target }}"
          mkdir -p "$CACHE/registry" "$CACHE/target"
          # The bind-mount TARGET inside the workspace must exist BEFORE the container
          # starts: when it does not, dockerd creates the mountpoint as root, and after
          # the container exits the workspace carries an empty root-owned `target/` the
          # runner (uid 1001) cannot write — run 34488955316 built the asset in 1m54s and
          # then died on `mkdir: cannot create directory 'target/aarch64-unknown-linux-gnu':
          # Permission denied`. Pre-creating it as the runner keeps the ownership.
          mkdir -p "$GITHUB_WORKSPACE/target"
          $DOCKER run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CACHE/registry:/usr/local/cargo/registry" \
            -v "$CACHE/target:/workspace/target" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e CARGO_INCREMENTAL=0 \
            rust:1.93.0-bullseye \
            sh -c 'set -e; ldd --version | head -1 > /workspace/target/BUILDER_GLIBC; rustc --version > /workspace/target/BUILDER_RUSTC; cargo build --release -p apr-cli --bin apr --target ${{ matrix.target }} --locked; strip target/${{ matrix.target }}/release/apr'
          # the mounted target dir is the host cache; expose the binary where the next steps expect it
          mkdir -p "target/${{ matrix.target }}/release"
          cp "$CACHE/target/${{ matrix.target }}/release/apr" "target/${{ matrix.target }}/release/apr"
          GLIBC=$(cat "$CACHE/target/BUILDER_GLIBC"); RUSTC=$(cat "$CACHE/target/BUILDER_RUSTC")
          echo "builder glibc: $GLIBC"; echo "builder rustc: $RUSTC"
          {
            echo "### apr (cpu) ${{ matrix.target }} built on ${{ matrix.host }} inside rust:1.93.0-bullseye"
            echo "- toolchain: $RUSTC"
            echo "- glibc floor of this asset (the container's): $GLIBC"
          } >> "$GITHUB_STEP_SUMMARY"

      # The INVERSE of the cuda lane's proof, on the same discriminator: the
      # driver loader string is in the bytes ONLY under --features cuda (0.66.0:
      # cuda=1, non-cuda=0, #3072). A CPU asset that carries it is a CUDA build
      # mislabelled, and shipping it as `-cpu` would put a driver dependency on
      # a box that has no driver. The job fails rather than upload it.
      - name: Prove the cuda feature is NOT in the artifact
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          n=$(grep -ac 'libcuda.so' "$BIN" || true)
          echo "libcuda.so loader strings in $BIN: $n (expected 0)"
          if [ "$n" -ne 0 ]; then
            echo "::error::$BIN carries $n libcuda.so loader string(s) — this is a CUDA build wearing a -cpu name"
            exit 1
          fi
          "$BIN" --version

      # The asset's floor is what its BYTES require, not what the builder happens
      # to run: objdump -T names every versioned glibc symbol it imports. Recorded
      # on both lanes so the CPU tarball's portability is a measured number in the
      # summary rather than an assumption about the builder image.
      - name: Record the asset's glibc floor (objdump, not ldd)
        id: floor
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          FLOOR=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -u -t_ -k2 -V | tail -1)
          [ -n "$FLOOR" ] || FLOOR="none (no versioned glibc imports)"
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"
          echo "- glibc floor of this asset (objdump -T): $FLOOR" >> "$GITHUB_STEP_SUMMARY"
          echo "asset glibc floor: $FLOOR"

      - name: Strip binary
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          strip "$BIN"
          ls -la "$BIN"

      - name: Package archive
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="apr-${VERSION}-${TARGET}-cpu"
          mkdir -p "$ARCHIVE"
          cp "target/${TARGET}/release/apr" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          du -h "${ARCHIVE}.tar.gz"

      # Same REST upload as the cuda lane, for the same measured reason: these
      # boxes carry no `gh` (run 34448908554: `gh: command not found`).
      - name: Upload assets to release (REST, no gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          rel=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/$TAG")
          rid=$(printf '%s' "$rel" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          for f in "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.sha }}"; do
            # --clobber semantics: delete an asset of the same name first
            aid=$(printf '%s' "$rel" | python3 -c 'import json,sys; n=sys.argv[1]; print(next((a["id"] for a in json.load(sys.stdin)["assets"] if a["name"]==n), ""))' "$f")
            [ -n "$aid" ] && curl -sSf -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$aid" > /dev/null
            curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$rid/assets?name=$f" \
              | python3 -c 'import json,sys; a=json.load(sys.stdin); print("uploaded", a["name"], a["size"], "bytes")'
          done

  # The hard requirement, as a check that can fail: all FOUR apr assets (tarball +
  # sha256) and the eight pv assets must be on the release. A missing one is a red
  # workflow, never a partial summary.
  #
  # THE LOOP THAT USED TO LIVE HERE IS NOW A SCRIPT. Inline, it could only ever run
  # inside this job: release day could not ask the question, the dogfood could not
  # ask it, and the release-criteria table could not credit it. It also asked about
  # two assets when the rule names four. scripts/check_release_assets.sh is the one
  # checker all four callers share, and its own case table carries the removed-asset
  # mutation (RED) that this job cannot demonstrate on a real release.
  verify-apr-assets:
    name: All four apr assets are on the release
    needs: [build, build-apr-cuda, build-apr-cpu]
    runs-on: [self-hosted, Linux, X64, clean-room]
    if: always()
    steps:
      # This job had no checkout: it curled the API and parsed with python3. The
      # preflight needs the tree, and so does the checker — and the tree is one
      # second on the clean-room pool.
      - uses: actions/checkout@v7

      - name: Preflight - this box has the tools this job assumes
        run: bash scripts/ci_self_hosted_preflight.sh

      - name: Require the four apr assets (+ sha256) and the eight pv assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          bash scripts/check_release_assets.sh "$TAG" | tee "$RUNNER_TEMP/assets.txt"
          rc=${PIPESTATUS[0]}
          # 2 is ENV (the release could not be read) and is NOT a pass; 1 names
          # each missing asset. Both are red here, distinguished in the summary.
          sed 's/^/  /' "$RUNNER_TEMP/assets.txt" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::release $TAG does not carry the required asset set (rc=$rc) — CUDA and CPU binaries for arm and x86 are a hard requirement for every tag"
          fi
          exit "$rc"

  # The downloaded asset runs and sees the device on a real GPU host of each
  # architecture (host proof; the feature proof is the loader-string step above).
  smoke-cuda:
    name: smoke apr (cuda) on ${{ matrix.host }}
    needs: verify-apr-assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: yoga
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga", "ephemeral", "docker"]'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10", "ephemeral", "docker"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@v7

      # The smoke step below needs curl, python3, sha256sum, tar and a visible
      # device. Each of those is a separate way for this job to fail late and
      # ambiguously; the preflight fails early and by name.
      #
      # `docker` and `objdump` are asserted on both GPU rows even though this
      # job runs neither: both boxes carry `docker` as a RUNNER LABEL, and the
      # build job on the same pool needs objdump. A pool that has stopped
      # matching its own labels is a finding worth one second on every GPU job,
      # not a surprise for whichever lane needs it next.
      - name: Preflight — this box has the tools this job assumes
        run: bash scripts/ci_self_hosted_preflight.sh --cuda --need docker objdump

      - name: Download, verify checksum, run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          T="${{ matrix.target }}"
          D="$RUNNER_TEMP/apr-cuda-smoke"; rm -rf "$D"; mkdir -p "$D"; cd "$D"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          rel=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/$TAG")
          for f in "apr-${TAG}-${T}-cuda.tar.gz" "apr-${TAG}-${T}-cuda.tar.gz.sha256"; do
            aid=$(printf '%s' "$rel" | python3 -c 'import json,sys; n=sys.argv[1]; print(next(a["id"] for a in json.load(sys.stdin)["assets"] if a["name"]==n))' "$f")
            curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$f" "$API/releases/assets/$aid"
          done
          sha256sum -c "apr-${TAG}-${T}-cuda.tar.gz.sha256"
          tar xzf "apr-${TAG}-${T}-cuda.tar.gz"
          BIN="$D/apr-${TAG}-${T}-cuda/apr"
          v=$("$BIN" --version); echo "$v"
          case "$v" in *"${TAG#v}"*) ;; *) echo "::error::asset reports '$v', not ${TAG#v}"; exit 1 ;; esac
          [ "$(grep -ac 'libcuda.so' "$BIN")" -ge 1 ] || { echo "::error::downloaded asset is not a CUDA build"; exit 1; }
          floor=$(objdump -T "$BIN" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "highest GLIBC symbol version required: $floor"
          case "$floor" in GLIBC_2.3[2-9]*|GLIBC_2.[4-9]*) echo "::error::asset requires $floor — built outside the bullseye container (floor must be <= GLIBC_2.31)"; exit 1 ;; esac
          nvidia-smi -L
          "$BIN" gpu --json | tee gpu.json
          grep -q '"gpu_present": true' gpu.json || { echo "::error::apr gpu --json does not see the device on ${{ matrix.host }}"; exit 1; }
          uuid=$(nvidia-smi --query-gpu=uuid --format=csv,noheader | head -1)
          grep -q "$uuid" gpu.json || { echo "::error::apr gpu reports a different device than nvidia-smi ($uuid)"; exit 1; }
          echo "smoke ok on ${{ matrix.host }}: $v sees $uuid"

  # The CPU asset runs where it claims to run: on a GPU-LESS clean-room box (the
  # case that matters — a CPU binary that silently needs a driver is exactly the
  # defect the inverted loader-string check exists to catch), and on both GPU
  # hosts for their own architecture (an aarch64 asset is only proven on aarch64).
  smoke-cpu:
    name: smoke apr (cpu) on ${{ matrix.host }}
    needs: verify-apr-assets
    env:
      # The CPU assets build inside rust:1.93.0-bullseye (glibc 2.31) like the cuda lane, so the floor is
      # declared and GATED: an asset whose bytes import a newer GLIBC_* symbol fails here. 0.66.0 shipped a
      # native x86_64 asset needing GLIBC_2.43 that did not start on Ubuntu 22.04.
      APR_ASSET_GLIBC_FLOOR: GLIBC_2.31
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: clean-room
            labels: '["self-hosted", "Linux", "X64", "clean-room"]'
            preflight: ''
          - target: x86_64-unknown-linux-gnu
            host: yoga
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga"]'
            preflight: '--need docker objdump'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10"]'
            preflight: '--need docker objdump'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - uses: actions/checkout@v7

      # No `--cuda` on any row, including the GPU ones: this job proves a CPU
      # asset, and a device assertion here would make a green depend on hardware
      # the asset must not need.
      - name: Preflight - this box has the tools this job assumes
        run: bash scripts/ci_self_hosted_preflight.sh ${{ matrix.preflight }}

      - name: Download, verify checksum, run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          T="${{ matrix.target }}"
          D="$RUNNER_TEMP/apr-cpu-smoke"; rm -rf "$D"; mkdir -p "$D"; cd "$D"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          rel=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/$TAG")
          for f in "apr-${TAG}-${T}-cpu.tar.gz" "apr-${TAG}-${T}-cpu.tar.gz.sha256"; do
            aid=$(printf '%s' "$rel" | python3 -c 'import json,sys; n=sys.argv[1]; print(next(a["id"] for a in json.load(sys.stdin)["assets"] if a["name"]==n))' "$f")
            curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "$f" "$API/releases/assets/$aid"
          done
          sha256sum -c "apr-${TAG}-${T}-cpu.tar.gz.sha256"
          tar xzf "apr-${TAG}-${T}-cpu.tar.gz"
          BIN="$D/apr-${TAG}-${T}-cpu/apr"
          v=$("$BIN" --version); echo "$v"
          case "$v" in *"${TAG#v}"*) ;; *) echo "::error::asset reports '$v', not ${TAG#v}"; exit 1 ;; esac
          n=$(grep -ac 'libcuda.so' "$BIN" || true)
          [ "$n" -eq 0 ] || { echo "::error::the downloaded -cpu asset carries $n libcuda.so string(s) — it is a CUDA build"; exit 1; }
          # The floor is READ on every row and ASSERTED only where the build was
          # containerised. On this branch the CPU lane builds natively, so its
          # floor is the builder's glibc and a `<= 2.31` assertion here would fail
          # on a box that is doing exactly what it was told; #3086 moves the build
          # into rust:1.93.0-bullseye and sets APR_ASSET_GLIBC_FLOOR, at which
          # point this same step turns the recorded number into a gate.
          if command -v objdump > /dev/null 2>&1; then
            FLOOR=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -u -t_ -k2 -V | tail -1)
            echo "asset glibc floor: ${FLOOR:-none}"
            echo "- apr-${TAG}-${T}-cpu on ${{ matrix.host }}: $v, glibc floor ${FLOOR:-none}" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${APR_ASSET_GLIBC_FLOOR:-}" ]; then
              want="${APR_ASSET_GLIBC_FLOOR}"
              highest=$(printf '%s\n%s\n' "$FLOOR" "$want" | sort -t_ -k2 -V | tail -1)
              [ "$highest" = "$want" ] || { echo "::error::asset needs $FLOOR, above the declared floor $want"; exit 1; }
            fi
          fi
          echo "smoke ok on ${{ matrix.host }}: $v runs with no driver dependency"

  summary:
    name: Summary
    needs: [build, build-apr-cuda, build-apr-cpu, verify-apr-assets, smoke-cuda, smoke-cpu]
    runs-on: [self-hosted, Linux, X64, clean-room]
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Preflight — this box has the tools this job assumes
        run: bash scripts/ci_self_hosted_preflight.sh

      - name: Write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          STATUS="${{ needs.build.result }}"
          {
            echo "### pv Binary Release: $TAG"
            echo ""
            if [ "$STATUS" = "success" ]; then
              echo "- Build matrix: **4/4 targets succeeded**"
            else
              echo "- Build matrix: **partial** (status=$STATUS)"
            fi
            echo "- Targets:"
            echo "  - x86_64-unknown-linux-musl"
            echo "  - x86_64-unknown-linux-gnu"
            echo "  - aarch64-unknown-linux-musl"
            echo "  - aarch64-unknown-linux-gnu"
            echo ""
            echo "### apr Binary Release: $TAG - four assets, {cuda,cpu} x {x86_64,aarch64}"
            echo "- cuda build: ${{ needs.build-apr-cuda.result }} · cpu build: ${{ needs.build-apr-cpu.result }}"
            echo "- all four on the release: ${{ needs.verify-apr-assets.result }} · smoke cuda (yoga+gx10): ${{ needs.smoke-cuda.result }} · smoke cpu (clean-room+yoga+gx10): ${{ needs.smoke-cpu.result }}"
            echo "  - apr-$TAG-x86_64-unknown-linux-gnu-cuda.tar.gz (+ .sha256)"
            echo "  - apr-$TAG-aarch64-unknown-linux-gnu-cuda.tar.gz (+ .sha256)"
            echo "  - apr-$TAG-x86_64-unknown-linux-gnu-cpu.tar.gz (+ .sha256)"
            echo "  - apr-$TAG-aarch64-unknown-linux-gnu-cpu.tar.gz (+ .sha256)"
          } >> "$GITHUB_STEP_SUMMARY"
