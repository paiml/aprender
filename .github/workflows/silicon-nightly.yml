# SILICON NIGHTLY — the same arch-sensitive suite on every silicon we sanction,
# reported PER SILICON rather than collapsed to one verdict (paiml/infra#361).
#
# WHY. aprender is the ML stack and its correctness is silicon-dependent: SIMD
# paths, CUDA kernels, arch intrinsics, float behaviour. Two axes are exercised
# nightly today — x86_64-CPU and aarch64+Blackwell — and the gap just widened on
# purpose: #2740 makes cuda-nightly gx10-only because its x86_64 GPU leg ran on
# lambda-labs, which must never be a CI host (paiml/infra#359). sm_89 was the
# STABLE reference and sm_121 the higher-risk target with a history of JIT bugs.
# We now gate only the risky one.
#
# THE UNCOVERED AXES ARE THE POINT, so they are DATA, not an absence. They live
# in .github/silicon-coverage.txt with a status, and scripts/check_silicon_coverage.sh
# fails this lane when a `required` axis has no runner that can serve it — and,
# just as importantly, when a `pending:` axis DOES. A deferral that outlives its
# own blocker is how a debt ledger becomes a blanket exemption.
#
# SCHEDULE. 03:30 UTC, chosen to miss the fleet's other lanes: clean-room sweep
# 23:00, protection-drift 00:00, nightly-audit 02:00, quality-history 05:00.
# GitHub cron is UTC-only; this is 05:30 Madrid on CEST, 04:30 on CET.
name: Silicon Nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      axis:
        description: 'Run a single axis, or all'
        required: false
        default: all
        type: choice
        options:
          - all
          - x86_64-cpu
          - aarch64-cuda-sm121

permissions:
  contents: read

jobs:
  # THE POLICY GATE, FIRST AND BLOCKING. If an architecture stopped being tested,
  # that is the finding — a green suite on the two remaining axes is exactly what
  # a silent loss of coverage looks like.
  coverage:
    runs-on: [self-hosted, clean-room, intel]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Probe the instrument before believing it. The label matcher must classify
      # six committed cases — including a runner whose labels are a strict SUBSET
      # of the selector, which must NOT match — or this exits 2 rather than green.
      - name: The coverage guard's own matcher must be able to fail
        run: bash scripts/check_silicon_coverage.sh --self-test

      # The run probe's own case table, offline: six committed fixtures standing
      # in for both GitHub listings, plus a MUTATION that deletes the probe and
      # requires the red cases to go green. A guard never shown capable of
      # failing is not evidence of anything, and this one is what decides whether
      # an axis is covered.
      - name: Coverage is a RUN — six fixtures and the mutation that removes the probe
        run: bash scripts/test_silicon_coverage_run_probe.sh

      # An axis named `cuda` must invoke CUDA. This guard's first act, on the
      # tree as committed, was to fail against `aarch64-cuda-sm121` — which held
      # gx10 for 90 minutes to run a CPU suite while the ledger scored it covered.
      - name: A cuda-named axis must invoke CUDA (R-6)
        run: |
          bash scripts/check_silicon_cuda.sh --self-test
          bash scripts/check_silicon_cuda.sh

      # THE WORK ITSELF MUST BE RESOLVABLE, and this is the cheap place to find
      # out (#2793, merged into this branch). Both legs below shipped naming
      # `-p aprender-primitives`, a package that has never existed here, so the
      # lane's first scheduled run did the real suite green and then died on the
      # name — on BOTH silicons, at 03:30, nine minutes into a 90-minute leg. The
      # guards above probe their own instruments thoroughly and only ever asked
      # "can a runner serve this axis?" and "did a job carry it?"; nothing asked
      # whether the lane's own commands could resolve.
      #
      # `cargo metadata` needs the toolchain, and the guard NO-GOes without it
      # rather than reporting a clean bill it could not have measured — so PATH
      # first. This step came from #2793 and is the reason that guard worked
      # while this one would have exited 2.
      - name: Put the runner's Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Every cargo -p in a workflow names a real crate (R-8)
        run: |
          bash scripts/check_workflow_cargo_packages.sh --self-test
          bash scripts/check_workflow_cargo_packages.sh

      # THE LIVE ONE, LAST: it needs the API, and everything above it can go
      # red without a network.
      - name: Every required silicon axis must have RUN inside its cadence window
        run: bash scripts/check_silicon_coverage.sh

  x86_64-cpu:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.axis == 'all' || inputs.axis == 'x86_64-cpu' }}
    runs-on: [self-hosted, clean-room, intel]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Put the runner's Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # THE ARCH-SENSITIVE SUBSET, not the whole suite. Five legs of a full
      # aprender run nightly is not free on a 16-runner fleet that already carries
      # a ~6h clean-room sweep, and a lane that is too expensive gets disabled.
      - name: SIMD and numeric paths (x86_64, widest vectors)
        run: |
          set -euo pipefail
          nice -n 19 cargo test -p aprender-compute --release --lib
          # `aprender-primitives` does not exist and never has. It was invented by
          # this file (#2772) and killed BOTH legs with `package ID specification
          # ... did not match any packages`, exit 101, every night since
          # 2026-08-29 — a lane asserting coverage while executing nothing.
          # aprender-core is the second crate carrying arch-conditional code
          # (10 files with target_arch/target_feature, after aprender-compute's
          # 110). scripts/check_workflow_cargo_packages.sh makes the class
          # unrepeatable. YOGA-NIGHTLY-001 R-8.
          nice -n 19 cargo test -p aprender-core --release --lib

  aarch64-cuda-sm121:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.axis == 'all' || inputs.axis == 'aarch64-cuda-sm121' }}
    # PP-19 / §5.4. gx10 has two CI consumers — this job at 03:30 UTC and
    # cuda-nightly's `falsifiers` at 01:30 UTC, both with 90-minute timeouts and
    # cuda-nightly regularly starting late after queue delay, so overlap is
    # reachable. GitHub concurrency groups are REPO-WIDE, so naming the same
    # `perf-gx10` group in both workflows is what serialises them; this job had
    # no group at all. Enforced by scripts/check_perf_concurrency_groups.sh.
    concurrency:
      group: perf-gx10
      cancel-in-progress: false
    # LITERAL LABELS, not a matrix expression. paiml/infra#352 requires any
    # selector that can reach gx10 to name `gpu`, and a guard can only check
    # labels it can see — labels hidden behind `${{ }}` are invisible to it.
    runs-on: [self-hosted, gpu, gx10, cuda, blackwell]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Put the runner's Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # ASK THE BOX, NEVER THE LABEL. A label says what we intended; nvidia-smi
      # says what is there. This axis has already been wrong once about which
      # host it was on (aprender#2835 — an sm_89 floor asserted on GB10, red four
      # nights), and an axis named for a compute capability that reports a
      # different one is coverage of something else.
      - name: Preflight — this must be sm_121 on aarch64
        run: |
          set -euo pipefail
          nvidia-smi -L || { echo "::error::no CUDA device visible"; exit 1; }
          nvidia-smi --query-gpu=name,compute_cap,memory.total,driver_version \
            --format=csv,noheader
          cc=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | head -1 | tr -d ' ')
          if [ "$cc" != "12.1" ]; then
            echo "::error::expected compute_cap 12.1 (Blackwell/sm_121), got '$cc'."
            echo "::error::This job IS the sm_121 axis; running it elsewhere would"
            echo "::error::report sm_121 coverage that was never measured."
            exit 1
          fi
          test "$(uname -m)" = "aarch64" || { echo "::error::not aarch64"; exit 1; }

      - name: NEON and numeric paths (aarch64)
        run: |
          set -euo pipefail
          nice -n 19 cargo test -p aprender-compute --release --lib
          # `aprender-primitives` does not exist and never has. It was invented by
          # this file (#2772) and killed BOTH legs with `package ID specification
          # ... did not match any packages`, exit 101, every night since
          # 2026-08-29 — a lane asserting coverage while executing nothing.
          # aprender-core is the second crate carrying arch-conditional code
          # (10 files with target_arch/target_feature, after aprender-compute's
          # 110). scripts/check_workflow_cargo_packages.sh makes the class
          # unrepeatable. YOGA-NIGHTLY-001 R-8.
          nice -n 19 cargo test -p aprender-core --release --lib

      # AN AXIS NAMED `cuda` MUST INVOKE CUDA (YOGA-NIGHTLY-001 R-6).
      #
      # It did not. `--features cuda` appeared ZERO times in this file while this
      # job held gx10 — the fleet's only Blackwell box — for a 90-minute timeout
      # to run a CPU test suite, and .github/silicon-coverage.txt scored the axis
      # covered. The coverage was of the CPU. scripts/check_silicon_cuda.sh is the
      # guard that now refuses that shape; this step is what makes the axis true.
      #
      # The assertion is `cache_misses == 0` after pre-warm, the invariant the
      # Blackwell cascade's root cause violates (`warm!` hardcoding one cache
      # key). It is the same one cuda-nightly's falsifiers job runs at 01:30, and
      # deliberately so: there it is one falsifier among many, here it is this
      # axis's EVIDENCE. Both lanes run on gx10 and share the `perf-gx10`
      # concurrency group and the runner's target dir, so the second is a warm
      # rebuild and a seconds-long `--exact` run.
      - name: CUDA on sm_121 — pre-warm covers runtime, zero JIT compiles
        run: |
          set -euo pipefail
          nice -n 19 cargo test -p aprender-train --features cuda --lib --release -- \
            --nocapture --include-ignored --exact \
            autograd::cuda_forward::cache::prewarm_coverage_falsifier::falsify_cuda_prewarm_covers_runtime_no_jit_001

  # PER-SILICON REPORTING. The table is the deliverable: "silicon-nightly failed"
  # is not actionable, "aarch64-cuda-sm121 failed and x86_64-cpu passed" is.
  summary:
    needs: [coverage, x86_64-cpu, aarch64-cuda-sm121]
    if: always()
    runs-on: [self-hosted, clean-room, intel]
    steps:
      - name: Report per silicon
        run: |
          {
            echo "### Silicon nightly"
            echo
            echo "| axis | result |"
            echo "|---|---|"
            echo "| coverage policy | ${{ needs.coverage.result }} |"
            echo "| x86_64-cpu | ${{ needs.x86_64-cpu.result }} |"
            echo "| aarch64-cuda-sm121 | ${{ needs['aarch64-cuda-sm121'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # A deselected axis reports `skipped`; that is a scoped manual run, not
          # a failure. Only failure/cancelled gate. `if: always()` WITHOUT this
          # inspection is a job that is green whatever happened upstream — the
          # exact shape this repo's beat guard exists to stamp out.
          rc=0
          for pair in \
            "coverage:${{ needs.coverage.result }}" \
            "x86_64-cpu:${{ needs.x86_64-cpu.result }}" \
            "aarch64-cuda-sm121:${{ needs['aarch64-cuda-sm121'].result }}"; do
            name="${pair%%:*}"; res="${pair#*:}"
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              echo "::error::silicon axis $name: $res"
              rc=1
            fi
          done
          exit $rc
