# SILICON NIGHTLY — the same arch-sensitive suite on every silicon we sanction,
# reported PER SILICON rather than collapsed to one verdict (paiml/infra#361).
#
# WHY. aprender is the ML stack and its correctness is silicon-dependent: SIMD
# paths, CUDA kernels, arch intrinsics, float behaviour. Two axes are exercised
# nightly today — x86_64-CPU and aarch64+Blackwell — and the gap just widened on
# purpose: #2740 makes cuda-nightly gx10-only because its x86_64 GPU leg ran on
# lambda-labs, which must never be a CI host (paiml/infra#359). sm_89 was the
# STABLE reference and sm_121 the higher-risk target with a history of JIT bugs.
# We now gate only the risky one.
#
# THE UNCOVERED AXES ARE THE POINT, so they are DATA, not an absence. They live
# in .github/silicon-coverage.txt with a status, and scripts/check_silicon_coverage.sh
# fails this lane when a `required` axis has no runner that can serve it — and,
# just as importantly, when a `pending:` axis DOES. A deferral that outlives its
# own blocker is how a debt ledger becomes a blanket exemption.
#
# SCHEDULE. 03:30 UTC, chosen to miss the fleet's other lanes: clean-room sweep
# 23:00, protection-drift 00:00, nightly-audit 02:00, quality-history 05:00.
# GitHub cron is UTC-only; this is 05:30 Madrid on CEST, 04:30 on CET.
name: Silicon Nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      axis:
        description: 'Run a single axis, or all'
        required: false
        default: all
        type: choice
        options:
          - all
          - x86_64-cpu
          - aarch64-cuda-sm121

permissions:
  contents: read

jobs:
  # THE POLICY GATE, FIRST AND BLOCKING. If an architecture stopped being tested,
  # that is the finding — a green suite on the two remaining axes is exactly what
  # a silent loss of coverage looks like.
  coverage:
    runs-on: [self-hosted, clean-room, intel]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Probe the instrument before believing it. The label matcher must classify
      # six committed cases — including a runner whose labels are a strict SUBSET
      # of the selector, which must NOT match — or this exits 2 rather than green.
      - name: The coverage guard's own matcher must be able to fail
        run: bash scripts/check_silicon_coverage.sh --self-test

      - name: Every required silicon axis must have a runner that can serve it
        run: bash scripts/check_silicon_coverage.sh

      # THE WORK ITSELF MUST BE RESOLVABLE, and this is the cheap place to find
      # out. Both legs below shipped naming `-p aprender-primitives`, a package
      # that has never existed in this repo, so the lane's first scheduled run
      # ran the real suite green and then died on the name — on BOTH silicons,
      # at 03:30, nine minutes in. The guard above probes its own matcher
      # thoroughly but only ever asked "can a runner serve this axis?"; nothing
      # asked whether the lane's own commands could resolve.
      - name: Put the runner's Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: The package guard's own reader must be able to fail
        run: bash scripts/check_silicon_packages.sh --self-test
      - name: Every package this lane names must exist in the workspace
        run: bash scripts/check_silicon_packages.sh

  x86_64-cpu:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.axis == 'all' || inputs.axis == 'x86_64-cpu' }}
    runs-on: [self-hosted, clean-room, intel]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Put the runner's Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # THE ARCH-SENSITIVE SUBSET, not the whole suite. Five legs of a full
      # aprender run nightly is not free on a 16-runner fleet that already carries
      # a ~6h clean-room sweep, and a lane that is too expensive gets disabled.
      - name: SIMD and numeric paths (x86_64, widest vectors)
        run: |
          set -euo pipefail
          nice -n 19 cargo test -p aprender-compute --release --lib
          nice -n 19 cargo test -p aprender-core --release --lib

  aarch64-cuda-sm121:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.axis == 'all' || inputs.axis == 'aarch64-cuda-sm121' }}
    # PP-19 / §5.4. gx10 has two CI consumers — this job at 03:30 UTC and
    # cuda-nightly's `falsifiers` at 01:30 UTC, both with 90-minute timeouts and
    # cuda-nightly regularly starting late after queue delay, so overlap is
    # reachable. GitHub concurrency groups are REPO-WIDE, so naming the same
    # `perf-gx10` group in both workflows is what serialises them; this job had
    # no group at all. Enforced by scripts/check_perf_concurrency_groups.sh.
    concurrency:
      group: perf-gx10
      cancel-in-progress: false
    # LITERAL LABELS, not a matrix expression. paiml/infra#352 requires any
    # selector that can reach gx10 to name `gpu`, and a guard can only check
    # labels it can see — labels hidden behind `${{ }}` are invisible to it.
    runs-on: [self-hosted, gpu, gx10, cuda, blackwell]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Put the runner's Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: NEON and numeric paths (aarch64)
        run: |
          set -euo pipefail
          nice -n 19 cargo test -p aprender-compute --release --lib
          nice -n 19 cargo test -p aprender-core --release --lib

  x86_64-cuda-sm89:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.axis == 'all' || inputs.axis == 'x86_64-cuda-sm89' }}
    # Promoted from pending:361 on 2026-09-13. The hole existed because the
    # x86_64 GPU leg used to run on lambda-labs, which must never be a CI host
    # (paiml/infra#359); yoga-gpu is a self-hosted Ada card, so the reason is
    # gone. ci.yml's `cuda-unit` does reach yoga, but only on a pull_request and
    # only when gpu_touched==1 -- conditional coverage is not an axis.
    #
    # yoga-gpu is also binary-release.yml's x86_64 CUDA asset runner, so this
    # takes the same treatment gx10 got: a named concurrency group, so a nightly
    # and a release cut queue behind each other instead of contending.
    concurrency:
      group: perf-yoga
      cancel-in-progress: false
    # LITERAL LABELS for the same reason as the gx10 job: a guard can only check
    # labels it can see, and labels behind ${{ }} are invisible to it.
    runs-on: [self-hosted, gpu, yoga, cuda, ada]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Put the runner's Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: SIMD and numeric paths (x86_64, on the Ada host)
        run: |
          set -euo pipefail
          nice -n 19 cargo test -p aprender-compute --release --lib
          nice -n 19 cargo test -p aprender-core --release --lib

  aarch64-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.axis == 'all' || inputs.axis == 'aarch64-macos' }}
    # Promoted from pending:361 on 2026-09-13: mini-m4 registered, and it is the
    # ONLY darwin/arm64 silicon the repo has. Everything else in this lane is
    # Linux, so every macOS-specific assumption in the tree is invisible to it by
    # construction -- the first full darwin run of the workspace found two
    # (a /proc/meminfo read and an ETXTBSY premise that is a Linux guarantee).
    runs-on: [self-hosted, macOS, ARM64, apple-silicon, mini]
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 6        # 16 GB box: never all 10 cores on a release build
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Put the runner's Rust toolchain on PATH
        run: echo "$HOME/.cargo/bin:/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: NEON and numeric paths (aarch64-apple-darwin)
        run: |
          set -euo pipefail
          rustc -vV | grep -E '^host: aarch64-apple-darwin$'
          nice -n 19 cargo test -p aprender-compute --release --lib
          nice -n 19 cargo test -p aprender-core --release --lib

  # PER-SILICON REPORTING. The table is the deliverable: "silicon-nightly failed"
  # is not actionable, "aarch64-cuda-sm121 failed and x86_64-cpu passed" is.
  summary:
    needs: [coverage, x86_64-cpu, aarch64-cuda-sm121, x86_64-cuda-sm89, aarch64-macos]
    if: always()
    runs-on: [self-hosted, clean-room, intel]
    steps:
      - name: Report per silicon
        run: |
          {
            echo "### Silicon nightly"
            echo
            echo "| axis | result |"
            echo "|---|---|"
            echo "| coverage policy | ${{ needs.coverage.result }} |"
            echo "| x86_64-cpu | ${{ needs.x86_64-cpu.result }} |"
            echo "| aarch64-cuda-sm121 | ${{ needs['aarch64-cuda-sm121'].result }} |"
            echo "| x86_64-cuda-sm89 | ${{ needs['x86_64-cuda-sm89'].result }} |"
            echo "| aarch64-macos | ${{ needs['aarch64-macos'].result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # A deselected axis reports `skipped`; that is a scoped manual run, not
          # a failure. Only failure/cancelled gate. `if: always()` WITHOUT this
          # inspection is a job that is green whatever happened upstream — the
          # exact shape this repo's beat guard exists to stamp out.
          rc=0
          for pair in \
            "coverage:${{ needs.coverage.result }}" \
            "x86_64-cpu:${{ needs.x86_64-cpu.result }}" \
            "aarch64-cuda-sm121:${{ needs['aarch64-cuda-sm121'].result }}" \
            "x86_64-cuda-sm89:${{ needs['x86_64-cuda-sm89'].result }}" \
            "aarch64-macos:${{ needs['aarch64-macos'].result }}"; do
            name="${pair%%:*}"; res="${pair#*:}"
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              echo "::error::silicon axis $name: $res"
              rc=1
            fi
          done
          exit $rc
