name: Toolchain Ceiling

# The CEILING gate (aprender#2370). `scripts/check_msrv.sh` guards the FLOOR;
# nothing guarded the ceiling.
#
# Every gate this repo owns — `make tier1/2/3`, the sovereign-ci `lint` job —
# runs clippy through `rust-toolchain.toml`, which pins one exact release
# (1.93.0). Clippy findings introduced by NEWER clippy releases therefore
# accumulate with nothing to report them. #2370 is what that looks like from
# outside: a fresh checkout on a machine whose rustc is not rustup-managed (a
# homebrew rust, so the pin is silently inert) ran `make`, got clippy 1.96, and
# `tier2` died with 28 errors that no gate here had ever seen. By the time it
# was reported the tree had 107 findings across 12 lints.
#
# This job lints the tree on whatever stable is CURRENT, daily, and FAILS.
#
# Why scheduled and not per-PR: a new Rust release can introduce a lint on a
# Tuesday morning. Blocking the merge queue on an event outside the repo is
# the wrong trade — but letting it accumulate unseen is what produced #2370.
# Scheduled + fail-closed is the middle: red the next morning, nobody blocked.
#
# The script refuses to pass vacuously (stale `stable` older than the pin, no
# clippy component, broken version comparator) — see its header.

on:
  # Chained, not scheduled (T44, #4686): this producer measures the night's
  # C that "Nightly pick" pinned at nightly/<night>, never main's head at
  # whatever hour GitHub got round to creating a scheduled run.
  workflow_run:
    workflows: ["Nightly pick"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: toolchain-ceiling
  cancel-in-progress: true

jobs:
  # THE FLOOR. This file's own header has said since aprender#2370 that
  # "scripts/check_msrv.sh guards the FLOOR" -- but that script ran in NO
  # workflow. Its only two mentions in the whole repo were comments: this one,
  # and Makefile:132. So the ceiling was gated, the floor was not, and the
  # sentence asserting otherwise was the only thing standing in for the gate.
  #
  # Found by check_guards_are_wired.sh once its predicate was changed from
  # "the name appears somewhere in .github/workflows/" (which a comment
  # satisfies) to "a non-comment line INVOKES it". The meta-guard was itself
  # the thing that could not see this.
  #
  # It belongs here rather than on every PR: it compiles the whole workspace on
  # the declared MSRV toolchain (~1 min warm, longer cold), and MSRV drift is a
  # dependency-graph event, not a per-commit one. Same cadence as the ceiling it
  # is the counterpart to.
  msrv-floor:
    runs-on: [self-hosted, X64, Linux, clean-room]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Measure the night's C, not main's head (T44)
        if: github.event_name == 'workflow_run'
        env:
          NIGHTLY_PICK_AT: ${{ github.event.workflow_run.run_started_at }}
        run: bash scripts/release/nightly_c_checkout.sh --at "$NIGHTLY_PICK_AT"
      - name: Workspace builds on its DECLARED MSRV
        run: setsid --wait bash scripts/check_msrv.sh

  clippy-current-stable:
    # clean-room pool, same as coverage-nightly: this is a full-workspace clippy
    # run on a toolchain that is NOT the pinned one, so it cold-builds.
    runs-on: [self-hosted, Linux, X64, clean-room]
    timeout-minutes: 90
    steps:
      # clean: false — matches coverage-nightly; the default git-clean chokes on
      # root-owned leftovers from prior jobs (contracts/.pv/cache → EACCES).
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Measure the night's C, not main's head (T44)
        if: github.event_name == 'workflow_run'
        env:
          NIGHTLY_PICK_AT: ${{ github.event.workflow_run.run_started_at }}
        run: bash scripts/release/nightly_c_checkout.sh --at "$NIGHTLY_PICK_AT"

      - name: Clippy on current stable (ceiling gate)
        run: |
          # Explicit `shell: run` default here is `bash -e`, NOT `bash -eo pipefail`
          # (see memory: feedback_gh_default_shell_no_pipefail). No pipes below, and
          # the script's own exit status is the verdict — do not tee it.
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          setsid --wait bash scripts/check_clippy_current_stable.sh

  # THE FEATURE AXIS (#3837). The ceiling above varies the TOOLCHAIN; this varies the FEATURES. `ci / lint` runs
  # clippy without `--features cuda` and the cuda jobs run tests, never clippy, so nothing had ever linted code
  # behind `--features cuda`: 62 findings accumulated in aprender-train/-compute, #2370's mechanism on a different
  # axis. No CUDA toolkit is needed (the driver is dlopen'd), so any clean-room host runs it.
  #
  # The self-test runs FIRST and must pass before the verdict counts: it plants a cuda-only finding and requires
  # exactly the cuda axis to go red, which proves the flags reach cargo as separate words (#3837's zsh trap made
  # a flag string one argument and read as a lint failure).
  clippy-feature-matrix:
    runs-on: [self-hosted, Linux, X64, clean-room]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Measure the night's C, not main's head (T44)
        if: github.event_name == 'workflow_run'
        env:
          NIGHTLY_PICK_AT: ${{ github.event.workflow_run.run_started_at }}
        run: bash scripts/release/nightly_c_checkout.sh --at "$NIGHTLY_PICK_AT"
      - name: Self-test — an unreached feature is refused, and a planted cuda-only finding reddens only the cuda-reaching axes
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          setsid --wait bash scripts/check_clippy_feature_matrix.sh --self-test
      - name: Strict clippy on every feature axis — the axis table must reach every apr-cli feature (derived)
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          setsid --wait bash scripts/check_clippy_feature_matrix.sh
