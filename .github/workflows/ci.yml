# Sovereign CI — calls reusable workflow from paiml/.github
# Change once in paiml/.github → applies to all repos
#
# Jobs provided by sovereign-ci.yml:
#   test: cargo test --lib (self-hosted clean-room)
#   lint: cargo clippy --all-targets -- -D warnings + cargo fmt --check
#   coverage: cargo llvm-cov + codecov upload
#   security: cargo audit (ubuntu-latest, continue-on-error)
#   provenance: SLSA attest-build-provenance
#   gate: aggregates test+lint results
name: CI

on:
  push:
    branches: [main, master]
    # #3676: sovereign-ci's `coverage_on: tag` (below) runs coverage only on a push of a
    # v* tag, and its gate REQUIRES it to succeed there. A push filtered to branches never
    # fires for a tag, so this is the reusable's second required edit.
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Merge queue: GitHub dispatches a `merge_group` event for each batch it forms.
  # Both required checks (`ci / gate` via the reusable sovereign-ci call, and the
  # top-level `workspace-test` job) live in THIS workflow, so triggering here makes
  # both run against the queued batch. Without this trigger, enabling the queue jams
  # every PR (no checks ever run on the merge_group ref → nothing merges).
  merge_group:
  workflow_dispatch:

# CONCURRENCY (#3292, measured in #3358)
# `cancel-in-progress` is an EXPRESSION, which GitHub evaluates per event
# ("To conditionally cancel currently running jobs or workflows in the same
# concurrency group, you can specify cancel-in-progress as an expression with any
# of the allowed expression contexts" -- workflow-syntax reference, fetched
# 2026-09-16). It was an unconditional `true`, which is right for a pull_request
# -- a new push supersedes the run it replaces instead of stacking behind it --
# and is the destructive failure mode everywhere else: for `merge_group` the group
# is the queue ref, and cancelling a queue BUILD throws away the verdict the queue
# is waiting on (the same mistake, made by hand on 35078448806 at 11:25Z, turned a
# healthy run's `gate` red in four seconds). Narrowed to the one event where
# superseding is what we mean; `merge_group`, `push` and `workflow_dispatch`
# evaluate to false and QUEUE.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard-tree:
    runs-on: [self-hosted, Linux, clean-room]   # arch-neutral: intel, yoga or gx10 (#3100)
    # 20: the operator's hard PR budget (rule E, 2026-09-10), and it OVERRIDES
    # the BSE-05 formula rather than being derived from it.
    #
    # Measured basis, run 34449608126 (PR #3074, `gh api .../jobs` step
    # timestamps): this job was 27.3 min, of which the ONE step
    # "Every cargo-free guard runs, and every failure is reported" was
    # 1105 s = 18.4 min, running ~35 independent guards strictly serially.
    # That step now dispatches them through an xargs pool (PMAT-1098, row
    # 67-E3; case table scripts/tests/guard_tree_parallel_test.sh), measured
    # 289 s serial -> 43 s parallel on a 48-core box. Projected job:
    # 27.3 - 18.4 + <=8 = <=17 min.
    #
    # BSE-05 would say T = max(15, ceil(1.5*p99), p99+20); with the pre-change
    # p99 of 85.1 min it says 128, and even against the projected 17 it says
    # 37. The 20-minute budget is SMALLER than the formula's answer, and it is
    # the number the operator set. A run that exceeds it is meant to fail:
    # that is the andon for this row, not a flake to widen away.
    # 30, not 20 (67-E3 merge onto #3115 main, 2026-09-11): the fleet ledger measured p90 25 min for
    # guard-tree and 45 min for guard-cargo BEFORE the seven moved steps (~23 min) left it; 30 is the
    # measured remainder with a 1.3x margin under train load. Re-tighten from evidence/fleet/history.jsonl.
    timeout-minutes: 30
    env:
      IMAGE: localhost:5000/sovereign-ci:stable
      # Same definition as workspace-test (:106). aprender#2627: the
      # model-tests step below was added with workspace-test's mount lines
      # copied verbatim, but PR_OR_REF is JOB-level env there and this job
      # never had it. An undefined shell variable is the empty string, so
      # `.../registry/${PR_OR_REF}` collapsed to `.../registry/` -- the SHARED
      # PARENT of every PR's registry, bind-mounted AS the cargo registry. Its
      # children are PR numbers, not cache/index/src, so every dependency
      # re-downloads and writes into the parent. The per-run target dir
      # likewise collapsed to `.../aprender-ci//run-<id>`, outside the tree
      # any other step reuses. Nothing errors; the step just silently stops
      # being the thing its own comment describes. check_workflow_env_defined.sh
      # now fails closed on any run: block interpolating a name its job does
      # not define.
      PR_OR_REF: ${{ github.event.pull_request.number || github.ref_name }}
    steps:
      - name: "DEMO #3177: a deliberately RED guard-tree (this branch is never merged)"
        run: exit 1
      - name: Pre-checkout ownership restore (EACCES self-heal)
        # Same guard as workspace-test (:92) and mutants (:435). This job was
        # the ONLY clean-room job missing it, and that asymmetry took main red
        # on 2026-07-06 (run 28776891625): a hard-killed docker job left
        # root-owned target/.rustc_info.json + target/package/ in the runner
        # checkout, so this job's actions/checkout `git clean -ffdx` failed
        # with EACCES before a single step ran. Because `gate` hard-requires
        # guard-tree (:379), a checkout-level EACCES here reads as a
        # required-check failure and blocks every merge — the andon stays red
        # until someone manually `ssh intel sudo rm`s the leftovers.
        # Cached-image gate is sound: leftovers can only exist if a previous
        # docker job ran on this runner, which implies the image is already in
        # the local cache. So "image not cached ⟹ no leftovers" and skipping is
        # safe (and keeps this step tolerant of a registry outage).
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "$IMAGE" \
              bash -c 'chown -R 1000:1000 /workspace 2>/dev/null || true'
          else
            echo "Image not cached — no prior docker job on this runner, nothing to restore"
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # THE COMPARAND, FETCHED ONCE, BEFORE ANY GUARD THAT NEEDS IT.
      #
      # Every shrink-only baseline in scripts/ is now compared against a ref a
      # pull request cannot rewrite, because twelve of them were compared
      # against nothing: appending one entry -- cloned from that file's own last
      # real entry -- returned rc=0 from all twelve, and on two of them the
      # appended entry laundered a violation created in the same commit.
      #
      # This step used to sit ~180 lines down, next to the one guard that
      # needed it. Three ratcheted guards (shell lint, hand-rolled parsers,
      # assertion exclusion) run BEFORE that point and would have had an
      # unresolvable comparand -- which those guards treat as a hard failure,
      # never as "no growth", so the mistake would have been loud rather than
      # silent. It is still a mistake. One fetch, before all of them.
      #
      # fetch-depth is 1 here, so the merge-base is usually unavailable and the
      # ratchets fall back to the origin/main TIP. That is the STRICTER
      # comparand, and it means the CI path is the tip path: a local run that
      # passes on the merge-base can still red here, and CI is authoritative.
      - name: Fetch origin/main as the comparand for every ratchet in this job
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          # push shape: HEAD IS the origin/main tip, so every differential ratchet judges it against
          # its FIRST PARENT (scripts/lib/resolve_base.sh: HEAD vs HEAD would pass vacuously, the
          # G-10 quorum's finding), and a depth-1 checkout has not fetched that parent. Deepen by one.
          if [ "${GITHUB_EVENT_NAME:-}" = push ]; then git fetch --no-tags --deepen=1 origin +refs/heads/main:refs/remotes/origin/main; fi
      # aprender#2822. Case table FIRST, per the convention above: the probe
      # below is only worth its 0.15s if the classifier it feeds can still turn
      # RED. Seven rows over a throwaway tree - no cargo, no network, no host.
      # Mutation-verified: deleting the sentinel rule, deleting the inode rule,
      # or restoring the read-after-plant ordering bug each takes it RED.
      #
      # This step IS a gate and may fail the job. The probe and report steps are
      # not and never can - a recorder that can red a required check is a
      # liability, and #2822 is already red.
      - name: "target-watch case table (aprender#2822)"
        run: bash scripts/ci_target_watch.sh --self-test
      - name: "target-watch: post-checkout"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "post-checkout"
      # ── ONE STEP, EVERY CARGO-FREE GUARD, EVERY FAILURE REPORTED ──────────
      #
      # This step replaces 53 separate `bash scripts/check_X.sh` steps. GitHub
      # Actions steps are fail-fast by construction: the first red step ends
      # the job, so a PR that broke guard #3 never learned whether guards
      # #4-53 were also broken and each red run named exactly ONE guard.
      # scripts/guard_tree.sh runs every guard in the universe
      # (`git ls-files 'scripts/check_*.sh'`, never a written list), runs each
      # guard's `--self-test` first where the script advertises one, prints a
      # PASS/FAIL row per guard, and exits 1 only after all of them have run.
      #
      # `--no-cargo` is the subset whose own source contains no bare `cargo `
      # token — the classification is derived from the guards themselves, so
      # it cannot drift from a list kept here. The cargo-using half runs in
      # the `guard-cargo` job below, in parallel with workspace-test.
      #
      # The four guards that take arguments (check_receipt_complete --dag,
      # check_dag_invariants <path> --min-slack-days, check_row_pr_write_set
      # --event/--branch, check_hardcoded_paths --full-if-capable) keep their
      # own steps below: an argument is a claim this runner cannot derive.
      - name: Every cargo-free guard runs, and every failure is reported
        # infra#721: the guards that read GitHub (check_silicon_coverage.sh's job
        # ledger, check_roadmap_completion_is_cited.sh's `gh pr view`) used the
        # runner's /opt/ci-gh login -- the SAME 5,000/h quota as every agent
        # session on the operator's account. When three sessions drained it at
        # 07:50Z on 2026-09-19, check_silicon_coverage went NO-GO ("job ledger is
        # EMPTY") on merge-queue run 35430069580 and evicted #3488. GH_TOKEN wins
        # over the config-dir login in gh, and github.token's 1,000/h is per job.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/guard_tree.sh --no-cargo
      # scripts/tests/guard_tree_test.sh is guard_tree.sh's OWN case table
      # (BSE-01, PMAT-1062) -- it proves guard_tree.sh's no-fail-fast
      # behaviour against a fixture, proves a fail-fast MUTANT of it goes RED
      # on that same fixture, and checks --list/--no-cargo/--dry-run against
      # the real repo. BSE-01 wrote it but never wired it into any workflow;
      # wired here (BSE-02, PMAT-1064) because it is cargo-free and this is
      # the job whose own dispatcher it verifies.
      - name: "guard_tree.sh's own case table (BSE-01, wired BSE-02)"
        run: bash scripts/tests/guard_tree_test.sh
      # The dispatcher above runs its guards CONCURRENTLY (PMAT-1098, row
      # 67-E3). This table proves the six properties concurrency can quietly
      # take away -- the universe reached, a named failure, the count, byte-
      # identical ordering across two runs, a guard that dies without a
      # verdict counting as FAILED -- against throwaway fixture repos, in
      # seconds, and WITHOUT asserting any duration (this is a required job;
      # see scripts/check_no_timing_in_required.sh).
      - name: "guard_tree.sh's parallel dispatcher case table (PMAT-1098)"
        run: bash scripts/tests/guard_tree_parallel_test.sh
      # Fleet hygiene case tables (docs/specifications/ci-fleet-hygiene.md §6): the queue
      # steward, the packing/history ledgers, the tier ledger and the roadmap resolve-dirty
      # runner each ship a hermetic --selftest; check_guards_are_wired.sh refuses a script
      # that carries one and is named by no workflow. Each runs in under five seconds.
      - name: Fleet hygiene case tables (steward, history, utilization, tier ledger, resolve-dirty)
        run: |
          set -euo pipefail
          bash scripts/ci_queue_steward.sh --selftest
          bash scripts/fleet_history.sh --selftest
          bash scripts/fleet_utilization.sh --selftest
          bash scripts/test_tier_ledger.sh --selftest
          bash scripts/ci_resolve_dirty.sh --selftest
          python3 scripts/lib/roadmap_merge.py --selftest
      - name: "target-watch: before-cargo-install-bashrs"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-cargo-install-bashrs"
      # The baseline printer holds its OWN output to the same pairing rule and
      # re-derives every number the contract quotes.
      - name: Dogfood baselines must re-derive from the ledger
        run: python3 scripts/dogfood_baseline.py --check
      - name: "target-watch: before-pv-build"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-pv-build"
      - name: "target-watch: before-contracts-tests"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-contracts-tests"
      - name: "target-watch: before-wasm32-build"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-wasm32-build"
      - name: "target-watch: before-facade-compat"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-facade-compat"
      # The bump half of the same defect. `cargo set-version --workspace` cannot
      # reach an `exclude`d workspace and does not warn, so three files in
      # crates/facades/ have to ride in every bump commit. scripts/bump-version.sh
      # does that; these two rows keep its case table live and assert the tree is
      # version-consistent right now (which check_facade_compat.sh R3/R5 also
      # backstop from the compat side).
      - name: Version-bump case table (reaches the excluded workspace)
        run: bash scripts/bump-version.sh --self-test
      - name: Every workspace is at a consistent version
        run: bash scripts/bump-version.sh --check
      - name: Every DAG row marked complete has a receipt whose marker says so (C0-7)
        run: bash scripts/check_receipt_complete.sh --dag docs/specifications/pp-066-dag.yaml
      # APR-PERF-GATE-001's PRIMARY gate — Arms A/B1/B2/C/D/E and
      # cell-completeness — was invoked by NOTHING: no workflow, no Makefile
      # target, no [package.metadata.dogfood] entry. `git grep perf_gate --
      # .github Makefile` returned rc=1. The meta-guard could not see it because
      # it globbed check_*.sh and this file is perf_gate.sh; that universe is
      # now derived from selftest capability instead.
      #
      # SELFTEST ONLY, and that is not a shortcut. The real gate needs
      # --host/--phase/--workload/--receipt; no PR can supply a receipt, because
      # receipts come from the nightly push hosts (§4.9.1). Wiring the gate
      # itself at merge phase would be a required check that can never PASS —
      # the mirror of one that can never fail. And declaring it in the dogfood
      # gates is worse: dogfood.sh:293 runs `bash "$dg_path"` with NO arguments,
      # perf_gate.sh:326 requires four, so every release sweep would report
      # exit=2 forever — a usage error indistinguishable from a real regression.
      #
      # What this DOES buy: the 29-case selftest genuinely discriminates
      # (disabling the B1 aggregate floor drops it to 27 passed, 2 broken;
      # unwiring the §4.9.1 signature arm drops it to 23 passed, 6 broken), so a
      # gate that silently stops discriminating now fails here rather than
      # certifying a release later.
      #
      # #3676: PATH-SCOPED now. The table's verdict changes only when perf_gate.sh
      # or a file it reads changes, and it cost 405 s on every PR, merge group and
      # push (main run 35563537942). scripts/check_perf_gate_selftest_scoped.sh --
      # dispatched by guard_tree.sh --no-cargo above, no step here -- runs it when
      # the diff vs origin/main touches its DERIVED scope (every $ROOT/ path it
      # reads, followed through the scripts it calls) and says so on a SUMMARY
      # line when it does not; guards-nightly.yml runs the table whole.
      # PERF-007, the HOST half of §4.9.1. `perf_gate.sh --selftest` already
      # runs this table, but check_guards_are_wired.sh cannot see one level of
      # indirection and its remedy for an unwired guard is to wire it, not to
      # baseline it. Named here so the signer's refusals — it will not sign
      # another host's receipt, will not sign a receipt with no commit, will not
      # mint a key — are executed by a workflow and not merely by a script that
      # a workflow happens to call.
      - name: Receipt signer refuses what it must (PERF-007, case table)
        run: bash scripts/perf_receipt_sign.sh --selftest
      # PP-29. The successor of check_mutation_registry.sh, retired in the same
      # commit that lands this one. That guard found its input by glob over
      # `docs/specifications/APR-PERF-GATE-001-v*.md`; archiving that document
      # did not break it loudly, it made it read ZERO rows and report zero
      # violations -- a registry guard whose universe can empty itself, which is
      # the shape the whole epic is about.
      #
      # Three joins, all text-only and deterministic, so they belong in the merge
      # phase: §6's ARMED rows must name selftest cases that EXIST by name on the
      # surface they declare; Appendix C's ledger may not spend one cell twice
      # (PP-9); and §12's expiries must DERIVE from the blocked_by DAG rather
      # than be typed. The derivation is written to
      # evidence/parity/derived_expiries.json, which perf-matrix.yaml's
      # `expires_after:` anchors resolve against.
      - name: Every ARMED PP row names cases that exist (PP-29)
        run: bash scripts/spec_conformance.sh
      - name: Spec-conformance guard can still go RED (case table)
        run: bash scripts/spec_conformance.sh --selftest
      # SPEC-1.6 (PP-066, #2903): the v1.6 corrections are each asserted by a
      # row that was RED on the v1.5 text (the --v15-red arm proves the table
      # can fail), and the §5.0 DAG block is rendered from the yaml — drift is
      # RED (G-4's render_dag.py --check; 3 = not armed is not a pass).
      - name: "PP-066 spec v1.6 defect table (22 rows) and its v1.5 RED proof"
        run: bash tests/spec/pp066_v16_defects.sh && bash tests/spec/pp066_v16_defects.sh --v15-red
      - name: The spec's rendered DAG block matches the yaml (G-4 --check)
        run: python3 scripts/render_dag.py --check --dag docs/specifications/pp-066-dag.yaml --spec docs/specifications/PP-066-release-spec.md
      - name: The PP-066 obligation DAG holds its invariants (G-4, C10)
        run: bash scripts/check_dag_invariants.sh docs/specifications/pp-066-dag.yaml --min-slack-days 6
      - name: A row PR writes no shared file (G-11, PMAT-1062)
        run: bash scripts/check_row_pr_write_set.sh --event "${GITHUB_EVENT_NAME:-pull_request}" --branch "${GITHUB_HEAD_REF:-}"
      # PP-066 SPEC-2.0: scripts/release_criteria.sh is a decision surface
      # (`--all` is the first RELEASE step), and it is NOT a scripts/check_*.sh
      # file, so guard_tree.sh's universe (`git ls-files 'scripts/check_*.sh'`)
      # does not reach it — while check_guards_are_wired.sh DOES claim it, because
      # that universe is derived from shipping a `--self-test` mode. Named here so
      # the criteria table proves it can still go RED rather than pass vacuously.
      - name: "Release criteria can still go RED (release_criteria.sh --self-test)"
        run: bash scripts/release_criteria.sh --self-test
      # L0-1a (#2971, PMAT-1065): the supported-model manifest is DERIVED from what the tree
      # names (README, BEATS, book, dogfood receipts, perf-matrix) — a named model absent from
      # the manifest, or a typed entry nothing cites, is DRIFT; C14's own case table runs over
      # the lambda RED-first records so the gate can be seen to turn RED. Case tables, then live.
      # Both scripts are cargo-free, so guard-tree (not guard-cargo) is their job (BSE-02).
      - name: Supported-model manifest case table (L0-1a, #2971)
        run: bash scripts/derive_model_manifest.sh --self-test
      - name: The manifest equals its derivation (a named model is never absent, an entry is never typed)
        run: bash scripts/derive_model_manifest.sh --check
      - name: C14 model-parity case table (L0-1a, #2971)
        run: bash scripts/check_model_parity.sh --self-test
      # #3577: the parity-receipt denominator is the SECOND, independent reader of the
      # receipt corpus — the extractor is the first, and they share no code so a defect
      # in either is caught by the other rather than by nobody. It shipped unwired, which
      # `check_guards_are_wired.sh` caught: a refusal nothing runs is not a refusal, and
      # `parity-receipt-v1.yaml`'s own equations name "both readers are wired into CI" as
      # a precondition. Its 4-case self-test is cargo-free and model-free, so it runs here.
      - name: Parity-receipt denominator case table (#3577)
        run: bash scripts/parity_receipt_denominator.sh --self-test
      # F-1 (#3022, #3024): a model file the user NAMED is the model that answers, or
      # the command refuses — `apr chat` silently loaded its toy demo model for a
      # `model.safetensors.index.json` (exit 0, zero tokens, the real path in the banner)
      # and the nightly story could not see it: it never calls `apr chat` and never
      # names a sharded model. Both case tables are cargo-free and model-free, so they
      # run here; the live 4-cell matrix needs a model and runs on the fleet.
      - name: "Sharded-fixture splitter case table (F-1, #3024)"
        run: python3 scripts/make_sharded_safetensors.py --self-test
      - name: "format x command honesty case table (F-1, #3022)"
        run: bash scripts/check_format_command_matrix.sh --self-test
      # PP-23's bandwidth probe is release-phase INSTRUMENTATION (needs nvcc and an
      # idle GPU) and never runs its measurement here; its case table is GPU-free
      # and must, or the number the roofline rests on comes from a probe nobody
      # has shown able to refuse.
      - name: Bandwidth probe can still refuse (case table, no GPU)
        run: bash scripts/measure_bandwidth.sh --selftest
      # The converter that closes the loop, end to end: a BenchmarkReport this
      # repo can actually produce reaches a verdict, and what remains failing is
      # the UNMEASURED bucket BY NAME rather than a schema error.
      - name: Receipt converter round-trips into a gate verdict
        run: python3 scripts/lib/perf_receipt.py --selftest
      - name: "target-watch: before-profile-tests"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-profile-tests"
      - name: "target-watch: before-model-tests-docker"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-model-tests-docker"
      - name: "target-watch: before-book-examples"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-book-examples"
      - name: "target-watch: before-cargo-package"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-cargo-package"

      - name: "target-watch: before-cargo-deny-install"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-cargo-deny-install"
      - name: Tests must not gate on paths outside the workspace
        run: bash scripts/check_test_fixture_paths.sh
      - name: Fixture-path guard case table
        run: bash scripts/check_test_fixture_paths.sh --self-test
      # PMAT-976 (C0-2, #2891, epic #2873): the sovereign-ci.yml reusable
      # workflow ci.yml calls must be pinned to a commit sha, never a branch.
      # Text-only, no build.
      - name: sovereign-ci.yml pin guard case table
        run: bash scripts/check_ci_reusable_workflow_pinned.sh --self-test
      - name: ci.yml must pin sovereign-ci.yml by commit sha, not @main
        run: bash scripts/check_ci_reusable_workflow_pinned.sh
      - name: "target-watch: after-last-cargo-step"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "after-last-cargo-step"
      # #2532: the guard above has a universe of crates/**/tests?/**/*.rs, which
      # structurally excludes 100% of the 324 machine-specific paths pmat found
      # in SHIPPED code -- 46 of them inside contracts/ itself. Seventeen crux
      # falsification tests opened with a GOLD= path under a worktree that no
      # longer exists on ANY machine, then `[ -f "$GOLD" ] || exit 2`, so they
      # skipped everywhere while `pv validate` and `pv lint contracts/` both
      # reported PASS. The two guards' universes are complementary, not nested.
      # contracts/ is now at ZERO and has no baseline to raise. Text-only, no build.
      #
      # The whole-tree ratchet lives in `--full`. It shells out to
      # `pmat analyze hardcoded-paths` (pmat#1017, the detector of record), and
      # the clean-room pool still measures pmat 3.31.0 (re-checked 2026-08-28),
      # which has no such subcommand -- so a bare `--full` here would red every
      # PR, and `|| true` would make it a gate that cannot fail.
      #
      # It used to be left unwired with a comment saying to promote it "once the
      # fleet carries pmat >= 3.32.0". That is what this step is fixing: a
      # comment is not a trigger, nothing re-evaluated the condition, and 20
      # shipped machine-specific paths landed through the gap (299 vs baseline
      # 278 on 62d23d8d1). --full-if-capable re-evaluates it on every run: it
      # runs the ratchet and propagates its status where pmat can produce a
      # verdict, and where it cannot it prints the version and the actual
      # refusal text rather than assuming. The gate arms itself on the day the
      # fleet upgrades, with no edit to this file.
      - name: No contract may name a machine-specific path
        run: bash scripts/check_hardcoded_paths.sh
      - name: Machine-specific-path guard case table
        run: bash scripts/check_hardcoded_paths.sh --self-test
      - name: Whole-tree machine-specific-path ratchet (pinned analyser via scripts/pmat_bin.sh, PMAT-1059)
        run: bash scripts/check_hardcoded_paths.sh --full-if-capable
      # PRREV-006. PR-REVIEW-SKILL-002 v2 §9 row 6 states how the receipt guard
      # may be wired, and both halves are scars rather than style:
      #
      #   job-level `if:`, NOT a workflow-level `paths:` filter — a path-filtered
      #   required check never reports and blocks branch protection forever.
      #
      # A `paths:` filter here would mean the workflow does not run at all on a
      # PR that misses it, so a check the ruleset requires never produces a check
      # run: the PR sits PENDING and nothing merges. This file carries BOTH
      # required checks (`ci / gate` and `workspace-test`), so that is a deadlock,
      # not a hypothetical. A job-level `if:` is the opposite shape — the workflow
      # runs, the job reports `skipped`, and `gate` reads the result (`mutants` is
      # the in-repo precedent).
      #
      # Until this step, that rule lived in a COMMENT further down this file, on
      # `vendored-schemas`, and a comment is not a trigger — the exact shape that
      # left check_hardcoded_paths.sh unwired for months, two steps above. So the rule
      # is CHECKED: the receipt guard must be invoked by a non-comment line, by
      # exactly one job, that job must carry an `if:` at job indentation (4
      # spaces, not a step's 8), and that `if:` must evaluate TRUE on
      # pull_request and FALSE on push / merge_group / workflow_dispatch. Both
      # polarities, because "it has an `if:`" is satisfied by `if: always()`.
      # Text-only, no build. Self-test first (Verification Discipline #7).
      - name: "Receipt-wiring guard case table (both polarities of the if:)"
        run: bash scripts/check_pr_review_wiring.sh --self-test
      - name: The PR-review receipt guard is wired job-level, not path-filtered
        run: bash scripts/check_pr_review_wiring.sh
      # PRQ-013 (PP-066 C0-5, #2982): the job that judges a PR's OWN receipt must be
      # defined by the base — a workflow on pull_request_target + merge_group, never
      # pull_request — and `gate` must not wait on a head-defined receipt job. Case
      # table first (17 rows, both polarities), then the tree.
      - name: "Receipt-gate base-owned case table (17 rows, both polarities)"
        run: bash scripts/check_receipt_gate_base_owned.sh --self-test
      - name: The PR's own receipt is judged from the base, not the head (PRQ-013)
        run: bash scripts/check_receipt_gate_base_owned.sh
      # The case table above is evidence only for the branches it can turn RED,
      # and on its first pass it could not turn three of them. Dropping either
      # zero-count check left the guard still rejecting on the NEIGHBOURING
      # more-than-one branch, and the step-level fixture used `- if:`, whose
      # leading `- ` means a widened job-level pattern never matched it. Both
      # survived a verdict-only table; the mutation set is what found them.
      # 15/15 kill required, and an anchor that stops matching is reported as
      # HARNESS-BROKEN rather than as a dead mutant. Text-only, no build.
      - name: "Receipt-wiring guard: every rule it states, mutated (15/15 kill)"
        run: bash scripts/mutate_pr_review_wiring_guard.sh
      # APR-RELEASE-001 §6 R-2, WIRED (#3200 shipped the guard; this is its
      # caller). This step is its ONLY runner: guard_tree.sh skips it as
      # wired-with-args (it needs a body), so its case table ran in NO job until
      # this step called `--self-test` beside `--body` (found by aprender-f0,
      # 2026-09-21; the comment here used to claim guard_tree ran it bare). The
      # 0.67.0 reconcile found 48 merged PRs since the previous tag of which only
      # 9 closed anything; that is what this guard exists to stop.
      #
      # THE BODY ARRIVES THROUGH `env:`, NEVER INTERPOLATED INTO THE SCRIPT.
      # `${{ }}` is substituted textually BEFORE bash sees the line, so a body
      # containing a backtick or $(...) would execute on the runner -- and this
      # body is attacker-controlled by construction. `env:` passes it as data.
      # scripts/check_workflow_env_defined.sh enforces the same rule.
      #
      # pull_request only: on merge_group there is no pull_request payload, and
      # a body is fixed before a PR is ever enqueued.
      - name: A PR body must close every issue it cites, or say why not (§6 R-2)
        # `!cancelled()` and NOT a bare event check. Actions steps are fail-fast:
        # measured on run 34875945193, step 8 went red and 48 of this job's 59
        # steps were SKIPPED -- including this one and its §11.1 neighbour. This
        # guard exists because the 0.67.0 reconcile found 48 merged PRs of which
        # only 9 closed anything; masked by an unrelated guard, it is dark exactly
        # as it was before it had a caller. It reads a PR body and nothing else,
        # so no guard result can be its precondition. (#3282 classifies the other
        # 46, which is a judgment call per step rather than one blanket edit.)
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          bash scripts/check_pr_closes_issue.sh --self-test
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          bash scripts/check_pr_closes_issue.sh --body "$RUNNER_TEMP/pr-body.txt"
      # APR-RELEASE-001 §11.1, WIRED. The section shipped as prose in #3268 and
      # nothing read it: `grep -rl ont-delta scripts/ .github/ Makefile` returned
      # NOTHING, while §11.1's own text says "Absent is a PR-body lint failure,
      # not a review comment". A rule whose enforcement is "not a review comment"
      # and whose only mechanism IS a review comment is this repo's anti-theater
      # class, one level up from the guard it sits beside.
      #
      # Same body-handling rule as the step above: the body arrives through
      # `env:` as DATA and is never interpolated into the script. It is
      # attacker-controlled by construction.
      #
      # The changed-file list is the other input, and it is what makes the guard
      # non-trivial: half the sweep surface ("a known-red list anywhere") is
      # DERIVED from the tree, not typed. Measured on #3277, which touches
      # scripts/cb200_baseline.txt and no prose sink at all -- a hand-typed sink
      # list would have passed it.
      - name: A sweep PR closes with an ontology delta, not a paragraph (§11.1)
        # `!cancelled()` and NOT a bare event check. Actions steps are fail-fast:
        # measured on run 34875945193, step 8 went red and 48 of this job's 59
        # steps were SKIPPED -- including this one and its §11.1 neighbour. This
        # guard exists because the 0.67.0 reconcile found 48 merged PRs of which
        # only 9 closed anything; masked by an unrelated guard, it is dark exactly
        # as it was before it had a caller. It reads a PR body and nothing else,
        # so no guard result can be its precondition. (#3282 classifies the other
        # 46, which is a judgment call per step rather than one blanket edit.)
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/ont-body.txt"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename' > "$RUNNER_TEMP/ont-files.txt"
          bash scripts/check_pr_ont_delta.sh \
            --body "$RUNNER_TEMP/ont-body.txt" --changed "$RUNNER_TEMP/ont-files.txt"
      # aprender#2822: THE REPORT. Runs even when the job dies mid-cargo,
      # and takes its own final probe first -- without that, a failure at
      # step K leaves the last recorded boundary BEFORE K and the table
      # reads clean, which is the whole failure mode being investigated.
      #
      # It also pulls the host journal for the job's window into the job
      # log. That is the decisive evidence and the only evidence that
      # expires: `_work/*/target` is deleted by HOST automation (a sibling
      # runner's job-started hook, a systemd timer) which logs under its own
      # tag and appears in NO GitHub log. See
      # scripts/runner-infra/runner-disk-guard.sh, whose own header records
      # this exact signature.
      #
      # continue-on-error is deliberate and is NOT a disarmed gate: nothing
      # here asserts anything. The gate that can fail is the case table
      # wired above.
      - name: "target-watch: report (aprender#2822)"
        if: always()
        continue-on-error: true
        run: |
          bash scripts/ci_target_watch.sh probe post-job
          bash scripts/ci_target_watch.sh report

  # ── THE CARGO-USING GUARDS, PARALLEL TO workspace-test ────────────────────
  #
  # These steps used to sit in `guard-tree`, where they were the bulk
  # of a 53-minute median / 85-minute p99 job. They are not moved here to be
  # faster in isolation: they are moved because they must NOT share
  # `/workspace/target` with workspace-test.
  #
  # workspace-test and the guard job are two jobs of the SAME run on two
  # runners of one host, and both bind-mounted
  # `/mnt/nvme-raid0/targets/aprender-ci/<PR>/run-<RUN_ID>` as
  # `/workspace/target` while both ran cargo against it. That is the
  # dep-info race behind aprender#2822 / `could not parse/generate dep info
  # at .../deps/<crate>.d: No such file or directory`. This job's container
  # steps mount `run-<RUN_ID>-guards` instead, so the two jobs can never
  # write one another's target tree.
  #
  # No `needs:` — running these AFTER workspace-test would serialise ~40
  # minutes onto every green run for no ordering that anything requires.
  workspace-test-shard:
    name: workspace-test-shard (${{ matrix.shard }}/${{ matrix.shards }})
    needs: [guard-tree]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        shards: [3]
    # PMAT-3138 (#3138): arch-neutral -- intel, yoga OR gx10. Measured 2026-09-12 on
    # gx10 with this image and env, --no-fail-fast: step 1 (59k tests) 10.6 min vs
    # 34.5 on intel, step 2 (102 tree readers) 6.7 vs 27.4, the over-the-cap
    # cargo check 84 s; test EXECUTION runs 3-4x faster on the idle 20-core box.
    # The four aarch64-only reds that pin found are fixed in the same PR (an x86
    # example, a shared-B GEMM defect, a wall-clock ratio moved to bench-gates, a
    # lane-count tolerance). pr-review-receipt keeps X64 until #3132.
    runs-on: [self-hosted, Linux, clean-room]
    # 100, not 85. The step below sets `timeout-minutes: 75`, but "Set up runner"
    # (image pull) has measured at 20 minutes, so 20 + 75 = 95 > 85 and the JOB
    # timeout always fired first -- producing a bare "The operation was canceled"
    # that names no step. Job 95162862834 died exactly on the 85-minute mark this
    # way. The step timeout must be the one that can fire, because it points at
    # the step; the job timeout is the backstop behind it.
    # 150, not 100 (2026-09-02, PMAT-742): run 33664039826's workspace-test was
    # killed at the 100-minute wall with ZERO failing tests, still inside the
    # Integration step, while the same box ran the pr-review-receipt mutation
    # sweep (100+ min), the guard job, four book jobs and the reusable workflow's
    # seven. Over-subscription is the fleet's intended headroom, so a required
    # check must not be a wall-clock assertion that the neighbours decide
    # (feedback_no_wallclock_in_required_checks); #2811 raises this for the
    # same reason. Successful runs measure 46-64 min; the limit sits above
    # the worst contended run, and a hang still fails at the step timeout.
    timeout-minutes: 150
    env:
      # The sccache host directory, named ONCE per job: the machine-specific-path
      # ratchet counts literals, and the quick-tier steps added two more copies
      # of a path this job already spelled five times (PMAT-1077).
      SCCACHE_HOST_DIR: /home/noah/data/sccache
      IMAGE: localhost:5000/sovereign-ci:stable
      # Per-SHARD, not per-PR: the first full-tier run (35361149112) put two
      # shards on the same host and both unpacked the same registry mount at
      # once -- "failed to unpack package aws-runtime" from `cargo metadata`,
      # exit 102 in 60 s. The registry (`cargo-ci/registry/<PR_OR_REF>`) and
      # the target parent (`targets/aprender-ci/<PR_OR_REF>/run-<id>`) both key
      # on this value, so suffixing it isolates a shard's whole cargo state and
      # keeps the reclaim planner's `run-<id>` naming intact under each parent.
      PR_OR_REF: ${{ github.event.pull_request.number || github.ref_name }}-s${{ matrix.shard }}
      SHARD: ${{ matrix.shard }}
      SHARDS: ${{ matrix.shards }}
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal)
        # Five-whys: the end-of-job "Fix file ownership" step is
        # `if: always()`, but a hard-killed job (runner death, forced
        # cancel) skips even always() steps → root-owned
        # target/.rustc_info.json + target/package/ survive in the runner
        # checkout → the NEXT run's actions/checkout `git clean -ffdx`
        # fails with EACCES (observed 2026-07-02: 4 jobs across PRs
        # #2257/#2258 on runners 10/14/16, each needing a manual
        # `ssh intel sudo rm` sweep). Restoring ownership BEFORE checkout
        # makes every run self-healing instead of depending on the
        # previous run's clean exit.
        # Soundness of the cached-image gate: leftovers can only exist if
        # a previous docker job ran on this runner — which implies the
        # image is already in the local cache. So "image not cached ⟹ no
        # leftovers" and skipping is safe (also keeps this step
        # registry-outage-tolerant).
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "$IMAGE" \
              bash -c 'chown -R 1000:1000 /workspace 2>/dev/null || true'
          else
            echo "Image not cached — no prior docker job on this runner, nothing to restore"
          fi
      - uses: actions/checkout@v7
      - name: Pull sovereign-ci image (with retry + local-cache fallback)
        # Self-hosted runner's local Docker registry at localhost:5000 is
        # occasionally restarting OR experiencing extended outages
        # (paiml/infra ops). Two layers of resilience:
        #   1. Check the local Docker daemon cache first — the image was
        #      successfully pulled on a prior run, so it's almost certainly
        #      still in the cache (Docker doesn't GC images unless `prune`
        #      is run). If present, skip the pull entirely; this makes the
        #      workflow registry-outage-tolerant.
        #   2. Otherwise, try to pull with 15-attempt linear-backoff retry
        #      (~13min total) — plenty for any normal restart cycle.
        # The local-cache path accepts slight staleness as the price of
        # registry-outage tolerance. paiml/infra:machines/intel/sovereign-
        # ci/rebuild.sh rebuilds the stable tag nightly so any drift gets
        # corrected within 24h on the next successful pull.
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already cached locally — skipping pull"
            echo "(local cache is registry-outage-tolerant; nightly rebuild keeps it fresh)"
            exit 0
          fi
          max_attempts=15
          delay=4
          for i in $(seq 1 $max_attempts); do
            if docker pull "$IMAGE"; then
              echo "Image pulled successfully on attempt $i"
              exit 0
            fi
            if [ "$i" -eq "$max_attempts" ]; then
              echo "::error::Registry localhost:5000 unreachable after $max_attempts attempts (~13min) AND image not in local cache"
              echo "::error::Suggests paiml/infra runner-side registry restart + initial image seed needed"
              exit 1
            fi
            echo "Pull attempt $i/$max_attempts failed; sleeping ${delay}s"
            sleep "$delay"
            delay=$((delay + 6))  # linear backoff: 4,10,16,22,28,34,...
          done
      - name: Target-dir reclaim planner must still turn RED (case table)
        # The planner below decides what gets rm -rf'd. Its own case table runs
        # first, in the same job, so it cannot rot into a step that only ever
        # passes: row 1a executes the OLD parent-wide removal against a fixture
        # holding a live sibling and REQUIRES it to destroy that sibling, and
        # row 2a requires a genuinely orphaned dir to still be reclaimed. A
        # blanket skip passes row 1 and fails row 2.
        run: bash scripts/ci_reclaim_target_dirs.sh --self-test
      - name: Reclaim orphaned per-RUN target dirs (never a live sibling)
        # WHAT THIS REPLACED, and why (#2825).
        #
        # This step used to run, whenever the previous run on the branch was
        # cancelled:
        #
        #   docker run --rm \
        #     -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}:/workspace/target" \
        #     "$IMAGE" bash -c 'rm -rf /workspace/target/* /workspace/target/.[!.]* ...'
        #
        # It mounted the PARENT. The tree is `aprender-ci/<PR>/run-<RUN_ID>`
        # since #1693, so `<PR>/` is the shared parent of every run for that PR
        # and `rm -rf <PR>/*` removed every sibling `run-*` directory with no
        # notion of whether the run owning it was still building.
        #
        # Its own five-whys (whose text is preserved below) was written against
        # a premise #1693 removed: "the target dir is bind-mounted from a per-PR
        # persistent path /mnt/nvme-raid0/targets/aprender-ci/<PR>/, so partial-
        # compile state survives across runs". Since #1693 the mount is per-RUN,
        # so no other run's state can reach this run at all. The parent-wide
        # removal bought nothing and could only take a sibling with it:
        #
        #   1. Why the "no such file or directory .rcgu.o" / missing-extern
        #      failures? Cargo's incremental state on the target dir is
        #      inconsistent.
        #   2. Why inconsistent? A prior cargo was SIGKILL'd mid-compile and
        #      left .rmeta without the matching .rcgu.o.
        #   3. Why SIGKILL'd? concurrency.cancel-in-progress cancels the
        #      previous run as soon as a new commit lands on the branch.
        #   4. Why did it persist? -- ANSWERED BY #1693. It no longer does:
        #      the mount is `<PR>/run-<RUN_ID>`, fresh per run.
        #   5. So the residual risk is not stale state reaching this run; it is
        #      this step reaching somebody else's live run.
        #
        # Measured 2026-08-31 over 36 of the last 100 runs:
        #   * workspace-test and guard-tree are two jobs of the SAME
        #     run, on two runners of one host, and both mount
        #     `<PR>/run-<RUN_ID>` (guard's "model-tests falsification suites"
        #     step). Their job windows overlap by 21-29 minutes.
        #   * The removal does fire: runs 33372476223 and 33375180919 both
        #     logged "Previous run was cancelled; nuking target dir".
        #   * The margin between this step and that sibling step on the shared
        #     directory is uncontrolled and CHANGES SIGN -- +7.6 min at the
        #     tightest (run 33369566809) and -10.8 min in run 33243677674,
        #     where this step ran AFTER the sibling's cargo instead of before.
        #     Nothing orders them; today it misses on luck, and the image pull
        #     this job documents at up to 20 minutes moves it either way.
        #
        # So the removal is scoped: `run-<THIS_RUN_ID>` is never touched (a
        # sibling JOB of this run is writing to it), and a sibling RUN's dir is
        # reclaimed only when the API says that run is completed -- or, if the
        # API cannot answer, only when the dir is older than the 100-minute job
        # timeout. That age fallback is deliberate: sparing everything on an
        # oracle outage would make this step inert exactly when it is needed.
        # Cleanup never fails the build; a planner error downgrades to a
        # warning and reclaims nothing.
        run: |
          set -uo pipefail
          set +e
          PARENT="/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}"
          PLAN="${RUNNER_TEMP:-/tmp}/reclaim-${GITHUB_RUN_ID}.txt"
          bash scripts/ci_reclaim_target_dirs.sh "$PARENT" "$GITHUB_RUN_ID" > "$PLAN"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::reclaim planner exited ${rc}; reclaiming nothing (cleanup never fails the build)"
            exit 0
          fi
          if [ ! -s "$PLAN" ]; then
            echo "Nothing to reclaim under ${PARENT}"
            exit 0
          fi
          echo "Reclaiming $(wc -l < "$PLAN") orphaned run dir(s):"
          cat "$PLAN"
          docker run --rm -i \
            -v "${PARENT}:/parent" \
            "$IMAGE" \
            bash -c 'set -u; while read -r d; do case "$d" in run-*) rm -rf "/parent/${d:?}" ;; *) echo "refusing to remove: ${d}" ;; esac; done; ls -la /parent' \
            < "$PLAN"
        env:
          GH_TOKEN: ${{ github.token }}
      # M2 (#3039, PMAT-1062): the per-PR parent under targets/aprender-ci is
      # created by the docker DAEMON, as root, by whichever job first bind-mounts
      # a path beneath it; every later job of the other kind then fails mkdir
      # with EACCES (guard-cargo on #3039; job ORDER decided it). Create both
      # levels here on the host, as the runner user, before any bind mount. A
      # parent an earlier run already left root-owned is chowned — that one
      # directory, not its contents — through the image, which runs as root,
      # exactly as the chown step below does for the run dir.
      - name: Create this run's target dir and registry on the host (before any bind mount)
        run: |
          set -euo pipefail
          # heal_path ROOT PATH: on a merge_group event PR_OR_REF is the queue
          # ref (gh-readonly-queue/main/pr-N-<sha>), so the per-ref dir is NESTED
          # and an ancestor may already be root-owned from a build whose bind
          # mount let the docker daemon create it (#3037's queue build: mkdir
          # EACCES on .../aprender-ci/gh-readonly-queue/...). Walk every
          # component from ROOT down; chown each existing unwritable one through
          # the image (that directory only, never its contents); then mkdir -p.
          heal_path() {
            local root=$1 path=$2 cur=$1 rel part
            rel=${path#"$root"/}
            IFS=/ read -ra parts <<< "$rel"
            for part in "${parts[@]}"; do
              cur="$cur/$part"
              if [ -d "$cur" ] && [ ! -w "$cur" ]; then
                docker run --rm -v "$(dirname "$cur"):/p" "$IMAGE" chown "$(id -u):$(id -g)" "/p/$(basename "$cur")"
              fi
            done
            mkdir -p "$path"
          }
          parent="/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}"
          reg="/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}"
          heal_path /mnt/nvme-raid0/targets/aprender-ci "${parent}/run-${GITHUB_RUN_ID}"
          heal_path /mnt/nvme-raid0/cargo-ci/registry "$reg"
          ls -ld "$parent" "${parent}/run-${GITHUB_RUN_ID}" "$reg"
      - name: Pre-build chown — fix per-RUN root ownership
        # Root cause (five-whys):
        #   1. Why do fresh runs sometimes fail with "failed to create
        #      /workspace/target/debug" / "No such file or directory"?
        #      Cargo (running as user 1000 inside the container) can't
        #      write to /workspace/target/debug.
        #   2. Why can't it write? The bind-mount source dir on the host
        #      (/mnt/nvme-raid0/targets/aprender-ci/<PR>/run-<RUN_ID>) is
        #      owned by root:root.
        #   3. Why is it root-owned? Docker's bind-mount creates missing
        #      host directories with the daemon's uid (root). Per-RUN
        #      paths are always fresh, so this fires every run.
        #   4. Why didn't this happen before? Pre-#1693 the per-PR (not
        #      per-RUN) path persisted across runs, and the downstream
        #      "post-job cleanup" docker chown step fixed ownership for
        #      the NEXT run's git-clean. Per-RUN paths invalidate that —
        #      each run gets a brand-new root-owned dir.
        #   5. Root cause: the chown step runs AFTER cargo, not BEFORE.
        #      First-runs always fail; reruns appear to work only when
        #      the previous run's belated chown fixed the now-stale dir.
        # Fix (this step): docker run as root, chown the per-RUN target
        # dir + cargo registry to noah:1000 BEFORE the cargo step.
        # Idempotent — `|| true` tolerates dirs that are already
        # noah-owned (e.g. a rerun of the same run-id).
        run: |
          docker run --rm \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            "$IMAGE" \
            bash -c 'chown -R 1000:1000 /workspace/target /usr/local/cargo/registry 2>/dev/null || true'
      # BSE-17 (PMAT-1077): which tier this run owes. quick on pull_request —
      # the touched crates + direct reverse dependents (BSE-16's selection, cap
      # -> full) plus EVERY test target that reads the tree, derived and
      # registry-checked (drift is ENV, never a quick tier over a stale list);
      # full on push/schedule/dispatch and on a merge_group whose tree is not
      # the tree a green PR head already ran; reuse on a merge_group whose
      # HEAD^{tree} equals the PR head's and whose workspace-test succeeded.
      # The touched set is the TIP diff against the base (shallow checkout: no
      # merge-base; tip-vs-tip is a superset, the safe direction) and the diff
      # command itself must succeed — an empty diff from a failed git would
      # read as "nothing touched", the fail-open shape. Feature-gated suites
      # (model-tests, setfit) stay in the full tier.
      - name: Decide the test tier (BSE-17, PMAT-1077)
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--event "${GITHUB_EVENT_NAME}")
          # PMAT-1098 67-E2: the queue and a push to main re-derive their own
          # diff from HEAD's FIRST PARENT (HEAD^1..HEAD is the PR's diff on the
          # new base). actions/checkout is shallow, so that parent is not in the
          # object store until we deepen -- and without it ci_test_tier.sh falls
          # closed to `full` every single time, which would make the whole
          # optimisation inert while looking like it worked. Best effort by
          # design: if the deepen fails the decision still falls closed, and the
          # warning below says so instead of the run silently paying the hour.
          case "${GITHUB_EVENT_NAME}" in
            merge_group|push)
              git fetch --no-tags --depth=2 origin "${GITHUB_SHA}" 2>/dev/null \
                || git fetch --no-tags --deepen=1 origin 2>/dev/null \
                || true
              if git rev-parse -q --verify 'HEAD^1' >/dev/null 2>&1; then
                printf 'first parent available: %s\n' "$(git rev-parse HEAD^1)"
              else
                printf '::warning::first parent unavailable after deepen -- the tier falls closed to full\n'
              fi
              ;;
          esac
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
              # --no-renames (#3664): a rename must list BOTH paths, or a source
              # moved into docs/ reads as docs-only and runs zero tests.
              git diff --no-renames --name-only "origin/${GITHUB_BASE_REF}" HEAD > "$RUNNER_TEMP/touched.txt"
              printf 'touched (tip vs tip): %s path(s)\n' "$(wc -l < "$RUNNER_TEMP/touched.txt" | tr -d ' ')"
              args+=(--diff-from "$RUNNER_TEMP/touched.txt")
              ;;
            merge_group)
              pr=$(printf '%s' "${GITHUB_REF_NAME}" | sed -n 's|^gh-readonly-queue/[^/]*/pr-\([0-9]*\)-.*|\1|p')
              if [ -n "$pr" ]; then
                head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .head.sha)
                git fetch --no-tags --depth=1 origin "$head"
                concl=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?check_name=workspace-test&per_page=20" --jq '[.check_runs[]|select(.status=="completed")]|sort_by(.completed_at)|last|.conclusion // "none"')
                args+=(--pr-head "$head" --pr-head-conclusion "${concl:-none}")
              fi
              ;;
          esac
          bash scripts/ci_test_tier.sh "${args[@]}" | tee "$RUNNER_TEMP/tier.txt"
          grep -E '^(tier|crates|targets|check_workspace|reason|cite)=' "$RUNNER_TEMP/tier.txt" >> "$GITHUB_OUTPUT"
      - name: Workspace lib tests (25,300+)
        if: steps.tier.outputs.tier == 'full'
        # Excluded: aprender-compute (SIMD SIGSEGV at exit), aprender-gpu and aprender-cuda-edge
        # -- each runs as its own step below. The GPU crates are `default = []`, but they
        # CANNOT ride this `--workspace` line: cargo unifies features across the whole
        # workspace, and `aprender-explain` depends on `aprender-gpu` with
        # `features = ["cuda"]` (non-optional), so under `--workspace` the cuda driver
        # compiles and its 217 `driver::` tests run -- on a GPU-less clean-room they panic
        # `CudaNotAvailable("CUDA driver not found")` (merge-queue run 34411725611, nextest
        # exit 100). Measured 2026-09-09 on main: `cargo nextest list --workspace --lib
        # -E 'package(aprender-gpu)'` lists 217 driver:: tests; `cargo nextest list
        # -p aprender-gpu -p aprender-cuda-edge --lib` lists 0 (the per-package resolve
        # this PR measured: 651 tests, 0.193s, green with CUDA_VISIBLE_DEVICES="").
        # Timeout: 75min (was 55, was 40).
        # 2026-05-15: bumped to 75min after the P0 per-run target-dir fix
        # (#1693) eliminated cargo-incremental cross-run warmth. Cold
        # compiles now happen on every run; sccache covers codegen
        # (~80% hit rate on warm cache) but cargo's metadata + linking +
        # test binaries still cost ~40-50min cold. Under runner-pool
        # saturation (7+ concurrent CI runs) we observed 55min hits
        # exactly at the timeout — runs 25919246467 / 25919258460 /
        # sibling PRs failed simultaneously at 55:00.0.
        #
        # 2026-06-24 (perf/ci-nextest, EXPERIMENT): switched from
        # `cargo test --workspace --lib` to `cargo nextest run`. Profiling the
        # ~40min job showed ~80% is SERIAL test EXECUTION (cargo's libtest runs
        # one test binary at a time; ~27min of the wall clock is just running
        # tests), not codegen (sccache already covers that). nextest runs every
        # test in its own process across a thread pool, so the ~25,300 tests
        # execute in PARALLEL across crates — the big lever. The exact
        # `--exclude` list is preserved verbatim (aprender-compute stays
        # excluded; its SIGSEGV-at-exit is handled by the dedicated "Compute
        # tests" step below). `--profile ci` uses .config/nextest.toml
        # ([profile.ci]: retries=0, fail-fast). line-tables-only debuginfo now
        # comes from root Cargo.toml [profile.test]; the CARGO_PROFILE_*_DEBUG
        # env vars are kept as belt-and-suspenders.
        timeout-minutes: 110
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "${SCCACHE_HOST_DIR}:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            -e SHARD -e SHARDS \
            -e CARGO_PROFILE_TEST_DEBUG=line-tables-only \
            -e CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            "$IMAGE" \
            cargo nextest run --profile ci --workspace --lib --exclude aprender-gpu --exclude aprender-cuda-edge --exclude aprender-compute --partition "hash:${SHARD}/${SHARDS}"
      - name: "GPU crates on their default features (per-package resolve, no device needed)"
        if: steps.tier.outputs.tier == 'full' && matrix.shard == 1
        # aprender-gpu + aprender-cuda-edge, un-darked from the required check (T0 of the
        # NVIDIA CUDA Rust spec, #3062). A per-package resolve keeps `cuda` OFF (see the
        # comment on the workspace line above); the `driver`/`kernels`/`memory`/`ptx` tests
        # stay behind `--features cuda` in the gx10 nightly (#3067).
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "${SCCACHE_HOST_DIR}:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            -e CARGO_PROFILE_TEST_DEBUG=line-tables-only \
            -e CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            "$IMAGE" \
            cargo nextest run --profile ci -p aprender-gpu -p aprender-cuda-edge --lib
      - name: Compute tests (tolerate SIGSEGV at exit — all tests pass but harness crashes on cleanup)
        if: steps.tier.outputs.tier == 'full' && matrix.shard == 1
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "${SCCACHE_HOST_DIR}:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            "$IMAGE" \
            bash -c 'cargo test -p aprender-compute --lib 2>&1 | tee /tmp/compute-test.log; grep -q "test result: ok\." /tmp/compute-test.log && ! grep -q "test result: FAILED" /tmp/compute-test.log'
      - name: Integration tests
        if: steps.tier.outputs.tier == 'full'
        # #2465: the four FALSIFY-AUTH targets were appended here because they
        # were DARK — `falsify_auth_002` appeared nowhere in .github/, scripts/
        # or Makefile, and neither did the contract loader
        # `apr_serve_api_key_auth_contract` that is supposed to promote
        # apr-serve-api-key-auth-v1 from DRAFT to ACTIVE. All 17 tests pass; they
        # simply never ran. This is also the list that hides such targets: adding
        # a `tests/*.rs` file does nothing until a fragment under
        # ci/explicit-test-commands.d/ names it.
        #
        # PMAT-3313 (operator ruling 4, §8 decision): the commands used to be ONE
        # physical line here, `bash -c '<39 commands joined by &&>'`, so any two
        # PRs adding a target conflicted (three of three conflicts in one backlog
        # drain). A single one-per-line file only moved that lock (two end-of-file
        # appends conflict, measured), so they are FRAGMENTS, the shape of
        # docs/roadmaps/entries/: ci/explicit-test-commands.d/NNN-<slug>.cmd, one
        # command per file, gapped ordinals (010, 020, ...) fixing the order. A new
        # command takes a free ordinal; two PRs adding different files never touch
        # the same path. scripts/ci_run_explicit_test_commands.sh reads them in
        # LC_ALL=C sort order, refuses a missing/empty directory, a fragment
        # without exactly one command, a shared ordinal, a duplicate command or a
        # misnamed entry, and stops at the FIRST non-zero command with its status.
        # The directory is parsed on the host first so a broken tree fails before
        # a container starts. scripts/check_explicit_test_commands.sh refuses a
        # `&&`-chained cargo line in any workflow; wiring readers that used to scan
        # only .github/workflows/ also read the fragments.
        #
        # perf/ci-nextest (rank 3 — integration collapse): INTENTIONALLY SKIPPED.
        # The investigation ranked collapsing these 8 `cargo test -p X --test Y`
        # invocations into ONE `cargo nextest run -E '...'` as rank 3 (low lever:
        # this step is NOT the ~27min bottleneck — the lib step is). It also
        # carries a real risk: this chain includes
        # `cargo test -p aprender-compute --lib beat_nf4_bitsandbytes_equivalence`,
        # and aprender-compute SIGSEGVs at harness EXIT. Under cargo's libtest a
        # single-name filter exits cleanly here, but nextest's per-test process
        # model would observe the segfaulting process exit code and could fail
        # the run. Per the experiment brief ("if fiddly/risky, SKIP — don't block
        # the experiment"), this step is left AS-IS so the nextest signal stays
        # attributable to the lib step alone. Revisit after the lib-step
        # measurement lands.
        #
        # #2589 (contracts-pv, 76 features / 0.0% covered): the same trap this
        # comment describes had swallowed `pv` whole. All three of
        # aprender-contracts-cli's integration targets — 651 lines that SPAWN the
        # pv binary — were absent from this line, so CI ran none of them, and the
        # audit correctly read 0% for the tool that decides whether a release is
        # contractually sound. Tests that never execute are not coverage.
        # `pv_surface_gate` (new), `cli_integration` (64) and `ground_truth` (34)
        # are wired in below. `book_coverage` is deliberately NOT: it is RED at
        # 4bbfeb07f — it walks contracts/*.yaml and chokes on contracts/binding.yaml
        # ("missing field `metadata`"), a binding registry rather than a contract.
        # It rotted precisely because nothing watched it; fixing it is separate work.
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci_run_explicit_test_commands.sh --list ci/explicit-test-commands.d
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "${SCCACHE_HOST_DIR}:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            -e SHARD -e SHARDS \
            "$IMAGE" \
            bash scripts/ci_run_explicit_test_commands.sh --run ci/explicit-test-commands.d --shard "${SHARD}/${SHARDS}"
      # PACK-001: the examples build used to be fragment 350 of the explicit
      # list. Measured on the first sharded full-tier run (35361149112, shard 1
      # on yoga): 489 s of that shard's 794 s integration phase was this ONE
      # command, so round-robin sharding could never balance it -- a shard that
      # drew it was the long pole regardless. It is its own step on shard 3
      # (whose fragment share is the lightest), so the three shards finish
      # together. Not a fragment because it is a build, not a test target, and
      # no wiring reader (check_model_tests_wired, check_beats_gated) names it.
      - name: Build every example (workspace, keep-going)
        if: steps.tier.outputs.tier == 'full' && matrix.shard == 3
        timeout-minutes: 40
        run: |
          set -euo pipefail
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "${SCCACHE_HOST_DIR}:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            -e SHARD -e SHARDS \
            "$IMAGE" \
            cargo build --examples --workspace --keep-going
      # BSE-17 quick tier, part 1: the selected crates' unit and integration
      # targets (default features) under the same image and mounts as the full
      # tier. Empty selection (a scripts/docs PR) skips this step; part 2 still runs.
      - name: "Quick tier: lib + integration tests of the selected crates (BSE-17)"
        if: steps.tier.outputs.tier == 'quick' && matrix.shard == 1 && steps.tier.outputs.crates != ''
        # 20, not 60 (PMAT-1098, #3084). A quick tier that is ALLOWED an hour is
        # not a quick tier, and 60 is the number that let part 2 burn 55 minutes
        # (run 34449608126) before dying at the cap under fleet load on #3063
        # (#3070). The budget is the assertion: over 20 minutes, this tier has
        # stopped being cheaper than the full one and should fail loudly.
        # 60 again, measured (2026-09-11, run 34617807644): the ONE-invocation quick
        # tier still compiles the selected crates' test binaries, and on an intel box
        # with 15/16 runners busy that build alone exceeded 20 minutes — the step was
        # killed at 20:00 with every test that had run green. A step cap that fires
        # under fleet load is a wall-clock assertion in a required check
        # (feedback_no_wallclock_in_required_checks); the job's 150 stays the cap.
        timeout-minutes: 60
        env:
          CRATES: ${{ steps.tier.outputs.crates }}
        run: |
          set -euo pipefail
          read -ra crates <<< "$CRATES"
          pkgs=""; for c in "${crates[@]}"; do pkgs="$pkgs -p $c"; done
          printf 'quick tier crates: %s\n' "$CRATES"
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "${SCCACHE_HOST_DIR}:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            -e CARGO_PROFILE_TEST_DEBUG=line-tables-only \
            -e CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            -e CARGO_TERM_COLOR=never \
            "$IMAGE" \
            bash -c "cargo nextest run --profile ci --lib --tests$pkgs"
      # BSE-17 quick tier, part 2: every test target that reads the tree, from
      # scripts/tree_reader_tests.txt (derived; the guard has already proved the
      # registry equals the sources in this run).
      #
      # PMAT-1098 (#3084) — ONE BUILD GRAPH. This step used to expand `targets`
      # into a `&&` chain of one `cargo nextest run -p CRATE ...` per crate: 26
      # cargo invocations for 41 targets, so the shared dependency graph was
      # resolved and linked 26 times and the 26 test runs went one after another.
      # Measured 55 minutes on a PR that touched a single YAML file (run
      # 34449608126) and killed at the 60-minute cap under fleet load on #3063
      # (#3070). A quick tier that costs more than the full tier is not an
      # optimisation, it is a second full tier with a smaller test set.
      #
      # The same registry tokens now become ONE nextest filterset
      # (`scripts/ci_test_tier.sh --filterset`, whose token->clause translation is
      # pinned in both polarities by that script's --self-test case table, an
      # unrecognised token being ENV rather than a silently dropped target). The
      # union is built once and every selected test runs in the single parallel
      # pool.
      #
      # `--workspace --lib --tests` is the BUILD set: nextest can only select from
      # binaries it built, and -E narrows the RUN to the registry. The three
      # `--exclude` crates are held verbatim from the full tier's `--workspace
      # --lib` line above and for the same reason stated there — under --workspace
      # feature unification pulls the cuda driver in, and those crates have their
      # own steps. None of them appears in the registry (check_tree_reader_tests.sh
      # reads this exclude list out of this file and drops their targets), so the
      # exclusion removes nothing the filterset asks for.
      - name: "Quick tier: every test target that reads the tree (BSE-17)"
        if: steps.tier.outputs.tier == 'quick' && matrix.shard == 1
        # 45, not 20. Measured 2026-09-11 under train load, this PR's own runs never fit 20: run 34542045481 on
        # yoga-build2 compiled 811 crates in ~9 min (cold per-run target dir, warm shared sccache) and was part way
        # through 65,266 tests at the cap; attempt 2 on intel-clean-room-15 timed out at 20 min too. The ~6 min
        # figure was never reproduced in CI. 45 still sits well under the serial tier's 60; re-tighten when measured.
        timeout-minutes: 45
        env:
          TARGETS: ${{ steps.tier.outputs.targets }}
        run: |
          set -euo pipefail
          read -ra targets <<< "$TARGETS"
          printf 'tree-reader targets: %s\n' "${#targets[@]}"
          # PMAT-1098 67-F2: build ONLY the packages the targets name. `--workspace
          # --lib --tests` built every test binary of every member to run 41 of
          # them: run 34680214617 attempt 1 compiled 421 crates after step 1 had
          # compiled 703, linked 686 binaries it then skipped, and spent 27.4 min
          # on 17 min of tests. A token is crate:--lib[:MOD] | crate:--bins |
          # crate:--test:NAME, so the package is the first field. The three
          # GPU/SIMD crates are excluded by the registry guard already
          # (check_tree_reader_tests.sh); filtered here again so a registry
          # drift can never pull them into a clean-room run.
          pkgs="$(printf '%s\n' "${targets[@]}" | cut -d: -f1 | sort -u \
                  | grep -vxE 'aprender-(gpu|cuda-edge|compute)' | sed 's/^/-p /' | tr '\n' ' ')"
          printf 'packages built: %s\n' "$(printf '%s' "$pkgs" | grep -o -- '-p ' | wc -l)"
          EXPR="$(bash scripts/ci_test_tier.sh --filterset "$TARGETS")"
          printf 'nextest filterset (%s clause(s)):\n' "$(printf '%s' "$EXPR" | tr '|' '\n' | wc -l)"
          printf '%s\n' "$EXPR" | tr '|' '\n' | sed 's/^ *//; s/ *$//; s/^/  + /'
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "${SCCACHE_HOST_DIR}:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            -e CARGO_PROFILE_TEST_DEBUG=line-tables-only \
            -e CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            -e CARGO_TERM_COLOR=never \
            "$IMAGE" \
            cargo nextest run --profile ci $pkgs --lib --tests -E "$EXPR"
      # BSE-17 quick tier, part 3 (PMAT-1098 67-E2, #3084 — rule (i)): the
      # selection was OVER THE CAP (touched crates + their direct reverse
      # dependents exceed gate_touched_crates.sh's CAP=3). That used to escalate
      # the entire run to the full tier — roughly an hour — for the ordinary case
      # of touching a widely-depended-on crate. The touched crates' own tests ran
      # in part 1; this step buys what the cap was really protecting, the reverse
      # dependents' INTEGRATION, at compile level over the WHOLE workspace in one
      # cargo invocation: minutes, not an hour. It catches exactly the class the
      # cap exists for — signature changes, trait-impl breakage, type errors in
      # every dependent, benches and examples included (--all-targets). A
      # behaviour regression inside an untouched dependent is not caught here; it
      # is what the nightly full tier is for (decision D-1).
      #
      # --locked: a quick tier that silently rewrites Cargo.lock would be a
      # different dependency graph from the one the PR is proposing.
      - name: "Quick tier: cargo check --workspace (over-the-cap integration, BSE-17 rule (i))"
        if: steps.tier.outputs.tier == 'quick' && steps.tier.outputs.check_workspace == '1' && matrix.shard == 1
        timeout-minutes: 20
        env:
          REASON: ${{ steps.tier.outputs.reason }}
        run: |
          set -euo pipefail
          printf 'over the cap: %s\n' "$REASON"
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "${SCCACHE_HOST_DIR}:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=/usr/local/cargo/bin/sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            -e CARGO_PROFILE_TEST_DEBUG=line-tables-only \
            -e CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            -e CARGO_TERM_COLOR=never \
            "$IMAGE" \
            cargo check --workspace --all-targets --locked
      # BSE-17 reuse: the queue ref's tree is byte-identical to a PR head whose
      # workspace-test already succeeded; measuring it again is waste, not
      # evidence. The tier step proved both facts (trees compared by hash, the
      # check-run's conclusion read from GitHub); this step records the citation.
      - name: "Reuse: this tree already passed workspace-test on the PR head (BSE-17)"
        if: steps.tier.outputs.tier == 'reuse'
        run: |
          printf 'workspace-test REUSED: %s\n' "${{ steps.tier.outputs.reason }}"
          printf 'cited PR head: %s\n' "${{ steps.tier.outputs.cite }}"
      # #3658 NONE: the tier step proved the change gives workspace-test nothing
      # to measure -- every touched path is under docs/roadmaps/ or docs/audits/
      # and present at HEAD (no Rust source, test or tree reader reads them), or
      # the change lands no path at all. Nothing is built or run; this step
      # records why, so the skip is auditable in the log.
      - name: "None: nothing for workspace-test to measure (#3658)"
        if: steps.tier.outputs.tier == 'none'
        env:
          REASON: ${{ steps.tier.outputs.reason }}
        run: |
          printf 'workspace-test NOT RUN: %s\n' "$REASON"
      - name: Build.rs crate-root escape check (v0.31.1 yank guard)
        if: matrix.shard == 1
        # Static Poka-Yoke: flags build.rs files that panic on files outside
        # CARGO_MANIFEST_DIR, which break `cargo install` from crates.io.
        # See scripts/check_build_rs_paths.sh for the full rationale.
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash scripts/check_build_rs_paths.sh
      - name: apr-format leaf sovereignty guard (#2231)
        if: matrix.shard == 1
        # Poka-Yoke: prove the extracted `apr-format` leaf pulls no ML/GPU/
        # tokenizer/framework crate (so consumers `cargo add apr-format` without
        # aprender-core + trueno/wgpu). Discriminating: PASSES on apr-format +
        # aprender-quant, FAILS on aprender-core. Also runs a publish dry-run to
        # catch dev-dep cycles. See scripts/check_format_sovereignty.sh.
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash scripts/check_format_sovereignty.sh
      - name: Fix file ownership (container runs as root, runner as noah:1000)
        if: always()
        run: |
          # Five-whys: Docker container creates files as root on bind-mounted
          # workspace. Runner (noah:1000) can't git-clean them on next run
          # → checkout fails → CI breaks. This runs inside the container
          # (as root) restoring host ownership for subsequent bare-metal jobs.
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            "$IMAGE" \
            bash -c 'chown -R 1000:1000 /workspace || true; chown -R 1000:1000 /usr/local/cargo/registry || true; chown -R 1000:1000 /workspace/target || true'

  # PACK-001: the check-run named `workspace-test`. Branch protection requires
  # this context, `gate` needs it, and the BSE-17 reuse lookup reads it by
  # check_name on the PR head -- so the name stays on ONE job that fans the
  # shards in. `if: always()` so a failed shard still produces a red check here
  # instead of a skipped one (a skipped required check blocks nothing and says
  # nothing). Every non-success matrix result is named. #3177: it also needs
  # guard-tree, only to NAME it -- the shards wait on guard-tree, so when they
  # were skipped the red here says which guard verdict skipped them.
  workspace-test:
    needs: [guard-tree, workspace-test-shard]
    if: always()
    runs-on: [self-hosted, Linux, clean-room]
    timeout-minutes: 10
    steps:
      - name: Every shard passed
        env:
          SHARD_RESULT: ${{ needs.workspace-test-shard.result }}
          GUARD_RESULT: ${{ needs.guard-tree.result }}
        run: |
          set -euo pipefail
          printf 'workspace-test-shard matrix result: %s (guard-tree: %s)\n' "$SHARD_RESULT" "$GUARD_RESULT"
          case "$SHARD_RESULT" in
            success) echo "workspace-test: all shards green" ;;
            skipped) echo "::error::workspace-test: shards skipped because guard-tree was '$GUARD_RESULT' (#3177: the shards wait on guard-tree; fix the guard first)"; exit 1 ;;
            *) echo "::error::workspace-test: shard matrix result is '$SHARD_RESULT' (a cancelled or skipped shard is not a pass)"; exit 1 ;;
          esac

  # PACK-001: mini-m4 had taken ZERO jobs in the 24 h measured -- nothing in any
  # workflow named macOS. The multiplatform dogfood requires a mini receipt at
  # post-publish and the three macOS-only defect classes on record (#2567 aarch64
  # scalar GEMV, #2568 an OOM guard that reads /proc/meminfo, #2572 a metal-only
  # dep) were each found only by building there. This lane is the cheap version:
  # a locked workspace check plus the CLI's lib tests, on the pinned toolchain
  # (rust-toolchain.toml; rustup on mini holds 1.93.0). No docker on macOS, so
  # the runner's own persistent target dir is used and nothing is bind-mounted.
  # Not in `gate`'s needs yet: first-green proof on a real PR before it may block.
