# Sovereign CI
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: paiml/.github/.github/workflows/sovereign-ci.yml@main
    with:
      repo: ${{ github.event.repository.name }}
    secrets: inherit

  trait-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check generated traits match YAML contracts
        run: |
          cargo build --release --bin pv
          for contract in contracts/softmax-kernel-v1.yaml contracts/rmsnorm-kernel-v1.yaml contracts/rope-kernel-v1.yaml contracts/activation-kernel-v1.yaml contracts/attention-kernel-v1.yaml contracts/matmul-kernel-v1.yaml contracts/layernorm-kernel-v1.yaml contracts/cross-entropy-kernel-v1.yaml contracts/silu-kernel-v1.yaml contracts/swiglu-kernel-v1.yaml contracts/gqa-kernel-v1.yaml contracts/flash-attention-v1.yaml contracts/adamw-kernel-v1.yaml; do
            stem=$(basename "$contract" .yaml)
            target/release/pv scaffold --trait "$contract" -o "/tmp/${stem//-/_}.rs"
            diff -q "crates/provable-contracts/src/traits/${stem//-/_}.rs" "/tmp/${stem//-/_}.rs" || {
              echo "STALE TRAIT: ${stem//-/_}.rs does not match $contract"
              echo "Regenerate with: pv scaffold --trait $contract -o crates/provable-contracts/src/traits/${stem//-/_}.rs"
              exit 1
            }
          done
          echo "All 13 traits match their YAML contracts"

  lean-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean 4 toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lean-${{ hashFiles('lean/lakefile.lean', 'lean/lean-toolchain') }}
          restore-keys: lean-
      - name: Build all Lean 4 theorems (0 sorry enforced)
        working-directory: lean
        run: lake build
      - name: Verify zero sorry in theorem files
        run: |
          sorry_count=$(grep -rl "sorry" lean/ProvableContracts/Theorems/ 2>/dev/null | wc -l)
          if [ "$sorry_count" -gt 0 ]; then
            echo "FATAL: $sorry_count theorem file(s) contain sorry"
            grep -rl "sorry" lean/ProvableContracts/Theorems/
            exit 1
          fi
          theorem_count=$(find lean/ProvableContracts/Theorems -name "*.lean" | wc -l)
          echo "L5 verified: $theorem_count theorems, 0 sorry"

  gate:
    needs: [ci, trait-staleness, lean-proofs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "ci: ${{ needs.ci.result }}"
          echo "trait-staleness: ${{ needs.trait-staleness.result }}"
          echo "lean-proofs: ${{ needs.lean-proofs.result }}"
          [[ "${{ needs.ci.result }}" == "success" ]] || { echo "FAILED: ci (${{ needs.ci.result }})"; exit 1; }
          [[ "${{ needs.trait-staleness.result }}" == "success" ]] || { echo "FAILED: trait-staleness (${{ needs.trait-staleness.result }})"; exit 1; }
          [[ "${{ needs.lean-proofs.result }}" == "success" ]] || { echo "FAILED: lean-proofs (${{ needs.lean-proofs.result }})"; exit 1; }
          echo "All checks passed"
