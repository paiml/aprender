      # container that mounts it and drops to the runner's uid cannot write
      # the directory the daemon just made for it. Create both host paths
      # FIRST, from the runner user, in a plain step — then the mount source
      # already exists and is already owned by the uid the container runs as.
      # `registry/` is created here too so the first container to use the
      # cargo home finds it, and the two lock files (.package-cache,
      # .package-cache-mutate) are created by cargo itself INSIDE this same
      # directory — which is the entire reason the mount is $CARGO_HOME and
      # not $CARGO_HOME/registry.
      - name: Create this job's own target dir and CARGO_HOME (before any bind mount)
        run: |
          # A root-owned parent (created by the docker daemon for another job's
          # bind mount, #3039) is chowned through the image before the mkdir;
          # that one directory only, never its contents.
          # heal_path ROOT PATH: on a merge_group event PR_OR_REF is the queue
          # ref (gh-readonly-queue/main/pr-N-<sha>), so the per-ref dir is NESTED
          # and an ancestor may already be root-owned from a build whose bind
