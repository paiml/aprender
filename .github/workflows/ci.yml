# Sovereign CI — calls reusable workflow from paiml/.github
# Change once in paiml/.github → applies to all repos
#
# Jobs provided by sovereign-ci.yml:
#   test: cargo test --lib (self-hosted clean-room)
#   lint: cargo clippy --all-targets -- -D warnings + cargo fmt --check
#   coverage: cargo llvm-cov + codecov upload
#   security: cargo audit (ubuntu-latest, continue-on-error)
#   provenance: SLSA attest-build-provenance
#   gate: aggregates test+lint results
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Merge queue: GitHub dispatches a `merge_group` event for each batch it forms.
  # Both required checks (`ci / gate` via the reusable sovereign-ci call, and the
  # top-level `workspace-test` job) live in THIS workflow, so triggering here makes
  # both run against the queued batch. Without this trigger, enabling the queue jams
  # every PR (no checks ever run on the merge_group ref → nothing merges).
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: paiml/.github/.github/workflows/sovereign-ci.yml@main
    with:
      repo: ${{ github.event.repository.name }}
      # Phase 3 pilot (heavy workload) — build-performance.md §7 Phase 3.
      # APR-MONO monorepo: 879+ compile units, largest dep graph in the fleet.
      # Highest expected sccache hit-rate lift; without it each PR cold-compiles
      # in its per-PR-per-run target dir
      # (`/mnt/nvme-raid0/targets/aprender-ci/<PR>/run-<RUN_ID>`)
      # for ~34min, leaving only ~4min for tests inside the 40min timeout —
      # the entire merge queue saturates.
      #
      # 2026-05-15: target-dir path bumped from `aprender-ci/<PR>` to
      # `aprender-ci/<PR>/run-<RUN_ID>` to break the cancel-corrupt-state
      # race introduced by the prior per-PR fix (paiml/.github#31,
      # 2026-04-23). `concurrency.cancel-in-progress: true` + persistent
      # per-PR mount = the SIGTERM→SIGKILL window of a dying old cargo
      # corrupted `/workspace/target/debug/deps/` for the new run that
      # mounted the same host path. sccache stays on its own mount, so
      # cross-run cache effectiveness is preserved; only cargo-incremental
      # state (small fraction of total compile) is lost per new run.
      #
      # 2026-04-19: temporarily disabled — sovereign-ci:stable container image
      # was missing the `rustc-sccache` wrapper script. Fixed upstream in
      # paiml/infra commit f4fccf9 (PR #66, "use exec script not symlink").
      # 2026-05-12: re-enabled — image verified to ship `/usr/local/bin/rustc-sccache`
      # (sccache 0.14.0), shared cache at `/home/noah/data/sccache` (warm, ~11GB).
      # 2026-08-20: that "warm, ~11GB" was NOT health — it was the cache pinned
      # at sccache's DEFAULT 10 GiB cap. /var/log/ci-metrics/sccache-*.json has
      # recorded cache_size and max_cache_size on every job all along (18,292
      # files); nothing ever compared them. All of the newest 4000 samples read
      # cache_size within ~2 KB of max_cache_size, i.e. an LRU evicting on every
      # write. paiml-mcp-agent-toolkit-coverage was running 1240 compile requests
      # for 5 hits and 811 misses. Cap raised to 50G in paiml/infra#230 and
      # paiml/.github#50; the workspace-test job below passes the SAME value,
      # because a server capped lower EVICTS the shared cache back down to its
      # own cap — a mixed cap is strictly worse than a uniform small one.
      enable_sccache: true
      use_nextest: true
      # NOTE: coverage_min (the opt-in coverage ratchet from the build-system audit)
      # is intentionally NOT set on aprender. The pilot run exposed that aprender's
      # ROOT crate is a facade — the sovereign-ci coverage job runs `--lib` on the
      # root and exercises 0 tests ("test result: ok. 0 passed"); all real code +
      # tests live in workspace members, run by the separate `workspace-test` job.
      # So coverage_min has no lcov data to gate on. Making it meaningful here needs
      # test_workspace: true + GPU-member test_args exclusions first (the PMAT-159
      # workspace blind-spot). Tracked as a follow-up. The coverage ratchet
      # MECHANISM is live fleet-wide via sovereign-ci (#37); a single-crate repo is
      # the natural first coverage pilot. aprender's blocking-quality pilot is the
      # diff-scoped mutation gate below.
    secrets: inherit

  # APR-MONO: Workspace-wide test (all 75 crates)
  #
  # 2026-05-13: Refactored from GH Actions `container:` syntax (which forces an
  # unconditional `docker pull` with only 3 retries / ~6s total backoff) to
  # explicit `docker run` steps with a 15-attempt linear-backoff pull retry.
  # The previous design conflated "image is required" with "registry must be
  # reachable at pull time" — when `localhost:5000` blipped (registry restart,
  # network reload), the pull failed and the whole job died after ~25s. This
  # refactor preserves the same execution semantics (same image, same volume
  # mounts, same env) but moves the pull into a step the workflow controls,
  # giving us up to ~13 minutes of retry headroom before declaring the
  # registry unreachable. Mirrored in the `mutants` job below.
  workspace-test:
    runs-on: [self-hosted, X64, Linux, clean-room]
    # 100, not 85. The step below sets `timeout-minutes: 75`, but "Set up runner"
    # (image pull) has measured at 20 minutes, so 20 + 75 = 95 > 85 and the JOB
    # timeout always fired first -- producing a bare "The operation was canceled"
    # that names no step. Job 95162862834 died exactly on the 85-minute mark this
    # way. The step timeout must be the one that can fire, because it points at
    # the step; the job timeout is the backstop behind it.
    timeout-minutes: 100
    env:
      IMAGE: localhost:5000/sovereign-ci:stable
      PR_OR_REF: ${{ github.event.pull_request.number || github.ref_name }}
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal)
        # Five-whys: the end-of-job "Fix file ownership" step is
        # `if: always()`, but a hard-killed job (runner death, forced
        # cancel) skips even always() steps → root-owned
        # target/.rustc_info.json + target/package/ survive in the runner
        # checkout → the NEXT run's actions/checkout `git clean -ffdx`
        # fails with EACCES (observed 2026-07-02: 4 jobs across PRs
        # #2257/#2258 on runners 10/14/16, each needing a manual
        # `ssh intel sudo rm` sweep). Restoring ownership BEFORE checkout
        # makes every run self-healing instead of depending on the
        # previous run's clean exit.
        # Soundness of the cached-image gate: leftovers can only exist if
        # a previous docker job ran on this runner — which implies the
        # image is already in the local cache. So "image not cached ⟹ no
        # leftovers" and skipping is safe (also keeps this step
        # registry-outage-tolerant).
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "$IMAGE" \
              bash -c 'chown -R 1000:1000 /workspace 2>/dev/null || true'
          else
            echo "Image not cached — no prior docker job on this runner, nothing to restore"
          fi
      - uses: actions/checkout@v7
      - name: Pull sovereign-ci image (with retry + local-cache fallback)
        # Self-hosted runner's local Docker registry at localhost:5000 is
        # occasionally restarting OR experiencing extended outages
        # (paiml/infra ops). Two layers of resilience:
        #   1. Check the local Docker daemon cache first — the image was
        #      successfully pulled on a prior run, so it's almost certainly
        #      still in the cache (Docker doesn't GC images unless `prune`
        #      is run). If present, skip the pull entirely; this makes the
        #      workflow registry-outage-tolerant.
        #   2. Otherwise, try to pull with 15-attempt linear-backoff retry
        #      (~13min total) — plenty for any normal restart cycle.
        # The local-cache path accepts slight staleness as the price of
        # registry-outage tolerance. paiml/infra:machines/intel/sovereign-
        # ci/rebuild.sh rebuilds the stable tag nightly so any drift gets
        # corrected within 24h on the next successful pull.
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already cached locally — skipping pull"
            echo "(local cache is registry-outage-tolerant; nightly rebuild keeps it fresh)"
            exit 0
          fi
          max_attempts=15
          delay=4
          for i in $(seq 1 $max_attempts); do
            if docker pull "$IMAGE"; then
              echo "Image pulled successfully on attempt $i"
              exit 0
            fi
            if [ $i -eq $max_attempts ]; then
              echo "::error::Registry localhost:5000 unreachable after $max_attempts attempts (~13min) AND image not in local cache"
              echo "::error::Suggests paiml/infra runner-side registry restart + initial image seed needed"
              exit 1
            fi
            echo "Pull attempt $i/$max_attempts failed; sleeping ${delay}s"
            sleep "$delay"
            delay=$((delay + 6))  # linear backoff: 4,10,16,22,28,34,...
          done
      - name: Target-dir reclaim planner must still turn RED (case table)
        # The planner below decides what gets rm -rf'd. Its own case table runs
        # first, in the same job, so it cannot rot into a step that only ever
        # passes: row 1a executes the OLD parent-wide removal against a fixture
        # holding a live sibling and REQUIRES it to destroy that sibling, and
        # row 2a requires a genuinely orphaned dir to still be reclaimed. A
        # blanket skip passes row 1 and fails row 2.
        run: bash scripts/ci_reclaim_target_dirs.sh --self-test
      - name: Reclaim orphaned per-RUN target dirs (never a live sibling)
        # WHAT THIS REPLACED, and why (#2825).
        #
        # This step used to run, whenever the previous run on the branch was
        # cancelled:
        #
        #   docker run --rm \
        #     -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}:/workspace/target" \
        #     "$IMAGE" bash -c 'rm -rf /workspace/target/* /workspace/target/.[!.]* ...'
        #
        # It mounted the PARENT. The tree is `aprender-ci/<PR>/run-<RUN_ID>`
        # since #1693, so `<PR>/` is the shared parent of every run for that PR
        # and `rm -rf <PR>/*` removed every sibling `run-*` directory with no
        # notion of whether the run owning it was still building.
        #
        # Its own five-whys (whose text is preserved below) was written against
        # a premise #1693 removed: "the target dir is bind-mounted from a per-PR
        # persistent path /mnt/nvme-raid0/targets/aprender-ci/<PR>/, so partial-
        # compile state survives across runs". Since #1693 the mount is per-RUN,
        # so no other run's state can reach this run at all. The parent-wide
        # removal bought nothing and could only take a sibling with it:
        #
        #   1. Why the "no such file or directory .rcgu.o" / missing-extern
        #      failures? Cargo's incremental state on the target dir is
        #      inconsistent.
        #   2. Why inconsistent? A prior cargo was SIGKILL'd mid-compile and
        #      left .rmeta without the matching .rcgu.o.
        #   3. Why SIGKILL'd? concurrency.cancel-in-progress cancels the
        #      previous run as soon as a new commit lands on the branch.
        #   4. Why did it persist? -- ANSWERED BY #1693. It no longer does:
        #      the mount is `<PR>/run-<RUN_ID>`, fresh per run.
        #   5. So the residual risk is not stale state reaching this run; it is
        #      this step reaching somebody else's live run.
        #
        # Measured 2026-08-31 over 36 of the last 100 runs:
        #   * workspace-test and guard-runner-labels are two jobs of the SAME
        #     run, on two runners of one host, and both mount
        #     `<PR>/run-<RUN_ID>` (guard's "model-tests falsification suites"
        #     step). Their job windows overlap by 21-29 minutes.
        #   * The removal does fire: runs 33372476223 and 33375180919 both
        #     logged "Previous run was cancelled; nuking target dir".
        #   * The margin between this step and that sibling step on the shared
        #     directory is uncontrolled and CHANGES SIGN -- +7.6 min at the
        #     tightest (run 33369566809) and -10.8 min in run 33243677674,
        #     where this step ran AFTER the sibling's cargo instead of before.
        #     Nothing orders them; today it misses on luck, and the image pull
        #     this job documents at up to 20 minutes moves it either way.
        #
        # So the removal is scoped: `run-<THIS_RUN_ID>` is never touched (a
        # sibling JOB of this run is writing to it), and a sibling RUN's dir is
        # reclaimed only when the API says that run is completed -- or, if the
        # API cannot answer, only when the dir is older than the 100-minute job
        # timeout. That age fallback is deliberate: sparing everything on an
        # oracle outage would make this step inert exactly when it is needed.
        # Cleanup never fails the build; a planner error downgrades to a
        # warning and reclaims nothing.
        run: |
          set -uo pipefail
          set +e
          PARENT="/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}"
          PLAN="${RUNNER_TEMP:-/tmp}/reclaim-${GITHUB_RUN_ID}.txt"
          bash scripts/ci_reclaim_target_dirs.sh "$PARENT" "$GITHUB_RUN_ID" > "$PLAN"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::reclaim planner exited ${rc}; reclaiming nothing (cleanup never fails the build)"
            exit 0
          fi
          if [ ! -s "$PLAN" ]; then
            echo "Nothing to reclaim under ${PARENT}"
            exit 0
          fi
          echo "Reclaiming $(wc -l < "$PLAN") orphaned run dir(s):"
          cat "$PLAN"
          docker run --rm -i \
            -v "${PARENT}:/parent" \
            "$IMAGE" \
            bash -c 'set -u; while read -r d; do case "$d" in run-*) rm -rf "/parent/${d:?}" ;; *) echo "refusing to remove: ${d}" ;; esac; done; ls -la /parent' \
            < "$PLAN"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Pre-build chown — fix per-RUN root ownership
        # Root cause (five-whys):
        #   1. Why do fresh runs sometimes fail with "failed to create
        #      /workspace/target/debug" / "No such file or directory"?
        #      Cargo (running as user 1000 inside the container) can't
        #      write to /workspace/target/debug.
        #   2. Why can't it write? The bind-mount source dir on the host
        #      (/mnt/nvme-raid0/targets/aprender-ci/<PR>/run-<RUN_ID>) is
        #      owned by root:root.
        #   3. Why is it root-owned? Docker's bind-mount creates missing
        #      host directories with the daemon's uid (root). Per-RUN
        #      paths are always fresh, so this fires every run.
        #   4. Why didn't this happen before? Pre-#1693 the per-PR (not
        #      per-RUN) path persisted across runs, and the downstream
        #      "post-job cleanup" docker chown step fixed ownership for
        #      the NEXT run's git-clean. Per-RUN paths invalidate that —
        #      each run gets a brand-new root-owned dir.
        #   5. Root cause: the chown step runs AFTER cargo, not BEFORE.
        #      First-runs always fail; reruns appear to work only when
        #      the previous run's belated chown fixed the now-stale dir.
        # Fix (this step): docker run as root, chown the per-RUN target
        # dir + cargo registry to noah:1000 BEFORE the cargo step.
        # Idempotent — `|| true` tolerates dirs that are already
        # noah-owned (e.g. a rerun of the same run-id).
        run: |
          docker run --rm \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            "$IMAGE" \
            bash -c 'chown -R 1000:1000 /workspace/target /usr/local/cargo/registry 2>/dev/null || true'
      - name: Workspace lib tests (25,300+)
        # Excluded: aprender-gpu (cuBLAS), aprender-cuda-edge (CUDA), aprender-compute (SIMD SIGSEGV at exit)
        # Timeout: 75min (was 55, was 40).
        # 2026-05-15: bumped to 75min after the P0 per-run target-dir fix
        # (#1693) eliminated cargo-incremental cross-run warmth. Cold
        # compiles now happen on every run; sccache covers codegen
        # (~80% hit rate on warm cache) but cargo's metadata + linking +
        # test binaries still cost ~40-50min cold. Under runner-pool
        # saturation (7+ concurrent CI runs) we observed 55min hits
        # exactly at the timeout — runs 25919246467 / 25919258460 /
        # sibling PRs failed simultaneously at 55:00.0.
        #
        # 2026-06-24 (perf/ci-nextest, EXPERIMENT): switched from
        # `cargo test --workspace --lib` to `cargo nextest run`. Profiling the
        # ~40min job showed ~80% is SERIAL test EXECUTION (cargo's libtest runs
        # one test binary at a time; ~27min of the wall clock is just running
        # tests), not codegen (sccache already covers that). nextest runs every
        # test in its own process across a thread pool, so the ~25,300 tests
        # execute in PARALLEL across crates — the big lever. The exact
        # `--exclude` list is preserved verbatim (aprender-compute stays
        # excluded; its SIGSEGV-at-exit is handled by the dedicated "Compute
        # tests" step below). `--profile ci` uses .config/nextest.toml
        # ([profile.ci]: retries=0, fail-fast). line-tables-only debuginfo now
        # comes from root Cargo.toml [profile.test]; the CARGO_PROFILE_*_DEBUG
        # env vars are kept as belt-and-suspenders.
        timeout-minutes: 75
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "/home/noah/data/sccache:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=rustc-sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            -e CARGO_PROFILE_TEST_DEBUG=line-tables-only \
            -e CARGO_PROFILE_DEV_DEBUG=line-tables-only \
            "$IMAGE" \
            cargo nextest run --profile ci --workspace --lib --exclude aprender-gpu --exclude aprender-cuda-edge --exclude aprender-compute
      - name: Compute tests (tolerate SIGSEGV at exit — all tests pass but harness crashes on cleanup)
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "/home/noah/data/sccache:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=rustc-sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            "$IMAGE" \
            bash -c 'cargo test -p aprender-compute --lib 2>&1 | tee /tmp/compute-test.log; grep -q "test result: ok\." /tmp/compute-test.log && ! grep -q "test result: FAILED" /tmp/compute-test.log'
      - name: Integration tests
        # #2465: the four FALSIFY-AUTH targets were appended here because they
        # were DARK — `falsify_auth_002` appeared nowhere in .github/, scripts/
        # or Makefile, and neither did the contract loader
        # `apr_serve_api_key_auth_contract` that is supposed to promote
        # apr-serve-api-key-auth-v1 from DRAFT to ACTIVE. All 17 tests pass; they
        # simply never ran. This is also the line that hides such targets: adding
        # a `tests/*.rs` file does nothing until its name appears HERE, and only
        # one PR at a time may edit this single physical line without hitting a
        # merge-queue conflict.
        #
        # perf/ci-nextest (rank 3 — integration collapse): INTENTIONALLY SKIPPED.
        # The investigation ranked collapsing these 8 `cargo test -p X --test Y`
        # invocations into ONE `cargo nextest run -E '...'` as rank 3 (low lever:
        # this step is NOT the ~27min bottleneck — the lib step is). It also
        # carries a real risk: this chain includes
        # `cargo test -p aprender-compute --lib beat_nf4_bitsandbytes_equivalence`,
        # and aprender-compute SIGSEGVs at harness EXIT. Under cargo's libtest a
        # single-name filter exits cleanly here, but nextest's per-test process
        # model would observe the segfaulting process exit code and could fail
        # the run. Per the experiment brief ("if fiddly/risky, SKIP — don't block
        # the experiment"), this step is left AS-IS so the nextest signal stays
        # attributable to the lib step alone. Revisit after the lib-step
        # measurement lands.
        #
        # #2589 (contracts-pv, 76 features / 0.0% covered): the same trap this
        # comment describes had swallowed `pv` whole. All three of
        # aprender-contracts-cli's integration targets — 651 lines that SPAWN the
        # pv binary — were absent from this line, so CI ran none of them, and the
        # audit correctly read 0% for the tool that decides whether a release is
        # contractually sound. Tests that never execute are not coverage.
        # `pv_surface_gate` (new), `cli_integration` (64) and `ground_truth` (34)
        # are wired in below. `book_coverage` is deliberately NOT: it is RED at
        # 4bbfeb07f — it walks contracts/*.yaml and chokes on contracts/binding.yaml
        # ("missing field `metadata`"), a binding registry rather than a contract.
        # It rotted precisely because nothing watched it; fixing it is separate work.
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "/home/noah/data/sccache:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=rustc-sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            "$IMAGE" \
            bash -c 'cargo test -p aprender-core --features setfit --lib setfit && cargo test -p aprender-core --features setfit,conformance-fixtures --test setfit_conformance && cargo test -p aprender-core --test monorepo_invariants && cargo test -p aprender-core --test readme_contract && cargo test -p apr-cli --test cli_commands && cargo test -p aprender-train-inspect --test falsify_no_fabricated_metadata_2519 && cargo test -p aprender-train-bench --test falsify_no_fabricated_benchmarks_2519 && cargo test -p aprender-train-shell --test falsify_no_fabricated_fetch_2519 && cargo test -p aprender-core --test beat_sklearn_iris && cargo test -p aprender-core --test beat_sklearn_nmi && cargo test -p aprender-core --test beat_sklearn_metrics_parity && cargo test -p aprender-core --test beat_sklearn_gaussiannb_accuracy && cargo test -p aprender-core --test beat_sklearn_svc_accuracy && cargo test -p aprender-core --test beat_sklearn_pipeline_encoder && cargo test -p aprender-serve --test beat_fail_closed_garbage && cargo test -p aprender-compute --lib beat_nf4_bitsandbytes_equivalence && cargo test -p aprender-core --test beat_pytorch_autograd_grad && cargo test -p aprender-train-lora --lib beat_lora_merge_forward_equivalence && cargo test -p apr-cli --release --test beat_pytorch_deploy_footprint && cargo test -p aprender-serve --test beat_fail_closed_structural && cargo test -p aprender-serve --test ollama_http_compat && cargo test -p apr-cli --test ollama_ndjson_streaming && cargo test -p apr-cli --test falsification_chat_http_cli && cargo test -p aprender-contracts --test apr_serve_api_key_auth_contract && cargo test -p apr-cli --test falsify_auth_001 --test falsify_auth_002 --test falsify_auth_003 --no-fail-fast && cargo test -p apr-cli --test beat_apr_data_alimentar_reach && cargo test -p apr-cli --test beat_apr_sibling_cli_reach && cargo test -p aprender-contracts-cli --test pv_surface_gate && cargo test -p aprender-contracts-cli --test cli_integration && cargo test -p aprender-contracts-cli --test ground_truth && cargo test -p aprender-contracts-cli --test version_identity && cargo build --examples --workspace --keep-going && cargo check --workspace --benches --locked'
      - name: Build.rs crate-root escape check (v0.31.1 yank guard)
        # Static Poka-Yoke: flags build.rs files that panic on files outside
        # CARGO_MANIFEST_DIR, which break `cargo install` from crates.io.
        # See scripts/check_build_rs_paths.sh for the full rationale.
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash scripts/check_build_rs_paths.sh
      - name: apr-format leaf sovereignty guard (#2231)
        # Poka-Yoke: prove the extracted `apr-format` leaf pulls no ML/GPU/
        # tokenizer/framework crate (so consumers `cargo add apr-format` without
        # aprender-core + trueno/wgpu). Discriminating: PASSES on apr-format +
        # aprender-quant, FAILS on aprender-core. Also runs a publish dry-run to
        # catch dev-dep cycles. See scripts/check_format_sovereignty.sh.
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "$IMAGE" \
            bash scripts/check_format_sovereignty.sh
      - name: Fix file ownership (container runs as root, runner as noah:1000)
        if: always()
        run: |
          # Five-whys: Docker container creates files as root on bind-mounted
          # workspace. Runner (noah:1000) can't git-clean them on next run
          # → checkout fails → CI breaks. This runs inside the container
          # (as root) restoring host ownership for subsequent bare-metal jobs.
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            "$IMAGE" \
            bash -c 'chown -R 1000:1000 /workspace || true; chown -R 1000:1000 /usr/local/cargo/registry || true; chown -R 1000:1000 /workspace/target || true'

  # Poka-yoke (aprender#2269): fail fast if ANY self-hosted job omits a
  # discriminating runner label, so a bare [self-hosted, X64, Linux] selector
  # can never again silently land a job on a GPU/dev runner without the
  # sovereign-ci registry. Pure text check; runs on the clean-room pool.
  guard-runner-labels:
    runs-on: [self-hosted, X64, Linux, clean-room]
    env:
      IMAGE: localhost:5000/sovereign-ci:stable
      # Same definition as workspace-test (:106). aprender#2627: the
      # model-tests step below was added with workspace-test's mount lines
      # copied verbatim, but PR_OR_REF is JOB-level env there and this job
      # never had it. An undefined shell variable is the empty string, so
      # `.../registry/${PR_OR_REF}` collapsed to `.../registry/` -- the SHARED
      # PARENT of every PR's registry, bind-mounted AS the cargo registry. Its
      # children are PR numbers, not cache/index/src, so every dependency
      # re-downloads and writes into the parent. The per-run target dir
      # likewise collapsed to `.../aprender-ci//run-<id>`, outside the tree
      # any other step reuses. Nothing errors; the step just silently stops
      # being the thing its own comment describes. check_workflow_env_defined.sh
      # now fails closed on any run: block interpolating a name its job does
      # not define.
      PR_OR_REF: ${{ github.event.pull_request.number || github.ref_name }}
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal)
        # Same guard as workspace-test (:92) and mutants (:435). This job was
        # the ONLY clean-room job missing it, and that asymmetry took main red
        # on 2026-07-06 (run 28776891625): a hard-killed docker job left
        # root-owned target/.rustc_info.json + target/package/ in the runner
        # checkout, so this job's actions/checkout `git clean -ffdx` failed
        # with EACCES before a single step ran. Because `gate` hard-requires
        # guard-runner-labels (:379), a checkout-level EACCES here reads as a
        # required-check failure and blocks every merge — the andon stays red
        # until someone manually `ssh intel sudo rm`s the leftovers.
        # Cached-image gate is sound: leftovers can only exist if a previous
        # docker job ran on this runner, which implies the image is already in
        # the local cache. So "image not cached ⟹ no leftovers" and skipping is
        # safe (and keeps this step tolerant of a registry outage).
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "$IMAGE" \
              bash -c 'chown -R 1000:1000 /workspace 2>/dev/null || true'
          else
            echo "Image not cached — no prior docker job on this runner, nothing to restore"
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # THE COMPARAND, FETCHED ONCE, BEFORE ANY GUARD THAT NEEDS IT.
      #
      # Every shrink-only baseline in scripts/ is now compared against a ref a
      # pull request cannot rewrite, because twelve of them were compared
      # against nothing: appending one entry -- cloned from that file's own last
      # real entry -- returned rc=0 from all twelve, and on two of them the
      # appended entry laundered a violation created in the same commit.
      #
      # This step used to sit ~180 lines down, next to the one guard that
      # needed it. Three ratcheted guards (shell lint, hand-rolled parsers,
      # assertion exclusion) run BEFORE that point and would have had an
      # unresolvable comparand -- which those guards treat as a hard failure,
      # never as "no growth", so the mistake would have been loud rather than
      # silent. It is still a mistake. One fetch, before all of them.
      #
      # fetch-depth is 1 here, so the merge-base is usually unavailable and the
      # ratchets fall back to the origin/main TIP. That is the STRICTER
      # comparand, and it means the CI path is the tip path: a local run that
      # passes on the merge-base can still red here, and CI is authoritative.
      - name: Fetch origin/main as the comparand for every ratchet in this job
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # aprender#2822. Case table FIRST, per the convention above: the probe
      # below is only worth its 0.15s if the classifier it feeds can still turn
      # RED. Seven rows over a throwaway tree - no cargo, no network, no host.
      # Mutation-verified: deleting the sentinel rule, deleting the inode rule,
      # or restoring the read-after-plant ordering bug each takes it RED.
      #
      # This step IS a gate and may fail the job. The probe and report steps are
      # not and never can - a recorder that can red a required check is a
      # liability, and #2822 is already red.
      - name: "target-watch case table (aprender#2822)"
        run: bash scripts/ci_target_watch.sh --self-test
      - name: "target-watch: post-checkout"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "post-checkout"
      # A baseline that no guard compares to anything is an allowlist wearing
      # the word "ratchet". This is the coverage backstop: every scripts/*.txt
      # is classified shrink-only (and compared) or NOT-a-ratchet (with the
      # reason printed), and an unclassified one is a hard failure -- so the
      # next baseline file to arrive cannot arrive unratcheted.
      - name: Baseline ratchet mutation table
        run: bash scripts/check_baseline_ratchets.sh --self-test
      - name: Every shrink-only baseline is classified and may not grow
        run: bash scripts/check_baseline_ratchets.sh
      - name: Every self-hosted job must pin a discriminating label
        run: bash scripts/check_runner_labels.sh
      # Poka-yoke: a beat that no workflow executes reads as enforcement, is
      # counted as enforcement, and proves nothing. The Pillar-4 marquee decode
      # beat sat in ZERO workflows while being quoted as an enforced win (#2319).
      # Pure text check, no build, so it belongs in this job rather than paying
      # for its own runner.
      - name: Every beat must be executed by some workflow
        run: bash scripts/check_beats_gated.sh
      # Poka-yoke: PMAT-CI-PASSGREP-001 killed ONE `grep "0 failed"` that also
      # matched "10 failed". Two more instances of the same class survived that
      # fix, one of them a live contract falsifier. Probe every zero-count
      # pass-grep against an all-failing line instead of trusting review.
      - name: Every zero-count pass-grep must reject a failing line
        run: bash scripts/check_pass_grep_anchored.sh
      # Poka-yoke: a bare `apr` runs whatever PATH resolves. qwen-story-daily
      # installed 0.61.0 to ~/.cargo/bin and then executed a 24-day-old 0.60.0
      # from ~/.local/bin, so every beat validated stale code while reporting
      # green. Text-only check, no build.
      - name: Every execution-surface `apr` reference must be pinned
        run: bash scripts/check_apr_bin_pinned.sh
      # The guard's own must-match/must-not-match table plus one mutation per
      # SCANNED SURFACE, in that surface's own syntax. #2358: extending the
      # scope to scripts/** and .claude/skills/** did NOT carry the old proof
      # over - the Makefile lesson repeated itself twice (a skill bash fence and
      # a `!`...`` inline command were both invisible to a pattern that was
      # correct everywhere else). Run the table; do not re-read the regex.
      - name: "`apr`-pinning guard must still turn RED (case table + surfaces)"
        run: bash scripts/check_apr_bin_pinned.sh --self-test
      # Poka-yoke: Cargo.lock was 15 days stale on main (last touched 2026-08-01,
      # manifests changed 08-10 and 08-11). Every CI job runs cargo WITHOUT
      # --locked, so cargo rewrote the lock in place and stayed green; the only
      # jobs that pass --locked are in binary-release.yml, i.e. the RELEASE path,
      # which was broken on main. Resolution only, no build, ~1s.
      #
      # THIS STEP RUNS BEFORE EVERY STEP IN THIS JOB THAT INVOKES CARGO. It was
      # placed after them, and the verifier-pinning step below cargo-builds pv
      # (through scripts/pv_bin.sh) without --locked -- so a stale lock was
      # silently repaired in the workspace before the guard whose entire purpose
      # is to notice it ever looked. The guard could not have failed. The
      # pinning guard now also snapshots and restores Cargo.lock and FAILS if
      # the build moved it, so the two are independent.
      - name: Cargo.lock must match the manifests
        run: bash scripts/check_lockfile_current.sh
      - name: "lockfile guard must still turn RED (case table)"
        run: bash scripts/check_lockfile_current.sh --self-test
      # #2640: the SAME defect class as the two steps above, one level up. The
      # dogfood release runner existed as two 1170-line copies whose divergence
      # was, in every hunk, a pin for a release verifier that one copy had and
      # the other did not. This guard scans the merged runner for a bare
      # pv/pmat/apr AND exercises both pins against a poisoned PATH -- presence
      # of `PMAT_BIN` proves nothing about which binary the gate ends up running.
      # It found `pmat analyze reachability` bare in BOTH copies on its first run.
      - name: The release runner must not resolve a verifier through PATH
        run: bash scripts/check_verifier_pinning.sh
      # One runner, one prose, and the user-scope copy stays a <=70-line shim
      # that fails CLOSED. The cap lives here, in the repo on protected main;
      # the file it caps lives at user scope, where it could otherwise raise its
      # own ceiling.
      - name: One dogfood runner, and the user-scope copy is a gated shim
        run: bash scripts/check_dogfood_shim.sh
      # deny.toml is 7.2 KB of licence / banned-crate / source-allowlist policy
      # that ran in NO workflow -- only `make deny`, which is not a prerequisite
      # of any tier, so nothing but a human typing it ever invoked it. Meanwhile
      # cargo-deny 0.20.2 ships INSIDE the CI image already.
      #
      # Because nothing ran it, the policy drifted out of sync with the repo's
      # own deliberate architecture and now fails on main:
      #     advisories ok, bans FAILED, licenses FAILED, sources ok
      # Both failures were config drift, not defects (see the deny.toml comments).
      # Fixed there; wired here so it cannot drift unnoticed again.
      #
      # `ci / security` from the reusable workflow runs `cargo audit`, which does
      # NOT read deny.toml -- so this covers licences, bans and sources, which
      # nothing else does.
      - name: cargo-deny (licences, bans, sources, advisories)
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "$IMAGE" \
            cargo deny check
      # check_apr_bin_pinned asserts CALLERS pin the binary; it says nothing
      # about which binary the resolver hands them. apr_bin.sh returned
      # target/release/apr whenever it existed, so a stale release build beside
      # a debug build made FROM HEAD hard-failed every gate that sources it --
      # while telling the caller to `cargo install`. Resolution order is now
      # evidence-driven, and this is the falsifier for it. Costs no cargo build:
      # the fixture binaries are shell scripts that print a version string.
      - name: apr_bin.sh must resolve the HEAD-built binary, whatever its profile
        run: bash scripts/check_apr_bin_resolution.sh
      # Poka-yoke (#2559): pv_bin.sh proves a resolved `pv` is the HEAD build by
      # reading the semver out of `pv --version`. That version line is now
      # deliberately multi-line -- four things claim the name `pv`, so it has to
      # say which one it is -- and the old `awk '{print $NF}'` extractor handed
      # the comparison four lines of prose, failing every consumer of pv_bin.sh.
      # The extractor is a guard's parser, and guard patterns in this repo have
      # been wrong five times running, every one caught by a case table.
      - name: pv --version semver extractor must answer its case table
        run: bash scripts/check_pv_version_parse.sh
      - name: "pv --version parse guard must still turn RED (case table)"
        run: bash scripts/check_pv_version_parse.sh --self-test
      - name: "target-watch: before-cargo-install-bashrs"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-cargo-install-bashrs"
      # CLAUDE.md mandates bashrs over shellcheck; CI honoured that for SEVEN of
      # 72 scripts (`bashrs lint scripts/check_book_*.sh` in book.yml).
      # apr_bin.sh -- sourced by every gate in this repo -- was not one of them,
      # and pmat reports Functions:0 / Cyclomatic:0 for it because pmat does not
      # parse shell. Ratcheted rather than fixed: turning the glob on outright
      # surfaces ~851 diagnostics, most of them bashrs false positives on
      # hand-written bash, and a gate that cannot go green gets disabled.
      - name: bashrs must see every script in scripts/ (shrink-only)
        run: |
          cargo install bashrs --locked --quiet || true
          bash scripts/check_shell_lint_ratchet.sh
      # Poka-yoke: nextest IGNORES an unknown config key with a warning instead
      # of failing. `slow-warning = "60s"` is not a nextest key, so profile.ci
      # had no per-test timeout and a hung run died at the job's 85-minute
      # timeout naming nothing -- evicting #2502 from the merge queue. The
      # warning was in every workspace-test log and nobody read it, so it is a
      # hard failure now. Runs nextest's real parser on a 3-line crate.
      - name: nextest must ignore no key in .config/nextest.toml
        # Runs INSIDE the image: cargo-nextest is installed there, not on the
        # host runner (the first version of this step failed with "SKIP:
        # cargo-nextest not installed" -> exit 1, which is the guard failing
        # closed in the wrong place). The probe crate has ZERO dependencies, so
        # CARGO_NET_OFFLINE=1 is safe and no registry mount is needed.
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e CARGO_NET_OFFLINE=1 \
            "$IMAGE" \
            bash scripts/check_nextest_config_keys.sh
      - name: "nextest-key guard must still turn RED (case table)"
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e CARGO_NET_OFFLINE=1 \
            "$IMAGE" \
            bash scripts/check_nextest_config_keys.sh --self-test
      # Hand-rolled argv parsing is banned. simular's `match args[1]` silently
      # DROPPED --seed: unknown flags fell through a catch-all, a valueless flag
      # was discarded, and an unparseable value became the default instead of an
      # error. The command exits 0 and does the wrong thing.
      #
      # Structural, and complementary to dogfood_surfaces.sh, which probes
      # BEHAVIOUR (feed each binary an unknown flag, demand rejection). The probe
      # catches today's broken parsers; this bans the construct, so the guarantee
      # does not rely on a probe happening to hit the broken case.
      - name: No binary may hand-roll argv parsing
        run: bash scripts/check_no_hand_rolled_parsers.sh
      - name: "hand-rolled-parser guard must still turn RED (case table)"
        run: bash scripts/check_no_hand_rolled_parsers.sh --self-test
      # Poka-yoke: a test may not assert about the fd 0 it INHERITED. nextest
      # gives every test its own process with /dev/null on fd 0; a plain
      # `cargo test` runs tests as THREADS of one process holding the caller's
      # stdin — a pipe or a file under CI. So such a test is green on the
      # required workspace-test lane and red on `make coverage`, which is
      # exactly what #2607's cmd_code test did: it blocked the 0.64.0 coverage
      # measurement (#2307) while every required check stayed green. The fix is
      # to own fd 0 — re-exec with `Stdio::null()` and assert in the child.
      # Text-only, no build. Self-test first (Verification Discipline #7).
      - name: "inherited-stdin guard must still turn RED (case table)"
        run: bash scripts/check_hermetic_stdin_tests.sh --self-test
      - name: No test may assert about the fd 0 it inherited
        run: bash scripts/check_hermetic_stdin_tests.sh
      # Poka-yoke: `set` in a SOURCED file mutates the caller's shell. apr_bin.sh
      # opened with `set -euo pipefail`; qwen-story.sh sources it and had chosen
      # `set -uo pipefail` deliberately (it must run every beat and tally the
      # failures). The leak turned errexit on underneath it and the nightly
      # story died after six lines inside an ADVISORY pmat hunt. Both files read
      # correctly on their own - only the combination is wrong, which is why
      # this is mechanical rather than a review note. Text-only, no build.
      - name: Sourced libraries must not mutate the caller's shell options
        run: bash scripts/check_sourced_libs_option_neutral.sh --self-test
      # Poka-yoke: a Cargo `exclude` entry is a gitignore pattern, so a bare
      # `"tests/"` is NOT anchored to the package root - it matches at every
      # depth. CB-510 was the same bug with `"models/"` hiding `src/models/`.
      # In v0.63.0 it dropped 443 files from the published aprender-serve and
      # left 11 (serve) + 18 (train) `mod tests;` declarations pointing at
      # directories that are not in the tarball, so neither published crate can
      # compile its own test suite. Text-only check, no build.
      - name: No exclude pattern may swallow a src/ directory
        run: bash scripts/check_exclude_anchored.sh
      # Poka-yoke: a contract may not name an enforcement command that cannot
      # run. #2504: apr-cli-commands-v1.yaml declared five falsification
      # conditions enforced by `cargo test --test apr_cli_commands ...`; there
      # is no such target, so all five exited 101. The underlying tests are real
      # and DO run (line 327, inside workspace-test) — what was fiction is the
      # contract's account of HOW, which destroys the discrimination between
      # "stale pointer" and "missing gate" that a contract exists to provide.
      # Nothing caught it because these strings sit under a `falsification:`
      # key the typed Contract struct does not have, so serde drops them and
      # `pv validate` never sees them. Self-test first (Verification Discipline
      # #7). Needs `cargo metadata` only — no build.
      - name: Enforcement guard's own case table must pass before it judges
        run: bash scripts/check_contract_enforcement.sh --self-test
      - name: No contract may name an enforcement command that cannot run
        run: bash scripts/check_contract_enforcement.sh
      # Poka-yoke: a release gate must name the STAGE at which it is satisfiable.
      # #2543: Gate 5 of the pre-release skill runs `cargo package -p apr-cli`,
      # which re-resolves all 26 workspace siblings against crates.io. Pre-bump
      # they resolve to the published copy of the SAME version number, missing
      # every symbol added since, so the verify build dies on dozens of
      # E0432/E0433 SYMBOL-not-found errors. Nothing is broken — the gate is
      # unsatisfiable at that stage — but a release engineer meeting it cold
      # reads it as a blocker and aborts the cut. Nothing in CI ran Gate 5, so
      # the ordering constraint lived only as folklore in a memory file. This
      # guard requires the skill to declare the stage per crate and requires the
      # declaration to be TRUE against `cargo metadata`. Self-test first
      # (Verification Discipline #7). Text + `cargo metadata --offline` only —
      # no build, no network.
      - name: Gate-5 stage guard's own case table must pass before it judges
        run: bash scripts/check_gate5_stage.sh --self-test
      - name: A pre-release gate must name the stage it is valid at (#2543)
        run: bash scripts/check_gate5_stage.sh
      # Poka-yoke: capturing `cmd 2>&1` into one variable and then parsing it as
      # JSON puts the command's diagnostics in front of its data. On 2026-08-11
      # the nightly story reported `no format_parity gate found in --json output
      # (got: '')` for a gate that had run and PASSED, because `apr qa --json`
      # writes JSON to stdout while the CUDA path emits `[trueno#243]` lines to
      # stderr. A false FAIL reddens main for a non-reason. The converse matters
      # too: a Rust panic arrives on stderr, so the panic checks must keep
      # reading the merged view. Behavioural, text-only, no build.
      - name: Story JSON parsing must read stdout, not the merged stream
        run: bash scripts/check_story_json_streams.sh
      # Poka-yoke: a path filter is a claim that nothing outside those paths can
      # break the gate. book.yml filtered on `book/**`, so the CLI/book parity gate
      # never ran when the CLI gained a command — `apr beat-run` shipped in #1995
      # with no chapter and the gate stayed green for three months, hiding a lib
      # parity failure, a `pv` step that exited 127, and two chapter examples
      # training to NaN behind it. Text-only check, no build.
      - name: A path-filtered workflow must not be able to go dark
        run: |
          bash scripts/check_workflow_path_filters.sh --self-test
          bash scripts/check_workflow_path_filters.sh
      # Poka-yoke: mac-server runs 16 runners under ONE $HOME, so
      # $HOME/.cargo/bin is shared mutable state. `cargo install` replaces a
      # binary there while another job is mid-run and about to exec it — on
      # 2026-07-31 Coverage Nightly died on
      # `could not execute process .../cargo-llvm-cov ... No such file or
      # directory (os error 2)` and posted an EMPTY coverage figure, i.e. a
      # missing measurement (#2353). Text-only check, no build.
      - name: Self-hosted jobs must install cargo tools into a private root
        run: |
          bash scripts/check_cargo_install_private_root.sh --self-test
          bash scripts/check_cargo_install_private_root.sh
      # Poka-yoke: the nightly's pmat bug-hunt printed eight manifest headers and
      # ZERO rows every night since the cron was added (#2356), so the workflow's
      # "manifest grew by >5" alert branch never had a non-zero input. Three
      # causes, each silent: the jq filters named `.function`/`.churn.commit_count`
      # /`.faults` where pmat emits `function_name`/`commit_count`/
      # `fault_annotations`; the churn and fault hunts passed the beat label as a
      # free-text query, which is a relevance filter applied BEFORE `--path` and
      # collapses a module-scoped hunt to nothing; and three hunted paths had been
      # deleted or moved. All three present as "the manifest is empty tonight",
      # which used to be indistinguishable from "the code is clean tonight" -
      # pmat_hunt returned 0 unconditionally. It now fails the beat. Behavioural
      # against a stubbed pmat, text-only, no build.
      - name: The pmat bug-hunt manifest must be able to produce rows
        run: bash scripts/check_story_pmat_hunt.sh
      # Poka-yoke: the 0.63.0 dogfood audit found 201 defects in code that was
      # shipped, tested and covered. The 5 Whys (docs/audits/dogfood-0.63.0-hansei.md)
      # landed on: nothing mechanical requires an assertion to EXCLUDE an outcome.
      # `assert!(status == OK || status == BAD_REQUEST || status == NOT_IMPLEMENTED)`
      # passes whatever the endpoint does, earns identical line coverage to an
      # assert_eq!, and is exempt from diff-scoped mutation testing on
      # pre-existing surface. 320 such sites existed; the first one tightened
      # showed a test named `test_apr_explain_endpoint` never reaching the
      # explain handler at all. Baseline-ratcheted so the debt only falls.
      # Text-only check, no build.
      - name: Assertions must exclude an outcome, not merely reach one
        run: bash scripts/check_assertions_exclude.sh
      - name: Assertion-exclusion guard case table
        run: bash scripts/check_assertions_exclude.sh --self-test

      # PMAT-742: the apr-dogfood coverage gate. The 0.63.0 surface audit found
      # 142 of 830 shipped features carry any gate at all (17.1%), and 27 of 28
      # binaries carry none. Where gates look they find defects at 72.5%; where
      # they do not, the surface scores 6 by default, which does not mean "fine",
      # it means unlooked-at. So coverage itself is now the ratchet.
      #
      # The comparand is docs/audits/surface_audit.csv AS IT EXISTS ON
      # origin/main, never the working tree. The multi-platform dogfood gate kept
      # its floor and its universe as literals in one file, so a single commit
      # editing both defeated it while it reported green. There is no baseline
      # number in this repo to edit: every floor is derived at run time from a
      # ref a pull request cannot rewrite.
      #
      # fetch-depth for this job is 1, so origin/main must be fetched -- and it
      # is now fetched ONCE, immediately after checkout, because the baseline
      # ratchets that run earlier in this job need the same comparand. A failed
      # fetch does NOT degrade to a self-comparison; every guard that uses it
      # hard-fails on an unresolvable comparand.
      #
      # DOGFOOD_RECEIPT extends the T2 pairing rule to the receipt when a run
      # produces one. The rule is enforced on every channel a cluster-level ratio
      # can leave through -- the gate report, the skill, the baseline printer and
      # the receipt -- because a pairing rule applied at one call site is a
      # pairing rule with three ways around it.
      - name: Dogfood coverage gate mutation table
        run: bash scripts/check_dogfood_coverage.sh --self-test
      - name: Dogfood coverage may not regress
        run: bash scripts/check_dogfood_coverage.sh
      # The baseline printer holds its OWN output to the same pairing rule and
      # re-derives every number the contract quotes.
      - name: Dogfood baselines must re-derive from the ledger
        run: python3 scripts/dogfood_baseline.py --check

      # T1: nothing may key on `cluster_id`. The surface ledger gained
      # cluster_id + cluster_label; the LABEL is human-owned and durable, the ID
      # is a k-means label that PERMUTES whenever the input moves. An obligation
      # keyed on the id silently re-points at a different set of features the
      # next time the surface is re-clustered -- the stale-hardcoded-list failure
      # class in new clothes.
      #
      # The guard is an ALLOWLIST, not a list of banned syntaxes. Its first
      # version enumerated four keying forms and passed twelve ordinary ones --
      # `groupby("cluster_id")`, `r.cluster_id`, `WHERE cluster_id = 3` and the
      # rest. "Nothing may key on this" is a universal claim and no finite list
      # of syntaxes carries one, so a standalone token is now a key unless the
      # line says otherwise: backticked, after a comment marker, in a schema
      # header, or carrying a stated pragma.
      #
      # It ships a must-match/must-not-match case table and CI runs the table
      # beside the scan, because five `apr`-invocation patterns in this repo were
      # wrong and every one was caught by its table rather than by review.
      # Text-only, no build.
      - name: "the `cluster_id` key guard case table"
        run: bash scripts/check_no_cluster_id_keys.sh --self-test
      - name: "Nothing may key on `cluster_id`"
        run: bash scripts/check_no_cluster_id_keys.sh

      # FALSIFY-README-00*: README metric claims must match measurement. The
      # guard existed and ran nowhere -- its only caller was scripts/dogfood-book.sh,
      # which is itself in no workflow and no Makefile target, so it was
      # unreachable. It was also pattern-narrow: it matched `**M** provable
      # contracts` and took `head -1`, while the README carried THREE different
      # contract counts (1771 in the table, 1158 at line 225, 1767 at line 256).
      # It now checks every contract-count claim, so the README cannot contradict
      # itself either. Text-only, no build -- and as of 2026-08-19 that is
      # actually true: the CLI-count check used to `cargo run -p apr-cli` from
      # this bare (non-container) step, which took 14 minutes and then failed,
      # since cargo is not reliably on PATH for raw run: steps here. It now
      # reads contracts/apr-cli-commands-v1.yaml, whose equivalence to the real
      # binary is enforced by FALSIFY-CLI-001/002 in the integration line.
      - name: README claims must match measurement
        run: bash scripts/check_readme_claims.sh

      # Three guards that existed and could not block a merge. The publish-safety
      # one is the gate credited with keeping a 28 MB test.apr out of a published
      # package, and it was `make`-only -- invoked by whoever remembered to type
      # it. Its size check also looked at 2 of 72 publishable crates and never
      # measured a size, so the 5.4 MB of .pmat-baseline.json it now catches had
      # been shipping to crates.io unseen.
      - name: Publish safety (binary/oversize files in published packages)
        run: bash scripts/check_publish_safety.sh
      - name: Every include!() file is tracked by git (CB-510)
        run: bash scripts/check_include_files.sh
      - name: "target-watch: before-pv-build"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-pv-build"
      # #2512: these two were invoked by NO workflow -- one Makefile-only
      # (`make tier3`, which CI does not run), one reachable from nothing at all.
      # Both pass today and are cheap, so there was never a reason for them to be
      # dark; nothing was watching.
      # The gate below is only worth what the BINARY producing its verdict is
      # worth. #2552 pinned `pv` to a HEAD build because a PATH `pv` 68 days
      # stale reported 253 refs / 51 missing on strict-test-binding where the
      # HEAD build reported 371 / 27 -- same tree, same second. The PINNING is
      # guarded (check_apr_bin_pinned.sh carries BARE_PV/PATHRES_PV classes);
      # the RESOLVER was not. A repo can be 100% pinned to a resolver that hands
      # back the wrong binary and every text scan stays green -- which is
      # precisely why `apr` has BOTH check_apr_bin_pinned.sh and
      # check_apr_bin_resolution.sh, above. This is pv's missing half, and it
      # runs first so a bad resolver is named as such rather than surfacing as a
      # mysterious verdict from the gate underneath it.
      #
      # Cost: it sources pv_bin.sh, which cargo-builds pv -- already paid for by
      # check_contract_test_binding.sh on the next line, which `cargo run`s the
      # same binary. Nothing extra is compiled by placing it here.
      - name: pv_bin.sh must resolve the HEAD-built pv and refuse a stale one
        run: bash scripts/check_pv_bin_resolution.sh
      - name: Every contract cites a test that exists (strict-test-binding)
        run: bash scripts/check_contract_test_binding.sh
      - name: "target-watch: before-contracts-tests"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-contracts-tests"
      # Poka-yoke (#2551): `cargo test -p aprender-contracts --test
      # validate_contracts` is the only thing that parses and validates the
      # contract corpus from Rust rather than through `pv lint`. It failed 3 of
      # its 10 tests on main -- `contracts/binding.yaml` is a BindingRegistry,
      # not a contract, and this target's walker did not skip it the way
      # `pv lint`'s does -- and NO workflow ran it, so nobody saw. In the dark
      # its pinned corpus totals also rotted: `assert_eq!(total_eq, 486)` against
      # a real 2329. Both walkers now share `schema::is_contract_yaml` and the
      # assertions are shrink-only ratchets. Cheap here: this job already builds
      # aprender-contracts for the strict-test-binding guard above.
      # All three were dark AND red. kani_harness_generation and
      # probar_test_generation carried their own copies of the same walker with
      # the same bug; probar_test_generation additionally died on the
      # alphabetically FIRST contract it walked, so the other 1226 were never
      # examined. All three share `schema::is_contract_yaml` now.
      - name: Contract corpus integrity (three dark test targets, now green)
        run: |
          cargo test -p aprender-contracts --test validate_contracts
          cargo test -p aprender-contracts --test kani_harness_generation
          cargo test -p aprender-contracts --test probar_test_generation
      - name: "target-watch: before-wasm32-build"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-wasm32-build"
      - name: aprender-core builds for wasm32
        run: bash scripts/check_wasm32_core_builds.sh
      - name: "target-watch: before-facade-compat"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-facade-compat"
      # aprender#2546: `provable-contracts*` were renamed to `aprender-contracts*`
      # and the published names left frozen at 0.3.1. A pin on the old name
      # resolved SILENTLY and installed a tool sixty versions behind. The names
      # are now carried forward as facades in crates/facades/, which is a
      # separate workspace -- `cargo check --workspace` does NOT reach it, so
      # without this step the facades are dark by construction. The self-test
      # (text-only, no build) runs first, per the convention above.
      - name: Renamed-crate facades case table
        run: bash scripts/check_facade_compat.sh --self-test
      - name: provable-contracts 0.3.1 code still compiles against the facades
        run: bash scripts/check_facade_compat.sh
      # aprender#2628: check_facade_compat.sh proves the facades COMPILE and are
      # shaped right; it does not touch the cascade's publish-ORDER gate. That
      # gate read its requirement with a line-shaped sed and returned READY when
      # it could not parse one, so rewriting a dependency into the equivalent
      # multi-line table -- which cargo treats as IDENTICAL -- disarmed it
      # silently and the cascade would upload a facade before its upstream.
      - name: The cascade's facade order gate arms on every spelling cargo accepts
        run: bash scripts/check_facade_order_gate.sh
      # aprender#2558: nothing detected two crates declaring the same `[[bin]]
      # name`. FOUR things claimed `pv` -- the crates.io pipe viewer, /usr/bin/pv,
      # aprender-contracts-cli and the provable-contracts-cli facade -- all
      # writing ~/.cargo/bin/pv. MEASURED: `cargo install` FAILS CLOSED on that
      # collision (exit 101, first binary survives); it does NOT overwrite, so
      # the hazard is a BLOCKED install rather than a silent clobber. The
      # facade gave up the name; this stops the next one being noticed by
      # accident. Scans BOTH workspaces: crates/facades is `exclude`d from the
      # root, so a root-only scan is inert by construction. `apr` is a
      # deliberate duplicate and passes via a declared-intent allowlist. The
      # text-only case table runs first, per the convention above.
      - name: No MCP tool may spawn a bare `apr` (aprender#2563)
        run: bash scripts/check_mcp_no_bare_apr_literal.sh
      - name: Duplicate bin-name case table
        run: bash scripts/check_duplicate_bin_names.sh --self-test
      - name: No two crates may claim one bin name
        run: bash scripts/check_duplicate_bin_names.sh
      # aprender#2559: the release cascade could not SEE the facades. TIERS[] in
      # scripts/cascade-publish.sh was exactly the 70 publishable crates of the
      # ROOT workspace -- a perfect match, no drift -- so nothing indicated the
      # three publishable crates in the second, `exclude`d workspace were
      # missing. FINAL VERIFICATION iterated the same TIERS[], so their absence
      # printed as "ALL crates at 0.63.0". This step also checks the ORDER: a
      # facade resolves its upstream from the REGISTRY, so publishing it first
      # yields a crate that cannot compile for anyone -- while inside this tree
      # it resolves through `path` and looks perfectly fine. Case table first.
      - name: Cascade-coverage case table
        run: bash scripts/check_cascade_covers_all_crates.sh --self-test
      - name: The release cascade must cover and order every publishable crate
        run: bash scripts/check_cascade_covers_all_crates.sh
      # The bump half of the same defect. `cargo set-version --workspace` cannot
      # reach an `exclude`d workspace and does not warn, so three files in
      # crates/facades/ have to ride in every bump commit. scripts/bump-version.sh
      # does that; these two rows keep its case table live and assert the tree is
      # version-consistent right now (which check_facade_compat.sh R3/R5 also
      # backstop from the compat side).
      - name: Version-bump case table (reaches the excluded workspace)
        run: bash scripts/bump-version.sh --self-test
      - name: Every workspace is at a consistent version
        run: bash scripts/bump-version.sh --check
      # The meta-guard. Four guards were found unwired by accident while looking
      # for something else; without this the fifth is found the same way.
      - name: Every check_*.sh is named by a workflow
        run: bash scripts/check_guards_are_wired.sh
      - name: Wiring guard case table
        run: bash scripts/check_guards_are_wired.sh --self-test
      # The complement of the meta-guard above. That one asserts every guard IS
      # wired; this one asserts a release-time TIMING gate is NOT -- including
      # transitively through a make target this workflow invokes. Eleven
      # wall-clock assertions have failed in a required check here, and until
      # now the placement was protected by a comment in
      # scripts/unwired_guards_baseline.txt rather than by a mechanism (#2671).
      - name: No timing gate in a required check
        run: bash scripts/check_no_timing_in_required.sh
      # F12 — a comparator baseline is MEASURED or ABSENT, never asserted.
      # Three literals (OLLAMA_BASELINE=291 / _SINGLE=120 / _CPU=15) shipped a
      # ratio against a frozen number of unknown date, host and build, with
      # ollama never invoked (#2679).
      - name: No fabricated comparator baselines
        run: bash scripts/check_no_fabricated_baselines.sh
      # §4.1 names BOTH of these in the merge-phase blocking set, alongside the
      # fabricated-baseline guard above. They shipped unwired, which is why the
      # five `2.93x Ollama` claims in book/ and the four deleted harnesses were
      # each caught by a person rather than by CI.
      #
      # Neither is baselined as an exemption, deliberately. The tip commit of
      # this epic says PERF-009 is "enforced by a shrink-only guard"; a guard
      # named by no workflow enforces nothing, and recording that in a baseline
      # file would make the claim true only in the sense that the gap is
      # written down.
      #
      # This step is ALSO the I-12 `[X]`-figure gate, which v2.2 §5 listed as
      # "not written" against this file. It was right: the comparator pattern
      # required the competitor's name to sit immediately after the ratio, in
      # ASCII, so of the six shapes §0.1 names it caught one. PERF-010 admits
      # the connector ("36.9x over FasterTransformer") and U+00D7, and adds
      # placeholders bound to a unit ("XX tok/s"). Twelve pre-existing sites
      # surfaced and are baselined shrink-only; one was a LIVE comparator claim
      # in book/ and is deleted.
      - name: No claim literals on user-facing surfaces
        run: bash scripts/check_no_claim_literals.sh
      - name: No claim-literal guard regression (case table)
        run: bash scripts/check_no_claim_literals.sh --selftest
      # PERF-010, the receipt rule's namesake check. The guard above is the
      # NEGATIVE half -- a comparator ratio may not appear at all. This is the
      # POSITIVE half over the class that is allowed to stay: a speed comparison
      # naming no competitor is legal iff it cites the evidence/ receipt that
      # produced it (v2.2 section 3.2). Text-only and deterministic, so it
      # belongs in the merge phase (section 4.1) rather than at release.
      #
      # It found 146 uncited speed comparisons across 30 files and ZERO citing a
      # receipt -- a 0% citation rate on the very number class this epic is
      # named for. Baselined shrink-only; the count is the finding.
      - name: Performance claims cite their receipts (PERF-010)
        run: bash scripts/check_perf_claims_cite_receipts.sh
      - name: Claims-cite-receipts guard can still go RED (case table)
        run: bash scripts/check_perf_claims_cite_receipts.sh --selftest
      # PERF-044, the same rule one level up. docs/roadmaps/roadmap.yaml is the
      # document that says what this epic has finished, and a `status:
      # completed` there was a claim nothing could check: PERF-004 was marked
      # completed while all three of its artifacts are absent from main and its
      # PR #2716 is CLOSED unmerged, and seven entries said `planned` for work
      # that had landed. `grep -rn roadmap scripts/ .github/ Makefile` returned
      # one unrelated comment.
      #
      # 1109 completed claims across 23 pmat work-contract roadmaps cite
      # nothing today; they are frozen shrink-only, so an entry NEWLY flipped
      # to completed must cite a `proof:<path>` that exists and is non-empty,
      # or a `proof:PR#<n>` that is MERGED. Text-only and deterministic (~4s,
      # and it touches the network only for an entry that cites a PR, of which
      # there are none), so it belongs in the merge phase beside PERF-010.
      - name: Completed roadmap statuses cite something (PERF-044)
        run: bash scripts/check_roadmap_completion_is_cited.sh
      - name: Roadmap-citation guard can still go RED (case table)
        run: bash scripts/check_roadmap_completion_is_cited.sh --selftest
      - name: One benchmarking entrypoint (PERF-009)
        run: bash scripts/check_no_competing_harnesses.sh
      - name: Competing-harness guard can still go RED (case table)
        run: bash scripts/check_no_competing_harnesses.sh --selftest
      # APR-PERF-GATE-001's PRIMARY gate — Arms A/B1/B2/C/D/E and
      # cell-completeness — was invoked by NOTHING: no workflow, no Makefile
      # target, no [package.metadata.dogfood] entry. `git grep perf_gate --
      # .github Makefile` returned rc=1. The meta-guard could not see it because
      # it globbed check_*.sh and this file is perf_gate.sh; that universe is
      # now derived from selftest capability instead.
      #
      # SELFTEST ONLY, and that is not a shortcut. The real gate needs
      # --host/--phase/--workload/--receipt; no PR can supply a receipt, because
      # receipts come from the nightly push hosts (§4.9.1). Wiring the gate
      # itself at merge phase would be a required check that can never PASS —
      # the mirror of one that can never fail. And declaring it in the dogfood
      # gates is worse: dogfood.sh:293 runs `bash "$dg_path"` with NO arguments,
      # perf_gate.sh:326 requires four, so every release sweep would report
      # exit=2 forever — a usage error indistinguishable from a real regression.
      #
      # What this DOES buy: the 29-case selftest genuinely discriminates
      # (disabling the B1 aggregate floor drops it to 27 passed, 2 broken;
      # unwiring the §4.9.1 signature arm drops it to 23 passed, 6 broken), so a
      # gate that silently stops discriminating now fails here rather than
      # certifying a release later.
      - name: Perf gate can still discriminate (APR-PERF-GATE-001, case table)
        run: bash scripts/perf_gate.sh --selftest
      # PERF-007, the HOST half of §4.9.1. `perf_gate.sh --selftest` already
      # runs this table, but check_guards_are_wired.sh cannot see one level of
      # indirection and its remedy for an unwired guard is to wire it, not to
      # baseline it. Named here so the signer's refusals — it will not sign
      # another host's receipt, will not sign a receipt with no commit, will not
      # mint a key — are executed by a workflow and not merely by a script that
      # a workflow happens to call.
      - name: Receipt signer refuses what it must (PERF-007, case table)
        run: bash scripts/perf_receipt_sign.sh --selftest
      # PERF-047. Section 5 of the spec is the epic's OWN ledger -- "a gate with
      # no registered mutation is inadmissible" -- so which arms section 4.8 may
      # read is decided by what it says, and nothing compared it to the tree.
      # Audited 2026-08-29 it was wrong in BOTH directions at once: 12 rows said
      # "not written" beside guards that ship case tables and are invoked twice
      # each in THIS file, and 2 rows recorded as proof named a mutation that
      # leaves its guard GREEN. One arm (cell completeness) had no row at all.
      #
      # The check is two-way and the ratchet has no separate baseline file: the
      # registry at merge-base with main IS the comparand, so there is nowhere
      # to record a downgrade. Text-only and deterministic, so it belongs in the
      # merge phase beside the other section 4.1 guards.
      - name: The mutation registry describes the tree (PERF-047)
        run: bash scripts/check_mutation_registry.sh
      - name: Mutation-registry guard can still go RED (case table)
        run: bash scripts/check_mutation_registry.sh --self-test
      # The threshold rule is DERIVED, and the rule it replaced is falsified by
      # execution on every run rather than by a comment. 3-sigma pooled does not
      # catch the one regression on record (#2675).
      - name: Bench threshold derivation holds
        run: bash scripts/check_bench_threshold.sh
      # Instance 5 of the unpinned-verifier table becomes a mechanism. An
      # unpinned comparator makes every ratio meaningless across time: the
      # denominator moves silently while the receipt claims a fixed baseline
      # (#2676, closing the open half of #2647).
      - name: llama.cpp comparator pin discriminates
        run: bash scripts/check_llama_pin.sh
      # PERF-019 / I-15. The pin above says WHICH llama.cpp; this says WHICH
      # BINARY of it may be driven. 4.4.8/X7: llama-bench does not separate PP
      # from TG under concurrent load, so a ratio built from it compares two
      # CLIENTS with two servers attached rather than two servers. The rule is
      # one client -- `apr test llm bench` -- against llama-server on both
      # sides, which is what scripts/parity_host_receipt.sh already does.
      #
      # The tree was already clean when this landed; the guard is what keeps it
      # clean. Neither existing guard covered it: check_no_competing_harnesses
      # requires a file to ALSO compute a rate, and parity_host_receipt.sh
      # computes none, so a llama-bench call added there stayed green (rc=0)
      # with the defect in place.
      - name: Comparator is not driven by llama-bench (I-15)
        run: bash scripts/check_comparator_one_client.sh
      - name: One-client guard can still go RED (case table)
        run: bash scripts/check_comparator_one_client.sh --selftest
      # An unstated knob is a silent degree of freedom: it becomes whatever
      # each side defaults to, and the difference lands in the ratio wearing
      # the label of a performance result (#2677).
      - name: Benchmark fairness protocol is complete
        run: bash scripts/check_bench_protocol.sh
      # PERF-004. scripts/perf_gate.sh read a receipt schema NOTHING in the tree
      # wrote: four real artifacts all returned rc=1 and the only input that
      # passed was the gate's own synthetic fixture. The tempting repair is to
      # default the missing fields, which would hand-assign five numbers no
      # instrument produces. scripts/perf-receipt-fields.yaml classifies every
      # field the gate reads as PRODUCED, DERIVED, POLICY or UNMEASURED, and
      # this holds the classification to the tree in both directions -- a new
      # unclassified requirement, and an entry whose producer has since been
      # deleted, are each a FAIL.
      - name: Every field the perf gate reads has a producer or a named owner
        run: bash scripts/check_perf_receipt_fields_have_producers.sh
      - name: Schema-map guard can still go RED (case table + 5 mutations)
        run: bash scripts/check_perf_receipt_fields_have_producers.sh --self-test
      # The converter that closes the loop, end to end: a BenchmarkReport this
      # repo can actually produce reaches a verdict, and what remains failing is
      # the UNMEASURED bucket BY NAME rather than a schema error.
      - name: Receipt converter round-trips into a gate verdict
        run: python3 scripts/lib/perf_receipt.py --selftest
      # NOT a second `perf_gate.sh --selftest` step. This commit was authored
      # before #2709 landed, and carried its own copy; two identically-scoped
      # invocations under two names is how a check comes to look twice as
      # covered as it is. The case table runs once, above, as "Perf gate can
      # still discriminate".
      # aprender#2737: the pin declared batch_size = 1 while TWO other places
      # retyped `-b 1` independently of it and a third declared
      # context_length/threads that no execution ever read. `-b 1` does not tune
      # llama.cpp, it switches its batching OFF -- measured on gx10 against the
      # pinned build, the c=16 aggregate went 434.2 -> 181.9 tok/s while c=1
      # moved 0.3%, which took the ratio this epic exists to compute from 2.03x
      # to 4.85x in apr's favour. A handicapped denominator is not a benchmark.
      # This asserts the declaration is the ONLY source of the comparator's
      # knobs, in both directions.
      #
      # It lives HERE, and not in nightly-bench.yml where it was first wired,
      # because it is a static consistency check over committed files: it needs
      # no bench hardware, no model, and no receipt, so a PR can and must fail
      # it. It was wired into the nightly lane only because the change that
      # added it was barred from editing ci.yml.
      #
      # No separate --self-test step: this guard has no such flag, it runs its
      # own 13-row mutation table in front of the verdict on EVERY invocation.
      - name: Comparator flags match the declaration
        run: bash scripts/check_comparator_flags.sh
      # The deepest check in the surface sweep -- real generation through
      # /v1/chat/completions -- had never executed once: the probe binary was
      # built without --features llm (clap advertises `llm` regardless, only the
      # handler is gated, so it parsed and then errored "LLM features not
      # enabled" and the sweep blamed the SERVER), and it skipped unless an
      # operator exported a config that was already committed. Both failure
      # modes look tidy in the output, which is why they lasted.
      - name: dogfood live LLM probe is armed
        run: bash scripts/check_dogfood_llm_probe_armed.sh
      - name: dogfood LLM probe guard case table
        run: bash scripts/check_dogfood_llm_probe_armed.sh --self-test
      - name: "target-watch: before-profile-tests"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-profile-tests"
      # aprender-profile appeared in this file ZERO times while carrying 58
      # integration test targets. Running them found 110 failures -- 109 from a
      # single stale binary name left by the APR-MONO rename, dead since. Gated
      # now so the crate cannot go dark again. --lib only: the integration
      # targets shell out to the built binary and take minutes.
      - name: aprender-profile lib tests (was gated by nothing)
        run: cargo test -p aprender-profile --lib
      # aprender#2627: `PR_OR_REF` is job-level env on workspace-test. The
      # model-tests step below was written by copying workspace-test's docker
      # mount lines into THIS job, which did not define it -- so both bind
      # sources collapsed to a trailing-slash path and the per-PR registry /
      # per-run target dir the step's own comment describes never engaged.
      # Nothing errors on an unset shell variable; it is simply the empty
      # string. Case table first, per the convention above.
      - name: Workflow env-var case table
        run: bash scripts/check_workflow_env_defined.sh --self-test
      - name: "A `run:` block may only interpolate names its job defines"
        run: bash scripts/check_workflow_env_defined.sh
      # aprender#2522: the `model-tests` feature gates three integration targets
      # with 156 gates between them, and NO workflow named any of them. The
      # workspace `--lib` line cannot reach an integration target, and the
      # explicit integration line does not list them, so they were dark by
      # construction -- `#![cfg(feature = "model-tests")]` means they do not even
      # COMPILE in a default `cargo test`. falsification_spec_v10_tests was
      # 38-red the whole time. These need no models: every fixture-gated gate
      # skips, and F-META-002 holds the size of that skip class to a shrink-only
      # baseline so the suite cannot go vacuous instead of red.
      - name: Every model-tests target is named by a workflow
        run: bash scripts/check_model_tests_wired.sh
      - name: model-tests wiring case table
        run: bash scripts/check_model_tests_wired.sh --self-test
      - name: "target-watch: before-model-tests-docker"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-model-tests-docker"
      - name: model-tests falsification suites (was gated by nothing, aprender#2522)
        # Runs INSIDE the image, on the same per-RUN target dir as the other
        # cargo steps, so the `model-tests` feature build reuses this run's
        # artifacts instead of starting a second cold one.
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "/mnt/nvme-raid0/cargo-ci/registry/${PR_OR_REF}:/usr/local/cargo/registry" \
            -v "/mnt/nvme-raid0/targets/aprender-ci/${PR_OR_REF}/run-${GITHUB_RUN_ID}:/workspace/target" \
            -v "/home/noah/data/sccache:/sccache" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e RUSTC_WRAPPER=rustc-sccache \
            -e SCCACHE_DIR=/sccache \
            -e SCCACHE_CACHE_SIZE=50G \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_BUILD_JOBS=8 \
            "$IMAGE" \
            cargo test -p aprender-core --features model-tests \
              --test falsification_spec_v10_tests \
              --test falsification_stress_tests \
              --test falsification_gpu_state_tests
      - name: "target-watch: before-book-examples"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-book-examples"
      - name: Book rust examples compile
        run: bash scripts/check_book_examples_compile.sh
      - name: "target-watch: before-cargo-package"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-cargo-package"
      # CB-510: a Cargo.toml `exclude` pattern can strip an include!() target
      # from the published crate while git still tracks it, so the crate compiles
      # in-tree and fails for everyone installing from crates.io. This guard is
      # Gate 1 of the pre-release skill and it could not fail: it scanned `src/`
      # and packaged `-p aprender`, the PRE-MONOREPO layout. Root `src/` now holds
      # 2 files with zero include!(), so it reported "All 0 include!() files are
      # included" for every release since consolidation, while 1798 live under
      # crates/. Now checks all 10 publishable crates that have include!() against
      # their OWN package listing, and refuses to pass on an empty scan.
      - name: include!() targets must survive cargo package (CB-510)
        run: bash scripts/check_package_includes.sh
      - name: Package-includes guard case table
        run: bash scripts/check_package_includes.sh --self-test
      # The manifest-level sibling guard proves no Cargo.toml DECLARES an in-tree
      # crate from crates.io. It passes, and it is not sufficient: a dependency we
      # legitimately take from the registry can drag an in-tree name in
      # TRANSITIVELY, and no manifest here mentions it. `whisper-apr = "0.2"`
      # resolves crates.io `aprender 0.27.8` -- this monorepo depending on a
      # published copy of ITSELF, 36 minors stale -- plus registry trueno,
      # realizar, trueno-quant, batuta-common, renacer-core.
      #
      # NOT `cargo tree --duplicates`: trueno/realizar/batuta-common are [lib]
      # names, so the lockfile holds exactly ONE package of each (the registry
      # one). They are not duplicates and never will be; measured, --duplicates
      # catches 0 of 8 under default features. The lockfile is the only surface
      # that sees all of them, and it is feature-independent.
      - name: No in-tree crate name may resolve from crates.io
        run: bash scripts/check_lockfile_no_registry_siblings.sh
      - name: Lockfile sibling guard case table
        run: bash scripts/check_lockfile_no_registry_siblings.sh --self-test
      # .gitignore DECLARES, the index CONTRADICTS, and nothing compared them.
      # `.gitignore:62` says `**/.pmat-work/`; git tracked 461 of those anyway,
      # 315 MB of regenerable pmat scratch read by nothing in the build. Ratchet
      # only -- 320 remain and they are not all removable (proptest-regressions
      # MUST stay tracked; there the ignore RULE is what is wrong). Text-only.
      - name: No tracked file may be declared ignored
        run: bash scripts/check_no_tracked_ignored_files.sh
      - name: Tracked-ignored guard case table
        run: bash scripts/check_no_tracked_ignored_files.sh --self-test
      # Poka-yoke: APR-MONO made every sibling a path alias under crates/, but
      # `trueno = "0.16"` still BUILDS - cargo resolves the crates.io copy
      # alongside the in-tree one, so the tree compiles two mutually
      # type-incompatible `trueno`s and the published-crate dependency cycle the
      # consolidation removed comes back. Nothing goes red; you only see it in
      # `cargo tree --duplicates`. At 88791ff55 the lockfile held four registry
      # copies of trueno beside the path one. CLAUDE.md has forbidden this in
      # prose since the consolidation - prose is not a gate.
      # The name set is package names UNION lib names, because they diverge here
      # (package aprender-compute has lib trueno): a guard built from package
      # names alone would sail straight past the one declaration it exists to
      # stop. Vacuity-guarded three ways, including a positive control that must
      # be flagged before any clean verdict is printed. Text-only, no build.
      # Self-test first: if the guard is blind, that matters more than its verdict.
      - name: Sibling-crate pathing guard case table
        run: bash scripts/check_workspace_siblings_pathed.sh --self-test
      - name: In-tree siblings must be pathed, never pulled from crates.io
        run: bash scripts/check_workspace_siblings_pathed.sh
      # A publishable crate depending on a `publish = false` one is invisible to
      # build/test/clippy -- the path dep resolves locally -- and only fails at
      # `cargo publish`, i.e. mid-release-cascade. #2493 did exactly this
      # (apr-cli -> aprender-qa-cli) and the tree was green throughout. The
      # v0.50.0 cascade died this way at 29 of 68 crates. Text-only, no build.
      - name: Publishable crates may not depend on unpublishable ones
        run: bash scripts/check_publishable_deps_publishable.sh
      - name: Publishable-deps guard case table
        run: bash scripts/check_publishable_deps_publishable.sh --self-test

      - name: "target-watch: before-cargo-deny-install"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "before-cargo-deny-install"
      # `cargo deny` ran in ZERO workflows -- only `make deny`. Positive control:
      # 9 workflows mention `cargo`, 0 mentioned `deny`. Meanwhile the `security`
      # job runs `cargo audit` with continue-on-error, which cannot fail the build
      # AND does not read deny.toml. The whole advisory surface was one tool that
      # ignores the exemption file, in a job that cannot fail, plus one tool that
      # honours it running nowhere -- so all 29 exemptions gated nothing.
      #
      # Install-if-missing: free once the runner has it, self-healing if a runner
      # is rebuilt from a base image without it.
      #
      # PRIVATE INSTALL ROOT (scripts/check_cargo_install_private_root.sh):
      # mac-server runs 16 runners under one $HOME, so a shared `cargo install`
      # replaces a binary another running job is about to exec (aprender#2353:
      # cargo-llvm-cov ENOENT, empty coverage figure). Install into a per-run
      # root and put it FIRST on PATH so the freshly installed binary is the one
      # that runs, here and in the steps that follow.
      # $RUNNER_TEMP, not /tmp. /tmp is emptied at boot, so a root there
      # HALF-persists: it survives between jobs on a long-lived self-hosted
      # box and vanishes on reboot, which is the shape paiml/infra's
      # shared-$HOME guard blocks as `cargo-install-boot-volatile`.
      # $RUNNER_TEMP is under the runner's own _work tree and is wiped per
      # JOB, so it is private for the same reason the per-run name was,
      # and the compile is paid honestly every run instead of
      # four-times-in-sixteen.
      - name: Install cargo-deny (if absent)
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/cargo-deny
        run: |
          if ! command -v cargo-deny > /dev/null 2>&1; then
            cargo install cargo-deny --locked
            echo "$CARGO_INSTALL_ROOT/bin" >> "$GITHUB_PATH"
            export PATH="$CARGO_INSTALL_ROOT/bin:$PATH"
          fi
          cargo deny --version
      - name: Advisories must pass, with deny.toml exemptions honoured
        run: cargo deny check advisories
      # Separate from the check above on purpose: a newly-FIXED upstream must
      # never fail anyone's build. It fails only this guard, whose remedy is
      # deleting a line.
      - name: Every deny.toml exemption must still be live
        run: bash scripts/check_deny_exemptions_live.sh
      # cargo-deny and cargo-audit read ONE database: RustSec. GHSA (what
      # Dependabot reads) is a superset, and when an advisory lives only there
      # every gate above is green while the crate sits in Cargo.lock. #2531:
      # `thrift 0.17.0` (CVE-2026-43868 / GHSA-2f9f-gq7v-9h6m) arrived via
      # `parquet ^57` and RustSec has NO thrift advisory at all, so
      # `cargo deny check advisories` printed "advisories ok" throughout. It was
      # found by a Dependabot alert on a DOWNSTREAM repo. Text-only, no build.
      - name: No GHSA-only vulnerable crate in Cargo.lock
        run: bash scripts/check_no_ghsa_banned_crates.sh
      - name: "GHSA guard must still turn RED (case table)"
        run: bash scripts/check_no_ghsa_banned_crates.sh --self-test
      # A test gated on a path outside the workspace is green on every machine
      # that lacks it, which is every machine but one. The monorepo merged 20
      # sibling repos in-tree, so gates like
      #   file_exists("/home/noah/src/realizar/src/quantize.rs")
      # now probe a path that CANNOT exist again -- realizar is
      # crates/aprender-serve. Five such gates remain and none of them reads the
      # file it probes; the path only decides whether to skip. Ratcheted, because
      # repointing them makes dormant tests run for the first time and belongs in
      # its own change. Text-only check, no build.
      - name: Tests must not gate on paths outside the workspace
        run: bash scripts/check_test_fixture_paths.sh
      - name: Fixture-path guard case table
        run: bash scripts/check_test_fixture_paths.sh --self-test
      - name: "target-watch: after-last-cargo-step"
        # aprender#2822 boundary probe (2 stat, 1 readdir, 1 df, 1 pgrep).
        # Instrumentation, never a gate: the script always exits 0.
        run: bash scripts/ci_target_watch.sh probe "after-last-cargo-step"
      # #2532: the guard above has a universe of crates/**/tests?/**/*.rs, which
      # structurally excludes 100% of the 324 machine-specific paths pmat found
      # in SHIPPED code -- 46 of them inside contracts/ itself. Seventeen crux
      # falsification tests opened with a GOLD= path under a worktree that no
      # longer exists on ANY machine, then `[ -f "$GOLD" ] || exit 2`, so they
      # skipped everywhere while `pv validate` and `pv lint contracts/` both
      # reported PASS. The two guards' universes are complementary, not nested.
      # contracts/ is now at ZERO and has no baseline to raise. Text-only, no build.
      #
      # The whole-tree ratchet lives in `--full`. It shells out to
      # `pmat analyze hardcoded-paths` (pmat#1017, the detector of record), and
      # the clean-room pool still measures pmat 3.31.0 (re-checked 2026-08-28),
      # which has no such subcommand -- so a bare `--full` here would red every
      # PR, and `|| true` would make it a gate that cannot fail.
      #
      # It used to be left unwired with a comment saying to promote it "once the
      # fleet carries pmat >= 3.32.0". That is what this step is fixing: a
      # comment is not a trigger, nothing re-evaluated the condition, and 20
      # shipped machine-specific paths landed through the gap (299 vs baseline
      # 278 on 62d23d8d1). --full-if-capable re-evaluates it on every run: it
      # runs the ratchet and propagates its status where pmat can produce a
      # verdict, and where it cannot it prints the version and the actual
      # refusal text rather than assuming. The gate arms itself on the day the
      # fleet upgrades, with no edit to this file.
      - name: No contract may name a machine-specific path
        run: bash scripts/check_hardcoded_paths.sh
      - name: Machine-specific-path guard case table
        run: bash scripts/check_hardcoded_paths.sh --self-test
      - name: Whole-tree machine-specific-path ratchet (arms itself at pmat >= 3.32.0)
        run: bash scripts/check_hardcoded_paths.sh --full-if-capable
      # PRREV-006. PR-REVIEW-SKILL-002 v2 §9 row 6 states how the receipt guard
      # may be wired, and both halves are scars rather than style:
      #
      #   job-level `if:`, NOT a workflow-level `paths:` filter — a path-filtered
      #   required check never reports and blocks branch protection forever.
      #
      # A `paths:` filter here would mean the workflow does not run at all on a
      # PR that misses it, so a check the ruleset requires never produces a check
      # run: the PR sits PENDING and nothing merges. This file carries BOTH
      # required checks (`ci / gate` and `workspace-test`), so that is a deadlock,
      # not a hypothetical. A job-level `if:` is the opposite shape — the workflow
      # runs, the job reports `skipped`, and `gate` reads the result (`mutants` is
      # the in-repo precedent).
      #
      # Until this step, that rule lived in a COMMENT further down this file, on
      # `vendored-schemas`, and a comment is not a trigger — the exact shape that
      # left check_hardcoded_paths.sh unwired for months, two steps above. So the rule
      # is CHECKED: the receipt guard must be invoked by a non-comment line, by
      # exactly one job, that job must carry an `if:` at job indentation (4
      # spaces, not a step's 8), and that `if:` must evaluate TRUE on
      # pull_request and FALSE on push / merge_group / workflow_dispatch. Both
      # polarities, because "it has an `if:`" is satisfied by `if: always()`.
      # Text-only, no build. Self-test first (Verification Discipline #7).
      - name: "Receipt-wiring guard case table (both polarities of the if:)"
        run: bash scripts/check_pr_review_wiring.sh --self-test
      - name: The PR-review receipt guard is wired job-level, not path-filtered
        run: bash scripts/check_pr_review_wiring.sh
      # The case table above is evidence only for the branches it can turn RED,
      # and on its first pass it could not turn three of them. Dropping either
      # zero-count check left the guard still rejecting on the NEIGHBOURING
      # more-than-one branch, and the step-level fixture used `- if:`, whose
      # leading `- ` means a widened job-level pattern never matched it. Both
      # survived a verdict-only table; the mutation set is what found them.
      # 15/15 kill required, and an anchor that stops matching is reported as
      # HARNESS-BROKEN rather than as a dead mutant. Text-only, no build.
      - name: "Receipt-wiring guard: every rule it states, mutated (15/15 kill)"
        run: bash scripts/mutate_pr_review_wiring_guard.sh
      # aprender#2822: THE REPORT. Runs even when the job dies mid-cargo,
      # and takes its own final probe first -- without that, a failure at
      # step K leaves the last recorded boundary BEFORE K and the table
      # reads clean, which is the whole failure mode being investigated.
      #
      # It also pulls the host journal for the job's window into the job
      # log. That is the decisive evidence and the only evidence that
      # expires: `_work/*/target` is deleted by HOST automation (a sibling
      # runner's job-started hook, a systemd timer) which logs under its own
      # tag and appears in NO GitHub log. See
      # scripts/runner-infra/runner-disk-guard.sh, whose own header records
      # this exact signature.
      #
      # continue-on-error is deliberate and is NOT a disarmed gate: nothing
      # here asserts anything. The gate that can fail is the case table
      # wired above.
      - name: "target-watch: report (aprender#2822)"
        if: always()
        continue-on-error: true
        run: |
          bash scripts/ci_target_watch.sh probe post-job
          bash scripts/ci_target_watch.sh report

  # Top-level gate: satisfies org ruleset "Green Main" which requires check named "gate".
  # The reusable workflow produces "ci / gate" but rulesets need exact match on "gate".
  # ── PRREV-002: the vendored JSON Schemas ─────────────────────────────────
  #
  # PR-REVIEW-SKILL-002 v2 §6.2 vendors the in-toto Statement v1 and SARIF
  # 2.1.0 schemas under schemas/ so the receipt gate never fetches a schema at
  # gate time. This job asserts the vendored bytes still match their recorded
  # SHA-256, that no $ref in either schema resolves off-file, and that the whole
  # accept/reject fixture table validates inside a network namespace with no
  # interfaces. It then mutates the guard and requires every mutant RED.
  #
  # DELIBERATELY NOT IN `gate`'s needs LIST. Nothing produces a receipt yet
  # (PRREV-005), and check-jsonschema is a Python tool no other job in this
  # repo installs. A brand-new required check whose first dependency is an
  # uninstalled interpreter is how a queue gets evicted.
  #
  # PRREV-006 UPDATE — what actually landed, so this paragraph is not a promise
  # nothing keeps. PRREV-006 wired the receipt guard into `pr-review-receipt`
  # below, with a job-level `if:` and no workflow-level `paths:` filter, and
  # made that rule mechanical (check_pr_review_wiring.sh, run twice in
  # guard-runner-labels). It did NOT promote either job into `gate`, for the
  # reason this paragraph already gives and PRREV-006 shares verbatim: the same
  # uninstalled interpreter, plus minisign. The spec agrees — §9 step 7 makes
  # the backtest the acceptance test "before it is enabled". Promotion is
  # PRREV-007's, and the arming condition it waits on is mechanical rather than
  # written here: see the self-arming step in `pr-review-receipt`.
  #
  # The guard exits 2, not 1, when the ENVIRONMENT cannot answer (no
  # check-jsonschema, or no unprivileged user namespace for `unshare -r -n`).
  # Both are non-zero: an unmeasured gate is not a passing gate. The distinct
  # code is so a broken box is never read as a broken tree.
  vendored-schemas:
    runs-on: [self-hosted, X64, Linux, clean-room]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install check-jsonschema (network here, NEVER at gate time)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          uv tool install 'check-jsonschema==0.38.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: schemas/ are the bytes we vendored, and validate offline
        shell: bash
        run: bash scripts/check_vendored_schemas.sh

      - name: the guard can still turn RED
        shell: bash
        run: bash scripts/mutate_vendored_schemas_guard.sh

  # ── PRREV-006: the receipt guard, wired ──────────────────────────────────
  #
  # PR-REVIEW-SKILL-002 v2 §9 row 6 is one sentence, and the `if:` below is what
  # it is about:
  #
  #   job-level `if:`, NOT a workflow-level `paths:` filter — a path-filtered
  #   required check never reports and blocks branch protection forever.
  #
  # A `paths:` filter stops the WORKFLOW from running at all on a PR that misses
  # it, so a check the ruleset requires never produces a check run: the PR sits
  # PENDING and nothing merges. This file carries BOTH required checks, so that
  # is a deadlock rather than a hypothesis. A job-level `if:` is the opposite
  # shape — the workflow runs, the job reports `skipped`, and `gate` reads the
  # result. `mutants` below is the in-repo precedent.
  #
  # THE CONDITION IS A PRECONDITION, NOT A DODGE. The subject of this job is the
  # receipt for ONE pull request, at evidence/pr-review/<pr>/<head_sha>/. On
  # push, merge_group and workflow_dispatch there is no <pr>, so there is nothing
  # for the check to be about. Both polarities of that claim are checked, not
  # asserted: check_pr_review_wiring.sh (guard-runner-labels, above) evaluates
  # this exact expression against all four events and fails if it runs where
  # there is no PR or skips where there is one.
  #
  # FIVE ARMS. Arm 0 is text-only and runs first; the first two after it are not
  # the same check twice:
  #   0. the counts these files state as MEASURED, against what the tree derives.
  #      The skill reviewed its own PR and found five stale ones — "119/119" in
  #      four places over a set of 185, "65 tests" over 121, "22-row" over 26 —
  #      each true when written and stale by the commit that shipped it. Two of
  #      them are in the step NAMES below. check_pr_review_counts.sh derives the
  #      three that a tree can derive and fails on any file that disagrees; its
  #      --self-test writes each of the three shipped defects back in and requires
  #      RED, then grows the tree three ways and requires RED again.
  #   1..4 as before:
  #   1. the guard over one GREEN and one RED fixture. It is the only arm that
  #      survives an unobtainable bats, and it is the literal invocation
  #      check_guards_are_wired.sh scans for — a guard named in a comment is not
  #      wired. GREEN and RED together, because "refuse every receipt" reads
  #      green against RED fixtures alone.
  #   2. the 40-row fixture table (§6.3's fourteen, the twelve PRREV-008 and
  #      PRREV-009 added, S3.E's nine, and PRREV-020's two) under bats, positive
  #      controls included.
  #   3. the guard's own mutation set (§6.4). §8 fixes guard_mutation_score at
  #      100% with "no ratchet, it is a one". Wiring a guard and leaving its
  #      falsifier dark would make the thing every other verdict rests on unable
  #      to be SHOWN to fail — the epic's own most common defect class (§11).
  #   4. this PR's own receipt, which arms itself (below).
  #
  # NOT IN `gate`'s needs, for vendored-schemas' reason plus a sharper one:
  # nothing produces a receipt until PRREV-005, so a blocking receipt check today
  # would red every PR including the one that lands PRREV-005 — a gate whose own
  # remedy it makes impossible, which is how `apr test llm` shipped permanently
  # unreachable. §9 step 7 makes the backtest the acceptance test "before it is
  # enabled", so promotion is PRREV-007's. Arm 4 re-evaluates the arming
  # condition on EVERY run rather than leaving it to a comment: the comment that
  # said to promote check_hardcoded_paths.sh "once the fleet carries pmat >=
  # 3.32.0" is two steps above this one, and 20 machine-specific paths landed
  # through the gap while nothing re-read it.
  pr-review-receipt:
    runs-on: [self-hosted, X64, Linux, clean-room]
    # 150, not 120: Arm 3 alone measured 3091s (51.5 min) on an idle 48-core box over
    # the 185-mutant set, and PRREV-015 adds Arms 5 and 6 — an 83-row bats table and a
    # second, 134-mutant sweep over scripts/pr_review_quorum_arm.sh. This number has
    # already been wrong once here for exactly this reason (60 against a measured 51.5
    # left 8 minutes for four other arms, which is not headroom; it is a job that times
    # out the first time the runner is busy, and a cancelled job reads as a failure
    # nobody can distinguish from a real one).
    timeout-minutes: 150
    if: github.event_name == 'pull_request'
    env:
      # The `runner` context is NOT available in a job-level `env:` block —
      # GitHub rejects the workflow with `Unrecognized named-value: runner`
      # (#2791). $RUNNER_TEMP is read inside the run blocks instead.
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The guard REFUSES to run without minisign, check-jsonschema, bats and jq:
      # "a gate that cannot run must not read green". They go into a per-JOB
      # private root under $RUNNER_TEMP, never ~/.local/bin: mac-server hosts 16
      # runners under one $HOME, and a concurrent writer to a shared bin
      # directory is what made Coverage Nightly report an EMPTY coverage figure
      # (#2353). $RUNNER_TEMP and not /tmp, because /tmp half-persists on a
      # long-lived box and is emptied at boot (#2791). Versions and digests are
      # pinned in the script, which exits 2 — distinct from the guard's own 1 —
      # when the BOX cannot answer, so a broken runner is never read as a broken
      # tree.
      - name: Install the tools the receipt guard refuses to run without
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_pr_review_tools.sh "$RUNNER_TEMP/pr-review-tools/bin"
          echo "$RUNNER_TEMP/pr-review-tools/bin" >> "$GITHUB_PATH"

      # Arm 0. Text-only, no build, and FIRST: the arms below quote numbers in
      # their own step names, and a step named after a stale number is how "65
      # tests" and "22-row" survived four commits of growth. Self-test before
      # check, because a guard whose RED has never been seen is a guard whose
      # GREEN is a count of files (Verification Discipline #7).
      - name: "Stated-count guard: every stated-count drift turns it RED, both polarities"
        shell: bash
        run: bash scripts/check_pr_review_counts.sh --self-test
      - name: The counts these files state as measured equal the derived ones
        shell: bash
        run: bash scripts/check_pr_review_counts.sh

      # Arm 1. The receipts name commits in a purpose-built repository, not in
      # aprender: for any commit reachable from aprender's own origin/main,
      # `git merge-base origin/main X` is X itself, so the base_sha row would
      # pass vacuously. Both exit codes are read from the guard itself, never
      # through a pipe.
      - name: The guard accepts an honest receipt and rejects a self-review
        shell: bash
        run: |
          set -euo pipefail
          FIX=tests/fixtures/pr-review
          "$FIX/make-fixture-repo.sh" "$RUNNER_TEMP/pr-review-fixture-repo" > /dev/null
          export PR_REVIEW_REPO="$RUNNER_TEMP/pr-review-fixture-repo"
          export PR_REVIEW_PUBKEY="$FIX/keys/pr-review-test.pub"

          bash scripts/check_pr_review_receipt.sh "$FIX/row-14-complete-gpu-review"
          echo "GREEN discrimination row accepted, as it must be"

          rc=0
          bash scripts/check_pr_review_receipt.sh "$FIX/row-08-self-review" || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "row 08 (reviewer_actor == author_actor) exited $rc, expected 1." >&2
            echo "A guard that accepts a self-review has no verdict to give (§5, §7)." >&2
            exit 1
          fi
          echo "RED discrimination row rejected under B2, as it must be"

      # Arm 2. Every row of §6.3, plus the positive controls, plus the
      # must-match/must-not-match tables behind the three trigger regexes. This
      # file is 162 tests and was reachable from NO workflow until this job — the
      # dark-target class this repository has hit with benches and with 58 cgp
      # tests. Both numbers here are recomputed by check_pr_review_counts.sh; the
      # commit that wired this step wrote 65 and 22 over a file that already held
      # 162 tests and 37 rows.
      - name: The 40-row fixture table and both polarities of every trigger regex
        shell: bash
        run: bats tests/pr-review.bats

      # Arm 3. §6.4: mechanically flip each validation branch and drop each
      # required-field check, target 100% kill.
      #
      # The script's DEFAULT parallelism, because that is the only setting whose
      # wall time has been measured: 185/185 killed in 3091s (51.5 min) at
      # --jobs 12 on a 48-core box, 2026-08-30.
      #
      # THE SET IS 225/225 TODAY — PRREV-015 added S3.E, PRREV-020 its availability
      # rule and PRREV-019 the survivors-shape rule, one `reject B<n>` site each and
      # so two mutants each. So that wall time is a
      # LOWER BOUND and not a current measurement. It is left as the number that
      # was actually measured, with its date and its set size beside it, rather
      # than rescaled: a scaled estimate wearing the shape of a measurement is
      # the defect this whole job exists to catch. Re-measure before quoting it.
      # The set is DERIVED — one `drop` and one
      # `flip` per `reject B<n>` site, rescanned from the guard on every run — so
      # its size moves when the guard does; `scripts/mutate-guard.sh --list`
      # prints it, and check_pr_review_counts.sh fails this file when the number
      # written here is not the number the script derives. An earlier draft of
      # this step wrote --jobs 8 with a plausible-sounding reason and no
      # measurement behind it, which is how a number becomes folklore.
      #
      # THE TIMEOUT WAS A THIRD DEFECT IN THIS JOB, and the same one: this
      # paragraph said "timeout-minutes on this job is 60 against that 19
      # minutes; a slower runner has headroom". 19 minutes was 1125s over the
      # 119-mutant set. The set is 185 and the same box takes 3091s — 51.5
      # minutes against a 60-minute cap, on an IDLE box, before Arms 0-2 and 4
      # have run at all. Headroom of 8 minutes is not headroom; it is a job that
      # times out the first time the runner is busy, and a cancelled job reads
      # as a failure nobody can distinguish from a real one (#2792's cargo-audit
      # eviction, and "N runs cancelled at the SAME elapsed time is a timeout,
      # not a flake"). Raised to 120.
      - name: The guard's mutation set must kill 100% (§6.4, §8 fixes this at one)
        shell: bash
        run: bash scripts/mutate-guard.sh

      # Arm 4. ARMED (PRREV-013). It could previously neither fail nor pass.
      #
      # The step this replaces was six lines of inline YAML, and it carried BOTH
      # halves of the same defect:
      #
      #   * it began `if [ ! -f .github/pr-review.pub ]; then ... exit 0; fi`,
      #     the key was absent, nothing owned shipping it (SKILL.md said
      #     PRREV-006, the two comments above said PRREV-005, keys/README.md
      #     hedged "PRREV-005/006"), and `PR_REVIEW_SIGNING_KEY` appeared in
      #     zero workflows. So it EXITED 0 ON EVERY RUN IT EVER HAD. §8 fixes
      #     `receipt_presence` at 100% "no ratchet, it is a one", and the job
      #     written to enforce that could not fail — a gate that cannot fail,
      #     inside the job built to prevent gates that cannot fail (§11).
      #
      #   * its armed branch then looked for `evidence/pr-review/<pr>/<TIP SHA>`,
      #     which NO pull request can produce: committing the receipt changes the
      #     tip, so a directory named after the tip cannot hold the review of the
      #     tip. A gate that cannot pass, shipped in the same six lines as a gate
      #     that cannot fail.
      #
      # Both are fixed in scripts/check_pr_review_arm4.sh, which is a SCRIPT and
      # not inline YAML for the reason the `exit 0` survived unnoticed: Arms 1-3
      # are all scripts with case tables, Arm 4 was the one reachable from no
      # test, and Arm 4 is the one that broke. Its `--self-test` drives a case
      # table, both polarities, including the absent-key row that used to read
      # green — deliberately WITHOUT a row count written here, because a count of
      # a table that grows is the drift Arm 0 exists to catch. The table is
      # hermetic: it runs against tests/fixtures/pr-review/make-fixture-repo.sh,
      # not against this repository's history, so a squash-merge cannot expire it.
      # The self-test runs FIRST (Verification Discipline #7).
      #
      # .github/pr-review.pub is now COMMITTED — PRREV-013 generated the keypair,
      # committed the public half, re-signed this PR's receipt with the secret
      # half, and put that half in the repository secret PR_REVIEW_SIGNING_KEY_B64
      # (base64 of the minisign secret-key FILE; §4.3's `minisign -S -s` takes a
      # path, so a signer materialises it before use). The secret half is not in
      # this repository and never will be. Rotation is `minisign -G -W`, replace
      # .github/pr-review.pub, re-set the secret, re-sign.
      #
      # A MISSING RECEIPT IS NOW RED (§6.3, verbatim: "a missing receipt is RED,
      # not skipped"). This job is deliberately still NOT in `gate`'s needs, so a
      # red here does not block a merge; it makes `receipt_presence` a number
      # somebody can read instead of a metric nothing measures. Promoting it into
      # `gate` is a separate decision and wants 30 samples behind it, per §8.
      #
      # The step deepens the checkout first: base_sha resolves through
      # `git merge-base origin/main <head>`, which a fetch-depth-1 checkout cannot
      # answer. The script exits 2 rather than 0 or 1 when the BOX cannot answer,
      # so a shallow clone is never read as a clean tree.
      - name: "Arm 4 case table: the absent-key branch that used to exit 0 forever"
        shell: bash
        run: bash scripts/check_pr_review_arm4.sh --self-test
      - name: This PR's own receipt, under the repository's own default key
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin +refs/heads/main:refs/remotes/origin/main \
            || git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/check_pr_review_arm4.sh

      # Arm 5. S13's refusal table. SHADOW ONLY — scripts/pr_review_quorum_arm.sh is
      # invoked here with --explain against committed fixtures and a fixture
      # repository, so it can merge nothing, and it is reachable from no step that
      # can. S13.11 rung 0.
      #
      # The bats file exports a RECORDING STUB for gh before any row runs, and that is
      # a safety device before it is an assertion: Arm 6 runs this same file against a
      # MUTATED arm script, and one of the mutants disables the --explain guard. With
      # a real gh on PATH that mutant would try to arm auto-merge on a live pull
      # request. The stub records the call and exits 1, and two rows assert the call
      # log is empty.
      - name: "S13 quorum refusal table: 83 rows, one per refusal path, four that PERMIT"
        shell: bash
        run: bats tests/pr-review-quorum.bats

      # Arm 6. S13.10 fixes quorum_arm_mutation_score at one with no ratchet, for the
      # reason S6.4 gives one tier down and with more force: a surviving mutant is a
      # refusal path the arm script STATES and nothing TESTS, and under S13 that is a
      # merge nobody authorised.
      #
      # The set is DERIVED — one `drop` and one `flip` per `refuse Q<n>` site, rescanned
      # on every run — so it cannot fall behind the script; check_pr_review_counts.sh
      # fails this file when the number written here is not the number the script
      # derives. MEASURED at the default --jobs 12 on this 48-core box, 2026-08-31:
      # 134/134 killed. It is a SEPARATE script from mutate-guard.sh rather than an
      # extension of it, because merging a 15-minute sweep into a 51-minute one buys
      # nothing and serialises them.
      - name: "The arm script's 134-mutant set must kill 100% (S13.10, fixed at one)"
        shell: bash
        run: bash scripts/mutate_quorum_arm.sh

  # ---------------------------------------------------------------------------
  # PR-REVIEW-SKILL-002 v2 §13.11 RUNG 1 — the shadow lane.
  #
  # "CI runs `--explain` on every PR and records PERMIT/REFUSE [Qn]. Merges nothing."
  #
  # THE RUNG'S FALSIFIER WAS RED-VERIFIED BEFORE THIS WAS WRITTEN, which is the
  # ladder's own precondition ("a rung whose falsifier has never been seen to fail is
  # a rung with no evidence behind it"). Rung 1's falsifier is *delete any one
  # `refuse Q<n>` site and the corresponding q-row must turn RED*, and that is exactly
  # what scripts/mutate_quorum_arm.sh derives and runs — one `drop` and one `flip` per
  # site, 134/134 killed, already green as Arm 6 of `pr-review-receipt`.
  #
  # WHY A SEPARATE JOB AND NOT A SEVENTH ARM.
  # `pr-review-receipt` carries two mutation sweeps and is allowed 150 minutes. A
  # recorder appended to it would (a) produce a sample only after both sweeps, on a
  # runner that may be an hour deep, and (b) never run at all on a PR whose Arm 4 has
  # already failed — which is EVERY PR without a receipt, i.e. precisely the population
  # rung 2 needs to measure. A recorder that only records when everything else passed
  # measures the wrong thing.
  #
  # IT CANNOT MERGE, AND NOT ONLY BECAUSE IT PASSES --explain.
  # `--explain` is the arm script's own guard, and one of Arm 6's 134 mutants disables
  # it. So the capability is removed as well as unused: this is the first job in the
  # file to set `permissions:`, and it holds `contents: read`. `gh pr merge` needs
  # contents WRITE and cannot succeed with it. A flag is a promise; a missing scope is
  # a fact.
  #
  # THE VERDICT GOES ON THE PULL REQUEST, NOT ONLY INTO A LOG.
  # Operator instruction, 2026-09-01. A verdict visible only in a job log is a verdict
  # nobody reads: logs expire — this repository has already lost a diagnosis that way,
  # where a check-run annotation was the only surviving truth — and a reviewer looking
  # at the pull request cannot see a step summary from a job they never opened. So the
  # sample is published as a marked, idempotent comment: a push UPDATES it rather than
  # appending, because a lane that appends is a lane people mute.
  #
  # IT IS NOT IN `gate`'s `needs:` AND MUST NOT BE. §13 adds zero rows to §7 — a
  # refusal to arm is not a block, and the pull request stays exactly as green as it
  # was. Rung 3 is where a class of PR starts merging on this signal, and it is two
  # rungs and 30 samples away.
  # ---------------------------------------------------------------------------
  pr-review-shadow:
    runs-on: [self-hosted, X64, Linux, clean-room]
    # Text and one `gh pr view`; the arm script's own work is a receipt read. The
    # tool install is the only slow part. 20 is not a measured number, it is a
    # generous bound on a job with no build in it — and unlike the 150 above, a
    # timeout here loses one sample, not an hour of runner.
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      # `contents: read` is the load-bearing half: `gh pr merge` needs contents WRITE,
      # so the merge capability is ABSENT, not merely unused by the --explain flag.
      # `pull-requests: write` buys exactly one thing — the verdict comment below.
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The arm script resolves `git merge-base origin/main <head>` and walks the
          # commits after the reviewed SHA (§13.3). A shallow clone cannot answer
          # either, and the script exits 2 — which this job reports as a failure
          # rather than as a quiet zero.
          fetch-depth: 0

      - name: Install the tools the receipt guard refuses to run without
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_pr_review_tools.sh "$RUNNER_TEMP/pr-review-tools/bin"
          echo "$RUNNER_TEMP/pr-review-tools/bin" >> "$GITHUB_PATH"

      # Self-test FIRST, for the reason every other arm gives: a recorder whose RED
      # has never been seen is a recorder whose GREEN is a count of invocations.
      # Five of the rows are mutation-verified as load-bearing; the rest are held by a
      # neighbouring branch, which is stated rather than assumed. The row count is in
      # the step name and check_pr_review_counts.sh derives it, so a row added without
      # restating it is RED instead of invisible.
      - name: "Shadow recorder case table: 12 rows, every way a non-sample reads as a sample"
        shell: bash
        run: bash scripts/pr_review_shadow_record.sh --self-test

      - name: "§13.11 rung 1: record this PR's quorum verdict (merges nothing)"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shadow"
          # Status is read straight off the script, never through a pipe
          # (Verification Discipline #1). A REFUSE is exit 0 here — it is a SAMPLE.
          bash scripts/pr_review_shadow_record.sh \
            --pr "$PR_NUMBER" --head "$PR_HEAD_SHA" --out "$RUNNER_TEMP/shadow" \
            | tee "$RUNNER_TEMP/shadow/line.txt"
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || exit "$rc"
          {
            echo '### §13.11 rung 1 — quorum shadow sample'
            echo
            echo '```'
            cat "$RUNNER_TEMP/shadow/line.txt"
            echo '```'
            echo
            echo 'Shadow mode. This records a verdict and merges nothing;'
            echo 'a refusal to arm is not a block (§13, §7 unchanged).'
          } >> "$GITHUB_STEP_SUMMARY"

      # The publisher has its own case table for the same reason the recorder does, and
      # its four decision branches are mutation-verified: a publisher that never
      # updates, one that swallows a failed write, one that skips on a missing body and
      # one that treats an absent `gh` as a skip are all caught. Self-test first.
      - name: "Publisher case table: 6 rows, upsert-by-marker and every silent-skip path"
        shell: bash
        run: bash scripts/pr_review_shadow_publish.sh --self-test

      - name: Put the verdict on the pull request itself
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '**§13.11 rung 1 — quorum shadow verdict**'
            echo
            echo '```'
            cat "$RUNNER_TEMP/shadow/line.txt"
            echo '```'
            echo
            echo 'Shadow mode: this records a verdict and **merges nothing**. A refusal'
            echo 'to arm is not a block (§13 adds zero rows to §7) — the pull request is'
            echo 'exactly as green as it was.'
          } > "$RUNNER_TEMP/shadow/comment.md"
          bash scripts/pr_review_shadow_publish.sh \
            --pr "$PR_NUMBER" --body-file "$RUNNER_TEMP/shadow/comment.md"

      # The sample has to leave the runner or rung 2 has nothing to count. §8 wants 30
      # before any threshold is set, and `gh run download` over this artifact name is
      # how they are harvested.
      - name: Upload the sample
        if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: pr-review-shadow-sample
          path: ${{ runner.temp }}/shadow/
          retention-days: 90
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # THE SIGNER §4.3 NAMES AND NOTHING IMPLEMENTED.
  #
  # §4.3: the secret half "is held by whoever runs the reviewer ... and a copy is
  # escrowed in the repository secret PR_REVIEW_SIGNING_KEY_B64 ... so A CI SIGNER
  # MATERIALISES IT BEFORE USE." Measured 2026-09-01: that secret is real (created
  # 2026-08-31) and `grep -rn PR_REVIEW_SIGNING_KEY .github/workflows/` matched only
  # COMMENTS. An escrowed key with no consumer cannot sign anything — which is why the
  # repository holds exactly ONE receipt and every PR records `REFUSE [Q1]`.
  #
  # WHY THIS EXISTS AT ALL, AND WHY THE CUTOFF BELOW DEPENDS ON IT. The review is
  # performed by an agent, on the box a human runs it on, and the secret half is
  # deliberately not there. So the halves are produced in two places: the agent writes
  # the CONTENT, this attaches the SIGNATURE. Without it a reviewer CANNOT produce a
  # valid receipt, and `pr-review-present` below would be a required check whose only
  # remedy is impossible — the precise shape of `apr test llm`, advertised in --help
  # and permanently unreachable because its own feature was undeclared.
  #
  # It pushes ONE file and never force-pushes. Forks get no secret, so it skips them
  # rather than failing them.
  # ---------------------------------------------------------------------------
  pr-review-sign:
    runs-on: [self-hosted, X64, Linux, clean-room]
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install the tools the signer refuses to run without
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_pr_review_tools.sh "$RUNNER_TEMP/pr-review-tools/bin"
          echo "$RUNNER_TEMP/pr-review-tools/bin" >> "$GITHUB_PATH"

      # Self-test first, and it is hermetic: it generates its own throwaway keypair, so
      # every branch runs WITHOUT the repository secret. Three of its eight rows are
      # mutation-verified as independently load-bearing; the script's header records
      # which two are diagnostics rather than enforcement, so "8 rows" is not read as
      # "8 rules".
      - name: "Signer case table: 8 rows on a throwaway keypair"
        shell: bash
        run: bash scripts/pr_review_sign_receipt.sh --self-test

      - name: Sign this PR's receipt, if it has an unsigned one
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REVIEW_SIGNING_KEY_B64: ${{ secrets.PR_REVIEW_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          root="evidence/pr-review/$PR_NUMBER"
          if [ ! -d "$root" ]; then
            echo "no receipt directory $root — nothing to sign."
            echo "The review is still owed; the S13.11 shadow lane records its absence."
            exit 0
          fi
          signed_any=0
          # A receipt with a document and no signature is the only thing this touches.
          while IFS= read -r rcpt; do
            d=$(dirname "$rcpt")
            [ -f "$rcpt.minisig" ] && { echo "already signed: $d"; continue; }
            if [ -z "${PR_REVIEW_SIGNING_KEY_B64:-}" ]; then
              echo "::error::$d carries an UNSIGNED receipt and PR_REVIEW_SIGNING_KEY_B64 is empty."
              echo "::error::A receipt that cannot be signed cannot be verified by Arm 4."
              exit 1
            fi
            bash scripts/pr_review_sign_receipt.sh "$d"
            signed_any=1
          done < <(find "$root" -name receipt.intoto.jsonl -type f)
          echo "signed_any=$signed_any" >> "$GITHUB_ENV"

      - name: Commit the signature back to the PR branch
        if: env.signed_any == '1'
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name  "aprender-pr-review-signer"
          git config user.email "noreply@anthropic.com"
          git add evidence/pr-review
          git commit -m "chore(pr-review): sign this PR's receipt (PR-REVIEW-SKILL-002 v2 §4.3 CI signer)"
          # Never --force. A race with the author's own push fails this step and the
          # next run signs it; a force-push would silently discard their commit.
          git push origin "HEAD:$PR_HEAD_REF"

  # ---------------------------------------------------------------------------
  # RECEIPT PRESENCE, AS A FAST REQUIRED CHECK.
  #
  # Arm 4 already existed and already treated a missing receipt as RED — but it lives
  # in `pr-review-receipt`, which carries two mutation sweeps, is allowed 150 minutes,
  # and is in no `needs:` list. So its verdict blocked nothing, and on 2026-09-01 it
  # TIMED OUT at 150.85 min under fleet contention. Putting THAT job in `gate` would
  # make every pull request in the repository wait on a 2.5-hour sweep.
  #
  # This job is Arm 4 and nothing else: text, minisign, and one `git merge-base`. It is
  # the one that goes in `gate`'s `needs:`.
  #
  # It arms FORWARD. `check_pr_review_arm4.sh` grandfathers pull requests below
  # PR_REVIEW_CUTOFF, because the measured receipt rate on the day this landed was 1
  # across 24 open PRs — arming it retroactively is not a ratchet, it is an outage, and
  # this repository has already had a day where one armed gate blocked all nine open
  # PRs.
  # ---------------------------------------------------------------------------
  pr-review-present:
    runs-on: [self-hosted, X64, Linux, clean-room]
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # base_sha resolves through `git merge-base origin/main <head>`, which a
          # shallow clone cannot answer; the script exits 2 (the BOX cannot answer)
          # rather than 1, so a shallow checkout is never read as a missing receipt.
          fetch-depth: 0

      - name: Install the tools Arm 4 refuses to run without
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_pr_review_tools.sh "$RUNNER_TEMP/pr-review-tools/bin"
          echo "$RUNNER_TEMP/pr-review-tools/bin" >> "$GITHUB_PATH"

      - name: "Arm 4 case table: 10 rows, both polarities of the cutoff"
        shell: bash
        run: bash scripts/check_pr_review_arm4.sh --self-test

      - name: This PR's own receipt, under the repository's own default key
        shell: bash
        run: bash scripts/check_pr_review_arm4.sh

  gate:
    runs-on: [self-hosted, X64, Linux, clean-room]
    needs: [ci, workspace-test, mutants, guard-runner-labels, pr-review-present]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          if [ "${{ needs.guard-runner-labels.result }}" != "success" ]; then
            echo "guard-runner-labels failed: ${{ needs.guard-runner-labels.result }}"
            exit 1
          fi
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "ci failed: ${{ needs.ci.result }}"
            exit 1
          fi
          if [ "${{ needs.workspace-test.result }}" != "success" ]; then
            echo "workspace-test failed: ${{ needs.workspace-test.result }}"
            exit 1
          fi
          # Diff-scoped mutation gate (PMAT gap #1): blocking on PRs.
          # `skipped` is the expected result on push-to-main (the job has
          # `if: github.event_name == 'pull_request'`); treat it as pass so
          # main-branch pushes are not blocked by a job that intentionally
          # did not run. Only an explicit `failure` blocks.
          MUT="${{ needs.mutants.result }}"
          if [ "$MUT" = "failure" ]; then
            echo "mutants (diff-scoped mutation) failed: $MUT"
            exit 1
          fi
          echo "mutants result: $MUT (success/skipped both pass)"
          # Receipt presence (PR-REVIEW-SKILL-002 v2 S8 `receipt_presence`, fixed at
          # 100% with no ratchet). Adding a job to `needs:` makes this job WAIT for it;
          # it does not make it ENFORCE it — every other required job above is read
          # explicitly, and a clause omitted here is a job whose failure gate cannot
          # see. `skipped` passes for the same reason it does for mutants: the job
          # carries `if: github.event_name == 'pull_request'` and does not run on
          # push-to-main. Only an explicit `failure` blocks.
          #
          # The check itself arms FORWARD — check_pr_review_arm4.sh grandfathers pull
          # requests below PR_REVIEW_CUTOFF — so this does not retroactively block the
          # 24 pull requests that were open when it landed.
          RCPT="${{ needs.pr-review-present.result }}"
          if [ "$RCPT" = "failure" ]; then
            echo "pr-review-present (this PR's own review receipt) failed: $RCPT"
            echo "S6.3: a missing receipt is RED, not skipped. Run the pr-review skill on"
            echo "this PR and commit the receipt; the pr-review-sign job signs it."
            exit 1
          fi
          echo "pr-review-present result: $RCPT (success/skipped both pass)"
          echo "All required jobs passed"

  # Mutation testing — DIFF-SCOPED + BLOCKING on PRs (PMAT build-system audit gap #1).
  #
  # BEFORE: full-tree `cargo mutants -- --lib`, push-to-main only, and
  # `continue-on-error: true` at BOTH the job and step level → a surviving
  # mutant never blocked anything. New under-tested code merged silently,
  # contradicting the 80%-mutation / ZERO-tolerance rule.
  #
  # AFTER: scope mutation to the PR DIFF (`cargo mutants --in-diff`), run it on
  # pull_request events, and make it BLOCKING (no continue-on-error; wired into
  # the `gate` job). Diff-scoping is the key lever: full-tree mutation on a
  # 75-crate monorepo is hours-long and would choke the merge queue. Gating only
  # the lines a PR actually touches keeps it fast (minutes, proportional to diff
  # size) while still preventing NEW untested code from landing. A PR whose diff
  # contains no mutable code is a clean no-op pass (cargo-mutants reports 0
  # mutants → exit 0).
  #
  # On a push to main (post-merge), the job is a no-op pass: there is no PR diff
  # to scope against, so we skip rather than fall back to the old hours-long
  # full-tree run.
  mutants:
    runs-on: [self-hosted, X64, Linux, clean-room]
    timeout-minutes: 60
    needs: [ci, workspace-test]
    if: github.event_name == 'pull_request'
    env:
      IMAGE: localhost:5000/sovereign-ci:stable
      # Max surviving (missed) mutants tolerated on the PR diff. 0 = every
      # mutant introduced/touched by this PR must be caught by a test. Tune up
      # via repo variable MUTANTS_MAX_MISSED if a diff legitimately can't reach 0.
      MUTANTS_MAX_MISSED: ${{ vars.MUTANTS_MAX_MISSED || '0' }}
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal)
        # Same guard as workspace-test: a hard-killed docker job leaves
        # root-owned files that EACCES this job's `git clean` at checkout
        # (observed 2026-07-02 — the mutants job failed twice at checkout
        # with zero mutants actually run, reading as a gate failure).
        # Cached-image gate is sound: leftovers ⟹ a docker job ran here
        # ⟹ image is cached.
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "$IMAGE" \
              bash -c 'chown -R 1000:1000 /workspace 2>/dev/null || true'
          else
            echo "Image not cached — no prior docker job on this runner, nothing to restore"
          fi
      - uses: actions/checkout@v7
        with:
          # Need history + base branch to compute the PR diff for --in-diff.
          fetch-depth: 0
      - name: Compute PR diff for mutation scoping
        # cargo-mutants --in-diff takes a unified diff and mutates ONLY the
        # lines it adds/changes. We diff the PR head against the merge-base with
        # the target branch so the scope is exactly "what this PR introduces".
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          # NOT --depth=1: a shallow base commit has no shared ancestor with the
          # fetch-depth:0 PR head, so `git merge-base` finds none and (under
          # `set -e`) the step dies — failing the mutants gate on every PR.
          # Fetch the base branch's history so the merge-base is reachable.
          git fetch --no-tags origin "$BASE_REF"
          MERGE_BASE=$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || true)
          if [ -z "$MERGE_BASE" ]; then
            echo "No merge-base with origin/$BASE_REF — scoping diff to base tip"
            MERGE_BASE="origin/$BASE_REF"
          fi
          echo "Base ref: $BASE_REF  merge-base: $MERGE_BASE"
          git diff "$MERGE_BASE"...HEAD > pr.diff
          echo "Diff size: $(wc -l < pr.diff) lines"
          if [ ! -s pr.diff ]; then
            echo "Empty diff — no code to mutate"
          fi
      - name: Pull sovereign-ci image (with retry + local-cache fallback)
        # Same two-layer resilience as workspace-test — see that job for full context.
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            echo "Image $IMAGE already cached locally — skipping pull"
            exit 0
          fi
          max_attempts=15
          delay=4
          for i in $(seq 1 $max_attempts); do
            if docker pull "$IMAGE"; then
              echo "Image pulled successfully on attempt $i"
              exit 0
            fi
            if [ $i -eq $max_attempts ]; then
              echo "::error::Registry localhost:5000 unreachable after $max_attempts attempts AND image not in local cache"
              exit 1
            fi
            echo "Pull attempt $i/$max_attempts failed; sleeping ${delay}s"
            sleep "$delay"
            delay=$((delay + 6))
          done
      - name: Install cargo-mutants
        run: |
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "$IMAGE" \
            cargo install cargo-mutants --locked
      - name: Run diff-scoped mutation testing (BLOCKING)
        # No continue-on-error: a missed mutant on the PR diff fails the job,
        # which fails `gate`, which blocks merge. --in-diff pr.diff restricts
        # mutation to PR-touched lines. Empty diff → 0 mutants → clean pass.
        # We parse mutants.out/outcomes.json for the missed count and compare to
        # MUTANTS_MAX_MISSED so the threshold is explicit and tunable (rather
        # than relying solely on cargo-mutants' aggregate exit code).
        run: |
          set -euo pipefail
          if [ ! -s pr.diff ]; then
            echo "No PR diff content — nothing to mutate. Pass."
            exit 0
          fi
          docker run --rm \
          -e CI -e GITHUB_ACTIONS -e GITHUB_REF -e GITHUB_SHA -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_EVENT_NAME -e GITHUB_WORKFLOW \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e MUTANTS_MAX_MISSED \
            "$IMAGE" \
            bash -c '
              set -uo pipefail
              # The sovereign-ci image bakes cargo-nextest but NOT cargo-mutants,
              # so `cargo mutants` exited 101 (no such command) on every run. Before
              # #2514 hardened the outcomes.json check, that 101 was read as
              # "0 mutants in diff. Pass." -- the gate passed BECAUSE the tool was
              # absent. Installing it here is a stopgap; it belongs baked into the
              # image (paiml/infra), which is tracked separately.
              #
              # Assert it RUNS after installing. An install that half-succeeds must
              # not reach the gate looking like a clean diff -- that is the same
              # failure mode #2514 just closed.
              # Private install root, per scripts/check_cargo_install_private_root.sh.
              # This install already runs INSIDE the ephemeral container (CARGO_HOME
              # is /usr/local/cargo and the container is --rm), so it cannot reach
              # the host toolchain -- but the guard reads workflow text and cannot
              # see that, and "the guard cannot tell" is not a reason to exempt.
              # Declaring the root makes it true rather than merely argued.
              # /usr/local, not /tmp: this root is destroyed with the --rm
              # container either way, but /tmp is what paiml/infra's
              # shared-$HOME guard reads as boot-volatile, and "the guard
              # cannot tell" is not a reason to keep the ambiguous spelling.
              export CARGO_INSTALL_ROOT=/usr/local/cargo-mutants-root
              export PATH="$CARGO_INSTALL_ROOT/bin:$PATH"
              if ! cargo mutants --version > /dev/null 2>&1; then
                echo "cargo-mutants absent from image; installing"
                cargo install cargo-mutants --locked --version 27.1.0 > /tmp/mi.log 2>&1 || {
                  echo "::error::cargo-mutants install failed; the gate cannot run"
                  tail -20 /tmp/mi.log
                  exit 1
                }
              fi
              cargo mutants --version || {
                echo "::error::cargo-mutants still not runnable after install"
                exit 1
              }
              # --in-diff pr.diff: mutate only PR-touched lines.
              # cargo-mutants exits non-zero when mutants survive; we still
              # parse outcomes.json so the threshold (MUTANTS_MAX_MISSED) is
              # explicit and the failure message is actionable.
              cargo mutants --no-times --timeout 300 --in-place \
                --in-diff pr.diff -- --lib
              MUT_EXIT=$?
              echo "cargo-mutants exit: $MUT_EXIT"
              OUTCOMES=mutants.out/outcomes.json
              if [ ! -f "$OUTCOMES" ]; then
                # #2481 F-7: this used to be an unconditional `exit 0` on the
                # theory that no outcomes file means no mutants in the diff.
                # That is one reason the file can be absent. The other is that
                # cargo-mutants CRASHED before writing it -- and that passed
                # too. MUT_EXIT distinguishes them, and it was captured on the
                # line above and then never tested.
                if [ "$MUT_EXIT" -ne 0 ]; then
                  echo "::error::cargo-mutants exited $MUT_EXIT and wrote no outcomes.json. The gate cannot tell whether the diff was clean or the run died, so it refuses rather than passing."
                  exit 1
                fi
                echo "No mutants.out/outcomes.json and cargo-mutants exited 0 — 0 mutants in diff. Pass."
                exit 0
              fi
              MISSED=$(grep -o "\"summary\"[^}]*\"missed\":[0-9]*" "$OUTCOMES" \
                | grep -o "\"missed\":[0-9]*" | grep -o "[0-9]*" | head -1)
              TIMEOUT=$(grep -o "\"timeout\":[0-9]*" "$OUTCOMES" \
                | grep -o "[0-9]*" | head -1)
              # #2481 F-7: `MISSED=${MISSED:-0}` made an UNPARSEABLE outcomes.json
              # read as "zero missed" -- so a cargo-mutants JSON format change
              # would silently disarm this gate rather than break it. Not being
              # able to measure is not the same as measuring zero.
              if [ -z "$MISSED" ] || [ -z "$TIMEOUT" ]; then
                echo "::error::could not parse missed/timeout out of $OUTCOMES. The gate refuses rather than assuming zero — check whether cargo-mutants changed its JSON shape."
                head -40 "$OUTCOMES" || true
                exit 1
              fi
              echo "Diff-scoped mutation result: missed=$MISSED timeout=$TIMEOUT (max allowed missed=$MUTANTS_MAX_MISSED)"
              UNCAUGHT=$((MISSED + TIMEOUT))
              if [ "$UNCAUGHT" -gt "$MUTANTS_MAX_MISSED" ]; then
                echo "::error::$UNCAUGHT mutant(s) survived/timed-out on the PR diff (> $MUTANTS_MAX_MISSED allowed). New code is under-tested — add tests that kill these mutants. This would have merged SILENTLY before (PMAT gap #1)."
                exit 1
              fi
              echo "All diff-scoped mutants caught (or within threshold). Pass."
              exit 0
            '
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results
          path: mutants.out/
