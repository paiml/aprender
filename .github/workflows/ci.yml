# APR-MONO CI — monorepo-native pipeline
#
# Five Whys: sovereign-ci.yml clones 13 sibling repos that create version
# conflicts with the monorepo workspace. Root cause: sovereign-ci was designed
# for single-repo, not monorepo. Fix: run lint/test/coverage locally.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint: clippy + fmt (no sibling repos needed — workspace is self-contained)
  lint:
    runs-on: self-hosted
    container:
      image: localhost:5000/sovereign-ci:stable
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Clippy (workspace lints)
        run: cargo clippy --workspace --lib -- -D warnings -A missing_docs -A unused-variables
      - name: Format check
        run: cargo fmt --check

  # Test: workspace lib tests + integration
  test:
    runs-on: self-hosted
    container:
      image: localhost:5000/sovereign-ci:stable
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Workspace check (all 74 crates)
        run: cargo check --workspace
      - name: Workspace lib tests (19,027+)
        run: cargo test --workspace --lib --exclude aprender-gpu --exclude aprender-cuda-edge --exclude aprender-cupti --exclude aprender-ptx-debug --exclude aprender-compute --exclude aprender-serve --exclude aprender-explain --exclude apr-cli
        timeout-minutes: 25
      - name: Integration tests
        run: |
          cargo test -p aprender-core --test monorepo_invariants
          cargo test -p aprender-core --test readme_contract
          cargo test -p apr-cli --test cli_commands

  # Gate: aggregates lint + test (required status check for branch protection)
  gate:
    runs-on: self-hosted
    needs: [lint, test]
    steps:
      - run: echo "All checks passed"

  # Security: cargo audit
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit || true

  # Mutation testing (main only, slow)
  mutants:
    runs-on: self-hosted
    continue-on-error: true
    container:
      image: localhost:5000/sovereign-ci:stable
    timeout-minutes: 120
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked
      - name: Run mutation testing
        run: cargo mutants --no-times --timeout 300 --in-place -- --lib
        continue-on-error: true
      - name: Upload mutation results
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: mutants.out/
