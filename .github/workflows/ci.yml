# Sovereign CI — calls reusable workflow from paiml/.github
# Change once in paiml/.github → applies to all repos
#
# Jobs provided by sovereign-ci.yml:
#   test: cargo test --lib (self-hosted clean-room)
#   lint: cargo clippy --all-targets -- -D warnings + cargo fmt --check
#   coverage: cargo llvm-cov + codecov upload
#   security: cargo audit (ubuntu-latest, continue-on-error)
#   provenance: SLSA attest-build-provenance
#   gate: aggregates test+lint results
name: CI

on:
  push:
    branches: [main, master]
    # #3676: sovereign-ci's `coverage_on: tag` (below) runs coverage only on a push of a
    # v* tag, and its gate REQUIRES it to succeed there. A push filtered to branches never
    # fires for a tag, so this is the reusable's second required edit.
    tags: ['v*']
  pull_request:
    branches: [main, master]
  # Merge queue: GitHub dispatches a `merge_group` event for each batch it forms.
  # Both required checks (`ci / gate` via the reusable sovereign-ci call, and the
  # top-level `workspace-test` job) live in THIS workflow, so triggering here makes
  # both run against the queued batch. Without this trigger, enabling the queue jams
  # every PR (no checks ever run on the merge_group ref → nothing merges).
  merge_group:
  workflow_dispatch:

# CONCURRENCY (#3292, measured in #3358)
# `cancel-in-progress` is an EXPRESSION, which GitHub evaluates per event
# ("To conditionally cancel currently running jobs or workflows in the same
# concurrency group, you can specify cancel-in-progress as an expression with any
# of the allowed expression contexts" -- workflow-syntax reference, fetched
# 2026-09-16). It was an unconditional `true`, which is right for a pull_request
# -- a new push supersedes the run it replaces instead of stacking behind it --
# and is the destructive failure mode everywhere else: for `merge_group` the group
# is the queue ref, and cancelling a queue BUILD throws away the verdict the queue
# is waiting on (the same mistake, made by hand on 35078448806 at 11:25Z, turned a
# healthy run's `gate` red in four seconds). Narrowed to the one event where
# superseding is what we mean; `merge_group`, `push` and `workflow_dispatch`
# evaluate to false and QUEUE.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================================
  # #4433 — FIVE FAT JOBS (operator ruling 2026-09-25, items 1+4):
  #   "CI = 5 fat jobs (x86 main, gx10, yoga, mac-refusal, determinism). Each
  #    runs all parts to completion on the biggest runner in its class, nextest
  #    full-core, sccache warm. Same test set as today (Σ executed unchanged)."
  #
  # The five, by job id: x86-main, gx10, yoga, determinism, and mac-check -- the
  # ruling's "mac-refusal": the macOS lane, whose one expected failure is the
  # Linux-only profiler's compile_error! refusal (excluded by name below). It
  # keeps its context name `mac-check` and, as on main before #4433, is NOT in
  # `gate`'s needs (its own comment: first-green proof before it may block).
  #
  # The job BODIES did not change: they moved, verbatim, to ci/sections.yml
  # (and the pinned sovereign-ci reusable workflow to ci/vendor/). Each fat job
  # below runs a set of them as SECTIONS on one runner through
  # scripts/ci/fat_driver.py, which honours each section's if/needs/matrix/
  # container/outputs exactly as the Actions runner did. The shard matrix is
  # pinned to ONE shard (shard 1 of 1) in ci/sections.yml `matrix-pins`, so the
  # full workspace runs in one nextest pool on the fat host instead of three
  # partitions on three runners, and the Σ-executed step in that section
  # compares the executed test ids with the owed universe, by id.
  #
  # The required contexts are produced by three verdict jobs at the end:
  # `workspace-test`, `ci / gate` and `gate`, each reading the fat jobs' results
  # with the same rule the old job of that name applied.
  # ==========================================================================
  x86-main:
    runs-on: [self-hosted, Linux, X64, clean-room]   # no `intel` pin: framework16 or intel, whichever is free (operator: speed up releases)
    timeout-minutes: 240
    # The sections carry their own permissions blocks (the sov provenance section
    # needs id-token + attestations); one job token must cover all of them.
    permissions: write-all
    outputs:
      results: ${{ steps.wait.outputs.results }}
      deferred: ${{ steps.wait.outputs.deferred }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAT_VARS_JSON: ${{ toJSON(vars) }}
      FAT_SECRET_PR_REVIEW_SIGNING_KEY_B: ${{ secrets.PR_REVIEW_SIGNING_KEY_B }}
    steps:
      # Full history: a section whose own checkout asked for depth 1 (the default)
      # is cut back to exactly that by the driver; one asking for 0 needs it all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The driver decides what every section's if:/matrix/needs means and whether
      # the vendored workflow is the upstream one; its case table must go RED on
      # each planted defect before it is trusted to report a section green.
      - name: fat_driver case table must still turn RED
        run: python3 scripts/ci/fat_driver.py self-test
      - name: Sections (the determinism raster returns first; the rest keep running)
        run: >-
          python3 scripts/ci/fat_driver.py run
          --sections 'sov.*,workspace-test-shard*,workspace-test,guard-tree,guard-cargo,vendored-schemas,pr-review-shadow,pr-review-sign,mutants,determinism[X64]'
          --results "$RUNNER_TEMP/fat/results.json"
          --background-until 'determinism[X64]'
      # Published mid-run: the determinism job's compare section is waiting for it.
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-X64
          path: ${{ runner.temp }}/fat/artifacts/determinism-X64/
          if-no-files-found: error
      - name: Sections (wait for every one to finish)
        id: wait
        if: always()
        run: python3 scripts/ci/fat_driver.py wait --results "$RUNNER_TEMP/fat/results.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr-review-shadow-sample
          path: ${{ runner.temp }}/fat/artifacts/pr-review-shadow-sample/
          retention-days: 90
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-results
          path: ${{ runner.temp }}/fat/artifacts/mutation-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ github.event.repository.name }}
          path: ${{ runner.temp }}/fat/artifacts/bench-${{ github.event.repository.name }}/
          retention-days: 90
          if-no-files-found: ignore
      # The two actions that need the Actions runtime run here, on the section's
      # own files; both were continue-on-error in the reusable workflow.
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: always() && contains(steps.wait.outputs.deferred, 'codecov')
        continue-on-error: true
        with:
          files: ${{ runner.temp }}/fat/sov.coverage/ws/${{ github.event.repository.name }}/lcov.info
      - name: Generate SLSA provenance
        if: always() && contains(steps.wait.outputs.deferred, 'attest')
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v2
        continue-on-error: true
        with:
          subject-path: ${{ runner.temp }}/fat/sov.provenance/ws/${{ github.event.repository.name }}/Cargo.toml

  # The GPU decision stays OFF the GPU hosts, as before #4433: an `if:` that
  # could only be evaluated on gx10/yoga would queue the job to answer it, and
  # a queued job has already claimed the fleet's one GB10 / one RTX 4060 (and
  # displaced a pending job in its perf-* group). A ten-second decision on the
  # clean-room pool, not a sixth fat job; gx10 and yoga run only on a
  # pull_request that it says touches the GPU set, exactly as gpu-quick and
  # cuda-unit did. scripts/tests/ci_gpu_touched_test.sh pins this shape.
  gpu-touched:
    runs-on: [self-hosted, X64, Linux, clean-room]
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    outputs:
      gpu_touched: ${{ steps.decide.outputs.gpu_touched }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAT_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sections
        id: run
        run: >-
          python3 scripts/ci/fat_driver.py run
          --sections 'gpu-touched'
          --results "$RUNNER_TEMP/fat/results.json"
      - name: The decision, as this job's output
        id: decide
        run: |
          set -euo pipefail
          jq -r '"gpu_touched=" + ((."gpu-touched".outputs.gpu_touched // "0") | tostring)' \
            "$RUNNER_TEMP/fat/results.json" | tee -a "$GITHUB_OUTPUT"

  gx10:
    runs-on: [self-hosted, Linux, ARM64, cuda, gx10, ephemeral, docker]
    timeout-minutes: 30
    needs: [gpu-touched]
    if: github.event_name == 'pull_request' && needs.gpu-touched.outputs.gpu_touched == '1'
    # Shared with the other gx10 perf workflows (qwen-story-daily, silicon-nightly,
    # cuda-nightly, b2-gpu): one GPU job on the box at a time.
    concurrency:
      group: perf-gx10
      cancel-in-progress: false
    outputs:
      results: ${{ steps.run.outputs.results }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAT_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sections
        id: run
        run: >-
          python3 scripts/ci/fat_driver.py run
          --sections 'gpu-touched,gpu-quick'
          --results "$RUNNER_TEMP/fat/results.json"

  yoga:
    runs-on: [self-hosted, Linux, X64, cuda, yoga, ephemeral, docker]
    timeout-minutes: 50
    needs: [gpu-touched]
    if: github.event_name == 'pull_request' && needs.gpu-touched.outputs.gpu_touched == '1'
    concurrency:
      group: perf-yoga
      cancel-in-progress: false
    outputs:
      results: ${{ steps.run.outputs.results }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAT_VARS_JSON: ${{ toJSON(vars) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sections
        id: run
        run: >-
          python3 scripts/ci/fat_driver.py run
          --sections 'gpu-touched,cuda-unit'
          --results "$RUNNER_TEMP/fat/results.json"

  determinism:
    runs-on: [self-hosted, Linux, clean-room, ARM64]
    timeout-minutes: 120
    outputs:
      results: ${{ steps.wait.outputs.results }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FAT_VARS_JSON: ${{ toJSON(vars) }}
      # determinism-compare downloads both rasters; the X64 one is uploaded by
      # x86-main mid-run, and the driver polls this run's artifacts for it.
      FAT_EXPECT_ARTIFACTS: determinism-X64,determinism-ARM64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sections (the ARM64 raster returns first; the compare keeps running)
        run: >-
          python3 scripts/ci/fat_driver.py run
          --sections 'determinism[ARM64],determinism-compare'
          --results "$RUNNER_TEMP/fat/results.json"
          --background-until 'determinism[ARM64]'
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-ARM64
          path: ${{ runner.temp }}/fat/artifacts/determinism-ARM64/
          if-no-files-found: error
      - name: Sections (wait for the compare)
        id: wait
        if: always()
        run: python3 scripts/ci/fat_driver.py wait --results "$RUNNER_TEMP/fat/results.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: determinism-receipt
          path: ${{ runner.temp }}/fat/artifacts/determinism-receipt/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raster-receipt
          path: ${{ runner.temp }}/fat/artifacts/raster-receipt/
          if-no-files-found: ignore

  # PACK-001: mini-m4 had taken ZERO jobs in the 24 h measured -- nothing in any
  # workflow named macOS. The multiplatform dogfood requires a mini receipt at
  # post-publish and the three macOS-only defect classes on record (#2567 aarch64
  # scalar GEMV, #2568 an OOM guard that reads /proc/meminfo, #2572 a metal-only
  # dep) were each found only by building there. This lane is the cheap version:
  # a locked workspace check plus the CLI's lib tests, on the pinned toolchain
  # (rust-toolchain.toml; rustup on mini holds 1.93.0). No docker on macOS, so
  # the runner's own persistent target dir is used and nothing is bind-mounted.
  # Not in `gate`'s needs yet: first-green proof on a real PR before it may block.
  mac-check:
    runs-on: [self-hosted, macOS, ARM64, apple-silicon, m4, mini]
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain is the pinned one
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo --version
      # First run on mini (PR #3488, 2026-09-18) found the first macOS-only fact
      # in two minutes: crates/aprender-profile/src/main.rs is a compile_error!
      # on non-Linux by design ("renacer requires Linux (ptrace syscall
      # tracing)"). That crate is excluded here on purpose; any OTHER crate that
      # fails to check on macOS is a finding this lane exists to surface.
      - name: cargo check --workspace --all-targets --locked (minus the Linux-only profiler)
        run: cargo check --workspace --all-targets --locked --exclude aprender-profile
      - name: apr-cli lib tests (nextest, ci profile)
        run: cargo nextest run --profile ci -p apr-cli --lib

  # Poka-yoke (aprender#2269): fail fast if ANY self-hosted job omits a
  # discriminating runner label, so a bare [self-hosted, X64, Linux] selector
  # can never again silently land a job on a GPU/dev runner without the
  # sovereign-ci registry. Pure text check; runs on the clean-room pool.

  # ==========================================================================
  # Verdict jobs: the required contexts, each with the old job's rule. A section
  # missing from its fat job's results (the job died before writing them) is a
  # failure, never a pass.
  # ==========================================================================
  workspace-test:
    runs-on: [self-hosted, Linux, clean-room]
    timeout-minutes: 10
    needs: [x86-main]
    if: always()
    steps:
      - name: The workspace-test section's result
        env:
          RESULTS: ${{ needs.x86-main.outputs.results }}
        run: |
          set -euo pipefail
          r=$(printf '%s' "${RESULTS:-null}" | jq -r '(. // {})."workspace-test".result // "missing"')
          echo "workspace-test section: $r"
          [ "$r" = success ] || { echo "::error::workspace-test: section result is '$r'"; exit 1; }

  ci-gate:
    name: ci / gate
    runs-on: [self-hosted, Linux, clean-room]
    timeout-minutes: 10
    needs: [x86-main]
    if: always()
    steps:
      - name: The sovereign-ci gate section's result
        env:
          RESULTS: ${{ needs.x86-main.outputs.results }}
        run: |
          set -euo pipefail
          r=$(printf '%s' "${RESULTS:-null}" | jq -r '(. // {})."sov.gate".result // "missing"')
          echo "sovereign-ci gate section: $r"
          [ "$r" = success ] || { echo "::error::ci / gate: section result is '$r'"; exit 1; }

  gate:
    runs-on: [self-hosted, Linux, clean-room]   # arch-neutral: intel, yoga or gx10 (#3100)
    timeout-minutes: 22
    needs: [x86-main, determinism]   # as on main: the GPU jobs are advisory (68-C3 / 68-D2)
    if: always()
    steps:
      - name: Check required sections
        env:
          X86: ${{ needs.x86-main.outputs.results }}
          DET: ${{ needs.determinism.outputs.results }}
          EVT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          res() { printf '%s' "${1:-null}" | SEC="$2" jq -r '(. // {})[env.SEC].result // "missing"'; }
          # The old gate's needs, in its order: guard-tree, guard-cargo, ci (the
          # sovereign-ci gate), workspace-test, determinism-compare. gpu-quick and
          # cuda-unit were never in the gate; they still are not.
          for pair in X86:guard-tree X86:guard-cargo X86:sov.gate X86:workspace-test DET:determinism-compare; do
            job="${pair%%:*}" sec="${pair#*:}"
            r=$(res "${!job}" "$sec")
            if [ "$r" != success ]; then
              echo "$sec failed: $r"
              exit 1
            fi
          done
          MUT=$(res "$X86" mutants)
          # --- GATE-MUTANTS-RULE-BEGIN (#3676; scripts/check_ci_gate_mutants_rule.sh runs this block) ---
          # `skipped` is a pass ONLY when the skip is the job's own filter:
          # mutants declares `if: github.event_name == 'pull_request'`, so on every
          # other event it is skipped by design. On a pull_request it must have RUN
          # and succeeded -- a diff with no .rs still succeeds (its steps skip, the
          # job passes), so a pull_request `skipped` or `cancelled` means the job
          # never ran, and the old rule ("success/skipped both pass") passed that.
          case "$EVT:$MUT" in
            pull_request:success) echo "mutants result: success on a pull_request" ;;
            pull_request:*) echo "mutants on a pull_request must succeed; got '$MUT' -- a skip here is not the job's filter"; exit 1 ;;
            *:skipped) echo "mutants result: skipped on $EVT (its filter: pull_request only)" ;;
            *:success) echo "mutants result: success on $EVT" ;;
            *) echo "mutants (diff-scoped mutation) on $EVT: $MUT"; exit 1 ;;
          esac
          # --- GATE-MUTANTS-RULE-END ---
          echo "All required sections passed"
