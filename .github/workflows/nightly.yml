# Nightly binary builds for Linux x86_64 and aarch64, on the self-hosted fleet.
# APR-MONO: All deps are in-tree. No sibling repo checkouts needed.
# Spec: docs/specifications/release-system.md
#
# Schedule: daily 4am UTC. Manual trigger via workflow_dispatch.
# Skips build if no commits in the last 24 hours.
#
# Produces: apr-{target}.tar.gz (+ .sha256), published as a GitHub prerelease
# under the "nightly" tag.
#
# #3073 (operator rule 2026-09-10: "WE DO NOT USE HOSTED GITHUB RUNNERS"): every
# job runs on the fleet. x86_64 builds on yoga and aarch64 natively on gx10, both
# inside rust:1.93.0-bullseye (binary-release.yml's CPU-lane pattern), so the
# nightly's glibc floor is 2.31; the ubuntu-latest build needed GLIBC_2.39 and did
# not run on lambda's 22.04. The macOS and Windows targets are gone: no self-hosted
# macOS or Windows runner is registered in the org, and there is no hosted
# fallback. They come back when a box for them does.

name: Nightly

on:
  schedule:
    # SHIFTED so it actually runs at night (#3292). GitHub dispatches
    # schedule events 3h51m-6h49m late on this account (28 runs, 10
    # workflows, 3 nights, zero on time), so a 04:00 cron fired mid-
    # morning and the nightly tier occupied 06:49-14:14 UTC — the
    # working day, competing with PR traffic for the same runners.
    # Cron is set ~5h EARLY so the delayed dispatch lands near 04:00 UTC.
    # This is CALIBRATION AGAINST A MOVING TARGET: the delay varies by
    # ~3h and is growing. The durable fix is a fleet-side timer calling
    # `gh workflow run` (#3292); until then, re-measure before trusting.
    - cron: '0 23 * * *'   # 23:00 UTC -> lands ~04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Check for recent activity ────────────────────────────
  check-activity:
    runs-on: [self-hosted, Linux, X64, clean-room]
    outputs:
      has_commits: ${{ steps.check.outputs.has_commits }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for commits in last 24h
        id: check
        run: |
          RECENT=$(git log --oneline --since="24 hours ago" | wc -l)
          if [ "$RECENT" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
            echo "Found $RECENT commit(s) in last 24h (or manual trigger)"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "No commits in last 24h — skipping nightly build"
          fi

  # ── Build apr: Linux x86_64 on yoga, aarch64 natively on gx10 ──
  build:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    name: apr ${{ matrix.target }} on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: yoga
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga"]'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A sibling container through the mounted socket, as in binary-release.yml's
      # CPU lanes: every bind-mount path must exist on the HOST (the work root is
      # mirrored host<->container; $HOME is not), and the target mountpoint is
      # pre-created as the runner so dockerd never creates it root-owned (#3098).
      - name: Build apr inside rust:1.93.0-bullseye (glibc 2.31 floor)
        run: |
          DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER="sudo -n docker"
          T="${{ matrix.target }}"
          CACHE="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/cache-nightly/$T"
          mkdir -p "$CACHE/registry" "$CACHE/target" "$GITHUB_WORKSPACE/target"
          $DOCKER run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CACHE/registry:/usr/local/cargo/registry" \
            -v "$CACHE/target:/workspace/target" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e CARGO_INCREMENTAL=0 \
            -e T="$T" \
            rust:1.93.0-bullseye \
            sh -c 'set -e; ldd --version | head -1; cargo build --release -p apr-cli --target "$T"'
          mkdir -p "target/$T/release"
          cp "$CACHE/target/$T/release/apr" "target/$T/release/apr"
          "target/$T/release/apr" --version

      - name: Package
        run: |
          ARCHIVE="apr-${{ matrix.target }}"
          mkdir -p "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/apr" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT COPYING UNLICENSE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "Packaged: ${ARCHIVE}.tar.gz ($(du -h "${ARCHIVE}.tar.gz" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apr-${{ matrix.target }}
          path: |
            apr-${{ matrix.target }}.tar.gz
            apr-${{ matrix.target }}.tar.gz.sha256

  # ── QM-10 (#4528): the CI input set I = I_dep ∪ F ∪ C (FLOW-003 v2.1 Def. 14) ──
  # One nightly writes one trace of F; the artifact carries the union over the last
  # nightlies, and INV-BASE (`input_set.sh base`) is only armable once it spans ≥ 7.
  # The tests are traced from a nextest ARCHIVE (QM-09's shape), never through
  # cargo: cargo's own package walks would enumerate whole crate dirs and make
  # dirPrefix useless. Needs strace + jq + unzip in sovereign-ci (paiml/infra
  # branch 60/sovereign-ci-strace-jq); until the image has them the job fails
  # closed, naming the missing tool.
  input-set:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    runs-on: [self-hosted, Linux, X64, clean-room]
    # Unmeasured: the first three runs replace this basis (BSE-05). A lib build
    # (~27 min on guard-cargo) plus the lib tests under strace -f, taken as 3×.
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      IMAGE: localhost:5000/sovereign-ci:stable
      IS_TARGET_DIR: /mnt/nvme-raid0/targets/aprender-ci/${{ github.ref_name }}/run-${{ github.run_id }}-input-set
      IS_CARGO_HOME: /mnt/nvme-raid0/cargo-ci/home/${{ github.ref_name }}
      # How many earlier nightlies' F to union with this one (7 in all).
      IS_PRIOR: 6
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal)
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "$IMAGE" \
              bash -c 'chown -R 1000:1000 /workspace 2>/dev/null || true'
          else
            echo "Image not cached — no prior docker job on this runner, nothing to restore"
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The image carries strace, jq and unzip (fail closed)
        run: |
          missing=$(docker run --rm "$IMAGE" sh -c 'for t in strace jq unzip; do command -v "$t" >/dev/null || printf "%s " "$t"; done')
          if [ -n "$missing" ]; then
            echo "::error::sovereign-ci lacks: ${missing}— F cannot be traced (paiml/infra branch 60/sovereign-ci-strace-jq adds them)"
            exit 1
          fi
      - name: Create this job's own target dir and CARGO_HOME (before any bind mount)
        run: |
          mkdir -p "$IS_TARGET_DIR" "$IS_CARGO_HOME/registry" "$RUNNER_TEMP/is"
      - name: Input-set writer case table (F1..F5, K1..K5, planted mutants)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" -v "${IS_CARGO_HOME}:/cargo-home" -e CARGO_HOME=/cargo-home \
            -v "${RUNNER_TEMP}/is:/is" -e TMPDIR=/is -w /workspace "$IMAGE" \
            bash scripts/ci/input_set.sh --self-test
      - name: Earlier nightlies' input sets (the union's other members)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016 # the inner script expands inside the container
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/is/prior"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}/is:/is" -w /is -e GH_TOKEN -e GITHUB_REPOSITORY -e IS_PRIOR "$IMAGE" bash -c '
              set -euo pipefail
              api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
              hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
              runs=$(curl -fsS "${hdr[@]}" "$api/actions/workflows/nightly.yml/runs?status=success&per_page=30" | jq -r ".workflow_runs[].id")
              n=0
              for r in $runs; do
                [ "$n" -lt "$IS_PRIOR" ] || break
                url=$(curl -fsS "${hdr[@]}" "$api/actions/runs/$r/artifacts?name=ci-input-set" | jq -r "[.artifacts[] | select(.expired | not)][0].archive_download_url // empty")
                [ -n "$url" ] || continue
                curl -fsSL "${hdr[@]}" -o "prior/$r.zip" "$url"
                unzip -q -o "prior/$r.zip" input-set.json -d "prior/$r"
                n=$((n + 1))
              done
              echo "prior input sets: $n of $IS_PRIOR"'
      - name: Trace the workspace lib tests and write the input set
        run: |
          # shellcheck disable=SC2016 # the inner script expands inside the container
          set -euo pipefail
          base=$(git rev-parse HEAD)
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${IS_CARGO_HOME}:/cargo-home" -e CARGO_HOME=/cargo-home \
            -v "${IS_TARGET_DIR}:/workspace/target" -e CARGO_TARGET_DIR=/workspace/target \
            -v "${RUNNER_TEMP}/is:/is" -e TMPDIR=/is \
            -e CARGO_INCREMENTAL=0 -e CARGO_BUILD_JOBS=8 -e CARGO_TERM_COLOR=never \
            -e BASE="$base" -w /workspace "$IMAGE" bash -c '
              set -euo pipefail
              X="--exclude aprender-gpu --exclude aprender-cuda-edge --exclude aprender-compute"
              # shellcheck disable=SC2086
              cargo nextest archive --workspace --lib $X --archive-file /is/lib.tar.zst
              # A failing test still read its inputs: F is recorded either way, the
              # verdict belongs to workspace-test.
              rc=0
              bash scripts/ci/input_set.sh trace /workspace /is/trace.log -- \
                cargo nextest run --profile ci --no-fail-fast --archive-file /is/lib.tar.zst \
                  --workspace-remap /workspace || rc=$?
              echo "traced test run exit: $rc"
              bash scripts/ci/input_set.sh assemble /workspace /workspace/target "$BASE" /is/one.json /is/trace.log
              set -- /is/prior/*/input-set.json
              [ -e "$1" ] || set --
              mkdir -p /is/out
              bash scripts/ci/input_set.sh merge /is/out/input-set.json /is/one.json "$@"
              jq -c "{baseSha, nightlies, dep: (.dep|length), read: (.read|length), dirPrefix: (.dirPrefix|length), absent: (.absent|length), config: (.config|length)}" /is/out/input-set.json'
      - name: Upload the input set
        uses: actions/upload-artifact@v7
        with:
          name: ci-input-set
          path: ${{ runner.temp }}/is/out/input-set.json
          retention-days: 30
      - name: Remove this run's target dir
        if: always()
        run: |
          d="${IS_TARGET_DIR:?}"
          docker run --rm -v "$(dirname "$d"):/p" "$IMAGE" rm -rf "/p/$(basename "$d")"

  # ── Create/update nightly prerelease ─────────────────────
  release:
    needs: build
    runs-on: [self-hosted, Linux, X64, clean-room]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # REST, not `gh`: the fleet boxes carry no gh (binary-release.yml, run
      # 34448908554). Tolerant like the `gh release delete ... || true` it replaces.
      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          rid=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/nightly" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' || true)
          if [ -n "$rid" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/$rid")
            echo "release $rid delete: HTTP $code"
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/git/refs/tags/nightly")
          echo "tag nightly delete: HTTP $code (204 deleted; 404/422 already absent)"

      - name: Create nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build from `main`.

            **Date:** ${{ github.event.repository.updated_at || github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}

            > This is a prerelease. For stable releases, see the latest tagged version.
          files: |
            artifacts/*
