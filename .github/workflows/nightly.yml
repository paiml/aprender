# Nightly binary builds for Linux x86_64 and aarch64, on the self-hosted fleet.
# APR-MONO: All deps are in-tree. No sibling repo checkouts needed.
# Spec: docs/specifications/release-system.md
#
# Schedule: daily 4am UTC. Manual trigger via workflow_dispatch.
#
# #4189 (operator 2026-09-24: "nightly binary built is hard requirement for
# soveriegn stack, but intelligent: don't build if no work, only build working
# and passing CI and flag broken as tickets: this is arbiter job"). Every
# decision lives in scripts/nightly_manifest.py, pinned by its --self-test:
#   gate    no work (HEAD already holds a verdict) -> reused; required checks
#           red on HEAD -> red-ci; not finished -> ci-pending; green -> build.
#   build   each arch builds, runs `--version` on every bin, and records a
#           fragment -- green, or red with the reason -- even when it fails.
#   publish ALWAYS runs. Only an arch that came out green at HEAD gets its
#           assets replaced; the release is never deleted, so a red gx10 no
#           longer unpublishes x86_64 (run 35942026798). nightly-manifest.json
#           is uploaded last and says, per arch, which SHA each asset is.
# The run fails on red-ci / build-failed so the alerting sees it; the arbiter
# (infra-8d) files the per-SHA ticket from the manifest. Least privilege: the
# workflow token is `contents: read`; gate adds `checks: read` for check-runs,
# and only publish has `contents: write`: it moves refs/tags/nightly (/git/refs)
# and replaces the release's assets (/releases), and both need it.
#
# Produces, per target and per workspace [[bin]] (`nightly_manifest.py plan`):
# <bin>-{target}.tar.gz (+ .sha256; each holds
# <bin>-{target}/<bin>) and nightly-manifest.json, on the "nightly" prerelease.
#
# #3073 (operator rule 2026-09-10: "WE DO NOT USE HOSTED GITHUB RUNNERS"): every
# job runs on the fleet. x86_64 builds on yoga and aarch64 natively on gx10, both
# inside rust:1.93.0-bullseye (binary-release.yml's CPU-lane pattern), so the
# nightly's glibc floor is 2.31; the ubuntu-latest build needed GLIBC_2.39 and did
# not run on lambda's 22.04. Windows is gone: no self-hosted Windows runner is
# registered and there is no hosted fallback. macOS came back with a box for it
# (#3204): aarch64-apple-darwin builds host-native on mini-m4 (build-darwin).

name: Nightly

on:
  schedule:
    # SHIFTED so it actually runs at night (#3292). GitHub dispatches
    # schedule events 3h51m-6h49m late on this account (28 runs, 10
    # workflows, 3 nights, zero on time), so a 04:00 cron fired mid-
    # morning and the nightly tier occupied 06:49-14:14 UTC — the
    # working day, competing with PR traffic for the same runners.
    # Cron is set ~5h EARLY so the delayed dispatch lands near 04:00 UTC.
    # This is CALIBRATION AGAINST A MOVING TARGET: the delay varies by
    # ~3h and is growing. The durable fix is a fleet-side timer calling
    # `gh workflow run` (#3292); until then, re-measure before trusting.
    - cron: '0 23 * * *'   # 23:00 UTC -> lands ~04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/nightly/nightly-manifest.json

jobs:
  # ── Is there work, and is HEAD green? ────────────────────
  gate:
    runs-on: [self-hosted, Linux, X64, clean-room]
    permissions:
      contents: read
      checks: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Case table
        run: python3 scripts/nightly_manifest.py --self-test

      - name: Decide (reused | build | red-ci | ci-pending)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A missing manifest (first run) is "no previous verdict", not an error.
          bash scripts/nightly_fetch_manifest.sh prev-manifest.json
          d=$(python3 scripts/nightly_manifest.py gate --sha "$GITHUB_SHA" --prev prev-manifest.json)
          echo "decision=$d" >> "$GITHUB_OUTPUT"
          echo "### nightly gate for \`${GITHUB_SHA:0:9}\`: **$d**" >> "$GITHUB_STEP_SUMMARY"

  # ── Build: Linux x86_64 on yoga, aarch64 natively on gx10 ──
  build:
    needs: gate
    if: needs.gate.outputs.decision == 'build'
    name: ${{ matrix.target }} on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: yoga
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga"]'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A sibling container through the mounted socket, as in binary-release.yml's
      # CPU lanes: every bind-mount path must exist on the HOST (the work root is
      # mirrored host<->container; $HOME is not), and the target mountpoint is
      # pre-created as the runner so dockerd never creates it root-owned (#3098).
      - name: Build inside rust:1.93.0-bullseye (glibc 2.31 floor)
        id: build
        run: |
          set -euo pipefail
          DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER="sudo -n docker"
          T="${{ matrix.target }}"
          CACHE="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/cache-nightly/$T"
          mkdir -p "$CACHE/registry" "$CACHE/target" "$GITHUB_WORKSPACE/target"
          # Every workspace [[bin]], derived (#4189): a new or renamed bin ships
          # with no edit here. Planned inside this step, so a plan that fails is
          # build-failed, not a skipped build the gate would retry forever.
          $DOCKER run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace rust:1.93.0-bullseye \
            cargo metadata --no-deps --format-version 1 > nightly-meta.json
          python3 scripts/nightly_manifest.py plan --meta nightly-meta.json > nightly-plan.env
          cat nightly-plan.env >> "$GITHUB_ENV"
          NIGHTLY_BINS=$(sed -n 's/^NIGHTLY_BINS=//p' nightly-plan.env)
          ARGS=$(sed -n 's/^NIGHTLY_CARGO_ARGS=//p' nightly-plan.env)
          $DOCKER run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CACHE/registry:/usr/local/cargo/registry" \
            -v "$CACHE/target:/workspace/target" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e CARGO_INCREMENTAL=0 \
            -e T="$T" \
            -e ARGS="$ARGS" \
            rust:1.93.0-bullseye \
            sh -c 'set -e; ldd --version | head -1; cargo build --locked --release $ARGS --target "$T"'
          mkdir -p "target/$T/release" dist
          # A planned bin the build did not produce fails this cp: build-failed.
          for b in ${NIGHTLY_BINS//,/ }; do
            cp "$CACHE/target/$T/release/$b" "target/$T/release/$b"
            A="$b-$T"
            mkdir -p "$A"
            cp "target/$T/release/$b" "$A/"
            for f in README.md LICENSE LICENSE-MIT COPYING UNLICENSE; do
              if [ -f "$f" ]; then cp "$f" "$A/"; fi
            done
            tar czf "dist/$A.tar.gz" "$A"
            (cd dist && shasum -a 256 "$A.tar.gz" > "$A.tar.gz.sha256")
            echo "Packaged: dist/$A.tar.gz ($(du -h "dist/$A.tar.gz" | cut -f1))"
          done

      # Runs on failure too: a failed build is a verdict the manifest records.
      - name: Record (sha256 of tarball and executable, --version, build SHA)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          # Every bin's --version must print the workspace crate version, and a
          # printed SHA must be this build's. bin_sha256 binds the executable.
          # NIGHTLY_BINS comes from the Build step's plan; a build that failed
          # before planning records build-failed without reading it.
          V=$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p&&/^version *=/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
          if [ -z "$V" ]; then echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; fi
          python3 scripts/nightly_manifest.py record --target "${{ matrix.target }}" --sha "$GITHUB_SHA" \
            --bins "${NIGHTLY_BINS:-none}" --bin-dir "target/${{ matrix.target }}/release" --dist dist \
            --build-outcome "${{ steps.build.outcome }}" --version "$V" > "dist/fragment-${{ matrix.target }}.json"
          cat "dist/fragment-${{ matrix.target }}.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.target }}
          path: dist/*
          if-no-files-found: warn

  # ── Build: macOS aarch64 natively on mini-m4 (#3204) ──
  # Host-native: there is no docker on macOS and no glibc floor to pin, so the
  # toolchain is rust-toolchain.toml via the runner's rustup, as in ci.yml's
  # mac-check. A LITERAL runs-on list, not fromJSON, so check_runner_labels.sh
  # sees the apple-silicon label. One box with 16 GB: this leg never holds the
  # Linux arches hostage -- publish uploads every green arch, and merge records a
  # darwin build that failed (or uploaded nothing) as a RED row that fails the
  # run, never as an absent one (operator 2026-09-25, "mac is critical").
  build-darwin:
    needs: gate
    if: needs.gate.outputs.decision == 'build'
    name: aarch64-apple-darwin on mini
    runs-on: [self-hosted, macOS, ARM64, apple-silicon, m4, mini]
    timeout-minutes: 180   # every workspace [[bin]] on one 16 GB box
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      T: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build (host-native, pinned toolchain)
        id: build
        run: |
          set -euo pipefail
          rustup show active-toolchain
          # As on Linux: the plan is every workspace [[bin]], made in this step.
          cargo metadata --no-deps --format-version 1 > nightly-meta.json
          python3 scripts/nightly_manifest.py plan --meta nightly-meta.json > nightly-plan.env
          cat nightly-plan.env >> "$GITHUB_ENV"
          NIGHTLY_BINS=$(sed -n 's/^NIGHTLY_BINS=//p' nightly-plan.env)
          ARGS=$(sed -n 's/^NIGHTLY_CARGO_ARGS=//p' nightly-plan.env)
          # shellcheck disable=SC2086  # ARGS is a word list by construction
          cargo build --locked --release $ARGS --target "$T"
          mkdir -p dist
          # A planned bin the build did not produce fails this cp: build-failed.
          for b in ${NIGHTLY_BINS//,/ }; do
            A="$b-$T"
            rm -rf "${A:?}"
            mkdir -p "$A"
            cp "target/$T/release/$b" "$A/"
            for f in README.md LICENSE LICENSE-MIT COPYING UNLICENSE; do
              if [ -f "$f" ]; then cp "$f" "$A/"; fi
            done
            tar czf "dist/$A.tar.gz" "$A"
            (cd dist && shasum -a 256 "$A.tar.gz" > "$A.tar.gz.sha256")
            echo "Packaged: dist/$A.tar.gz ($(du -h "dist/$A.tar.gz" | cut -f1))"
          done

      - name: Record (sha256 of tarball and executable, --version, build SHA)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist
          V=$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p&&/^version *=/{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
          if [ -z "$V" ]; then echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; fi
          python3 scripts/nightly_manifest.py record --target "$T" --sha "$GITHUB_SHA" \
            --bins "${NIGHTLY_BINS:-none}" --bin-dir "target/$T/release" --dist dist \
            --build-outcome "${{ steps.build.outcome }}" --version "$V" > "dist/fragment-$T.json"
          cat "dist/fragment-$T.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-aarch64-apple-darwin
          path: dist/*
          if-no-files-found: warn

  # ── Publish per arch, then the manifest ──────────────────
  publish:
    needs: [gate, build, build-darwin]
    if: always() && needs.gate.result == 'success'
    runs-on: [self-hosted, Linux, X64, clean-room]
    permissions:
      contents: write   # /git/refs (nightly tag) + /releases (assets)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A runner that died uploaded nothing; merge records that arch red, so
      # an empty download must not stop the other arch from publishing.
      - name: Download build artifacts
        if: needs.gate.outputs.decision == 'build'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge the manifest
        id: merge
        run: |
          set -euo pipefail
          mkdir -p dist
          bash scripts/nightly_fetch_manifest.sh prev-manifest.json
          python3 scripts/nightly_manifest.py merge --prev prev-manifest.json --fragments dist \
            --sha "$GITHUB_SHA" --decision "${{ needs.gate.outputs.decision }}" \
            --run-id "$GITHUB_RUN_ID" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > nightly-manifest.json
          cat nightly-manifest.json
          echo "decision=$(python3 -c 'import json;print(json.load(open("nightly-manifest.json"))["decision"])')" >> "$GITHUB_OUTPUT"

      # REST, not `gh`: the fleet boxes carry no gh (binary-release.yml, run 34448908554).
      - name: Publish green arches, then nightly-manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/nightly_manifest.py publish --manifest nightly-manifest.json --dist dist --sha "$GITHUB_SHA"

      - name: Fail the run on a red verdict (the arbiter tickets it from the manifest)
        env:
          DECISION: ${{ steps.merge.outputs.decision }}
        run: |
          echo "### nightly: **$DECISION** at \`${GITHUB_SHA:0:9}\`" >> "$GITHUB_STEP_SUMMARY"
          case "$DECISION" in
            built|reused) exit 0 ;;
            ci-pending) echo "::warning::required checks not finished on ${GITHUB_SHA:0:9}; last green kept"; exit 0 ;;
            *) echo "::error::nightly $DECISION at ${GITHUB_SHA:0:9}; see nightly-manifest.json"; exit 1 ;;
          esac
