# Nightly binary builds for Linux x86_64 and aarch64, on the self-hosted fleet.
# APR-MONO: All deps are in-tree. No sibling repo checkouts needed.
# Spec: docs/specifications/release-system.md
#
# Schedule: daily 4am UTC. Manual trigger via workflow_dispatch.
# Skips build if no commits in the last 24 hours.
#
# Produces: apr-{target}.tar.gz (+ .sha256), published as a GitHub prerelease
# under the "nightly" tag.
#
# #3073 (operator rule 2026-09-10: "WE DO NOT USE HOSTED GITHUB RUNNERS"): every
# job runs on the fleet. x86_64 builds on yoga and aarch64 natively on gx10, both
# inside rust:1.93.0-bullseye (binary-release.yml's CPU-lane pattern), so the
# nightly's glibc floor is 2.31; the ubuntu-latest build needed GLIBC_2.39 and did
# not run on lambda's 22.04. Windows is gone: no self-hosted Windows runner is
# registered and there is no hosted fallback. macOS came back with a box for it
# (#3204): aarch64-apple-darwin builds host-native on mini-m4 (build-darwin).

name: Nightly

on:
  schedule:
    # SHIFTED so it actually runs at night (#3292). GitHub dispatches
    # schedule events 3h51m-6h49m late on this account (28 runs, 10
    # workflows, 3 nights, zero on time), so a 04:00 cron fired mid-
    # morning and the nightly tier occupied 06:49-14:14 UTC — the
    # working day, competing with PR traffic for the same runners.
    # Cron is set ~5h EARLY so the delayed dispatch lands near 04:00 UTC.
    # This is CALIBRATION AGAINST A MOVING TARGET: the delay varies by
    # ~3h and is growing. The durable fix is a fleet-side timer calling
    # `gh workflow run` (#3292); until then, re-measure before trusting.
    - cron: '0 23 * * *'   # 23:00 UTC -> lands ~04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Check for recent activity ────────────────────────────
  check-activity:
    runs-on: [self-hosted, Linux, X64, clean-room]
    outputs:
      has_commits: ${{ steps.check.outputs.has_commits }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for commits in last 24h
        id: check
        run: |
          RECENT=$(git log --oneline --since="24 hours ago" | wc -l)
          if [ "$RECENT" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
            echo "Found $RECENT commit(s) in last 24h (or manual trigger)"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "No commits in last 24h — skipping nightly build"
          fi

  # ── Build apr: Linux x86_64 on yoga, aarch64 natively on gx10 ──
  # {cpu, cuda} x {x86_64, aarch64} (#4326). Before the cuda legs the nightly
  # shipped CPU binaries only, so a GPU host could never run the latest
  # nightly. The cuda legs mirror binary-release.yml's build-apr-cuda lane:
  # `--features cuda`, and the libcuda.so loader string proves it in the bytes.
  # The cpu assets keep their names (`apr-<target>.tar.gz`); cuda adds `-cuda`.
  # A cuda leg is continue-on-error: it must never cost the fleet its CPU nightly,
  # and a missing -cuda asset is named by fleet-bins' asset resolve, not hidden.
  build:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    name: apr (${{ matrix.flavour }}) ${{ matrix.target }} on ${{ matrix.host }}
    continue-on-error: ${{ matrix.flavour == 'cuda' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: yoga
            flavour: cpu
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga"]'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            flavour: cpu
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10"]'
          - target: x86_64-unknown-linux-gnu
            host: yoga
            flavour: cuda
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga"]'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            flavour: cuda
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    env:
      # cpu keeps the pre-#4326 name and cache path (a warm cache stays warm)
      SUFFIX: ${{ matrix.flavour == 'cuda' && '-cuda' || '' }}
      FEATURES: ${{ matrix.flavour == 'cuda' && '--features cuda' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A sibling container through the mounted socket, as in binary-release.yml's
      # CPU lanes: every bind-mount path must exist on the HOST (the work root is
      # mirrored host<->container; $HOME is not), and the target mountpoint is
      # pre-created as the runner so dockerd never creates it root-owned (#3098).
      - name: Build apr inside rust:1.93.0-bullseye (glibc 2.31 floor)
        run: |
          DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER="sudo -n docker"
          T="${{ matrix.target }}"
          CACHE="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/cache-nightly/$T$SUFFIX"
          mkdir -p "$CACHE/registry" "$CACHE/target" "$GITHUB_WORKSPACE/target"
          $DOCKER run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CACHE/registry:/usr/local/cargo/registry" \
            -v "$CACHE/target:/workspace/target" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e CARGO_INCREMENTAL=0 \
            -e T="$T" \
            -e FEATURES="$FEATURES" \
            rust:1.93.0-bullseye \
            sh -c 'set -e; ldd --version | head -1; cargo build --release -p apr-cli --bin apr --target "$T" $FEATURES'
          mkdir -p "target/$T/release"
          cp "$CACHE/target/$T/release/apr" "target/$T/release/apr"
          "target/$T/release/apr" --version

      # The feature must be in the BYTES, not in the intent (binary-release.yml):
      # the driver loader string exists only under --features cuda.
      - name: Prove the cuda feature is in the artifact
        if: matrix.flavour == 'cuda'
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          n=$(grep -ac 'libcuda.so' "$BIN" || true)
          echo "libcuda.so loader strings in $BIN: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::$BIN carries no libcuda.so loader string — this is NOT a CUDA build"
            exit 1
          fi

      - name: Package
        run: |
          ARCHIVE="apr-${{ matrix.target }}$SUFFIX"
          mkdir -p "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/apr" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT COPYING UNLICENSE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "Packaged: ${ARCHIVE}.tar.gz ($(du -h "${ARCHIVE}.tar.gz" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apr-${{ matrix.target }}${{ env.SUFFIX }}
          path: |
            apr-${{ matrix.target }}${{ env.SUFFIX }}.tar.gz
            apr-${{ matrix.target }}${{ env.SUFFIX }}.tar.gz.sha256

  # ── Build apr: macOS aarch64 natively on mini-m4 (#3204) ──
  # Host-native: there is no docker on macOS and no glibc floor to pin, so the
  # toolchain is rust-toolchain.toml via the runner's rustup, as in ci.yml's
  # mac-check. A LITERAL runs-on list, not fromJSON, so check_runner_labels.sh
  # sees the apple-silicon label. One box with 16 GB: this leg is not allowed to
  # hold the Linux nightly hostage -- `release` publishes when `build` is green
  # whatever this job did, and the darwin tarball is simply absent that night.
  build-darwin:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    name: apr aarch64-apple-darwin on mini
    runs-on: [self-hosted, macOS, ARM64, apple-silicon, m4, mini]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
      T: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build apr (host-native, pinned toolchain)
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo build --release --locked -p apr-cli --target "$T"
          "target/$T/release/apr" --version

      - name: Package
        run: |
          set -euo pipefail
          ARCHIVE="apr-$T"
          rm -rf "$ARCHIVE" "$ARCHIVE.tar.gz" "$ARCHIVE.tar.gz.sha256"
          mkdir -p "$ARCHIVE"
          cp "target/$T/release/apr" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT COPYING UNLICENSE; do
            if [ -f "$f" ]; then cp "$f" "$ARCHIVE/"; fi
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "Packaged: ${ARCHIVE}.tar.gz ($(du -h "${ARCHIVE}.tar.gz" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apr-aarch64-apple-darwin
          path: |
            apr-aarch64-apple-darwin.tar.gz
            apr-aarch64-apple-darwin.tar.gz.sha256

  # ── Create/update nightly prerelease ─────────────────────
  # Gated on the Linux matrix alone: build-darwin is in `needs` only so its
  # artifact is downloaded when it exists (see build-darwin's comment).
  release:
    needs: [build, build-darwin]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, clean-room]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # REST, not `gh`: the fleet boxes carry no gh (binary-release.yml, run
      # 34448908554). Tolerant like the `gh release delete ... || true` it replaces.
      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          rid=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/releases/tags/nightly" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))' || true)
          if [ -n "$rid" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/$rid")
            echo "release $rid delete: HTTP $code"
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/git/refs/tags/nightly")
          echo "tag nightly delete: HTTP $code (204 deleted; 404/422 already absent)"

      - name: Create nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build from `main`.

            **Date:** ${{ github.event.repository.updated_at || github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}

            > This is a prerelease. For stable releases, see the latest tagged version.
          files: |
            artifacts/*
