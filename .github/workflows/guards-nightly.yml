# guards-nightly.yml -- the guards whose universe is the whole tree, run once a
# day on main instead of on every pull request (PMAT-1098, row 67-E3 of
# docs/specifications/06x-release-schedule.md).
#
# THE BUDGET THAT CREATED THIS FILE
# ---------------------------------
# Operator, 2026-09-10: "We need to speed up PR iterations by limiting the
# testing to at MOST 20 minutes ... then forcing the FULL test runs for
# pre-release dogfood ONLY."
#
# Measured, not assumed -- `gh api repos/paiml/aprender/actions/runs/
# 34449608126/jobs` (PR #3074, 2026-09-10, step timestamps):
#
#     guard-cargo   43.8 min   80 steps, 13 of them over 60 s
#     guard-tree    27.3 min   45 steps, 2 of them over 60 s
#
# The seven steps below are 26.8 of guard-cargo's 43.8 minutes and they are
# the ones whose verdict does NOT depend on the diff: they re-prove the same
# property about the same files on every PR. scripts/guards_nightly_manifest.txt
# is the join key -- one line per moved step, with the seconds it cost -- and
# the first step of this job refuses to run if a name in it does not match a
# step here (a manifest that has drifted from the workflow is how a moved
# guard becomes a deleted one).
#
# WHAT DID NOT MOVE. Path-scoped guards stayed on the PR, and so did every
# `--self-test` case table belonging to a guard that stayed: enforcement
# integrity first. `workspace-test`, `gate` and `mutants` are untouched.
#
# THE RESIDUAL, NAMED. A defect in one of these classes can now reach main and
# is caught within 24 h here, or at the pre-publish dogfood -- decision D-1 of
# the 06x schedule, risk R2. That is the trade the 20-minute budget buys.
#
# RUNNER. [self-hosted, Linux, X64, clean-room] -- the provisioned sovereign-ci
# pool, the same one guard-cargo uses, with the same image, the same per-ref
# CARGO_HOME and its own target dir. NEVER a hosted runner (ubuntu-*/macos-*/
# windows-*): operator rule, 2026-09-10.
name: guards-nightly

on:
  schedule:
    # 02:47Z -- an off-minute, and a slot no other nightly holds: cuda-nightly
    # 01:30 (10 min), silicon-nightly 03:30, qwen-story-daily 04:17. A run of
    # this job measured ~27 min of steps, so it lands clear of all three.
    # SHIFTED so it actually runs at night (#3292). GitHub dispatches
    # schedule events 3h51m-6h49m late on this account (28 runs, 10
    # workflows, 3 nights, zero on time), so a 02:47 cron fired mid-
    # morning and the nightly tier occupied 06:49-14:14 UTC — the
    # working day, competing with PR traffic for the same runners.
    # Cron is set ~5h EARLY so the delayed dispatch lands near 02:47 UTC.
    # This is CALIBRATION AGAINST A MOVING TARGET: the delay varies by
    # ~3h and is growing. The durable fix is a fleet-side timer calling
    # `gh workflow run` (#3292); until then, re-measure before trusting.
    - cron: '47 21 * * *'   # 21:47 UTC -> lands ~02:47 UTC
  workflow_dispatch:

# One at a time. Two of these jobs would share $GUARD_CARGO_HOME for the same
# ref and race on cargo's .package-cache (PMAT-238 / paiml/infra#435), and a
# manual dispatch during the scheduled run is exactly how that happens.
concurrency:
  group: guards-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guards-nightly:
    runs-on: [self-hosted, Linux, X64, clean-room]
    permissions:
      contents: read
      issues: write   # #5182: a red ratchet night opens or updates the one LAB ticket
    # 60: BSE-05 formula T = max(15, ceil(1.5*p99), p99+20) over the measured
    # cost of the steps this job carries -- 26.8 min of guard-cargo's own
    # 43.8-min run 34449608126, plus checkout and the cargo-home heal. With
    # p99 taken as that 30 min (this job has no history yet; the first three
    # runs replace this basis), T = max(15, 45, 50) = 50, rounded to 60 because
    # a nightly on a shared 32-core host pays contention a PR job does not and
    # nothing is blocked while it waits.
    timeout-minutes: 60
    # PP-19: this job runs `--ignored` tests on the shared X64 clean-room host,
    # so it joins the repo-wide `perf-intel` group (the one nightly-bench's
    # `measure` and beat-speed-nightly declare) and serialises against them.
    # Enforced by scripts/check_perf_concurrency_groups.sh.
    concurrency:
      group: perf-intel
      cancel-in-progress: false
    env:
      IMAGE: localhost:5000/sovereign-ci:stable
      # Same shape as guard-cargo (ci.yml). On a schedule/dispatch run there is
      # no pull request, so the per-ref directories key on the branch name.
      # aprender#2627: an UNDEFINED name here collapses the bind source to a
      # trailing-slash path and every mount silently stops being the thing its
      # comment describes, so this is defined at JOB level exactly as there.
      PR_OR_REF: ${{ github.ref_name }}
      GUARD_TARGET_DIR: /mnt/nvme-raid0/targets/aprender-ci/${{ github.ref_name }}/run-${{ github.run_id }}-guards-nightly
      GUARD_CARGO_HOME: /mnt/nvme-raid0/cargo-ci/home/${{ github.ref_name }}
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal)
        # Verbatim from ci.yml's guard-cargo. A hard-killed docker job leaves
        # root-owned files in the runner checkout and the next job's
        # `git clean -ffdx` dies with EACCES before a step runs.
        run: |
          if docker image inspect "$IMAGE" > /dev/null 2>&1; then
            docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" "$IMAGE" \
              bash -c 'chown -R 1000:1000 /workspace 2>/dev/null || true'
          else
            echo "Image not cached — no prior docker job on this runner, nothing to restore"
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # THE MANIFEST IS THE JOIN KEY, AND IT IS CHECKED BEFORE ANYTHING RUNS.
      #
      # A step that leaves ci.yml and never arrives here is a guard that was
      # deleted while looking moved -- the quiet failure this whole row exists
      # to avoid. Every non-comment line of scripts/guards_nightly_manifest.txt
      # names a step; each must appear VERBATIM as a `- name:` in this file.
      # Fail-closed: an empty manifest, a missing file or an unreadable line is
      # a failure, never a pass.
      # EXTRACTED to scripts/check_guards_nightly_manifest.sh (PMAT-3234). The
      # inline version matched `grep -Fq -- "- name: $name"` — the BARE spelling —
      # while a step name containing a colon-space must be QUOTED in YAML, and one
      # of them is. So the matcher looked for `- name: Test-tier...` and the file
      # said `- name: "Test-tier...`, and this lane went RED naming a step that
      # runs on every nightly as one the workflow does not run.
      #
      # Logic that lives in a `run:` block cannot be unit-tested and cannot carry a
      # case table; that is why the defect survived. The script matches on the
      # PARSED name, so all three YAML quotings of one string are one step, and it
      # ships 7 rows in both directions (a genuinely absent step still fails, and a
      # manifest that parsed almost nothing is refused rather than passed).
      - name: Manifest-vs-workflow case table (PMAT-3234, both directions)
        run: setsid --wait bash scripts/check_guards_nightly_manifest.sh --self-test
      - name: Every step the manifest says moved here must exist here
        run: setsid --wait bash scripts/check_guards_nightly_manifest.sh
      # THE COMPARAND, FETCHED ONCE, BEFORE ANY GUARD THAT NEEDS IT -- the
      # SATD step below measures its ceiling on origin/main with the HEAD-built
      # suite, and a depth-1 checkout has no such ref until this runs.
      - name: Fetch origin/main as the comparand for every ratchet in this job
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Create this job's own target dir and CARGO_HOME (before any bind mount)
        # Verbatim from ci.yml's guard-cargo (heal_path): a root-owned parent
        # created by the docker daemon for another job's bind mount is chowned
        # through the image before the mkdir -- that directory only, never its
        # contents (#3037/#3039).
        run: |
          heal_path() {
            local root=$1 path=$2 cur=$1 rel part
            rel=${path#"$root"/}
            IFS=/ read -ra parts <<< "$rel"
            for part in "${parts[@]}"; do
              cur="$cur/$part"
              if [ -d "$cur" ] && [ ! -w "$cur" ]; then
                docker run --rm -v "$(dirname "$cur"):/p" "$IMAGE" chown "$(id -u):$(id -g)" "/p/$(basename "$cur")"
              fi
            done
            mkdir -p "$path"
          }
          heal_path /mnt/nvme-raid0/targets/aprender-ci "$GUARD_TARGET_DIR"
          heal_path /mnt/nvme-raid0/cargo-ci/home "$GUARD_CARGO_HOME/registry"
          printf 'target dir: %s\n' "$GUARD_TARGET_DIR"
          printf 'cargo home: %s (registry/ .package-cache .package-cache-mutate travel together)\n' "$GUARD_CARGO_HOME"
      - name: pmat/bashrs must match the pinned fleet versions (never install)
        # The fleet pin is the only installer; this asserts the version on PATH
        # matches tools.toml and fails closed. Placed before the first use.
        run: setsid --wait bash scripts/check_tool_versions.sh
      # ─────────────────────────────────────────────────────────────────────
      # THE MOVED STEPS. Copied VERBATIM from ci.yml's guard-cargo job --
      # same `name:`, same `run:`, same docker/mount shape -- because the name
      # is what scripts/check_guards_are_wired.sh matches on (it greps every
      # file under .github/workflows/, not ci.yml alone) and the mounts are
      # what keep this job off workspace-test's target tree (aprender#2822).
      # ─────────────────────────────────────────────────────────────────────
      - name: "Test-tier decision case table (BSE-17): quick/full/reuse, drift is ENV"
        run: bash scripts/ci_test_tier.sh --self-test
      - name: Fleet-cells gate case table and mutants (#5064, LAB)
        run: setsid --wait bash scripts/release/fleet_cells_gate.sh --self-test
      - name: compute row zero-tests case table and mutants (#5048, LAB)
        run: setsid --wait bash scripts/tests/compute_row_zero_tests_test.sh --mutants
      - name: shared-checkout shallow lock case table and mutants (#5025, LAB)
        run: setsid --wait bash scripts/shared_checkout_no_shallow.sh --mutants
      - name: nextest list-wrapper case table (#5298, LAB)
        run: setsid --wait bash scripts/ci/nextest_list_wrapper.sh --self-test
      - name: aprender-core builds for wasm32
        run: setsid --wait bash scripts/check_wasm32_core_builds.sh
      - name: No test may assert about the fd 0 it inherited
        run: setsid --wait bash scripts/check_hermetic_stdin_tests.sh
      - name: Publish safety (binary/oversize files in published packages)
        run: setsid --wait bash scripts/check_publish_safety.sh
      - name: Perf gate can still discriminate (APR-PERF-GATE-001, case table)
        run: bash scripts/perf_gate.sh --selftest
      - name: Book rust examples compile
        run: setsid --wait bash scripts/check_book_examples_compile.sh
      - name: aprender-profile lib tests (was gated by nothing)
        run: cargo test -p aprender-profile --lib
      - name: model-tests falsification suites (was gated by nothing, aprender#2522) -- SATD ceiling measured on the comparand (BSE-03)
        run: |
          set -euo pipefail
          # The warm sccache lives under the runner user's data dir on the persistent intel
          # runners; an ephemeral container has no such dir and gets a cold cache in its
          # own temp instead. Derived, never a literal: the shipped-tier hardcoded-path
          # ratchet (check_hardcoded_paths.sh) refused this file for `/home/<user>/…`
          # (aprender run 34641537515, guard-tree step 43).
          SCCACHE_HOST_DIR="$HOME/data/sccache"
          [ -d "$SCCACHE_HOST_DIR" ] || SCCACHE_HOST_DIR="$RUNNER_TEMP/sccache"
          mkdir -p "$SCCACHE_HOST_DIR"
          dr() { # dr <dir mounted as /workspace> <cmd...>
            local ws=$1; shift
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -v "${ws}:/workspace" \
              -v "${GUARD_CARGO_HOME}:/cargo-home" \
              -v "${GUARD_TARGET_DIR}:/workspace/target" \
              -e CARGO_HOME=/cargo-home \
              -v "${SCCACHE_HOST_DIR}:/sccache" \
              -w /workspace \
              -e CARGO_TARGET_DIR=/workspace/target \
              -e RUSTC_WRAPPER=rustc-sccache \
              -e SCCACHE_DIR=/sccache \
              -e SCCACHE_CACHE_SIZE=50G \
              -e CARGO_INCREMENTAL=0 \
              -e CARGO_BUILD_JOBS=8 \
              -e CARGO_TERM_COLOR=never \
              "${DR_ENV[@]}" \
              "$IMAGE" "$@"
          }
          DR_ENV=()
          # 1. build the checklist suite once, at HEAD, and learn its executable
          dr "$GITHUB_WORKSPACE" cargo test -p aprender-core --features model-tests \
            --test falsification_spec_v10_tests --no-run 2>&1 | tee "$RUNNER_TEMP/satd-build.log"
          bin=$(sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r$//' "$RUNNER_TEMP/satd-build.log" | sed -n 's|.*Executable tests/falsification_spec_v10_tests\.rs (\(.*\))$|\1|p' | tail -1)
          [ -n "$bin" ] || { echo "FAIL: cargo did not name the falsification suite executable"; exit 1; }
          # 2. measure the comparand with that same binary
          # A detached worktree, not `git archive`: archive honours .gitattributes
          # export-ignore, so an ignored source file would vanish from the
          # comparand and lower the measured count (review m2-prb-review, 4/5 lanes).
          comparand="$RUNNER_TEMP/comparand"; git worktree remove --force "$comparand" 2>/dev/null || rm -rf "$comparand"
          git worktree add --detach "$comparand" origin/main
          trap 'git worktree remove --force "$comparand" 2>/dev/null || true' EXIT
          DR_ENV=(-e SATD_BASELINE=0)
          set +e
          out=$(dr "$comparand" "$bin" f_dod_001_satd_count_is_zero --exact --nocapture 2>&1); mrc=$?
          set -e
          n=$(printf '%s\n' "$out" | sed -n 's/.*BROKEN -- \([0-9][0-9]*\) markers in production source.*/\1/p' | head -1)
          if [ "$mrc" -eq 0 ] && [ -z "$n" ] && printf '%s\n' "$out" | grep -q '^test result: ok'; then n=0; fi
          case "$n" in ''|*[!0-9]*) printf '%s\n' "$out" | tail -20; echo "FAIL: the comparand measurement did not yield a count (rc=$mrc)"; exit 1 ;; esac
          echo "SATD_BASELINE=$n measured on origin/main $(git rev-parse --short origin/main) by the HEAD-built suite"
          # 3. the suites, judged against the measured ceiling
          DR_ENV=(-e "SATD_BASELINE=$n")
          dr "$GITHUB_WORKSPACE" cargo test -p aprender-core --features model-tests \
            --test falsification_spec_v10_tests \
            --test falsification_stress_tests \
            --test falsification_gpu_state_tests
          # 4. the satd class of the ratchet-semantics case table (rebuilds nothing)
          DR_ENV=()
          dr "$GITHUB_WORKSPACE" bash scripts/tests/ratchet_semantics_test.sh --class satd
      # The hand-list guard (#3745 S3) and the ladder gap (#5231). LAB, not GATE: they run
      # here, never on a PR, merge-queue or release path. Their case tables run with the
      # apr-cli lib tests; these two steps run the #[ignore]d tree scan and ladder-gap
      # requirement. Each red reaches ONE ticket with ONE owner through its own opener
      # below (its label; a ticket already carrying it is commented, never duplicated).
      - name: Release surfaces may not hand-list apr verbs or flags (#3745 S3)
        id: lab_hand_list
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/hand-list.log") 2>&1
          cargo test -p apr-cli --lib -- --ignored --exact hand_list_guard::tests::no_release_surface_hand_lists_apr_verbs_or_flags
      - name: The model ladder owes cells to every model-cell command (#5231)
        id: lab_ladder_gap
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/ladder-gap.log") 2>&1
          cargo test -p apr-cli --lib -- --ignored --exact hand_list_guard::tests::the_ladder_owes_every_model_cell_command
      - name: A red hand-list night opens or updates its one LAB ticket (#3745)
        if: failure() && steps.lab_hand_list.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/lab_ticket.sh --label lab-hand-list --title "LAB: a release surface hand-lists apr verbs or flags (#3745)" \
            --owner rex --log "$RUNNER_TEMP/hand-list.log" --event "$GITHUB_EVENT_NAME" --run-url "$RUN_URL"
      - name: A red ladder-gap night opens or updates its one LAB ticket (#5231)
        if: failure() && steps.lab_ladder_gap.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/lab_ticket.sh --label lab-ladder-gap --title "LAB: the model ladder owes cells to model-cell commands (ladder-gap, #3745)" \
            --owner aprender-a7 --log "$RUNNER_TEMP/ladder-gap.log" --event "$GITHUB_EVENT_NAME" --run-url "$RUN_URL"
      # #5182 (GATE/LAB). The two ratchets that left the PR path. On a schedule
      # run HEAD *is* origin/main, so merge-base(HEAD, origin/main) is HEAD and a
      # shrink-only comparison against it can never fail. The comparand is
      # therefore main as it was 24 h earlier: what grew on main since the last
      # nightly turns this red. Fetched shallow (3 days), resolved, printed.
      - name: Main as it was 24 h earlier, the comparand for the nightly ratchets (#5182)
        id: ratchet_base
        if: ${{ !cancelled() }}   # a red elsewhere in this job must not leave the ratchets unmeasured
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/ratchets.log") 2>&1
          git fetch --no-tags --shallow-since='3 days ago' origin +refs/heads/main:refs/remotes/origin/main
          base=$(git rev-list -1 --before='24 hours ago' origin/main)
          if [ -z "$base" ]; then
            base=$(git rev-list origin/main | tail -1)
            echo "no main commit older than 24 h in the fetched window; comparand = oldest fetched"
          fi
          printf 'comparand %s  %s\n' "$base" "$(git log -1 --format=%cI "$base")"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # The comparand reaches the two ratchets as a declared step output. When the step
      # above did not finish green it is empty, and `:?` turns that into a red ratchet
      # night instead of a comparison against nothing.
      - name: Per-function complexity may only fall (shrink-only)
        id: ratchet_cx
        if: ${{ !cancelled() }}   # a red elsewhere in this job must not leave the ratchets unmeasured
        env:
          RATCHET_24H_BASE: ${{ steps.ratchet_base.outputs.base }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/ratchets.log") 2>&1
          setsid --wait bash scripts/check_complexity_ratchet.sh --selftest
          BASELINE_RATCHET_BASE_REF="${RATCHET_24H_BASE:?no 24 h comparand (#5182)}" setsid --wait bash scripts/check_complexity_ratchet.sh
      - name: No shrink-only baseline in scripts/ grew (check_baseline_ratchets --ratchet)
        id: ratchet_br
        if: ${{ !cancelled() }}   # a red elsewhere in this job must not leave the ratchets unmeasured
        env:
          RATCHET_24H_BASE: ${{ steps.ratchet_base.outputs.base }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/ratchets.log") 2>&1
          BASELINE_RATCHET_BASE_REF="${RATCHET_24H_BASE:?no 24 h comparand (#5182)}" setsid --wait bash scripts/check_baseline_ratchets.sh --ratchet
      # #4709 (C303): the pv census ratchet. LAB, never on a PR path (C324): the bound
      # count never falls, the unbound share and the contracts with no falsification
      # tests never rise, measured by one pv on main 24 h ago and on main now. Its case
      # table (the real pv on fixture trees, stub pvs for every NOT_MEASURED) runs first.
      - name: The pv census bound share may only rise (#4709)
        id: ratchet_census
        if: ${{ !cancelled() }}   # a red elsewhere in this job must not leave the census unmeasured
        env:
          RATCHET_24H_BASE: ${{ steps.ratchet_base.outputs.base }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/census.log") 2>&1
          setsid --wait bash scripts/census_ratchet.sh --self-test
          CENSUS_BASE_REF="${RATCHET_24H_BASE:?no 24 h comparand (#5182)}" setsid --wait bash scripts/census_ratchet.sh
      - name: A red census night opens or updates the one LAB ticket (#4709)
        if: failure() && steps.ratchet_census.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/lab_ticket.sh --label lab-census-ratchet --title "LAB: nightly pv census ratchet red (#4709)" \
            --owner la-0.72 --log "$RUNNER_TEMP/census.log" --event "$GITHUB_EVENT_NAME" --run-url "$RUN_URL"
      # The GATE/LAB rule: a red opens or updates ONE ticket with ONE owner, then stays
      # silent. Only a red ratchet step calls this (a green night never does);
      # a red elsewhere in this job is not a ratchet red and writes nothing here.
      # The opener's case table (a planted red included) runs first.
      - name: A red ratchet night opens or updates the one LAB ticket (#5182)
        if: failure() && (steps.ratchet_base.outcome == 'failure' || steps.ratchet_cx.outcome == 'failure' || steps.ratchet_br.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/lab_ticket.sh --self-test
          bash scripts/lab_ticket.sh --label lab-nightly-ratchets --title "LAB: nightly shrink-only ratchets red (#5182)" \
            --owner aprender-cd --log "$RUNNER_TEMP/ratchets.log" --event "$GITHUB_EVENT_NAME" --run-url "$RUN_URL"
      - name: Summary
        if: always()
        run: |
          {
            printf '## guards-nightly\n\n'
            printf 'The tree-universe guards that left the PR path under the 20-minute\n'
            printf 'budget (PMAT-1098, row 67-E3). Manifest: `scripts/guards_nightly_manifest.txt`.\n\n'
            printf '| fact | value |\n|---|---|\n'
            printf '| ref | `%s` |\n' "${GITHUB_REF_NAME}"
            printf '| commit | `%s` |\n' "${GITHUB_SHA}"
            printf '| steps moved here | %s |\n' "$(grep -cvE '^[[:space:]]*(#|$)' scripts/guards_nightly_manifest.txt)"
            printf '| result | %s |\n' "${JOB_STATUS}"
            printf '\nA red run here is a defect that reached main: the PR path no longer\n'
            printf 'runs these. Fix it or move the step back -- do not disarm it.\n'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
