# examples-nightly.yml — every workspace example BUILDS AND RUNS, nightly, low priority (PMAT-3121, #3121).
#
# Operator 2026-09-11: "ensure you update apr-cookbook and release notes and cargo run
# --examples as part of pre-release to each tagged release -- dogfood skill". CI compiled
# 981 examples and ran none; this workflow runs them on the yoga pool (never the PR path,
# never the merge queue) and publishes evidence/dogfood/<version>/examples.tsv as an
# artifact. The pre-release gate G3.EX (.claude/skills/apr-dogfood/SKILL.md) reads the
# same script on the release candidate.
name: examples-nightly

on:
  workflow_call:   # #5082: release-rehearsal-nightly.yml calls this at its pick C
    inputs:
      ref:
        description: C, the 40-hex commit every job checks out and asserts
        type: string
        required: true
      caller:
        description: the calling job's name, which GitHub puts first in each called job's name
        type: string
        required: true
  schedule:
    # SHIFTED so it actually runs at night (#3292). GitHub dispatches
    # schedule events 3h51m-6h49m late on this account (28 runs, 10
    # workflows, 3 nights, zero on time), so a 03:30 cron fired mid-
    # morning and the nightly tier occupied 06:49-14:14 UTC — the
    # working day, competing with PR traffic for the same runners.
    # Cron is set ~5h EARLY so the delayed dispatch lands near 03:30 UTC.
    # This is CALIBRATION AGAINST A MOVING TARGET: the delay varies by
    # ~3h and is growing. The durable fix is a fleet-side timer calling
    # `gh workflow run` (#3292); until then, re-measure before trusting.
    - cron: '30 22 * * *'   # 22:30 UTC -> lands ~03:30 UTC
  workflow_dispatch:
    inputs:
      filter:
        description: 'regex over "<package>/<example>" (empty = every example)'
        required: false
        default: ''

concurrency:
  group: examples-nightly${{ inputs.caller && format('-{0}-{1}', inputs.caller, github.run_id) || '' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  examples:
    # yoga only: low-priority work that must never take an intel or gx10 PR slot
    runs-on: [self-hosted, Linux, X64, clean-room, yoga]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Assert HEAD is ${{ inputs.ref || github.sha }}
        env:
          REF: ${{ inputs.ref || github.sha }}
        run: bash scripts/release/release_lanes.sh assert-head "$REF"

      - name: dogfood_examples.sh case table (hermetic, scratch workspace)
        run: bash scripts/dogfood_examples.sh --selftest

      - name: Every example builds and runs (pass / fail / timeout / needs-args / needs-hardware)
        env:
          FILTER: ${{ github.event.inputs.filter }}
        run: |
          set -euo pipefail
          args=(--timeout-secs 180)
          if [ -n "${FILTER:-}" ]; then args+=(--filter "$FILTER"); fi
          bash scripts/dogfood_examples.sh "${args[@]}"

      - name: Publish the examples ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-ledger
          path: evidence/dogfood/*/examples.tsv
          if-no-files-found: error
