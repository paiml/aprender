          mkdir -p "target/${{ matrix.target }}/release"
          cp "$CACHE/target/${{ matrix.target }}/release/apr" "target/${{ matrix.target }}/release/apr"
          grep -aqF "$APR_SHA" "target/${{ matrix.target }}/release/apr" || { echo "::error::apr binary does not embed its commit $APR_SHA"; exit 1; }
          GLIBC=$(cat "$CACHE/target/BUILDER_GLIBC"); RUSTC=$(cat "$CACHE/target/BUILDER_RUSTC")
          echo "builder glibc: $GLIBC"; echo "builder rustc: $RUSTC"; nvidia-smi -L | head -1
          {
            echo "### apr (cuda) ${{ matrix.target }} built on ${{ matrix.host }} inside rust:1.93.0-bullseye"
            echo "- toolchain: $RUSTC"
            echo "- glibc floor of this asset (the container's): $GLIBC"
            echo "- device present on the builder host: $(nvidia-smi -L | head -1)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove the cuda feature is in the artifact
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          n=$(grep -ac 'libcuda.so' "$BIN" || true)
          echo "libcuda.so loader strings in $BIN: $n"
          if [ "$n" -lt 1 ]; then
            echo "::error::$BIN carries no libcuda.so loader string — this is NOT a CUDA build"
            exit 1
          fi
          "$BIN" --version
      - name: Package archive
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="apr-${VERSION}-${TARGET}-cuda"
          mkdir -p "$ARCHIVE"
          cp "target/${TARGET}/release/apr" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          du -h "${ARCHIVE}.tar.gz"
      - name: Check every archive against its .sha256 and keep the checksums (the rehearsal never uploads)
        shell: bash
        run: |
          set -euo pipefail
          KEEP="$RUNNER_TEMP/rehearsal-keep"
          rm -rf "${KEEP:?}"; mkdir -p "$KEEP"; n=0
          for s in *.tar.gz.sha256 dist/*.tar.gz.sha256; do
            [ -f "$s" ] || continue
            (cd "$(dirname "$s")" && shasum -a 256 -c "$(basename "$s")")
            cp "$s" "$KEEP/"; n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then echo "::error::the package step left no archive"; exit 1; fi
          echo "kept $n checksums" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the checksums as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/rehearsal-keep/
          if-no-files-found: error
          retention-days: 5
  build-apr-cpu:
    name: apr (cpu) ${{ matrix.target }} on ${{ matrix.host }}
    needs: assets
    runs-on: ${{ fromJSON(matrix.labels) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            host: yoga
            labels: '["self-hosted", "Linux", "X64", "cuda", "yoga"]'
          - target: aarch64-unknown-linux-gnu
            host: gx10
            labels: '["self-hosted", "Linux", "ARM64", "cuda", "gx10"]'
    steps:
      - name: Refuse to run where an upload credential exists (the rehearsal cannot upload)
        shell: bash
        run: |
          bad=0
          for v in GH_TOKEN GITHUB_TOKEN CARGO_REGISTRY_TOKEN CARGO_REGISTRIES_CRATES_IO_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "$(printenv "$v" 2>/dev/null)" ]; then
              echo "::error::refusing to rehearse: $v is set in this job's environment"; bad=1
            fi
          done
          # cargo reads an empty CARGO_HOME as unset, so the guard does too.
          ch=$(printenv CARGO_HOME 2>/dev/null) || true; [ -n "$ch" ] || ch="$HOME/.cargo"
          for f in "$ch/credentials" "$ch/credentials.toml"; do
            if [ -s "$f" ]; then echo "::error::refusing to rehearse: a cargo registry credential file exists: $f"; bad=1; fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "no upload credential here: no GH_TOKEN, GITHUB_TOKEN, registry token, OIDC request token or cargo credential file"
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ needs.assets.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved (release event missing tag_name and no dispatch input)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building apr (default features, no cuda) for $TAG -> ${{ matrix.target }}"
      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Stamp the rc version into the tag tree (#4110)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          case "$TAG" in *-rc.*) ;; *) echo "final tag $TAG: nothing to stamp"; exit 0 ;; esac
          git fetch --no-tags --depth 1 origin "$GITHUB_WORKFLOW_SHA"
          git show "FETCH_HEAD:scripts/release/stamp_rc_version.sh" > "$RUNNER_TEMP/stamp_rc_version.sh"
          bash "$RUNNER_TEMP/stamp_rc_version.sh" "$GITHUB_WORKSPACE" "$TAG"
      - name: Preflight - this box has the tools this job assumes
        run: bash scripts/ci_self_hosted_preflight.sh --need docker objdump
      - name: Build apr on the default features (no cuda) inside rust:1.93.0-bullseye (glibc 2.31 floor)
        run: |
          DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER="sudo -n docker"
          # The runner is itself a disposable container (labels ephemeral,docker — infra
          # machines/<box>/forjar-ephemeral.yaml): the bullseye build is a SIBLING container
          # through the mounted socket, so every bind-mount path must exist on the HOST at
          # the same path. The work root is mirrored host<->container; $HOME is not.
          CACHE="$(cd "$GITHUB_WORKSPACE/../.." && pwd)/cache-apr-cpu/${{ matrix.target }}"
          mkdir -p "$CACHE/registry" "$CACHE/target"
          # The bind-mount TARGET inside the workspace must exist BEFORE the container
          # starts: when it does not, dockerd creates the mountpoint as root, and after
          # the container exits the workspace carries an empty root-owned `target/` the
          # runner (uid 1001) cannot write — run 34488955316 built the asset in 1m54s and
          # then died on `mkdir: cannot create directory 'target/aarch64-unknown-linux-gnu':
          # Permission denied`. Pre-creating it as the runner keeps the ownership.
          # build.rs runs `git rev-parse` INSIDE this container, where the checkout is owned by
          # the runner uid and git refuses it — so every release asset printed `(vX+no-git)` and
          # scripts/apr_bin.sh (STRICT) could not attribute it to its tag. Ask the host checkout.
          APR_SHA=$(git rev-parse --short=9 HEAD)
          mkdir -p "$GITHUB_WORKSPACE/target"
          $DOCKER run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$CACHE/registry:/usr/local/cargo/registry" \
            -v "$CACHE/target:/workspace/target" \
            -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target \
            -e CARGO_INCREMENTAL=0 \
            -e APR_GIT_SHA_OVERRIDE="$APR_SHA" \
            rust:1.93.0-bullseye \
            sh -c 'set -e; ldd --version | head -1 > /workspace/target/BUILDER_GLIBC; rustc --version > /workspace/target/BUILDER_RUSTC; cargo build --release -p apr-cli --bin apr --target ${{ matrix.target }} --locked; strip target/${{ matrix.target }}/release/apr'
          # the mounted target dir is the host cache; expose the binary where the next steps expect it
          mkdir -p "target/${{ matrix.target }}/release"
          cp "$CACHE/target/${{ matrix.target }}/release/apr" "target/${{ matrix.target }}/release/apr"
          grep -aqF "$APR_SHA" "target/${{ matrix.target }}/release/apr" || { echo "::error::apr binary does not embed its commit $APR_SHA"; exit 1; }
          GLIBC=$(cat "$CACHE/target/BUILDER_GLIBC"); RUSTC=$(cat "$CACHE/target/BUILDER_RUSTC")
          echo "builder glibc: $GLIBC"; echo "builder rustc: $RUSTC"
          {
            echo "### apr (cpu) ${{ matrix.target }} built on ${{ matrix.host }} inside rust:1.93.0-bullseye"
            echo "- toolchain: $RUSTC"
            echo "- glibc floor of this asset (the container's): $GLIBC"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prove the cuda feature is NOT in the artifact
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          n=$(grep -ac 'libcuda.so' "$BIN" || true)
          echo "libcuda.so loader strings in $BIN: $n (expected 0)"
          if [ "$n" -ne 0 ]; then
            echo "::error::$BIN carries $n libcuda.so loader string(s) — this is a CUDA build wearing a -cpu name"
            exit 1
          fi
          "$BIN" --version
      - name: Record the asset's glibc floor (objdump, not ldd)
        id: floor
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          FLOOR=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -u -t_ -k2 -V | tail -1)
          [ -n "$FLOOR" ] || FLOOR="none (no versioned glibc imports)"
          echo "floor=$FLOOR" >> "$GITHUB_OUTPUT"
          echo "- glibc floor of this asset (objdump -T): $FLOOR" >> "$GITHUB_STEP_SUMMARY"
          echo "asset glibc floor: $FLOOR"
      - name: Strip binary
        run: |
          BIN="target/${{ matrix.target }}/release/apr"
          strip "$BIN"
          ls -la "$BIN"
      - name: Package archive
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="apr-${VERSION}-${TARGET}-cpu"
          mkdir -p "$ARCHIVE"
          cp "target/${TARGET}/release/apr" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          du -h "${ARCHIVE}.tar.gz"
      - name: Check every archive against its .sha256 and keep the checksums (the rehearsal never uploads)
        shell: bash
        run: |
          set -euo pipefail
          KEEP="$RUNNER_TEMP/rehearsal-keep"
          rm -rf "${KEEP:?}"; mkdir -p "$KEEP"; n=0
          for s in *.tar.gz.sha256 dist/*.tar.gz.sha256; do
            [ -f "$s" ] || continue
            (cd "$(dirname "$s")" && shasum -a 256 -c "$(basename "$s")")
            cp "$s" "$KEEP/"; n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then echo "::error::the package step left no archive"; exit 1; fi
          echo "kept $n checksums" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the checksums as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/rehearsal-keep/
          if-no-files-found: error
          retention-days: 5
  build-apr-darwin:
    name: apr (cpu) aarch64-apple-darwin on mini
    needs: assets
    runs-on: [self-hosted, macOS, ARM64, mini-builder]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Refuse to run where an upload credential exists (the rehearsal cannot upload)
        shell: bash
        run: |
          bad=0
          for v in GH_TOKEN GITHUB_TOKEN CARGO_REGISTRY_TOKEN CARGO_REGISTRIES_CRATES_IO_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "$(printenv "$v" 2>/dev/null)" ]; then
              echo "::error::refusing to rehearse: $v is set in this job's environment"; bad=1
            fi
          done
          # cargo reads an empty CARGO_HOME as unset, so the guard does too.
          ch=$(printenv CARGO_HOME 2>/dev/null) || true; [ -n "$ch" ] || ch="$HOME/.cargo"
          for f in "$ch/credentials" "$ch/credentials.toml"; do
            if [ -s "$f" ]; then echo "::error::refusing to rehearse: a cargo registry credential file exists: $f"; bad=1; fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "no upload credential here: no GH_TOKEN, GITHUB_TOKEN, registry token, OIDC request token or cargo credential file"
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ needs.assets.outputs.tag }}"
          [ -n "$TAG" ] || { echo "::error::No tag resolved"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Stamp the rc version into the tag tree (#4110)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch --no-tags --depth 1 origin "$GITHUB_WORKFLOW_SHA"
          for f in stamp_rc_version.sh asset_version_check.sh; do
            git show "FETCH_HEAD:scripts/release/$f" > "$RUNNER_TEMP/$f"
          done
          case "$TAG" in *-rc.*) ;; *) echo "final tag $TAG: nothing to stamp"; exit 0 ;; esac
          bash "$RUNNER_TEMP/stamp_rc_version.sh" "$GITHUB_WORKSPACE" "$TAG"
      - name: Build apr on the default features (no cuda)
        run: |
          # Every later step reads ./target. The mini's runner env redirects cargo's
          # target dir, so cargo built elsewhere and strip found nothing (run 37084403773).
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          APR_GIT_SHA_OVERRIDE="$(git rev-parse --short=9 HEAD)" \
            cargo build --release -p apr-cli --bin apr --target aarch64-apple-darwin --locked
          strip target/aarch64-apple-darwin/release/apr
      - name: The binary names its tag and commit (#4110)
        run: |
          line=$(target/aarch64-apple-darwin/release/apr --version)
          bash "$RUNNER_TEMP/asset_version_check.sh" "${{ steps.tag.outputs.tag }}" "$(git rev-parse HEAD)" "$line"
      - name: Prove the asset is an arm64 CPU build
        run: |
          BIN=target/aarch64-apple-darwin/release/apr
          n=$(grep -ac 'libcuda.so' "$BIN" || true)
          if [ "$n" -ne 0 ]; then
            echo "::error::$BIN carries $n libcuda.so loader string(s) — this is a CUDA build wearing a -cpu name"
            exit 1
          fi
          file "$BIN" | grep -q 'arm64' || { echo "::error::$BIN is not arm64: $(file "$BIN")"; exit 1; }
          MINOS=$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&$1=="minos"{print $2; exit}')
          echo "- minimum macOS (LC_BUILD_VERSION minos): ${MINOS:-unknown}" >> "$GITHUB_STEP_SUMMARY"
      - name: Package archive
        id: package
        run: |
          ARCHIVE="apr-${{ steps.tag.outputs.tag }}-aarch64-apple-darwin-cpu"
          mkdir -p "$ARCHIVE"
          cp target/aarch64-apple-darwin/release/apr "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do [ -f "$f" ] && cp "$f" "$ARCHIVE/"; done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
      - name: Check every archive against its .sha256 and keep the checksums (the rehearsal never uploads)
        shell: bash
        run: |
          set -euo pipefail
          KEEP="$RUNNER_TEMP/rehearsal-keep"
          rm -rf "${KEEP:?}"; mkdir -p "$KEEP"; n=0
          for s in *.tar.gz.sha256 dist/*.tar.gz.sha256; do
            [ -f "$s" ] || continue
            (cd "$(dirname "$s")" && shasum -a 256 -c "$(basename "$s")")
            cp "$s" "$KEEP/"; n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then echo "::error::the package step left no archive"; exit 1; fi
          echo "kept $n checksums" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the checksums as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/rehearsal-keep/
          if-no-files-found: error
          retention-days: 5
  verify:
    name: The rehearsal built every asset the release owes
    needs: [assets, build, build-all-bins, build-apr-cuda, build-apr-cpu, build-apr-darwin]
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, clean-room]
    timeout-minutes: 10
    steps:
      - name: Refuse to run where an upload credential exists (the rehearsal cannot upload)
        shell: bash
        run: |
          bad=0
          for v in GH_TOKEN GITHUB_TOKEN CARGO_REGISTRY_TOKEN CARGO_REGISTRIES_CRATES_IO_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "$(printenv "$v" 2>/dev/null)" ]; then
              echo "::error::refusing to rehearse: $v is set in this job's environment"; bad=1
            fi
          done
          # cargo reads an empty CARGO_HOME as unset, so the guard does too.
          ch=$(printenv CARGO_HOME 2>/dev/null) || true; [ -n "$ch" ] || ch="$HOME/.cargo"
          for f in "$ch/credentials" "$ch/credentials.toml"; do
            if [ -s "$f" ]; then echo "::error::refusing to rehearse: a cargo registry credential file exists: $f"; bad=1; fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "no upload credential here: no GH_TOKEN, GITHUB_TOKEN, registry token, OIDC request token or cargo credential file"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the kept checksums
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rehearsal-*
          merge-multiple: true
          path: ${{ runner.temp }}/rehearsal-got
      - name: Verdict (green only when every build ran and the asset set is complete)
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          TAG: ${{ needs.assets.outputs.tag }}
        run: bash scripts/release/assets_rehearsal.sh verify "$TAG" "$RUNNER_TEMP/rehearsal-got" | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
