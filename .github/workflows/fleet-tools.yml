# Fleet tools — the pinned pmat/bashrs, asserted ON EVERY HOST THAT RUNS JOBS.
#
# WHY THIS EXISTS. tools.toml names the versions the fleet is supposed to have
# and scripts/check_tool_versions.sh asserts them — but only ever on the ONE
# runner that happened to take the job. guard-cargo lands on intel nearly every
# time, so for every other box the assertion had never run. Measured
# 2026-09-13, against a pin of pmat 3.39.0 / bashrs 7.0.4:
#
#     intel   pmat 3.39.0    bashrs 7.0.1    (one patch behind its own pin)
#     gx10    pmat 3.39.0    bashrs 7.0.4    (pmat installed by nothing, declared nowhere)
#     yoga    pmat 3.31.0    bashrs ABSENT   (eight minor behind; no linter at all)
#     mini    pmat 3.20.0    bashrs 7.0.4    (NINETEEN minor behind)
#
# yoga carries three `clean-room` runners and takes aprender PR work like any
# other box. Every bashrs guard that landed there could only refuse —
# check_shell_lint_ratchet.sh exits 2, "without the linter this guard cannot
# decide". A runner that can only fail closed is not capacity, and nothing in
# either repo was looking.
#
# FOUR EXPLICIT JOBS, NOT A MATRIX. infra#352: a guard must be able to SEE the
# labels a job selects, so they may not be hidden behind a matrix expression.
# `runs-on: ${{ matrix.runs-on }}` would dodge both .github/actionlint.yaml and
# scripts/check_runner_labels.sh. Four jobs is the price of being checkable.
#
# fail-fast is irrelevant here for the same reason: each host answers for
# itself, and the first red must not hide the other three.
name: Fleet tools

on:
  schedule:
    # 06:10 UTC — after every nightly, so a drift found here is about the fleet
    # and not about a tool a nightly was midway through replacing.
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel:
    name: pinned tools on intel
    runs-on: [self-hosted, Linux, X64, clean-room, intel]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_tool_versions.sh

  gx10:
    name: pinned tools on gx10
    runs-on: [self-hosted, Linux, ARM64, clean-room, gx10]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_tool_versions.sh

  yoga:
    name: pinned tools on yoga
    runs-on: [self-hosted, Linux, X64, clean-room, yoga]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_tool_versions.sh

  mini:
    name: pinned tools on mini
    # Same spelling as ci.yml's macos-arm64 leg. `apple-silicon` is what
    # check_runner_labels.sh counts as discriminating; `mini` alone is not in
    # its DISCRIM set, so a label set that names only the box would be refused.
    runs-on: [self-hosted, macOS, ARM64, apple-silicon, mini]
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_tool_versions.sh
