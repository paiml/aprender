name: CUDA Nightly (GPU QLoRA falsifiers)

# Enforces the v0.55-v0.57 QLoRA training-correctness falsifiers that require a
# real CUDA device and are therefore #[ignore]-gated (or self-skip without a
# GPU). See roadmap item CUDA-CI-NIGHTLY-001 and ROADMAP.md
# "Honest doctrine gap: GPU falsifiers are not yet CI-enforced".
#
# WHEN IT RUNS (all three properties are enforced below, not just documented):
#   1. NIGHTLY ONLY, overnight Madrid time. cron is UTC; 01:30 UTC =
#      03:30 Europe/Madrid in summer (CEST, UTC+2) and 02:30 in winter (CET,
#      UTC+1) — deep night year-round, and clear of the other nightlies
#      (coverage 03:00 UTC, nightly/binary 04:00 UTC, beat-speed 05:45 UTC).
#   2. YIELDS TO TRAINING. These falsifiers are LOW priority. Before doing any
#      work, each leg checks its GPU; if a training (or any) job is already
#      using it, the leg skips for the night (green no-op) so it never contends
#      with overnight training. A manual dispatch can force-override.
#   3. NEVER ON *REGULAR* PULL REQUESTS — opt-in only. There is no `push` trigger
#      and no unconditional `pull_request` trigger, so an ordinary PR never fires
#      this lane. The ONLY PR path is explicit targeting: a maintainer adds the
#      `cuda-check` label to a training-path PR, and the job gate below runs the
#      falsifiers against that PR's head exactly once (any other label is a
#      green no-op). This lets us build the green track record needed to later
#      promote the lane to a required gate on training-path PRs, without
#      auto-firing on every PR. It is NOT a required check — labeling is manual.
#
# SINGLE-SILICON, BY POLICY (paiml/infra#359).
#   - blackwell-gb10: gx10, GB10, sm_121, aarch64, CUDA 13.0
#                     (labels: self-hosted, gpu, Linux, ARM64, cuda, blackwell)
#                     egress via a forward proxy on lambda (10.42.0.10:8888)
#                     over the wired 10.42.0.0/24 link; the runner's .env
#                     carries HTTPS_PROXY. That is a PROXY, not a runner.
#
# The `ada-4090` leg is GONE. It ran on lambda-labs, which is the workstation
# and must never be a CI host — a rule that had already been broken once by a
# repo-scoped runner standing up after the named service was retired. gx10 is
# the fleet's only sanctioned GPU runner, and it is aarch64.
#
# WHAT THIS COSTS, stated rather than buried: sm_89 was the stable reference and
# sm_121 the higher-risk target (historical JIT bugs). We now gate only the
# risky one. A CUDA regression that reproduces on Ada but not Blackwell will not
# be caught here.
#
# Toggle: gated behind vars.CUDA_RUNNER_READY so the lane can be disabled
# without deleting the workflow.

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = ~03:30 Europe/Madrid (overnight)
  workflow_dispatch:
    inputs:
      silicon:
        description: "Which silicon to run (all | blackwell) — ada retired, see infra#359"
        required: false
        default: "all"
      force:
        description: "Run even if the GPU is busy with training (bypass the yield)"
        required: false
        default: "false"
  # OPT-IN PR path: fires only when a label is added, and the job gate below
  # runs ONLY for the `cuda-check` label. A regular PR (no label / any other
  # label) is a green no-op — this never auto-fires on PRs. Yield-to-training
  # still applies, so a labeled run defers if the GPU is busy.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: cuda-nightly
  cancel-in-progress: false

jobs:
  falsifiers:
    # Run on schedule/manual-dispatch as before; on a PR run ONLY when the
    # triggering label is exactly `cuda-check` (explicit opt-in targeting).
    if: >-
      ${{ vars.CUDA_RUNNER_READY == 'true' &&
      (github.event_name != 'pull_request' || github.event.label.name == 'cuda-check') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: blackwell-gb10
            arch: ARM64
            select: blackwell
    # LITERAL, not an expression. infra#352 requires a selector to name `gpu`,
    # and a guard can only check labels it can see — labels hidden behind a
    # matrix expression are invisible to it.
    runs-on: [self-hosted, gpu, Linux, ARM64, cuda, blackwell]
    timeout-minutes: 90
    env:
      APR_PARITY_MODEL: ${{ vars.APR_PARITY_MODEL || '/home/noah/models/qwen2.5-coder-1.5b-instruct-q4k.apr' }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Decide whether to run (silicon filter + yield-to-training)
        id: decide
        run: |
          set -uo pipefail
          want="${{ github.event.inputs.silicon || 'all' }}"
          force="${{ github.event.inputs.force || 'false' }}"

          # (a) silicon filter — a dispatch may target a single leg.
          if [ "$want" != "all" ] && [ "$want" != "${{ matrix.select }}" ]; then
            echo "::notice::${{ matrix.name }}: skipped (dispatch requested '$want')"
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # (b) yield to training — falsifiers are LOW priority. If any compute
          #     job is already on this GPU (or >2 GiB resident), skip tonight so
          #     we never contend with overnight training. `force=true` on a
          #     manual dispatch overrides.
          # `procs` (compute contexts) is the primary, portable signal — it
          # works on both sm_89 and GB10. `memory.used` is a secondary signal
          # and is [N/A] on GB10's unified memory. GitHub runs `run:` as
          # `bash -e -o pipefail`, so use `tr -cd` (never non-zero) to strip to
          # digits — a `grep -oE` that finds no digit exits 1 and, under -e,
          # would kill this step on GB10 (which is exactly what happened first).
          used=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits 2>/dev/null | head -1 | tr -cd '0-9')
          used=${used:-0}
          procs=$(nvidia-smi --query-compute-apps=pid --format=csv,noheader 2>/dev/null | grep -c . || true)
          procs=${procs:-0}
          echo "${{ matrix.name }}: GPU memory.used=${used} MiB, existing compute procs=${procs}"
          if [ "$force" = "true" ]; then
            echo "::notice::${{ matrix.name }}: force=true — running regardless of GPU load"
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${used:-0}" -gt 2000 ] || [ "${procs:-0}" -gt 0 ]; then
            echo "::notice::${{ matrix.name }}: GPU busy (${used:-?} MiB, ${procs:-?} procs) — yielding to training, skipping falsifiers tonight"
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.decide.outputs.proceed == 'true'

      - name: Preflight — CUDA device + parity model present
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          echo "runner: ${{ matrix.name }} ($(uname -m))"
          nvidia-smi -L || { echo "::error::no CUDA device visible on ${{ matrix.name }}"; exit 1; }
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
          if [ ! -f "$APR_PARITY_MODEL" ]; then
            echo "::error::APR_PARITY_MODEL not found on ${{ matrix.name }}: $APR_PARITY_MODEL"
            exit 1
          fi
          echo "parity model: $APR_PARITY_MODEL ($(du -h "$APR_PARITY_MODEL" | cut -f1))"

      - name: GPU QLoRA training-correctness falsifiers (--features cuda)
        if: steps.decide.outputs.proceed == 'true'
        # `nice` so the build never starves any CPU-side work of a job that
        # started after our yield check. --include-ignored runs BOTH the
        # #[ignore]-gated eval falsifiers and the non-ignored deadlock/NaN/
        # parity ones (which self-skip without a GPU).
        run: |
          nice -n 19 cargo test -p aprender-train --features cuda --lib --release -- \
            --include-ignored --nocapture --test-threads 1 \
            falsify_cuda_fused_rmsnorm_distinct_residual_out_no_deadlock \
            falsify_cuda_nf4_forward_nan_001 \
            falsify_cuda_nf4_train_loss_parity_001 \
            falsify_cuda_eval_adapter_sync_001 \
            falsify_cuda_eval_gpu_forward_001

      - name: CUDA loss-window falsifier suite
        if: steps.decide.outputs.proceed == 'true'
        run: |
          nice -n 19 cargo test -p aprender-train --features cuda --lib --release cuda_loss_window

      # PERF-053 / aprender#2767: repeated IDENTICAL greedy batches must return the SAME
      # continuation. Before the CU_STREAM_DEFAULT default this returned 11 distinct
      # continuations out of 40, most of them garbage, because this crate's host transfers
      # (cuMemcpyHtoD/DtoH) are legacy-stream and do not order against a non-blocking stream.
      #
      # The test self-skips when it finds no usable GPU model, so the model is resolved and
      # checked HERE. A skip would be a green that proves nothing, which is the exact failure
      # mode this whole nightly exists to remove.
      - name: PERF-053 - batched decode determinism falsifier (aprender#2767)
        if: steps.decide.outputs.proceed == 'true'
        env:
          # Keep m >= 4 off the cuBLAS decode route, whose divergence at m >= 4 is a separate
          # named defect (contracts/continuous-batching-v1.yaml, CB-006 round 9).
          CUBLAS_GEMM_THRESHOLD: "32"
        run: |
          set -euo pipefail
          gguf="${{ vars.APR_STREAM_FALSIFY_MODEL || '/home/noah/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf' }}"
          if [ -f "$gguf" ]; then
            model="$gguf"
          elif [ -f "$APR_PARITY_MODEL" ]; then
            model="$APR_PARITY_MODEL"
          else
            # ENV, not a code verdict -- but still exit 1. A probe that cannot run must not
            # be silent.
            echo "::error::PERF-053 UNMEASURABLE on ${{ matrix.name }} (provisioning, not a code defect): neither $gguf nor $APR_PARITY_MODEL is present"
            exit 1
          fi
          echo "PERF-053 model: $model"
          # Flag-level first: no GPU needed, but the module only exists under `cuda`, and
          # ci.yml EXCLUDES aprender-gpu from the workspace --lib run. Without this line the
          # three perf053_* unit tests never execute anywhere.
          nice -n 19 cargo test -p aprender-gpu --features cuda --lib --release perf053
          APR_FALSIFY_MODEL="$model" nice -n 19 cargo test -p aprender-serve --features cuda \
            --release --test falsify_stream_ordering_2767 -- --nocapture

      # Pillar-4 marquee: apr decode throughput against a resident ollama.
      #
      # THIS MOVED FROM ada-4090 TO gx10, and the reason it CAN move is that the
      # assertion is no longer a beat claim. The file's own header withdrew the
      # 1.371x claim on 2026-07-31; what is enforced now is a NO-COLLAPSE PARITY
      # FLOOR at ratio 0.90 — apr's median-of-7 against ollama's, measured on the
      # SAME box in the same run. That is a RATIO, so it does not carry sm_89's
      # ~300 tok/s baseline with it, and the failure it exists to catch (the CPU
      # fallback collapse, ratio ~0.065, a 14x violation) is silicon-independent.
      #
      # The earlier draft of this PR deleted the step instead and left the beat
      # file in place. `check_beats_gated.sh` was right to refuse that: "A beat
      # that no workflow executes is NEGATIVE EV... Wire it or delete it." Its
      # contract, its BEATS.md entry and its roadmap ticket all still point at it,
      # so wiring it is the honest half of that choice.
      #
      # ollama is DECLARED on gx10 (paiml/infra machines/gx10/forjar.yaml,
      # `beat-incumbent` tag): pinned binary, systemd unit whose completion_check
      # asks the daemon rather than systemd, and the q4_K_M model pulled to match
      # the GGUF apr is handed. It is not sovereign tooling and does not pretend
      # to be — it is the incumbent under measurement, and a comparative beat
      # cannot run without its competitor.
      - name: Pillar-4 - apr vs ollama decode throughput beat
        if: steps.decide.outputs.proceed == 'true'
        env:
          # The beat's built-in APR_BIN default points at a hand-built artifact
          # that goes stale SILENTLY - on 2026-07-28 it was a day behind #2323,
          # which changed the very Q4K kernel this beat measures. Always measure a
          # binary built from the commit under test.
          APR_BIN: ${{ github.workspace }}/target/release/apr
          APR_GGUF: ${{ vars.APR_DECODE_GGUF || '/home/noah/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_DECODE_MODEL || 'qwen2.5-coder:1.5b-instruct-q4_K_M' }}
        run: |
          set -euo pipefail
          # Fail loudly on a provisioning gap. Skipping here would restore the
          # exact silence this whole change exists to remove: the incumbent being
          # absent is a broken gate, not a passing one.
          "$HOME/.local/bin/ollama" --version >/dev/null 2>&1 || {
            echo "::error::ollama is not installed on gx10 - the Pillar-4 decode beat cannot measure its incumbent."
            echo "::error::It is declared in paiml/infra machines/gx10/forjar.yaml under the beat-incumbent tag."
            exit 1
          }
          if [ ! -f "$APR_GGUF" ]; then
            echo "::error::APR_GGUF not found on gx10: $APR_GGUF"
            exit 1
          fi
          "$HOME/.local/bin/ollama" list | grep -q "$OLLAMA_MODEL" || {
            echo "::error::ollama model not pulled: $OLLAMA_MODEL"
            exit 1
          }
          nice -n 19 cargo build --release --features cuda --bin apr
          # `-- --ignored` is load-bearing. Without it this target compiles, runs
          # 0 of its ignored tests, prints "ok. N passed; 0 failed; 1 ignored" and
          # exits 0 forever - which is precisely what #2319 shipped and what
          # check_beats_gated.sh rule 1b now makes a build failure.
          nice -n 19 cargo test -p aprender-serve --release \
            --test beat_ollama_decode_throughput_speed -- --ignored --nocapture
