name: CUDA Nightly (GPU QLoRA falsifiers)

# Enforces the v0.55-v0.57 QLoRA training-correctness falsifiers that require a
# real CUDA device and are therefore #[ignore]-gated (or self-skip without a
# GPU). See roadmap item CUDA-CI-NIGHTLY-001 and ROADMAP.md
# "Honest doctrine gap: GPU falsifiers are not yet CI-enforced".
#
# WHEN IT RUNS (all three properties are enforced below, not just documented):
#   1. NIGHTLY ONLY, overnight Madrid time. cron is UTC; 01:30 UTC =
#      03:30 Europe/Madrid in summer (CEST, UTC+2) and 02:30 in winter (CET,
#      UTC+1) — deep night year-round, and clear of the other nightlies
#      (coverage 03:00 UTC, nightly/binary 04:00 UTC, beat-speed 05:45 UTC).
#   2. YIELDS TO TRAINING. These falsifiers are LOW priority. Before doing any
#      work, each leg checks its GPU; if a training (or any) job is already
#      using it, the leg skips for the night (green no-op) so it never contends
#      with overnight training. A manual dispatch can force-override.
#   3. NEVER ON *REGULAR* PULL REQUESTS — opt-in only. There is no `push` trigger
#      and no unconditional `pull_request` trigger, so an ordinary PR never fires
#      this lane. The ONLY PR path is explicit targeting: a maintainer adds the
#      `cuda-check` label to a training-path PR, and the job gate below runs the
#      falsifiers against that PR's head exactly once (any other label is a
#      green no-op). This lets us build the green track record needed to later
#      promote the lane to a required gate on training-path PRs, without
#      auto-firing on every PR. It is NOT a required check — labeling is manual.
#
# CROSS-SILICON MATRIX (same suite on two self-hosted CUDA runners):
#   - ada-4090      : lambda-vector, RTX 4090, sm_89,  x86-64, CUDA 12.8
#                     (labels: self-hosted, Linux, X64, cuda)  -- direct WAN
#   - blackwell-gb10: gx10, GB10, sm_121, aarch64, CUDA 13.0
#                     (labels: self-hosted, Linux, ARM64, cuda) -- egress via a
#                     forward proxy on lambda (10.42.0.10:8888) over the wired
#                     10.42.0.0/24 link; the runner's .env carries HTTPS_PROXY.
# sm_89 is the stable reference; sm_121 is the higher-risk target (historical
# JIT bugs), which is exactly why both are gated.
#
# Toggle: gated behind vars.CUDA_RUNNER_READY so the lane can be disabled
# without deleting the workflow.

on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC = ~03:30 Europe/Madrid (overnight)
  workflow_dispatch:
    inputs:
      silicon:
        description: "Which silicon to run (all | ada | blackwell)"
        required: false
        default: "all"
      force:
        description: "Run even if the GPU is busy with training (bypass the yield)"
        required: false
        default: "false"
  # OPT-IN PR path: fires only when a label is added, and the job gate below
  # runs ONLY for the `cuda-check` label. A regular PR (no label / any other
  # label) is a green no-op — this never auto-fires on PRs. Yield-to-training
  # still applies, so a labeled run defers if the GPU is busy.
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: cuda-nightly
  cancel-in-progress: false

jobs:
  falsifiers:
    # Run on schedule/manual-dispatch as before; on a PR run ONLY when the
    # triggering label is exactly `cuda-check` (explicit opt-in targeting).
    if: >-
      ${{ vars.CUDA_RUNNER_READY == 'true' &&
      (github.event_name != 'pull_request' || github.event.label.name == 'cuda-check') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ada-4090
            arch: X64
            select: ada
          - name: blackwell-gb10
            arch: ARM64
            select: blackwell
    runs-on: [self-hosted, Linux, "${{ matrix.arch }}", cuda, "${{ matrix.select }}"]
    timeout-minutes: 90
    env:
      APR_PARITY_MODEL: ${{ vars.APR_PARITY_MODEL || '/home/noah/models/qwen2.5-coder-1.5b-instruct-q4k.apr' }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Decide whether to run (silicon filter + yield-to-training)
        id: decide
        run: |
          set -uo pipefail
          want="${{ github.event.inputs.silicon || 'all' }}"
          force="${{ github.event.inputs.force || 'false' }}"

          # (a) silicon filter — a dispatch may target a single leg.
          if [ "$want" != "all" ] && [ "$want" != "${{ matrix.select }}" ]; then
            echo "::notice::${{ matrix.name }}: skipped (dispatch requested '$want')"
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # (b) yield to training — falsifiers are LOW priority. If any compute
          #     job is already on this GPU (or >2 GiB resident), skip tonight so
          #     we never contend with overnight training. `force=true` on a
          #     manual dispatch overrides.
          # `procs` (compute contexts) is the primary, portable signal — it
          # works on both sm_89 and GB10. `memory.used` is a secondary signal
          # and is [N/A] on GB10's unified memory. GitHub runs `run:` as
          # `bash -e -o pipefail`, so use `tr -cd` (never non-zero) to strip to
          # digits — a `grep -oE` that finds no digit exits 1 and, under -e,
          # would kill this step on GB10 (which is exactly what happened first).
          used=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits 2>/dev/null | head -1 | tr -cd '0-9')
          used=${used:-0}
          procs=$(nvidia-smi --query-compute-apps=pid --format=csv,noheader 2>/dev/null | grep -c . || true)
          procs=${procs:-0}
          echo "${{ matrix.name }}: GPU memory.used=${used} MiB, existing compute procs=${procs}"
          if [ "$force" = "true" ]; then
            echo "::notice::${{ matrix.name }}: force=true — running regardless of GPU load"
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${used:-0}" -gt 2000 ] || [ "${procs:-0}" -gt 0 ]; then
            echo "::notice::${{ matrix.name }}: GPU busy (${used:-?} MiB, ${procs:-?} procs) — yielding to training, skipping falsifiers tonight"
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.decide.outputs.proceed == 'true'

      - name: Preflight — CUDA device + parity model present
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          echo "runner: ${{ matrix.name }} ($(uname -m))"
          nvidia-smi -L || { echo "::error::no CUDA device visible on ${{ matrix.name }}"; exit 1; }
          nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
          if [ ! -f "$APR_PARITY_MODEL" ]; then
            echo "::error::APR_PARITY_MODEL not found on ${{ matrix.name }}: $APR_PARITY_MODEL"
            exit 1
          fi
          echo "parity model: $APR_PARITY_MODEL ($(du -h "$APR_PARITY_MODEL" | cut -f1))"

      - name: GPU QLoRA training-correctness falsifiers (--features cuda)
        if: steps.decide.outputs.proceed == 'true'
        # `nice` so the build never starves any CPU-side work of a job that
        # started after our yield check. --include-ignored runs BOTH the
        # #[ignore]-gated eval falsifiers and the non-ignored deadlock/NaN/
        # parity ones (which self-skip without a GPU).
        run: |
          nice -n 19 cargo test -p aprender-train --features cuda --lib --release -- \
            --include-ignored --nocapture --test-threads 1 \
            falsify_cuda_fused_rmsnorm_distinct_residual_out_no_deadlock \
            falsify_cuda_nf4_forward_nan_001 \
            falsify_cuda_nf4_train_loss_parity_001 \
            falsify_cuda_eval_adapter_sync_001 \
            falsify_cuda_eval_gpu_forward_001

      - name: CUDA loss-window falsifier suite
        if: steps.decide.outputs.proceed == 'true'
        run: |
          nice -n 19 cargo test -p aprender-train --features cuda --lib --release cuda_loss_window

      # Pillar-4 marquee: apr decode throughput vs a resident ollama.
      #
      # This beat needs a GPU *and* a resident ollama daemon *and* the Q4_K_M
      # GGUF, which is why it is `#[ignore]`d. It was previously "wired" into the
      # per-PR chained gate in ci.yml WITHOUT `--ignored`, where it executed zero
      # tests and passed unconditionally (see scripts/check_beats_gated.sh rule
      # 1b, which now makes that a build failure). Here it actually runs.
      #
      # ada-4090 only: the 1.10x ceiling and the ~300 tok/s ollama baseline were
      # pinned on sm_89. GB10 has different decode characteristics and defaults
      # to serial prefill, so running it there would compare against a baseline
      # that was never measured on that silicon.
      - name: Pillar-4 - apr vs ollama decode throughput beat (ada-4090 only)
        if: steps.decide.outputs.proceed == 'true' && matrix.name == 'ada-4090'
        env:
          # The beat's built-in APR_BIN default points at a hand-built artifact
          # (/mnt/nvme-raid0/targets/...) that goes stale SILENTLY - on
          # 2026-07-28 it was a day behind #2323, which changed the very Q4K
          # kernel this beat measures. Always measure a binary built from the
          # commit under test.
          APR_BIN: ${{ github.workspace }}/target/release/apr
          APR_GGUF: ${{ vars.APR_DECODE_GGUF || '/home/noah/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_DECODE_MODEL || 'qwen2.5-coder:1.5b-instruct-q4_K_M' }}
        run: |
          set -euo pipefail
          # Fail loudly on a provisioning gap. Skipping here would restore the
          # exact silence this whole change exists to remove.
          command -v ollama >/dev/null 2>&1 || {
            echo "::error::ollama not installed on ada-4090 - the Pillar-4 decode beat cannot measure its incumbent"
            exit 1
          }
          if [ ! -f "$APR_GGUF" ]; then
            echo "::error::APR_GGUF not found on ada-4090: $APR_GGUF"
            exit 1
          fi
          ollama list | grep -q "$OLLAMA_MODEL" || {
            echo "::error::ollama model not pulled: $OLLAMA_MODEL"
            exit 1
          }
          nice -n 19 cargo build --release --features cuda --bin apr
          nice -n 19 cargo test -p aprender-serve --release \
            --test beat_ollama_decode_throughput_speed -- --ignored --nocapture

  # ---------------------------------------------------------------------------
  # Absence of a verdict is the DOMINANT outcome of this lane, and it was
  # entirely silent. Over the 40 runs to 2026-08-27: 15 success, 3 failure,
  # 22 CANCELLED. Every cancelled job had run for exactly `1 day, 0:00:00` --
  # GitHub's 24h queue timeout for a job that no runner ever claimed. The
  # blackwell-gb10 leg (sm_121, the higher-risk silicon this matrix exists to
  # cover) produced no verdict on 11 of the last 22 nights and nothing fired,
  # because `cancelled` is not `failure` and this workflow -- alone among the
  # repo's nightlies -- opened no issue and pinged nothing. coverage-nightly.yml
  # and qwen-story-daily.yml both file a tracking issue; this follows that
  # convention.
  #
  # Three ways this lane can be green while proving nothing, all classified below:
  #   1. a leg is CANCELLED (no runner ever claimed it)  -> NO VERDICT
  #   2. a leg yields to training: `proceed=false` skips EVERY step, so the job
  #      reports success having run no falsifier at all   -> NO VERDICT
  #   3. the whole matrix is skipped because the repo variable CUDA_RUNNER_READY
  #      is not 'true' -- a single silent off switch      -> NO VERDICT
  #
  # This job MUST NOT run on the cuda pool. A verdict job that queues behind the
  # same unavailable runner is exactly as silent as no verdict job at all.
  verdict:
    needs: [falsifiers]
    if: always()
    runs-on: [self-hosted, X64, Linux, clean-room]
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
      FALSIFIERS_RESULT: ${{ needs.falsifiers.result }}
    steps:
      - name: Classify each leg's verdict
        id: legs
        shell: bash
        run: |
          set -uo pipefail
          echo "aggregate result of the falsifiers matrix: ${FALSIFIERS_RESULT}"

          # The opt-in PR path is inert for any label other than `cuda-check`.
          # That is a designed no-op, not a missing verdict.
          if [ "${FALSIFIERS_RESULT}" = "skipped" ] && [ "${EVENT_NAME}" != "schedule" ]; then
            echo "not applicable for this event -- the opt-in label path did not select this run"
            printf 'ok=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A SCHEDULED night that skipped means the lane was disarmed by the
          # repo variable. That off switch should be as loud as a failure.
          if [ "${FALSIFIERS_RESULT}" = "skipped" ]; then
            {
              echo "## CUDA nightly produced NO verdict"
              echo
              echo "The falsifiers matrix was skipped on a **scheduled** run, which means the"
              echo "repository variable \`CUDA_RUNNER_READY\` is not \`true\`. The lane is disarmed:"
              echo "no CUDA falsifier ran on either silicon tonight."
              echo
              echo "- Run: ${RUN_URL}"
            } > /tmp/cuda-verdict.md
            printf 'ok=false\n' >> "${GITHUB_OUTPUT}"
            printf 'headline=lane DISARMED (CUDA_RUNNER_READY is not true)\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # gh's embedded jq -- do not depend on a system jq on the runner.
          summary=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '
            .jobs[] | select(.name | startswith("falsifiers")) |
            [ .name,
              (.conclusion // "null"),
              ((.steps // [])
                 | map(select(.name | startswith("GPU QLoRA training-correctness falsifiers")))
                 | (.[0].conclusion // "absent"))
            ] | @tsv' 2>/tmp/gh.err)
          rc=$?
          if [ "${rc}" -ne 0 ]; then
            echo "::error::jobs API query failed (rc=${rc}); cannot establish whether a verdict exists"
            cat /tmp/gh.err || true
            {
              echo "## CUDA nightly verdict UNKNOWN"
              echo
              echo "The jobs API query failed, so this run cannot prove a verdict was produced."
              echo
              echo "- Run: ${RUN_URL}"
            } > /tmp/cuda-verdict.md
            printf 'ok=false\n' >> "${GITHUB_OUTPUT}"
            printf 'headline=jobs API query failed - verdict unknown\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          legs=0
          verdicts=0
          : > /tmp/leg-table.md
          # `<<<` not a pipe: a pipeline whose reader exits early hands the
          # writer SIGPIPE and, under pipefail, invents a failure (#2335 class).
          while IFS=$'\t' read -r name concl fals; do
            [ -z "${name}" ] && continue
            legs=$((legs + 1))
            case "${concl}" in
              success)
                if [ "${fals}" = "success" ]; then
                  state="VERDICT pass"
                  verdicts=$((verdicts + 1))
                else
                  state="NO VERDICT - job green but the falsifier step was '${fals}' (yielded to training)"
                fi
                ;;
              failure)   state="VERDICT FAIL - a falsifier actually failed" ;;
              cancelled) state="NO VERDICT - never claimed a runner (24h queue timeout) or was cancelled" ;;
              skipped)   state="NO VERDICT - leg skipped" ;;
              *)         state="NO VERDICT - conclusion '${concl}'" ;;
            esac
            echo "| \`${name}\` | ${concl} | ${fals} | ${state} |" >> /tmp/leg-table.md
            echo "leg: ${name} conclusion=${concl} falsifier_step=${fals} -> ${state}"
          done <<< "${summary}"

          echo "legs observed: ${legs}, legs that produced a verdict: ${verdicts}"

          # The matrix declares two legs. Fewer means one never materialised.
          if [ "${legs}" -eq 2 ] && [ "${verdicts}" -eq 2 ]; then
            printf 'ok=true\n' >> "${GITHUB_OUTPUT}"
            echo "both silicon legs produced a passing verdict"
            exit 0
          fi

          {
            echo "## CUDA nightly did not produce a full verdict"
            echo
            echo "Legs that produced a usable verdict: **${verdicts} of ${legs}** (2 expected)."
            echo
            echo "| leg | job conclusion | falsifier step | classification |"
            echo "| --- | --- | --- | --- |"
            cat /tmp/leg-table.md
            echo
            echo "A \`cancelled\` leg is not a test failure: it is GitHub's 24h queue timeout"
            echo "for a job that no runner ever claimed, i.e. the silicon was offline all night."
            echo "A leg that is green with a skipped falsifier step yielded to training and"
            echo "verified nothing."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Aggregate matrix result: \`${FALSIFIERS_RESULT}\`"
          } > /tmp/cuda-verdict.md
          printf 'ok=false\n' >> "${GITHUB_OUTPUT}"
          printf 'headline=%s of %s silicon legs produced a verdict\n' "${verdicts}" "${legs}" >> "${GITHUB_OUTPUT}"

      # continue-on-error, like qwen-story-daily: a notifier that can fail must
      # never be able to mask or fake the lane's own verdict.
      - name: File / update tracking issue
        continue-on-error: true
        if: steps.legs.outputs.ok != 'true'
        shell: bash
        env:
          HEADLINE: ${{ steps.legs.outputs.headline }}
        run: |
          set -uo pipefail
          # Create the labels idempotently rather than assuming a human did:
          # qwen-story-daily's alerting path was dead from the day it was written
          # because `gh issue create --label` referenced labels that did not exist.
          for L in cuda-nightly regression; do
            gh label create "${L}" --description "Filed by cuda-nightly" --force >/dev/null 2>&1 || true
          done
          EXISTING=$(gh issue list --label cuda-nightly --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "commenting on existing issue #${EXISTING}"
            gh issue comment "${EXISTING}" --body-file /tmp/cuda-verdict.md
          else
            echo "filing new tracking issue"
            gh issue create --title "cuda-nightly: ${HEADLINE}" \
              --label cuda-nightly,regression \
              --body-file /tmp/cuda-verdict.md
          fi

      # `always() &&` is load-bearing. Without a status function GitHub prepends
      # an implicit success(), so the notifier step above failing would SKIP this
      # one and the lane would go green on a missing verdict -- the exact failure
      # qwen-story-daily hit on 2026-07-31.
      - name: Fail when the lane produced no full verdict
        if: always() && steps.legs.outputs.ok != 'true'
        shell: bash
        env:
          HEADLINE: ${{ steps.legs.outputs.headline }}
        run: |
          echo "::error::CUDA nightly produced no full verdict: ${HEADLINE}"
          exit 1
