# LAB (nightly only, never PR/merge-queue/release; C324 rule 5): Status PROPOSED specs carry a date.
# Epic aprender#6809. A red opens/updates one ticket and stays silent; promotion needs quorum + 3 green nights + one gate retired.
# RUNNER: the self-hosted sovereign-ci pool the other nightlies use; never a hosted runner
# (check_no_hosted_runners.sh). The guard runs in its own session (check_guard_steps_isolated.sh).
name: spec-proposed-dated-nightly
on:
  schedule:
    - cron: '40 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, clean-room]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: setsid --wait bash scripts/check_spec_proposed_dated_test.sh
