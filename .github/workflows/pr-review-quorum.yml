# pr-review-quorum.yml — receipt_presence over the pull requests that MERGED to
# main, judged once a night by main's own Arm 4 (#4602). A LAB check: it runs on
# no pull request and in no merge queue, and a red night updates one ticket.
#
# WHY IT LEFT THE PR AND THE MERGE QUEUE (#4602, #4688)
# ----------------------------------------------------
# `present` is not a required context: main requires `gate` and `workspace-test`
# only, and no ruleset names it, so its verdict never stopped a merge. MEASURED
# 2026-10-06..09: 8 of the last 30 merge-queue runs concluded failure and all 8
# PRs merged (5 had no receipt, 2 had a receipt bound to another patch-id, 1 was
# rejected), and #4944 merged with `present` red on the PR as well. A check that
# cannot block a merge does not run on the PR or merge-queue path; a red there
# that nothing has to read is a third state. So it runs here, over what merged.
# It becomes a merge gate again only with an explicit yes, three green nights on
# main and one gate retired. Then the PR trigger and `merge_group` come back with
# it, it becomes a required context in the same change, and
# scripts/check_receipt_gate_base_owned.sh flips with it.
#
# WHY A SEPARATE WORKFLOW (PRQ-013; PP-066 DAG row C0-5, #2982)
# ------------------------------------------------------------
# Until 2026-09-05 the judgement lived in ci.yml under `if: github.event_name ==
# 'pull_request'`, and GitHub reads a `pull_request` workflow's definition from
# the PR HEAD: a PR could edit the check that judged it (PP-066 §1 F-28 class;
# measured in docs/audits/pp-066-plan-quorum.md). `schedule` and
# `workflow_dispatch` run the DEFAULT branch's definition, so every script here
# is main's copy, judging main's tree.
#
# WHAT A NIGHT DOES
#   scripts/review_receipts_nightly.sh walks main's first-parent commits from the
#   last 26 hours. Each is a queue squash ending in "(#N)", and Arm 4
#   (scripts/check_pr_review_arm4.sh, unchanged) judges PR N with the squash as a
#   QUEUE subject, as the queue run did. A red or unmeasured night rewrites the
#   night section at the end of the one LAB ticket (LAB_TICKET_TITLE; opened if
#   none is open) and stays silent: no comment, no ping. Seven nights in a row
#   that are not green disable this workflow until its owner enables it again.
#
# SECURITY: the workflow token is contents: read; the one job adds checks: read
# and pull-requests: read (Arm 4 reads each merged PR's head and its
# pr-review-signature check run), issues: write (the one ticket) and
# actions: write (the seven-night stop disables this workflow, nothing else).
# No PR head is checked out or fetched.
#
# GUARDS THAT READ THIS FILE: scripts/check_receipt_gate_base_owned.sh (B1..B4:
# exactly one workflow runs the receipt judgement, it is triggered by `schedule`
# and by none of pull_request, pull_request_target and merge_group, its
# job-level `if:` is true on schedule and workflow_dispatch only, and ci.yml's
# `gate` needs no receipt job). Putting this job back on a PR trigger turns that
# guard RED.
name: pr-review-quorum

on:
  schedule:
    - cron: '41 2 * * *'   # 02:41 UTC, after the day's merges
  workflow_dispatch:
    inputs:
      since:
        description: 'git date where the window starts'
        required: false
        default: '26 hours ago'

permissions:
  contents: read

jobs:
  present:
    # ARCH-NEUTRAL: intel, yoga OR gx10, the same move ci.yml's gate,
    # guard-tree, pr-review-shadow and pr-review-sign already made (#3100 /
    # PMAT-3138). The X64 pin here was not load-bearing and cost real capacity.
    #
    # MEASURED 2026-09-13T13:47Z: 19 active runs, 21 of 26 runners busy, and
    # ELEVEN queued pr-review-quorum runs — all of them this job, all waiting
    # on [self-hosted, X64, Linux, clean-room], the same pool workspace-test
    # and guard-cargo need, some queued 23 minutes. gx10's four ARM64
    # clean-room runners could not take a single one and sat at ~19% occupancy.
    #
    # NOTHING IN THIS JOB IS x86. scripts/install_pr_review_tools.sh reads
    # `uname -m` and accepts x86_64 AND aarch64 (it pulls the matching minisign
    # from the same pinned tarball, and dies loudly on anything else), and
    # scripts/check_pr_review_arm4.sh contains no arch reference at all. The
    # pin was inherited, not derived.
    #
    # OWN LIGHT LANE (#4729, 2026-10-04): MEASURED 09:09Z-11:35Z, this
    # seconds-long job sat QUEUED for 2.5 h behind 24 CI + 25 quorum runs with
    # all 19 clean-room runners busy, and it was the ONLY check holding six
    # armed PRs. `review-light` is a dedicated runner on the same intel
    # clean-room box, unit and isolation, in the aprender-reserved group. It
    # deliberately does NOT carry the `clean-room` label: build jobs on main
    # select bare [self-hosted, Linux, clean-room], so any runner with that
    # label is back in the build FIFO. The job's steps are unchanged.
    runs-on: [self-hosted, review-light]
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read          # Arm 4 B1: the pr-review-signature check run on each PR head
      pull-requests: read   # Arm 4: the PR head behind each squash, from the pulls API
      issues: write         # the one LAB ticket
      actions: write        # the seven-night stop disables this workflow
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      LAB_TICKET_TITLE: 'LAB: pr-review-quorum present - nightly receipt check of merged PRs'
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          # Arm 4 diffs each squash against its parent and resolves ancestry with
          # `git merge-base`, which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Install the tools Arm 4 refuses to run without
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/install_pr_review_tools.sh "$RUNNER_TEMP/pr-review-tools/bin"
          echo "$RUNNER_TEMP/pr-review-tools/bin" >> "$GITHUB_PATH"

      - name: "Arm 4 case table: 39 rows, both polarities of the cutoff, the patch-id binding and the check-run signature"
        shell: bash
        run: setsid --wait bash scripts/check_pr_review_arm4.sh --self-test

      - name: "Nightly case table: 15 rows, the window walk and the seven-night stop"
        shell: bash
        run: bash scripts/review_receipts_nightly.sh --self-test

      - name: Judge every pull request that merged in the window
        shell: bash
        env:
          SINCE: ${{ inputs.since || '26 hours ago' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/review_receipts_nightly.sh --since "$SINCE" > "$RUNNER_TEMP/receipts.md" || rc=$?
          cat "$RUNNER_TEMP/receipts.md"
          cat "$RUNNER_TEMP/receipts.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: A red or unmeasured night rewrites the night section of the one LAB ticket
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- pr-review-quorum.yml rewrites everything below this line each red night -->'
          night="$RUNNER_TEMP/night.md"
          {
            printf '%s\n\n### Night of %s: not green\n\nRun: %s\n\n' "$marker" "$(date -u +%Y-%m-%d)" "$RUN_URL"
            if [ -s "$RUNNER_TEMP/receipts.md" ]; then cat "$RUNNER_TEMP/receipts.md"
            else echo 'No table: the run failed before the judge wrote one (not measured).'; fi
          } > "$night"
          num=$(T="$LAB_TICKET_TITLE" gh issue list --state open --search "\"$LAB_TICKET_TITLE\" in:title" \
                  --json number,title --jq '[.[] | select(.title == env.T)][0].number // empty')
          if [ -n "$num" ]; then
            gh issue view "$num" --json body --jq .body > "$RUNNER_TEMP/body.md"
            awk -v m="$marker" '$0 == m { exit } { print }' "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/new.md"
            cat "$night" >> "$RUNNER_TEMP/new.md"
            gh issue edit "$num" --body-file "$RUNNER_TEMP/new.md"
          else
            gh issue create --title "$LAB_TICKET_TITLE" --label owner:aprender-a7 --body-file "$night"
          fi

      - name: Seven nights in a row not green stop this workflow until its owner enables it
        if: failure() && github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # This night is not green (the step runs on failure only); the six before
          # it are the newest completed scheduled runs, newest first.
          mapfile -t prev < <(gh run list --workflow pr-review-quorum.yml --event schedule \
                                --status completed --limit 6 --json conclusion --jq '.[].conclusion')
          if bash scripts/review_receipts_nightly.sh --seven-nights failure "${prev[@]}"; then
            gh workflow disable pr-review-quorum.yml
            echo "::warning::seven nights not green in a row: pr-review-quorum is disabled until its owner runs: gh workflow enable pr-review-quorum.yml"
          fi
