# pr-review-quorum.yml — the PR's own review receipt is judged from the BASE,
# never from the PR head (PRQ-013; PP-066 DAG row C0-5, #2982).
#
# WHY A SEPARATE WORKFLOW
# -----------------------
# Until 2026-09-05 the job that judged a pull request's own review receipt
# (`pr-review-present`, Arm 4) lived in ci.yml under
# `if: github.event_name == 'pull_request'`, and the required `gate` job waited
# on it. GitHub reads a `pull_request` workflow's definition from the PR HEAD,
# so the check that decided whether a PR's receipt was acceptable was defined by
# the PR under review: a PR could edit the check. That is theater with a green
# badge (PP-066 §1 F-28 class; measured in docs/audits/pp-066-plan-quorum.md).
#
# `pull_request_target` runs with the BASE branch's workflow definition and
# checks out the BASE by default. The PR head is fetched as a ref and ONLY its
# receipt directory (evidence/pr-review/<pr>/) is materialised with `git
# archive` — data files, never executed. Every script that runs here is the
# base's copy.
#
# NOT ON THE MERGE QUEUE (#4688). `present` is not a required context: main
# requires `gate` and `workspace-test` only, so its verdict cannot stop a merge.
# It used to run on `merge_group` too. MEASURED 2026-10-06..09: 8 of the last
# 30 queue runs concluded failure and all 8 PRs merged (5 had no receipt, 2
# had a receipt bound to another patch-id, 1 was rejected). A check that cannot
# block a merge does not run on the merge-queue path. If `present` becomes a
# required context, `merge_group` comes back with it, as a listed merge entry
# in contracts/release-ready-v1.yaml, or the queue deadlocks.
#
# SECURITY (pull_request_target has a write-capable token by default):
#   - permissions are pinned to contents: read; nothing here writes. The one
#     job adds checks: read, job-scoped (B1, #4512): the receipt signature is a
#     check run on the head sha, never a commit, and Arm 4 reads it back.
#   - no step checks out or executes head code; the head's tree is read with
#     `git archive <sha> evidence/pr-review/<pr>` only.
#   - the fork guard on the signer (ci.yml pr-review-sign) is unchanged.
#
# GUARDS THAT READ THIS FILE: scripts/check_receipt_gate_base_owned.sh (B1..B4:
# exactly one workflow invokes check_pr_review_arm4.sh without --self-test, it
# is triggered by pull_request_target and neither pull_request nor
# merge_group, the invoking job's job-level `if:` is true on that event only, and
# ci.yml's `gate` needs no head-defined receipt job). Moving this job back to
# `on: pull_request` turns that guard RED (the registered mutation).
name: pr-review-quorum

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  present:
    # ARCH-NEUTRAL: intel, yoga OR gx10, the same move ci.yml's gate,
    # guard-tree, pr-review-shadow and pr-review-sign already made (#3100 /
    # PMAT-3138). The X64 pin here was not load-bearing and cost real capacity.
    #
    # MEASURED 2026-09-13T13:47Z: 19 active runs, 21 of 26 runners busy, and
    # ELEVEN queued pr-review-quorum runs — all of them this job, all waiting
    # on [self-hosted, X64, Linux, clean-room], the same pool workspace-test
    # and guard-cargo need, some queued 23 minutes. gx10's four ARM64
    # clean-room runners could not take a single one and sat at ~19% occupancy.
    #
    # NOTHING IN THIS JOB IS x86. scripts/install_pr_review_tools.sh reads
    # `uname -m` and accepts x86_64 AND aarch64 (it pulls the matching minisign
    # from the same pinned tarball, and dies loudly on anything else), and
    # scripts/check_pr_review_arm4.sh contains no arch reference at all. The
    # pin was inherited, not derived.
    #
    # OWN LIGHT LANE (#4729, 2026-10-04): MEASURED 09:09Z-11:35Z, this
    # seconds-long job sat QUEUED for 2.5 h behind 24 CI + 25 quorum runs with
    # all 19 clean-room runners busy, and it was the ONLY check holding six
    # armed PRs. `review-light` is a dedicated runner on the same intel
    # clean-room box, unit and isolation, in the aprender-reserved group. It
    # deliberately does NOT carry the `clean-room` label: build jobs on main
    # select bare [self-hosted, Linux, clean-room], so any runner with that
    # label is back in the build FIFO. The job's steps are unchanged.
    runs-on: [self-hosted, review-light]
    timeout-minutes: 20
    # B1 (#4512): read the pr-review-signature check run. Job-scoped, read-only.
    # pull-requests: read went with merge_group: only the queue payload lacked
    # the PR head, so only the queue read it from the pulls API.
    permissions:
      contents: read
      checks: read
    if: github.event_name == 'pull_request_target'
    env:
      # pull_request_target carries the PR. The `resolve` step turns it into
      # step OUTPUTS (`steps.resolve.outputs.pr` / `.head`) that the later
      # steps bind as their own `env:` — every name a `run:` block reads is
      # defined on the step or the job that reads it
      # (scripts/check_workflow_env_defined.sh fails closed on anything else; a
      # GITHUB_ENV write is invisible to it by design).
      EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the BASE (pull_request_target)
        uses: actions/checkout@v7
        with:
          # Arm 4 resolves ancestry with `git merge-base`, which a shallow
          # clone cannot answer (the script exits 2, never 1, on that).
          fetch-depth: 0

      - name: Resolve the PR number and head sha from the event
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request_target)
              pr="$EVENT_PR_NUMBER"; head="$EVENT_PR_HEAD_SHA" ;;
            *) echo "unsupported event: $GITHUB_EVENT_NAME" >&2; exit 2 ;;
          esac
          case "$pr" in ''|*[!0-9]*) echo "could not resolve a PR number from the event" >&2; exit 2 ;; esac
          case "$head" in ''|*[!0-9a-f]*) echo "could not resolve a head sha from the event" >&2; exit 2 ;; esac
          printf 'pr=%s\nhead=%s\n' "$pr" "$head" >> "$GITHUB_OUTPUT"
          echo "PR #$pr head $head ($GITHUB_EVENT_NAME)"

      - name: Fetch the PR head and materialise ONLY its receipt directory (data, never code)
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          PR_HEAD_SHA: ${{ steps.resolve.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/${PR_NUMBER}"
          git rev-parse --verify --quiet "${PR_HEAD_SHA}^{commit}" >/dev/null \
            || { echo "head $PR_HEAD_SHA is not reachable after fetching refs/pull/$PR_NUMBER/head" >&2; exit 2; }
          if git cat-file -e "${PR_HEAD_SHA}:evidence/pr-review/${PR_NUMBER}" 2>/dev/null; then
            git archive "$PR_HEAD_SHA" "evidence/pr-review/${PR_NUMBER}" | tar -x
            echo "materialised evidence/pr-review/${PR_NUMBER} from $PR_HEAD_SHA:"
            find "evidence/pr-review/${PR_NUMBER}" -type f | sort
          else
            echo "the head carries no evidence/pr-review/${PR_NUMBER} — Arm 4 decides what that means"
          fi

      - name: Install the tools Arm 4 refuses to run without
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/install_pr_review_tools.sh "$RUNNER_TEMP/pr-review-tools/bin"
          echo "$RUNNER_TEMP/pr-review-tools/bin" >> "$GITHUB_PATH"

      - name: "Arm 4 case table: 39 rows, both polarities of the cutoff, the patch-id binding and the check-run signature"
        shell: bash
        run: setsid --wait bash scripts/check_pr_review_arm4.sh --self-test

      - name: This PR's own receipt, judged by the base's Arm 4 under the base's public key
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          PR_HEAD_SHA: ${{ steps.resolve.outputs.head }}
          # B1: an unsigned-on-disk receipt is judged by the pr-review-signature
          # check run on the PR head; the check-runs read uses this token (checks: read).
          # The signer posts that check run on the PR HEAD, and the event names it.
          ARM4_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: setsid --wait bash scripts/check_pr_review_arm4.sh
