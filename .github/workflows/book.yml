# #3073 (operator rule 2026-09-10: no GitHub-hosted runners): every job runs on the
# clean-room pool; X64 because the mdBook/tool installs below fetch x86_64 builds.
name: mdBook CI

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
      # FALSIFY-BOOK-CLI-PARITY-001 asserts every `apr` subcommand has a chapter.
      # Filtering on book/** alone meant it only ran when the BOOK changed, never
      # when the CLI gained a command — so `apr beat-run` shipped in #1995 with no
      # chapter and the gate stayed green for months, until an unrelated batch that
      # happened to touch book/ woke it. A parity gate must run when EITHER side
      # moves; watching only one of them is how it comes to certify nothing.
      - "crates/apr-cli/src/commands_enum.rs"
      # ...AND THE SAME HOLE EXISTED ONE GATE DOWN, for the LIB side.
      # FALSIFY-BOOK-LIB-PARITY-001 asserts every aprender-core public module has
      # a chapter, and nothing here watched aprender-core. #2618 added
      # `aprender::setfit` with no chapter and this workflow never ran, exactly
      # as `apr beat-run` did in #1995 — it surfaced only when an unrelated batch
      # (#2705) happened to touch book/ and woke the gate.
      #
      # The comment above already stated the rule: "A parity gate must run when
      # EITHER side moves; watching only one of them is how it comes to certify
      # nothing." It was applied to the CLI gate and not to its neighbour. Both
      # sides are now watched.
      - "crates/aprender-core/src/lib.rs"
      - "crates/apr-cli/src/extended_commands.rs"
      - "crates/apr-cli/src/tool_commands.rs"
  pull_request:
    branches: [main]
    paths:
      - "book/**"
      - ".github/workflows/book.yml"
      - "crates/apr-cli/src/commands_enum.rs"
      # ...AND THE SAME HOLE EXISTED ONE GATE DOWN, for the LIB side.
      # FALSIFY-BOOK-LIB-PARITY-001 asserts every aprender-core public module has
      # a chapter, and nothing here watched aprender-core. #2618 added
      # `aprender::setfit` with no chapter and this workflow never ran, exactly
      # as `apr beat-run` did in #1995 — it surfaced only when an unrelated batch
      # (#2705) happened to touch book/ and woke the gate.
      #
      # The comment above already stated the rule: "A parity gate must run when
      # EITHER side moves; watching only one of them is how it comes to certify
      # nothing." It was applied to the CLI gate and not to its neighbour. Both
      # sides are now watched.
      - "crates/aprender-core/src/lib.rs"
      - "crates/apr-cli/src/extended_commands.rs"
      - "crates/apr-cli/src/tool_commands.rs"
  # #3676 rule 3 (scripts/check_workflow_path_filters.sh): a path filter is a
  # claim that nothing outside these paths can break this gate; the nightly run
  # re-checks the claim every day. Set ~5h early for the dispatch delay (#3292).
  schedule:
    - cron: '30 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Book
    runs-on: [self-hosted, Linux, X64, clean-room]
    steps:
      - uses: actions/checkout@v7

      # Self-hosted (#3073): tools go into this run's private $RUNNER_TEMP, never a $HOME path that every
      # runner on the box execs from (the aprender#2353 race; check_cargo_install_private_root.sh enforces
      # the cargo half). The private cargo root is added to PATH last, so it resolves first.
      - name: Install mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/cargo-tools/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/cargo-tools/bin" >> "$GITHUB_PATH"

      # The cargo steps below report their failures through cargo_step.sh. Run
      # that instrument's own case table FIRST: a classifier nothing proves is
      # the same theater as no classifier. This step is also the workflow caller
      # check_guards_are_wired.sh requires of any scripts/*.sh shipping a
      # --self-test.
      - name: cargo_step.sh falsifier (ENV-vs-CODE instrument)
        run: bash scripts/cargo_step.sh --self-test

      - name: Build book
        run: mdbook build book

      # BOOK-CLOSEOUT-001 § Phase 1: shell-script quality (per CLAUDE.md, use bashrs not shellcheck)
      - name: bashrs lint book check scripts (FALSIFY-BOOK-SHELL-QUALITY-001)
        run: |
          # NEVER install. ci.yml:"pmat/bashrs must match the pinned fleet versions
          # (never install)" has been the policy since BSE-10a/PMAT-1066; this job
          # kept compiling bashrs from source anyway, which is BOTH a cold build per
          # run (it died twice on 2026-09-13 losing a dep-info file under /tmp) and a
          # version skew: the fleet pin is 7.0.1 and `cargo install` resolved 7.4.0,
          # so the book's shell gate and the release's shell gate lint with different
          # linters. check_bashrs_gate.sh's own header calls that disagreement "the
          # defect this fixes".
          bash scripts/check_tool_versions.sh
          # Lint only check scripts; gen-*-stubs.sh contain markdown heredocs with em-dashes
          # that bashrs flags as SC1100, but those are intentional in the generated book output.
          #
          # `bashrs … | tee` then judging the FILE hid bashrs itself dying. The
          # default GH shell is `bash -e {0}` with NO pipefail, so tee's 0 was the
          # pipeline's status; a linter that crashed left a log carrying no
          # "Summary:" line, and the negated grep below read that absence as a PASS.
          # Redirect, read the status directly, and only then judge the contents.
          set +e
          bashrs lint scripts/check_book_*.sh > /tmp/bashrs.log 2>&1
          rc=$?
          set -e
          cat /tmp/bashrs.log
          # bashrs exits 1 for findings and >1 for tool failure (#2704).
          if [ "$rc" -gt 1 ]; then
            echo "::error title=ENV::bashrs exited $rc -- the linter did not run to a verdict"
            exit 1
          fi
          # Vacuity: no summary at all means nothing was measured. Without this row
          # the assertion below passes on an empty log.
          grep -qE "Summary:" /tmp/bashrs.log || { echo "::error::bashrs printed no Summary line"; exit 1; }
          ! grep -qE "Summary: [1-9][0-9]* error" /tmp/bashrs.log

      # BOOK-CLOSEOUT-001 § Phase 1: zero broken file links
      - name: Linkcheck gate (FALSIFY-BOOK-LINKCHECK-001)
        run: bash scripts/check_book_linkcheck.sh

      # BOOK-CLOSEOUT-001 § Phase 4: every CLI subcommand has a chapter
      - name: CLI parity gate (FALSIFY-BOOK-CLI-PARITY-001)
        run: |
          # apr CLI binary needed for parity check.
          #
          # The step above stopped installing bashrs because "it died twice on
          # 2026-09-13 losing a dep-info file under /tmp". THIS cargo build was
          # left, and died the same way on 2026-09-14, run 34799968553 — three
          # crates' dep-info files vanishing over 35 s. It reported a bare exit
          # 101, indistinguishable from a book that does not build; the same
          # branch had been green on the same job 100 minutes earlier. Removing
          # the install here is not available (apr-cli IS the tree under test),
          # so name the host fault instead of mis-attributing it to the code.
          bash scripts/cargo_step.sh 'install apr-cli' -- \
            cargo install --path crates/apr-cli --locked --quiet --root "$RUNNER_TEMP/cargo-tools"
          bash scripts/check_book_cli_parity.sh

      # BOOK-CLOSEOUT-001 § Phase 4: every CLI stub has a runnable example
      - name: CLI example-block gate (FALSIFY-BOOK-EXAMPLE-001)
        run: bash scripts/check_book_example_block.sh

      # BOOK-CLOSEOUT-001 § Phase 3: every aprender-core public module has a chapter
      - name: Library parity gate (FALSIFY-BOOK-LIB-PARITY-001)
        run: bash scripts/check_book_lib_parity.sh

      # BOOK-CLOSEOUT-001 § Phase 3: every lib stub has a runnable rust example
      - name: Library example-block gate (FALSIFY-BOOK-LIB-EXAMPLE-001)
        run: bash scripts/check_book_lib_example_block.sh

      # BOOK-CLOSEOUT-001 § Phase 4: pmat comply gates all book contracts together
      # (single check that asserts is_compliant=true; ties the linkcheck +
      # parity + example gates into one contract surface)
      - name: pmat comply gate (FALSIFY-BOOK-COMPLY-001)
        run: |
          # Was: `cargo install pmat … || true`. The trailing `|| true` is the
          # fail-open shape check_tool_versions.sh was written to delete — a failed
          # install carried on with whatever was already on PATH, so a bad network day
          # silently downgraded the gate without failing the job that depends on it.
          bash scripts/check_tool_versions.sh
          # Validate the book-completeness contract via pv.
          #
          # This line used to call a bare `pv` and exited 127 (command not found)
          # the first time the step ever ran: every earlier run died at the parity
          # gate above, so nothing reached it. Note the shape of the bug — the step
          # guards `pmat` with `command -v` and a comment saying it "tolerates
          # absence", then invokes `pv` unguarded one line earlier, in a step whose
          # entire purpose is running pv.
          #
          # `pv` is IN-TREE (crates/aprender-contracts-cli, [[bin]] name = "pv"), so
          # build it from the tree instead of depending on an installed copy — that
          # is the dogfood rule in CLAUDE.md, and it cannot drift from the contracts
          # it is validating.
          bash scripts/cargo_step.sh 'pv validate (book completeness)' -- \
            cargo run --quiet -p aprender-contracts-cli --bin pv -- \
            validate contracts/apr-book-completeness-v1.yaml
          # pmat comply check — single binary signal; tolerates absence (pmat may not be available on every runner)
          if command -v pmat >/dev/null 2>&1; then
            pmat comply check 2>&1 | tail -10 || echo "::warning::pmat comply check returned non-zero (advisory)"
          else
            echo "::warning::pmat not available — skipping comply gate (advisory)"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book/book

  deploy:
    name: Deploy to GitHub Pages
    runs-on: [self-hosted, Linux, X64, clean-room]
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
