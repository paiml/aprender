# cargo-nextest CI profile
# Deployed from paiml/infra — do not edit manually.
# Spec: docs/specifications/unified-ci-pipeline.md

[profile.ci]
retries = 2
fail-fast = true
slow-warning = "60s"
status-level = "fail"

[profile.ci.junit]
path = "target/nextest/ci/junit.xml"
store-success-output = false
store-failure-output = true

# Empirical FLOPS / memory-bandwidth / roofline tests derive a RATE
# (work ÷ wall-clock-elapsed) and assert a lower bound on it. Under nextest's
# global thread pool the wall-clock inflates when many test threads contend for
# CPU, dragging the derived rate below the assertion floor (passes serially,
# races in parallel). They genuinely measure MACHINE THROUGHPUT, so the correct
# fix is to run them ISOLATED rather than weaken the assertions:
#   - serial-timing group (max-threads = 1) → these tests never run alongside
#     EACH OTHER.
#   - threads-required = "num-test-threads" (override below) → each one reserves
#     the entire pool, so it runs with NO other test concurrent → its wall-clock
#     reflects real single-core throughput, not contention.
# Everything else still parallelizes, preserving the workspace-test speedup
# (the 4 isolated tests run back-to-back in <2s total).
[test-groups.serial-timing]
max-threads = 1

[[profile.default.overrides]]
filter = "test(/empirical_flops/) | test(/empirical_bandwidth/) | test(/empirical_ridge/) | test(/triad_bandwidth/)"
test-group = "serial-timing"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "test(/empirical_flops/) | test(/empirical_bandwidth/) | test(/empirical_ridge/) | test(/triad_bandwidth/)"
test-group = "serial-timing"
threads-required = "num-test-threads"

# Compile/build-running tests SHELL OUT to `cargo build` / `cargo run --example`
# in scratch temp dirs (aprender-orchestrate pipeline BuildStage + releaser
# preflight examples checks). Under nextest's global thread pool, many of these
# run CONCURRENTLY → they contend for the cargo target lock and disk, and the
# nested `cargo` invocations themselves saturate every core. The result is
# timeouts / lock contention that flake merge_group CI (run 28163348728) even
# though they pass under the old one-binary-at-a-time `cargo test --lib`.
#
# Fix (same pattern as serial-timing above): run them ISOLATED.
#   - serial-build group (max-threads = 1) → no two compile-running tests run
#     alongside EACH OTHER (so only ONE nested cargo build at a time).
#   - threads-required = "num-test-threads" → each reserves the whole pool, so
#     no OTHER (non-build) test runs concurrent with a nested compile either,
#     giving the nested `cargo` all cores and removing target/disk contention.
# Everything else still parallelizes, preserving the nextest speedup.
#
# CONTRACT: any new test that invokes `cargo build` / `cargo run` / `rustc`
# (i.e. compiles in a scratch dir) MUST be added to this serial-build group,
# and MUST use a per-process-unique temp dir (append std::process::id()).
[test-groups.serial-build]
max-threads = 1

[[profile.default.overrides]]
filter = "test(/build_stage_execute_debug_build/) | test(/build_stage_execute_release_build/) | test(/build_stage_execute_with_target/) | test(/build_stage_execute_cargo_build_fails/) | test(/build_stage_execute_wasm_flag/) | test(/check_examples_all_pass/) | test(/check_examples_compilation_error/) | test(/check_examples_run_non_blocking/) | test(/check_examples_run_with_rs_files/) | test(/check_examples_runtime_nonzero_exit/)"
test-group = "serial-build"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "test(/build_stage_execute_debug_build/) | test(/build_stage_execute_release_build/) | test(/build_stage_execute_with_target/) | test(/build_stage_execute_cargo_build_fails/) | test(/build_stage_execute_wasm_flag/) | test(/check_examples_all_pass/) | test(/check_examples_compilation_error/) | test(/check_examples_run_non_blocking/) | test(/check_examples_run_with_rs_files/) | test(/check_examples_runtime_nonzero_exit/)"
test-group = "serial-build"
threads-required = "num-test-threads"

# GPU tests that make a claim on TOTAL DEVICE CAPACITY ("100GB must fail", "2GB
# must succeed", "allocate to OOM then free"), or that mutate the process-wide
# MANAGED_MEMORY variable the allocator consults on every allocation.
#
# In-process these already take `device_memory_exclusive()` (aprender-gpu
# driver/memory/buffer.rs), which is what `cargo test` needs. That lock is a
# process-global Mutex and nextest runs ONE PROCESS PER TEST, so it excludes
# nothing here — two nextest processes still hit the same single GPU. Measured:
# per-test process isolation removed every shared-statics failure in
# aprender-gpu and left the device-capacity ones failing, with a different set
# each run.
#
# Fix (same pattern as serial-timing / serial-build above): run them ISOLATED.
#   - gpu-exclusive group (max-threads = 1) → no two capacity claims run
#     alongside EACH OTHER.
#   - threads-required = "num-test-threads" → each reserves the whole pool, so
#     no OTHER test allocates on the device (or observes MANAGED_MEMORY) while
#     one is running.
# Everything else still parallelizes.
#
# The same group also holds the graph-capture tests and `test_context_synchronize`:
# `cuCtxSynchronize` is illegal while any stream in the context is capturing,
# and the attempt invalidates the capture, so the two are mutually destructive
# (errors 900 / 901). In-process they take `CAPTURE_VS_CTX_SYNC`
# (driver/cuda_tests/mod.rs); across nextest processes they need this group.
#
# CONTRACT: any new test that asserts on how much the DEVICE can supply, that
# sets MANAGED_MEMORY, that opens a stream capture, or that calls
# `CudaContext::synchronize()`, MUST take the matching in-process lock *and* be
# added to this group. One without the other only covers one of the two
# execution models.
[test-groups.gpu-exclusive]
max-threads = 1

[[profile.default.overrides]]
filter = "test(/test_oom_resilience/) | test(/test_cuda_stress_memory_pressure/) | test(/test_alloc_oversize_100gb/) | test(/env_override_managed_forced/) | test(/env_override_device_only/) | test(/test_context_synchronize/) | test(/test_cuda_graph_capture_and_replay/) | test(/test_cuda_graph_capture_modes/) | test(/test_cuda_graph_with_kernel/)"
test-group = "gpu-exclusive"
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = "test(/test_oom_resilience/) | test(/test_cuda_stress_memory_pressure/) | test(/test_alloc_oversize_100gb/) | test(/env_override_managed_forced/) | test(/env_override_device_only/) | test(/test_context_synchronize/) | test(/test_cuda_graph_capture_and_replay/) | test(/test_cuda_graph_capture_modes/) | test(/test_cuda_graph_with_kernel/)"
test-group = "gpu-exclusive"
threads-required = "num-test-threads"
