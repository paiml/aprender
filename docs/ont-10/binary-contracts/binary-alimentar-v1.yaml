# ─────────────────────────────────────────────────────────────────────────────
# binary-alimentar-v1 — ONT-10 slice S10: the `alimentar` binary as an entity (ONT-001 v4.17 ONT-4g; #4476, #4079)
#
# MEASURED (2026-09-26, batch/ont-10 @ b1cd8c0b0, `cargo build --release -p aprender-data --features cli`, default
# features otherwise): `alimentar --version` = "alimentar 0.69.3"; the recursive --help walk gives 31 leaf commands,
# the set below. surface_audit.csv has 35 alimentar rows: the 31, plus 4 for commands the DEFAULT build does not
# expose, because they sit behind non-default features:
#   doctest extract, doctest merge   (feature `doctest`)
#   hub push, import hf              (feature `hf-hub`)
# Those 4 are bin:ledgerOrphan today, so `alimentar-commands` is RED until either the ledger rows name their
# feature or the release build enables it. Recorded, not hidden: that is the defect this shape exists to find.
# G0.1 (--version carries the git sha) is a warning here and RED on every current build: the string is "0.69.3".
#
# CONVENTION THIS DRAFT ASKS OF extract:binary (ONT-4g, aprender-98): pv's shape subset has no targetNode, so
# each node binary/<package>/<target> is also typed bin:target/<package>/<target>; the snapshot's commands are
# bin:command literals (leaf paths, space-joined); the csv join yields bin:ledgerOrphan / bin:unledgeredCommand.
#
# KIND: pattern.
# ─────────────────────────────────────────────────────────────────────────────
name: binary-alimentar
version: "0.1.0"
scope: >
  The built `alimentar` target of package `aprender-data` (default features) as the focus node binary/aprender-data/alimentar:
  its identity and its exact CLI command set, and the surface_audit.csv rows that must resolve to it.
status: draft

metadata:
  version: "0.1.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice (alimentar). Per-binary shapes over the node extract:binary (ONT-4g, #4476) draws for
    binary/aprender-data/alimentar. DRAFT: binary-surface-v1 (the bin: vocabulary) and extract:binary do not exist on this
    branch yet, so this contract goes green only after ONT-4g lands.
  references:
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (the ledger; binary column = alimentar)'
    - 'scripts/dogfood_surfaces.sh (the snapshot extract:binary reads)'

entity:
  type: binary

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: alimentar-identity
    targetClass: bin:target/aprender-data/alimentar
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["alimentar"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-data"]}
      - {path: bin:sha256, minCount: 1, maxCount: 1, pattern: "^[0-9a-f]{64}$"}
      - {path: bin:helpSha256, minCount: 1, maxCount: 1, pattern: "^[0-9a-f]{64}$"}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "^alimentar [0-9]+\\.[0-9]+\\.[0-9]+"}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: warning}
  - id: alimentar-commands
    targetClass: bin:target/aprender-data/alimentar
    properties:
      - path: bin:command
        minCount: 31
        maxCount: 31
        in:
          - "convert"
          - "dedup"
          - "drift compare"
          - "drift detect"
          - "drift merge"
          - "drift report"
          - "drift sketch"
          - "fed manifest"
          - "fed plan"
          - "fed split"
          - "fed verify"
          - "filter-text"
          - "fim"
          - "head"
          - "import local"
          - "info"
          - "mix"
          - "quality check"
          - "quality profiles"
          - "quality report"
          - "quality score"
          - "registry delete"
          - "registry init"
          - "registry list"
          - "registry pull"
          - "registry push"
          - "registry search"
          - "registry show-info"
          - "repl"
          - "schema"
          - "view"
      - {path: bin:ledgerOrphan, maxCount: 0}
      - {path: bin:unledgeredCommand, maxCount: 0}

equations:
  command_set:
    formula: "commands(binary/aprender-data/alimentar) = C, |C| = 31, where C = the leaves of the recursive --help walk of the default-feature build"
    domain: "the snapshot record dogfood_surfaces.sh writes for this target"
    codomain: "one bin:command literal per leaf command path, space-joined, LC_ALL=C sorted"
    invariants:
      - "in + minCount 31 + maxCount 31 over distinct literals is set equality: an added, dropped or renamed command is a violation naming it"
  ledger_join:
    formula: "ledgerOrphan = { r ∈ csv : r.binary = alimentar ∧ r.feature ∉ C }; unledgeredCommand = C ∖ { r.feature : r.binary = alimentar }"
    domain: "docs/audits/surface_audit.csv rows whose binary column is alimentar"
    codomain: "literals on the focus node, one per orphan row or unledgered command"
    invariants:
      - "a ledger row for a command the built binary does not expose is a violation, never a silent skip"

falsification_tests:
  - id: FALSIFY-BIN-ALIMENTAR-001
    name: dropped_command_is_red
    prediction: "deleting one leaf from the snapshot's command list makes alimentar-commands RED naming the command (minCount 31)"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the snapshot with one command removed"
    expected_output: "verdict Fail, one result on binary/aprender-data/alimentar path bin:command"
    if_fails: "A command could vanish from the shipped alimentar with the ontology green."
  - id: FALSIFY-BIN-ALIMENTAR-002
    name: ledger_row_deleted_is_red
    prediction: "deleting one surface_audit.csv row for a live alimentar command makes bin:unledgeredCommand non-empty, RED naming it"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the csv with one row deleted"
    expected_output: "verdict Fail naming the command"
    if_fails: "The dogfood coverage ratio would be computed over a ledger that silently omits a shipped command."
