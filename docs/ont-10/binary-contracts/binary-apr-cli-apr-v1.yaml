# ─────────────────────────────────────────────────────────────────────────────
# binary-apr-cli-apr-v1 — ONT-10 slice S9 (apr(apr-cli) 1/2): the `apr` target of package `apr-cli` as an entity —
# identity and the full CLI command set (ONT-001 v4.17 ONT-4g; #4476, #4079)
#
# WHY THE SPLIT WITH S8 IS BY KIND, NOT BY HALF THE ALPHABET: a count over one path cannot be divided between two
# contracts. pv's shapes subset refuses the qualifiedValueShape family (crates/aprender-contracts/src/ontology/
# shapes.rs, header table), and `in` + minCount + maxCount on bin:command is set equality over the WHOLE node — a
# contract holding half the commands would be RED on the other half. So S9 owns identity + every CLI command (as S4
# does for orchestrate); S8 (apr(apr-cli) 2/2) owns the 47 HTTP route rows and the mcp:* rows of the same node.
#
# MEASURED (2026-09-26, batch/ont-10 @ b1cd8c0b0, release build, default features, private CARGO_TARGET_DIR):
#   `apr --version` = "apr 0.69.3 (b1cd8c0b08)" — name right, git sha present: G0.1 green (the only S3/S9/S15
#   binary where it is).
#   Recursive --help walk: 262 leaves, clap's auto `help` excluded, plus 2 runnable non-leaves = 264 commands:
#   `debug` (Usage shows [COMMAND]: `apr debug model.apr` runs on its own) and `sim help` (a real subcommand,
#   "Show help", not clap's "Print this message…"; the only such in the tree).
#   surface_audit.csv rows with binary=apr: 375 = 318 CLI + 47 HTTP + 10 other (mcp:* and one route-index row).
#   The 318 CLI rows reduce to 267 distinct command paths (options stripped). Join against the 264:
#     15 ledger rows name commands the DEFAULT build lacks — RED today, all feature-gated:
#       data x doctest extract|merge, data x hub push, data x import hf  (aprender-data features doctest / hf-hub)
#       mono archive|audit|publish|shims                                  (apr-cli feature `dev`)
#       rag eval compare|gate|generate|judge|metrics|retrieve|sample      (aprender-rag-cli feature `eval`)
#     12 commands have no ledger row — RED today: capability, pv census, pv challenge check|gen,
#       pv discharge check|gen-axioms|label-ratchet|run, pv extract, pv obligations, pv ontology export|tbox.
#
# CONVENTION THIS DRAFT ASKS OF extract:binary (ONT-4g, aprender-98), beyond S4's: (1) a non-leaf whose Usage line
# shows `[COMMAND]` is also a bin:command; (2) only clap's auto-generated `help` ("Print this message or the help
# of the given subcommand(s)") is excluded, a user-defined `help` is a command. (3) The ledger's binary column says
# `apr` for BOTH apr targets (apr-cli:apr here, aprender:apr in S6/S7); the join keys on the column, so both nodes
# see the same rows. G0.5 (the two apr targets' helpSha256 equal) spans two nodes and is not expressible as a
# single-node shape; it stays with the ONT-4g surface_audit_bins gate.
#
# KIND: pattern.
# ─────────────────────────────────────────────────────────────────────────────
name: binary-apr-cli-apr
version: "0.1.0"
scope: >
  The built `apr` target of package `apr-cli` (default features) as the focus node binary/apr-cli/apr: its identity,
  its exact CLI command set, and the surface_audit.csv CLI rows that must resolve to it. HTTP and MCP rows are S8.
status: draft

metadata:
  version: "0.1.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice S9 (apr, package apr-cli). Per-binary shapes over the node extract:binary (ONT-4g, #4476)
    draws for binary/apr-cli/apr. DRAFT: binary-surface-v1 (the bin: vocabulary) and extract:binary do not exist on
    this branch yet, so this contract goes green only after ONT-4g lands — and then only once the 27 ledger
    mismatches above are resolved in the ledger or the build.
  references:
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (the ledger; binary column = apr, feature starts with "apr ")'
    - 'scripts/dogfood_surfaces.sh (the snapshot extract:binary reads)'
    - 'crates/aprender-contracts/src/ontology/shapes.rs (the supported shapes subset; why the split is by kind)'

entity:
  type: binary

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: apr-cli-apr-identity
    targetClass: bin:target/apr-cli/apr
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["apr"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["apr-cli"]}
      - {path: bin:sha256, minCount: 1, maxCount: 1, pattern: "^[0-9a-f]{64}$"}
      - {path: bin:helpSha256, minCount: 1, maxCount: 1, pattern: "^[0-9a-f]{64}$"}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "^apr [0-9]+\\.[0-9]+\\.[0-9]+"}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: warning}
