equations:
  route_set:
    formula: "routes(binary/aprender-orchestrate/aprender-orchestrate) = R, |R| = 92, R = the (METHOD, /path) pairs router.rs mounts via .route(path, method(handler)...)"
    domain: "the banco router of the default-feature build"
    codomain: "one bin:route literal \"METHOD /path\" per pair, LC_ALL=C sorted; axum :param segments kept verbatim"
    invariants:
      - "in + minCount 92 + maxCount 92 over distinct literals is set equality: an added, dropped or re-methoded route is a violation naming it"
      - "one path served under two methods is two literals"
  ledger_join:
    formula: "ledgerOrphanRoute = { r in csv : r.binary = aprender-orchestrate, r.feature starts with an HTTP method, r.feature not in R }; unledgeredRoute = R minus those features"
    domain: "docs/audits/surface_audit.csv HTTP rows whose binary column is aprender-orchestrate (92 on 2026-09-26)"
    codomain: "literals on the focus node, one per orphan row or unledgered route"
    invariants:
      - "S4 joins the 86 CLI and 6 mcp rows; this join sees only rows whose feature starts with an HTTP method, so no row is judged twice"

falsification_tests:
  - id: FALSIFY-BIN-APRENDER_ORCHESTRATE_HTTP-001
    name: dropped_route_is_red
    prediction: "removing DELETE /api/delete from the snapshot's route list makes aprender-orchestrate-routes RED twice: minCount 92 and a bin:ledgerOrphanRoute naming it"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the snapshot with the route removed"
    expected_output: "verdict Fail, results on binary/aprender-orchestrate/aprender-orchestrate paths bin:route and bin:ledgerOrphanRoute"
    if_fails: "An Ollama-compat endpoint could vanish from banco with the ontology green."
  - id: FALSIFY-BIN-APRENDER_ORCHESTRATE_HTTP-002
    name: unledgered_route_is_red
    prediction: "adding GET /api/v1/probe to the snapshot makes the shape RED on maxCount 92, on `in`, and on bin:unledgeredRoute"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the snapshot with the route added"
    expected_output: "verdict Fail naming GET /api/v1/probe"
    if_fails: "A new endpoint could ship without a ledger row, so dogfood coverage would be computed over a stale surface."
  - id: FALSIFY-BIN-APRENDER_ORCHESTRATE_HTTP-003
    name: extractor_gap_is_red_not_vacuous
    prediction: "on today's snapshot (dogfood_surfaces.sh does not read the banco router) bin:route is empty and the shape is RED on minCount 92, never green over an empty set"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the unmodified snapshot"
    expected_output: "verdict Fail, one minCount result on path bin:route"
    if_fails: "The HTTP half of orchestrate would read as covered while no extractor looks at it."
