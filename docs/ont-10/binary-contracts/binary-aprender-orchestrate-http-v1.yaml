          - "GET /api/v1/batch"
          - "GET /api/v1/batch/:id"
          - "GET /api/v1/chat/parameters"
          - "GET /api/v1/config"
          - "GET /api/v1/conversations"
          - "GET /api/v1/conversations/:id"
          - "GET /api/v1/conversations/export"
          - "GET /api/v1/conversations/search"
          - "GET /api/v1/data/datasets"
