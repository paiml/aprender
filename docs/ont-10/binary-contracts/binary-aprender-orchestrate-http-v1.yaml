# ─────────────────────────────────────────────────────────────────────────────
# binary-aprender-orchestrate-http-v1 — ONT-10 slice S3 (orchestrate 2/2): the HTTP routes the
# `aprender-orchestrate` binary serves (the banco server), as properties of its binary node
# (ONT-001 v4.17 ONT-4g; #4476, #4079). The CLI and MCP half is S4, binary-aprender-orchestrate-cli-v1.yaml.
#
# MEASURED (2026-09-26, batch/ont-10 @ ff9587b59): crates/aprender-orchestrate/src/serve/banco/router.rs mounts
# 92 (method, path) pairs through .route(); there is no .nest/.merge/.route_service/.fallback anywhere under
# serve/. That set is EQUAL to surface_audit.csv's 92 HTTP rows for this binary (comm -3: 0 lines either side).
# Identity (name, version, sha) is shaped once, in S4; this contract shapes only the route set.
#
# GAP THIS DRAFT ASKS OF extract:binary (ONT-4g, aprender-98): scripts/dogfood_surfaces.sh enumerates HTTP routes
# only from crates/aprender-serve/src/api/ route tables. The banco router uses axum `.route("/p", get(h).post(h))`
# chains and is NOT in the snapshot, so bin:route is empty for this node today and every shape below is RED until
# the extractor reads it: from the router source, or better from a live route index banco does not yet expose.
#
# KIND: pattern.
# ─────────────────────────────────────────────────────────────────────────────
name: binary-aprender-orchestrate-http
version: "0.1.0"
scope: >
  The HTTP surface of the built `aprender-orchestrate` target of package `aprender-orchestrate`: the exact set of
  (method, path) routes its banco router mounts, and the surface_audit.csv HTTP rows that must resolve to it.
status: draft

metadata:
  version: "0.1.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice S3 (aprender-orchestrate HTTP). Per-binary shapes over the node extract:binary
    (ONT-4g, #4476) draws for binary/aprender-orchestrate/aprender-orchestrate. DRAFT: binary-surface-v1 (the bin:
    vocabulary) and extract:binary do not exist on this branch yet, so this contract goes green only after
    ONT-4g lands and the extractor reads the banco router.
  references:
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (the ledger; binary column = aprender-orchestrate, feature = "METHOD /path")'
    - 'crates/aprender-orchestrate/src/serve/banco/router.rs (the route table)'
    - 'docs/ont-10/binary-contracts/binary-aprender-orchestrate-cli-v1.yaml (S4: identity, CLI, MCP)'

entity:
  type: binary

relations:
  depends_on: [binary-surface-v1]

