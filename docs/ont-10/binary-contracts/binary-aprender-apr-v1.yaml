equations:
  command_set:
    formula: "commands(binary/aprender/apr) = C, |C| = 264, C = the leaves of the recursive --help walk of the default-feature build ∪ the non-leaves whose Usage shows [COMMAND] ∪ user-defined `help` subcommands"
    domain: "the snapshot record dogfood_surfaces.sh writes for this target"
    codomain: "one bin:command literal per command path, space-joined, LC_ALL=C sorted"
    invariants:
      - "in + minCount 264 + maxCount 264 over distinct literals is set equality: an added, dropped or renamed command is a violation naming it"
      - "clap's auto-generated help is never a member; a feature-gated command is a member only if the default build exposes it"
  ledger_join:
    formula: "ledgerOrphan = { r ∈ csv : r.binary = apr ∧ r.feature starts with 'apr ' ∧ path(r) ∉ C }; unledgeredCommand = C ∖ { path(r) }, path(r) = r.feature minus the leading 'apr ', cut at the first token starting with -, <, [ or ("
    domain: "docs/audits/surface_audit.csv CLI rows whose binary column is apr (318 rows, 267 paths, on 2026-09-26)"
    codomain: "literals on the focus node, one per orphan path or unledgered command"
    invariants:
      - "a ledger row for a command the default build does not expose is a violation, never a silent skip; the fix is a row naming its feature or a default-build change, never deleting the shape"

falsification_tests:
  - id: FALSIFY-BIN-APRENDER_APR-001
    name: dropped_command_is_red
    prediction: "deleting `qa` from the snapshot's command list makes aprender-apr-commands RED twice: minCount 264 and a bin:ledgerOrphan naming qa"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the snapshot with qa removed"
    expected_output: "verdict Fail, results on binary/aprender/apr paths bin:command and bin:ledgerOrphan"
    if_fails: "The first diagnostic tool (apr qa) could vanish from the shipped binary with the ontology green."
  - id: FALSIFY-BIN-APRENDER_APR-002
    name: feature_gated_ledger_rows_are_red_today
    prediction: "on today's snapshot the 15 feature-gated rows (mono ×4, rag eval ×7, data x doctest/hub/import hf ×4) are bin:ledgerOrphan and the 12 pv/capability commands are bin:unledgeredCommand: the shape is RED with 27 results"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the b6cf6d2ed snapshot"
    expected_output: "verdict Fail, 27 results on binary/aprender/apr naming each path"
    if_fails: "The dogfood coverage ratio would count commands users of the default install cannot run."
  - id: FALSIFY-BIN-APRENDER_APR-003
    name: runnable_group_counts
    prediction: "an extractor that emits leaves only (dropping `debug` and `sim help`) makes the shape RED on minCount 264 and turns the `apr debug` ledger row into an orphan"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on a snapshot built by a leaves-only walk"
    expected_output: "verdict Fail naming debug and sim help"
    if_fails: "`apr debug model.apr`, a documented Step-4 diagnostic, would be outside the modelled surface."
