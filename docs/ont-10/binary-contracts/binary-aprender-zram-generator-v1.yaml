# ─────────────────────────────────────────────────────────────────────────────
# binary-aprender-zram-generator-v1 — ONT-10 slice S15 (2/2): the `aprender-zram-generator` binary as an entity
# (ONT-001 v4.17 ONT-4g; #4476, #4079)
#
# MEASURED (2026-09-26, batch/ont-10 @ b1cd8c0b0, release build, default features, private CARGO_TARGET_DIR):
# a systemd generator (systemd.generator(7)): no subcommands, one required positional NORMAL_DIR and two optional
# ones, EARLY_DIR and LATE_DIR. surface_audit.csv holds 1 row, `<NORMAL_DIR>`. `aprender-zram-generator --version`
# prints "trueno-zram-generator 0.69.3": the pre-monorepo name. The identity shape requires the version string to
# start with the target name, so it is RED today. G0.1 (git sha in --version) is a warning and RED today.
#
# CONVENTION: as binary-aprender-profile-v1 — a ledger row whose feature is `<NAME>` joins bin:positional NAME.
#
# KIND: pattern.
# ─────────────────────────────────────────────────────────────────────────────
name: binary-aprender-zram-generator
version: "0.1.0"
scope: >
  The built `aprender-zram-generator` target of package `aprender-zram-generator` (default features) as the focus
  node binary/aprender-zram-generator/aprender-zram-generator: its identity, its (empty) command set, its
  generator arguments, and the surface_audit.csv row that must resolve to it.
status: draft

metadata:
  version: "0.1.0"
  kind: pattern
  created: '2026-09-26'
  last_modified: '2026-09-26'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice (aprender-zram-generator). Per-binary shapes over the node extract:binary (ONT-4g, #4476)
    draws for binary/aprender-zram-generator/aprender-zram-generator. DRAFT: binary-surface-v1 (the bin:
    vocabulary) and extract:binary do not exist on this branch yet, so this contract goes green only after
    ONT-4g lands.
  references:
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (the ledger; binary column = aprender-zram-generator)'
    - 'scripts/dogfood_surfaces.sh (the snapshot extract:binary reads)'
    - 'systemd.generator(7) — the argv contract a generator is invoked with'

entity:
  type: binary

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: aprender-zram-generator-identity
    targetClass: bin:target/aprender-zram-generator/aprender-zram-generator
    properties:
      - {path: bin:name, minCount: 1, maxCount: 1, in: ["aprender-zram-generator"]}
      - {path: bin:package, minCount: 1, maxCount: 1, in: ["aprender-zram-generator"]}
      - {path: bin:sha256, minCount: 1, maxCount: 1, pattern: "^[0-9a-f]{64}$"}
      - {path: bin:helpSha256, minCount: 1, maxCount: 1, pattern: "^[0-9a-f]{64}$"}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "^aprender-zram-generator [0-9]+\\.[0-9]+\\.[0-9]+"}
      - {path: bin:versionString, minCount: 1, maxCount: 1, pattern: "[0-9a-f]{9}", severity: warning}
  - id: aprender-zram-generator-surface
    targetClass: bin:target/aprender-zram-generator/aprender-zram-generator
    properties:
      - {path: bin:command, maxCount: 0}
      - path: bin:positional
        minCount: 3
        maxCount: 3
        in:
          - "EARLY_DIR"
          - "LATE_DIR"
          - "NORMAL_DIR"
      - {path: bin:ledgerOrphan, maxCount: 0}

equations:
  argv_shape:
    formula: "commands(binary/aprender-zram-generator/aprender-zram-generator) = ∅; positionals = {NORMAL_DIR, EARLY_DIR, LATE_DIR}"
    domain: "the snapshot record dogfood_surfaces.sh writes for this target"
    codomain: "one bin:positional literal per argument in the --help Usage line, LC_ALL=C sorted"
    invariants:
      - "systemd calls a generator with exactly three directory arguments; a build that drops one, or grows a subcommand, is a violation"
  ledger_join:
    formula: "ledgerOrphan = { r ∈ csv : r.binary = aprender-zram-generator ∧ key(r) ∉ positionals }, key(`<NORMAL_DIR> …`) = NORMAL_DIR"
    domain: "docs/audits/surface_audit.csv rows whose binary column is aprender-zram-generator (1 on 2026-09-26)"
    codomain: "literals on the focus node, one per orphan row"
    invariants:
      - "a ledger row for an argument the built binary does not take is a violation, never a silent skip"

falsification_tests:
  - id: FALSIFY-BIN-APRENDER_ZRAM_GENERATOR-001
    name: generator_argv_drift_is_red
    prediction: "removing LATE_DIR from the snapshot's positionals makes aprender-zram-generator-surface RED (minCount 3); adding a subcommand makes it RED (bin:command maxCount 0)"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the snapshot with each edit applied in turn"
    expected_output: "verdict Fail, one result per edit on binary/aprender-zram-generator/aprender-zram-generator"
    if_fails: "The generator could stop accepting systemd's argv with the ontology green; zram units would silently not be written."
  - id: FALSIFY-BIN-APRENDER_ZRAM_GENERATOR-002
    name: legacy_version_name_is_red
    prediction: "on today's build (--version = \"trueno-zram-generator 0.69.3\") aprender-zram-generator-identity is RED on bin:versionString"
    test_harness: "pv lint contracts/ --gate shapes --format json (after ONT-4g), on the b1cd8c0b0 snapshot"
    expected_output: "verdict Fail, one result on path bin:versionString"
    if_fails: "A user running aprender-zram-generator --version would be told another program's name, unflagged."
