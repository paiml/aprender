# ─────────────────────────────────────────────────────────────────────────────
# binary-aprender-apr-2of2-v1 — ONT-10 slice S6 (apr(aprender) 2/2): the HTTP routes and MCP tools of the `apr`
# target of the root facade package `aprender` (what `cargo install aprender` installs) (ONT-001 v4.17 ONT-4g;
# #4476, #4079). Identity and every CLI command are S7, binary-aprender-apr-v1.yaml; the split is by KIND, as
# S9/S8 split apr(apr-cli).
#
# MEASURED (2026-09-27, batch/ont-10 @ dee666f82a, release build, default features = ["cli"], private
# CARGO_TARGET_DIR): `apr --version` = "apr 0.69.3 (dee666f82a)", sha256 a12ce715c7319903…
#   MCP: `apr mcp` (stdio) answers tools/list with 9 tools, EQUAL to S8's 9 and to surface_audit.csv's 9
#   `mcp:apr.*` rows.
#   HTTP: `apr serve run qwen2.5-coder-1.5b-instruct-q4_k_m.gguf` (GGUF router, CPU, no gpu_batch) answers an
#   unknown path with 404 and a `routes` index of 37 "METHOD /path" entries, every one in S8's 41. The 4 it does
#   not mount are the ones S8 attributes to other formats or capabilities: DELETE /api/delete, GET /tensors,
#   POST /api/pull (apr-cli serve/ APR-CPU and SafeTensors routers) and POST /v1/batch/completions
#   (caps.gpu_batch). The facade is `fn main() { apr_cli::cli_main() }` over apr-cli with apr-cli's default
#   features, so its route union is S8's by construction; the live index is the evidence the build engaged it.
#   The ledger's binary column says `apr` for both targets, so this node joins the same rows as S8 and is RED on
#   the same 2 cuda-only orphans (POST /v1/logprobs, POST /v1/perplexity). One ledger or build fix clears both.
#
# GAP THIS DRAFT ASKS OF extract:binary: S8's (METHOD dropped, apr-cli serve/ routes invisible), unchanged.
#
# KIND: pattern.
# ─────────────────────────────────────────────────────────────────────────────
name: binary-aprender-apr-2of2
version: "0.1.0"
scope: >
  The HTTP and MCP surface of the built `apr` target of the root facade package `aprender` (default features = ["cli"]): the exact set of
  (METHOD, /path) routes `apr serve` can mount over every model format, the exact MCP tools/list of `apr mcp`,
  and the surface_audit.csv HTTP and mcp rows that must resolve to them. Identity and CLI are S7.
status: draft

metadata:
  version: "0.1.0"
  kind: pattern
  created: '2026-09-27'
  last_modified: '2026-09-27'
  author: PAIML Engineering
  description: >
    ONT-10 binary slice S6 (apr of the aprender facade, 2/2: HTTP + MCP). Per-binary shapes over the node extract:binary
    (ONT-4g, #4476) draws for binary/aprender/apr. DRAFT: staged with its siblings until the directory moves to
    contracts/ on the binary-surface-v1 vocabulary.
  references:
    - 'paiml/infra docs/specifications/paiml-ontology.md v4.17 §5 ONT-4g, ONT-10'
    - 'docs/audits/surface_audit.csv (binary column = apr; HTTP rows "METHOD /path", MCP rows "mcp:<tool>")'
    - 'crates/aprender-serve/src/api/router.rs (route_table, cuda_routes)'
    - 'crates/apr-cli/src/commands/serve/ (routes.rs, route_index.rs, handlers*.rs, ollama.rs, safetensors.rs)'
    - 'crates/aprender-mcp/src/tools/ (the 9 tools)'
    - 'docs/ont-10/binary-contracts/binary-aprender-apr-v1.yaml (S7: identity + CLI)'
    - 'docs/ont-10/binary-contracts/binary-apr-cli-2of2-v1.yaml (S8: the same surface on binary/apr-cli/apr)'
    - 'src/bin/apr.rs (the facade entry point: apr_cli::cli_main())'

entity:
  type: binary

relations:
  depends_on: [binary-surface-v1]

shapes:
  - id: aprender-apr-routes
    targetClass: bin:target/aprender/apr
    properties:
      - path: bin:route
        minCount: 41
        maxCount: 41
        in:
          - "DELETE /api/delete"
          - "GET /"
          - "GET /api/tags"
          - "GET /api/version"
          - "GET /health"
          - "GET /health/live"
          - "GET /health/ready"
          - "GET /metrics"
          - "GET /metrics/dispatch"
          - "GET /models"
          - "GET /ready"
          - "GET /realize/model"
          - "GET /tensors"
          - "GET /v1/audit/:request_id"
          - "GET /v1/effective-config"
          - "GET /v1/gpu/status"
          - "GET /v1/metrics"
          - "GET /v1/models"
          - "POST /api/chat"
          - "POST /api/embeddings"
          - "POST /api/generate"
          - "POST /api/pull"
          - "POST /api/show"
          - "POST /batch/generate"
          - "POST /batch/tokenize"
          - "POST /generate"
          - "POST /metrics/dispatch/reset"
          - "POST /realize/batch"
          - "POST /realize/embed"
          - "POST /realize/generate"
          - "POST /realize/reload"
          - "POST /stream/generate"
          - "POST /tokenize"
          - "POST /v1/batch/completions"
          - "POST /v1/chat/completions"
          - "POST /v1/chat/completions/stream"
          - "POST /v1/completions"
          - "POST /v1/embeddings"
          - "POST /v1/explain"
          - "POST /v1/gpu/warmup"
          - "POST /v1/predict"
      - {path: bin:notFoundListsRoutes, minCount: 1, maxCount: 1, in: ["true"]}
      - {path: bin:ledgerOrphanRoute, maxCount: 0}
      - {path: bin:unledgeredRoute, maxCount: 0}
  - id: aprender-apr-mcp
    targetClass: bin:target/aprender/apr
    properties:
      - path: bin:mcpTool
        minCount: 9
        maxCount: 9
        in: ["apr.bench", "apr.finetune", "apr.qa", "apr.run", "apr.serve", "apr.tensors", "apr.trace", "apr.validate", "apr.version"]
      - {path: bin:ledgerOrphanTool, maxCount: 0}
      - {path: bin:unledgeredTool, maxCount: 0}

equations:
  route_set:
    formula: "routes(binary/aprender/apr) = R, |R| = 41, R = GET / plus the union of the (METHOD, /path) tables every `apr serve` router mounts in the default-feature build, over every model format and runtime capability"
    domain: "aprender-serve route_table with caps all true and cuda off, and the apr-cli serve/ Indexed routers"
    codomain: "one bin:route literal \"METHOD /path\" per pair, LC_ALL=C sorted; axum :param segments verbatim"
    invariants:
      - "in + minCount 41 + maxCount 41 is set equality: an added, dropped or re-methoded route is a violation naming it"
      - "a --features cuda build mounts 43; this shape is over the default build, as S7's command set is"
  ledger_join:
    formula: "ledgerOrphanRoute = { strip_mode(r.feature) : r.binary = apr, r.feature starts with an HTTP method } minus R; unledgeredRoute = R minus those; the same for mcp:* rows against the tools/list"
    domain: "docs/audits/surface_audit.csv rows with binary = apr: 47 HTTP, 9 mcp:*, 1 route-index row (2026-09-26)"
    codomain: "literals on the focus node, one per orphan or unledgered item"
    invariants:
      - "strip_mode drops a trailing \" (stream:...)\" so a streaming-mode row joins its route; 47 rows -> 43 routes"
      - "S7 joins the CLI rows; this join sees only HTTP, mcp:* and the route-index row, so no row is judged twice"
      - "today: ledgerOrphanRoute = {POST /v1/logprobs, POST /v1/perplexity} (cuda-only) -> RED; everything else joins"

falsification_tests:
  - id: FALSIFY-BIN-APRENDER_APR_2OF2-001
    name: dropped_route_is_red
    prediction: "removing POST /api/pull from the snapshot's route list makes aprender-apr-routes RED on minCount 41 and on bin:ledgerOrphanRoute naming it"
    test_harness: "pv lint contracts/ --gate shapes --format json (after the move), on the snapshot with the route removed"
    expected_output: "verdict Fail, results on binary/aprender/apr paths bin:route and bin:ledgerOrphanRoute"
    if_fails: "An Ollama-compat endpoint could vanish from apr serve with the ontology green."
  - id: FALSIFY-BIN-APRENDER_APR_2OF2-002
    name: unledgered_tool_is_red
    prediction: "adding apr.probe to the snapshot's tools/list makes aprender-apr-mcp RED on maxCount 9, on `in`, and on bin:unledgeredTool"
    test_harness: "pv lint contracts/ --gate shapes --format json (after the move), on the snapshot with the tool added"
    expected_output: "verdict Fail naming apr.probe"
    if_fails: "An MCP tool could ship to Claude Code clients with no ledger row and no dogfood coverage."
  - id: FALSIFY-BIN-APRENDER_APR_2OF2-003
    name: cuda_only_rows_are_red_on_the_default_build
    prediction: "on today's snapshot the 2 cuda-only ledger rows (POST /v1/logprobs, POST /v1/perplexity) are bin:ledgerOrphanRoute literals and the routes shape is RED on maxCount 0 for that path"
    test_harness: "pv lint contracts/ --gate shapes --format json (after the move), on the unmodified snapshot"
    expected_output: "verdict Fail, two results on path bin:ledgerOrphanRoute"
    if_fails: "The ledger would count two routes the shipped default binary cannot serve as covered surface."
