# DRAFT (branch-only). Proposed as the input contract for LA-05 (lookahead-readiness-v1),
# which renders it into the hourly look-ahead report. 0.5.0 passes `pv validate`: kind
# schema, a prediction and a test per falsifier, and a qa_gate. The renderer is an
# external check run by hand on look-ahead branches, never a gate: Python is allowed only
# as an external check, because the build is Rust only. Before this file moves into
# contracts/, its cases port to Rust with scripts/lookahead/fixtures/dor/cases.json as the
# case table (a fixture ledger with its exit code and its whole RED line or every row's
# verdict, or one rule's call and result), together with the findings below.
# docs/lookahead/0.71-dor-selftest-cases.patch makes the Python --self-test run that table.
# Until the patch is applied, the self-test runs only the twelve original fixtures and nine
# unit checks.
metadata:
  id: lookahead-dor-v1
  kind: schema
  version: "0.5.0"
  created: "2026-10-03"
  author: la-0.71 (L1)
  status: draft
  description: >
    Definition of Ready ledger for look-ahead train N+1 (APR-LOOKAHEAD-001 §4 L1.2).
    A row is READY iff spec, contract, falsifier, baseline and a proposed owner are
    present and every on_main claim exists at the checked ref. A staged claim must
    exist at its branch. If its path already exists at the ref, it must also name a
    staged_marker that the branch carries and the ref does not. A falsifier is a list
    of id claims, each naming the file that defines its ids. The ids are looked up in
    that file, at the ref for an on_main claim and at the branch for a staged one: a
    falsifier id is verified, never trusted (0.2.0 counted any non-empty list).
  references:
    - 'docs/lookahead/0.71-dor.yaml'
    - 'scripts/lookahead/dor_check.py'
    - 'scripts/lookahead/fixtures/dor/cases.json'
    - 'docs/lookahead/0.71-dor-selftest-cases.patch'
equations:
  ready:
    formula: |
      ready(r) := on_main(r.spec) ∧ on_main(r.contract) ∧ falsified(r)
                  ∧ on_main(r.baseline) ∧ r.owner_proposed ≠ null
      falsified(r) := |r.falsifier| ≥ 1 ∧ ∀c ∈ r.falsifier: c.on_main ∧ ids(c) ⊆ defined(ref, c.path)
      on_main(x) := x.path ≠ null ∧ x.on_main ∧ exists(ref, x.path)
      staged_ok(x) := exists(x.staged_at, p) ∧ ( (¬exists(ref, p) ∧ x.staged_marker = null)
                      ∨ (x.staged_marker ∈ text(x.staged_at, p) ∧ x.staged_marker ∉ text(ref, p)) )
                      where p = x.staged_path, else x.path
      staged_ids_ok(c) := ids(c) ⊆ defined(c.staged_at, p) ∧ ¬(ids(c) ⊆ defined(ref, p))
      ids(c) := ⋃ expand(t) for t ∈ c.ids;  expand(S·lo..S·hi) := S·lo, …, S·hi, zero-padded, lo < hi
      defined(g, p) := the `id:` values at any depth of g:p if p is YAML, else the ids that occur
                       in text(g, p) as whole tokens; ∅ if p is absent at g
    invariants:
      - "a claim on_main=true whose path is absent at ref is RED, never NOT READY"
      - "a staged claim that is not staged_ok is RED; a field missing on main but staged_ok renders name*, still NOT READY"
      - "each planted ledger is RED for its own reason; RED for another reason is a surviving falsifier"
      - "an empty ledger is RED (APR-OBS-001 R-2)"
      - "|rows| ≤ 10 and ev_rank is a permutation of 1..|rows|"
      - "a falsifier that is not a list of {ids, …} claims is RED: a bare id is trusted, never verified"
      - "a claim that is neither on_main nor staged_at origin/… is RED"
      - "an id its claimed file does not define (at the ref for on_main, at the branch for staged) is RED"
      - "a staged claim whose ids the ref already defines, every one, is RED: that claim is on main"
      - "a descending id range is RED"
      - "falsifier renders falsifier* while any claim is staged; READY needs every claim on main"
      - "in YAML only an id: value defines an id, so a comment or a rule's prose defines nothing; elsewhere an id is a whole token, so XF-11 and F-110 do not define F-11"
      - "rows render in ev_rank order, whatever order the file lists them"
      - "a RED names the first fault: on_main claims, then staged claims, then falsifier claims, each in the order spec, contract, baseline"
      - "an empty staged_marker names nothing, so it reads as no marker; a staged claim with no staged_path is checked at its path"
falsification_tests:
  - id: FALSIFY-LADOR-001
    rule: "a planted row with contract=null renders NOT READY (contract) only"
    fixture: scripts/lookahead/fixtures/planted.yaml#NO-CONTRACT
    cases: [planted]
    prediction: "The planted NO-CONTRACT row renders `NOT READY (contract)`, with contract as the only field named, and top10_ready does not count it."
    test: "dor_check.py --self-test, case NO-CONTRACT (external check, run by hand; Rust port pending)"
    if_fails: "a row without a contract counts toward top10_ready"
  - id: FALSIFY-LADOR-002
    rule: "a planted on_main claim to an absent path exits 2"
    fixture: scripts/lookahead/fixtures/false-claim.yaml
    cases: [false-claim]
    prediction: "The renderer exits 2 on false-claim.yaml."
    test: "dor_check.py --self-test, case false-claim.yaml (external check, run by hand; Rust port pending)"
    if_fails: "the ledger can claim artifacts that are not on main"
  - id: FALSIFY-LADOR-003
    rule: "an empty ledger exits 2"
    fixture: scripts/lookahead/fixtures/empty.yaml
    cases: [empty]
    prediction: "The renderer exits 2 on empty.yaml and never prints a 0/0 ready count."
    test: "dor_check.py --self-test, case empty.yaml (external check, run by hand; Rust port pending)"
    if_fails: "an empty ledger reads as 0/0 ready instead of RED"
  - id: FALSIFY-LADOR-004
    rule: "control row with all five present renders READY"
    fixture: scripts/lookahead/fixtures/planted.yaml#ALL-PRESENT
    cases: [planted]
    prediction: "The planted ALL-PRESENT row renders READY and counts toward top10_ready."
    test: "dor_check.py --self-test, case ALL-PRESENT (external check, run by hand; Rust port pending)"
    if_fails: "the checker is vacuously NOT READY"
  - id: FALSIFY-LADOR-005
    rule: "a staged claim to a path absent at its branch exits 2"
    fixture: scripts/lookahead/fixtures/false-staged.yaml
    cases: [false-staged]
    prediction: "The renderer exits 2 on false-staged.yaml."
    test: "dor_check.py --self-test, case false-staged.yaml (external check, run by hand; Rust port pending)"
    if_fails: "the ledger can claim branch work that does not exist"
  - id: FALSIFY-LADOR-006
    rule: "a staged claim on a path the ref already has, with no staged_marker, exits 2"
    fixture: scripts/lookahead/fixtures/vacuous-staged.yaml
    cases: [vacuous-staged]
    prediction: "The renderer exits 2 on vacuous-staged.yaml."
    test: "dor_check.py --self-test, case vacuous-staged.yaml (external check, run by hand; Rust port pending)"
    if_fails: "a branch that merely contains a file main already has reads as staging a change to it"
  - id: FALSIFY-LADOR-007
    rule: "a staged_marker absent at the branch exits 2"
    fixture: scripts/lookahead/fixtures/absent-marker.yaml
    cases: [absent-marker]
    prediction: "The renderer exits 2 on absent-marker.yaml."
    test: "dor_check.py --self-test, case absent-marker.yaml (external check, run by hand; Rust port pending)"
    if_fails: "a staged claim can name text the branch does not carry"
  - id: FALSIFY-LADOR-008
    rule: "a staged_marker the ref already carries exits 2"
    fixture: scripts/lookahead/fixtures/marker-on-ref.yaml
    cases: [marker-on-ref]
    prediction: "The renderer exits 2 on marker-on-ref.yaml."
    test: "dor_check.py --self-test, case marker-on-ref.yaml (external check, run by hand; Rust port pending)"
    if_fails: "content already on main reads as staged instead of on_main"
  - id: FALSIFY-LADOR-009
    rule: "control: a marker the branch adds and the ref lacks is accepted"
    fixture: scripts/lookahead/dor_check.py#unit_checks
    cases: [staged-controls]
    prediction: "A staged claim whose staged_marker the branch adds and the ref lacks is accepted."
    test: "dor_check.py --self-test, case unit_checks (external check, run by hand; Rust port pending)"
    if_fails: "every marker claim is RED, so the staged rule is vacuously strict"
  - id: FALSIFY-LADOR-010
    rule: "control: empty.yaml checked as a marker fault is flagged as RED for the wrong reason"
    fixture: scripts/lookahead/dor_check.py#expect_red
    prediction: "Run as the marker-fault case, empty.yaml is reported as RED for another reason, so it does not count as that falsifier firing."
    test: "dor_check.py --self-test, case expect_red (external check, run by hand; Rust port pending)"
    if_fails: "a planted ledger that is RED for another reason counts as its own falsifier firing"
  - id: FALSIFY-LADOR-011
    rule: "a falsifier given as a bare id list exits 2"
    fixture: scripts/lookahead/fixtures/bare-falsifier.yaml
    cases: [bare-falsifier]
    prediction: "The renderer exits 2 on bare-falsifier.yaml."
    test: "dor_check.py --self-test, case bare-falsifier.yaml (external check, run by hand; Rust port pending)"
    if_fails: "a falsifier id is trusted, never verified"
  - id: FALSIFY-LADOR-012
    rule: "an on_main claim naming an id its file at the ref does not define exits 2"
    fixture: scripts/lookahead/fixtures/false-falsifier.yaml
    cases: [false-falsifier]
    prediction: "The renderer exits 2 on false-falsifier.yaml."
    test: "dor_check.py --self-test, case false-falsifier.yaml (external check, run by hand; Rust port pending)"
    if_fails: "the ledger can cite falsifiers main does not have"
  - id: FALSIFY-LADOR-013
    rule: "a staged claim naming an id its file at the branch does not define exits 2"
    fixture: scripts/lookahead/fixtures/absent-falsifier.yaml
    cases: [absent-falsifier]
    prediction: "The renderer exits 2 on absent-falsifier.yaml."
    test: "dor_check.py --self-test, case absent-falsifier.yaml (external check, run by hand; Rust port pending)"
    if_fails: "the ledger can cite branch falsifiers that do not exist"
  - id: FALSIFY-LADOR-014
    rule: "a staged claim whose ids the ref already defines exits 2"
    fixture: scripts/lookahead/fixtures/falsifier-on-ref.yaml
    cases: [falsifier-on-ref]
    prediction: "The renderer exits 2 on falsifier-on-ref.yaml."
    test: "dor_check.py --self-test, case falsifier-on-ref.yaml (external check, run by hand; Rust port pending)"
    if_fails: "falsifiers already on main read as staged"
  - id: FALSIFY-LADOR-015
    rule: "a claim with neither on_main nor staged_at exits 2"
    fixture: scripts/lookahead/fixtures/unanchored-falsifier.yaml
    cases: [unanchored-falsifier]
    prediction: "The renderer exits 2 on unanchored-falsifier.yaml."
    test: "dor_check.py --self-test, case unanchored-falsifier.yaml (external check, run by hand; Rust port pending)"
    if_fails: "an unanchored claim is checked nowhere"
  - id: FALSIFY-LADOR-016
    rule: "a planted row with falsifier=null renders NOT READY (falsifier) only"
    fixture: scripts/lookahead/fixtures/planted.yaml#NO-FALSIFIER
    cases: [planted]
    prediction: "The planted NO-FALSIFIER row renders `NOT READY (falsifier)`, with falsifier as the only field named, and top10_ready does not count it."
    test: "dor_check.py --self-test, case NO-FALSIFIER (external check, run by hand; Rust port pending)"
    if_fails: "a row without a falsifier counts toward top10_ready"
  - id: FALSIFY-LADOR-017
    rule: "XF-11 and F-110 do not define F-11 outside YAML"
    fixture: scripts/lookahead/dor_check.py#unit_checks
    prediction: "A claim citing F-11 against a non-YAML file whose text holds only XF-11 and F-110 is RED."
    test: "dor_check.py --self-test, case unit_checks (external check, run by hand; Rust port pending)"
    if_fails: "an id read as a substring of a longer id passes"
  - id: FALSIFY-LADOR-018
    rule: "a YAML comment or a rule's prose mentioning an id does not define it"
    fixture: scripts/lookahead/dor_check.py#unit_checks
    prediction: "A claim citing an id that a YAML file names only in a comment or in a rule's prose is RED."
    test: "dor_check.py --self-test, case unit_checks (external check, run by hand; Rust port pending)"
    if_fails: "a retired or merely mentioned id reads as defined"
  - id: FALSIFY-LADOR-019
    rule: "a descending id range exits 2"
    fixture: scripts/lookahead/dor_check.py#unit_checks
    prediction: "The renderer exits 2 on a falsifier claim with a descending id range (lo > hi)."
    test: "dor_check.py --self-test, case unit_checks (external check, run by hand; Rust port pending)"
    if_fails: "a reversed range cites no ids and passes vacuously"
  - id: FALSIFY-LADOR-020
    rule: "a row whose only falsifier claim is staged renders falsifier*, never READY"
    fixture: scripts/lookahead/dor_check.py#unit_checks
    prediction: "A row whose only falsifier claim is staged renders `falsifier*` and stays NOT READY."
    test: "dor_check.py --self-test, case unit_checks (external check, run by hand; Rust port pending)"
    if_fails: "a row whose falsifiers exist only on a branch counts toward top10_ready"
  - id: FALSIFY-LADOR-021
    rule: "controls: an exact token outside YAML, a YAML id under a key other than falsification_tests, ids the branch adds and the ref lacks, and an ascending range are all accepted"
    fixture: scripts/lookahead/dor_check.py#unit_checks
    prediction: "All four controls are accepted, so no real citation of those shapes is RED."
    test: "dor_check.py --self-test, case unit_checks (external check, run by hand; Rust port pending)"
    if_fails: "the id rule is vacuously strict and every real citation is RED"
  - id: FALSIFY-LADOR-022
    rule: "a blank ledger file, or one under another schema, exits 2"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [blank, wrong-schema]
    prediction: "Both exit 2 with 'RED: schema is not lookahead-dor-v1'. wrong-schema's one row is READY, so the schema check alone decides it."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases blank, wrong-schema. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/blank.yaml, dor/wrong-schema.yaml under scripts/lookahead/fixtures/."
    if_fails: "A ledger under another schema renders as a DoR ledger, or a blank file crashes with a traceback (exit 1) instead of RED."
  - id: FALSIFY-LADOR-023
    rule: "a row with no id, a null id, or an id another row has exits 2"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [no-id, null-id, dup-id]
    prediction: "All three exit 2 with 'RED: row ids missing or duplicated'. null-id's row also carries a false spec claim, so a rule that let a null id through would print that claim's RED, naming None."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases no-id, null-id, dup-id. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/dup-id.yaml, dor/no-id.yaml, dor/null-id.yaml under scripts/lookahead/fixtures/."
    if_fails: "Two rows share an id and both render, or a row with no id crashes the renderer instead of RED."
  - id: FALSIFY-LADOR-024
    rule: "ev_rank must be a permutation of 1..n, a listing out of order is still one, and rows render in ev_rank order"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [bad-rank, ten]
    prediction: "bad-rank (ranks 1 and 3) exits 2 with 'RED: ev_rank must be a permutation of 1..len(rows)'. ten lists its rows out of order and renders T01 to T10 in rank order, each NOT READY on all five fields, top10_ready 0/10, exit 0."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases bad-rank, ten. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/bad-rank.yaml, dor/ten.yaml under scripts/lookahead/fixtures/."
    if_fails: "A gap in the ranks renders, an out-of-order listing is RED, or the report lists rows in file order, so its ranking is not the ledger's."
  - id: FALSIFY-LADOR-025
    rule: "a ledger holds at most ten rows"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [eleven, ten]
    prediction: "eleven exits 2 with 'RED: more than 10 rows'. ten, exactly at the bound, renders."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases eleven, ten. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/eleven.yaml, dor/ten.yaml under scripts/lookahead/fixtures/."
    if_fails: "An eleventh row renders, or a full ledger of ten is RED."
  - id: FALSIFY-LADOR-026
    rule: "an on_main claim to an absent path exits 2 for the spec and for the baseline, not only for the contract"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [false-claim-spec, false-claim-baseline]
    prediction: "false-claim-spec exits 2 with 'RED: FALSE-CLAIM-SPEC: spec claims on_main but 'docs/specifications/no-such-spec-planted.md' is absent at origin/main', and false-claim-baseline with the same line for its baseline 'evidence/no-such-baseline-planted.json'."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases false-claim-spec, false-claim-baseline. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/false-claim-baseline.yaml, dor/false-claim-spec.yaml under scripts/lookahead/fixtures/."
    if_fails: "The check covers the contract (FALSIFY-LADOR-002) and skips a spec or baseline claim, which then counts as present."
  - id: FALSIFY-LADOR-027
    rule: "a staged claim to a path its branch lacks exits 2 for the spec and for the baseline"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [false-staged-spec, false-staged-baseline]
    prediction: "false-staged-spec exits 2 with 'RED: FALSE-STAGED-SPEC: spec claims staged at origin/main but 'docs/lookahead/no-such-spec-planted.md' is absent there', and false-staged-baseline with the same line for 'evidence/no-such-baseline-planted.json'."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases false-staged-spec, false-staged-baseline. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/false-staged-baseline.yaml, dor/false-staged-spec.yaml under scripts/lookahead/fixtures/."
    if_fails: "A spec or baseline staged on a branch that lacks it renders spec* or baseline*."
  - id: FALSIFY-LADOR-028
    rule: "a RED names the first fault: on_main claims are checked before staged claims, staged claims before falsifier claims, and the spec before the contract before the baseline"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [two-faults, order-on-main-first, order-staged-first]
    prediction: "two-faults (a false spec and a false contract) names the spec. order-on-main-first (a false staged contract and a false on_main baseline) names the baseline. order-staged-first (a false staged contract and a falsifier id its file does not define) names the contract."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases two-faults, order-on-main-first, order-staged-first. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/order-on-main-first.yaml, dor/order-staged-first.yaml, dor/two-faults.yaml under scripts/lookahead/fixtures/."
    if_fails: "The RED names a later fault, so the line a reader acts on depends on an order the contract does not state."
  - id: FALSIFY-LADOR-029
    rule: "a staged claim with no staged_path is checked at its path, for a field claim and for a falsifier claim"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [staged-path-key, staged-falsifier-path-key]
    prediction: "staged-path-key exits 2 for naming no staged_marker on a path the ref has ('in 'docs/specifications/APR-EPIC-001-themed-epics-and-issue-cap.md', but the path already exists at the ref; name the text the branch adds as staged_marker'), not for a missing path. staged-falsifier-path-key exits 2 with 'falsifier claims staged at origin/main but 'contracts/continuous-batching-v1.yaml' at the ref already defines every id, so the claim is on main'."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases staged-path-key, staged-falsifier-path-key. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/staged-falsifier-path-key.yaml, dor/staged-path-key.yaml under scripts/lookahead/fixtures/."
    if_fails: "A claim that names its file under path: reads as naming no file, and is RED for a missing path or never checked."
  - id: FALSIFY-LADOR-030
    rule: "a falsifier claim holds a non-empty list of ids, and every entry of the falsifier is such a claim"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [ids-string, ids-empty, mixed-bare]
    prediction: "ids-string (ids is one string), ids-empty (ids: []) and mixed-bare (a claim followed by a bare id) each exit 2 with 'falsifier must be a list of {ids, path} claims; a bare id is trusted, never verified:' followed by the falsifier value."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, cases ids-string, ids-empty, mixed-bare. Unpatched: dor_check.py <ledger> --ref origin/main by hand, for each of dor/ids-empty.yaml, dor/ids-string.yaml, dor/mixed-bare.yaml under scripts/lookahead/fixtures/."
    if_fails: "A string's characters or an empty list are read as ids and verify nothing, or one well-formed claim lets a bare id through unverified."
  - id: FALSIFY-LADOR-031
    rule: "a claim staged at a local branch name is unanchored"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [local-branch]
    prediction: "local-branch exits 2 with 'RED: LOCAL-BRANCH: falsifier claim is neither on_main nor staged_at origin/...'."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, case local-branch. Unpatched: dor_check.py scripts/lookahead/fixtures/dor/local-branch.yaml --ref origin/main, by hand."
    if_fails: "A claim staged at a branch only this clone has is checked against local refs and can pass."
  - id: FALSIFY-LADOR-032
    rule: "controls: at the pinned ref R0 each staged shape holds and renders with *"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [staged-controls]
    prediction: "At R0 = 82d92379c732b841ae883e6458025b73e3c48ae2, where the APR-EPIC-001 spec is absent and continuous-batching-v1.yaml lacks FALSIFY-CB-010 (origin/main has both; main is protected, so R0 does not move), staged-controls renders seven rows at exit 0, top10_ready 0/7. A new file, a new file with a marker, and a marker in an existing file render contract*. Staged ids, staged ids in a new file, and ids of which one is new render falsifier*. A falsifier with one on_main and one staged claim renders falsifier*, and its on_main contract counts."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, case staged-controls. Unpatched: dor_check.py scripts/lookahead/fixtures/dor/staged-controls.yaml --ref 82d92379c7, by hand."
    if_fails: "A staged rule is vacuously strict, so valid branch work is RED, or a staged field renders without its *."
  - id: FALSIFY-LADOR-033
    rule: "a new file does not excuse a staged_marker the branch lacks"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [new-file-absent-marker]
    prediction: "At R0, new-file-absent-marker exits 2 with 'RED: NEW-FILE-ABSENT-MARKER: contract claims staged at origin/main in 'docs/specifications/APR-EPIC-001-themed-epics-and-issue-cap.md', but staged_marker 'planted text that the file does not contain' is absent at the branch'."
    test: "dor_check.py --self-test with docs/lookahead/0.71-dor-selftest-cases.patch applied, case new-file-absent-marker. Unpatched: dor_check.py scripts/lookahead/fixtures/dor/new-file-absent-marker.yaml --ref 82d92379c7, by hand."
    if_fails: "A claim on a new file can name text the branch does not carry."
  - id: FALSIFY-LADOR-034
    rule: "an empty staged_marker names nothing, so it reads as no marker"
    fixture: scripts/lookahead/fixtures/dor/cases.json
    cases: [empty-marker]
    prediction: "empty-marker exits 2 with 'RED: EMPTY-MARKER: contract claims staged at origin/main in 'docs/specifications/APR-EPIC-001-themed-epics-and-issue-cap.md', but the path already exists at the ref; name the text the branch adds as staged_marker', not with 'staged_marker '' is already at the ref'."
