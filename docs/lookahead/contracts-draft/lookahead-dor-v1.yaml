  method: "One exact-once string replacement per mutant on scripts/lookahead/dor_check.py, executed in a fresh namespace beside the fixture tree; the checker file is never edited. A crash counts as a kill. Each case also ran alone per mutant, because in one pass the first case that crashes hides every later case."
  mutants: 86
  staged_self_test: {killed: 34, killed_by_crash: 12, survived: 52}
