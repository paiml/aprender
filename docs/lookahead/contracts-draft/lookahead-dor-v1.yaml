  table_controls: "Seven edits to the table, each of which must make it fail: a RED line changed, ten's rows reordered, planted's ready count changed, an exit code changed, a unit's want changed, the null-id row dropped (a fixture no row names) and an empty table. All seven fail."
verification: "External check, by hand: python3 scripts/lookahead/dor_check.py --self-test --ref origin/main  # 2026-10-04 13:43Z: self-test: ok (17 falsifiers fire, 7 controls pass). The same tree with docs/lookahead/0.71-dor-selftest-cases.patch applied in a scratch copy: self-test: ok (17 falsifiers fire, 7 controls pass, 56 cases hold), with --ref origin/main and with the default ref. The 0.71 ledger renders at rc 0, top10_ready 0/10, the same with and without the patch. Mutants: mutation_record. Earlier: 2026-10-04 10:56Z: ok (17 falsifiers fire, 7 controls pass). 2026-10-03 19:35Z: ok (17 falsifiers fire, 7 controls pass). 005-010: 6 mutants of the staged rule, all killed. 011-021: 15 mutants of the falsifier rule and 3 of the claim checks it moved (on_main paths, staged paths, nested YAML ids), all 18 killed (rc=2)."
