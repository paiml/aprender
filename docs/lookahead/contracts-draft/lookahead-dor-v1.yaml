qa_gate:
  id: F-LADOR-QA-001
  name: The DoR ledger renders only verified claims
  description: >
    Every planted falsifier fires for its own reason, and every control is accepted. The case
    table scripts/lookahead/fixtures/dor/cases.json has 56 rows. 40 run the CLI on a fixture ledger
    and pin its exit code with the whole RED line, or every row's missing fields in rank order
    and the top10_ready count. 16 call one rule directly. Every row belongs to one of
    FALSIFY-LADOR-001..009, 011..016 or 022..039. A set rule has one case per member
    (spec, contract and baseline; each missing field), each check order has a case, and each
    boundary has one (ten rows, a range of one id). As staged, the self-test runs the twelve
    original fixtures and nine unit checks and matches a RED reason by substring. With
    docs/lookahead/0.71-dor-selftest-cases.patch applied it also runs the table, compares each
    verdict exactly, and is RED on a fixture that no row names or on an empty table. Today it is
    an external check, run by hand on look-ahead branches. Where its Rust port lives (a pv or
    apr subcommand, or a test over the fixtures) is an open point.
  checks:
    - planted_falsifier_fires_for_its_own_reason
    - control_accepted
    - every_fixture_named_by_a_case
    - case_table_not_empty
    - ledger_renders_without_red
  pass_criteria: "As staged, dor_check.py --self-test --ref origin/main prints 'self-test: ok (17 falsifiers fire, 7 controls pass)'. With the patch applied it prints 'self-test: ok (17 falsifiers fire, 7 controls pass, 56 cases hold)'. The train's ledger renders at rc 0 against origin/main."
  falsification: "Measured 2026-10-04 with 86 in-memory mutants, one per rule, per set member, per check order and per boundary (mutation_record). The staged self-test kills 34, 12 of them by a crash, and 52 survive. The table kills 84: 80 by a wrong verdict, and 4 only by a crash that every input reaching the mutated line triggers (findings F5). The patched self-test kills the same 84. Two survive. lookahead-hyphen survives because a case would pin the token asymmetry instead of fixing it (findings F1). on-main-ignores-path is equivalent (findings F4). Seven edits to the table each make it fail, so the comparison is not vacuous."
findings:
  - id: F1
    summary: "Outside YAML a hyphen after an id counts as a token boundary, though a hyphen before it does not, so 'F-11-b' defines F-11."
    evidence: "Measured 2026-10-04 on the staged checker: absent_ids finds F-11 defined in '| F-11-b |' and F-001 defined in 'see F-001-005', but F-11 absent in '| a-F-11 |'. The lookbehind class in absent_ids excludes '-' and the lookahead class does not. Mutant lookahead-hyphen (the same class on both sides) survives the table, because a case pinning today's behaviour would freeze the defect. The 0.71 ledger renders identically under the symmetric class."
    proposal: "PROPOSE for the Rust port: the same class on both sides, with the case 'F-11-b does not define F-11'."
  - id: F2
    summary: "The staged self-test calls evaluate(), never main() or run(), so the exit codes and the ready count are untested."
    evidence: "Mutants red-exit-1 (RED exits 1), require-ready-ignored, require-ready-le (ready <= rows) and ready-count-inverted all survive it. The table runs main() on each fixture and compares the exit code with the RED line, or with every row and the top10_ready count. It kills all four (FALSIFY-LADOR-035)."
    proposal: "The Rust port's cases drive the CLI entry point, not only the library calls."
  - id: F3
    summary: "The original fixtures plant one member of each field set and no ledger with two faults, and the self-test matches a RED by substring."
    evidence: "Seven set-member mutants survive the staged self-test: claims-no-spec, claims-no-baseline, staged-claims-no-spec, staged-claims-no-baseline, spec-always, baseline-always and owner-always. Only the contract was planted for the claim checks, and only the contract and the falsifier for missing fields. Three order mutants survive too: first-fault-last, order-staged-before-on-main and order-falsifier-before-staged. A substring such as 'claims on_main' matches whichever field fired. FALSIFY-LADOR-026..028 and 039 plant each member and each order, and the table compares the whole RED line."
    proposal: "The Rust port compares whole verdicts, with one case per set member and per check order."
  - id: F4
    summary: "Mutant on-main-ignores-path is equivalent: no ledger reaches on_main() with an on_main claim that has no path."
    evidence: "evaluate() runs verify_claims() before missing_fields() on every row, and verify_claims() is RED on every on_main claim without a path: on_main_faults() for the spec, contract and baseline, on_main_ids_fault() for a falsifier claim. So on_main()'s path test never decides a verdict. Only a direct call on a row the CLI cannot produce tells the two apart."
    proposal: "PROPOSE: in the Rust port an on_main claim carries its path in its type, so the redundant test has no counterpart."
  - id: F5
    summary: "Four mutants die only by a crash, and no input makes them print a wrong verdict instead."
    evidence: "Each removes a guard, and every input that reaches the mutated line then raises. non-dict-crash: any ledger that is not a mapping (AttributeError). on-main-non-dict-crash: any absent field (AttributeError). staged-ids-new-file-unguarded: staged ids in a file the ref lacks (TypeError, or AttributeError for YAML). staged-new-file-at-ref-none: a staged_marker the branch carries in a file the ref lacks (TypeError). A crash exits 1 with a traceback, never 0, so it counts as a kill. Two more died only by a crash in the first 55-row table. null-id now also carries a false claim, so ids-unique-no-none prints 'None: spec claims on_main ...', and empty-marker plants staged_marker '', which marker-none-ok passes to the text checks. Both now die by a wrong verdict."
    proposal: "PROPOSE: typed rows in the Rust port (a ledger is a mapping, an absent field or file is an Option) make these states parse errors, so they need no case."
