# DRAFT (look-ahead, branch-only). EXT-24b. Moves into contracts/ when EXT-24b is minted.
# Checker: scripts/lookahead/crux_gap_check.py, an external check run by hand. No build,
# test, gate or CI job invokes it. Landing it means a Rust rule in
# crates/aprender-contracts/src/schema/ (its own ticket). Before this file moves into
# contracts/, its self-test cases port to Rust with fixtures/crux_gap/ as data
# (fixtures/crux_gap/cases.json is the case table).
metadata:
  id: crux-comparison-v1
  kind: schema
  version: "0.3.0-draft"
  status: draft
  description: >
    Optional `crux_comparison:` block on a contracts/crux-*.yaml contract. It holds an
    EXT-001 §10 surface's arms, metric and R-15 gap delta. It reuses gap_effect
    (closes|widens|none, PR-REVIEW-SKILL-002 §3.C) and the comparator block
    (§3.C.1) instead of minting new vocabulary. The checker runs only on a contract
    for a §10 surface; there, a missing block or an empty arm list is RED (G0).
  references:
  - 'docs/specifications/PR-REVIEW-SKILL-002-v2.md §3.C, §3.C.1 (origin/main)'
  - 'docs/specifications/EXT-001-dogfood-model-lifecycle.md R-15..R-17, S-12..S-14, §10 (staged on la-71/4487-obs-00, not yet on main)'
  - 'crates/aprender-contracts/src/schema/validator.rs CRUX_COMPETITORS (G8; a self-test run reads fixtures/crux_gap/registry.json instead)'
equations:
  delta:
    formula: 'gap_effect = none if prev undefined or now = prev; widens if now is worse than prev under metric.direction; else closes'
  claim:
    formula: 'gap_effect ∈ {closes, widens} ⇒ ∀ arm: comparator complete ∧ comparator ≠ unrunnable-hermetically'
rules: [G0 block+arms present, G1 vocabulary, G2 comparator complete, G3 unrunnable report-only, G4 conceded no speed, G5 like-for-like quant, G6 delta agrees, G7 pin sha256, G8 registered competitor]
falsification_tests:
  - id: FALSIFY-CRUXGAP-001
    rule: "control: a closing gap with full, pinned, like-for-like arms is accepted"
    fixture: fixtures/crux_gap/control-closes.yaml
    expect: 0
    prediction: "Three registered arms, each with a full comparator and a pin sha256 (the UD-Q4_K_XL arm labelled separate_arm), and kl_divergence_vs_bf16 (lower is better) going from 0.02 to 0.015 with gap_effect closes: the checker exits 0 and prints no violation."
    test: "crux_gap_check.py --self-test, case control-closes"
    if_fails: "A rule fires on a conforming block: the comparator, pin, quant or delta check rejects a clean arm."
  - id: FALSIFY-CRUXGAP-002
    rule: "control: a first record, with no previous gap, is gap_effect none (R-15)"
    fixture: fixtures/crux_gap/control-first-record-none.yaml
    expect: 0
    prediction: "gap {now: 0.015} with no previous value, and gap_effect none: the checker exits 0. The first record only sets the baseline."
    test: "crux_gap_check.py --self-test, case control-first-record-none"
    if_fails: "G6 reads a missing previous gap as a number, or wants closes or widens on a first record."
  - id: FALSIFY-CRUXGAP-003
    rule: "control: an unrunnable-hermetically arm is allowed while the block claims nothing (S-12)"
    fixture: fixtures/crux_gap/control-unrunnable-report-only.yaml
    expect: 0
    prediction: "A fourth arm, wandb, has comparator unrunnable-hermetically and no pin; the gap is unchanged (0.02 to 0.02) and gap_effect is none. The checker exits 0: the arm is report-only, G3 does not fire, and G7 does not ask it for a pin."
    test: "crux_gap_check.py --self-test, case control-unrunnable-report-only"
    if_fails: "G3 fires without a claim, or G7 asks an unrunnable arm for a pin sha256."
  - id: FALSIFY-CRUXGAP-004
    rule: "G1: gap_effect is one of closes, widens, none (PR-REVIEW-SKILL-002 §3.C)"
    fixture: fixtures/crux_gap/G1-vocab.yaml
    expect: 2
    prediction: "gap_effect improves: the checker exits 2 with one G1 line that names 'improves' and lists the three allowed values, and no other line."
    test: "crux_gap_check.py --self-test, case G1-vocab"
    if_fails: "The vocabulary is not checked, and an unknown effect passes every other rule unseen: G6 skips any effect outside the vocabulary."
  - id: FALSIFY-CRUXGAP-005
    rule: "G2: closes or widens needs a full comparator on every arm (§3.C.1)"
    fixture: fixtures/crux_gap/G2-gap-effect-no-comparator.yaml
    expect: 2
    prediction: "gap_effect closes, and the bartowski arm has no comparator: the checker exits 2 with one line, 'G2 bartowski: gap_effect closes without a full comparator', followed by the five field names, and no other line."
    test: "crux_gap_check.py --self-test, case G2-gap-effect-no-comparator"
    if_fails: "G2 accepts an arm with no comparator, so a claim rests on an arm nobody ran."
  - id: FALSIFY-CRUXGAP-006
    rule: "G2: a comparator missing one field is not full"
    fixture: fixtures/crux_gap/G2-partial-comparator.yaml
    expect: 2
    prediction: "The unsloth arm's comparator lacks env_sha256 and has the other four fields: the checker exits 2 with one G2 line for unsloth and no other line."
    test: "crux_gap_check.py --self-test, case G2-partial-comparator (the other four fields: FALSIFY-CRUXGAP-018 to -021)"
    if_fails: "comparator_full wants some field, not all five, or does not check env_sha256."
  - id: FALSIFY-CRUXGAP-007
    rule: "G3: an unrunnable-hermetically arm is report-only and backs no claim (S-12)"
    fixture: fixtures/crux_gap/G3-unrunnable-claims.yaml
    expect: 2
    prediction: "The wandb arm is unrunnable-hermetically in a block that says gap_effect closes: the checker exits 2 with the single line 'G3 wandb: unrunnable-hermetically arm carries gap_effect closes'."
    test: "crux_gap_check.py --self-test, case G3-unrunnable-claims"
    if_fails: "G3 does not fire, so a claim cites an arm that cannot be pinned, which S-12 forbids."
  - id: FALSIFY-CRUXGAP-008
    rule: "G4: a conceded arm gets no speed gate (R-16, S-13)"
    fixture: fixtures/crux_gap/G4-conceded-speed.yaml
    expect: 2
    prediction: "The unsloth arm is conceded and the metric is train_step_s: the checker exits 2 with the single line 'G4 unsloth: conceded arm on speed metric train_step_s'. The two arms that are not conceded get no G4 line."
    test: "crux_gap_check.py --self-test, case G4-conceded-speed (the other five speed metrics: FALSIFY-CRUXGAP-022 to -026; the conceded-only filter: FALSIFY-CRUXGAP-017)"
    if_fails: "G4 lets a conceded arm race on speed, or flags every arm of a speed metric."
  - id: FALSIFY-CRUXGAP-009
    rule: "G5: an arm whose quant differs from the subject's is a labelled separate arm (R-17, S-14)"
    fixture: fixtures/crux_gap/G5-quant-mismatch-unlabelled.yaml
    expect: 2
    prediction: "The unsloth UD-Q4_K_XL arm, against subject quant Q4_K_M, has no separate_arm label: the checker exits 2 with the single line 'G5 unsloth: quant UD-Q4_K_XL vs subject Q4_K_M, not labelled separate_arm'."
    test: "crux_gap_check.py --self-test, case G5-quant-mismatch-unlabelled"
    if_fails: "G5 compares unlike quants as one arm, which S-14 refuses."
  - id: FALSIFY-CRUXGAP-010
    rule: "G6: gap_effect agrees with the previous-to-now gap under the metric's direction (R-15)"
    fixture: fixtures/crux_gap/G6-says-closes-but-widened.yaml
    expect: 2
    prediction: "kl_divergence_vs_bf16 (lower is better) goes from 0.02 to 0.03 and gap_effect says closes: the checker exits 2 with the single line 'G6 gap_effect closes but gap 0.02->0.03 (lower-is-better) is widens'."
    test: "crux_gap_check.py --self-test, case G6-says-closes-but-widened"
    if_fails: "G6 trusts the stated effect, so a widened gap reads as closing and never blocks."
  - id: FALSIFY-CRUXGAP-011
    rule: "control: on a higher-is-better metric, a rising value closes the gap"
    fixture: fixtures/crux_gap/G6-control-higher-is-better.yaml
    expect: 0
    prediction: "top1_agreement (higher is better) goes from 0.95 to 0.97 and gap_effect says closes: the checker exits 0."
    test: "crux_gap_check.py --self-test, case G6-control-higher-is-better"
    if_fails: "G6 ignores metric.direction and reads every metric as lower-is-better."
  - id: FALSIFY-CRUXGAP-012
    rule: "G6: on a higher-is-better metric, a falling value widens the gap"
    fixture: fixtures/crux_gap/G6-higher-is-better-flipped.yaml
    expect: 2
    prediction: "top1_agreement (higher is better) goes from 0.95 to 0.93 and gap_effect says closes: the checker exits 2 with the single line 'G6 gap_effect closes but gap 0.95->0.93 (higher-is-better) is widens'."
    test: "crux_gap_check.py --self-test, case G6-higher-is-better-flipped"
    if_fails: "The direction test is inverted for a higher-is-better metric."
  - id: FALSIFY-CRUXGAP-013
    rule: "G7: a runnable arm pins its artifact sha256"
    fixture: fixtures/crux_gap/G7-no-pin.yaml
    expect: 2
    prediction: "The bartowski arm has a full comparator but no pin.sha256: the checker exits 2 with the single line 'G7 bartowski: runnable arm without pin.sha256'."
    test: "crux_gap_check.py --self-test, case G7-no-pin"
    if_fails: "G7 accepts an unpinned runnable arm, so the artifact under the claim can change."
  - id: FALSIFY-CRUXGAP-014
    rule: "G8: every arm's competitor is registered (the registry B1 reads)"
    fixture: fixtures/crux_gap/G8-unregistered.yaml
    expect: 2
    prediction: "One arm names mistral_rs, which fixtures/crux_gap/registry.json does not list: the checker exits 2 with the single line 'G8 mistral_rs: competitor not registered'."
    test: "crux_gap_check.py --self-test, case G8-unregistered"
    if_fails: "G8 reads a registry other than the one passed, or skips a competitor it does not find."
  - id: FALSIFY-CRUXGAP-015
    rule: "G0: a surface contract with no crux_comparison block is RED, not vacuously green"
    fixture: fixtures/crux_gap/G0-no-block.yaml
    expect: 2
    prediction: "A contract with metadata only: the checker exits 2 with the single line 'G0 no crux_comparison block'."
    test: "crux_gap_check.py --self-test, case G0-no-block"
    if_fails: "A missing block reads as an empty one, and every rule passes vacuously."
  - id: FALSIFY-CRUXGAP-016
    rule: "G0: a block with no arms is RED (vacuous)"
    fixture: fixtures/crux_gap/G0-no-arms.yaml
    expect: 2
    prediction: "A block with arms [] and gap_effect closes: the checker exits 2 with the single line 'G0 crux_comparison has no arms (vacuous)'."
    test: "crux_gap_check.py --self-test, case G0-no-arms"
    if_fails: "The per-arm rules pass vacuously over no arms, so a claim stands with nothing measured."
  - id: FALSIFY-CRUXGAP-017
    rule: "control: a speed metric with no conceded arm is accepted (G4 flags conceded arms only)"
    fixture: fixtures/crux_gap/control-speed-not-conceded.yaml
    expect: 0
    prediction: "The control-closes arms, none conceded, with metric ttft_ms (lower is better) going from 0.02 to 0.015 and gap_effect closes: the checker exits 0 and prints no violation."
    test: "crux_gap_check.py --self-test, case control-speed-not-conceded"
    if_fails: "G4 flags every arm of a speed metric, not only the conceded ones, so no speed comparison can pass."
  - id: FALSIFY-CRUXGAP-018
    rule: "G2: a comparator without command is not full"
    fixture: fixtures/crux_gap/G2-comparator-no-command.yaml
    expect: 2
    prediction: "The unsloth arm's comparator lacks command and has the other four fields: the checker exits 2 with one G2 line for unsloth and no other line."
    test: "crux_gap_check.py --self-test, case G2-comparator-no-command"
    if_fails: "command is not a required comparator field, so a claim can rest on a run with no recorded command line."
  - id: FALSIFY-CRUXGAP-019
    rule: "G2: a comparator without version is not full"
    fixture: fixtures/crux_gap/G2-comparator-no-version.yaml
    expect: 2
    prediction: "The unsloth arm's comparator lacks version and has the other four fields: the checker exits 2 with one G2 line for unsloth and no other line."
    test: "crux_gap_check.py --self-test, case G2-comparator-no-version"
    if_fails: "version is not a required comparator field, so the tool build behind a measured number goes unrecorded."
  - id: FALSIFY-CRUXGAP-020
    rule: "G2: a comparator without artifact_sha256 is not full"
    fixture: fixtures/crux_gap/G2-comparator-no-artifact-sha256.yaml
    expect: 2
    prediction: "The unsloth arm's comparator lacks artifact_sha256 and has the other four fields: the checker exits 2 with one G2 line for unsloth and no other line."
    test: "crux_gap_check.py --self-test, case G2-comparator-no-artifact-sha256"
    if_fails: "artifact_sha256 is not a required comparator field, so a run need not say which artifact it measured."
  - id: FALSIFY-CRUXGAP-021
    rule: "G2: a comparator without log_path is not full"
    fixture: fixtures/crux_gap/G2-comparator-no-log-path.yaml
    expect: 2
    prediction: "The unsloth arm's comparator lacks log_path and has the other four fields: the checker exits 2 with one G2 line for unsloth and no other line."
    test: "crux_gap_check.py --self-test, case G2-comparator-no-log-path"
    if_fails: "log_path is not a required comparator field, so a claim can rest on a run that left no log to audit."
  - id: FALSIFY-CRUXGAP-022
    rule: "G4: ttft_ms is a speed metric"
    fixture: fixtures/crux_gap/G4-conceded-ttft-ms.yaml
    expect: 2
    prediction: "The unsloth arm is conceded and the metric is ttft_ms (lower is better, 0.02 to 0.015, closes): the checker exits 2 with the single line 'G4 unsloth: conceded arm on speed metric ttft_ms'."
    test: "crux_gap_check.py --self-test, case G4-conceded-ttft-ms"
    if_fails: "ttft_ms is not in the speed set, so a conceded arm races on time to first token."
  - id: FALSIFY-CRUXGAP-023
    rule: "G4: itl_ms is a speed metric"
    fixture: fixtures/crux_gap/G4-conceded-itl-ms.yaml
    expect: 2
    prediction: "The unsloth arm is conceded and the metric is itl_ms (lower is better, 0.02 to 0.015, closes): the checker exits 2 with the single line 'G4 unsloth: conceded arm on speed metric itl_ms'."
    test: "crux_gap_check.py --self-test, case G4-conceded-itl-ms"
    if_fails: "itl_ms is not in the speed set, so a conceded arm races on inter-token latency."
  - id: FALSIFY-CRUXGAP-024
    rule: "G4: e2e_ms is a speed metric"
    fixture: fixtures/crux_gap/G4-conceded-e2e-ms.yaml
    expect: 2
    prediction: "The unsloth arm is conceded and the metric is e2e_ms (lower is better, 0.02 to 0.015, closes): the checker exits 2 with the single line 'G4 unsloth: conceded arm on speed metric e2e_ms'."
    test: "crux_gap_check.py --self-test, case G4-conceded-e2e-ms"
    if_fails: "e2e_ms is not in the speed set, so a conceded arm races on end-to-end latency."
  - id: FALSIFY-CRUXGAP-025
    rule: "G4: load_ms is a speed metric"
    fixture: fixtures/crux_gap/G4-conceded-load-ms.yaml
    expect: 2
    prediction: "The unsloth arm is conceded and the metric is load_ms (lower is better, 0.02 to 0.015, closes): the checker exits 2 with the single line 'G4 unsloth: conceded arm on speed metric load_ms'."
    test: "crux_gap_check.py --self-test, case G4-conceded-load-ms"
    if_fails: "load_ms is not in the speed set, so a conceded arm races on load time."
  - id: FALSIFY-CRUXGAP-026
    rule: "G4: tok_s is a speed metric"
    fixture: fixtures/crux_gap/G4-conceded-tok-s.yaml
    expect: 2
    prediction: "The unsloth arm is conceded and the metric is tok_s (higher is better, 0.95 to 0.97, closes): the checker exits 2 with the single line 'G4 unsloth: conceded arm on speed metric tok_s'."
    test: "crux_gap_check.py --self-test, case G4-conceded-tok-s"
    if_fails: "tok_s is not in the speed set, so a conceded arm races on throughput."
qa_gate:
  id: F-CRUXGAP-QA-001
  name: A crux_comparison block is accepted only when every rule holds
  description: >
    Every planted case exits with its expected code. For a RED case the self-test also
    needs one violation that starts with the planted rule (G0 to G8); it does not check
    that no other rule fires. On 2026-10-04 each RED case printed only lines of its own
    rule and each control printed none. Each of the five comparator fields is planted
    missing in its own case, each of the six speed metrics has its own conceded case,
    and a control with a speed metric and no conceded arm holds G4's conceded-only
    filter. See falsification.
  checks:
    - planted_case_exits_as_expected
    - red_case_names_its_own_rule
    - red_case_prints_only_its_own_rule
    - control_accepted
  pass_criteria: "crux_gap_check.py --self-test prints 'self-test: N/N ok', where N is the number of rows in fixtures/crux_gap/cases.json (26 on 2026-10-04), and each RED case prints only lines of its own rule"
  falsification: "Measured 2026-10-04 with 30 in-memory mutants: one per rule check, exemption, comparator field and speed metric, plus G6's direction and its two none cases, comparator all to any, and the unrunnable token. Against the 16 cases of draft 0.2.0, 20 were killed (2 by a crash) and 10 survived: dropping command, version, artifact_sha256 or log_path from the comparator fields (4), dropping ttft_ms, itl_ms, e2e_ms, load_ms or tok_s from the speed metrics (5), and flagging every arm of a speed metric (1). Draft 0.3.0 plants one case for each (FALSIFY-CRUXGAP-017 to -026), and all 30 mutants are killed, 2 of them by a crash (11:51Z). Open for the Rust port: the self-test checks that the planted rule fires, not that no other rule does; and a G2 line lists all five comparator fields, not the missing ones, so the five G2 field cases print the same line."
mutation_record: "15/15 sed mutants killed by --self-test (2026-10-03). 30 in-memory mutants (2026-10-04): 10 survived the 16-case self-test; the 26-case self-test kills all 30, 2 by a crash. Recorded under qa_gate."
initial_state: "origin/main 316dee2cd4: none of the 318 contracts/crux-*.yaml carries a crux_comparison block or a gap_effect (2026-10-04). Pointed at one, e.g. crux-A-01-v1.yaml, the checker exits 2 through G0."
verification: "External check, by hand: python3 scripts/lookahead/crux_gap_check.py --self-test  # 2026-10-04 11:51Z: self-test: 26/26 ok"
