# DRAFT (look-ahead, branch-only). Moves into contracts/ when EXT-24 is minted.
# Checker: scripts/lookahead/crux_bind_check.py, an external check run by hand. No
# build, test, gate or CI job invokes it. Before this file moves into contracts/, its
# self-test cases port to Rust with fixtures/crux_bind/ as data, and the port compares
# violation lines, not only exit codes (see qa_gate).
metadata:
  id: ext-crux-bind-v1
  kind: schema
  version: "0.3.0-draft"
  status: draft
  description: >
    EXT-001 §10.1 EXT-24 precondition: the CRUX schema can express the C1-C7
    surfaces before EXT-25 writes contracts for them.
  references:
  - 'docs/specifications/EXT-001-dogfood-model-lifecycle.md §10, §10.1 EXT-24/25 (staged on la-71/4487-obs-00, not yet on main)'
  - 'crates/aprender-contracts/src/schema/validator.rs CRUX_COMPETITORS'
equations:
  bound:
    formula: 'EXT_ARMS ⊆ CRUX_COMPETITORS  ∧  ∀ letter: |names(letter)| = 1'
falsification_tests:
  - id: FALSIFY-CRUXBIND-001
    rule: "control: full registry, one name per letter"
    fixture: fixtures/crux_bind/cases.json#control-bound
    expect: 0
    prediction: "With every EXT arm registered and one category name per letter, the checker exits 0 and prints no violation."
    test: "crux_bind_check.py --self-test, case control-bound"
    if_fails: "A rule fires on a clean registry: the registry parse drops a name, or the category regex reads one name as two."
  - id: FALSIFY-CRUXBIND-002
    rule: "an EXT arm absent from CRUX_COMPETITORS is RED"
    fixture: fixtures/crux_bind/cases.json#B1-missing-arm
    expect: 2
    prediction: "On reg-partial.rs the checker exits 2 with one B1 line per unregistered EXT arm (unsloth, bartowski, mistral_rs, mlflow, dvc, wandb, qwen) and no other violation."
    test: "crux_bind_check.py --self-test, case B1-missing-arm"
    if_fails: "B1 reads a list other than CRUX_COMPETITORS, or counts an absent arm as registered."
  - id: FALSIFY-CRUXBIND-003
    rule: "a slug inside a // comment is not registered"
    fixture: fixtures/crux_bind/cases.json#B1-commented-arm-not-registered
    expect: 2
    prediction: "With arms [unsloth], whose slug appears in reg-partial.rs only inside a // comment, the checker exits 2 with the single line 'B1 competitor not registered: unsloth'."
    test: "crux_bind_check.py --self-test, case B1-commented-arm-not-registered"
    if_fails: "The registry parse does not strip // comments, so a commented slug counts as registered."
  - id: FALSIFY-CRUXBIND-004
    rule: "control: the checked arm list is the one passed"
    fixture: fixtures/crux_bind/cases.json#B1-control-subset
    expect: 0
    prediction: "With arms [llama_cpp, ollama], both registered in reg-partial.rs, the checker exits 0: B1 checks the arm list it is given, not the built-in one."
    test: "crux_bind_check.py --self-test, case B1-control-subset"
    if_fails: "B1 ignores the arms argument and always checks the built-in EXT_ARMS."
  - id: FALSIFY-CRUXBIND-005
    rule: "one letter, two category names is RED"
    fixture: fixtures/crux_bind/cases.json#B2-letter-collision
    expect: 2
    prediction: "With k1.yaml and k2.yaml, which give letter K two names, the checker exits 2 with one B2 line that names both."
    test: "crux_bind_check.py --self-test, case B2-letter-collision"
    if_fails: "Names are not collected per letter, or the collision check never compares them."
  - id: FALSIFY-CRUXBIND-006
    rule: "no category at all is RED, not vacuously bound"
    fixture: fixtures/crux_bind/cases.json#B2-vacuous
    expect: 2
    prediction: "On nocat.yaml, which has no category line, the checker exits 2 with 'B2 no crux category found (vacuous)' and does not report bound."
    test: "crux_bind_check.py --self-test, case B2-vacuous"
    if_fails: "B2 is vacuously true over an empty category set."
  - id: FALSIFY-CRUXBIND-007
    rule: "registry not found is RED"
    fixture: fixtures/crux_bind/cases.json#B0-no-registry
    expect: 2
    prediction: "On reg-missing.rs, which has no CRUX_COMPETITORS array, the checker exits 2 with the single line 'B0 CRUX_COMPETITORS not found'."
    test: "crux_bind_check.py --self-test, case B0-no-registry (exit code only; FALSIFY-CRUXBIND-008 separates B0 from B1)"
    if_fails: "A missing registry is read as an empty set, so B1 flags every arm and the case exits 2 for the wrong reason."
  - id: FALSIFY-CRUXBIND-008
    rule: "registry not found is RED through B0 itself, with no arm for B1 to flag"
    fixture: fixtures/crux_bind/cases.json#B0-no-registry-no-arms
    expect: 2
    prediction: "On reg-missing.rs with arms [], the checker exits 2 with the single line 'B0 CRUX_COMPETITORS not found'. With no arm to check, B1 cannot carry the exit, so the case fails unless B0 fires."
    test: "crux_bind_check.py --self-test, case B0-no-registry-no-arms"
    if_fails: "A missing registry is read as an empty set: with no arms nothing fires, and a tree with no registry reports bound."
  - id: FALSIFY-CRUXBIND-009
    rule: "a hyphen separates letter and name as an em dash does"
    fixture: fixtures/crux_bind/cases.json#B2-hyphen-collision
    expect: 2
    prediction: "k1.yaml ('K — Ecosystem & Integration') and k3-hyphen.yaml ('K - Deployment & Integration'): the checker exits 2 with the single line \"B2 letter K has 2 names: ['Deployment & Integration', 'Ecosystem & Integration']\"."
    test: "crux_bind_check.py --self-test, case B2-hyphen-collision"
    if_fails: "The category regex drops the hyphen form, so a label written with a hyphen is never read and its collision goes unseen. All 316 category lines on main 316dee2cd4 use an em dash, so this guards a form main does not use yet."
  - id: FALSIFY-CRUXBIND-010
    rule: "control: a plain scalar with a trailing comment reads as the same name"
    fixture: fixtures/crux_bind/cases.json#B2-control-plain-same-name
    expect: 0
    prediction: "d1.yaml (double-quoted 'D — Inference & Generation') and d3-plain-comment.yaml (the same name as a plain scalar followed by a # comment): the checker exits 0, with one name for letter D."
    test: "crux_bind_check.py --self-test, case B2-control-plain-same-name"
    if_fails: "The category regex keeps the comment or the trailing spaces, so one name reads as two and B2 reports a collision that is not there."
qa_gate:
  id: F-CRUXBIND-QA-001
  name: The CRUX bind census reports only real violations
  description: >
    Every planted case exits with its expected code, and each RED case prints only
    violations of its own class (B0, B1 or B2). The self-test compares exit codes only.
    On 2026-10-04 each RED case was run by hand and printed only lines of its own
    class; the Rust port compares the lines too. B0-no-registry-no-arms leaves B1 no
    arm to flag, so B0 alone carries its exit code.
  checks:
    - planted_case_exits_as_expected
    - red_case_prints_only_its_own_class
    - control_accepted
  pass_criteria: "crux_bind_check.py --self-test prints 'self-test: N/N ok', where N is the number of rows in fixtures/crux_bind/cases.json (10 on 2026-10-04), and each RED case prints only lines of its own class"
  falsification: "Mutate one rule and the self-test exits 1: 7/7 sed mutants were killed on 2026-10-03. On 2026-10-04, 23 in-memory mutants: one per rule check (B0, B1, B2 vacuous, B2 collision), reading a missing registry as an empty set, the collision threshold, the arms argument, the registry comment strip, each CAT_RE branch (single quote, em dash, hyphen, comment stop), the name strip, and each of the 10 EXT_ARMS members. Against the 7 cases of draft 0.2.0, 9 were killed (1 by a crash) and 14 survived: reading a missing registry as an empty set (B0-no-registry still exits 2, through B1), the hyphen branch, the comment stop, the name strip, and dropping any one EXT_ARMS member (10: reg-partial.rs lacks seven arms, so B1-missing-arm still exits 2 whichever one arm is dropped). Draft 0.3.0 plants three cases (FALSIFY-CRUXBIND-008 to -010), which kill the first four: 13 killed, 1 by a crash. The 10 EXT_ARMS mutants survive. Killing them needs one planted registry per arm, each lacking exactly that arm (.rs fixture data, outside this data-only change), or an arm list derived from EXT-001 section 10 instead of a hand copy. PROPOSE for the Rust port: derive the list from section 10 and compare violation lines."
mutation_record: "7/7 sed mutants killed by --self-test (2026-10-03). 23 in-memory mutants (2026-10-04): 14 survived the 7-case self-test; the 10-case self-test kills 13 (1 by a crash), and the 10 EXT_ARMS-member mutants survive. Recorded under qa_gate."
initial_state: "origin/main 316dee2cd4 is RED: 7 arms unregistered, 5 letters collide (re-measured 2026-10-04 11:03Z over the 318 contracts/crux-*.yaml)"
verification: "External check, by hand: python3 scripts/lookahead/crux_bind_check.py --self-test  # 2026-10-04 11:59Z: self-test: 10/10 ok"
