contract: beat-unsloth-finetune-throughput
metadata:
  kind: beat-benchmark
  version: "1.3.0"
  description: >
    0.72 exit criterion T2 (APR-LOOKAHEAD-001 §2a): `apr finetune -m lora` (bf16, CUDA) training
    throughput on Qwen3.5-4B is at least 0.8x Unsloth's on the SAME GPU, same model, same recipe.
    The cell is bf16 LoRA, NOT QLoRA: Unsloth's Qwen3.5 guide says "It is not recommended to do
    QLoRA (4-bit) training on the Qwen3.5 models, no matter MoE or dense, due to higher than
    normal quantization differences" (unsloth.ai/docs/models/qwen3.5/fine-tune, read 2026-09-27),
    so a QLoRA cell would measure against a configuration the incumbent disowns. The
    sibling beat-unsloth-coldstart-speed-v1 explicitly CONCEDES GPU in-loop QLoRA throughput to
    Unsloth; this contract is the one that stops conceding. No measurement exists yet: the
    first run of the committed command IS the baseline, and beat_threshold stays 0.8 by
    operator ruling regardless of the baseline.
  references:
  - "docs/specifications/aprender-train/train-what-you-serve-0.72.md §R5"
  - "contracts/beat-unsloth-coldstart-speed-v1.yaml (sibling; concedes this metric today)"
  - "contracts/qwen35-qlora-e2e-v1.yaml (the apr side of the cell)"
  - "docs/specifications/aprender-train/train-what-you-serve-0.72.md, External reference study (U1-U10, read 2026-09-29): the source of the 1.1.0 pins"
version: 1
status: PROPOSED
date: 2026-09-27
beat:
  pillar: 3
  incumbent: Unsloth
  incumbent_pinned: "UNPINNED — the harness pins exact unsloth + unsloth_zoo + torch + transformers (v5, <=5.5.0 per unsloth 2026.9.12 pyproject) + fla + causal-conv1d versions in a uv lock and records them in the receipt. Unsloth supports Qwen3.5 fine-tuning (0.8B-122B). Its GDN fast path is NOT an Unsloth kernel: it is torch.compile over the GDN ops plus the fla Triton kernels (unsloth PR #10744, draft at 2026-09-29); without fla, HF GDN falls back to an fp32 torch chunk loop (spec U4/U5). 1.0.0 said 'its own Triton kernels for the GDN layers', which was wrong"
  canonical_task: >
    bf16 LoRA fine-tune of Qwen3.5-4B (frozen bf16 base; Unsloth lists 10 GB for 4B, so it fits
    the 24 GB card), rank 16, alpha 32, targets = Unsloth's documented default
    q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj on BOTH sides (the GDN in_proj/out_proj
    projections are not targeted; a second, optional cell adds them on both sides), seq 512, batch 4, grad-accum 1, bf16 compute, 50 warmup + 200 timed steps, same 1,000-row
    data (1.2.0: built by scripts/bench/unsloth_ft_data.py from this repo's own MIT crates/**/*.rs
    at a pinned commit, 8192 characters per row so every row fills seq 512 and nothing is padded;
    at 316dee2cd4 its sha256 is 49cf2844d99d6195feeb0ae3e91fd7498817c823ef7d08e7142b13e01b3d0a65,
    and the measuring run re-pins rev + sha in its evidence; 1,000 rows = 250 steps x batch 4, each
    row trained once), same RTX 4090 (lambda), same run, exclusive GPU. Optimizer = torch AdamW
    with fp32 states on both sides (never adamw_8bit, Unsloth's benchmark default); gradient
    checkpointing OFF on both sides (not Unsloth's "unsloth" CPU-offload mode); packing OFF on
    both sides. Metric = non-pad label tokens trained per second over the timed steps, counted
    the same way on both sides, excluding model load; the timed window starts after the 50
    warmup steps AND after the incumbent's torch.compile has finished (both recorded).
  metric: train_tokens_per_sec_ratio_apr_over_unsloth
  direction: higher_is_better
  baseline_value: null
  beat_threshold: 0.8000
  baseline_sourced_date: null
  approved_compute: GPU  # lambda RTX 4090; never while train-active
  ci_gate_name: "beat_unsloth_finetune_throughput"
proof_obligations:
- id: OBLIG-UNSLOTH-FT-RATIO
  statement: >
    On the canonical task, apr_tok_s / unsloth_tok_s >= 0.8, both measured in the same run on
    the same GPU, median of 3 runs, with the device that ran recorded from a trace line (not
    from CUDA_VISIBLE_DEVICES).
  type: bound
- id: OBLIG-UNSLOTH-FT-SAME-WORK
  statement: >
    Both sides train the same number of tokens with the same targets and rank; the receipt
    records trainable-parameter counts for both and they differ by < 1%.
  type: invariant
- id: OBLIG-UNSLOTH-FT-FULL-WINDOW
  statement: >
    (1.2.0) Every timed row is full, so both sides count exactly
    timed_steps x batch x grad_accum x (seq_len - 1) = 408,800 label tokens per run. A run that
    counts any other number trained padded rows or counted differently, and is a SAME-WORK FAIL;
    tokens/s from different counting rules are not comparable.
  type: invariant
- id: OBLIG-UNSLOTH-FT-INCUMBENT-FAST-PATH
  statement: >
    The incumbent runs its fastest supported path for Qwen3.5 GDN: fla is importable in the
    incumbent's environment and its version is in the receipt. A run without it reports no
    ratio (INCUMBENT_SLOW_PATH), because a ratio against an incumbent on the fp32 torch GDN
    fallback measures the fallback, not Unsloth.
  type: invariant
falsification_tests:
- id: FALSIFY-BEAT-UNSLOTH-FT-THROUGHPUT
  description: >
    FALSE if apr trains fewer than 0.8x the tokens per second Unsloth trains on the canonical
    task, same GPU, same run.
  command: >
    scripts/bench/unsloth_finetune_throughput.sh --model Qwen3.5-4B --gpu 0 --out
    evidence/beat-unsloth-ft/<version>/  with APR_FT_DATA built by scripts/bench/unsloth_ft_data.py
    (the script refuses, exit 3, without it)
  expected: "ratio >= 0.80"
  if_fails: >
    Profile the apr step (apr profile / trace) against Unsloth's fused LoRA kernels; the gap
    is the R14 row's input.
- id: FALSIFY-BEAT-UNSLOTH-FT-SAMEWORK
  description: >
    Planted falsifier: halving apr's LoRA targets (attention only) must make the SAME-WORK
    check fail, so a ratio cannot be won by training less.
  command: "same script with --planted-half-targets; expect SAME-WORK FAIL"
  expected: "SAME-WORK check exits non-zero"
  if_fails: "the throughput ratio can be gamed by doing less work"
- id: FALSIFY-BEAT-UNSLOTH-FT-INCUMBENT-FASTPATH
  description: >
    Planted falsifier: running the harness with fla removed from the incumbent's uv
    environment must refuse with INCUMBENT_SLOW_PATH and write no ratio, so apr can never
    "beat" an Unsloth that is running the slow GDN fallback.
  command: "same script with --planted-no-fla; expect exit non-zero, INCUMBENT_SLOW_PATH, no ratio in the receipt"
  expected: "harness exits non-zero with INCUMBENT_SLOW_PATH"
  if_fails: "the ratio can be won against a crippled incumbent"
- id: FALSIFY-BEAT-UNSLOTH-FT-SAMEOPT
  description: >
    Planted falsifier: switching only the incumbent's optimizer to adamw_8bit (or only its
    gradient checkpointing to "unsloth") must make the SAME-WORK check fail, so the recipe
    difference is caught instead of being folded into the ratio.
  command: "same script with --planted-incumbent-adamw8bit; expect SAME-WORK FAIL"
  expected: "SAME-WORK check exits non-zero naming the optimizer"
  if_fails: "an optimizer or checkpointing mismatch silently moves the ratio"
- id: FALSIFY-BEAT-UNSLOTH-FT-PRECISION
  description: >
    (1.3.0) Planted falsifier: the "bf16" of canonical_task was stated but never recorded or
    compared, and apr's CUDA training block has no bf16 path at 316dee2cd4 (FP32 + NF4 only), so a
    first R15 in fp32 would have been ratioed against a bf16 Unsloth. Both receipts now carry
    precision = the dtype of the frozen base weights, read back from the loaded model, and the
    verdict pins it to bf16 on every run.
  command: "python3 scripts/tests/unsloth_ft_verdict_test.py (case: planted apr fp32)"
  expected: "an apr receipt with precision fp32 exits 1, SAME-WORK FAIL naming precision; no ratio"
  if_fails: "a precision mismatch is folded into the ratio"
- id: FALSIFY-BEAT-UNSLOTH-FT-FULL-WINDOW
  description: >
    (1.2.0) Planted falsifier: one side's receipt counts fewer label tokens than the full window
    (short rows padded, or a different counting rule) and the verdict must not compute a ratio.
  command: "python3 scripts/tests/unsloth_ft_verdict_test.py (cases 'short rows padded', 'apr counts differently')"
  expected: "SAME-WORK FAIL naming label_tokens_timed; mutant 'full-window check dropped' KILLED"
  if_fails: "a side that pads, or counts tokens its own way, can move the ratio without doing more work"
- id: FALSIFY-BEAT-UNSLOTH-FT-DATA-PINNED
  description: >
    (1.2.0) The canonical data is reproducible from a commit: two builds at the same --rev are
    byte-identical, the commit (not the working tree) is what is read, only crates/**/*.rs is
    used, and too little source refuses instead of emitting a short set.
  command: "python3 scripts/tests/unsloth_ft_data_test.py"
  expected: "7 cases pass, 7/7 mutants KILLED"
  if_fails: "the data sha in the receipts cannot be rebuilt, so same-data cannot be checked by anyone else"
