metadata:
  version: 0.1.0
  kind: schema
  created: '2026-09-27'
  author: PAIML Engineering
  references:
  - 'docs/lookahead/0.73.md R1 — backend parity matrix (draft: la-73 drafts/R1-backend-parity-matrix.md)'
  - 'epic aprender#3999 — 0.73 "Runs Everywhere", exit criteria E1 E2 E3 E6'
  - 'llama.cpp d1d3c3396 — comparator pin (cop ruling RQ-2, 2026-09-27)'
  - 'contracts/apr-obs-row-identity-v1.yaml — identity block every receipt carries. NOT on origin/main at 316dee2cd4. It exists on the unmerged OBS-00 commit 96d2fe4aa1 (#4487), carried by origin/a01/4574-obs15-kernel-path, origin/a01/4492-obs05-ledger-checks and origin/2e/4572-obs13-serve-bands (checked 2026-10-03). IDENTITY there = {schema, ts, host, apr_version, apr_tag, crate_tarball_sha256, binary_sha256, build_identity, model_id, model_sha256, backend, request_id} plus a gpu_proof key. P1 imports it once it merges and does not restate it.'
  - 'contracts/apr-kernel-path-v1.yaml (OBS-15, #4574, same unmerged stack) — kernel_path = {source in {trace, kreg}, entries [{op, kernel_id, qtype, layout, arch, shape_class, precision}]}. BPM-012 and R3 kernel_path(k) use this shape, with one added entry field, tensor (the GGUF name), because BPM-012 compares per tensor (L25 2026-10-03); see P1-receipt-checker-spec.md §3a'
  - 'contracts/parity-receipt-v2.yaml — the logit-parity record family. Leg A is a v2 SelfComparedReceipt, leg B a v2 OracleComparedReceipt (comparator llama_cpp); see P1-receipt-checker-spec.md'
  - 'evidence/parity/thresholds.yaml (schema apr-parity-thresholds/v1) — where every threshold here is resolved from, each with a basis'
  - 'contracts/apr-parity-per-op-v1.yaml — diagnostic for a failing leg A'
  description: >
    One receipt per (cell, model, quant) that says whether apr on that backend is
    correct (E1), fast enough (E2) and runs MoE (E3) against llama.cpp at the ruled
    pin. Cells: C0 lambda CUDA sm_89 + x86 CPU (control), C1/C2 intel wgpu/Vulkan
    on each AMD GPU, C3 mini wgpu/Metal, C4 gx10 aarch64 CPU, C5 gx10 CUDA sm_121.
    Correctness is gated on a composed two-leg cosine, never on a cross-engine
    same-backend cosine, which mixes two engines' backend errors.

equations:
  composed_leg_bound:
    formula: |
      ref   = the ONE apr CPU run of this receipt; cpu_ref_path = bpm.cpu_ref_path (fp32_act, RQ-5 ruled 2026-09-27)
      leg_a = min over prompts of cos(logits_apr_backend, logits_apr_cpu[ref])
      leg_b = min over prompts of cos(logits_apr_cpu[ref], logits_llamacpp_cpu)
      angle(x) = acos(x)
      end_to_end >= cos(angle(leg_a) + angle(leg_b))
      PASS_E1  <=>  leg_a >= 0.995 AND leg_b >= 0.995 AND n_prompts >= 16
      REFUSED  <=   any per-position cosine is non-finite
                 OR leg_a.prompt_set_sha256 != leg_b.prompt_set_sha256 OR leg_a.n != leg_b.n
                 OR model_sha256 differs between the backend, apr-CPU and llama.cpp runs
                 OR len(logits) differs between any two runs
                 OR leg_a.cpu_ref_path != leg_b.cpu_ref_path OR either differs from bpm.cpu_ref_path
                 OR act_path(ref, t) != cpu_ref_path for some tensor t whose qtype is not in bpm.ref_mixed_qtypes
                 OR (CPU cell) kernel_ids(backend, t) ∩ kernel_ids(ref, t) ≠ ∅ for some quantized matmul tensor t
      positions = the prefill-final position AND >= 8 teacher-forced decode positions per prompt
                  AND total positions per leg >= thresholds.min_positions (64 at 316dee2cd4)
      floors    = resolved from evidence/parity/thresholds.yaml under a bpm: key, never typed in the checker
    domain: 'final-position logits of one (cell, model, quant) over n prompts'
    codomain: bool
    invariants:
    - 'acos(0.995) = 5.732 deg; 2 x 5.732 = 11.464 < acos(0.98) = 11.478 deg, so
       two legs at 0.995 guarantee >= 0.98 end to end.'
    - 'The bound needs BOTH legs to share one apr CPU vector (triangle inequality on angles). Leg A on fp32_act and leg B on q8k_act composes nothing, and the receipt is REFUSED (FALSIFY-BPM-008).'
    - 'cpu_ref_path is recorded in the receipt and checked against act_path(ref, t), which is derived from the reference run''s kernel_path precision. It is never inferred from the command. At main 316dee2cd4 (R1 §11a): only the single-row Q4_K kernel reads the scope (parallel_k.rs:304); crushed Q4_K blocks switch to f32 per call; multirow Q4_K reads only DIRECT_FP32_GEMV (q4k_q8k_multirow.rs:178); Q5_K/Q6_K are always f32; Q4_0/Q8_0 are always Q8_0; fused gate/up (fused_gate_up.rs:177; the honest forward reaches it only for Gemma-1, gated LayerNorm and FFN-norm-less archs, ffn_block.rs:58) and the scratch and traced forwards (results.rs:541, traced.rs:88) pre-quantize to Q8_K whatever the scope says. apr parity-moe runs inside the scope (parity_moe.rs:110); dense apr parity does not, so its reference is mixed and neither label is true of it.'
    - 'RQ-5 ruled (cop, 2026-09-27 20:12Z): bpm.cpu_ref_path = fp32_act and bpm.ref_mixed_qtypes = [Q4_0, Q8_0], both data in thresholds.yaml with a basis. A q8k_act run is reported as an info row only and is never an E1 receipt (f008c). Dense parity and parity-moe use the same reference. The reference is forward_single_with_cache (or the MoE or Qwen3.5 forward) token by token inside with_fp32_activations. No M receipt exists before LIVE 0.70.1.'
    - 'Two legs at 0.99 only guarantee cos(16.21 deg) = 0.960: 0.99 per leg is NOT the gate.'
    - 'The gate reads the MIN over prompts; median and max are reported, never gated.'
    - 'Threshold basis (2026-10-03). thresholds.yaml is fail-closed: "a threshold without a basis is not a threshold". The 0.98 end-to-end floor reuses the MEASURED default basis (known-good 0.998607 / 0.998465 vs known-bad 0.950827 / 0.950611, n=5). That basis is GPU-vs-CPU within apr on dense qwen2.5, so applying it apr-vs-llama.cpp is an extrapolation [A]. The 0.995 per-leg floor is DERIVED from 0.98 by the triangle bound and has no basis of its own. The bpm: entry records both facts, and the first measured cells recalibrate it by amendment.'
    - 'Positions: the repo rule (thresholds.yaml min_positions: 64, basis I8/CF-4 #1864) is that an autoregressive gate validates over >= 64 positions. 16 prompts x (1 + 8) = 144 meets it; a smaller prompt set must add decode positions, not drop the rule.'
    - 'L25: the MIN is NaN-propagating. Rust f32::min/f64::min return the non-NaN operand, so a fold with them drops a NaN prompt and the gate reads the 15 good ones. apr''s cosine helpers (parity_per_op_table.rs:61, forward_error.rs:254 at main 316dee2cd4) return 0.0 on a length mismatch or zero norm but NaN on NaN logits. A non-finite cosine REFUSES the receipt (FALSIFY-BPM-009).'
    - 'L25: the triangle bound is per prompt. Leg A over prompt set P and leg B over Q != P bounds nothing on the prompts outside P ∩ Q, so both legs carry prompt_set_sha256 and n, and they must match (FALSIFY-BPM-010).'
    - 'L25: all three runs read ONE model file (model_sha256 equal). Leg B over a different GGUF (re-quantized, or apr-converted) measures the file difference, not the engine (FALSIFY-BPM-011).'
    - 'L25: on a CPU cell (C4) the backend IS the CPU. If the reference runs the same kernels, leg A is a self-comparison and reads 1.0 for free. Q5K/Q6K have one CPU activation path, f32, under either label (§11a, corrected 2026-10-03), so R3''s NEON Q6K dot would be compared with itself. The reference must run a different kernel_id for every quantized matmul tensor, or the receipt is REFUSED (FALSIFY-BPM-012). The C4 reference is the C0 x86 run (R3 c4_e1_leg). A same-host scalar reference would need a force-scalar switch, and none exists at 316dee2cd4: the f32 Q4_K and Q6_K dispatchers test only CPU features (fused_k.rs:201, fused_q5k_q6k.rs:123).'
    - 'L25 (2026-10-03): BPM-012 compares, per (tensor, op), the sets of kernel_ids the two runs reached, on kernel_id alone, and refuses on any overlap. Four weaker forms pass vacuously. (i) Whole-path equality, or an empty kernel_diff: a same-host reference differs from a default-route backend on Q4_K (q4k-q8k against q4k-f32) while every Q6_K tensor meets itself (f012). (ii) The OBS slot (op, shape_class): slots() keeps one entry per slot, the last (obs_kernel_path.rs:118 on #4574), and a Q4_K_M file mixes qtypes in one slot. In Qwen3.5-0.8B-Q4_K_M, ffn_down (3584, 1024) is Q6_K in 12 layers and Q4_K in 12, so an equal Q6_K layer hides behind a differing Q4_K one (f012d). (iii) Whole-entry comparison: arch differs on every C0-against-C4 entry, so one scalar kernel on both hosts reads as different (f012c). (iv) One kernel_id per tensor: on the default route a crushed activation block sends that one Q4_K call to f32 (ffn_block.rs:790-792), so one tensor runs q4k-q8k and q4k-f32 in one run, and keeping either one hides the other (f012e). P1 reads the per-tensor sets and does not reuse kernel_diff.'
    - 'L25: final-position-of-prefill logits never exercise the KV cache or the decode kernels (M=1 GEMV). The known-bad 0.955 (FALSIFY-BPM-007) is a decode measurement. The gate reads prefill-final plus >= 8 teacher-forced decode positions per prompt, all fed the same token ids (FALSIFY-BPM-013).'

  speed_ratio_ci:
    formula: |
      r = tok_s_apr / tok_s_llamacpp   (decode and prefill, same client, prompts, clock)
      ci = paired bootstrap 95% over n >= 5 runs per engine
      REQUIRE: both engines on one host_id, n_gen fixed and EOS ignored on both (equal decoded tokens)
      PASS_E2  <=>  ci.lo >= 0.5   (decode AND prefill)
    domain: 'paired timing runs on one cell'
    codomain: bool
    invariants:
    - 'A point estimate >= 0.5 with ci.lo < 0.5 is FAIL.'
    - 'The 0.5 floor is [A]; the first three measured cells recalibrate it by amendment only.'
    - 'L25: tok/s over unequal token counts is not paired. An engine that stops at an early EOS decodes fewer, cheaper (shorter-context) tokens and reads faster. A receipt whose decoded-token counts differ is REFUSED (FALSIFY-BPM-015).'

  backend_is_self_reported:
    formula: |
      cell.backend := what the serving process printed about itself
                      (wgpu adapter name, CUDA device banner)
      adapter in {llvmpipe, lavapipe, SwiftShader, "Microsoft Basic Render"} OR no banner
        OR wgpu AdapterInfo.device_type = Cpu
        => FALLBACK => FAIL (not "slow")
    domain: 'the receipt backend fields'
    codomain: bool
    invariants:
    - 'A launch flag is intent, never evidence (verification rule 2).'
    - 'L25: a name denylist is open-ended; a software adapter not on the list passes. device_type = Cpu is the closed check, and the names stay as a second check (FALSIFY-BPM-014).'
    - 'Until F3 (la-73/4575-wgpu-backend-label @fd02954a8e) lands, the serve line "Backend: wgpu (Vulkan)" is a hardcoded literal and cannot be evidence for C3 (Metal). The banner must come from AdapterInfo.backend.'

  receipt_shape:
    formula: |
      receipt = identity (apr-obs-row-identity-v1)
              + { cell, adapter_name, llamacpp_sha, model, quant,
                  leg_a {min,median,max,n}, leg_b {min,median,max,n}, composed_bound,
                  e2 {decode {r,ci_lo,ci_hi,n}, prefill {r,ci_lo,ci_hi,n}},
                  forward_trace_line,
                  info_rows [{name, route, runs {role -> {run_sha256, model_sha256, prompt_set_sha256, kernel_path}},
                              cos {pair -> {min,median,max,n}}}] }
      REQUIRE: llamacpp_sha = d1d3c3396 (the ruled pin)
      REQUIRE: forward_trace_line names the forward that ran (E3: the MoE forward)
      REQUIRE: the verdict reads leg_a, leg_b and e2 only; info_rows never enter it (RQ-5, FALSIFY-BPM-018)
      E6 admissible(cell) <=> PASS_E1 AND PASS_E2 receipts on main   (RQ-3 provisional S-4 default; PRM-001 must agree)
      hybrid(cell)       => E1 may PASS; E2 and E6 report it as HYBRID, never as GPU   (RQ-4 provisional S-4 default)
    domain: 'one receipt'
    codomain: bool
    invariants:
    - 'A receipt missing any identity field is refused (FALSIFY-OBS-ID-001, shared lint).'
    - 'Item (e) 2026-10-03: info_rows carry the RQ-5 info figures, such as a q8k_act reference or the C4 default route (neon-q4k-q6k-v1 c4_default_route_info). The checker derives the status, reason and labels of each row and reads none from the producer. A row never changes the verdict, whatever it holds (FALSIFY-BPM-018).'

falsification_tests:
- id: FALSIFY-BPM-001
  rule: the gate reads the minimum prompt, not the median
  prediction: 'A perturbed-logits fixture with leg_a median 0.999 and min 0.990 FAILS E1.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f001 (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'one bad prompt class (long context, rare token) hides behind a good median'
  mutation: 'gate on median instead of min; the fixture must turn the check GREEN, proving the case bites'
- id: FALSIFY-BPM-002
  rule: the 0.995 per-leg floor implies the 0.98 end-to-end floor, and 0.99 does not
  prediction: 'Arithmetic: 2*acos(0.995) = 0.200083 <= acos(0.98) = 0.200335 rad, so two legs at exactly 0.995 compose to >= 0.98005. Fixture f002b (both legs exactly 0.995) PASSES; fixture f002 (both legs 0.99, composed 0.960) FAILS on the per-leg floor.'
  test: 'NOT YET WRITTEN — lands with P1 (P1-receipt-checker-spec.md f002, f002b, plus the arithmetic as a const test)'
  if_fails: 'a "simplified" 0.99 gate admits cells that are 0.96 against llama.cpp'
  mutation: 'lower the per-leg floor to 0.99: the arithmetic test turns RED (2*acos(0.99) = 0.2838 > 0.2003). Use > in place of >=: f002b turns RED. (Corrected 2026-10-03: f002 alone cannot isolate the composed bound, because 0.99 already fails the per-leg floor.)'
- id: FALSIFY-BPM-003
  rule: a software-adapter fallback is FAIL, not slow
  prediction: 'A receipt whose adapter_name is llvmpipe FAILS as FALLBACK even with leg_a = 1.0.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f003 (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'a wgpu cell that ran on CPU is reported as a correct, slow GPU'
  mutation: 'drop the adapter check; the case must turn RED'
- id: FALSIFY-BPM-004
  rule: the comparator is the ruled pin
  prediction: 'A receipt with llamacpp_sha 39173bcac FAILS.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f004 (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'cells are compared against different llama.cpp builds and the matrix is not one table'
  mutation: 'accept any sha; the case must turn RED'
- id: FALSIFY-BPM-005
  rule: speed passes on the CI lower bound
  prediction: 'r = 0.55 with ci_lo = 0.45 FAILS E2.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f005 (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'noisy cells pass on one lucky run'
  mutation: 'gate on r instead of ci_lo; the case must turn RED'

- id: FALSIFY-BPM-006
  rule: a cell whose trace lacks the backend forward is REFUSED, not scored
  prediction: 'A Q8_0 wgpu receipt on a real adapter whose trace has no wgpu forward line is NotRun, never PASS or FAIL.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f006 (+P2 for the real wgpu forward line) (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'a silent CPU fallback (wgpu_adapter.rs:339) scores as a wgpu cell'
  mutation: 'score the cell from cosine alone; the planted Q8_0 case must turn RED'
- id: FALSIFY-BPM-007
  rule: today's wgpu Qwen3 decode FAILS E1 (known-bad control)
  prediction: 'The harness on current wgpu Qwen3 reports leg_a < 0.995 (measured 0.955).'
  test: 'NOT YET WRITTEN — lands with the R1 harness'
  if_fails: 'the harness cannot see a known 4.5% divergence; its PASSes mean nothing'
  mutation: 'compare the backend against itself; the control must turn RED'
- id: FALSIFY-BPM-008
  rule: both legs share one CPU reference run (K19)
  prediction: 'A receipt with leg_a.cpu_ref_path = fp32_act and leg_b.cpu_ref_path = q8k_act (or either missing) is REFUSED, not scored. So is an equal pair that differs from bpm.cpu_ref_path (f008c), and a pair labelled fp32_act whose reference trace shows a Q4_K tensor on Q8_K activations, or a Q4_0 tensor that bpm.ref_mixed_qtypes does not list (f008d).'
  test: 'NOT YET WRITTEN — lands with P1, the receipt checker'
  if_fails: 'a GPU path that matches FP32 activations (cos 1.0) is scored against a Q8_K CPU (quoted 0.985, #3714) and FAILS E1 for the CPU rounding, or a mixed pair PASSES with no valid bound'
  mutation: 'let the checker accept per-leg cpu_ref_path (f008a turns it RED); accept any equal pair (f008c turns it RED); trust the label without the trace act_path (f008d turns it RED)'
- id: FALSIFY-BPM-009
  rule: a non-finite per-prompt cosine REFUSES the receipt (L25)
  prediction: 'A fixture with 15 prompts at cos 0.999 and one prompt with NaN logits is REFUSED, never PASS.'
  test: 'NOT YET WRITTEN — lands with P1, the receipt checker'
  if_fails: 'a NaN-producing prompt (overflow, bad scale) disappears from the MIN and the cell passes'
  mutation: 'fold the minimum with f32::min; the planted NaN fixture must turn the check GREEN, proving the case bites'
- id: FALSIFY-BPM-010
  rule: both legs cover one prompt set (L25)
  prediction: 'leg_a over 16 prompts and leg_b over a different 16 (prompt_set_sha256 differs) is REFUSED.'
  test: 'NOT YET WRITTEN — lands with P1, the receipt checker'
  if_fails: 'the composed bound is claimed for prompts that only one leg measured'
  mutation: 'drop the prompt_set_sha256 comparison; the planted receipt must turn GREEN'
- id: FALSIFY-BPM-011
  rule: all three runs read one model file (L25)
  prediction: 'A receipt whose llama.cpp run has a different model_sha256 from the apr runs is REFUSED.'
  test: 'NOT YET WRITTEN — lands with P1, the receipt checker'
  if_fails: 'leg B measures a quantization difference between two files and charges it to the engine'
  mutation: 'compare only the apr runs'' sha; the planted receipt must turn GREEN'
- id: FALSIFY-BPM-012
  rule: a CPU cell's leg A is never a self-comparison (L25)
  prediction: 'A CPU-cell receipt in which the backend and reference runs share a kernel_id on any quantized matmul tensor is REFUSED, even at leg_a = 1.0 and even when every other tensor differs (f012). The comparison is per tensor, not per OBS slot (f012d), over every kernel_id the tensor reached (f012e), and ignores arch: one kernel_id on two arches is REFUSED (f012c), and a C4 /neon run against the C0 /avx2 reference is admitted (f012b).'
  test: 'NOT YET WRITTEN — lands with P1, planted fixtures f012, f012b (control), f012c, f012d and f012e (kernel_path from the R3 skeletons)'
  if_fails: 'a wrong NEON Q6K dot is compared with itself and passes E1 at 1.0'
  mutation: 'drop the disjointness check, or compare whole paths: f012 must turn GREEN. Compare whole entries (arch included): f012c. Key by the OBS slot (op, shape_class): f012d. Keep one kernel_id per tensor, first or last: f012e'
- id: FALSIFY-BPM-013
  rule: E1 covers decode positions, not only prefill-final (L25)
  prediction: 'A fixture with prefill-final cos 1.0 and decode position 4 cos 0.90 FAILS E1.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f013 (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'a KV-cache or M=1 GEMV defect (the 0.955 class) hides behind a perfect prefill'
  mutation: 'gate on prefill-final only; the planted fixture must turn GREEN'
- id: FALSIFY-BPM-014
  rule: an unlisted software adapter is still FALLBACK (L25)
  prediction: 'A receipt with adapter_name "FooSoft Renderer" and device_type Cpu FAILS as FALLBACK.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f014 (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'a new software rasteriser name reads as a real GPU'
  mutation: 'check the name denylist only; the planted receipt must turn GREEN'
- id: FALSIFY-BPM-015
  rule: E2 pairs equal decoded-token counts (L25)
  prediction: 'apr decoding 37 tokens (early EOS) against llama.cpp decoding 128 is REFUSED, not scored.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f015 (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'an engine that stops early reads faster than it is'
  mutation: 'drop the n_gen equality; the planted receipt must turn GREEN'
- id: FALSIFY-BPM-016
  rule: a wgpu cell whose GEMV ops fall back to the CPU per op is HYBRID, not wgpu (L25, R5 F-R5-2/4)
  prediction: 'A Q8_0 model on a real GPU adapter (device_type DiscreteGpu, banner present, no fallback line) whose trace shows the GEMVs on the CPU path (wa:339 refusal) is labelled HYBRID and is not scored as a wgpu cell.'
  test: 'NOT YET WRITTEN — lands with P1, planted fixture f016 (+P2 for the per-op backend field) (falsifier-landing-map.md; was "the R1 harness")'
  if_fails: 'a wgpu E1/E2 cell measures the CPU while every banner-level check passes'
  mutation: 'check the adapter banner only; the planted Q8_0 receipt must turn GREEN as wgpu'
- id: FALSIFY-BPM-017
  rule: an E3 GPU receipt needs the in-process F2 guard to have judged something (L25, R4)
  prediction: 'A C0 MoE receipt whose stderr has "F2 guard: SKIP_PARITY_GATE=1" or "nothing was judged" (a prompt under 2 tokens), or lacks the "F2 guard: GPU matches" line, is REFUSED as E3 GPU evidence.'
  test: 'NOT YET WRITTEN — lands with P1, the receipt checker'
  if_fails: 'a GPU run that skipped its own parity guard reads as a validated GPU run'
  mutation: 'accept on used_gpu = true alone; the planted SKIP_PARITY_GATE receipt must turn GREEN'
- id: FALSIFY-BPM-018
  rule: an info row never gates (RQ-5, item e)
  prediction: 'f018a: leg_a has 15 prompts at 0.999 and 1 at 0.990, next to an info row at 0.999 everywhere: Fail(E1 min). f018b: base.json plus an info row (the q8k_act reference, RQ-5) at min 0.985 stays Pass, and so does a second fixture whose info row holds one cosine "NaN"; that row reads not_measured(non_finite).'
  test: 'NOT YET WRITTEN — lands with P1, planted fixtures f018a and f018b (P1 spec §4)'
  if_fails: 'an info row lifts a failing leg, or an info row under 0.995 fails a cell it cannot gate under the RQ-5 ruling. An info row moved INTO a leg is BPM-008 (f008c).'
  mutation: 'take the best of a leg and its info rows (f018a turns GREEN); fold the info rows into the leg min (f018b fails); refuse the receipt on a non-finite info row, as BPM-009 does for a leg (the second f018b is refused)'
proof_obligations:
- type: invariant
  property: 'Two legs >= 0.995 imply end-to-end cosine >= 0.98 (FALSIFY-BPM-002)'
  formal: 'acos(a) + acos(b) <= acos(0.98) when a, b >= 0.995'
- type: invariant
  property: 'E1 is gated on the per-prompt minimum (FALSIFY-BPM-001)'
  formal: 'PASS_E1 => forall p: cos_a(p) >= 0.995 and cos_b(p) >= 0.995'
- type: invariant
  property: 'No FALLBACK receipt passes (FALSIFY-BPM-003)'
  formal: 'fallback(r) => not PASS(r)'
- type: invariant
  property: 'Every receipt names the ruled comparator (FALSIFY-BPM-004)'
  formal: 'forall r: r.llamacpp_sha = d1d3c3396'
- type: invariant
  property: 'E2 passes only on the CI lower bound (FALSIFY-BPM-005)'
  formal: 'PASS_E2 => ci_lo_decode >= 0.5 and ci_lo_prefill >= 0.5'

- type: invariant
  property: 'Both legs read the same apr CPU reference (FALSIFY-BPM-008)'
  formal: 'forall r: r.leg_a.cpu_ref_path = r.leg_b.cpu_ref_path = bpm.cpu_ref_path and forall t in ref_tensors(r): act_path(t) = r.cpu_ref_path or qtype(t) in bpm.ref_mixed_qtypes'
- type: invariant
  property: 'No non-finite cosine reaches the gate (FALSIFY-BPM-009)'
  formal: 'PASS_E1 => forall p, t: is_finite(cos_a(p,t)) and is_finite(cos_b(p,t))'
- type: invariant
  property: 'Both legs read the same inputs (FALSIFY-BPM-010, -011)'
  formal: 'forall r: r.leg_a.prompt_set_sha256 = r.leg_b.prompt_set_sha256 and r.leg_a.n = r.leg_b.n and model_sha256 equal over the three runs'
- type: invariant
  property: 'A CPU cell is never its own reference, on any quantized matmul tensor (FALSIFY-BPM-012)'
  formal: 'cpu_cell(r) => forall t in quantized_matmul_tensors(r): kernel_ids(r.backend, t) ∩ kernel_ids(r.ref, t) = ∅'
- type: invariant
  property: 'E1 reads decode positions (FALSIFY-BPM-013)'
  formal: 'PASS_E1 => forall p: |decode_positions(p)| >= 8 and sum_p (1 + |decode_positions(p)|) >= thresholds.min_positions'
- type: invariant
  property: 'A wgpu cell runs its GEMVs on wgpu (FALSIFY-BPM-016)'
  formal: 'wgpu_cell(r) => forall op in gemv_ops(r.trace): op.backend = wgpu, else label(r) = HYBRID'
- type: invariant
  property: 'An E3 GPU receipt carries a judged F2 guard (FALSIFY-BPM-017)'
  formal: 'E3_gpu(r) => f2_matches_line(r.stderr) and not f2_skipped(r.stderr)'
- type: invariant
  property: 'An info row never changes the verdict (FALSIFY-BPM-018)'
  formal: 'forall r, I: verdict(r with info_rows := I) = verdict(r)'

