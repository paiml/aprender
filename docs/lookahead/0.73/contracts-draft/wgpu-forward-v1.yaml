metadata:
  version: 0.1.0
  kind: schema
  created: '2026-09-27'
  author: PAIML Engineering
  references:
  - 'docs/lookahead/0.73.md R2 — wgpu forward scope (draft: la-73 drafts/R2-wgpu-forward-scope.md)'
  - 'epic aprender#3999 — 0.73 "Runs Everywhere", exit criterion E1 on C1-C3'
  - 'drafts/backend-parity-matrix-v1.yaml — the E1 composed-leg gate this forward must pass'
  - 'crates/aprender-compute/src/backends/gpu/device/linalg/wgsl_forward.rs:229 and :265 — rope_theta hardcoded as pow(1000000.0, …) in TWO WGSL shaders [V at main 00052c0128, 2026-09-30; the earlier "aprender-serve …:943" cite was stale]'
  - 'crates/aprender-serve/src/gpu/adapters/wgpu_adapter.rs dequant_tensor_public — Q4_K/Q6_K/Q5_K/F32/F16 (and APR q4/q8) are dequantized to F32 on the host; only other types are refused ("Unsupported quantization type … for WGPU dequant") [V at 00052c0128]'
  description: >
    What the wgpu (WGSL) decoder forward must do before a C1-C3 receipt can pass E1:
    read rope_theta and head_dim from model metadata, apply Qwen3 q/k norm, own a
    device GEMV for every qtype it serves, and place the whole decode step on the
    device or say it did not. Every item is a behaviour delta against the CPU
    forward, which is the oracle (leg A of backend-parity-matrix-v1).

equations:
  rope_theta_from_metadata:
    formula: |
      theta_used := gguf[<arch>.rope.freq_base]  (default only when the key is absent, and then logged)
      PASS  <=>  theta_used = theta_cpu for every model in the ledger
    domain: 'model metadata of one GGUF'
    codomain: bool
    invariants:
    - 'A hardcoded 1e6 matches only models whose freq_base happens to be 1e6; that is a coincidence, not a pass.'
    - 'Both RoPE shaders read the same theta. Fixing one and not the other is FAIL.'
    - 'The fixture needs position >= 1 and pos_in_head >= 1. At position 0 the angle is 0, and at pos_in_head 0 the frequency is 1 for every base, so either case makes RoPE blind to theta.'

  head_dim_from_metadata:
    formula: |
      head_dim := gguf[<arch>.attention.key_length]  if present  else hidden / n_heads
      PASS  <=>  head_dim_wgpu = head_dim_cpu
    domain: 'model metadata of one GGUF'
    codomain: bool
    invariants:
    - 'hidden / n_heads is the fallback, never the first choice.'

  qk_norm_applied:
    formula: |
      arch has q_norm/k_norm tensors  =>  wgpu applies RMSNorm to q and k per head before RoPE
      layer_cos(l) = cos(attn_out_wgpu(l), attn_out_cpu(l))
      PASS  <=>  min over layers of layer_cos >= 0.9999 on the fixture
    domain: 'per-layer attention output, one prompt'
    codomain: bool
    invariants:
    - 'Attribution of the 0.955 end-to-end cosine to q/k norm is UNMEASURED (K14) until the layer-diff trace runs.'
    - 'The fixture needs norm weights that are not all 1, and q/k whose per-head RMS is not 1. Otherwise RMSNorm is close to identity and a path that skips it still passes.'

  qtype_coverage:
    formula: |
      served(q) on wgpu  =>  device_gemv(q) exists  OR  the load is refused with a named error
      silent CPU widen or fallback for q  =>  FAIL
    domain: 'q in {Q4_K, Q6_K, Q8_0, Q4_0, F32}'
    codomain: bool
    invariants:
    - 'A refusal is honest; a silent fallback is not (R1 F6).'
    - 'Today Q6_K and Q5_K are widened to F32 on the host at load (dequant_tensor_public), and the device runs an F32 GEMV. op_placement reads device either way, so the receipt must also carry, for each weight tensor, the qtype as stored on the device. A widen shows as device_qtype = F32 for a file qtype that is not F32.'

  device_placement_honesty:
    formula: |
      host_ops := {op : op_placement[op] = host}
      receipt.hybrid = (host_ops != {})
      PASS  <=>  receipt.hybrid is computed from op_placement, never set by hand
    domain: 'the R1 receipt op_placement map'
    codomain: bool
    invariants:
    - 'Until attention, RoPE, LM head and argmax run on the device, every wgpu receipt is hybrid: true (RQ-4 pending).'

falsification_tests:
- id: FALSIFY-WGF-001
  rule: rope_theta comes from metadata
  prediction: 'A synthetic 1-layer fixture with freq_base = 1e4, at position >= 1 and head_dim >= 4, gives a RoPE output that differs from the 1e6 output and matches the CPU forward. This holds for both RoPE shaders.'
  test: 'NOT YET WRITTEN — lands with R2 item 1'
  if_fails: 'every non-1e6 model decodes with the wrong rotation on wgpu'
  mutation: 'restore the hardcoded 1e6 in ONE of the two shaders; the fixture must turn RED. Also move the fixture to position 0; the test must refuse it as blind to theta, not pass it'
- id: FALSIFY-WGF-002
  rule: head_dim comes from metadata
  prediction: 'A synthetic config with key_length != hidden / n_heads matches the CPU forward (cosine >= 0.9999).'
  test: 'NOT YET WRITTEN — lands with R2 item 2'
  if_fails: 'shape mismatch or silent mis-stride on models with decoupled head_dim'
  mutation: 'compute head_dim as hidden / n_heads; the fixture must turn RED'
- id: FALSIFY-WGF-003
  rule: Qwen3 q/k norm is applied on wgpu
  prediction: 'On a Qwen3 fixture the per-layer attention cosine vs CPU is >= 0.9999 at every layer.'
  test: 'NOT YET WRITTEN — gated on the K14 layer-diff trace (Next#1, deferred while train-active)'
  if_fails: 'the wgpu Qwen3 path stays near 0.955 end to end and fails E1'
  mutation: 'skip the q/k norm dispatch; layer 0 cosine must drop below the floor. The fixture uses non-unit norm weights and q/k RMS != 1, or skipping the norm cannot move the cosine'
- id: FALSIFY-WGF-004
  rule: no silent CPU fallback for an unsupported qtype
  prediction: 'Every served qtype either has a device GEMV on its native bytes (device_qtype = file qtype in the receipt) or is refused with a named error. A Q6_K or Q5_K model that is widened to F32 at load, as it is today, is FAIL, even though op_placement shows device.'
  test: 'NOT YET WRITTEN — lands with R2 item 4'
  if_fails: 'a receipt labelled wgpu measures CPU work'
  mutation: 'route the refused qtype to the CPU dequant path; the receipt check must turn RED'
- id: FALSIFY-WGF-005
  rule: hybrid is derived, not declared
  prediction: 'A receipt with any op_placement = host and hybrid: false is rejected by the receipt checker.'
  test: 'NOT YET WRITTEN — lands with the R1 harness receipt checker'
  if_fails: 'a hybrid run is scored as a full-device run'
  mutation: 'let the harness write hybrid from a flag; the planted receipt must be refused'
- id: FALSIFY-WGF-006
  rule: the metadata fixes do not regress other models (K13)
  prediction: 'After items 1-2, every ledger model keeps or improves leg A. It is measured head vs base in the SAME run on the same host, never against a stored prior value (never-worse rule).'
  test: 'NOT YET WRITTEN — ledger sweep on C1 once train-inactive; base and head builds swept in one job'
  if_fails: 'a model that matched 1e6 by coincidence regresses unnoticed'
  mutation: 'run the sweep on one model only; the check must refuse a single-model sweep as incomplete'

proof_obligations:
- type: invariant
  property: 'theta used on wgpu equals theta used on CPU (FALSIFY-WGF-001)'
  formal: 'forall m: theta_wgpu(m) = theta_cpu(m)'
- type: invariant
  property: 'head_dim used on wgpu equals head_dim on CPU (FALSIFY-WGF-002)'
  formal: 'forall m: head_dim_wgpu(m) = head_dim_cpu(m)'
- type: invariant
  property: 'q/k norm parity per layer (FALSIFY-WGF-003)'
  formal: 'has_qk_norm(m) => forall l: layer_cos(l) >= 0.9999'
- type: invariant
  property: 'every served qtype has a device GEMV or is refused (FALSIFY-WGF-004)'
  formal: 'served_wgpu(q) => device_gemv(q) or refused(q)'
- type: invariant
  property: 'hybrid flag is a function of op_placement (FALSIFY-WGF-005)'
  formal: 'r.hybrid = exists op: r.op_placement[op] = host'
- type: invariant
  property: 'no ledger model regresses (FALSIFY-WGF-006)'
  formal: 'forall m in ledger: leg_a_after(m) >= leg_a_before(m) - 1e-4'

qa_gate:
  id: F-WGF-GATE-001
  name: 'the wgpu forward is complete enough for a C1-C3 E1 receipt'
  description: '0.73 exit (R2): R2 items 1-5 land; E1 >= 0.995 per leg on C1-C3 for the ledger models. R2 item 6 (the gated-delta WGSL route) may slip to 0.74; it has no equation here. FALSIFY-WGF-006 is the K13 no-regression sweep, which is not R2 item 6.'
  checks:
  - rope_theta_from_metadata
  - head_dim_from_metadata
  - qk_norm_applied
  - qtype_coverage
  - device_placement_honesty
  pass_criteria: 'All falsifiers GREEN on C1. Report-only until first-green plus 7 nights (R-7).'

verification_summary:
  total_obligations: 6
  proven: 0
  tested: 0
  status: proposed
  notes: 'Draft by la-73 (L3). No ticket yet. WGF-003 waits on the K14 trace; WGF-006 waits on a train-inactive C1 sweep.'
