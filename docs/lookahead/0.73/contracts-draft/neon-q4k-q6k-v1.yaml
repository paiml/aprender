metadata:
  version: 0.1.0
  kind: kernel
  created: '2026-09-27'
  author: PAIML Engineering
  references:
  - 'docs/lookahead/0.73.md R3: NEON Q4_K / Q6_K kernels (draft: la-73 drafts/R3-neon-q4k-q6k.md)'
  - 'epic aprender#3999: 0.73 "Runs Everywhere", cell C4 (gx10 aarch64 CPU)'
  - 'contracts/avx512-q4k-v1.yaml: the 1e-3 relative epsilon this contract first copied (replaced 2026-10-03 by a derived bound)'
  - 'N. J. Higham, Accuracy and Stability of Numerical Algorithms, 2nd ed., SIAM 2002, section 3.1 and Lemma 3.1: the basis of the neon_scalar_parity bound'
  - 'la-73 drafts/backend-parity-matrix-v1.yaml: E1 composed-leg method used by E-R3-3, and receipt_shape.info_rows, which carries c4_default_route_info (item e)'
  description: >
    Today every quantized dot in aprender-serve is x86-gated. On aarch64 the three
    dispatchers (quantize/fused_k.rs:193 fused_q4k_dot_simd, quantize/fused_q5k_q6k.rs:118
    fused_q6k_dot_simd, quantize/q4k_dot_avx2.rs:338 fused_q4k_q8k_dot_simd, compiled via include! at fused_k.rs:370) fall through
    to scalar while the backend label says NEON. This contract adds a cfg(aarch64) arm
    to each: NEON f32-widening kernels for q4k-f32 and q6k-f32, and for q4k-q8k an sdot
    kernel behind is_aarch64_feature_detected!("dotprod") with a widening fallback.
    The oracle for each kernel is the existing scalar function it sits in front of.
    L25 note (main 316dee2cd4): quantize/fused_q4k.rs is an ORPHAN. No mod or include! names
    it, and it is byte-identical (360 lines) to q4k_dot_avx2.rs. An arm added there compiles
    nothing, and every NEON test passes vacuously against the old x86/scalar code.
    A second orphan, quantize/fused_q.rs, is an older copy of q5k_q6k_matvec.rs. It holds matvec
    wrappers, not dots, so it is never a site.

equations:
  neon_scalar_parity:
    formula: |
      for k in {q4k-f32, q6k-f32, q4k-q8k}, seeded rows b of n super-blocks, activations x:
        |neon_k(b, x) - scalar_k(b, x)| <= tol_k(b, x) = 2 * gamma(K_k) * S_k(b, x)
      gamma(m) = m * u / (1 - m * u), with u = 2^-24 (the f32 unit roundoff)
      K = 256n + 2 for q4k-f32 and q6k-f32, and 16n + 2 for q4k-q8k
      S_q4k-f32 = sum over values i of |d * sc_j * q_i * x_i| + |dmin * m_j * x_i|   (i in sub-block j)
      S_q6k-f32 = sum over values i of |d * sc_g * (q_i - 32) * x_i|   (i in scale group g)
      S_q4k-q8k = sum over sub-blocks j of |q8s * d * sc_j * S_j| + |q8s * dmin * m_j * Q_j|,
        where S_j = sum of q_i * q8_i and Q_j = sum of q8_i over j, both exact integers
    domain: 'rows of n super-blocks (256n values), n in {1, 2, 3, 7, 8, 36}, of Q4_K or Q6_K with f32 or Q8_K activations'
    codomain: bool
    preconditions:
    - 'x.len() == 256 * n (for q4k-q8k: q8.len() == 256 * n and q8s.len() == n)'
    - x.iter().all(|v| v.is_finite())
    - 'b.len() == n * 144 for q4k and n * 210 for q6k, with n in {1, 2, 3, 7, 8, 36}. Multi-block rows run the accumulator reset and the block loop, and 8 and 36 are the production row lengths (in_dim 2048 and 9216)'
    - 'fixture d and dmin are finite, normal f16 by construction (random f16 bytes are Inf/NaN for 1 draw in 32)'
    - 'fixture 6-bit scales and mins differ across the 8 sub-blocks, and dmin != 0 (otherwise the min term is invisible)'
    - 'S_k is computed in f64 from the block fields and x, never from a dot. The test takes |neon - scalar| in f64, where the difference of two f32 is exact'
    - 'masked sweep, at n in {1, 8, 36}: one case per scale group of every block (32 values for Q4_K and q4k-q8k, 16 for Q6_K), on rows whose scales are all non-zero. x is zero outside the group and takes the signs of the dequantized weights inside it. Every case has |scalar_k| >= 10 * tol_k > 0, asserted before comparing (the power guard)'
    postconditions:
    - neon_k(b, x).is_finite() == scalar_k(b, x).is_finite()
    - '(f64::from(neon_k(b, x)) - f64::from(scalar_k(b, x))).abs() <= tol_k(b, x)'
    invariants:
    - 'The scalar oracle is the dispatcher fallback (fused_q4k_dot, fused_q6k_dot, fused_q4k_q8k_dot), unchanged by this work.'
    - 'Basis: Higham, Accuracy and Stability of Numerical Algorithms, 2nd ed. (2002), section 3.1 and Lemma 3.1. A sum whose every term passes through at most K roundings, in any order and with or without FMA, is within gamma(K) * sum|t| of the exact sum (without underflow or overflow, which the fixtures are far from). Both kernels meet that, so they differ by at most 2 * gamma(K) * S. No fixture can turn the check RED without a kernel defect, at any row length, and nothing is tuned to pass.'
    - 'K, read at 316dee2cd4. d * sc * q is exact in f32 (11 + 6 + 4 significant bits for Q4_K, at most 23 for Q6_K), and so is dmin * m. The scalar oracles round a term at most 256n + 1 times (Q4_K: the subtraction, the product, then up to 256n - 1 additions), 256n times (Q6_K) and 8n + 2 times (q4k-q8k). Lane-parallel orders round far less: 8n + 6 to 8n + 38 for the q4k-f32 shapes checked, n + 4 for sdot. 16n + 2 also covers summing all 16n scale and min terms of a q4k-q8k row in one accumulator. The NEON kernel states its own count next to its code, and that count must not exceed K.'
    - 'S_k sums the terms, not the dot, so S >= |dot|, and S >> |dot| on a cancelling row. Summation-order error grows with S. That is why the earlier 1e-3 * max(1, |dot|), copied from avx512-q4k-v1, could fail a long cancelling row with no defect, and why it kept value parity at 1 to 7 blocks.'
    - 'q4k-q8k: the bound holds only if the kernel forms each sub-block''s integer sums S_j and Q_j exactly, in i32, before any f32 rounding (|S_j| <= 32 * 15 * 128 = 61 440 < 2^24). The scalar oracle does (q4k_dot_avx2.rs:232), and so do sdot and the widening kernel. A kernel that rounds partial sums to f32 needs an S over those partials.'
    - 'L25 power. At n = 36 the bound is about 1.1e-3 * S, and one 32-value group carries about 1/288 of S. On full random rows a NEON arm that skips one group stays GREEN in 85% of cases (simulated: the skipped dot is a median 0.08 of the bound). In the masked sweep one group carries all of S, so a skipped group misses by its whole dot. At n = 36 that is at least 184 bounds for Q4_K and 4253 for q4k-q8k (simulated), and exactly 1 / (2 * gamma(K)), about 910, for Q6_K. The power guard turns a fixture without a 10x margin RED, so the sweep cannot pass vacuously.'
    - 'L25: the q4k-q8k widening fallback is unreachable on gx10 (it has dotprod), so dispatch never exercises it. Its parity runs through a test-only entry that calls the widen kernel directly (FALSIFY-NEON-Q4K-007).'
  dispatch_honesty:
    formula: |
      on aarch64: kernel_path(k) starts with "<k>/neon"
      q4k-q8k without dotprod: kernel_path = "q4k-q8k/neon-widen"
      on any arch: kernel_path(k) names only a kernel the call actually reaches
    domain: 'the three dispatchers on the running CPU'
    codomain: bool
    preconditions:
    - k in {q4k-f32, q6k-f32, q4k-q8k}
    - 'kernel_path(k) is read from the same process that runs the dot, after dispatch'
    postconditions:
    - 'cfg!(target_arch = "aarch64") implies kernel_path(k).starts_with(k + "/neon")'
    - 'k == q4k-q8k and !is_aarch64_feature_detected!("dotprod") implies kernel_path(k) == "q4k-q8k/neon-widen"'
    invariants:
    - 'A label that names a kernel the call does not reach is FAIL. This is the defect class of the SimdBackend::Neon label today.'
  matvec_row_parity:
    formula: |
      for each matvec entry e in A..G, shape (in_dim, out_dim), token t < m_e and row r < out_dim:
        dot_e(W[r], x_e[t]) returns Ok(v), and |matvec_e(W, x)[t][r] - v| < 1e-3 * max(1, |v|)
      A..E are the decode entries, with m_e = 1. F and G are the prefill (multirow) entries, with m_e = 3 and token-major output.
      dot_e is the dispatcher the entry calls per row: fused_q4k_dot_simd (A, B), fused_q4k_q8k_dot_simd (C, D, G), fused_q6k_dot_simd (E, F).
      x_e[t] is token t for the f32 entries, and its Q8_K quantization (quantize_activations_q8k_into, quantize/mod.rs:241) for C, D and G.
    domain: 'every output row of a decode matvec, and of each token of a prefill multirow matmul, at production row lengths, on aarch64'
    codomain: bool
    preconditions:
    - 'kernel_path(k) starts with "<k>/neon" for all three kernels (dispatch_honesty), so the rows run NEON and not scalar'
    - 'in_dim in {2048, 9216}: 8 and 36 super-blocks per row, the production lengths, which neon_scalar_parity also runs (item d). At 9216 > MAX_STACK_DIM 8960 (parallel_k.rs:328), entry C quantizes into heap buffers (:347) instead of stack ones (:331)'
    - 'out_dim in {48, 300}. 48 takes the sequential branches (q5k_q6k_matvec.rs:341 for out_dim <= 64, generic_matvec.rs:120 below 256). 300 takes the parallel ones (q5k_q6k_matvec.rs:319, generic_matvec.rs:128) and ends in a 44-row tail tile. F tiles rows by 64 at 8 blocks and by 32 at 36 blocks (generic_matvec.rs:226), so each shape ends in a part tile of 48, 44, 16 or 12 rows'
    - 'every direct dot has |v| >= 0.01, asserted before comparing: a 0.0 row next to a near-zero dot passes the bound'
    - 'the output is filled with NaN first, so a row the entry never writes cannot pass'
    - 'DIRECT_FP32_GEMV is not "1", so entry C takes its default Q8_K route (parallel_k.rs:303-304) and entry G its multirow Q8_K route (q4k_q8k_multirow.rs:178-179)'
    - 'm_e = 3 for F and G. G takes its multirow route only for m > 1 (q4k_q8k_multirow.rs:179); at m = 1 it is entry A or C per token'
    - 'weights come from the neon_scalar_parity block generators'
    postconditions:
    - 'every entry returns Ok, and every row meets the formula'
    invariants:
    - 'Every CPU matvec writes 0.0 for a row whose dot returns Err (parallel_k.rs:320, direct_f32.rs:63, q5k_q6k_matvec.rs:331-350 and :437-448, generic_matvec.rs:126/:143, and the multirow generic_matvec.rs:239). The caller never sees a NEON Err, so the test calls each row''s dot directly.'
    - 'neon_scalar_parity expects Ok from the dot, but only on its own random fixtures. A NEON arm that errs only on an input those fixtures never draw (mutation 2: one planted block) passes it, and the matvec turns the Err into a 0.0 row.'
    - 'One 0.0 row among 300 rows of similar size moves that output''s cosine to about sqrt(1 - 1/300) = 0.998, above the 0.995 floor, so a cosine gate can pass it. The check is per row.'
    - 'The reference is the NEON dot itself, not the scalar oracle: this equation asks whether each row holds its own dot. Value parity is neon_scalar_parity''s, which runs at 8 and 36 blocks under its error term since item (d) (2026-10-03).'
    - 'Not entries at 316dee2cd4, since no C4 decode path calls them: bsum_precompute.rs:296/:312 (fused_q4k_q8k_parallel_matvec_with_bsums_into, called only by its own tests) and fused_gate_up.rs:134-163 (Gemma-1, gated-LayerNorm and FFN-norm-less archs, ffn_block.rs:58).'
    - 'F and G have no C4 caller at 316dee2cd4 either. Their only production caller, matmul_rows (forward_qwen35.rs:1416), is reached only from forward_prefill_qwen35 (:1200), and only forward_qwen35_prefill_tests.rs calls that. They are entries anyway. FALSIFY-4228-004 and -005 check the batched prefill bit-identical to forward_single_qwen35, and a NEON Err would pass them: on aarch64 both sides call the same dot on the same row and swallow the Err into the same 0.0. Wiring the batched prefill into a run would otherwise open this hole with no red test.'
    - 'G ignores with_fp32_activations: it reads only DIRECT_FP32_GEMV (q4k_q8k_multirow.rs:178-179; R1 mechanism list). On aarch64 it quantizes each token to Q8_K (:194-199) and runs fused_q4k_q8k_parallel_matvec_into, the row loop of C, once per token (:137-147). So its reference is the Q8_K dot of each token, and the test runs it outside the scope. The test stays valid if the scope is honoured later.'
    - 'fused_q5k_multirow_matmul_into is not an entry: Q5_K is not an R3 kernel.'
  c4_e1_leg:
    formula: |
      leg = min over E1 prompts of cos(logits_apr_c4_neon, logits_apr_c0_x86)
      PASS  <=>  leg >= bpm.leg_floor   (0.995, resolved from evidence/parity/thresholds.yaml; Qwen3-dense Q4_K_M, n_prompts >= 16)
    domain: 'prefill-final and teacher-forced decode logits (the earlier "final-position logits" was stale after the BPM-013 positions precondition, 2026-10-03)'
    codomain: bool
    preconditions:
    - n_prompts >= 16
    - logits_apr_c4_neon.len() == logits_apr_c0_x86.len()
    - 'both runs use the same GGUF sha256 and the same token ids'
    - 'every kernel_path entry of a Q4_K or Q6_K GEMV in the C4 run has a kernel_id containing "/neon" (dispatch_honesty holds); otherwise the leg is not_measured. The rule covers quantized GEMV entries only. F32 ops (norms, rope) carry no NEON quant kernel, and a rule over every entry could never hold. Shape: apr-kernel-path-v1 entries (P1 spec §3a)'
    - 'the C0 reference and the C4 run use the same cpu_ref_path (R1 FALSIFY-BPM-008; RQ-5 ruled fp32_act), otherwise the leg measures activation quantization, not NEON'
    - 'positions = prefill-final plus >= 8 teacher-forced decode positions per prompt, and >= thresholds.min_positions (64) in total (R1 FALSIFY-BPM-013)'
    - 'L25 (2026-10-03): an equal cpu_ref_path LABEL is necessary, not sufficient. Per R1 §11a (corrected 2026-10-03), the label does not fix every tensor: crushed Q4_K blocks switch to f32 per call, and C0 and C4 compute slightly different x, so the switch can differ at the margin. Multirow Q4_K reads only DIRECT_FP32_GEMV, and Q4_0/Q8_0 have no f32 path. Q5_K/Q6_K are f32 on both hosts. The C0 and C4 kernel_path entries must agree on precision for every (tensor, op), not per OBS slot (op, shape_class), which keeps one entry where a Q4_K_M file mixes Q4_K and Q6_K (R1 L25, 2026-10-03); otherwise not_measured.'
    postconditions:
    - every per-position cosine is finite
    invariants:
    - 'The gate reads the per-prompt minimum. It is one leg of the R1 composed bound.'
    - 'L25: leg >= 0.995 was listed as a postcondition. It is the gate decision, and a postcondition that a FAIL violates is not a property of the computation. It now lives only in the formula.'
    - 'R1 FALSIFY-BPM-012 (no self-comparison) compares kernel_id per tensor and ignores arch, so a second machine alone does not meet it: one scalar kernel on both hosts is a self-comparison (P1 f012c). This leg meets it through the dispatch_honesty precondition above. Every C4 Q4_K and Q6_K GEMV entry names a /neon kernel, and dispatch_honesty forbids an x86 run to name one (NEON is compiled out there), so no quantized tensor shares a kernel_id. At 316dee2cd4 the f32 Q4_K and Q6_K dots have no aarch64 arm (fused_k.rs:201, fused_q5k_q6k.rs:123): the C4 entries are scalar, and the leg is not_measured until R3 lands.'
    - 'L25 (2026-10-03): with fp32_act on both hosts, the C4 run is the R1 reference forward run token by token, so it reaches entries A, B and E of NEON-Q4K-008 only. The default Q8_K route C (parallel_k.rs:303-304), D, and the prefill entries F and G are never part of this leg. The NEON kernel of C, D and G, q4k-q8k, is checked per kernel only (neon_scalar_parity, NEON-Q4K-007, -008). F runs the Q6_K dot that E covers (generic_matvec.rs:188), so only its multirow row loop is outside the leg (NEON-Q4K-008). Dense Qwen3 decode in forward_single_with_cache, the forward this leg runs, never reaches D on either route: D runs only from the non-fused gated branch (ffn_block.rs:58, then fused_matmul_into.rs:180-187 and fused_gate_up.rs:227) and from scratch_q8k_up_gate (results.rs:33), which only the scratch and traced forwards reach (results.rs:608, traced.rs:179). Item (e), 2026-10-03: a default-route C4 run is reported by c4_default_route_info as an info row only (RQ-5), never as this leg.'
    - 'Leg B of the C4 cell is cos(logits_apr_c0_x86, logits_llamacpp_cpu). The triangle bound needs leg B on the same reference vector as leg A, so it is the C0 cell''s leg B. It is reused only if the prompt_set_sha256, model_sha256 and cpu_ref_path all match, and the receipt cites it by sha256. llama.cpp on aarch64 is then measured only for E2 speed, not for correctness, which the bound does not need.'
    - 'The receipt spans two hosts (C0 for the reference, C4 for the backend). The P1 identity block is per run, not per receipt, so a host mismatch between runs is expected here and is not a BPM refusal.'
  c4_default_route_info:
    formula: |
      d4 = the C4 apr CPU run (gx10 aarch64) on the default route (no with_fp32_activations scope, DIRECT_FP32_GEMV unset)
      d0 = the C0 apr CPU run (x86) on the default route
      f0 = the C0 apr CPU fp32_act run that c4_e1_leg reads as its reference, cited by run sha256
      r1 = cos(d4, f0)   end to end: the gx10 default route against the E1 reference
      r2 = cos(d0, f0)   the x86 activation-quantization gap
      r3 = cos(d4, d0)   the cross-host kernel difference on one route
      info = { r1, r2, r3 as {min,median,max,n} over the positions, route default, labels {d4, d0},
               q8k_tensors, f32_only_tensors, status, reason }
      measured(info) <=> route_proof(d4) and route_proof(d0) and bound(d4, d0, f0)
                         and triangle(r1, r2, r3) and finite(r1, r2, r3)
      INFO ONLY (RQ-5): never a gate, never a leg, never in qa_gate.checks (R1 FALSIFY-BPM-018)
    domain: 'the positions of c4_e1_leg: prefill-final and teacher-forced decode logits'
    codomain: 'one row of R1 receipt_shape.info_rows, status measured or not_measured(reason)'
    preconditions:
    - 'd4, d0 and f0 use the GGUF sha256, prompt_set_sha256, token ids and positions of c4_e1_leg: prefill-final plus >= 8 teacher-forced decode positions per prompt, >= thresholds.min_positions (64) in total (R1 FALSIFY-BPM-013)'
    - 'every logits pair has equal length and nonzero norms. The cosine helpers return 0.0 otherwise (parity_per_op_table.rs:61-75, forward_error.rs:254-270), and a 0.0 reads as a real cosine'
    - 'route_proof(d): at least one Q4_K (tensor, op) entry in the kernel_path of d has a q4k-q8k kernel_id. Dense Qwen3 in the fp32 scope has none, so this tells the routes apart; the route field of the row is not proof (FALSIFY-NEON-Q4K-009, fN9a). Otherwise not_measured(route_unproven)'
    - 'bound(d4, d0, f0): the three runs agree on model_sha256 and prompt_set_sha256, every pair has the n of leg_a, and the run sha256 of f0 is the apr CPU run that leg_a cites (fN9c). Otherwise not_measured(unbound)'
    - 'triangle(r1, r2, r3): with a_i = acos(clamp(r_i.min, -1, 1)), each a_i <= the sum of the other two + 1e-3 rad (fN9d). Otherwise not_measured(inconsistent)'
    postconditions:
    - 'labels {d4, d0} are derived by the checker from kernel_path: the ISA family (the kernel_id text after "/" up to the first "-", e.g. neon, avx2 or scalar) shared by every Q4_K and Q6_K matvec entry of the run, else mixed. Never from the producer, never from arch (fN9b)'
    - 'q8k_tensors counts the Q4_K (tensor, op) entries of d4 that reached q4k-q8k, and f32_only_tensors the quantized (tensor, op) entries of d4 that reached only f32 kernels (Q6_K, and a Q4_K tensor crushed on every call)'
    - 'a non-finite cosine makes the row not_measured(non_finite). The row is still reported, and the receipt is never refused for it (R1 FALSIFY-BPM-018), unlike a non-finite leg cosine (BPM-009)'
    invariants:
    - 'Info only (RQ-5, ruled fp32_act by the cop on 2026-09-27; q8k_act is an info row only). The default route is the mixed path of R1 §11a: Q4_K on Q8_K activations, Q6_K and crushed Q4_K blocks on f32. RQ-5 calls a run on it q8k_act. The row says default because not every tensor is Q8_K.'
    - 'Not a gate: #3714 quotes CUDA MoE at cos 1.000000 against fp32_act and 0.985 against the production Q8_K path (Qwen3-Coder-30B-A3B, not re-measured), so r2 may sit near 0.985, under the 0.995 floor; dense Qwen3 is unmeasured [U]. A gated default-route leg would then measure activation quantization, not NEON. GPU paths use exact-FP32 activations (R1 §11), so the default route has no GPU-cell analogue, and the earlier wording (a C4 leg against the reference "as a GPU cell runs") is withdrawn. Gating the default route on C4 is RQ-6 (handoff, 2026-10-03), with r3 as the candidate; the provisional S-4 default is info only.'
    - 'Dense Qwen3 decode in forward_single_with_cache on the default route: every Q4_K tensor, lm_head included, runs entry C (parallel_k.rs:303-304, then :326); Q6_K runs E; crushed Q4_K blocks run B (ffn_block.rs:790-792, :799-801), mostly at the first token. D is not reached on either route: it runs only from the non-fused gated branch (ffn_block.rs:58, then fused_matmul_into.rs:180-187 and fused_gate_up.rs:227) and from scratch_q8k_up_gate (results.rs:33), which only the scratch and traced forwards reach (results.rs:608, traced.rs:179). At 316dee2cd4 the q4k-q8k dot of C has no aarch64 arm (bsum_precompute.rs:237, then q4k_dot_avx2.rs:343 on x86 and :359 scalar), so label(d4) reads scalar until R3 lands.'
    - 'r3 compares two kernels only where the labels of d4 and d0 differ (BPM-012 compares per tensor). With both scalar it compares one kernel with itself, and the labels show that.'
    - 'The triangle check holds for any three vectors. At each position the angles obey the triangle inequality. For the maxima, take for each i the position p* where the angle of r_i peaks: a_i = theta_i(p*) <= theta_j(p*) + theta_k(p*) <= a_j + a_k. A broken triangle means the cosines are not of the three cited vectors. It catches gross provenance errors only; the run binding is the real check. The 1e-3 rad slack covers f32 cosines: the helpers accumulate in f64 and return f32, so each angle is off by at most sqrt(2^-24) = 2.44e-4 rad (checked numerically, 2026-10-03), 7.3e-4 over three.'
    - 'Runs (plan only, C277): C4 twice (fp32_act for c4_e1_leg, default for this row) and C0 twice (f0 and d0).'
  c4_e2_speed:
    formula: |
      r = tok_s_apr_c4 / tok_s_llamacpp_ggml_cpu   (llama.cpp d1d3c3396)
      PASS  <=>  paired-bootstrap 95% ci.lo(r) >= 0.5
    domain: 'decode tok/s, n >= 5 runs per engine'
    codomain: bool
    preconditions:
    - runs_apr.len() >= 5 && runs_llamacpp.len() >= 5
    - llamacpp_sha == "d1d3c3396"
    - 'both engines run on the same host, same model file and same thread count'
    - 'n_gen is fixed and EOS is ignored on both engines (R1 FALSIFY-BPM-015)'
    - 'host load1 / nproc < 1.0 before and after each run, otherwise the sample is not_measured'
    postconditions:
    - bootstrap_ci95(runs_apr, runs_llamacpp).lo >= 0.5
    invariants:
    - 'Report-only until first green plus 7 green nights (TRACE-001 R-6).'

falsification_tests:
- id: FALSIFY-NEON-Q4K-000
  rule: the aarch64 build floor holds
  prediction: 'cargo check -p aprender-serve --lib --target aarch64-unknown-linux-gnu exits 0 with 0 new aarch64 warnings (baseline rc 0 at aca6f2d7f6, 2026-09-27).'
  test: 'NOT YET WRITTEN. Lands with R3 as a report-only CI step'
  if_fails: 'x86 CI never compiles aarch64 cfg bodies, so a break there ships unseen'
  mutation: 'call an x86-only intrinsic inside a cfg(aarch64) body; the check must exit non-zero'
- id: FALSIFY-NEON-Q4K-001
  rule: q4k-f32 NEON matches scalar within the summation bound
