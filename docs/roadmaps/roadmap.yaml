    - Header shows actual count from inference engine: ''Generated 10 tokens in 5920.0ms (1.7 tok/s)''

    - Benchmark section shows word approximation: ''tok/s: 0.3, tokens: 5''


    Root cause: execute_inference() returns only text, discarding result.generated_token_count.

