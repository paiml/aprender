- id: PMAT-F2-DECODE-PHASE-001
  github_issue: null
  item_type: task
  title: Extend the GPU first-token probe to multi-step decode through the production prefill mode
  status: planned
  priority: high
  assigned_to: null
  created: 2026-07-05 00:00:00+00:00
  updated: 2026-07-05 00:00:00+00:00
  spec: docs/specifications/fable-architectural-review.md
  acceptance_criteria:
  - validate_gpu_first_token is extended with >=8 greedy decode steps executed through the SAME prefill
    mode production selects, per-step argmax + cosine>=0.95 vs CPU; new FALSIFY-CPU-GPU-012 in apr-cpu-vs-gpu-output-parity-v1.yaml
    (NOT 007 - ids 001-011 are all taken and 007 is PMAT-742, the no-false-positive falsifier for this
    very function; total_obligations must go 11 -> 12).
  - 'RED-turning mutation: corrupt the batched-prefill KV scatter (or truncate the cache at decode step
    4) — the probe MUST reject; today it accepts because it validates only serial prefill (BATCHED_PREFILL
    still default on sm_89).'
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - pillar-4
  - gate
  - fable-review-2026-07-05
  - ev-rank-03
  - gates-or-theater
  notes: 'PREREQ FINDINGS (2026-07-29 recon, verified in-tree - read before starting): (1) validate_gpu_first_token
    executes ZERO decode steps AND never calls run_prefill, so it exercises neither batched-prefill kernels
    nor any cached decode - the in-code comment at generate_2.rs claiming it -only checks the FIRST token-
    was itself stale (since PMAT-919 it checks every PROMPT position) and is corrected in this tree. (2)
    run_prefill is a PRIVATE method on OwnedQuantizedModelCuda in gguf::cuda while the probe lives in
    infer::inference_result - the probe physically cannot call production prefill today; raising it to
    pub(crate) or adding a probe entry point inside gguf/cuda is a design decision, not a mechanical edit.
    (3) No public API returns per-step LOGITS from the production path - generate_gpu_resident returns
    Vec<u32> only; generate_gpu_resident_logprobs is the nearest precedent to model a logits-capturing
    helper on. (4) The probe resets the GPU KV cache before AND after its loop so validation does not
    consume the model; running real prefill will allocate the prefill workspace and arm flash decoding,
    so that teardown discipline must be re-derived. (5) The RED-turning mutation is NOT reachable by default
    on both legs: batched prefill is default only on non-Blackwell (run_prefill: Err(_) => !is_blackwell),
    so the gb10 leg needs an explicit BATCHED_PREFILL=1 matrix entry to be honest. (6) TRAP, not yet a
    live bug: cuda/gpu_profile.rs detect_batched_prefill() returns unwrap_or(true) and ignores the Blackwell
    carve-out that run_prefill applies, so GpuProfile.batched_prefill disagrees with the real decision
    on Blackwell. It currently has ZERO readers (verified), so nothing is misreported today - but any
    -the SAME prefill mode production selects- assertion must read the run_prefill decision, never that
    field. (7) The probe fails OPEN when the CPU reference forward errors and when BOS is unknown; a decode
    extension inherits both holes. (8) No workflow runs cargo test -p aprender-serve --features cuda --lib,
    so cuda-nightly needs a new step. ORIGINAL: The #1864 remediation probe validates only serial prefill;
    generate_2.rs:246-268 documents in-code that batched-prefill decode corruption (PMAT-810 ''CertainlyCertainly'')
    ships through it silently. Workflow: ticket -> branch -> PR -> ci/gate; verify on cuda-nightly both
    silicon legs. Source: docs/specifications/fable-architectural-review.md §7b ev_rank 3.'
