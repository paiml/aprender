  item_type: task
  title: 'FIXED: PMAT-127 APR from GGUF produces garbage (dtype mismatch)'
  status: completed
  priority: medium
  assigned_to: null
  created: 2026-01-28 23:40:09.296872+00:00
  updated: 2026-01-30 19:20:00+00:00
  spec: null
  acceptance_criteria:
  - '[x] apr check /tmp/test.apr passes 10/10 stages'
  - '[x] apr trace --payload shows valid logits (L2=1311.75, not NaN)'
  - '[x] Root cause identified: dtype byte mismatch (APR 12=Q4K, realizar expected 8)'
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - bugfix
  - p0-resolved
  notes: 'Root Cause: DType byte mapping mismatch between aprender and realizar.

    - APR format uses dtype 12 for Q4K, 14 for Q6K (per aprender/src/format/v2.rs)

    - realizar read dtype 12 as fallback "F32" causing NaN logits

    Fix: Updated realizar/src/apr/mod.rs from_binary() dtype mapping.

    Commits: aaa0f9a3, 734a076f

    '
