  status: completed
  priority: medium
  assigned_to: null
  created: 2026-01-28T23:40:09.296872973+00:00
  updated: 2026-01-30T19:20:00+00:00
  spec: null
  acceptance_criteria:
  - '[x] apr check /tmp/test.apr passes 10/10 stages'
  - '[x] apr trace --payload shows valid logits (L2=1311.75, not NaN)'
  - '[x] Root cause identified: dtype byte mismatch (APR 12=Q4K, realizar expected 8)'
