  status: completed
  priority: high
  assigned_to: null
  created: 2026-01-21T18:31:34Z
  updated: 2026-01-21T20:00:00Z
  spec: null
  acceptance_criteria:
  - |-
    **Root Cause**: Model generates 'Human:'/'Assistant:' turns because:
    1. Empty stop_tokens (Vec::new()) passed to QuantizedGenerateConfig - should include EOS token
    2. Model may not match ChatML template - some models use 'Human:'/'Assistant:' format
    3. Output not cleaned of extra turns after generation

    **Evidence**:
    - api.rs:3619 has stop_tokens: Vec::new()
    - User typed 'hey', got 'Human: Hi there...' in response

    **Fix Required**:
    1. Pass proper stop tokens (EOS token ID 151645 for ChatML)
    2. Clean output text after <|im_end|> or stop sequence
    3. Consider auto-detecting model format from GGUF metadata

    **Files**:
    - /home/noah/src/realizar/src/api.rs:3615-3620 (QuantizedGenerateConfig)
    - /home/noah/src/realizar/src/chat_template.rs (template detection)
