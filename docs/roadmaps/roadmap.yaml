    **Root Cause**: CPU streaming in realizar's api.rs is 'fake streaming' - it generates ALL tokens first via generate_with_cache (blocking), THEN streams them one-by-one. True streaming only exists in CUDA path (generate_gpu_resident_streaming).

    **Fix Required**: Add streaming callback support to CPU OwnedQuantizedModel.generate_with_cache() similar to the CUDA path, or implement generate_streaming() method that yields tokens as they're generated.

