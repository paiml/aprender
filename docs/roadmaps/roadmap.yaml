- id: SVC-SMO-WSS-001
  github_issue: null
  item_type: task
  title: 'SVCRbf: upgrade simplified SMO to libsvm 2nd-order working-set selection (WSS)'
  status: planned
  priority: low
  assigned_to: null
  created: 2026-07-04 00:00:00+00:00
  updated: 2026-07-04 00:00:00+00:00
  spec: null
  acceptance_criteria:
  - MultiClassSVC(rbf) reaches sklearn-parity accuracy on the i%3 Iris split at the DEFAULT C=1 (currently
    needs C=10 to reach 0.98; at C=1 the pair 1v2 under-converges to train 0.806).
  - The existing svc-rbf-v1 sklearn-parity falsifiers stay green.
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - pillar-1
  - svm
  - follow-up
  notes: Surfaced by beat_sklearn_svc_accuracy (PMAT-735). apr's SVCRbf uses a simplified Platt/CS229
    SMO whose working-set selection maximises |E_i - E_j| (first-order). On the overlapping versicolor/virginica
    Iris pair at C=1 it stalls short of the max-margin solution (train 0.806 vs sklearn 1.0); a larger
    box constraint C=10 lets it reach 0.98 (ties sklearn). Upgrading to the libsvm 2nd-order WSS heuristic
    (+ shrinking) should close the gap at the default C=1. Purely a convergence-quality improvement; the
    RBF kernel math and existing parity contract are unchanged.
