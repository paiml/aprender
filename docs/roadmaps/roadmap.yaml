  - 'P2-C live falsification (2026-05-17) revealed that PMAT-679..683''s Class 3 packaging cascade (P0-D/E/F/G/H/J)
    was treating symptoms of a single upstream defect. apr convert from-HF-safetensors doesn''t stamp
    hf_architecture, tokenizer.vocabulary, or tokenizer.merges into the imported APR. apr pretrain --init
    then reads None for those fields and downstream P0-* machinery has nothing to propagate. Fix: apr
    convert reads source config.json architectures[0] + tokenizer.json + writes them into apr_metadata.hf_architecture
    + custom.tokenizer.{vocabulary,merges}. Scope ~100 LOC. Unblocks PMAT-679 P0-H half + AC-SHIP2-010
    llama-cli interop. See evidence/p2c-2026-05-17/findings.md.'
