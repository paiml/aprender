#   closed = a close candidate or parent that is now closed not_planned (by others or after the evidence comment), release icebox; close = close candidate still open, release 0.80.0;
#   release icebox means closed, never open.
#   left-alone = release 0.72.3 only: epic #6515 (the 0.72.3 release train), untouched, no planning field written.
