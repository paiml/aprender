# Re-planned at 5 merges/day (the 3-day rate under the N21 freeze), operator rulings 11:17Z: 35 PR-sized tickets per release, never overfilled.
# A split ticket counts as one slot per part (4701 = 3, 4526 = 4); the sum of slots per release is <= 35.
# Epic and tracking rows (size "-") take no slot; only PR-sized leaf tickets count against the 35.
# Owners only from evidence (assignee, owner:<lane> label, parent epic label, epics-progress.md). No ticket in 0.73-0.76 is unowned.
# release values: 0.73.0 .. 0.76.0 = dated releases; 0.80.0 = later work (every slip ticket and every epic with no open child in 0.73-0.76);
#   0.72.3 = the nightly patch milestone (#31, due 11-01), left alone; icebox = closed as not planned (milestone as it was when closed), comment links epic #6521 when closed by this plan.
#   An epic's release is its last open child's release, so an epic never sits before an open child.
#   An epic with no owner evidence (no assignee, label, or epics-progress entry) is unowned, so it sits in 0.80.0, after its children.
# class: ship = in a dated release 0.73-0.76; slip = release 0.80.0, kept open; close = close candidate with an evidence comment, still open;
