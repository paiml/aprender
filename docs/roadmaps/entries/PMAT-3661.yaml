  - 'Issue #3661 done_when 1, verbatim: "`apr inspect` and `apr tensors` on a truncated GGUF and on a random-bytes `.safetensors` do not call the input an APR file unless its magic bytes are APR''s. Exit code stays 4 (same failure class; `lint_exit_convention_tests` unchanged)." Amended 2026-09-21 by the filer, before implementation, verbatim: "this previously read \"print no \\\"APR\\\" in the error\". Core''s unknown-magic message ends with \"Supported formats: APR (.apr), GGUF (.gguf), SafeTensors (.safetensors)\", which names APR without calling the file one. The criterion is about the claim, not the substring."'
