  notes: 'Claimed on the issue by aprender-62 (2026-09-21 08:17Z). HOW IT IS MET. New variant `CliError::InvalidModelFile { format, message }`, Display "Invalid {format} file: {message}", exit code 4 (the same arm as InvalidFormat and InvalidInput). It is built only by `CliError::invalid_model_file(path, context, &e)`, which (a) reads the format from the file''s magic bytes through `commands::hex::detected_model_format`, a new 9-byte wrapper over hex.rs''s existing `detect_format`/`format_display_name` that returns "APR", "GGUF", "SafeTensors", or "model" when the bytes match none or the file cannot be read; and (b) takes a core `FormatError`''s message, not its Display, so the core "Invalid model format:" prefix does not appear under the CLI''s own. Three call sites move to it: inspect.rs `run_rosetta_inspect`, tensors.rs `run`, and profile_safetensors.rs (the same `Inspection failed` wrap). `CliError::InvalidFormat` is unchanged, so every other site and the tests that pin "Invalid APR format" (lint_exit_convention_tests, lint_family_guard, beat_run, grad_norm) are untouched. The core double prefix is fixed at its source: aprender-core format/safetensors.rs (include!d into format/tensors.rs) wrapped `GgufReader::from_bytes`''s error as `Failed to parse GGUF: {e}`, and `e` is itself a FormatError whose Display is "Invalid model format: …"; it now takes the inner message. WHAT THE FOUR MESSAGES SAY NOW (the case table renders `error: {e}` exactly as main.rs prints it): inspect truncated GGUF "error: Invalid GGUF file: Inspection failed: Unexpected EOF reading u64 at offset 24"; tensors truncated GGUF "error: Invalid GGUF file: Failed to list tensors: Failed to parse GGUF: Unexpected EOF reading u64 at offset 24"; inspect random .safetensors "error: Invalid model file: Inspection failed: SafeTensors open failed: Invalid SafeTensors file: metadata length 12928470711364830350 exceeds file size"; tensors random .safetensors "error: Invalid model file: Failed to list tensors: Unknown model format: magic bytes 8e44f12f. Supported formats: APR (.apr), GGUF (.gguf), SafeTensors (.safetensors)". A truncated .apr: inspect "error: Invalid APR format: File too small to contain valid APR header (need 64 bytes)" (inspect''s native APR path, unchanged); tensors "error: Invalid APR file: Failed to list tensors: Failed to parse APR v2: Invalid header: file too small". FIXTURES, all built in the test: a GGUF written by aprender''s own `export_tensors_to_gguf`, cut to 28 bytes (4 bytes into the first key''s u64 length, so the reader hits the issue''s own "Unexpected EOF reading u64"); 4 KiB of deterministic noise named .safetensors, opening with the issue''s magic `8e44f12f`; and an `AprV2Writer` file cut to 32 bytes, under its 64-byte header. The case table is `commands/model_file_error_tests_3661.rs`, with 6 rows. It calls the real `inspect::run` / `tensors::run`. For each row it asserts: the rendered prefix; no "Invalid APR" unless the magic is APR''s; no "Invalid model format" anywhere, which is stronger than "not twice"; and `exit_code_value() == 4`. MUTANTS, each RED: M1, the three call sites restored to `CliError::InvalidFormat(format!(…: {e}))` (the pre-fix code at d0771c5c5), fails 14 checks and reproduces the issue''s strings, e.g. "error: Invalid APR format: Failed to list tensors: Invalid model format: Failed to parse GGUF: Unexpected EOF reading u64 at offset 24". M2, the new variant''s Display restored to "Invalid APR format: {message}", fails 9 checks: every non-APR row. M3, the core wrap restored to `Failed to parse GGUF: {e}`, fails 1 check: the tensors-GGUF row''s "Failed to parse GGUF: Invalid model format: …". With all restored: 1 passed. MEASURED at this commit: `cargo test -p apr-cli --lib` 7294 passed, 0 failed, 12 ignored; `cargo test -p aprender-core --lib format::tensors` 131 passed; `cargo clippy -p apr-cli --lib -- -D warnings` rc 0 and `cargo clippy -p aprender-core --lib -- -D warnings` rc 0 (`--tests` on apr-cli fails only in pre-existing tests/falsification_crux_*.rs and nf4_classifier.rs, none in a touched file); `cargo fmt --all -- --check` rc 0; `scripts/check_complexity_ratchet.sh` "none new, none grown"; `bash scripts/guard_tree.sh --no-cargo` 76 checks, 0 failed. NOT DONE: a run of a freshly built `apr` binary. The host was at load 57 on 48 cores and a release build of the facade would have added to it; the table renders the same `error: {e}` line main.rs prints and asserts the exit-code mapping directly. FOLLOW-UP, filed before the PR as #3691: six more sites name GGUF or SafeTensors in their own message and still wrap it in `InvalidFormat` (hex.rs:323/350, safe_tensors_header.rs:180/182, trace_likely_has_repeated.rs:267/332). They are outside this issue''s done_when, which names inspect and tensors.'
