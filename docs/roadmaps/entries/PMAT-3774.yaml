  acceptance_criteria:
  - 'Issue #3774 done_when 1, verbatim: "`evidence/crux/verb-correspondence.yaml` (`schema: crux-verb-correspondence/v1`) has exactly one entry per LEAF `key` of the surface `apr surface --json` emits (#3745 S1, `apr-cli-surface/v1`), hidden and foreign leaves included, with aliases counted as the same verb. It carries `surface: {source, sha256}` binding it to the emitted surface it was derived from." MEASURED: 253 entries = the 253 leaves of the `apr-cli-surface/v1.1` surface emitted by apr 0.69.0 (7ed033b63, branch PMAT-3745-s1-surface-emitter), sha256 207c3297…da2b. The entry key set equals the leaf key set, with no duplicates. Every `generates: true` leaf that maps no engine (embed, rerank, mcp, parity, rosetta compare-inference) has a specific reason; parity and compare-inference compare apr with apr, and their external comparison is the `run` cells.'
  - 'done_when 2, verbatim: "Every entry has `comparators` with ALL FOUR engine keys (`llama.cpp: {binary, args}`, `ollama: {subcommand, args}`, `hf: {api, args}`, `llamafile: {binary, args}`), each either that mapping or `{none: <non-empty reason>}`. An entry with at least one mapping has `judged_by` ∈ golden | greedy_tokens | task." MEASURED: all 253 entries state all 4 engines; 16 verbs map at least one engine (run, chat, serve run, code, bench, quantize, pull, list, rm, tokenize encode-corpus, eval, inspect, tensors, devices, modelfile parse, import); 237 are `none` on every engine, each with a reason.'
  - 'done_when 3, verbatim: "Measured at authoring and recorded, each with a negative control that fails: every mapped llama.cpp `binary` exists in the pinned build (d1d3c3396) and every mapped flag appears in its `--help`; every ollama `subcommand` and flag appears in `ollama --help` (0.33.2); every mapped apr flag is an arg of that verb in the surface." MEASURED: 7/7 llama.cpp binaries and 10/10 flags ok on gx10''s pinned build; 7/7 ollama subcommands plus `create --quantize` ok on lambda''s 0.33.2; every mapped apr flag is present in its verb''s surface args. The controls `llama-cli --frobnicate`, bin `llama-frobnicate` and `ollama frobnicate` all FAIL.'
  - 'done_when 4, out of scope, verbatim: "the `hf` and `llamafile` mappings are declared here but verified against their pins by the engine worker''s rows, since the pins don''t exist yet; the SHACL reading is aprender-97''s S2; the cells for newly mapped verbs are later #3739 slices."'
  - 'Added to #3774 at ~19:30Z (the cop: "You own the correspondence file columns (`hf` and `llamafile`) and the judge side (#3774)"), verbatim: "`scripts/lib/crux_inference_judge.py` treats `hf` and `llamafile` as comparators: RED when either is right and apr is wrong." MEASURED by `bash scripts/check_crux_inference_judge.sh`: 33 ok, 0 broke. New rows cover: hf right with apr wrong is RED; a llamafile refusal is quoted and, beside a right llama.cpp, the cell is GREEN; hf output that is not the contract JSON, or JSON with no `text`, is no oracle.'
  - 'Verbatim: "`tok` rows ... and `tmpl` rows ... are byte-equal or RED, with the first differing index or byte named. An engine row with no apr row beside it is RED. A row the reference engine refused is UNJUDGED, and the run declines. `greedy` rows are REPORTED." MEASURED rows: equal tok ids are GREEN; differing ids are RED at index 1; an HF tok row without apr is RED; an HF-refused tok row declines rc 2; an equal tmpl is GREEN; the #3672 double wrap is RED at byte 17; greedy divergence at step 2 is reported with its logit cosine 0.7071 and no verdict.'
  - 'Verbatim: "`scripts/crux_inference_dogfood.sh` exports `CRUX_MANIFEST` and `CRUX_WORK`, resolves `scripts/crux_engine_<hf|llamafile>.{sh,py}` ... A missing script, a failing probe, or a `gen` that appends no row becomes a refused row naming why." MEASURED on lambda with a throwaway fake hf driver (never committed): probe recorded verbatim as `hf.probe`; 3 hf gen rows judged correct; the absent llamafile driver refused by name on every cell; the receipt table has 5 engine columns. The driver still reads no clock (0 rate tokens) and check_no_competing_harnesses stays count=0.'
  - 'Mutation for the judge side: dropping the tok/tmpl mismatch-or-absent RED breaks 3 rows; not failing the run on a deterministic RED breaks 3; not declining a deterministic UNJUDGED breaks 1; dropping hf as a comparator breaks 1; not requiring the contract `text` field breaks 1; taking the logit cosine at the wrong step breaks 1. The slice-1 mutants still hold.'
