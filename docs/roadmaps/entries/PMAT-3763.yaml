  notes: 'ISSUE TEXT (#3712 done_when 1 clarification by the issue author, quoted verbatim): "done_when 1 clarified (issue author, cop aprender-04, 2026-09-21 18:15Z), after aprender-c3 asked whether `…-q4k.apr` (no underscore) counts as Q4_K. Under the operator''s rule ("tests are dervived from surface and SHACL enforced … it is hand coded not derived", #3745), filename is not evidence of quantization. A file is in the Q4_K universe iff its header says so: the dominant weight-tensor dtype read by apr''s own header reader (GGUF `file_type` / per-tensor ggml types; APR tensor dtypes) is Q4_K, with Q4_K_M/Q4_K_S included. A `*Q4_K*` filename glob is refused as the universe definition. Every candidate model file on the host (`*.gguf`, `*.apr`) is read, and the receipt lists each file with its measured dominant dtype, so a mislabelled file is visible both ways: a `q4k` name holding fp16 is excluded, and an unlabelled file holding Q4_K is included." COP RULING (2026-09-21, A2 design approved): candidates = every *.gguf/*.apr under the model dirs, by extension; membership = Q4_K is a most-frequent >= 2-D tensor dtype, ties included (the strict side); the receipt carries every candidate''s histogram, the JUDGE recomputes membership from it, an unreadable candidate is a named FAIL; the header read runs through a no-GPU wrapper, not the fleet lock; apr inspect''s wrong `quantization` field is filed separately (#3762) and not fixed here. WHAT THIS ROW DOES: contracts/model-capability-ladder-v1.yaml `inventory.patterns` (the *q4_k*/*q4k* filename glob) is replaced by `candidates: [*.gguf, *.apr]` and `member_dtype: Q4_K`; MCL-INV-009, FALSIFY-MCL-017. scripts/model_ladder.sh reads every candidate with `apr tensors --json` through apr_header (CUDA_VISIBLE_DEVICES set empty, no lock), counts the dtypes of its >= 2-D tensors, and writes EVERY candidate (histogram, dominant, member | error) into the receipt; the inventory it measures is the members. scripts/check_model_ladder.sh refuses a ladder that still names `patterns`, requires the candidates list, names an unreadable candidate, recomputes membership from each histogram, and FAILs a Q4_K-header file missing from the inventory (left out by its name) and a non-Q4_K file in it (let in by its name). BY COUNT, NOT BYTES, measured: Qwen3.5-0.8B-Q4_K_M.gguf is Q6_K by bytes (its 248k-vocab embedding/output) but Q4_K by count of >= 2-D tensors (Q4_K 98, Q5_K 36, Q8_0 36, F32 18, Q6_K 17). MEASURED dry run on lambda, real files: Qwen2.5-0.5B-f16.gguf not a member [F16]; Qwen3.5-0.8B-IQ4_XS.gguf not a member [IQ4_XS]; Qwen3.5-0.8B-Q4_K_M.gguf MEMBER; qwen2.5-coder-1.5b-instruct-q4k.apr MEMBER; qwen2.5-coder-1.5b-instruct-st.apr not a member [F32]; the Q4_K_M file symlinked as unlabelled-model.gguf MEMBER. Case table 47 -> 55; 4 judge mutants (filename-glob, header-excluded, header-included, tie-not-member) and the producer mutant header-sees-gpu are each killed. WHERE THE GATE RUNS: check_model_ladder.sh is declared only in Cargo.toml [package.metadata.dogfood] (the T-2 pre-publish dogfood) and listed in scripts/unwired_guards_baseline.txt; no PR workflow runs it, so its real-run RED (no receipts yet for the cut) is the release bar, not a PR red. Stacked on #3738 (row B1), which is stacked on #3721 (row A). ONE DEFINITION (asked by aprender-c3 for #3742, whose gate must use this universe, not a second one): the membership rule lives in scripts/lib/tensor_universe.py (histogram of >= 2-D tensor dtypes by count, upper-cased; dominant = every dtype at the max; member iff the dtype is among them, ties included; a file''s name never reaches it). The producer calls its `row` CLI on the header JSON it read through apr_header; the judge imports is_member (its former private copy of the rule is gone); scripts/lib/tensor_universe.sh (sourced, option-neutral) gives shell gates tu_dominant_dtypes <apr-bin> <file> and tu_is_member <apr-bin> <file> <DTYPE> (rc 0 member / 1 not / 2 unreadable), reading the header with CUDA_VISIBLE_DEVICES set empty. The definition''s own case table (7 cases incl. c3''s: a tie is a member, 1-D tensors do not vote, a Q5_0-dominant file is not a member whatever its name) runs from check_model_ladder.sh --self-test, and a mutant of the shared rule (ties excluded) is killed by red-tie-excluded. MEASURED through the shell wrapper on lambda''s real files: Q4_K_M gguf and q4k .apr -> [Q4_K] member; IQ4_XS -> [IQ4_XS] not; the f32 .apr -> [F32] not; a missing file -> rc 2.'
