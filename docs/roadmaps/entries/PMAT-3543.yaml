  acceptance_criteria:
  - 'Issue #3543 defect 1 (the issue has no done_when list; its defects and its falsifier are the acceptance), verbatim: "1. **`version-unpublished` is not phase-aware.** It is a pre-publish gate ("this version must be absent from the index"). In the post-publish phase its precondition is inverted by construction: a successful publish makes it RED forever. `--phase` is parsed and validated (dogfood.sh:42-53) and 13 sites read `DOGFOOD_PHASE`, but this row is not one of them. Post-publish it should assert the opposite — the version IS on the index, resolvable, and `cargo install` of it works — which is the receipt the train actually wants."'
  - 'defect 2, verbatim: "2. **The banner lies about which phase ran** (dogfood.sh:269 prints `dogfood pre-release:` unconditionally). Anyone reading the log believes they are looking at the pre-release gate set."'
  - 'the issue''s falsifier, verbatim: "**Falsifier for the fix:** run `--phase post-publish` at a version that IS published and require GO; run it at a version that is NOT published and require RED on the new post-publish assertion. Both directions, or the row is decoration again."'
