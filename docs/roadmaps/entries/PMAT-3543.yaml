  notes: 'Release-tooling lane (cop, aprender-04), on the 0.69.1 release path. Its own branch off main 225b2a9ab: dogfood.sh is in none of the #3699/#3708/#3717 stack. SCOPE: scripts/dogfood.sh, the new scripts/check_dogfood_version_row.sh, and this fragment. SUPERSEDES open PR #3202 (PMAT-1098-dogfood-post-publish-phase, 2026-09-13), which the cop will close with these reasons. It does NOT meet this issue: (a) it patches only the dry-run branch, while main has since moved pre-publish onto a direct index.crates.io lookup (dogfood.sh:387-441 at 225b2a9ab); (b) it makes post-publish PASS unconditionally, so the falsifier''s second direction (a version NOT published must be RED) would read "not yet published" and PASS; (c) it leaves the banner. HOW IT IS MET. DEFECT 1: the sparse-index lookup is ONE function, index_version_state CRATE VERSION, which prints "present", "absent", "crate-absent" or "unknown <why>". Its body is the pre-publish code moved verbatim: the lowercased shard path, HTTP status read apart from the body, and a body that is not the index being UNKNOWN, never absent. version_row PHASE CRATE VERSION STATE decides the row. pre-publish gives version-unpublished, PASS only when absent or crate-absent (unchanged). post-publish gives a NEW row, version-published, PASS only when present AND installable (next), FAIL when absent ("… is NOT in the crates.io index — this phase runs after the cascade, so the version was not published"), crate-absent, or unknown. mark_version_row PHASE marks whichever row version_row decides. POST-PUBLISH ALSO INSTALLS (round 2): defect 1''s own text says post-publish must assert "the version IS on the index, resolvable, and `cargo install` of it works". Round 1''s lanes 1 and 2 FAILed an index-only row on that clause, and they were right. When the index carries the version, published_install_check runs `cargo install <crate> --version =<v> --locked --root <scratch> --target-dir <scratch>` with the registry token unset, exactly as a user installs. Every binary that lands must report the version in `--version`. A failed install (which is also where "resolvable" is decided: a version cargo cannot resolve, e.g. a yanked one, fails it), a binary reporting another version, or no binary at all turns version-published FAIL: "… is in the crates.io index but is NOT installable: …". No install is attempted for a version the index does not carry. The pre-publish branch calls it as before. The post-publish phase still runs the publish dry-run, because row 10 (publish-dry-run) reads its exit code and is what discharges the pre-publish DEFER. Its version row is then mark_version_row post-publish, and the pre-publish row is NOT emitted in that phase. The full phase is unchanged: the dry-run path, already exists -> FAIL. DEFECT 2: `phase_banner "$DOGFOOD_PHASE" "$CRATE" "$VERSION"` prints "══ dogfood <phase>: <crate> v<version> ══". The only other mention of "dogfood pre-release" in scripts/ is a comment in dogfood-use.sh, which nothing parses. FALSIFIER, as a wired table: scripts/check_dogfood_version_row.sh, a scripts/check_*.sh with no bare cargo token, so guard_tree''s --no-cargo set runs it. It runs the REAL "2 + 10" section of dogfood.sh, extracted from its header to the next section header, so the call sites run as well as the helpers. It stubs `mark` (records rows), the publish dry-run, and curl (serving a fixture sparse index: present / absent / 404 / an HTML 200 / down). ROWS: pre-present FAIL; pre-absent PASS; pre-404 PASS; pre-down FAIL UNKNOWN; post-present version-published PASS (in the index, installed with `--version =9.9.9 --locked`, the binary reports 9.9.9) with NO version-unpublished row; post-install-fails FAIL; post-install-wrongver FAIL; post-install-nobin FAIL; post-absent FAIL with no install attempted; post-404 FAIL; post-html FAIL UNKNOWN; post-dry-run (the dry-run still runs, DRC 0); full-unchanged (already exists -> version-unpublished FAIL, no index call); banner ("══ dogfood post-publish: aprender v9.9.9 ══", printed from DOGFOOD_PHASE); index-path (crate "Aprender" is looked up at index.crates.io/ap/re/aprender). That is both directions in both phases, as the falsifier asks. MUTANTS, one per row, each killed: pre-present-pass, pre-absent-fail, pre-404-fail, down-is-absent, post-phase-blind (post-publish emitting the pre-publish row), post-absent-pass (#3202''s shape), post-404-pass, html-is-absent, no-post-call (the `mark_version_row post-publish` call deleted), post-skips-dry-run, full-uses-index, banner-fixed ("pre-release"), index-case (no lowercasing -> "looked up: curl https://index.crates.io/Ap/re/Aprender"); install-ignored, version-unchecked, nobin-ok, install-on-absent, unlocked (the install without --locked). The table''s first full run caught a fixture bug of mine: CRATE was exported before the per-row env, so index-path never saw the uppercase name and passed for the wrong reason until its mutant survived. MEASURED at this commit: `bash scripts/check_dogfood_version_row.sh` rc 0, "PASS 33 row(s)" (15 rows, 18 mutants); bashrs on dogfood.sh and the table, 0 errors (an `eval` in the banner row was replaced by sourcing the extracted line, after check_bashrs_gate''s SEC001); check_bashrs_gate, check_guards_are_wired and check_no_pipe_into_grep_q all rc 0. NOT RUN: a real `dogfood.sh --phase post-publish` against crates.io, which would include a real `cargo install aprender --version =<v> --locked`, a full release build. The next train''s post-publish step is that measurement, hence Refs #3543.'
