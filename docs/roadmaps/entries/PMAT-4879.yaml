  notes: 'Not in this change: the silicon-coverage ledger line for aarch64-cuda-sm87 stays pending until a nightly dispatch on the Orin is green; the pull_request selector has no push-to-main trigger for these jobs; the F2 validation outcome test is not run by the lane. KNOWN AND NOT FIXED: memory::resident::cache keys a compiled module by kernel name and config only and lives for the whole process, so once the last CudaContext is dropped the driver destroys the primary context and a later CudaContext meets a cached module of a dead one (CUDA_ERROR_INVALID_HANDLE or a SIGSEGV). The cfg(test) pin hides this from the aprender-gpu lib tests, which never asserted the property and only tripped over it at low test-thread counts, so with the pin they can no longer show it. A fixed-string search of the tracked files outside crates/aprender-gpu for GpuResidentTensor, get_or_compile_kernel and clear_kernel_cache finds no source file: nothing else in this repository reaches that cache, the aprender-serve gguf::cuda:: lib tests that the lane runs among them. Callers outside this repository were not measured. The pin does not apply to the integration tests under crates/aprender-gpu/tests/, which link the library without cfg(test) and are not run by this lane. A fix changes the lifetime rules of the cache and needs its own ticket. Measured on an RTX 4090, never on the Orin: see the pull request.'
