  notes: 'Assigned to aprender-62 by the cop (aprender-04). Not a T-4 blocker for 0.69, per the issue. THE SOURCE. publish-order.txt is a committed file with no generator in the tree (ported in #3582); the universe it must equal is scripts/lib/cascade_universe.py, which runs `cargo metadata --no-deps` over EVERY workspace this repo publishes from (`.` and `crates/facades`) at the tag checkout ($WT) and drops `publish = false`. publish_strict.sh already read that universe into EXPECT; this change makes N=${#EXPECT[@]} the size, so the size comes from the same cargo metadata, and the facade names in ORDER are checked against the facade workspace''s own packages. HOW IT IS MET, publish_strict.sh: the three 74 assertions (lines 39, 41, 90 at d0771c5c5) are replaced by `N=${#EXPECT[@]}`, a non-empty check, and three SET checks, each naming the crates: duplicates in ORDER (`sort | uniq -d`), ORDER entries not in the universe, and universe entries not in ORDER ("so never uploaded"). The progress and final strings print $N ("$i/$N", "$n/$N live", "$N/$N"). The final verification is `[ "$n" -eq "$N" ]`. The dependency-order proof and the publish loop are unchanged. check_release_scripts_derive_identity.sh gets rule R3: on a non-comment line, no numeric test (-eq -ne -lt -le -gt -ge == !=) against an integer literal of two or more digits, on either side. Case rows 12-20 are new: the PLANTED row is publish_strict.sh''s own 0.68.2 line 39 verbatim; five more RED shapes (a wc -l count, an unquoted counter, the literal on the left, (( n == 74 )), a quoted "74"); three clean shapes (a count against the derived $N plus `-lt 3` and `-eq 0`; sleep/seq/cut numbers; a comment). The one-digit exemption is deliberate: a retry bound or an exit code is one digit, a crate universe is not. `--help` printed a hardcoded `sed -n 2,24p`; it now prints the leading comment block. MEASURED at this commit: `bash scripts/check_release_scripts_derive_identity.sh --self-test` 23/23 ok (was 14). The guard over the PRE-FIX scripts/release (d0771c5c5) exits 1 with R3 naming lines 39, 41 and 90; over this tree it exits 0 ("8 file(s) … no literal count"). MUTANT with R3''s hits forced empty: rows 12-17 go RED ("rc=0 (wanted 1)"), and no other row changes. END TO END in a private clone (its own refs, tag v9.9.9 in the clone only, RELEASE_AP in scratch, `--plan` reads the sparse index and uploads nothing): the fixed script plans 74 rows, rc 0. NEGATIVE CONTROLS, each committed and re-tagged in the clone, each rc 1: aprender-tsp removed from the order gives "in the universe but not in the publish order, so never uploaded: aprender-tsp"; apr-format appended gives "crate(s) twice in the publish order: apr-format"; not-a-crate appended gives "in the publish order but not in the universe: not-a-crate". THE DEFECT ITSELF: aprender-tsp set `publish = false` AND dropped from the order, a legitimate universe of 73. The pre-fix script (d0771c5c5) stops with "STOP publish: order=73 universe=73, expected 74/74", rc 1. The fixed script plans 73 rows, rc 0. bashrs: 0 errors on the guard (baseline 0). publish_strict.sh has 4 errors before and after, all pre-existing (the change adds none).'
