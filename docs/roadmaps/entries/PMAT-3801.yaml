  notes: 'DIVERGES FROM THE ISSUE''S ''Decided design (aprender-fd)'' BY COP RULING, recorded on the issue
    before any round: issuecomment-5773096497. The four done_when clauses above describe the think-budget
    guard; this row implements the cop''s ruling instead and does NOT claim them. ROOT: apr chat imported
    detect_format_from_name from aprender-core, whose TemplateFormat has seven variants (ChatML, Llama2,
    Mistral, Alpaca, Phi, Custom, Raw) and NO Qwen3NoThink - so no-think was unrepresentable on that path,
    not merely unselected, and chat_load_tokenizers.rs:120''s template_format_name match compiled with
    no arm for it because it matched the other crate''s enum. apr serve, apr run --chat and (since #3724)
    apr qa''s golden gate all take realizar''s detector. MEASURED BEFORE, apr 0.69.0 (3ebb1c61e), apr
    chat Qwen3-1.7B-Q4_K_M --temperature 0: ''Detected ChatML chat template'' then ''Assistant: <think>Okay,
    the user is asking...''. MEASURED AFTER, apr 0.69.0 (1f992a5e3), same command: ''Detected Qwen3NoThink
    (thinking off) chat template'' then ''Assistant: </think>\n\n2 + 2 = 4.''. The banner''s private copy
    of the name match is deleted in favour of the one template_format_name, which gained the two variants
    the old enum could not express (Qwen3NoThink, Zephyr) - two copies of a match over an enum are how
    a new variant gets handled in one place and not the other, which is this defect. qwen3_moe keeps plain
    ChatML (PMAT-181, trained without <think> blocks), pinned by a test. WHAT THIS DOES NOT DO: it does
    not implement the think-budget guard and does not make the non-terminating mode terminate; it makes
    that mode unreachable from the four verbs at their defaults. The guard remains the remedy for deliberate
    --thinking on under #3723, a separate row not in 0.69.1.'
