  notes: 'Epic #3710 (0.69.1). The think-budget-guard row aprender-04 asked for. Built on the #3723/#3755 branch (PMAT-3723-thinking-derived): split out, the two would be green only together, because #3755 alone turns the Qwen3.5-0.8B/2B golden rungs RED. CAUSE (measured): with the model''s own template the ON prompt ends in `<think>\n`, and apr''s default decoding is greedy (temperature 0.0). Small Qwen3.5 then often never closes the block: 0.8B "What is 2+2?" is still open at 16384 tokens. The model does this, not apr: apr''s 17 prompt ids equal llama.cpp''s, and pinned llama.cpp d1d3c3396 greedy runs out 4096 on 2 of 3 golden prompts on CPU and 1 of 3 on GPU. DESIGN (one seam, realizar chat_template, chat_template_think_budget.rs): ChatPrompt::generate_with_think_budget(max_tokens, generate). A thinking prompt gets think_budget = 3/4 of max_tokens first. Reasoning still open is closed with THINK_BUDGET_CLOSE (\n</think>\n\n), and the answer is generated from prompt + reasoning + close within what remains. A block the model closed but cut at the budget is continued without a close. GuardedCompletion.reasoning_truncated reports it, never silent. InferenceConfig::raw_prompt tokenizes an already-rendered continuation as is. SURFACES DONE: apr run (run_chat_inference: --json reasoning_truncated, and the text output names it); apr chat (ChatSession::generate -> generate_pass, with a named guard line per turn); apr code embedded (RealizarDriver: guarded, raw_prompt, which also fixes the pre-existing second wrap of a GGUF''s rendered prompt); the golden gate''s dense CPU, dense GPU and runtime legs (the PASS message NAMES every guard-closed case). NOT DONE, part 2: apr serve. Serve''s 8 backends generate inline (batch scheduler, direct RwLock, CPU, MoE, APR, registry) and stream token by token, so the guard needs a continuation per backend and a decode-loop injection for streaming. Until part 2, serve reports an unclosed block as #3720''s HTTP 422 / named SSE error event: never a hang, never an empty answer. done_when 1 therefore stays open for serve; this row closes only when serve is guarded. MEASURED (lambda RTX 4090, 351350bee/1cf2e94ec): apr run 0.8B --thinking on --max-tokens 4096 "What is 2+2?" -> "2 + 2 = 4", reasoning_truncated true, rc 0 (was rc 8). apr chat, same model and prompt, --temperature 0 -> the guard line, then "Assistant: 2 + 2 = 4". apr qa golden: 0.8B 6/6 naming [thinking] "4" and [thinking] "Hello"; 2B 6/6 naming [thinking] "Hello" (both were RED). FULL LADDER (apr qa, ladder flags), both hosts, all 6/6: Qwen3.5-0.8B (guard closes [thinking] "4"/"Hello"), 2B (guard closes [thinking] "Hello"), 4B, 9B, 27B, Qwen3-8B. Case rows both hosts: 45 PASS / 0 FAIL / 6 BLOCKED-on-#3571 of 51 (run/chat/code/serve x on/off/unset, top-level spelling, conflict->422, budget->422, streamed reasoning_content; Qwen3.5-4B + Qwen3-8B + a not-capable qwen2.5). x86 CPU (this host, Threadripper 7960X): 0.8B golden 6/6, guard closes all 3 thinking cases (x86 loops harder than gx10 aarch64, consistent with #3724 DW5). Serve part 2 stays open. TESTS: 7 guard unit tests (chat_template_think_budget_tests); golden: a never-closing case is guarded, judged and named, and the same text unguarded is the named unclosed failure. MUTANT (done_when 3): the guard removed turns the 0.8B golden thinking leg RED. That is the measured 5848a3a65 state, recorded above.'
