  notes: "Refs #3725 (NOT Closes: the e2e decode tok/s table follows #3596). Issue done_when, verbatim: '- [ ] a split-K (or flash-decoding) decode attention for the Qwen3.5 full-attention layers on lambda and gx10, parity-checked against the current kernel at every rung (4k … 262,144)' / '- [ ] decode tok/s recorded at 4k/20k/60k/148k/262k on both hosts for the 9B (and every size that fits), against pinned llama.cpp on the same prompt (ratio reported, never claimed as a target)' / '- [ ] oxide-first where practical (a cuda-oxide kernel + CPU twin + differential test on sm_89 and sm_121)'. Cop rulings on #3725 (2026-09-21T16:35:12Z), verbatim: '(1) this row's PR lands the kernel, the wiring and **kernel-level rungs** (parity vs the current kernel and µs per call at 4k…262,144 on lambda and gx10) as `Refs #3725`. The e2e decode tok/s table vs pinned llama.cpp follows once #3596's batched prefill is on main, and the issue stays open for it. (2) \"oxide-first where practical\" means: the production kernel is builder-PTX like every GDN kernel (no in-tree path ships oxide PTX until OXIDE-001 O-1), PLUS a cuda-oxide port under `experiments/cuda-oxide/` with its own parity and A/B receipt on sm_89 and sm_121.' Scope split with #3596 (cop comment 2026-09-21T16:20:41Z): #3725 owns site 4, the decode attention read for f32 and f16. Design note: issuecomment-5763965543."
