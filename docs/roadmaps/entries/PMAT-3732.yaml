  notes: '#3544 item (c), the fleet lane''s ruling of 2026-09-20 quoted above, STACKED ON #3731 (branch PMAT-3731-host-receipts-fail-closed, head 9b18a6da9; the cop ruled #3731 and #3732 fold together), so the quorum base is 9b18a6da9. THE PREMISE MOVED: the fleet ruling derived "the hosts the train actually visits" from workflow runner labels, at a time when the train visited no matrix host for a receipt. Under #3731 the train''s hosts step VISITS every HOSTS member for a receipt (the train host locally, the rest over ssh, mini included, per the cop''s ruling on #3731), so the visited set is what autopilot.sh reaches, by ssh, locally and by runner. The design comment on the issue (quoted above) records this and the two decisions it leaves the cop; it was written for aprender-04, which was shut down before reading it, and re-put to aprender-3e; the recommendations below stand as decided unless vetoed. SCOPE: scripts/release/autopilot.sh (the hosts it visits declared ONCE -- ASSET_HOSTS, INSTALLER_HOSTS, TRAIN_HOST, matrix_hosts() -- walked by the hosts step and printed by a new `--visited` mode, no gh, no network), scripts/check_multiplatform_dogfood.sh (NA_HOSTS), scripts/check_dogfood_matrix_is_visited.sh (new), scripts/check_release_host_receipts.sh (one mutant anchor moved with the refactor), and this fragment. HOW THE ITEM IS MET. DERIVED, NEVER RE-LISTED: `autopilot.sh --visited` prints one "VISITED <host> <how>" line per (host, how) the hosts step would reach, from the same variables the step walks (release-asset: gx10, yoga; installer: intel, gx10; host-receipt-local: lambda; host-receipt-ssh: intel, gx10, mini). The guard adds the hosts the release-path WORKFLOWS name: binary-release.yml''s matrix `host:` fields (yoga, gx10) and b2-gpu.yml''s runs-on host label (yoga). A POOL label (clean-room, "intel, yoga or gx10") names no host, so it is REPORTed, never demanded: whichever member takes a job is not a matrix visit. DEMANDED is the gate''s HOSTS; DECLARED ABSENCE is the gate''s NA_HOSTS, rows of "host:reason:decided_by:YYYY-MM-DD" (the ruling''s NA{reason, decided_by, date}). FAILS IN BOTH DIRECTIONS: R1 a visited host neither in HOSTS nor in NA_HOSTS is RED (visited-but-not-demanded: yoga today, absent the NA row); R2 a HOSTS member nothing visits is RED (demanded-but-not-visited: closed by construction under #3731, guarded here against regression, and #3731''s `ap-hosts-literal` mutant already kills a re-listed matrix in autopilot); R3 an NA host that is in HOSTS, or that nothing visits any more, is a STALE row and RED (so a host re-enters the matrix by its row LEAVING, which is what makes mini-style absence self-correcting); R4 an NA row without a reason, a decider or a date is RED; R0 an empty HOSTS or an empty visited set is RED. THE TWO DECISIONS, as recommended and built: (a) yoga is an NA row now ("the CUDA release asset is smoke-tested here but no cargo-install receipt is taken; a receipt needs the fleet to decide yoga is a supported-platform row"; decided_by aprender-f0 as a recommendation pending the cop; 2026-09-22), to be lifted by the fleet by deleting the row and adding yoga to HOSTS, at which point host_receipt.sh runs there like everywhere else; (b) workflow host NAMES count as visited beside the train''s own visits, pool labels do not. The ruling''s second acceptance, "check_multiplatform_dogfood.sh exit 0 against receipts the train itself committed", is #3731''s: its B1 row runs the real gate over receipts the real hosts step wrote, and evidence/dogfood/0.68.2/ holds the train''s receipts from the published 0.68.2. THE CASE TABLE, `bash scripts/check_dogfood_matrix_is_visited.sh --self-test`, 15 rows and mutants over a stub autopilot (--visited lines) and a stub gate: S1 the control (a, b demanded and visited; c visited and declared absent -> green with the REPORT line); S2 c visited, undemanded, undeclared -> R1; S3 d demanded, never visited -> R2; S4 c joined HOSTS while still declared absent -> R3; S5 an NA host nothing visits -> R3; S6 an NA row without decider/date -> R4; S7 a workflow-named host nothing demands -> R1 via the workflow; S8 empty HOSTS -> R0; S9 nothing visited -> R0; S10 a pool label is REPORTed, not demanded; mutants dropping R1, R2, R3, R4 and the workflow reader, each killed. MEASURED at this commit: `bash scripts/release/autopilot.sh --visited` prints the 8 lines above, rc 0; the guard on the tree: ok lambda/intel/gx10/mini (each visited and demanded, with how), "REPORT yoga visited (b2-gpu.yml runs-on label, binary-release.yml matrix host, release-asset) and DECLARED absent: ...", three "REPORT pool clean-room" lines, PASS; without the NA row it is "FAIL R1 yoga is VISITED (...) but neither in HOSTS nor declared absent" (the visited-but-not-demanded direction, measured on the real tree); #3731''s table on this tree: PASS 94 rows and mutants; guard_tree --no-cargo: 81 checks, 0 failed. Refs #3732 #3544.'
