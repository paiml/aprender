  notes: '0.69.1 row (#3710), dispatched by the cop, aprender-04. It is #3602''s `cosine 0.4153`, localized in https://github.com/paiml/aprender/issues/3602#issuecomment-5763796065. MECHANISM. `cublas_prefill_fp8_gemm` reused its converted FP8 activation whenever `(packed_input_ptr, m·k)` equalled the last conversion''s key (PMAT-084). The key was cleared only on scratch reallocation, never when the input''s contents changed. On a mixed-quant model, two FP8 GEMMs on the same buffer are separated only by non-FP8 routes, so the second reused the first''s activation. qwen2.5-coder-0.5b''s hidden size of 896 is not a multiple of 256, so Q/K/V/O/gate/up are Q5_0/Q8_0 and only `ffn_down` (Q4_K/Q6_K) takes FP8. With `PREFILL_DETAIL_TRACE=1`, the 0.69.0 binary prints 23 `[PMAT-084] FP8 activation cache HIT ptr=0x71aec6600000 count=238336` (= 49 × 4864) lines: layers 1–23 multiplied layer 0''s SwiGLU output. HOW EACH done_when IS MET. (1) Reuse is now OPT-IN. New `cuda/executor/fp8_activation_cache.rs`: `Fp8ActivationCache { key, share_armed }` replaces the raw `fp8_activation_cache_key` field. `batched_gemv_or_gemm`, the single entry of every batched GEMM whatever its route, starts with `fp8_act_cache.begin_dispatch()`, which drops the held conversion unless the caller armed `fp8_act_cache.share_next()` immediately before the call. The only arming sites are the three shared-input groups: K and V after Q (`batched_qkv.rs`), and up after gate (`batched_ffn.rs`, and `prefill.rs`''s packed prefill). So every non-FP8 route invalidates the key (done_when 1''s first clause). Every dispatch that is not a declared share opens a new scope, and a phase boundary is always one (its second clause, in the stronger form: the scope is the shared-input group, not the phase). A missing `share_next` now costs one extra conversion, never a wrong result. The routes that bypass the dispatcher (the fused DP4A QKV and gate/up kernels) never reach FP8 and never arm. The FP8 GEMM consults `hit(ptr, count)` / `record(ptr, count)`, and a scratch reallocation calls `invalidate()`. (2) The unit tests in `fp8_activation_cache.rs` drive the cache in the executor''s order (begin_dispatch, then hit/record on an FP8 route). A 24-layer mixed-quant sequence (6 non-FP8 GEMMs, then an FP8 `ffn_down` on one buffer and count) must give 0 hits. A 28-layer all-FP8 sequence keeps exactly 84 (K, V, up per layer). Four more rows cover: an unarmed dispatch on the same key misses (gate after RMSNorm rewrote the norm buffer), an armed dispatch on another input misses, the arm is consumed by one dispatch, a non-FP8 group leader still lets K/V share one conversion, and a reallocated scratch holds nothing. MUTANT: `begin_dispatch` never clearing makes the mixed-quant row report 23 hits (the count the hardware trace showed) and fails 2 more rows. RED, 4 passed / 3 failed. (3) On hardware, see MEASURED. `graph_dispatch.rs` (PMAT-291) dispatches one mul_mat per node and does not arm, so if FP8 fires there outside capture, its K/V/up reconvert: a performance cost only, never a correctness one. FP8 routes never fire during capture (`!is_capturing`). The companion row is PMAT-3728 (#3728), which is qwen2.5-coder-7b''s separate FP8 defect, an FP16 overflow of the GEMM''s D. That model''s trace shows the intended 84 hits, so this change does not touch it. STOP LIST: no change to FP8 numerics, to which GEMMs take FP8, or to any route predicate; no default-off workaround (the cop''s ruling). MEASURED: hardware, binaries pinned by `--version` sha, every run under `flock /tmp/apr-gpu.lock choom -n 1000`, sweep prompt "What is the capital of France? Answer briefly." (`apr run --gpu -v`, `--max-tokens 16`) plus the sweep''s `apr qa` golden gate. The hardware binary is `db112cbbf`, this change before the rustfmt pass. The only differences in this commit are in the test module (rustfmt, and one operand hoisted into `let act`). Production code is byte-identical modulo whitespace, checked by stripping whitespace from both. qwen2.5-coder-0.5b on lambda (RTX 4090 sm_89), default path (batched prefill, FP8 prefill on, "[PMAT-053] FP8 weight cache: 24 matrices cached"): `Backend: GPU (NVIDIA GeForce RTX 4090)`, no divergence, rc 0, "The capital of France is Paris.", `apr qa` golden 3/3. `PREFILL_DETAIL_TRACE=1`: 0 PMAT-084 hits (the 0.69.0 binary: 23). qwen2.5-coder-0.5b on gx10 (GB10 sm_121) with `BATCHED_PREFILL=1` (gx10 defaults to serial prefill, so batched must be forced to exercise the path): `Backend: GPU (NVIDIA GB10)`, rc 0, "Paris", `apr qa` golden 3/3 (0.69.0: diverged at pos 1, cos 0.4159). The same 0.5b cells on the stacked PMAT-3728 binary `b47cd0a2d`: rc 0 and qa 3/3 on both hosts. Control: qwen2.5-coder-7b on `db112cbbf` shows 84 hits, the intended K/V/up pattern, and still diverges at pos 1 (lambda cos 0.5668, gx10 0.5724). That is PMAT-3728''s defect, and this change leaves it alone. Tests: `cargo test -p aprender-serve --lib --features cuda fp8_activation_cache` 7 passed; mutant 3 failed (23 hits). `cargo clippy -p aprender-serve --lib --features cuda -- -D warnings` rc 0. `cargo fmt --all -- --check` rc 0. CI does not compile `aprender-serve --features cuda` in the per-PR workspace-test, so these gates were run locally.'
