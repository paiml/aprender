  acceptance_criteria:
  - 'Issue #3727 done_when, verbatim: "A hit is only possible between GEMMs that share an input inside one phase (QKV, gate+up). Every non-FP8 route invalidates the key, and every phase that writes a fresh input opens a new scope, so the `(ptr, count)` aliasing class is closed, not just this instance."'
  - 'Issue #3727 done_when, verbatim: "A test drives a mixed-quant layer sequence (6 non-FP8 GEMMs, then an FP8 `ffn_down` on the same buffer, × N layers) and asserts **0** cross-layer hits. Today''s code gives N−1. An all-FP8 sequence still gives 3 hits per layer (K, V, up). A mutant that removes the invalidation turns it RED."'
