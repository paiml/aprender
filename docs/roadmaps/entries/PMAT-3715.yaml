  notes: 'Assigned by the cop (aprender-04) to aprender-97 on the 0.69.1 all-hands (EPIC #3710). The receipt FORMAT is shared and was agreed on #3712 before building: with aprender-62 (measuring side: issuecomment-5763332078, -5763540875, -5763596544, memory fields -5763795158) and aprender-f0 (T-1/T-4 wiring, issuecomment-5763344947); kernel-diff with aprender-37/aprender-eb (-5763412455, -5763633743, -5763653200); tokenizer parity on #3726 (-5763745060). SCOPE ADDED ON THE ISSUE by its author (cop), each built: kernel differential per GPU arch (#3715 issuecomment-5763396082); thinking {on,off} x context rungs {4k,8k,20k,60k,consumer-max,declared} (-5763490841, #3710 -5763489958); tokenizer parity per model (#3726 done_when 3); the memory-fit rule, operator decision "a" (#3710 -5763753907); three-state thinking_modes (#3723). WAIVERS: none, cop ruling (c) - a comment-based waiver is forgeable by every agent session (all post as noahgift); the operator-only surface is #3722. DONE HERE: done_when 1 (pv extract --release-* --out ingests inventory, cells, kernel/tokenizer/dogfood receipts as Release/Host/Model/Verb/ContextRung/Cell/CellReceipt/... nodes); done_when 2 (the nine-shape release-readiness-v1 family, armed by --shape); done_when 3 (34 red-turning CLI cases in crates/aprender-contracts-cli/tests/ont_release_readiness.rs, wired as ci/explicit-test-commands.d/450; two mutants caught: skip-as-pass turns 1 red, always-fresh turns 3 red); the pv side of done_when 4 (the invocation and exit contract f0 calls: 0 Pass, 1 Fail naming cells, 2 decline, 3 caller error); the first half of done_when 5 (evidence/release/proof-0.69.0: RED, 795 findings naming qwen3-8b lambda verdict=fail, qwen2.5-coder lambda and qwen3moe both hosts unmeasured/unkeyed, 752 of 768 cells absent, the NO-GO inherited dogfood). NOT DONE HERE (so the PR carries Refs, not Closes): the autopilot T-1 / check_publish_preflight T-4 call sites (aprender-f0, #3717/#3708), and "on 0.69.1 it passes with N/N cells named", which needs the producer (#3712 cells[]) and the model fixes to land. Also fixes a collision that existed independently: receipts.rs refused every schema but apr-model-ladder-receipt/v1 by name, so the first committed v2 receipt would have turned `pv lint --gate shapes` exit 3 on every PR.'
