  notes: 'ACCEPTANCE (hand-entered; #3076 has no done_when section, so this quotes its last plan comment verbatim, minted on the PR branch so the AD-04 quorum can run). "(1) the GGUF CPU path gets a SIMD f16/bf16 matvec (dequant-to-f32 tiles through the existing fused dispatcher) with a greedy-parity gate against llama.cpp on an unquantized ≤1B GGUF, so an F16/BF16 model decodes at a measured tok/s instead of appearing to hang; (2) until that lands the loader prints a one-line notice that the F16/BF16 path is scalar and slow rather than silently crawling." Since (1) lands here, (2) is moot. DEVIATION from the issue body: it suggests an integration test "with a wall-clock assertion"; the project bans wall-clock assertions in required checks, so the regression guard is behavioural (kernel parity against an f64 reference at lengths hitting every loop and tail, and float16_matmul against a transcription of the pre-fix loop including a truncated buffer), and tok/s is measured and reported rather than asserted. Not in scope: prefill running one position at a time at decode rate (#2787 / #2801).'
