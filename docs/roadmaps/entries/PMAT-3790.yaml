  notes: 'Closes #3790; Refs #3750. Stacked on #3761 (PMAT-3761) and #3750 PR A (PMAT-3750). WHAT LANDS. RosettaStone::validate on a GGUF (validate_gguf, the path apr qa''s tensor_contract gate and apr validate take) parses the header from the bounded prefix (aprender::format::prefix::parse_growing_prefix: 16 MiB first read, 256 MiB cap) and then reads EACH TENSOR''S OWN EXTENT with read_exact_at (gguf reader::read_tensor_f32), cut at end of file, and dequantizes it with the same dequantizers GgufReader::get_tensor_f32 uses (refactored into one slice-level core, tensor_f32_from). The peak is the largest tensor, not the file. GgufReader::from_file itself is unchanged: importers read every tensor. PER TENSOR, NOT A MAP. done_when 1 allows either ("reads tensor data from a map (or streams it per tensor)"). A map''s touched pages stay in the process RSS until reclaimed, so VmHWM would climb to the file size as the gate walks the tensors. Bounded reads keep both heap and RSS at one tensor, and the case row can measure that with VmHWM. It is the same bounded-reader policy: no read is larger than one tensor''s own extent. EQUIVALENCE (done_when 1, every value still checked). validate_gguf_stream_tests: the per-tensor read equals the whole-file read BIT FOR BIT for all 12 dequantizable ggml types (F32, F16, Q4_0, Q4_1, Q5_0, Q5_1, Q8_0, Q2_K..Q6_K); a tensor cut short by end of file fails with the identical error string; planted NaN, Inf and all-zero tensors are each named (total_nan 1, total_inf 1, all_zero [zero.weight]), and every tensor''s (is_valid, nan, inf, zero, failures) equals what compute_tensor_validation gives on the whole-file read. The existing rosetta/gguf/validate suites pass (1217). CASE ROW (done_when 3): validating a real GGUF extended sparsely to 2 GiB, in a CHILD process: VmHWM 37,748 KiB, bound 256 MiB. Mutants: validate_gguf back on GgufReader::from_file -> 2,110,048 KiB, RED; the per-tensor read reading to EOF instead of its extent -> 2,128,120 KiB, RED (the equivalence tests alone would not catch that one, so the row is what holds it). GX10 (done_when 2), measured 2026-09-22T04:18Z, `apr qa` on Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf (18,556,689,568 bytes), both binaries built on gx10 with --features cuda, each run through gpu-q --prio 5 with choom -n 1000, RssAnon/RssFile sampled every 0.2 s: BEFORE apr 0.69.0 (ff89fb6aa) peak RssAnon 19,357,084 KiB (max RSS 19,368,208 KiB, 931 samples, 3:28.73); AFTER apr 0.69.0 (21e89e311) peak RssAnon 1,350,976 KiB (max RSS 1,511,828 KiB, 984 samples, 3:37.63). 14.3x less heap; what remains is the largest dequantized tensor, not the file, which is what the per-tensor read predicts. Both runs rc 0 with qa passed and the same four gates not skipped (capability_match, tensor_contract, metadata_plausibility, performance_regression), so tensor_contract -- the gate under test -- ran on both sides. Ledger: docs/audits/3750-whole-file-model-reads.md, the gguf/reader_parsing.rs:6 row and the gx10 section now say the tensor_contract gate no longer reaches GgufReader::from_file.'
