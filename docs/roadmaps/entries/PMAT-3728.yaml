  notes: '0.69.1 row (#3710), dispatched by the cop, aprender-04. It is stacked on PMAT-3727 (#3727), which it needs: the 7b''s layers are all FP8, and the 0.5b''s defect is the stale key. MECHANISM. `cublas_prefill_fp8_gemm` quantizes the activation with `448/act_absmax` and folds the weight dequant (`w_absmax/448`) into cuBLASLt''s alpha. D is therefore `true_result × 448/act_absmax`, and step 4 multiplies `act_absmax/448` back out. D was FP16, so any GEMM whose input absmax is small relative to its output saturated at 65,504. From the CPU per-op dumps of the 0.69.0 binary (prompt "What is 2+2?"; the dumped QKV is pre-bias: `ffn_block.rs` "Trace QKV BEFORE bias"), qwen2.5-coder-7b''s layer-1 QKV has input absmax 0.0602 and outputs up to 11.54, so D peaks at 85,807 on rows 1–3. That is where the F2 gate saw the first divergence ("position 1, argmax 474 != 198, cosine 0.5668"). qwen2.5-1.5b (green) peaks at 6,822; qwen2.5-coder-0.5b''s FP8 GEMMs peak at 1,436. The 7b''s `PREFILL_DETAIL_TRACE` shows exactly the 84 intended PMAT-084 hits, so this is not the stale-key defect. HOW EACH done_when IS MET. (1) D is BF16, which has FP32''s exponent range, so the range comes from the output dtype, not the activation scale. `aprender-gpu` `cublaslt.rs`: new `Fp8GemmOut { F16, Bf16 }`, and the cached FP8 GEMM''s body moves to a private `gemm_fp8_e4m3_cached(out, …)` whose C/D layouts use `out.cuda_type()` and whose plan cache is keyed `(m, n, k, out)`. `gemm_fp8_e4m3_to_f16_cached` keeps its signature and delegates with F16. New `gemm_fp8_e4m3_to_bf16_cached` delegates with Bf16. `aprender-serve` `cublas_prefill`: the GEMM calls the BF16 variant into the same 2-byte scratch. Step 4 becomes the new `BF16_TO_F32_ACT_SCALED_PTX` / `convert_bf16_to_f32_act_scaled`. bf16 is the upper half of an f32, so the widening is `u16 → u32 << 16`, exact, on the same sm_75 target (no sm_80+ `cvt.f32.bf16`). The FP16 kernel (`F16_TO_F32_ACT_SCALED_PTX`, `convert_f16_to_f32_act_scaled`) had no other caller and is removed. The PMAT-082 JIT warmup now warms the BF16 cached plan the GEMM actually runs. The BF16 significand (8 bits) is still finer than the E4M3 operands'' (4 bits). (2) New GPU row `cublas_prefill/fp8_gemm_range_tests_3728.rs`. It calls the real `cublas_prefill_fp8_gemm` (now `pub(super)` for it), with m=16, n=64, k=256, activations 0.05 with absmax 0.0602 (the 7b''s layer-1 value), and FP8 weights all E4M3 0x7E (448) with scale 1/448. The f32 reference is 12.8 per output. It first asserts it is not vacuous: `peak × 448/act_absmax = 95,256 > 65,504`. It then requires 0 non-finite outputs and every output within 5% of the reference; FP8''s own error here is +3.2%, since 0.05 × 448/0.0602 = 372.1 rounds to the grid point 384. It skips, printing `SKIP`, without a CUDA device. On lambda it ran with no SKIP line: 1 passed. MUTANT: the pre-fix FP16 D (gemm.rs + mod.rs from the PMAT-3727 commit, with only `pub(super)` and the test module added) → RED, "D saturated: 1024 of 1024 outputs are inf/NaN". (3) On hardware, see MEASURED. STOP LIST: no change to activation or weight quantization, to which GEMMs take FP8, or to the FP16 GEMM''s other callers (`gemm_fp8_e4m3_to_f16` and the `_scaled` variant are untouched); no default-off workaround (the cop''s ruling). MEASURED: GPU row on lambda (RTX 4090, sm_89), run with `--nocapture` and no SKIP line: 1 passed. MUTANT (the pre-fix FP16 D): RED, "D saturated: 1024 of 1024 outputs are inf/NaN". Hardware on binary `b47cd0a2d` (this change stacked on PMAT-3727; this commit differs only by the rebase onto PMAT-3727''s final test-only tidy), pinned by `--version` sha, every run under `flock /tmp/apr-gpu.lock choom -n 1000`, sweep prompt, `apr run --gpu -v` + `apr qa` golden. qwen2.5-coder-7b, lambda default path (batched, FP8 on): the pos-1 divergence (0.69.0: argmax 474 != 198, cos 0.5668) is GONE, and the first divergence is now pos 44 (argmax 198 = 198, cos 0.9348); `apr qa` golden 3/3. gx10 (GB10 sm_121) with `BATCHED_PREFILL=1`: pos 1 gone, pos 44 cos 0.9364, qa 3/3. gx10 default (serial prefill): rc 0, `Backend: GPU (NVIDIA GB10)`, "The capital of France is Paris.". The remaining pos-44 rejection is a THIRD defect, PMAT-3759 (#3759): the GPU RMSNorm runs at epsilon 1e-5 instead of the model''s 1e-6. It reproduces on 0.69.0 with FP8 off (pos 44, cos 0.9348) and with serial prefill (0.9359), and float64 ground truth shows the CPU exact and the GPU wrong. So done_when 3 (the 7b green on both hosts) is NOT met by this commit alone; it is met with PMAT-3759 stacked on it, and that commit carries the closing keyword. qwen2.5-coder-0.5b on this binary: lambda default rc 0, GPU, "Paris", qa 3/3; gx10 `BATCHED_PREFILL=1` rc 0, GPU, "Paris", qa 3/3. GATES (`--features cuda`, which the per-PR workspace-test does not compile): `cargo clippy -p aprender-serve --lib --features cuda -- -D warnings` rc 0; `cargo clippy -p aprender-gpu --lib --features cuda -- -D warnings` rc 0; `cargo test -p aprender-gpu --lib --features cuda cublaslt` passed; `cargo fmt --all -- --check` rc 0. §3.B CUDA-docs arm: UNAVAILABLE. The spawn gate refused the cuda-docs-reviewer dispatch because this ticket is filed in the worktree''s roadmap, not the main checkout''s. Record it as not run, never a PASS. The device claims are backed by hardware instead: the BF16-output FP8 cuBLASLt GEMM ran and matched on sm_89 (the GPU row and all lambda cells) and on sm_121 (the gx10 cells).'
