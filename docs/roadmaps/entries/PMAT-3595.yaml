  notes: 'Gap measured at 0.69.0 (225b2a9ab) on lambda (RTX 4090, sm_89) and gx10 (GB10, sm_121) before any code, posted on #3595 (issuecomment-5763540923). ROOT: the GH-224 session cache holds only the DENSE OwnedQuantizedModelCuda; try_init_gguf_cuda returns (None, false) for qwen35, so every chat turn falls through to generate_gguf_cpu_tokens, which calls Qwen35Model::create_base_model + run_qwen35_generate_dispatch — a fresh Qwen35CudaModel upload, an F2 sha256 of the whole file (27B: 7.5-8.3 s), a token-by-token re-prefill of the whole conversation, and on sm_121 a PTX re-JIT, all PER TURN. nvidia-smi on lambda 9B: 1187 → 6772 → 6936 → 1576 → 6772 → 6936 → 1576 MiB. Under contention the 9B turn-2 re-allocation hit CUDA_ERROR_OUT_OF_MEMORY and fell back to the CPU (99.7 s).

    Shape of the fix: realizar gains `Qwen35Session` (gguf/inference/forward/qwen35_session.rs) — the hybrid built ONCE, F2-validated once on the first turn''s real prompt (the file hashed once, at load), and a decode state that outlives the turn. A prompt that extends the tokens the state already holds prefills only the new suffix; any other prompt resets the state in place (conv + recurrent state zeroed on the device, KV marked empty) and prefills it whole, on the SAME resident model. The state grows by doubling up to the GGUF''s declared context length; a prompt that cannot fit is refused by name, and a generation budget cut by the context is reported, never silent. The GPU fallback stays loud and keeps QWEN35_GPU_FALLBACK_PREFIX. The same type is what #3571 routes `apr serve` to.

    OUT OF SCOPE here, and why: issue done_when 4 (a tree-wide guard for "a pub fn whose doc says live behaviour elsewhere is wrong, with zero callers") is a guard with its own universe and falsifier, filed as a follow-up rather than bundled; so the PR says Refs #3595, not Closes. The --thinking on|off switch is #3723 (aprender-fd); chat consumes it once it lands. aprender-fd''s qwen3-8b chat-template change (f46063527) touches chat_load_tokenizers.rs and chat_session_02.rs in hunks disjoint from this row''s.'
