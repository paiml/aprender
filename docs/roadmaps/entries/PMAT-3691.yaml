  notes: 'Dispatched by the cop, aprender-04, to aprender-37 (2026-09-21 ~14:25Z). BASE: `0517e75a7` (PMAT-3661), not origin/main. #3691 reuses `CliError::invalid_model_file`, which #3661 added, and #3661 is not on main yet: it is folded into the unpushed `release/0.70-batch-1`. This branch is one commit on top of it, so the batch folds only this delta. HOW EACH done_when IS MET. (1) The six sites use `CliError::invalid_model_file(path, context, &e)`: hex.rs `parse_gguf` and `get_gguf_tensor_f32` (context "Failed to parse GGUF"), and trace_likely_has_repeated.rs `trace_gguf` ("Failed to parse GGUF") and `trace_safetensors` ("Failed to inspect SafeTensors"). Each has a path and an `AprenderError`, so the helper names the format from the file''s magic bytes and strips the core FormatError prefix. The two SafeTensors header-reader sites (UTF-8, JSON) have neither a path nor an `AprenderError`: `parse_safetensors_header(bytes)` gets the whole file, which `hex::run` already read, and a `Utf8Error` / `serde_json::Error`. They use a new sibling constructor, `CliError::invalid_model_bytes(bytes, message)`. It follows the same rule, reading the format from the bytes'' magic and never assuming it, through a new `hex::detected_format_of(bytes)`; `detected_model_format(path)` now calls that function after reading its 9 bytes. That is the done_when''s "variant naming the format it already knows". Every moved site keeps exit code 4: `InvalidModelFile` is on the same arm as `InvalidFormat`, and each row asserts `exit_code_value() == 4`. SCOPE, with one rule and its exclusions named. Besides the six, four more sites move: the rest of "the SafeTensors header reader", the unit done_when 2 names. Those are `parse_safetensors_header`''s size check ("SafeTensors file too small") and length check ("SafeTensors header length exceeds file size"), plus the "SafeTensors header is not a JSON object" check in each of its two callers (`run_safetensors`, `slice_safetensors`). The issue''s grep matched `format!(` calls only, so it missed these four string literals. Leaving them would keep printing "Invalid APR format: SafeTensors …" from the same reader. That makes 10 sites in 4 files. NOT moved, deliberately: hex.rs:353, `get_gguf_tensor_f32`''s tensor read. It also fires on `apr hex --slice … --tensor NAME` with a NAME that is not in the file (core says "Tensor ''NAME'' not found in GGUF"), so moving it would call a healthy file "Invalid GGUF file". It needs a split, not a move, and is classified below. The other 116 sites are classified, not changed. `CliError::InvalidFormat` itself is unchanged. TESTS (done_when 2). New `commands/model_file_error_tests_3691.rs`, declared as a `#[cfg(test)]` child of `hex` so it can call the private reader. It has one row per moved site, plus a second-caller row and an APR control. Each row renders `error: {e}` exactly as main.rs prints it and checks four things, the same as #3661''s table: the expected prefix; no "Invalid APR" unless the file is APR; no core "Invalid model format" anywhere; and exit 4. Rows that a file can reach call the real `hex::run` / `trace::run`: a truncated GGUF (hex, `hex --slice`, trace); SafeTensors with an overrunning header length, a non-UTF-8 header, and a cut-off header `{"a":` (hex, `hex --slice`, trace); and #3661''s 4 KiB noise named `.safetensors` (trace, by extension). Three sites cannot be reached through `hex::run`, because its `detect_format` picks SafeTensors only for 9+ bytes with `{` at byte 8: the 4-byte size check, and "not a JSON object" in both callers (a header starting with `{` is an object or not JSON at all). Their rows call the private function directly with the bytes that would reach them: 4 bytes, and a `[1]` header. The expected messages are: GGUF rows "Invalid GGUF file: Failed to parse GGUF: Unexpected EOF reading u64 at offset 24"; hex SafeTensors rows "Invalid SafeTensors file: <the reader''s message>"; the 4-byte and array rows "Invalid model file: …", because their magic matches no format; trace on the cut-off header "Invalid SafeTensors file: Failed to inspect SafeTensors: …"; trace on noise "Invalid model file: Failed to inspect SafeTensors: …"; and the APR control (a truncated .apr through `run_apr`, unchanged) "Invalid APR format: Failed to read APR: …". The fixtures are #3661''s, made `pub(super)` in model_file_error_tests_3661.rs instead of copied; that file''s own test is unchanged and still passes. CLASSIFICATION (done_when 3). It is in the commit message and goes in the PR body. There are 126 sites at `0517e75a7`: 125 `CliError::InvalidFormat(` lines plus one function-pointer use (dispatch_run.rs:242 `.map_err(CliError::InvalidFormat)`, which the `(` grep misses). The issue''s 130 was `git grep ''InvalidFormat(''` at `d0771c5c5`: 128 sites, the variant declaration, and its exit-code arm. #3661 moved 3. Classes, decided by the input that reaches each site: MOVED here, 10; MOVE, model file (may be GGUF, SafeTensors, or unrecognised, so "Invalid APR format" can be false), 33; MOVE, not a model file (CLI arguments, JSON/CSV/corpus inputs, HF responses, serialising our own reports, IO), 58; KEEP, APR-only input, 15; TEST, asserting on the variant, 10. A script checked that every one of the 126 appears in exactly one class. STOP LIST: no change to `InvalidFormat`''s Display or to any of the 116 unmoved sites; no new error variant; no edit outside apr-cli except this fragment and the regenerated roadmap.yaml; no push and no arm, because the cop folds this into the batch. MEASURED at this commit: `cargo test -p apr-cli --lib`: 7295 passed, 0 failed, 12 ignored (#3661''s 7294 plus this table). `cargo test -p apr-cli --lib model_file_error_tests`: 2 passed, this table and #3661''s, whose fixtures it now shares. `cargo clippy -p apr-cli --lib -- -D warnings`: rc 0. `--tests` fails only on 2 findings in the untouched pre-existing `commands/nf4_classifier.rs`, the same state #3661 recorded; none are in a touched file. `cargo fmt --all -- --check`: rc 0. Rustfmt does not reach safe_tensors_header.rs through its `include!`, so its changed lines were formatted by hand, and a whole-file rustfmt was not applied because it rewrites untouched lines. `scripts/check_complexity_ratchet.sh`: "a877fa056 vs <head> … none new, none grown". `bash scripts/guard_tree.sh --no-cargo`: 76 checks, 0 failed. `check_roadmap_fragment_required.sh`, `roadmap_fragments.py aggregate --check`, `check_roadmap_sorted.sh` and `check_roadmap_ids_unique.sh`: all PASS. MUTANTS, run one at a time against this table, each RED: S01–S10, each moved site reverted alone to its pre-fix `CliError::InvalidFormat(…)`, fails exactly its own row. For example, S01 renders "error: Invalid APR format: Failed to parse GGUF: Invalid model format: Unexpected EOF reading u64 at offset 24", the issue''s string. With all 10 reverted, the 12 non-control rows fail (29 checks) and the APR control still passes. H1, `invalid_model_bytes` hardcoded to "SafeTensors" (the assumed format), fails the 3 "Invalid model file" rows (4 bytes, array header ×2). H2, `detected_format_of` always returning "model", fails the 8 rows that expect GGUF or SafeTensors. Sources were restored and checked by md5 before the full runs. NOT DONE: a run of a freshly built `apr` binary. The host was at load 55–64 on 48 cores, and a release build of the facade would have added to it. The table renders the same `error: {e}` line main.rs prints and asserts the exit-code mapping directly.'
