  notes: 'Parent #3568 (design note issuecomment-5763921678, ruled by the cop 2026-09-21): PR 1 of 4. Refs #3568 and Closes #3747. WHAT LANDS. crates/aprender-serve/src/constrain/mod.rs: TokenConstraint; ConstraintError with Display `SchemaInvalid: …`, `SchemaUnsupported: …`, `ConstraintDeadEnd: …`, `ConstraintRejected: …`, `ConstraintVocab: …`, `StructuredOutputNotCompiled: …`; load_schema (inline | @path); ConstraintVocab + validate(); ConstraintEnv (index once per model) -> json_schema / lark; doc: cross-field facts no JSON Schema expresses stay the consumer''s to check (rmedia, #3716). constrain/llg.rs (feature structured-output): special tokens carry TokTrie''s marker byte so no grammar can emit them as text. JSON is COMPACT unless the caller set its own x-guidance: llguidance''s default flexible whitespace ran away in this case table ({ then 63 bytes of whitespace). A boolean schema is normalised: `true` -> `{}`, compact; `false` -> SchemaInvalid (it admits no document). An approximation (grammar warnings, reachable only through a caller''s lenient/coerce_one_of x-guidance) is SchemaUnsupported, never used quietly. Engine compile errors map to SchemaUnsupported with the engine''s message verbatim: llguidance''s errors are untyped, and a substring sort would be a text match standing in for a type. A failed compute_mask (NoExtensionBias) and an empty mask are both DeadEnd. crates/aprender-serve/src/gguf/token.rs: GGUFModel::constraint_vocab() and push_token_bytes, which decode() now calls too. control/unused token_type (3, 5) are special, else the GH-320 <|…|> rule; SentencePiece''s ▁ is mapped on BYTES so a lone <0xNN> survives. test_factory gains add_i32_array. examples/constrain_mask_overhead.rs (required-features structured-output). DEPENDENCY. aprender-serve: llguidance 1.8.0 optional, default-features off, [lark, rayon, ahash] (referencing dropped: it duplicated referencing 0.28/0.29; a $ref schema is then refused by name). Feature structured-output = [dep:llguidance]; apr-cli inference adds realizar/structured-output. NOTE for reviewers: `realizar` IS aprender-serve. Root Cargo.toml has `realizar = { path = "crates/aprender-serve", package = "aprender-serve" }`, aprender-serve''s [lib] name is `realizar`, and apr-cli''s existing cuda feature enables `realizar/cuda` the same way. `cargo check -p apr-cli` rc 0 and the example (`use realizar::constrain`) builds rc 0. A round-1 lane read this as a mismatch and was refuted by the build. cargo deny check licenses / advisories / bans / sources: all rc 0; duplicate-crate warnings 64 on main -> 66, the +2 being strum/strum_macros 0.28 via derivre (llguidance''s regex engine). MEASURED at this commit. cargo test -p aprender-serve --lib --features structured-output -- constrain:: constraint_vocab: 24 passed. Without the feature: 12 passed, including StructuredOutputNotCompiled. Consumer schemas (RAH quorum-lane; rmedia quiz, outline, key-terms/reflection) compile exactly, accept real documents byte by byte to completion, allow nothing after one complete value, and refuse 7 violations at the byte (enum, minimum, pattern x2, additionalProperties:false, const, minLength). RAH row: a model intending the 2026-09-21 NULL vote {"verdict":"PASS","summary":"ok","finding":[]} is held until the required `findings` exists; unconstrained it writes the NULL vote. MUTANTS (8, each RED, re-run on this commit): mask a no-op (7 rows), special marker dropped (1, the in-string special row), flexible whitespace (3), approximations allowed (1), accept never refusing (2), token_type ignored (1), gpt2 bytes read as UTF-8 (1), boolean `true` left flexible (1). OVERHEAD, examples/constrain_mask_overhead, release, 3 runs, a real 124-token RAH verdict tokenized by the model''s own tokenizer and accepted end to end: Qwen3.5-9B-Q4_K_M (vocab 248,320) index 559-606 ms once per model, compile 0.67-0.79 ms, mask p50 155-163 us, p95 207-223 us, max 262-291 us per token; Qwen3-1.7B (151,936) p50 104-105 us. Against RAH''s measured decode of 1.0-2.9 tok/s that is under 0.05 percent. cargo fmt --all -- --check rc 0 (the example is formatted; round 1 caught it unformatted); clippy -p aprender-serve --lib --features structured-output -D warnings rc 0.'
