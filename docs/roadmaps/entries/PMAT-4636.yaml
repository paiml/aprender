  acceptance_criteria:
  - 'apr serve builds the CUDA model with OwnedQuantizedModelCuda::for_serving; with no --context-length the device KV = serving_kv_len = min(model context, what free VRAM holds with SERVE_BATCH_SLOTS=2 batched slots budgeted), floored at 4096 (or the model context when shorter)'
  - 'An explicit --context-length (not the default) still sizes the KV via REALIZR_CONTEXT_LENGTH'
  - 'The D5 refusal limit (PMAT-4616) is the serving context this KV yields: at the limit 200 whole, one past it 400, never 500; api/tests/serve_kv_limit_k1.rs checks it on the device with an 8192-context model, so a return to the fixed 4096 fails'
  - 'gguf/cuda/session_kv.rs unit tests: a small model gets its whole context; a model that fills the card keeps the 4096 floor; partial room is used and never exceeded'
