  - "S1.1: cargo test -p apr-cli --lib surface:: passes. It includes the_emitter_sees_a_flag_added_to_the_clap_tree: `--zz-dummy` (SetTrue) is injected into `run` via mut_subcommand and appears in the emitted JSON under path [\"run\"] with role mode. It also includes the_surface_is_versioned_and_deterministic: schema == \"apr-cli-surface/v1.1\", and two emissions from one tree are byte-identical."
  - "S1.2: in the emitted surface, every model-taking command's model arg has role model. This covers run SOURCE, chat, serve run, code --model, qa, inspect, tensors, trace, diff, merge, distill --teacher/--student, finetune, the rosetta subcommands, pull/rm/import, and pv verify-structure --model and rag transcribe --model (cop ruling below). run --prompt and the run positional PROMPT have role prompt, run --input has role input-file, and run --backend has role backend. Each role is read by TypeId (or by BackendArg's group id), never by name."
  - "S1.3: cargo test -p apr-cli --lib surface::guard passes. Every free-form arg (raw PathBuf, or raw String without a finite value set) in a non-foreign subtree is RED, and the guard names `<path> <arg>`. The foreign-subtree list is by Rust type and fails closed both ways. The case table has one row per value-parser class. Mutants, each observed RED then restored GREEN: (a) inspect's `file: ModelPath` reverted to `PathBuf`; (b) a new subcommand with a raw `--model: PathBuf`; (c) a raw `String` prompt."
