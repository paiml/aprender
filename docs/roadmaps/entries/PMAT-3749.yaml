  notes: |
    Part S1 of #3745. Owner aprender-fc, routed by cop aprender-04. Criteria quoted VERBATIM from the cop's per-part comment on #3745 (issuecomment-5764661626):

    "### S1: surface emitter + typed arg markers + marker guard (aprender-fc)
    - [ ] S1.1 A hidden `apr` subcommand prints the full clap tree as JSON: every subcommand path; every arg with long/short/positional, num_args, value_enum values, default and **role** ∈ {model, prompt, input-file, backend, mode, other}. A test adds a dummy flag to the clap tree and finds it in the JSON.
    - [ ] S1.2 The role is read from the arg's typed constructor, not its name. Every existing model-taking command is migrated onto the markers.
    - [ ] S1.3 Marker guard (issue mutant 3): a command that loads a model through a plain `PathBuf` arg is RED, with a case row and a mutant.
    - [ ] S1.4 The JSON schema is agreed with S2/S3/#3739 and versioned inside the JSON. It's generated from the binary under test at gate time and never committed."

    Issue mutant 3, VERBATIM from the #3745 body: "**Mutant 3:** a command that loads a model with a plain `PathBuf` arg instead of `ModelArg` → the marker guard is RED."

    Cop rulings on the S1 design note, VERBATIM from aprender-04 (2026-09-21, on #3749's design, #3745 issuecomment-5764787123):
    "3. Totality over loader-detection: approved, and better than what I specified. Making an undeclared role inexpressible needs no loader list to rot. It also means "other" roles are typed too (OutputPath, DirPath, FreeText…); no raw PathBuf/String survives in apr-cli subtrees.
    4. KEEP the String half. It closes the #3743 prompt-in-a-String class, and cutting it would re-open a leak we just paid for. The 428-arg migration is the job. Foreign subtrees: they ARE apr's surface, so emit them with `foreign: true`. The two known model gaps (`pv verify-structure --model`, `rag transcribe --model`) are in-tree crates: give them the ModelPath type in S1 itself, not a follow-up, because a model-taking verb with no cells is exactly the leak. Any remaining foreign free-form arg is emitted role `unknown`. S2 gives every `unknown` arg's verb at least the runs-or-refuses cell, and the receipt carries the `unknown` count under a SHRINK-ONLY ratchet (it can only go down).
    5. dispatch_run.rs and the serve handlers untouched, adapting at dispatch.rs: approved."
    Cop ruling on the dispatch_run.rs edits the migration forced, VERBATIM from aprender-04 (2026-09-21, after being notified before the edit): "proceed. The 7 conversion edits in dispatch_run.rs are disjoint from #3707's run_prompt_and_chat hunk, and I'll resolve them at the fold if git needs help. No separate note to a8 is needed; #3743 adds a test elsewhere." So ruling 5's "dispatch_run.rs untouched" holds for the `dispatch_run` fn and its `run` args; the 7 edits are in its serve and rosetta arms, and the serve handlers are untouched.
    Cop ruling adding `generates` (schema v1.1), VERBATIM from aprender-04 (2026-09-21): "one additive change to S1 BEFORE its slot-3 review (~21:50Z), so the review covers it. aprender-97 (S2) found that the prompt-role rule misses `serve run`, whose prompts arrive over HTTP, which would regress from #3715. Add a surface field `generates: bool` per command, from a TYPED marker: true when the command has a PromptText arg or carries a new `ServesGeneration` marker (put it on `serve run` and any other HTTP/stdin generator), never from the name. Include a case row plus a mutant (drop the marker from serve run → the surface says generates=false → RED), and bump the schema's minor version."
    So the role set emitted is {model, prompt, input-file, backend, mode, other, unknown}. `unknown` exists only because of ruling 4, and the marker guard makes it RED outside foreign subtrees.

    Where it runs: the marker guard is a `cargo test -p apr-cli --lib` test, so it runs in CI's workspace-test (nextest --lib over the workspace). The surface JSON is produced by the built binary (`apr surface --json`) at gate time for S2/S3/#3739. That is cargo-side only, and nothing is committed.
    Deliberately NOT here: S2 (the cli-surface extractor, derived cells, the release-readiness targets) and S3 (the hand-list guard). Their owners are 97 and 62.
    Refs #3745 #3743 #3739 #3715.
