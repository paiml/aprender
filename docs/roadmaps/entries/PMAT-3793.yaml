  notes: 'Refs #3568 (PR 2 of 4), #3793. Base: main @ 92599723e6; the release/0.69.1-batch-1 base and its two separate CPU loops are gone. ONE ENGINE (#4263): aprender-serve session_constrained.rs Session::generate_constrained is Session::generate with the constraint masking HOST logits before the repetition penalty and choose_token, never the forward_greedy fast path; a stop token ends Complete only when the constraint is complete, else ConstraintRejected; the budget ends Complete or Length. ROUTING: infer/constrained_generate.rs unconstrained_gguf_path mirrors the unconstrained dispatch in order (qwen3-moe, qwen35-cuda, gguf-cuda, gguf-wgpu when wgpu_fallback_allowed and greedy, gguf-trace, else the CPU session engine); a path that cannot mask is refused SchemaUnsupportedPath by name exactly when the dispatch would take it, never run unconstrained; apr, safetensors and mock refuse. CLI: --json-schema / --grammar (FreeText, #3745) are read before the model loads, the second reader compiling the schema there (SchemaInvalid with nothing loaded); every refusal exits 15 with kind, message and removed_by (a JSON doc under -f json); --batch-jsonl refuses a constraint (stderr and exit 15; batch writes JSONL, so no document); the jsonschema 0.28 second reader re-validates before exit 0; an empty completion is refused; a build without inference refuses StructuredOutputNotCompiled. DEBT: the commit hook complexity cap forced behaviour-preserving splits of run.rs resolve_model, dispatch.rs (run_accel_plan, dispatch_trace_save_tensor, the Diff arm) and aprender-orchestrate parse_tool_calls_envelope. REVIEW: quorum q1 (sonnet + haiku lanes, the planted constrained_end inversion caught by both); its 2 minor findings fixed in a3d38aade6. EVIDENCE (intel, tree equal to the commit by full-index diff sha fd0b5772d9e5e86b): fmt rc 0; clippy -D warnings apr-cli and aprender-orchestrate rc 0; apr-cli lib 7511 passed, 0 failed, 12 ignored; aprender-orchestrate tool_call/realizar/envelope 59 passed; cli_commands 15/15; apr-cli --features cuda check rc 0; aprender-contracts lib 2290 passed; cargo deny advisories rc 0. Real rows on CPU (qwen2.5-coder-1.5b Q4_K_M dense, Qwen3.5-0.8B Q4_K_M hybrid): r03 dense {"answer":4} and r04 hybrid {"answer":2}, constraint_complete, rc 0; a permissive grammar reproduces the free text token for token on both models (r06 = r05, r08 = r07), so the mask only removes candidates; r09, a prompt that asks for a poem, still gives a conforming {"answer":1}; r10 grammar "yes"; refused rc 15: r11 --trace SchemaUnsupportedPath, r12 --batch-jsonl SchemaUnsupportedPath, r13 an 8-token budget Truncated, r14 a thinking template SchemaWithThinking. r01 {"type":12} was SchemaUnsupported after a 38.2 s load; fixed in 24c6217721, it is SchemaInvalid in 0.0 s, {"minimum":"zero"} likewise. Corpus (RAH quorum-lane, rmedia quiz/outline/keyterms; 2 models; a record prompt and a poem prompt; -n 1024): 2 of 16 complete and pass the second reader, 14 refused Truncated with exit 15 (the models loop inside unbounded strings), 0 non-conforming successes. apr-cli --no-default-features --lib does not build on base (23 errors, all in code this PR does not touch), so no gate compiles the StructuredOutputNotCompiled branch.'
