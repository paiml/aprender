  notes: 'Closes #3793; Refs #3568 (PR 2 of 4). Base: release/0.69.1-batch-1 @ 6c40a8a95, which carries PR 1 (#3747). WHAT LANDS. aprender-serve: constrain/mod.rs gains ConstraintRequest {JsonSchema | Lark} (compile against the model''s indexed vocabulary), load_grammar (inline | @path, empty refused), and the refusals SchemaUnsupportedPath{path, removed_by}, SchemaWithThinking, SchemaViolation, Truncated{max_tokens}, each Display one line beginning with its name; RealizarError::Constraint keeps a refusal TYPED to the CLI. THE CPU LOOPS: OwnedQuantizedModel::generate_with_cache_constrained (the dense loop: the same prefill, KV cache, context-clamped budget; each step is mask, then the loop''s own repetition penalty and sampler, then accept) and forward_qwen35::run_qwen35_generate_constrained (the hybrid: same state and budget, and no penalty, because its loop has none). End-of-sequence ends a COMPLETE document (the mask admits it only there); the budget ends at Complete or Length; a dead end or a rejected token is an error, never an unconstrained step; the returned tokens never include end-of-sequence. ROUTING (infer/constrained_generate.rs): a constrained run takes the CPU loop, else refuses by name before a token: gguf-cuda and qwen35-cuda when a CUDA device would serve (removed_by #3568 PR 3; --no-gpu runs the CPU loop), gguf-wgpu when a wgpu adapter would serve (the default build has wgpu), qwen3-moe always, and apr, safetensors, sharded-safetensors, mock, and --batch-jsonl. The unconstrained dispatch moved unchanged into generate_gguf_unconstrained. The schema compiles after load and before the first token (SchemaUnsupported). SchemaWithThinking is decided in prepare_tokens_gguf before generation, keyed on the formatted prompt leaving a <think> block open (prompt_opens_thinking); apr''s default Qwen3NoThink prefills a closed block and passes. A constrained output is the decoded document as is (no clean_model_output). FinishReason gains constraint_complete and dead_end. apr-cli: --json-schema and --grammar on `apr run` (inline or @path; they conflict), read in constrained_run.rs BEFORE the model loads (SchemaInvalid, measured 0.00 s, no model loaded). One exit code, 15 (CliError::ConstraintRefused), for every refusal; the kind is the first word of the one stderr line and refusal.kind in --json, which also carries removed_by. A refusal before output still answers --json with the refusal document; after output (Truncated, SchemaViolation) --json carries text, finish_reason and refusal, the human surface stays silent, and the run exits 15. THE SECOND READER: the jsonschema 0.28 crate (already in the lock), independent of llguidance, validates every complete --json-schema output before exit 0; --grammar has no second reader (nothing independent parses Lark in-tree), and says nothing it did not check. contracts/cli-dispatch-v1.yaml (both copies) now lists 12-14, which CliError already used, and 15. EVIDENCE. Unit: the pygmy model (random weights, a 32-token byte vocabulary) writes a conforming {"a": int} under the mask, where unconstrained it writes <unk>…; the no-op-constraint MUTANT (mask and accept removed) turns that row RED with <unk>×24 (removing the mask alone is RED too: accept refuses the unmasked token). Budget-mid-document is Length; greedy is deterministic; 22 constrain rows, 5 routing rows, 12 CLI rows (refusal names/one line/removed_by/finish_reason, exit 15, the second reader refusing 5 nonconforming documents, flag conflict with its controls). Real models, CPU, this box: coder-0.5B {"answer":4} constraint_complete; Qwen3.5-0.8B {"answer":2} for 2+2 conforming — to rule out the loop, a permissive grammar /(.|\n)*/ reproduces free decoding TOKEN FOR TOKEN on both loops (5x6, spider), so the wrong digits are the 0.8B model forced to answer without reasoning, not the loop. A violating prompt under a BOUNDED schema still conforms: {"answer":1000}. --grammar ''start: "yes" | "no"'' gives yes. CORPUS (the real consumer schemas: RAH agy/quorum-lane-schema.json, rmedia quiz, outline, key-terms), two asks (the record; ''do not write JSON, write a poem''), coder-0.5B and Qwen3.5-0.8B, CPU, budget 1024: 16 samples, 6 exit 0 and every one of them passes the second reader (Qwen3.5 all four records; coder RAH and quiz), 10 are refused Truncated (exit 15), and 0 exit 0 non-conforming. The refusals are real limits of the schemas: a greedy model loops inside an unbounded string (RAH summary: ''a vast, vast sea…'') or number (rmedia seconds, exclusiveMinimum 0: 0.000…), which no budget completes; and the bounded key-terms schema, cut at 1024, completes at 2048 (coder-0.5B: 1271 tokens, 6,322 characters, constraint_complete, the second reader passes, rc 0), so a bounded schema needs a budget that covers its largest document. done_when 9 was amended on the issue before round 1 to say what holds. Consumers should bound strings and numbers (maxLength, maximum). SPEED: on this host (load average ~30 on 48 cores) unconstrained CPU decode of the 0.5B is 1.9 tok/s and constrained 1.7-1.8 (within noise); PR 1 measured the mask at p50 155-163 us. FOLD with #3723 (aprender-fd, agreed): when its ChatPrompt { text, thinking } lands, prepare_tokens_gguf''s refusal becomes constraint.is_some() && (chat_prompt.thinking || opens_think_block), keyed on the templated prepare only, never the raw_prompt passes. CHECKS: cargo fmt --check rc 0; clippy -D warnings rc 0 on aprender-serve (structured-output) and apr-cli; cargo check -p apr-cli --features cuda --lib --tests rc 0; the complexity ratchet rc 0; apr-cli lib 7329 of 7330 (the one red, commands::serve::accelerator_guard_tests::the_gguf_cuda_serve_path_reads_the_context_length_flag, is on the batch head 6c40a8a95 itself, in files this PR does not touch, reported to the cop); apr-cli --test cli_commands 15, backend_refusal_case_table 5, registry_failure_catalogue 10; aprender-serve infer:: constrain:: gguf::inference:: 1139.'
