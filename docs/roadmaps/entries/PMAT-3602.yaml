  notes: 'ACCEPTANCE (hand-entered from gh#3602 done_when; pmat work add derives neither spec: nor acceptance_criteria: — paiml-mcp-agent-toolkit#1414). Item 1: the GPU rejection is surfaced on a stream a user reads AND in --json. Item 2: SATISFIED BY #3606 — validate_ms instruments validate_gpu_first_token, measured 15.1s on qwen2.5-coder-0.5b; not owed again here. Item 3: root cause named for the dense path — ANSWERED, it is FP8 PREFILL, established by a 2x2 over FP8_PREFILL x FP8_DECODE with both flags named in every cell (divergence tracks FP8_PREFILL exactly, independent of FP8_DECODE; 34.3s used_gpu=false vs 16.9s used_gpu=true); a single-knob bisect could not separate them because detect_fp8_decode falls through to fp8_prefill. Item 4: the fail-vs-fall-back decision RECORDED — it already was, in registry::after_generation (R-0b, gh#3002/#3042): forced accelerator that fell to CPU = refusal exit 14, default selection = corrective line. The defect was that it had NO PRODUCTION CALLER; nor do registry::announce or registry::parity_line, which is why a real run prints zero selected: and zero parity: lines. Item 5: falsifier both ways — 6 cases in run_tests_accel_reconcile.rs; planting the pre-fix behaviour turns the two defect tests RED while the healthy-GPU control stays green. Measured on lambda RTX 4090 sm_89, apr 0.68.2 (e6f77c98c). NOT IN SCOPE, deliberately: the rejection REASON (cosine, position) is not plumbed into --json — it is produced inside realizar F2 and no channel carries it to the CLI; that is a #3606-shaped follow-up, not a value to approximate. STOP: do not widen f2_should_retry_without_fp8 here — that band belongs to gh#3483, reopened with the contradicting measurement. BLAST RADIUS: exit code changes on a shipped surface; 14 files under scripts/ and .github/workflows/ pass --gpu, incl. perf_gate.sh, parity_host_receipt.sh, model_ladder.sh — CI going red on one is the measurement, and its fix belongs on that gate. SEGMENT 2 (aprender-52, 2026-09-26, car/0.70.0 @ 11bcf6c2ba, lambda RTX 4090 sm_89, qwen2.5-coder-0.5b Q4_K_M sha256 1d9614638d18…). RE-MEASURED FIRST: the cosine-0.4153 rejection no longer reproduces -- #3727 made PMAT-084 activation reuse opt-in, and every --gpu run now reports backend ran=gpu, fell_back=false, FP8 on. What remained of the 2-3x was the guard itself: validate_gpu_first_token runs a CPU reference forward of the whole prompt on EVERY dense --gpu run, so setup_ms was 28193 on the GPU run against a whole --no-gpu run of 33851-36541 ms (load 35-75 on 32 cores; the absolute numbers are contention-bound, the ratio is structural: --gpu could not reach its first token before --no-gpu finished its prompt). FIX: the #3604 receipt (operator ruling 2026-09-20, hybrid path) on the dense GGUF path, keyed additionally on the prefill precision that passed (prefill=fp8 | fp16 | fp16;fp8-rejected), because on the dense path the guard CHANGES what runs (#3807 FP16 re-measure): a receipt that recorded only pass would re-enable the FP8 the guard rejected. fp8-rejected skips AND forces FP16; a plain fp16 receipt (a FP8_PREFILL=0 run) does not vouch for FP8. MEASURED: fresh setup 24726 ms (guard 22771 ms, receipt written), next two runs setup 1539 / 1548 ms (sha256 391 / 413 ms), identical text; --revalidate re-runs the guard; a planted fp16;fp8-rejected receipt skips, clears the FP8 weight cache, same text; a planted plain fp16 receipt validates naming the precision. FALSIFIERS: 11 rows in f2_dense_receipt_tests.rs; 3 mutants (never force, no rejected-tag lookup, fp16 receipt vouches for fp8) each RED. OUT OF SCOPE: the APR-format CUDA path (try_apr_cuda_inference) still validates per call; done_when 1 and 2 (reason + validate_ms in --json) need the #3606 StageTimings channel, which did not land (#3606 CLOSED unmerged).'
