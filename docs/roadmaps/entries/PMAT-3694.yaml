  notes: 'Follow-up to #3695 (the stop-gap that made a python-free runner UNMEASURED exit 3) under the cop ruling on #3689. SCOPE: scripts/parity_receipt_denominator.sh, crates/aprender-contracts-cli/tests/ont4c3_parity_receipts.rs, and this fragment. HOW IT IS MET. classify() is POSIX awk, run under LC_ALL=C: a strict RFC 8259 parser, iterative (an explicit container stack, so no recursion limit), that validates UTF-8 inside strings (no overlongs, no surrogates, nothing past U+10FFFF) and keeps only the ROOT object''s keys, each value''s kind and the decoded text of a string value. The rule is unchanged: record iff the root is an object whose schema is the string apr-parity-receipt/v2; legacy iff not, and metrics is an array or parity is present; anything else, including any syntax error, is other. A later duplicate key wins, as in json.load and serde_json. A raw NUL byte is decided in bash (other), because busybox awk holds C strings and would truncate the document. It is still an independent implementation: no code shared with extract:parity-receipt. The one deliberate difference from the python it replaces: NaN / Infinity are not JSON (RFC 8259), and serde_json refuses them too, so they are other. REMOVED: PY_BIN / PARITY_PYTHON, the command -v check and its UNMEASURED return 3, the --self-test UNMEASURED early exit, and the Rust test''s exit-3 acceptance. There is no exit 3 any more. A missing awk, or one that answers nothing, is ENV exit 2, RED (seam PARITY_AWK). SELF-TEST, 9 rows (was 7): the 5 original rows unchanged, including the #3682 git-refusal row; NEW "a PATH with no python3 (only git awk sort grep head tr wc) measures the same PASS", which also lists the script''s dependencies; NEW "a missing classifier is ENV exit 2 naming it, never a count of 0 or UNMEASURED", replacing the #3695 no-interpreter row; "a classifier that answers nothing is ENV exit 2" (#3695, kept); NEW a 35-row classification table (escaped slash, a \u-escaped key, quotes and brackets inside strings, schema nested or only in prose, a root array, a truncated document, trailing content, a trailing comma, single quotes, NaN, a leading zero, a raw tab, a bad escape, latin-1, a UTF-8 surrogate, a NUL, a BOM, duplicate keys in both orders, and legacy metrics[] / parity / an escaped metrics key). MEASURED at this commit. `bash scripts/parity_receipt_denominator.sh` rc 0 "PASS  7 receipt(s) under evidence/parity/**, and evidence/parity/EXPECTED_RECEIPTS says 7." --self-test rc 0, 9 ok, under gawk 5.1, mawk 1.3.4-20200120 and busybox awk (PARITY_AWK). THE YOGA SHAPE, a PATH of every /usr/bin and /bin executable except python* (2832 tools, command -v python3 finds nothing): the real corpus gives the same rc 0 PASS 7, --print gives 7, and --self-test gives 9 ok. THE RUNNER IMAGE: sovereign-ci is FROM rust:1.95-slim-bookworm (infra machines/intel/sovereign-ci/Dockerfile). In debian:bookworm-slim plus git (mawk 1.3.4.20200120-3.1, python3 NONE, jq NONE) the self-test gives 9 ok and the real corpus gives PASS 7 rc 0; in rust:1.95-slim (trixie, mawk 1.3.4.20250131-1, python3 NONE, jq NONE) the same. awk is Priority: required in Debian, and 52 of 131 scripts/check_*.sh already run it on every runner. DIFFERENTIAL against the old python classify(), over all 118 tracked files under evidence/parity/** plus 55 adversarial documents including a 3000-deep nesting: identical under gawk and mawk except NaN and -Infinity (the deliberate difference above); 7 records in both. The 35 table rows agree with the python rule on 34; the 35th is the NaN row. MUTANTS, each run against --self-test, all RED: a substring classifier (grep for the schema) gives rc 1 with 23 FAIL rows; the python classify() restored gives rc 1 ("a python-free PATH gave exit 2 … python3: command not found"); the first duplicate key wins gives rc 1 on both duplicate rows; UTF-8 validation removed gives rc 1 (latin-1, surrogate); trailing content accepted gives rc 1; the schema-kind check removed gives rc 1 ({"schema":"<v2>","schema":2} -> record); the silent-classifier arm restored to fall through as other (#3695) gives rc 1, "the tree holds 0"; the NUL pre-check removed gives rc 1 under busybox awk and rc 0 under gawk, so that guard is load-bearing only for C-string awks. THE RUST TEST: `cargo test -p aprender-contracts-cli --test ont4c3_parity_receipts` 9 passed with python3 on PATH, and 9 passed on the yoga-shape PATH plus ~/.cargo/bin (no python3). PARITY_AWK=/bin/true fails it, "exit Some(2)" plus the ENV line. MUTANT: the pre-fix script (225b2a9ab) on the python-free PATH fails the new test with "exit Some(3)" and the UNMEASURED line, so the exit-3 acceptance is gone. bashrs lint 0 errors; check_shell_lint_ratchet.sh PASS (ratcheted); cargo fmt --all -- --check rc 0. Not in scope: #3697 (the other guards that need python3), which is the next row in this lane.'
