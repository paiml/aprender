  acceptance_criteria:
  - '.github/workflows/book-contracts.yml: the three `Swatinem/rust-cache@v2` steps (jobs chapter-examples-compile, chapter-examples-run, book-integration-tests — all `[self-hosted, Linux, X64, clean-room]`), each with `workspaces: "."` and `cache-bin: "false"`, are DELETED. `grep -c "uses: Swatinem/rust-cache"` goes 3 → 0'
  - 'each is replaced by a comment naming the mechanism rather than the old mitigation: cache-bin skips cleanBin alone, the save step also runs cleanRegistry unconditionally and deletes ${CARGO_HOME}/registry/src, and only a job-private CARGO_HOME would make the action safe (--target-dir, --root and a fresh $HOME do not, since cargo reads sources from $CARGO_HOME whatever the target dir is)'
  - 'each comment states in those words that THE CI-REAPER IS NOT THE ONLY CAUSE OF THAT MESSAGE — aprender#2822 attributes it to the reaper; in the measured case the reaper had last run 27 minutes earlier and its next run logged swept=0 — and names the two commands that check the clock (`journalctl -u ci-reaper.service`, and a grep for `Post Run Swatinem/rust-cache` over the runners'' _diag/Worker_*.log)'
  - 'measured: paiml/infra main''s machines/clean-room/shared-home-guard/check.sh over the changed file prints no VIOLATION (it printed three before), and no other aprender workflow produces a BLOCK under that guard'
  - 'FOUR files change and two of them are structural, not scope creep. The two this row authors: `.github/workflows/book-contracts.yml` and this fragment (`docs/roadmaps/entries/PMAT-3539.yaml`). The two the repository requires alongside them: `docs/roadmaps/roadmap.yaml`, GENERATED by `make roadmap-aggregate` and impossible to omit when a fragment is added, and `docs/audits/quorum-PMAT-3539.json`, the committed quorum receipt. An earlier version said "exactly two files change" and quorum r1 correctly FAILED the diff against it, twice.'
  - 'THE INVARIANT, stated instead of a line count: **every deletion in this diff is inside `.github/workflows/book-contracts.yml`**, and the three doc files are purely additive. NO source, NO test, NO ci.yml. A round-4 lane refused an earlier version of this criterion for citing `+118/+21/+21` when the receipt had become 84 lines — correctly, and the lesson is that the number was UNCITABLE rather than merely wrong: `docs/audits/quorum-PMAT-3539.json` is REWRITTEN BY EACH QUORUM ROUND, so any criterion quoting its line count is false again the moment the next round runs. An acceptance criterion may not cite a measurement of an artifact the review process itself rewrites. The deletions-are-confined invariant is stable across rounds and is what the criterion was actually protecting.'
