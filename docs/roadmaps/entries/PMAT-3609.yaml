  notes: 'Taken by aprender-62, sequenced ahead by the cop (aprender-04). Two interpretation decisions, sent to the cop before implementation: (1) THE FIXTURE. The real Qwen3.5-0.8B header is 10.9 MB (248,320 tokens, 247,587 merges), too large to commit. The fixture is a header-only GGUF generated from the real file: every one of its 46 keys and every scalar value verbatim (eos 248046, padding 248055, model gpt2, pre qwen35, the chat template; no unknown_token_id and no bos key, exactly as in the real file), with only the three arrays (tokens, token_type, merges) cut to a leading slice. Qwen''s first 256 tokens are its byte-level glyphs, so the slice still covers every byte. The generator is committed next to it and records the source header''s sha256. (2) WHERE THE UNKNOWN TOKEN COMES FROM at the vocabulary-only constructors, which receive a Vec<String> and nothing else: the vocabulary''s own `<unk>` entry when it has one, otherwise none. Nothing is synthesised, and every model that loads today keeps its unknown token. Threading `tokenizer.ggml.unknown_token_id` through every loader is a filed follow-up, not a silent gap.

    The cop ruled both decisions YES on 2026-09-21. It also added a guard, verbatim: "When the glyph for a byte is ALSO absent, encode must refuse with an error naming the byte. It must never drop the input or emit nothing. Put a row for it in the case table (a vocab without that glyph and without unk → error). Absent means absent at encode time too." How it is met: `encode` returns an infallible Vec<u32> and has dozens of callers, so the refusal happens at CONSTRUCTION. With no unknown token, `BPETokenizer::new` refuses, naming the first byte that has neither a `<0xNN>` token nor a byte-level glyph token. `with_merges` also requires every glyph, because the merge path maps bytes to glyphs only. `encode` therefore cannot meet an unencodable byte, and the no-drop guarantee holds on every path. Case row: `no_unknown_token_and_a_byte_with_no_token_is_refused_by_name` (a 256-glyph vocabulary minus byte 0xA9''s glyph → error naming 0xA9). With the unknown token present, encode is unchanged: `<0xNN>`, then the unknown token. The glyph fallback applies only when there is no unknown token. Follow-up filed before the PR: #3675 (thread the DECLARED unknown token through every loader; by-name `vocabulary_unk_token` is the interim, and `apr serve`''s chat path already uses tokenizer.json''s declared `model.unk_token`). Found while testing, filed separately because it is independent of the unknown token: #3677 (the greedy path matches Latin-1 characters such as `é` as byte-level glyph tokens, so `é` decodes to U+FFFD). The Qwen round-trip rows therefore use ASCII, CJK and newline, not `é`. Same class but outside the query''s hits, so not in this PR: `apr showcase`''s pipeline substitutes token ids [1,2,3,4,5] when a model has no vocabulary (commands/showcase/pipeline.rs:165).

    Repo-layout facts a reviewer needs, each checked at the PR head (round 2 lane 1 misread all three, and every one is refuted by `cargo check -p apr-cli` rc=0 and `cargo test -p apr-cli --lib` 7283 passed at e5b2e7541). (1) `realizar` IS aprender-serve: crates/aprender-serve/Cargo.toml:42-43 is `[lib] name = "realizar"`, so `realizar::tokenizer::BPETokenizer` in apr-cli and `crate::tokenizer::BPETokenizer` in aprender-serve are the SAME type, and `realizar::tokenizer::vocabulary_unk_token` (the book, api-server.md) is the function this PR adds. (2) `no_vocabulary` in apr-cli is defined ONCE, at crates/apr-cli/src/commands/serve/handler_gpu_completion.rs:482, and is visible to every serve site because these files are one module: handlers.rs:1618 is `include!("handler_apr_cpu_completion.rs")`, handlers.rs:1619 is `include!("handler_gpu_completion.rs")`, and handler_apr_cpu_completion.rs:869 is `include!("handlers_include_01.rs")`. (3) aprender-serve''s cli has its own `no_vocabulary` (cli/mod_server_commands.rs:13, returning RealizarError), inside the same `mod server_commands` as its six call sites.'
