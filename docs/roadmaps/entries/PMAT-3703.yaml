  notes: 'Handed to aprender-62 by the cop after infra-c8 was redirected by the operator (#3703 was unstarted). #3702, filed a minute earlier for the same defect, was closed as a duplicate. THE FAILURE: v0.69.0 clean-room (paiml/infra run 35608872676, gx10-pool1, "Run clean-room gates") GATE B2: aprender-verify-ml data::pipeline::tests::test_pipeline_generate_small, "assertion failed: stats.generation_time_ms > 0 || stats.total_generated < 10". `generation_time_ms` is `elapsed.as_millis() as u64` and the test asks for count(10), so a host that generates 10 programs in under 1 ms reads 0. It did not reproduce on lambda''s debug build (0/40 runs failed there), which is why PR CI and the merge group were green. DONE_WHEN 1: the timing clause is replaced by what generate() promises, `assert_eq!(stats.total_generated, programs.len())`, which holds by construction (`total_generated: all_programs.len()`). No clock is asserted. DONE_WHEN 3, measured: with the generator made instantaneous (`generation_time_ms` forced to 0), the fixed test PASSES ("1 passed"), and the OLD clause under the same mutant FAILS with exactly the clean-room message, "assertion failed: stats.generation_time_ms > 0 || stats.total_generated < 10". So #3703 reproduces deterministically on any host. DONE_WHEN 2, the sweep. Scope: every `crates/*/src/**.rs` (the `--lib` surface). The #3703 shape is an INTEGER duration (`.as_millis()`, `.as_micros()`, `.as_secs()`, or a name ending _ms/_us/_secs) asserted `> 0`, `>= 1` or `!= 0`, which truncates to 0 on a fast host. A float `> 0.0` on `as_secs_f64()` does not truncate. 104 hits. FIXED, 3, each a measured duration with nothing guaranteeing it is positive: pipeline.rs:438 (above), aprender-orchestrate bug_hunter/tests_patterns.rs `hunt_result.duration_ms > 0` (dropped; result.is_ok() and the parsed claims already prove the hunt ran) and aprender-train finetune/instruct_trainer.rs `result.total_time_ms > 0` (dropped; the epoch count is asserted). LISTED WITH ITS REASON, 101, in the new scripts/wallclock_assert_baseline.txt, each line read and classified: 76 declared render budgets (`budget()` returns BrickBudget::uniform(16) and similar; constants), 9 configured values (timeouts, windows, intervals, chunk sizes, options), 7 epoch timestamps (`timestamp_ms` from SystemTime), 1 cost-model estimate, 4 fixture inputs (health_tests Duration::from_millis(100), process_tracer from_micros(100), stats u64::MAX/2, format_chat latency_us=5000), and 4 real measurements taken AFTER a sleep of at least the truncation unit (cache/tests.rs sleeps 2 ms; falsification/types.rs sleeps 1 ms; brick_tracer sleeps 10 us and 100 us). THE GUARD: check_no_timing_in_required.sh PART 4 scans with that pattern (comment lines excluded by the same matcher) and ships a 15-row case table (7 must-match, including the exact pipeline line; 8 must-not-match, including `> 0.0`, `as_secs_f64() > 0.0`, `>= 10`, a comment, and a name that only contains `_ms`). A pattern that disagrees with its table is refused before any scan result is trusted. THE LEDGER IS KEYED ON THE ASSERTION TEXT, not on `path:line`: each line is `<trimmed assertion text><TAB><occurrences across crates/*/src>`, so the 101 hits are 32 recorded texts. A coordinate key was the first version (handed over at 0221c7c1b) and was measured to be a trap. With the ledger at a comparand (BASELINE_RATCHET_BASE_REF=HEAD), one unrelated comment line inserted at the top of widgets/border.rs made PART 4 report border.rs:755 NEW and :754 stale. Re-pointing the entry, which is the remedy it printed, was then REFUSED by the set-aperture ratchet ("the owning guard is unchanged in this diff"), so any unrelated edit above any of the 101 lines in ~50 files would have turned guard-tree red with no in-branch fix. The ratchet is now `keyed` (classified in check_baseline_ratchets.sh): no text may appear and no count may rise. PART 4 fails on NEW (a text the tree holds more often than recorded, so a COPY of a recorded line fails too), on STALE (a recorded count above the tree''s: lower it in the commit that fixed the line, which the ratchet allows), on a malformed ledger line, and on a scan of 0 files. GUARD MUTANTS, measured on this tree with BASELINE_RATCHET_BASE_REF=HEAD: M0 unmutated rc 0; M1 the #3703 line restored rc 1 (NEW, pipeline.rs:442); M2 the trap above, an unrelated insertion over a recorded line, rc 0; M3 a copy of `assert!(budget.total_ms > 0);` added in a new place rc 1 (count rises); M4 every data line removed from the ledger with the hits still in the tree rc 1; M5 a recorded count raised rc 1 (stale, and the ratchet reports RAISED); M6 a new key appended rc 1 (NEW KEY); M7 a malformed ledger line rc 1; M8 the `_ms` alternative dropped from the pattern rc 1 (4 case-table rows flip, scan not trusted); M9 the scan made to answer 0 files rc 1; M10 M4 under `NR == FNR` instead of `FILENAME == ARGV[1]` rc 0. M10 is the proof that the awk file test is load-bearing: with an emptied ledger `NR == FNR` reads every hit as a recorded entry and passes them all, so the guard uses FILENAME. ONE MORE HIT, OUTSIDE THE INTEGER SHAPE AND FIXED: aprender-train monitor/inference/tests/inference_monitor_tests.rs test_monotonic_ns_non_zero asserted `monotonic_ns() > 0` where monotonic_ns() is `START.get_or_init(Instant::now).elapsed().as_nanos()`. When that test is the first caller in the process, the call initializes the epoch and reads the gap between two back-to-back clock reads, which is 0 on a coarse timer. Its sleep ran BEFORE that first call, so it guarded nothing. The test now initializes, sleeps 1 us, and asserts the second read is greater than the first; the sleep, not host speed, carries the assertion. bashrs on the guard: 0 errors (the shell lint ratchet counts errors). The added warnings are the parser reading awk array syntax, `$''\t''` and `[![:space:]]` as shell. OUT OF THIS ROW, and stated rather than stretched: the SLOW-host twin, an upper bound on elapsed time (`elapsed < N`), with 59 candidate lines in the same sweep, is filed as #3705 (0.70). done_when 2''s "`Instant`-based assertions" reads that class in; this row covers the fast-host truncation class that failed the release, and a reviewer should judge #3705 as the named remainder.'
