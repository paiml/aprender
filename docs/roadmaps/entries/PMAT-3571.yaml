  notes: 'ACCEPTANCE (hand-entered from gh#3571 done_when; see paiml-mcp-agent-toolkit#1414). Layer 1 of a surface no test had ever traversed: apr serve could not load the flagship architecture at all, and each assumption was visible only once the one above it cleared. Done when: handler_gpu_completion.rs branches on is_qwen35 and calls Qwen35Model::create_base_model rather than falling through to the dense OwnedQuantizedModel path, which is the wrong architecture for a Gated DeltaNet hybrid. Scope is deliberately ONE LAYER: land what works rather than hold the whole stack behind the last unknown. STOP: do not claim the serve path is end-to-end green on Qwen3.5 from this row alone — the layers above it are separate rows.

    UNIT (1), the zero-layer refusal (aprender-c7). Measured on #3571 (issuecomment-5763718338) at release/0.70-batch-1 262dfb2f6, which has the <unk> fix of #3678: the qwen35 base reached the dense servers with 0 layers — CPU route HTTP 200, content "", 1024 tokens of "\n" in 6.0 s; GPU route HTTP 500. On main it stops earlier at the <unk> refusal, so this unit is what keeps main honest when batch-1 lands. THE CHECK: `zero_layer_refusal(arch, layers)` (pure; ModelLoadFailed, exit 6, naming the arch, the 0 and #3571; the apr run/apr chat hint only for qwen35) inside `build_serve_model`, the one GGUF loader of apr serve. EVERY apr serve LOAD ENTRY POINT (condition a): [1] GGUF --gpu, [2] GGUF --gpu --batch, [3] GGUF CPU — all three take the model of start_gguf_server from build_serve_model BEFORE the route is chosen: GUARDED. [4] GGUF --backend wgpu (try_start_wgpu_backend) built its own model with OwnedQuantizedModel::from_mapped; it now loads through build_serve_model: GUARDED (one loader, one check, for all four GGUF routes). [5] APR CPU (AprTransformer::from_apr_file), [6] SafeTensors single-file and [7] sharded (SafetensorsToAprConverter::convert / convert_sharded): GUARDED where the transformer is in hand, same helper on t.config.num_layers. [8] APR GPU (start_apr_q4k_server_gpu pool path, generic AprV2ModelCuda) and [9] SafeTensors GPU (SafeTensorsCudaModel): NOT guarded in this unit, and NOT verified: their layer count comes from the metadata the file declares, so a zero-layer model reaches them only from a file that declares 0 layers — whether the uploaders refuse such a file was not read. Named as open, not claimed covered; a follow-up row. [10] aprender-serve cli (serve_model / prepare_serve_state): UNREACHABLE from apr — `git grep realizar::cli:: crates/apr-cli` has no hit — and it builds the GGUF model with from_mapped, which refuses the qwen35 hybrid by name, so it has no zero-layer source. CONDITION (b): on main this refuses qwen35 serve outright (correct until unit 2). Unit 2 (branch PMAT-3571-serve-qwen35-session) returns to the resident Qwen35Session BEFORE build_serve_model is called and adds the row proving qwen35 serve passes. TESTS: zero_layers_is_refused_by_name_and_any_layer_is_admitted (the case table: qwen35/0 and llama/0 refused, 1/28/24 admitted); serve_refuses_the_qwen35_base_at_load (real Qwen3.5-0.8B through build_serve_model; SKIPs where the file is absent — lambda/gx10 carry it, CI does not). MUTANT: deleting the check in build_serve_model turns serve_refuses_the_qwen35_base_at_load RED ("a 0-layer stack reached the serve routes"), measured.'
