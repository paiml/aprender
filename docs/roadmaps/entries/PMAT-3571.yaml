  notes: 'ACCEPTANCE (hand-entered from gh#3571 done_when; see paiml-mcp-agent-toolkit#1414). Layer 1 of a surface no test had ever traversed: apr serve could not load the flagship architecture at all, and each assumption was visible only once the one above it cleared. Done when: handler_gpu_completion.rs branches on is_qwen35 and calls Qwen35Model::create_base_model rather than falling through to the dense OwnedQuantizedModel path, which is the wrong architecture for a Gated DeltaNet hybrid. Scope is deliberately ONE LAYER: land what works rather than hold the whole stack behind the last unknown. STOP: do not claim the serve path is end-to-end green on Qwen3.5 from this row alone — the layers above it are separate rows.

    UNIT (1), the zero-layer refusal (aprender-c7). Measured on #3571 (issuecomment-5763718338) at release/0.70-batch-1 262dfb2f6, which has the <unk> fix of #3678: the qwen35 base reached the dense servers with 0 layers — CPU route HTTP 200, content "", 1024 tokens of "\n" in 6.0 s; GPU route HTTP 500. On main it stops earlier at the <unk> refusal, so this unit is what keeps main honest when batch-1 lands. THE CHECK: `zero_layer_refusal(arch, layers)` (pure; ModelLoadFailed, exit 6, naming the arch, the 0 and #3571; the apr run/apr chat hint only for qwen35) inside `build_serve_model`, the one GGUF loader of apr serve. EVERY apr serve LOAD ENTRY POINT (condition a) — found by sweeping crates/apr-cli/src/commands/serve for from_mapped / from_apr / from_apr_file / SafetensorsToAprConverter / spawn_apr_q4k_inference_thread; ALL GUARDED: [1] GGUF --gpu, [2] GGUF --gpu --batch, [3] GGUF CPU — start_gguf_server takes its model from build_serve_model BEFORE the route is chosen. [4] GGUF --backend wgpu (try_start_wgpu_backend) and [5] the CPU fallback start_gguf_server_cuda rebuilds when CUDA init fails — both built their own with from_mapped; both now load through build_serve_model (one GGUF loader, one check). [6] APR CPU transformer (AprTransformer::from_apr_file), [7] SafeTensors single-file and [8] sharded (SafetensorsToAprConverter::convert / convert_sharded): the helper on t.config.num_layers where the transformer is in hand. [9] APR GPU (start_apr_server_gpu), [10] APR CPU quantized (try_apr_quantized_cpu), [11] SafeTensors GPU (start_safetensors_server_gpu), [12] SafeTensors CPU quantized (start_safetensors_server_cpu_quantized): the helper on the OwnedQuantizedModel before its Model ready line. [13] APR Q4K pool GPU (start_apr_q4k_server_gpu) parses its layer count on the scheduler thread after the upload begins, so the count the file DECLARES is read first (AprV2Model::load is mmap-based) and 0 is refused before the spawn; a file declaring none is refused by name inside the pool path (parse_apr_q4k_config: APR metadata missing num_layers). [14] aprender-serve cli (serve_model / prepare_serve_state): UNREACHABLE from apr — `git grep realizar::cli:: -- crates/apr-cli/src` has no hit — and it builds GGUF models with from_mapped, which refuses the qwen35 hybrid by name. REPO-LAYOUT FACTS a reviewer needs (round 1 lanes 1-3 misread them as compile errors; each checked at the head): handlers.rs:1642 is `include!("handler_gpu_completion.rs")`, handlers.rs:1643 `include!("server.rs")`, and handler_apr_cpu_completion.rs:869 `include!("handlers_include_01.rs")` — so build_serve_model and zero_layer_refusal, defined in handler_gpu_completion.rs, ARE items of the `handlers` module, callable unqualified from handlers.rs and handlers_include_01.rs, and reachable from the sibling module as `super::handlers::zero_layer_refusal` (pub(super)). Proof it compiles: `cargo test -p apr-cli --lib --features cuda zero_layer_refusal` builds apr-cli and passes both tests. CONDITION (b): on main this refuses qwen35 serve outright (correct until unit 2). Unit 2 (branch PMAT-3571-serve-qwen35-session) returns to the resident Qwen35Session BEFORE build_serve_model is called and adds the row proving qwen35 serve passes. TESTS: zero_layers_is_refused_by_name_and_any_layer_is_admitted (the case table: qwen35/0 and llama/0 refused, 1/28/24 admitted); serve_refuses_the_qwen35_base_at_load (real Qwen3.5-0.8B through build_serve_model; SKIPs where the file is absent — lambda/gx10 carry it, CI does not). MUTANT: deleting the check in build_serve_model turns serve_refuses_the_qwen35_base_at_load RED ("a 0-layer stack reached the serve routes"), measured.

    UNIT (2), the hybrid route (aprender-c7), stacked on #3595 (Qwen35Session) and on unit (1). apr serve routes a hybrid GGUF to start_qwen35_server BEFORE build_serve_model, so the zero-layer refusal never sees the hybrid base (condition b); the row qwen35_serve_passes_the_zero_layer_refusal_through_its_session proves it on the real file (hybrid branch taken; build_serve_model refuses the base naming #3571; the hybrid state serves every layer from the session). realizar: AppState::with_qwen35_session holds the resident session and deliberately NO quantized_model, so no dense endpoint can decode through the base (a_dense_endpoint_no_longer_decodes_through_the_zero_layer_base: /v1/completions is no longer HTTP 200). /v1/chat/completions tries the hybrid first (try_qwen35_backend): the template is the one the MODEL''s architecture selects (format_messages -> detect_format_from_name), encoded with the GGUF''s own tokenizer so serve hands the model the tokens apr run and apr chat do; the session runs on the blocking pool, one request at a time, a request extending the previous one''s tokens reuses its state; the declared context length sits beside the mutex so an over-context prompt is a 400 naming both numbers without waiting on a running generation; a reply the context cut short is finish_reason length. TESTS (real Qwen3.5-0.8B; SKIP where absent): a_chat_request_answers_what_apr_run_answers and a_streamed_chat_request_answers_what_apr_run_answers (byte-equal to the one-shot run_qwen35_generate_dispatch on the same route), a_dense_endpoint_no_longer_decodes_through_the_zero_layer_base, a_prompt_past_the_declared_context_is_a_400_naming_both_numbers, gpu_a_chat_request_answers_from_the_gpu_session (and stays on the GPU — this test found the cross-thread CUDA_ERROR_INVALID_CONTEXT fixed in #3595 5d372ca7e). OUT OF SCOPE here: the apr serve ladder rung and its positive control (issue acceptance 3 and 4) live in scripts/model_ladder.sh / contracts/model-capability-ladder-v1.yaml, owned by aprender-62 under #3712 — handed over, not edited here; so this unit says Refs #3571, not Closes. The thinking toggle is #3723 (aprender-fd); the startup line reports the DEFAULT template. CI ROW FOR THE CALL SITE (cop, non-blocking): serve_refuses_a_synthetic_zero_layer_hybrid_base_at_load writes a synthetic qwen35 header with aprender-core''s GGUF writer (config declares one block; only token_embd, output_norm and output tensors) and needs no model file; the call-site mutant (check deleted from build_serve_model) turns it RED — measured. It has to be the hybrid: the dense loader already refuses block_count 0 at config validation ("Invalid shape: num_layers must be > 0", measured with a llama fixture), so the hybrid base — config declares N, layers empty — is the one zero-layer stack this tree can build. STARTUP LINE (f8, #3719): `chat template: <what the shared selection picked> (thinking off|on|the model''s choice)`, the mode read off the RENDERED assistant prefix (closed </think> = off, open <think> = on), never off a template name — #3755 replaces the template qwen35 selects today and the line then reports the new one with no edit here.'
