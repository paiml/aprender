  notes: '0.69.1 row, filed by aprender-37 as #3785''s done_when 2 (root cause) and proposed to the cop, aprender-04. Stacked on PMAT-3785. FINDING. With the #3672 single chat template (main a9502d992) plus PMAT-3727/3728/3759/3785, `apr run qwen2.5-coder-7b-instruct-q4_k_m.gguf --prompt "What is the capital of France? Answer briefly." --chat --gpu` on lambda (RTX 4090, cc 89, the DEFAULT batched FP8 path) encoded the same 18 tokens as #3751''s dense-F2 harness. It printed "GPU output diverges from CPU at position 1 (argmax 198 != 198, cosine 0.8134)" and exited 14 on CPU; with `FP8_PREFILL=0` it ran on the GPU. The gx10 `FP8_PREFILL=1 BATCHED_PREFILL=1` pos-1 0.872 (#3785) is the same fingerprint, so this is not sm_121-specific. MECHANISM. `cublas_prefill_fp8_gemm` scaled the whole [m x k] activation batch by ONE 448/absmax, and all three E4M3 converters (`f32_to_e4m3`, `_scaled`, `_device_scaled`) sent a biased exponent < 1 to zero, i.e. flushed subnormals. The down-projection inputs carry massive-activation outliers (7b: absmax 871 at layer 27, 352 at 26, 94 at 3), so every activation below absmax x 3.5e-5, up to 12.4% of a layer''s inputs, was zeroed on every token. A float64 emulation of that exact recipe (GGUF weights via `gguf.quants.dequantize`, per-tensor E4M3, FTZ, BF16 D) tracks the real GPU on 10 of 12 model x prompt rows, including both real REJECTs at the same positions (7b pos 1: 0.794 vs 0.813; qwen2.5-1.5b pos 11: 0.951 + argmax flip vs 0.949 + flip). REJECTED ALTERNATIVES (measured). FP8 prefill default OFF: the FP16 weight cache has no VRAM budget (7b: 13.5 GB vs 6.7 GB FP8); `apr serve --context-length 32768` then OOMs its FP16 warmup and a 1931-token prompt fails with CUDA_ERROR_OUT_OF_MEMORY, while FP8 serves it in 219 ms. Dropping the retry floor ALONE: the FP16 re-measure cached FP16 weights on top of the resident FP8 cache (~25 GB for the 7b on a 24 GB card). CHANGE, commit 1 (the recipe). New `cuda/executor/layers/cublas_prefill/fp8_recipe.rs`: `fp8_absmax_rows` (one 256-thread block per row, shared-memory tree), `fp8_quantize_rows` (per-row scale 448/absmax[row]; round to nearest even; saturates at 448 = 0x7E; below 2^-6 encodes the subnormal rne(|x| x 512) x 2^-9, where q = 8 is exactly the smallest normal''s code 0x08), `fp8_dequant_outer` (Y[t, c] = D[t, c] x act_absmax[t]/448 x w_absmax[c]/448) and `fp8_quantize_weight`. `get_or_cache_fp8_weight` stores a per-output-channel absmax vector (`fp8_weight_row_absmax`); `cublas_prefill_fp8_gemm` keeps a per-token absmax buffer (`fp8_act_row_absmax`, reused by PMAT-084''s K/V and up hits, and growing it invalidates the held activation), runs the GEMM with alpha 1, and applies both outer scales in the BF16 to F32 widening. D stays BF16 (#3728); it is now at most 448^2 x k. The per-tensor helpers (`absmax_reduce`, the three flushing converters, `bf16_to_f32_act_scaled`, `gpu_absmax`, `gpu_absmax_device`) are deleted, so nothing can reach the flushing encoder again. #3728''s range row now inserts a per-channel absmax vector instead of the per-tensor alpha. Commit 2 (the gate). The #3413 C FP16 retry skipped misses below F2_CATASTROPHIC_COSINE (0.90) on the premise that a second measurement cannot turn orthogonal logits into parity, but the retry switches the precision; it is not a second sample. With commit 1 alone, qwen2.5-coder-0.5b chat-zorblat measured 0.894 under FP8 and would have gone to CPU, while FP16 passes it. `f2_should_retry_without_fp8` now retries ANY FP8-batched miss, and `f2_remeasure_without_fp8` frees the FP8 weight cache first (FP8 stays off for that model afterwards). A defect outside FP8 still fails the FP16 re-measure and still rejects; no floor moved. F2_CATASTROPHIC_COSINE becomes test-only. HOW EACH done_when IS MET. (1) New `fp8_recipe_tests_3807.rs`. Quantizer row: every finite E4M3 value, every midpoint (ties), values just off each midpoint, saturation (450, 463.9, 500, 1e6) and sub-2^-10 values, all negated too, against a CPU nearest-with-ties-to-even reference; at least 40 are non-zero subnormal cases. Outlier row: 16 tokens x 256, token 0 carrying 871, the others at 0.01; 64 channels, channel 3 carrying an 8.0 outlier and channel 7 scaled by 3e-5; the weight goes through `fp8_quantize_weight`, the GEMM through `cublas_prefill_fp8_gemm`; the per-token relative L2 error must stay below 8% and the per-channel error (tokens 1..16) below 20%. MUTANTS, each built and run on the GPU: M1 (subnormals flushed in `fp8_quantize_rows`): quantizer row RED ("x=9.785156e-4: got 0x00, want 0x01", …). M2 (one activation scale per batch): outlier row RED, token 1 at 25.26%, channel 14 at 47.59%. M3 (one weight scale per tensor): outlier row RED, channel 7 at 55.11%. The correct recipe: token 4.65%, channel 8.07%, quantizer exact. Commit 2''s mutant (floor restored): `a_deep_fp8_miss_is_retried_on_fp16` RED. (2) PARTLY MET, stated as measured. The harness judges the FP8 logits WITHOUT the production FP16 retry. Lambda, combined tree (eb 5d909dda6 + this stack + commit 1), FP8 on, 12 rows: coder-7b 3/3 ACCEPT (chat-france 0.9977, was REJECT 0.813); coder-1.5b 3/3 ACCEPT; coder-0.5b 2/3 (chat-zorblat REJECT at pos 21, 0.894, argmax equal; was ACCEPT 0.9945 before commit 1); qwen2.5-1.5b 1/3 (chat-france REJECT at pos 11, 0.937, was already REJECT 0.949; chat-zorblat REJECT at pos 23, 0.976 with argmax flip, was ACCEPT 0.958). So "all ACCEPT with FP8 on" is NOT met: on Qwen2.5 at 1.5B and below, E4M3 sits at the F2 gate''s edge under every scaling recipe tried (the emulator''s 12/12 prediction for this recipe did not hold on the small models, which move chaotically between rows). What production does with those rows is commit 2''s measurement below: all 8 prompt cells run on the GPU. gx10 (sm_121), binary 084008f34 (commit 1), coder-7b `FP8_PREFILL=1 BATCHED_PREFILL=1`: trace "FP8 (E4M3)", batched, no retry note, no divergence, `Backend: GPU`, "The capital of France is Paris.", rc 0 (under #3785 this cell was pos 1 0.872, rc 14). coder-1.5b the same. (3) Lambda, binary `apr 0.69.0 (0c907e883)` (main a9502d992 + this stack + both commits), coder-7b chat-france: trace "FP8 (E4M3) (cc=89 …)", no retry note, no divergence, `Backend: GPU`, "The capital of France is Paris.", rc 0. (4) `apr serve` timings.prompt_ms, coder-7b, 499-token prompt, 4 warm requests: 45.8 / 46.2 / 47.7 / 49.8 ms (before: 44.5 to 49.3). PRODUCTION MATRIX, commit 2, same binary, `apr run --chat --gpu`, 4 models x {chat-france, chat-zorblat}: 8/8 rc 0, `Backend: GPU`, correct answers (Paris / Lima). coder-7b and coder-1.5b: FP8 accepted, no retry. coder-0.5b chat-france: FP8 accepted. coder-0.5b chat-zorblat: FP8 0.8938 → "re-measuring on the FP16 prefill path" → "[PMAT-053] Cleared FP8 weight cache: 24 matrices (99.8 MB freed)" → FP16 0.9686 → GPU. qwen2.5-1.5b chat-france: 0.9374 → FP16 0.9941 → GPU; chat-zorblat: 0.9639 → FP16 0.9970 → GPU. GATES: `cargo test -p aprender-serve --features cuda --lib` rows `cublas_prefill` 3 passed (both #3807 rows and #3728''s), `fp8_activation_cache` 7 passed, `pmat3477_f2_fp8_retry_tests` 4 passed, `pmat919` 8 passed; `cargo clippy -p aprender-serve --lib --features cuda -- -D warnings` rc 0 (verbose run shows clippy-driver on `realizar`); `cargo fmt --all -- --check` clean. NOT DONE / LEFT. done_when 2''s harness clause, see (2); a VRAM-driven precision policy (FP16 when its cache fits, FP8 only when it does not) would move the small models off E4M3 entirely, and is a separate row if the cop wants the harness clause. Re-enabling FP8 on cc >= 100 by default is #3785''s policy change, gated on the gx10 cell above, not in this row. STOP LIST: no change to which GEMM path a model takes, to #3785''s policy, to any F2 floor, or to CI workflows.'
