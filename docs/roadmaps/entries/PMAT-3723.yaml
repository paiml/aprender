  notes: 'Epic #3710 (0.69.1). Operator, verbatim: "our verbs are dogfooded, i.e chat with and without thinking, ditto run, ditto code, etc,". Built with #3755 on one branch (PMAT-3723-thinking-derived). DESIGN (one seam for #3723 and #3755): realizar renders the model file''s OWN tokenizer.chat_template (EmbeddedChatTemplate::for_model_file: GGUF metadata, a sibling tokenizer_config.json for SafeTensors, APR metadata) with minijinja in HF''s environment (trim_blocks, lstrip_blocks, minijinja-contrib pycompat, loop_controls, raise_exception, strftime_now, a Python-json.dumps tojson). format_chat_prompt(embedded, model_name, messages, thinking) -> ChatPrompt {text, thinking} is the single production entry point for run, chat, serve, code and the golden gate. A hand-coded template is the fallback only for a file that carries no template. Thinking modes are DERIVED by rendering: render(on) != render(off) => Both; a render that leaves <think> open => OnOnly; otherwise OffOnly. resolve(None) = OFF where the template allows it, the model''s only mode otherwise. SURFACES: `--thinking on|off` on apr run, apr chat and apr code (ThinkingArg, in --help); unset = OFF where allowed. serve: per-request chat_template_kwargs.enable_thinking (deny_unknown_fields) or top-level enable_thinking; two spellings that disagree are HTTP 422. REFUSAL: ON (or OFF) on a template without that mode is RealizarError::ThinkingModeUnsupported, named with the modes the template has (''on and off'' / ''on only'' / ''off only''): apr exit 15, serve HTTP 422. Never silently ignored. REASONING: ChatPrompt::split / split_completion keep the think block out of the answer: apr run --json gains `thinking` and `reasoning`, text output prints ''Reasoning:'', serve sets message.reasoning_content and, streaming, delta.reasoning_content (ReasoningRouter). A block still open at the budget is an error naming it (''think block unclosed within the N-token budget''): apr run exit 8 (InferenceFailed, #3720 think_block_unclosed), serve HTTP 422, never an empty answer. apr code passes the mode to RealizarDriver (prompt_for) and to AprServeDriver (chat_template_kwargs). apr chat''s REPL uses the same render (select_chat_template, render_embedded, resolve_thinking, split_response). MUTANT: M2 (ON silently mapped to OFF in resolve) goes RED in the thinking-mode tests. Tests: chat-template, serve api/infer, apr-cli (7306 pass; the one failure under full parallel load is a 5 s python-subprocess timeout in eval::inference, which passes alone and is untouched by this branch), orchestrate agent 885. HARDWARE (apr 0.69.0 1cf2e94ec, --features cuda, each host''s own build, gpu-q prio 1). Case rows: verb (run/chat/code/serve) x {on, off, unset}, plus serve''s top-level spelling, conflict -> 422, 1-token budget -> 422, and streamed reasoning_content, on Qwen3.5-4B + Qwen3-8B (thinking-capable) and qwen2.5-coder-1.5b (not). lambda RTX 4090: 45 PASS / 0 FAIL / 6 BLOCKED of 51. gx10 GB10: 45 PASS / 0 FAIL / 6 BLOCKED of 51. The 6 BLOCKED per host are Qwen3.5 on `apr serve --gpu` (HTTP 500 "generate_gpu_resident_streaming ... not supported", on main, c7''s #3571), measured at the fold. Refusals: qwen2.5 --thinking on gives exit 15 in run, chat and code, and HTTP 422 in serve. Qwen3-8B serve ON has reasoning_content present and streamed, answer "4". The 4B `apr code --thinking on` cell that failed at 5848a3a65 passes at 1cf2e94ec in 63 tokens: RealizarDriver had wrapped the rendered prompt in the template a second time (pre-existing on main; fixed via raw_prompt). SEAMS: #3755 (the template is the model''s own) same branch; #3720 (the response contract) consumes split_completion; #3724 (golden in both modes) inherits format_chat_prompt; #3711''s case rows kept at fold.'
