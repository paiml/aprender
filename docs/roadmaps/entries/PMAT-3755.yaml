  acceptance_criteria:
  - 'Issue #3755 done_when 1, verbatim: "**Derived, not typed.** Qwen3/Qwen3.5 prompts, thinking ON and OFF, are produced by rendering the model''s embedded `tokenizer.chat_template` (minijinja, `enable_thinking` true/false, `add_generation_prompt`). No hand-typed scaffold string remains for these families."'
  - 'Issue #3755 done_when 2, verbatim: "**Byte-equality oracle.** For every Qwen3/Qwen3.5 GGUF in the host inventory × {thinking on, off} × a fixed message set, apr''s formatted prompt is byte-identical to the reference rendering of the same embedded template: llama.cpp''s `--jinja` rendering, or HF''s `apply_chat_template`, pinned. The test is RED at 0.69.0."'
  - 'Issue #3755 done_when 3, verbatim: "**The contract asserts the derivation, not a literal.** `chat-template-v1.yaml:98,:248-249` are replaced by "equals the rendering of the embedded template". A mutant restoring the single-newline literal goes RED."'
  - 'Issue #3755 done_when 4, verbatim: "**Siblings.** Every other hand-coded template in `crates/aprender-serve/src/chat_template_*.rs` (llama2, alpaca, the prop format, …) is listed. Each one either renders the model''s embedded template or has the same byte-equality test against it for every inventory model of that family."'
  - 'Issue #3755 done_when 5, verbatim: "**prompt_tokens parity** (added 2026-09-21 at aprender-04''s request, from aprender-3e''s measurement: apr at canonical + 11, llama.cpp at canonical + 8): for the same messages and explicit thinking mode, apr''s `prompt_tokens` == llama.cpp `--jinja` (pinned d1d3c3396). Where llama.cpp''s own jinja differs from HF (thinking unset: llama-server defaults `enable_thinking=true`, while HF and the model''s template default OFF), that is stated on this issue, not silently picked."'
  - 'Issue #3755 done_when 6, verbatim: "Re-measured: 0.8B golden 3/3 on intel CPU and on lambda/gx10 CUDA with the fixed binary (version + sha cited)."'
  - 'aprender-04 approval conditions, verbatim: "(1) Resource limits. GGUFs come from the internet (Alfredo downloads them), so an embedded jinja template is untrusted input. Set minijinja fuel (or an equivalent step/recursion limit) and an output-size cap. A template that exceeds them is REFUSED by name, never hangs. Add a case row: a hostile template (infinite loop / huge output) → refusal. (2) The release comparator too. CRUX compares against llama.cpp `--jinja` (minja), not HF. Add llama.cpp''s rendering (or its prompt-token ids from `llama-cli --jinja --verbose-prompt`, pinned d1d3c3396) for at least the qwen35, qwen3 and qwen2 templates. Where minja and HF disagree, name it rather than silently picking one. (3) `minijinja-contrib 2.21` is a new dep: `cargo deny check` (licenses/advisories/bans/sources) green, noted in the fragment. (4) Dogfood §14 row 2 (#3768): the byte-equality check over the REAL inventory runs as a pre-publish dogfood gate, listed in Cargo.toml''s dogfood gates, not only a lib test on fixtures."'
