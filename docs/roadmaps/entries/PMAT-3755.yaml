  notes: 'Epic #3710 (0.69.1). Measured by aprender-a8 with pinned llama.cpp d1d3c3396: apr''s hand-typed `<think>\n</think>\n` makes Qwen3.5-0.8B answer 2+2="2"; the official `<think>\n\n</think>\n\n` answers "4". DESIGN (one seam for #3723 and #3755): realizar renders the model file''s OWN tokenizer.chat_template (EmbeddedChatTemplate::for_model_file: GGUF metadata, a sibling tokenizer_config.json for SafeTensors, APR metadata) with minijinja in HF''s environment (trim_blocks, lstrip_blocks, minijinja-contrib pycompat, loop_controls, raise_exception, strftime_now, a Python-json.dumps tojson). format_chat_prompt(embedded, model_name, messages, thinking) -> ChatPrompt {text, thinking} is the single production entry point for run, chat, serve, code and the golden gate. A hand-coded template is the fallback only for a file that carries no template. Thinking modes are DERIVED by rendering: render(on) != render(off) => Both; a render that leaves <think> open => OnOnly; otherwise OffOnly. resolve(None) = OFF where the template allows it, the model''s only mode otherwise. DERIVED, NOT TYPED: chat_template_qwen3_nothink.rs is deleted; detect_format_from_name no longer returns Qwen3NoThink (TemplateFormat::Qwen3NoThink survives as a documented legacy variant that creates ChatML). ORACLE (lib test chat_template_embedded_oracle on committed fixtures, crates/aprender-serve/tests/fixtures/chat_templates, regenerated by scripts/render_chat_template_reference.py): the 21 GGUFs of lambda''s inventory carry 9 distinct templates (qwen35 x2, qwen3 x3, qwen3moe x2, qwen2 x2). 3 message sets x thinking {on, off, unset}: 81/81 renderings byte-equal to transformers 5.3.0 render_jinja_template (the function apply_chat_template calls). CONDITION 2, llama.cpp d1d3c3396 /apply-template (--jinja, minja): 54/54 explicit on/off renderings byte-equal to apr. The 3 disagreements are named in the test and in llama_reference.json: 7f0e529032c2/{single,system,multi}/unset, because llama-server passes enable_thinking=true when the request says nothing, while HF leaves it undefined and the Qwen3.5 template''s own default is OFF. CONTRACT: contracts/realizar/chat-template-v1.yaml v2.0.0 asserts equality with the embedded rendering (equations embedded_selection, thinking_modes_derivation, reasoning_split, untrusted_limits; FALSIFY-CT-001..008); apr-serve-v1.yaml SRV-005/007, INV-005 and KANI-SRV-010 are restated in derived form. pv validate and pv lint pass. MUTANT M1 (restore the hand-typed scaffold) goes RED. SIBLINGS (done_when 4), the hand-coded formats that remain: ChatML, Llama2 (chat_template_llama2.rs), Zephyr, Mistral, Alpaca (chat_template_alpaca_format.rs), Phi, Custom/prop format (chat_template_prop_format.rs), Raw. Each is now ONLY the fallback for a file with no tokenizer.chat_template. A model of any family that ships a template renders its own, so the byte-equality oracle covers every inventory model. Lambda''s inventory has no llama2/zephyr/mistral/alpaca/phi model, and all 21 of its files carry a template. CONDITION 1, untrusted template: minijinja fuel 5,000,000, output cap 4 MiB (CappedOutput writer), recursion limit. A template over a limit is refused by name. Case rows (chat_template_embedded_limits): infinite loop, huge output, deep recursion, raise_exception. Residual, stated: an eager ''x''*N expression still allocates before the cap sees it. CONDITION 3: cargo deny check licenses advisories bans sources, rc 0: advisories ok, bans ok, licenses ok, sources ok. minijinja-contrib 2.21.0 is Apache-2.0 and the ONLY package this branch adds to Cargo.lock; its deps (minijinja 2.21.0, serde) were already present, so no new duplicates. CONDITION 4: scripts/chat_template_inventory_parity.sh is in root Cargo.toml [package.metadata.dogfood].gates (release-time, scripts/dogfood.sh --phase pre-publish). It re-extracts every GGUF''s template from the host''s model dir, renders them with transformers, and runs the oracle test on those fresh fixtures (APR_CHAT_TEMPLATE_FIXTURES). The oracle now requires 9 renderings per indexed template. Measured on lambda: PASS, 9 templates, byte-equal to transformers 5.3.0. RED on: an empty model dir; the oracle not reading the fresh fixtures (a 0-test filter, caught on the first run); an add_generation_prompt=>false mutant (54 of 81 differ). An lstrip_blocks(false) mutant stays GREEN: it is equivalent on this inventory, where no template has whitespace before a block tag. PROMPT_TOKENS CELL (added at aprender-04''s request, issuecomment-5768261880): llama-tokenize on the Qwen3.5-9B vocab over apr''s rendering equals llama-server d1d3c3396 usage.prompt_tokens for explicit on/off (17/19, 28/30, 41/43). Unset differs by +2 by design (llama-server''s default is ON). apr serve''s OWN count is +4 per message on the CPU GGUF path, because server.rs:121 builds BPETokenizer::new(vocab, vec![], unk) with no merges, i.e. greedy longest-match. That is #3726/#3677''s encoder, not the scaffold, and is measured end to end at the fold. USER-VISIBLE CHANGE, for the 0.69.1 release notes: qwen2/qwen2.5 models now receive their template''s default system prompt ("You are Qwen, created by Alibaba Cloud. You are a helpful assistant.") when the conversation has none, as llama.cpp and HF send it. Every family now gets exactly the prompt its template produces. RE-MEASURE (done_when 5, 0.8B golden 3/3 on intel CPU and on lambda/gx10 CUDA): PENDING, recorded here when measured.'
