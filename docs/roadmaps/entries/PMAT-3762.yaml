  notes: 'Owner aprender-c3 (issue comment by the operator: after #3742, using the >=2-D tensor-count dtype helper of #3712 row A2). MEASURED BEFORE (evidence/inspect-quantization-3762/receipt-lambda.txt; apr inspect MODEL --json, lambda): at 0.69.0 (225b2a9ab, the v0.69.0 tag) Qwen3.5-0.8B-Q4_K_M.gguf reports Q6_K (general.file_type 15 = Q4_K_M), qwen2.5-coder-1.5b-instruct-q4k.apr reports no quantization at all, and Qwen2.5-0.5B-Instruct-IQ4_XS.gguf reports IQ4_NL (it declares IQ4_XS). The inspect FAILURE on IQ4_XS (Unsupported dtype 23 for raw extraction) is 0.68.2 behaviour: 0.69.0 already reads both IQ4_XS files, fixed by #3601; so done_when 4 RED at 0.69.0 holds for 2 of the 3 measured files (plus the fourth), and the third is guarded by the type-table test and its dtype-23 mutant, which reproduces the 0.68.2 message. ROOT CAUSE: apr-inspect-quantization-v1 v1 defined quantization as the dtype holding the most PARAMETERS; a Q4_K_M file keeps its 248k-vocab embedding in Q6_K, which outweighs every Q4_K matrix. The file declares its scheme and nothing read it. The .apr path read only header and metadata, never the tensor index. THE FIX: general.file_type is decoded by trueno_quant::LLAMA_FTYPES, extracted from upstream include/llama.h at the pin by scripts/extract_llama_ftypes.sh into crates/aprender-quant/fixtures/llama_ftypes.json (36 live, 6 removed, 1 sentinel), checked row for row by crates/aprender-quant/tests/llama_ftypes_fixture.rs (wired: ci/explicit-test-commands.d/460-aprender-quant-llama-ftypes-fixture.cmd) with the pin checked by monorepo_invariants FALSIFY-LLAMA-FTYPE-001: the M1 pattern, no hand list. aprender::format::tensors gains the one definition: dtype_histogram (by COUNT over tensors of 2+ dims, names upper-cased, #3712 row A2), dominant_dtypes, QuantScheme::resolve (declared scheme, else the dominant dtype(s) joined by +, never size-based), gguf_declared_scheme and gguf_quant_scheme. apr tensors --json prints dtype_histogram; apr inspect --json prints quantization, quantization_source and dtype_histogram from the same functions, for GGUF (rosetta) and .apr (the native path now reads the tensor index the way apr tensors does, and the metadata quantization.quant_type; an unreadable tensor index is an error, never an empty histogram). contracts/apr-inspect-quantization-v1.yaml 2.0.0 carries the new semantic. MEASURED AFTER at a7e1e3df4: Q4_K_M file -> Q4_K_M (source general.file_type), histogram F32 18 / Q4_K 98 / Q5_K 36 / Q6_K 17 / Q8_0 36; q4k .apr -> Q4_K (source quantization.quant_type), Q4_K 169 / Q6_K 29; Qwen3.5-0.8B-IQ4_XS -> IQ4_XS (general.file_type); Qwen2.5-0.5B IQ4_XS -> IQ4_XS (general.file_type) although IQ4_NL leads the count 120 to 24, which is exactly why the declaration wins. On all four files apr tensors --json and apr inspect --json print the same non-empty histogram. TESTS (crates/aprender-core/src/format/tensors_tests_quant_scheme_3762.rs): the histogram, the scheme rule and ties, the upstream decode (removed ids and the GUESSED sentinel name nothing), a synthetic Q4_K_M GGUF (declared -> Q4_K_M; undeclared -> Q4_K by count, not Q6_K by parameters), and every live ggml type from trueno_quant::ALL (35, upstream-extracted, not a hand list) through both tensors and inspect. MUTANTS (evidence/inspect-quantization-3762/mutants.txt): M1 restores the parameter vote -> Q6_K, RED; M2 reintroduces the dtype-23 refusal -> inspect fails on IQ4_XS with 0.68.2 own message, RED. CONTRACT FALSIFIERS (falsifiers-both-binaries.txt): 002/003/005 FAIL on 0.69.0 and PASS on a7e1e3df4; 003 first passed vacuously on 0.69.0 (two absent histograms compared equal) and now requires a non-empty one; 001/004 are the cargo tests above. Unit: aprender-core --lib 14287/0, aprender-quant 30/0, apr-cli --lib 7317 pass 1 fail (the batch-1 base serve context-length guard, not this row).'
