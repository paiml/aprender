  acceptance_criteria:
  - 'SLICE 1 of #3739, as the design note on the issue lays out (issuecomment-5764437831): the `run` verb, the golden prompts, thinking OFF, lambda. This PR does NOT meet the issue''s done_when in full, and it says `Refs #3739`, never a closing keyword. Every receipt it writes carries a `not_covered` list naming the verbs chat, serve and code, thinking ON, the consumer-brief rungs and max context, and TTFT, so a partial run cannot be read as a full one.'
  - 'done_when 1, the part this slice meets, verbatim: "`scripts/crux_inference_dogfood.sh <version>` runs ... the SAME prompt set (the golden prompts ...) through: run: `apr run` · `llama-cli` · `ollama run`". Measured: `bash scripts/crux_inference_dogfood.sh 0.69.0 --backend cpu --model ~/models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf` on lambda gives rc 0 with 3 cells GREEN, apr and llama.cpp@d1d3c3396 both correct. It declines (rc 2) when `apr --version` is not <version>, when no --model is given, for a verb other than run, when --engines omits apr, and when no comparator resolves.'
  - '"Same model" is recorded, not asserted, verbatim: "ollama IMPORTS the exact GGUF via a Modelfile (`FROM <path>`) and the receipt records sha256 for all three engines". The receipt holds the input sha256 and ollama''s stored blob digest, with `blob_is_input`. An ollama import that carries no chat template (`TEMPLATE {{ .Prompt }}`, what 0.5.7 does on lambda) is REFUSED by name for every cell, never run as a raw completion against two engines that chat.'
  - 'done_when 2, the part this slice meets: per cell the receipt records answer correct (golden), exact-match agreement across engines, token-id parity (apr''s `-v` prompt ids against llama.cpp''s own `/apply-template` + `/tokenize` rendering of the same messages; count plus the id prefix apr prints, labelled `apr_ids_complete`), and prompt/completion tokens and rates as each engine REPORTED them, labelled by engine and never judged. The driver reads no clock and computes no rate (`check_no_competing_harnesses.sh` stays count=0). TTFT and max context belong to later slices and are listed as not covered.'
  - 'done_when 3, the gate, verbatim: "a cell where llama.cpp OR ollama answers correctly and apr doesn''t is **RED** (a finding naming the cell)". `bash scripts/check_crux_inference_judge.sh`, which guard_tree runs bare, gives rc 0 and "14 ok, 0 broke". Its row 2 is the #3715 falsifier: llama.cpp right and apr wrong makes the judge exit 1 with the cell RED. Other rows make RED an apr that exits non-zero, falls back off the lane''s backend, or is MISSING. A run with no GREEN cell (all UNJUDGED or ALL_WRONG) declines rc 2. A comparator that exits non-zero or cannot be parsed is no oracle. A drift row pins the prompt set to golden_output.rs::golden_test_cases.'
  - 'Mutation, 7 mutants, each turning the table RED: removing the RED rule breaks 5 rows; ignoring apr''s exit code breaks 2; ignoring fallback/backend breaks 1; skipping a missing apr row breaks 6; removing the no-GREEN decline breaks 3; `correct()` ignoring `answered` breaks 4; adding a pattern to the prompt set breaks 2, including the drift row.'
  - 'The first receipts are committed at evidence/crux/0.69.0/lambda-cpu.{json,md} and evidence/crux/0.69.0/lambda-gpu.{json,md}, measured by apr 0.69.0 (52f43da71). The GPU lane''s verdict is reported as measured; if it is RED, those cells are findings named on the issue and are not fixed in this PR.'
