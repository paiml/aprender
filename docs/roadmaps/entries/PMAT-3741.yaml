  notes: '#3563 part B (split by the cop into A -> C -> B), STACKED ON #3740 (branch PMAT-3740-comparator-consumers-resolve, head 701a959ad, itself on #3756 -> #3563(A)); the quorum base is 701a959ad. The design is the file-ledger recommendation recorded on the issue before round 1 (comments quoted above); the cop had not ruled on it when this was built, so it stands as the decided recommendation unless vetoed. SCOPE: scripts/llama_pin.toml (one key, superseded_commits), scripts/check_comparator_pin_citations.sh (new), scripts/comparator_pin_citations.txt (new: the enumeration), scripts/check_baseline_ratchets.sh (one classify() line), scripts/llama_bin.sh (one comment dated), evidence/parity/thresholds.yaml (the stale row), evidence/perf-054/campaign-scope.md (the stale how-to), and this fragment. HOW EACH ITEM IS MET. done_when 1 (enumerate and classify): the ledger IS the enumeration, committed: 71 files, one line each, `<path> TAB historical|fixture TAB why [sha]`: 40 historical (dated records under evidence/ and docs/archive, dated spec/contract/CHANGELOG lines, comments beside the pin recording the OLD build''s measured behaviour) and 31 fixture (sample values in scripts/lib/parity_receipt_cases/*.json, tests/fixtures, Rust tests and self-tests). The STALE class had two members and both are fixed here: evidence/parity/thresholds.yaml''s qwen3.5 cpu row claimed "pin 39173bcac (scripts/llama_pin.toml)" a week after that file said d1d3c3396; it now names the pin of record and dates the basis measured against the previous pin (2026-09-15). evidence/perf-054/campaign-scope.md''s how-to exported the old build; it is marked historical and points at scripts/llama_bin.sh. done_when 2 (does llama_bin.sh refuse a citation?): measured, no: it refuses only to RESOLVE a non-pin binary and reads no committed artifact, so the guard, not the resolver, covers the surface where the defect lives; this is stated, not fixed in the resolver. done_when 3 (the guard): scripts/llama_pin.toml declares superseded_commits = "39173bcac 60b06ab9a" (a bump appends the old build_commit). scripts/check_comparator_pin_citations.sh, guard_tree-wired (--no-cargo): R1 a file citing a superseded pin (its first 7 hex digits followed by hex, so the 8-, 9- and 40-digit forms all count) that is not on the ledger is RED naming file:line, over tracked UNION untracked text files (an untracked planted receipt gets no free pass); R2 a ledger entry whose file no longer cites any superseded pin is RED (stale: delete it, that is how the ledger shrinks); R3 a historical entry carries a date, YYYY-MM-DD in the file, its path or its ledger line (the "explicitly historical and carries the date" clause, satisfied at the ledger for two undated transcripts); R4 the ledger may not grow against origin/main (a set ratchet, classified in check_baseline_ratchets.sh); R5 superseded_commits is declared and never contains build_commit. The guard''s own fixtures build the old shas from halves, so it neither exempts nor ledgers itself. THE FALSIFIER ON THE REAL TREE: a planted evidence/parity/planted/receipt.json citing 39173bcac -> "FAIL R1 evidence/parity/planted/receipt.json:1 cites a superseded comparator pin and is not on scripts/comparator_pin_citations.txt"; the same file untracked -> RED; removed -> PASS. THE CASE TABLE, `bash scripts/check_comparator_pin_citations.sh --self-test`, 16 rows and mutants: C1 the control (dated history + a fixture, both ledgered, green); C2 a planted receipt unlisted -> R1 naming it; C3 an 8-digit abbreviation is a citation -> R1; C4 a stale entry -> R2; C5 an undated historical entry -> R3; C5b the date on the ledger line satisfies R3; C6 a ledger that grew 1 -> 2 against main -> R4; C7 build_commit listed as superseded -> R5; C8 no superseded list -> R5; C9 a malformed ledger line is RED, never a pass; C10 a citation of the CURRENT pin needs no ledger; mutants drop-r1, drop-r2, drop-r3, drop-r4 and full-sha-only (the 8-digit form no longer matches), each killed by its row. MEASURED at this commit: self-test "SELF-TEST PASSED (16 rows and mutants)"; the tree "ok build_commit d1d3c3396; superseded 39173bcac 60b06ab9a; 71 file(s) cite a superseded pin, every one ledgered (40 historical, 31 fixture); no stale entry", PASS; guard_tree --no-cargo "78 checks, 0 failed"; check_llama_pin rc 0 (the new key does not disturb the resolver''s table), check_comparator_flags, check_bench_protocol, check_baseline_ratchets, check_guards_are_wired, check_shell_lint_ratchet, check_bashrs_gate all PASS; check_model_parity.sh --self-test 26/26 after the thresholds.yaml edit. NOT DONE, pending the ruling: moving the 31 fixture files to an obviously synthetic sha, which would empty the fixture class; ledgering them is the less invasive form and the ledger is shrink-only, so that move can follow as its own delta. Refs #3741.'
