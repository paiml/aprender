  acceptance_criteria:
  - 'Issue #3741 done_when 1 (verbatim from #3563), verbatim: "Enumerate every committed artifact citing `39173bcac` and classify each: *still valid* (measured before the bump and honestly labelled with the pin it used), or *stale* (claims a current baseline against a superseded comparator)."'
  - 'done_when 2, verbatim: "`scripts/llama_bin.sh` is described as "the resolver that refuses anything else" — check whether it refuses a *citation* of a non-pinned sha in a committed receipt, or only refuses resolving a binary. If only the latter, the guard does not cover the surface where the defect lives."'
  - 'done_when 3, verbatim: "A guard: no committed artifact may cite a comparator sha other than `llama_pin.toml`''s `build_commit`, unless the citation is explicitly historical and carries the date of the measurement. Falsifier: plant a receipt citing an old pin and require RED."'
  - 'the issue''s note, verbatim: "Note the pin''s own rule when resolving this: bumping the comparator invalidates every ratio measured against the old one, so a bump is a decision with a named cost, not a cleanup."'
  - 'the mechanism the issue quotes (operator amendment, Clause 2a), verbatim: "## The mechanism (operator''s 2026-09-20 amendment, Clause 2a, quoted in #3563)
> The TRAITS fixture records the sha it was extracted from. A test asserts `fixture.sha == llama_pin.toml build_commit`. A pin bump therefore turns the fixture RED until it is regenerated by the committed extraction command — the bump''s cost is visible in the bump PR, not discovered later."'
  - 'the cop''s requirement in the issue body, verbatim: "a red-turning case table, a mutant per row (a planted receipt citing an old pin is RED)"'
  - 'THE ENUMERATION AND THE PROPOSED DESIGN (comment 5768382978, recorded before round 1), verbatim: "**First pass of the enumeration (aprender-f0, 2026-09-22), read on `PMAT-3740` @ `bfeed8ced`, which stacks on #3756 → #3563(A).** `git grep -c 39173bca` gives 75 files. They fall into three classes:

**1. Dated history: honest, keep.** A citation that records when a measurement was made and against which pin:
- CHANGELOG (the re-pin line);
- `llama_pin.toml`''s re-pin notes ("RE-PINNED 2026-09-15 … The previous pin, 39173bcac");
- PP-LLAMA-001-MASTER''s change-log row and RATIONALE ("both build 39173bcac, 2026-09-02");
- `contracts/batch-admission-v1.yaml` ("Measured 2026-08-25 … llama.cpp pinned 39173bcac");
- `contracts/pp-llama-001-comparator-pin-v1.yaml` (props files "at the old template argv");
- comments recording the OLD build''s measured behaviour in `llama_bin.sh`, `check_llama_pin.sh`, `bench_receipt.py:590` and `perf_receipt.py:61`;
- every file under `evidence/` that is a timestamped record: dogfood 0.65.2 receipts, parity LEDGER rows 0a/5/12 (which `llama_pin.toml` already names as incomparable with the new pin), `parity-http/findings.json`, the props captures, `perf-060/calibration.md`, ship-004 transcripts, and so on;
- `docs/archive/**`.

**2. Fixtures: not a claim about the comparator, but indistinguishable from one.**
- Rust tests: `test_llm_band.rs`, `extended_commands.rs`, `parity_receipt_tests.rs`, `perf_gate/mod.rs`;
- shell/python self-tests: `perf_gate.sh:1842`, `perf_receipt.py:1237`;
- fixture files: `scripts/lib/parity_receipt_cases/*.json` (22 files) and `tests/fixtures/perf-gate/parity-host-work/*`.

They use `39173bcac…` as a sample value, often padded with a fake tail (`39173bcac0123456789abcdef…`).

**3. Stale: claims a CURRENT baseline against a superseded comparator.**
- `evidence/parity/thresholds.yaml:45`: `comparator: ''llama.cpp [X], CPU build, pin 39173bcac (scripts/llama_pin.toml)''`. It is a threshold row that says its comparator is "the pin in llama_pin.toml", and that file now says `d1d3c3396`.
- `evidence/perf-054/campaign-scope.md:379` is a how-to that exports `LLAMA_BENCH_PATH=~/src/llama.cpp-pin/...  # 7746 (39173bcac)`, which points readers at the old build. It is dated campaign scope, so it is borderline.

`60b06ab9a` (3 refs): two Qwen3.5 tests in `crates/aprender-serve` cite it as the reference llama.cpp they were checked against. Classifying those is part of this issue too.

**Done_when 2:** `llama_bin.sh` refuses to RESOLVE a binary that is not the pin. It does not look at any citation in a committed file, so it does not cover the surface this issue is about.

**Proposed guard** (for the cop''s ruling before code):
- `llama_pin.toml` declares the superseded pins: `superseded = [{commit = "39173bcac", until = "2026-09-15"}, {commit = "60b06ab9a", ...}]`.
- A new `check_comparator_pin_citations.sh` scans every tracked text file. Each citation of a superseded pin must belong to a file on a SHRINK-ONLY ledger, `scripts/comparator_pin_citations.txt` (`<path> <class> <why>`, class ∈ {historical, fixture}). That ledger is this enumeration, committed.
- A citation in a file NOT on the ledger is RED; that covers the planted-receipt falsifier. A ledger entry whose file no longer cites the sha is RED (stale).
- Fixtures move to an obviously synthetic sha (e.g. `0000000fixture…`), so the fixture class empties and only dated history remains.
- The stale class is fixed in this row: thresholds.yaml''s row names `d1d3c3396` or states that it was measured against the superseded pin, and the perf-054 how-to is marked historical.
- A case table plus a mutant per row."'
  - 'WHAT WAS BUILT AND MEASURED (comment 5770588248, recorded before round 1), verbatim: "**Built and measured (aprender-f0, 2026-09-22 ~03:00Z), on `PMAT-3741-one-comparator-pin-cited` @ `96110412e`, stacked on #3740 (`701a959ad`), on the file-ledger design proposed above (the cop has not ruled yet; the ledger data is the same under either design, and this stands as the decided recommendation unless vetoed):**

- **done_when 1, the enumeration:** `scripts/comparator_pin_citations.txt`, one line per file that cites a superseded pin: `<path><TAB><historical|fixture><TAB><why [sha]>`. 71 files: 40 `historical` (dated records: evidence/, docs/archive, dated spec/contract/CHANGELOG lines, comments beside the pin recording the OLD build''s behaviour) and 31 `fixture` (sample values in self-tests and fixture files). The two STALE citations are fixed in `4f6fd1fc5`: `evidence/parity/thresholds.yaml`''s qwen3.5 cpu row no longer claims "pin 39173bcac (scripts/llama_pin.toml)" (it names the pin of record and dates the basis measured against the previous pin), and `evidence/perf-054/campaign-scope.md`''s how-to that exported the old build is marked historical.
- **done_when 2:** measured: `scripts/llama_bin.sh` refuses only to *resolve* a non-pin binary; it reads no committed file for citations. The surface where the defect lives is covered by the new guard, not by the resolver.
- **done_when 3, the guard:** `scripts/check_comparator_pin_citations.sh` (guard_tree-wired, 78/0 on the branch). `scripts/llama_pin.toml` gains `superseded_commits = "39173bcac 60b06ab9a"` (bumping `build_commit` appends the old value). R1: a file citing a superseded pin (7+ hex digits, so the 8-digit form counts) that is not on the ledger is RED, naming file:line — tracked OR untracked (an untracked planted receipt gets no free pass). R2: a ledger entry whose file no longer cites is RED (stale; the ledger shrinks). R3: a `historical` entry carries a date (YYYY-MM-DD in the file, its path, or the ledger line). R4: the ledger may not grow against origin/main (classified `set` in `check_baseline_ratchets.sh`). R5: `superseded_commits` declared, and never containing `build_commit`. The guard''s own fixtures build the old shas from halves, so it neither exempts nor ledgers itself.
- **The falsifier, on the REAL tree:** a planted `evidence/parity/planted/receipt.json` citing `39173bcac` → `FAIL R1 evidence/parity/planted/receipt.json:1 cites a superseded comparator pin and is not on scripts/comparator_pin_citations.txt`; the same, untracked → RED too; removed → PASS.
- **Case table:** 16 rows and mutants (control; planted receipt; 8-digit abbreviation; stale entry; undated historical; the date on the ledger line; ledger growth vs main; build_commit listed as superseded; no superseded list; malformed line; a citation of the current pin needs no ledger; mutants dropping R1/R2/R3/R4 and a full-sha-only match, each killed).
- Related guards at `96110412e`: check_llama_pin, check_comparator_flags, check_bench_protocol, check_baseline_ratchets, check_guards_are_wired, check_shell_lint_ratchet, check_bashrs_gate, check_model_parity --self-test (26/26): all PASS.

Not done, pending the ruling: moving the 31 fixture files to an obviously synthetic sha (which would empty the `fixture` class). Ledgering them is the less invasive form; the ledger is shrink-only, so that move can follow as its own delta."'
