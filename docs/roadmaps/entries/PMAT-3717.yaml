  notes: 'P0 on the 0.69.1 release path (cop, aprender-04). This is #3712''s done_when 3, split out so that aprender-62 (done_when 1+2, the measuring side: scripts/model_ladder.sh, scripts/check_model_ladder.sh, the ladder contract) and aprender-f0 do not mint the same fragment. Fixtures and stubs only in CI; nothing here ran against the live train or a publish token. STACKED on PMAT-3708 (branch PMAT-3708-dogfood-one-rule, 629143eeb): the judged diff is base 629143eeb to this head. SCOPE: the new scripts/release/models_t1.sh; scripts/release/autopilot.sh (a new `models` step); scripts/check_publish_preflight.sh (a new R7); the new scripts/check_release_models_t1.sh; and this fragment. "The per-host receipts are committed in the bump PR (#3708)" is already delivered by #3708: prepare_bump.sh --ship refuses unless check_model_ladder.sh --version <V> is green in the bump tree, and refuses gitignored receipts. HOW IT IS MET. (1) BEFORE THE TAG, ON BOTH HOSTS: autopilot STEPS gains `models` between `dogfood` and `tag`. It runs scripts/release/models_t1.sh <V> <MC> $AP/models-t1 and STOPs with "T-1 model matrix NO-GO … nothing is tagged" on any non-zero exit. On GO it says "MODELS GO at <MC> on lambda and gx10", which is the STATUS line cop requirement 4 asks for before TAGGED. models_t1.sh runs two legs IN PARALLEL: lambda locally in the release worktree, and gx10 over `ssh -o BatchMode=yes gx10 "bash -s"`, the lambda->gx10 SSH the operator authorized. Each leg builds `cargo build --release -p apr-cli --bin apr --features cuda --locked` (binary-release.yml''s command) from the release commit. It then PROVES the binary before measuring (`apr --version` must equal "apr <v> (<sha9>)"), runs `scripts/model_ladder.sh --host <id> --out <dir>` (the frozen interface), and brings gx10''s receipt back. Each receipt''s existing apr_version field must equal that same line. Then `scripts/check_model_ladder.sh --version <v> --receipts $AP/models-t1` judges both. An unreachable host (ssh rc 255), a failed build, a binary that is not the release, a missing receipt, a red cell and a judge DECLINE (rc 2) are each NO-GO. Nothing is retried, and there is no exemption. (2) INSTRUMENT ISOLATION ON gx10, per the AMENDMENT: a PER-RELEASE dir `$HOME/.cache/aprender-release/rel-<v>`, derived on the remote at run time. It holds a detached worktree at the release commit, and CARGO_TARGET_DIR is <that dir>/target. Every other rel-* is deleted first, and ~/src/aprender/target is never used (only `git -C ~/src/aprender fetch origin main` and `worktree add` touch that checkout). No host path is a literal in scripts/release/ (check_release_scripts_derive_identity.sh PASS). The worktree is removed after measuring; the target stays for a same-version re-run and is deleted by the next release. DISK: the leg REFUSES up front, as ENV ("MODELS-LEG gx10 ENV: … refused before building", models_t1.sh exit 2), when the filesystem''s free space plus an existing same-version dir is below NEED_KIB = 5,524,629 KiB. MEASURED 2026-09-21 on lambda at 629143eeb with a fresh CARGO_TARGET_DIR: the target is 5,285,126,283 bytes (244 s, nice 19), the binary printed "apr 0.69.0 (629143eeb)", and a worktree checkout is 363,372 KiB. gx10 is aarch64 and was not measured. A read-only probe of gx10 (bash 5.2.21, git 2.43.0): df -Pk reports 116,078,068 KiB free, so it "would-build". (3) T-4 RE-READ, THE SAME JUDGE: check_publish_preflight.sh gains R7, rule_r7(), called by the full gate. It runs `check_model_ladder.sh --version <version>` in the tagged tree, over the receipts COMMITTED by the bump. rc 0 -> "ok    R7"; rc 2 -> "FAIL  R7 the model-matrix judge DECLINED (rc 2), and a decline is not a pass"; any other -> "FAIL  R7 model matrix NOT green", quoting the judge''s FAIL lines; a missing judge -> "FAIL  R7 no model-matrix judge". The seam is PUBLISH_PREFLIGHT_LADDER_JUDGE. The PASS line now ends "dogfood GO, model matrix green". The self-test gains r7_model_matrix_red_refuses, r7_judge_decline_refuses and r7_judge_absent_refuses. Every fixture commits a judge stub that refuses any version but 1.2.3, so all_rules_hold also proves the argument: 28/28. #3715 (the pv SHACL shape, aprender-97) will become the gate of record behind the same call sites. That design is agreed on #3712 (comments 5763316076 and 5763344947): T-1 passes MC, and T-4 passes the measured sha after a `git diff --quiet <measured> HEAD -- . '':!evidence''` proof. It is NOT in this diff. RED-TURNING TABLE (cop requirement 1): scripts/check_release_models_t1.sh, a scripts/check_*.sh with no bare cargo token, so guard_tree''s --no-cargo set runs it. It drives the REAL autopilot `models` step, and so the real models_t1.sh, through `autopilot.sh 9.9.9 99 models models`. The fixture: a local bare origin (parent 9.9.8, release 9.9.9); an ssh stub that runs the gx10 script locally under a fake gx10 HOME whose ~/src/aprender sits at the OLD parent with a stale rel-9.9.7 beside it; a build stub that bakes `apr --version` from the tree it ran in; and committed stubs for model_ladder.sh and the judge. T-1 ROWS: green-pair (MODELS GO; gx10 measured by "apr 9.9.9 (<MC9>)" although its checkout sat at the parent; built into rel-9.9.9, not ~/src/aprender/target; rel-9.9.7 deleted); gx10-unreachable; build-fails; missing-receipt; red-cell; judge-decline; stale-binary; disk-refusal (exit 2, nothing built). T-4 ROWS: rule_r7 EXTRACTED from check_publish_preflight.sh and run on a tagged tree''s committed receipts (cargo-free): r7-green, r7-red, r7-missing (names gx10.json), r7-decline, r7-no-judge. MUTANTS, one per row, each killed: shared-target -> "gx10 did not build into the per-release dir"; no-255-reason, build-ignored, no-receipt-ok -> the STOP no longer names the cause; red-is-go and decline-is-go -> "autopilot exited 0"; no-version-proof -> the pre-measure NOT-THE-RELEASE is gone (the receipt''s apr_version check still stops it, which is defence in depth); no-disk-check -> "autopilot exited 0"; autopilot-no-die -> "autopilot exited 0"; r7-no-version -> "decline: no --version given"; r7-red-is-go and r7-decline-is-go -> "rc=0, want 1"; r7-no-fail-lines -> the refusal no longer names gx10.json; r7-no-judge-ok -> "rc 127", not the no-judge refusal. That the full gate CALLS rule_r7 is proved by the preflight self-test, which needs a Rust-package fixture and runs at ci.yml:1978. Ad hoc wiring mutant (the gate without its rule_r7 call): "BROKE r7_model_matrix_red_refuses / r7_judge_decline_refuses / r7_judge_absent_refuses", 25/28. The table''s first full run caught a fixture bug of mine: the red receipt was written before its env var was exported, so r7-red was RED and its mutant was "killed" for the wrong reason. It was fixed by passing the red host positionally, and the mutant now dies with "rc=0, want 1". ROUND 2 CHANGE (after the round-1 receipt at d00665a7f), the GPU-SHARING requirement: both legs run `choom -n 1000 -- bash scripts/model_ladder.sh …`. oom_score_adj is inherited across fork, so the ladder and every apr it starts are the OOM victim, never the CI pool (the gx10 15:56Z OOM killed 18 CI containers). The wrapper takes NO flock: the lock is model_ladder.sh''s own, per apr call (#3712 row B), and a second flock on /tmp/apr-gpu.lock here would deadlock it. That is the one-owner ruling. Builds run under neither. New row oom-victim: stubs for choom and flock record what wrapped each process, and the row requires "ladder host=<h> oom=1000 flock=0" on both hosts, "build host=<h> oom=none flock=0", and no flock call at all. New mutants: no-choom (gx10''s ladder without choom) -> "gx10 ladder did not run under choom -n 1000 alone: ladder host=gx10 oom=none flock=0"; wrapper-flock (lambda''s ladder under `flock /tmp/apr-gpu.lock choom …`) -> "… ladder host=lambda oom=1000 flock=1". MEASURED at this commit: `bash scripts/check_release_models_t1.sh` rc 0, "PASS 30 row(s)"; `bash scripts/check_publish_preflight.sh --selftest` "28/28 rows"; `bash scripts/check_release_autopilot_dogfood_close.sh` "PASS 17 row(s)" and `bash scripts/check_release_bump_pr_body.sh` "PASS 12 row(s)", both unchanged by the new step; check_bashrs_gate "PASS 365 file(s) … 0 SEC/DET/IDEM errors", after a SEC010 on a `cd /` in the gx10 heredoc was removed; check_guards_are_wired, check_no_pipe_into_grep_q and check_release_scripts_derive_identity all PASS. `bash scripts/guard_tree.sh --no-cargo` at 38f8b5945: "79 checks, 0 failed", with "PASS scripts/check_release_models_t1.sh [run]". Cop requirement 4 (the real 0.69.1 train, MODELS GO on both hosts before TAGGED) is measured on that train, hence Refs #3717.'
