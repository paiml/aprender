  notes: 'ROOT CAUSE. `apr run --top-k` was declared `default_value = "1"` (commands_enum.rs), `RunOptions::default()` set top_k 1 too, and every decode loop picks greedily when `temperature == 0.0 || top_k == 1` (traced: dense CPU generate_quantized.rs:103/415, dense CUDA generate_1.rs:172, qwen35 CPU/GPU, MoE qwen3_moe_generate.rs:89). So `--temperature 0.8` alone was greedy with no message. `apr chat` and `apr serve` already sampled with 40 (`resolve_chat_top_k` plus five `if temperature == 0.0 { 1 } else { 40 }` copies), which is also the llama.cpp and Ollama default. FIX: one declaration. `realizar::infer::DEFAULT_TOP_K = 40` and `realizar::infer::sampling_top_k(temperature, requested)` (1 at temperature 0, else the request, else DEFAULT_TOP_K). Users: `apr run --top-k` via `default_value_t = crate::commands::run::DEFAULT_TOP_K`, which IS realizar''s constant under the `inference` feature (without it there is no sampler; the flag parses to 1 and nothing reads it). Also RunOptions::default, apr chat (chat_generate_session_02.rs, 3 sites), serve (resolve_chat_top_k now delegates; gpu_completions_handler, realize_handlers_embed_completion x3 and cli/apr_inference use sampling_top_k; cli/gguf_inference_gpu x2 keep their `<= 0.01` greedy threshold and take DEFAULT_TOP_K for the sampled arm), and apr code local driver. LIBRARY DEFAULT DELIBERATELY UNCHANGED: realizar `InferenceConfig::new` keeps top_k 1. PMAT-823 pins that a default config forwards a byte-identical greedy generation config, top_k included (test_pmat823_default_config_is_greedy_no_regression plus 9 default-value rows). `apr run` always forwards its `--top-k` explicitly (`with_top_k(options.top_k)`), so the flag default is where the fix belongs. A scan of all 24 non-test `InferenceConfig::new` call sites found none that sets a temperature without a top-k. A first cut changed the library default too; those 10 rows went RED, and it was reverted. Greedy is unchanged everywhere: the default temperature is 0, and every loop tests `temperature == 0.0` first. dispatch_run.rs is not touched. PER-VERB (done_when 3): run has `--top-k`, default DEFAULT_TOP_K, shown by --help as "[default: 40]" from the constant. chat has no `--top-k`; it samples with DEFAULT_TOP_K at temperature > 0 and 1 at 0. serve takes the request `top_k`, else DEFAULT_TOP_K, and is greedy at temperature 0 (resolve_chat_top_k). code exposes no sampling flag. Its local realizar driver passed top_k 0 (filter disabled, full-vocabulary sampling) while its apr-serve driver sent none and so got serve''s 40; both now get DEFAULT_TOP_K. The apr-serve driver''s `APR_AGENT_TOP_K` override is unchanged. NAMED DIFFERENCE, not fixed here: the APR/SafeTensors `AprTransformer` sampler (apr_transformer/generation.rs `sample_from_logits`) takes the ARGMAX of the top-k/top-p survivors, so it never draws. `apr run` on .apr/.safetensors is greedy whatever the flags say, reported to the cop as its own defect. The GGUF paths are the ones this row fixes. TESTS. realizar infer::tests_sampling_default_3754, on the pygmy GGUF through `run_inference`: (1) the sampling_top_k table, DEFAULT_TOP_K > 1, and InferenceConfig::new() still top_k 1 / temperature 0; (2) temperature 1.5 with the top-k `apr run` now sends when none is named (DEFAULT_TOP_K) differs from greedy for at least one of seeds 1..=8 (done_when 1); (3) top_k 1 at temperature 1.5, temperature 0, and temperature 0 with top_k 40 all equal greedy for seeds 1..=4 (done_when 2); (4) the same seed twice is byte-identical, and one of seeds 8..=15 differs from seed 7 (done_when 4). apr-cli run_tests_top_k_default_3754, parsed on a 16 MB thread like data.rs: `apr run m.gguf --temperature 0.8` parses top_k == DEFAULT_TOP_K; explicit `--top-k 1` is kept and bare `apr run` has temperature 0; `--help`''s default value for top_k equals DEFAULT_TOP_K and RunOptions::default agrees (done_when 3). MUTANTS, each run and each RED: DEFAULT_TOP_K = 1 (the 0.69.0 value) turns 4 red: temperature-alone, seed-used, the table, and serve''s existing pmat760 defaults_to_40_when_unset (which now reads the shared constant). The `--top-k` clap default restored to the literal "1" turns 2 red: the parse row and the --help row. MEASURED on lambda, CPU, Qwen3.5-2B-Q4_K_M, pinned `apr 0.69.0 (edb5ea058)` via scripts/apr_bin.sh, prompt "Write one sentence about the sea.", 32 tokens: `--temperature 0.8 --seed 1234` != greedy (engaged); the same x2 is identical; seed 99 != seed 1234 (seed used); `--temperature 0.8 --top-k 1` == greedy; `--temperature 0 --top-k 40` == greedy. `apr run --help` prints "[default: 40]". The pre-fix side is the intel column on #3710 (apr 0.69.0 52f43da71): `--temperature 0.8` without --top-k was token-identical to greedy on all four Qwen3.5 sizes. SUITES at this commit''s code: `cargo test -p aprender-serve --lib` 15902 passed, 1 failed: cli::cli_tests_format_size::test_home_dir ("assertion failed: home.is_some()"). That is a pre-existing in-process env race: cli/tests_03.rs:197 `remove_var("HOME")` runs concurrently under `cargo test`. It is 3/3 green in isolation, touches nothing in this diff, and cannot race under CI''s nextest (one process per test). `cargo test -p apr-cli --lib` 7301 passed; `-p aprender-orchestrate --lib` 6535 passed; `-p aprender-contracts --lib` 1689 passed; clippy -D warnings on aprender-serve, apr-cli and aprender-orchestrate clean; fmt clean.'
