  notes: 'The judged diff is this ONE commit, scripts/parity_receipt_denominator.sh plus this fragment, with --base at its parent. The three commits under it on the 0.69 batch branch (the dogfood ledger re-audit, the ONT ratchet restamp, the ont4b 6->9 raise) are data/ratchet restamps that carry their proofs in their commit bodies and are outside this ticket. Found in batch #3669, workspace-test shard 3/3 on gx10-pool1 (job 106269529629): "EXPECTED_RECEIPTS says 7; the tree holds 0". On the docker runners git refuses the bind-mounted tree ("detected dubious ownership", exit 128), and the old `(cd "$root" && git ls-files … 2>/dev/null | sort -u)` inside a process substitution discarded both the message and the exit status. Measured at this commit: `bash scripts/parity_receipt_denominator.sh --self-test` 5/5 ok (the new row: "git refusing the tree is ENV exit 2 naming git, never a count of 0"); `bash scripts/parity_receipt_denominator.sh` "PASS 7 receipt(s) … says 7"; MUTANT with the pre-fix count_and_check from 55b123f2f: self-test rc=1, "FAIL git refused and the result was exit 1: FAIL evidence/parity/EXPECTED_RECEIPTS says 2; the tree holds 0."; `cargo test -p aprender-contracts-cli --test ont4c3_parity_receipts` 9 passed. Sibling sweep, on lines the batch ADDED in scripts/ and crates/*/tests/: ci_test_tier.sh:180 and :252 fail closed (not docs-only / tier=full); lib_baseline_ratchet.sh:300/302 fail closed but misattribute the cause ("this branch WROTE it"). No other zero-count site. Outside test paths: release/lib_release_params.sh:39 silently falls back to the tree root. Those are filed, not fixed here.'
