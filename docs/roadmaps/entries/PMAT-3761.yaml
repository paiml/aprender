  notes: 'Closes #3761; Refs #3750. WHAT LANDS. ONE bounded-prefix policy: crates/apr-format/src/prefix.rs (HEADER_FIRST_READ 16 MiB, doubling, HEADER_READ_CAP 256 MiB, refused past it, never read whole; read_prefix, parse_growing_prefix, apr_v2_header_prefix bounded by the header''s data_offset). crates/aprender-core/src/format/prefix.rs re-exports it and adds safetensors_header_prefix (8-byte length + JSON header, capped) beside the SafeTensors format, as done_when 1 places it. apr-cli model_header.rs delegates to it and adds gguf_header_bytes (the header cut at data_offset, for LlamaTokenizer::from_gguf_bytes, which is not prefix-safe). The 17 sites (ledger rows now CONVERTED (#3761), each naming what it reads now and its case row): bench format detect 8 bytes; bench GGUF maps ONCE and hands the map to the CPU, CUDA and MoE paths (each mapped again before; realizar''s map pre-faults every page, MAP_POPULATE); gguf_vocab via gguf_header_bytes; eval count_safetensors_keys via safetensors_header_prefix; verify_single_file reads the header and STREAMS its FNV-1a hash in 1 MiB chunks (a test proves the streamed hash equals the whole-buffer hash); the converter''s five APR readers via apr_v2_header_prefix or a read bounded by the metadata section; lint SafeTensors (length + header) and APR (apr_v2_header_prefix); rosetta inspect_apr; is_onnx_file 5 bytes; aprender-serve is_apr_file / format_from_magic 4 bytes (read_magic). list_tensors (done_when 2): GGUF without --stats parses the header from a growing prefix; the old path also COPIED the bytes (list_tensors_gguf data.to_vec()), 4.2 GB peak on the 2 GiB fixture. GGUF with --stats and APR v1 use a map, which pages in only what is read. extract_apr_tokenizer_hint: APR v2 input is scanned within apr_v2_header_prefix. The v2 writer zero-pads its metadata, so the terminator this legacy scan looks for is absent and the answer is None, as it was when it read the whole model. Any other layout gets a growing prefix under the cap, and test_infer_tokenizer_json_legacy_apr_with_tokenizer is its positive control. CASE ROWS (done_when 3): each is a real file extended SPARSELY to 2 GiB, the readers run in a CHILD process (the test binary re-run on one probe test), and VmHWM is held under 256 MiB. apr-format 4,608 KiB; aprender-core format row 36.1-37.1 MiB and converter row 15.8-17.2 MiB; aprender-serve 19.9-20.3 MiB; apr-cli model_header 42.4-43.8 MiB, gguf_vocab 39.8-42.3 MiB, eval 25.3-27.3 MiB. apr bench''s bound is one map + 256 MiB, because the bench runs the model: 2,123,680-2,125,672 KiB. MUTANTS (done_when 3): a whole-file read put back into each reader, 22 in all (apr-format 1; aprender-core 12, covering list_tensors GGUF and APR v1, lint x2, inspect, is_onnx_file, safetensors_header_prefix and the converter''s five; aprender-serve 2; apr-cli 7, covering gguf_header_bytes, gguf_vocab, count_safetensors_keys, verify_single_file header and hash, bench format detect and bench tokenizer read). Every one goes RED at 2,100,864-4,218,352 KiB. Each probe reports its peak before its result checks, so a mutant fails on RSS, not on a side assertion. Ledger (done_when 4): docs/audits/3750-whole-file-model-reads.md rows updated; after this PR the same git grep finds 215 hits (231 - 17 + 1: aprender-serve read_magic''s take(4) before read_to_end matches the pattern). CHECKS: cargo check -p apr-cli --features cuda --lib --tests rc 0 (the bench''s CUDA path takes the map); clippy -p apr-format / aprender-core / aprender-serve / apr-cli --lib -D warnings rc 0; clippy --lib --tests reports nothing in this PR''s files (aprender-serve''s test targets carry pre-existing errors in iq2_s.rs and falsification_crux_c_34.rs, the same on origin/main). NOT HERE: apr qa''s tensor_contract gate still reads the whole GGUF onto the heap (GgufReader::from_file). That is WHOLE-DATA in the ledger, 19.36 GB RssAnon on the 30B, filed as #3790.'
