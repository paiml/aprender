  acceptance_criteria:
  - '[ ] Σ (`pv_contract::documents`, the one walk every extractor shares) also walks `crates/*/contracts` for every crate with a Cargo.toml.'
  - '[ ] A crate stem is emitted only if it is unique or byte-identical to another copy; otherwise it is refused by name (PV-DUP-001) and never unioned. The top-level contracts/ copy stays authoritative.'
  - '[ ] A binding that names a refused crate copy is refused by name, never resolved to the top-level node with different content (infra-83).'
  - '[ ] Refusals are printed by `pv extract` and gated by `pv lint` gate 8 against a new shrink-only baseline classified in check_baseline_ratchets.sh.'
