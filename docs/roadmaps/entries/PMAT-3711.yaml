  notes: 'SCOPE: crates/apr-cli/src/commands/output_verification.rs, golden_output.rs, qa_gguf.rs (one line: golden_gate_for passes cpu_only), and this fragment. THE DEFECT IS WORSE THAN THE TITLE. On main, a CUDA init or GPU generation error in validate_gpu_golden_output went to note_gpu_golden_skip (a verbose-only println) and returned Ok(None); the case then judged only the CPU answer and the gate said PASSED, "3 golden test cases passed", not SKIP. Sibling (cop ruling, folded in): run_golden_output_gate_runtime labelled every cuda build "GPU hybrid forward, #3090" and ignored InferenceResult::used_gpu, and the qwen35 GPU dispatch falls back to the CPU on ANY GPU failure (forward_qwen35::run_qwen35_generate_dispatch), so a broken GPU passed on the CPU''s answer with a GPU label. HOW IT IS MET. GpuGoldenLeg {Passed, WrongAnswer, Errored, NotRun(why)}: judge() maps an Err (CUDA init on device 0, or GPU generation) to Errored, and failure() makes Errored a gate FAIL naming the error ("... a broken GPU, not a skip (#3711): <error>"); WrongAnswer is the existing "GPU output failed (CPU passed)" FAIL. gpu_golden_not_run(cuda_feature, device, gguf) is the ONLY source of a skip and names which: "this build has no cuda feature" / "no CUDA device on this host" / "the dense GPU leg judges GGUF only"; the hybrid fail-safe arm is NotRun naming the runtime rung. The pass message names the leg: "(GPU leg judged on CUDA device 0)" or "(GPU leg SKIPPED: <why>)". Runtime rung: golden_output_runtime returns (text, used_gpu); runtime_golden_backend(used_gpu, gpu_not_run) names the backend the dispatch REPORTED, and fails when the GPU should have served (cuda build + device + an architecture the GPU runs, i.e. not cpu_only) and the dispatch reported CPU. cuda_device_present() is one probe for both rungs. CASE ROWS (crates/apr-cli golden_output_tests, cargo test -p apr-cli --lib golden_output_tests: 14 passed, 10 new): GPU generation error -> FAIL naming CUDA_ERROR_ILLEGAL_ADDRESS; CUDA init error -> FAIL naming CUDA_ERROR_OUT_OF_MEMORY; GPU wrong answer -> FAIL; GPU right answer (plain and with a think block) -> PASS, judged; no device -> SKIP naming it, not a failure; each skip names which and a cuda host+GGUF starts the leg; runtime: cuda build + no device -> labelled CPU, never GPU; runtime GPU fallback on a cuda host -> FAIL; runtime GPU served -> labelled GPU from the dispatch; architecture the GPU declines -> CPU pass saying why. MUTANTS, each RED: the error routed back to skip (Err -> NotRun) fails 2 rows (generation error, init error); Errored mapped to no failure fails the same 2; the runtime fallback labelled by intent ("GPU hybrid forward, #3090") fails runtime_gpu_fallback_on_a_cuda_host_fails_the_gate; a no-device run labelled GPU fails 2 runtime rows. LIVE, RTX 4090 sm_89, apr 0.69.0 built from this branch with --features cuda, apr qa --json --offline with the perf/parity gates skipped (the ladder''s flags): qwen2.5-1.5b-instruct-q4_k_m rc 0 "3 golden test cases passed (GPU leg judged on CUDA device 0)"; the same with CUDA_VISIBLE_DEVICES= rc 0 "... (GPU leg SKIPPED: no CUDA device on this host)" [main said "3 golden test cases passed"]; Qwen3.5-0.8B-Q4_K_M rc 0 "... through the runtime entry point (served by GPU: the dispatch reported used_gpu=true)"; the same with no device rc 0 "served by CPU: the dispatch reported used_gpu=false, and the GPU was not expected (no CUDA device on this host)" [main, same run: "(GPU hybrid forward, #3090)" -- the label-by-intent, measured]; and ONE RUN under GPU memory contention from another session: Qwen3.5-0.8B rc 5 FAIL "the GPU should have served this model ... fell back ... A broken GPU, not a pass (#3711)" with stderr "GPU (CUDA) qwen35 path rejected, falling back to CPU: ... CUDA_ERROR_OUT_OF_MEMORY" -- exactly the run main would have passed as GPU. FOUND, NOT CAUSED HERE: qwen2.5-coder-0.5b-instruct-q4_k_m on the RTX 4090 fails the golden gate on BOTH main and this branch, identically: "GPU output failed (CPU passed): golden_output_gpu: gibberish (fragment \"```\\n\" repeats 3+ times)". Reported to the cop for the 0.69.1 Q4_K CUDA rule. DONE_WHEN 3: scripts/model_ladder.sh (qa_row gate()) and scripts/check_model_ladder.sh both require golden_output passed and not skipped, so an Errored GPU leg (passed:false) turns the rung RED with no ladder change; the red-golden case fixture already pins that path. The re-measure of lambda + gx10 with the 0.69.1 binary is the train''s T-2 step and is NOT done here -- this PR is Refs #3711, not Closes. clippy -p apr-cli --lib -D warnings (default features) rc 0; --features cuda: apr-cli has no clippy findings (the -D warnings run stops in aprender-compute on a pre-existing unused GemmOp import, same on main). cargo fmt --all -- --check rc 0.'
