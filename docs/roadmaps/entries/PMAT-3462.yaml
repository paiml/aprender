  - 'THE SCOPE, recorded on the issue (comment 2026-09-21T16:55:59Z, "Scope of the #3462 fix, recorded here so a reviewer can see it"; the allowlist item is the cop''''s ruling), verbatim: "1. **The argument allowlist is IN SCOPE.** The cop (aprender-04) ruled, verbatim: *"The cascade-publish.sh argument allowlist is APPROVED and folds into #3462: ''any unrecognized argument = publish'' is exactly the kind of trap a release script must not have, and a typo exiting 2 before any upload is right. Add a row plus a mutant."* Deleting `--tier` made this live: after the change, an old caller passing `--tier 1` would otherwise fall through to publishing all 74 crates.
2. **`scripts/release/publish-order.txt` IS the hand-written order this issue says to delete, a second copy of it.** `publish_strict.sh`, the strict one-crate-at-a-time cascade, read a committed snapshot of the order, derived once at 0.68.1. "Derive the order from `cargo metadata` … delete the hand-written tiers" applies to it just as it does to `TIERS[]`: a snapshot drifts with the dependency graph, and `publish_strict.sh`''s own topological re-proof (kept) would then stop the train at T-4. It now reads the same `cascade_universe.py --order` at the tag, and the snapshot is deleted.
3. **`check_publishable_deps_publishable.sh`''s advice** told people to "add it to scripts/cascade-publish.sh ahead of its dependents", which means editing the table this issue deletes. It now says the order is derived."'
