  notes: 'REWORK of the receipted 2bae0a296. The cop left 2bae0a296 out of release/0.69.1-batch-1 on a semantic conflict with main a9502d992: it deleted publish-order.txt, which main''s #3696 and infra#898 read, and its publish_strict.sh rewrite reintroduced a literal 74 that #3657 had removed. The rework is a new branch off origin/main a9502d992, and the quorum base is a9502d992. The ruling and infra-3c''s agreement (option A) are quoted verbatim above, from comment 5765673926. SCOPE: scripts/lib/cascade_universe.py, scripts/cascade-publish.sh, scripts/check_cascade_covers_all_crates.sh, scripts/check_publishable_deps_publishable.sh (one message), scripts/release/publish-order.txt (regenerated), scripts/release/publish_strict.sh (its header comment only), Makefile (a `publish-order` target), and this fragment. KEPT FROM 2bae0a296, byte for byte in those four files: cascade_universe.py --order (a topological order by Kahn''s algorithm, ties broken by (workspace, name), facades last; a cycle or a root crate that depends on a facade exits 2) and --edges; cascade-publish.sh''s TIERS[1..14] removed, with ORDER read from --order --names, FACADES read from the workspace column, the MODE allowlist (no argument | --check | --order-check | --print-order; --tier exits 2 naming #3462; anything else exits 2, "Nothing was published") and --print-order; check_cascade_covers_all_crates.sh R0 vacuity, R1 coverage, R2 no ghosts or duplicates, R3 every must-precede edge points earlier, R4 facade upstreams parsed from the manifests as a second instrument, R5 the MODE allowlist extracted and run alone, with a catch-all-deleted mutant. DROPPED FROM 2bae0a296: the deletion of publish-order.txt, and the publish_strict.sh rewrite. Main''s #3657 publish_strict.sh stands: it walks publish-order.txt with #3696''s blank-line refusal, #3657''s set equality with N = the universe''s size (never a literal) and its topological re-proof. Only its header, which still said "in the tag''s own TIERS order", now names the file. NEW, per option (A): cascade_universe.py --order --names --root-only prints the ROOT workspace''s crates in publish order, which is publish-order.txt byte for byte. The facades version independently; publish_strict.sh appends them, and the infra#898 sensor must not wait on them. `make publish-order` runs that command, and publish-order.txt is regenerated by it (a second run changes nothing): the same 71 crates as main''s file (a set diff is empty), in the derived order, a 27-line reorder. Main''s order was ALSO topological (publish_strict.sh re-proves it at T-4); it was derived once with different tie-breaks, and a snapshot is exactly what drifts. R6 in check_cascade_covers_all_crates.sh: the committed file must equal the derived root order line for line (cmp: set AND order), and every line must match ^[a-z0-9_-]+$, with no blank line and no comment (infra-3c''s constraint 1), so a file the sensor would refuse by name is RED here first. Constraint 2 (only crates that publish) holds by construction: the universe excludes publish = false, and R6 makes an extra line RED. Constraint 3 (the file at the tag): the file stays at its path and CI runs R6 on every PR. cascade-publish.sh also refuses at the tag (exit 1, "Nothing was published", before any network call) when the file is not the derived root order, so the sensor can never judge a set different from the one the cascade uploads. --print-order still prints the derivation, so the guard can name the difference. SELF-TEST, 26 rows: rows 1-11 as before, then 12a the control (the file equal to the derivation), 12b the same set reordered, 12c a crate missing, 12d an extra crate (a facade or a publish = false one), 12e a blank line, 12f a comment line, 12g an uppercase name, and 13, a mutant weakening R6 to a set comparison (sorted), which must ACCEPT 12b''s reordered file and so turn 12b RED. MEASURED at this commit: `bash scripts/check_cascade_covers_all_crates.sh --self-test` "SELF-TEST PASSED (26/26)"; the real check gives R1 74, R2, R3 over 178 edges, R4 provable-contracts #72 after aprender-contracts #4 and provable-contracts-macros #74 after aprender-contracts-macros #3, and "ok R6 publish-order.txt IS the derived root order (71 crates, same set, same order)", then PASS. Before the regeneration, R6 FAILed on main''s file ("differs from the derived root order -- regenerate it"); both refusals name `make publish-order`. `bash scripts/cascade-publish.sh --print-order` gives 74 ORDER lines; `--chek` gives rc 2, "Nothing was published". Related guards at this commit: check_release_scripts_derive_identity PASS (self-test 23 rows), check_publishable_deps_publishable PASS, check_bashrs_gate "PASS 366 file(s) … 0 SEC/DET/IDEM errors", check_shell_lint_ratchet, check_guards_are_wired and check_no_pipe_into_grep_q all PASS, check_cascade_clean_room_gate PASS, check_facade_order_gate rc 0. NOT RUN: a real publish. The 0.69.1 T-4 cascade is that measurement, hence Refs #3462.'
