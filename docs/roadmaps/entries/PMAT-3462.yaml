  notes: 'Release-tooling lane (cop, aprender-04), on the 0.69.1 release path. The cop''s order: after #3544(a)+(e), which folded into #3731, ahead of #3731. 0.69.1 publishes 74 crates through this cascade, and a T-4 stop is the most expensive place to stop a train. Its own branch off main 225b2a9ab: none of these files is in the #3699/#3708/#3717 stack. SCOPE: scripts/lib/cascade_universe.py, scripts/cascade-publish.sh, scripts/check_cascade_covers_all_crates.sh, scripts/release/publish_strict.sh, the deleted scripts/release/publish-order.txt, one message in scripts/check_publishable_deps_publishable.sh, and this fragment. HOW IT IS MET. DERIVE: cascade_universe.py gains --order, the same rows in a TOPOLOGICAL publish order. Crate B precedes crate A when A depends on B through a normal or build dep, or through a VERSIONED dev-dep: cargo keeps that in the published manifest and resolves it on the registry (PMAT-955). A path-only dev-dep (req "*") is stripped and orders nothing. It uses Kahn''s algorithm with ties broken by (workspace, name), so the order is deterministic and the facades (crates/facades) land last. A root crate depending on a facade, or a cycle, is exit 2 naming the crates: no order exists, and pretending one does is the defect. It also gains --edges ("crate\tdep" for every must-precede edge inside the universe). DELETE THE HAND-WRITTEN TIERS: cascade-publish.sh''''s TIERS[1..14] table is gone. It reads ORDER from `cascade_universe.py --order --names` (refusing if that exits non-zero, or names a count other than the universe''''s) and FACADES from the universe''''s workspace column. The publish loop, --check (now labelled #i) and --order-check (the facades, still gated by facade_upstream_ready against the live index) all walk ORDER. A new `--print-order` prints "ORDER <crate>" lines and exits, with no network and no upload. `--tier N` exits 2 naming the change. publish_strict.sh (the strict one-crate-at-a-time cascade) reads the same derivation at the tag instead of scripts/release/publish-order.txt, a committed snapshot of it from 0.68.1. That file is deleted: a snapshot drifts with the graph, and publish_strict.sh''''s own topological re-proof (kept) would then stop the train at T-4. Nothing else references it. ASSERT TOPOLOGICAL, WITH A MUTATION ROW: check_cascade_covers_all_crates.sh is rewritten to judge the sequence cascade-publish.sh ACTUALLY WALKS (`--print-order`), against the universe (`--names`) and the edge set (`--edges`). R0: vacuity, meaning an empty universe, edge set or sequence is RED. R1: coverage. R2: no ghosts, no duplicates. R3: every must-precede edge points strictly EARLIER. R4: every facade whose manifest pins a registry-resolved `upstream`, parsed from the manifest by sed independently of the metadata the order is derived from, has that edge in the edge set AND publishes after it. That is a second instrument, so an edge set blind to it cannot pass R3 alone. SELF-TEST, 11 rows: row 1 is the CONTROL (a complete dependency order passes); row 2 is THE MUTATION ROW the issue asks for (the same names with two DEPENDENT crates swapped, top before mid -> RED, "top (#3) needs mid (#4)"); row 3, a crate before its VERSIONED dev-dep -> RED; row 4, missing (R1); row 5, a ghost; row 6, a duplicate; row 7, a facade before its upstream; row 8, an edge set blind to a facade upstream -> RED by R4 alone; rows 9a/9b/9c, the three vacuities. ci.yml:1970 runs --self-test and ci.yml:1972 runs the real check, so both are wired as before. MEASURED at this commit: `python3 scripts/lib/cascade_universe.py --order --names .` rc 0, 74 crates (71 root, the 3 facades last); `--edges`, 178 must-precede edges; `bash scripts/cascade-publish.sh --print-order` gives 74 ORDER lines; `bash scripts/check_cascade_covers_all_crates.sh --self-test` "SELF-TEST PASSED (18/18)"; the real check "PASS the cascade walks every publishable crate, in dependency order" (R3 over 178 edges; R4 provable-contracts #72 after aprender-contracts #4, provable-contracts-macros #74 after aprender-contracts-macros #3). THE DEFECT, REPRODUCED ON THE REAL TREE: origin/main''''s TIERS[1..14], flattened in the order the old loop walked it (74 names, full coverage), fed to the SAME run_rules against the real universe and edges, gives R1 ok, R2 ok, R3 FAIL with 49 violations, e.g. "apr-cli (#39) needs aprender-contracts-cli (#70)". The 49 are the issue''''s class: at 225b2a9ab, 44 cross-tier non-dev pairs, 1 cross-tier versioned dev-dep, and same-tier pairs walked in the wrong word order. The issue counted 47 cross-tier pairs at v0.68.1. The same edges measured publish-order.txt at 0 violations: it was correct, just a snapshot. FOUND WHILE HERE, and fixed in the same file: cascade-publish.sh fell through to the PUBLISH LOOP on any argument it did not recognize, so a typo (`--chek`) or the now-removed `--tier 1` would have started a real cascade. MODE is now an allowlist (no argument | --check | --order-check | --print-order; --tier names #3462); anything else exits 2, "Nothing was published", before any upload. Measured: `bash scripts/cascade-publish.sh --chek` rc 2 with that line. The cop approved it into #3462 and asked for a row and a mutant. R5 in the guard''s self-test EXTRACTS the MODE allowlist block from the real cascade-publish.sh and runs it on its own, never the whole script, which would upload if the allowlist regressed. Rows 10a-10f: an unknown argument exits 2 "Nothing was published"; `--tier` exits 2 naming #3462; no argument, --check and --order-check fall through; --print-order prints ORDER lines and stops. Row 11 is the MUTANT, the catch-all arm deleted: an unknown argument then falls through to the publish run (measured "FALLTHROUGH rc=0"), and row 10a''s check turns RED. The first run caught a harness bug of mine: the block was sourced before the shift, so it read its own path as MODE, and 10a and the mutant passed for the wrong reason until rows 10b-10f exposed it. check_publishable_deps_publishable.sh''''s advice ("add it to scripts/cascade-publish.sh ahead of its dependents") now says the order is derived. Related guards at this commit: check_cascade_clean_room_gate "PASS clean-room gate: every row held", check_facade_order_gate rc 0, check_publishable_deps_publishable "PASS", check_bashrs_gate "PASS 361 file(s) … 0 SEC/DET/IDEM errors", check_guards_are_wired, check_release_scripts_derive_identity and check_no_pipe_into_grep_q all PASS. NOT CHANGED: cascade-drain.sh still re-runs cascade-publish.sh for transients. With a topological order, pass 1 should publish every crate whose dependencies are live, so a deferral is a real failure or a transient, never the order working itself out. NOT RUN: a real publish. The 0.69.1 T-4 cascade is that measurement, hence Refs #3462.'
