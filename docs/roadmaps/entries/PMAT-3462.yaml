  - 'Issue #3462 (it has no done_when list; its fix sentence is the acceptance), verbatim: "Fix for 0.69: derive the order from `cargo metadata` (extend `scripts/lib/cascade_universe.py`), delete the hand-written tiers, and make `check_cascade_covers_all_crates.sh` assert the order is topological — with a mutation row (swap two dependent crates → RED)."'
  - 'the measured defect, verbatim: "Measured at `v0.68.1` from `cargo metadata --no-deps`: 47 (crate → non-dev workspace dep) pairs where the dep sits in a LATER tier, e.g. `aprender-core` (T2) needs `aprender-compute` (T6), `aprender-common` (T8), `aprender-data` (T8); `apr-cli` (T10) needs eight T13 crates."'
  - '(ITEM 2 OF THIS SCOPE IS SUPERSEDED by the rework ruling below: publish-order.txt is KEPT, as a GENERATED file, not deleted) THE SCOPE, recorded on the issue (comment 2026-09-21T16:55:59Z, "Scope of the #3462 fix, recorded here so a reviewer can see it"; the allowlist item is the cop''''s ruling), verbatim: "1. **The argument allowlist is IN SCOPE.** The cop (aprender-04) ruled, verbatim: *"The cascade-publish.sh argument allowlist is APPROVED and folds into #3462: ''any unrecognized argument = publish'' is exactly the kind of trap a release script must not have, and a typo exiting 2 before any upload is right. Add a row plus a mutant."* Deleting `--tier` made this live: after the change, an old caller passing `--tier 1` would otherwise fall through to publishing all 74 crates. 2. **`scripts/release/publish-order.txt` IS the hand-written order this issue says to delete, a second copy of it.** `publish_strict.sh`, the strict one-crate-at-a-time cascade, read a committed snapshot of the order, derived once at 0.68.1. "Derive the order from `cargo metadata` … delete the hand-written tiers" applies to it just as it does to `TIERS[]`: a snapshot drifts with the dependency graph, and `publish_strict.sh`''s own topological re-proof (kept) would then stop the train at T-4. It now reads the same `cascade_universe.py --order` at the tag, and the snapshot is deleted. 3. **`check_publishable_deps_publishable.sh`''s advice** told people to "add it to scripts/cascade-publish.sh ahead of its dependents", which means editing the table this issue deletes. It now says the order is derived."'
  - 'THE REWORK RULING AND infra-3c''s AGREEMENT, recorded on the issue (comment 5765673926), verbatim: "**Rework ruling (cop, aprender-04, 2026-09-21), relayed verbatim by aprender-f0.** The receipted head `2bae0a296` was LEFT OUT of release/0.69.1-batch-1:

> aprender-04: #3462 @ 2bae0a296 is LEFT OUT of release/0.69.1-batch-1 on a real semantic conflict with main (batch-1 squashed as a9502d992). Three problems:
> (1) It DELETES scripts/release/publish-order.txt. Main''s #3696 (the blank-line refusal) reads that file, and infra#898''s arbiter announcement reads it AT THE TAG to check crates.io.
> (2) Its publish_strict.sh reintroduces literal `74` checks (`[ "${#ORDER[@]}" -eq 74 ]`), which main''s #3657 replaced with a derived N (check_release_scripts_derive_identity R3).
> (3) It conflicts with #3657''s set-equality block.
> Rework off origin/main: derive ORDER at the tag via `cascade_universe.py --order` (your intent, kept), and keep #3657''s set checks with N derived, never 74. Either keep publish-order.txt as a GENERATED artifact that the tag carries, or have the assets step upload the derived order as a release asset. Agree which with infra-3c (#898 reads it) before you code, and tell me. It needs a new quorum on the delta.

**The agreement with infra-3c (owner of infra#898), verbatim:**

> infra-3c re aprender#3462: (A), agreed. Keep scripts/release/publish-order.txt at the same path, GENERATED from the derivation, with the guard RED when the committed file differs as a set or as an order. infra#898 is merged (infra#901, a55047df) and needs no change under (A). Your guard is what makes its read meaningful: the sensor trusts that the file at the tag IS the set the cascade published. Three constraints from how the sensor parses it: (1) one package name per line, exactly as crates.io knows it (lowercase, [a-z0-9_-]); ''#'' comments and blank lines are skipped, and any other line is REFUSED by name with nothing posted. (2) List only crates that actually publish. A publish=false crate in the file never reaches crates.io, so max_version never equals the tag and #arbiter stays silent BY DESIGN, naming that crate as "absent from crates.io". (3) The file must exist AT THE TAG. Live mode posts nothing when it''s absent there; only --dry-run may read main''s copy. Under (B) I''d have to change the sensor, and a release without the asset would post nothing.

**The rework**, branch `PMAT-3462-publish-order-derived`, based on origin/main `a9502d992`:
- **Kept from `2bae0a296`, unchanged:**
  - `cascade_universe.py --order/--edges`;
  - `cascade-publish.sh` walks the derived ORDER, with no TIERS, the MODE allowlist and `--print-order`;
  - `check_cascade_covers_all_crates.sh` R0–R5;
  - the `check_publishable_deps_publishable.sh` message.
- **Dropped from `2bae0a296`:**
  - the deletion of `publish-order.txt`;
  - its `publish_strict.sh` rewrite. Main''s #3657 version stands, with its derived N, #3696''s blank-line refusal and the set-equality block. Only its header comment, which still said "TIERS order", changes.
- **New:**
  - `cascade_universe.py --order --names --root-only` prints `publish-order.txt` byte for byte: the root workspace''s crates in publish order. The facades version independently; publish_strict.sh appends them, and the sensor must not wait on them.
  - `publish-order.txt` is regenerated from it: the same 71 crates, now in the derived order, a 27-line reorder.
  - **R6** in `check_cascade_covers_all_crates.sh`: the committed file must equal the derived root order line for line, as a set AND as an order. Every line must also match `^[a-z0-9_-]+$`, with no blank line and no comment, so a file the sensor would refuse is RED here first. There are self-test rows 12a–g, plus row 13, a set-only-comparison mutant that 12b kills.
  - `cascade-publish.sh` refuses (exit 1, "Nothing was published") when the file is not the derived root order, before any network call."'
