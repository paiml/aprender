  acceptance_criteria:
  - "No test in execute_python_test_diagnostics_tests passes a wall-clock budget: the behaviour tests (success, assertion failure, harness invariant, verbose stderr, missing python3) run the child to its own exit through an injected ExecBudget that never expires, so a loaded host cannot turn them red. The FALSIFY-HEH-001..004 test names are unchanged."
  - "The timeout path is tested deterministically: an injected budget that expires after N polls kills a program that never exits and reports timed_out=true, exit_code=None; the production entry point (execute_python_test_with_diagnostics) keeps its wall-clock deadline and is tested with a zero-second budget on a program that never exits, asserting no elapsed time."
  - "The regression the old 5/10 s deadline stood in for — a stderr pipe that is not drained — is caught by a count, not a clock: stderr is drained on its own thread while the child runs, and a test asserts the drain consumes all of a 1 MiB stream while keeping the 64 KiB cap. verbose_stderr_does_not_deadlock_on_success writes 256 KiB (4x the pipe buffer)."
  - "Mutants: the drain reverted to a single read turns the byte-count test RED; the kill path not recording timed_out turns the expired-budget test RED; exit codes not propagated turns assertion_failure_reports_nonzero_and_traceback RED."
  - "contracts/apr-eval-humaneval-harness-invariant-v1.yaml records the drain obligation and the new falsifiers; pv validate passes."
