  notes: |
    Issue #3788, VERBATIM (root cause): "`execute_python_test_with_diagnostics(program, 5)` returns `exit_code: None` only when the child is killed by its timeout, or when the spawn fails. The test gives `python3 -c 'assert 1 == 2'` a 5-second wall-clock budget. On a host at load ~50, interpreter start-up alone can exceed that, so the test asserts on the scheduler rather than on the code."

    Cop triage on #3788, VERBATIM: "**0.69.1**. It isn't a flake to tolerate: a wall-clock assertion in a lib test that runs under the required `workspace-test` violates the standing rule (no wall-clock assertion in a required check; 4 have failed before). Under load ~50 it will turn batch CI red at random. Fix: replace the elapsed-time bound with a behavioural assertion (count of work done, or a deterministic budget via an injected clock), or move the timing measurement to a non-required perf lane. Add a mutant proving the new assertion still catches the regression the timer was guarding. Owner: aprender-fc, after #3773."

    The issue's own fix direction (a 60 s timeout, or a timeout read as SKIP) is superseded by the cop's triage: a bigger wall-clock number is still a wall-clock assertion.
    Found while reading the code: the old "drain" was one `read` after the child exited, so a child writing more than a 64 KiB pipe buffer blocked until the deadline killed it — the deadline was the only thing standing between that bug and a hang. The fix makes the drain real (a thread reading to EOF) so the tests can drop the clock without trading a flake for a hang.
    Refs #3788 #3749 (where it was observed) and F-APR-EVAL-HUMANEVAL-HARNESS-INVARIANT-001.
