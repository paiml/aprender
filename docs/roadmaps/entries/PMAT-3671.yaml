  notes: 'Found by aprender-62 cross-inspecting the andon commit 984fc76a9 (PMAT-3670) in the 0.69 batch #3669; the cop ruled it a separate ticket for after the batch. HOW IT IS MET. `judge` captures pv''s own exit as `pvrc` (the parser still receives it, for its message) and the verdict `case` is keyed on the PAIR `<parser rc>:<pv rc>`: `2:2` is `UNMEASURED reason=pv-env` exit 0, unchanged; `2:*` is `FAIL runner=… reason=pv-no-verdict … pv exited <rc> … pv stderr: <first line>` to stderr, exit 1. The arms for parser rc 0 (PASS), 1 (FAIL) and other (judge-env) are unchanged, and the no-pin / no-binary / pin-mismatch / incapable branches return before pv runs, so they are untouched. RED is FAIL (exit 1), not ENV (exit 2): a panic caused by a contract in the tree is tree state. SIGNAL ROW. The case table uses SIGKILL (rc 137, `kill -KILL $$` in the stub), a real signal death that writes no core file on a runner; 134/139 are the same `2:*` arm, since the arm matches any pv rc but 2. MEASURED at this commit: `bash scripts/check_fleet_pv_shapes_gate.sh --self-test` 19/19 ok (was 15). The new rows are 13-15 (panic 101, SIGKILL 137, rc 1 with no output: each RED naming pv''s rc and stderr, never UNMEASURED) and 16 (mutant `2:2)` -> `2:*)`, i.e. pv-env keyed on the parser alone: the panic stub goes back to `UNMEASURED reason=pv-env`, exit 0, so the panic row discriminates). BEFORE THE FIX, the same self-test with the new rows: rows 13-15 FAIL with "UNMEASURED runner=probe-runner reason=pv-env … ENV no JSON verdict (rc=101) … panicked", rc 0, reproducing the issue''s table. ALSO FIXED, same rows: the existing pv-env mutant (row 12) was VACUOUS. Its sed replaced the arm''s opening single quote with a double quote, so the mutant script was a bash syntax error (`bash -n` rc 2 at "line 146: syntax error near unexpected token `(`") and "exited non-zero" without reaching the arm it claimed to test. Both mutants now keep the arm''s text through a sed backreference, are refused unless `bash -n` passes, and assert the specific outcome (row 12: exit 2 and `ENV (rc=2)`; row 16: exit 0 and `UNMEASURED … reason=pv-env`). `--help` printed a hardcoded `sed -n 2,44p`, which cut the header off once it grew; it now prints the leading comment block, found by awk. `bashrs lint`: 0 errors (baseline 0). `bash scripts/guard_tree.sh --no-cargo`: 76 checks, 0 failed.'
