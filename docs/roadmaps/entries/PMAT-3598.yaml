  notes: 'ACCEPTANCE — QUOTED FROM gh#3598, not paraphrased. A quorum judges the diff against THIS text, and round 1 produced three findings that were all artifacts of my own loose restatement rather than of the code: a lane refused a change because my notes did not contain the done_when clause that asks for it, another held me to a test COUNT I had pinned, and a third to "every field is Option" which I had overstated. The fragment is the specification here; imprecision in it manufactures false findings. gh#3598 done_when, verbatim: (1) "apr run --json emits load_ms, h2d_ms, prefill_ms, decode_ms, tokens_out." (2) "Falsifier: the fields sum to within a stated tolerance of wall clock, and a planted delay in one stage moves that field and only that field. A timing row that cannot localise a planted delay is decoration." (3) "The JSON goes to one declared stream. Today Backend: goes to stderr and Completed in ... to stdout; a consumer cannot guess." (4) "The (cached) suffix on Completed in N s states what was cached or is removed — it currently prints on runs that demonstrably executed." gh#3542 adds: "Worth rewording in the same change." So the (cached) -> (model already local) rewording IS REQUESTED by done_when 4 and is not scope creep. (5) "Slow is allowed in 0.69; invisible is not. Landing this makes the 14 s honest." DESIGN RULES, stated precisely: every STAGE TIMING field (load_ms, h2d_ms, validate_ms, prefill_ms, decode_ms, wall_ms, unattributed_ms) is Option — absent means NOT MEASURED, never 0. tokens_out (usize) and backend (String) are METADATA, not timings, and are deliberately not Option. unattributed_ms = wall - sum(measured) is present whenever the books were closed, and both it and wall_ms are None on a report that never had close() called — an uninstrumented path must not read as a run that took no time and attributed all of it. validate_ref_ms and validate_probe_ms are INSIDE validate_ms and excluded from measured_sum_ms(), because double-counting drives the residual negative. Falsifier: APR_STAGE_DELAY_MS=<stage>:<ms> plants a delay and the report localises it to that stage, with a no-plant control that does not. Test COUNT is deliberately not pinned here — the cases must cover each planted stage, the no-plant control, the double-count exclusion, and the unclosed-report case; adding a case is not a deviation. Measured: validate_ms = 15.1s on qwen2.5-coder-0.5b, which answers gh#3602 item 2. STOP: do not report a stage as 0 when it was not instrumented.'
