  notes: 'SCOPE: scripts/release/publish_strict.sh, scripts/cascade-publish.sh (clean_room_gate gains an optional third argument, a pinned run id), scripts/check_cascade_clean_room_gate.sh (10 pinned rows), scripts/check_publish_strict_cleanroom.sh (new), contracts/publish-workspace-v1.yaml (PW-DOOR-005, FALSIFY-PUB-008). HOW IT IS MET: publish_strict.sh reads the recorded run id and loads clean_room_gate from the cascade script (the same extraction the existing guard uses), then calls it pinned to that one run. Pinned mode reads exactly that run through the runs API, refuses a run of another workflow, and never lists runs, so a green run elsewhere cannot stand in for a red recorded one. A missing, empty, non-numeric, unreadable, red or other-commit id stops the cascade before any upload. --plan is unchanged. MEASURED: check_publish_strict_cleanroom.sh runs the real publish_strict.sh against a fixture tag checkout and a stub gh and cargo. BEFORE (origin/main 645dc34101): 8 of 9 checks FAIL; the non-numeric, red, other-commit and unreadable ids all pass the door and stop later, on the B2-gpu id. AFTER: 9 of 9 hold; check_cascade_clean_room_gate.sh holds every row, including the 10 pinned ones. R5B ONE DOOR (2026-10-09): make publish uploaded with no clean-room, preflight or tag check; it now refuses unless PUBLISH_DRY_RUN is set, and its one cargo publish line carries --dry-run. scripts/stack_release.sh (bump, commit --no-verify, tag, push main, upload; called by nothing) is deleted. check_publish_strict_cleanroom.sh gains 6 rows: make publish refuses an upload, make publish still dry-runs, a 27-case table for the upload pattern, the scan sees both gated doors (positive control), and no other door in 550 tracked shell scripts, make files and root workflows. BEFORE (door rows pointed at origin/main af58dfccff): 3 FAIL (make publish ran a real cargo publish; Makefile:1434 and scripts/stack_release.sh:54 found). AFTER: every row holds. Mutations: a non-git root fails the positive control; dropping run: from the pattern fails 2 cases. Not in scope: apr mono publish (compiled only with the dev feature, cfg(feature = "dev") in commands_enum.rs, so no shipped apr has it; a release-built apr answers unrecognized subcommand mono. Its --dry-run is also a clap bool with default true, read from the code and not run) and the aprender-orchestrate stack releaser (a general tool for any crate dir with its own tag scheme). Row 4805 B5 (clean-room green before the tag) is not built here: it edits scripts/release, which resets the 0.71.0 streak.'
