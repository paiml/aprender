  notes: 'SCOPE: scripts/release/publish_strict.sh, scripts/cascade-publish.sh (clean_room_gate gains an optional third argument, a pinned run id), scripts/check_cascade_clean_room_gate.sh (10 pinned rows), scripts/check_publish_strict_cleanroom.sh (new), contracts/publish-workspace-v1.yaml (PW-DOOR-005, FALSIFY-PUB-008). HOW IT IS MET: publish_strict.sh reads the recorded run id and loads clean_room_gate from the cascade script (the same extraction the existing guard uses), then calls it pinned to that one run. Pinned mode reads exactly that run through the runs API, refuses a run of another workflow, and never lists runs, so a green run elsewhere cannot stand in for a red recorded one. A missing, empty, non-numeric, unreadable, red or other-commit id stops the cascade before any upload. --plan is unchanged. MEASURED: check_publish_strict_cleanroom.sh runs the real publish_strict.sh against a fixture tag checkout and a stub gh and cargo. BEFORE (origin/main 645dc34101): 8 of 9 checks FAIL; the non-numeric, red, other-commit and unreadable ids all pass the door and stop later, on the B2-gpu id. AFTER: 9 of 9 hold; check_cascade_clean_room_gate.sh holds every row, including the 10 pinned ones. R5B ONE DOOR (2026-10-09): make publish uploaded with no clean-room, preflight or tag check; it now refuses unless PUBLISH_DRY_RUN is set, and its one cargo publish line carries --dry-run. scripts/stack_release.sh (bump, commit --no-verify, tag, push main, upload; called by nothing) is deleted. check_publish_strict_cleanroom.sh gains 6 rows: make publish refuses an upload, make publish still dry-runs, a case table for the upload pattern, the scan sees each gated door''s one upload command and no second one (positive control), and no other door in the tracked shell scripts, make files, git hooks and root workflows, nor in any other tracked file with a shell shebang (557 files). BEFORE (door rows pointed at origin/main af58dfccff): 3 FAIL (make publish ran a real cargo publish; the Makefile publish recipe''s upload command, starting at Makefile:1397, and scripts/stack_release.sh:54 found). AFTER: every row holds. Mutations: a non-git root fails the positive control; dropping run: from the pattern fails 2 cases; a cargo publish line in a nested crates/x/Makefile fails no_other_door (the first scope listed only the root Makefile and passed it). Not in scope: apr mono publish (compiled only with the dev feature, cfg(feature = "dev") in commands_enum.rs, so no shipped apr has it; a release-built apr answers unrecognized subcommand mono. Its --dry-run is also a clap bool with default true, read from the code and not run) and the aprender-orchestrate stack releaser (a general tool for any crate dir with its own tag scheme). HARDENED after quorum q-4687door (approve 4-1, five findings answered on the new head): the scan read lines, not commands, so it missed wrappers (timeout, command, nohup, nice, sudo, xargs, sh -c), $CARGO spellings, cargo global flags (-q, --config), a --dry-run elsewhere on the line (cargo publish -p x && echo --dry-run), backslash continuations, and a second upload inside a gated file or this checker. Now each file is read as the shell runs it (continuations joined, comment lines dropped, split into commands at ; && || and |), --dry-run is judged per command, each gated file must hold exactly its one upload, and this file is scanned without its case table. The case table grew from 27 to 57 cases, one per finding spelling; it passes under gawk, mawk and busybox awk. Mutations: planted timeout/&&-chain/continuation/$CARGO doors, a second upload in cascade-publish.sh and one in this checker all pass the old scanner (rc 0) and fail the new one; one in a nested crates/x/.githooks/pre-commit fails no_other_door; dropping run: fails 2 cases; dropping the command split fails 6. ROUND 2 (q-4687door2 on d38b5cdc26, approve 4-1, plant caught 5/5) named one gap: extensionless shell scripts were not read. Now any tracked file that names publish and starts with a sh/bash/dash/ksh/zsh/bats shebang is scanned (14-case shebang table). That found the v0.68.1 audit record docs/audits/release/v0.68.1/publish_strict.as-run.sh.txt, executable, cited by nothing, which uploads on a non-empty run-id file alone; it is kept as evidence and allowed by file and command, like release_ready.sh''s stand-in, and each allowed entry must still be seen (the positive control for the shebang scope). Red runs: an extensionless scripts/zz-tag door, a door in tests/pr-review.bats and a second upload in the audit record pass the d38b5cdc26 scanner (rc 0) and fail this one; dropping the shebang scope fails the positive control; dropping bats fails 1 shebang case. Python and Rust are not scanned, and the contract says so: no tracked .py calls cargo publish (comments and docstrings only), and the two Rust callers are named above. Row 4805 B5 (clean-room green before the tag) is not built here: it edits scripts/release, which resets the 0.71.0 streak. ROUND 3 (q-4687door3 on 35f0898e92) is void: approve 4-0 with the plant caught by 4 of 5 lanes, but its fact sheet said 0 tracked justfiles, and there are 15 (none names publish). The scan now also reads justfiles; counts cargo ws or workspaces publish, cargo release, cargo smart-release, those tools run by their own name, and cargo with a subcommand from a variable as uploads; reads eval, find -exec and parallel; and a new row fails on a tracked cargo config alias that uploads (11 configs, 24 aliases, none does). A scope case table (19 paths in, 8 out) pins the file kinds, so a kind dropped from the scope fails even where no door exists today. Red runs: nine planted doors of the new kinds pass the 35f0898e92 scanner (rc 0) and fail this one, each named; dropping the justfile names, the variable-subcommand branch, the alias table or the cargo config pathspec each fails the branch (rc 1); af58dfccff still fails the same 2 rows with the same 3 findings. Now 21 rows, 83 door cases, 572 files. ROUND 4 (q-4687door4 on 263d2d58de, approve 3-1) is void because the code changed: the dissenting lane named three gaps, and all three are closed. A lone & was not a command separator, so cargo publish -p x & echo --dry-run passed; a line is now also split at a lone & (not the & of >& <& &>). An upload held in a variable was missed (UP = cargo publish in a Makefile, X="cargo publish", cmd=(cargo publish)); a shell or make variable whose value starts with an upload is now a door where it is stored, and so is any variable run as the command with an upload after it ($C publish, $(TOOL) release), since it may hold cargo. A failed git grep for the shebang files read as no file; it now fails door_scan_shebang_scope. The same finding named the || true on the scan read. mawk and busybox awk stop at the first file they cannot open, and gawk stops at a missing one, so there the old scan went red only because a positive control, the audit record, is read last. But gawk skips a tracked path that is a directory with only a warning, and the old scan then passed (rc 0) with that file unread. The read is now checked on its own: a non-zero exit or any stderr fails no_other_door, which quotes the error awk printed. Red runs: a fixture checkout with a tracked script replaced by a directory passes the acbc5f550b scanner under gawk (rc 0) and fails this one under all three awks; a mutant without the read check passes it under gawk. Also closed: case arms (a case pattern x) and a one-line case ... in x)), cargo by a path or quoted, $$CARGO, $(command -v cargo), <( and >(, make shell, and --dry-run only as a word of its own (${DRY:+--dry-run} and --dry-run-later no longer hide an upload). A command that starts with "$APR" or "$APR_BIN", the pinned apr binary, is let through by that name only: its publish sends a model to Hugging Face (scripts/dispatch-phase6-publish.sh, scripts/ship-two-001/ex-04-upload-hf.sh); "$APRX" and $APR_BIN2 still count. A braced ${...} must close, so X="${2:-stack release}" is not a variable run with release after it. Red runs: nine planted doors of these kinds pass the 263d2d58de scanner (rc 0) and fail this one, each named; 17 one-change mutants each fail a named row (rc 1) and a no-op control passes; origin/main 845004a121 fails the same 2 rows with the same 3 findings (make publish ran an upload, Makefile:1397, scripts/stack_release.sh:54) and nothing else. This entry was not valid YAML from d38b5cdc26 on (unescaped apostrophes in these notes), which the aggregate check cannot see because it copies entries verbatim; fixed, and roadmap.yaml parses again. Now 21 rows, 143 door cases, 572 files, under gawk, mawk and busybox awk. BEFORE ROUND 5 (found by the author while measuring its fact sheet): ci/sections.yml holds the job bodies the fat CI jobs run (202 run: steps), fat_driver.py also runs the vendored ci/vendor/sovereign-ci.yml, and a section runs each of the 102 ci/explicit-test-commands.d/*.cmd lines. None of them was read, and neither was a composite action under .github/actions (there are none today). All are read now, and the scope case table pins them (24 paths in, 10 out). None holds an upload today. Red runs: four planted uploads, one in each new kind, pass the 86fe6cf4a3 scanner (rc 0) and fail this one, each named, under all three awks; dropping the ci/ names or the composite action names from NAMES fails scope_case_table. Now 21 rows, 143 door cases, 676 files, under gawk, mawk and busybox awk; 19 one-change mutants each fail a named row, and a no-op control passes. ROUND 5 (q-4687door5 on 726f30428a, approve 3-1, plant caught by 4 of 5 lanes) is void because the code changed: the dissenting lane named two gaps, and both are closed. The shell drops quotes and backslashes inside a word, so cargo "publish", cargo ''publish'', cargo pub""lish and cargo \publish all upload, and the scan missed them. Each command is now also matched with its quotes removed ($''...'' and $"..." too) and a backslash before a letter, digit, _ or - dropped; it is still printed, and judged for --dry-run and the apr name, as written. An escaped backtick keeps its backslash, so echo "\`cargo publish\`" is not a door. The apr name exemption could be filled with cargo (APR=cargo, then "$APR" publish); setting APR or APR_BIN to any cargo spelling is now a door where it is set. 73 tracked files set APR or APR_BIN, and apart from this checker''s case rows none sets it to cargo. Also closed: a quoted cargo path with spaces. Not scanned: cargo carried into APR through another variable, which is run-time data. Red runs: seven planted doors (five quoted spellings, a quoted path with spaces and APR=cargo); the 726f30428a scanner names one (cargo $''publish'', read as a subcommand from a variable) and this one names all seven, under all three awks; 27 one-change mutants each fail a named row and a no-op control passes; origin/main 845004a121 fails the same 2 rows with the same 3 findings (no_other_door prints one line per door found). The 21 tracked Dockerfiles, pre-commit configs and GitLab CI files name no publish. Now 21 rows, 176 door cases, 676 files. ROUND 6 (q-4687door6 on 50f444abb8, approve 3-1, plant caught by 4 of 5 lanes) is void because the code changed: the dissenting lane named four gaps, and all four are closed. A wrapper by a path (/usr/bin/env cargo publish) was not read; wrappers now count by name or by path, doas, rustup run and others were added, and cargo counts after any word of a command, so a wrapper the scan does not know (retry 3 cargo publish, my_wrapper "cargo" publish) counts too, unless cargo sits in a quoted string with a space in it, a message: echo "cargo publish failed" is not a door, and echo cargo publish is. The shebang scope read only files that name publish, so cargo pub""lish in an extensionless script was never read; every tracked file with a shell shebang is read now (3 today), and a 5-file scope table pins it. An alias given on the command line or in the environment (cargo --config alias.p=publish, CARGO_ALIAS_P=publish) was not judged; both are doors now, and the alias row reads every tracked TOML file (350), since cargo --config <path> reads any; a 10-path table pins that scope. A command word built on the line ($''\x63argo'', $(printf cargo), `printf cargo`) and sh -c spelled -ec, --command or nix-shell --run are read. Added by the author: release-plz release, a PUT to the crates.io API, and a crates.io token handed to a CI step (CARGO_REGISTRY_TOKEN as an env key, a cargo or crates token secret, crates-io-auth-action), since no gated door runs in CI. The same lane noted that the pass line counted 676 files as 674 by name plus 2 by shebang, without the checker; it now counts the checker too. Red runs: 23 planted doors in a fixture checkout (19 spellings in one script, an extensionless cargo release, a TOML alias, a token env key and the auth action in a workflow) pass the 50f444abb8 scanner (rc 0) and fail this one, each named; 50 one-change mutants each fail a named row and a no-op control passes; all under gawk, mawk and busybox awk, with the same FAIL lines. origin/main 845004a121 fails the same 2 rows with the same 3 findings. Now 23 rows, 225 door cases, 678 files. ROUND 7 (q-4687door7 on 231c781319, approve 3-1, plant caught by 4 of 5 lanes) is void because the code changed: the dissenting lane named two gaps, and both are closed. An upload inside a substitution on a command that is let through got past: "$APR" publish "$(cargo publish -p y)", and cargo publish --dry-run -p x "$(cargo publish -p y)". The body of every $(...), <(...), >(...) and `...`, nested ones too, is now a command of its own, so the outer command lets nothing inside through; X=$( (cargo publish -p x) ), which no rule caught before, is a door now. Make files by other names (release.mak, Makefile.release, x.make) were not read; Makefile.*, *.mak and *.make are read now (none is tracked today). With bodies read on their own, the substitution openers in the command pattern and a backtick at a command start changed no verdict, so they were removed, and the unquoted pass now drops every backslash (more than the shell drops, never fewer). Red runs: 8 planted doors in a fixture checkout of 231c781319 (five substitution forms, release.mak, tools/up.make, a Makefile.release) pass the 231c781319 scanner (rc 0) and fail this one, each named; 57 one-change mutants each fail a named row and two no-op controls pass; all under gawk, mawk and busybox awk, with the same FAIL lines. origin/main 845004a121 fails the same 2 rows with the same 3 findings. Now 23 rows, 235 door cases, 678 files.'
