  notes: 'SCOPE (issue title, amended by the cop from a8''s trace): SafeTensors run and every AprTransformer caller never sampled. `apr run` on .apr already sampled (run_apr_quantized_cpu_inference -> OwnedQuantizedModel::generate_with_cache, the GGUF sampler), which is measured below. ONE SHARED SAMPLER (done_when 1): new `realizar::sampling` with `draw(logits, temperature, top_k, top_p, r)` (the body moved verbatim from OwnedQuantizedModel::sample_topk_with_draw, which now delegates), `draw_seeded(.., &mut StdRng)`, `is_greedy(temperature, top_k)` (temperature 0 or top_k 1; top_k 0 disables the filter) and `DEFAULT_SEED` (42). Greedy stays each loop''s OWN argmax because the loops break ties differently (max_by keeps the last maximum, gguf ops::argmax the first), so greedy output is byte-identical. Routed through it: (a) AprTransformer `sample_from_logits` (apr_transformer/generation.rs), which took the ARGMAX of the top-k/top-p survivors and so could never draw. It is now seeded from a new `GenerateConfig.seed`, and `top_k_top_p_survivors` is deleted (the filter lives in the shared draw, pinned by the GGUF top-k/top-p rows). (b) The SafeTensors `apr run` CPU loop, `greedy_decode_with_transformer` -> `decode_with_transformer(transformer, input, &InferenceConfig)` (plain and sharded). It never read temperature/top_k/top_p/seed. (c) GpuModel `ops::sample_topk` and `kv_forward_block::sample_topk`: both sorted by probability and returned the first entry, the argmax. They are now seeded from a new `GpuGenerateConfig.seed` (chat takes the OpenAI `seed`). GREEDY-ONLY DECODERS: a sampled request no longer silently takes them. The SafeTensors CUDA `generate(input, max_tokens, eos_id)` and both wgpu loops (GGUF `try_wgpu_generate`, `try_apr_wgpu_inference`, each an inline argmax) run only when `is_greedy`; otherwise a notice is printed and the CPU loop that draws runs. The GpuModel `/v1/completions` handler hardcoded `top_k: 1`, so a request temperature did nothing; it now uses the CPU completions handlers'' rule (1 at temperature 0, else 40). #3754''s DEFAULT_TOP_K replaces that literal when both land. DEFAULT CHANGE: `apr_transformer::GenerateConfig::default()` temperature 1.0 -> 0.0. With the old argmax sampler every config, this default included, decoded greedily, so default callers (bench, serve /generate with no temperature) keep their output. A default of 1.0 with a real draw would have randomised them. Five rows that pinned 1.0 were updated with that reason. EXISTING ROWS THAT PINNED THE DEFECT: PMAT-820''s `neutral_params_byte_identical_to_legacy` and `top_k_ge_vocab_is_neutral` asserted that sampling at T>0 returned the argmax. They are replaced by sampler_tests (draws off the argmax; same seed reproduces, another seed changes; T0/top-k 1 is the argmax; top-k 2 bounds the draw). TESTS: sampling::tests (is_greedy table, the CDF walk, seeded reproducibility); apr_transformer::generation::sampler_tests (4); infer::tests_sampling_3760 through `run_inference` on the tiny SafeTensors fixture (sampled != greedy for one of 8 seeds, same seed identical and another seed differs, top-k 1 / T0 greedy on 4 seeds) plus `wgpu_serves_greedy_requests_only`; gpu::scheduler test_sample_topk_draws_off_the_argmax_and_is_seeded. MUTANTS, each run and each RED: AprTransformer sampler back to argmax (3 red); SafeTensors loop always greedy (2); SafeTensors seed ignored (1); GpuModel kv sampler back to argmax (1). MEASURED (done_when 2) on lambda, CPU, qwen2.5-coder-0.5b-instruct .apr and .safetensors, pinned via scripts/apr_bin.sh, 24 tokens. main `apr 0.69.0 (a9502d992)`: .safetensors sampled != greedy NO, seed 99 != 1234 NO (the defect); .apr YES/YES. Branch `(8760145f5)`: both formats sampled != greedy YES, same seed x2 IDENTICAL, seed 99 != 1234 YES, --top-k 1 == greedy YES, and greedy tokens byte-identical to main on both. wgpu: without --no-gpu on lambda (Qwen3-1.7B) main tries wgpu (Vulkan), its parity gate rejects it (cosine 0.870116), and it falls back to CPU. So main already sampled there, and the greedy-wgpu case is traced from code, not measured. On the branch a sampled request prints the notice and goes straight to the CPU. SWEEP (done_when 3): docs/audits/sampler-sweep-PMAT-3760.md lists every site in 4 sections: A routed through the shared sampler, B greedy-only decoders gated, C greedy by construction, D draws but not via the shared seeded draw, each with a named follow-up; the highest-priority follow-up is `sample_with_temperature` (wall-clock hash RNG) on serve''s APR Q4K GPU chat. SUITES at 8760145f5: aprender-serve lib 15920 passed; apr-cli lib 7300 passed; aprender-contracts lib 1689 passed; aprender-serve integration apr_coverage/apr_transformer_coverage/apr_transformer_deep_coverage 258+50+90 passed, and gguf_model_coverage, gguf_transformer_coverage, gpu_coverage, mock_gpu_flow and moe_kv_cache_equivalence 190+38+306+30+0(1 ignored) passed; clippy -D warnings clean on aprender-serve, apr-cli and aprender-serve --features cuda; fmt clean. `cargo check -p aprender-serve --features cuda --tests` fails ONLY on tests/gpu_cpu_trace_compare.rs (`missing field lm_head_tied`). That is pre-existing: this branch does not touch that file or AprTransformer, and gpu/tests/imp_1001d.rs notes that no CI job builds the cuda test profile.'
