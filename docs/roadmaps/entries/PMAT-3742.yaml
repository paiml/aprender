::HfTokenizer (apr finetune instruct and classify pipelines, the wgpu trainer, apr-cli finetune.rs) loaded every tokenizer.json through core, so round 1 regex refusal had already made fine-tuning refuse every Qwen tokenizer.json. HfTokenizer now wraps realizar canonical encoder under entrenar EXISTING optional realizar dependency (Cargo.toml:84; no new publish edge); apr-cli training feature enables entrenar/realizar; without that feature core refuses by name. cargo tree: aprender-serve with all features never reaches aprender-train (no cycle); the publish-order derivation (check_publish_preflight.sh R6, the full sibling graph): the edge is pre-existing and no publishable crate lies on a cycle. entrenar --features realizar did not compile without cuda (autograd/ops/mod.rs re-exported a cuda-gated fn under realizar alone); aligned. COP CONDITION 1: instruct_pipeline extract_embedded_tokenizer used .ok() (load failure became None: the fine-tune reported no embedded tokenizer or silently took a sibling file); it now returns Result, tries realizar embedded canonical loader first, and an embedded tokenizer that cannot be loaded is a named error; 4 case rows in constructors_tests_3742.rs (no vocabulary -> None; an uncodable byte-level vocabulary -> the named error; a qwen2 byte-level vocabulary -> canonical, merge applied, round trip; a vocabulary that is not byte-level -> loads). COP CONDITION 2: the behaviour change is in CHANGELOG [Unreleased]: Qwen fine-tuning trains on the model real ids; adapters trained by 0.69.0 or earlier on a Qwen tokenizer.json saw whitespace-split ids and are not compatible, re-train. TWO MORE SIBLING COPIES, found reading every caller of the loaders: realizar encode_text tokenizer.json branch (apr run model.safetensors, and the .apr prepare path fallback) ran the legacy merge loop over the whole text; it now goes through the one loader. realizar tokenizer.json loader read only the string merge form; the array form tokenizers 0.20+ writes was dropped without a word, building a canonical encoder with no merges; both forms are read (canonical_tokenizer_tests.rs). apr tokenize import-hf now keeps the source tokenizer.json beside vocab.json + merges.txt, the only place the pre-tokenizer lives (contract apr-cli-tokenize-import-hf-v1 1.2.0, postcondition_6, FALSIFY-TOK-IMPORT-HF-006; in-place import leaves the source intact). DONE_WHEN 4: the condition (no .apr in the universe on either host) is false on both: lambda 2 Q4_K .apr (qwen2.5-coder-1.5b-instruct -q4k, -q4k-v2), gx10 2 (-q4k, -q4_k_m); listing with the command output in evidence/tokenizer-parity/apr-universe-listing-3742.txt. MEASURED AT 3c65950f8 (receipts receipt-3742-lambda-3c65950f8.txt, receipt-3742-gx10-3c65950f8.txt, defaults: pinned llama-tokenize, ~/models, the committed corpus): lambda 138 pass, 0 fail, 0 uncovered, 12 outside the universe; gx10 90 pass, 0 fail, 0 uncovered, 6 outside the universe; every Q4_K .apr passes every corpus file on both hosts (lambda 12 rows, gx10 12 rows). The .apr encode and decode code the round-1 mutants A and B turned RED is unchanged since round 1. The tokenizer.json path against llama.cpp on a real file (receipt-3742-tokenizer-json-lambda-e9631a01f.txt): Qwen2.5-Coder-1.5B-Instruct tokenizer.json through apr-cli HfTokenizer (the loader entrenar shares) vs pinned llama-tokenize on its GGUF, 8/8 files identical by cmp, p148k 136355 ids included, round trip true. Unit at 3c65950f8: aprender-core 14283/0, aprender-serve apr:: 774/0, aprender-train with realizar 7636/0 and without 7635/0, apr-cli 7319 pass 1 fail: the fail is a batch-1 base defect this row does not touch (serve accelerator_guard_tests the_gguf_cuda_serve_path_reads_the_context_length_flag: #3571 fold left a cfg(test) module at handler_gpu_completion.rs:510 above the read the guard scans for; reported to the cop). clippy -D warnings clean on aprender-core, aprender-serve, apr-cli, aprender-train (with and without realizar) at d0be2245c. After 3c