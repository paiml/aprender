  notes: 'Filed by the cop from aprender-c3 sibling sweep on #3726; owner aprender-c3. Design ruled by the cop (option D, 2026-09-21): apr-cli six tokenizer.json consumers switch to realizar canonical encoder through one adapter; aprender-core pre_tokenize refuses a byte-level HF vocabulary with a named error; one implementation, no new publish edges. Universe ruled on #3712: a file is in iff its dominant weight dtype, read by apr own header reader, is Q4_K; the file name is not evidence. MEASURED BEFORE THE FIX: .apr files exist in the declared models dir on both hosts (lambda 4, gx10 3); most older conversions carry no tokenizer.pre_type or token_type (gx10 q4_k_m.apr carries both). The structural special-token rule (not a merge output, not a single glyph, text shaped like <...>) reproduces llama.cpp CONTROL+USER_DEFINED set exactly on qwen35/qwen2.5/qwen3/qwen3moe (33/22/26/26, none missing, none extra). A stale duplicate, crates/aprender-serve/src/apr/loading.rs, was never included (tokenizer_loading.rs is the live copy) and swallowed the first edit; it is deleted. The .apr decoder (AprV2Model::decode_tokens) lost non-ASCII bytes and whitespace glyphs; decode now goes through ByteLevelBpe::decode when canonical. MEASURED (receipts in evidence/tokenizer-parity/, receipt-3742-* and mutant-3742-*): lambda release mode at adc877984 (defaults: pinned llama-tokenize, ~/models, the committed corpus), 138 pass, 0 fail, 0 uncovered, 12 outside the universe over 21 GGUF + 4 .apr files x 6 corpus files. Both Q4_K .apr files (qwen2.5-coder-1.5b -q4k and -q4k-v2) pass every file, round trip included, paired by tokenizer fingerprint with a GGUF of identical tables. The -st.apr (F32) and the 0.5b .apr (BF16) are outside the universe and have no same-fingerprint GGUF, so they are reported OUTSIDE, not passed. Universe membership comes from scripts/lib/tensor_universe.{sh,py}, verbatim from A2 (#3766, 3e69272a1), the ruled definition (most frequent >= 2-D tensor dtype by count, ties as members); A2 folds before this row. MUTANT A (canonical_for_apr returns None, the old .apr path): RED, 12 FAIL (apr took legacy-fallback). MUTANT B (decode ignores the canonical tables, the old .apr decoder): RED, 4 FAIL (decode(encode(x)) != x on the files with non-ASCII or whitespace glyphs). A first mutant-A run falsely passed because zsh cargo function sent the build to another target dir (infra#885); the mutant binary was rebuilt through bash and its path verified as legacy-fallback before the recorded run. Unit: aprender-serve 943, aprender-core 262 (incl. the refusal cases), apr-cli 723 (incl. the adapter guard: a byte-level tokenizer.json reaches the canonical encoder and aprender-core refuses the same file). A host-dependent core test that asserted load_from_json succeeds on a real Qwen2 tokenizer.json now asserts the #3742 refusal.'
