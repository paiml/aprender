  notes: 'ACCEPTANCE (hand-entered from issue #3601 done_when, verbatim; minted on the PR branch so the AD-04 quorum can run). Done when: (1) apr inspect succeeds on a GGUF containing any of the 10 listed ids (repro: Qwen3.5-4B-UD-Q4_K_XL.gguf, dtype 23). (2) A regression test pins all 10 ids against shape.rs''s byte_size, analogous to ggml_type_table.rs''s spot_checks_against_ggml_sizes, so a future edit can''t silently drop one back out. (3) The error message, if a truly unknown id is ever hit, names the id and points at contracts/apr-cli-commands-v1.yaml''s inspect docs or similar — not a bare "Unsupported dtype N". DEVIATION FROM THE ISSUE''S FIX PROSE (not its done_when): the issue proposed porting rows from aprender-serve''s GGML_TYPES because "the unified TRAITS crate #3430 proposes doesn''t exist yet"; #3581 has since landed it (aprender-quant ggml_type.rs TRAITS[43], upstream-extracted, fixture-checked) and aprender-core already depends on it, so shape.rs reads TRAITS instead of becoming a fifth hand copy. ALSO IN THIS DIFF (same defect class, measured on apr 0.68.2 00e5d2dde): (a) apr tensors sized tensors from a second hand-typed table in aprender-core (safetensors.rs ggml_dtype_element_size SIZES) with seven IQ rows wrong and the 26-30 tail misordered (BF16 0.375 bytes/elem) — it refused the valid Qwen3.5-0.8B-UD-IQ2_XXS.gguf as "Truncated GGUF … 167936 bytes too short"; now type_size/blck_size from TRAITS. (b) ggml_dtype_name (a third copy, ids 0-30) reads TRAITS so TQ1_0/TQ2_0 are named rather than "unknown"; contracts/apr-inspect-dtype-naming-v1.yaml GGML_NAMES + KANI bound amended to match. Behaviour preservation: every id sized before keeps its exact byte count (floor arithmetic kept; characterization test over non-block-multiple counts), ids 0-30 keep their names. The IQ fabrication this sizing exposes is PMAT-3656 (#3656), fixed in the same diff.'
