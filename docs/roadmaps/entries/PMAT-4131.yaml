  - 'ladder_sha256 keys its per-host cache on the file IDENTITY (st_dev, st_ino, size, mtime_ns, ctime_ns via stat -L), never the path; a hit returns the cached hash, and any change to the key re-hashes'
  - 'a changed file under the same path and size is re-hashed, including a same-size rewrite that restores its mtime (the cop''s must-RED) and an inode swap'
