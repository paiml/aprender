  - 'each inventory row records sha_source (hashed|cache|memo), so a cached attestation is never presented as a fresh measurement'
  - 'check_ladder_sha_cache.sh runs the shipped function against real files; --self-test plants a path-keyed cache and a key without ctime, and both are killed; check_ladder_provenance.sh still pins bytes and sha to the followed model'
  - 'the saving is measured on lambda''s real inventory'
