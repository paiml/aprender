  notes: 'Qwen35CudaModel::forward_batch runs one decode step for B sequences layer-major, using the same kernels in the same per-sequence order, so each row is bitwise forward_single (witness: forward_qwen35_cuda_batch_tests). Qwen35Forward::sibling shares the host and device models and owns its state. SharedGpu::decode is a leader/follower batcher (one forward_batch per step). apr serve holds APR_QWEN35_SERVE_SLOTS sessions behind Qwen35Slots::lock (default 1). Witness: 16 sibling streams token-identical to each alone, widest step >= 2. Next: a batched GEMV (one weight read per step) measured against the bitwise baseline.'
