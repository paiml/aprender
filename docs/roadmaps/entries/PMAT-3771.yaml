  notes: 'ISSUE TEXT (#3771, quoted verbatim): "Found by aprender-fd (PMAT-3724), confirmed in code. `scripts/model_ladder.sh:60` records `sha` = `git rev-parse HEAD`. The binary''s own `--version` goes to a separate `apr_version` field (`:223`), which `check_model_ladder.sh` never reads; it gates on the version STRING alone (`:88`). So two binaries with the same version are indistinguishable. In unpinned mode the receipt''s sha names a tree that may never have been measured: fd''s run recorded bfd99757c while executing binary b89d126fc. This is dogfood §14 row 9 (#3768): a receipt names what it inferred, not what it measured. ## done_when - [ ] The receipt''s identity is the BINARY''s own `--version` output (version + git sha), recorded verbatim. The worktree HEAD, if recorded at all, sits in a separate field that nothing judges. - [ ] `check_model_ladder.sh` (and the release-readiness judge) requires the receipt''s binary sha == the pinned release binary''s sha. A version-string match alone is refused. - [ ] Mutants: a receipt whose binary sha differs from the pin but whose version string matches → RED; a receipt with a HEAD sha and no binary sha → RED. - [ ] Sweep every receipt producer in scripts/ and scripts/release/ for the same inference (HEAD or branch recorded as the identity of what ran), and list each with its fix. Owner: aprender-62 (row A). Refs #3712 #3768 #3724" WHAT THIS ROW DOES: scripts/model_ladder.sh records the receipt identity from the BINARY: `sha` = the git sha parsed from `"$APR" --version` (a binary whose --version names no sha is a decline: what ran cannot be identified), `apr_version` = that output verbatim, `apr_sha` = the full 40-hex of the BINARY''s commit resolved in the repo (null when unknown), `checkout_sha` = the worktree HEAD (recorded, never judged). scripts/check_model_ladder.sh requires, per host: an apr_version carrying a git sha (else ''receipt names no binary''), receipt sha == that sha, and that sha prefix-equal to the RELEASE binary''s sha; the release binary''s sha comes from the PINNED binary (scripts/apr_bin.sh, `"$APR" --version`) or, for case tables only, MODEL_LADDER_RELEASE_SHA -- the verdict line names which. A version-string match alone is refused. Cases: red-binary-sha-differs-same-version, red-receipt-head-only, red-receipt-sha-is-not-its-binary; judge mutants binary-mismatch and no-binary-named and producer mutant identity-is-head each killed; the producer''s --identity-probe with a fake `apr 9.9.9 (feedbee12)` records sha=feedbee12 (checkout differs). scripts/check_release_bump_pr_body.sh: fixture receipts name `apr 9.9.9 (0123abc)` and the prepare_bump run exports MODEL_LADDER_RELEASE_SHA=0123abc (the fixture tree has no apr to pin); the seed copies every scripts/lib/*.py the judge imports. SWEEP (done_when 4), every `git rev-parse ... HEAD` in scripts/ and scripts/release/ classified: DEFECT (fixed here): scripts/model_ladder.sh. PINNED BY CONSTRUCTION (HEAD == what ran): scripts/perf002_prefill_path_probe.sh:96 and scripts/perf041_batched_parity_probe.sh:58 (both source scripts/apr_bin.sh, whose freshness check refuses a binary whose --version lacks HEAD''s sha, APR_BIN override included); scripts/dogfood.sh:165 (RECEIPT_SHA names the tree the evidence describes; its binaries are pinned via apr_bin.sh and it has no unpinned escape). HEAD IS NOT A MEASUREMENT''S IDENTITY: scripts/release/models_t1.sh:49-50, scripts/release/autopilot.sh:65, scripts/release/publish_strict.sh:23, scripts/check_publish_preflight.sh:169 (HEAD compared to the release commit or tag); scripts/perf_gate.sh:1230/1234, scripts/perf_receipt_sign.sh:145 (a signing repo''s own HEAD); scripts/extract_ggml_traits.sh:106 (the source tree read, which is what is measured); scripts/pp066_state.sh:85 (printed state); batch_fold.sh, ci_resolve_dirty.sh, ci_test_tier.sh, predict_merge.sh, session_docs_commit.sh, check_row_pr_write_set.sh, install_pr_review_tools.sh (git plumbing); check_*.sh self-test fixtures and apr_bin.sh''s own freshness check. The apr-dogfood skill''s G13 compares the binary''s sha to HEAD and its DOGFOOD_ALLOW_UNPINNED mode only skips G13 for a binary with no embedded sha, writing no receipt that names HEAD. WHERE THE GATE RUNS: check_model_ladder.sh is declared only in Cargo.toml [package.metadata.dogfood] and listed in scripts/unwired_guards_baseline.txt; no PR workflow runs it. Stacked on #3763 (row A2) at the batch head. SECOND COMMIT (cop rule rev 6, 2026-09-21): model_ladder.sh''s apr_locked joins the fleet''s ORDERED gpu-q queue when gpu-q is present and bounds its wait (`gpu-q --caps` lists `wait`, gpu-q v3): `GPUQ_LOCK=$GPU_LOCK GPUQ_WAIT=$LOCK_WAIT gpu-q --prio ${MODEL_LADDER_GPU_PRIO:-1} -- "$APR" ...`; gpu-q exits 75 naming the holder when the bound expires, the same contract as the bounded flock, which remains the fallback and says it ''may have jumped the gpu-q queue''. The self-test drives both routes with fake gpu-qs (never the fleet queue: the existing probes set MODEL_LADDER_GPU_Q empty); producer mutants gpuq-unbounded (GPUQ_WAIT dropped) and gpuq-no-caps (the capability check dropped, so an unbounded gpu-q would be used) are each killed. The run header prints the GPU access route.'
