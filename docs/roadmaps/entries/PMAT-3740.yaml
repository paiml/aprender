  - 'THE AUDIT (recorded before round 1), comment 5765844943, verbatim: "**Audit (aprender-f0, 2026-09-21), read on `PMAT-3756-llama-pin-intel-mini` @ `88a07cc2a`, which is #3563(A) plus the BSD-sed fix, stacked on main `a9502d992`.** Each hit is classified by whether a llama.cpp binary is EXECUTED from it, and if so how it is located.

### Shell / Python: every consumer that executes a binary already resolves through `scripts/llama_bin.sh`
| file | how it gets the binary | class |
|---|---|---|
| `scripts/parity_host_receipt.sh` | sources `llama_bin.sh` → `$LLAMA_SERVER` | consumer, **resolves via the pin** |
| `scripts/extract_ggml_traits.sh` | sources `llama_bin.sh` (for `llama_pin_get`) | consumer, **via the pin** |
| `scripts/check_comparator_flags.sh` | sources `llama_bin.sh`, reads `$LLAMA_SERVER` in the harness | guard, **via the pin** |
| `check_no_competing_harnesses.sh`, `check_bench_protocol.sh`, `check_comparator_one_client.sh` | the token appears in grep patterns, messages and case-table fixtures | mention (guards) |
| `perf_gate.sh`, `lib/bench_receipt.py`, `dogfood_examples.sh`, `publish/albor-370m-publish-readiness.sh`, `check_no_fabricated_baselines.sh` (`LLAMA_BIN="$(command -v llama-bench)"` is a **must-not-match fixture line**, not code) | comments, messages, fixtures | mention |
| `lib/perf_receipt.py:1236`, `lib/parity_block_selftest.sh:79` | `/opt/llama-server` and `/usr/bin/llama-server` as self-test fixture strings | mention (fixture) |

### Rust: three consumers locate llama.cpp OUTSIDE the pin
1. **`crates/apr-cli/src/commands/showcase/benchmark_helpers.rs:39` `run_llama_cpp_bench`**: `which llama-server` (PATH), and then **no measurement at all**: it returns `35.0 + jitter` tok/s, and `apr showcase` turns that into a "speedup vs llama.cpp". Filed separately as **#3773**, because it is a fabricated baseline in a shipped command, not only a resolution defect.
2. **`crates/aprender-serve/tests/qwen3_moe_argmax_parity.rs:102` `locate_llama_cli`**: `which llama-cli` (PATH), then a hard-coded `LLAMA_CLI_CANDIDATE_PATHS` list. That''s a second resolver, with no pin and no version check. It''s a parity test, so its verdict is about whichever llama-cli PATH yields (on lambda, `~/src/llama.cpp` is 60b06ab9a with a broken llama-cli).
3. **`crates/aprender-serve/src/bench/runtime.rs:281` `LlamaCppConfig::default()`**: `binary_path: "llama-cli"` (PATH). It is consumed by `benches/external_matrix.rs` and `examples/pmat_benchmark_matrix.rs` (apr vs llama.cpp).

Not consumers: `test_llm_band.rs` spawns `bash scripts/perf_receipt_sign.sh`; `apr test llm bench --url` talks HTTP to a server someone else started (in-tree, `parity_host_receipt.sh`, which resolves it via the pin).

### Proposed shape (for the cop''s ruling before code, because "no second resolver" constrains the Rust side)
- **Rust consumers read ONLY the environment `llama_bin.sh` exports.** They read `LLAMA_CLI`, `LLAMA_SERVER` and `LLAMA_BENCH`, set by `. scripts/llama_bin.sh` after it proves the build. No PATH lookup, no candidate lists, no Rust port of the pin logic, since that would be the second resolver. A test with no such variable SKIPS, naming the command to run (`. scripts/llama_bin.sh && cargo test …`). A bench or example REFUSES.
- `LlamaCppConfig::default()` keeps its public shape, but `binary_path` defaults to `$LLAMA_CLI` when set, and the two in-tree comparator callers (the bench and the example) refuse without it. Whether the LIBRARY default may still say `"llama-cli"` for outside users is part of the ruling.
- The guard, `scripts/check_comparator_consumers_resolve.sh`, is a case table:
  - RED for a Rust `Command::new("which").arg("llama-…")`, a `llama-*` literal path default, or a candidate-path const in a comparator consumer;
  - RED for a shell command-position `llama-*` invocation that does not come from `$LLAMA_*` (reusing `check_comparator_one_client.sh`''s command-position walker, not a grep);
  - a mutant per row.
- The showcase is left to #3773, so this row doesn''t also own the fabrication."'
  - 'ITS CORRECTION, comment 5765978075, verbatim: "**Correction to my audit above (aprender-f0).** Item 3 said `LlamaCppConfig::default()` "is consumed by `benches/external_matrix.rs` and `examples/pmat_benchmark_matrix.rs`". I asserted that without checking, and **it is wrong**. `git grep ''LlamaCppConfig\|LlamaCppBackend'' -- ''*.rs''` finds no caller outside `crates/aprender-serve/src/bench/` itself (the type, its backend impl, re-exports, and its own unit tests).
- `benches/external_matrix.rs` does not spawn llama.cpp. It talks HTTP to servers the user starts (`LLAMACPP_GPU_URL`/`CPU_URL`), and `llama-server` appears only in the printed start instructions: a mention.
- `examples/pmat_benchmark_matrix.rs` does not spawn llama.cpp either. It compares apr against **hard-coded** llama.cpp numbers (`llama_cpp_gpu_baseline: 594.10`, `cpu 194.28`, …, "Verified llama-bench baselines (RTX 4090, tg64)"), with no pin, date or receipt. That''s the asserted-baseline class (#3773''s sibling), not a resolution defect; flagged here for the cop to triage.

So for the in-tree Rust callers, #3740 changes `tests/qwen3_moe_argmax_parity.rs` (env-only, gated as a pre-publish dogfood gate) and the showcase''s `which llama-server` lookup (#3773 owns its fabricated number). For the library default, per ruling (4), it adds only the doc comment "unverified; not what our gates use". Ruling (3) ("the in-tree bench/example REFUSE without the env") has no subject for `LlamaCppConfig`."'
