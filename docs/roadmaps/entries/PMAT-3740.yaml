  notes: '#3563 part C (split by the cop into A -> C -> B). STACKED ON #3756 (branch PMAT-3756-llama-pin-intel-mini, receipted head 88a07cc2a, itself stacked on #3563(A)''s receipted 8fe36c080), because it needs #3563(A)''s canonical-path resolver and #3756''s BSD-sed fix; the quorum base is 88a07cc2a. SCOPE: crates/aprender-serve/tests/qwen3_moe_argmax_parity.rs, crates/aprender-serve/src/bench/runtime.rs (doc comments only), scripts/llama_bin.sh (one more export, LLAMA_COMPLETION), scripts/dogfood_comparator_env_tests.sh (new), Cargo.toml ([package.metadata.dogfood] gates, one entry), scripts/check_comparator_consumers_resolve.sh (new), scripts/comparator_consumer_baseline.txt (new), scripts/check_baseline_ratchets.sh (one classify() line for the new baseline), and this fragment. THE AUDIT (quoted above, with its correction): every shell consumer that EXECUTES llama.cpp already sources llama_bin.sh; the Rust consumers that locate it outside the pin are the Qwen3-MoE argmax parity test (`which llama-cli` + a hard-coded candidate list) and `apr showcase` (`which llama-server`, and a fabricated baseline: #3773, assigned to aprender-fc by the cop, NOT touched here). LlamaCppConfig has no in-tree caller (the correction). HOW EACH RULING IS MET. (1) The MoE test reads ONLY `$LLAMA_COMPLETION`, which scripts/llama_bin.sh exports from the proven build''s own directory: no PATH, no candidate list, no Rust port of the pin logic. It is llama-completion, not llama-cli: the gate''s first real run failed the llama-cli version at qwen3_moe_argmax_parity.rs:231, because llama-cli rejects -no-cnv at both pins and applies the chat template, and --log-disable empties llama-completion''s stdout (evidence/parity/pin-bump-d1d3c3396/LOAD.md; recorded on the issue). The test had never run against a comparator: it only ever skipped. (2) Without the variable the test SKIPS and prints the exact command (`. scripts/llama_bin.sh && cargo test -p aprender-serve --test qwen3_moe_argmax_parity -- --ignored`). WHERE THE CONDITION IS MET: scripts/dogfood_comparator_env_tests.sh is DECLARED in Cargo.toml''s [package.metadata.dogfood] gates, so scripts/dogfood.sh runs it at pre-publish (and post-publish). It sources llama_bin.sh, requires an executable LLAMA_COMPLETION, builds the test outside the GPU lock, runs it through `gpu-q --prio 1` (DOGFOOD_GPU_PRIO overrides it for a proof run), and FAILS on a skip ("skipped —" in the output), on a filter that matched nothing (no "test <name> ... ok" line), on a failure, or on an unresolved pin: a skip is never the release path. (3) The in-tree bench/example: no in-tree caller uses LlamaCppConfig (the correction), so ruling (3) has no subject. (4) LlamaCppConfig''s Default keeps "llama-cli" for outside users; its doc comment and the binary_path field doc say it is unverified and not what our gates use. (5) THE GUARD, scripts/check_comparator_consumers_resolve.sh (guard_tree-wired, --no-cargo): R1 no llama.cpp binary in shell COMMAND POSITION by bare name or literal path, decided by check_comparator_one_client.sh''s own walker, EXTRACTED from that file at run time with only its predicate swapped (so a walker fix reaches both guards); R1b no shell PATH probe (which / command -v / type -P) of a llama.cpp binary, heredocs and comments being data; R2 no Rust `Command::new("which"|...)` probe of one; R3 no Rust Command::new of one by name or literal path; R4 no Rust const/static list of candidate paths; R5 a SHRINK-ONLY known-violation baseline (scripts/comparator_consumer_baseline.txt, classified `set` in check_baseline_ratchets.sh, with `# tool_version=none`), holding exactly one entry, `R2 crates/apr-cli/src/commands/showcase/benchmark_helpers.rs #3773`: unlisted violations are RED, a stale entry is RED (so whichever of #3773 / #3740 lands second deletes it; aprender-fc has been told), and the list may not grow against origin/main. SELF-TEST, 36 rows and mutants: S1-S14 (shell and Rust shapes, each rule and each clean control), B1-B5 (the ratchet), D1-D7b (the release gate driven with a stub resolver and a stub test runner under a hermetic PATH: pass, skip, did-not-run, failure, unresolved pin, no LLAMA_COMPLETION, gpu-q at release priority), and mutants: the gate without its skip / ran / pin checks and without gpu-q, the one-client walker''s own predicate (flags only llama-bench), the scan without R2 / R4 / R1b, and the ratchet without its stale check. MEASURED: `bash scripts/check_comparator_consumers_resolve.sh --self-test` "SELF-TEST PASSED (36 rows and mutants)"; the real tree: 1 violation, owned by the baseline (#3773), PASS; RED ON THE DEFECT: the same check over the ORIGINAL test file reports R2 at :103 (`Command::new("which").arg("llama-cli")`) and R4 at :75-78 (the four candidate paths). `cargo test -p aprender-serve --test qwen3_moe_argmax_parity`: 4 passed, 1 ignored (the comparator test). FIRST-GREEN OF THE DOGFOOD GATE ON ITS OWN TARGET (lambda, the pinned d1d3c3396 build, the 30B MoE GGUF): GREEN. `CARGO_TARGET_DIR=... DOGFOOD_GPU_PRIO=8 bash scripts/dogfood_comparator_env_tests.sh` on lambda (2026-09-21, finished ~23:50Z after ~1 h in gpu-q at prio 8) printed "ok pinned llama-completion: /home/noah/src/llama.cpp-d1d3c3396/build/bin/llama-completion (version: 0.4.1-dev (build 10987, commit d1d3c3396))", "ok f_qw3_moe_parity_002_argmax_vs_llama_cpp ran against the pinned llama-completion and passed" (the line said llama-cli at the time; corrected since), "PASS 1 comparator-consumer test(s) ran against the pinned llama.cpp", GATE_EXIT=0. Its FIRST run, before the llama-completion fix, FAILED at qwen3_moe_argmax_parity.rs:231 (llama-cli exited non-zero), which is the finding recorded on the issue; an earlier attempt waited 3 h in the queue and timed out without running (GATE_EXIT=124). Related guards: check_llama_pin rc 0, check_comparator_one_client OK, check_baseline_ratchets, check_shell_lint_ratchet, check_bashrs_gate, check_guards_are_wired all PASS.'
