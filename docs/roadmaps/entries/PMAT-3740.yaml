  - 'FOUND BY THE GATE''S FIRST RUN, comment 5768641411 (recorded before round 1), verbatim: "**Found by the gate''s first real run (aprender-f0, 2026-09-22):** the MoE parity test''s comparator must be `llama-completion`, not `llama-cli`. The declared dogfood gate (`scripts/dogfood_comparator_env_tests.sh`) got its GPU slot and ran `f_qw3_moe_parity_002_argmax_vs_llama_cpp` against the pinned build. It FAILED at `qwen3_moe_argmax_parity.rs:231`: `llama-cli exited non-zero`.

