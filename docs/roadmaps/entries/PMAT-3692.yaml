  notes: 'ANDON, found by aprender-62 as first responder on #3689: its guard-tree (job 106309701767, intel-clean-room-3) failed "76 checks, 1 failed" on this guard alone, "ENV: no TOML reader on this interpreter (python 3.10 …)". #3644 (batch #3669, a877fa056) put the guard in guard-tree''s --no-cargo population while its own header said the intel hosts have python 3.10.12 and no reader. The batch''s guard-tree passed only because it ran on gx10-pool1. The fleet fix is OUT: infra declared the fleet python-free for automation (infra#708, 02:05Z, "do not propose installing tomli"). So the cop ruled (~11:28Z) that the fix is the guard, folded onto #3689 for one CI cycle. SCOPE: this commit touches only scripts/check_pathonly_devdeps_unused_in_src.sh plus this fragment. #3689''s PMAT-3685 parity change is judged by its own receipt. HOW IT IS MET. scan() returns a third code, 3, for fleet state, in exactly two ways: `command -v` finds no interpreter (reason=no-interpreter), or the scanner prints its own "ENV: no TOML reader on this interpreter" line AND exits 3 (reason=no-toml-reader; the scanner''s sys.exit changed 2 -> 3). The pattern is keyed on the PAIR, so either one alone stays ENV. In both cases scan() prints `UNMEASURED runner=… reason=… … fleet state, not a pass (#3692)` to stderr, where it survives the callers'' command substitution; guard_tree captures both streams. selftest() passes 3 through; main() returns 0 on 3 from the case table or the tree scan, before any verdict or OK line. Every other failure path is unchanged: ENV rc 2. `--selftest` in fleet state also exits 0. DEATH ROWS, 5 -> 7: FORCE_NO_TOML -> 3; no interpreter -> 3 (was 2); /bin/false -> 2; an interpreter that exits 3 printing a traceback but NOT the no-reader line -> 2 (new: the exit code alone does not buy an UNMEASURED); the working interpreter -> 0; the WHOLE guard under FORCE_NO_TOML -> rc 0 with "UNMEASURED runner=intel-probe reason=no-toml-reader" and no "missed hit_", "false positive" or "OK: no NEW" line (was: rc 2); the WHOLE guard under /bin/false -> rc 2 (new). MEASURED at this commit: `bash scripts/check_pathonly_devdeps_unused_in_src.sh --selftest` rc 0, "PASS: case table (4 must-match, 7 must-not-match, 7 death rows)"; a bare run on this box''s python3 (which has a reader) rc 0, "OK: no NEW src/ reference to a publish-stripped dev-dep (3 baselined pair(s), #3306)", so the real verdict is unchanged where a reader exists. REAL PYTHON 3.10: /usr/bin/python3.10 is 3.10.12; run with -S (no site-packages) it cannot import tomli and has no tomllib, which is the intel host''s shape with a real interpreter. The whole guard under it gives rc 0, "UNMEASURED runner=py310-probe reason=no-toml-reader -- no TOML reader on this interpreter (python 3.10, need tomllib >= 3.11 or tomli) …". The PRE-FIX guard (main) under the same interpreter gives rc 2, "ENV: the scanner did not finish … ENV: the case table could not be measured (scan rc=2)", which is #3689''s failure reproduced. MUTANT, every ENV mapped to UNMEASURED (scan''s ENV branch `return 2` -> `return 3`): selftest rc 1 with three death rows RED, "rc=3 (wanted 2) interpreter exits 1 with no output", "rc=3 (wanted 2) interpreter exits 3 without the no-reader line", "rc=0 (wanted 2) the whole guard under a dead interpreter". GUARD_TREE UNDER THE SAME REAL PYTHON 3.10 (PATHONLY_GUARD_PYTHON=<3.10 -S stub> bash scripts/guard_tree.sh --no-cargo): rc 0, "76 checks, 0 failed", with "PASS  scripts/check_pathonly_devdeps_unused_in_src.sh [run]" and beneath it "~ UNMEASURED runner=py310-probe reason=no-toml-reader -- …", surfaced by #3651. That is the job #3689 lost on intel-clean-room-3.'
