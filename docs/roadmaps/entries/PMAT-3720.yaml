  acceptance_criteria:
  - 'Issue #3720 done_when 1, verbatim: "**weights digest**: `apr run --json` and serve''s response (`/v1/chat/completions`, a `model_digest` field and the `x-apr-model-digest` header) carry the sha256 of the model file actually loaded, plus the apr version+sha. The case row checks it against `sha256sum` of the file."'
  - 'Issue #3720 done_when 2, verbatim: "**seed determinism**: the same model, prompt, seed and sampling params give byte-identical output twice in a row, on each backend (CUDA on lambda and gx10, CPU on intel), for run and serve. A test runs each twice and diffs. Where a backend CAN''T guarantee it, the response says `deterministic: false` with the reason; it never silently differs."'
  - 'Issue #3720 done_when 3, verbatim: "**empty completion = error**: a generation that produces zero tokens (or only a stripped think-block) exits non-zero from `apr run` / returns an HTTP error from serve, naming why. Never rc 0 with `""`. (The qwen3-8b gate defect today was this shape: an empty answer read as a model defect, and in production it would have read as success.)"'
  - 'Issue #3720 done_when 4, verbatim: "**refused vs did-not-run**: distinct exit codes and JSON `status` values for REFUSED (a capability or limit, with the reason), FAILED (ran and errored) and OK. Documented in `--help` and the contract, with a case row per state."'
  - 'Issue #3720 done_when 5, verbatim: "these become cells in the SHACL release shape (#3715)"'
