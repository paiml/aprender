  acceptance_criteria:
  - 'scripts/perf002_prefill_path_probe.sh (new, bash driver) + scripts/perf002_prefill_path_probe.py (new, decider), matching the perf041 idiom: apr_bin.sh-resolved binary, marker written on EVERY exit path carrying host/cc/commit/binary-sha256/started_utc/slope/refused_rule, exit 0 MECHANISM_CONFIRMED / 1 PREDICTION_KILLED / 2 UNMEASURABLE. Nothing under crates/aprender-serve/** or .github/workflows/cuda-nightly.yml (row 1 owns those)'
  - 'decompose() carries the four MANDATORY refusals of the row — too_few_distinct_x, negative_slope, r2_below_bound, and bimodal (which REPORTS per-mode fits rather than rejecting) — plus a fifth, implausibly_fast, that guards the harness; every refusal names itself in the output and maps to exit 2, never to a defect claim'
  - '`python3 scripts/perf002_prefill_path_probe.py --selftest` is OK on 8 cases: a fixture per refusal, a "bimodal emits two fits" assertion, an anti-vacuity leg proving the floor (not another rule) catches the harness fixture, a CONTROL proving a clean linear sweep is NOT refused, and a check that the control recovers its planted 32.650 ms/token. The driver runs the selftest BEFORE measuring and refuses to report a verdict if it fails'
  - 'measure() reads TTFT off the SSE stream (first chunk carrying content) with max_tokens=1, issues and DISCARDS one warm-up per arm, and gives every sample a unique nonce prefix; --repeat-prompt reproduces the prefix-cache bimodality on demand'
  - 'measured on gx10 (GB10, cc 121) at commit 338f1d49, qwen2.5-coder-1.5b-instruct-q4_k_m, ladder 64/128/256/384/513 x3: verdict MECHANISM_CONFIRMED, default arm linear at 9.042 ms/token r2 0.999947 n=15 (513 tok -> 4713/4717/4719 ms), BATCHED_PREFILL=1 measured 0.099 s at ~512 tokens (513 tok -> 123/99/98 ms) — a 48x collapse and 3.5x better than §10''s predicted 0.35 s. Slope reproduced at 9.054 and 9.042 across independent runs'
  - 'docs/specifications/PP-LLAMA-001-MASTER.md row 2''s status cell goes from `**OPEN**, 2026-09-19` to `**LANDED** (this PR)` with the measurement — this is what DISCHARGES the row: spec_conformance.py:803 sets `discharged = "LANDED" in cell.upper()`, so the §4 andon clears only when the status cell says so, and row 1 proved the cost of the converse (its work had been on main since 2026-09-04 while its cell read OPEN)'
  - 'THIS PR ALSO CARRIES ROW 1''S CELL, and that is a deliberate change of scope from the original split. `gate: needs: [... guard-tree ...]` (ci.yml:3040) with `ci / gate` REQUIRED, and guard-tree failing while ANY row disagrees, means row 1''s PR and row 2''s PR are green only TOGETHER: each leaves the other''s rows red, so both sit BLOCKED forever rather than merging in some order (prior art in this repo: 10.1 h, 14 queue entries, zero merges). aprender-bf''s commit `fe593abfc` is cherry-picked here with their authorship preserved, they closed #3565 pointing at this PR, and #3564 waits behind the same gate'
  - 'row 21 is dated 2026-09-30 in the same PR: it inherited row 2''s expiry and had none of its own, so discharging row 2 raises `D2 21 — blocked only by rows that have LANDED, so nothing derives its expiry any more` plus a `D5` on the derived file. Basis matches aprender-bf''s for 13/15/19 — blocked until 2026-09-20, one full train past the 0.69.0 cut, owner may move it with a stated basis. Nothing inherits from 21'
  - 'evidence/parity/derived_expiries.json is regenerated with `spec_conformance.sh --write` AFTER the cherry-pick is resolved, so it derives from the merged §12 rather than from either half. Measured on the combined tree: `spec_conformance.sh` exits 0, `33 row(s), 33 ARMED, 114 named case(s), 0 missing`, down from 7 rows disagreeing this morning and 5 after row 2 alone'
  - 'the marker really is written on every exit path: OUT/MARKER and a python-free `bail_marker` are established BEFORE the `cd` and before sourcing apr_bin.sh, because both of those bail early and the first draft produced SILENCE there while the header claimed otherwise. Measured: running the script from a directory that is not the repo exits 2 and writes a marker with `status: UNMEASURABLE` and `reason: apr_bin.sh could not attribute an apr binary to this tree`'
  - 'ONE clock for the run: `date -u` is captured to the append-only `started_utc.log` and read back BEFORE `bail_marker` is defined, so the bail path and the full writer stamp the same instant and neither calls `date` inline — a bare `date` inside `bail_marker` was DET002 in guard-cargo (`bashrs-gate: FAIL 1 … over 345 file(s)`), which is bashrs enforcing the append-only-sink guidance the sibling probe already documents'
  - 'the marker vocabulary matches the documented exit codes: exit 2 writes `UNMEASURABLE`, not `UNMEASURED` (the sibling perf041 writes UNMEASURED; this row''s own text says UNMEASURABLE and the file is now internally consistent)'
  - 'the probe''s header records the four harness defects that each produced a confident WRONG answer rather than an error (time_starttransfer times headers not tokens; first-request CUDA warm-up gives a negative slope; a repeated prompt measures the prefix cache; the r2 floor wrongly applied to the batched arm). §9 #1''s SIZE is deliberately NOT re-measured here — see aprender#3553'
