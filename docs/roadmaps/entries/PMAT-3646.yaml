  notes: 'SCOPE OF THIS PR: item 1 only. The PR says `Refs #3646`, not a closing keyword, and carries a `keep-open:` line for item 2. check_pr_review_receipt.sh keeps its line in scripts/unwired_guards_baseline.txt on purpose: neither of item 2''s two options lands here. The workflow edit is the operator''s call, and the fold is moot because check_pr_review_arm4.sh already invokes it with a receipt (see Item 2 below). The ledger entry''s own comment says so ("NOT dark: check_pr_review_arm4.sh runs it … Ledgered only because this meta-guard counts a DIRECT workflow invocation"). A reviewer should judge item 2 as OPEN BY DESIGN, not as missed. Handed over by aprender-b3 (2026-09-21); claimed on the issue. Measured on origin/main @ 237fbc32f per the issue: `bash scripts/check_pr_review_counts.sh` rc=1 "--- 6 row(s) disagree with the tree ---"; `bash scripts/check_pr_review_receipt.sh` rc=1 "A run over zero receipts is not a pass (S6.3: a missing receipt is RED)." The ledger line for each guard is added by #3647 (scripts/unwired_guards_baseline.txt, shrink-only); it is deleted in the commit that wires that guard, after #3647 merges. Item 1 lands first; item 2 lands here only if it folds into check_pr_review_arm4.sh with no workflow edit, otherwise the ticket stays open for the operator''s call and the PR says Refs, not Closes.

    What the item-1 PR does. (a) The 6 RED rows were ci.yml sites whose sentences PRQ-013 deleted along with the receipt job (roadmap: "STATED LOSS"), so the rows go. The bats_tests derivation goes too, because no file states that count any more; ci.yml''s fixture_rows site goes from 2 to 1; and scripts/check_pr_review_wiring.sh''s "43-row" joins the table with a self-test row of its own. (b) The :196 comment is reworded so CARGO_RE stops matching: `guard_tree.sh --dry-run --no-cargo` prints `run: scripts/check_pr_review_counts.sh`, and restoring the old wording moves it back to --cargo-only (mutation-verified). (c) The --list mode of mutate-guard.sh and mutate_quorum_arm.sh requires only awk. Before this it demanded bats/jq/minisign/check-jsonschema, so wiring the counts guard into guard-tree, which runs on clean-room HOSTS including the gx10/yoga docker runners, would have turned a dark guard into an ENV-red job (reproduced: rc=2 under a PATH without those four). Sweeps still refuse without them (rc=1).

    Item 2, measured: check_pr_review_receipt.sh HAS a caller with a receipt. check_pr_review_arm4.sh runs `bash "$guard" "$scratch"` (A3) and `bash "$guard" "$best_dir"` (A4) with guard defaulting to it, and pr-review-quorum.yml:141 runs arm4. So there is nothing to fold. What remains is whether guard_tree.sh and the unwired ledger should treat a guard reachable only through another wired guard as wired. That is recorded on the issue and not changed here. LEDGER LINE (added after the 0.69 batch landed): check_pr_review_counts.sh entered scripts/unwired_guards_baseline.txt through #3644 in batch #3669 (squash a877fa056), after this branch was cut, so the deletion criterion 1 names could only be made once main carried the line. Main is merged into this branch (the only conflict was the generated roadmap.yaml, regenerated from entries/), and the entry and its four comment lines are deleted. On the squash-merge this is one commit with the fix. Measured on the merged tree: `bash scripts/check_guards_are_wired.sh` rc 0, "did not grow (1 removed) vs a877fa056", 149 scanned, 5 named by no workflow; `bash scripts/check_pr_review_counts.sh` rc 0, "PASS every stated count equals the derived one"; `--self-test` 16/16; `bash scripts/guard_tree.sh --no-cargo` 78 checks, 0 failed (76 before this branch), including "PASS scripts/check_pr_review_counts.sh [self-test]" and "[run]".'
