  - '(cop ruling a) a route that times out (curl exit 28) is flagged timeout:true and the row reason names it serve TIMEOUT, a harness/host condition and not a model verdict; the row is still never green'
  - '(cop ruling b) the route bound is per backend (cpu 300 s, cuda 60 s), declared once in the ladder contract serve_health.route_timeout_s, stamped into every route (timeout_s) and the record (route_timeout_s); an undeclared backend declines by name'
  - '(cop ruling c) before a cpu serve the 1-minute loadavg is compared with the core count and recorded (host_load); above it the ladder declines by name'
