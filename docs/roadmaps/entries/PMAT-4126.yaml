  - 'a serve route with no HTTP response (curl timeout or failure) is recorded as http null plus a curl_error naming why (a timeout says so); the serve object stays parseable'
  - 'one such route never erases the other routes'' records, and the verdict stays RED (a route with no response is not a 200)'
  - 'the row''s RED reason names the curl_error for a route without an http code'
