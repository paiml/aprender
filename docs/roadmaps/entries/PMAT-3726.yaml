  notes: 'Filed by the cop (aprender-04) from infra-c8''s measurement; owner aprender-c3, who reached the same root cause from the forward side (#3693). ROOT CAUSE: `GGUFModel::encode` (crates/aprender-serve/src/gguf/token.rs) was documented and implemented as greedy longest-match over each whole segment, with no pre-tokenizer and no merge ranks. `prepare_tokens_gguf` (the `apr run` path), `apr parity` and serve''s batch path all call it. Measured on apr 0.69.0 (225b2a9ab) against the pinned llama-tokenize (d1d3c3396) for "The quorum forbids it; cited refutes!!!": apr gave `Ġquo|rum Ġforbid|s … Ġrefute|s`, llama.cpp `Ġqu|orum Ġforb|ids … Ġref|utes`. On arbiter''s r891 prefix apr gave 253 ids and llama.cpp 248, with 16 differing spans. The lane''s "quoorum" is `Ġquo` (apr''s odd split of the prompt) joined to the canonical continuation `orum`. FIX (this row): new crates/aprender-serve/src/gguf/byte_level_bpe.rs, a port of llama.cpp''s reference: `unicode_regex_split_custom_qwen2`/`_qwen35` line for line (selected by tokenizer.ggml.pre; the fleet inventory has exactly these two: qwen2 covers qwen2/qwen2.5/qwen3/qwen3moe, qwen35 covers qwen35/qwen35moe), GPT-2 bytes_to_unicode, ranked merges from tokenizer.ggml.merges with a priority queue (lowest rank, then leftmost, as llm_tokenizer_bpe_session), special tokens by token_type CONTROL/USER_DEFINED/UNKNOWN longest first (tokenizer_st_partition). `GGUFModel::encode` routes every byte-level vocabulary through it. A byte-level file with an unimplemented pre-tokenizer keeps the greedy path and says so once on stderr, naming #3726. The old `<|...|>` special-token rule also missed USER_DEFINED `<think>`/`<tool_call>`. The gate follows the #3076 shape: scripts/check_tokenizer_parity.sh (PR-time case table, run by guard_tree) and scripts/tokenizer_parity.sh (model-backed, apr vs the pinned llama-tokenize, declared in [package.metadata.dogfood] for the pre-publish phase), reading ids from a new `apr tokenize encode MODEL (-p TEXT | -f FILE)`. That command reads only the GGUF metadata, calls the production GGUFModel::encode, and prints the path taken and decode(encode(x)) == x. Corpus: evidence/tokenizer-parity/corpus/ (public aprender source, a review brief over a public aprender commit, non-ASCII / whitespace / identifier / chat-template sets). MEASURED (receipts in evidence/tokenizer-parity/): lambda, release mode at 9026b70a5, 147/147 (21 GGUFs x 7 committed files, pinned llama-tokenize d1d3c3396 resolved by the default path); lambda with 4 real consumer briefs, 231/231 (21 x 11); gx10 (aarch64) at 9026b70a5 with the briefs, 132/132 (12 x 11; the pinned build prints d1d3c339 and tp_commit_matches accepts a 7+ hex prefix). Every pair: identical ids, canonical path, decode(encode(x)) == x. MUTANT (done_when 3): bytes >= 0x80 -> id 0 reintroduced; the gate goes RED, 14 of 22 pairs FAIL (the 8 that pass are the pure-ASCII files, as that mutation predicts), first mismatch at the first non-ASCII byte (mutant-id0-lambda.txt). GUARDS: guard_tree --no-cargo 82/82 at 9026b70a5 after three fixes it found: complexity (the splitter is a Splitter with one method per alternative; GGUFModel::encode fell from cognitive 60 to 41), shell lint (SC2075, SEC011), dogfood coverage (surface_audit.csv rows re-mapped through a line diff, one new row, denominator 837 -> 838 in contracts/apr-dogfood-coverage-v1.yaml and the apr-dogfood skill). done_when 4 (#3693 re-measure): an A/B of the fixed binary (9026b70a5) against the control (262dfb2f6, this branch's parent, which already carries #3672's template-once fix) on the two lane prompts at temperature 0 on CUDA, queued under the GPU lock on both hosts; recorded on #3693 and #3726 when it lands. OUT OF SCOPE, filed: aprender-core's BpeTokenizer and realizar's apr/tokenizer (the APR/HF paths) are #3742; SentencePiece GGUFs keep the greedy path and the gate reports them UNCOVERED, never PASS.'
