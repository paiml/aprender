  acceptance_criteria:
  - 'Issue #3726 done_when 1, verbatim: "apr''s token ids are **identical to llama.cpp''s** (the pinned comparator, `llama-tokenize` / `--verbose-prompt`) for every Q4_K model family in the inventory (qwen35, qwen3, qwen2 / qwen2.5, qwen3moe) on a corpus of real consumer briefs (#3716), source code, and non-ASCII sets (CJK, accented Latin, emoji, box-drawing, zero-width chars), and the round-trip decode(encode(x)) == x"'
