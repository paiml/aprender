  notes: 'Refs #3750 (not Closes: done_when 2 wants each site converted or justified, and the 17 header-only sites outside apr qa are #3761, PR B, 0.69.1). WHAT LANDS. crates/apr-cli/src/commands/model_header.rs: read_prefix, gguf_header (a GGUF header from a growing prefix: 16 MiB first, doubling, 256 MiB cap, refused past it, never read whole), gguf_arch_and_tensors, apr_header_prefix (APR v2 header + metadata + tensor index, bounded by data_offset). The 13 whole-file reads and one to_vec copy on the apr qa path are converted (docs/audits/3750-whole-file-model-reads.md, table 1): capability gate + cpu_only_architecture + hybrid_loader_architecture read the header (extract_gguf_arch_and_tensors and its to_vec are gone); is_gguf_format, the golden/format-parity/throughput/gpu-speedup magic checks read 8 bytes; the tokenizer reads in golden_output, throughput_gguf, format parity, gpu isolation and speedup x2 use the one map those gates already make (mapped.model). CASE ROW (done_when 1). model_header.rs header_reads_of_a_2_gib_gguf_keep_peak_rss_small: a real GGUF extended sparsely to 2 GiB; the probe runs gguf_arch_and_tensors, gguf_header, cpu_only_architecture and hybrid_loader_architecture in a CHILD process (this test binary, re-run on peak_rss_probe) and reads its VmHWM. Bound 256 MiB, measured not guessed: 44.4 MiB on the fixture, 59.5-60.3 MiB on a real 0.5B GGUF, 57.4-59.0 MiB on the real Qwen3-30B-A3B GGUF; with a whole-file read put back into gguf_arch_and_tensors, 2,136,776 KiB (RED). LEDGER (done_when 2, the LISTING). docs/audits/3750-whole-file-model-reads.md: git grep of fs::read( and read_to_end( over apr-cli, aprender-serve and aprender-core: 231 hits, 99 production + 132 test-only, plus the 13 converted. Every production site has a verdict and its use: DOC 9, NOT-MODEL 11, PR-B CONDITIONAL 1, PR-B HEADER-ONLY 11, PR-B MAGIC-ONLY 4, PR-B STREAMED 1 (eval verify_single_file hashes every byte), WHOLE-DATA 62. GX10 (done_when 3), apr qa on Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf (18,556,689,568 bytes), --features cuda builds, under flock /tmp/apr-gpu.lock choom -n 1000, --json --offline and every GPU/network gate skipped: before apr 0.69.0 (52f43da71) max RSS 36,278,440 KiB, after apr 0.69.0 (ff89fb6aa) 19,367,800 KiB, both qa passed rc 0. With --skip-contract (the capability predicates alone): 36,273,092 KiB in 1:10 -> 46,396 KiB in 0.14 s. The 19.36 GB left in the full run is HEAP (sampled RssAnon 19,357,084 KiB, RssFile 11,236 KiB) from the tensor_contract gate: RosettaStone::validate -> GgufReader::from_file, a read_to_end of the whole model. That gate reads every tensor value, so it is WHOLE-DATA in the ledger, marked could stream, and filed as #3790; it is not a capability predicate and this PR does not change it. ff89fb6aa is the measured binary''s commit; the commits after it add docs and the roadmap entry only, so the reviewed code is the code measured.'
