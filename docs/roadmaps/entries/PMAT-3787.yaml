  notes: 'Owner aprender-c3 (tokenizer), after #3742. DIAGNOSIS (measured): the term was the tokenizer. The greedy longest-match encoder in crates/aprender-serve/src/gguf/token.rs collected the byte offset of every character LEFT IN THE TEXT before each token it emitted, so encode was O(n^2) in the prompt. Every GGUF took it before #3726; since #3726 a byte-level vocabulary with an implemented pre-tokenizer takes the canonical encoder instead, and the greedy loop is the fallback for every other GGUF (SentencePiece llama/mistral/gemma vocabularies, a byte-level one with an unimplemented pre-tokenizer). aprender-3e binary for the #3596 ladder was apr 4ff26a07a, which does not contain #3726. THE FIX: greedy_prefix_ends reads only the first 1..=32 characters per token (the same prefixes, in the same order); split_on_special_tokens caches each special next occurrence and searches again only once passed (it searched the whole rest of the text for every special at every split); prepare_tokens_gguf prints a [prepare] line under --verbose or --trace with parse, template and tokenize times, the phases before load that nothing else timed. IDENTITY (evidence/tokenize-linear-3787/greedy-ab-lambda.txt): old (the batch-1 greedy loop) vs new ids byte-identical by cmp on 24 of 24 (vocabulary, file) pairs: the pinned tree ggml-vocab-llama-spm and ggml-vocab-gpt-2 (gpt2 with the unimplemented gpt-2 pre-tokenizer, so greedy) over the committed corpus and 3e prompts to 872 KB; gx10 identical at p20k and p60k on both. Unit: identity against verbatim copies of the replaced code (prefix offsets, the special split with ties in both orders, encode on a SentencePiece and a gpt2 vocabulary). GROWTH BEFORE AND AFTER, greedy path, wall per apr tokenize encode on llama-spm: before 1.32 s / 11.89 s / 91.9 s / 305.6 s at 71 KB / 205 KB / 503 KB / 872 KB (3x the text, 9x the time); after 0.042 / 0.073 / 0.156 / 0.240 s (floor 0.023 s); gx10 after 0.039 / 0.084 / 0.136 / 0.223 s. PER-PHASE (done_when 1; evidence/tokenize-linear-3787/phases-{lambda,gx10}-qwen35-9b.txt, harness evidence/tokenize-linear-3787/phases.py): Qwen3.5-9B-Q4_K_M, apr run -i PROMPT --chat -n 1 -v --no-gpu, stopped at Model loaded. BEFORE = apr 262dfb2f6 (pre-#3726, Qwen on the same greedy loop; its token counts reproduce 3e 4131/20085/59887/148563/263089 exactly), tokenize lambda 0.06 / 0.62 / 6.75 / 56.8 / 155.6 s and gx10 0.05 / 0.57 / 5.69 / 43.2 / 161.9 s at 4k/20k/60k/148k/262k; wall to Model loaded lambda 7.4 to 162.7 s, gx10 11.8 to 183.1 s (3e 168 s and 211 s terms, reproduced). AFTER = apr 37f702fdb: tokenize lambda 0.151 / 0.164 / 0.155 / 0.209 / 0.231 s and gx10 0.179 / 0.232 / 0.136 / 0.163 / 0.180 s, flat (about 0.15 s of it is the first build of the byte-level tables, cached per model); parse lambda 0.69 s, gx10 0.27 s warm; template at most 1.5 ms; load lambda 5.8 s, gx10 11.3 s warm; wall to Model loaded flat, lambda 6.9 s and gx10 11.8 s at 262k. The gx10 AFTER p4k row ran first on a cold page cache and is labelled. Read is inside the wall and under parse. NOT MEASURED HERE, stated: prefill at 148k and 262k needs #3596 batched prefill, not in this base (3e #3596 runs are the prefill column); the Qwen3.5 context check is #3596 code (08555906a), not in this base. COMPLEXITY CLASS (done_when 4; evidence/tokenize-linear-3787/mutants.txt): greedy_encode_work_is_linear_in_the_prompt counts work (characters read plus bytes searched, a cfg(test) counter), not wall time, so it cannot flake on a loaded runner: 4x the prompt costs 4.02x the work. M1 (a scan that collects every offset before take) 15.2x, RED; M2 (the split re-searches every special) 9.9x, RED. A first version of the test used chat turns only and M1 survived it (each turn is bounded by specials); the prompt now grows a special-free body too. DONE_WHEN 3: see the cop ruling below. Side observation, not this row: the Qwen3.5 chat wrapper is raw + 11 tokens in apr and raw + 8 in llama.cpp (template, #3755 area; the raw ids are identical to llama.cpp). guard_tree on 37f702fdb: every guard passes but check_no_claim_literals, a batch-1 base finding in crates/apr-cli/src/commands/run_tests_layer_trace.rs:57 (PMAT-3718 WIP 3fadee114), a file this row does not touch.'
