  notes: 'Release-tooling lane (cop, aprender-04), on the 0.69.1 release path, STACKED ON #3717 (branch PMAT-3717-models-t1-both-hosts, receipted head cee1c410f; that is this row''s quorum base, as the issue requires, since it changes autopilot.sh''s hosts step). #3731 and #3732 fold together (cop ruling, quoted above). SCOPE: scripts/release/autopilot.sh (the hosts step, a new postpub step, a new ledger step, install without the dogfood, close without the ledger), scripts/release/host_receipt.sh (new), scripts/check_multiplatform_dogfood.sh (the DOGFOOD_RECEIPTS_DIR seam, the train blocks, REPORT_ONLY, the bench/parity REPORT wording), scripts/parity_host_receipt.sh (the per-band GPU lock only), scripts/lib/gpu_band_lock.sh (new), scripts/lib/yaml_twin.py (new), scripts/lib/bench_receipt.py and scripts/lib/perf_receipt.py (their one YAML read each goes through yaml_twin.load), scripts/check_release_host_receipts.sh (new, the case table), and this fragment. HOW EACH ACCEPTANCE ITEM IS MET. (1) THE RECEIPTS, from the train, in the gate''s schema: scripts/release/host_receipt.sh <V> <host> runs on each host from a KIT = the release commit''s Cargo.toml + its whole scripts/ tree + the JSON twins below (a hand-kept file list had drifted: the first proof''s parity died on gx10 with "scripts/perf_isolation.sh: No such file"). It installs as a user does (`cargo install aprender --version =V --locked` into a scratch root, never PATH), and writes evidence/dogfood/<V>/<host>.json: provenance crates.io + asset aprender-<V>.crate, sha256_published (the sparse-index cksum) AND sha256_measured (the downloaded .crate) as two fields, `apr devices --json` verbatim, generate{model_sha256, backend_line_verbatim, fallback_line_verbatim, used_gpu, tokens, wall_ms, output_sane} from `apr run --format json` (stdout JSON, stderr lines verbatim) or generate:null with the reason in unmeasured[], driver, nproc, cpu, os/arch from uname (the Darwin branch is table-driven), and a never-empty unmeasured[]. The bench and parity blocks come from the existing producers; a refusal leaves <block>_attempt{status,rc,reason}. It is bash-3.2 safe (mini), with the clock, hashes and JSON in python3. (2) THE ORDER: autopilot STEPS are now ... cascade install hosts postpub ledger close. `install` no longer runs the dogfood. `hosts` produces the receipts (the gate''s own HOSTS matrix, READ from check_multiplatform_dogfood.sh, never re-listed; the train host locally, the rest over ssh, in parallel) into $AP/receipts/dogfood. `postpub` runs the post-publish dogfood with DOGFOOD_RECEIPTS_DIR=$AP/receipts/dogfood (the tag''s tree cannot hold files made after it). (3) FAIL CLOSED: a post-publish NO-GO is a STOP, and so is a receipt that is not GO, not for this commit, or still DEFERS a row, read from the dogfood''s own receipt, not only its rc. (4) INFRA IS NEVER A HOST VERDICT: $AP/receipts is created before the first write, and every write target is proved writable first, so a missing or vanished dir is ONE STOP naming the dir ("INFRA the receipt dir ... is missing or unwritable"); an ssh that cannot connect (rc 255, named once as SSH_FAILED) and a host that returns no parseable receipt for (V, itself) are INFRA lines, counted apart from host failures. The issue''s falsifier maps to B2 (removed before the step: it is created, green), B3 (removed mid-step: STOP naming the dir, no host count) and B4 (a file in its place: STOP naming it). (5) NO `jq -e`: every receipt read is python3 (S1 asserts neither script carries it). THE COP''S RULINGS AS BUILT (all recorded on the issue): mini is visited like every host, with a Darwin row (A2). First-green on the PUBLISHED 0.68.2 before it blocks: results below. Every block that went green there BLOCKS for 0.69.1 in check_multiplatform_dogfood.sh: install/version as before, plus generate sane, sha256_published = sha256_measured, a non-empty unmeasured[], and the bench block (an ABSENT bench block now FAILs, naming the receipt''s recorded refusal); the hand-made receipts of 0.63.0/0.64.0/0.65.2 are exempt by name (TRAIN_RECEIPT_GRANDFATHERED). A (host, block) that could NOT go green is listed in REPORT_ONLY as VERSION:HOST:BLOCK:#ISSUE and applies only to its version, and only to a block that is ABSENT or VALID-BUT-NOT-GREEN (a required lane missing, or a lane below its floor: what lambda''s complete, valid 0.40x block measured); a block that is INVALID is judged as always, so an entry never excuses a malformed receipt. Its row is still printed as REPORT, and postpub appends the gate''s REPORT rows to the GitHub release notes, once. THE LEDGER (cop ruling): the new `ledger` step commits the receipts (evidence/dogfood/<V>/) and the train record (docs/build-ledger/<day>/, ledger.py moved here from close) onto ledger/<V>, based on origin/main or on the existing origin/ledger/<V> so it never force-pushes, pushes, and opens the PR UNARMED (or reuses it); any failure STOPs before close. THE GPU RULE (rev 5): generate and bench queue through `gpu-q --prio N` (the train passes --gpu-prio 1, proofs 8; a host without gpu-q falls back to `flock -w <wait>` + choom and says so in unmeasured[]); --gpu-wait (default 3600 s) bounds every wait. The parity run is NOT wrapped: a first proof held lambda''s lock 54+ min at 1% GPU through its cpu bands. parity_host_receipt.sh now takes the lock PER BAND and ONLY for GPU work (the accel probe and each accel band) through scripts/lib/gpu_band_lock.sh: a holder process queues, writes a ready file INSIDE the lock (a queue that exits without running the holder is therefore never "admitted"), and at GPU_BAND_TIMEOUT_S (<= 1200) kills the band''s registered servers while still holding the lock, so the band FAILs "ran past"; cpu bands never take it; a probe the queue never admits is a refusal ("accel lane UNMEASURED"), never "0 layers". PYYAML ON MINI (cop ruling, no host change): the kit carries JSON twins of scripts/perf-matrix.yaml and scripts/perf-receipt-fields.yaml, written by the release commit''s scripts/lib/yaml_twin.py where PyYAML exists and never committed; the two readers load the twin only when `import yaml` fails. THE CASE TABLE, scripts/check_release_host_receipts.sh (guard_tree-wired, --no-cargo), drives the REAL scripts (host_receipt.sh in a kit; autopilot.sh through its own from/to steps in a throwaway release repo whose kit IS the real host_receipt.sh and whose dogfood stub runs the REAL check_multiplatform_dogfood.sh over the receipts the train wrote; parity_host_receipt.sh''s real run_band() extracted; the real gpu_band_lock.sh on a real flock(1) over scratch locks; the real yaml readers with PyYAML blocked) with stubs for the crates.io install, apr, uname/lscpu/nproc/sysctl/nvidia-smi (its failure text on STDOUT, as intel''s), flock/choom/gpu-q, ssh (each host''s uname and GPU; unreachable; toolchain-less; removing $AP/receipts mid-step), gh (pr list/create, release view/edit) and the crates.io index (a file:// record). ROWS: A1 gpu-linux (every schema field; gpu-q prio 5 around generate and bench only; parity handed the rule), A2 darwin, A3 install-fails (a receipt is still written; unmeasured names install/generate/bench/parity), A4 parity-refuses (parity_attempt), A5 insane-answer, A6 two-hashes, A7 bad-version, A8 nvsmi-fails, A9 gpu-fallback (the wgpu rejection verbatim), A10 legacy-wrap, A11 bad-prio; B1 train-green (HOST-RECEIPT lines BEFORE the post-publish dogfood, which reads $AP/receipts/dogfood; the REAL gate accepts all four incl. the new blocks; mini is Darwin; the kit carries both JSON twins; lambda and gx10 queued at prio 1), B2 dir-removed, B3 dir-vanishes (the issue''s falsifier), B4 dir-blocked, B5 unreachable (ssh 255 = INFRA, 0 host failures), B6 env-no-toolchain, B7 postpub-nogo, B8 postpub-defer, B9 postpub-noreceipt, B10 install-only, B11 postpub-alone, B12 report-notes (once); L1 ledger-pr (receipts + record on ledger/<V> atop main, PR opened UNARMED), L2 ledger-rerun (fast-forward, no second PR), L3 ledger-empty, L4 ledger-rejected; G1-G14 the gate (a listed absent parity block REPORTs, unlisted FAILs; another version''s entry is inert; a PRESENT invalid block FAILs; the real list''s shape; generate null / insane, hash mismatch, empty unmeasured FAIL; the hand-made versions REPORT; an absent bench block FAILs unless listed; a listed VALID block below floor or missing a required lane REPORTs, unlisted FAILs); T1 twin-equal, T2 twin-missing; P1-P4 the band lock; R1-R4 run_band (cpu free, accel held then freed, refused, bound); S1 no-jq-e. MUTANTS, one per claim, each killed: hr-drop-accel-line, hr-no-gpu-wrap, hr-gpuq-not-preferred, hr-parity-nested, hr-parity-wrapped, hr-os-literal, hr-drop-attempt, hr-sane-always, hr-merge-hashes, hr-no-version-check, hr-nvsmi-any-rc, hr-drop-fallback, hr-version-key; ap-steps-reordered, ap-no-receipts-env, ap-hosts-literal, ap-receipt-prio, ap-drop-mkdir, ap-no-receipt-to, ap-255-is-a-host, ap-drop-nogo-stop, ap-drop-receipt-read, ap-install-dogfood, ap-drop-notes, ap-ledger-no-push, ap-ledger-armed, ap-ledger-from-main, ap-ledger-no-stop, ap-no-twins; gate-any-version, gate-report-present, gate-floor-any, gate-bench-absent-report, gate-gen-any, gate-hash-any, gate-unmeasured-any; lock-release-noop, lock-bound-kills-none, band-lock-any-class; reader-yaml-only, twin-writes-wrong. MEASURED at this commit: `bash scripts/check_release_host_receipts.sh` "PASS 94 row(s) and mutant(s): the train emits, then judges, every host receipt; infra is never a host verdict", rc 0, with the real REPORT_ONLY list in place (row G4 checks its shape). The REAL gate over the four REAL 0.68.2 receipts (a fixture repo at 0.68.2, the list re-keyed to 0.68.2) prints: lambda ok/ok, REPORT bench #3758, REPORT parity "needs lane(s) cuda, receipt has: cpu" #3805; intel ok/ok, ok bench (median 3182 ms), REPORT parity #2855; gx10 ok, FAIL generate (null, the queue refusal quoted), REPORT bench #3758, REPORT parity #3805; mini ok/ok, REPORT bench #3758, REPORT parity #2855.. FIRST-GREEN ON THE PUBLISHED 0.68.2 (host_receipt.sh from the kit, cargo install =0.68.2 --locked, .crate sha256 published = measured = 5dc9e307...44ae85 on every host): committed as evidence/dogfood/0.68.2/{lambda,intel,gx10,mini}.json with a provenance README (the gate never reads that dir for a cut). install rc 0 + version_tested: GREEN on all four. .crate sha256 published = measured: GREEN on all four. generate (2+2 -> "4", output_sane): GREEN on lambda, intel, mini, and on gx10 in its kit3 and kit5 runs (rc 0, "4"); gx10''s committed kit6 receipt has generate:null because gpu-q never admitted the prio-8 call within GPUQ_WAIT=3600 s (release tickets held the lock), recorded verbatim in unmeasured[] -- the gate FAILs that receipt''s generate row, as it should for a non-measurement. On EVERY host the default `apr run` chose wgpu, rejected it (cosine 0.955 vs CPU) and fell back to CPU (#3757). unmeasured[] non-empty: GREEN on all four. So install, sha256, generate and unmeasured BLOCK for 0.69.1. bench (apr bench vs spec H12): lambda green 1 of 2 runs, intel green 1 of 3 (9.6 tok/s refused twice), gx10 refused 2 of 2 measured (+1 not admitted), mini refused 3 of 3 (7.2 tok/s): cannot go green reliably, REPORT owed by #3758 on all four. parity: lambda''s block is VALID (4 cpu bands lock-free, the accel probe under the per-band lock) but the cpu lane is 0.40x (apr 14.0/32.7/36.2/41.4 vs llama.cpp 66.6/129.8/123.1/165.2 tok/s at c1/4/8/16) and the gate demands a cuda lane the crates.io build cannot emit (#3805); intel refused: band[16] subject rate 0, 16/16 requests past the 120 s timeout (#2855); mini refused: band[8] and band[16] subject rates 0 (#2855); gx10 refused: the accel probe was not admitted within 3600 s ("accel lane is UNMEASURED, and that is not the same as no accelerator"), owed by #3805, which owns gx10''s lane for the same reason as lambda''s. THE 0.69.1 REPORT_ONLY LIST, each entry a measured refusal filed where it is owned: 0.69.1:lambda:parity:#3805 0.69.1:gx10:parity:#3805 0.69.1:intel:parity:#2855 0.69.1:mini:parity:#2855 0.69.1:lambda:bench:#3758 0.69.1:intel:bench:#3758 0.69.1:gx10:bench:#3758 0.69.1:mini:bench:#3758. FILED from the proof: #3756 (pinned llama.cpp not provisioned on intel/mini; the cop provisioned both), #3757 (the published binary''s default path picks wgpu and rejects it, cosine 0.955 vs CPU, on all four hosts; macOS says Vulkan), #3758 (apr bench below spec H12 on intel 9.6 / mini 7.2 tok/s, and bench_host_receipt.sh drops the reason), #2855 (existing: the cpu lane at c=16 times out every request). NOT RUN: a real train. The 0.69.1 hosts/postpub/ledger steps are that measurement, hence Refs #3731.'
