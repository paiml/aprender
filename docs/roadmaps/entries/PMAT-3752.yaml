items. - The following are not enumerations: an argv, meaning flags interleaved with their values; a script''s own option-parser arms; and clap''s generated `help`/`version` args, which are not apr''s surface. - Anti-bypass mutant (required): `[run, chat, serve, code, x]` (verbs padded with a non-verb) is RED. So is the same list split across two adjacent literals. - A probe list that names verbs only to check them AGAINST the surface, like the 2-of-5 transport probe, is below the majority bar and so not an enumeration." WHAT THIS ROW DOES (S3.1, S3.2, S3.3, S3.5): crates/apr-cli/src/hand_list_guard.rs, a #[cfg(test)] module of apr-cli''s lib. The vocabulary is S1''s surface, crate::surface::emit() (#3749, the document `apr surface --json` prints): verbs = every command path token and alias; flags of a verb = --long, -short, long and short aliases of that path plus global_args. Nothing in the guard names a verb. An enumeration = a literal sequence with >= 2 verbs (or flags of one verb) that are a strict majority of its items; also read: shell arrays with NAME+=() accumulation, for-in word lists, verb case alternations (flag arms are the script''s own option parser), bracketed string-literal lists merged across `+` joins (Python heredocs, Rust), YAML sequences, and strings spelled as lists (comma-separated anywhere; space-separated only as a shell assignment whose every word is a verb). Note: the amendment''s padding example uses `x`, but `x` is itself a surface verb (alimentar''s `data x`), so the anti-bypass fixture pads with `zzz`. Scan set: the gates Cargo.toml [package.metadata.dogfood] declares (read from the manifest), scripts/release/**, scripts/dogfood*.sh, .claude/skills/apr-dogfood/**, contracts/model-capability-ladder*.yaml and *release-readiness*.yaml, and crates/aprender-contracts/src/**/release_evidence*.rs. No allow-list: the fixtures live in the guard''s own file, which a test proves is outside the scan set (S3.3). Tests: the case table (issue mutant 4 plus both anti-bypass mutants, 17 RED rows and 15 GREEN rows including the measured false-positive shapes), the vocabulary is the emitted surface (the hidden `surface` verb is in it; two of run''s own flags are RED), the scan set excludes the guard, and the real-tree gate. WHERE IT RUNS (S3.5): it is an apr-cli lib test, so workspace-test (a REQUIRED check that already compiles apr-cli''s lib) runs it on every PR, with no extra build and no workflow edit; and the pre-publish dogfood runs it through `make coverage-check` = `cargo llvm-cov test --workspace --exclude aprender-gpu --lib`, where a failing test exits 1 and is a dogfood NO-GO. It is not a scripts/*.sh guard, so guard_tree has nothing to run for it. MEASURED: 4/4 tests green on main + S1 (ee31df219); with #3738''s B1 ladder contract dropped in, the gate is RED naming `contracts/model-capability-ladder-v1.yaml:ladder.cells.verbs enumerates 4 surface verbs {chat, code, run, serve}` (then restored). NOT YET: S3.4 (the ladder and B1 cells consume S2''s derived cells) needs S2; this row stacks on S1 and S2 and folds after S2 (cop ruling), so the release_evidence.rs VERBS first-target RED (S3.2) is proven when S2''s branch is the base.'
