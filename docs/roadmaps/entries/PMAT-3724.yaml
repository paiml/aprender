  notes: 'Epic #3710 (0.69.1) row "qwen3-8b-q4km on lambda CUDA: aprender-fd". MEASURED on 0.69.0 (225b2a9ab, --features cuda, lambda RTX 4090): apr qa gives rc 5, golden_output "Empty output", on the gate''s CPU leg (the GPU leg passed; a non-cuda build is also Empty). An env-gated dump of the gate''s CPU generation for "What is 2+2?" is 527 tokens = 15 prompt + the full 512 budget. It opens with <think> (151667) and is still reasoning at the cut, and strip_thinking_blocks truncates at the unclosed <think>. At --max-tokens 2048 the think blocks are 545 / 114 / 126 tokens and the gate passes 3/3. ROOT CAUSE: the golden gate sent plain ChatML, i.e. Qwen3 in thinking mode, which no production path uses. realizar''s detect_format_from_name gives every qwen3* except qwen3moe Qwen3NoThinkTemplate (PMAT-181), and apr serve on lambda CUDA answers "2 + 2 = 4." / "The capital of France is Paris." / a greeting, all finish_reason stop. apr chat templated through aprender-core''s detector (every qwen* becomes ChatML) and so THOUGHT where serve does not: its 2+2 turn on lambda CUDA printed only <think> text. THE FIX: (1) golden_output.rs: cases are GoldenCase {prompt, expected, thinking}. A thinking-capable arch (realizar''s detector says Qwen3NoThink; general.architecture) is judged DIRECT through realizar''s own Qwen3NoThinkTemplate (budget 512) AND THINKING through plain ChatML (GOLDEN_THINK_BUDGET 4096, about 7.5x the longest measured block, per the operator''s "overdo it"). Every other arch keeps byte-identical ChatML, pinned by golden_prompts_stay_byte_identical_chatml_off_qwen3. Both the dense gate and the runtime (hybrid qwen35) gate use it. (2) output_verification.rs golden_answer(): a think block still open after the last <think> is a failure "think block unclosed within the N-token budget", never stripped to "", on the CPU, GPU and runtime legs. (3) apr chat: production_chat_template() gives qwen3* realizar''s serve template through a RealizarTemplate adapter, and every other arch keeps aprender-core''s (pinned by tests). No check is relaxed. MEASURED WITH THE FIX (code head b89d126fc; later commits are comments and this fragment only), apr qa with the ladder flags, golden in BOTH modes = 6 cases (3 direct + 3 thinking at 4096). lambda (x86, RTX 4090, apr 0.69.0 (b89d126fc)): Qwen3-8B 6/6 rc 0; Qwen3.5-0.8B/2B/4B/9B/27B 6/6 rc 0 each, through the runtime entry point on GPU. gx10 (aarch64, GB10, apr 0.69.0 (b89d126fc), built on gx10): Qwen3-8B 6/6 rc 0; Qwen3.5-0.8B/2B/4B/9B/27B 6/6 rc 0 each. capability_match passed on every row. DONE_WHEN 4, the modalities on qwen3-8b, lambda CUDA, fix binary, each under the host GPU lock, temperature 0: `apr chat --gpu` prints "Detected ChatML chat template (Qwen3 no-think, as `apr serve`)" and answers "2 + 2 equals 4." and "The capital of France is Paris." (0.69.0 chat printed only <think> text for 2+2); `apr serve run --gpu`, POST /v1/chat/completions: "2 + 2 = 4." and "The capital of France is Paris.", finish_reason stop, 22 prompt tokens each; `apr run --prompt Q --chat --gpu`: "2 + 2 equals 4." and "The capital of France is Paris.", rc 0, no CPU fallback. DONE_WHEN 5, the x86-vs-aarch64 think length, measured with the same env-gated token dump built from 225b2a9ab on each host, CPU leg, greedy, budget 2048, Qwen3-8B-Q4_K_M sha d98cdcbd…: "What is 2+2?" reasons for 545 tokens on lambda (x86) and 396 on gx10 (aarch64). That is why lambda overran 512 and gx10 did not. "Hello there…" (114) and "What is the capital of France?" (126) are identical on both hosts. The two greedy trajectories share a 141-token prefix and diverge at generated token #126 (gx10 picks id 807, lambda id 279): a near-tie argmax that the x86 and aarch64 CPU kernels break differently. It is a CPU numerics fact the parity gate should know about, and the reason a golden budget may not sit near a measured length. SEAM: #3755 (the hand-typed no-think scaffold `<think>\n</think>\n` versus the official `<think>\n\n</think>\n\n`) is fixed with #3723 by rendering the GGUF''s own tokenizer.chat_template. This gate builds its direct prompts through production''s template, so it inherits that fix and does not keep a copy. Out of scope, on their own rows: the thinking toggle #3723, the empty-completion contract #3720, and the GPU-leg skip fix #3711.'
