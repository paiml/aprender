  notes: 'ACCEPTANCE (transcribed from gh#3577, incl. the dated AMENDMENT of 2026-09-21 02:00Z which supersedes the original item 1; §6 1e — the fragment transcribes the issue, it does not edit it). Spec: docs/specifications/ruling-receipts-under-contract.md (operator ruling 2026-09-20). ITEM 1 AS AMENDED, verbatim: "contracts/parity-receipt-v2.yaml carries the shape (the constraints table below, unchanged) in its shape: block, exported to contracts/shapes.ttl. contracts/parity-receipt-v1.yaml is the SHAPELESS superseded form and says why in its own text: no v1 instance exists after the back-fill, and a shape over zero instances is a vacuous pass. A v1 record is refused BY NAME by the extractor (extract:parity-receipt) and, independently, by scripts/parity_receipt_denominator.sh — two readers, both wired (#3600 ci.yml step). A future v1 instance is therefore a refusal, not a silent pass." WHY AMENDED: the original item 1 said "parity-receipt-v1.yaml with its shape" and predates the migration — all 7 records went to v2 in the same commit, so v1 has ZERO instances, and a shape over a class nothing instantiates passes vacuously, which is the defect #3610 names and #3622 makes the shapes gate DECLINE on. Following it literally would add in one PR the thing the other PR exists to refuse. Both pro lanes read the original correctly and failed the PR on it; the ruling is on the acceptance, not the lanes. ONT-4c3 LEDGER BINDING: that ledger lives in paiml/infra (ONT-001 v4.10, infra#831) and CANNOT be done from this repository. The aprender-side deliverable is extractor + shape + denominator + receipts; the ledger row is infra s. The acceptance reads "bound in the ONT-001 ledger" as infra s row, CITED, not as a change here. REMAINING done_when, unchanged: extract:parity-receipt implemented; pv lint --gate shapes --path evidence/ in the required check; PR body shows 7 older receipts RED before back-fill and 0 after, plant violation = 1, mutation RED, pc_shape fired; check_par