  notes: 'Operator, verbatim (issue body): "you must ensure all models Q4_K CUDA work; the end. on gx10 and lambda-labs". Cop ruling relayed by aprender-04 (operator "yes, to all"): NEW kernels are cuda-oxide first, each with a CPU twin and a per-kernel differential test on sm_89 and sm_121; if oxide cannot express one, say which and why on #3714 before any hand PTX. Gap list, measured on 225b2a9ab cuda builds on both hosts before any code: https://github.com/paiml/aprender/issues/3714#issuecomment-5763628862. The issue is delivered as four rows, each its own PR, each `Refs #3714` until the last. R1 (this PR) = done_when 1 and 3. It adds NO kernel, so the oxide ruling does not apply to it: a device-resident Qwen3MoeCudaModel (gguf/cuda/forward_qwen3_moe_resident.rs) on the #3090 Qwen35CudaModel pattern, built from existing executor kernels (Q4_K/Q6_K/F32 GEMV, experts at base + e*stride in one stacked allocation, SwiGLU, RMSNorm, per-head RMSNorm, NEOX rope, GQA decode attention, residual add, and elementwise_mul_into, an allocation-free wrapper over the existing ElementwiseMul kernel), routing on the host through route_top_k, the one routing rule shared with the CPU layers; wired where the gap list showed CUDA was never tried (infer/inference_result.rs -> infer/qwen3_moe_dispatch.rs) behind the runtime F2 rule, whose CPU reference runs with FP32 activations (quantize::with_fp32_activations, a dedicated rayon pool); the fit check calls realizar::capacity::plan, lifted byte-identical from #3596 (aprender-3e) so one fit computation serves both paths; and qa: a gate that errors is a FAILED row and the report is always written (qa.rs dispatch_gate), qwen3moe routes golden/throughput through the runtime entry point (qa_gguf.rs), and the dense-instrument gates skip naming the MoE placeholder. Chat/serve --gpu (api/cuda_chat_backend.rs) keep the CPU chain in R1: they need a persistent resident model, a named remainder. R2 = done_when 2 (apr parity for qwen3moe at >= 64 positions, plus per-op rows for #3715). R3 = the v2 kernels (device top-k, fused scaled accumulate, expert gather), oxide first. R4 = done_when 4 with aprender-62 (#3712). Files owned by other sessions and not touched: crates/apr-cli/src/commands/golden_output.rs and output_verification.rs (aprender-0e #3711, aprender-fd), cuda/executor/layers/cublas_prefill* (aprender-37).'
