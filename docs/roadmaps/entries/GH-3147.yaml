  acceptance_criteria:
  - '[ ] Reconstruction: for 200 random `f64` matrices with shapes spanning `m<n`, `m=n`, `m>n`, rank-deficient, and ill-conditioned (cond >= 1e8), `||A - U S V^T||_F / ||A||_F <= 1e-10`. An assertion that merely checks `is_ok()` does not satisfy this.'
  - '[ ] Orthonormality property test (proptest): `||U^T U - I||_inf <= 1e-10` and same for `V`, over generated shapes.'
  - '[ ] Singular values are non-negative and sorted descending — asserted, not assumed.'
  - '[ ] Oracle parity: singular VALUES match `scipy.linalg.svd` within `1e-9` relative on pinned fixtures committed under `crates/aprender-compute/tests/fixtures/`. Singular vectors compared up to sign after the sign convention is applied.'
  - '[ ] Randomized path: for a matrix with a known rank-`k` spectrum plus noise, randomized SVD with `p=10, q=2` recovers the top-`k` singular values within 1% of the exact ones.'
  - '[ ] Rank-deficient input returns exact zeros (not 1e-17 noise) for the null singular values, or documents the tolerance it does guarantee.'
  - '[ ] A `KernelContract` YAML under `contracts/` with the reconstruction and orthonormality equations as proof obligations, validated by `pv validate`.'
  - '[ ] Mutation-verified: reverting the bidiagonalization step turns the reconstruction test RED.'
