  notes: '0.69.1 row (#3710). Filed and assigned by the cop, aprender-04, who ruled the policy: "FP8 prefill OFF at cc ≥ 100 until root-caused … correctness beats speed". Stacked on PMAT-3759. FINDING. With PMAT-3727, 3728 and 3759 fixed, qwen2.5-coder-7b Q4_K_M on gx10 (GB10, sm_121) with `BATCHED_PREFILL=1` still failed the F2 gate at pos 1 (argmax 198 = 198, cos 0.8720) and fell back to CPU. On that binary `FP8_PREFILL=0` was green, and `DIRECT_FP32_GEMV=1` stayed at 0.8716 (not the CPU reference). The same FP8 batched path is green on lambda (RTX 4090, sm_89). gx10''s default resolves serial prefill, so this was latent in the default configuration. `detect_fp8_prefill` documented "OFF for Blackwell", but the code enabled it at cc >= 89 (PMAT-410). Contract gpu-context-health-v1 said both: its equation had become `fp8_enabled = (cc >= 89)`, while its own GCH-INV-001 and FT-GPU-CTX-001 require false for every cc >= 100. None of its falsification tests named a test, so nothing ran the prediction. HOW done_when 1 IS MET. New pure `fp8_prefill_policy(cc, FP8_PREFILL)` in `cuda/gpu_profile.rs`: default ON for cc 89..100 (Ada, Hopper), OFF below and at cc >= 100 (`FP8_PREFILL_MAX_CC_EXCLUSIVE = 100`), with `FP8_PREFILL=0/1` still overriding. `detect_fp8_prefill` only reads the env and calls it. FP8 decode follows it through `detect_fp8_decode`''s existing fallthrough. Tests `fp8_prefill_policy_tests_3785`: a 12-row table (cc 75/86 off, 89/90 on, 100/120/121 off, the override forcing on at 121 and off at 89, garbage env values) plus an exhaustive sweep of cc 100..256 (the contract''s Kani bound). MUTANT: restore the PMAT-410 policy `cc >= 89` → both RED, first at `fp8_prefill_policy(cc=100, FP8_PREFILL=None)`. Trace: model init prints `[#3785] prefill GEMM precision: FP16|FP8 (E4M3) (cc=N; FP8 prefill defaults on for cc 89..100 only, FP8_PREFILL=0/1 overrides)`, unconditionally like the `[GH-129]`/`[PMAT-053]` lines beside it (the crate''s `verbose()` is REALIZAR_VERBOSE, not `-v`). Contract: the equation''s formula and invariants now say `89 <= cc < 100 unless FP8_PREFILL overrides`, with the #3785 measurement, and FT-GPU-CTX-001/003 name the test. done_when 2 (root cause: the first op that diverges on sm_121 under FP8 batched prefill) is NOT in this change and stays open on the issue; re-enabling FP8 on Blackwell is its own row, gated on the same cell. STOP LIST: no change to FP8 kernels or GEMM routing; only the default policy, its trace line, the contract and the test. MEASURED (gpu-q prio 1, binaries pinned by `--version`): gx10, binary `b88f96257`, `BATCHED_PREFILL=1`: trace "[#3785] prefill GEMM precision: FP16 (cc=121; …)", rc 0, `Backend: GPU (NVIDIA GB10)`, "The capital of France is Paris.", `apr qa` rc 0. Control, same binary plus `FP8_PREFILL=1`: trace "FP8 (E4M3) (cc=121; …)", pos 1 cos 0.8720 → rc 14. So the policy is the mechanism. (An earlier binary `73176dc4c`, the same policy without the unconditional trace line, gave the same pair: rc 0 with qa 3/3, and 0.8720 forced.) lambda, `b88f96257`, default: trace "FP8 (E4M3) (cc=89; …)", `[PMAT-053] FP8 weight cache: 197 matrices cached`, rc 0, GPU, "Paris", qa 3/3. FP8 is unchanged on Ada. This commit differs from `b88f96257` only by the restack onto PMAT-3759''s final fragment (no code). GATES: `cargo test -p aprender-serve --lib --features cuda fp8_prefill_policy` 2 passed; `cargo clippy -p aprender-serve --lib --features cuda -- -D warnings` rc 0; `cargo fmt --all -- --check` rc 0; `pv validate` and `pv lint contracts/gpu-context-health-v1.yaml` PASS. WITH THE STACK: qwen2.5-coder-7b is green on lambda default and gx10 `BATCHED_PREFILL=1`, which is #3728''s done_when 3.'
