  notes: 'Assigned by the cop (aprender-04) as the first item of the release-tooling lane, to land before the 0.70 bump. Fixtures and stubs only: nothing here ran against the live 0.69 train, its state dir, or a publish token. SCOPE: scripts/release/prepare_bump.sh, scripts/check_pr_closes_issue.sh, the new scripts/check_release_bump_pr_body.sh, and this fragment. HOW IT IS MET. (1) --ship builds the body BEFORE the cargo checks, the commit and the push (it used to be built after the push). It asks the guard for the refs that owe a reason through a new `check_pr_closes_issue.sh --list-owed --body FILE`, which prints the output of the SAME classify_refs() the judge uses (refactored out of check_body_text, behaviour unchanged), and appends ONE line `keep-open: #A #B -- cited by the CHANGELOG for context; each closes via its own PR; the release EPIC closes at T-4`, whose reason is done_when 1''s parenthetical, verbatim. The epic-and-refs row pins the whole line. When nothing is owed there is no line. WHICH REFS (done_when 1 as amended; the ORIGINAL read "derives every `#N` in the generated body that isn''t under a closing keyword", and quorum round 2''s lane 1 FAILed on that literal reading, which is why the issue author amended it): the guard''s own set, so references PROVEN to be pull requests or closed issues are left out, exactly as the judge leaves them out, and an unresolvable ref is kept (fails closed). Measured on the real 0.69.0 body: 61 distinct #N, of which the guard owes 5 (#3080 #3545 #3571 #3602 #3658), which is the same 5 the CI step flagged and aprender-62 named by hand. Naming all 61 would list merged PRs in a keep-open line. THE REASON TEXT is the ticket''s own. Quorum round 1 FAILed an earlier wording that described the close MECHANISM instead (lane 1, gemini-3.1-pro-high: the reason must be done_when 1''s text), and the ticket''s text wins. Its last clause is a statement about WHEN, and it holds today: the epic is closed at T-4, by hand (0.68.2''s #3477, closer=null, 2026-09-20T08:23Z; the cop is closing 0.69.0''s #3080 right after the crates.io publish). #3708, same owner and queued before the 0.70 bump that first emits this line, makes the close step do it mechanically: autopilot.sh close (lines 301-307) comments on the epic, then requires 0 open milestone items, and closes nothing. The reason carries no `#`, so the line cannot add a closing reference (a line that closed the epic on the bump''s merge would be the #3400 landmine). (2) `bash check_pr_closes_issue.sh --body pr_body.md || die "the bump PR body fails §6 R-2; nothing committed, pushed or opened"` runs before the cargo checks, the commit, the push and `gh pr create`. (3) scripts/check_release_bump_pr_body.sh is a scripts/check_*.sh, so guard_tree.sh runs it bare in guard-tree with no workflow edit (the check_t2_preflight_verdict.sh pattern). It runs the REAL prepare_bump.sh --ship end to end in a throwaway fixture: a local bare origin, a bump clone on release-9.9.9 with the CHANGELOG section uncommitted, a T-2 GO receipt, stubs for gh (records calls, captures --body-file), cargo and the arm helper, and ref kinds from the guard''s PR_CLOSES_REF_KIND_CMD seam. ROWS: guard-case-table (runs check_pr_closes_issue.sh --self-test, see DARK TABLE below); epic-and-refs (EPIC #9002 + `refs #9005` + PR #9001 + `closes #9006` -> PR opened, body PASSes the guard, ONE keep-open line naming exactly #9002 #9005, not the PR and not the closed-by-keyword ref); no-keep-open (that body minus its keep-open line -> guard rc 1); adds-no-close (the keep-open line alone -> --list-owed lists every ref it names); prs-only (no line, still PASS); landmine (`no-close: #9005` -> non-zero, no `gh pr create`, no branch on origin). COMMITTED MUTANTS, run on every bare run: drop-keep-open (the printf line removed) is killed by epic-and-refs, "exited 1: STOP the bump PR body fails §6 R-2"; drop-refusal is killed by landmine, "exited 0 on a landmine body". A missing subject or mutation anchor is ENV rc 2, never a pass. The guard table gains list-owed (#9001 pr, #9002 open, #9003 unresolvable, #9004 closed, #9005 under Closes -> exactly "#9002 #9003") and list-owed-empty-body (rc 2). MEASURED at this commit: `bash scripts/check_release_bump_pr_body.sh` rc 0, "PASS 8 row(s)"; `bash scripts/check_pr_closes_issue.sh` rc 0, "self-test OK: 21 case(s)". The first run of the new table caught a real bug in this change: the keep-open line read "#9005-- cited", because $(...) strips the trailing newline. LIVE REPLAY: the real CHANGELOG [0.69.0] section through the real prepare_bump.sh --ship, with gh `api` passed to the real gh and only `pr create` stubbed. rc 0, 122 api calls (two passes over 61 refs), 1 pr create. Keep-open line "keep-open: #3080 #3545 #3571 #3602 #3658 -- cited by the CHANGELOG for context; each closes via its own PR; the release EPIC closes at T-4". The unmodified guard with LIVE resolution on the opened body: "PASS: non-closing ref(s) #3080 #3545 #3571 #3602 #3658 allowed by a keep-open reason." Zero closing references in the body. AD HOC MUTANTS, not committed, each RED: a reason ending "the release EPIC closes #9002" turns 2 rows RED (epic-and-refs, adds-no-close: "names '#9002 #9005 #9002 ' but only '#9005 ' are still owed"); naming every #N instead of --list-owed turns 3 rows RED (epic-and-refs, adds-no-close, prs-only); moving the refusal after the push turns landmine RED, "the branch was pushed before the refusal"; a --list-owed that prints every ref turns 3 rows of the WIRED table RED (guard-case-table, epic-and-refs naming #9006, prs-only). DARK TABLE, pre-existing and found here: `bash scripts/guard_tree.sh --no-cargo` prints `skipped: scripts/check_pr_closes_issue.sh -- wired-with-args in ci.yml`, and ci.yml line 1398 runs that guard only with --body. So its case table ran in NO CI job, even though the ci.yml comment at lines 1368-1373 still says guard_tree runs it bare. Its new list-owed rows would have been dark too. The guard-case-table row gives that table a caller inside guard-tree with no workflow edit. The stale ci.yml comment is left for a workflow-authorized change. GUARD_TREE: `bash scripts/guard_tree.sh --no-cargo` at fc5fdee22 (7 rows then): "77 checks, 0 failed", with "PASS scripts/check_release_bump_pr_body.sh [run]". OUT OF SCOPE, observed: a CHANGELOG bullet whose PR title carries a closing keyword ("fix: closes #N") would still close #N when the bump merges. The guard PASSes that, correctly by its own rule, and nothing here changes it.'
