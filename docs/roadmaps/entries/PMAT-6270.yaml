- id: PMAT-6270
  github_issue: 6270
  item_type: task
  title: 'ci: roadmap PRs add only entries/*.yaml; roadmap.yaml is regenerated in the bump PR'
  status: in_progress
  priority: high
  assigned_to: null
  created: 2026-10-24T14:40:00Z
  updated: 2026-10-24T14:40:00Z
  spec: null
  acceptance_criteria:
  - 'a diff that changes entries/ and not roadmap.yaml passes check_roadmap_fragment_required.sh; the aggregate may lag until the bump PR'
  - 'the bump PR (a diff that only regenerates roadmap.yaml from fragments already at head) passes; a hand-written aggregate entry still fails'
  - 'check_roadmap_completion_is_cited.sh judges entries/*.yaml fragments (folded into the aggregate by id), so an uncited completed fragment fails in its own PR'
  - 'a fragment is never deleted or renamed away (the aggregator never drops an id); refused with or without the aggregate in the diff'
  - 'a fragment holds exactly one entry (a second top-level item is refused)'
  - 'a diff that changes roadmap.yaml must still equal aggregate(entries/); a fragment whose first line is not its own id is refused, with or without the aggregate in the diff'
  - 'a changed path under entries/ that is not exactly entries/<id>.yaml (subfolder, .yml, any other name) is refused (BADPATH), never skipped; fragments are read flat, so a subfolder copy cannot shadow a real one'
  - 'the PMAT-980 additive rule is applied to fragments: judged on aggregate(base roadmap, base entries) against aggregate(base roadmap, head entries), so an edit to an existing fragment, or a legacy monolith entry adopted and rewritten in the same PR, may change lifecycle fields only'
  - 'a fragment first line is compared as data (fixed string), not as a pattern'
  - '`--mutants` plants eleven defects (lag-strict, id-check-off, first-line-off, drift-off, bump-license-off, one-entry-off, delete-ok, additive-off, base-agg-head, badpath-off, flat-off) in copies under mktemp, removed on exit; each turns the self-test red'
