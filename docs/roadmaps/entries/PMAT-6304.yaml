  notes: |-
    Quorum verdict A on landed Python (handoff/triage-quorum-6285-landedpython-2307Z.lane1.md). Behaviour change to name for the sign-off:
    the Python watchdog watched one step's log; this one watches the sum of all section logs of the driver run, so on a shard with several
    live sections one busy section hides another's hang. The shard runs a single section (workspace-test-shard), so no loss there.
    Added .py lines vs origin/main: 2, both pre-#6285 lines restored verbatim (p.wait(timeout=timeout) and the self-test section tuple); removed: 91.
    MT-2 (every line of scripts/ci/idle_watchdog.sh deleted in turn, unique per-run process tags): no behaviour line survives.
    A TERM to the watchdog now escalates TERM, FAT_IDLE_GRACE, KILL and exits 143 deterministically (stop_group, shared with the idle path); a row
    sends TERM to a watchdog over a TERM-ignoring step. The old spin guard (L55-56) is gone. Rows exist for hang-after-print, TERM grace, KILL, octal parse,
    missing command. Remaining survivors: comments and blanks; `set -u`; the `local` declarations; the EXIT cleanup trap; `kill "$sp"` / `kill "$gp"`
    (they only reap a leftover tick or grace sleep); and the self-test's own `t0=`, `rc=$?`, `sleep` settle lines and `row` lines, each caught when paired
    with the production line it checks.
