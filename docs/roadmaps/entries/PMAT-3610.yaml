  notes: 'ACCEPTANCE (hand-entered from gh#3610 done_when; see paiml-mcp-agent-toolkit#1414). The defect: NoFocus asked the question GLOBALLY (report.focus_nodes_n == 0), which is only ever true for a lone contract. In a DIRECTORY one empty shape is invisible — the others carry the total above zero, the empty one contributes no violations, and the aggregate reports Pass WHILE LISTING IT IN armed_shapes, which is the tool s claim about what it measured. Done when: vacuity is computed per-shape before any verdict is formed; an ARMED shape at zero declines (exit 2, Unknown(NoFocus), named in declines[]); an UNARMED shape at zero is REPORTED in declines[] and does not refuse; a vacuous shape appears in NEITHER armed_shapes NOR not_armed_shapes, because filing a vacuity as a policy choice is how it hid. BOTH VENUES: the lone-contract case already declined correctly, so a fix proved only there proves nothing. pass/fail/decline must stay distinct (0/1/2) and all three must still emit a parseable report with by_shape, since downstream captures stdout regardless of exit code. STOP: do not refuse whenever anything is empty — that breaks the unarmed direction.'
