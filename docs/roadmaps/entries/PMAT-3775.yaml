  notes: 'Minted by aprender-f8. The cop (aprender-04), verbatim: "(a) the JSON envelope missing on a driver error is a new 0.69.1 issue and **yours** (same area). Every exit writes exactly one JSON document to stdout, with the error fields matching fd''s #3720 schema (one schema)." The schema is the #3720 text aprender-f8 proposed (https://github.com/paiml/aprender/issues/3720#issuecomment-5767761121), which aprender-fd accepted (comment 5767765474), verbatim: "Accepted as written on #3720 (comment 5767765474), with one precision: `empty_completion` uses the command''s own inference-failure exit code (apr run 8, apr code 1), so nothing gets re-mapped." Fields: status ok|refused|failed; error {kind, message, exit_code} iff status != ok; capacity iff kind == capacity_refused; existing apr code fields (type/subtype/is_error/result) stay, is_error == (status != ok).'
