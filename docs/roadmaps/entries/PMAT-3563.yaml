  notes: 'P0 for the 0.69.1 path (cop, aprender-04): four 0.69.1 rows need ONE resolvable pinned comparator (#3726 tokenizer parity, #3725, #3596, #3693). SPLIT (cop ruling, recorded on the issue, comment 5764188590): this issue delivers (A) only, "llama_bin.sh resolves and PROVES it on lambda and gx10 (a version+sha line) or fails naming why". (C) "every comparator consumer reads it" is #3740; (B) "exactly one pin in-tree" (classify the 142 refs to 39173bcac and the 3 to 60b06ab9a, plus the citation guard) is #3741. Its own branch off main 52f43da71 (the merge-base; used as the quorum base). SCOPE: scripts/llama_bin.sh, scripts/check_llama_pin.sh, two evidence files under evidence/parity/pin-bump-d1d3c3396/, and this fragment. MEASURED BEFORE THE CHANGE: the tree has ONE pin, d1d3c3396 (scripts/llama_pin.toml build_commit). gx10''''s "39173bcac" was only its stale ~/src/aprender checkout (de0e3e182, 2026-08-28). On lambda, `bash scripts/llama_bin.sh` printed "FAIL … (no_binary_named) … reported: <no output>": the resolver never searches (NEVER PATH), $LLAMA_BENCH_PATH was unset, and the pinned build sat unnamed at ~/src/llama.cpp-d1d3c3396, with llama-cli and llama-server but NO llama-bench (the resolver''''s candidate) and no llama-tokenize. ~/src/llama.cpp there is 60b06ab9a, whose llama-cli dies "undefined symbol: llama_memory_breakdown_print". gx10 had NO d1d3c3396 build (~/src/llama.cpp-pin is the old 39173bcac). HOW (A) IS MET. (1) THE CANONICAL LOCATION: with nothing named, llama_bin.sh takes ${LLAMA_PIN_SRC_ROOT:-$HOME/src}/llama.cpp-<build_commit>/build/bin/llama-bench. That path is DERIVED FROM THE PIN, not a PATH search and not a host literal, and the build found there passes the same oracle-version, commit and cmake-cache checks as a named one. A named $LLAMA_BENCH_PATH always wins. When it is absent, the executable mode FAILs naming the canonical path and the pinned commit to build ("fails naming why"). (2) THE ABBREVIATION LENGTH, found by running the resolver on gx10: gx10''''s correct build prints "commit d1d3c339" (8 hex digits; git abbreviates to what is unique in THAT clone), lambda''''s "commit d1d3c3396". The old test (the 9-digit pin as a substring of the version line) refused gx10''''s correct build as wrong_build. The commit token is now read out of either --version shape ("commit <hex>" or "(<hex>)") and matched when one abbreviates the other at git''''s minimum of 7 hex digits (llama_commit_match). Like the build number, which llama_pin.toml already says is not an identity, the length is not. (3) THE BUILDS: on lambda, `cmake --build build --target llama-bench llama-tokenize` in ~/src/llama.cpp-d1d3c3396 (incremental, BUILD_EXIT=0; cache GGML_CUDA=ON with no CMAKE_CUDA_ARCHITECTURES, matching build_flags_lambda). On gx10, a fresh clone of ~/src/llama.cpp detached at d1d3c3396aa13a5f239109a822666c4870490ad5 into ~/src/llama.cpp-d1d3c3396, `cmake -B build -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=121` (build_flags_gx10 verbatim), `cmake --build build -j 16`: BUILD_EXIT=0, 285M, llama-bench/cli/server/tokenize/completion, cache GGML_CUDA=ON CMAKE_CUDA_ARCHITECTURES=121. The disk was checked first (174G free, 81%). No GPU lock was needed for a build. PROOF, committed as evidence/parity/pin-bump-d1d3c3396/RESOLVE-lambda.txt and RESOLVE-gx10.txt: `env -u LLAMA_BENCH_PATH bash scripts/llama_bin.sh` rc 0 on BOTH hosts. lambda: "ok llama.cpp pinned: …/llama.cpp-d1d3c3396/build/bin/llama-bench / build: version: 0.4.1-dev (build 10987, commit d1d3c3396) / cmake: GGML_CUDA=ON CMAKE_CUDA_ARCHITECTURES=unset / pin expires 2026-12-01". gx10: "… build: version: 0.4.1-dev (build 2423, commit d1d3c339) / cmake: GGML_CUDA=ON CMAKE_CUDA_ARCHITECTURES=121 …" (run from a scratch copy of this branch''''s llama_bin.sh + llama_pin.toml, since gx10''''s own checkout is stale). CASE TABLE, scripts/check_llama_pin.sh (ci-wired as before). Every row now runs against a FIXTURE canonical root, never the operator''''s $HOME. New rows: nothing named with the canonical build present -> rc 0; the canonical build at the WRONG commit -> wrong_build; the canonical build''''s cmake disagrees -> cmake_mismatch; a NAMED path wins over the canonical build -> wrong_build; UNPINNED never falls back to a canonical build -> unpinned; an oracle abbreviating SHORTER (7) and LONGER (10) than an 8-digit pin -> rc 0; 6 hex digits (below git''''s minimum) -> wrong_build; a different commit of the same length -> wrong_build. MUTANTS, each killed: canonical-lookup (the path pointed nowhere, as before) -> "expected rc=0, got rc=1 (no_binary_named)"; substring-match (the pre-#3563 test) -> "oracle abbreviates SHORTER than the pin expected rc=0, got rc=1 (wrong_build)". MEASURED at this commit: `bash scripts/check_llama_pin.sh` rc 0. #3726''''s owner (aprender-c3) was told to use the pinned llama-tokenize at the canonical path on both hosts, not ~/src/llama.cpp.'
