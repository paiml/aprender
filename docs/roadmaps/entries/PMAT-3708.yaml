  notes: 'P0 on the 0.69.1 critical path (cop, aprender-04). Fixtures and stubs only: nothing ran against the live 0.69 train, its state dir, GitHub writes or a publish token. STACKED on PMAT-3699 (branch PMAT-3699-bump-pr-body-keep-open, 0cb1e4bd6), because both change scripts/release/prepare_bump.sh. The judged diff is base 0cb1e4bd6 to this head. SCOPE: scripts/release/autopilot.sh, scripts/check_publish_preflight.sh, scripts/release/prepare_bump.sh, scripts/check_release_bump_pr_body.sh (extended), the new scripts/check_release_autopilot_dogfood_close.sh, and this fragment. PICK (done_when 1 says pick one): autopilot NEVER inherits. The parent''s T-2 GO is at the OLD version, so rows keyed on the version (check_model_ladder) were never measured at the release version. And the T-4 recovery ran the same ~35 min dogfood anyway, after the tag was public. The inherit branch is DELETED, not flagged off, so there is no second rule to keep in sync. HOW EACH IS MET. (1) The dogfood step runs `scripts/dogfood.sh --phase pre-publish` in $AP/wt (the release worktree), then `check_publish_preflight.sh --receipt-only`. That is a new mode running R2 plus R5 only (R3 cannot hold before the tag). R5 is now ONE function, rule_r5(), which the full gate calls at T-4 and --receipt-only calls at T-1, both on the newest $AP/wt/.dogfood/receipt-*.json: the same file and the same function. A refusal is `STOP T-1 R5 refused …`, before the tag step. (2) The case table is scripts/check_release_autopilot_dogfood_close.sh. It is a scripts/check_*.sh because guard_tree.sh''s universe is the flat `git ls-files ''scripts/check_*.sh''`, so a table living only in scripts/release/ would run nowhere (the check_t2_preflight_verdict.sh pattern). It drives the REAL autopilot.sh through its own from/to steps (`dogfood dogfood`, `close close`). The fixture: a local bare origin whose main holds a parent (9.9.8) and a bump touching only Cargo.toml and CHANGELOG.md (9.9.9), a T-2 GO receipt for the parent (exactly the shape the old code inherited on), a real copy of check_publish_preflight.sh, and stubs for gh, cargo metadata and dogfood.sh. ROWS: never-inherits (dogfood.sh RUNS, no dogfood-inherited.receipt, "DOGFOOD GO at <MC> (R5 holds at T-1)"); t4-agrees-go (after tagging, the FULL gate prints "ok    R5 dogfood receipt receipt-….json: GO for <MC> at 9.9.9" for the receipt T-1 accepted); nogo-stops; t1-r5-version (a receipt for 9.9.8 on a 9.9.9 cut STOPs at T-1, and the T-4 gate''s R5 refuses the same receipt, so the two ends agree on refusal too); t1-r5-commit (a receipt naming the parent STOPs at T-1); t1-r5-absent (the dogfood exits 0 and writes no receipt: STOPs at T-1); close-epic-last; close-other-open. MUTANTS, one per claim ("A mutant for each"), run on every bare run, each killed: inherit (the pre-#3708 step verbatim) -> "dogfood.sh never ran: the parent GO was inherited"; drop-nogo-stop -> "it stopped, but not on the NO-GO" (T-1 R5 caught it instead: defence in depth, but the NO-GO row still names the line); drop-t1-r5, run against each of t1-r5-version/-commit/-absent -> "autopilot passed T-1 with a receipt R5 refuses (version|commit|absent)"; t1-reads-another-file (--receipt-only pointed at a receipt dir the T-4 gate does not read) -> never-inherits "STOP T-1 R5 refused", so "the same file" is load-bearing; t1-skips-rule-r5 (--receipt-only no longer calls rule_r5) -> t1-r5-version passes a 9.9.8 receipt, so "the same function" is load-bearing; drop-epic-close -> "STOP milestone 9.9.9 still has 1 open item(s) after the epic"; drop-others-check -> "the epic was closed while #9010 is open". check_publish_preflight.sh --selftest (run by ci.yml:1978) gains 6 --receipt-only rows: an untagged tree with a GO receipt passes (the full gate refuses that tree on R3); NO-GO, stale commit, other version, absent, and a disallowed deferral each refuse with "FAIL  R5". (3) is measured at the next train; it cannot be met by this PR, hence Refs. CLOSE STEP: it lists the milestone''s open items EXCEPT the epic. Any remaining one is a STOP naming them, closing neither. Otherwise it closes the epic if it is OPEN, so a re-run after a failure is idempotent, then requires open_issues == 0 and PATCHes the milestone closed. OBLIGATION: `prepare_bump.sh --ship` runs `bash scripts/check_model_ladder.sh --version "$V"` in the bump tree. That is the same judge the dogfood''s check_model_ladder row runs. Its FAIL lines go to stderr, and it refuses before the cargo checks, the commit, the push and `gh pr create`. It also refuses receipts that are present but gitignored (`git ls-files --others --ignored --exclude-standard -- evidence/dogfood/models/$V`), which `git add -A` would silently leave out. check_release_bump_pr_body.sh gives every fixture green receipts, a real copy of check_model_ladder.sh and a MINIMAL fixture ladder (the two required hosts, lambda and gx10, and one rung), so a rung added to the real ladder cannot break this table. New rows: ladder-missing-gx10 (refuses, naming "evidence/dogfood/models/9.9.9/gx10.json"; no push, no PR) and ladder-ignored. New mutants: drop-ladder (judge replaced by `true`) -> "exited 0 (ladder=no-gx10)"; drop-ignored -> "exited 0 (ladder=ignored)". MEASURED at this commit: `bash scripts/check_release_autopilot_dogfood_close.sh` rc 0, "PASS 17 row(s)" (8 behaviours, 9 mutants); `bash scripts/check_release_bump_pr_body.sh` rc 0, "PASS 12 row(s)"; `bash scripts/check_publish_preflight.sh --selftest` rc 0, "25/25 rows"; `bash scripts/check_model_ladder.sh --version 0.68.2` rc 0 on the real ladder and receipts (the judge the gate calls is live); bashrs lint on the 5 changed scripts: 0 errors each; check_release_scripts_derive_identity.sh PASS. GUARD_TREE (`bash scripts/guard_tree.sh --no-cargo`) at the first cut of this commit: "77 checks, 2 failed". check_guards_are_wired: the new table was UNWIRED, because a comment said "cargo metadata" and guard_tree''s textual `(^|[^a-z_-])cargo ` test moved it out of the --no-cargo set; the table never runs cargo (it stubs the metadata call), so the comment was reworded. check_no_pipe_into_grep_q: two `printf | grep -q` sites in the new table (76 vs ceiling 74), now here-strings. Both guards pass after the fix (grep-q "measured 74", guards_are_wired "PASS (ratcheted)"), and `guard_tree.sh --list --no-cargo` lists the table. Full re-run at 3a0513d35 (11-row table): "78 checks, 0 failed", with "PASS scripts/check_release_autopilot_dogfood_close.sh [run]". After the table grew to 17 rows: check_no_pipe_into_grep_q, check_guards_are_wired, and check_bashrs_gate ("PASS 363 file(s) linted … 0 SEC/DET/IDEM errors") re-run, all rc 0. PyYAML (needed by check_model_ladder.sh) is present in guard-tree: check_roadmap_ids_unique.sh and check_roadmap_completion_is_cited.sh already hard-fail without it, and they are green there.'
