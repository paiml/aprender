  notes: 'ONE predicate: realizar::capability::no_cuda_forward_reason(arch) says why this build has no
    CUDA forward, normalising every spelling the loader accepts (qwen3moe, qwen3_moe, Qwen3MoeForCausalLM,
    Qwen3CoderForCausalLM, qwen3_5_moe). Its only arm is qwen3_moe because infer/inference_result.rs dispatches
    that architecture to the CPU-only MoE generator and returns used_gpu=false unconditionally; deleting
    the arm when #3714 lands is what turns the refusal off, so refusal and routing cannot drift. apr run
    consults it BEFORE any print or load, refusing with NotImplemented = exit 12 (''this build cannot
    do that''), deliberately NOT 14 (''it tried and fell back''). Reading a GGUF header is an mmap, so
    the refusal does not touch the 18 GB behind it. apr qa: three changes. dispatch_gate turns a gate
    that cannot RUN into a FAILED gate carrying the error, so no gate can empty the report again (before:
    zero bytes of JSON, rc 5, capability_match and golden_output ABSENT). is_cpu_only_architecture admits
    an architecture whose CUDA forward was never built, routing golden and throughput through the same
    runtime entry point apr run uses. capability_match refuses by name instead of reporting ''all ops
    supported by GPU'', which is true and misleading: no kernel is missing, the path was not built. MEASURED
    on lambda, apr 0.69.0 (9f8836c71) BEFORE: apr run --gpu rc 14 after an 18 GB load and a CPU generation;
    apr qa rc 5 with an EMPTY json and ''Validation failed: CPU generation failed: matmul weight has EMPTY
    data buffer ... a MoE parent FFN tensor''; apr run --no-gpu rc 0, ''2 + 2 = 4.'' in 8.00s.'
