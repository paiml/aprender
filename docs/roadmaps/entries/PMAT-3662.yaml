  notes: 'Found by aprender-7a (sliding_window_entropy.rs:295); the other two sites found by aprender-62 at origin/main c0ab699b0 with a scan of crates/apr-cli/src and crates/aprender-serve/src for `<id> => "Q4_K"`-shaped arms, which returns exactly three: apr-cli commands/sliding_window_entropy.rs `ggml_dtype_name` (unknown token "Unknown"; knows 11 ids), apr-cli commands/validate_manifest.rs `ggml_type_name` (unknown token "UNKNOWN"; knows ids 0-3,6-30, so it is complete today but hand-typed), aprender-serve api/model_source.rs `gguf_qtype_name` (returns None; knows 15 ids, so every IQ*, I8-I64 and F64 is None). "RED on today''s tables" is per site. validate_manifest.rs already names 10/16/23/30 correctly, so its row (ids 10/16/23/30 plus unknown ids 4/5/999, the same ids as the other two sites) is a parity row and is not expected to be RED. The two tables that are wrong today (sliding_window_entropy, model_source) carry the RED rows. validate_manifest.rs''s reverse name→id parser (`"iq4_xs" => Some(23)`) has case-insensitive aliases ("bfloat16") and is not an id→name mapping. It is out of scope and stays. Examples under crates/aprender-serve/examples/ are out of scope per the issue.

    Facts a reviewer needs, each checked at the PR head (round 1 of the quorum misread all three). (1) WHERE sliding_window_entropy.rs IS TESTED: it is not a module. crates/apr-cli/src/commands/hex.rs:442 is `include!("sliding_window_entropy.rs")`, and hex.rs:444 includes hex_06.rs, whose :11 is `include!("hex_options_detect.rs")`. So `ggml_dtype_name` and its tests share one module, `commands::hex`. The pre-existing tests for this function (test_ggml_dtype_name_known/_unknown) already live in hex_options_detect.rs, and the new test_ggml_dtype_name_names_every_family sits beside them. It ran as commands::hex::tests::test_ggml_dtype_name_names_every_family: RED on the old table (left "Unknown", right "Q2_K"), GREEN after. (2) THE CRATE NAME: the workspace dependency is `trueno-quant = { path = "crates/aprender-quant", ..., package = "aprender-quant" }` (root Cargo.toml:262), and Cargo.lock records PACKAGE names. So `aprender-quant` in apr-cli''s Cargo.lock dependency list is what cargo wrote for `trueno-quant = { workspace = true }`. It was generated by cargo, not hand-edited. (3) GgmlType IS EXPORTED: crates/aprender-quant/src/lib.rs has an unconditional `pub mod ggml_type;` and `pub use ggml_type::{GgmlFamily, GgmlType, ...}`. The type was added by #3581 AFTER the v0.68.2 tag (`git cat-file -e v0.68.2:crates/aprender-quant/src/ggml_type.rs` fails), so a tree at or before v0.68.2, or the crates.io aprender-quant 0.68.2, does not have it and fails with E0433. At the PR head, `cargo check -p aprender-serve` and `cargo check -p apr-cli` both exit 0. Verified at the PR head: cargo test -p aprender-serve --lib model_source 19 passed; cargo test -p apr-cli --lib -- commands::hex commands::validate_manifest 174 passed; clippy -D warnings clean on both crates.'
