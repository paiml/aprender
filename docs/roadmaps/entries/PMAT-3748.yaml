  acceptance_criteria:
  - 'Issue #3748 done_when 1, as AMENDED by the issue author (cop aprender-04, 2026-09-21T21:27:14Z comment), verbatim: "The key is now **(model sha256, sha256 of the RUNNING executable (`/proc/self/exe`), device)**. This is strictly finer than apr version+git sha: a different binary can never skip. The version and git sha (where the binary carries one) are recorded beside the key for humans, never as the key. Schema bumps to 2, so every existing receipt revalidates once. There''s one receipt file per (model, executable, device), so A→B→A never overwrites. Both the executable''s and the model''s sha256 are cached by (canonical path, size, mtime, inode), so a warm run doesn''t re-hash. Mutants: key on the version → RED; key on the model only → RED; a stale cache after the binary changes in place → RED."'
  - 'done_when 2 (issue body), verbatim: "The model sha256 is cached by (canonical path, size, mtime, inode), so a warm run doesn''t re-hash 5.7 GB. It is invalidated on any of the four changing, with a mutant that turns it RED."'
  - 'done_when 3 (issue body), verbatim: "Measured on lambda and gx10: the warm-run F2 cost is ≈0 s, and the cold run is unchanged. The before/after wall time is cited with the binary''s version and sha."'
  - 'Cop re-scope (2026-09-21T21:20:57Z comment), verbatim: "(a) a receipt from a different binary sha never skips F2; a mutant keying on the model alone goes RED; (b) every correctness cell and receipt records F2''s `source` (fresh | receipt, with the receipt''s binary sha)."'
