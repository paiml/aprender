  notes: 'SCOPE: crates/aprender-serve/src/gguf/inference/forward/f2_receipt.rs (+ _tests.rs), the one receipt caller f2_validate_qwen35_receipted in forward_qwen35.rs, MappedGGUFModel::path (model.rs, so the model hash can be cached by file identity), and apr-cli dispatch.rs (record_f2_build_label: apr sets "apr <version> (<git sha>)" as the human label, since realizar has no build-time sha). HOW: F2ReceiptKey = {model_sha256, exe_sha256, device}; decide compares the three and names the one that differs (ExeSha256Mismatch replaces AprVersionMismatch); receipt_path(dir, key) = <model>-<exe16>-<device-slug>.json; F2_RECEIPT_SCHEMA = 2; the receipt carries build + exe_path for humans; cached_sha256(cache_dir, path, compute) keys a cache entry by FileIdentity {canonical path, size, mtime_ns, inode}, re-stats after hashing and never caches a file that changed mid-hash, and falls back to hashing on any cache failure; exe_sha256 hashes current_exe() through the same cache. (b) is met in the F2 log line ([source=receipt exe=<sha16>] / [source=fresh exe=<sha16>], plus how each hash was obtained) and F2Outcome.exe_sha256; recording it in the ladder/derived cells is the judge''s side (#3745 S2 / #3712 B2), not this row. Only the qwen35 path writes receipts today; the qwen3moe F2 (#3714) validates every run and is unaffected.'
