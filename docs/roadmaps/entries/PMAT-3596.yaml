  notes: 'ACCEPTANCE — transcribed VERBATIM from issue #3596 "## done_when (added)" (comment 2026-09-21T15:57:35Z, the 0.69.1 P0 move): "- [ ] a batched (chunked) CUDA prefill for the Qwen3.5 hybrid (attention layers batched; the Gated DeltaNet recurrence in chunked form) on lambda and gx10, parity-checked against the per-token path at ≥ 64 positions and at 20k" · "- [ ] TTFT for a 20k-token prompt on the 9B measured on both hosts and recorded in the receipt, against llama.cpp at the pinned comparator on the same prompt (the ratio is reported, never claimed as a target)" · "- [ ] `apr run --json` reports `prefill_ms` and `prompt_tokens` (with #3718)". AMENDMENTS — VERBATIM from the cop''s comment on #3596 (2026-09-21T16:12:21Z): "**Amendments (cop, 2026-09-21), for the quorum to judge against:** 1. **"chunked form" is defined:** a chunk-resident scan of the Gated DeltaNet recurrence (state held on-chip across the chunk) that is **bitwise-identical to the per-token recurrence**, measured, is acceptable. The WY/UT chunkwise-parallel form is required only if the scan''s measured share of prefill exceeds 15 %. (aprender-3e''s design note §3, issuecomment-5763674795.) 2. **Context rungs** (operator, verbatim: "lets ensure this release has MORE than enough tokens for our needs (overdo it)"): TTFT is recorded and output is correct at **4k · 8k · 20k · 60k · 148k · 262,144** (every Qwen3.5 GGUF declares `context_length = 262144`, measured) on lambda AND gx10. Where a host''s memory can''t hold a rung (3e''s arithmetic: the 27B on a 24 GB 4090 tops out ≈98k with f16 KV; the 9B at 262k needs f16 KV), apr **refuses before loading, naming the arithmetic**, never OOMs mid-run. Whether that cell may be waived is the operator''s decision (below), not this row''s. 3. **KV precision:** f16 KV is allowed where parity against the f32 path holds (measured at each rung). The choice is printed in `--json`. 4. Decode speed at long context (split-K for the 16-block decode kernel) is a **separate row**, filed next." · F16 SPLIT — VERBATIM from #3596 (2026-09-21T16:20:40Z): "**f16 KV split (agreed with aprender-3e, 2026-09-21):** f16 KV is a storage format touched at four sites: (1) prefill K/V row writes, (2) prefill attention reads, (3) per-token decode row writes, (4) decode attention reads. **#3596** owns the storage type (the f32|f16 tag on `Qwen35CudaState`) plus sites 1–3 and the capacity check that picks f32 / f16 / refuse. **#3725** owns site 4 (the split-K decode kernel reads f16 as well as f32). Until #3725 lands, #3596 ships the f16 branch wired but REFUSING, with the reason "f16 KV decode read not available (#3725)"; no path serves f16 half-done. f16 vs f32 parity is measured on gx10 once both land." · OPERATOR DECISION (relayed by the cop 2026-09-21; verbatim choice "a"): the 27B rungs above what the 4090 holds are owed on gx10 at 262,144; on lambda apr REFUSES before loading, naming the arithmetic; KV quantization (q8/q4) is NOT in 0.69.1. The ORIGINAL done_when items 1–6 of #3596 (TTFT in BEATS.md, apr bench accepting hybrids, the (cached) suffix, the pinned comparator, root-causing the 14 s) belong to #3598/#3604/#3606 rows and are NOT claimed here; this row uses `Refs #3596` unless the issue owner rules the whole issue closable. File boundaries agreed with aprender-c3 (#3693): new kernel files under aprender-gpu/src/kernels/gdn/, new gguf/cuda/forward_qwen35_cuda_prefill.rs, edits limited to forward_qwen35.rs (qwen35_gpu_decode + F2 GPU probe) and forward_qwen35_cuda.rs (state sizing); decode_attention.rs untouched. prefill_ms definition agreed with aprender-a8 (#3718, #3606 StageTimings): forward over post-template prompt tokens up to the first generated token logits, excluding load/h2d/validate/tokenization; null never 0.'
