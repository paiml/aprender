<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="aprender - Next-generation ML framework in pure Rust">
  <title>aprender - Next-generation ML framework in pure Rust</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="compute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#533483"/>
      <stop offset="100%" style="stop-color:#7952b3"/>
    </linearGradient>
    <linearGradient id="serve" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16537e"/>
    </linearGradient>
    <linearGradient id="train" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a9396"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
  </g>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#fff" font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="800" letter-spacing="-1">aprender</text>
  <text x="600" y="78" text-anchor="middle" fill="#8b949e" font-family="system-ui,-apple-system,sans-serif" font-size="15">Next-generation ML framework in pure Rust</text>

  <!-- Install command -->
  <rect x="420" y="92" width="360" height="30" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="112" text-anchor="middle" fill="#7ee787" font-family="monospace" font-size="13">$ cargo install aprender</text>

  <!-- Stats bar -->
  <text x="200" y="145" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">70 crates</text>
  <text x="310" y="145" text-anchor="middle" fill="#30363d" font-family="monospace" font-size="12">|</text>
  <text x="420" y="145" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">57 commands</text>
  <text x="530" y="145" text-anchor="middle" fill="#30363d" font-family="monospace" font-size="12">|</text>
  <text x="640" y="145" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">25,391 tests</text>
  <text x="750" y="145" text-anchor="middle" fill="#30363d" font-family="monospace" font-size="12">|</text>
  <text x="860" y="145" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">405 contracts</text>
  <text x="1000" y="145" text-anchor="middle" fill="#7ee787" font-family="monospace" font-size="12" font-weight="bold">0 failures</text>

  <!-- CLI Layer -->
  <rect x="100" y="165" width="1000" height="40" rx="8" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="600" y="190" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="bold">apr CLI — run, serve, chat, finetune, inspect, validate, convert, merge ...</text>

  <!-- Core crates row -->
  <rect x="100" y="218" width="237" height="62" rx="8" fill="url(#core)" filter="url(#shadow)"/>
  <text x="218" y="240" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">aprender-core</text>
  <text x="218" y="255" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">ML: regression, trees, SVM</text>
  <text x="218" y="268" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">NLP, graph, .apr format</text>

  <rect x="350" y="218" width="237" height="62" rx="8" fill="url(#serve)" filter="url(#shadow)"/>
  <text x="468" y="240" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">aprender-serve</text>
  <text x="468" y="255" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">GGUF, SafeTensors inference</text>
  <text x="468" y="268" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">KV cache, batched prefill</text>

  <rect x="600" y="218" width="237" height="62" rx="8" fill="url(#train)" filter="url(#shadow)"/>
  <text x="718" y="240" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">aprender-train</text>
  <text x="718" y="255" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">LoRA, QLoRA, distillation</text>
  <text x="718" y="268" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">autograd, model merging</text>

  <rect x="850" y="218" width="249" height="62" rx="8" fill="#6e40c9" filter="url(#shadow)"/>
  <text x="974" y="240" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">aprender-orchestrate</text>
  <text x="974" y="255" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">Agents, RAG oracle</text>
  <text x="974" y="268" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">playbooks, pipelines</text>

  <!-- Compute layer -->
  <rect x="100" y="295" width="490" height="55" rx="8" fill="url(#compute)" filter="url(#shadow)"/>
  <text x="345" y="316" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">aprender-compute</text>
  <text x="345" y="331" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">SIMD: AVX2/AVX-512/NEON/WASM</text>
  <text x="345" y="343" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">GPU: CUDA PTX, wgpu</text>

  <rect x="603" y="295" width="240" height="55" rx="8" fill="#1f6feb" filter="url(#shadow)"/>
  <text x="723" y="316" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Data and Storage</text>
  <text x="723" y="331" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">db, graph, rag, data</text>
  <text x="723" y="343" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">registry, distribute</text>

  <rect x="856" y="295" width="243" height="55" rx="8" fill="#da3633" filter="url(#shadow)"/>
  <text x="977" y="316" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="13" font-weight="bold">Provable Contracts</text>
  <text x="977" y="331" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">405 YAML contracts</text>
  <text x="977" y="343" text-anchor="middle" fill="#ffffffbb" font-family="monospace" font-size="9">equations + falsification</text>

  <!-- Bottom: Quick examples -->
  <rect x="100" y="368" width="320" height="110" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="115" y="388" fill="#8b949e" font-family="monospace" font-size="11" font-weight="bold">Inference</text>
  <text x="115" y="408" fill="#7ee787" font-family="monospace" font-size="11">$ apr run model.gguf "2+2?"</text>
  <text x="115" y="425" fill="#7ee787" font-family="monospace" font-size="11">$ apr serve model :8080</text>
  <text x="115" y="442" fill="#7ee787" font-family="monospace" font-size="11">$ apr chat model.gguf</text>
  <text x="115" y="465" fill="#484f58" font-family="monospace" font-size="9">225+ tok/s on RTX 4090</text>

  <rect x="440" y="368" width="320" height="110" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="455" y="388" fill="#8b949e" font-family="monospace" font-size="11" font-weight="bold">Training</text>
  <text x="455" y="408" fill="#7ee787" font-family="monospace" font-size="11">$ apr finetune model --lora</text>
  <text x="455" y="425" fill="#7ee787" font-family="monospace" font-size="11">$ apr distill teacher student</text>
  <text x="455" y="442" fill="#7ee787" font-family="monospace" font-size="11">$ apr merge a.gguf b.gguf</text>
  <text x="455" y="465" fill="#484f58" font-family="monospace" font-size="9">LoRA rank-64 in minutes</text>

  <rect x="780" y="368" width="320" height="110" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="795" y="388" fill="#8b949e" font-family="monospace" font-size="11" font-weight="bold">Inspection</text>
  <text x="795" y="408" fill="#7ee787" font-family="monospace" font-size="11">$ apr inspect model.gguf</text>
  <text x="795" y="425" fill="#7ee787" font-family="monospace" font-size="11">$ apr validate --strict</text>
  <text x="795" y="442" fill="#7ee787" font-family="monospace" font-size="11">$ apr profile --roofline</text>
  <text x="795" y="465" fill="#484f58" font-family="monospace" font-size="9">57 commands, every one tested</text>
</svg>
