# Coverage is uploaded only on a push to main (ci.yml, x86-main). Codecov posts
# no status and no comment: a status it posts cannot block a merge, so it is not
# put on a pull request. The enforced coverage floor is COV_FLOOR in the Makefile.
coverage:
  status:
    project: off
    patch: off
comment: false
ignore: [tests/**, benches/**, examples/**, crates/**, fuzz/**, scripts/**, golden_traces/**]
