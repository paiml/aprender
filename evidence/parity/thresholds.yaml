# evidence/parity/thresholds.yaml — the GPU/CPU parity thresholds C14 reads (L0-1, #2971).
# EVERY threshold carries a basis. 0.98 was the driver's number and was [U]; it is now MEASURED
# against two known-good and two known-bad pairs, one of each on each required GPU host.
schema: apr-parity-thresholds/v1
min_positions: 64          # basis: I8 / CF-4 (#1864) — any autoregressive gate validates over >= 64 positions
default:
  min_cosine: 0.98
  # basis (card item 5, both pairs measured; n=5 each, the 78-token corpus prompt, min over >= 64 positions):
  #   known-good  qwen2.5-coder-7b-instruct-q4_k_m  @ lambda (RTX 4090, sm_89, x86_64, apr 0.65.2 cuda c642576eecb62daa)  0.998607 x5, stdev 0
  #   known-good  qwen2.5-coder-7b-instruct-q4_k_m  @ gx10   (GB10,     sm_121, aarch64, apr 0.65.2 c04eda87 21d182d69505159c) 0.998465 x5, stdev 0
  #   known-bad   qwen2.5-coder-1.5b-instruct-q4_k_m @ lambda                                                            0.950827 x5, stdev 0
  #   known-bad   qwen2.5-coder-1.5b-instruct-q4_k_m @ gx10                                                              0.950611 x5, stdev 0
  # 0.98 (= PARITY_GATE_COSINE_MIN, crates/aprender-serve/src/gguf/cuda/mod.rs:803) separates the two
  # populations with 0.0185 of margin under the LOWER known-good floor and 0.0294 above the HIGHER
  # known-bad ceiling. Records: evidence/parity/l0-1/{lambda,gx10}/ (RECORD.md carries the command).
  basis: 'measured n=5 on two known-good pairs (7B@lambda 0.998607, 7B@gx10 0.998465; stdev 0) against two known-bad pairs (1.5B@lambda 0.950827, 1.5B@gx10 0.950611); 0.98 separates them with 0.0185 margin under the lower good floor'
# ── per-model overrides ──────────────────────────────────────────────────────
# Overrides land here WITH n AND the command that measured them. `default` above
# does not apply to a model listed here: scripts/check_model_parity.sh judge()
# takes models[<name>] when it exists and never falls back, so an entry with no
# `min_cosine` is FAIL-CLOSED (rc 2, "a threshold without a basis is not a
# threshold") rather than silently inheriting 0.98.
models:

  # ── the CPU leg, PMAT-3303 / #3303 (child of the 0.68 Qwen3.5 epic #3038) ──
  # UNMEASURED BY CONSTRUCTION, and `min_cosine` is DELIBERATELY ABSENT.
  #
  # THE GPU 0.98 IS NOT AVAILABLE TO THIS ROW. Its basis (above) is a
  # GPU-vs-CPU cosine population on two DENSE qwen2.5-coder models, both
  # backends of ONE implementation. This row is a different comparison on
  # every axis that matters: CPU-vs-CPU, apr against llama.cpp — two
  # independent implementations — on a HYBRID SSM/Gated-Delta-Net model.
  # Nothing measured on the first population bounds the second, so reusing the
  # number would be a threshold with a borrowed basis, which is the defect
  # #2971 closed.
  # KEY (#3477): this row is the CPU-vs-llama.cpp leg and is keyed as such. It
  # used to sit under the bare model name, which `judge()` also reaches for the
  # GPU-vs-CPU record `apr parity` now produces for the hybrid (#3517, #3527) —
  # so C14 read a CPU-comparator row for a GPU comparison and failed closed on a
  # number that was absent for a different reason. The GPU-vs-CPU row for the
  # bare name is further down, with its own measured basis.
  qwen3.5-0.8b@cpu-vs-llama.cpp:
    compute_class: cpu
    host: intel                      # scripts/perf-matrix.yaml:138-143 — the only cpu-class host with a runner
    comparator: 'llama.cpp [X], CPU build, pin 39173bcac (scripts/llama_pin.toml)'
    record: evidence/parity/l0-1/intel/RECORD.md
    # min_cosine: ABSENT ON PURPOSE. Writing any number here without the four
    # pairs below would be a fabricated basis. judge() exits 2 while it is absent.
    basis: >-
      [U] — NOTHING IS MEASURED ON qwen35. Both sides of this comparison refuse the
      model today, measured 2026-09-15 and reproduced in
      evidence/parity/l0-1/intel/RECORD.md: llama.cpp at the pin 39173bcac exits 1 with
      "unknown model architecture: 'qwen35'" (the pin knows qwen3next, and `grep -rn qwen35
      src/` in the pinned checkout returns 0 hits), and apr exits 8 with "Architecture
      'qwen35' uses SSM/Gated Delta Net layers ... NEITHER the CPU nor the GPU backend
      implements" (#3090 GPU / #3091 CPU). WHAT WOULD REPLACE THIS [U]: the same standard
      the default above met — two known-good and two known-bad pairs, n=5 each, on intel,
      min cosine over >= 64 positions, with the separating margin stated; i.e. `apr
      <producer> ./Qwen3.5-0.8B-Q4_K_M.gguf --prompt "$PROMPT" --json` (lane A, the subject)
      against `llama-perplexity -m ./Qwen3.5-0.8B-Q4_K_M.gguf -ngl 0 --save-all-logits`
      (lane B, the [X] comparator), judged by `scripts/check_model_parity.sh --judge`.
      FOUR THINGS ARE OWED FIRST, none of them a number: (1) llama-perplexity is not built
      on intel (source and flags are at the pin; `cmake --build build --target
      llama-perplexity`); (2) a comparator pin that can load qwen35 — bumping 39173bcac
      invalidates every ratio measured against it, so this is a decision with a named cost,
      not a bump; (3) the apr-CPU logits producer, which exists on no branch but #3114 and
      may not be taken from the PR under test (#3303 ruling); (4) a deliberately-broken
      qwen35 GGUF for the known-bad half — #3303's open question, still with no decider.
    n: null                          # no run
    measured_by: null                # no command has been run against this row

  # ── the GPU leg, PMAT-3477 / #3090 / #3517 / #3527: `apr parity` on the Qwen3.5 hybrid ──
  # The same comparison as `default` (one implementation, CPU vs CUDA, the 78-token
  # corpus prompt, min cosine over >= 64 positions) on a DIFFERENT population — a
  # hybrid Gated-DeltaNet/attention model whose CPU forward quantizes activations
  # (Q8_K) where the dense path does not — so it gets its own number and its own
  # measured basis rather than borrowing 0.98 (the #2971 rule). 0.99 is the good
  # floor (0.998971) rounded DOWN to two decimals; the known-bad half sits at 0.466
  # and below, so the number discriminates rather than decorates.
  #
  # basis (n=5 per pair on lambda, the runs are bit-identical so stdev 0; gx10 rows
  # are the peer session's runs at the same head, apr 2bbce5be9 cuda):
  #   known-good  qwen3.5-0.8b-q4_k_m @ lambda (RTX 4090, sm_89, x86_64)   0.998971 x5, stdev 0
  #   known-good  qwen3.5-9b-q4_k_m   @ lambda                              0.999254 x5, stdev 0
  #   known-good  qwen3.5-0.8b-q4_k_m @ gx10   (GB10, sm_121, aarch64)      0.999176 x3, stdev 0
  #   known-good  qwen3.5-9b-q4_k_m   @ gx10                                0.999351 x3, stdev 0
  #   (argmax is NOT part of this rule: CPU and GPU argmax differ at 1-4 near-tie
  #   positions per record on both hosts — lambda 0.8b 1/78, 9b 3/78; gx10 0.8b 4/78,
  #   9b 2/78, every one at cosine >= 0.9994 and KL <= 0.012 — exactly as the dense
  #   known-good records do (qwen2.5-coder-0.5b 2/78, 7b 2/78): the #2350/#2359
  #   coin-flip class, which an argmax rule would turn into a host-dependent verdict)
  #   known-bad   the DP4A GEMV routed through the DeltaNet recurrence (#3513), the
  #               kernel variant `GpuProfile::detect` would pick on sm_89 — measured by
  #               crates/aprender-serve/src/gguf/cuda/forward_qwen35_cuda_tests.rs
  #               `qwen35_cuda_dp4a_gemv_is_catastrophic_through_the_recurrence`
  #               on lambda: cosine 0.466 down to -0.246 (the model pins the float
  #               GEMV for exactly this reason; the test is the standing falsifier)
  #   margin: 0.998971 - 0.99 = 0.008971 under the lower good floor; 0.99 - 0.466 = 0.524 over the bad ceiling
  qwen3.5-0.8b:
    compute_class: gpu
    min_cosine: 0.99
    basis: >-
      measured 2026-09-19 at apr 2bbce5be9 (cuda): known-good qwen3.5-0.8b-q4_k_m @ lambda 0.998971 x5 stdev 0
      and @ gx10 0.999176 x3 stdev 0; known-good qwen3.5-9b-q4_k_m @ lambda 0.999254 x5 and @ gx10 0.999351 x3; known-bad
      the DP4A GEMV through the recurrence (#3513) at cosine 0.466 to -0.246 on lambda
      (forward_qwen35_cuda_tests.rs, the standing falsifier). 0.99 separates them with 0.008971 margin
      under the lower good floor and 0.524 over the bad ceiling.
    n: 5
    measured_by: 'apr parity ./Qwen3.5-0.8B-Q4_K_M.gguf --prompt "$PROMPT" --json (scripts/check_model_parity.sh --manifest)'
  qwen3.5-9b:
    compute_class: gpu
    min_cosine: 0.99
    basis: >-
      measured 2026-09-19 at apr 2bbce5be9 (cuda): the same four known-good readings as qwen3.5-0.8b
      (lambda 0.999254 x5 stdev 0, gx10 0.999351 x3 for this model) against the same known-bad
      (DP4A through the recurrence, cosine 0.466 to -0.246); margin 0.009254 under the good floor.
    n: 5
    measured_by: 'apr parity ./Qwen3.5-9B-Q4_K_M.gguf --prompt "$PROMPT" --json (scripts/check_model_parity.sh --manifest)'
